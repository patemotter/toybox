<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wrecking Ball</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Construction">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
/* ---------- Standard app shell (common/toybox.css, tb-v2): header, stage, panel ----------
   The panel is one green Go ("Swing!") and the bottom bar (New, Surprise), built by the shared components in
   common/toybox.js. On the picture: tap anywhere and the ball swings into the building; drag the ball to pull it
   back (and up or down) and let go. The crane drives into range by itself. */
.tb-head a { text-decoration: none; }
.stage { background: #A9DCFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.count { font-variant-numeric: tabular-nums; }
.count.pop { animation: pop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
/* Play-timer gauge: the time-left badge, top-right of the stage. */
.fuel { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.fuel[hidden] { display: none; }
.fuel-bar { width: clamp(60px, 14vw, 140px); height: 18px; background: rgba(255, 255, 255, 0.8); border: 2px solid #1D2340; border-radius: 999px; overflow: hidden; }
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num { min-width: 40px; height: 40px; display: grid; place-items: center; background: #FFFFFF; color: #1D2340; border: 2px solid #1D2340; border-radius: 50%; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.fuel-num[hidden] { display: none; }
/* Big: the header and the bottom bar hide; Go stays (a tap on the picture swings too). */
body.big .tb-head > :not(.bigtoggle), body.big .tb-bottombar { display: none; }
body.ending .tb-panel, body.ending .homebtn, body.ending .mapbtn { pointer-events: none; opacity: 0.4; }
.rest-art { width: min(70vw, 300px, 40vh); aspect-ratio: 6 / 5; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
/* The Back button shows the site's picture (and its name on an iPad). */
.mapbtn .tb-mapic { width: 30px; height: 30px; background: #FFFFFF; border-radius: 8px; }
/* Phone held sideways: the coach line goes to the top, clear of the crane. */
@media (orientation: landscape) and (max-height: 520px) {
  #coach.tb-coach { top: 10px; bottom: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .count.pop { animation: none; }
}
</style>
</head>
<body>
<div class="tb-app-shell tb-v2 wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="mapbtn" href="./" aria-label="Back to the site"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><svg class="tb-mapic" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 34h30" stroke="#1D2340" stroke-width="3" stroke-linecap="round"/><path d="M13 34V7M13 8h22M13 8 6 14" fill="none" stroke="#1D2340" stroke-width="3.5" stroke-linejoin="round"/><path d="M13 33V8h21" fill="none" stroke="#FFC72C" stroke-width="1.6"/><path d="M29 8v11" stroke="#1D2340" stroke-width="2"/><rect x="25.5" y="19" width="7" height="6" fill="#F77F00" stroke="#1D2340" stroke-width="2"/></svg><span>Site</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Wrecking Ball</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A crane with a wrecking ball next to an old brick building. Tap to swing the ball, or drag the ball back and let go."></canvas>
      <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
      <div class="tb-counter count" id="count">Blocks down: 0</div>
      <div id="coach"></div>
    </main>
    <section class="tb-panel" id="panel">
      <div id="go"></div>
      <div id="bottom"></div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Safety gear check (once per visit, on the site map) ----------
  var gearOn = true;
  try { gearOn = sessionStorage.getItem("site-gear") === "on"; } catch (e) { gearOn = true; }
  if (!gearOn) { location.replace("./?next=wrecking-ball"); return; }

  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  var OUT = "#1D2340";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var STATEKEY = "site-wreck-v1";

  // ---------- World (units; y is up, ground at y = 0) ----------
  var WORLD_W = 1000, VIEW_UP = 690, VIEW_DOWN = 50, VIEW_SIDE = 40;
  var FOOT = { x: 212, y: 150 };          // boom foot pin
  var TIP0 = { x: 470, y: 620 };          // boom tip sheave (crane coords)
  var TIP = { x: 470, y: 620 };           // boom tip in the world (moves when the crane drives)
  var ROPE_MIN = 190, ROPE_MAX = 556;     // winch limits: ball high (top floors) .. ball just off the ground
  var DRIVE_V = 130;                      // drive speed (units per second)
  var CRANE_MIN = -130, CRANE_MAX = 190;  // how far the crane can drive back / toward the building
  var craneX = 0, craneV = 0, trackTravel = 0, drumA = 0;
  var driveDir = 0;                       // the crane drives into range by itself: -1 back / +1 toward the building
  var GANTRY = { x: 104, y: 292 };        // A-frame top (pendants run to the tip)
  var ROPE0 = 480;                        // cable length (ball rests at y = 140)
  var BALL_R = 46;
  var GRAV = 1500;
  var CW = 52, RH = 34;                   // brick block size

  var downCount = 0, styleIdx = 0;
  // Opened from the Toybox home screen: the counter and the first building start again.
  var startFresh = !!(window.Toybox && Toybox.fresh());
  if (!startFresh) try {
    var so = JSON.parse(localStorage.getItem(STATEKEY) || "null");
    if (so && typeof so.down === "number" && so.down >= 0) downCount = Math.floor(so.down);
    if (so && typeof so.style === "number") styleIdx = Math.abs(Math.floor(so.style)) % 4;
  } catch (e) { /* ignore */ }
  function saveState() { try { localStorage.setItem(STATEKEY, JSON.stringify({ down: downCount, style: styleIdx })); } catch (e) { /* ignore */ } }
  if (startFresh) saveState();

  // ======================================================================
  // Physics: boxes + one circle (the ball), sequential impulses with warm
  // starting (a small "Box2D-lite" style solver), island sleeping.
  // ======================================================================
  var bodies = [], nextId = 1;
  var arbs = {};
  var ITER = 10, H = 1 / 120, BETA = 0.2, SLOP = 0.6, MARGIN = 0.6;
  var SLEEP_V = 7, SLEEP_W = 0.09, SLEEP_T = 0.45;

  function makeBox(x, y, hw, hh, density, mu) {
    var m = density > 0 ? density * 4 * hw * hh : 0;
    var b = { id: nextId++, box: true, x: x, y: y, a: 0, vx: 0, vy: 0, w: 0, hw: hw, hh: hh, r: 0,
      invM: m > 0 ? 1 / m : 0, invI: m > 0 ? 12 / (m * (4 * hw * hw + 4 * hh * hh)) : 0, mu: mu,
      asleep: false, sleepT: 0, vx4: new Float64Array(8), nx4: new Float64Array(8), c: 1, s: 0, minx: 0, miny: 0, maxx: 0, maxy: 0 };
    geom(b);
    return b;
  }
  function geom(b) {
    if (!b.box) { b.minx = b.x - b.r; b.maxx = b.x + b.r; b.miny = b.y - b.r; b.maxy = b.y + b.r; return; }
    var c = Math.cos(b.a), s = Math.sin(b.a), hw = b.hw, hh = b.hh;
    b.c = c; b.s = s;
    var L = [-hw, -hh, hw, -hh, hw, hh, -hw, hh], N = [0, -1, 1, 0, 0, 1, -1, 0];
    var mnx = 1e9, mny = 1e9, mxx = -1e9, mxy = -1e9;
    for (var i = 0; i < 4; i++) {
      var lx = L[2 * i], ly = L[2 * i + 1];
      var wx = b.x + c * lx - s * ly, wy = b.y + s * lx + c * ly;
      b.vx4[2 * i] = wx; b.vx4[2 * i + 1] = wy;
      b.nx4[2 * i] = c * N[2 * i] - s * N[2 * i + 1]; b.nx4[2 * i + 1] = s * N[2 * i] + c * N[2 * i + 1];
      if (wx < mnx) mnx = wx; if (wx > mxx) mxx = wx; if (wy < mny) mny = wy; if (wy > mxy) mxy = wy;
    }
    b.minx = mnx; b.miny = mny; b.maxx = mxx; b.maxy = mxy;
  }
  function invM(b) { return b.asleep ? 0 : b.invM; }
  function invI(b) { return b.asleep ? 0 : b.invI; }

  // Max separation of B's vertices along A's face normals.
  var sepOut = { s: 0, e: 0 };
  function maxSep(A, B) {
    var best = -1e9, idx = 0;
    for (var i = 0; i < 4; i++) {
      var nx = A.nx4[2 * i], ny = A.nx4[2 * i + 1], px = A.vx4[2 * i], py = A.vx4[2 * i + 1];
      var mn = 1e9;
      for (var j = 0; j < 4; j++) { var d = nx * (B.vx4[2 * j] - px) + ny * (B.vx4[2 * j + 1] - py); if (d < mn) mn = d; }
      if (mn > best) { best = mn; idx = i; }
    }
    sepOut.s = best; sepOut.e = idx;
    return sepOut;
  }
  // Box vs box: reference face + clipped incident edge. Normal points from A to B.
  function collideBoxes(A, B) {
    var r1 = maxSep(A, B), sA = r1.s, eA = r1.e;
    if (sA > MARGIN) return null;
    var r2 = maxSep(B, A), sB = r2.s, eB = r2.e;
    if (sB > MARGIN) return null;
    var ref, inc, edge, flip;
    if (sB > sA * 0.98 + 0.05) { ref = B; inc = A; edge = eB; flip = 1; } else { ref = A; inc = B; edge = eA; flip = 0; }
    var nx = ref.nx4[2 * edge], ny = ref.nx4[2 * edge + 1];
    // incident edge: most anti-parallel normal
    var ie = 0, mind = 1e9;
    for (var i = 0; i < 4; i++) { var d = nx * inc.nx4[2 * i] + ny * inc.nx4[2 * i + 1]; if (d < mind) { mind = d; ie = i; } }
    var i2 = (ie + 1) % 4;
    var p = [[inc.vx4[2 * ie], inc.vx4[2 * ie + 1], 0], [inc.vx4[2 * i2], inc.vx4[2 * i2 + 1], 1]];
    var e2 = (edge + 1) % 4;
    var v1x = ref.vx4[2 * edge], v1y = ref.vx4[2 * edge + 1], v2x = ref.vx4[2 * e2], v2y = ref.vx4[2 * e2 + 1];
    var tx = v2x - v1x, ty = v2y - v1y, tl = Math.sqrt(tx * tx + ty * ty); tx /= tl; ty /= tl;
    p = clip(p, -tx, -ty, -(tx * v1x + ty * v1y), 2);
    if (!p) return null;
    p = clip(p, tx, ty, tx * v2x + ty * v2y, 3);
    if (!p) return null;
    var out = [];
    for (var k = 0; k < p.length; k++) {
      var sep = nx * (p[k][0] - v1x) + ny * (p[k][1] - v1y);
      if (sep <= MARGIN) {
        out.push({ px: p[k][0] - sep * nx * 0.5, py: p[k][1] - sep * ny * 0.5, nx: flip ? -nx : nx, ny: flip ? -ny : ny, sep: sep,
          id: flip * 1000 + edge * 100 + ie * 10 + p[k][2], Pn: 0, Pt: 0, fresh: true });
      }
    }
    return out.length ? out : null;
  }
  function clip(p, nx, ny, off, tag) {
    var d0 = nx * p[0][0] + ny * p[0][1] - off, d1 = nx * p[1][0] + ny * p[1][1] - off;
    var o = [];
    if (d0 <= 0) o.push(p[0]);
    if (d1 <= 0) o.push(p[1]);
    if (d0 * d1 < 0) {
      var t = d0 / (d0 - d1);
      o.push([p[0][0] + t * (p[1][0] - p[0][0]), p[0][1] + t * (p[1][1] - p[0][1]), tag]);
    }
    return o.length === 2 ? o : (o.length === 1 ? [o[0], o[0]] : null);
  }
  // Box A vs circle B. Normal from A to B.
  function collideBoxCircle(A, B) {
    var dx = B.x - A.x, dy = B.y - A.y;
    var lx = A.c * dx + A.s * dy, ly = -A.s * dx + A.c * dy;
    var cx = clamp(lx, -A.hw, A.hw), cy = clamp(ly, -A.hh, A.hh);
    var nlx, nly, sep;
    if (cx === lx && cy === ly) {
      var ox = A.hw - Math.abs(lx), oy = A.hh - Math.abs(ly);
      if (ox < oy) { nlx = lx < 0 ? -1 : 1; nly = 0; cx = nlx * A.hw; sep = -ox - B.r; }
      else { nlx = 0; nly = ly < 0 ? -1 : 1; cy = nly * A.hh; sep = -oy - B.r; }
    } else {
      var ddx = lx - cx, ddy = ly - cy, dist = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dist - B.r > MARGIN) return null;
      nlx = ddx / dist; nly = ddy / dist; sep = dist - B.r;
    }
    var nx = A.c * nlx - A.s * nly, ny = A.s * nlx + A.c * nly;
    var px = A.x + A.c * cx - A.s * cy, py = A.y + A.s * cx + A.c * cy;
    return [{ px: px, py: py, nx: nx, ny: ny, sep: sep, id: 7, Pn: 0, Pt: 0, fresh: true }];
  }
  function collide(A, B) {
    if (A.box && B.box) return collideBoxes(A, B);
    if (A.box) return collideBoxCircle(A, B);
    return null;
  }

  var impacts = [];
  function preStep(arb, invDt) {
    var A = arb.a, B = arb.b, mA = invM(A), mB = invM(B), iA = invI(A), iB = invI(B);
    for (var k = 0; k < arb.cs.length; k++) {
      var c = arb.cs[k];
      var r1x = c.px - A.x, r1y = c.py - A.y, r2x = c.px - B.x, r2y = c.py - B.y;
      c.r1x = r1x; c.r1y = r1y; c.r2x = r2x; c.r2y = r2y;
      var rn1 = r1x * c.nx + r1y * c.ny, rn2 = r2x * c.nx + r2y * c.ny;
      var kN = mA + mB + iA * (r1x * r1x + r1y * r1y - rn1 * rn1) + iB * (r2x * r2x + r2y * r2y - rn2 * rn2);
      c.mn = kN > 0 ? 1 / kN : 0;
      var tx = c.ny, ty = -c.nx;
      var rt1 = r1x * tx + r1y * ty, rt2 = r2x * tx + r2y * ty;
      var kT = mA + mB + iA * (r1x * r1x + r1y * r1y - rt1 * rt1) + iB * (r2x * r2x + r2y * r2y - rt2 * rt2);
      c.mt = kT > 0 ? 1 / kT : 0;
      c.bias = Math.min(240, -BETA * invDt * Math.min(0, c.sep + SLOP));
      if (c.fresh) {
        var dvx = B.vx - B.w * r2y - A.vx + A.w * r1y, dvy = B.vy + B.w * r2x - A.vy - A.w * r1x;
        var vn = dvx * c.nx + dvy * c.ny;
        if (vn < -160) impacts.push({ x: c.px, y: c.py, v: -vn, a: A, b: B });
        c.fresh = false;
      }
      // warm start
      var Px = c.Pn * c.nx + c.Pt * tx, Py = c.Pn * c.ny + c.Pt * ty;
      A.vx -= mA * Px; A.vy -= mA * Py; A.w -= iA * (r1x * Py - r1y * Px);
      B.vx += mB * Px; B.vy += mB * Py; B.w += iB * (r2x * Py - r2y * Px);
    }
  }
  function applyImpulse(arb) {
    var A = arb.a, B = arb.b, mA = invM(A), mB = invM(B), iA = invI(A), iB = invI(B), mu = arb.mu;
    for (var k = 0; k < arb.cs.length; k++) {
      var c = arb.cs[k], r1x = c.r1x, r1y = c.r1y, r2x = c.r2x, r2y = c.r2y;
      var dvx = B.vx - B.w * r2y - A.vx + A.w * r1y, dvy = B.vy + B.w * r2x - A.vy - A.w * r1x;
      var vn = dvx * c.nx + dvy * c.ny;
      var dPn = c.mn * (-vn + c.bias);
      var P0 = c.Pn; c.Pn = Math.max(P0 + dPn, 0); dPn = c.Pn - P0;
      var Px = dPn * c.nx, Py = dPn * c.ny;
      A.vx -= mA * Px; A.vy -= mA * Py; A.w -= iA * (r1x * Py - r1y * Px);
      B.vx += mB * Px; B.vy += mB * Py; B.w += iB * (r2x * Py - r2y * Px);
      dvx = B.vx - B.w * r2y - A.vx + A.w * r1y; dvy = B.vy + B.w * r2x - A.vy - A.w * r1x;
      var tx = c.ny, ty = -c.nx, vt = dvx * tx + dvy * ty;
      var dPt = c.mt * -vt, maxPt = mu * c.Pn;
      var T0 = c.Pt; c.Pt = clamp(T0 + dPt, -maxPt, maxPt); dPt = c.Pt - T0;
      Px = dPt * tx; Py = dPt * ty;
      A.vx -= mA * Px; A.vy -= mA * Py; A.w -= iA * (r1x * Py - r1y * Px);
      B.vx += mB * Px; B.vy += mB * Py; B.w += iB * (r2x * Py - r2y * Px);
    }
  }

  // ---------- Scene bodies ----------
  var ground = makeBox(500, -1000, 6000, 1000, 0, 0.85);
  ground.kind = "ground";
  var ball = { id: nextId++, box: false, x: TIP.x, y: TIP.y - ROPE0, a: 0, vx: 0, vy: 0, w: 0, r: BALL_R, hw: BALL_R, hh: BALL_R,
    invM: 1 / 42000, invI: 0, mu: 0.3, asleep: false, sleepT: 0, kind: "ball", minx: 0, miny: 0, maxx: 0, maxy: 0, c: 1, s: 0 };
  geom(ball);
  var rope = ROPE0, ropeTarget = ROPE0;
  var blocks = [];        // dynamic boxes of the building

  function rebuildBodies() { bodies = [ground, ball].concat(blocks.filter(function (b) { return b.placed; })); }

  function physicsStep(h) {
    var invDt = 1 / h, i, j, n = bodies.length;
    // Contacts
    var nb = {};
    for (i = 0; i < n; i++) {
      var A = bodies[i];
      for (j = i + 1; j < n; j++) {
        var B = bodies[j];
        var aStill = A.invM === 0 || A.asleep, bStill = B.invM === 0 || B.asleep;
        if (aStill && bStill) {
          if (A.invM !== 0 || B.invM !== 0) { var kk = A.id < B.id ? A.id + "_" + B.id : B.id + "_" + A.id; if (arbs[kk]) nb[kk] = arbs[kk]; }
          continue;
        }
        if (A.maxx + MARGIN < B.minx || B.maxx + MARGIN < A.minx || A.maxy + MARGIN < B.miny || B.maxy + MARGIN < A.miny) continue;
        var X = A, Y = B;
        if (!X.box) { X = B; Y = A; } // circle second
        var cs = collide(X, Y);
        if (!cs) continue;
        var key = X.id < Y.id ? X.id + "_" + Y.id : Y.id + "_" + X.id;

    o += '<circle cx="200" cy="34" r="16" fill="#FFF4CC" stroke="#1D2340" stroke-width="2.5"/><circle cx="207" cy="29" r="14" fill="#2B3A67"/>';
    o += '<circle cx="150" cy="24" r="2" fill="#FFF"/><circle cx="120" cy="50" r="1.6" fill="#FFF"/><circle cx="226" cy="70" r="1.6" fill="#FFF"/><circle cx="90" cy="20" r="2" fill="#FFF"/>';
    o += '<rect y="160" width="240" height="40" fill="#8C5A2E"/><path d="M0 160 H240" stroke="#1D2340" stroke-width="3"/>';
    o += '<g stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">';
    // a pile of blocks on the right
    o += '<rect x="176" y="146" width="22" height="14" fill="#C8553D"/><rect x="198" y="146" width="22" height="14" fill="#C8553D"/><rect x="188" y="132" width="22" height="14" fill="#C8553D"/><rect x="214" y="138" width="20" height="8" fill="#9AA3B2" transform="rotate(-12 224 142)"/>';
    // crawler crane: boom, pendant, cable, ball resting on the ground
    o += '<path d="M64 112 L136 34" stroke="#1D2340" stroke-width="11"/><path d="M64 112 L136 34" stroke="#FFC72C" stroke-width="6"/>';
    o += '<path d="M30 92 L136 34" stroke="#3A4150" stroke-width="1.6" fill="none"/><path d="M136 34 L146 136" stroke="#8A93A6" stroke-width="2" fill="none"/>';
    o += '<circle cx="146" cy="147" r="13" fill="#4A5263"/>';
    o += '<rect x="10" y="140" width="96" height="20" rx="10" fill="#2B2F3A"/><path d="M14 104 H86 V140 H14 Z" fill="#FFC72C"/><path d="M70 104 V82 H90 L92 140 H86" fill="#FFC72C"/><path d="M74 88 H87 V104 H74 Z" fill="#9FD6F5"/><path d="M30 104 L30 92" stroke-width="4"/>';
    o += '<circle cx="136" cy="34" r="4" fill="#6B7385"/></g>';
    o += '<text x="40" y="78" font-family="Baloo 2, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">z</text><text x="52" y="64" font-family="Baloo 2, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">z</text><text x="62" y="52" font-family="Baloo 2, sans-serif" font-weight="800" font-size="9" fill="#FFFFFF">z</text>';
    return o;
  }
  function restArt() { return '<svg class="rest-art" viewBox="0 0 240 200" aria-hidden="true">' + restSVG() + "</svg>"; }
  function onRest() {
    ending = false; parking = false; endingDone = null;
    rope = ropeTarget = TIP.y - BALL_R + 30; ball.y = BALL_R;
  }
  function onWake() { ending = false; parking = false; endingDone = null; ropeTarget = ROPE0; coach.step(allFlat ? "Tap New!" : "Swing the ball!"); }

  // Big mode: the header shrinks to the Big button; the panel stays (it drives the crane).
  function onBig(on) {
    resize();
  }

  // ---------- Loop ----------
  var lastT = 0;
  function loop(t) {
    var dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0.016;
    lastT = t;
    var phase = Toybox.timer.phase();
    if (phase !== "resting") step(dt);
    if (phase === "ending") endingFrame();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Start ----------
  resize();
  newBuilding(true);
  showCount(false);
  // ---------- Surprise: a fun moment on this scene, taking turns ----------
  // The wrecking ball gets a happy face (it blinks and looks at the building); pigeons on the roof flap off.
  var surprise = null, surpriseTurn = 0, birds = [];
  function doSurprise() {
    if (ending) return;
    if (surpriseTurn++ % 2 === 0) { surprise = { kind: "face", t: 0, dur: 5.5 }; reel(); return; }
    // Pigeons land on the roof of what is still standing (or fly in over the site), sit a moment, then flap away.
    var top = -1, tx = 760;
    blocks.forEach(function (b) { if (b.placed && b.y + b.hh > top) { top = b.y + b.hh; tx = b.x; } });
    if (top < 40) top = 40;
    for (var i = 0; i < 5; i++) birds.push({ x: tx + (i - 2) * 30 + rand(-6, 6), y: top + 12, vx: 0, vy: 0, sit: 0.9 + i * 0.25, dir: Math.random() < 0.5 ? -1 : 1, flap: rand(0, 6), drop: 260 + i * 30 });
    whoosh();
  }
  function stepSurprise(dt) {
    if (surprise) { surprise.t += dt; if (surprise.t > surprise.dur) surprise = null; }
    for (var i = birds.length - 1; i >= 0; i--) {
      var bd = birds[i];
      bd.flap += dt * (bd.sit > 0 && bd.drop <= 0 ? 4 : 16);
      if (bd.drop > 0) { bd.drop = Math.max(0, bd.drop - 420 * dt); continue; } // gliding down onto the roof
      if (bd.sit > 0) { bd.sit -= dt; if (bd.sit <= 0) { bd.vx = bd.dir * rand(110, 170); bd.vy = rand(150, 220); clack(0.3); } continue; }
      bd.x += bd.vx * dt; bd.y += bd.vy * dt; bd.vy += 20 * dt;
      if (bd.y > VIEW_UP + 120 || bd.x < visLeft() - 80 || bd.x > visRight() + 80) birds.splice(i, 1);
    }
  }
  function drawBirds() {
    birds.forEach(function (bd) {
      var flying = bd.sit <= 0 || bd.drop > 0, f = flying ? Math.sin(bd.flap) : 0, d = bd.sit > 0 && bd.drop <= 0 ? 1 : (bd.vx < 0 ? -1 : 1);
      ctx.save(); ctx.translate(bd.x, bd.y + bd.drop); ctx.scale(d, 1);
      ctx.beginPath(); ctx.ellipse(0, 10, 15, 10, 0, 0, Math.PI * 2); ctx.fillStyle = "#9AA3B2"; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke();
      circle(13, 21, 7, "#7E8798", 3);
      circle(15, 23, 1.8, OUT, 0);
      shape([[19, 22], [26, 20], [19, 18]], "#F77F00", 2);
      shape([[-4, 14], [-16, 14 + f * 16 + (flying ? 8 : 0)], [8, 16]], "#B9C1CE", 2.5);
      if (!flying) { line(-2, 0, -2, -6, 2.5, "#F77F00"); line(4, 0, 4, -6, 2.5, "#F77F00"); }
      ctx.restore();
    });
  }
  function drawBallFace() {
    var t = surprise.t, k = Math.min(1, t / 0.3, (surprise.dur - t) / 0.3);
    if (k <= 0) return;
    var blink = (performance.now() % 2400) < 150, r = BALL_R, look = 0.12 * r;
    ctx.save(); ctx.translate(ball.x, ball.y); ctx.scale(k, k);
    [-1, 1].forEach(function (sd) {
      if (blink) { line(sd * 15 - 7, 10, sd * 15 + 7, 10, 4, "#FFFFFF"); return; }
      circle(sd * 15, 10, 11, "#FFFFFF", 3.5);
      circle(sd * 15 + look * 0.5, 10, 5, OUT, 0);
    });
    ctx.globalAlpha = 0.6; circle(-30, -4, 6, "#FF8FA3", 0); circle(30, -4, 6, "#FF8FA3", 0); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(0, -2, 20, Math.PI * 1.15, Math.PI * 1.85); ctx.lineWidth = 6; ctx.strokeStyle = OUT; ctx.lineCap = "round"; ctx.stroke();
    ctx.lineWidth = 3; ctx.strokeStyle = "#FFFFFF"; ctx.stroke();
    ctx.restore();
  }

  // ---------- Panel: Go "Swing!", then New and Surprise ----------
  var PIC_SWING = '<svg viewBox="0 0 48 48"><path d="M8 6 C10 26 22 36 36 34" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>' +
    '<path d="M24 4 L33 25" stroke="#1D2340" stroke-width="3"/><circle cx="35" cy="31" r="10" fill="#3A4150" stroke="#1D2340" stroke-width="2.5"/><circle cx="31.5" cy="27.5" r="3" fill="#9AA3B2"/></svg>';
  var go = Toybox.go($("go"), {
    label: "Swing!", icon: PIC_SWING,
    onPress: function () {
      if (ending) return false;
      if (ghost) ghost.learned("go");
      swing();
    }
  });
  var bar = Toybox.bar($("bottom"), {
    onNew: function () { if (ending) return; autoPull = null; newBuilding(false); chime(); if (ghost) { ghost.learned("new"); ghost.again("swing"); } },
    onSurprise: doSurprise
  });
  coach = Toybox.coach($("coach"));
  coach.step("Swing the ball!");

  // ---------- Idle help (Toybox.ghost): tap to swing first, the drag once he has used the tap; New when it is all down ----------
  var ghost = Toybox.ghost({
    max: 3,
    onShow: function (p, on) { go.pulse(on); },
    plan: function () {
      if (ending || drag || autoPull) return null;
      if (allFlat) { var nb = bar.newBtn.getBoundingClientRect(); return { pts: [[nb.left + nb.width / 2, nb.top + nb.height / 2]], tap: true, key: "new" }; }
      if (ballSpeed() > 150 || Math.abs(ball.x - TIP.x) > 60) return null;
      var r = cv.getBoundingClientRect();
      function sc(x, y) { return [r.left + OX + x * S, r.top + OY - y * S]; }
      var face = 700;
      blocks.forEach(function (b) { if (b.placed && !b.counted) face = Math.min(face, b.x); });
      if (!usedTap) return { pts: [sc(face + 20, 160)], tap: true, key: "swing" };
      return { pts: [sc(ball.x, ball.y), sc(ball.x - 260, ball.y + 140)], key: "drag" };
    }
  });

  Toybox.init({
    app: "construction-site",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the crane lowers its ball to the ground and rests, and the buttons lock. The timer carries on across the site pages.",
    goodbyeOption: "End with a “Park it” button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Park it",
    farewellDone: "Bye bye, crane!",
    restLine: "The site is resting.",
    restLine2: "The machines will be right here next time.",
    restArt: restArt,
    soundNote: "Soft booms and clacks. Hold for 2 seconds.",
    legacy: { timer: "site-timer-v1", sound: "site-sound-v1", big: "site-big-v1" },
    onEnding: onEnding,
    onGoodbye: goodbyePark,
    onRest: onRest,
    onWake: onWake,
    onBig: onBig,
    onSound: function (on) { if (on) chime(); },
    onTimer: drawTimer
  });
  requestAnimationFrame(loop);

  // Test hook, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) window.__wreck = {
    state: function () {
      var awake = 0; blocks.forEach(function (b) { if (b.placed && !b.asleep) awake++; });
      return { coach: coach.text(), go: go.label(), allFlat: allFlat, autoPull: !!autoPull, surprise: surprise ? surprise.kind : "", birds: birds.length, ropeTarget: Math.round(ropeTarget),
        ball: { x: Math.round(ball.x), y: Math.round(ball.y), v: Math.round(ballSpeed()) }, blocks: blocks.length, awake: awake, down: downCount, dust: dust.length, bits: bits.length, building: building.on, rope: Math.round(rope), craneX: Math.round(craneX), drum: drumA, tip: Math.round(TIP.x) };
    },
    toScreen: function (x, y) { var r = cv.getBoundingClientRect(); return { x: r.left + OX + x * S, y: r.top + OY - y * S }; },
    ballScreen: function () { var r = cv.getBoundingClientRect(); return { x: r.left + OX + ball.x * S, y: r.top + OY - ball.y * S }; },
    wakeAll: function () { blocks.forEach(function (b) { b.asleep = false; b.sleepT = 0; }); },
    ghost: function () { return ghost.show(); },
    maxDrift: function () { var m = 0; blocks.forEach(function (b) { m = Math.max(m, Math.abs(b.x - b.x0) + Math.abs(b.y - b.y0) + Math.abs(b.a) * 30); }); return m; }
  };
})();
</script>
