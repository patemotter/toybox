<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forklift</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }
.stage { background: #A9DCFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv.grabbing { cursor: grabbing; }
.count { font-variant-numeric: tabular-nums; }
.count.pop { animation: pop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
/* The hint is the coach line (tb-coach). */
.hint { background: var(--accent); }
.hint[hidden] { display: none; }
.hint.go { animation: hintPop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hintPop { 0% { transform: translateX(-50%) scale(0.3); } 100% { transform: translateX(-50%) scale(1); } }

/* Play-timer gauge: the time-left badge, top-right of the stage. */
.fuel { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.fuel[hidden] { display: none; }
.fuel-bar { width: clamp(60px, 14vw, 140px); height: 18px; background: rgba(255, 255, 255, 0.8); border: 3px solid #1D2340; border-radius: 999px; overflow: hidden; }
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num { min-width: 40px; height: 40px; display: grid; place-items: center; background: #FFFFFF; color: #1D2340; border: 3px solid #1D2340; border-radius: 50%; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.fuel-num[hidden] { display: none; }

/* Big: full-screen play. Dragging the forks is the play, so the panel goes too. */
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel { display: none; }

/* ---------- Panel: Move it! (Go row), New wall and Surprise (tab bar) ---------- */
.act { display: flex; align-items: center; justify-content: center; gap: 8px; }
.act svg { width: 40px; height: 40px; flex: none; pointer-events: none; }
.act span { pointer-events: none; }
.tb-go.act svg { width: 56px; height: 46px; }
.tb-tabs .act svg { width: 30px; height: 30px; }
.wiggle { animation: wiggle 0.7s ease-in-out 2; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg) scale(1.05); } 75% { transform: rotate(4deg) scale(1.05); } }
body.ending .tb-panel, body.ending .homebtn, body.ending .mapbtn { pointer-events: none; opacity: 0.4; }

/* ---------- Timer (sheet, toast, banner and rest screen come from common/toybox.css) ---------- */
.rest-art { width: min(70vw, 300px, 40vh); aspect-ratio: 6 / 5; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }

/* Ghost hand: a see-through hand that shows the main move once (master copy: tools/snippets/ghost-hand.css). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }

@media (max-width: 600px) {
  .tb-go.act svg { width: 46px; height: 38px; }
  .hint { white-space: normal; line-height: 1.15; }
}
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(22%, 220px); }
  .tb-go.act { flex: 0 1 200px; min-height: 120px; flex-direction: column; gap: 2px; }
  .tb-go.act svg { width: 80px; height: 66px; }
  .tb-tabs { margin-top: auto; flex-direction: column; }
  .tb-tabs .btn { min-height: 60px; white-space: normal; line-height: 1.05; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: 150px; padding: 6px; gap: 6px; }
  .tb-go.act { flex: 1 1 auto; min-height: 0; max-height: 150px; }
  .tb-go.act svg { width: 56px; height: 46px; }
  .tb-tabs { gap: 8px; }
  .tb-tabs .btn { min-height: 50px; }
}
@media (prefers-reduced-motion: reduce) {
  .hint.go, .count.pop, .wiggle { animation: none; }
}
</style>
</head>
<body>
<div class="tb-app-shell wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="mapbtn" href="./" aria-label="Back to all machines"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>All machines</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Forklift</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls">Big</button>
  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A forklift unloading pallets from a delivery truck and lifting them up to a scaffold where a bricklayer builds a wall"></canvas>
      <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
      <div class="tb-counter count" id="count">Pallets: 0</div>
      <div class="tb-coach hint" id="hint" hidden></div>
    </main>
    <section class="tb-panel" id="panel">
      <button class="btn tb-go act" id="goBtn" aria-label="Move it! The forklift moves the next pallet"><svg viewBox="0 0 60 48" aria-hidden="true"><g stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"><rect x="3" y="20" width="10" height="18" rx="4" fill="#4A5066"/><path d="M11 38 V22 H22 V26 H34 L37 30 V38 Z" fill="#FFC93C"/><path d="M14 22 V7 M33 26 L31 7" fill="none" stroke-width="3"/><rect x="11" y="4" width="24" height="5" rx="1.5" fill="#3A4150"/><rect x="37" y="8" width="4" height="32" fill="#5B6476"/><rect x="41" y="14" width="3" height="20" fill="#4A5066"/><path d="M43 34 H58 V36.5 L55 38 H43 Z" fill="#3A4150"/><rect x="44" y="28" width="14" height="5" fill="#B5793A"/><rect x="45" y="15" width="12" height="13" fill="#C8553D"/><path d="M45 19.5 H57 M45 24 H57 M51 15 V19.5 M48 19.5 V24 M54 19.5 V24" fill="none" stroke="#E9B9A8" stroke-width="1.4"/><circle cx="10" cy="40" r="5.5" fill="#2F3447"/><circle cx="31" cy="39" r="7" fill="#2F3447"/><circle cx="31" cy="39" r="2.5" fill="#C9D3E0" stroke-width="1.5"/></g></svg><span>Move it!</span></button>
      <nav class="tb-tabs" id="acts">
        <button class="btn tb-new act" id="newBtn"><svg viewBox="0 0 48 48" aria-hidden="true"><g stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"><rect x="5" y="36" width="38" height="7" fill="#B8BEC8"/><rect x="7" y="27" width="16" height="9" fill="#C8553D"/><rect x="23" y="27" width="16" height="9" fill="#C8553D"/><rect x="13" y="18" width="16" height="9" fill="#C8553D"/><rect x="29" y="18" width="10" height="9" fill="#C8553D"/><path d="M9 8 L19 18 L17 20 L7 10 Z" fill="#9AA5B1"/><path d="M5 6 L11 4 L13 10 Z" fill="#B5793A"/></g></svg><span>New wall</span></button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Safety gear check (once per visit, on the site map) ----------
  var gearOn = true;
  try { gearOn = sessionStorage.getItem("site-gear") === "on"; } catch (e) { gearOn = true; }
  if (!gearOn) { location.replace("./?next=forklift"); return; }

  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function sgn(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
  function ease(t) { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  var OUT = "#1D2340";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var STATEKEY = "site-forklift-v1";

  // ---------- World (units; y is up, ground at y = 0) ----------
  // Left to right: the truck bay, the yard with three lay-down spots, the scaffold and the house wall.
  var WORLD_L = -30, WORLD_R = 1650, VIEW_UP = 505, VIEW_DOWN = 30, MINW = 520;
  var FORK = 100, BACK = 238, MID = 118, PW = 110, HALF = 55, PH = 14, SLOT = 3, TRAVEL = 14, H_MAX = 360;
  var OUTER_TOP = 228, CARR_H = 52, FREE = 166;       // free lift: the carriage rises inside the mast first
  var LOADC = 56;                                      // fork carriage to the middle of a pallet on the forks
  var TR_X = 440, TB = 100, TS = 390;                  // truck bed rear end, bed top, stack spot
  var YARD = [640, 775, 910], SNAP = 66;
  var SC_L = 1140, SC_R = 1330, LOW = 130, HIGH = 280, LC = 1190;
  var WALL_L = 1345, WALL_R = 1585, ROW_H = 40, FOUND = 12, ROWS = 8;
  var XMIN = TR_X + 4, XMAX = SC_L - 4;                 // the forklift's body stays between these
  var LOADH = { bricks: 54, blocks: 54, lumber: 46, pipes: 48 };
  var KINDS = ["bricks", "blocks", "lumber", "pipes", "empties"];
  var DRIVE = 230, INCH = 75, ACC = 420, LIFT = 130, HACC = 520;
  var A_DRIVE = 165, A_LIFT = 100;

  // ---------- State ----------
  var objs = [];               // pallets lying somewhere: { k, n, x, y, tr (on the truck, x relative to it) }
  var rows = 0, wallDone = false, count = 0, trucks = 0;
  var F = { x: 600, dir: -1, vx: 0, h: TRAVEL, vh: 0, tilt: 0, load: null, engaged: null, slide: null, turn: null,
    wheel: 0, odo: 0, parked: false, assist: null, wave: -9, waveArm: -9 };
  var truck = { state: "arrive", off: -760, t: 0, ready: 0, toot: -9 };
  var clock = 0;

  function objH(o) { return o.k === "empties" ? o.n * PH : PH + LOADH[o.k]; }
  function isFull(o) { return o.k !== "empties"; }
  function wallKind(o) { return o.k === "bricks" || o.k === "blocks"; }
  function wx(o) { return o.tr ? o.x + truck.off : o.x; }
  function topOf(o) { return o.y + objH(o); }
  function onDeck(o) { return !o.tr && o.x > SC_L - 30 && o.y >= LOW - 1; }
  function isYard(o) { return !o.tr && !onDeck(o); }
  function truckHere() { return truck.state !== "away"; }
  function overlapX(a0, a1, b0, b1, m) { return a1 > b0 + (m || 0) && a0 < b1 - (m || 0); }
  function hasOnTop(o) {
    var t = topOf(o), x = wx(o);
    for (var i = 0; i < objs.length; i++) { var p = objs[i]; if (p !== o && Math.abs(p.y - t) < 1 && Math.abs(wx(p) - x) < PW - 10) return true; }
    return false;
  }
  function reachable(o) { return !o.busy && !hasOnTop(o) && (!o.tr || truck.state === "parked"); }
  function wallTop() { return FOUND + rows * ROW_H; }

  // ---------- Saved state (a reload keeps it; a fresh visit from the home screen starts a new wall) ----------
  function saveState() {
    try {
      localStorage.setItem(STATEKEY, JSON.stringify({
        v: 1, rows: rows, done: wallDone, count: count, trucks: trucks, truck: truck.state === "parked" ? "here" : "away",
        objs: objs.map(function (o) { return { k: o.k, n: o.n, x: Math.round(o.x), y: Math.round(o.y), tr: !!o.tr }; }),
        load: F.load ? { k: F.load.k, n: F.load.n } : null,
        f: { x: Math.round(F.x), dir: F.dir, h: Math.round(F.h) }
      }));
    } catch (e) { /* ignore */ }
  }
  function okNum(v) { return typeof v === "number" && isFinite(v); }
  function loadState() {
    var so = null;
    try { so = JSON.parse(localStorage.getItem(STATEKEY) || "null"); } catch (e) { so = null; }
    if (!so || typeof so !== "object" || so.v !== 1) return false;
    try {
      rows = okNum(so.rows) ? clamp(Math.floor(so.rows), 0, ROWS) : 0;
      wallDone = !!so.done && rows >= ROWS;
      count = okNum(so.count) ? Math.max(0, Math.floor(so.count)) : 0;
      trucks = okNum(so.trucks) ? Math.max(0, Math.floor(so.trucks)) : 0;
      var here = so.truck === "here";
      objs = [];
      (Array.isArray(so.objs) ? so.objs : []).forEach(function (q) {
        if (!q || KINDS.indexOf(q.k) < 0 || !okNum(q.x) || !okNum(q.y)) return;
        if (q.tr && !here) return;
        objs.push({ k: q.k, n: q.k === "empties" ? clamp(Math.floor(q.n) || 1, 1, 8) : 1, x: clamp(q.x, -100, WORLD_R), y: clamp(q.y, 0, 500), tr: !!q.tr });
      });
      if (so.load && KINDS.indexOf(so.load.k) >= 0) F.load = { k: so.load.k, n: so.load.k === "empties" ? clamp(Math.floor(so.load.n) || 1, 1, 8) : 1 };
      if (so.f && okNum(so.f.x) && okNum(so.f.h)) {
        F.dir = so.f.dir === 1 ? 1 : -1;
        F.x = clampBody(so.f.x, F.dir);
        F.h = clamp(so.f.h, 0, H_MAX);
      }
      if (here) { truck.state = "parked"; truck.off = 0; }
      else newTruck();
      if (rows >= ROWS) { roof.t = -99; }
      return true;
    } catch (e) { return false; }
  }

  // ---------- The delivery truck ----------
  function countWallPallets() {
    var c = 0;
    objs.forEach(function (o) { if (wallKind(o)) c++; });
    if (F.load && wallKind(F.load)) c++;
    return c;
  }
  function yardRoom() {
    var free = 0;
    YARD.forEach(function (x) { free += 2 - yardStack(x).length; });
    return free;
  }
  function makeTruckLoad() {
    var have = countWallPallets(), need = Math.max(0, ROWS - rows - have), list = [];
    if (yardRoom() > 0 && (need < 3 || trucks % 2 === 0)) list.push(trucks % 2 ? "pipes" : "lumber");
    var idx = rows + have;
    while (list.length < 3 && need > 0) { list.push(idx < 4 ? "blocks" : "bricks"); idx++; need--; }
    if (!list.length) list.push(trucks % 2 ? "pipes" : "lumber");
    var y = TB;
    list.forEach(function (k) { var o = { k: k, n: 1, x: TS, y: y, tr: true }; objs.push(o); y += objH(o); });
  }
  function newTruck() {
    objs = objs.filter(function (o) { return !o.tr; });
    truck.state = "arrive"; truck.off = -760; truck.t = 0; truck.ready = 0;
    makeTruckLoad();
  }
  function truckFull() { for (var i = 0; i < objs.length; i++) if (objs[i].tr && isFull(objs[i])) return true; return false; }
  function truckEmpties() { for (var i = 0; i < objs.length; i++) if (objs[i].tr && !isFull(objs[i])) return true; return false; }
  function deckEmpties() { for (var i = 0; i < objs.length; i++) if (onDeck(objs[i]) && !isFull(objs[i])) return objs[i]; return null; }
  function truckCanGo() {
    if (truck.state !== "parked" || ending) return false;
    if (truckFull()) return false;
    if (F.engaged && F.engaged.tr) return false;
    if (F.load && (F.load.k === "empties" || loadOverTruck())) return false;
    if (deckEmpties()) return false;
    if (bl.job) return false;
    if (rows < ROWS) for (var i = 0; i < objs.length; i++) if (onDeck(objs[i]) && wallKind(objs[i])) return false;
    return true;
  }
  function loadOverTruck() { var c = F.x + F.dir * LOADC; return c - HALF < TR_X + truck.off + 10; }
  function stepTruck(dt) {
    truck.t += dt;
    if (truck.state === "arrive") {
      var u = clamp(truck.t / 4.5, 0, 1);
      truck.off = -760 * (1 - ease(u));
      if (u >= 1) { truck.state = "parked"; truck.off = 0; hiss(); puff(TR_X - 20, 4, 0.6, 1); saveState(); }
    } else if (truck.state === "parked") {
      truck.ready = truckCanGo() ? truck.ready + dt : 0;
      if (truck.ready > 1.4) {
        var loaded = truckEmpties();
        truck.state = "leave"; truck.t = 0; truck.toot = clock;
        toot(); rings.push({ x: 40, y: 150, t: 0, tr: true, big: 1 });
        if (loaded) flashCoach("Truck loaded!", 3200);
        trucks++;
        if (Toybox.kind) setTimeout(function () { Toybox.kind(); }, 2600);
      }
    } else if (truck.state === "leave") {
      var v = clamp(truck.t / 3.6, 0, 1);
      truck.off = -900 * v * v;
      if (v >= 1) { truck.state = "away"; truck.t = 0; objs = objs.filter(function (o) { return !o.tr; }); saveState(); }
    } else if (truck.state === "away") {
      if (truck.t > 3) { newTruck(); flashCoach("Here comes the next truck!", 3500); saveState(); }
    }
  }

  // ---------- Places and what can go where ----------
  // The highest surface under [x0, x1] at or below the height yb: ground, truck bed, scaffold decks, pallets.
  function supportAt(x0, x1, yb, skip) {
    var s = 0;
    function cons(a0, a1, t) { if (overlapX(x0, x1, a0, a1, 6) && t <= yb + 0.5 && t > s) s = t; }
    if (truckHere()) cons(150 + truck.off, TR_X + truck.off, TB);
    cons(SC_L, SC_R, LOW); cons(SC_L, SC_R, HIGH);
    var c = (x0 + x1) / 2;
    for (var i = 0; i < objs.length; i++) {
      var o = objs[i];
      if (o === skip) continue;
      // A yard pallet only holds a load squared up on it (otherwise the load passes in front of it).
      if (isYard(o) && Math.abs(wx(o) - c) > 25) continue;
      cons(wx(o) - HALF, wx(o) + HALF, topOf(o));
    }
    return s;
  }
  function underAt(x0, x1, t) {
    var out = [];
    objs.forEach(function (o) { if (Math.abs(topOf(o) - t) < 1 && overlapX(x0, x1, wx(o) - HALF, wx(o) + HALF, 6)) out.push(o); });
    return out;
  }
  // The stack of pallets on one spot, from the bottom up.
  function stackFrom(x, base) {
    var out = [], t = base, guard = 0;
    while (guard++ < 10) {
      var f = null;
      for (var i = 0; i < objs.length; i++) { var o = objs[i]; if (Math.abs(o.y - t) < 1 && Math.abs(wx(o) - x) < 40) { f = o; break; } }
      if (!f) break;
      out.push(f); t = topOf(f);
    }
    return out;
  }
  function stackTop(x, base) { var s = stackFrom(x, base); return s.length ? topOf(s[s.length - 1]) : base; }
  function yardStack(x) { return stackFrom(x, 0); }
  function placeOk(load, c, sup) {
    if (ending) return true;
    var under = underAt(c - HALF, c + HALF, sup);
    for (var i = 0; i < under.length; i++) {
      var u = under[i];
      if (u.k === "empties") {
        if (load.k === "empties") continue;
        if (u.n > 3) return false;
        continue;
      }
      if (u.tr) { if (topOf(u) > TB + 140) return false; continue; }
      if (isYard(u) && u.y < 1 && load.k !== "empties") continue;
      return false;
    }
    return true;
  }
  // Where a load wants to go (Move it!, the coach line, the ghost hand).

    document.addEventListener("pointerdown", poke, true);
    document.addEventListener("keydown", poke, true);
    function blocked() {
      if (document.hidden) return true;
      if (window.Toybox && (Toybox.sheetOpen() || Toybox.timer.phase() === "ending" || Toybox.timer.phase() === "resting")) return true;
      return !!(opt.ok && !opt.ok());
    }
    function at(pts, f) {
      if (pts.length < 2) return pts[0];
      var segs = [], tot = 0, i;
      for (i = 1; i < pts.length; i++) { var l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); tot += l; }
      var d = f * tot;
      for (i = 0; i < segs.length; i++) {
        if (d <= segs[i] || i === segs.length - 1) { var t = segs[i] ? Math.min(1, d / segs[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; }
        d -= segs[i];
      }
      return pts[pts.length - 1];
    }
    function frame() {
      if (!run) return;
      var t = (Date.now() - run.t0) / run.dur, p = run.p, s = run.s, x, y, a, press, sc = 1;
      if (t >= 1) { stop(); return; }
      if (p.tap || p.pts.length < 2) {
        var pt = p.pts[0];
        x = pt[0]; y = pt[1];
        a = t < 0.15 ? t / 0.15 : (t > 0.85 ? (1 - t) / 0.15 : 1);
        press = (t > 0.3 && t < 0.42) || (t > 0.55 && t < 0.67);
        sc = press ? 0.92 : 1;
        if (t < 0.3) { var k = 1 - t / 0.3; x += 26 * s * k; y += 30 * s * k; }
      } else {
        a = t < 0.1 ? t / 0.1 : (t > 0.9 ? (1 - t) / 0.1 : 1);
        var f = reduceG ? 0.5 : ease(Math.max(0, Math.min(1, (t - 0.16) / 0.66)));
        var q = at(p.pts, f); x = q[0]; y = q[1];
        press = t > 0.12 && t < 0.86;
        sc = t < 0.12 ? 1.12 - 0.12 * (t / 0.12) : 1;
      }
      el.style.opacity = (0.85 * a).toFixed(3);
      el.style.transform = "translate(" + (x - 24 * s) + "px," + (y - 18 * s) + "px) rotate(-14deg) scale(" + sc + ")";
      el.lastChild.firstChild.style.opacity = press ? "1" : "0";
      carryEl.style.opacity = press ? "0.75" : "0";
      requestAnimationFrame(frame);
    }
    function show(p) {
      if (!el) build();
      var s = Math.max(1, Math.min(1.7, Math.min(innerWidth, innerHeight) / 360));
      el.style.width = (64 * s) + "px"; el.style.height = (84 * s) + "px";
      el.style.transformOrigin = (24 * s) + "px " + (18 * s) + "px";
      el.style.display = "block";
      carryEl.innerHTML = p.carry ? p.carry.html : "";
      run = { p: p, s: s, t0: Date.now(), dur: p.dur || (p.tap ? 2400 : 3200) };
      requestAnimationFrame(frame);
    }
    setInterval(function () {
      if (run || learned || !armed || shown >= MAX || Date.now() - last < IDLE) return;
      if (blocked()) { last = Date.now(); return; }
      var p = plan();
      if (!p || !p.pts || !p.pts.length) return;
      armed = false; shown++;
      show(p);
    }, 250);
    return {
      learned: function () { learned = true; stop(); },
      again: function () { learned = false; shown = 0; armed = true; last = Date.now(); },
      poke: poke,
      show: function () { var p = plan(); if (p) show(p); return !!p; }
    };
  }
  function inStage(p) {
    var r = $("stage").getBoundingClientRect();
    return [clamp(p[0], r.left + 34, r.right - 34), clamp(p[1], r.top + 34, r.bottom - 34)];
  }
  function forkPt() { return worldToScreen(F.x + F.dir * FORK * 0.6, F.h + 6); }
  // The ghost hand drags the forks to the next pallet's openings, then up, then to the place.
  var ghost = makeGhost(function () {
    if (ending || drag || steps.length || auto || F.turn || F.slide) return null;
    var f = inStage(forkPt());
    if (F.load) {
      var d = bestDest(F.load);
      if (!d || d.dir !== F.dir) return null;
      coachAgain();
      return { pts: [f, inStage(worldToScreen(d.x - F.dir * (LOADC - FORK * 0.6), d.top + 30))] };
    }
    if (F.engaged) {
      coachAgain();
      if (F.engaged.placed) return { pts: [f, inStage(worldToScreen(F.x - F.dir * 140 + F.dir * FORK * 0.6, F.h + 6))] };
      return { pts: [f, inStage(worldToScreen(F.x + F.dir * FORK * 0.6, F.h + 90))] };
    }
    var o = nextPickup();
    if (!o || pickupDir(o) !== F.dir) return null;
    coachAgain();
    return { pts: [f, inStage(worldToScreen(nearFace(o) + F.dir * FORK * 0.6, o.y + SLOT + 6))] };
  }, { max: 3 });

  // ---------- Start ----------
  var startFresh = !!(window.Toybox && Toybox.fresh());
  if (startFresh || !loadState()) {
    rows = 0; wallDone = false; count = 0; trucks = 0; objs = [];
    F.x = 600; F.dir = -1; F.h = TRAVEL; F.load = null;
    newTruck();
    saveState();
  }
  resize();
  showCount(false);
  Toybox.init({
    app: "construction-site",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the forklift sets its load down and parks, and the buttons lock. The timer carries on across the site pages.",
    goodbyeOption: "End with a “Park it” button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Park it",
    farewellDone: "Bye bye, forklift!",
    restLine: "The forklift is resting.",
    restLine2: "The forklift will be right here next time.",
    restArt: restArt,
    soundNote: "Soft engine hums, beeps and clunks. Hold for 2 seconds.",
    legacy: { timer: "site-timer-v1", sound: "site-sound-v1", big: "site-big-v1" },
    onEnding: onEnding,
    onGoodbye: goodbyePark,
    onRest: onRest,
    onWake: onWake,
    onBig: onBig,
    onSound: function (on) { if (on) chime(); },
    onTimer: drawTimer
  });
  requestAnimationFrame(loop);

  // Test hook, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) window.__forklift = {
    state: function () {
      return { x: Math.round(F.x), dir: F.dir, h: Math.round(F.h), tilt: +F.tilt.toFixed(1), load: F.load ? F.load.k : null,
        engaged: F.engaged ? F.engaged.k : null, slide: F.slide ? [F.slide.x, F.slide.h] : null, fx: F.x, fh: F.h, placed: !!(F.engaged && F.engaged.placed), turning: !!F.turn, rows: rows, done: wallDone,
        count: count, truck: truck.state, auto: auto, steps: steps.length, parked: F.parked,
        objs: objs.map(function (o) { return { k: o.k, n: o.n, x: Math.round(wx(o)), y: Math.round(o.y), tr: !!o.tr }; }),
        coach: $("hint").hidden ? "" : $("hint").textContent, bl: bl.st, crossing: !!crossing, bird: bird ? bird.st : null, hop: !!hop };
    },
    toScreen: function (x, y) { var p = worldToScreen(x, y); return { x: p[0], y: p[1] }; },
    forkScreen: function () { var p = forkPt(); return { x: p[0], y: p[1] }; },
    palletScreen: function () { var o = nextPickup(); if (!o) return null; var p = worldToScreen(wx(o), o.y + SLOT + 6); return { x: p[0], y: p[1], dir: pickupDir(o) }; },
    placeScreen: function () { if (!F.load) return null; var d = bestDest(F.load); if (!d) return null; var p = worldToScreen(d.x - F.dir * (LOADC - FORK * 0.6), d.top + 30); return { x: p[0], y: p[1], dir: d.dir, top: d.top, kind: d.kind }; },
    ghost: function () { return ghost.show(); },
    skipTruck: function () { if (truck.state === "arrive") truck.t = 99; }
  };
})();
</script>
