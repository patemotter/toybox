<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bulldozer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Construction Site">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 1366px;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
header { display: flex; align-items: center; gap: 10px; min-width: 0; }
header h1 { margin: 0; white-space: nowrap; font-size: 1.35rem; font-weight: 800; line-height: 1; letter-spacing: -0.01em; }
.spacer { flex: 1 1 auto; }
.homebtn, .mapbtn {
  flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 40px;
  padding: 2px 12px 2px 9px; font-weight: 700; font-size: 1rem; color: var(--ink); text-decoration: none; white-space: nowrap;
  background: var(--panel); border: 3px solid var(--edge); border-radius: 12px; box-shadow: 2px 2px 0 var(--edge);
}
.mapbtn { background: var(--accent); color: #1D2340; border-color: #1D2340; box-shadow: 2px 2px 0 #1D2340; }
.homebtn:active, .mapbtn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }
.homebtn:focus-visible, .mapbtn:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
.homebtn svg, .mapbtn svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.badge {
  flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px 0 6px;
  border: 3px dashed var(--edge); border-radius: 999px; font-size: 0.9rem; font-weight: 700; color: var(--ink); white-space: nowrap;
}
.badge svg { width: 34px; height: 28px; display: block; }
.app { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.gubtn { min-height: 40px; font-size: 1rem; padding: 0.1rem 0.8rem; white-space: nowrap; }

/* ---------- Stage: the dirt field ---------- */
.stage {
  position: relative; flex: 1 1 auto; min-height: 0; background: var(--plate);
  border: 3px solid var(--edge); border-radius: 24px; box-shadow: 4px 4px 0 var(--edge); padding: 6px;
}
.scene {
  position: relative; width: 100%; height: 100%; border: 3px solid #1D2340; border-radius: 18px;
  overflow: hidden; background: #6FAE45; touch-action: none;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.count {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 2; pointer-events: none;
  display: flex; align-items: center; gap: 6px; background: #FFFFFF; color: #1D2340; border: 3px solid #1D2340;
  border-radius: 999px; box-shadow: 3px 3px 0 #1D2340; padding: 2px 14px 2px 8px; font-weight: 800;
  font-size: clamp(1rem, 2.4vw, 1.4rem); line-height: 1.2; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.count svg { width: 1.5em; height: 1.5em; flex: none; }
.count.bump { animation: bump 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bump { 0% { transform: translateX(-50%) scale(1.6); } 100% { transform: translateX(-50%) scale(1); } }
.hint, .cheer {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2; pointer-events: none;
  background: var(--accent); color: #1D2340; border: 4px solid #1D2340; border-radius: 22px;
  box-shadow: 4px 4px 0 #1D2340; padding: 0.1rem 1rem 0.2rem; font-size: clamp(1.1rem, 3.4vw, 2rem);
  font-weight: 800; white-space: nowrap;
}
.hint[hidden], .cheer[hidden] { display: none; }
/* The coach: one big line that always says what to do next. */
.coach {
  position: absolute; z-index: 2; left: 50%; bottom: 12px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 20px);
  display: flex; align-items: center; gap: 0.4em; padding: 0.2em 0.9em 0.2em 0.22em; background: #FFFFFF; color: #1D2340;
  border: 4px solid #1D2340; border-radius: 999px; box-shadow: 4px 4px 0 #1D2340; font-weight: 800;
  font-size: clamp(1.05rem, 3.6vw, 1.9rem); line-height: 1.05; pointer-events: none;
}
.coach .num {
  flex: none; width: 1.7em; height: 1.7em; border-radius: 50%; background: #FFC93C; border: 3px solid #1D2340;
  display: flex; align-items: center; justify-content: center; font-size: 0.95em;
}
.coach .ctext { display: flex; flex-direction: column; min-width: 0; }
.coach small { font-size: 0.62em; font-weight: 700; color: #4A5578; line-height: 1.15; }
.coach small:empty { display: none; }
.coach.ok .num { background: #7CFF8A; }
.coach.watch .num { background: #8CC8FF; }
.coach.pop .num { animation: numpop 0.45s ease-out; }
@keyframes numpop { 0% { transform: scale(0.6); } 55% { transform: scale(1.25); } 100% { transform: scale(1); } }
body.levers .coach { max-width: calc(100% - 2 * clamp(70px, 9vw, 96px) - 44px); }
body.ending .coach { display: none; }
.coach.top { bottom: auto; top: 58px; }
@media (min-width: 744px) and (min-height: 640px) { .coach.top { top: 70px; } }
.cheer { top: 50%; bottom: auto; transform: translate(-50%, -50%); font-size: clamp(1.6rem, 6vw, 3.4rem); background: #FFFFFF; z-index: 3; padding: 0.1rem 1.4rem 0.25rem; }
.cheer.go { animation: cheerPop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes cheerPop { 0% { transform: translate(-50%, -50%) scale(0.2); } 100% { transform: translate(-50%, -50%) scale(1); } }

/* Track levers (the other way to drive) */
.lever {
  position: absolute; z-index: 2; top: 64px; bottom: 14px; width: clamp(70px, 9vw, 96px);
  background: rgba(29, 35, 64, 0.35); border: 3px solid #1D2340; border-radius: 999px; touch-action: none;
}
.lever[hidden] { display: none; }
.lever.l { left: 10px; }
.lever.r { right: 10px; }
.lever .mid { position: absolute; left: 14%; right: 14%; top: 50%; height: 4px; margin-top: -2px; background: rgba(255, 255, 255, 0.7); border-radius: 2px; }
.lever .ar { position: absolute; left: 50%; width: 34px; height: 34px; margin-left: -17px; pointer-events: none; }
.lever .ar.up { top: 6px; }
.lever .ar.dn { bottom: 6px; }
.lever .knob {
  position: absolute; left: 50%; top: 50%; width: 118%; aspect-ratio: 1; transform: translate(-50%, -50%);
  background: #FFC21A; border: 4px solid #1D2340; border-radius: 50%; box-shadow: 3px 3px 0 #1D2340; pointer-events: none;
  display: grid; place-items: center; font-weight: 800; font-size: 0.9rem; color: #1D2340; line-height: 1;
}

/* Play-timer gauge */
.fuel { position: absolute; top: 8px; left: 8px; z-index: 2; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.fuel[hidden] { display: none; }
.fuel-bar { width: clamp(70px, 14vw, 140px); height: 18px; background: rgba(255, 255, 255, 0.8); border: 3px solid #1D2340; border-radius: 999px; overflow: hidden; }
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num { min-width: 40px; height: 40px; display: grid; place-items: center; background: #FFFFFF; color: #1D2340; border: 3px solid #1D2340; border-radius: 50%; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.fuel-num[hidden] { display: none; }
body.levers .fuel { left: calc(clamp(70px, 9vw, 96px) + 22px); }

/* Big mode */
.bigtoggle { position: absolute; top: 10px; right: 10px; z-index: 3; color: #1D2340; background: #FFFFFF; border-color: #1D2340; box-shadow: 3px 3px 0 #1D2340; }
.bigtoggle[aria-pressed="true"] { background: var(--accent); }
.bigtoggle:active { box-shadow: 0 0 0 #1D2340; }
body.big header, body.big .panel { display: none; }
body.big .wrap { max-width: none; padding: max(6px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); }
body.big .app { margin-top: 0; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }

/* ---------- Panel: jobs list, drive mode, new field ---------- */
.panel {
  flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; padding: 8px 10px 10px;
  background: var(--panel); border: 3px solid var(--edge); border-bottom-width: 0; border-radius: 24px 24px 0 0;
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
}
.jobs { display: flex; gap: 6px; flex: 3 1 480px; min-width: 0; }
.job {
  flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 4px; min-height: 52px;
  font: inherit; font-weight: 800; font-size: clamp(0.85rem, 2.2vw, 1.1rem); line-height: 1.05; text-align: left; color: #1D2340;
  background: #FFF4D6; border: 3px solid #1D2340; border-radius: 16px; box-shadow: 3px 3px 0 #1D2340; cursor: pointer;
}
.job:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #1D2340; }
.job svg { width: 42px; height: 42px; flex: none; }
.job .tick { display: none; }
.job.done { background: #BFEBC9; }
.job.done .tick { display: inline; }
.job[aria-pressed="true"] { background: #FFC93C; box-shadow: 0 0 0 4px #FF7A1A, 3px 3px 0 4px #1D2340; }
.job.done[aria-pressed="true"] { background: #BFEBC9; }
.showbtn { flex: 1.3 1 0; min-width: 0; white-space: nowrap; padding: 0.2rem 0.5rem; background: #8CC8FF; color: #1D2340; border-color: #1D2340; }
.showbtn[aria-pressed="true"] { background: #FFC93C; }
.ctrl { display: flex; gap: 8px; flex: 2 1 320px; min-width: 0; }
.seg { display: flex; gap: 6px; flex: 2 1 0; min-width: 0; }
.seg .btn { flex: 1 1 0; min-width: 0; padding: 0.2rem 0.4rem; white-space: nowrap; }
.newbtn { flex: 1.2 1 0; min-width: 0; white-space: nowrap; padding: 0.2rem 0.5rem; background: #FFD9A8; }
.newbtn.pulse { animation: pulse 1.1s ease-in-out infinite; background: var(--accent); color: #1D2340; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
body.ending .panel, body.ending .homebtn, body.ending .mapbtn { pointer-events: none; opacity: 0.4; }
body.ending .lever { pointer-events: none; opacity: 0.5; }

/* ---------- Timer (sheet, toast, banner and rest screen come from common/toybox.css) ---------- */
.rest-art { width: min(62vw, 260px, 34vh); aspect-ratio: 1; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }


@media (min-width: 744px) and (min-height: 640px) {
  .wrap { padding-top: 12px; }
  header h1 { font-size: 2rem; }
  .homebtn, .mapbtn, .gubtn { min-height: 48px; font-size: 1.1rem; }
  .app { gap: 12px; margin-top: 10px; }
  .stage { padding: 10px; }
  .panel { gap: 10px; padding: 12px 14px 14px; }
  .job, .seg .btn, .newbtn { min-height: 62px; }
  .seg .btn, .newbtn, .showbtn { font-size: 1.25rem; }
  .showbtn { min-height: 62px; }
  .job svg { width: 50px; height: 50px; }
  .fuel-num { min-width: 48px; height: 48px; font-size: 1.5rem; }
  .bigtoggle { top: 14px; right: 14px; }
  .lever { top: 80px; }
}
@media (max-width: 700px) {
  header { gap: 6px; }
  header h1 { font-size: 1.2rem; }
  .badge span, .homebtn span { display: none; }
  .badge { padding: 0 6px; }
  .homebtn { padding: 2px 8px; }
  .job { font-size: 0.85rem; padding: 2px 4px 2px 2px; gap: 3px; }
  .job svg { width: 34px; height: 34px; }
}
@media (max-width: 480px) {
  header h1 { display: none; }
  .count { left: 8px; transform: none; padding: 2px 10px 2px 6px; }
  .count.bump { animation: none; }
  .fuel { top: 54px; }
  body.levers .fuel { left: 8px; top: auto; bottom: 14px; left: 50%; transform: translateX(-50%); }
  .lever { width: 60px; top: 60px; }
  .lever .knob { width: 104%; font-size: 0.75rem; }
  .gubtn { font-size: 0.9rem; padding: 0.2rem 0.5rem; }
  .seg .btn, .newbtn, .showbtn { font-size: 0.9rem; padding: 0.2rem 0.2rem; }
  .ctrl, .seg { gap: 5px; }
  body.levers .coach { max-width: calc(100% - 140px); }
}
/* Short landscape phones: controls in a column at the side. */
.mini { display: none; }
@media (orientation: landscape) and (max-height: 520px) {
  header { display: none; }
  .wrap { padding-top: 6px; }
  .app { flex-direction: row; margin-top: 0; }
  .stage { margin-bottom: 6px; }
  .panel { flex: 0 0 210px; flex-direction: column; flex-wrap: nowrap; margin-bottom: 6px; border-bottom-width: 3px; border-radius: 20px; padding: 6px; gap: 5px; }
  .jobs { flex-direction: column; flex: 1 1 auto; gap: 4px; }
  .job { min-height: 0; font-size: 0.85rem; }
  .job svg { width: 28px; height: 28px; }
  .ctrl { flex: 0 0 auto; flex-direction: column; gap: 5px; }
  .seg .btn, .newbtn, .showbtn { min-height: 40px; font-size: 0.95rem; flex: 1 1 auto; }
  .mini { display: flex; gap: 5px; }
  .mini a { flex: 1 1 0; justify-content: center; min-height: 38px; font-size: 0.9rem; padding: 2px 4px; }
  .mini a span { display: inline; }
}
@media (prefers-reduced-motion: reduce) {
  .cheer.go, .count.bump, .newbtn.pulse, .coach.pop .num { animation: none; }
}
/* Phones: keep the header (with the longer "All machines" label) on one line. */
@media (max-width: 480px) {
  header { gap: 4px; }
  header .mapbtn { padding: 2px 8px 2px 4px; gap: 2px; font-size: 0.95rem; }
  header .mapbtn svg { width: 18px; height: 18px; }
  header .badge { padding: 0 4px; }
  header .badge svg { width: 28px; height: 23px; }
  header .gubtn { padding: 0.1rem 0.45rem; font-size: 0.85rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="mapbtn" href="./" aria-label="Back to all machines"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>All machines</span></a>
    <h1>Bulldozer</h1>
    <span class="spacer"></span>
    <span class="badge" title="Hard hat is on"><svg viewBox="0 0 34 28" aria-hidden="true"><path d="M5 20 C5 8 29 8 29 20 Z" fill="#FFC21A" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><path d="M17 8.5 V20" stroke="#1D2340" stroke-width="2"/><rect x="2" y="19" width="30" height="5" rx="2.5" fill="#FFC21A" stroke="#1D2340" stroke-width="2.5"/></svg><span>Hard hat on</span></span>
    <a class="homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg><span>Home</span></a>
    <button class="btn gubtn" id="timerbtn">Grown-ups</button>
  </header>

  <main class="app">
    <div class="stage">
      <div class="scene" id="scene">
        <canvas id="cv" role="img" aria-label="A dirt field with a big yellow bulldozer"></canvas>
        <div class="count" id="count"><svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="M0-10.5 3.1-3.6 10.4-3.2 4.8 1.6 6.6 9 0 5 -6.6 9 -4.8 1.6 -10.4-3.2 -3.1-3.6Z" fill="#FFC93C" stroke="#1D2340" stroke-width="2" stroke-linejoin="round"/></svg><span>Jobs done: <b id="countNum">0</b></span></div>
        <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
        <div class="lever l" id="leverL" hidden><div class="mid"></div><svg class="ar up" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="ar dn" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="knob">Left</div></div>
        <div class="lever r" id="leverR" hidden><div class="mid"></div><svg class="ar up" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="ar dn" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="knob">Right</div></div>
        <div class="coach" id="coach" role="status" aria-live="polite"><span class="num" id="coachNum">1</span><span class="ctext"><span id="coachText"></span><small id="coachSub"></small></span></div>
        <div class="cheer" id="cheer" hidden></div>
        <button class="btn bigtoggle" id="bigToggle" aria-pressed="false">Big</button>
      </div>
    </div>

    <div class="panel">
      <div class="mini">
        <a class="mapbtn" href="./" aria-label="Back to all machines"><span>All machines</span></a>
        <a class="homebtn" href="../" aria-label="Back to Toybox"><span>Home</span></a>
        <button class="btn gubtn" id="timerbtn2" style="min-height:38px;font-size:0.9rem;padding:0 6px">Grown-ups</button>
      </div>
      <div class="jobs" id="jobs">
        <button class="job" data-job="hole" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="27" rx="19" ry="13" fill="#B08257" stroke="#1D2340" stroke-width="3"/><ellipse cx="24" cy="29" rx="12" ry="7.5" fill="#5A3A22"/><circle cx="24" cy="27" r="20.5" fill="none" stroke="#FF7A1A" stroke-width="2.5" stroke-dasharray="5 4"/></svg><span>Fill the hole <span class="tick">✓</span></span></button>
        <button class="job" data-job="pile" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 40 Q16 12 24 12 Q32 12 43 40 Z" fill="#C79461" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><path d="M33 40 V6" stroke="#1D2340" stroke-width="3"/><path d="M33 6 L45 10 L33 14 Z" fill="#E63946" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/></svg><span>Make a pile <span class="tick">✓</span></span></button>
        <button class="job" data-job="flat" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M3 30 Q8 20 13 28 Q18 18 24 28 Q30 21 35 28 Q40 19 45 30 V40 H3 Z" fill="#C79461" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><path d="M6 13 H42" stroke="#2E9E5B" stroke-width="4" stroke-linecap="round"/><path d="M36 8 L42 13 L36 18" fill="none" stroke="#2E9E5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Make it flat <span class="tick">✓</span></span></button>
      </div>
      <div class="ctrl">
        <div class="seg">
          <button class="btn" data-mode="finger" aria-pressed="true">Drag</button>
          <button class="btn" data-mode="levers" aria-pressed="false">Levers</button>
        </div>
        <button class="btn showbtn" id="showMe" aria-pressed="false">Show me</button>
        <button class="btn newbtn" id="newField">New field</button>
      </div>
    </div>
  </main>

</div>


<script>
(function () {
  "use strict";
