<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Construction Site</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Construction Site">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 1366px;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header h1 { margin: 0; white-space: nowrap; font-size: clamp(1.1rem, 4.6vw, 1.35rem); font-weight: 800; line-height: 1; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; }
.homebtn {
  flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 34px;
  padding: 2px 12px 2px 9px; font-weight: 700; font-size: 1rem; color: var(--ink); text-decoration: none;
  background: var(--panel); border: 3px solid var(--edge); border-radius: 12px; box-shadow: 2px 2px 0 var(--edge);
}
.homebtn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }
.homebtn:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
.homebtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.hdr-right { display: flex; gap: 10px; align-items: center; }
.app { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; margin-top: 6px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }

/* ---------- The site map ---------- */
.stage {
  position: relative; flex: 1 1 auto; min-height: 0; background: var(--plate);
  border: 3px solid var(--edge); border-radius: 24px; box-shadow: 4px 4px 0 var(--edge); padding: 6px;
}
.scene {
  position: relative; width: 100%; height: 100%; border: 3px solid #1D2340; border-radius: 18px;
  overflow: hidden; background: #E7C690; touch-action: none;
}
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#map [data-go] { cursor: pointer; }
.sbtn {
  position: absolute; left: 0; top: 0; z-index: 2; transform: translate(-50%, -50%);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none;
  color: #1D2340; background: #FFFFFF; border-color: #1D2340; box-shadow: 4px 4px 0 #1D2340;
  font-size: clamp(1.05rem, 2.6vw, 1.6rem); font-weight: 800; line-height: 1; min-height: 56px;
  padding: 0.25rem 1rem 0.25rem 0.5rem; border-width: 4px; border-radius: 20px;
}
.sbtn:active { transform: translate(-50%, -50%) translate(3px, 3px); box-shadow: 0 0 0 #1D2340; }
.sbtn svg { width: 2.4em; height: 1.7em; flex: none; display: block; overflow: visible; pointer-events: none; }
.sbtn span { pointer-events: none; padding-top: 0.12em; }
.sbtn.small { min-height: 46px; font-size: 1rem; padding: 0.15rem 0.7rem 0.15rem 0.35rem; border-width: 3px; box-shadow: 3px 3px 0 #1D2340; }
.puff { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; border-radius: 50%; border: 2px solid rgba(29, 35, 64, 0.35); }

/* Play-timer gauge */
.fuel { position: absolute; top: 8px; left: 8px; z-index: 3; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.fuel[hidden] { display: none; }
.fuel-bar { width: clamp(70px, 18vw, 150px); height: 18px; background: rgba(255, 255, 255, 0.8); border: 3px solid #1D2340; border-radius: 999px; overflow: hidden; }
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num { min-width: 40px; height: 40px; display: grid; place-items: center; background: #FFFFFF; color: #1D2340; border: 3px solid #1D2340; border-radius: 50%; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.fuel-num[hidden] { display: none; }

/* Big mode */
.bigtoggle { position: absolute; top: 10px; right: 10px; z-index: 3; color: #1D2340; background: #FFFFFF; border-color: #1D2340; box-shadow: 3px 3px 0 #1D2340; }
.bigtoggle[aria-pressed="true"] { background: var(--accent); }
.bigtoggle:active { box-shadow: 0 0 0 #1D2340; }
body.big header { display: none; }
body.big .wrap { max-width: none; padding: max(6px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); }
body.big .app { margin-top: 0; }
body.ending .homebtn, body.ending .sbtn, body.ending #map [data-go] { pointer-events: none; }
body.ending .homebtn, body.ending .sbtn { opacity: 0.4; }

/* ---------- Gate and gear-up ---------- */
.gate { position: fixed; inset: 0; z-index: 40; perspective: 1400px; overflow: hidden; }
.gate[hidden] { display: none; }
.leaf {
  position: absolute; top: 0; bottom: 0; width: 50.5%; background-color: #E3EAF2;
  background-image: repeating-linear-gradient(45deg, transparent 0 15px, #8C99AB 15px 18px), repeating-linear-gradient(-45deg, transparent 0 15px, #8C99AB 15px 18px);
  border: 12px solid #5B6476; transition: transform 1.3s cubic-bezier(0.5, 0, 0.3, 1);
}
.leaf.l { left: 0; transform-origin: 0 50%; border-right-width: 8px; }
.leaf.r { right: 0; transform-origin: 100% 50%; border-left-width: 8px; }
.leaf::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 14%; height: 34px; border-top: 4px solid #1D2340; border-bottom: 4px solid #1D2340;
  background: repeating-linear-gradient(-45deg, #FFC93C 0 22px, #1D2340 22px 44px);
}
.leaf.r::before { background: repeating-linear-gradient(45deg, #FFC93C 0 22px, #1D2340 22px 44px); }
.leaf .sign {
  position: absolute; top: 16%; padding: 4px 16px 0; background: #FFC93C; color: #1D2340; border: 5px solid #1D2340; border-radius: 12px;
  font-size: clamp(1.4rem, 4.5vw, 3rem); font-weight: 800; line-height: 1.1; white-space: nowrap; box-shadow: 4px 4px 0 #1D2340;
}
.leaf.l .sign { right: 18px; }
.leaf.r .sign { left: 18px; }
.gate.open .leaf.l { transform: rotateY(88deg); }
.gate.open .leaf.r { transform: rotateY(-88deg); }
.gate.instant .leaf { transition: none; }
.gtop {
  position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
}
.gate.open .gtop { visibility: hidden; }
.gcard {
  position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(760px, calc(100% - 28px)); height: min(860px, calc(100% - 96px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
  margin-top: 26px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px;
  background: var(--panel); color: var(--ink); border: 4px solid var(--edge); border-radius: 28px; box-shadow: 6px 6px 0 var(--edge); padding: 12px 14px 16px;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.gcard[hidden] { display: none; }
.gcard.leaving { opacity: 0; transform: translate(-50%, -40%) scale(0.95); pointer-events: none; }
.gtitle { text-align: center; }
.gtitle h2 { margin: 0; font-size: clamp(2rem, 6.5vw, 3.4rem); font-weight: 800; line-height: 1; }
.gtitle p { margin: 4px 0 0; font-size: clamp(1.1rem, 3.2vw, 1.5rem); font-weight: 700; color: var(--muted); line-height: 1.2; }
.gchar { position: relative; min-height: 0; }
.gchar svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.gtray { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.gslot {
  display: flex; flex-direction: column; align-items: center; gap: 2px; background: #F6DDB0; color: #1D2340;
  border: 3px solid #1D2340; border-radius: 20px; padding: 6px 6px 8px;
}
.gslot.on { background: #BDF0C8; }
.gitem { width: min(220px, 100%); height: clamp(52px, 9vh, 110px); touch-action: none; cursor: grab; position: relative; z-index: 2; }
.gitem svg { width: 100%; height: 100%; overflow: visible; display: block; pointer-events: none; }
.gitem.drag { z-index: 45; transition: none; }
.gitem.back { transition: transform 0.35s cubic-bezier(0.3, 1.4, 0.5, 1); }
.gitem.gone { transition: transform 0.3s ease, opacity 0.3s ease; opacity: 0; }
.glabel { font-weight: 800; font-size: clamp(1.1rem, 3.2vw, 1.5rem); line-height: 1.1; text-align: center; }
.glabel .ok { display: none; color: #1E7A43; }
.gslot.on .ok { display: inline; }
.tgt { animation: tgtpulse 1.4s ease-in-out infinite; }
@keyframes tgtpulse { 50% { opacity: 0.25; } }
.popin { transform-box: fill-box; transform-origin: 50% 50%; animation: popin 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }
@keyframes popin { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
.hop { animation: hop 0.6s ease-out 2; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes hop { 30% { transform: translateY(-16px); } 60% { transform: translateY(0); } }
.confetti { position: fixed; left: 0; top: 0; z-index: 70; width: 12px; height: 12px; border: 2px solid #1D2340; border-radius: 3px; pointer-events: none; }

/* ---------- Timer (sheet, toast, banner and rest screen come from common/toybox.css) ---------- */
/* Above the site gate (z-index 40): the gate closes while the site winds down. */
.toast { top: max(70px, calc(env(safe-area-inset-top, 0px) + 70px)); z-index: 46; }
.farewell { z-index: 45; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }

@media (max-width: 440px) {
  header h1 { white-space: normal; line-height: 0.95; }
  .homebtn { padding: 2px 10px 2px 7px; }
}
@media (min-width: 744px) and (min-height: 640px) {
  .wrap { padding-top: 12px; }
  header h1 { font-size: 2rem; }
  .homebtn { min-height: 44px; font-size: 1.1rem; }
  .app { margin-top: 10px; }
  .stage { padding: 10px; }
  .fuel-num { min-width: 48px; height: 48px; font-size: 1.5rem; }
  .bigtoggle { top: 14px; right: 14px; }
  .sbtn.small { min-height: 56px; font-size: 1.15rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  header h1 { font-size: 1.15rem; }
  .homebtn { min-height: 36px; }
  .wrap { padding-top: max(6px, env(safe-area-inset-top, 0px)); }
  .app { margin-top: 4px; }
  .stage { padding: 4px; border-radius: 18px; }
  .gcard { grid-template-columns: 1fr 1.3fr; grid-template-rows: auto minmax(0, 1fr); margin-top: 22px; height: calc(100% - 70px); }
  .gtitle { grid-column: 1 / 3; }
  .gtitle h2 { font-size: 1.8rem; }
  .gtitle p { font-size: 1.05rem; }
  .gtray { grid-template-columns: 1fr 1fr; gap: 6px; align-content: center; }
  .gslot { padding: 3px 4px 4px; border-radius: 16px; }
  .gitem { height: clamp(34px, 11vh, 52px); }
  .glabel { font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) {
  .tgt, .hop { animation: none; }
  .leaf { transition-duration: 0.3s; }
}
/* Declutter: phones show the full title and Home as an icon. */
@media (max-width: 480px) {
  header h1 { white-space: nowrap; overflow: visible; text-overflow: clip; font-size: 1.3rem; line-height: 1; }
  header .hdr-right { gap: 8px; }
  header .homebtn { min-height: 44px; min-width: 48px; justify-content: center; padding: 2px 8px; }
  header .homebtn span { display: none; }
}
@media (max-width: 340px) { header h1 { font-size: 1.1rem; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Construction Site</h1>
    <div class="hdr-right">
      <a class="homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg><span>Home</span></a>
    </div>
  </header>

  <main class="app">
    <div class="stage">
      <div class="scene" id="scene">
        <svg id="map" role="img" aria-label="A sunny construction site with a bulldozer, an excavator, a concrete mixer truck and a crane with a wrecking ball"></svg>
        <div id="sbtns"></div>
        <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
        <button class="btn bigtoggle" id="bigToggle" aria-pressed="false">Big</button>
      </div>
    </div>
  </main>
</div>

<!-- Site gate with the gear-up -->
<div class="gate" id="gate" hidden>
  <div class="leaf l"><div class="sign">HARD HAT</div></div>
  <div class="leaf r"><div class="sign">AREA</div></div>
  <div class="gtop">
    <a class="homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg><span>Home</span></a>
  </div>
  <div class="gcard" id="gcard">
    <div class="gtitle"><h2>Gear up!</h2><p>Hard hat, safety vest, eye protection and ear protection.</p></div>
    <div class="gchar"><svg id="gChar" viewBox="0 0 200 296" role="img" aria-label="A worker getting ready"></svg></div>
    <div class="gtray">
      <div class="gslot" id="slotHat">
        <div class="gitem" id="itHat" data-item="hat" role="button" tabindex="0" aria-label="Hard hat"><svg viewBox="50 14 100 60" aria-hidden="true"></svg></div>
        <div class="glabel">Hard hat <span class="ok">✓</span></div>
      </div>
      <div class="gslot" id="slotVest">
        <div class="gitem" id="itVest" data-item="vest" role="button" tabindex="0" aria-label="Safety vest"><svg viewBox="54 98 92 104" aria-hidden="true"></svg></div>
        <div class="glabel">Safety vest <span class="ok">✓</span></div>
      </div>
      <div class="gslot" id="slotGog">
        <div class="gitem" id="itGog" data-item="gog" role="button" tabindex="0" aria-label="Eye protection"><svg viewBox="60 56 80 34" aria-hidden="true"></svg></div>
        <div class="glabel">Eye protection <span class="ok">✓</span></div>
      </div>
      <div class="gslot" id="slotMuf">
        <div class="gitem" id="itMuf" data-item="muf" role="button" tabindex="0" aria-label="Ear protection"><svg viewBox="46 20 108 74" aria-hidden="true"></svg></div>
        <div class="glabel">Ear protection <span class="ok">✓</span></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ANIM = !reduceMotion;

  // ---------- Keys shared by every Construction Site page ----------
  var GEAR_KEY = "site-gear";
  var STATIONS = [
    { id: "bulldozer", label: "Bulldozer" },
    { id: "excavator", label: "Excavator" },
    { id: "concrete", label: "Concrete" },
    { id: "wrecking-ball", label: "Wrecking ball" }
  ];
  // If sessionStorage is blocked, treat the gear as on so nobody gets stuck in a redirect loop.
  function gearIsOn() { try { return sessionStorage.getItem(GEAR_KEY) === "on"; } catch (e) { return true; } }
  function setGearOn() { try { sessionStorage.setItem(GEAR_KEY, "on"); } catch (e) { /* ignore */ } }
  var NEXT = (function () {
    var q = {};
    location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
      var i = kv.indexOf("=");
      if (i > 0) { try { q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); } catch (e) { /* ignore */ } }
    });
    for (var i = 0; i < STATIONS.length; i++) if (STATIONS[i].id === q.next) return q.next + ".html";
    return "";
  })();

  // ---------- SVG helpers ----------
  var INK = "#1D2340", YEL = "#FFC93C", YEL2 = "#F2AE1C", GLASS = "#BFE6FF", TRACK = "#2F3447", STEEL = "#9AA5B1", DIRT = "#A0632F", DIRT2 = "#7E4A22";
  function P(d, fill, sw, extra) { return '<path d="' + d + '" fill="' + (fill || "none") + '" stroke="' + INK + '" stroke-width="' + (sw == null ? 4 : sw) + '" stroke-linejoin="round" stroke-linecap="round"' + (extra || "") + "/>"; }
  function S(d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linejoin="round" stroke-linecap="round"/>'; }
  function Rc(x, y, w, h, rx, fill, sw, extra) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 0) + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (sw == null ? 4 : sw) + '"' + (extra || "") + "/>"; }
  function C(cx, cy, r, fill, sw, extra) { return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (sw == null ? 4 : sw) + '"' + (extra || "") + "/>"; }
  function Ln(x1, y1, x2, y2, col, w) { return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>'; }
  function rod(x1, y1, x2, y2, w) { return Ln(x1, y1, x2, y2, INK, w + 5) + Ln(x1, y1, x2, y2, "#DDE4EE", w); }
  function shadow(cx, cy, rx, ry) { return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="rgba(70,40,10,0.22)"/>'; }
  function spline(n) { var a = []; for (var i = 0; i < n; i++) a.push(".45 0 .55 1"); return a.join(";"); }
  function swing(cx, cy, a, dur, begin) {
    if (!ANIM) return "";
    return '<animateTransform attributeName="transform" type="rotate" values="' + (-a) + " " + cx + " " + cy + ";" + a + " " + cx + " " + cy + ";" + (-a) + " " + cx + " " + cy +
      '" keyTimes="0;.5;1" calcMode="spline" keySplines="' + spline(2) + '" dur="' + dur + 's" begin="' + (begin || 0) + 's" repeatCount="indefinite"/>';
  }
  // A blinking amber beacon light on a cab roof.
  function beacon(x, y, delay) {
    var o = Rc(x - 10, y - 2, 20, 7, 2, "#4A5066", 3);
    o += P("M" + (x - 8) + " " + (y - 2) + " Q" + x + " " + (y - 20) + " " + (x + 8) + " " + (y - 2) + " Z", "#FF8A00", 3,
      ANIM ? "><animate attributeName=\"fill\" values=\"#FF8A00;#FFE14D;#FF8A00\" dur=\"1.1s\" begin=\"" + delay + "s\" repeatCount=\"indefinite\"/></path><g style=\"display:none\"" : "");
    if (ANIM) o += '<circle cx="' + x + '" cy="' + (y - 9) + '" r="17" fill="#FFD23F" opacity="0" pointer-events="none"><animate attributeName="opacity" values="0;0.55;0" dur="1.1s" begin="' + delay + 's" repeatCount="indefinite"/></circle>';
    return o;
  }
  function wheel(cx, cy, r) { return C(cx, cy, r, TRACK, 4) + C(cx, cy, r * 0.45, "#C9D3E0", 3) + C(cx, cy, r * 0.12, INK, 0); }
