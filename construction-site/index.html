<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Construction Site</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Construction Site">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage (the site map); no panel ---------- */
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }
/* ---------- The site map ---------- */
.scene { background: #E7C690; touch-action: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#map [data-go] { cursor: pointer; }
.puff { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; border-radius: 50%; border: 2px solid rgba(29, 35, 64, 0.35); }

/* Play-timer gauge */
.fuel { position: absolute; top: 8px; left: 8px; z-index: 3; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.fuel[hidden] { display: none; }
.fuel-bar { width: clamp(70px, 18vw, 150px); height: 18px; background: rgba(255, 255, 255, 0.8); border: 2px solid #1D2340; border-radius: 999px; overflow: hidden; }
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num { min-width: 40px; height: 40px; display: grid; place-items: center; background: #FFFFFF; color: #1D2340; border: 2px solid #1D2340; border-radius: 50%; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.fuel-num[hidden] { display: none; }

/* Big: the header shrinks to the Big button. */
body.big .tb-head > :not(.bigtoggle) { display: none; }
body.ending .homebtn, body.ending .tb-place, body.ending #map [data-go] { pointer-events: none; }
body.ending .homebtn, body.ending .tb-place-label { opacity: 0.4; }
/* Map labels (Toybox.map) at the front of each lot; smaller when the lots are drawn small. */
.tb-place-label { bottom: 2px; }
.scene.lbl-s .tb-place-label { font-size: 15px; gap: 4px; padding: 2px 9px 2px 4px; }
.scene.lbl-s .tb-place-label .tb-pic { width: 26px; height: 26px; }
.tb-place-label .tb-pic { width: 40px; }
.scene.lbl-s .tb-place-label .tb-pic { width: 34px; }

/* ---------- The site gate (HARD HAT AREA) and the gear-up (Toybox.gate) ----------
   The gear-up screen (common/toybox.js) sits on top of the closed gate; once he is dressed it goes and the gate
   swings open onto the site. The gate closes again when the play timer ends. */
.gate { position: fixed; inset: 0; z-index: 29; perspective: 1400px; overflow: hidden; }
.gate[hidden] { display: none; }
.leaf {
  position: absolute; top: 0; bottom: 0; width: 50.5%; background-color: #E3EAF2;
  background-image: repeating-linear-gradient(45deg, transparent 0 15px, #8C99AB 15px 18px), repeating-linear-gradient(-45deg, transparent 0 15px, #8C99AB 15px 18px);
  border: 12px solid #5B6476; transition: transform 1.3s cubic-bezier(0.5, 0, 0.3, 1);
}
.leaf.l { left: 0; transform-origin: 0 50%; border-right-width: 8px; }
.leaf.r { right: 0; transform-origin: 100% 50%; border-left-width: 8px; }
.leaf::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 14%; height: 34px; border-top: 4px solid #1D2340; border-bottom: 4px solid #1D2340;
  background: repeating-linear-gradient(-45deg, #FFC93C 0 22px, #1D2340 22px 44px);
}
.leaf.r::before { background: repeating-linear-gradient(45deg, #FFC93C 0 22px, #1D2340 22px 44px); }
.leaf .sign {
  position: absolute; top: 16%; padding: 4px 16px 0; background: #FFC93C; color: #1D2340; border: 3px solid #1D2340; border-radius: 12px;
  font-size: clamp(1.4rem, 4.5vw, 3rem); font-weight: 800; line-height: 1.1; white-space: nowrap;
}
.leaf.l .sign { right: 18px; }
.leaf.r .sign { left: 18px; }
.gate.open .leaf.l { transform: rotateY(88deg); }
.gate.open .leaf.r { transform: rotateY(-88deg); }
.gate.instant .leaf { transition: none; }
.tb-gate { background-color: #F3E3C4; }
.gate-home { position: absolute; z-index: 2; left: max(12px, env(safe-area-inset-left, 0px)); top: max(10px, env(safe-area-inset-top, 0px)); }
/* Upright: a bigger worker. The hard hat sits over the ear protection's headband. */
@media (orientation: portrait) { .tb-gate-worker { width: min(70vw, 42vh, 400px); } }
.tb-gate-worker .tb-gate-on[data-id="hat"] { z-index: 2; }
.tgt { animation: tgtpulse 1.4s ease-in-out infinite; }
@keyframes tgtpulse { 50% { opacity: 0.25; } }
.confetti { position: fixed; left: 0; top: 0; z-index: 70; width: 12px; height: 12px; border: 2px solid #1D2340; border-radius: 3px; pointer-events: none; }

/* ---------- Timer (sheet, toast, banner and rest screen come from common/toybox.css) ---------- */
/* Above the site gate (z-index 40): the gate closes while the site winds down. */
.toast { top: max(70px, calc(env(safe-area-inset-top, 0px) + 70px)); z-index: 46; }
.farewell { z-index: 45; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }

@media (min-width: 744px) and (min-height: 640px) {
  .fuel-num { min-width: 48px; height: 48px; font-size: 1.5rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .gate-home { top: 8px; }
  /* Phone held sideways: the lot labels run along the bottom, so the coach line goes to the top. */
  #coach.tb-coach { top: 8px; bottom: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .tgt { animation: none; }
  .leaf { transition-duration: 0.3s; }
}
</style>
</head>
<body>
<div class="tb-app-shell tb-v2 wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Construction Site</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>
  <div class="tb-body app">
    <main class="tb-stage scene" id="scene">
      <svg id="map" role="img" aria-label="A sunny construction site with an excavator, a concrete mixer truck, a forklift, a crane with a wrecking ball and a tower crane"></svg>
      <div id="coach"></div>
      <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
    </main>
  </div>
</div>

<!-- The site gate (the gear-up screen, Toybox.gate, sits on top of it until he is dressed) -->
<div class="gate" id="gate" hidden>
  <div class="leaf l"><div class="sign">HARD HAT</div></div>
  <div class="leaf r"><div class="sign">AREA</div></div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ANIM = !reduceMotion;

  // ---------- Keys shared by every Construction Site page ----------
  var GEAR_KEY = "site-gear";
  var STATIONS = [
    { id: "excavator", label: "Excavator" },
    { id: "concrete", label: "Concrete" },
    { id: "forklift", label: "Forklift" },
    { id: "wrecking-ball", label: "Wrecking ball" },
    { id: "tower-crane", label: "Tower crane" }
  ];
  // If sessionStorage is blocked, treat the gear as on so nobody gets stuck in a redirect loop.
  function gearIsOn() { try { return sessionStorage.getItem(GEAR_KEY) === "on"; } catch (e) { return true; } }
  var NEXT = (function () {
    var q = {};
    location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
      var i = kv.indexOf("=");
      if (i > 0) { try { q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); } catch (e) { /* ignore */ } }
    });
    for (var i = 0; i < STATIONS.length; i++) if (STATIONS[i].id === q.next) return q.next + ".html";
    return "";
  })();

  // ---------- SVG helpers ----------
  var INK = "#1D2340", YEL = "#FFC93C", YEL2 = "#F2AE1C", GLASS = "#BFE6FF", TRACK = "#2F3447", STEEL = "#9AA5B1", DIRT = "#A0632F", DIRT2 = "#7E4A22";
  function P(d, fill, sw, extra) { return '<path d="' + d + '" fill="' + (fill || "none") + '" stroke="' + INK + '" stroke-width="' + (sw == null ? 4 : sw) + '" stroke-linejoin="round" stroke-linecap="round"' + (extra || "") + "/>"; }
  function S(d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linejoin="round" stroke-linecap="round"/>'; }
  function Rc(x, y, w, h, rx, fill, sw, extra) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 0) + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (sw == null ? 4 : sw) + '"' + (extra || "") + "/>"; }
  function C(cx, cy, r, fill, sw, extra) { return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (sw == null ? 4 : sw) + '"' + (extra || "") + "/>"; }
  function Ln(x1, y1, x2, y2, col, w) { return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>'; }
  function rod(x1, y1, x2, y2, w) { return Ln(x1, y1, x2, y2, INK, w + 5) + Ln(x1, y1, x2, y2, "#DDE4EE", w); }
  function shadow(cx, cy, rx, ry) { return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="rgba(70,40,10,0.22)"/>'; }
  function spline(n) { var a = []; for (var i = 0; i < n; i++) a.push(".45 0 .55 1"); return a.join(";"); }
  function swing(cx, cy, a, dur, begin) {
    if (!ANIM) return "";
    return '<animateTransform attributeName="transform" type="rotate" values="' + (-a) + " " + cx + " " + cy + ";" + a + " " + cx + " " + cy + ";" + (-a) + " " + cx + " " + cy +
      '" keyTimes="0;.5;1" calcMode="spline" keySplines="' + spline(2) + '" dur="' + dur + 's" begin="' + (begin || 0) + 's" repeatCount="indefinite"/>';
  }
  // A blinking amber beacon light on a cab roof.
  function beacon(x, y, delay) {
    var o = Rc(x - 10, y - 2, 20, 7, 2, "#4A5066", 3);
    o += P("M" + (x - 8) + " " + (y - 2) + " Q" + x + " " + (y - 20) + " " + (x + 8) + " " + (y - 2) + " Z", "#FF8A00", 3,
      ANIM ? "><animate attributeName=\"fill\" values=\"#FF8A00;#FFE14D;#FF8A00\" dur=\"1.1s\" begin=\"" + delay + "s\" repeatCount=\"indefinite\"/></path><g style=\"display:none\"" : "");
    if (ANIM) o += '<circle cx="' + x + '" cy="' + (y - 9) + '" r="17" fill="#FFD23F" opacity="0" pointer-events="none"><animate attributeName="opacity" values="0;0.55;0" dur="1.1s" begin="' + delay + 's" repeatCount="indefinite"/></circle>';
    return o;
  }
  function wheel(cx, cy, r) { return C(cx, cy, r, TRACK, 4) + C(cx, cy, r * 0.45, "#C9D3E0", 3) + C(cx, cy, r * 0.12, INK, 0); }
  function track(x, y, w, h, n) {
    var o = Rc(x, y, w, h, h / 2, TRACK, 4);
    o += '<rect x="' + (x + 5) + '" y="' + (y + 5) + '" width="' + (w - 10) + '" height="' + (h - 10) + '" rx="' + (h / 2 - 5) + '" fill="none" stroke="#565C73" stroke-width="4" stroke-dasharray="5 7"/>';
    for (var i = 0; i < n; i++) { var cx = x + h / 2 + i * (w - h) / (n - 1); o += C(cx.toFixed(1), y + h / 2, h * 0.24, STEEL, 3); }
    return o;
  }

  // ---------- Machines (each drawn in a 500 x 400 tile) ----------
  function dumpTruck() {
    var o = shadow(100, 103, 100, 8);
    o += Rc(18, 66, 172, 12, 3, "#4A5066", 4);
    o += P("M10 22 L132 22 L132 68 L24 68 Z", "#F77F00", 4);
    o += Ln(40, 26, 42, 64, INK, 3) + Ln(70, 26, 70, 64, INK, 3) + Ln(100, 26, 100, 64, INK, 3);
    o += P("M14 24 Q46 -8 88 2 Q118 8 128 24 Z", DIRT, 4) + C(50, 10, 3, DIRT2, 0) + C(80, 6, 3, DIRT2, 0) + C(104, 14, 3, DIRT2, 0);
    o += P("M136 68 L136 26 L170 26 L194 50 L194 68 Z", YEL, 4) + P("M142 32 L167 32 L185 50 L142 50 Z", GLASS, 3);
    o += wheel(40, 86, 16) + wheel(72, 86, 16) + wheel(168, 86, 16);
    return o;
  }
  function excavator(anim) {
    var o = '<g transform="translate(178 150) scale(-0.8 0.8)">' + dumpTruck() + beacon(152, 26, 0.5) + "</g>";
    if (!anim) o = "";
    o += shadow(170, 300, 100, 12);
    o += track(88, 258, 164, 40, 5);
    o += Rc(120, 248, 98, 12, 3, "#4A5066", 4);
    o += P("M84 250 L84 204 Q84 194 96 194 L200 194 L226 206 L226 250 Z", YEL, 4);
    o += Rc(68, 206, 22, 42, 8, "#4A5066", 4);
    o += Ln(100, 214, 132, 214, INK, 3) + Ln(100, 224, 132, 224, INK, 3) + Ln(100, 234, 132, 234, INK, 3);
    o += Rc(100, 176, 10, 20, 2, "#4A5066", 3);
    o += P("M176 196 L176 134 Q176 126 184 126 L212 126 L230 160 L230 196 Z", YEL, 4) + P("M184 136 L208 136 L222 162 L222 186 L184 186 Z", GLASS, 3) + Ln(190, 178, 204, 142, "rgba(255,255,255,0.8)", 4);
    o += P("M206 226 Q236 140 294 98 L314 114 Q256 160 228 232 Z", YEL, 4);
    o += rod(200, 236, 252, 160, 5);
    // Arm and bucket bob a little, like the operator is waiting.
    o += "<g>" + (anim ? swing(304, 106, 3, 3.6, 0) : "");
    o += rod(290, 96, 334, 150, 4);
    o += P("M294 102 L314 96 L362 208 L344 216 Z", YEL, 4);
    o += P("M340 206 L374 202 Q390 236 364 254 L336 252 Q350 232 340 206 Z", "#5B6476", 4);
    o += C(304, 106, 6, "#C9D3E0", 3) + C(352, 210, 5, "#C9D3E0", 3);
    o += "</g>";
    o += P("M300 304 Q330 232 382 224 Q436 228 474 304 Z", DIRT, 4);
    o += S("M330 262 Q352 240 380 236", "#C08850", 6);
    o += C(360, 270, 4, DIRT2, 0) + C(410, 252, 5, DIRT2, 0) + C(430, 284, 4, DIRT2, 0) + C(388, 290, 3, DIRT2, 0);
    if (anim) o += beacon(196, 126, 0.3);
    return o;
  }
  function mixer(anim) {
    var o = "";
    if (anim) {
      // The empty road form: gravel bed, steel mesh, wooden boards and stakes.
      o += '<polygon points="244,238 482,238 494,318 230,318" fill="#BBA98A"/>';
      for (var i = 0; i < 26; i++) o += '<circle cx="' + (250 + (i * 37) % 232) + '" cy="' + (248 + (i * 23) % 62) + '" r="2.5" fill="#8C7B60"/>';
      for (var k = 1; k < 4; k++) { var yy = 238 + k * 20; o += Ln(244 - k * 3.5, yy, 482 + k * 3, yy, "#B5522B", 2.5); }
      for (var m = 1; m < 8; m++) { var t = m / 8; o += Ln(244 + t * 238, 238, 230 + t * 264, 318, "#B5522B", 2.5); }
      o += '<polygon points="244,238 482,238 494,318 230,318" fill="none" stroke="' + INK + '" stroke-width="14" stroke-linejoin="round"/>';
      o += '<polygon points="244,238 482,238 494,318 230,318" fill="none" stroke="#D9A066" stroke-width="7" stroke-linejoin="round"/>';
      [[240, 228], [362, 228], [486, 228], [226, 314], [362, 326], [498, 314]].forEach(function (s) { o += Rc(s[0] - 4, s[1] - 8, 8, 18, 1, "#B5793A", 3); });
    }
    o += shadow(126, 300, 122, 12);
    o += Rc(18, 250, 216, 14, 3, "#4A5066", 4);
    o += P("M96 252 L104 228 L214 210 L226 252 Z", "#5B6476", 4);
    // Drum with orange fins that turn.
    o += '<g transform="rotate(-14 160 204)">';
    o += '<clipPath id="drumClip' + (anim ? "" : "Ic") + '"><ellipse cx="160" cy="204" rx="70" ry="37"/></clipPath>';
    o += '<ellipse cx="160" cy="204" rx="70" ry="37" fill="#E8ECF2"/>';
    o += '<g clip-path="url(#drumClip' + (anim ? "" : "Ic") + ')"><g>';
    for (var f = -2; f < 8; f++) { var x0 = 84 + f * 28; o += P("M" + x0 + " 160 L" + (x0 + 12) + " 160 L" + (x0 + 34) + " 250 L" + (x0 + 22) + " 250 Z", "#F77F00", 0); }
    if (anim && ANIM) o += '<animateTransform attributeName="transform" type="translate" from="0 0" to="28 0" dur="1.4s" repeatCount="indefinite"/>';
    o += "</g></g>";
    o += '<ellipse cx="160" cy="204" rx="70" ry="37" fill="none" stroke="' + INK + '" stroke-width="4"/>';
    o += '<ellipse cx="228" cy="204" rx="8" ry="18" fill="#5B6476" stroke="' + INK + '" stroke-width="4"/>';
    o += "</g>";
    o += P("M232 172 L258 166 L250 188 L238 190 Z", "#8A94A6", 4); // hopper
    o += rod(238, 196, 244, 250, 3);
    // Chute swung out over the road form.
    o += Ln(242, 204, 296, 238, INK, 16) + Ln(242, 204, 296, 238, "#8A94A6", 9);
    o += P("M14 262 L14 222 L30 190 L84 190 L84 262 Z", YEL, 4) + P("M24 222 L36 198 L74 198 L74 222 Z", GLASS, 3) + Ln(44, 218, 56, 202, "rgba(255,255,255,0.8)", 4);
    o += Rc(6, 248, 18, 14, 3, "#8A94A6", 3);
    o += wheel(50, 282, 18) + wheel(166, 282, 18) + wheel(204, 282, 18);
    if (anim) o += beacon(58, 190, 0.7);
    return o;
  }
  function crane(anim) {
    var o = "";
    if (anim) {
      // The old brick building.
      o += shadow(426, 300, 76, 8);
      o += Rc(358, 116, 136, 184, 2, "#B5523A", 4);
      o += '<rect x="360" y="118" width="132" height="180" fill="url(#bricks)"/>';
      o += Rc(350, 104, 152, 16, 3, "#8E3B2A", 4);
      [[374, 136], [440, 136], [374, 190], [440, 190]].forEach(function (w, i) {
        o += Rc(w[0], w[1], 38, 40, 3, "#2B3A67", 3) + Ln(w[0] + 19, w[1] + 2, w[0] + 19, w[1] + 38, "#F4E7D3", 3) + Ln(w[0] + 2, w[1] + 20, w[0] + 36, w[1] + 20, "#F4E7D3", 3);
        o += Rc(w[0] - 3, w[1] + 38, 44, 6, 1, "#D9C7A8", 3);
        if (i === 1) o += S("M" + (w[0] + 6) + " " + (w[1] + 4) + " L" + (w[0] + 14) + " " + (w[1] + 14) + " L" + (w[0] + 10) + " " + (w[1] + 22), "#F4E7D3", 2.5);
      });
      o += Rc(410, 248, 32, 50, 3, "#6B4A2E", 3) + C(436, 274, 2.5, "#F4E7D3", 0);
      o += P("M472 116 L466 140 L476 156", "none", 3);
    }
    o += shadow(118, 300, 96, 11);
    o += track(40, 260, 150, 38, 5);
    o += Rc(74, 250, 88, 12, 3, "#4A5066", 4);
    o += Rc(26, 204, 36, 46, 6, "#4A5066", 4);
    o += P("M54 252 L54 206 Q54 196 64 196 L176 196 L176 252 Z", YEL, 4);

    placeRect = {};
    scene.classList.toggle("lbl-s", L.s < 0.6);
    places.forEach(function (p) { placeRect[p.st.id] = [(p.x + 12) * L.s, (p.y + 22) * L.s, 476 * L.s, 366 * L.s]; });
    if (mp) mp.layout();
  }
  // ---------- The map's places (Toybox.map) ----------
  var placeRect = {}, mp = null;
  function makeMap() {
    mp = Toybox.map({
      stage: scene,
      places: STATIONS.map(function (st) {
        return { href: st.id + ".html", name: st.label, pic: '<svg viewBox="' + ICONBOX[st.id] + '">' + ART[st.id](false) + "</svg>",
          rect: function () { return placeRect[st.id] || null; } };
      }),
      onPress: function (pl) { if (ghost) ghost.learned("map"); goStation(pl.href.replace(".html", "")); }
    });
  }

  // ---------- Going to a station ----------
  var going = false;
  function goStation(id) {
    if (going || locked()) return;
    going = true;
    honk();
    var m = $("m-" + id), inner = m && m.firstChild;
    if (m) {
      var r = m.getBoundingClientRect();
      for (var i = 0; i < 14; i++) puff(r.left + r.width * rand(0.15, 0.85), r.bottom - r.height * 0.1, i);
    }
    var t0 = performance.now(), dur = reduceMotion ? 1 : 520;
    (function hop(t) {
      var k = Math.min(1, (t - t0) / dur);
      if (inner) inner.setAttribute("transform", "translate(0 " + (-Math.sin(k * Math.PI) * 26).toFixed(1) + ")");
      if (k < 1) requestAnimationFrame(hop);
    })(t0);
    // Toybox.map goes to the station a moment later; coming back (back/forward cache) resets this.
    setTimeout(function () { going = false; }, 1500);
  }
  function puff(x, y, i) {
    var d = document.createElement("div"), s = rand(16, 36);
    d.className = "puff";
    d.style.width = d.style.height = s + "px";
    d.style.background = ["#E2C79C", "#C99B63", "#F1E1C2"][i % 3];
    document.body.appendChild(d);
    var dx = rand(-90, 90), dy = rand(-70, -10);
    if (!d.animate || reduceMotion) { setTimeout(function () { d.remove(); }, 300); return; }
    d.animate([{ transform: "translate(" + (x - s / 2) + "px," + (y - s / 2) + "px) scale(0.4)", opacity: 0.95 },
      { transform: "translate(" + (x - s / 2 + dx) + "px," + (y - s / 2 + dy) + "px) scale(1.4)", opacity: 0 }], { duration: rand(500, 800), easing: "ease-out" }).onfinish = function () { d.remove(); };
  }
  window.addEventListener("pageshow", function (e) {
    going = false;
    Array.prototype.forEach.call(mapSvg.querySelectorAll(".mach > g"), function (g) { g.removeAttribute("transform"); });
  });

  // ---------- Worker and the gear-up (Toybox.gate: one tap on the worker puts everything on) ----------
  var SKIN = "#F2C49B";
  var HAT_D = "M64 62 Q64 20 100 20 Q136 20 136 62 Z", BRIM = [54, 56, 92, 12];
  var VEST_L = "M62 118 Q62 106 76 104 L86 104 L98 150 L98 198 L62 198 Z", VEST_R = "M138 118 Q138 106 124 104 L114 104 L102 150 L102 198 L138 198 Z";
  function hatSVG(fill, sw, extra) {
    return P(HAT_D, fill, sw, extra) + Rc(BRIM[0], BRIM[1], BRIM[2], BRIM[3], 6, fill, sw, extra) + (fill === "none" ? "" : Rc(95, 22, 10, 36, 4, YEL2, 3));
  }
  function vestSVG(fill, sw, extra) {
    var o = P(VEST_L, fill, sw, extra) + P(VEST_R, fill, sw, extra);
    if (fill !== "none") o += Rc(62, 164, 36, 9, 0, "#E6EEF7", 3) + Rc(102, 164, 36, 9, 0, "#E6EEF7", 3) + Rc(74, 106, 7, 58, 0, "#E6EEF7", 3) + Rc(119, 106, 7, 58, 0, "#E6EEF7", 3);
    return o;
  }
  function gogSVG(fill, sw, extra) {
    var on = fill !== "none";
    var o = Rc(63, 69, 74, 8, 3, on ? "#2E9E5B" : "none", sw, extra);
    o += Rc(74, 63, 52, 22, 10, on ? fill : "none", sw, extra);
    if (on) o += Rc(79, 67, 19, 14, 6, GLASS, 3, ' fill-opacity="0.55"') + Rc(102, 67, 19, 14, 6, GLASS, 3, ' fill-opacity="0.55"') + P("M82 70 L88 70", "none", 2.5, ' stroke="#FFFFFF"') + P("M105 70 L111 70", "none", 2.5, ' stroke="#FFFFFF"');
    return o;
  }
  function mufSVG(fill, sw, extra) {
    var on = fill !== "none";
    var o = P("M60 66 Q60 26 100 26 Q140 26 140 66", "none", on ? 9 : sw, extra);
    if (on) o += P("M60 66 Q60 26 100 26 Q140 26 140 66", "none", 4, ' stroke="#E63946"');
    o += Rc(50, 58, 20, 32, 9, on ? fill : "none", sw, extra) + Rc(130, 58, 20, 32, 9, on ? fill : "none", sw, extra);
    if (on) o += Rc(66, 63, 6, 22, 3, "#1D2340", 0) + Rc(128, 63, 6, 22, 3, "#1D2340", 0);
    return o;
  }
  // Dashed outlines on the worker show where each piece goes (covered once it is on).
  var DASH = ' stroke-dasharray="7 6" stroke="#2D5BD7"';
  function tgtG(svg) { return '<g class="tgt">' + svg.replace(/stroke="#1D2340" /g, "") + "</g>"; }
  // The worker, in a 3:4 box (the gate's worker frame).
  var WORKER_VB = "-11 -2 222 296";
  function workerSVG() {
    var o = shadow(100, 284, 64, 8);
    o += P("M62 258 L96 258 L98 282 L54 282 Q54 266 62 258 Z", "#7A4B1E", 4) + P("M138 258 L104 258 L102 282 L146 282 Q146 266 138 258 Z", "#7A4B1E", 4);
    o += P("M64 198 L136 198 L134 262 L106 262 L100 222 L94 262 L66 262 Z", "#34508F", 4);
    o += Rc(40, 108, 24, 76, 12, "#3A86FF", 4) + Rc(136, 108, 24, 76, 12, "#3A86FF", 4);
    o += C(52, 188, 11, SKIN, 4) + C(148, 188, 11, SKIN, 4);
    o += Rc(92, 96, 16, 12, 2, SKIN, 3);
    o += P("M62 198 L62 120 Q62 104 80 104 L120 104 Q138 104 138 120 L138 198 Z", "#3A86FF", 4);
    o += Rc(62, 190, 76, 10, 2, "#4A3420", 3);
    o += tgtG(vestSVG("none", 3, DASH));
    o += C(100, 70, 33, SKIN, 4);
    o += P("M67 64 Q66 36 100 36 Q134 36 133 64 Q118 50 100 52 Q82 50 67 64 Z", "#6B3E1E", 4);
    o += C(88, 72, 4.5, INK, 0) + C(112, 72, 4.5, INK, 0) + C(80, 84, 5, "#F59BA0", 0) + C(120, 84, 5, "#F59BA0", 0);
    o += P("M88 86 Q100 97 112 86", "none", 4);
    o += tgtG(gogSVG("none", 3, DASH)) + tgtG(mufSVG("none", 3, DASH)) + tgtG(hatSVG("none", 3, DASH));
    return o;
  }
  function pic(vb, body) { return '<svg viewBox="' + vb + '">' + body + "</svg>"; }
  function confetti(x, y, n) {
    if (reduceMotion) n = Math.min(n, 6);
    var cols = ["#FFC93C", "#F77F00", "#3A86FF", "#2E9E5B", "#FF5DA2"];
    for (var i = 0; i < n; i++) {
      var d = document.createElement("div");
      d.className = "confetti";
      d.style.background = cols[i % cols.length];
      document.body.appendChild(d);
      var a = rand(0, Math.PI * 2), sp = rand(80, 260), dx = Math.cos(a) * sp, dy = Math.sin(a) * sp - 60;
      if (!d.animate) { d.remove(); continue; }
      d.animate([{ transform: "translate(" + (x - 6) + "px," + (y - 6) + "px) rotate(0deg)", opacity: 1 },
        { transform: "translate(" + (x - 6 + dx) + "px," + (y - 6 + dy + 140) + "px) rotate(" + rand(-400, 400) + "deg)", opacity: 0 }],
        { duration: rand(700, 1100), easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = (function (el) { return function () { el.remove(); }; })(d);
    }
  }
  var gt = null, gateEl = $("gate");
  function gearOpen() { return !!(gt && !gt.el.hidden); }
  // The gear-up screen, on top of the closed site gate.
  function showGearUp() {
    clearTimeout(gateTimer); opening = false;
    gateEl.hidden = false;
    gateEl.classList.add("instant");
    gateEl.classList.remove("open");
    void gateEl.offsetWidth;
    gateEl.classList.remove("instant");
    if (gt && gt.el.parentNode) gt.el.parentNode.removeChild(gt.el);
    gt = Toybox.gate({
      flag: GEAR_KEY,
      title: "Gear up!",
      viewBox: WORKER_VB,
      worker: workerSVG(),
      workerLabel: "Gear up: hard hat, safety vest, eye protection and ear protection",
      hint: "Tap the worker to gear up!",
      ms: 1600,
      items: [
        { id: "hat", name: "Hard hat", art: pic("50 14 100 60", hatSVG(YEL, 4)), onArt: hatSVG(YEL, 4) },
        { id: "vest", name: "Safety vest", art: pic("54 98 92 104", vestSVG("#FF7A1A", 4)), onArt: vestSVG("#FF7A1A", 4) },
        { id: "gog", name: "Eye protection", art: pic("56 50 88 46", gogSVG("#FF7A1A", 4)), onArt: gogSVG("#FF7A1A", 4) },
        { id: "muf", name: "Ear protection", art: pic("46 20 108 74", mufSVG("#E63946", 4)), onArt: mufSVG("#E63946", 4) }
      ],
      onPut: function () { if (ghost) ghost.learned("gate"); pop(); },
      done: gearDone
    });
    // A way home for the grown-up (nothing traps him).
    var home = document.createElement("a");
    home.className = "btn tb-iconbtn gate-home";
    home.href = "../";
    home.setAttribute("aria-label", "Back to Toybox");
    home.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>';
    gt.el.appendChild(home);
    gt.el.classList.add("tb-v2");
    if (ghost) ghost.again("gate");
  }
  // Dressed: a cheer, then the gate swings open onto the site (or straight on to the station he was going to).
  function gearDone() {
    var w = gt && gt.el.querySelector(".tb-gate-worker");
    if (w) { var r = w.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height * 0.3, 40); }
    chime();
    if (NEXT && !locked()) { location.replace(NEXT); return; }
    openGate();
    coach.say("Hard hat on! Pick a machine!", 3);
    if (ghost) ghost.again("map");
  }
  // Gate states: closed (under the gear-up, or at the end of play) or open (hidden).
  var gateTimer = null, opening = false;
  function openGate() {
    if (opening || locked()) return;
    opening = true;
    creak();
    gateTimer = setTimeout(function () {
      gateEl.classList.add("open");
      gateTimer = setTimeout(function () { gateEl.hidden = true; opening = false; }, reduceMotion ? 350 : 1350);
    }, reduceMotion ? 50 : 200);
  }
  function openGateQuiet() {
    clearTimeout(gateTimer); opening = false;
    if (gateEl.hidden) return;
    gateEl.classList.add("open");
    gateTimer = setTimeout(function () { gateEl.hidden = true; }, reduceMotion ? 350 : 1350);
  }
  function closeGate() {
    clearTimeout(gateTimer); opening = false;
    if (gateEl.hidden) {
      gateEl.hidden = false;
      gateEl.classList.add("instant", "open");
      void gateEl.offsetWidth;
      gateEl.classList.remove("instant");
      void gateEl.offsetWidth;
    }
    gateEl.classList.remove("open");
    creak();
  }

  // ---------- Sound (off by default; soft and synthesized) ----------
  // The on/off setting and the AudioContext are shared Toybox-wide (common/toybox.js); the module
  // starts the audio on a tap while sound is on. This page keeps its own master gain per context.
  var master = null, masterCtx = null;
  function out(ac) { if (masterCtx !== ac) { master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination); masterCtx = ac; } return master; }
  function tone(freq, dur, vol, type, slideTo, delay) {
    var ac = Toybox.sound.ready();
    if (!ac) return;
    var t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out(ac));
    o.start(t); o.stop(t + dur + 0.05);
  }
  function blip() { tone(rand(520, 720), 0.14, 0.04, "sine", 880); }
  function pop() { tone(380, 0.12, 0.05, "sine", 620); }
  function honk() { tone(440, 0.16, 0.035, "triangle"); tone(440, 0.2, 0.035, "triangle", null, 0.22); }
  function creak() { tone(180, 0.9, 0.03, "triangle", 120); }
  function chime() { tone(523, 0.4, 0.04); tone(784, 0.6, 0.04, "sine", null, 0.12); }

  // ---------- Play timer hooks (the timer, sheet, toast and rest screen live in common/toybox.js) ----------
  // The timer is the shared Toybox one, so it keeps going on every Construction Site page (and every app).
  // Ending: the machines stop and "Close the gate" (or, with that button turned off, the gate by itself
  // after a few seconds) swings the gate shut, then the site rests.
  function locked() { return Toybox.timer.locked(); }
  var endTimers = [];
  function clearEndTimers() { endTimers.forEach(clearTimeout); endTimers = []; }
  // Fuel gauge on the map: the bar is the time left.
  function drawTimer(info) {
    var active = info.phase === "running" || info.phase === "ending";
    $("fuel").hidden = !active;
    if (!active) return;
    var f = info.fraction, fill = $("fuelFill");
    fill.style.width = (f * 100).toFixed(1) + "%";
    fill.style.background = f > 0.5 ? "#2E9E5B" : (f > 0.2 ? "#FFC93C" : "#F77F00");
    $("fuelNum").hidden = !(info.showMinutes && info.phase === "running");
    $("fuelNum").textContent = String(info.minutes);
  }
  function onEnding(done, info) {
    clearEndTimers();
    // The machines stop: beacons, flags and the swinging ball all hold still.
    try { mapSvg.pauseAnimations(); } catch (e) { /* ignore */ }
    // Mid gear-up: the gear-up goes (it comes back after the rest) and the gate stays shut.
    if (gearOpen()) { gt.hide(); clearTimeout(gateTimer); opening = false; gateEl.classList.remove("open"); }
    if (info.goodbye) { done(); return; }
    endTimers.push(setTimeout(closeGate, 3000));
    endTimers.push(setTimeout(done, 4400));
  }
  function goodbye() { closeGate(); chime(); }
  function onWake() {
    clearEndTimers();
    try { mapSvg.unpauseAnimations(); } catch (e) { /* ignore */ }
    if (!gearIsOn()) { if (!gearOpen()) showGearUp(); } else openGateQuiet();
  }
  function restArt() {
    var o = '<rect width="400" height="300" fill="#2B3A67"/>';
    o += '<circle cx="330" cy="56" r="26" fill="#FFF4CC" stroke="#1D2340" stroke-width="3"/><circle cx="342" cy="48" r="22" fill="#2B3A67"/>';
    [[60, 40], [120, 70], [210, 34], [270, 90], [36, 110]].forEach(function (s) { o += '<circle cx="' + s[0] + '" cy="' + s[1] + '" r="3" fill="#FFF4CC"/>'; });
    o += '<rect y="214" width="400" height="86" fill="#8C6A44"/><line x1="0" y1="214" x2="400" y2="214" stroke="#1D2340" stroke-width="4"/>';
    o += '<g transform="translate(-22 76) scale(0.52)">' + excavator(false) + "</g>";
    o += '<g transform="translate(150 66) scale(0.52)">' + mixer(false) + "</g>";
    o += cone(380, 236, 0.9);
    o += '<text x="120" y="110" font-family="Baloo 2, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">z</text><text x="146" y="86" font-family="Baloo 2, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">z</text><text x="166" y="66" font-family="Baloo 2, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">z</text>';
    return '<svg class="rest-art" viewBox="0 0 400 300" aria-hidden="true">' + o + "</svg>";
  }

  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { if (!e.target.closest || !e.target.closest("input")) e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { if (!e.target.closest || !e.target.closest(".sheet")) e.preventDefault(); }, { passive: false });

  var buildPending = false, lastSize = "";
  function scheduleBuild() {
    if (buildPending) return;
    buildPending = true;
    requestAnimationFrame(function () {
      buildPending = false;
      var key = scene.clientWidth + "x" + scene.clientHeight;
      if (key === lastSize) return;
      lastSize = key;
      buildMap();
    });
  }
  window.addEventListener("resize", scheduleBuild);
  window.addEventListener("orientationchange", function () { setTimeout(scheduleBuild, 200); });

  // ---------- Start ----------
  Toybox.init({
    app: "construction-site",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the machines park, the gate closes, and the controls lock. The timer keeps going on every Construction Site page.",
    goodbyeOption: "End with a “Close the gate” button to press",
    farewellText: "Time to close the site",
    goodbyeLabel: "Close the gate",
    farewellDone: "Bye bye, machines!",
    restLine: "The site is resting.",
    restLine2: "The machines will be right here next time.",
    restArt: restArt,
    soundNote: "Soft beeps and engine hums. Hold for 2 seconds.",
    legacy: { timer: "site-timer-v1", sound: "site-sound-v1", big: "site-big-v1" },
    onEnding: onEnding,
    onGoodbye: goodbye,
    onRest: function () { clearEndTimers(); try { mapSvg.pauseAnimations(); } catch (e) { /* ignore */ } },
    onWake: onWake,
    onBig: scheduleBuild,
    onSound: function (on) { if (on) chime(); },
    onTimer: drawTimer
  });
  // ---------- Coach line and ghost hand ----------
  var coach = Toybox.coach($("coach"));
  coach.step("Tap a machine!");
  function midOf(el) { var r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
  // Idle help: tap the worker to gear up; on the map, tap a machine.
  var ghost = Toybox.ghost({
    max: 2,
    plan: function () {
      if (gearOpen()) {
        var w = gt.el.querySelector(".tb-gate-worker");
        return w ? { pts: [midOf(w)], tap: true, key: "gate" } : null;
      }
      if (!gateEl.hidden) return null;
      var go = mp && mp.places[0];
      return go && !go.hidden ? { pts: [midOf(go)], tap: true, key: "map" } : null;
    }
  });
  makeMap();
  scheduleBuild();
  if (gearIsOn()) {
    if (NEXT && Toybox.timer.phase() !== "resting") { location.replace(NEXT); }
  } else if (!locked()) {
    showGearUp();
  }

  // Test hook, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) {
    window.__site = {
      layout: function () { return L && { cols: L.cols, rows: L.rows, s: L.s }; },
      gear: function () { return { hat: !!(gt && gt.isOn("hat")), vest: !!(gt && gt.isOn("vest")), gog: !!(gt && gt.isOn("gog")), muf: !!(gt && gt.isOn("muf")), on: gearIsOn(), gearUp: gearOpen(), gateHidden: gateEl.hidden }; },
      phase: function () { return Toybox.timer.phase(); },
      ghost: function () { return ghost.show(); }
    };
  }
})();
</script>
</body>
</html>
