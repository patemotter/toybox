<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tower Crane</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Construction">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }
.stage { background: #A9DCFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv.grabbing { cursor: grabbing; }
.count { font-variant-numeric: tabular-nums; }
.count.pop { animation: pop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
/* The hint is the coach line (tb-coach). */
.hint { background: var(--accent); }
.hint[hidden] { display: none; }
.hint.go { animation: hintPop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hintPop { 0% { transform: translateX(-50%) scale(0.3); } 100% { transform: translateX(-50%) scale(1); } }

/* Play-timer gauge: the time-left badge, top-right of the stage. */
.fuel { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.fuel[hidden] { display: none; }
.fuel-bar { width: clamp(60px, 14vw, 140px); height: 18px; background: rgba(255, 255, 255, 0.8); border: 3px solid #1D2340; border-radius: 999px; overflow: hidden; }
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num { min-width: 40px; height: 40px; display: grid; place-items: center; background: #FFFFFF; color: #1D2340; border: 3px solid #1D2340; border-radius: 50%; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.fuel-num[hidden] { display: none; }

/* Big: full-screen play. Dragging the hook is the play, so the panel goes too. */
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel { display: none; }

/* ---------- Panel: Lift! (Go row), New building (tab bar) ---------- */
.act { display: flex; align-items: center; justify-content: center; gap: 8px; }
.act svg { width: 40px; height: 40px; flex: none; pointer-events: none; }
.act span { pointer-events: none; }
.tb-go.act svg { width: 46px; height: 46px; }
.tb-tabs .act svg { width: 30px; height: 30px; }
.tb-new.wiggle { animation: wiggle 0.7s ease-in-out 2; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg) scale(1.05); } 75% { transform: rotate(4deg) scale(1.05); } }
body.ending .tb-panel, body.ending .homebtn, body.ending .mapbtn { pointer-events: none; opacity: 0.4; }

/* ---------- Timer (sheet, toast, banner and rest screen come from common/toybox.css) ---------- */
.rest-art { width: min(70vw, 300px, 40vh); aspect-ratio: 6 / 5; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }

@media (max-width: 600px) {
  .tb-go.act svg { width: 38px; height: 38px; }
  .hint { white-space: normal; line-height: 1.15; }
}
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(22%, 220px); }
  .tb-go.act { flex: 0 1 200px; min-height: 120px; flex-direction: column; gap: 2px; }
  .tb-go.act svg { width: 70px; height: 70px; }
  .tb-tabs { margin-top: auto; }
  .tb-tabs .btn { min-height: 64px; white-space: normal; line-height: 1.05; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: 150px; padding: 6px; gap: 6px; }
  .tb-go.act { flex: 1 1 auto; min-height: 0; max-height: 150px; }
  .tb-go.act svg { width: 48px; height: 48px; }
  .tb-tabs .btn { min-height: 54px; }
}
@media (prefers-reduced-motion: reduce) {
  .hint.go, .count.pop, .tb-new.wiggle { animation: none; }
}
</style>
</head>
<body>
<div class="tb-app-shell wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="mapbtn" href="./" aria-label="Back to all machines"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>All machines</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Tower Crane</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls">Big</button>
  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A tower crane next to a building that grows floor by floor"></canvas>
      <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
      <div class="tb-counter count" id="count">Floors: 0</div>
      <div class="tb-coach hint" id="hint" hidden></div>
    </main>
    <section class="tb-panel" id="panel">
      <button class="btn tb-go act" id="liftBtn" aria-label="Lift! The crane does the next piece"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M2 7 H46" stroke="#1D2340" stroke-width="7" stroke-linecap="round"/><path d="M2 7 H46" stroke="#FFC72C" stroke-width="3" stroke-linecap="round"/><rect x="17" y="9" width="14" height="6" rx="2" fill="#6B7385" stroke="#1D2340" stroke-width="2.5"/><path d="M24 15 V21" stroke="#1D2340" stroke-width="2.5"/><rect x="18" y="20" width="12" height="9" rx="2.5" fill="#FFC72C" stroke="#1D2340" stroke-width="2.5"/><path d="M24 29 V32 M24 32 L10 38 M24 32 L38 38" stroke="#1D2340" stroke-width="2.5" stroke-linecap="round" fill="none"/><rect x="5" y="37" width="38" height="7" rx="1.5" fill="#5B6B8C" stroke="#1D2340" stroke-width="2.5"/><path d="M7 40.5 H41" stroke="#8C9BBA" stroke-width="2"/></svg><span>Lift!</span></button>
      <nav class="tb-tabs" id="acts">
        <button class="btn tb-new act" id="newBtn"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="12" width="28" height="32" fill="#C8553D" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><rect x="7" y="8" width="34" height="6" fill="#5B6B8C" stroke="#1D2340" stroke-width="3"/><rect x="14" y="18" width="8" height="8" fill="#9FD6F5" stroke="#1D2340" stroke-width="2.5"/><rect x="26" y="18" width="8" height="8" fill="#9FD6F5" stroke="#1D2340" stroke-width="2.5"/><rect x="14" y="30" width="8" height="8" fill="#9FD6F5" stroke="#1D2340" stroke-width="2.5"/><rect x="26" y="32" width="8" height="12" fill="#7A4B22" stroke="#1D2340" stroke-width="2.5"/></svg><span>New building</span></button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Safety gear check (once per visit, on the site map) ----------
  var gearOn = true;
  try { gearOn = sessionStorage.getItem("site-gear") === "on"; } catch (e) { gearOn = true; }
  if (!gearOn) { location.replace("./?next=tower-crane"); return; }

  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function sgn(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  var OUT = "#1D2340";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var STATEKEY = "site-crane-v1";

  // ---------- World (units; y is up, ground at y = 0) ----------
  var WORLD_L = -175, WORLD_R = 925, VIEW_UP = 690, VIEW_DOWN = 34, MINW = 480;
  var MAST_L = 62, MAST_R = 118, MAST_C = 90, MAST_TOP = 512;
  var JIB_B = 540, JIB_T = 578, JIB_TIP = 880, CJ_END = -150, APEX_Y = 664;
  var TY = 518;                           // the hoist cable leaves the trolley here
  var TMIN = 214, TMAX = 852;             // trolley travel along the jib
  var LMIN = 60, HOOK_MAX = TY - LMIN;    // shortest cable: hook block just under the trolley
  var SLING = 40;                         // hook to the top of a hanging load
  var BX = 620, BW = 200, BC = 720;       // the building
  var FOUND = 16, FLOOR_H = 64, WALL_H = 50, PIER = 50, FLOORS = 5;
  var DUN = [[422, 444], [556, 578]];     // timber blocks the steel beam lies on
  var DUN_H = 8;
  var G = 900, SWING_K = 0.22;            // pendulum: gravity and how much the trolley's pull swings it

  var KIND = {
    bricks: { w: 64, h: 46, home: 235, name: "bricks", c: 24 },
    window: { w: 100, h: 50, home: 335, name: "window", c: 40 },
    beam: { w: 200, h: 14, home: 500, name: "steel beam", c: 62 },
    tree: { w: 44, h: 64, home: 335, name: "tree", c: 0 }
  };
  var STYLES = [
    { brick: "#C8553D", mortar: "#E9B9A8", dark: "#8E3B2A" },
    { brick: "#D9A066", mortar: "#F3D9B5", dark: "#9C6B38" },
    { brick: "#7E9CC7", mortar: "#C9D8EE", dark: "#4F6E9C" }
  ];

  // ---------- Saved building (a reload keeps it; a fresh visit from the home screen starts empty) ----------
  var floors = 0, cur = { bricks: false, window: false }, topped = false, styleIdx = 0;
  var startFresh = !!(window.Toybox && Toybox.fresh());
  if (!startFresh) try {
    var so = JSON.parse(localStorage.getItem(STATEKEY) || "null");
    if (so && typeof so === "object") {
      if (typeof so.floors === "number") floors = clamp(Math.floor(so.floors), 0, FLOORS);
      cur.bricks = !!so.bricks && floors < FLOORS;
      cur.window = !!so.window && floors < FLOORS;
      topped = !!so.topped && floors === FLOORS;
      if (typeof so.style === "number") styleIdx = Math.abs(Math.floor(so.style)) % STYLES.length;
    }
  } catch (e) { /* ignore */ }
  function saveState() {
    try { localStorage.setItem(STATEKEY, JSON.stringify({ floors: floors, bricks: cur.bricks, window: cur.window, topped: topped, style: styleIdx })); } catch (e) { /* ignore */ }
  }
  if (startFresh) saveState();
  function style() { return STYLES[styleIdx]; }

  // ---------- Loads in the yard ----------
  var loads = [], carried = null, clock = 0;
  function makeLoad(kind, delay) {
    var k = KIND[kind];
    return { kind: kind, x: k.home, y: kind === "beam" ? DUN_H : 0, w: k.w, h: k.h, born: clock + (delay || 0) };
  }
  function spawnLoads(quick) {
    loads = [];
    if (topped) return;
    if (floors >= FLOORS) { loads.push(makeLoad("tree", quick ? 0 : 0.1)); }
    else {
      var d = quick ? 0 : 0.1, n = 0;
      if (!cur.bricks) loads.push(makeLoad("bricks", d + 0.3 * n++));
      if (!cur.window) loads.push(makeLoad("window", d + 0.3 * n++));
      loads.push(makeLoad("beam", d + 0.3 * n++));
    }
    loads.forEach(function (l) { if (!quick) puff(l.x, 6, 0.8, 2); });
  }
  function baseY() { return FOUND + floors * FLOOR_H; }
  function roofY() { return FOUND + FLOORS * FLOOR_H; }
  // Can this piece go into the building now? Bricks and window in any order; the beam goes on last.
  function allowed(kind) {
    if (topped) return false;
    if (kind === "tree") return floors >= FLOORS;
    if (floors >= FLOORS) return false;
    if (kind === "bricks") return !cur.bricks;
    if (kind === "window") return !cur.window;
    return cur.bricks && cur.window;
  }
  function targetBottom(kind) {
    if (kind === "tree") return roofY();
    if (kind === "beam") return baseY() + WALL_H;
    return baseY();
  }
  function nextKind() {
    if (topped) return null;
    if (floors >= FLOORS) return "tree";
    if (!cur.bricks) return "bricks";
    if (!cur.window) return "window";
    return "beam";
  }
  function findLoad(kind) { for (var i = 0; i < loads.length; i++) if (loads[i].kind === kind && loads[i] !== carried) return loads[i]; return null; }
  function ringOf(l) { return { x: l.x, y: l.y + l.h + SLING }; }

  // The highest thing under [x0, x1]: ground, the timber blocks, the building, loads lying there.
  function groundAt(x0, x1, skip) {
    var g = 0, i;
    for (i = 0; i < DUN.length; i++) if (x1 > DUN[i][0] && x0 < DUN[i][1]) g = Math.max(g, DUN_H);
    if (x1 > BX - 12 && x0 < BX + BW + 12) {
      var b = baseY();
      g = Math.max(g, floors >= FLOORS ? roofY() : b);
      if (floors < FLOORS) {
        if (cur.bricks && ((x0 < BX + PIER && x1 > BX) || (x0 < BX + BW && x1 > BX + BW - PIER))) g = Math.max(g, b + WALL_H);
        if (cur.window && x1 > BX + PIER && x0 < BX + BW - PIER) g = Math.max(g, b + WALL_H);
      }
      if (topped && x1 > BC - 22 && x0 < BC + 22) g = Math.max(g, roofY() + KIND.tree.h);
    }
    for (i = 0; i < loads.length; i++) {
      var l = loads[i];
      if (l === skip || l === carried) continue;
      if (x1 > l.x - l.w / 2 && x0 < l.x + l.w / 2) g = Math.max(g, l.y + l.h);
    }
    return g;
  }
  function overBuilding(x, w) { return x + w / 2 > BX - 10 && x - w / 2 < BX + BW + 10; }

  // ---------- The crane: trolley, cable and a gently swinging hook ----------
  var cr = { x: 300, vx: 0, L: 300, vL: 0, th: 0, om: 0, wheel: 0, drum: 0 };
  function hookX() { return cr.x + cr.L * Math.sin(cr.th); }
  function hookY() { return TY - cr.L * Math.cos(cr.th); }
  var tgt = { x: 300, y: 218 };
  var DRAG = { v: 900, a: 3500, lv: 800, la: 3500 };
  var AUTO = { v: 170, a: 150, lv: 125, la: 150 };
  var spd = DRAG;
  var drag = null;            // { id, wx, wy, ox, oy, paused }
  var jobs = [], jobsLocked = false, auto = false, freeMove = false, dragged = false, byHand = false;
  var ending = false, parking = false, parked = false, endingDone = null;
  var lastMove = 0;

  function minHookY(hx) {
    if (carried) return groundAt(hx - carried.w / 2, hx + carried.w / 2, carried) + carried.h + SLING;
    return groundAt(hx - 8, hx + 8, null) + 6;
  }
  // The hanging thing's bottom and half width (for bumping into the building).
  function hangBox(x) {
    var hy = TY - cr.L * Math.cos(cr.th);
    if (carried) return { x0: x - carried.w / 2, x1: x + carried.w / 2, y: hy - SLING - carried.h };
    return { x0: x - 10, x1: x + 10, y: hy - 4 };
  }
  function blocked(x) {
    var b = hangBox(x);
    return b.y < groundAt(b.x0, b.x1, carried) - 0.5;
  }
  function approach(pos, vel, target, vmax, amax, h) {
    var d = target - pos;
    if (Math.abs(d) < 0.4 && Math.abs(vel) < amax * h * 3) return [target, 0];
    var vd = sgn(d) * Math.min(vmax, Math.sqrt(2 * amax * Math.abs(d)) * 0.92);
    var nv = vel + clamp(vd - vel, -amax * h, amax * h);
    var np = pos + nv * h;
    if ((target - np) * d < 0 && Math.abs(nv) < amax * h * 3) { np = target; nv = 0; }
    return [np, nv];
  }
  function physics(h) {
    var tx = clamp(tgt.x, TMIN, TMAX);
    var ty = Math.min(HOOK_MAX, tgt.y);
    if (!freeMove) ty = Math.max(ty, minHookY(hookX()));
    var tL = clamp(TY - ty, LMIN, TY - 2);
    var r = approach(cr.x, cr.vx, tx, spd.v, spd.a, h);
    var nx = clamp(r[0], TMIN, TMAX), nvx = r[1];
    // Bump into the building or a load lying in the way instead of passing through it.
    if (!freeMove && nx !== cr.x) {
      var off = cr.L * Math.sin(cr.th);
      if (blocked(nx + off) && !blocked(cr.x + off)) { nx = cr.x; nvx = 0; }
    }
    var ax = (nvx - cr.vx) / h;
    cr.wheel += (nx - cr.x) / 6;
    cr.x = nx; cr.vx = nvx;
    var rl = approach(cr.L, cr.vL, tL, spd.lv, spd.la, h);
    cr.drum += (rl[0] - cr.L) / 14;
    cr.L = rl[0]; cr.vL = rl[1];
    // Never through the ground or the building: lift out quickly if something is underneath.
    if (!freeMove) {
      var minY = minHookY(hookX()), maxL = TY - minY;
      if (cr.L > maxL + 0.5) { cr.L = Math.max(maxL, cr.L - 700 * h); if (cr.vL > 0) cr.vL = 0; }
    }
    // Pendulum (calm, damped): the trolley's pull swings the hook a little.
    var Lc = Math.max(70, cr.L);
    var resting = carried && (hookY() - SLING - carried.h) <= groundAt(hookX() - carried.w / 2, hookX() + carried.w / 2, carried) + 1.5;
    var damp = resting ? 9 : (freeMove ? 5 : 1.6);
    cr.om += (-(G / Lc) * Math.sin(cr.th) - SWING_K * ax / Lc * Math.cos(cr.th) - damp * cr.om) * h;
    cr.th += cr.om * h;
    if (cr.th > 0.28) { cr.th = 0.28; if (cr.om > 0) cr.om = 0; }
    if (cr.th < -0.28) { cr.th = -0.28; if (cr.om < 0) cr.om = 0; }
  }

  // ---------- Jobs: short scripted moves (hook on, put in place, set down, Lift!) ----------
  function setJobs(list, lock) { jobs = list; jobsLocked = !!lock; }
  function mv(x, y, s, free) { return { t: "move", x: x, y: y, s: s || AUTO, free: !!free }; }
  function fn(f) { return { t: "fn", fn: f }; }
  function wait(s) { return { t: "wait", s: s }; }
  function runJobs(dt) {
    var guard = 0;
    while (jobs.length && guard++ < 8) {
      var j = jobs[0];
      if (j.t === "fn") { jobs.shift(); j.fn(); continue; }
      if (j.t === "wait") { j.s -= dt; if (j.s <= 0) jobs.shift(); return; }
      if (!j.go) {
        j.go = true;
        if (j.x === null) j.x = cr.x;
        if (j.y === null) j.y = hookY();
      }
      tgt.x = j.x; tgt.y = j.y; spd = j.s; freeMove = j.free;
      var tL = clamp(TY - Math.min(HOOK_MAX, j.y), LMIN, TY - 2);
      if (!j.free) tL = Math.min(tL, TY - minHookY(hookX()));
      if (Math.abs(cr.x - clamp(j.x, TMIN, TMAX)) < 0.8 && Math.abs(cr.vx) < 3 && Math.abs(cr.L - tL) < 0.8 && Math.abs(cr.vL) < 3) { jobs.shift(); continue; }
      return;
    }
    if (!jobs.length) { jobsLocked = false; freeMove = false; }
  }
  var SNAP = { v: 600, a: 5000, lv: 600, la: 5000 };
  var PLACE = { v: 260, a: 700, lv: 190, la: 650 };
  var SET = { v: 200, a: 800, lv: 230, la: 800 };

  function startAttach(l) {
    var r = ringOf(l);
    setJobs([mv(l.x, r.y, SNAP, true), fn(function () { attach(l); })], true);
  }
  function attach(l) {
    if (carried || loads.indexOf(l) < 0) return;
    carried = l;
    var r = ringOf(l);
    rings.push({ x: r.x, y: r.y, t: 0 });
    clunk(0.8);
    if (drag) { drag.ox = 0; drag.oy = 0; }
    tgt.x = cr.x; tgt.y = hookY();
  }
  function startPlace() {
    var l = carried, ty = targetBottom(l.kind) + l.h + SLING;
    if (drag) drag.paused = true;

    o += '<circle cx="150" cy="16" r="2" fill="#FFF"/><circle cx="20" cy="22" r="1.6" fill="#FFF"/><circle cx="226" cy="70" r="1.6" fill="#FFF"/><circle cx="118" cy="62" r="2" fill="#FFF"/>';
    o += '<rect y="168" width="240" height="32" fill="#8C5A2E"/><path d="M0 168 H240" stroke="#1D2340" stroke-width="3"/>';
    o += '<g stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">';
    // the building with its tree on top
    o += '<rect x="150" y="98" width="70" height="70" fill="#C8553D"/><path d="M150 120 H220 M150 144 H220" stroke="#5B6B8C" stroke-width="5"/>';
    o += '<rect x="168" y="102" width="34" height="14" fill="#FFE58A"/><rect x="168" y="126" width="34" height="14" fill="#9FD6F5"/><rect x="168" y="150" width="34" height="14" fill="#FFE58A"/>';
    o += '<path d="M178 98 L185 78 L192 98 Z" fill="#2E9E5B"/>';
    // tower crane: mast, jib, counter-jib, cab, hook pulled in
    o += '<path d="M48 160 L62 140 L48 120 L62 100 L48 80 L62 60" fill="none" stroke-width="5"/><path d="M48 160 L62 140 L48 120 L62 100 L48 80 L62 60" fill="none" stroke="#FFC72C" stroke-width="2"/>';
    o += '<path d="M48 168 V54 M62 168 V54" stroke-width="6"/><path d="M48 168 V54 M62 168 V54" stroke="#FFC72C" stroke-width="2.5"/><rect x="40" y="164" width="30" height="6" fill="#B8BEC8"/>';
    o += '<path d="M12 46 H232 M40 54 H226" stroke="#1D2340" stroke-width="5"/><path d="M12 46 H232 M40 54 H226" stroke="#FFC72C" stroke-width="2.5"/>';
    o += '<path d="M55 46 L55 26 M55 26 L140 46 M55 26 L16 46" fill="none" stroke-width="1.6"/>';
    o += '<rect x="12" y="50" width="16" height="22" fill="#B8BEC8"/><rect x="62" y="56" width="18" height="16" rx="3" fill="#FFC72C"/><rect x="68" y="59" width="10" height="9" fill="#9FD6F5"/>';
    o += '<rect x="86" y="54" width="14" height="6" fill="#6B7385"/><path d="M93 60 V70" stroke-width="2"/><rect x="88" y="70" width="10" height="8" rx="2" fill="#FFC72C"/>';
    o += '<circle cx="55" cy="26" r="3" fill="#FF4D4D"/></g>';
    o += '<text x="84" y="104" font-family="Baloo 2, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">z</text><text x="96" y="90" font-family="Baloo 2, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">z</text><text x="106" y="78" font-family="Baloo 2, sans-serif" font-weight="800" font-size="9" fill="#FFFFFF">z</text>';
    return o;
  }
  function restArt() { return '<svg class="rest-art" viewBox="0 0 240 200" aria-hidden="true">' + restSVG() + "</svg>"; }
  function onRest() {
    if (carried) { var l = carried; carried = null; l.x = KIND[l.kind].home; l.y = groundAt(l.x - l.w / 2, l.x + l.w / 2, l); }
    setJobs([], false); auto = false;
    cr.x = TMIN; cr.vx = 0; cr.L = LMIN; cr.vL = 0; cr.th = 0; cr.om = 0;
    tgt.x = TMIN; tgt.y = HOOK_MAX;
    parked = true; parking = false; endingDone = null;
  }
  function onWake() { ending = false; parking = false; parked = false; endingDone = null; coachAgain(); }
  function onBig() { resize(); requestAnimationFrame(resize); }

  // ---------- Loop ----------
  var lastT = 0, humT = 0;
  function loop(t) {
    var dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0.016;
    lastT = t;
    var phase = Toybox.timer.phase();
    if (phase !== "resting") step(dt);
    camera(dt);
    draw(clock);
    coachTick();
    humT += dt; if (humT > 0.1) { humT = 0; humTick(); }
    requestAnimationFrame(loop);
  }

  // ---------- Idle help: the Toybox ghost hand (master copy: tools/snippets/ghost-hand.js) ----------
  // ---------- Ghost hand (same look in every app) ----------
  // After a few quiet seconds, a see-through hand shows the main move once. A touch re-arms it, it shows
  // at most twice per visit, and never again once the child has done the move (ghost.learned()).
  // plan() returns { pts: [[x, y], ...] in page px, tap: true for a tap, carry: { html, size } for a see-through
  // thing under the finger (a gear being dragged), dur: ms } or null when there is nothing to show.
  function makeGhost(plan, opt) {
    opt = opt || {};
    var IDLE = opt.idle || 4500, MAX = opt.max || 2;
    var last = Date.now(), shown = 0, armed = true, learned = false, run = null, el = null;
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    function build() {
      el = document.createElement("div");
      el.className = "ghosthand";
      el.setAttribute("aria-hidden", "true");
      el.innerHTML = '<svg viewBox="-24 -18 64 84"><circle class="gh-press" cx="0" cy="0" r="17" fill="rgba(255,201,60,0.55)"/>' +
        '<g fill="#FFFFFF" stroke="#1D2340" stroke-width="3" stroke-linejoin="round">' +
        '<rect x="-9" y="-6" width="18" height="40" rx="9"/><rect x="-12" y="22" width="44" height="40" rx="16"/>' +
        '<rect x="10" y="14" width="14" height="24" rx="7"/></g>' +
        '<circle cx="0" cy="2" r="5" fill="rgba(255,201,60,0.9)"/></svg>';
      el.insertBefore(carryEl, el.firstChild);
      document.body.appendChild(el);
    }
    function stop() { run = null; if (el) { el.style.display = "none"; carryEl.innerHTML = ""; } }
    var carryEl = document.createElement("div");
    carryEl.className = "gh-carry";
    function poke() { last = Date.now(); armed = true; if (run) stop(); }
    document.addEventListener("pointerdown", poke, true);
    document.addEventListener("keydown", poke, true);
    function blocked() {
      if (document.hidden) return true;
      if (window.Toybox && (Toybox.sheetOpen() || Toybox.timer.phase() === "ending" || Toybox.timer.phase() === "resting")) return true;
      return !!(opt.ok && !opt.ok());
    }
    function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function at(pts, f) {
      if (pts.length < 2) return pts[0];
      var segs = [], tot = 0, i;
      for (i = 1; i < pts.length; i++) { var l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); tot += l; }
      var d = f * tot;
      for (i = 0; i < segs.length; i++) {
        if (d <= segs[i] || i === segs.length - 1) { var t = segs[i] ? Math.min(1, d / segs[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; }
        d -= segs[i];
      }
      return pts[pts.length - 1];
    }
    function frame() {
      if (!run) return;
      var t = (Date.now() - run.t0) / run.dur, p = run.p, s = run.s, x, y, a, press, sc = 1;
      if (t >= 1) { stop(); return; }
      if (p.tap || p.pts.length < 2) {
        var pt = p.pts[0];
        x = pt[0]; y = pt[1];
        a = t < 0.15 ? t / 0.15 : (t > 0.85 ? (1 - t) / 0.15 : 1);
        press = (t > 0.3 && t < 0.42) || (t > 0.55 && t < 0.67);
        sc = press ? 0.92 : 1;
        if (t < 0.3) { var k = 1 - t / 0.3; x += 26 * s * k; y += 30 * s * k; }
      } else {
        a = t < 0.1 ? t / 0.1 : (t > 0.9 ? (1 - t) / 0.1 : 1);
        var f = reduce ? 0.5 : ease(Math.max(0, Math.min(1, (t - 0.16) / 0.66)));
        var q = at(p.pts, f); x = q[0]; y = q[1];
        press = t > 0.12 && t < 0.86;
        sc = t < 0.12 ? 1.12 - 0.12 * (t / 0.12) : 1;
      }
      el.style.opacity = (0.85 * a).toFixed(3);
      el.style.transform = "translate(" + (x - 24 * s) + "px," + (y - 18 * s) + "px) rotate(-14deg) scale(" + sc + ")";
      el.lastChild.firstChild.style.opacity = press ? "1" : "0";
      carryEl.style.opacity = press ? "0.75" : "0";
      requestAnimationFrame(frame);
    }
    function show(p) {
      if (!el) build();
      var s = Math.max(1, Math.min(1.7, Math.min(innerWidth, innerHeight) / 360));
      el.style.width = (64 * s) + "px"; el.style.height = (84 * s) + "px";
      el.style.transformOrigin = (24 * s) + "px " + (18 * s) + "px";
      el.style.display = "block";
      carryEl.innerHTML = p.carry ? p.carry.html : "";
      if (p.carry) {
        var c = p.carry.size;
        carryEl.style.cssText = "position:absolute;left:" + (24 * s - c / 2) + "px;top:" + (18 * s - c / 2) + "px;width:" + c + "px;height:" + c + "px";
      }
      run = { p: p, s: s, t0: Date.now(), dur: p.dur || (p.tap ? 2400 : 3200) };
      requestAnimationFrame(frame);
    }
    setInterval(function () {
      if (run || learned || !armed || shown >= MAX || Date.now() - last < IDLE) return;
      if (blocked()) { last = Date.now(); return; }
      var p = plan();
      if (!p || !p.pts || !p.pts.length) return;
      armed = false; shown++;
      show(p);
    }, 250);
    return {
      learned: function () { learned = true; stop(); },
      // something new to show (a new mode): allow the hint again
      again: function () { learned = false; shown = 0; armed = true; last = Date.now(); },
      poke: poke,
      // test hook: show it now
      show: function () { var p = plan(); if (p) show(p); return !!p; }
    };
  }
  // The ghost hand drags the hook to the next load (or, carrying, to the building).
  function inStage(p) {
    var r = $("stage").getBoundingClientRect();
    return [clamp(p[0], r.left + 34, r.right - 34), clamp(p[1], r.top + 34, r.bottom - 34)];
  }
  var ghost = makeGhost(function () {
    if (ending || drag || jobs.length || auto) return null;
    if (topped) {
      if (Toybox.isBig()) return null;
      flashCoach("Tap New building!", 3500);
      var nb = $("newBtn").getBoundingClientRect();
      return { pts: [[nb.left + nb.width / 2, nb.top + nb.height / 2]], tap: true };
    }
    var h = inStage(worldToScreen(hookX(), hookY() + 22));
    if (carried) {
      if (!allowed(carried.kind)) return null;
      coachAgain();
      return { pts: [h, inStage(worldToScreen(BC, targetBottom(carried.kind) + carried.h + SLING + 40))] };
    }
    var k = nextKind(), l = k && findLoad(k);
    if (!l || l.born > clock) return null;
    coachAgain();
    var r = ringOf(l);
    return { pts: [h, inStage(worldToScreen(r.x, r.y))] };
  }, { max: 3 });

  // ---------- Start ----------
  spawnLoads(true);
  var startLoad = findLoad(nextKind() || "bricks");
  cr.x = startLoad ? clamp(startLoad.x + 70, TMIN, TMAX) : 300;
  cr.L = TY - 230; tgt.x = cr.x; tgt.y = 230;
  resize();
  showCount(false);
  Toybox.init({
    app: "construction-site",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the crane pulls its hook up and rests, and the buttons lock. The timer carries on across the site pages.",
    goodbyeOption: "End with a “Park it” button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Park it",
    farewellDone: "Bye bye, crane!",
    restLine: "The crane is resting.",
    restLine2: "The crane will be right here next time.",
    restArt: restArt,
    soundNote: "Soft motor hums and clunks. Hold for 2 seconds.",
    legacy: { timer: "site-timer-v1", sound: "site-sound-v1", big: "site-big-v1" },
    onEnding: onEnding,
    onGoodbye: goodbyePark,
    onRest: onRest,
    onWake: onWake,
    onBig: onBig,
    onSound: function (on) { if (on) chime(); },
    onTimer: drawTimer
  });
  requestAnimationFrame(loop);

  // Test hook, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) window.__crane = {
    state: function () {
      return { floors: floors, bricks: cur.bricks, window: cur.window, topped: topped, carried: carried ? carried.kind : null,
        hook: { x: Math.round(hookX()), y: Math.round(hookY()) }, trolley: Math.round(cr.x), th: +cr.th.toFixed(3), jobs: jobs.length, locked: jobsLocked, auto: auto,
        loads: loads.map(function (l) { return { kind: l.kind, x: Math.round(l.x), y: Math.round(l.y) }; }), coach: $("hint").hidden ? "" : $("hint").textContent, parked: parked };
    },
    toScreen: function (x, y) { var p = worldToScreen(x, y); return { x: p[0], y: p[1] }; },
    hookScreen: function () { var p = worldToScreen(hookX(), hookY() + 22); return { x: p[0], y: p[1] }; },
    ringScreen: function (kind) { var l = findLoad(kind); if (!l) return null; var r = ringOf(l), p = worldToScreen(r.x, r.y); return { x: p[0], y: p[1] }; },
    targetScreen: function () { var k = carried ? carried.kind : nextKind(); var p = worldToScreen(BC, targetBottom(k) + KIND[k].h + SLING + 20); return { x: p[0], y: p[1] }; },
    ghost: function () { return ghost.show(); }
  };
})();
</script>
