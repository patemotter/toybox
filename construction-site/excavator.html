<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Excavator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Construction">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --tile: #E8F4FF;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    --tile: #E6F2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  --tile: #E6F2FF;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }
.stage { background: #A9DCFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv.held { cursor: grabbing; }
/* "Loads" is the counter (tb-counter); the hint is the coach line (tb-coach). */
.loads { font-variant-numeric: tabular-nums; }
.loads.pop { animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
.hint { background: var(--accent); }
.hint[hidden] { display: none; }
.hint.go { animation: hintPop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hintPop { 0% { transform: translateX(-50%) scale(0.3); } 100% { transform: translateX(-50%) scale(1); } }
/* Long coach lines wrap on phones instead of being cut off. */
@media (max-width: 600px) { .hint { white-space: normal; line-height: 1.15; } }

/* Play-timer gauge */
.fuel { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.fuel[hidden] { display: none; }
.fuel-bar { width: clamp(60px, 14vw, 140px); height: 18px; background: rgba(255, 255, 255, 0.8); border: 3px solid #1D2340; border-radius: 999px; overflow: hidden; }
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num { min-width: 40px; height: 40px; display: grid; place-items: center; background: #FFFFFF; color: #1D2340; border: 3px solid #1D2340; border-radius: 50%; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.fuel-num[hidden] { display: none; }

/* ---------- Panel: the two backup buttons, Dig and Dump (picture tiles) ---------- */
.acts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.tb-tile.act {
  flex-direction: row; gap: 10px; min-height: 78px; padding: 4px 10px;
  background: var(--tile); color: #1D2340; font-size: 1.45rem; font-weight: 800; line-height: 1;
}
.tb-tile.act svg { width: 70px; height: 52px; flex: none; pointer-events: none; overflow: visible; }
.tb-tile.act span { pointer-events: none; }
.tb-tile.act.on { background: var(--accent); transform: translate(3px, 3px); box-shadow: 0 0 0 var(--edge); }
body.ending .tb-panel, body.ending .homebtn, body.ending .mapbtn { pointer-events: none; opacity: 0.4; }

/* Big: the header shrinks to the Big button and the panel hides; the bucket is dragged on the picture. */
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel { display: none; }

/* ---------- Timer (sheet, toast, banner and rest screen come from common/toybox.css) ---------- */
.rest-art { width: min(70vw, 300px, 40vh); aspect-ratio: 6 / 5; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }

/* Tablets: bigger tiles. */
@media (min-width: 700px) and (min-height: 700px) {
  .tb-tile.act { min-height: 104px; font-size: 1.8rem; gap: 14px; }
  .tb-tile.act svg { width: 96px; height: 72px; }
}
/* Landscape: the stage on the left, Dig and Dump stacked in a slim column on the right. */
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(20%, 210px); }
  .tb-body .tb-panel .acts { grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); overflow: visible; }
  .tb-tile.act { flex-direction: column; gap: 4px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: 132px; padding: 6px; }
  .acts { gap: 8px; }
  .tb-tile.act { min-height: 0; font-size: 1.2rem; }
  .tb-tile.act svg { width: 64px; height: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  .hint.go, .loads.pop { animation: none; }
}
/* Ghost hand: a see-through hand that shows the main move once (same look as Bulldozer and Measuring). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="mapbtn" href="./" aria-label="Back to all machines"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>All machines</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Excavator</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls">Big</button>
  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="An excavator next to a dirt pile and a dump truck. Drag the bucket to dig."></canvas>
      <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
      <div class="tb-counter loads" id="loads">Loads: 0</div>
      <div class="tb-coach hint" id="hint" hidden></div>
    </main>
    <section class="tb-panel panel" id="panel">
      <div class="tb-choices acts" id="acts">
        <button class="btn tb-tile act" id="digBtn" aria-label="Dig: scoop up a bucket of dirt">
          <svg viewBox="0 0 64 48" aria-hidden="true">
            <path d="M1 46 C8 29 21 23 34 24 C48 25 58 33 63 46 Z" fill="#8B5A2B" stroke="#1D2340" stroke-width="2.6" stroke-linejoin="round"/>
            <circle cx="12" cy="40" r="2" fill="#5E3A1B"/><circle cx="50" cy="39" r="2.2" fill="#5E3A1B"/><circle cx="42" cy="43" r="1.8" fill="#5E3A1B"/>
            <path d="M0 3 L22 13" stroke="#1D2340" stroke-width="9" stroke-linecap="round"/>
            <path d="M0 3 L22 13" stroke="#FFC72C" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M22 13 L36 12 L42 20 L41 30 L34 37 L28 40 L25 32 Z" fill="#3A4150"/>
            <path d="M25 32 C30 28 37 28 41 30 L34 37 L28 40 Z" fill="#7A4B22"/>
            <path d="M22 13 L36 12 L42 20 L41 30 L34 37 L28 40" fill="none" stroke="#1D2340" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M22 13 L36 12 L42 20 L41 30 L34 37 L28 40" fill="none" stroke="#FFC72C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M27 39 L32 38 L27 45 Z" fill="#C9CED6" stroke="#1D2340" stroke-width="1.8" stroke-linejoin="round"/>
            <circle cx="22" cy="13" r="2.6" fill="#9AA3B2" stroke="#1D2340" stroke-width="1.5"/>
            <circle cx="49" cy="13" r="3" fill="#7A4B22" stroke="#1D2340" stroke-width="1.5"/>
            <circle cx="55" cy="21" r="2.5" fill="#7A4B22" stroke="#1D2340" stroke-width="1.5"/>
            <circle cx="50" cy="5" r="2" fill="#7A4B22" stroke="#1D2340" stroke-width="1.3"/>
          </svg><span>Dig</span></button>
        <button class="btn tb-tile act" id="dumpBtn" aria-label="Dump: pour the dirt into the truck">
          <svg viewBox="0 0 64 48" aria-hidden="true">
            <path d="M22 32 C27 22 49 21 56 32 Z" fill="#7A4B22" stroke="#1D2340" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M19 32 H61 L59 41 H20 Z" fill="#E63946" stroke="#1D2340" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M3 41 V32 L7 26 H17 V41 Z" fill="#F77F00" stroke="#1D2340" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M8.5 28 H14.5 V32.5 H6 Z" fill="#9FD6F5" stroke="#1D2340" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="11" cy="43" r="4" fill="#2B2F3A" stroke="#1D2340" stroke-width="1.8"/>
            <circle cx="43" cy="43" r="4" fill="#2B2F3A" stroke="#1D2340" stroke-width="1.8"/>
            <circle cx="53" cy="43" r="4" fill="#2B2F3A" stroke="#1D2340" stroke-width="1.8"/>
            <path d="M64 1 L50 7" stroke="#1D2340" stroke-width="8" stroke-linecap="round"/>
            <path d="M64 1 L50 7" stroke="#FFC72C" stroke-width="4" stroke-linecap="round"/>
            <path d="M50 7 L45 2 L35 2 L29 8 L28 15 Z" fill="#3A4150"/>
            <path d="M50 7 L45 2 L35 2 L29 8 L28 15" fill="none" stroke="#1D2340" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M50 7 L45 2 L35 2 L29 8 L28 15" fill="none" stroke="#FFC72C" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M27 14 L30 16 L26 20 Z" fill="#C9CED6" stroke="#1D2340" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="50" cy="7" r="2.4" fill="#9AA3B2" stroke="#1D2340" stroke-width="1.4"/>
            <circle cx="35" cy="15" r="2.6" fill="#7A4B22" stroke="#1D2340" stroke-width="1.3"/>
            <circle cx="40" cy="19" r="2.3" fill="#7A4B22" stroke="#1D2340" stroke-width="1.3"/>
            <circle cx="35" cy="23" r="2.2" fill="#7A4B22" stroke="#1D2340" stroke-width="1.3"/>
            <circle cx="42" cy="12" r="2" fill="#7A4B22" stroke="#1D2340" stroke-width="1.2"/>
          </svg><span>Dump</span></button>
      </div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Safety gear check (once per visit, on the site map) ----------
  var gearOn = true;
  try { gearOn = sessionStorage.getItem("site-gear") === "on"; } catch (e) { gearOn = true; }
  if (!gearOn) { location.replace("./?next=excavator"); return; }

  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  var DEG = Math.PI / 180;
  var OUT = "#1D2340";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var STATEKEY = "site-excavator-v1";

  // ---------- World (units; y is up, ground at y = 0) ----------
  var WORLD_W = 1000, VIEW_UP = 560, VIEW_DOWN = 70, VIEW_X0 = -40, VIEW_X1 = 1040;
  var CX = 480;                       // swing centre of the excavator
  var FOOT = { x: 62, y: 168 };       // boom foot (machine coords: x forward, y up)
  var L1 = 280, L2 = 215;             // boom and arm lengths
  var LIM1 = [-28 * DEG, 80 * DEG];   // boom angle (from horizontal)
  var LIM2 = [-164 * DEG, -28 * DEG]; // arm angle relative to the boom
  var LIM3 = [-132 * DEG, 56 * DEG];  // bucket angle relative to the arm
  // The bucket's own angle in the machine's frame for each job. The bucket keeps its angle while it is
  // dragged (it moves the way the finger moves) and only turns for a job: teeth down to dig, curled up
  // to carry, mouth down to dump.
  var PH_READY = -95 * DEG, PH_CARRY = -165 * DEG, PH_DUMP = -25 * DEG, PH_PARK = -60 * DEG;
  var GROUND = 16;                    // nothing on the arm goes lower than this (except into the pile)
  var CAP = 2600;                     // bucket holds this much dirt
  var TRUCK_CAP = 6400;               // a truck is full after about 3 buckets
  var PV = 26;                        // dirt in one pour grain

  // Bucket outline in bucket coords (u from pin toward the teeth, v toward the opening).
  var BUCKET = [[-8, 12], [-8, -14], [10, -40], [46, -52], [80, -40], [98, -14], [104, -2], [120, 3], [100, 9]];
  var TEETH = [120, 3], LIP = [100, 9], TOPLIP = [-8, 12], BUCKET_MID = [48, -18], BUCKET_LOW = [46, -40];

  // Machine state. ph: the bucket angle it is turning to right now; phGoal/phRate: where to and how fast.
  var m = { a1: 0, a2: 0, a3: 0, ph: PH_READY, phGoal: PH_READY, phRate: 90 * DEG, fill: 0, swing: 0, swingFrom: 0, swingTo: 0, swingT: 1, swingPhase: "", liftT: 0, carry: null, pouring: false };
  var parking = false;

  // Dirt pile heightmap
  var PX0 = 630, PCW = 5, PN = 130;
  var pile = new Float32Array(PN), pileInit = new Float32Array(PN), pileTotal0 = 0, regrow = 0;
  for (var i0 = 0; i0 < PN; i0++) {
    var xx = PX0 + (i0 + 0.5) * PCW, d0 = (xx - 875) / 245;
    var h0 = Math.max(0, 1 - d0 * d0);
    pileInit[i0] = 152 * Math.pow(h0, 0.85) + (xx > 1060 ? Math.min(60, (xx - 1060) * 0.5) : 0);
    pile[i0] = pileInit[i0]; pileTotal0 += pileInit[i0] * PCW;
  }
  // Dirt that lands on the ground (not on the pile or in the truck) heaps up where it falls.
  var GCW = 6, GN = Math.ceil(WORLD_W / GCW) + 1, gheap = new Float32Array(GN);
  function gCol(X) { return Math.floor(X / GCW); }
  function gheapAt(X) { var i = gCol(X); return i >= 0 && i < GN ? gheap[i] : 0; }
  function relaxGheap() {
    var maxd = GCW * 0.8;
    for (var i = 0; i < GN - 1; i++) {
      var d = gheap[i] - gheap[i + 1];
      if (Math.abs(d) > maxd) { var mv = (Math.abs(d) - maxd) * 0.25 * (d > 0 ? 1 : -1); gheap[i] -= mv; gheap[i + 1] += mv; }
    }
  }
  var pebbles = [];
  for (var k0 = 0; k0 < 90; k0++) pebbles.push({ x: rand(PX0 + 20, PX0 + PN * PCW), y: rand(6, 150), r: rand(2.5, 6), c: Math.random() < 0.5 ? "#5E3A1B" : "#B98552" });

  // Dump truck (faces left: cab on the left, bed toward the excavator)
  var TRUCK_COLORS = [["#F77F00", "#E63946"], ["#2D7FF9", "#FFC72C"], ["#2E9E5B", "#F77F00"], ["#E63946", "#2D7FF9"], ["#8E5CD9", "#FFC72C"]];
  var BED0 = 108, BED1 = 296, BEDN = 24, BED_FLOOR = 108, BED_RIM = 128;
  var truck = newTruck(0);
  truck.state = "in"; truck.dx = 0;
  var truckCount = 0;
  function newTruck(n) {
    return { dx: -700, v: 0, state: "gone", t: 0, bed: new Float32Array(BEDN), load: 0, colors: TRUCK_COLORS[n % TRUCK_COLORS.length], wheel: 0, beepT: 0, lastPour: 0, bounce: 0 };
  }

  // ---------- Treasures: hidden in the pile, found by digging, kept in the crate ----------
  var NAMES = { chest: "A treasure chest!", gemRed: "A red gem!", gemBlue: "A blue gem!", gemGreen: "A green gem!",
    nugget: "A gold nugget!", bone: "A dinosaur bone!", coin: "An old coin!", shell: "A fossil shell!" };
  var KIND_BAG = ["chest", "chest", "gemRed", "gemBlue", "gemGreen", "nugget", "bone", "coin", "shell"];
  var hidden = [];   // { kind, x, y, tw } inside the pile
  var flyers = [];   // found treasures on their way to the crate
  var sparks = [];   // sparkle stars

  var loads = 0, found = [];
  // Opened from the Toybox home screen: the counter starts at 0 again and the crate is empty.
  var startFresh = !!(window.Toybox && Toybox.fresh());
  if (!startFresh) try {
    var so = JSON.parse(localStorage.getItem(STATEKEY) || "null");
    if (so && typeof so.loads === "number" && so.loads >= 0) loads = Math.floor(so.loads);
    if (so && Object.prototype.toString.call(so.treasures) === "[object Array]") found = so.treasures.filter(function (k) { return Object.prototype.hasOwnProperty.call(NAMES, k); }).slice(-200);
  } catch (e) { /* ignore */ }
  function saveState() { try { localStorage.setItem(STATEKEY, JSON.stringify({ loads: loads, treasures: found })); } catch (e) { /* ignore */ } }
  if (startFresh) saveState();
  var crate = { items: found.slice(), bounce: 0 };

  var grains = [], puffs = [], crumbs = [], beeps = [];
  var clouds = [{ x: 140, y: 500, s: 1 }, { x: 560, y: 545, s: 0.8 }, { x: 900, y: 470, s: 1.15 }, { x: 330, y: 690, s: 0.9 }, { x: 760, y: 760, s: 1 }];

  // ---------- Kinematics ----------
  function facing() { return Math.cos(m.swing); }
  function side() { return m.swing < Math.PI / 2 ? 1 : -1; }
  function fk(a1, a2, a3) {
    var c1 = Math.cos(a1), s1 = Math.sin(a1), b = a1 + a2, c2 = Math.cos(b), s2 = Math.sin(b), ph = b + a3;
    var t1 = { x: FOOT.x + L1 * c1, y: FOOT.y + L1 * s1 };
    var t2 = { x: t1.x + L2 * c2, y: t1.y + L2 * s2 };
    return { t1: t1, t2: t2, b: b, ph: ph, U: { x: Math.cos(ph), y: Math.sin(ph) }, V: { x: Math.sin(ph), y: -Math.cos(ph) } };
  }
  function bpt(k, p) { return { x: k.t2.x + p[0] * k.U.x + p[1] * k.V.x, y: k.t2.y + p[0] * k.U.y + p[1] * k.V.y }; }
  // How far the arm and bucket poke into something solid (0 = fine). The pile is not solid: it is dug.
  function penetration(a1, a2, a3) {
    var k = fk(a1, a2, a3), sd = side(), pen = 0;
    var pts = BUCKET.map(function (p) { return bpt(k, p); });
    pts.push(k.t2, k.t1);
    var truckIn = truck.state !== "gone";
    for (var i = 0; i < pts.length; i++) {
      var lx = pts[i].x, y = pts[i].y, X = CX + lx * sd, need = GROUND;
      if (Math.abs(lx) < 165) need = 76;
      if (lx < 20) need = Math.max(need, 300);
      if (truckIn) {
        var tx = X - truck.dx;
        if (tx > BED0 + 14 && tx < BED1 - 14) need = Math.max(need, BED_FLOOR + bedHeightAt(X) + 6);
        else if (tx > BED0 - 4 && tx < BED1 + 12) need = Math.max(need, BED_RIM + 8);
        else if (tx > 0 && tx <= BED0 - 4) need = Math.max(need, 185);
      }
      pen = Math.max(pen, need - y);
    }
    return pen;
  }
  function angDiff(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
  // Two-joint IK for the arm tip with joint limits (analytic elbow-up, then clamped coordinate descent).
  function solveIK(px, py) {
    var dx = px - FOOT.x, dy = py - FOOT.y, d = Math.sqrt(dx * dx + dy * dy);
    d = clamp(d, Math.abs(L1 - L2) + 1, L1 + L2 - 1);
    var c = clamp((d * d - L1 * L1 - L2 * L2) / (2 * L1 * L2), -1, 1);
    var a2 = clamp(-Math.acos(c), LIM2[0], LIM2[1]);
    var a1 = 0, it;
    for (it = 0; it < 6; it++) {
      a1 = clamp(Math.atan2(dy, dx) - Math.atan2(L2 * Math.sin(a2), L1 + L2 * Math.cos(a2)), LIM1[0], LIM1[1]);
      var ex = FOOT.x + L1 * Math.cos(a1), ey = FOOT.y + L1 * Math.sin(a1);
      a2 = clamp(angDiff(Math.atan2(py - ey, px - ex) - a1), LIM2[0], LIM2[1]);
    }
