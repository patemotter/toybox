<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sand Table</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sand Table">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #EAF5FF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #22385F;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #22385F;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Stage: the sand table, seen from above ---------- */
.stage { touch-action: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; width: 44px; height: 44px; pointer-events: none; }
.stage .toast { position: absolute; top: 14px; z-index: 4; font-size: 1.3rem; }
.stage .farewell { position: absolute; top: 14px; bottom: auto; z-index: 4; }
.stage .farewell p { font-size: 1.25rem; }

/* ---------- Panel: Draw!/Stop and Smooth, the shape or sand tiles, then Shapes / Sand / New / Surprise ---------- */
.gorow { display: flex; gap: 8px; }
.gorow .tb-go { flex: 1.7 1 0; min-width: 0; }
.btn.smooth { flex: 1 1 0; min-width: 0; min-height: 60px; padding: 0.2rem 0.4rem; font-size: 1.3rem; font-weight: 800;
  background: #F6E2B8; color: #1D2340; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; }
.btn.smooth .rake { width: 30px; height: 26px; margin-right: 4px; flex: none; }
.btn.smooth.full { animation: smooth-glow 2.4s ease-in-out infinite; }
@keyframes smooth-glow { 0%, 100% { box-shadow: 3px 3px 0 var(--edge), 0 0 4px 1px rgba(255, 154, 77, 0.35); }
  50% { box-shadow: 3px 3px 0 var(--edge), 0 0 18px 7px rgba(255, 180, 90, 0.9); } }
@media (prefers-reduced-motion: reduce) { .btn.smooth.full { animation: none; box-shadow: 3px 3px 0 var(--edge), 0 0 12px 4px rgba(255, 180, 90, 0.8); } }
.pats, .sands { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
#panel[data-tab="shapes"] .sands, #panel[data-tab="sand"] .pats { display: none; }
.btn.pat { min-height: 58px; padding: 4px 2px; border-radius: 14px; }
.btn.pat svg { width: 40px; height: 40px; }
.pat .lbl { display: none; }
.btn.pat[aria-pressed="true"] { background: var(--accent); color: #1D2340; }
.btn.pat.drawing svg { animation: pat-turn 6s linear infinite; }
@keyframes pat-turn { to { transform: rotate(360deg); } }
.tb-tabs .tab[aria-pressed="true"] { background: var(--accent); color: #1D2340; }
.btn.tb-go .goicon { display: inline-block; width: 0.9em; height: 0.9em; margin-right: 0.35em; vertical-align: -0.08em; }
.sdot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #1D2340; margin-right: 5px;
  vertical-align: -3px; background: var(--sd, #F2DEB8); flex: none; }
@media (max-width: 600px), (orientation: landscape) and (max-height: 520px) {
  .btn.smooth { min-height: 52px; font-size: 1.1rem; }
  .btn.smooth .rake { width: 26px; height: 22px; }
}
body.big .tb-panel { display: none; }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }

/* Phones held sideways: two rows of four tiles in the side column. */
@media (orientation: landscape) and (max-height: 520px) {
  .pats, .sands { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .btn.pat { min-height: 70px; }
  .btn.pat svg { width: 44px; height: 44px; }
  .tb-body .tb-panel { width: min(40%, 330px); }
}
/* Tablets: bigger tiles with their names. */
@media (min-width: 700px) and (min-height: 700px) {
  .btn.pat { min-height: 96px; font-size: 1.05rem; gap: 2px; }
  .btn.pat svg { width: 60px; height: 60px; }
  .pat .lbl { display: block; }
  .stage .tbadge { width: 56px; height: 56px; top: 12px; right: 12px; }
}
@media (min-width: 700px) and (min-height: 700px) and (orientation: landscape) {
  .pats, .sands { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tb-body .tb-panel { width: min(36%, 400px); }
}
@media (prefers-reduced-motion: reduce) { .btn.pat.drawing svg { animation: none; } }
/* Ghost hand: a see-through hand that shows the main move once (tools/snippets/ghost-hand.css). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
.rest-art { aspect-ratio: 1; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Sand Table</h1>
    <button class="btn tb-iconbtn" id="bigBtn" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>
  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="view" role="img" aria-label="A round sand table seen from above. A steel ball rolls through the sand and draws grooves. Drag anywhere to steer the ball."></canvas>
      <div class="tb-coach" id="coach" role="status" aria-live="polite">Drag the ball!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
    <section class="tb-panel" id="panel" data-tab="shapes">
      <div class="gorow">
        <button class="btn tb-go" id="goBtn">Draw!</button>
        <button class="btn smooth" id="smoothBtn" aria-label="Smooth the sand"><svg class="rake" viewBox="0 0 32 28" aria-hidden="true"><path d="M2 24c3-2.2 6-2.2 9 0M2 18.5c2.4-1.8 4.8-1.8 7.2 0" fill="none" stroke="#8A5A2B" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/><path d="M27 2 19.5 12.5" stroke="#1D2340" stroke-width="3.6" stroke-linecap="round"/><path d="M12.5 9.5 25.5 17" stroke="#1D2340" stroke-width="4" stroke-linecap="round"/><path d="M13.5 12.5l-1.6 3.4M17.2 14.6l-1.6 3.4M20.9 16.7l-1.6 3.4M24.6 18.8 23 22.2" stroke="#1D2340" stroke-width="2.4" stroke-linecap="round"/></svg>Smooth</button>
      </div>
      <div class="tb-choices pats" id="pats" role="group" aria-label="Shapes"></div>
      <div class="tb-choices sands" id="sands" role="group" aria-label="Sand colors"></div>
      <nav class="tb-tabs" aria-label="More">
        <button class="btn tab" data-tab="shapes" aria-pressed="true">Shapes</button>
        <button class="btn tab" data-tab="sand" aria-pressed="false"><span class="sdot" id="sdot"></span>Sand</button>
        <button class="btn tb-new" id="newBtn" aria-label="New: start over with smooth sand">New</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Constants ----------
  var KEY = "sand-table-v1";          // { ball:[x,y], pat, sand } (older saves also hold "light": ignored)
  var SKEY = "sand-table-sand-v1";    // the sand itself: the heightmap as a grey PNG (1/32 of a cell per step)
  var OUT = "#1D2340";
  var TAU = Math.PI * 2;
  var DEBUG = /[?&]debug\b/.test(location.search);
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Everything on the table is in "table units": the sand is a circle of radius 1 around (0, 0), y down.
  var N = 560;                 // heightmap cells across the sand (fixed, so a resize never redraws it)
  var HALF = N / 2;
  var RB = 0.06;               // ball radius
  var RG = 0.042;              // groove half width
  var RR = 0.078;              // ridge outer edge (sand pushed up on both sides)
  var LIM = 1 - RB - 0.012;    // how far out the ball's middle may go
  var DEPTH = RG * HALF * 0.3;           // groove depth in cells
  var RIDGE = DEPTH * 0.75;              // ridge height in cells (the slopes meet smoothly)
  var RECENT = RR * 2.6;                 // path length behind the ball that its own ridges must not fill back in
  var STEP = 0.008;            // pattern points are this far apart
  var V_FINGER = 1.7;          // table radii per second: the ball's top speed behind a finger (calm, catches up)
  var V_PAT = 0.62;            // drawing a pattern by itself (calm)
  var SMOOTH_MS = 1300;        // Smooth: the wide rake sweeps the whole table in about this long
  var NEW_MS = 800;            // New: a really fast sweep, then the table is fresh
  var WASH_MS = 1000;          // a new sand color washes across the table in about this long
  var RESUME_MS = 2600;        // after a finger lets go in Draw! mode, the pattern carries on
  var SAND = [242, 222, 184];
  var LIGHT = "#FFC86B";       // the table's rim light: one warm glow (the sand itself changes color now)
  // Sand colors (picture tiles). "rgb" is one color; "stripes" are soft rainbow bands across the table;
  // "glints" sprinkles a few tiny sparkly grains (the black space sand).
  var SANDS = [
    { id: "beach", name: "Beach", rgb: [242, 222, 184] },
    { id: "pink", name: "Pink", rgb: [250, 192, 212] },
    { id: "blue", name: "Blue", rgb: [164, 206, 246] },
    { id: "green", name: "Green", rgb: [178, 226, 170] },
    { id: "purple", name: "Purple", rgb: [204, 182, 242] },
    { id: "space", name: "Space", rgb: [66, 64, 92], glints: true },
    { id: "rainbow", name: "Rainbow", stripes: [[250, 176, 176], [252, 204, 152], [248, 234, 156], [182, 228, 168], [164, 208, 246], [204, 182, 242]] }
  ];
  var SAND_BY = {};
  SANDS.forEach(function (c) { SAND_BY[c.id] = c; });
  // Light from the top left, a little above.
  var LX = -0.52, LY = -0.62, LZ = 0.59;
  (function () { var l = Math.hypot(LX, LY, LZ); LX /= l; LY /= l; LZ /= l; })();

  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function now() { return performance.now(); }

  // ---------- Patterns (each a list of [x, y] points in table units) ----------
  function polar(r, a) { return [r * Math.cos(a), r * Math.sin(a)]; }
  function curve(f, t0, t1, n, out) {
    out = out || [];
    for (var i = 0; i <= n; i++) out.push(f(t0 + (t1 - t0) * i / n));
    return out;
  }
  function gcd(a, b) { while (b) { var t = b; b = a % b; a = t; } return a; }
  var HEART = (function () {
    var raw = curve(function (t) {
      var s = Math.sin(t);
      return [16 * s * s * s, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))];
    }, 0, TAU, 400);
    var y0 = 1e9, y1 = -1e9, m = 0;
    raw.forEach(function (p) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
    var cy = (y0 + y1) / 2;
    raw.forEach(function (p) { p[1] -= cy; m = Math.max(m, Math.hypot(p[0], p[1])); });
    return raw.map(function (p) { return [p[0] / m, p[1] / m]; });
  })();
  function heartAt(cx, cy, s, out) {
    HEART.forEach(function (p) { out.push([cx + p[0] * s, cy + p[1] * s]); });
    return out;
  }
  var PATS = [
    { id: "spiral", name: "Spiral", vars: 3, make: function (v) {
      var turns = [5.5, 4.2, 6.5][v];
      return curve(function (t) { return polar(0.9 * t, -Math.PI / 2 + turns * TAU * t); }, 0, 1, 2000);
    } },
    { id: "flower", name: "Flower", vars: 4, make: function (v) {
      var k = [5, 4, 3, 7][v], per = k % 2 ? Math.PI : TAU, a0 = Math.PI / (2 * k), out = [];
      curve(function (t) { return polar(0.9 * Math.cos(k * t), t); }, a0, a0 + per, 1400, out);
      curve(function (t) { return polar(0.5 * Math.cos(k * t), t + a0); }, a0, a0 + per, 900, out);
      return out;
    } },
    { id: "star", name: "Star", vars: 4, make: function (v) {
      var nm = [[7, 3], [5, 2], [8, 3], [9, 4]][v], n = nm[0], m = nm[1], out = [], i;
      for (i = 0; i <= n; i++) out.push(polar(0.9, -Math.PI / 2 + TAU * i * m / n));
      for (i = 0; i <= n; i++) out.push(polar(0.46, -Math.PI / 2 + Math.PI / n + TAU * i * m / n));
      for (i = 0; i <= 60; i++) out.push(polar(0.16, -Math.PI / 2 + Math.PI / n + TAU * i / 60));
      return out;
    } },
    { id: "heart", name: "Heart", vars: 2, make: function (v) {
      var sc = [[0.9, 0.62, 0.34], [0.9, 0.7, 0.5, 0.3]][v], out = [];
      sc.forEach(function (s) { heartAt(0, 0, s, out); });
      return out;
    } },
    { id: "waves", name: "Waves", vars: 3, make: function (v) {
      var rows = [7, 6, 8][v], A = [0.065, 0.08, 0.05][v], f = [5, 4, 6][v], out = [], i, j;
      for (j = 0; j < rows; j++) {
        var y = -0.8 + 1.6 * j / (rows - 1), c = Math.sqrt(Math.max(0, 0.9 * 0.9 - y * y)) - 0.03;
        for (i = 0; i <= 160; i++) {
          var x = -c + 2 * c * i / 160;
          if (j % 2) x = -x;
          out.push([x, y + A * Math.sin(x * f * Math.PI)]);
        }
      }
      return out;
    } },
    { id: "swirl", name: "Swirl", vars: 4, make: function (v) {
      var p = [[6, 1, 3], [9, 2, 3], [7, 3, 2], [7, 2, 4]][v], R = p[0], r = p[1], d = p[2];
      var k = (R - r) / r, T = TAU * r / gcd(R, r), sc = 0.9 / ((R - r) + d);
      return curve(function (t) {
        return [sc * ((R - r) * Math.cos(t) + d * Math.cos(k * t)), sc * ((R - r) * Math.sin(t) - d * Math.sin(k * t))];
      }, 0, T, 4000);
    } },
    { id: "rings", name: "Rings", vars: 2, make: function (v) {
      var step = [0.15, 0.2][v], out = [], r, i;
      for (r = 0.9; r > 0.1; r -= step) {
        for (i = 0; i <= 160; i++) out.push(polar(r, -Math.PI / 2 + TAU * i / 160));
      }
      return out;
    } }
  ];
  var PAT_BY = {};
  PATS.forEach(function (p) { PAT_BY[p.id] = p; });

  // Even spacing (STEP) so the ball moves along a pattern at a steady speed.
  function resample(pts) {
    var out = [pts[0][0], pts[0][1]], need = STEP, ax = pts[0][0], ay = pts[0][1];
    for (var i = 1; i < pts.length; i++) {
      var bx = pts[i][0], by = pts[i][1], dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy), pos = 0;
      while (pos + need <= L) { pos += need; out.push(ax + dx * pos / L, ay + dy * pos / L); need = STEP; }
      need -= (L - pos);
      ax = bx; ay = by;
    }
    return new Float32Array(out);
  }
  var patCache = {};
  function patPoints(id, v) {
    var k = id + ":" + v;
    if (!patCache[k]) patCache[k] = resample(PAT_BY[id].make(v));
    return patCache[k];
  }

  // ---------- Saved state ----------
  // Opening Sand Table from the Toybox home screen starts with smooth sand; a reload keeps the sand.
  if (window.Toybox && Toybox.fresh()) {
    try { localStorage.removeItem(KEY); localStorage.removeItem(SKEY); } catch (e) { /* ignore */ }
  }
  var prefs = { ball: [0, 0], pat: "spiral", sand: "beach" };
  try {
    var o = JSON.parse(localStorage.getItem(KEY) || "null");
    if (o && typeof o === "object") {
      if (o.ball && o.ball.length === 2 && isFinite(o.ball[0]) && isFinite(o.ball[1])) prefs.ball = [Number(o.ball[0]), Number(o.ball[1])];
      if (PAT_BY[o.pat]) prefs.pat = o.pat;
      if (typeof o.sand === "string" && SAND_BY[o.sand]) prefs.sand = o.sand;   // an old "light" is simply ignored
    }
  } catch (e) { /* bad data: defaults */ }
  function savePrefs() {
    prefs.ball = [Math.round(ball.x * 1000) / 1000, Math.round(ball.y * 1000) / 1000];
    try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch (e) { /* ignore */ }
  }

  // ---------- The sand: a heightmap, shaded into a small canvas ----------
  var H = new Float32Array(N * N);        // height in cells: 0 is smooth sand, below is a groove, above a ridge
  var CARVE = new Float32Array(N * N);    // path length when the ball last carved this cell
  var GR = new Float32Array(N * N);       // fixed sand grain (a tiny brightness change per cell)
  var cum = 0;                            // path length the ball has rolled (table units)
  (function () {
    for (var i = 0; i < N * N; i++) { GR[i] = 1 + (Math.random() - 0.5) * 0.055; CARVE[i] = -1e9; }
  })();
  // The sand's color, per cell (so a new color can wash across, and rainbow sand can have stripes).
  var CR = new Uint8Array(N * N), CG = new Uint8Array(N * N), CB = new Uint8Array(N * N);   // shown now
  var OR = new Uint8Array(N * N), OG = new Uint8Array(N * N), OB = new Uint8Array(N * N);   // before a wash
  var NR = new Uint8Array(N * N), NG = new Uint8Array(N * N), NB = new Uint8Array(N * N);   // after a wash
  var GLINT = new Float32Array(N * N);
  (function () { for (var i = 0; i < N * N; i++) GLINT[i] = Math.random() < 0.006 ? 0.5 + Math.random() * 0.5 : 0; })();
  function fillColors(id, R, G, B) {
    var c = SAND_BY[id] || SANDS[0], x, y, i = 0;
    for (y = 0; y < N; y++) {
      for (x = 0; x < N; x++, i++) {
        var r, g, b;
        if (c.stripes) {
          // soft diagonal bands
          var n = c.stripes.length, u = ((x * 0.94 + y * 0.34) / N) * (n - 0.6) + 0.15 * Math.sin(y * 0.02);
          var k = Math.floor(u), f = u - k, a = c.stripes[((k % n) + n) % n], bb = c.stripes[(((k + 1) % n) + n) % n];
          var w = f < 0.78 ? 0 : (f - 0.78) / 0.22; w = w * w * (3 - 2 * w);
          r = a[0] + (bb[0] - a[0]) * w; g = a[1] + (bb[1] - a[1]) * w; b = a[2] + (bb[2] - a[2]) * w;
        } else { r = c.rgb[0]; g = c.rgb[1]; b = c.rgb[2]; }
        if (c.glints && GLINT[i]) { var q = GLINT[i]; r += (235 - r) * q; g += (232 - g) * q; b += (255 - b) * q; }
        R[i] = r; G[i] = g; B[i] = b;
      }
    }
  }
  fillColors(prefs.sand, CR, CG, CB);
  var sandC = document.createElement("canvas");
  sandC.width = sandC.height = N;
  var sctx = sandC.getContext("2d");
  var IMG = sctx.createImageData(N, N);
  var dx0 = N, dy0 = N, dx1 = -1, dy1 = -1;  // dirty cells to shade
  function markDirty(x0, y0, x1, y1) {
    if (x0 < dx0) dx0 = x0; if (y0 < dy0) dy0 = y0; if (x1 > dx1) dx1 = x1; if (y1 > dy1) dy1 = y1;
  }
  var sandChanged = 0;   // time of the last change (for saving)
  function cellX(x) { return (x + 1) * HALF - 0.5; }

  // Roll the ball from A to B: carve the groove (newest wins), push ridges up on both sides.
  function stampSeg(ax, ay, bx, by, c0, c1) {
    var Ax = cellX(ax), Ay = cellX(ay), Bx = cellX(bx), By = cellX(by);

    else if (W.on && !steer) t = "Watch it draw!";
    else if (!learnedDrag) t = "Drag the ball!";
    else if (!watched) t = "Tap Draw! to watch";
    if (t === coachText) return;
    coachText = t;
    if (t) { el.textContent = t; el.classList.remove("off"); }
    else el.classList.add("off");
  }
  function actLine(a) {
    return a.kind === "turtle" ? "A sea turtle!" : (a.kind === "truck" ? "Beep beep! A dump truck!" : "Whoosh! Wind!");
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.id === "bigBtn" || b.closest(".modal, .farewell, .rest")) return;
    if (Toybox.timer.locked() || ending) return;
    if (b.dataset.pat) {
      if (W.on && W.pat === b.dataset.pat && !W.done) return;
      startPattern(b.dataset.pat, 0, 0);
    } else if (b.id === "goBtn") {
      if (W.on) stopDrawing();
      else if (W.finished) startPattern(nextPatternId(), 0, 0);   // the next pattern, on top of the last
      else startPattern(W.pat, W.v, W.k);
    } else if (b.id === "smoothBtn") {
      startRake("smooth");
    } else if (b.id === "newBtn") {
      startRake("new");
    } else if (b.id === "surpriseBtn") {
      startSurprise();
    } else if (b.dataset.sand) {
      if (b.dataset.sand !== prefs.sand) setSand(b.dataset.sand);
    } else if (b.dataset.tab) {
      tab = b.dataset.tab;
      renderPanel();
    }
  });

  // ---------- Ghost hand (tools/snippets/ghost-hand.js) ----------
  function makeGhost(plan, opt) {
    opt = opt || {};
    var IDLE = opt.idle || 4500, MAX = opt.max || 2;
    var last = Date.now(), shown = 0, armed = true, learned = false, run = null, el = null;
    function build() {
      el = document.createElement("div");
      el.className = "ghosthand";
      el.setAttribute("aria-hidden", "true");
      el.innerHTML = '<svg viewBox="-24 -18 64 84"><circle class="gh-press" cx="0" cy="0" r="17" fill="rgba(255,201,60,0.55)"/>' +
        '<g fill="#FFFFFF" stroke="#1D2340" stroke-width="3" stroke-linejoin="round">' +
        '<rect x="-9" y="-6" width="18" height="40" rx="9"/><rect x="-12" y="22" width="44" height="40" rx="16"/>' +
        '<rect x="10" y="14" width="14" height="24" rx="7"/></g>' +
        '<circle cx="0" cy="2" r="5" fill="rgba(255,201,60,0.9)"/></svg>';
      el.insertBefore(carryEl, el.firstChild);
      document.body.appendChild(el);
    }
    function stop() { run = null; if (el) { el.style.display = "none"; carryEl.innerHTML = ""; } }
    var carryEl = document.createElement("div");
    carryEl.className = "gh-carry";
    function poke() { last = Date.now(); armed = true; if (run) stop(); }
    document.addEventListener("pointerdown", poke, true);
    document.addEventListener("keydown", poke, true);
    function blocked() {
      if (document.hidden) return true;
      if (window.Toybox && (Toybox.sheetOpen() || Toybox.timer.phase() === "ending" || Toybox.timer.phase() === "resting")) return true;
      return !!(opt.ok && !opt.ok());
    }
    function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function at(pts, f) {
      if (pts.length < 2) return pts[0];
      var segs = [], tot = 0, i;
      for (i = 1; i < pts.length; i++) { var l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); tot += l; }
      var d = f * tot;
      for (i = 0; i < segs.length; i++) {
        if (d <= segs[i] || i === segs.length - 1) { var t = segs[i] ? Math.min(1, d / segs[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; }
        d -= segs[i];
      }
      return pts[pts.length - 1];
    }
    function frame() {
      if (!run) return;
      var t = (Date.now() - run.t0) / run.dur, p = run.p, s = run.s, x, y, a, press, sc = 1;
      if (t >= 1) { stop(); return; }
      if (p.tap || p.pts.length < 2) {
        var pt = p.pts[0];
        x = pt[0]; y = pt[1];
        a = t < 0.15 ? t / 0.15 : (t > 0.85 ? (1 - t) / 0.15 : 1);
        press = (t > 0.3 && t < 0.42) || (t > 0.55 && t < 0.67);
        sc = press ? 0.92 : 1;
        if (t < 0.3) { var k = 1 - t / 0.3; x += 26 * s * k; y += 30 * s * k; }
      } else {
        a = t < 0.1 ? t / 0.1 : (t > 0.9 ? (1 - t) / 0.1 : 1);
        var f = reduce ? 0.5 : ease(Math.max(0, Math.min(1, (t - 0.16) / 0.66)));
        var q = at(p.pts, f); x = q[0]; y = q[1];
        press = t > 0.12 && t < 0.86;
        sc = t < 0.12 ? 1.12 - 0.12 * (t / 0.12) : 1;
      }
      el.style.opacity = (0.85 * a).toFixed(3);
      el.style.transform = "translate(" + (x - 24 * s) + "px," + (y - 18 * s) + "px) rotate(-14deg) scale(" + sc + ")";
      el.lastChild.firstChild.style.opacity = press ? "1" : "0";
      carryEl.style.opacity = press ? "0.75" : "0";
      requestAnimationFrame(frame);
    }
    function show(p) {
      if (!el) build();
      var s = Math.max(1, Math.min(1.7, Math.min(innerWidth, innerHeight) / 360));
      el.style.width = (64 * s) + "px"; el.style.height = (84 * s) + "px";
      el.style.transformOrigin = (24 * s) + "px " + (18 * s) + "px";
      el.style.display = "block";
      carryEl.innerHTML = p.carry ? p.carry.html : "";
      if (p.carry) {
        var c = p.carry.size;
        carryEl.style.cssText = "position:absolute;left:" + (24 * s - c / 2) + "px;top:" + (18 * s - c / 2) + "px;width:" + c + "px;height:" + c + "px";
      }
      run = { p: p, s: s, t0: Date.now(), dur: p.dur || (p.tap ? 2400 : 3200) };
      requestAnimationFrame(frame);
    }
    setInterval(function () {
      if (run || learned || !armed || shown >= MAX || Date.now() - last < IDLE) return;
      if (blocked()) { last = Date.now(); return; }
      var p = plan();
      if (!p || !p.pts || !p.pts.length) return;
      armed = false; shown++;
      show(p);
    }, 250);
    return {
      learned: function () { learned = true; stop(); },
      again: function () { learned = false; shown = 0; armed = true; last = Date.now(); },
      poke: poke,
      show: function () { var p = plan(); if (p) show(p); return !!p; }
    };
  }
  // The hand drags the ball along a gentle curve.
  var ghost = makeGhost(function () {
    if (!cw) return null;
    var r = view.getBoundingClientRect(), pts = [];
    var dir = ball.x > 0.2 ? -1 : 1;
    for (var i = 0; i <= 12; i++) {
      var t = i / 12, x = ball.x + dir * 0.55 * t, y = ball.y + 0.22 * Math.sin(t * TAU * 0.9);
      var q = clampLim([x, y]);
      pts.push([r.left + (cx + q[0] * Rs) / dpr, r.top + (cy + q[1] * Rs) / dpr]);
    }
    return { pts: pts, dur: 3600 };
  }, { ok: function () { return !W.on && !route && !steer && !ending && !rake && !acts.length; } });

  // ---------- Timer ending, goodbye, rest ----------
  function onEnding(done) {
    ending = true;
    endDone = done; endT0 = now();
    W.on = false;
    if (steer) { steer.down = false; steer.tx = clamp(ball.x + ball.vx * 0.25, -LIM, LIM); steer.ty = clamp(ball.y + ball.vy * 0.25, -LIM, LIM); }
    activeId = null; pointers = {};
    if (route) route.stopping = true;
    dimTarget = 0.12;
    renderPanel();
    updateCoach();
  }
  function onGoodbye() {
    // the ball draws a little heart to say goodbye
    var s = 0.26, hx = clamp(ball.x, -LIM + s, LIM - s), hy = clamp(ball.y, -LIM + s, LIM - s);
    var rr = Math.hypot(hx, hy);
    if (rr > LIM - s) { hx *= (LIM - s) / rr; hy *= (LIM - s) / rr; }
    steer = null;
    route = makeRoute("heart", resample(heartAt(hx, hy, s, [])), 0, 0.55);
  }
  function checkEnding() {
    if (!ending || !endDone) return;
    if (!route && !steer && !rake && !acts.length && speed() < 0.01 && now() - endT0 > 2500) { var d = endDone; endDone = null; d(); }
  }
  function restArt() {
    var c = document.createElement("canvas"), S = 420, h = S / 2, rs = h * 0.8;
    c.width = c.height = S;
    c.className = "rest-art";
    c.setAttribute("aria-hidden", "true");
    var x = c.getContext("2d");
    x.fillStyle = "#C88A4D"; circle(x, h, h, h - 8); x.fill();
    x.lineWidth = 10; x.strokeStyle = OUT; x.stroke();
    x.save(); circle(x, h, h, rs); x.clip();
    x.drawImage(sandC, h - rs, h - rs, 2 * rs, 2 * rs);
    x.fillStyle = "rgba(20, 30, 70, 0.08)"; x.fillRect(0, 0, S, S);
    x.restore();
    x.lineWidth = 6; x.strokeStyle = OUT; circle(x, h, h, rs); x.stroke();
    drawBall(x, h + ball.x * rs, h + ball.y * rs, RB * rs * 1.4, LIGHT, 0);
    return c;
  }

  // How much of the sand is grooved (sampled every 4th cell inside the circle).
  // "Very full": lots of line since the last smoothing (about three patterns) and most of the sand grooved.
  var fullness = 0, fullAt = 0, FULL = 0.6, FULL_LINE = 42, cumAtSmooth = 0;
  function measureFull() {
    var n = 0, hit = 0, x, y;
    for (y = 2; y < N; y += 4) {
      var v = (y + 0.5) / HALF - 1;
      for (x = 2; x < N; x += 4) {
        var u = (x + 0.5) / HALF - 1;
        if (u * u + v * v > 0.85) continue;
        n++;
        if (Math.abs(H[y * N + x]) > 0.6) hit++;
      }
    }
    fullness = n ? hit / n : 0;
    fullFlag = fullness > FULL && cum - cumAtSmooth > FULL_LINE;
    $("smoothBtn").classList.toggle("full", fullFlag && !rake);
  }

  // ---------- Frame loop ----------
  var last = now(), frameTimes = [];
  function frame(t) {
    var dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
    if (DEBUG) { frameTimes.push(t - last); if (frameTimes.length > 240) frameTimes.shift(); }
    last = t;
    update(dt);
    checkEnding();
    trackDamage(shadeDirty());
    if (dirty) { dirty = false; dmg = null; var e = Ro + 8 * dpr; render([cx - e, cy - e, cx + e + 6 * dpr, cy + e + 6 * dpr]); }
    else if (dmg) { var d = dmg; dmg = null; render(d); }
    // a gentle glow on Smooth once the sand is very full of lines (a hint; the coach never nags)
    if (t - fullAt > 1500 && sandChanged > fullAt) { fullAt = t; measureFull(); }
    // save once things have been still for a moment
    if (sandChanged > savedAt && t - sandChanged > 2500 && !route && !steer && !rake && !acts.length) saveSand();
    requestAnimationFrame(frame);
  }

  // ---------- Start ----------
  smoothAll();
  shadeDirty();
  loadSand();
  W.pat = prefs.pat;
  resize();
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });
  window.addEventListener("pagehide", function () { if (sandChanged > savedAt) saveSand(); else savePrefs(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden && sandChanged > savedAt) saveSand(); });
  renderPanel();
  Toybox.init({
    app: "sand-table",
    big: { button: $("bigBtn") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the ball finishes its line and stops, and the table light dims.",
    goodbyeOption: "End with a Goodbye button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Goodbye, sand",
    farewellDone: "Bye bye, sand!",
    restLine: "The sand is resting.",
    restLine2: "It will be right here next time.",
    restArt: restArt,
    soundNote: "A soft sandy hiss while the ball rolls. Hold for 2 seconds.",
    onEnding: onEnding,
    onGoodbye: onGoodbye,
    onRest: function () { endDone = null; route = null; steer = null; acts = []; if (rake) endRake(); ball.vx = ball.vy = 0; killHiss(); dirty = true; },
    onWake: function () { ending = false; endDone = null; dimTarget = 1; renderPanel(); updateCoach(); },
    onBig: function () { setTimeout(resize, 30); },
    onSound: function (on) { if (!on) killHiss(); }
  });
  stage.appendChild($("tb-toast"));
  stage.appendChild($("tb-farewell"));
  if (Toybox.timer.locked()) { dim = dimTarget = 0.12; }
  if (DEBUG) {
    window.sandDebug = {
      state: function () {
        return { ball: [ball.x, ball.y], mode: steer ? "finger" : (route ? route.kind : "free"), on: W.on, pat: W.pat, k: W.k,
          done: W.done, sand: prefs.sand, rake: rake ? rake.kind : null, wash: !!wash, acts: acts.map(function (a) { return a.kind; }), coach: coachText, renderMs: renderMs, cum: cum, Rs: Rs / dpr, cx: cx / dpr, cy: cy / dpr };
      },
      frames: function () { var a = frameTimes.slice().sort(function (p, q) { return p - q; }); return { n: a.length, median: a[a.length >> 1], p95: a[Math.floor(a.length * 0.95)], max: a[a.length - 1] }; },
      start: function (id, v) { startPattern(id, v || 0, 0); },
      smooth: function () { startRake("smooth"); },
      fresh: function () { startRake("new"); },
      sandColor: setSand,
      surprise: function (kind) { if (kind) surpriseN = SURPRISES.indexOf(kind); startSurprise(); },
      fast: function (f) { V_PAT = 0.62 * f; },
      fullness: function () { return fullness; },
      height: function (x, y) { return H[Math.round(cellX(y)) * N + Math.round(cellX(x))]; },
      shadeMs: function () { var t = now(); markDirty(0, 0, N - 1, N - 1); shadeDirty(); return now() - t; },
      ghost: function () { return ghost.show(); },
      sand: function () { return sandC.toDataURL(); },
      row: function (y, x0, x1) { var o = [], j = Math.round(cellX(y)); for (var x = Math.round(cellX(x0)); x <= Math.round(cellX(x1)); x++) o.push(Math.round(H[j * N + x] * 100) / 100); return o; },
      col: function (x, y0, y1) { var o = [], i = Math.round(cellX(x)); for (var y = Math.round(cellX(y0)); y <= Math.round(cellX(y1)); y++) o.push(Math.round(H[y * N + i] * 100) / 100); return o; }
    };
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
