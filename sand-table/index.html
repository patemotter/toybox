<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sand Table</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sand Table">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #EAF5FF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #22385F;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #22385F;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Stage: the sand table, seen from above ---------- */
.stage { touch-action: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; width: 44px; height: 44px; pointer-events: none; }
.stage .toast { position: absolute; top: 14px; z-index: 4; font-size: 1.3rem; }
.stage .farewell { position: absolute; top: 14px; bottom: auto; z-index: 4; }
.stage .farewell p { font-size: 1.25rem; }

/* ---------- Panel: Draw!/Stop, the pattern tiles, then Light / Smooth / Surprise ---------- */
.pats { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.btn.pat { min-height: 58px; padding: 4px 2px; border-radius: 14px; }
.btn.pat svg { width: 40px; height: 40px; }
.pat .lbl { display: none; }
.btn.pat[aria-pressed="true"] { background: var(--accent); color: #1D2340; }
.btn.pat.drawing svg { animation: pat-turn 6s linear infinite; }
@keyframes pat-turn { to { transform: rotate(360deg); } }
.btn.tb-new .rake { width: 30px; height: 26px; margin-right: 4px; vertical-align: -6px; flex: none; }
.btn.tb-new.full { animation: smooth-glow 2.4s ease-in-out infinite; }
@keyframes smooth-glow { 0%, 100% { box-shadow: 3px 3px 0 var(--edge), 0 0 4px 1px rgba(255, 154, 77, 0.35); }
  50% { box-shadow: 3px 3px 0 var(--edge), 0 0 18px 7px rgba(255, 180, 90, 0.9); } }
@media (prefers-reduced-motion: reduce) { .btn.tb-new.full { animation: none; box-shadow: 3px 3px 0 var(--edge), 0 0 12px 4px rgba(255, 180, 90, 0.8); } }
.btn.tb-go .goicon { display: inline-block; width: 0.9em; height: 0.9em; margin-right: 0.35em; vertical-align: -0.08em; }
.ldot { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #1D2340; margin-right: 6px;
  vertical-align: -3px; box-shadow: 0 0 8px 2px var(--ld, #FFC86B); background: var(--ld, #FFC86B); }
body.big .tb-panel { display: none; }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }

/* Phones held sideways: two rows of four tiles in the side column. */
@media (orientation: landscape) and (max-height: 520px) {
  .pats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .btn.pat { min-height: 70px; }
  .btn.pat svg { width: 44px; height: 44px; }
  .tb-body .tb-panel { width: min(40%, 330px); }
}
/* Tablets: bigger tiles with their names. */
@media (min-width: 700px) and (min-height: 700px) {
  .btn.pat { min-height: 96px; font-size: 1.05rem; gap: 2px; }
  .btn.pat svg { width: 60px; height: 60px; }
  .pat .lbl { display: block; }
  .stage .tbadge { width: 56px; height: 56px; top: 12px; right: 12px; }
}
@media (min-width: 700px) and (min-height: 700px) and (orientation: landscape) {
  .pats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tb-body .tb-panel { width: min(36%, 400px); }
}
@media (prefers-reduced-motion: reduce) { .btn.pat.drawing svg { animation: none; } }
/* Ghost hand: a see-through hand that shows the main move once (tools/snippets/ghost-hand.css). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
.rest-art { aspect-ratio: 1; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Sand Table</h1>
    <button class="btn tb-iconbtn" id="bigBtn" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>
  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="view" role="img" aria-label="A round sand table seen from above. A steel ball rolls through the sand and draws grooves. Drag anywhere to steer the ball."></canvas>
      <div class="tb-coach" id="coach" role="status" aria-live="polite">Drag the ball!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
    <section class="tb-panel" id="panel">
      <button class="btn tb-go" id="goBtn">Draw!</button>
      <div class="tb-choices pats" id="pats" role="group" aria-label="Patterns"></div>
      <nav class="tb-tabs" aria-label="More">
        <button class="btn" id="lightBtn" aria-label="Change the light color"><span class="ldot" id="ldot"></span>Light</button>
        <button class="btn tb-new" id="smoothBtn" aria-label="Smooth the sand"><svg class="rake" viewBox="0 0 32 28" aria-hidden="true"><path d="M2 24c3-2.2 6-2.2 9 0M2 18.5c2.4-1.8 4.8-1.8 7.2 0" fill="none" stroke="#8A5A2B" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/><path d="M27 2 19.5 12.5" stroke="#1D2340" stroke-width="3.6" stroke-linecap="round"/><path d="M12.5 9.5 25.5 17" stroke="#1D2340" stroke-width="4" stroke-linecap="round"/><path d="M13.5 12.5l-1.6 3.4M17.2 14.6l-1.6 3.4M20.9 16.7l-1.6 3.4M24.6 18.8 23 22.2" stroke="#1D2340" stroke-width="2.4" stroke-linecap="round"/></svg>Smooth</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Constants ----------
  var KEY = "sand-table-v1";          // { ball:[x,y], pat, light }
  var SKEY = "sand-table-sand-v1";    // the sand itself: the heightmap as a grey PNG (1/32 of a cell per step)
  var OUT = "#1D2340";
  var TAU = Math.PI * 2;
  var DEBUG = /[?&]debug\b/.test(location.search);
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Everything on the table is in "table units": the sand is a circle of radius 1 around (0, 0), y down.
  var N = 560;                 // heightmap cells across the sand (fixed, so a resize never redraws it)
  var HALF = N / 2;
  var RB = 0.06;               // ball radius
  var RG = 0.042;              // groove half width
  var RR = 0.078;              // ridge outer edge (sand pushed up on both sides)
  var LIM = 1 - RB - 0.012;    // how far out the ball's middle may go
  var DEPTH = RG * HALF * 0.3;           // groove depth in cells
  var RIDGE = DEPTH * 0.75;              // ridge height in cells (the slopes meet smoothly)
  var RECENT = RR * 2.6;                 // path length behind the ball that its own ridges must not fill back in
  var STEP = 0.008;            // pattern points are this far apart
  var V_FINGER = 1.7;          // table radii per second: the ball's top speed behind a finger (calm, catches up)
  var V_PAT = 0.62;            // drawing a pattern by itself (calm)
  var WIPE_SECS = 7.5;         // the spiral smoothing takes about this long
  var RESUME_MS = 2600;        // after a finger lets go in Draw! mode, the pattern carries on
  var SAND = [242, 222, 184];
  var LIGHTS = ["#FFC86B", "#56C2FF", "#B07CFF", "#FF7DC0", "#5FE08A", "#FF9248", "#FFFFFF"];
  // Light from the top left, a little above.
  var LX = -0.52, LY = -0.62, LZ = 0.59;
  (function () { var l = Math.hypot(LX, LY, LZ); LX /= l; LY /= l; LZ /= l; })();

  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function now() { return performance.now(); }

  // ---------- Patterns (each a list of [x, y] points in table units) ----------
  function polar(r, a) { return [r * Math.cos(a), r * Math.sin(a)]; }
  function curve(f, t0, t1, n, out) {
    out = out || [];
    for (var i = 0; i <= n; i++) out.push(f(t0 + (t1 - t0) * i / n));
    return out;
  }
  function gcd(a, b) { while (b) { var t = b; b = a % b; a = t; } return a; }
  var HEART = (function () {
    var raw = curve(function (t) {
      var s = Math.sin(t);
      return [16 * s * s * s, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))];
    }, 0, TAU, 400);
    var y0 = 1e9, y1 = -1e9, m = 0;
    raw.forEach(function (p) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
    var cy = (y0 + y1) / 2;
    raw.forEach(function (p) { p[1] -= cy; m = Math.max(m, Math.hypot(p[0], p[1])); });
    return raw.map(function (p) { return [p[0] / m, p[1] / m]; });
  })();
  function heartAt(cx, cy, s, out) {
    HEART.forEach(function (p) { out.push([cx + p[0] * s, cy + p[1] * s]); });
    return out;
  }
  var PATS = [
    { id: "spiral", name: "Spiral", vars: 3, make: function (v) {
      var turns = [5.5, 4.2, 6.5][v];
      return curve(function (t) { return polar(0.9 * t, -Math.PI / 2 + turns * TAU * t); }, 0, 1, 2000);
    } },
    { id: "flower", name: "Flower", vars: 4, make: function (v) {
      var k = [5, 4, 3, 7][v], per = k % 2 ? Math.PI : TAU, a0 = Math.PI / (2 * k), out = [];
      curve(function (t) { return polar(0.9 * Math.cos(k * t), t); }, a0, a0 + per, 1400, out);
      curve(function (t) { return polar(0.5 * Math.cos(k * t), t + a0); }, a0, a0 + per, 900, out);
      return out;
    } },
    { id: "star", name: "Star", vars: 4, make: function (v) {
      var nm = [[7, 3], [5, 2], [8, 3], [9, 4]][v], n = nm[0], m = nm[1], out = [], i;
      for (i = 0; i <= n; i++) out.push(polar(0.9, -Math.PI / 2 + TAU * i * m / n));
      for (i = 0; i <= n; i++) out.push(polar(0.46, -Math.PI / 2 + Math.PI / n + TAU * i * m / n));
      for (i = 0; i <= 60; i++) out.push(polar(0.16, -Math.PI / 2 + Math.PI / n + TAU * i / 60));
      return out;
    } },
    { id: "heart", name: "Heart", vars: 2, make: function (v) {
      var sc = [[0.9, 0.62, 0.34], [0.9, 0.7, 0.5, 0.3]][v], out = [];
      sc.forEach(function (s) { heartAt(0, 0, s, out); });
      return out;
    } },
    { id: "waves", name: "Waves", vars: 3, make: function (v) {
      var rows = [7, 6, 8][v], A = [0.065, 0.08, 0.05][v], f = [5, 4, 6][v], out = [], i, j;
      for (j = 0; j < rows; j++) {
        var y = -0.8 + 1.6 * j / (rows - 1), c = Math.sqrt(Math.max(0, 0.9 * 0.9 - y * y)) - 0.03;
        for (i = 0; i <= 160; i++) {
          var x = -c + 2 * c * i / 160;
          if (j % 2) x = -x;
          out.push([x, y + A * Math.sin(x * f * Math.PI)]);
        }
      }
      return out;
    } },
    { id: "swirl", name: "Swirl", vars: 4, make: function (v) {
      var p = [[6, 1, 3], [9, 2, 3], [7, 3, 2], [7, 2, 4]][v], R = p[0], r = p[1], d = p[2];
      var k = (R - r) / r, T = TAU * r / gcd(R, r), sc = 0.9 / ((R - r) + d);
      return curve(function (t) {
        return [sc * ((R - r) * Math.cos(t) + d * Math.cos(k * t)), sc * ((R - r) * Math.sin(t) - d * Math.sin(k * t))];
      }, 0, T, 4000);
    } },
    { id: "rings", name: "Rings", vars: 2, make: function (v) {
      var step = [0.15, 0.2][v], out = [], r, i;
      for (r = 0.9; r > 0.1; r -= step) {
        for (i = 0; i <= 160; i++) out.push(polar(r, -Math.PI / 2 + TAU * i / 160));
      }
      return out;
    } }
  ];
  var PAT_BY = {};
  PATS.forEach(function (p) { PAT_BY[p.id] = p; });

  // Even spacing (STEP) so the ball moves along a pattern at a steady speed.
  function resample(pts) {
    var out = [pts[0][0], pts[0][1]], need = STEP, ax = pts[0][0], ay = pts[0][1];
    for (var i = 1; i < pts.length; i++) {
      var bx = pts[i][0], by = pts[i][1], dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy), pos = 0;
      while (pos + need <= L) { pos += need; out.push(ax + dx * pos / L, ay + dy * pos / L); need = STEP; }
      need -= (L - pos);
      ax = bx; ay = by;
    }
    return new Float32Array(out);
  }
  var patCache = {};
  function patPoints(id, v) {
    var k = id + ":" + v;
    if (!patCache[k]) patCache[k] = resample(PAT_BY[id].make(v));
    return patCache[k];
  }

  // ---------- Saved state ----------
  // Opening Sand Table from the Toybox home screen starts with smooth sand; a reload keeps the sand.
  if (window.Toybox && Toybox.fresh()) {
    try { localStorage.removeItem(KEY); localStorage.removeItem(SKEY); } catch (e) { /* ignore */ }
  }
  var prefs = { ball: [0, 0], pat: "spiral", light: 0 };
  try {
    var o = JSON.parse(localStorage.getItem(KEY) || "null");
    if (o && typeof o === "object") {
      if (o.ball && o.ball.length === 2 && isFinite(o.ball[0]) && isFinite(o.ball[1])) prefs.ball = [Number(o.ball[0]), Number(o.ball[1])];
      if (PAT_BY[o.pat]) prefs.pat = o.pat;
      if (typeof o.light === "number" && o.light >= 0 && o.light < LIGHTS.length) prefs.light = Math.floor(o.light);
    }
  } catch (e) { /* bad data: defaults */ }
  function savePrefs() {
    prefs.ball = [Math.round(ball.x * 1000) / 1000, Math.round(ball.y * 1000) / 1000];
    try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch (e) { /* ignore */ }
  }

  // ---------- The sand: a heightmap, shaded into a small canvas ----------
  var H = new Float32Array(N * N);        // height in cells: 0 is smooth sand, below is a groove, above a ridge
  var CARVE = new Float32Array(N * N);    // path length when the ball last carved this cell
  var GR = new Float32Array(N * N);       // fixed sand grain (a tiny brightness change per cell)
  var cum = 0;                            // path length the ball has rolled (table units)
  (function () {
    for (var i = 0; i < N * N; i++) { GR[i] = 1 + (Math.random() - 0.5) * 0.055; CARVE[i] = -1e9; }
  })();
  var sandC = document.createElement("canvas");
  sandC.width = sandC.height = N;
  var sctx = sandC.getContext("2d");
  var IMG = sctx.createImageData(N, N);
  var dx0 = N, dy0 = N, dx1 = -1, dy1 = -1;  // dirty cells to shade
  function markDirty(x0, y0, x1, y1) {
    if (x0 < dx0) dx0 = x0; if (y0 < dy0) dy0 = y0; if (x1 > dx1) dx1 = x1; if (y1 > dy1) dy1 = y1;
  }
  var sandChanged = 0;   // time of the last change (for saving)
  function cellX(x) { return (x + 1) * HALF - 0.5; }

  // Roll the ball from A to B: carve the groove (newest wins), push ridges up on both sides.
  function stampSeg(ax, ay, bx, by, c0, c1) {
    var Ax = cellX(ax), Ay = cellX(ay), Bx = cellX(bx), By = cellX(by);
    var rg = RG * HALF, rr = RR * HALF, rr2 = rr * rr;
    var x0 = Math.max(1, Math.floor(Math.min(Ax, Bx) - rr)), x1 = Math.min(N - 2, Math.ceil(Math.max(Ax, Bx) + rr));
    var y0 = Math.max(1, Math.floor(Math.min(Ay, By) - rr)), y1 = Math.min(N - 2, Math.ceil(Math.max(Ay, By) + rr));
    if (x1 < x0 || y1 < y0) return;
    var vx = Bx - Ax, vy = By - Ay, L2 = vx * vx + vy * vy, L = Math.sqrt(L2), x, y, i;
    // Ridges use the distance to the segment's line, a little past both ends, so the joins between
    // segments stay smooth (round caps would leave a bump at every join).
    var ext = L > 0 ? Math.max(0.5, 3 / L) : 0;
    for (y = y0; y <= y1; y++) {
      var py = y - Ay;
      i = y * N + x0;
      for (x = x0; x <= x1; x++, i++) {
        var px = x - Ax, tu = L2 > 0 ? (px * vx + py * vy) / L2 : 0;
        var t = tu < 0 ? 0 : (tu > 1 ? 1 : tu);
        var qx = px - t * vx, qy = py - t * vy, d2 = qx * qx + qy * qy, c = c0 + (c1 - c0) * t;
        if (d2 < rg * rg) {
          // The newest groove wins: it reshapes old grooves and ridges it crosses (over its own fresh
          // path it only deepens, so the line stays smooth).
          var q2 = d2 / (rg * rg), g = -DEPTH * (1 - q2);
          if (c - CARVE[i] > RECENT || g < H[i]) H[i] = g;
          CARVE[i] = c;
          continue;
        }
        if (L2 <= 0 || tu < -ext || tu > 1 + ext) continue;
        var ux = px - tu * vx, uy = py - tu * vy, dp2 = ux * ux + uy * uy;
        if (dp2 >= rr2 || dp2 < rg * rg) continue;
        if (c - CARVE[i] > RECENT) {
          // pushed-up sand: blends into what is there, fading out at the ridge's outer edge (no cliffs)
          var u = (Math.sqrt(dp2) - rg) / (rr - rg), r = RIDGE * Math.sin(Math.PI * u);
          if (r > H[i]) H[i] += (1 - u) * (r - H[i]);
        }
      }
    }
    markDirty(x0 - 1, y0 - 1, x1 + 1, y1 + 1);
    sandChanged = now();
  }
  // Smooth a round patch flat (the spiral wipe). k = how much (1 = fully flat in the middle).
  function flatten(cx, cy, rad, soft, k) {
    var X = cellX(cx), Y = cellX(cy), r0 = rad * HALF, r1 = (rad + soft) * HALF;
    var x0 = Math.max(0, Math.floor(X - r1)), x1 = Math.min(N - 1, Math.ceil(X + r1));
    var y0 = Math.max(0, Math.floor(Y - r1)), y1 = Math.min(N - 1, Math.ceil(Y + r1));
    if (x1 < x0 || y1 < y0) return;
    var x, y, i;
    for (y = y0; y <= y1; y++) {
      i = y * N + x0;
      for (x = x0; x <= x1; x++, i++) {
        var d = Math.hypot(x - X, y - Y);
        if (d >= r1) continue;
        var w = d <= r0 ? 1 : 1 - (d - r0) / (r1 - r0);
        w = w * w * (3 - 2 * w) * k;
        H[i] *= (1 - w);
        if (Math.abs(H[i]) < 0.02) H[i] = 0;
      }
    }
    markDirty(x0 - 1, y0 - 1, x1 + 1, y1 + 1);
    sandChanged = now();
  }
  // Light the dirty cells into the sand canvas.
  var KS = 1.0, AO = 0.03;
  function shade(x0, y0, x1, y1) {
    x0 = Math.max(0, x0); y0 = Math.max(0, y0); x1 = Math.min(N - 1, x1); y1 = Math.min(N - 1, y1);
    if (x1 < x0 || y1 < y0) return;
    var D = IMG.data, x, y, i;
    for (y = y0; y <= y1; y++) {
      var up = y > 0 ? -N : 0, dn = y < N - 1 ? N : 0;
      i = y * N + x0;
      for (x = x0; x <= x1; x++, i++) {

    fullness = n ? hit / n : 0;
    $("smoothBtn").classList.toggle("full", fullness > FULL && cum - cumAtSmooth > FULL_LINE && !(route && route.kind === "wipe"));
  }

  // ---------- Frame loop ----------
  var last = now(), frameTimes = [];
  function frame(t) {
    var dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
    if (DEBUG) { frameTimes.push(t - last); if (frameTimes.length > 240) frameTimes.shift(); }
    last = t;
    update(dt);
    checkEnding();
    trackDamage(shadeDirty());
    if (dirty) { dirty = false; dmg = null; var e = Ro + 8 * dpr; render([cx - e, cy - e, cx + e + 6 * dpr, cy + e + 6 * dpr]); }
    else if (dmg) { var d = dmg; dmg = null; render(d); }
    // a gentle glow on Smooth once the sand is very full of lines (a hint; the coach never nags)
    if (t - fullAt > 1500 && sandChanged > fullAt) { fullAt = t; measureFull(); }
    // save once things have been still for a moment
    if (sandChanged > savedAt && t - sandChanged > 2500 && !route && !steer) saveSand();
    requestAnimationFrame(frame);
  }

  // ---------- Start ----------
  smoothAll();
  shadeDirty();
  loadSand();
  W.pat = prefs.pat;
  resize();
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });
  window.addEventListener("pagehide", function () { if (sandChanged > savedAt) saveSand(); else savePrefs(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden && sandChanged > savedAt) saveSand(); });
  renderPanel();
  Toybox.init({
    app: "sand-table",
    big: { button: $("bigBtn") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the ball finishes its line and stops, and the light dims.",
    goodbyeOption: "End with a Goodbye button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Goodbye, sand",
    farewellDone: "Bye bye, sand!",
    restLine: "The sand is resting.",
    restLine2: "It will be right here next time.",
    restArt: restArt,
    soundNote: "A soft sandy hiss while the ball rolls. Hold for 2 seconds.",
    onEnding: onEnding,
    onGoodbye: onGoodbye,
    onRest: function () { endDone = null; route = null; steer = null; ball.vx = ball.vy = 0; killHiss(); },
    onWake: function () { ending = false; endDone = null; dimTarget = 1; renderPanel(); updateCoach(); },
    onBig: function () { setTimeout(resize, 30); },
    onSound: function (on) { if (!on) killHiss(); }
  });
  stage.appendChild($("tb-toast"));
  stage.appendChild($("tb-farewell"));
  if (Toybox.timer.locked()) { dim = dimTarget = 0.12; }
  if (DEBUG) {
    window.sandDebug = {
      state: function () {
        return { ball: [ball.x, ball.y], mode: steer ? "finger" : (route ? route.kind : "free"), on: W.on, pat: W.pat, k: W.k,
          done: W.done, light: prefs.light, coach: coachText, renderMs: renderMs, cum: cum, Rs: Rs / dpr, cx: cx / dpr, cy: cy / dpr };
      },
      frames: function () { var a = frameTimes.slice().sort(function (p, q) { return p - q; }); return { n: a.length, median: a[a.length >> 1], p95: a[Math.floor(a.length * 0.95)], max: a[a.length - 1] }; },
      start: function (id, v) { startPattern(id, v || 0, 0); },
      smooth: function () { W.on = false; startWipe(null); },
      surprise: surprise,
      fast: function (f) { V_PAT = 0.62 * f; },
      fullness: function () { return fullness; },
      height: function (x, y) { return H[Math.round(cellX(y)) * N + Math.round(cellX(x))]; },
      shadeMs: function () { var t = now(); markDirty(0, 0, N - 1, N - 1); shadeDirty(); return now() - t; },
      ghost: function () { return ghost.show(); },
      sand: function () { return sandC.toDataURL(); },
      row: function (y, x0, x1) { var o = [], j = Math.round(cellX(y)); for (var x = Math.round(cellX(x0)); x <= Math.round(cellX(x1)); x++) o.push(Math.round(H[j * N + x] * 100) / 100); return o; },
      col: function (x, y0, y1) { var o = [], i = Math.round(cellX(x)); for (var y = Math.round(cellX(y0)); y <= Math.round(cellX(y1)); y++) o.push(Math.round(H[y * N + i] * 100) / 100); return o; },
      tilt: function (x, y) { tilt.on = true; tilt.has = true; tilt.x = x; tilt.y = y; }
    };
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
