<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spirograph</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spirograph">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Stage: a sheet of paper ---------- */
.stage { background: #FFFFFF; touch-action: none; }
#view {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: pointer;
}
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; width: 44px; height: 44px; pointer-events: none; }
.stage .toast { position: absolute; top: 12px; z-index: 4; font-size: 1.3rem; }
.stage .farewell { position: absolute; top: 12px; bottom: auto; z-index: 4; }
.stage .farewell p { font-size: 1.25rem; }
body.big .tb-panel { display: none; }
body.big .shelfview { display: none; }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }
body.ending #view { cursor: default; }
.rest-art { aspect-ratio: 1; }
/* The old sheet flying onto the Shelf button when New is pressed. */
.flyaway { position: fixed; z-index: 30; pointer-events: none; border-radius: 18px; border: 3px solid #1D2340; background: #FFFFFF;
  transform-origin: 0 0; transition: transform 0.9s cubic-bezier(.45,.05,.4,1), opacity 0.9s ease; }

/* ---------- Panel (tb-v2): the rings, the wheels and the Pen, then the bottom bar ----------
   Two rows of tiles: the four rings (each shows its shape), then the three wheels (each shows the pattern it makes)
   and the Pen (a tap puts the next pen in). The bottom bar: Shelf (his drawings), New, Surprise. */
.tb-head a { text-decoration: none; }
.tb-tilerow .tb-pic canvas, .tb-tilerow .tb-pic svg { width: 100%; height: 100%; display: block; }
.tb-tilerow .tb-tile.pop { animation: tb-pop 0.6s ease-out; }
@media (prefers-reduced-motion: reduce) { .tb-tilerow .tb-tile.pop { animation: none; } }
/* Phone held sideways: a wider column, so four tiles fit a row at full size (the ring is limited by the height). */
@media (orientation: landscape) and (max-height: 520px) {
  .tb-v2 .tb-body .tb-panel { width: calc(4 * var(--tb-tile) + 3 * var(--tb-s2) + 24px); }
}
/* iPad held sideways: two tiles a row in the side column. */
@media (orientation: landscape) and (min-height: 521px) {
  #rings.tb-tilerow, #gears.tb-tilerow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* Big: the header buttons and the panel hide; drawing goes on. */
body.big .tb-head > :not(.bigtoggle) { display: none; }

/* Shelf: his drawings, covering the paper while it is open. A tap on one puts it back on the paper. */
.shelfview { position: absolute; inset: 0; z-index: 5; background: #F4FAFF; padding: 14px; overflow-y: auto; overscroll-behavior: contain;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; align-content: start; touch-action: pan-y; }
.shelfview[hidden] { display: none; }
.shelfview .btn.thumb { aspect-ratio: 1; min-height: 0; padding: 4px; border-radius: 18px; background: #FFFFFF; }
.shelfview .thumb canvas { width: 100%; height: 100%; display: block; }
.shelfview .btn.thumb[aria-pressed="true"] { background: var(--tb-pick); }
.shelfview .empty { grid-column: 1 / -1; margin: auto; padding: 24px 12px; font-weight: 800; color: var(--muted); text-align: center;
  font-size: var(--tb-fs-btn); line-height: 1.25; }
@media (min-width: 700px) and (min-height: 700px) { .shelfview { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; padding: 18px; } }
@media (prefers-reduced-motion: reduce) { .flyaway { transition: opacity 0.4s ease; } }
</style>
</head>
<body>
<div class="tb-app-shell tb-v2">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Spirograph</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="view" role="img" aria-label="A sheet of paper with a gear ring and a wheel gear holding a pen. Move a finger round and round to draw a pattern, or tap the paper."></canvas>
      <div class="shelfview" id="shelf" role="group" aria-label="My drawings" hidden></div>
      <div id="coach"></div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>

    <section class="tb-panel" id="panel">
      <div id="rings" role="group" aria-label="Rings"></div>
      <div id="gears" role="group" aria-label="Wheels and the pen"></div>
      <div id="bottom"></div>
    </section>
  </div>
</div>
<script>
(function () {
  "use strict";

  // Spirograph: a fixed ring gear with a wheel gear rolling inside it; a pen in one of the wheel's holes
  // draws the pattern. Unlike the real toy nothing can go wrong: the wheel is always meshed, any finger
  // movement rolls it smoothly along the ring, and the pen always draws the exact curve.
  //
  // Geometry: each ring is a closed "pitch curve" sampled at equal arc length (unit coordinates, about
  // radius 1). The wheel's position is the arc length u along that curve (unwrapped, so it can go past a
  // lap or below zero). For a ring with N teeth and a wheel with n teeth the wheel radius is
  // r = P n / (2 pi N) (P = the ring's perimeter), so teeth of both gears have the same pitch and the
  // pattern closes after n / gcd(N, n) laps. Wheel centre c = p(u) + r * inwardNormal(u); wheel turn
  // psi = beta(u) - u / r (beta = the outward normal's angle, unwrapped); pen = c + d * (cos, sin)(psi + a).
  //
  // A drawing is data, not pixels: a list of patterns, each with its gears and the arc-length ranges that
  // were inked in each pen. That keeps every line a perfect curve, redraws crisply after a rotation, and
  // makes the My drawings shelf tiny in localStorage.

  var KEY = "spirograph-v1";
  var OUT = "#1D2340";
  var TAU = Math.PI * 2;
  var DEBUG = /[?&]debug\b/.test(location.search);
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function gcd(a, b) { while (b) { var t = a % b; a = b; b = t; } return a; }
  function now() { return performance.now(); }

  // ---------- Rings, wheels, holes, pens ----------
  var BAND = 0.17;                 // width of the plastic ring outside its teeth (unit coordinates)
  var SHAPES = {
    round:  { kind: "circle", R: 1, teeth: 56, wheels: { small: 16, medium: 35, big: 42 } },
    oval:   { kind: "stadium", Rc: 0.66, h: 0.36, teeth: 70, wheels: { small: 20, medium: 28, big: 30 } },
    flower: { kind: "flower", A: 0.93, k: 5, e: 0.05, teeth: 60, wheels: { small: 15, medium: 20, big: 24 } },
    triangle: { kind: "flower", A: 0.93, k: 3, e: 0.08, teeth: 63, wheels: { small: 14, medium: 18, big: 27 } }
  };
  var SHAPE_IDS = ["round", "oval", "flower", "triangle"];
  var SHAPE_NAME = { round: "Round", oval: "Oval", flower: "Flower", triangle: "Triangle" };
  var WHEELS = ["small", "medium", "big"];
  var WHEEL_NAME = { small: "Small", medium: "Medium", big: "Big" };
  var WHEEL_TINT = { small: "rgba(255,154,77,0.55)", medium: "rgba(76,217,100,0.5)", big: "rgba(255,111,216,0.45)" };
  var HOLES = ["edge", "middle", "center"];
  var HOLE = { edge: { f: 0.78, a: 0 }, middle: { f: 0.52, a: 2.3 }, center: { f: 0.26, a: 4.3 } };
  var HOLE_NAME = { edge: "Edge", middle: "Middle", center: "Center" };
  var PENS = [
    { id: "red", name: "Red", c: "#E63946" }, { id: "orange", name: "Orange", c: "#F77F00" },
    { id: "green", name: "Green", c: "#2E9E5B" }, { id: "blue", name: "Blue", c: "#2D5BD7" },
    { id: "purple", name: "Purple", c: "#7B4FC9" }, { id: "pink", name: "Pink", c: "#F26CA7" },
    { id: "rainbow", name: "Rainbow" }, { id: "glitter", name: "Glitter", c: "#E0A100" }
  ];
  var PEN = {};
  PENS.forEach(function (p) { PEN[p.id] = p; });
  var SOLID = PENS.filter(function (p) { return p.id !== "rainbow" && p.id !== "glitter"; }).map(function (p) { return p.id; });
  var GLINTS = ["#FFFFFF", "#FFE14D", "#FF6FD8", "#3DB4FF", "#4CD964", "#FF9A4D"];

  // Arc-length tables for each ring (built once).
  var M = 2048;
  function shapePoint(S, t) {   // t in [0, 1): a point on the pitch curve, going round with increasing angle
    var a = t * TAU;
    if (S.kind === "circle") return [S.R * Math.cos(a), S.R * Math.sin(a)];
    if (S.kind === "flower") { var rr = S.A * (1 + S.e * Math.cos(S.k * a)); return [rr * Math.cos(a), rr * Math.sin(a)]; }
    // stadium: right half circle, top straight, left half circle, bottom straight (by length)
    var Rc = S.Rc, h = S.h, arc = Math.PI * Rc, L = 2 * arc + 4 * h, s = t * L;
    if (s < arc) { a = -Math.PI / 2 + s / Rc; return [h + Rc * Math.cos(a), Rc * Math.sin(a)]; }
    s -= arc;
    if (s < 2 * h) return [h - s, Rc];
    s -= 2 * h;
    if (s < arc) { a = Math.PI / 2 + s / Rc; return [-h + Rc * Math.cos(a), Rc * Math.sin(a)]; }
    s -= arc;
    return [-h + s, -Rc];
  }
  function buildShape(id) {
    var S = SHAPES[id];
    if (S.px) return S;
    var F = 16384, fx = new Float64Array(F + 1), fy = new Float64Array(F + 1), cum = new Float64Array(F + 1), i, p;
    for (i = 0; i <= F; i++) { p = shapePoint(S, (i % F) / F); fx[i] = p[0]; fy[i] = p[1]; }
    for (i = 1; i <= F; i++) cum[i] = cum[i - 1] + Math.hypot(fx[i] - fx[i - 1], fy[i] - fy[i - 1]);
    var P = cum[F];
    var px = new Float64Array(M + 1), py = new Float64Array(M + 1), j = 0;
    for (i = 0; i < M; i++) {
      var s = i / M * P;
      while (j < F - 1 && cum[j + 1] < s) j++;
      var w = (s - cum[j]) / Math.max(1e-12, cum[j + 1] - cum[j]);
      px[i] = fx[j] + (fx[j + 1] - fx[j]) * w;
      py[i] = fy[j] + (fy[j + 1] - fy[j]) * w;
    }
    px[M] = px[0]; py[M] = py[0];
    var nx = new Float64Array(M + 1), ny = new Float64Array(M + 1), bt = new Float64Array(M + 1), prev = 0;
    for (i = 0; i < M; i++) {
      var a = (i + M - 1) % M, b = (i + 1) % M, tx = px[b] - px[a], ty = py[b] - py[a], tl = Math.hypot(tx, ty) || 1;
      tx /= tl; ty /= tl;
      nx[i] = -ty; ny[i] = tx;                      // inward normal
      var ang = Math.atan2(-ny[i], -nx[i]);        // outward normal's angle, unwrapped
      if (i > 0) { while (ang - prev > Math.PI) ang -= TAU; while (ang - prev < -Math.PI) ang += TAU; }
      bt[i] = ang; prev = ang;
    }
    nx[M] = nx[0]; ny[M] = ny[0]; bt[M] = bt[0] + TAU;
    // Smallest radius of curvature where the ring bulges outward (the wheel must fit there).
    var minRad = Infinity;
    for (i = 0; i < M; i++) {
      var db = bt[i + 1] - bt[i];
      if (db > 1e-9) minRad = Math.min(minRad, (P / M) / db);
    }
    var ext = [0, 0];
    for (i = 0; i < M; i++) { ext[0] = Math.max(ext[0], Math.abs(px[i])); ext[1] = Math.max(ext[1], Math.abs(py[i])); }
    S.P = P; S.px = px; S.py = py; S.nx = nx; S.ny = ny; S.bt = bt; S.minRad = minRad;
    S.ext = [ext[0] + BAND + 0.03, ext[1] + BAND + 0.03];
    return S;
  }
  SHAPE_IDS.forEach(buildShape);

  // The geometry of one setup ("rig"): ring, wheel, hole and how many wheel teeth it was turned (ph).
  function rigGeo(shape, wheel, hole, ph) {
    var S = SHAPES[shape], n = S.wheels[wheel], N = S.teeth, g = gcd(N, n);
    var r = S.P * n / (TAU * N), H = HOLE[hole];
    return { S: S, n: n, N: N, r: r, d: H.f * r, ha: H.a, ph: ph || 0, laps: n / g, Lp: S.P * n / g, petals: N / g, g: g,
      off: (ph || 0) * TAU / n + H.a };
  }
  var tmp = { x: 0, y: 0, nx: 0, ny: 0, b: 0 };
  function ringAt(S, u, o) {
    var P = S.P, lap = Math.floor(u / P), s = u - lap * P, f = s / P * M, i = Math.floor(f), w = f - i;
    if (i >= M) { i = M - 1; w = 1; }
    o.x = S.px[i] + (S.px[i + 1] - S.px[i]) * w;
    o.y = S.py[i] + (S.py[i + 1] - S.py[i]) * w;
    o.nx = S.nx[i] + (S.nx[i + 1] - S.nx[i]) * w;
    o.ny = S.ny[i] + (S.ny[i + 1] - S.ny[i]) * w;
    var l = Math.hypot(o.nx, o.ny) || 1;
    o.nx /= l; o.ny /= l;
    o.b = S.bt[i] + (S.bt[i + 1] - S.bt[i]) * w + lap * TAU;
    return o;
  }
  // Pen point for arc length u (writes into out[0], out[1]); returns the wheel's turn angle.
  function penAt(G, u, out) {
    ringAt(G.S, u, tmp);
    var cx = tmp.x + G.r * tmp.nx, cy = tmp.y + G.r * tmp.ny, psi = tmp.b - u / G.r;
    out[0] = cx + G.d * Math.cos(psi + G.off);
    out[1] = cy + G.d * Math.sin(psi + G.off);
    out[2] = cx; out[3] = cy; out[4] = psi;
    return out;
  }

  // ---------- State ----------
  // st.rig: the gears on the paper now. st.pats: the drawing. st.cur: the pattern being drawn (index) or -1.
  function freshRig() { return { shape: "round", wheel: "small", hole: "edge", pen: "red", ph: 0 }; }
  var st = { rig: freshRig(), u: 0, pats: [], cur: -1, from: null, shelf: [], tab: "gears" };

  function loadAll() {
    var o = null;
    try { o = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { o = null; }
    if (!o || typeof o !== "object") return;
    if (Array.isArray(o.shelf)) st.shelf = o.shelf.filter(function (d) { return d && Array.isArray(d.pats); }).slice(0, 16);
    if (window.Toybox && Toybox.fresh()) {
      // Opened from the home screen: blank paper. The last drawing goes onto his My drawings shelf.
      var old = Array.isArray(o.pats) ? o.pats.map(unpackPat).filter(function (p) { return p && p.hi - p.lo > 0.01; }) : [];
      if (old.length) {
        var d = null;
        for (var i = 0; i < st.shelf.length; i++) if (st.shelf[i].id === o.from) d = st.shelf.splice(i, 1)[0];
        d = d || { id: "d" + Date.now().toString(36) + Math.floor(Math.random() * 1000) };
        d.pats = old.map(packPat); d.t = Date.now();
        st.shelf.unshift(d);
        if (st.shelf.length > 16) st.shelf.length = 16;
        saveNow();
      }
      return;
    }
    if (o.rig && typeof o.rig === "object") {
      var r = o.rig;
      if (SHAPES[r.shape]) st.rig.shape = r.shape;
      if (WHEELS.indexOf(r.wheel) !== -1) st.rig.wheel = r.wheel;
      if (HOLES.indexOf(r.hole) !== -1) st.rig.hole = r.hole;
      if (PEN[r.pen]) st.rig.pen = r.pen;
      if (typeof r.ph === "number" && isFinite(r.ph)) st.rig.ph = Math.round(r.ph);
    }
    if (typeof o.u === "number" && isFinite(o.u)) st.u = o.u;
    if (Array.isArray(o.pats)) st.pats = o.pats.map(unpackPat).filter(Boolean);
    if (typeof o.from === "string") st.from = o.from;
    if (typeof o.tab === "string" && /^(gears|rings|pens|mine)$/.test(o.tab)) st.tab = o.tab;
  }
  // Pattern: { s, w, h, ph, lo, hi, done, segs: [{ c, a, b }] }. Packed as arrays to keep the shelf small.
  function r4(v) { return Math.round(v * 10000) / 10000; }
  function packPat(p) { return [p.s, p.w, p.h, p.ph, r4(p.lo), r4(p.hi), p.done ? 1 : 0, p.segs.map(function (g) { return [g.c, r4(g.a), r4(g.b)]; })]; }
  function unpackPat(a) {
    if (!Array.isArray(a) || !SHAPES[a[0]] || WHEELS.indexOf(a[1]) === -1 || HOLES.indexOf(a[2]) === -1) return null;
    var segs = Array.isArray(a[7]) ? a[7].filter(function (g) { return Array.isArray(g) && PEN[g[0]] && isFinite(g[1]) && isFinite(g[2]); })
      .map(function (g) { return { c: g[0], a: +g[1], b: +g[2] }; }) : [];
    if (!segs.length || !isFinite(a[4]) || !isFinite(a[5])) return null;
    return { s: a[0], w: a[1], h: a[2], ph: Math.round(+a[3]) || 0, lo: +a[4], hi: +a[5], done: !!a[6], segs: segs };
  }
  var saveTimer = 0;
  function saveNow() {
    clearTimeout(saveTimer); saveTimer = 0;
    var o = { v: 1, rig: st.rig, u: r4(st.u), pats: st.pats.map(packPat), from: st.from, shelf: st.shelf, tab: st.tab };
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {
      // Storage full: drop the oldest shelf drawings and try once more.
      try { o.shelf = st.shelf = st.shelf.slice(0, 6); localStorage.setItem(KEY, JSON.stringify(o)); } catch (e2) { /* ignore */ }
    }
  }
  function scheduleSave() { if (!saveTimer) saveTimer = setTimeout(saveNow, 900); }
  window.addEventListener("pagehide", saveNow);
  document.addEventListener("visibilitychange", function () { if (document.hidden) saveNow(); });

  loadAll();

  // ---------- Canvas ----------
  var stage = $("stage"), view = $("view"), ctx = view.getContext("2d");
  var paper = document.createElement("canvas"), pctx = paper.getContext("2d");      // the ink
  var ringLayer = document.createElement("canvas"), rctx = ringLayer.getContext("2d"); // the fixed ring
  var W = 0, H = 0, DPR = 1, view0 = { cx: 0, cy: 0, sc: 1, rot: 0 };
  var dirty = true;

  // Unit -> screen: a rotation by a quarter turn on upright screens, so long rings run along the long side.
  function fitView() {
    var rot = H > W * 1.04 ? 1 : 0, ex = 0, ey = 0;
    function take(id) { var e = SHAPES[id].ext; ex = Math.max(ex, e[0]); ey = Math.max(ey, e[1]); }
    take(st.rig.shape);
    st.pats.forEach(function (p) { take(p.s); });
    var m = W < 600 || H < 520 ? 6 : 14;
    var aw = W / 2 - m, ah = H / 2 - m;
    var sc = rot ? Math.min(aw / ey, ah / ex) : Math.min(aw / ex, ah / ey);
    view0 = { cx: W / 2, cy: H / 2, sc: Math.max(10, sc), rot: rot };
  }
  function toScreen(x, y, o) {
    var v = view0;
    if (v.rot) { o[0] = v.cx - y * v.sc; o[1] = v.cy + x * v.sc; }
    else { o[0] = v.cx + x * v.sc; o[1] = v.cy + y * v.sc; }
    return o;
  }
  var spinView = { a: 0, s: 1 };   // Surprise "spin": a temporary turn of the whole view (the ink itself never changes)
  function unitTransform(c, scale) {
    var v = view0, k = DPR * v.sc * (scale || 1);
    if (c === ctx && (spinView.a || spinView.s !== 1)) {
      var ca = Math.cos(spinView.a) * spinView.s * k, sa = Math.sin(spinView.a) * spinView.s * k;
      if (v.rot) c.setTransform(-sa, ca, -ca, -sa, DPR * v.cx, DPR * v.cy);
      else c.setTransform(ca, sa, -sa, ca, DPR * v.cx, DPR * v.cy);

    c.translate(cx, cy); c.rotate(reduce ? 0 : Math.sin(ft * 3) * 0.06); c.scale(k * pop, k * pop);
    c.lineJoin = "round"; c.lineCap = "round"; c.strokeStyle = OUT; c.lineWidth = Math.max(2.5, er * 0.13);
    [-1, 1].forEach(function (sg) {
      var ex = sg * sep, ey = -er * 0.45;
      c.save(); c.translate(ex, ey); c.scale(1, Math.max(0.08, bl));
      c.beginPath(); c.ellipse(0, 0, er, er * 1.12, 0, 0, TAU); c.fillStyle = "#FFFFFF"; c.fill(); c.stroke();
      var dx = look.x - (cx + ex), dy = look.y - (cy + ey), d = Math.hypot(dx, dy) || 1, m = Math.min(er * 0.42, d);
      c.beginPath(); c.arc(dx / d * m, dy / d * m, er * 0.5, 0, TAU); c.fillStyle = OUT; c.fill();
      c.beginPath(); c.arc(dx / d * m - er * 0.17, dy / d * m - er * 0.2, er * 0.17, 0, TAU); c.fillStyle = "#FFFFFF"; c.fill();
      c.restore();
      c.beginPath(); c.ellipse(sg * sep * 1.6, er * 0.8, er * 0.4, er * 0.25, 0, 0, TAU); c.fillStyle = "rgba(255,143,184,0.9)"; c.fill();
    });
    c.beginPath(); c.moveTo(-er * 0.95, er * 0.7); c.quadraticCurveTo(0, er * 1.95, er * 0.95, er * 0.7); c.closePath();
    c.fillStyle = "#E8505B"; c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-er * 0.5, er * 1.2); c.quadraticCurveTo(0, er * 0.98, er * 0.5, er * 1.2); c.quadraticCurveTo(0, er * 1.62, -er * 0.5, er * 1.2);
    c.fillStyle = "#FF8FB8"; c.fill();
    c.restore();
  }
  view.addEventListener("pointermove", function (e) { var r = view.getBoundingClientRect(); lastPtr = { x: e.clientX - r.left, y: e.clientY - r.top, at: now() }; });
  view.addEventListener("pointerdown", function (e) { var r = view.getBoundingClientRect(); lastPtr = { x: e.clientX - r.left, y: e.clientY - r.top, at: now() }; });

  // ---------- Choices: rings, wheels, the pen (each new one starts a new layer; what is drawn stays) ----------
  function pickRing(id) {
    if (locked()) return;
    if (shelfOpen()) openShelf(false);
    if (id !== st.rig.shape) setRig({ shape: id });
    wiggle();
  }
  function pickGear(id) {
    if (locked()) return;
    if (shelfOpen()) openShelf(false);
    if (id === "pen") { nextPen(); return; }
    if (id !== st.rig.wheel) setRig({ wheel: id });
    wiggle();
  }
  function nextPen() {
    var i = 0;
    for (var k = 0; k < PENS.length; k++) if (PENS[k].id === st.rig.pen) i = k;
    var cp = curPat();
    st.rig.pen = PENS[(i + 1) % PENS.length].id;
    gearTiles.set(st.rig.wheel);
    renderPens(); renderPreviews(); dirty = true; scheduleSave();
    var pb = gearTiles.button("pen");
    pb.classList.remove("pop"); void pb.offsetWidth; pb.classList.add("pop");
    Toybox.nametag(PEN[st.rig.pen].name + " pen", pb.getBoundingClientRect().left + pb.offsetWidth / 2, pb.getBoundingClientRect().top);
    // a new pen on a finished pattern starts a new layer; on an unfinished one the same curve goes on in the new color
    if (cp && cp.done) newLayer(false); else wiggle();
  }
  // A choice answers with a little hop of the wheel.
  function wiggle() { mo.lift = Math.max(mo.lift, 0.6); dirty = true; clickSound(); }

  // ---------- Coach ----------
  var coach = Toybox.coach($("coach")), learned = false;
  function learnedDrawing() {
    if (learned) return;
    learned = true;
    ghost.learned("round");
    coach.clear();
  }

  // ---------- Sound (only when the grown-up turned it on) ----------
  var noiseBuf = null, scr = null;
  function audio() { return Toybox.sound.ready(); }
  function noise(ac) {
    if (noiseBuf && noiseBuf.sampleRate === ac.sampleRate) return noiseBuf;
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }
  function clickSound() {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise(ac); f.type = "bandpass"; f.frequency.value = 2600 + Math.random() * 500; f.Q.value = 4;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    s.connect(f); f.connect(g); g.connect(ac.destination);
    s.start(t, Math.random() * 0.5, 0.06);
  }
  function scratchSound(lapsPerS) {
    var ac = audio();
    var level = ac && !mo.ending ? clamp(lapsPerS * 0.05, 0, 0.035) : 0;
    if (!ac) { if (scr) { try { scr.s.stop(); } catch (e) { /* ignore */ } scr = null; } return; }
    if (!scr && level > 0.002) {
      var s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noise(ac); s.loop = true; f.type = "bandpass"; f.frequency.value = 1500; f.Q.value = 0.8; g.gain.value = 0;
      s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
      scr = { s: s, g: g, idle: 0 };
    }
    if (scr) {
      scr.g.gain.setTargetAtTime(level, ac.currentTime, 0.05);
      if (level < 0.002) { scr.idle++; if (scr.idle > 90) { try { scr.s.stop(ac.currentTime + 0.2); } catch (e) { /* ignore */ } scr = null; } }
      else scr.idle = 0;
    }
  }
  function tone(ac, f, t, dur, vol) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function chimeSound() {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime + 0.02;
    [1046.5, 1318.5, 1568, 2093].forEach(function (f, i) { tone(ac, f, t + i * 0.16, 1.4, 0.07); tone(ac, f * 2.01, t + i * 0.16, 0.5, 0.015); });
  }
  function liftSound() {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime;
    tone(ac, 660, t, 0.25, 0.05); tone(ac, 880, t + 0.5, 0.3, 0.05);
  }

  // ---------- Ghost hand ----------
  // The hand taps the paper first (a tap draws a whole loop); on its next showing it circles a finger round the
  // paper, the way the wheel goes.
  var ghost = Toybox.ghost({
    max: 2,
    ok: function () { return !document.body.classList.contains("resting"); },
    plan: function () {
      if (mo.auto || shelfOpen() || learned || (Toybox.turning && Toybox.turning())) return null;
      var r = view.getBoundingClientRect(), pts = [], rad = view0.sc * 0.55;
      if (ghost.shown("tap") < 1) return { pts: [[r.left + view0.cx + rad * 0.4, r.top + view0.cy - rad * 0.3]], tap: true, key: "tap" };
      for (var i = 0; i <= 40; i++) {
        var a = -Math.PI / 2 + i / 40 * TAU * 1.15;
        pts.push([r.left + view0.cx + Math.cos(a) * rad, r.top + view0.cy + Math.sin(a) * rad]);
      }
      return { pts: pts, dur: 4600, key: "round" };
    }
  });

  // ---------- Timer ending, goodbye, rest ----------
  function onEnding(done) {
    ptrs = {};
    surpStop();
    mo.auto = false;
    if (shelfOpen()) openShelf(false);
    if (mo.reseat) { mo.reseat = null; st.cur = -1; }
    mo.ending = true; mo.endDone = done; mo.endAt = now();
    saveNow();
  }
  // Goodbye: the wheel rolls once round the ring with the pen lifted (no ink) and settles.
  function onGoodbye() {
    mo.goodbye = { left: geoNow().S.P };
    mo.ending = false;
    mo.lift = 1;
  }
  function stepGoodbye(dt) {
    var g = mo.goodbye, P = geoNow().S.P, v = P / (reduce ? 3 : 4.5), d = Math.min(g.left, v * dt);
    st.u += d; g.left -= d;
    dirty = true;
    if (g.left <= 0) { mo.goodbye = null; mo.ending = true; st.cur = -1; mo.uT = st.u; }
  }
  function drawRestArt() {
    var c = document.createElement("canvas");
    c.className = "rest-art";
    c.setAttribute("aria-hidden", "true");
    c.style.width = "210px"; c.style.height = "210px";
    document.body.appendChild(c);
    var pats = hasInk() ? st.pats : [previewPat("round", "small", "edge", "rainbow")];
    drawThumb(c, pats, { size: 210, lw: 0.012, bg: "#FFFFFF" });
    document.body.removeChild(c);
    c.style.width = ""; c.style.height = "";
    var x = c.getContext("2d"), s = c.width;
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.globalCompositeOperation = "destination-in";
    x.beginPath(); x.arc(s / 2, s / 2, s / 2 - 4, 0, TAU); x.fill();
    x.globalCompositeOperation = "source-over";
    x.beginPath(); x.arc(s / 2, s / 2, s / 2 - 6, 0, TAU); x.lineWidth = 8; x.strokeStyle = OUT; x.stroke();
    return c;
  }

  // ---------- Debug hooks (?debug) ----------
  if (DEBUG) {
    window.__spiro = {
      st: st, mo: mo, shapes: SHAPES,
      geo: function () { var G = geoNow(); return { r: G.r, n: G.n, N: G.N, laps: G.laps, petals: G.petals, Lp: G.Lp, P: G.S.P, minRad: G.S.minRad }; },
      fit: function () {
        var out = {};
        SHAPE_IDS.forEach(function (s) {
          WHEELS.forEach(function (w) { var G = rigGeo(s, w, "edge", 0); out[s + "/" + w] = { r: +G.r.toFixed(3), minRad: +G.S.minRad.toFixed(3), laps: G.laps, petals: G.petals }; });
        });
        return out;
      },
      roll: function (du) { mo.uT += du; },
      center: function () { var r = view.getBoundingClientRect(); return { x: r.left + view0.cx, y: r.top + view0.cy, R: view0.sc }; },
      penScreen: function () { var G = geoNow(); penAt(G, st.u, pbuf); var o = [0, 0]; toScreen(pbuf[0], pbuf[1], o); var r = view.getBoundingClientRect(); return { x: r.left + o[0], y: r.top + o[1] }; },
      // every inked range lies on its pattern's exact curve and inside its coverage
      check: function () {
        var bad = 0;
        st.pats.forEach(function (p) {
          var G = patGeo(p);
          if (p.hi - p.lo > G.Lp + 1e-3) bad++;
          p.segs.forEach(function (g) { if (g.a < p.lo - 1e-3 || g.b > p.hi + 1e-3) bad++; });
        });
        return { pats: st.pats.length, done: st.pats.filter(function (p) { return p.done; }).length, bad: bad };
      },
      ghost: function () { return ghost.show(); }, tapDraw: tapDraw,
      surprise: surprise, newPaper: newPaper, setRig: setRig,
      moment: function (k) { if (k) { surpStop(); surpStart(k); } return surp ? surp.kind : ""; },
      ink: function () { return paper.toDataURL(); }
    };
  }

  // ---------- Start ----------
  buildTiles();
  bar = Toybox.bar($("bottom"), { shelf: function () { openShelf(!shelfOpen()); }, onNew: newPaper, onSurprise: surprise });
  renderPens();
  resize();
  renderPreviews();
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); renderPreviews(); }).observe(stage);
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });
  if (hasInk()) learned = true;
  else coach.step("Draw round and round!");
  Toybox.init({
    app: "spirograph",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the wheel rolls to a stop and the pen lifts.",
    goodbyeOption: "End with a Goodbye button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Goodbye, gears",
    farewellDone: "Bye bye, gears!",
    restLine: "The gears are resting.",
    restLine2: "They will be right here next time.",
    restArt: drawRestArt,
    soundNote: "Soft gear clicks, a quiet pen and a chime. Hold for 2 seconds.",
    onEnding: onEnding,
    onGoodbye: onGoodbye,
    onRest: function () { mo.endDone = null; mo.v = 0; },
    onWake: function () { mo.ending = false; mo.goodbye = null; mo.endDone = null; st.cur = -1; mo.uT = st.u; dirty = true; },
    onBig: function () { setTimeout(resize, 30); },
    onSound: function (on) { if (on) clickSound(); }
  });
  $("stage").appendChild($("tb-toast"));
  $("stage").appendChild($("tb-farewell"));
  requestAnimationFrame(frame);
})();
</script>
