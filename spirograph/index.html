<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spirograph</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spirograph">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --tile: 62px;
  --pic: 38px;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Stage: a sheet of paper ---------- */
.stage { background: #FFFFFF; touch-action: none; }
#view {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: pointer;
}
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; width: 44px; height: 44px; pointer-events: none; }
.stage .toast { position: absolute; top: 12px; z-index: 4; font-size: 1.3rem; }
.stage .farewell { position: absolute; top: 12px; bottom: auto; z-index: 4; }
.stage .farewell p { font-size: 1.25rem; }
body.big .tb-panel { display: none; }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }
body.ending #view { cursor: default; }
.rest-art { aspect-ratio: 1; }
/* The old sheet flying into the Mine tab when New is pressed. */
.flyaway { position: fixed; z-index: 30; pointer-events: none; border-radius: 18px; border: 3px solid #1D2340; background: #FFFFFF;
  transform-origin: 0 0; transition: transform 0.9s cubic-bezier(.45,.05,.4,1), opacity 0.9s ease; }

/* ---------- Panel: Go, the picked tab's choices, then the tab bar ---------- */
.tb-tabs .tab[aria-pressed="true"] { background: var(--accent); color: #1D2340; }
.panes.tb-choices { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; gap: 0; }
.pane { grid-area: 1 / 1; visibility: hidden; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
#panel[data-tab="gears"] [data-pane="gears"],
#panel[data-tab="rings"] [data-pane="rings"],
#panel[data-tab="pens"] [data-pane="pens"],
#panel[data-tab="mine"] [data-pane="mine"] { visibility: visible; }
.row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.btn.opt {
  min-width: 0; min-height: var(--tile); height: var(--tile); padding: 2px 4px; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  font-size: 0.95rem; line-height: 1; white-space: nowrap;
}
.opt canvas { width: var(--pic); height: var(--pic); display: block; flex: none; }
/* Rings: one row of four tall tiles (as tall as the two rows of the Gears tab). */
.row.ringrow { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.ringrow .btn.opt { height: calc(var(--tile) * 2 + 6px); gap: 4px; }
.ringrow .opt canvas { width: calc(var(--pic) * 1.45); height: calc(var(--pic) * 1.45); max-width: 100%; }
/* Surprise: the tiles that changed give a little sparkly hop. */
.btn.pop { animation: tb-pop 0.9s ease-out; }
@keyframes tb-pop { 0% { transform: scale(1); box-shadow: 3px 3px 0 var(--edge), 0 0 0 0 rgba(255,201,60,0.9); }
  35% { transform: scale(1.1); box-shadow: 3px 3px 0 var(--edge), 0 0 0 8px rgba(255,201,60,0.55); }
  100% { transform: scale(1); box-shadow: 3px 3px 0 var(--edge), 0 0 0 14px rgba(255,201,60,0); } }
@media (prefers-reduced-motion: reduce) { .btn.pop { animation: none; } }
.opt .nm { font-weight: 800; }
.pens { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.btn.pen { min-width: 0; height: var(--tile); min-height: 44px; padding: 0 2px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; }
.pen svg { width: 100%; max-width: 76px; height: 100%; max-height: 40px; display: block; overflow: visible; }
.shelf { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 2px 4px 6px 2px; height: calc(var(--tile) * 2 + 6px);
  align-items: center; -webkit-overflow-scrolling: touch; touch-action: pan-x; scrollbar-width: thin; }
.btn.thumb { flex: none; height: calc(var(--tile) * 2 - 6px); aspect-ratio: 1; min-height: 0; padding: 3px; border-radius: 16px; background: #FFFFFF; }
.thumb canvas { width: 100%; height: 100%; display: block; }
.btn.thumb[aria-pressed="true"] { background: var(--accent); }
.shelf .empty { margin: auto; font-weight: 800; color: var(--muted); text-align: center; font-size: 1.05rem; line-height: 1.2; padding: 0 8px; }

/* Tabs: short words share the room, Surprise gets a little more. */
.tb-tabs .btn { flex: 1 1 auto; padding-left: 0.2rem; padding-right: 0.2rem; }
@media (max-width: 600px), (orientation: landscape) and (max-height: 520px) {
  .tb-tabs { gap: 4px; }
  .tb-tabs .btn { font-size: 0.86rem; padding-left: 0.1rem; padding-right: 0.1rem; }
}
.tb-tabs .btn.tb-surprise { flex: 1.5 1 auto; }
/* Upright phones: the round ring leaves spare height, so the picture tiles can be bigger. */
@media (orientation: portrait) and (max-width: 600px) { :root { --tile: 82px; --pic: 50px; } }
@media (orientation: portrait) and (max-width: 600px) and (max-height: 760px) { :root { --tile: 66px; --pic: 40px; } }
/* Landscape: panel on the right (the ring is limited by the height, so the panel can be wide). */
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(40%, 420px); justify-content: space-between; }
  .tb-body .tb-panel .tb-choices { overflow: visible; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: min(44%, 360px); }
  :root { --tile: 84px; --pic: 50px; }
  .tb-tabs .btn { font-size: 0.88rem; }
}
/* Tablets: bigger tiles. */
@media (min-width: 700px) and (min-height: 700px) {
  :root { --tile: 100px; --pic: 64px; }
  .row, .pens { gap: 10px; }
  .pane { gap: 10px; }
  .btn.opt { font-size: 1.1rem; gap: 2px; border-radius: 16px; }
  .btn.pen { height: 100px; }
  .pen svg { max-width: 110px; max-height: 60px; }
  .shelf { height: 210px; gap: 12px; }
  .ringrow .btn.opt { height: calc(var(--tile) * 2 + 10px); }
  .btn.thumb { height: 190px; }
}
@media (min-width: 700px) and (min-height: 700px) and (orientation: landscape) {
  .tb-body .tb-panel { width: min(36%, 420px); }
  :root { --tile: 150px; --pic: 96px; }
  .btn.pen { height: 150px; }
  .pen svg { max-height: 80px; }
  .shelf { height: 310px; }
  .btn.thumb { height: 140px; }
  .ringrow .btn.opt { height: calc(var(--tile) * 2 + 10px); }
  .shelf { flex-wrap: wrap; align-content: flex-start; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; }
  .tb-tabs .btn { font-size: 1.05rem; }
}

/* Ghost hand: a see-through hand that shows the main move once (same look in every app). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
@media (prefers-reduced-motion: reduce) { .flyaway { transition: opacity 0.4s ease; } }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Spirograph</h1>
    <button class="btn tb-iconbtn" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="view" role="img" aria-label="A sheet of paper with a gear ring and a wheel gear holding a pen. Move a finger round and round to draw a pattern."></canvas>
      <div class="tb-coach" id="coach" role="status" aria-live="polite">Move your finger round and round!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>

    <section class="tb-panel" id="panel" data-tab="gears">
      <button class="btn tb-go" id="goBtn">Draw!</button>
      <div class="panes tb-choices">
        <div class="pane" data-pane="gears" role="tabpanel" aria-label="Wheels and pen holes">
          <div class="row" id="wheelRow"></div>
          <div class="row" id="holeRow"></div>
        </div>
        <div class="pane" data-pane="rings" role="tabpanel" aria-label="Rings">
          <div class="row ringrow" id="ringRow"></div>
        </div>
        <div class="pane" data-pane="pens" role="tabpanel" aria-label="Pens">
          <div class="pens" id="penRow"></div>
        </div>
        <div class="pane" data-pane="mine" role="tabpanel" aria-label="My drawings">
          <div class="shelf" id="shelf"></div>
        </div>
      </div>
      <nav class="tb-tabs" aria-label="Controls">
        <button class="btn tab" data-tab="gears">Gears</button>
        <button class="btn tab" data-tab="rings">Rings</button>
        <button class="btn tab" data-tab="pens">Pens</button>
        <button class="btn tab" data-tab="mine">Mine</button>
        <button class="btn tb-new" id="newBtn">New</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // Spirograph: a fixed ring gear with a wheel gear rolling inside it; a pen in one of the wheel's holes
  // draws the pattern. Unlike the real toy nothing can go wrong: the wheel is always meshed, any finger
  // movement rolls it smoothly along the ring, and the pen always draws the exact curve.
  //
  // Geometry: each ring is a closed "pitch curve" sampled at equal arc length (unit coordinates, about
  // radius 1). The wheel's position is the arc length u along that curve (unwrapped, so it can go past a
  // lap or below zero). For a ring with N teeth and a wheel with n teeth the wheel radius is
  // r = P n / (2 pi N) (P = the ring's perimeter), so teeth of both gears have the same pitch and the
  // pattern closes after n / gcd(N, n) laps. Wheel centre c = p(u) + r * inwardNormal(u); wheel turn
  // psi = beta(u) - u / r (beta = the outward normal's angle, unwrapped); pen = c + d * (cos, sin)(psi + a).
  //
  // A drawing is data, not pixels: a list of patterns, each with its gears and the arc-length ranges that
  // were inked in each pen. That keeps every line a perfect curve, redraws crisply after a rotation, and
  // makes the My drawings shelf tiny in localStorage.

  var KEY = "spirograph-v1";
  var OUT = "#1D2340";
  var TAU = Math.PI * 2;
  var DEBUG = /[?&]debug\b/.test(location.search);
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function gcd(a, b) { while (b) { var t = a % b; a = b; b = t; } return a; }
  function now() { return performance.now(); }

  // ---------- Rings, wheels, holes, pens ----------
  var BAND = 0.17;                 // width of the plastic ring outside its teeth (unit coordinates)
  var SHAPES = {
    round:  { kind: "circle", R: 1, teeth: 56, wheels: { small: 16, medium: 35, big: 42 } },
    oval:   { kind: "stadium", Rc: 0.66, h: 0.36, teeth: 70, wheels: { small: 20, medium: 28, big: 30 } },
    flower: { kind: "flower", A: 0.93, k: 5, e: 0.05, teeth: 60, wheels: { small: 15, medium: 20, big: 24 } },
    triangle: { kind: "flower", A: 0.93, k: 3, e: 0.08, teeth: 63, wheels: { small: 14, medium: 18, big: 27 } }
  };
  var SHAPE_IDS = ["round", "oval", "flower", "triangle"];
  var SHAPE_NAME = { round: "Round", oval: "Oval", flower: "Flower", triangle: "Triangle" };
  var WHEELS = ["small", "medium", "big"];
  var WHEEL_NAME = { small: "Small", medium: "Medium", big: "Big" };
  var WHEEL_TINT = { small: "rgba(255,154,77,0.55)", medium: "rgba(76,217,100,0.5)", big: "rgba(255,111,216,0.45)" };
  var HOLES = ["edge", "middle", "center"];
  var HOLE = { edge: { f: 0.78, a: 0 }, middle: { f: 0.52, a: 2.3 }, center: { f: 0.26, a: 4.3 } };
  var HOLE_NAME = { edge: "Edge", middle: "Middle", center: "Center" };
  var PENS = [
    { id: "red", name: "Red", c: "#E63946" }, { id: "orange", name: "Orange", c: "#F77F00" },
    { id: "green", name: "Green", c: "#2E9E5B" }, { id: "blue", name: "Blue", c: "#2D5BD7" },
    { id: "purple", name: "Purple", c: "#7B4FC9" }, { id: "pink", name: "Pink", c: "#F26CA7" },
    { id: "rainbow", name: "Rainbow" }, { id: "glitter", name: "Glitter", c: "#E0A100" }
  ];
  var PEN = {};
  PENS.forEach(function (p) { PEN[p.id] = p; });
  var SOLID = PENS.filter(function (p) { return p.id !== "rainbow" && p.id !== "glitter"; }).map(function (p) { return p.id; });
  var GLINTS = ["#FFFFFF", "#FFE14D", "#FF6FD8", "#3DB4FF", "#4CD964", "#FF9A4D"];

  // Arc-length tables for each ring (built once).
  var M = 2048;
  function shapePoint(S, t) {   // t in [0, 1): a point on the pitch curve, going round with increasing angle
    var a = t * TAU;
    if (S.kind === "circle") return [S.R * Math.cos(a), S.R * Math.sin(a)];
    if (S.kind === "flower") { var rr = S.A * (1 + S.e * Math.cos(S.k * a)); return [rr * Math.cos(a), rr * Math.sin(a)]; }
    // stadium: right half circle, top straight, left half circle, bottom straight (by length)
    var Rc = S.Rc, h = S.h, arc = Math.PI * Rc, L = 2 * arc + 4 * h, s = t * L;
    if (s < arc) { a = -Math.PI / 2 + s / Rc; return [h + Rc * Math.cos(a), Rc * Math.sin(a)]; }
    s -= arc;
    if (s < 2 * h) return [h - s, Rc];
    s -= 2 * h;
    if (s < arc) { a = Math.PI / 2 + s / Rc; return [-h + Rc * Math.cos(a), Rc * Math.sin(a)]; }
    s -= arc;
    return [-h + s, -Rc];
  }
  function buildShape(id) {
    var S = SHAPES[id];
    if (S.px) return S;
    var F = 16384, fx = new Float64Array(F + 1), fy = new Float64Array(F + 1), cum = new Float64Array(F + 1), i, p;
    for (i = 0; i <= F; i++) { p = shapePoint(S, (i % F) / F); fx[i] = p[0]; fy[i] = p[1]; }
    for (i = 1; i <= F; i++) cum[i] = cum[i - 1] + Math.hypot(fx[i] - fx[i - 1], fy[i] - fy[i - 1]);
    var P = cum[F];
    var px = new Float64Array(M + 1), py = new Float64Array(M + 1), j = 0;
    for (i = 0; i < M; i++) {
      var s = i / M * P;
      while (j < F - 1 && cum[j + 1] < s) j++;
      var w = (s - cum[j]) / Math.max(1e-12, cum[j + 1] - cum[j]);
      px[i] = fx[j] + (fx[j + 1] - fx[j]) * w;
      py[i] = fy[j] + (fy[j + 1] - fy[j]) * w;
    }
    px[M] = px[0]; py[M] = py[0];
    var nx = new Float64Array(M + 1), ny = new Float64Array(M + 1), bt = new Float64Array(M + 1), prev = 0;
    for (i = 0; i < M; i++) {
      var a = (i + M - 1) % M, b = (i + 1) % M, tx = px[b] - px[a], ty = py[b] - py[a], tl = Math.hypot(tx, ty) || 1;
      tx /= tl; ty /= tl;
      nx[i] = -ty; ny[i] = tx;                      // inward normal
      var ang = Math.atan2(-ny[i], -nx[i]);        // outward normal's angle, unwrapped
      if (i > 0) { while (ang - prev > Math.PI) ang -= TAU; while (ang - prev < -Math.PI) ang += TAU; }
      bt[i] = ang; prev = ang;
    }
    nx[M] = nx[0]; ny[M] = ny[0]; bt[M] = bt[0] + TAU;
    // Smallest radius of curvature where the ring bulges outward (the wheel must fit there).
    var minRad = Infinity;
    for (i = 0; i < M; i++) {
      var db = bt[i + 1] - bt[i];
      if (db > 1e-9) minRad = Math.min(minRad, (P / M) / db);
    }
    var ext = [0, 0];
    for (i = 0; i < M; i++) { ext[0] = Math.max(ext[0], Math.abs(px[i])); ext[1] = Math.max(ext[1], Math.abs(py[i])); }
    S.P = P; S.px = px; S.py = py; S.nx = nx; S.ny = ny; S.bt = bt; S.minRad = minRad;
    S.ext = [ext[0] + BAND + 0.03, ext[1] + BAND + 0.03];
    return S;
  }
  SHAPE_IDS.forEach(buildShape);

  // The geometry of one setup ("rig"): ring, wheel, hole and how many wheel teeth it was turned (ph).
  function rigGeo(shape, wheel, hole, ph) {
    var S = SHAPES[shape], n = S.wheels[wheel], N = S.teeth, g = gcd(N, n);
    var r = S.P * n / (TAU * N), H = HOLE[hole];
    return { S: S, n: n, N: N, r: r, d: H.f * r, ha: H.a, ph: ph || 0, laps: n / g, Lp: S.P * n / g, petals: N / g, g: g,
      off: (ph || 0) * TAU / n + H.a };
  }
  var tmp = { x: 0, y: 0, nx: 0, ny: 0, b: 0 };
  function ringAt(S, u, o) {
    var P = S.P, lap = Math.floor(u / P), s = u - lap * P, f = s / P * M, i = Math.floor(f), w = f - i;
    if (i >= M) { i = M - 1; w = 1; }
    o.x = S.px[i] + (S.px[i + 1] - S.px[i]) * w;
    o.y = S.py[i] + (S.py[i + 1] - S.py[i]) * w;
    o.nx = S.nx[i] + (S.nx[i + 1] - S.nx[i]) * w;
    o.ny = S.ny[i] + (S.ny[i + 1] - S.ny[i]) * w;
    var l = Math.hypot(o.nx, o.ny) || 1;
    o.nx /= l; o.ny /= l;
    o.b = S.bt[i] + (S.bt[i + 1] - S.bt[i]) * w + lap * TAU;
    return o;
  }
  // Pen point for arc length u (writes into out[0], out[1]); returns the wheel's turn angle.
  function penAt(G, u, out) {
    ringAt(G.S, u, tmp);
    var cx = tmp.x + G.r * tmp.nx, cy = tmp.y + G.r * tmp.ny, psi = tmp.b - u / G.r;
    out[0] = cx + G.d * Math.cos(psi + G.off);
    out[1] = cy + G.d * Math.sin(psi + G.off);
    out[2] = cx; out[3] = cy; out[4] = psi;
    return out;
  }

  // ---------- State ----------
  // st.rig: the gears on the paper now. st.pats: the drawing. st.cur: the pattern being drawn (index) or -1.
  function freshRig() { return { shape: "round", wheel: "small", hole: "edge", pen: "red", ph: 0 }; }
  var st = { rig: freshRig(), u: 0, pats: [], cur: -1, from: null, shelf: [], tab: "gears" };

  function loadAll() {
    var o = null;
    try { o = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { o = null; }
    if (!o || typeof o !== "object") return;
    if (Array.isArray(o.shelf)) st.shelf = o.shelf.filter(function (d) { return d && Array.isArray(d.pats); }).slice(0, 16);
    if (window.Toybox && Toybox.fresh()) {
      // Opened from the home screen: blank paper. The last drawing goes onto his My drawings shelf.
      var old = Array.isArray(o.pats) ? o.pats.map(unpackPat).filter(function (p) { return p && p.hi - p.lo > 0.01; }) : [];
      if (old.length) {
        var d = null;
        for (var i = 0; i < st.shelf.length; i++) if (st.shelf[i].id === o.from) d = st.shelf.splice(i, 1)[0];

    if (ch.shape !== old.shape) sel.push('[data-ring="' + ch.shape + '"]');
    if (ch.wheel !== old.wheel) sel.push('[data-wheel="' + ch.wheel + '"]');
    if (ch.hole !== old.hole) sel.push('[data-hole="' + ch.hole + '"]');
    if (ch.pen !== old.pen) sel.push('[data-pen="' + ch.pen + '"]');
    sel.forEach(function (q) {
      var b = document.querySelector(q);
      if (!b) return;
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
      setTimeout(function () { b.classList.remove("pop"); }, 1000);
    });
    coachSay("Surprise! Move your finger round!", 3200);
    dirty = true;
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.id === "bigToggle" || t.closest(".modal, .farewell, .rest, .tb-turn, .tb-off")) return;
    if (locked()) return;
    if (t.classList.contains("tab") && t.dataset.tab) { showTab(t.dataset.tab); return; }
    if (t.dataset.wheel) { if (t.dataset.wheel !== st.rig.wheel) setRig({ wheel: t.dataset.wheel }); wiggle(); return; }
    if (t.dataset.hole) { if (t.dataset.hole !== st.rig.hole) setRig({ hole: t.dataset.hole }); wiggle(); return; }
    if (t.dataset.ring) { if (t.dataset.ring !== st.rig.shape) setRig({ shape: t.dataset.ring }); wiggle(); return; }
    if (t.dataset.pen) {
      var changed = t.dataset.pen !== st.rig.pen, cp = curPat();
      st.rig.pen = t.dataset.pen; renderPens(); renderPreviews(); dirty = true; scheduleSave();
      // a new pen on a finished pattern starts a new layer; on an unfinished one the same curve goes on in the new color
      if (changed && cp && cp.done) newLayer(false); else wiggle();
      return;
    }
    if (t.dataset.shelf) { loadShelf(t.dataset.shelf); return; }
    if (t.id === "goBtn") { goDraw(); return; }
    if (t.id === "newBtn") { newPaper(); return; }
    if (t.id === "surpriseBtn") { surprise(); return; }
  });
  // A choice answers with a little hop of the wheel.
  function wiggle() { mo.lift = Math.max(mo.lift, 0.6); dirty = true; clickSound(); }

  // ---------- Coach ----------
  var coachEl = $("coach"), coachT = 0, learned = false;
  function coachSay(text, ms) {
    coachEl.textContent = text;
    coachEl.classList.remove("off");
    clearTimeout(coachT);
    if (ms) coachT = setTimeout(function () { coachEl.classList.add("off"); }, ms);
  }
  function learnedDrawing(quiet) {
    if (learned) return;
    learned = true;
    ghost.learned();
    if (!quiet) coachT = setTimeout(function () { coachEl.classList.add("off"); }, 2500);
  }

  // ---------- Sound (only when the grown-up turned it on) ----------
  var noiseBuf = null, scr = null;
  function audio() { return Toybox.sound.ready(); }
  function noise(ac) {
    if (noiseBuf && noiseBuf.sampleRate === ac.sampleRate) return noiseBuf;
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }
  function clickSound() {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise(ac); f.type = "bandpass"; f.frequency.value = 2600 + Math.random() * 500; f.Q.value = 4;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    s.connect(f); f.connect(g); g.connect(ac.destination);
    s.start(t, Math.random() * 0.5, 0.06);
  }
  function scratchSound(lapsPerS) {
    var ac = audio();
    var level = ac && !mo.ending ? clamp(lapsPerS * 0.05, 0, 0.035) : 0;
    if (!ac) { if (scr) { try { scr.s.stop(); } catch (e) { /* ignore */ } scr = null; } return; }
    if (!scr && level > 0.002) {
      var s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noise(ac); s.loop = true; f.type = "bandpass"; f.frequency.value = 1500; f.Q.value = 0.8; g.gain.value = 0;
      s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
      scr = { s: s, g: g, idle: 0 };
    }
    if (scr) {
      scr.g.gain.setTargetAtTime(level, ac.currentTime, 0.05);
      if (level < 0.002) { scr.idle++; if (scr.idle > 90) { try { scr.s.stop(ac.currentTime + 0.2); } catch (e) { /* ignore */ } scr = null; } }
      else scr.idle = 0;
    }
  }
  function tone(ac, f, t, dur, vol) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function chimeSound() {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime + 0.02;
    [1046.5, 1318.5, 1568, 2093].forEach(function (f, i) { tone(ac, f, t + i * 0.16, 1.4, 0.07); tone(ac, f * 2.01, t + i * 0.16, 0.5, 0.015); });
  }
  function liftSound() {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime;
    tone(ac, 660, t, 0.25, 0.05); tone(ac, 880, t + 0.5, 0.3, 0.05);
  }

  // ---------- Ghost hand (same look in every app; master copy in tools/snippets/ghost-hand.js) ----------
  function makeGhost(plan, opt) {
    opt = opt || {};
    var IDLE = opt.idle || 4500, MAX = opt.max || 2;
    var lastT = Date.now(), shown = 0, armed = true, isLearned = false, run = null, el = null;
    function build() {
      el = document.createElement("div");
      el.className = "ghosthand";
      el.setAttribute("aria-hidden", "true");
      el.innerHTML = '<svg viewBox="-24 -18 64 84"><circle class="gh-press" cx="0" cy="0" r="17" fill="rgba(255,201,60,0.55)"/>' +
        '<g fill="#FFFFFF" stroke="#1D2340" stroke-width="3" stroke-linejoin="round">' +
        '<rect x="-9" y="-6" width="18" height="40" rx="9"/><rect x="-12" y="22" width="44" height="40" rx="16"/>' +
        '<rect x="10" y="14" width="14" height="24" rx="7"/></g>' +
        '<circle cx="0" cy="2" r="5" fill="rgba(255,201,60,0.9)"/></svg>';
      el.insertBefore(carryEl, el.firstChild);
      document.body.appendChild(el);
    }
    function stop() { run = null; if (el) { el.style.display = "none"; carryEl.innerHTML = ""; } }
    var carryEl = document.createElement("div");
    carryEl.className = "gh-carry";
    function poke() { lastT = Date.now(); armed = true; if (run) stop(); }
    document.addEventListener("pointerdown", poke, true);
    document.addEventListener("keydown", poke, true);
    function blocked() {
      if (document.hidden) return true;
      if (window.Toybox && (Toybox.sheetOpen() || Toybox.timer.phase() === "ending" || Toybox.timer.phase() === "resting")) return true;
      return !!(opt.ok && !opt.ok());
    }
    function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function at(pts, f) {
      if (pts.length < 2) return pts[0];
      var segs = [], tot = 0, i;
      for (i = 1; i < pts.length; i++) { var l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); tot += l; }
      var d = f * tot;
      for (i = 0; i < segs.length; i++) {
        if (d <= segs[i] || i === segs.length - 1) { var t = segs[i] ? Math.min(1, d / segs[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; }
        d -= segs[i];
      }
      return pts[pts.length - 1];
    }
    function gframe() {
      if (!run) return;
      var t = (Date.now() - run.t0) / run.dur, p = run.p, s = run.s, x, y, a, press, sc = 1;
      if (t >= 1) { stop(); return; }
      if (p.tap || p.pts.length < 2) {
        var pt = p.pts[0];
        x = pt[0]; y = pt[1];
        a = t < 0.15 ? t / 0.15 : (t > 0.85 ? (1 - t) / 0.15 : 1);
        press = (t > 0.3 && t < 0.42) || (t > 0.55 && t < 0.67);
        sc = press ? 0.92 : 1;
        if (t < 0.3) { var k = 1 - t / 0.3; x += 26 * s * k; y += 30 * s * k; }
      } else {
        a = t < 0.1 ? t / 0.1 : (t > 0.9 ? (1 - t) / 0.1 : 1);
        var f = reduce ? 0.5 : ease(Math.max(0, Math.min(1, (t - 0.16) / 0.66)));
        var q = at(p.pts, f); x = q[0]; y = q[1];
        press = t > 0.12 && t < 0.86;
        sc = t < 0.12 ? 1.12 - 0.12 * (t / 0.12) : 1;
      }
      el.style.opacity = (0.85 * a).toFixed(3);
      el.style.transform = "translate(" + (x - 24 * s) + "px," + (y - 18 * s) + "px) rotate(-14deg) scale(" + sc + ")";
      el.lastChild.firstChild.style.opacity = press ? "1" : "0";
      carryEl.style.opacity = press ? "0.75" : "0";
      requestAnimationFrame(gframe);
    }
    function show(p) {
      if (!el) build();
      var s = Math.max(1, Math.min(1.7, Math.min(innerWidth, innerHeight) / 360));
      el.style.width = (64 * s) + "px"; el.style.height = (84 * s) + "px";
      el.style.transformOrigin = (24 * s) + "px " + (18 * s) + "px";
      el.style.display = "block";
      carryEl.innerHTML = p.carry ? p.carry.html : "";
      if (p.carry) {
        var c = p.carry.size;
        carryEl.style.cssText = "position:absolute;left:" + (24 * s - c / 2) + "px;top:" + (18 * s - c / 2) + "px;width:" + c + "px;height:" + c + "px";
      }
      run = { p: p, s: s, t0: Date.now(), dur: p.dur || (p.tap ? 2400 : 3200) };
      requestAnimationFrame(gframe);
    }
    setInterval(function () {
      if (run || isLearned || !armed || shown >= MAX || Date.now() - lastT < IDLE) return;
      if (blocked()) { lastT = Date.now(); return; }
      var p = plan();
      if (!p || !p.pts || !p.pts.length) return;
      armed = false; shown++;
      show(p);
    }, 250);
    return {
      learned: function () { isLearned = true; stop(); },
      again: function () { isLearned = false; shown = 0; armed = true; lastT = Date.now(); },
      poke: poke,
      show: function () { var p = plan(); if (p) show(p); return !!p; }
    };
  }
  // The hand circles a finger round the paper, the way the wheel goes.
  var ghost = makeGhost(function () {
    if (mo.auto || Toybox.turning && Toybox.turning()) return null;
    var r = view.getBoundingClientRect(), pts = [], rad = view0.sc * 0.55;
    for (var i = 0; i <= 40; i++) {
      var a = -Math.PI / 2 + i / 40 * TAU * 1.15;
      pts.push([r.left + view0.cx + Math.cos(a) * rad, r.top + view0.cy + Math.sin(a) * rad]);
    }
    return { pts: pts, dur: 4600 };
  }, { ok: function () { return !document.body.classList.contains("resting"); } });

  // ---------- Timer ending, goodbye, rest ----------
  function onEnding(done) {
    ptrs = {};
    mo.auto = false; renderGo();
    if (mo.reseat) { mo.reseat = null; st.cur = -1; }
    mo.ending = true; mo.endDone = done; mo.endAt = now();
    saveNow();
  }
  // Goodbye: the wheel rolls once round the ring with the pen lifted (no ink) and settles.
  function onGoodbye() {
    mo.goodbye = { left: geoNow().S.P };
    mo.ending = false;
    mo.lift = 1;
  }
  function stepGoodbye(dt) {
    var g = mo.goodbye, P = geoNow().S.P, v = P / (reduce ? 3 : 4.5), d = Math.min(g.left, v * dt);
    st.u += d; g.left -= d;
    dirty = true;
    if (g.left <= 0) { mo.goodbye = null; mo.ending = true; st.cur = -1; mo.uT = st.u; }
  }
  function drawRestArt() {
    var c = document.createElement("canvas");
    c.className = "rest-art";
    c.setAttribute("aria-hidden", "true");
    c.style.width = "210px"; c.style.height = "210px";
    document.body.appendChild(c);
    var pats = hasInk() ? st.pats : [previewPat("round", "small", "edge", "rainbow")];
    drawThumb(c, pats, { size: 210, lw: 0.012, bg: "#FFFFFF" });
    document.body.removeChild(c);
    c.style.width = ""; c.style.height = "";
    var x = c.getContext("2d"), s = c.width;
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.globalCompositeOperation = "destination-in";
    x.beginPath(); x.arc(s / 2, s / 2, s / 2 - 4, 0, TAU); x.fill();
    x.globalCompositeOperation = "source-over";
    x.beginPath(); x.arc(s / 2, s / 2, s / 2 - 6, 0, TAU); x.lineWidth = 8; x.strokeStyle = OUT; x.stroke();
    return c;
  }

  // ---------- Debug hooks (?debug) ----------
  if (DEBUG) {
    window.__spiro = {
      st: st, mo: mo, shapes: SHAPES,
      geo: function () { var G = geoNow(); return { r: G.r, n: G.n, N: G.N, laps: G.laps, petals: G.petals, Lp: G.Lp, P: G.S.P, minRad: G.S.minRad }; },
      fit: function () {
        var out = {};
        SHAPE_IDS.forEach(function (s) {
          WHEELS.forEach(function (w) { var G = rigGeo(s, w, "edge", 0); out[s + "/" + w] = { r: +G.r.toFixed(3), minRad: +G.S.minRad.toFixed(3), laps: G.laps, petals: G.petals }; });
        });
        return out;
      },
      roll: function (du) { mo.uT += du; },
      center: function () { var r = view.getBoundingClientRect(); return { x: r.left + view0.cx, y: r.top + view0.cy, R: view0.sc }; },
      penScreen: function () { var G = geoNow(); penAt(G, st.u, pbuf); var o = [0, 0]; toScreen(pbuf[0], pbuf[1], o); var r = view.getBoundingClientRect(); return { x: r.left + o[0], y: r.top + o[1] }; },
      // every inked range lies on its pattern's exact curve and inside its coverage
      check: function () {
        var bad = 0;
        st.pats.forEach(function (p) {
          var G = patGeo(p);
          if (p.hi - p.lo > G.Lp + 1e-3) bad++;
          p.segs.forEach(function (g) { if (g.a < p.lo - 1e-3 || g.b > p.hi + 1e-3) bad++; });
        });
        return { pats: st.pats.length, done: st.pats.filter(function (p) { return p.done; }).length, bad: bad };
      },
      ghost: function () { return ghost.show(); },
      surprise: surprise, newPaper: newPaper, setRig: setRig
    };
  }

  // ---------- Start ----------
  buildTiles();
  showTab(st.tab);
  renderPens();
  renderGo();
  resize();
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); renderPreviews(); }).observe(stage);
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });
  if (hasInk()) { learned = true; coachSay("Move your finger round and round!", 3500); }
  Toybox.init({
    app: "spirograph",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the wheel rolls to a stop and the pen lifts.",
    goodbyeOption: "End with a Goodbye button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Goodbye, gears",
    farewellDone: "Bye bye, gears!",
    restLine: "The gears are resting.",
    restLine2: "They will be right here next time.",
    restArt: drawRestArt,
    soundNote: "Soft gear clicks, a quiet pen and a chime. Hold for 2 seconds.",
    onEnding: onEnding,
    onGoodbye: onGoodbye,
    onRest: function () { mo.endDone = null; mo.v = 0; },
    onWake: function () { mo.ending = false; mo.goodbye = null; mo.endDone = null; st.cur = -1; mo.uT = st.u; dirty = true; },
    onBig: function () { setTimeout(resize, 30); },
    onSound: function (on) { if (on) clickSound(); }
  });
  $("stage").appendChild($("tb-toast"));
  $("stage").appendChild($("tb-farewell"));
  requestAnimationFrame(frame);
})();
</script>
