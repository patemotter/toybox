<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toybox standard layout</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
  .demo-scene { position: absolute; inset: 0; background: linear-gradient(#8FD0FF, #DDF2FF 62%, #B9E08F 62%, #9CCB7A); }
  .demo-thing { position: absolute; left: 50%; top: 56%; width: 34%; max-width: 220px; aspect-ratio: 1; transform: translate(-50%, -50%); }
  .demo-thing svg { width: 100%; height: 100%; display: block; }
  .demo-views { position: absolute; right: 8px; top: 8px; z-index: 4; display: flex; gap: 4px; font-size: 13px; }
  .demo-views a { background: #FFFFFF; border: 2px solid #1D2340; border-radius: 999px; padding: 0 8px; color: #1D2340; text-decoration: none; font-weight: 700; }
  .demo-views a[aria-current="page"] { background: var(--tb-pick); }
  .demo-map { position: absolute; inset: 0; background: #C9A26C; }
  .demo-lot { position: absolute; border: 3px dashed rgba(29, 35, 64, 0.35); border-radius: 18px; background: rgba(255, 255, 255, 0.18); }
</style>
</head>
<body>
<!-- Every app follows this structure (plans/redesign.md 1.2). Pages built from the shared components add "tb-v2"
     to the shell. Stations add "‹ Back" first in the header. Views: ?view=steps (a stepped job, the default),
     ?view=tiles (Go + choice tiles + Shelf), ?view=gate (the gear-up), ?view=map (a station map). -->
<div class="tb-app-shell tb-v2">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back" href="#" aria-label="Back to the kitchen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Kitchen</span></a>
    <a class="btn tb-iconbtn" href="#" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title" id="title">Stove</h1>
    <button class="btn tb-iconbtn" id="big" aria-label="Big"></button>
  </header>
  <div class="tb-body">
    <div class="tb-stagecol">
      <main class="tb-stage" id="stage">
        <div class="demo-scene"></div>
        <div class="demo-thing" id="thing"></div>
        <div class="tb-counter" id="count">Pancakes: 0</div>
        <div id="coach"></div>
        <nav class="demo-views" id="views"></nav>
      </main>
      <div id="jobs"></div>
    </div>
    <section class="tb-panel" id="panel">
      <ol id="steps"></ol>
      <div id="go"></div>
      <div id="tiles"></div>
      <div id="bar"></div>
    </section>
  </div>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var view = (location.search.match(/view=(\w+)/) || [])[1] || "steps";
  ["steps", "tiles", "gate", "map"].forEach(function (v) {
    var a = document.createElement("a"); a.href = "?view=" + v; a.textContent = v;
    if (v === view) a.setAttribute("aria-current", "page");
    $("views").appendChild(a);
  });
  // Content pictures: flat colors, 2 px ink outline (the same picture for the chip, the Go and the coach's step).
  function pic(body) { return '<svg viewBox="0 0 40 40">' + body + "</svg>"; }
  var PIC = {
    pour: pic('<path d="M8 8h18l-4 8H12z" fill="#FFF3D6" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><path d="M17 16c-1 6 3 8 0 14" fill="none" stroke="#1D2340" stroke-width="6" stroke-linecap="round"/><path d="M17 16c-1 6 3 8 0 14" fill="none" stroke="#F0C27B" stroke-width="3" stroke-linecap="round"/>'),
    flip: pic('<path d="M5 27h17l9-10" fill="none" stroke="#1D2340" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="25" cy="12" rx="8" ry="4" fill="#F0C27B" stroke="#1D2340" stroke-width="2.5" transform="rotate(-25 25 12)"/>'),
    plate: pic('<ellipse cx="20" cy="25" rx="16" ry="7" fill="#FFFFFF" stroke="#1D2340" stroke-width="2.5"/><ellipse cx="20" cy="21" rx="10" ry="4" fill="#E4AD62" stroke="#1D2340" stroke-width="2"/>'),
    pancakes: pic('<ellipse cx="20" cy="26" rx="15" ry="6" fill="#E4AD62" stroke="#1D2340" stroke-width="2"/><ellipse cx="20" cy="19" rx="15" ry="6" fill="#F0C27B" stroke="#1D2340" stroke-width="2"/>'),
    soup: pic('<path d="M6 18h28q0 14-14 14T6 18z" fill="#E86A3A" stroke="#1D2340" stroke-width="2"/>'),
    pasta: pic('<path d="M6 20h28q0 12-14 12T6 20z" fill="#FFFFFF" stroke="#1D2340" stroke-width="2"/><path d="M11 20q4-6 8 0t8 0" fill="none" stroke="#F2C14E" stroke-width="3"/>'),
    rocket: pic('<path d="M20 4c7 6 8 16 5 24H15C12 20 13 10 20 4z" fill="#FFFFFF" stroke="#1D2340" stroke-width="2.5"/><circle cx="20" cy="15" r="3.5" fill="#3DB4FF" stroke="#1D2340" stroke-width="2"/><path d="M15 22l-6 8h7M25 22l6 8h-7" fill="#E63946" stroke="#1D2340" stroke-width="2" stroke-linejoin="round"/>'),
    nose: pic('<path d="M20 5 30 30H10z" fill="#FF6B5B" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/>'),
    round: pic('<path d="M8 30a12 14 0 0 1 24 0z" fill="#FFC93C" stroke="#1D2340" stroke-width="2.5"/>'),
    capsule: pic('<rect x="11" y="6" width="18" height="26" rx="9" fill="#3DB4FF" stroke="#1D2340" stroke-width="2.5"/>'),
    dome: pic('<path d="M7 30c0-14 26-14 26 0z" fill="#8E6CFF" stroke="#1D2340" stroke-width="2.5"/>'),
    goggles: pic('<rect x="5" y="14" width="13" height="11" rx="5" fill="#BFE8FF" stroke="#1D2340" stroke-width="2.5"/><rect x="22" y="14" width="13" height="11" rx="5" fill="#BFE8FF" stroke="#1D2340" stroke-width="2.5"/><path d="M18 19h4" stroke="#1D2340" stroke-width="2.5"/>'),
    muffs: pic('<path d="M9 22a11 13 0 0 1 22 0" fill="none" stroke="#1D2340" stroke-width="3"/><rect x="5" y="19" width="9" height="13" rx="4" fill="#FFC93C" stroke="#1D2340" stroke-width="2.5"/><rect x="26" y="19" width="9" height="13" rx="4" fill="#FFC93C" stroke="#1D2340" stroke-width="2.5"/>'),
    mixer: pic('<ellipse cx="22" cy="17" rx="12" ry="8" fill="#F77F00" stroke="#1D2340" stroke-width="2.5" transform="rotate(-12 22 17)"/><rect x="4" y="27" width="32" height="4" fill="#3A4150"/><circle cx="11" cy="32" r="4" fill="#2B2F3A" stroke="#1D2340" stroke-width="2"/><circle cx="30" cy="32" r="4" fill="#2B2F3A" stroke="#1D2340" stroke-width="2"/>'),
    crane: pic('<path d="M12 34V6M12 8h22M12 8 5 14" fill="none" stroke="#1D2340" stroke-width="3"/><path d="M12 34V6" stroke="#FFC93C" stroke-width="1.5"/><path d="M28 8v12" stroke="#1D2340" stroke-width="2"/><rect x="25" y="20" width="6" height="5" fill="#E63946" stroke="#1D2340" stroke-width="2"/>')
  };
  var coach = Toybox.coach($("coach"));
  var bar = Toybox.bar($("bar"), {
    shelf: view === "tiles" ? function () { bar.shelfOpen(bar.shelf.getAttribute("aria-pressed") !== "true"); } : null,
    onNew: function () { coach.say("A fresh start!"); if (st) st.reset(); },
    onSurprise: function () { Toybox.wiggle($("thing")); coach.say("Surprise!"); }
  });
  var ghost = Toybox.ghost({ plan: function () {
    var r = $("thing").getBoundingClientRect();
    return { pts: [[r.left + r.width / 2, r.top + r.height / 2]], tap: true, key: st ? st.current() : "tap" };
  } });
  var st = null, n = 0;
  if (view === "steps") {
    $("thing").innerHTML = PIC.pancakes;
    Toybox.jobs($("jobs"), { jobs: [{ id: "pancakes", name: "Pancakes", pic: PIC.pancakes }, { id: "soup", name: "Soup", pic: PIC.soup }, { id: "pasta", name: "Pasta", pic: PIC.pasta }],
      onPick: function (id) { $("thing").innerHTML = PIC[id]; coach.say(id.charAt(0).toUpperCase() + id.slice(1) + "!"); } });
    st = Toybox.steps($("steps"), {
      steps: [{ id: "pour", name: "Pour", pic: PIC.pour, go: "Pour!", coach: "Pour the batter!" },
              { id: "flip", name: "Flip", pic: PIC.flip, go: "Flip!", coach: "Flip the pancake!" },
              { id: "plate", name: "Plate", pic: PIC.plate, go: "Plate!", coach: "Onto the plate!" }],
      coach: coach, ghost: ghost,
      onGo: function (id) {
        ghost.learned(id);
        st.busy(0);
        var t0 = Date.now(), iv = setInterval(function () {
          var f = (Date.now() - t0) / 1200;
          st.busy(Math.min(1, f));
          if (f >= 1) {
            clearInterval(iv); st.busy(false);
            if (id === "plate") { n++; $("count").textContent = "Pancakes: " + n; st.finish("Again!"); Toybox.kind(); }
            else st.done(id);
          }
        }, 60);
      },
      onAgain: function () { st.reset(); }
    });
    st.at("pour");
  } else if (view === "tiles") {
    $("title").textContent = "Rocket Builder";
    $("count").textContent = "Rockets: 2";
    $("thing").innerHTML = PIC.rocket;
    var go = Toybox.go($("go"), { label: "Launch!", icon: PIC.rocket, onPress: function () { Toybox.wiggle($("thing")); coach.say("Liftoff!"); } });
    Toybox.tiles($("tiles"), { items: [{ id: "pointy", name: "Pointy", pic: PIC.nose }, { id: "round", name: "Round", pic: PIC.round },
      { id: "capsule", name: "Capsule", pic: PIC.capsule }, { id: "dome", name: "Dome", pic: PIC.dome }], value: "pointy",
      onPick: function (id) { coach.say(id.charAt(0).toUpperCase() + id.slice(1) + " nose!"); } });
    coach.step("Tap a nose!");
    void go;
  } else if (view === "gate") {
    Toybox.gate({ title: "Gear up!", viewBox: "0 0 300 400",
      worker: '<circle cx="150" cy="120" r="56" fill="#F2C094" stroke="#1D2340" stroke-width="5"/><path d="M78 400V270q0-60 72-60t72 60v130" fill="#3DB4FF" stroke="#1D2340" stroke-width="5"/><circle cx="130" cy="118" r="6" fill="#1D2340"/><circle cx="170" cy="118" r="6" fill="#1D2340"/><path d="M132 146q18 14 36 0" fill="none" stroke="#1D2340" stroke-width="5" stroke-linecap="round"/>',
      items: [{ id: "eyes", name: "Eye protection", art: PIC.goggles, onArt: '<rect x="108" y="100" width="38" height="30" rx="12" fill="rgba(191,232,255,0.8)" stroke="#1D2340" stroke-width="5"/><rect x="154" y="100" width="38" height="30" rx="12" fill="rgba(191,232,255,0.8)" stroke="#1D2340" stroke-width="5"/><path d="M146 115h8M94 112h14M192 112h14" stroke="#1D2340" stroke-width="5"/>' },
              { id: "ears", name: "Ear protection", art: PIC.muffs, onArt: '<path d="M96 120a54 70 0 0 1 108 0" fill="none" stroke="#1D2340" stroke-width="8"/><rect x="78" y="100" width="26" height="44" rx="11" fill="#FFC93C" stroke="#1D2340" stroke-width="5"/><rect x="196" y="100" width="26" height="44" rx="11" fill="#FFC93C" stroke="#1D2340" stroke-width="5"/>' }],
      done: function () { coach.say("Ready to work!"); } });
    $("thing").innerHTML = PIC.goggles;
  } else if (view === "map") {
    $("title").textContent = "Construction Site";
    $("stage").insertBefore(Object.assign(document.createElement("div"), { className: "demo-map" }), $("thing"));
    $("thing").hidden = true;
    $("panel").hidden = true;
    var lots = [[0.04, 0.05, 0.44, 0.42, "Concrete", PIC.mixer], [0.52, 0.05, 0.44, 0.42, "Tower crane", PIC.crane], [0.04, 0.52, 0.44, 0.42, "Excavator", PIC.mixer], [0.52, 0.52, 0.44, 0.42, "Forklift", PIC.crane]];
    lots.forEach(function (l) { var d = document.createElement("div"); d.className = "demo-lot"; d.style.cssText = "left:" + l[0] * 100 + "%;top:" + l[1] * 100 + "%;width:" + l[2] * 100 + "%;height:" + l[3] * 100 + "%"; $("stage").appendChild(d); });
    Toybox.map({ stage: $("stage"), places: lots.map(function (l) { return { href: "#" + l[4], name: l[4], pic: l[5], rect: l.slice(0, 4) }; }) });
  }
  if (view !== "steps") $("steps").hidden = true;
  if (view !== "tiles") { $("go").hidden = true; $("tiles").hidden = true; }
  Toybox.init({ app: "shell-demo", big: { button: $("big") }, restLine: "The demo is resting." });
})();
</script>
</body>
</html>
