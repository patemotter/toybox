<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toybox standard layout</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
  .demo-pic { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 6rem; }
  .note { position: absolute; bottom: 8px; left: 8px; right: 8px; font-size: 0.85rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<!-- Every app follows this structure. Stations add a yellow "‹ Back" button first in the header. -->
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back" href="#" aria-label="Back to the Tool Wall"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Tool Wall</span></a>
    <a class="btn tb-iconbtn" href="#" aria-label="Back to Toybox"><svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Rocket Builder</h1>
    <button class="btn tb-iconbtn" aria-label="Big"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>
  <div class="tb-body">
    <main class="tb-stage">
      <div class="tb-counter">Rockets: 2</div>
      <div class="tb-coach">Tap a nose!</div>
      <div class="demo-pic">🚀</div>
      <p class="note">The stage: the play area. Counter top-left; one coach line (top on tablets, bottom on phones).</p>
    </main>
    <section class="tb-panel">
      <button class="btn tb-go">Launch!</button>
      <div class="tb-choices">
        <button class="btn tb-tile" aria-pressed="true"><span style="font-size:2rem">🔺</span>Pointy</button>
        <button class="btn tb-tile"><span style="font-size:2rem">⚪</span>Round</button>
        <button class="btn tb-tile"><span style="font-size:2rem">🔷</span>Capsule</button>
        <button class="btn tb-tile"><span style="font-size:2rem">🔶</span>Dome</button>
      </div>
      <nav class="tb-tabs">
        <button class="btn" aria-pressed="true">Build</button>
        <button class="btn">Colors</button>
        <button class="btn tb-new">New</button>
        <button class="btn tb-surprise">Surprise</button>
      </nav>
    </section>
  </div>
</div>
</body>
</html>
