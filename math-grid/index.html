<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Grid</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Math Grid">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css, tb-v2): header, stage with the job bar, panel ----------
   Stage: the equation line and the number grid, as big as the stage allows (resize() lays them out: the line on
   top in an upright stage, beside the grid in a wide one). Job bar: Add / Times. Panel: Go "Blocks!", the four
   pattern tiles, then the bottom bar (New, Surprise). */
.tb-head a { text-decoration: none; }
.stage { background: #24305E; touch-action: none; }
#cv { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
.eq {
  position: absolute; z-index: 2; display: flex; align-items: center; justify-content: center; text-align: center;
  color: #FFFFFF; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; pointer-events: none;
  overflow: hidden; overflow-wrap: break-word;
}
.eq span { display: inline-block; }
.eq.go span { animation: eqPop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes eqPop { 0% { transform: scale(0.55); } 100% { transform: scale(1); } }
/* The coach line sits in the equation's place (top of the stage) while no sum is showing. */
.stage .tb-coach { top: 8px; bottom: auto; }
.stage .tb-coach.side { top: 50%; left: var(--side-x, 25%); transform: translate(-50%, -50%); max-width: var(--side-w, 40%); }
.stage .tb-coach.side { padding: 4px 8px; }
.stage .tb-coach.side.is-new { animation: none; }
/* Play-timer gauge, top-right of the stage */
.fuel { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.fuel[hidden] { display: none; }
.fuel-bar { width: clamp(44px, 10vw, 110px); height: 16px; background: rgba(255, 255, 255, 0.85); border: 2px solid #1D2340; border-radius: 999px; overflow: hidden; }
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num { min-width: 36px; height: 36px; display: grid; place-items: center; background: #FFFFFF; color: #1D2340; border: 2px solid #1D2340; border-radius: 50%; font-size: 1.2rem; font-weight: 800; line-height: 1; }
.fuel-num[hidden] { display: none; }
.tb-tilerow .tb-pic svg, .tb-job .tb-pic svg { width: 100%; height: 100%; display: block; }
/* Big mode: the header buttons and the panel and the job bar hide; the grid takes the whole screen. */
body.big .tb-panel, body.big .tb-jobs { display: none; }
body.big .tb-head > :not(.bigtoggle) { display: none; }
body.ending .tb-panel, body.ending .tb-jobs { pointer-events: none; opacity: 0.4; }
/* Phone held sideways: a wider column (four tiles a row at full size; the grid is limited by the height anyway),
   and the job bar moves to the top of the column so the grid keeps the whole height. */
@media (orientation: landscape) and (max-height: 520px) {
  .tb-v2 .tb-body .tb-panel { width: calc(4 * var(--tb-tile) + 3 * var(--tb-s2) + 24px); }
  .tb-panel .tb-jobs { margin: 0; padding: 0; }
  .tb-panel .tb-job { border-top: var(--tb-outline) solid var(--tb-line); border-radius: 16px; min-height: 56px; }
}
/* iPad held sideways: two tiles a row in the side column. */
@media (orientation: landscape) and (min-height: 521px) {
  #pats.tb-tilerow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* Rest picture: sleepy number blocks on a night sky (the rest screen itself is in common/toybox.css). */
.rest-art { aspect-ratio: 1; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
@media (prefers-reduced-motion: reduce) {
  .eq.go span { animation: none; }
}
</style>
</head>
<body>
<div class="tb-app-shell tb-v2">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Math Grid</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>

  <div class="tb-body">
    <div class="tb-stagecol" id="stagecol">
      <main class="tb-stage stage" id="scene">
        <canvas id="cv" aria-label="A number grid. Tap a square to see its sum, or drag across the grid to fill it with blocks."></canvas>
        <div class="eq" id="eq" aria-live="polite"></div>
        <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
        <div id="coach"></div>
      </main>
      <div id="jobs"></div>
    </div>

    <section class="tb-panel" id="panel">
      <div id="go"></div>
      <div id="pats" role="group" aria-label="Patterns"></div>
      <div id="bottom"></div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  var TAU = Math.PI * 2;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var FONT = '"Baloo 2", "Trebuchet MS", system-ui, sans-serif';

  // One bright color per number 0-12.
  var COLORS = ["#C9D3E0", "#E63946", "#F77F00", "#FFC93C", "#2E9E5B", "#3A86FF", "#8338EC", "#FF5DA2", "#00B4D8", "#8AC926", "#FF8C42", "#9B5DE5", "#06D6A0"];
  function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function inkOn(h) { var c = hexRgb(h); return 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2] < 140 ? "#FFFFFF" : "#1D2340"; }
  function colorOf(v) { return COLORS[((v % 13) + 13) % 13]; }
  function easeOutBack(t) { var c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  function easeOutBounce(t) {
    var n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) { t -= 1.5 / d; return n * t * t + 0.75; }
    if (t < 2.5 / d) { t -= 2.25 / d; return n * t * t + 0.9375; }
    t -= 2.625 / d; return n * t * t + 0.984375;
  }

  // ---------- State ----------
  var KEY = "mathgrid-state-v1";
  // Opening Math Grid from the Toybox home screen (Toybox.fresh) starts the first-visit grid (Times,
  // nothing picked, no pattern or blocks); a reload keeps it. The grown-up settings (spoken numbers, and
  // "mathgrid-twelve": a 0 to 12 grid instead of 0 to 10) live on the Toybox home screen and are kept.
  if (window.Toybox && Toybox.fresh()) {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
  }
  function sizeSetting() { return Toybox.settings.get("mathgrid-twelve") ? 12 : 10; }
  var mode = "times", N = sizeSetting(), sel = null, pat = "", multN = 3, sameV = 12, hasBlocks = false;
  function val(r, c) { return mode === "times" ? r * c : r + c; }
  function opSym() { return mode === "times" ? "×" : "+"; }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ mode: mode, N: N, sel: sel, pat: pat, multN: multN, sameV: sameV, blocks: hasBlocks })); } catch (e) { /* ignore */ }
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!o || typeof o !== "object") return;
      if (o.mode === "add" || o.mode === "times") mode = o.mode;
      // o.N (the old "0 to 10 / 0 to 12" buttons) is ignored: the grid size is a home-screen setting now.
      if (o.sel && typeof o.sel.r === "number" && typeof o.sel.c === "number") sel = { r: clamp(o.sel.r | 0, 0, N), c: clamp(o.sel.c | 0, 0, N) };
      if (["", "mult", "dbl", "sq", "same"].indexOf(o.pat) !== -1) pat = o.pat;
      if (typeof o.multN === "number") multN = clamp(o.multN | 0, 1, 12);
      if (typeof o.sameV === "number") sameV = clamp(o.sameV | 0, 0, 144);
      hasBlocks = !!o.blocks;
    } catch (e) { /* defaults */ }
  }

  // ---------- Canvas + layout ----------
  // The canvas covers the stage. The grid is the biggest square that fits; the equation line goes above it in
  // an upright stage, or beside it (on the left) in a wide one.
  var cv = $("cv"), ctx = cv.getContext("2d"), scene = $("scene"), eqEl = $("eq");
  var CW = 1, CH = 1, DPR = 1, cs = 20, OX = 0, OY = 0, side = false;
  function resize() {
    CW = Math.max(1, scene.clientWidth); CH = Math.max(1, scene.clientHeight);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
    cv.style.width = CW + "px"; cv.style.height = CH + "px";
    var n = N + 2, pad = CW < 600 || CH < 600 ? 4 : 10;
    var eqTop = Math.round(Math.max(44, Math.min(72, CH * 0.075)));
    // Wide stage: the line goes beside the grid (at least about 110 px of words) when that makes the grid bigger.
    var gTop = Math.min(CW - 2 * pad, CH - eqTop - pad), sideW = CW >= 600 && CH >= 600 ? 150 : 110, gSide = Math.min(CH - 2 * pad, CW - 2 * pad - sideW);
    side = gSide > gTop + 4;
    var g;
    if (side) {
      g = gSide;
      cs = g / n; OX = CW - pad - cs * n; OY = (CH - cs * n) / 2;
      setBox(eqEl, 6, 8, OX - 12, CH - 16);
    } else {
      g = gTop;
      cs = g / n; OX = (CW - cs * n) / 2; OY = eqTop + Math.max(0, (CH - eqTop - pad - cs * n) / 2);
      setBox(eqEl, 8, 0, CW - 16, OY);
    }
    var fs = side ? Math.max(20, Math.min(44, (OX - 12) / 4.2)) : Math.max(22, Math.min(54, eqTop * 0.72, CW / 13));
    eqEl.style.fontSize = Math.round(fs) + "px";
    eqEl.style.whiteSpace = side ? "normal" : "nowrap";
    var co = $("coach");
    co.classList.toggle("side", side);
    if (side) { co.style.setProperty("--side-x", (OX / 2) + "px"); co.style.setProperty("--side-w", Math.max(100, OX - 10) + "px"); }
  }
  function setBox(el, x, y, w, h) { el.style.left = x + "px"; el.style.top = y + "px"; el.style.width = Math.max(0, w) + "px"; el.style.height = Math.max(0, h) + "px"; }
  window.addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(scene);
  // Grid index (0 = header, 1 = number 0, ...) under a client point.
  function hit(cx, cy, clampBody) {
    var r = cv.getBoundingClientRect();
    var gx = (cx - r.left - OX) / cs, gy = (cy - r.top - OY) / cs;
    var n = N + 2;
    if (clampBody) return { ci: clamp(Math.floor(gx), 1, n - 1), ri: clamp(Math.floor(gy), 1, n - 1) };
    if (gx < 0 || gy < 0 || gx >= n || gy >= n) return null;
    return { ci: Math.floor(gx), ri: Math.floor(gy) };
  }
  function cellCenter(ri, ci) { return { x: OX + (ci + 0.5) * cs, y: OY + (ri + 0.5) * cs }; }

  // ---------- Effects ----------
  var fx = [], rings = [];
  function burst(x, y, n, col) {
    if (reduceMotion) n = Math.min(n, 4);
    for (var i = 0; i < n; i++) {
      var a = rand(0, TAU), sp = rand(90, 360);
      fx.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 0, max: rand(0.45, 0.9), r: rand(3, 8), col: col || COLORS[1 + (i % 12)] });
    }
  }
  function ring(x, y, r, col) { rings.push({ x: x, y: y, r: r, life: 0, col: col || "#FFFFFF" }); }

  // ---------- Lights: taps, patterns ----------
  var now = 0, selT = -9999, patT = -9999, jiggle = 0;
  var ptrs = {};
  var crossCols = ["#FFC93C", "#FF5DA2", "#00B4D8", "#8AC926", "#FF8C42"];

  function patMatch(r, c) {
    var v = val(r, c);
    if (pat === "mult") return v > 0 && v % multN === 0;
    if (pat === "dbl" || pat === "sq") return r === c;
    if (pat === "same") return v === sameV;
    return false;
  }
  function patColor() {
    if (pat === "mult") return colorOf(multN);
    if (pat === "dbl") return "#FF5DA2";
    if (pat === "sq") return "#00B4D8";
    return "#FFC93C";
  }
  function waysCount() {
    var n = 0;
    for (var r = 0; r <= N; r++) for (var c = 0; c <= N; c++) if (val(r, c) === sameV) n++;
    return n;
  }
  function patText() {
    var s = opSym();
    if (pat === "mult") {
      var l = [];
      for (var k = 1; k <= 4; k++) l.push(multN * k);
      return "Multiples of " + multN + ": " + l.join(", ") + "…";
    }
    if (pat === "dbl") return "Doubles: 1 + 1, 2 + 2, 3 + 3…";
    if (pat === "sq") return "Squares: 1, 4, 9, 16, 25…";
    if (pat === "same") { var w = waysCount(); return w + (w === 1 ? " way" : " ways") + " to make " + sameV; }
    return "";
  }
  function eqText(r, c) { return r + " " + opSym() + " " + c + " = " + val(r, c); }
  function sayEq(r, c) { say(r + (mode === "times" ? " times " : " plus ") + c + " is " + val(r, c)); }

  // The equation line (big white numbers on the stage). With nothing to show, the coach line takes its place.
  var eqText0 = "";
  function setEq(t, pop) {
    if (eqText0 !== t) { eqText0 = t; eqEl.innerHTML = t ? "<span></span>" : ""; if (t) eqEl.firstChild.textContent = t; }
    if (t) { if (coach) coach.clear(); }
    else if (coach) coach.step("Tap a number!");
    if (t && pop && !reduceMotion) { eqEl.classList.remove("go"); void eqEl.offsetWidth; eqEl.classList.add("go"); }
  }
  function restEq() {
    if (sel) setEq(eqText(sel.r, sel.c), false);
    else if (pat) setEq(patText(), false);
    else setEq("", false);
  }

  // ---------- Blocks ----------
  // Each block lives in a grid cell. x/y are in cell units (grid index, top-left corner).
  var blocks = [], build = null, settling = false;
  function blockPlan(r, c) {
    var list = [], i, j, k;
    if (mode === "times") {
      for (i = 1; i <= r; i++) for (j = 1; j <= c; j++) {
        list.push({ key: "t" + i + "," + j, hx: j + 1, hy: i + 1, col: colorOf(i), n: (i - 1) * c + j });
      }
    } else {
      var tot = r + c, second = c === r ? colorOf((c + 4) % 12 + 1) : colorOf(c);
      for (k = 0; k < tot; k++) {
        var col = k < r ? colorOf(r) : second;
        list.push({ key: "a" + k + col, hx: 2 + (k % N), hy: 2 + Math.floor(k / N), col: col, n: k + 1 });
      }
    }
    return list;
  }
  function mkBlock(p) { return { key: p.key, hx: p.hx, hy: p.hy, col: p.col, n: p.n, x: p.hx, y: p.hy, st: "home", t0: now, born: now, vx: 0, vy: 0, fx: 0, fy: 0, tx: 0, ty: 0, dl: 0, rot: 0, vr: 0 }; }
  function fillBlocks(r, c, animate) {
    var have = {};
    blocks.forEach(function (b) { have[b.key] = b; });
    var plan = blockPlan(r, c), out = [], added = 0;
    plan.forEach(function (p) {
      var b = have[p.key];
      if (b) { b.n = p.n; b.hx = p.hx; b.hy = p.hy; if (b.st === "home") { b.x = p.hx; b.y = p.hy; } out.push(b); }
      else { b = mkBlock(p); if (!animate) b.born = -9999; out.push(b); added++; }
    });
    blocks = out;
    hasBlocks = blocks.length > 0;
    return added;
  }
  function clearBlocks(poof) {
    if (poof && blocks.length) {
      blocks.slice(0, 40).forEach(function (b) { burst(OX + (b.x + 0.5) * cs, OY + (b.y + 0.5) * cs, 2, b.col); });
    }
    blocks = []; build = null; hasBlocks = false;
  }

  // "Count with blocks": blocks drop in one at a time with a count.
  function startBuild() {
    if (ending) return;
    if (!sel) sel = { r: 3, c: 4 };
    if (sel.r === 0 || sel.c === 0) {
      if (mode === "times" || sel.r + sel.c === 0) { sel = { r: sel.r || 3, c: sel.c || 4 }; }
    }
    clearBlocks(false);
    var plan = blockPlan(sel.r, sel.c);
    var iv = plan.length <= 12 ? 0.6 : Math.max(0.1, 7.2 / plan.length);
    build = { plan: plan, i: 0, next: now / 1000 + 0.25, iv: iv };
    selT = now;
    setEq(eqText(sel.r, sel.c).replace(/= \d+$/, "= ?"), true);
    hasBlocks = true;
    save();
    updateButtons();
  }
  function stepBuild() {
    if (!build) return;
    var t = now / 1000;
    while (build && t >= build.next && build.i < build.plan.length) {
      var p = build.plan[build.i], b = mkBlock(p);
      b.st = "drop"; b.t0 = now; b.y = -OY / cs - 1.2;
      blocks.push(b);
      build.i++;
      build.next += build.iv;
      setEq(String(build.i), true);
      note(build.i, 0.035);
      if (build.plan.length <= 20 || build.i % 5 === 0) say(String(build.i));
    }
    if (build && build.i >= build.plan.length && t >= build.next + 0.25) {
      build = null;
      setEq(eqText(sel.r, sel.c) + "!", true);
      var cc = cellCenter(sel.r + 1, sel.c + 1);
      burst(cc.x, cc.y, 30, null);
      ring(cc.x, cc.y, cs * 2, "#FFC93C");
      chime();
      setTimeout(function () { sayEq(sel.r, sel.c); }, 350);
    }
  }

  function stepBlocks(dt) {
    var minX = -OX / cs, minY = -OY / cs, maxX = (CW - OX) / cs - 1, maxY = (CH - OY) / cs - 1;
    blocks.forEach(function (b) {
      var t;
      if (b.st === "drop") {
        t = clamp((now - b.t0) / 560, 0, 1);
        var y0 = -OY / cs - 1.2;
        b.x = b.hx; b.y = y0 + (b.hy - y0) * easeOutBounce(t);
        if (t >= 1) { b.st = "home"; b.y = b.hy; }
      } else if (b.st === "return") {
        t = clamp((now - b.t0) / 870, 0, 1);
        var e = easeOutBack(t);
        b.x = b.fx + (b.hx - b.fx) * e; b.y = b.fy + (b.hy - b.fy) * e; b.rot = b.fr * (1 - t);
        if (t >= 1) { b.st = "home"; b.x = b.hx; b.y = b.hy; b.rot = 0; if (Math.random() < 0.15) note(b.n, 0.02); }
      } else if (b.st === "settle") {
        t = clamp((now - b.t0) / 1100, 0, 1);
        var es = easeOutBounce(t);
        b.x = b.fx + (b.tx - b.fx) * Math.min(1, t * 1.6); b.y = b.fy + (b.ty - b.fy) * es; b.rot = b.fr * (1 - t);
      }
    });
  }
  // Timer ending: blocks settle into a neat pile at the bottom.
  function settleBlocks() {
    settling = true;
    build = null;
    var n = N + 2, maxY = (CH - OY) / cs - 1;
    var order = blocks.slice().sort(function (a, b) { return a.x - b.x; });
    var cols = Math.floor(CW / cs) || n, x0 = -OX / cs + (CW / cs - cols) / 2;
    order.forEach(function (b, k) {
      b.st = "settle"; b.fx = b.x; b.fy = b.y; b.fr = b.rot || 0;
      b.tx = x0 + (k % cols); b.ty = maxY - Math.floor(k / cols);
      b.t0 = now + (reduceMotion ? 0 : rand(0, 500));
    });
  }

  // ---------- Drawing ----------
  function rr(x, y, w, h, r) {

  try {
    var OLD_VKEY = "mathgrid-voice-v1";
    if (localStorage.getItem(OLD_VKEY) === "on" && Toybox.settings.get("mathgrid-voice") === false) Toybox.settings.set("mathgrid-voice", true);
    localStorage.removeItem(OLD_VKEY);
  } catch (e) { /* ignore */ }
  var voiceOn = hasVoice && !!Toybox.settings.get("mathgrid-voice");
  Toybox.settings.onChange(function (id, on) {
    if (id !== "mathgrid-voice") return;
    voiceOn = hasVoice && !!on;
    if (!voiceOn && hasVoice) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
  });
  function say(t) {
    if (!voiceOn || !hasVoice) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.rate = 0.95; u.pitch = 1.1; u.volume = 0.9;
      window.speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }

  // ---------- Play timer hooks (the timer, sheet, toast and rest screen live in common/toybox.js) ----------
  var ending = false, endingStartedAt = 0, endingDone = null;
  // The fuel gauge above the grid shows the time left.
  function drawFuel(info) {
    var active = info.phase === "running" || info.phase === "ending";
    $("fuel").hidden = !active;
    if (!active) return;
    var f = info.fraction, fill = $("fuelFill");
    fill.style.width = (f * 100).toFixed(1) + "%";
    fill.style.background = f > 0.5 ? "#2E9E5B" : (f > 0.2 ? "#FFC93C" : "#F77F00");
    $("fuelNum").hidden = !(info.showMinutes && info.phase === "running");
    $("fuelNum").textContent = String(info.minutes);
  }
  // Ending: let go of fingers and building; the blocks settle into a neat pile at the bottom.
  function onEnding(done) {
    endingStartedAt = performance.now();
    endingDone = done;
    ending = true;
    ptrs = {};
    build = null;
    blocks.forEach(function (b) { if (b.st === "drop") { b.st = "home"; b.y = b.hy; } });
    setEq("Time to rest", true);
    settleBlocks();
  }
  function goodnight() {
    say("Goodnight, numbers");
    chime();
  }
  // Next time, the blocks are back in their squares.
  function onRest() {
    ending = false; settling = false; endingDone = null;
    blocks.forEach(function (b) { b.st = "home"; b.x = b.hx; b.y = b.hy; b.rot = 0; });
    restEq();
  }
  function onWake() {
    var was = ending;
    ending = false; settling = false; endingDone = null;
    if (was) blocks.forEach(function (b) { if (b.st === "settle") { b.st = "return"; b.fx = b.x; b.fy = b.y; b.fr = b.rot || 0; b.t0 = now; } });
    restEq();
  }
  function restSVG() {
    var o = '<svg class="rest-art" viewBox="-50 -50 100 100" aria-hidden="true">';
    o += '<circle cx="34" cy="-34" r="9" fill="#FFF4CC" stroke="#1D2340" stroke-width="2"/><circle cx="38" cy="-37" r="8" fill="#2B3A67"/>';
    var bl = [[-33, 18, 1], [-11, 18, 2], [11, 18, 3], [-22, -4, 4], [0, -4, 5]];
    bl.forEach(function (b) {
      var col = COLORS[b[2]], x = b[0], y = b[1];
      o += '<rect x="' + (x - 10) + '" y="' + (y - 10) + '" width="20" height="20" rx="4" fill="' + col + '" stroke="#1D2340" stroke-width="2"/>';
      o += '<text x="' + x + '" y="' + (y + 1) + '" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="11" fill="' + inkOn(col) + '">' + b[2] + '</text>';
      o += '<path d="M' + (x - 6) + " " + (y + 5) + "q2 2 4 0M" + (x + 2) + " " + (y + 5) + 'q2 2 4 0" fill="none" stroke="' + inkOn(col) + '" stroke-width="1.4" stroke-linecap="round"/>';
    });
    o += '<rect x="-46" y="29" width="92" height="6" rx="3" fill="#C9D3E0" stroke="#1D2340" stroke-width="2"/>';
    o += '<text x="-36" y="-26" font-family="Baloo 2, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">z</text><text x="-26" y="-36" font-family="Baloo 2, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">z</text><text x="-19" y="-43" font-family="Baloo 2, sans-serif" font-weight="800" font-size="7" fill="#FFFFFF">z</text>';
    return o + "</svg>";
  }

  // ---------- Start ----------
  load();
  Toybox.settings.onChange(function (id) { if (id === "mathgrid-twelve") setSize(sizeSetting()); });
  setMode(mode);
  resize();
  if (hasBlocks && sel) fillBlocks(sel.r, sel.c, false);
  if (pat) patT = -9999;
  updateButtons();
  restEq();
  if (pat && !sel) setEq(patText(), false);
  // The old Math Grid sound key held "on"/"off"; the shared migration reads "1"/"true", so translate it once.
  try { if (localStorage.getItem("mathgrid-sound-v1") === "on") localStorage.setItem("mathgrid-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "math-grid",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the blocks settle and rest, and the controls lock.",
    goodbyeOption: "End with a Goodnight button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Goodnight, numbers",
    farewellDone: "Goodnight, numbers!",
    restLine: "The numbers are resting.",
    restLine2: "They will be right here next time.",
    restArt: restSVG,
    soundNote: "Soft notes. Hold for 2 seconds.",
    legacy: { timer: "mathgrid-timer-v1", sound: "mathgrid-sound-v1", big: "mathgrid-big-v1" },
    onEnding: onEnding,
    onGoodbye: goodnight,
    onRest: onRest,
    onWake: onWake,
    onBig: function () { resize(); },
    onSound: function (on) { if (on) setTimeout(chime, 60); },
    onTimer: drawFuel
  });
  requestAnimationFrame(loop);

  // Test hook, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) window.__math = {
    state: function () { return { mode: mode, N: N, sel: sel, pat: pat, multN: multN, sameV: sameV, blocks: blocks.length, building: !!build, eq: eqEl.textContent, ending: ending }; },
    cell: function (r, c) { var rc = cv.getBoundingClientRect(), p = cellCenter(r + 1, c + 1); return { x: rc.left + p.x, y: rc.top + p.y }; }
  };
})();
</script>
</body>
</html>
