<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Grid</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Math Grid">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
/* Stage: the equation line on top of the number grid. */
.stage { display: flex; flex-direction: column; gap: 6px; padding: 6px; }
.eqbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 52px; }
.eq {
  flex: 1 1 auto; min-width: 0; text-align: center; color: #1D2340; font-weight: 800; line-height: 1.05;
  font-size: clamp(1.5rem, 5.4vw, 3.4rem); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.eq.go { animation: eqPop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes eqPop { 0% { transform: scale(0.55); } 100% { transform: scale(1); } }
.scene {
  position: relative; flex: 1 1 auto; min-height: 0; border: 3px solid #1D2340; border-radius: 18px;
  overflow: hidden; background: #24305E; touch-action: none;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
/* Play-timer gauge */
.fuel { flex: none; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.fuel[hidden] { display: none; }
.fuel-bar { width: clamp(50px, 12vw, 120px); height: 18px; background: rgba(255, 255, 255, 0.8); border: 3px solid #1D2340; border-radius: 999px; overflow: hidden; }
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num { min-width: 40px; height: 40px; display: grid; place-items: center; background: #FFFFFF; color: #1D2340; border: 3px solid #1D2340; border-radius: 50%; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.fuel-num[hidden] { display: none; }
/* Big mode: the panel goes away, the header stays (Big turns into Back). */
body.big .tb-panel { display: none; }

/* ---------- Panel: Blocks (go), then Grid or Patterns choices, then the tab bar with Clear ---------- */
.btn.tb-go.build { display: flex; align-items: center; justify-content: center; gap: 12px; line-height: 1.05; }
.btn.build small { font-size: 0.8em; opacity: 0.9; font-variant-numeric: tabular-nums; }
.btn.build .short { display: none; }
.mg-choices { display: flex; flex-direction: column; gap: 8px; }
.ctrl { display: flex; gap: 8px; align-items: stretch; }
.ctrl .btn { min-width: 0; padding: 0.2rem 0.4rem; font-size: clamp(0.9rem, 2.8vw, 1.2rem); white-space: nowrap; line-height: 1.1; }
.seg { display: flex; gap: 6px; flex: 1 1 0; min-width: 0; }
.seg .btn { flex: 1 1 0; }
.op { font-size: 1.5em; font-weight: 800; margin-right: 4px; vertical-align: -0.08em; }
.pats { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 8px; }
.pats .btn { min-width: 0; padding: 0.2rem 0.3rem; font-size: clamp(0.9rem, 2.6vw, 1.15rem); line-height: 1.05; }
.multi { display: flex; gap: 4px; min-width: 0; }
.multi .main { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.multi .main b { font-size: 1.6em; line-height: 1; }
.multi .step { flex: 0 0 auto; width: 44px; padding: 0; font-size: 1.5rem; }
.tb-tabs .tab { display: none; }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }
/* Rest picture: sleepy number blocks on a night sky (the rest screen itself is in common/toybox.css). */
.rest-art { aspect-ratio: 1; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
/* Landscape: grid on the left, controls on the right. */
@media (orientation: landscape) {
  .ctrl.modes { flex-direction: column; }
  .pats { grid-template-columns: 1fr 1fr; }
  .pats .multi { grid-column: 1 / -1; }
  .ctrl .btn, .pats .btn { font-size: clamp(0.9rem, 1.8vw, 1.25rem); }
}
@media (orientation: portrait) and (max-width: 600px) {
  .pats { grid-template-columns: 1fr 1fr 1fr; }
  .pats .multi { grid-column: 1 / -1; }
  .pats .btn { font-size: 0.95rem; }
}
@media (min-width: 700px) and (min-height: 700px) {
  .stage { padding: 10px; gap: 8px; }
  .eqbar { min-height: 64px; }
  .tb-panel { gap: 12px; }
  .mg-choices { gap: 12px; }
  .ctrl, .pats { gap: 10px; }
  .ctrl .btn, .pats .btn { min-height: 60px; }
  .multi .step { width: 56px; }
  .fuel-num { min-width: 48px; height: 48px; font-size: 1.5rem; }
}
/* ---------- Phones: tabs (Grid / Patterns) show one group at a time ---------- */
@media (orientation: portrait) and (max-width: 600px), (orientation: landscape) and (max-height: 520px) {
  .stage { padding: 4px; gap: 4px; }
  .eqbar { min-height: 40px; }
  .btn.build .long { display: none; }
  .btn.build .short { display: inline; }
  .tb-tabs .tab { display: block; }
  .mg-choices { display: block; height: 102px; flex: none; }
  .tb-panel[data-tab="grid"] [data-pane]:not([data-pane="grid"]),
  .tb-panel[data-tab="pats"] [data-pane]:not([data-pane="pats"]) { display: none; }
  .ctrl.modes { display: grid; grid-template-rows: 48px 48px; gap: 6px; }
  .ctrl.modes .btn { min-height: 0; height: 48px; font-size: 1.05rem; }
  .op { font-size: 1.3em; }
  .pats { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 48px 48px; gap: 6px; }
  .pats .multi { grid-column: 1 / -1; }
  .pats .btn { min-height: 0; height: 48px; font-size: 1rem; }
  .multi .main { flex-direction: row; gap: 8px; }
  .multi .main b { font-size: 1.4em; }
  .multi .step { width: 56px; font-size: 1.6rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .eq { font-size: 1.6rem; }
  .tb-body .tb-panel { justify-content: space-between; }
  .mg-choices { height: 102px; }
  .ctrl.modes { display: grid; grid-template-rows: 46px 46px; }
  .ctrl.modes .btn, .pats .btn { height: 46px; }
  .pats { grid-template-rows: 46px 46px; }
}
@media (prefers-reduced-motion: reduce) {
  .eq.go { animation: none; }
}
/* Ghost hand: a see-through hand that shows the main move once (same look as Bulldozer and Measuring). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Math Grid</h1>
    <button class="btn tb-iconbtn" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage">
      <div class="eqbar">
        <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
        <div class="eq" id="eq" aria-live="polite">Tap a number!</div>
      </div>
      <div class="scene" id="scene">
        <canvas id="cv" aria-label="A number grid"></canvas>
      </div>
    </main>

    <section class="tb-panel" id="panel" data-tab="grid">
      <button class="btn tb-go build" id="buildBtn" aria-label="Count it with blocks"><span class="long">Count with blocks</span><span class="short">Blocks</span><small id="buildEq">3 × 4</small></button>
      <div class="tb-choices mg-choices">
        <div class="ctrl modes" data-pane="grid">
          <div class="seg">
            <button class="btn" data-mode="add" aria-pressed="false"><span class="op">+</span>Add</button>
            <button class="btn" data-mode="times" aria-pressed="true"><span class="op">×</span>Times</button>
          </div>
          <div class="seg">
            <button class="btn" data-size="10" aria-pressed="true">0 to 10</button>
            <button class="btn" data-size="12" aria-pressed="false">0 to 12</button>
          </div>
        </div>
        <div class="pats" data-pane="pats">
          <div class="multi">
            <button class="btn step" data-step="-1" aria-label="Smaller number">−</button>
            <button class="btn main" data-pat="mult" aria-pressed="false"><span>Multiples of</span><b id="multN">3</b></button>
            <button class="btn step" data-step="1" aria-label="Bigger number">+</button>
          </div>
          <button class="btn" data-pat="dbl" aria-pressed="false">Doubles</button>
          <button class="btn" data-pat="sq" aria-pressed="false">Squares</button>
          <button class="btn" data-pat="same" aria-pressed="false">Same answer</button>
        </div>
      </div>
      <nav class="tb-tabs" id="tabs">
        <button class="btn tab" data-tab="grid" aria-pressed="true">Grid</button>
        <button class="btn tab" data-tab="pats" aria-pressed="false">Patterns</button>
        <button class="btn tb-new" id="clearBtn">Clear</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  var TAU = Math.PI * 2;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var FONT = '"Baloo 2", "Trebuchet MS", system-ui, sans-serif';

  // One bright color per number 0-12.
  var COLORS = ["#C9D3E0", "#E63946", "#F77F00", "#FFC93C", "#2E9E5B", "#3A86FF", "#8338EC", "#FF5DA2", "#00B4D8", "#8AC926", "#FF8C42", "#9B5DE5", "#06D6A0"];
  function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function inkOn(h) { var c = hexRgb(h); return 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2] < 140 ? "#FFFFFF" : "#1D2340"; }
  function colorOf(v) { return COLORS[((v % 13) + 13) % 13]; }
  function easeOutBack(t) { var c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  function easeOutBounce(t) {
    var n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) { t -= 1.5 / d; return n * t * t + 0.75; }
    if (t < 2.5 / d) { t -= 2.25 / d; return n * t * t + 0.9375; }
    t -= 2.625 / d; return n * t * t + 0.984375;
  }

  // ---------- State ----------
  var KEY = "mathgrid-state-v1";
  // Opening Math Grid from the Toybox home screen (Toybox.fresh) starts the first-visit grid (Times,
  // 0 to 10, nothing picked, no pattern or blocks); a reload keeps it. The grown-up setting
  // (spoken numbers) lives on the Toybox home screen and is kept.
  if (window.Toybox && Toybox.fresh()) {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
  }
  var mode = "times", N = 10, sel = null, pat = "", multN = 3, sameV = 12, hasBlocks = false;
  function val(r, c) { return mode === "times" ? r * c : r + c; }
  function opSym() { return mode === "times" ? "×" : "+"; }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ mode: mode, N: N, sel: sel, pat: pat, multN: multN, sameV: sameV, blocks: hasBlocks })); } catch (e) { /* ignore */ }
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!o || typeof o !== "object") return;
      if (o.mode === "add" || o.mode === "times") mode = o.mode;
      if (o.N === 10 || o.N === 12) N = o.N;
      if (o.sel && typeof o.sel.r === "number" && typeof o.sel.c === "number") sel = { r: clamp(o.sel.r | 0, 0, N), c: clamp(o.sel.c | 0, 0, N) };
      if (["", "mult", "dbl", "sq", "same"].indexOf(o.pat) !== -1) pat = o.pat;
      if (typeof o.multN === "number") multN = clamp(o.multN | 0, 1, 12);
      if (typeof o.sameV === "number") sameV = clamp(o.sameV | 0, 0, 144);
      hasBlocks = !!o.blocks;
    } catch (e) { /* defaults */ }
  }

  // ---------- Canvas + layout ----------
  var cv = $("cv"), ctx = cv.getContext("2d"), scene = $("scene");
  var CW = 1, CH = 1, DPR = 1, cs = 20, OX = 0, OY = 0;
  function resize() {
    var r = scene.getBoundingClientRect();
    CW = Math.max(1, r.width - 6); CH = Math.max(1, r.height - 6);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
    var n = N + 2;
    cs = Math.min(CW / n, CH / n);
    OX = (CW - cs * n) / 2; OY = (CH - cs * n) / 2;
  }
  window.addEventListener("resize", resize);
  // Grid index (0 = header, 1 = number 0, ...) under a client point.
  function hit(cx, cy, clampBody) {
    var r = cv.getBoundingClientRect();
    var gx = (cx - r.left - OX) / cs, gy = (cy - r.top - OY) / cs;
    var n = N + 2;
    if (clampBody) return { ci: clamp(Math.floor(gx), 1, n - 1), ri: clamp(Math.floor(gy), 1, n - 1) };
    if (gx < 0 || gy < 0 || gx >= n || gy >= n) return null;
    return { ci: Math.floor(gx), ri: Math.floor(gy) };
  }
  function cellCenter(ri, ci) { return { x: OX + (ci + 0.5) * cs, y: OY + (ri + 0.5) * cs }; }

  // ---------- Effects ----------
  var fx = [], rings = [];
  function burst(x, y, n, col) {
    if (reduceMotion) n = Math.min(n, 4);
    for (var i = 0; i < n; i++) {
      var a = rand(0, TAU), sp = rand(90, 360);
      fx.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 0, max: rand(0.45, 0.9), r: rand(3, 8), col: col || COLORS[1 + (i % 12)] });
    }
  }
  function ring(x, y, r, col) { rings.push({ x: x, y: y, r: r, life: 0, col: col || "#FFFFFF" }); }

  // ---------- Lights: taps, patterns ----------
  var now = 0, selT = -9999, patT = -9999, jiggle = 0;
  var ptrs = {};
  var crossCols = ["#FFC93C", "#FF5DA2", "#00B4D8", "#8AC926", "#FF8C42"];

  function patMatch(r, c) {
    var v = val(r, c);
    if (pat === "mult") return v > 0 && v % multN === 0;
    if (pat === "dbl" || pat === "sq") return r === c;
    if (pat === "same") return v === sameV;
    return false;
  }
  function patColor() {
    if (pat === "mult") return colorOf(multN);
    if (pat === "dbl") return "#FF5DA2";
    if (pat === "sq") return "#00B4D8";
    return "#FFC93C";
  }
  function waysCount() {
    var n = 0;
    for (var r = 0; r <= N; r++) for (var c = 0; c <= N; c++) if (val(r, c) === sameV) n++;
    return n;
  }
  function patText() {
    var s = opSym();
    if (pat === "mult") {
      var l = [];
      for (var k = 1; k <= 4; k++) l.push(multN * k);
      return "Multiples of " + multN + ": " + l.join(", ") + "…";
    }
    if (pat === "dbl") return "Doubles: 1 + 1, 2 + 2, 3 + 3…";
    if (pat === "sq") return "Squares: 1, 4, 9, 16, 25…";
    if (pat === "same") { var w = waysCount(); return w + (w === 1 ? " way" : " ways") + " to make " + sameV; }
    return "";
  }
  function eqText(r, c) { return r + " " + opSym() + " " + c + " = " + val(r, c); }
  function sayEq(r, c) { say(r + (mode === "times" ? " times " : " plus ") + c + " is " + val(r, c)); }

  var eqEl = $("eq");
  function setEq(t, pop) {
    buildLabel();
    if (eqEl.textContent !== t) eqEl.textContent = t;
    if (pop && !reduceMotion) { eqEl.classList.remove("go"); void eqEl.offsetWidth; eqEl.classList.add("go"); }
  }
  function restEq() {
    if (sel) setEq(eqText(sel.r, sel.c), false);
    else if (pat) setEq(patText(), false);
    else setEq("Tap a number!", false);
  }

  // ---------- Blocks ----------
  // Each block lives in a grid cell. x/y are in cell units (grid index, top-left corner).
  var blocks = [], build = null, settling = false;
  function blockPlan(r, c) {
    var list = [], i, j, k;
    if (mode === "times") {
      for (i = 1; i <= r; i++) for (j = 1; j <= c; j++) {
        list.push({ key: "t" + i + "," + j, hx: j + 1, hy: i + 1, col: colorOf(i), n: (i - 1) * c + j });
      }
    } else {
      var tot = r + c, second = c === r ? colorOf((c + 4) % 12 + 1) : colorOf(c);
      for (k = 0; k < tot; k++) {
        var col = k < r ? colorOf(r) : second;
        list.push({ key: "a" + k + col, hx: 2 + (k % N), hy: 2 + Math.floor(k / N), col: col, n: k + 1 });
      }
    }
    return list;
  }
  function mkBlock(p) { return { key: p.key, hx: p.hx, hy: p.hy, col: p.col, n: p.n, x: p.hx, y: p.hy, st: "home", t0: now, born: now, vx: 0, vy: 0, fx: 0, fy: 0, tx: 0, ty: 0, dl: 0, rot: 0, vr: 0 }; }
  function fillBlocks(r, c, animate) {
    var have = {};
    blocks.forEach(function (b) { have[b.key] = b; });
    var plan = blockPlan(r, c), out = [], added = 0;
    plan.forEach(function (p) {
      var b = have[p.key];
      if (b) { b.n = p.n; b.hx = p.hx; b.hy = p.hy; if (b.st === "home") { b.x = p.hx; b.y = p.hy; } out.push(b); }
      else { b = mkBlock(p); if (!animate) b.born = -9999; out.push(b); added++; }
    });
    blocks = out;
    hasBlocks = blocks.length > 0;
    return added;
  }
  function clearBlocks(poof) {
    if (poof && blocks.length) {
      blocks.slice(0, 40).forEach(function (b) { burst(OX + (b.x + 0.5) * cs, OY + (b.y + 0.5) * cs, 2, b.col); });
    }
    blocks = []; build = null; hasBlocks = false;
  }

  // "Count with blocks": blocks drop in one at a time with a count.
  function startBuild() {
    if (ending) return;
    if (!sel) sel = { r: 3, c: 4 };
    if (sel.r === 0 || sel.c === 0) {
      if (mode === "times" || sel.r + sel.c === 0) { sel = { r: sel.r || 3, c: sel.c || 4 }; }
    }
    clearBlocks(false);
    var plan = blockPlan(sel.r, sel.c);
    var iv = plan.length <= 12 ? 0.6 : Math.max(0.1, 7.2 / plan.length);
    build = { plan: plan, i: 0, next: now / 1000 + 0.25, iv: iv };
    selT = now;
    setEq(eqText(sel.r, sel.c).replace(/= \d+$/, "= ?"), true);
    hasBlocks = true;
    save();
    updateButtons();
  }
  function stepBuild() {
    if (!build) return;
    var t = now / 1000;
    while (build && t >= build.next && build.i < build.plan.length) {
      var p = build.plan[build.i], b = mkBlock(p);
      b.st = "drop"; b.t0 = now; b.y = -OY / cs - 1.2;

    var t = e.target.closest("button");
    if (!t) return;
    // Phone tabs (Grid / Patterns): show one group of controls at a time.
    if (t.classList.contains("tab")) {
      $("panel").dataset.tab = t.dataset.tab;
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) { b.setAttribute("aria-pressed", String(b === t)); });
      return;
    }
    if (ending || Toybox.timer.locked()) return;
    if (t.dataset.mode) { setMode(t.dataset.mode); blip(); }
    else if (t.dataset.size) { setSize(Number(t.dataset.size)); }
    else if (t.dataset.pat) { setPat(t.dataset.pat, false); }
    else if (t.dataset.step) {
      multN = clamp(multN + Number(t.dataset.step), 1, 12);
      setPat("mult", true);
    }
    else if (t.id === "buildBtn") { startBuild(); }
    else if (t.id === "clearBtn") { clearBlocks(true); sel = null; pat = ""; patT = now; updateButtons(); restEq(); save(); whoosh(); }
  });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { if (!e.target.closest("input")) e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { if (!e.target.closest(".sheet")) e.preventDefault(); }, { passive: false });

  // ---------- Sound (off by default; soft and synthesized) ----------
  // The on/off setting and the AudioContext are shared Toybox-wide (common/toybox.js); the module
  // starts/resumes audio on every touch while sound is on. Math Grid keeps its own master gain.
  var master = null, masterCtx = null;
  function out(ac) {
    if (masterCtx !== ac) { master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination); masterCtx = ac; }
    return master;
  }
  function tone(freq, dur, vol, type, slideTo) {
    var actx = Toybox.sound.ready();
    if (!actx) return;
    var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out(actx));
    o.start(t); o.stop(t + dur + 0.05);
  }
  var PENTA = [0, 2, 4, 7, 9];
  // Bigger numbers play higher notes (pentatonic, so any mix sounds nice).
  function note(v, vol) {
    var k = Math.min(Math.round(Math.sqrt(Math.max(0, v)) * 3), 24);
    var semi = PENTA[k % 5] + 12 * Math.floor(k / 5);
    tone(330 * Math.pow(2, semi / 12), 0.22, vol || 0.04, "triangle");
  }
  function blip() { tone(rand(520, 720), 0.14, 0.04, "sine", 880); }
  function whoosh() { tone(700, 0.25, 0.035, "sine", 250); }
  function chime() { tone(523, 0.4, 0.04); setTimeout(function () { tone(784, 0.6, 0.04); }, 120); }
  // ---------- Spoken numbers (device voice; off by default; a grown-up setting on the home screen) ----------
  var hasVoice = typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined";
  // Carry Math Grid's old saved choice over to the shared setting once, then forget the old key.
  try {
    var OLD_VKEY = "mathgrid-voice-v1";
    if (localStorage.getItem(OLD_VKEY) === "on" && Toybox.settings.get("mathgrid-voice") === false) Toybox.settings.set("mathgrid-voice", true);
    localStorage.removeItem(OLD_VKEY);
  } catch (e) { /* ignore */ }
  var voiceOn = hasVoice && !!Toybox.settings.get("mathgrid-voice");
  Toybox.settings.onChange(function (id, on) {
    if (id !== "mathgrid-voice") return;
    voiceOn = hasVoice && !!on;
    if (!voiceOn && hasVoice) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
  });
  function say(t) {
    if (!voiceOn || !hasVoice) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.rate = 0.95; u.pitch = 1.1; u.volume = 0.9;
      window.speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }

  // ---------- Play timer hooks (the timer, sheet, toast and rest screen live in common/toybox.js) ----------
  var ending = false, endingStartedAt = 0, endingDone = null;
  // The fuel gauge above the grid shows the time left.
  function drawFuel(info) {
    var active = info.phase === "running" || info.phase === "ending";
    $("fuel").hidden = !active;
    if (!active) return;
    var f = info.fraction, fill = $("fuelFill");
    fill.style.width = (f * 100).toFixed(1) + "%";
    fill.style.background = f > 0.5 ? "#2E9E5B" : (f > 0.2 ? "#FFC93C" : "#F77F00");
    $("fuelNum").hidden = !(info.showMinutes && info.phase === "running");
    $("fuelNum").textContent = String(info.minutes);
  }
  // Ending: let go of fingers and building; the blocks settle into a neat pile at the bottom.
  function onEnding(done) {
    endingStartedAt = performance.now();
    endingDone = done;
    ending = true;
    ptrs = {};
    build = null;
    blocks.forEach(function (b) { if (b.st === "drop") { b.st = "home"; b.y = b.hy; } });
    setEq("Time to rest", true);
    settleBlocks();
  }
  function goodnight() {
    say("Goodnight, numbers");
    chime();
  }
  // Next time, the blocks are back in their squares.
  function onRest() {
    ending = false; settling = false; endingDone = null;
    blocks.forEach(function (b) { b.st = "home"; b.x = b.hx; b.y = b.hy; b.rot = 0; });
    restEq();
  }
  function onWake() {
    var was = ending;
    ending = false; settling = false; endingDone = null;
    if (was) blocks.forEach(function (b) { if (b.st === "settle") { b.st = "return"; b.fx = b.x; b.fy = b.y; b.fr = b.rot || 0; b.t0 = now; } });
    restEq();
  }
  function restSVG() {
    var o = '<svg class="rest-art" viewBox="-50 -50 100 100" aria-hidden="true">';
    o += '<circle cx="34" cy="-34" r="9" fill="#FFF4CC" stroke="#1D2340" stroke-width="2"/><circle cx="38" cy="-37" r="8" fill="#2B3A67"/>';
    var bl = [[-33, 18, 1], [-11, 18, 2], [11, 18, 3], [-22, -4, 4], [0, -4, 5]];
    bl.forEach(function (b) {
      var col = COLORS[b[2]], x = b[0], y = b[1];
      o += '<rect x="' + (x - 10) + '" y="' + (y - 10) + '" width="20" height="20" rx="4" fill="' + col + '" stroke="#1D2340" stroke-width="2"/>';
      o += '<text x="' + x + '" y="' + (y + 1) + '" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="11" fill="' + inkOn(col) + '">' + b[2] + '</text>';
      o += '<path d="M' + (x - 6) + " " + (y + 5) + "q2 2 4 0M" + (x + 2) + " " + (y + 5) + 'q2 2 4 0" fill="none" stroke="' + inkOn(col) + '" stroke-width="1.4" stroke-linecap="round"/>';
    });
    o += '<rect x="-46" y="29" width="92" height="6" rx="3" fill="#C9D3E0" stroke="#1D2340" stroke-width="2"/>';
    o += '<text x="-36" y="-26" font-family="Baloo 2, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">z</text><text x="-26" y="-36" font-family="Baloo 2, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">z</text><text x="-19" y="-43" font-family="Baloo 2, sans-serif" font-weight="800" font-size="7" fill="#FFFFFF">z</text>';
    return o + "</svg>";
  }

  // ---------- Start ----------
  load();
  Array.prototype.forEach.call(document.querySelectorAll("[data-size]"), function (b) { b.setAttribute("aria-pressed", String(Number(b.dataset.size) === N)); });
  setMode(mode);
  resize();
  if (hasBlocks && sel) fillBlocks(sel.r, sel.c, false);
  if (pat) patT = -9999;
  updateButtons();
  restEq();
  if (pat && !sel) setEq(patText(), false);
  // The old Math Grid sound key held "on"/"off"; the shared migration reads "1"/"true", so translate it once.
  try { if (localStorage.getItem("mathgrid-sound-v1") === "on") localStorage.setItem("mathgrid-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "math-grid",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the blocks settle and rest, and the controls lock.",
    goodbyeOption: "End with a Goodnight button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Goodnight, numbers",
    farewellDone: "Goodnight, numbers!",
    restLine: "The numbers are resting.",
    restLine2: "They will be right here next time.",
    restArt: restSVG,
    soundNote: "Soft notes. Hold for 2 seconds.",
    legacy: { timer: "mathgrid-timer-v1", sound: "mathgrid-sound-v1", big: "mathgrid-big-v1" },
    onEnding: onEnding,
    onGoodbye: goodnight,
    onRest: onRest,
    onWake: onWake,
    onBig: function () { resize(); },
    onSound: function (on) { if (on) setTimeout(chime, 60); },
    onTimer: drawFuel
  });
  requestAnimationFrame(loop);

  // Test hook, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) window.__math = {
    state: function () { return { mode: mode, N: N, sel: sel, pat: pat, multN: multN, sameV: sameV, blocks: blocks.length, building: !!build, eq: eqEl.textContent, ending: ending }; },
    cell: function (r, c) { var rc = cv.getBoundingClientRect(), p = cellCenter(r + 1, c + 1); return { x: rc.left + p.x, y: rc.top + p.y }; }
  };
})();
</script>
</body>
</html>
