<style>
:root {
  --bg: #CDE9FF; --panel: #FFFFFF; --ink: #1D2340; --muted: #4A5578; --edge: #1D2340; --accent: #FFC93C; --plate: #F4FAFF; --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.tb-head a { text-decoration: none; }
.stage { background: #A9DCFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
.loads { font-variant-numeric: tabular-nums; }
.loads.pop { animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel { display: none; }
body.ending .tb-panel, body.ending .homebtn, body.ending .mapbtn { pointer-events: none; opacity: 0.4; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
.mapbtn .tb-mapic { width: 30px; height: 30px; background: #FFFFFF; border-radius: 8px; }

#steps .tb-go-word { white-space: normal; text-align: center; text-wrap: balance; }
@media (prefers-reduced-motion: reduce) { .loads.pop { animation: none; } }

    </section>

<script>
(function () {
  "use strict";
  // Caterpillar Hunt: tractors on tracks ("caterpillar tracks") or on wheels, and looking after the soil.
  // A soft, wet field. Four jobs, one tap each:
  //   Wheels: the green tractor drives across on its big tyres. They sink and leave deep ruts with puddles; the
  //           cut-away shows the tyres squashing the crumbly soil into a hard flat layer (the worms wriggle away).
  //   Tracks: the big tracked tractor drives across the lane next to it. The long rubber tracks spread its weight:
  //           only a light flat print, and the soil underneath stays crumbly.
  //   Loosen: the tracked tractor pulls the subsoiler down the squashed lane. Its long legs run through the
  //           ground under the hard layer and crack it into crumbs; the packer roller flattens the ruts.
  //   Look:   the farmer digs out a spadeful: dark crumbly soil, roots, and worms wriggling out of it.
  // Then weeks go by and the field is wet again. The stage is split like Spuds in Mud: the field with the whole
  // machine on top (the farm's shared side view) and a close-up below (or beside) that always shows the work:
  // a cut-away of the soil along the lane being driven, with the machine on top of it.
  // Drawings live here for now, written like farm.js's (metres, y up negative, facing +x) so they can move into
  // farm.js later: trackedTractor (origin on the ground under the drive wheel), subsoiler (origin at its hitch
  // pin, the ground at y = +0.55), farmer and spade (origin at his feet), worm, mole, blackbird.
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.u, clamp = U.clamp, lerp = U.lerp, ease = U.ease, hash = U.hash, mix = U.mix, INK = U.INK;
  var D = Farm.draw, SH = Farm.shape, snd = Farm.sound, TAU = Math.PI * 2;
  var P = SH.P, R = SH.R, C = SH.C, Ln = SH.Ln, tube = SH.tube, fs = SH.fs, rr = SH.rr;
  var NAME = (Farm.NAMES && Farm.NAMES.tracks) || "Caterpillar Hunt";
  document.title = NAME; $("title").textContent = NAME;
  function LWu() { return Farm.LW; }

  // ---------- State ----------
  var KEY = "farm-tracks-v1";
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  if (startFresh || !saved || typeof saved !== "object") saved = {};
  var count = typeof saved.worms === "number" && isFinite(saved.worms) ? Math.max(0, Math.floor(saved.worms)) : 0;
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ worms: count })); } catch (e) { /* ignore */ } }
  function world(fn) { try { Farm.world.update(fn); } catch (e) { /* ignore */ } }

  // The field: L metres long. Two lanes along it: the wheel lane on the machine line (depth 1) and the track
  // lane one step further back (depth LT). The soil of each lane is a row of columns every DX metres.
  var L = 12, LW_R = 1, LT_R = 1.3, X0 = -8, X1 = L + 8, DX = 0.05, NC = Math.round((X1 - X0) / DX) + 1;
  var MUD = "#6E4528", MUD_D = "#4B2E1A", SUB = "#97693E", WATER = "#86B3D6", PINK = "#EC8B90", PINK_D = "#CF5F6B";
  var G = { body: "#3E9F3A", dark: "#2B7A2A", light: "#6CC65C", frame: "#2B3040", glass: "#BFE7FA", steel: "#C3CCD6", grey: "#7C8696", roof: "#D3DAE2" };
  function Lane(r) { this.r = r; this.comp = new Float32Array(NC); this.rut = new Float32Array(NC); this.loose = new Float32Array(NC); this.lt = new Float32Array(NC); this.lt.fill(-1); }
  var lanes = { w: new Lane(LW_R), t: new Lane(LT_R) };
  function ci(x) { return Math.round((x - X0) / DX); }
  function cx(i) { return X0 + i * DX; }
  function inField(x) { return x >= 0 && x <= L; }
  function at(arr, x) {
    var f = (x - X0) / DX, i = Math.floor(f), t = f - i;
    if (i < 0) return arr[0]; if (i >= NC - 1) return arr[NC - 1];
    return arr[i] + (arr[i + 1] - arr[i]) * t;
  }
  function resetLanes() { ["w", "t"].forEach(function (k) { var l = lanes[k]; l.comp.fill(0); l.rut.fill(0); l.loose.fill(0); l.lt.fill(-1); }); }

  // The machines. Each rig: its tractor-frame extent (for the camera), where it waits before the field, the end of
  // its pass, its speed, its depth (lane) and its name.
  var THITCH = [-1.15, -0.55], SUB_G = 0.55, LEG = THITCH[0] - 0.45, ROLL = THITCH[0] - 2.35;
  var RIGS = {
    wheels: { ext: [-1.3, 4.2], x0: -4.4, end: L + 0.45, v: 3.2, lane: "w", name: "Wheeled tractor" },
    tracks: { ext: [-1.25, 4.6], x0: -4.75, end: L + 0.25, v: 3.2, lane: "t", name: "Tracked tractor" },
    sub: { ext: [THITCH[0] - 2.75, 4.6], x0: -4.7, end: L - ROLL + 0.1, v: 3.6, lane: "w", name: "Subsoiler" }
  };
  // The steps. go = the Go pill, ready = the coach while it waits for him, work = while it works, busy = when he
  // taps while it works.
  var JOBS = {
    wheels: { go: "Drive wheels", step: "Wheels", ready: "Drive across the wet field.", work: "The heavy wheels squash the soil.", busy: "The tractor is driving across." },
    tracks: { go: "Drive tracks", step: "Tracks", ready: "Now try the tractor on tracks.", work: "The long tracks spread the weight.", busy: "The tracked tractor is driving across." },
    sub: { go: "Loosen it", step: "Loosen", ready: "Loosen the squashed soil.", work: "The subsoiler cracks the hard layer.", busy: "The subsoiler is loosening the soil." },
    look: { go: "Look inside", step: "Look", ready: "Dig up some soil and look.", work: "The spade lifts out the soil.", busy: "The farmer is digging." }
  };
  var ORDER = ["wheels", "tracks", "sub", "look"];
  var job = "wheels", phase = "arrive", phaseT = 0, auto = false, grab = null, ending = false, dusk = 0;
  var m = null, leaving = null;                     // the machine working now, the one driving away
  var fm = { on: false, x: 0, t: 0, walk: 0, state: "away" };   // the farmer for the Look step
  var FX = L * 0.5;                                  // where he digs
  var dg = { t: 0, n: 0 };                           // the dig: time, worms out
  var faceT = 0, sur = null, growG = 0;

  function locked() { return ending || (window.Toybox && Toybox.timer.locked()); }
  function working() { return phase === "drive" && m && m.v > 0.3; }

  // ---------- The stage: the field view and the close-up ----------
  var phoneCoach = window.matchMedia ? matchMedia("(max-width: 600px), (orientation: landscape) and (max-height: 520px)") : null;
  function topRoom() { return phoneCoach && phoneCoach.matches ? 34 : 66; }
  function gyOf(w, h) { var port = h > w * 1.05, short = !port && h < 460; return h * (short ? 0.75 : 0.7); }
  var zoomF = { span: 7.4, target: 7.4 };
  var scF = new Farm.Scene({ L: L, xmin: -16, xmax: L + 20, fit: function (w, h) { return Math.min(w * 0.9 / zoomF.span, (gyOf(w, h) - topRoom()) / 4.5); } });
  var parts = new Farm.Particles();
  var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
  var W = 300, H = 300, DPR = 1, time = 0;
  var RG = { f: { x: 0, y: 0, w: 300, h: 150 }, c: { x: 0, y: 150, w: 300, h: 150 }, side: false, pad: 8 };
  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(50, r.width); H = Math.max(50, r.height);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    RG.side = W / H > 1.4;
    if (RG.side) { var fw = Math.round(W * 0.54); RG.f = { x: 0, y: 0, w: fw, h: H }; RG.c = { x: fw, y: 0, w: W - fw, h: H }; }
    else { var fh = Math.round(H * 0.45); RG.f = { x: 0, y: 0, w: W, h: fh }; RG.c = { x: 0, y: fh, w: W, h: H - fh }; }
    // On phones the coach pill sits at the bottom of the stage: keep the close-up's story above it.
    RG.pad = phoneCoach && phoneCoach.matches ? 60 : 8;
    scF.layout(RG.f.w, RG.f.h);
    scF.follow(camTarget(), 0, true);
    snapClose();
  }

  // ---------- Coach, counter, name tags ----------
  var coach = Toybox.coach($("coach"));
  function setCount() { var el = $("loads"); el.textContent = "Worms: " + count; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  $("loads").textContent = "Worms: " + count;
  function tagAt(text, x, y) { var b = cv.getBoundingClientRect(); Toybox.nametag(text, b.left + x, b.top + y, 2400); }
  function rigOf(mm) { return RIGS[mm.kind]; }
  // a point on a machine in the field view: dx metres from its origin, ly in machine units (y up negative)
  function mScreen(mm, dx, ly) { var r = mm.r, s = scF.S(r); return { x: scF.X(mm.x, r) + dx * s, y: scF.Y(r) + ly * s, s: s }; }
  function tagRig() {
    if (!m) return;
    var g = rigOf(m), p = m.kind === "sub" ? mScreen(m, LEG - 0.4, -1.4) : mScreen(m, 1.2, m.kind === "tracks" ? -4.4 : -3.8);
    tagAt(g.name, p.x, Math.max(26, p.y));
  }

  // =====================================================================================================
  // Drawings (machine units)
  // =====================================================================================================
  function faceU(x, y, r, dx, f, look) {
    if (!f) return;
    ctx.save(); ctx.globalAlpha *= clamp(f, 0, 1);
    var blink = Math.sin(time * 2.1) > 0.985 ? 0.15 : 1, lx = look ? look[0] * r * 0.35 : 0, ly = look ? look[1] * r * 0.35 : r * 0.2;
    [0, dx].forEach(function (ox) {
      ctx.save(); ctx.translate(x + ox, y); ctx.scale(1, blink);
      C(ctx, 0, 0, r, "#FFFFFF", LWu() * 0.8); C(ctx, lx, ly, r * 0.5, INK, 0); C(ctx, lx + r * 0.18, ly - r * 0.2, r * 0.16, "#FFFFFF", 0);
      ctx.restore();
    });
    ctx.beginPath(); ctx.arc(x + dx / 2, y + r * 1.0, r * 1.3, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.strokeStyle = INK; ctx.lineWidth = LWu() * 1.3; ctx.lineCap = "round"; ctx.stroke();
    ctx.restore();
  }
  function shine(x1, y1, x2, y2, w) { Ln(ctx, x1, y1, x2, y2, "rgba(255,255,255,0.45)", w); }
  function driverU(x, y, s) {
    R(ctx, x - 0.26 * s, y + 0.1 * s, 0.52 * s, 0.5 * s, 0.16 * s, "#3D6FB6", LWu() * 0.7);
    C(ctx, x, y, 0.17 * s, "#F2C8A0", LWu() * 0.7);
    P(ctx, [x - 0.18 * s, y - 0.04 * s, x - 0.16 * s, y - 0.2 * s, x + 0.16 * s, y - 0.2 * s, x + 0.3 * s, y - 0.06 * s], "#E8473B", LWu() * 0.6);
  }
  // A plain round wheel with a rim and a hub (the track's drive wheel, idler and rollers).
  function hubWheel(x, y, r, rot, rim) {
    C(ctx, x, y, r, "#3A3F4E");
    C(ctx, x, y, r * 0.78, rim || G.steel, LWu() * 0.8);
    C(ctx, x, y, r * 0.3, "#8C97A6", LWu() * 0.6);
    for (var i = 0; i < 5; i++) { var a = rot + i * TAU / 5; C(ctx, x + Math.cos(a) * r * 0.52, y + Math.sin(a) * r * 0.52, r * 0.08, "#6E7887", 0); }
  }
  // The rubber track's outline: the drive wheel (rear, big), the idler (front) and a straight run along the
  // ground. TK = { dw: [x, y, R], id: [x, y, R], th (belt thickness) }; pointAt(s) walks round it.
  var TK = { dw: [0, -0.86, 0.86], id: [3.25, -0.62, 0.62], th: 0.16, rollers: [0.95, 1.65, 2.35] };
  var TSEG = (function () {
    var d = TK.dw, i = TK.id, segs = [];
    segs.push({ k: "l", a: [d[0], 0], b: [i[0], 0] });
    segs.push({ k: "a", c: [i[0], i[1]], r: i[2], a0: Math.PI / 2, a1: -Math.PI / 2 });
    segs.push({ k: "l", a: [i[0], i[1] - i[2]], b: [d[0], d[1] - d[2]] });
    segs.push({ k: "a", c: [d[0], d[1]], r: d[2], a0: -Math.PI / 2, a1: -Math.PI * 1.5 });
    var tot = 0;
    segs.forEach(function (s) { s.len = s.k === "l" ? Math.hypot(s.b[0] - s.a[0], s.b[1] - s.a[1]) : Math.abs(s.a1 - s.a0) * s.r; s.s0 = tot; tot += s.len; });
    return { segs: segs, len: tot };
  })();
  function trackPoint(s) {
    s = ((s % TSEG.len) + TSEG.len) % TSEG.len;
    for (var k = 0; k < TSEG.segs.length; k++) {
      var g = TSEG.segs[k];
      if (s <= g.s0 + g.len || k === TSEG.segs.length - 1) {
        var f = (s - g.s0) / g.len;
        if (g.k === "l") { var dx = g.b[0] - g.a[0], dy = g.b[1] - g.a[1], l = Math.hypot(dx, dy); return { x: g.a[0] + dx * f, y: g.a[1] + dy * f, nx: dy / l, ny: -dx / l }; }
        var a = lerp(g.a0, g.a1, f); return { x: g.c[0] + Math.cos(a) * g.r, y: g.c[1] + Math.sin(a) * g.r, nx: Math.cos(a), ny: Math.sin(a) };
      }
    }
    return { x: 0, y: 0, nx: 0, ny: 1 };
  }
  function trackPath(inset) {
    var d = TK.dw, i = TK.id;
    ctx.beginPath();
    ctx.moveTo(d[0], -inset);
    ctx.lineTo(i[0], -inset);
    ctx.arc(i[0], i[1], i[2] - inset, Math.PI / 2, -Math.PI / 2, true);
    ctx.lineTo(d[0], d[1] - d[2] + inset);
    ctx.arc(d[0], d[1], d[2] - inset, -Math.PI / 2, -Math.PI * 1.5, true);
    ctx.closePath();
  }
  // The big tracked tractor (side view, facing +x, origin on the ground under the drive wheel's middle).
  // st = { wheel (m driven), time, face, beacon, hitch: { lift } }. Its linkage's lower pin is at THITCH.
  function trackedTractor(st) {
    st = st || {};
    var lift = (st.hitch && st.hitch.lift) || 0, t = st.time || 0, dist = st.wheel || 0, ly = -lift * 0.6, i;
    if (st.hitch) {
      Ln(ctx, -0.3, -0.95, THITCH[0], THITCH[1] + ly, INK, 0.17 + LWu() * 2); Ln(ctx, -0.3, -0.95, THITCH[0], THITCH[1] + ly, G.grey, 0.17);
      Ln(ctx, -0.55, -1.95, THITCH[0] + 0.05, THITCH[1] - 0.8 + ly, INK, 0.12 + LWu() * 2); Ln(ctx, -0.55, -1.95, THITCH[0] + 0.05, THITCH[1] - 0.8 + ly, "#E2B33A", 0.12);
      Ln(ctx, -0.35, -2.0, -0.78, -1.55 + ly, INK, 0.11 + LWu() * 2); Ln(ctx, -0.35, -2.0, -0.78, -1.55 + ly, G.grey, 0.11);
      Ln(ctx, -0.78, -1.55 + ly, -0.8, -0.78 + ly * 0.6, INK, 0.08);
    }
    // the frame along the top of the tracks
    R(ctx, -0.65, -2.2, 5.05, 0.55, 0.1, "#4A505E");
    // front weights
    R(ctx, 4.12, -2.12, 0.48, 0.72, 0.08, "#8B95A5");
    for (i = 0; i < 3; i++) Ln(ctx, 4.2, -1.98 + i * 0.2, 4.52, -1.98 + i * 0.2, "#5D6675", LWu() * 0.8);
    // the hood
    ctx.beginPath();
    ctx.moveTo(1.2, -3.0); ctx.lineTo(3.75, -2.92); ctx.quadraticCurveTo(4.2, -2.9, 4.22, -2.5); ctx.lineTo(4.24, -2.0); ctx.lineTo(1.2, -2.0); ctx.closePath();
    fs(ctx, G.body);
    P(ctx, [1.2, -2.3, 4.24, -2.3, 4.24, -2.0, 1.2, -2.0], G.dark, LWu() * 0.8);
    shine(1.35, -2.9, 3.7, -2.84, 0.07);
    for (i = 0; i < 5; i++) Ln(ctx, 2.2 + i * 0.22, -2.78, 2.32 + i * 0.22, -2.44, G.dark, 0.06);
    R(ctx, 4.0, -2.8, 0.26, 0.78, 0.06, G.frame, LWu() * 0.8);
    for (i = 0; i < 4; i++) Ln(ctx, 4.04, -2.66 + i * 0.17, 4.22, -2.66 + i * 0.17, "#59607A", 0.04);
    R(ctx, 3.66, -2.9, 0.36, 0.15, 0.05, "#FFE98A", LWu() * 0.7);
    // the cab

        if (Math.random() < dt * 9) parts.add({ kind: "chunk", x: mm.x - 0.75, h: 1.2 + Math.random() * 0.4, r: 0.995, vx: -1.5 - Math.random() * 1.5, vh: 1.5 + Math.random() * 1.5, life: 0.75, size: 0.09, spin: 6, col: MUD_D });
        if (Math.random() < dt * 6) parts.add({ kind: "dot", x: mm.x - 0.6, h: 0.1, r: 0.99, vx: -0.8 - Math.random(), vh: 1.8 + Math.random(), life: 0.6, size: 0.06, col: WATER });
        if (cmode === "wheels" && Math.random() < dt * 14) cbit(mm.x - 0.7 + Math.random() * 0.3, -0.9 - Math.random() * 0.5, -1.4 - Math.random() * 1.2, -1.5 - Math.random() * 1.5, Math.random() < 0.3 ? WATER : MUD_D, 0.03 + Math.random() * 0.02);
      }
    } else if (mm.kind === "tracks") {
      for (i = Math.max(0, ci(mm.x - 0.1)); i <= Math.min(NC - 1, ci(mm.x + 3.3)); i++) {
        x = cx(i); if (!inField(x)) continue;
        ln.rut[i] = Math.max(ln.rut[i], 0.03); ln.comp[i] = Math.max(ln.comp[i], 0.16);
      }
    } else {
      var leg = mm.x + LEG, roll = mm.x + ROLL;
      if (mm.lift < 0.3) {
        for (i = Math.max(0, ci(leg - 1.5)); i <= Math.min(NC - 1, ci(leg)); i++) { x = cx(i); if (inField(x) && ln.lt[i] < 0) ln.lt[i] = time; }
        for (i = Math.max(0, ci(roll - 1.5)); i <= Math.min(NC - 1, ci(roll)); i++) { x = cx(i); if (inField(x)) ln.rut[i] = Math.min(ln.rut[i], 0.012); }
        if (inField(leg) && mm.v > 0.5) {
          if (Math.random() < dt * 8) parts.add({ kind: "chunk", x: leg + 0.1, h: 0.05, r: 0.995, vx: -0.5 - Math.random() * 0.6, vh: 1.0 + Math.random() * 0.8, life: 0.6, size: 0.07, spin: 5, col: "#7B4E2E" });
          if (cmode === "sub" && Math.random() < dt * 6) cbit(leg + 0.35, 0.0, -0.4 - Math.random() * 0.4, -1.2 - Math.random(), "#7B4E2E", 0.03);
        }
      }
      // the legs go in at the start of the field and come out at the end
      var down = leg > -0.3 && leg < L + 0.2 ? 0 : 1;
      if (mm === m && phase !== "drive" && phase !== "ready") down = 1;
      if (mm === m && phase === "ready") down = 1;
      mm.lift += (down - mm.lift) * Math.min(1, dt * 3.5);
      mm.roll += mm.v * dt;
    }
  }
  function update(dt) {
    time += dt; phaseT += dt;
    var drive = 0, i;
    if (Math.abs(zoomF.span - zoomF.target) > 0.02) { zoomF.span += (zoomF.target - zoomF.span) * Math.min(1, dt * 2.2); scF.layout(RG.f.w, RG.f.h); }
    if (phase === "arrive" && m) {
      var g = RIGS[m.kind], d = g.x0 - m.x; m.v = clamp(d * 1.6, 1.2, 7); m.x += Math.min(m.v * dt, Math.max(d, 0.001)); drive = 0.6;
      if (d < 0.02) { m.x = g.x0; arrived(); }
    } else if (phase === "drive" && m) {
      var vt = 0, V = RIGS[m.kind].v;
      if (grab && grab.to !== undefined) vt = clamp((grab.to - m.x) * 3, 0, V * 1.4);
      else if (auto) vt = V;
      m.v += (vt - m.v) * Math.min(1, dt * (vt > m.v ? 3 : 6));
      m.x += m.v * dt; drive = m.v / V;
      if (m.x >= RIGS[m.kind].end) passDone();
    } else if (phase === "walk") {
      fm.x = Math.min(FX, fm.x + 1.7 * dt); fm.walk += dt * 7;
      if (fm.x >= FX - 0.001) farmerHere();
    } else if (phase === "dig") {
      var t0 = dg.t; dg.t += dt;
      if (t0 < 0.8 && dg.t >= 0.8) snd.soil(0);
      if (t0 < 2.2 && dg.t >= 2.2) { snd.clunk(); for (i = 0; i < 6; i++) cbit(fm.x + 0.5 + Math.random() * 0.4, 0.0, (Math.random() - 0.5) * 1.2, -1.2 - Math.random(), "#7B4E2E", 0.025); }
      for (i = 0; i < SLW.length; i++) {
        var te = 2.35 + i * 0.7 + 0.3;
        if (t0 < te && dg.t >= te) { count++; dg.n = i + 1; save(); setCount(); snd.pop(); if (i === SLW.length - 1) snd.chime(); }
      }
      if (dg.t >= 2.35 + SLW.length * 0.7 + 0.5) finishJob();
    } else if (phase === "grow") {
      growG = clamp(phaseT / 3.4, 0, 1);
      ["w", "t"].forEach(function (k) { var l = lanes[k]; for (var q = 0; q < NC; q++) { l.rut[q] *= 1 - dt * 1.2; l.comp[q] *= 1 - dt * 1.2; l.loose[q] *= 1 - dt * 1.2; } });
      if (phaseT > 1.0) { fm.on = false; fm.state = "away"; }
      if (phaseT >= 3.4) { resetLanes(); resetWorms(); leaving = null; bringIn("wheels"); }
    }
    if (m) { m.wheel += m.v * dt; stamp(m, dt); if (m.flash > 0) m.flash = Math.max(0, m.flash - dt); }
    if (leaving) {
      leaving.v = Math.min(5, leaving.v + dt * 2); leaving.x += leaving.v * dt; leaving.wheel += leaving.v * dt; stamp(leaving, dt);
      if (leaving.x > L + 26) leaving = null;
    }
    // the loosened soil opens up over a moment after the leg has passed
    var ln = lanes.w;
    for (i = 0; i < NC; i++) if (ln.lt[i] >= 0 && ln.loose[i] < 1) { ln.loose[i] = clamp((time - ln.lt[i]) / 0.9, 0, 1); }
    if (faceT > 0) faceT = Math.max(0, faceT - dt);
    if (sur) {
      var s0 = sur.t; sur.t += dt;
      if (sur.kind === "boot" && s0 < 4.0 && sur.t >= 4.0) { snd.pop(); var cx0 = CXi(RG.c.w * sur.fx); for (i = 0; i < 6; i++) cbit(cx0 + (Math.random() - 0.5) * 0.2, -0.05, (Math.random() - 0.5) * 2, -1.5 - Math.random() * 1.5, MUD_D, 0.035); }
      if (sur.kind === "mole" && s0 < 3.0 && sur.t >= 3.0) snd.pop();
      if (sur.kind === "bird" && s0 < 3.0 && sur.t >= 3.0) snd.pop();
      if (sur.t > (SUR_T[sur.kind] || 5)) sur = null;
    }
    if (ending) dusk = Math.min(1, dusk + dt * 0.5);
    parts.update(dt);
    updateWorms(dt); updateBits(dt);
    scF.follow(camTarget(), dt); updateCam(dt);
    var lvl = phase === "drive" ? 0.3 + drive * 0.7 : (phase === "arrive" ? 0.6 : (m ? 0.15 : (leaving ? 0.5 : 0)));
    engLevel += (lvl - engLevel) * Math.min(1, dt * 4);
    snd.engine(ending || (!m && !leaving) ? -1 : engLevel);
    snd.soil(working() ? 0.5 * drive : 0);
  }

  // ---------- Drawing the field ----------
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(RG.f.x, RG.f.y);
    ctx.beginPath(); ctx.rect(0, 0, RG.f.w, RG.f.h); ctx.clip();
    drawField(scF);
    ctx.restore();
    drawClose();
  }
  var PUDDLES = [];
  for (var pi = 0; pi < 9; pi++) PUDDLES.push({ x: 0.8 + hash(pi, 1) * (L - 1.6), r: 1.6 + hash(pi, 2) * 2.6, w: 0.5 + hash(pi, 3) * 0.9 });
  // One lane's marks on the ground: deep ruts with puddles, a light flat track print, or loosened soil.
  function drawLane(S, ln, half) {
    var r = ln.r, dr = 0.045 * r, xr = S.xRange(r), i0 = Math.max(0, ci(xr[0]) - 2), i1 = Math.min(NC - 1, ci(xr[1]) + 2), n = S.night || 0;
    var ra = half === "near" ? r - dr : r, rb = half === "far" ? r + dr : r;
    if (half === "all") { ra = r - dr; rb = r + dr; }
    function kind(i) {
      if (!inField(cx(i))) return 0;
      if (ln.loose[i] > 0.5) return 3;
      if (ln.rut[i] > 0.08) return 1;
      if (ln.rut[i] > 0.008) return 2;
      return 0;
    }
    var i = i0;
    while (i <= i1) {
      var k = kind(i);
      if (!k) { i++; continue; }
      var j = i; while (j + 1 <= i1 && kind(j + 1) === k) j++;
      var xa = cx(i) - DX / 2, xb = cx(j) + DX / 2;
      ctx.beginPath();
      ctx.moveTo(S.X(xa, rb), S.Y(rb)); ctx.lineTo(S.X(xb, rb), S.Y(rb)); ctx.lineTo(S.X(xb, ra), S.Y(ra)); ctx.lineTo(S.X(xa, ra), S.Y(ra)); ctx.closePath();
      var col = k === 1 ? MUD_D : (k === 2 ? "#9E6C44" : "#7A4A2A");
      ctx.fillStyle = mix(col, "#2B3A55", n * 0.4); ctx.fill();
      var s = S.S(r);
      if (k === 1 && half !== "near") {
        // puddles in the ruts, catching the sky
        for (var q = Math.floor(xa / 0.7); q <= Math.ceil(xb / 0.7); q++) {
          var px = q * 0.7 + hash(q, 5) * 0.3; if (px < xa || px > xb || hash(q, 6) < 0.3) continue;
          ctx.beginPath(); ctx.ellipse(S.X(px, r + dr * 0.4), S.Y(r + dr * 0.4), s * (0.18 + 0.15 * hash(q, 7)), Math.max(1.2, (S.Y(r) - S.Y(r + dr)) * 0.45), 0, 0, TAU);
          ctx.fillStyle = mix(WATER, "#2B3A55", n * 0.5); ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillRect(S.X(px, r + dr * 0.4) - s * 0.08, S.Y(r + dr * 0.4) - 1, s * 0.12, Math.max(1, s * 0.015));
        }
      }
      if (k === 1 && half === "near") {
        // the rut's near lip: a ridge of squeezed-up mud
        ctx.strokeStyle = mix("#8A5A36", "#2B3A55", n * 0.4); ctx.lineWidth = Math.max(1.5, s * 0.05);
        ctx.beginPath(); ctx.moveTo(S.X(xa, ra), S.Y(ra)); ctx.lineTo(S.X(xb, ra), S.Y(ra)); ctx.stroke();
      }
      if (k === 2 && s * 0.03 > 0.8) {
        // the track print: neat bars across it
        ctx.strokeStyle = "rgba(90,56,30,0.55)"; ctx.lineWidth = Math.max(1, s * 0.03); ctx.beginPath();
        for (var b = Math.ceil(xa / 0.27); b * 0.27 <= xb; b++) { var bx2 = b * 0.27; ctx.moveTo(S.X(bx2, ra), S.Y(ra)); ctx.lineTo(S.X(bx2 + 0.06, rb), S.Y(rb)); }
        ctx.stroke();
      }
      if (k === 3 && s * 0.04 > 1) {
        // loose crumbly soil
        ctx.fillStyle = "#A0714A";
        for (var c2 = Math.floor(xa / 0.22); c2 * 0.22 <= xb; c2++) { var cxp = c2 * 0.22 + hash(c2, 4) * 0.15, rr3 = lerp(ra, rb, hash(c2, 8)); ctx.beginPath(); ctx.arc(S.X(cxp, rr3), S.Y(rr3), Math.max(1, s * 0.035), 0, TAU); ctx.fill(); }
      }
      i = j + 1;
    }
  }
  function drawRig(S, mm) {
    var f = faceAmt(), lit = mm.flash > 0 || (mm === m && phase === "drive");
    if (mm.kind === "wheels") {
      S.put(ctx, mm.x, mm.r, 1, function () { ctx.translate(0, mm.sink); D.tractor(ctx, { wheel: mm.wheel, time: time, face: f, look: [1, 0.4], beacon: lit }); });
    } else {
      S.put(ctx, mm.x, mm.r, 1, function () {
        if (mm.kind === "sub") { ctx.save(); ctx.translate(THITCH[0], THITCH[1] - mm.lift * 0.6); subsoiler({ time: time, roll: mm.roll, face: f, work: working() }); ctx.restore(); }
        trackedTractor({ wheel: mm.wheel, time: time, face: f, beacon: lit, hitch: mm.kind === "sub" ? { lift: mm.lift } : null });
      });
    }
  }
  function drawField(S) {
    S.sky(ctx, { time: time, arc: phase === "grow" ? growG : null, season: "spring", dusk: dusk });
    S.hedge(ctx, { season: "spring" });
    var P = { crop: "spuds", stage: "soil", time: time };
    S.field(ctx, "far", P);
    var n = S.night || 0;
    PUDDLES.forEach(function (p) {
      var x = S.X(p.x, p.r), y = S.Y(p.r), s = S.S(p.r);
      if (x < -60 || x > S.W + 60) return;
      ctx.beginPath(); ctx.ellipse(x, y, p.w * s, Math.max(1.5, p.w * s * 0.13), 0, 0, TAU); ctx.fillStyle = mix("#9CC3DD", "#2B3A55", n * 0.5); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.65)"; ctx.fillRect(x - p.w * s * 0.4, y - 1, p.w * s * 0.3, Math.max(1, s * 0.012));
    });
    drawLane(S, lanes.t, "all");
    [leaving, m].forEach(function (mm) { if (mm && mm.r > 1.05) drawRig(S, mm); });
    parts.draw(ctx, S, function (p) { return p.r > 1.05; });
    drawLane(S, lanes.w, "far");
    [leaving, m].forEach(function (mm) { if (mm && mm.r <= 1.05) drawRig(S, mm); });
    S.field(ctx, "near", P);
    drawLane(S, lanes.w, "near");
    parts.draw(ctx, S, function (p) { return p.r <= 1.05; });
    S.verge(ctx, {});
    if (fm.on) drawFieldFarmer(S);
    if (sur && sur.kind === "mole" && sur.t > 2.4) {
      // the molehill out in the field too
      var mx = S.wx(S.W * 0.6, 1.12), x = S.X(mx, 1.12), y = S.Y(1.12), s = S.S(1.12), hl = ease(clamp((sur.t - 2.4) / 0.6, 0, 1)) * clamp((6 - sur.t) / 0.6, 0, 1);
      ctx.beginPath(); ctx.ellipse(x, y, s * 0.3 * hl, s * 0.18 * hl, 0, Math.PI, 0); fs(ctx, "#5E3B22", Math.max(1, S.lw * 0.6));
    }
  }
  function drawFieldFarmer(S) {
    var sp = spadePose(), a = fm.state === "leave" ? clamp(1 - phaseT / 1.0, 0, 1) : 1;
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a;
    S.put(ctx, fm.x, 0.985, 1, function () {
      var walking = fm.state === "walk";
      if (sp.out) R(ctx, 0.47, -0.02, 0.42, 0.06, 0.02, "#2E1C10", 0);
      var hands = walking ? null : [sp.grip, [lerp(sp.grip[0], sp.top[0], 0.45), lerp(sp.grip[1], sp.top[1], 0.45)]];
      var foot = phase === "dig" && sp.t < 0.85 ? [sp.top[0] - 0.08, sp.top[1] + 0.02] : null;
      farmer({ walk: fm.walk, stride: walking ? 1 : 0, hands: hands, foot: foot });
      if (!walking) { if (sp.out) drawSlice(sp, 1); spade(sp.grip, sp.top, sp.tip); }
    });
    ctx.restore();
  }
  function faceAmt() { return faceT > 0 ? Math.min(1, faceT, 6 - faceT) : 0; }

  // ---------- Loop ----------
  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
    if (!(window.Toybox && Toybox.timer.phase() === "resting")) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  function onEnding(done) { ending = true; auto = false; grab = null; if (m) m.v = 0; setTimeout(function () { snd.engine(-1); snd.soil(0); done(); }, 2600); }
  function onWake() { ending = false; dusk = 0; }

  // ---------- Start ----------
  resize();
  bringIn("wheels");
  m.x = RIGS.wheels.x0 - 5;
  zoomF.span = zoomF.target; scF.layout(RG.f.w, RG.f.h);
  scF.follow(camTarget(), 0, true); snapClose();
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  else window.addEventListener("resize", resize);

  Toybox.init({
    app: "farm",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the machines stop and park, and the controls lock. The timer carries on across the farm pages.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "Soft engine and squelchy soil sounds. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: onWake,
    onWake: onWake,
    onSound: function (on) { if (on) snd.chime(); }
  });
  requestAnimationFrame(loop);

  if (/[?&]debug\b/.test(location.search)) window.__farm = {
    state: function () { return { phase: phase, job: job, step: steps.current(), finished: steps.finished(), x: m ? m.x : null, kind: m ? m.kind : null, leaving: leaving ? leaving.kind : null, count: count, coach: coach.text(), cmode: cmode, sur: sur ? sur.kind : null, farmer: fm.state }; },
    screen: function () {
      var b = cv.getBoundingClientRect(), p;
      if (job === "look") p = fScreen(0.45, -0.9); else p = rigPart();
      return { x: b.left + p.x, y: b.top + p.y };
    },
    surprise: surprise,
    ghost: function () { return ghost.show(); }
  };
})();
</script>
