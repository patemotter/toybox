}

<script>
(function () {
  "use strict";
  // Come Bye (and Hello Ewe): the sheepdog and the sheep, the way the episodes show it.
  // Gather:    a flock grazes spread over the hillside. The shepherd whistles "Come bye" and the sheepdog runs
  //            clockwise round the flock (seen from above), up the left side, along the back, down the right;
  //            the sheep bunch up. "Away" sends it anticlockwise, back round to the left, and the sheep walk
  //            toward the pen. "Pen them": the dog walks up behind them in its low crouch, the sheep file in
  //            through the gate one by one, the gate swings shut and the dog lies down ("Lie down").
  // Foot bath: the gate of the holding pen opens into the race; the sheep trot one by one down the race and
  //            through the shallow foot bath (splashes) into the drying pen; the field gate opens and they run
  //            out onto the green grass.
  // The ground is a plane: x along the screen (metres), z away from us up the hill (metres), seen from a little
  // above (own projection below; Farm.Scene draws only the sky). On an upright stage the stage is split: the whole
  // job on top and a close-up below (the dog running, the gate, the feet splashing).
  // Drawings live here for now in farm.js's style and function shapes (metres, y up negative, origin on the
  // ground under the middle, facing +x) so they can move into farm.js later: sheepShape, collie, shepherd,
  // hurdle, trough.
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.u, clamp = U.clamp, lerp = U.lerp, ease = U.ease, hash = U.hash, mix = U.mix, INK = U.INK;
  var D = Farm.draw, SH = Farm.shape, snd = Farm.sound, TAU = Math.PI * 2, PI = Math.PI;
  var Pp = SH.P, Rr = SH.R, Cc = SH.C, Ln = SH.Ln, fs = SH.fs;
  var NAME = (Farm.NAMES && Farm.NAMES.sheep) || "Come Bye";
  document.title = NAME; $("title").textContent = NAME;
  function LW() { return Farm.LW; }
  var WOOL = "#F6F0E2", WOOLD = "#DED3BC", FACE = "#2A2C36", DOGK = "#23252F", STEEL = "#AEB8C4", WATER = "#5FB7C9";

  // ---------- State ----------
  var KEY = "farm-sheep-v1";
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  if (startFresh || typeof saved !== "object" || Array.isArray(saved)) saved = {};
  function num(v) { return typeof v === "number" && isFinite(v) && v >= 0 ? Math.floor(v) : 0; }
  var sheepN = num(saved.sheep);
  var job = saved.job === "bath" ? "bath" : "gather";
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ sheep: sheepN, job: job })); } catch (e) { /* ignore */ } }

  // ---------- The world (metres: x along, z up the hill) ----------
  var NSHEEP = 8, NBATH = 7;
  // Gather: the shepherd at the front left, the pen on the right with its gate on the left side.
  var SHEP = { x: -8.3, z: -0.9 }, DOGHOME = { x: -7.3, z: -0.5 };
  var PEN = { x0: 3.8, x1: 7.0, z0: 0.6, z1: 5.0, gz: 2.2 }, GATE_L = PEN.z1 - PEN.gz, MOUTH_Z = 3.6;
  var PEN_SPOTS = [[4.7, 4.4], [6.1, 4.4], [4.7, 3.4], [6.1, 3.4], [4.7, 2.3], [6.1, 2.3], [4.7, 1.2], [6.1, 1.2]];
  var C1 = { x: -2.0, z: 3.6 }, C2 = { x: 0.7, z: 3.6 };
  var BUNCH = [[-1.4, -0.9], [0, -1.0], [1.4, -0.8], [-1.6, 0.3], [-0.15, 0.2], [1.3, 0.4], [-0.8, 1.3], [0.7, 1.4]];
  // Foot bath: the holding pen on the left, the race with the foot bath, the drying pen, the field gate.
  var HP = { x0: -9.0, x1: -5.0, z0: -0.55, z1: 3.8 }, RACE = { x0: -5.0, x1: 2.2, z: 0, w: 0.55 };
  var TRO = { x0: -1.6, x1: 1.4 }, DP = { x0: 2.2, x1: 6.0, z0: -0.55, z1: 3.4 };
  var HP_SPOTS = [[-5.9, 0.0], [-7.0, 0.1], [-8.1, 0.2], [-6.0, 1.3], [-7.2, 1.4], [-8.2, 1.6], [-6.6, 2.6]];
  var DP_SPOTS = [[5.3, 0.1], [5.2, 1.2], [5.2, 2.4], [4.0, 0.0], [4.0, 1.2], [4.0, 2.4], [2.9, 1.8]];
  var BATHDOG = { x: -10.0, z: 1.6 };

  // ---------- Small drawing helpers (farm.js style) ----------
  // =====================================================================================================
  // The sheep (could move into farm.js as Farm.draw.sheep): origin on the ground under the middle, facing +x.
  // st = { ph (leg phase), gait (0..1 legs swinging), head (0..1 down to graze), baa (0..1 mouth), munch,
  //        lamb (whiter wool), dip (feet in water: legs end lower) }
  // =====================================================================================================
  function sheepShape(c, st) {
    var l0 = LW(), g = st.gait || 0, s = Math.sin((st.ph || 0) * TAU), hd = clamp(st.head || 0, 0, 1), dip = st.dip || 0;
    var wool = st.lamb ? "#FFFDF6" : WOOL;
    function leg(x, a, far) {
      var fx = x + a * 0.22;
      Ln(c, x, -0.44, fx, dip, INK, 0.12 + (far ? 0 : 0.01));
      Ln(c, x, -0.44, fx, dip, far ? "#3A3D48" : FACE, 0.075);
    }
    leg(0.3, -s * g, true); leg(-0.3, s * g, true);
    // the wool: a cloud of bumps round a body ellipse, outlined in ink
    var bumps = [], n = 12, i;
    for (i = 0; i < n; i++) { var a = i / n * TAU; bumps.push([Math.cos(a) * 0.48, -0.64 + Math.sin(a) * 0.22, 0.15 + 0.03 * hash(i, 3)]); }
    bumps.push([-0.6, -0.68, 0.085]);
    var nkY = lerp(-0.76, -0.58, hd);
    bumps.push([0.5, nkY, 0.17]);
    for (i = 0; i < bumps.length; i++) Cc(c, bumps[i][0], bumps[i][1], bumps[i][2] + l0, INK, 0);
    c.beginPath(); c.ellipse(0, -0.64, 0.48 + l0, 0.22 + l0, 0, 0, TAU); c.fillStyle = INK; c.fill();
    c.beginPath(); c.ellipse(0, -0.64, 0.48, 0.22, 0, 0, TAU); c.fillStyle = wool; c.fill();
    for (i = 0; i < bumps.length; i++) Cc(c, bumps[i][0], bumps[i][1], bumps[i][2], wool, 0);
    // curls in the fleece
    c.strokeStyle = WOOLD; c.lineWidth = 0.025; c.lineCap = "round";
    for (i = 0; i < 7; i++) { var cx = -0.4 + i * 0.13, cy = -0.6 + (i % 2 ? -0.1 : 0.05); c.beginPath(); c.arc(cx, cy, 0.045, 0.3, 2.6); c.stroke(); }
    leg(0.22, s * g, false); leg(-0.36, -s * g, false);
    // the head: black face, ears out to the side, a woolly topknot
    var hx = lerp(0.68, 0.74, hd), hy = lerp(-0.88, -0.3, hd), rot = lerp(0.35, 1.15, hd);
    if (st.munch) hy += Math.sin(st.munch * 18) * 0.015;
    c.save(); c.translate(hx, hy); c.rotate(rot);
    c.beginPath(); c.ellipse(-0.12, -0.02, 0.1, 0.045, -0.5, 0, TAU); fs(c, FACE, l0 * 0.7);
    c.beginPath(); c.ellipse(0.02, 0, 0.17, 0.11, 0, 0, TAU); fs(c, FACE);
    Cc(c, -0.07, -0.08, 0.075, wool, l0 * 0.6);
    if (st.baa) { c.beginPath(); c.ellipse(0.15, 0.05, 0.035, 0.02 + 0.035 * st.baa, 0.3, 0, TAU); fs(c, "#E87A8A", l0 * 0.5); }
    else { Cc(c, 0.02, -0.04, 0.028, "#FFFFFF", 0); Cc(c, 0.03, -0.04, 0.014, INK, 0); }
    c.restore();
  }
  // =====================================================================================================
  // The sheepdog (a generic black-and-white collie; could move into farm.js as Farm.draw.collie).
  // st = { pose: "run" | "crouch" | "lie" | "stand", ph }
  // =====================================================================================================
  function collie(c, st) {
    var l0 = LW(), pose = st.pose || "stand", ph = st.ph || 0, s = Math.sin(ph * TAU), Wt = "#FFFFFF";
    var by = { run: 0.36, crouch: 0.25, lie: 0.13, stand: 0.4 }[pose], bob = pose === "run" ? Math.cos(ph * TAU * 2) * 0.025 : 0;
    by += bob;
    function leg(x0, y0, x1, y1, kx, ky) {
      c.beginPath(); c.moveTo(x0, y0); if (kx !== undefined) c.lineTo(kx, ky); c.lineTo(x1, y1);
      c.lineCap = "round"; c.lineJoin = "round"; c.strokeStyle = INK; c.lineWidth = 0.1; c.stroke(); c.strokeStyle = Wt; c.lineWidth = 0.055; c.stroke();
    }
    function legs(far) {
      var k = far ? 1 : -1;
      if (pose === "run") {
        leg(0.26, -by + 0.05, 0.26 + 0.3 * s * k + 0.05, 0, 0.3 + 0.1 * s * k, -by * 0.45);
        leg(-0.27, -by + 0.05, -0.27 - 0.3 * s * k - 0.05, 0, -0.32 - 0.1 * s * k, -by * 0.4);
      } else if (pose === "crouch") {
        leg(0.25, -by + 0.04, 0.27 + 0.12 * s * k, 0, 0.33, -0.11);
        leg(-0.26, -by + 0.04, -0.24 - 0.12 * s * k, 0, -0.36, -0.12);
      } else if (pose === "lie") {
        leg(0.25, -0.08, 0.62 + (far ? -0.04 : 0), -0.03);
        if (!far) { c.beginPath(); c.ellipse(-0.22, -0.11, 0.17, 0.1, 0, 0, TAU); fs(c, DOGK, l0 * 0.8); leg(-0.22, -0.06, -0.02, -0.02); }
      } else { leg(0.25, -by + 0.05, 0.25, 0); leg(-0.26, -by + 0.05, -0.26, 0); }
    }
    legs(true);
    // tail
    var tx0 = -0.38, ty0 = -by - 0.02, tx1, ty1;
    if (pose === "run") { tx1 = -0.78; ty1 = -by + 0.02 + Math.sin(ph * TAU * 2) * 0.04; }
    else if (pose === "lie") { tx1 = -0.75; ty1 = -0.03; }
    else { tx1 = -0.62; ty1 = -0.07; }
    c.beginPath(); c.moveTo(tx0, ty0); c.quadraticCurveTo((tx0 + tx1) / 2, ty0 - 0.08, tx1, ty1);
    c.lineCap = "round"; c.strokeStyle = INK; c.lineWidth = 0.13; c.stroke(); c.strokeStyle = DOGK; c.lineWidth = 0.08; c.stroke();
    Cc(c, tx1, ty1, 0.05, Wt, l0 * 0.6);
    // body, the white chest and collar
    c.beginPath(); c.ellipse(0, -by, 0.4, pose === "lie" ? 0.12 : 0.13, 0, 0, TAU); fs(c, DOGK);
    c.beginPath(); c.ellipse(0.27, -by + 0.04, 0.1, 0.08, 0, 0, TAU); fs(c, Wt, 0);
    // the head: low and in line with the back when running or creeping (the collie's "eye"), up when lying
    var hx = { run: 0.52, crouch: 0.5, lie: 0.44, stand: 0.44 }[pose], hy = { run: -by - 0.08, crouch: -by - 0.03, lie: -0.4, stand: -by - 0.18 }[pose];
    c.beginPath(); c.ellipse(0.36, (hy - by) / 2 - 0.01, 0.08, Math.abs(hy + by) / 2 + 0.07, 0.2, 0, TAU); fs(c, Wt, l0 * 0.7);
    Pp(c, [hx - 0.07, hy - 0.08, hx - 0.11, hy - 0.22, hx + 0.0, hy - 0.11], DOGK, l0 * 0.7);
    Cc(c, hx, hy, 0.11, DOGK);
    Pp(c, [hx + 0.05, hy - 0.05, hx + 0.24, hy + 0.02, hx + 0.21, hy + 0.07, hx + 0.04, hy + 0.08], DOGK, l0 * 0.7);
    Pp(c, [hx + 0.02, hy - 0.1, hx + 0.06, hy - 0.1, hx + 0.22, hy + 0.03, hx + 0.06, hy + 0.06], Wt, 0);
    Cc(c, hx + 0.235, hy + 0.035, 0.025, INK, 0);
    Pp(c, [hx - 0.02, hy - 0.08, hx + 0.02, hy - 0.2, hx + 0.08, hy - 0.08], DOGK, l0 * 0.7);
    Cc(c, hx + 0.04, hy - 0.025, 0.022, "#E9C46A", 0);
    if (pose === "run" || pose === "stand") { c.beginPath(); c.ellipse(hx + 0.18, hy + 0.09, 0.04, 0.02, 0.2, 0, TAU); fs(c, "#E87A8A", 0); }
    legs(false);
  }
  // The shepherd (generic: cap, wax jacket, crook). origin at the feet, facing +x. call = 0..1 (hand to mouth, whistling)
  function shepherd(c, st) {
    var l0 = LW(), cl = clamp(st.call || 0, 0, 1);
    Ln(c, -0.08, -0.9, -0.1, 0, INK, 0.15); Ln(c, -0.08, -0.9, -0.1, 0, "#5B4A3A", 0.11);
    Ln(c, 0.08, -0.9, 0.12, 0, INK, 0.15); Ln(c, 0.08, -0.9, 0.12, 0, "#6A5644", 0.11);
    Rr(c, -0.2, -0.06, 0.18, 0.08, 0.03, "#3A2D22", l0 * 0.6); Rr(c, 0.05, -0.06, 0.2, 0.08, 0.03, "#3A2D22", l0 * 0.6);
    // the crook in the front hand
    Ln(c, 0.42, -1.05, 0.48, 0, "#7A5236", 0.05);
    c.beginPath(); c.moveTo(0.42, -1.05); c.lineTo(0.4, -1.42); c.arc(0.48, -1.42, 0.08, PI, 0.1); c.strokeStyle = "#7A5236"; c.lineWidth = 0.05; c.stroke();
    Pp(c, [-0.24, -0.86, -0.2, -1.5, 0.22, -1.5, 0.26, -0.86], "#4E6B3A");
    Ln(c, 0.0, -1.48, 0.0, -0.9, "#3C5530", 0.03);
    // arms: the back one to the mouth when he whistles, the front one on the crook
    Ln(c, 0.15, -1.42, 0.42, -1.05, INK, 0.13); Ln(c, 0.15, -1.42, 0.42, -1.05, "#4E6B3A", 0.09);
    var hx = lerp(-0.12, 0.17, cl), hy = lerp(-0.95, -1.62, cl);
    Ln(c, -0.12, -1.42, hx, hy, INK, 0.13); Ln(c, -0.12, -1.42, hx, hy, "#4E6B3A", 0.09);
    Cc(c, 0.03, -1.66, 0.14, "#F2C8A0", l0 * 0.8);
    Pp(c, [-0.14, -1.72, -0.12, -1.84, 0.14, -1.84, 0.26, -1.74], "#7C6A55", l0 * 0.7);
    Cc(c, hx, hy, 0.05, "#F2C8A0", l0 * 0.6);
    Cc(c, 0.09, -1.68, 0.018, INK, 0);
  }

  // =====================================================================================================
  // Views: the sky from Farm.Scene, the ground plane from our own projection
  // =====================================================================================================
  var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
  var W = 300, H = 300, DPR = 1, split = false;
  var F = 14, HTOP = 1.5;
  function fz(z) { return F / (F + Math.max(-F * 0.7, z)); }
  function mkView() { return { sc: new Farm.Scene({ L: 20, fit: function () { return 20; } }), R: { x: 0, y: 0, w: 300, h: 300 }, k: 20, gY: 200, cam: 0, lw: 2, box: null, tgt: null, T: 0.5 }; }
  var VW = mkView(), VC = mkView();
  VW.T = 0.85; VC.T = 0.6;
  function px(V, x, z) { return V.R.w / 2 + (x - V.cam) * V.k * fz(z); }
  function py(V, z, h) { return V.gY - V.k * fz(z) * (z * V.T + (h || 0)); }
  function ps(V, z) { return V.k * fz(z); }
  function fitView(V) {
    var b = V.box, w = V.R.w, h = V.R.h, fa = fz(b.za), T = V.T;
    var vext = (b.zb * T + HTOP) * fz(b.zb) - b.za * T * fa;
    var bot = V.bot || 0.93, top = 0.07, av = h * (bot - top);
    V.k = Math.min(w * 0.94 / ((b.xb - b.xa) * fa), av / vext);
    var slack = av - V.k * vext;
    V.gY = h * bot - slack * 0.5 + V.k * fa * b.za * T;
    V.cam = (b.xa + b.xb) / 2;

  // =====================================================================================================
  // Drawing
  // =====================================================================================================
  function draw() {

    ctx.clearRect(0, 0, W, H);
    views().forEach(function (V) { ctx.save(); ctx.translate(V.R.x, V.R.y); ctx.beginPath(); ctx.rect(0, 0, V.R.w, V.R.h); ctx.clip(); drawWorld(V); ctx.restore(); });

  function put(V, x, z, h, dir, fn, mul) {

  function xRangeAt(V, z) { var s = V.k * fz(z); return [V.cam - V.R.w / 2 / s - 1, V.cam + V.R.w / 2 / s + 1]; }

  }
  // A galvanised hurdle between two ground points (x, z), drawn as screen lines

  // fence panels cut into pieces along their depth so the sheep sort in front of and behind them
  function fenceItems(items, V, x1, z1, x2, z2, o) {
    var dz = Math.abs(z2 - z1), n = Math.max(1, Math.ceil(dz / 0.7));

      fenceItems(items, V, HP.x0, HP.z1, HP.x0, HP.z0);
      fenceItems(items, V, HP.x1, HP.z1, HP.x1, RACE.w);
      fenceItems(items, V, HP.x0, -RACE.w, HP.x1, -RACE.w);
      fenceItems(items, V, HP.x1, -RACE.w, DP.x0, -RACE.w, { open: true });
      fenceItems(items, V, DP.x0, -RACE.w, DP.x1, -RACE.w);
      fenceItems(items, V, HP.x1, RACE.w, DP.x0, RACE.w);
      fenceItems(items, V, DP.x0, RACE.w, DP.x0, DP.z1);
      fenceItems(items, V, DP.x0, DP.z1, DP.x1, DP.z1);
      gateItems(items, V, HP.x1, RACE.w, RACE.w * 2, -PI / 2, 0, gate);

      items.push({ k: s.z, fn: function () {
        put(V, s.x, s.z, s.hop, s.dir, function () { sheepShape(ctx, { ph: s.ph, gait: clamp(Math.hypot(s.vx, s.vz) / 1.2, 0, 1), head: s.head, baa: s.baa > 0 ? Math.min(1, s.baa * 2) * Math.abs(Math.sin(time * 9)) : 0, munch: s.munch, dip: s.dip }); });
      } });
    });
    if (lamb) items.push({ k: lamb.z, fn: function () { ctx.save(); ctx.globalAlpha = lamb.alpha; put(V, lamb.x, lamb.z, lamb.h, lamb.dir, function () { sheepShape(ctx, { lamb: true, ph: time, gait: lamb.h > 0.05 ? 0 : 0.6 }); }, 0.6); ctx.restore(); } });
    items.push({ k: dog.z, fn: function () { put(V, dog.x, dog.z, 0, dog.dir, function () { collie(ctx, { pose: dog.pose, ph: dog.ph }); }); } });
    items.sort(function (a, b) { return b.k - a.k; });
    items.forEach(function (it) { it.fn(); });
    drawParts(V);
    bubbles.forEach(function (b) { drawBubble(V, b); });

  // the dog's route round the flock as a dotted arrow on the ground (shows which way it goes)
  function drawRoute(V, alpha) {
    var r, a0, a1, e;

    ctx.beginPath(); ctx.moveTo(A[0] + dx * s2, A[1] + dy * s2); ctx.lineTo(A[0] - dy * s2, A[1] + dx * s2); ctx.lineTo(A[0] + dy * s2, A[1] - dx * s2); ctx.closePath();

  }
  function troughQuad(V, z0, z1, h) {
    ctx.beginPath(); ctx.moveTo(px(V, TRO.x0, z0), py(V, z0, h)); ctx.lineTo(px(V, TRO.x1, z0), py(V, z0, h)); ctx.lineTo(px(V, TRO.x1, z1), py(V, z1, h)); ctx.lineTo(px(V, TRO.x0, z1), py(V, z1, h)); ctx.closePath();
  }
  function troughBack(V) {

    var tw = ctx.measureText(b.text).width, bw = tw + fsz * 1.0, bh = fsz * 1.5;
