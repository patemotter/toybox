<script>
(function () {
  "use strict";
  // Mucky Muck: feeding the grass with what the cows leave behind, the way the episode shows it. He does every step
  // himself, on the scene, like Timberrrrr! (no step row, no Go). Each tap on a machine part plays that one
  // control's motion; the vehicles also drive by drag (let go and they carry on to their stop).
  // Spreader:      the yard scraper (the tractor with a rubber-edged blade on the front) comes in by itself; he
  //                drives it down the barn passage (a tap or a drag) and it pushes the muck onto the muck heap. The
  //                telehandler's muck fork: a tap grabs a forkful from the heap, the next tap turns round and drops
  //                it in the rear-discharge muck spreader (two forkfuls). He drives the tractor to the field (a tap
  //                or a drag), then taps the beaters: the two upright beaters fling the muck out as it crosses.
  // Slurry tanker: a tap on the suction arm dips it into the slurry lagoon, a tap on the vacuum pump fills the
  //                tank (it sits down on its tyres and burps when it is full; the arm folds by itself); then the
  //                tractor to the field and a tap on the splash plate sprays it over the grass.
  // Either way the field goes dark where it was fed, then weeks go by and the grass grows thick and green; a tap
  // on the field starts again. The coach line and a yellow ring on the scene point at the next thing to touch; a
  // tap on any other part shows its name. One world along the machine line: the field (x 0..L) on the left, then
  // the farmyard: the spreader (or the tanker) parked by the muck heap (or the lagoon), the telehandler, and the
  // cow barn with its passage. One view; the camera follows the work.
  // Machine drawings live here for now in farm.js's style and function shapes (metres, y up negative, origin
  // at the drawbar eye with the ground at y = +0.5, facing +x) so they can move into farm.js later:
  // scraper (tractor units), spreader / tanker (drawbar eye), teleBody / teleBoom (between the axles), cow.
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.u, clamp = U.clamp, lerp = U.lerp, ease = U.ease, hash = U.hash, mix = U.mix, INK = U.INK;
  var D = Farm.draw, SH = Farm.shape, snd = Farm.sound, TAU = Math.PI * 2;
  var Pp = SH.P, Rr = SH.R, Cc = SH.C, Ln = SH.Ln, tube = SH.tube, fs = SH.fs;
  var NAME = (Farm.NAMES && Farm.NAMES.muck) || "Mucky Muck";
  document.title = NAME; $("title").textContent = NAME;
  var G = { body: "#3E9F3A", dark: "#2B7A2A", frame: "#2B3040", glass: "#BFE7FA", steel: "#C3CCD6", grey: "#7C8696" };
  var MUCK = ["#6B4A2B", "#52371F", "#C9A45A", "#7E5A34"], SLURRY = ["#6B5233", "#4F3B24", "#8C7446"];

  // ---------- State ----------
  var KEY = "farm-muck-v1";
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  if (startFresh || typeof saved !== "object" || Array.isArray(saved)) saved = {};
  var loads = typeof saved.loads === "number" && isFinite(saved.loads) && saved.loads >= 0 ? Math.floor(saved.loads) : 0;
  var job = saved.job === "slurry" ? "slurry" : "muck";
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ loads: loads, job: job })); } catch (e) { /* ignore */ } }

  // ---------- The world (metres along the machine line) ----------
  var L = 20, EYE = 27.5, TX = 37.2, HX0 = 39.8, HW = 4.0, HX1 = HX0 + HW, BX0 = 46.6, BX1 = 60.6, XMAX = BX1 + 9;
  var LG0 = 31, LG1 = 45;                       // the slurry lagoon (behind the machine line)
  var SCR_END = HX1 + 4.7, SCR_START = BX1 + 4.3; // the scraper's rear axle: start and where the blade meets the heap
  var V_SPREAD = 4.2, V_SCRAPE = 3.3;
  var REAR = { muck: 7.0, slurry: 7.95 };       // drawbar eye -> beaters / splash plate (behind the tractor)

  // ---------- Small drawing helpers (farm.js style) ----------
  function wheel(ctx, cx, cy, r, rot, o) {
    o = o || {};
    var n = o.lugs || Math.round(r * 22), i, a, l0 = Farm.LW;
    ctx.save(); ctx.translate(cx, cy);
    for (i = 0; i < n; i++) {
      a = rot + i * TAU / n;
      var c = Math.cos(a), s = Math.sin(a), c2 = Math.cos(a + 0.12), s2 = Math.sin(a + 0.12);
      Pp(ctx, [c * r * 0.93, s * r * 0.93, c * r * 1.06, s * r * 1.06, c2 * r * 1.06, s2 * r * 1.06, c2 * r * 0.93, s2 * r * 0.93], "#2A2C36", l0 * 0.7);
    }
    Cc(ctx, 0, 0, r * 0.97, "#33363F", l0);
    if (o.squash) { ctx.beginPath(); ctx.ellipse(0, r * 0.88, r * (0.55 + o.squash * 2.5), r * 0.16, 0, 0, TAU); fs(ctx, "#33363F", l0 * 0.8); }
    Cc(ctx, 0, 0, r * 0.8, "#40434E", 0);
    var rimR = r * (o.rim || 0.6);
    Cc(ctx, 0, 0, rimR, o.rimCol || "#C3CCD6", l0);
    Cc(ctx, 0, 0, rimR * 0.78, "#A9B4C1", l0 * 0.6);
    Cc(ctx, 0, 0, rimR * 0.36, "#8C97A6", l0 * 0.7);
    for (i = 0; i < 6; i++) { a = rot + i * TAU / 6; Cc(ctx, Math.cos(a) * rimR * 0.55, Math.sin(a) * rimR * 0.55, rimR * 0.07, "#6E7887", 0); }
    ctx.restore();
  }
  function driverHead(ctx, x, y) {
    var l0 = Farm.LW;
    Rr(ctx, x - 0.26, y + 0.1, 0.52, 0.5, 0.16, "#3D6FB6", l0 * 0.7);
    Cc(ctx, x, y, 0.17, "#F2C8A0", l0 * 0.7);
    Pp(ctx, [x - 0.18, y - 0.04, x - 0.16, y - 0.2, x + 0.16, y - 0.2, x + 0.3, y - 0.06], "#E8473B", l0 * 0.6);
  }
  // a lumpy mound of muck along y0 from xa to xb, height hh (straw flecks on it)
  function muckMound(ctx, xa, xb, y0, hh, seed, col) {
    if (hh <= 0.01 || xb - xa < 0.05) return;
    var n = Math.max(6, Math.round((xb - xa) * 4)), i;
    ctx.beginPath(); ctx.moveTo(xa, y0);
    for (i = 0; i <= n; i++) {
      var f = i / n, x = lerp(xa, xb, f);
      ctx.lineTo(x, y0 - hh * Math.pow(Math.sin(f * Math.PI), 0.55) - (i % 2 ? 0.05 : 0) * Math.min(1, hh * 3) * hash(i, seed));
    }
    ctx.closePath(); fs(ctx, col || MUCK[0], Farm.LW * 0.8);
    ctx.save(); ctx.clip();
    for (i = 0; i < Math.round((xb - xa) * 5); i++) {
      var sx = lerp(xa, xb, hash(i, seed + 1)), sy = y0 - hh * hash(i, seed + 2) * 0.9;
      Ln(ctx, sx, sy, sx + 0.16 * (hash(i, seed + 3) - 0.3), sy - 0.05, i % 3 ? MUCK[2] : MUCK[1], 0.045);
    }
    ctx.restore();
  }

  // =====================================================================================================
  // The machines (could move into farm.js as Farm.draw.scraper / spreader / tanker / telehandler / cow)
  // =====================================================================================================
  // The yard scraper: a steel blade with a rubber edge on the tractor's front linkage. Tractor units.
  function scraper(ctx, st) {
    var l0 = Farm.LW, up = (st.lift || 0) * 0.3;
    tube(ctx, 3.95, -1.25, 4.4, -0.95 - up, 0.12, G.grey);
    tube(ctx, 3.95, -0.8, 4.4, -0.45 - up, 0.12, G.grey);
    Rr(ctx, 4.35, -1.25 - up, 0.28, 1.15, 0.05, "#F2C230");
    Farm.shine(ctx, 4.43, -1.15 - up, 4.43, -0.3 - up, 0.05);
    Rr(ctx, 4.38, -0.14 - up, 0.24, 0.16, 0.03, "#2A2C36", l0 * 0.7);
  }
  // Rear-discharge muck spreader with two upright beaters. Origin at the drawbar eye, ground at y = +0.5.
  // st = { wheel, load (0..1), beat (angle), door (0..1 open), time }
  function spreader(ctx, st) {
    var l0 = Farm.LW, Rd = "#D8403A", RD = "#A82E28", load = clamp(st.load || 0, 0, 1), i;
    Pp(ctx, [0.1, 0.05, -1.85, -0.72, -1.85, -0.48, 0.1, 0.14], G.grey);
    Rr(ctx, -6.75, -0.98, 5.1, 0.24, 0.04, "#3A3F4E");
    wheel(ctx, -3.6, -0.12, 0.62, (st.wheel || 0) / 0.62, { rim: 0.55, rimCol: "#E2E6EB" });
    wheel(ctx, -4.95, -0.12, 0.62, (st.wheel || 0) / 0.62, { rim: 0.55, rimCol: "#E2E6EB" });
    if (load > 0.01) muckMound(ctx, -6.45, -1.85, -2.15, 0.15 + load * 0.75, 3);
    // the box, with ribs, and the mesh guard at the front
    Rr(ctx, -6.5, -2.22, 4.75, 1.3, 0.08, Rd);
    Rr(ctx, -6.58, -2.32, 4.9, 0.16, 0.06, RD, l0 * 0.8);
    for (i = 1; i < 6; i++) Ln(ctx, -6.5 + i * 0.79, -2.15, -6.5 + i * 0.79, -1.0, RD, 0.07);
    Farm.shine(ctx, -6.35, -2.05, -1.95, -2.05, 0.07);
    Rr(ctx, -1.9, -2.95, 0.14, 0.75, 0.03, "#5D6675", l0 * 0.7);
    for (i = 0; i < 3; i++) Ln(ctx, -1.85, -2.85 + i * 0.22, -1.7, -2.85 + i * 0.22, "#5D6675", 0.035);
    // the beaters at the back: two upright rotors with spiral tines (one behind the other)
    var b = st.beat || 0;
    [-6.92, -7.12].forEach(function (sx, k) {
      Ln(ctx, sx, -0.85, sx, -2.55, INK, 0.16); Ln(ctx, sx, -0.85, sx, -2.55, k ? "#5D6675" : "#8C97A6", 0.1);
      for (var j = 0; j < 8; j++) {
        var y = -0.95 - j * 0.2, c = Math.cos(b * (k ? -1 : 1) + j * 0.85);
        Ln(ctx, sx, y, sx + c * 0.34, y - 0.05, INK, 0.09); Ln(ctx, sx, y, sx + c * 0.34, y - 0.05, "#C3CCD6", 0.05);
      }
    });
    // the beater frame: a hood on top and the spreading floor below
    Pp(ctx, [-6.5, -2.42, -7.5, -2.42, -7.6, -2.62, -6.5, -2.62], "#5D6675", l0 * 0.8);
    Pp(ctx, [-6.5, -0.86, -7.5, -0.86, -7.55, -0.74, -6.5, -0.74], "#5D6675", l0 * 0.8);
    // the hydraulic door between the box and the beaters slides up to let the muck out
    var dy = clamp(st.door || 0, 0, 1) * 1.15;
    Rr(ctx, -6.62, -2.2 - dy, 0.16, 1.25, 0.03, RD, l0 * 0.8);
  }
  // Vacuum slurry tanker: a galvanised tank on two axles, the vacuum pump at the front, the suction arm's
  // turret at the back top (the page draws the arm) and the splash plate under the rear outlet.
  // Origin at the drawbar eye, ground at y = +0.5. st = { wheel, load (0..1), time, spray (0..1) }
  var TK = { arm: [-6.75, -2.95] };
  function tanker(ctx, st) {
    var l0 = Farm.LW, load = clamp(st.load || 0, 0, 1), sq = load * 0.12, i, Tc = "#B9C3CD", Td = "#8E9AA8";
    Pp(ctx, [0.1, 0.05, -1.75, -0.78, -1.75, -0.52, 0.1, 0.14], G.grey);
    Rr(ctx, -7.6, -1.0, 6.2, 0.22, 0.04, "#3A3F4E");
    wheel(ctx, -4.0, -0.14, 0.66, (st.wheel || 0) / 0.66, { rim: 0.55, rimCol: "#E2E6EB", squash: sq });
    wheel(ctx, -5.4, -0.14, 0.66, (st.wheel || 0) / 0.66, { rim: 0.55, rimCol: "#E2E6EB", squash: sq });
    ctx.save(); ctx.translate(0, sq);
    // the rear outlet and the splash plate
    tube(ctx, -7.3, -1.25, -7.8, -0.95, 0.2, Td);
    Pp(ctx, [-7.7, -0.78, -8.25, -1.12, -8.3, -0.98, -7.78, -0.66], "#5D6675", l0 * 0.8);
    // the tank
    Rr(ctx, -7.55, -2.8, 6.15, 1.9, 0.92, Tc);
    for (i = 0; i < 3; i++) Rr(ctx, -2.95 - i * 1.6, -2.82, 0.18, 1.94, 0.06, Td, l0 * 0.7);
    Farm.shine(ctx, -6.9, -2.55, -2.1, -2.55, 0.1);
    Ln(ctx, -6.9, -1.12, -2.1, -1.12, "rgba(29,35,64,0.18)", 0.12);
    // the manlid dome on top, the vacuum pump at the front with its pulley and pipe
    ctx.beginPath(); ctx.arc(-4.2, -2.8, 0.32, Math.PI, 0); ctx.closePath(); fs(ctx, Td, l0 * 0.8);
    Rr(ctx, -2.35, -3.25, 0.85, 0.5, 0.08, "#3A3F4E", l0 * 0.8);
    Cc(ctx, -1.95, -3.0, 0.16, "#8C97A6", l0 * 0.6);
    tube(ctx, -2.35, -3.1, -2.75, -2.75, 0.09, "#5D6675");
    // the arm's turret at the back
    Rr(ctx, TK.arm[0] - 0.32, TK.arm[1] - 0.05, 0.64, 0.32, 0.06, "#5D6675", l0 * 0.8);
    Cc(ctx, TK.arm[0], TK.arm[1], 0.2, "#7C8696", l0 * 0.8);
    ctx.restore();
  }
  // The telehandler (origin on the ground between the axles, facing +x): body, and the boom with the muck fork.
  var TELE = { pivot: [-1.5, -2.05], len: 3.9 };
  function teleBody(ctx, st) { D.telehandler(ctx, st); }
  function teleEnd(a, ext) { var len = TELE.len + (ext || 0); return [TELE.pivot[0] + Math.cos(a) * len, TELE.pivot[1] + Math.sin(a) * len]; }
  // st = { a (boom angle, + down), ext (m), curl (fork angle, + tips down), load (0..1 muck on the fork), grip }
  function teleBoom(ctx, st) {
    var T = "#F2B33A", TD = "#C98A1A", l0 = Farm.LW, a = st.a || 0, c = Math.cos(a), s = Math.sin(a);
    var p = TELE.pivot, e = teleEnd(a, st.ext), m = [p[0] + c * 3.3, p[1] + s * 3.3];
    tube(ctx, 0.35, -1.35, p[0] + c * 1.9, p[1] + s * 1.9 + 0.18, 0.13, G.steel);
    tube(ctx, m[0] - c * 0.4, m[1] - s * 0.4, e[0], e[1], 0.26, TD);
    tube(ctx, p[0], p[1], m[0], m[1], 0.42, T);
    Farm.shine(ctx, p[0] + c * 0.3, p[1] + s * 0.3 - 0.1, m[0] - c * 0.2, m[1] - s * 0.2 - 0.1, 0.06);
    Cc(ctx, p[0], p[1], 0.16, "#7C8696", l0);
    ctx.save(); ctx.translate(e[0], e[1]); ctx.rotate(st.curl || 0);
    // the muck fork: a carriage, long tines, and the grab jaws that close on top
    Rr(ctx, -0.12, -0.42, 0.26, 0.92, 0.05, "#5D6675", l0 * 0.8);
    if (st.load > 0.02) muckMound(ctx, 0.2, 1.5, 0.4, 0.15 + st.load * 0.5, 7);
    tube(ctx, 0.08, 0.42, 1.55, 0.4, 0.08, "#C3CCD6");
    Ln(ctx, 1.5, 0.4, 1.62, 0.3, INK, 0.08);
    var j = 0.25 + (1 - clamp(st.grip || 0, 0, 1)) * 0.55;
    ctx.save(); ctx.translate(0.05, -0.38); ctx.rotate(-j + 0.25);
    tube(ctx, 0, 0, 1.3, 0.2, 0.09, "#5D6675");
    for (var i = 0; i < 3; i++) Ln(ctx, 0.5 + i * 0.35, 0.15, 0.55 + i * 0.35, 0.36, INK, 0.06);
    ctx.restore();
    Cc(ctx, 0, 0, 0.08, "#C3CCD6", l0 * 0.6);
    ctx.restore();
  }
  // A cow (black and white), origin at its feet in the middle, facing +x. ph = head bob phase.
  function cow(ctx, ph, time) { D.cow(ctx, { ph: ph, graze: true, time: time }); }

  // =====================================================================================================
  // Machine state
  // =====================================================================================================
  var heap = { V: 0.45, tgt: 0.45, steam: 0 };
  var floorMuck = { b: BX1, clean: BX1 };          // muck on the passage floor from HX1 to clean
  var scr = { x: SCR_START + 8, v: 0, wheel: 0, st: "away", t: 0, roll: 0, tip: 0, lift: 1 };
  var tele = { x: TX, d: 0, dir: 1, a: 0.25, ext: 0, curl: -0.1, load: 0, grip: 0, wheel: 0, st: "idle", t: 0, n: 0 };
  var rig = { x: EYE, v: 0, wheel: 0, st: "park", load: 0, beat: 0, door: 0, spray: 0, arm: 0, fillT: -1, pump: false, flow: 0, burp: 0 };
  var field = { stage: "hungry", from: "muck", g: 0, wipe: null };
  var lagoon = { level: 1, stir: 0 };
  var phase = "arrive", phaseT = 0, stepId = "scrape", auto = false, grab = null, ending = false, dusk = 0, time = 0;
  var gulls = null, dog = null, win = null, cowNod = -1, cowNodT = 0;

  function rear() { return rig.x + REAR[job]; }
  function firstStep() { return job === "slurry" ? "fill" : "scrape"; }
  function spreading() { return rig.st === "go"; }

  // =====================================================================================================
  // The stage: one view (the dad, 2026-10-15: a close-up that only repeats the main view bigger adds nothing)
  // =====================================================================================================
  var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
  var W = 300, H = 300, DPR = 1;
  var RF = { x: 0, y: 0, w: 300, h: 300 };
  var zF = { span: 16, mh: 5, target: 16, mht: 5 };
  function fitFor(z) { return function (w, h) { return Math.min(w * 0.92 / z.span, h * 0.6 / z.mh); }; }
  var scF = new Farm.Scene({ L: L, xmin: -15, xmax: XMAX, rowDz: 0.5, fit: fitFor(zF) });
  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(50, r.width); H = Math.max(50, r.height);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    RF = { x: 0, y: 0, w: W, h: H };
    scF.layout(RF.w, RF.h);
    follow(0, true);
  }
  function onScreen(sc, x, y) { var b = cv.getBoundingClientRect(); return { x: b.left + x, y: b.top + y }; }

  // ---------- Coach, name tags ----------
  var coach = Toybox.coach($("coach"));
  function tagW(sc, text, x, h) {
    var px = clamp(sc.X(x, 1), 70, W - 70), py = clamp(sc.gY - h * sc.k, 34, H - 20), p = onScreen(sc, px, py);
    Toybox.nametag(text, p.x, p.y, 2400);
  }

  // =====================================================================================================
  // The steps: what he does, in order
  // =====================================================================================================
  // No step row and no Go (the dad: every station like Timberrrrr!): he works each control on the scene himself.
  // Each thing he does has the coach's line (a literal instruction) and the part the yellow ring points at; a tap
  // on that part plays that one control's motion. Waiting (the scraper coming in, the suction arm folding, the
  // tractor going home) happens by itself, with an information line saying what happens.
  var SUB = {
    "scrape.push": { say: "Drive the tractor to push the muck onto the heap.", part: "scraper" },
    "load.grab": { say: "Tap the muck fork to grab the muck from the heap.", part: "fork" },
    "load.drop": { say: "Tap the muck fork to drop the muck in the spreader.", part: "fork" },
    "fill.arm": { say: "Tap the suction arm to dip it in the slurry.", part: "arm" },
    "fill.pump": { say: "Tap the vacuum pump to fill the tank with slurry.", part: "pump" },
    "spread.drive": { say: "Drive the tractor to the field.", part: "tractor" },
    "spread.beat": { say: "Tap the beaters to spread the muck on the field.", part: "beaters" },
    "spread.plate": { say: "Tap the splash plate to spread the slurry on the field.", part: "plate" }
  };
  // the parts that also do the step (forgiving: the whole machine that has the control)
  var ALSO = {
    "scrape.push": ["scraper"],
    "load.grab": ["fork", "tele", "heap"],
    "load.drop": ["fork", "tele", "rig"],
    "fill.arm": ["arm", "lagoon"],
    "fill.pump": ["pump", "arm", "rig"],
    "spread.drive": ["tractor", "rig"],
    "spread.beat": ["beaters", "rig", "tractor"],
    "spread.plate": ["plate", "rig", "tractor"]
  };
  var BUSY = {
    scrape: "The yard scraper is pushing the muck.", load: "The telehandler is loading.", fill: "The tank is filling up.",
    spread: "The tractor is working."
  };
  var sub = "push", cue = null, flash = 0;
  function key() { return stepId + "." + sub; }
  function sayFor(k) { var d = SUB[k]; return d ? d.say : ""; }
  function wantPart() { if (phase !== "ready") return null; var d = SUB[key()]; return d ? d.part : null; }
  function againLine() { return job === "slurry" ? "Tap the field to spread more slurry." : "Tap the field to spread more muck."; }

  // ---------- Pictures for the job tabs (drawn with the scene's own code) ----------
  var picCache = {};
  function pic(id) {
    if (picCache[id] !== undefined) return picCache[id];
    var c = document.createElement("canvas"), PW = 168, PH = 120, x;
    c.width = PW; c.height = PH;
    try { x = c.getContext("2d"); } catch (e) { x = null; }
    if (!x) return (picCache[id] = "");
    var keep = ctx;
    function fit(w, h, ox, fn) { var s = Math.min(PW * 0.94 / w, PH * 0.9 / h); Farm.inUnits(x, PW / 2 + ox * s, PH * 0.95, s, 3.4, fn); }
    ctx = x;
    try {
      if (id === "muck") fit(13.4, 3.6, 0, function () {
        x.scale(-1, 1); x.translate(1.0, -0.5);
        spreader(x, { load: 0.8, beat: 0.6, door: 0 }); x.translate(-Farm.DRAWBAR[0], 0.5); D.tractor(x, { drawbar: true });
      });
      else if (id === "slurry") fit(14.2, 3.6, 0, function () {
        x.scale(-1, 1); x.translate(1.4, -0.5);
        tanker(x, { load: 0.6 }); x.translate(-Farm.DRAWBAR[0], 0.5); D.tractor(x, { drawbar: true });
      });
    } finally { ctx = keep; }
    var url = "";
    try { url = c.toDataURL("image/png"); } catch (e) { url = ""; }
    return (picCache[id] = url ? '<img alt="" src="' + url + '" style="width:100%;height:100%;object-fit:contain;display:block">' : "");
  }

  // ---------- Job bar, bottom bar, ghost ----------
  var ghost = Toybox.ghost({
    max: 3,
    plan: function () {
      if (Farm.locked(ending)) return null;
      var b = cv.getBoundingClientRect();
      if (phase === "ready") {
        var p = wantPt(); if (!p) return null;
        var k = key(), drive = k === "scrape.push" || k === "spread.drive";
        if (drive && ghost.shown(k) >= 1) return { pts: [[b.left + p[0], b.top + p[1]], [b.left + p[0] - Math.min(W * 0.3, 140), b.top + p[1]]], key: k };
        return { pts: [[b.left + p[0], b.top + p[1]]], tap: true, key: k };
      }
      if (phase === "done" && phaseT > 5) return { pts: [[b.left + W * 0.5, b.top + scF.gY + (H - scF.gY) * 0.25]], tap: true, key: "again" };
      return null;
    }
  });
  var jobs = Toybox.jobs($("jobs"), {
    jobs: [{ id: "muck", name: "Spreader", pic: pic("muck") }, { id: "slurry", name: "Slurry tanker", pic: pic("slurry") }],
    value: job,
    onPick: function (id) { switchJob(id); }
  });
  Toybox.bar($("bottom"), { onNew: startOver, onSurprise: surprise });

  function busyHint() { snd.horn(); coach.say(phase === "grow" ? "Weeks go by. The grass grows." : (phase === "arrive" ? "Here comes the yard scraper." : (BUSY[stepId] || "Wait a moment.")), 3); }
  function hint() { var t = sayFor(key()); if (t) coach.say(t, 3); flash = 3; if (ghost) ghost.poke(); }

  // =====================================================================================================
  // The flow
  // =====================================================================================================
  // Spreader:      Scrape (drive the scraper) -> Load (grab, drop; twice) -> Spread (drive to the field, beaters)
  // Slurry tanker: Fill (suction arm, vacuum pump) -> Spread (drive to the field, splash plate)
  // Then weeks go by, the grass grows, and a tap on the field starts again.
  function setPhase(p) { phase = p; phaseT = 0; }
  function setSub(s) {
    sub = s; setPhase("ready"); grab = null;
    var d = SUB[key()]; cue = d ? d.part : null;
    coach.step(sayFor(key()));
    if (ghost) ghost.poke();
  }
  // his tap started a control's motion: the ring goes, an information line says what is happening
  function working(line) { setPhase("work"); cue = null; coach.step(line); }
  function bringIn(id) {
    stepId = id; auto = false; grab = null; cue = null;
    if (id === "scrape") {
      floorMuck.clean = BX1; scr.roll = 0; scr.tip = 0; scr.lift = 1;
      scr.st = "in"; scr.x = SCR_START + 9; scr.v = 0; sub = "push";
      setPhase("arrive"); coach.step("Here comes the yard scraper.");
    } else if (id === "load") { tele.n = 0; setSub("grab"); }
    else if (id === "fill") setSub("arm");
    else if (id === "spread") setSub("drive");
  }
  // what each step's tap does (true: it did something)
  function act(part) {
    var k = key(), ok = ALSO[k] && ALSO[k].indexOf(part) >= 0;
    if (!ok) return false;
    if (ghost) ghost.learned(k);
    if (k === "scrape.push") { startScrape(); return true; }
    if (k === "load.grab") {
      tele.st = "grab"; tele.t = 0; snd.horn();
      working("The muck fork grabs the muck from the heap.");
      return true;
    }
    if (k === "load.drop") {
      tele.st = "drop"; tele.t = 0;
      working("The telehandler turns round to the spreader.");
      return true;
    }
    if (k === "fill.arm") {
      rig.fillT = 0; snd.clunk();
      working("The suction arm dips into the slurry.");
      return true;
    }
    if (k === "fill.pump") {
      rig.pump = true; snd.horn();
      working("The vacuum pump sucks the slurry into the tank.");
      return true;
    }
    if (k === "spread.drive") { startRoad(); return true; }
    if (k === "spread.beat" || k === "spread.plate") { startSpread(); return true; }
    return false;
  }
  function startScrape() {
    scr.st = "push"; auto = true; snd.horn();
    working("The yard scraper pushes the muck onto the heap.");
    tagW(scF, "Yard scraper", scr.x - 4.5, 1.6);
  }
  function startRoad() {
    rig.st = "road"; auto = true; snd.horn();
    working(job === "slurry" ? "The tractor tows the slurry tanker to the field." : "The tractor tows the muck spreader to the field.");
  }
  function startSpread() {
    rig.st = "go"; auto = true; rig.load0 = rig.load; snd.horn();
    field.from = job; field.wipe = null;
    working(job === "slurry" ? "The splash plate sprays the slurry on the grass." : "The beaters fling the muck on the grass.");
  }
  function scrapeDone() { bringIn("load"); }
  function loadDone() { bringIn("spread"); }
  function fillDone() { bringIn("spread"); }
  function spreadDone() {
    loads++; save(); snd.chime();
    Farm.world.update(function (w) { w.muck = (typeof w.muck === "number" && isFinite(w.muck) ? w.muck : 0) + 1; });
    field.stage = job; field.wipe = null;
    setPhase("grow"); auto = false; grab = null; cue = null;
    coach.step("Weeks go by. The grass grows.");
  }
  function grown() {
    field.stage = "lush"; field.g = 1;
    setPhase("done"); cue = null;
    coach.step(againLine());
    coach.say("The grass grows thick and green!", 5);
    snd.chime(); Toybox.kind();
  }
  function again() {
    if (phase !== "done") return false;
    if (ghost) ghost.learned("again");
    field.stage = "hungry"; field.g = 0; field.wipe = null;
    parkRig(); tele.n = 0;
    bringIn(firstStep());
    if (job === "muck") coach.say("The cows made more muck!", 3);
    return true;
  }
  function parkRig() { rig.x = EYE; rig.v = 0; rig.st = "park"; rig.load = 0; rig.door = 0; rig.arm = 0; rig.fillT = -1; rig.pump = false; rig.burp = 0; rig.flow = 0; rig.spray = 0; }
  function resetYard() {
    heap.V = heap.tgt = 0.45; tele.st = "idle"; tele.t = 0; tele.n = 0; tele.d = 0; tele.dir = 1; tele.a = 0.25; tele.ext = 0; tele.curl = -0.1; tele.load = 0; tele.grip = 0;
    scr.st = "away"; scr.x = SCR_START + 9; floorMuck.clean = BX1; lagoon.level = 1; lagoon.stir = 0;
    parkRig();
  }
  function startOver() {
    if (Farm.locked(ending)) return;
    parts.length = 0; gulls = null; dog = null; win = null;
    resetYard(); field.stage = "hungry"; field.g = 0; field.wipe = null;
    bringIn(firstStep()); follow(0, true);
    if (job === "muck") coach.say("A new day on the farm!", 3);
    save();
  }
  function switchJob(id) {
    if (Farm.locked(ending)) { jobs.set(job); return; }
    job = id === "slurry" ? "slurry" : "muck";
    parts.length = 0; gulls = null; dog = null; win = null;
    resetYard(); field.stage = "hungry"; field.g = 0; field.wipe = null;
    bringIn(firstStep()); follow(0, true);
    if (job === "muck") coach.say("Muck for the grass!", 3);
    save();
  }

  // ---------- Surprise: a fun moment on the scene, taking turns ----------
  var surpriseN = 0;
  function actionX() {
    if (rig.st === "go" || rig.st === "stop") return rear() + 2.5;
    if (rig.st === "road" || rig.st === "edge") return rig.x + 3;
    if (phase === "grow" || phase === "done") return field ? L * 0.55 : 0;
    if (stepId === "scrape" && scr.st !== "away") return scr.x - 6;
    return job === "slurry" ? rear() - 2 : HX0 + HW / 2;
  }
  function surprise() {
    if (Farm.locked(ending)) return;
    var pick = ["gulls", "dog", "window"][surpriseN++ % 3];
    if (pick === "gulls") {
      gulls = { t: 0, follow: spreading(), x: actionX(), list: [] };
      if (!gulls.follow && rig.st === "home") gulls.x = L * 0.55;
      for (var i = 0; i < 7; i++) gulls.list.push({ ox: (hash(i, 3) - 0.5) * 5, ph: hash(i, 4) * 6, h0: 2 + hash(i, 5) * 2.5 });
      coach.say(gulls.follow ? (job === "slurry" ? "The seagulls follow the tanker!" : "The seagulls follow the spreader!") : "Here come the seagulls!", 4);
      return;
    }
    if (pick === "dog") {
      var ax = phase === "done" || phase === "grow" ? EYE + REAR[job] - 1.5 : actionX(), from = ax - 11;
      dog = { x: from, stop: ax - 2.6, t: 0, st: "run", ph: 0, jump: 0, lump: null, flip: false };
      coach.say("The farm dog comes to see.", 3);
      return;
    }
    if (pick === "window") {
      var useScr = stepId === "scrape" && scr.st !== "away" && scr.st !== "back";
      win = { t: 0, who: useScr ? "scr" : "rig", splat: 0, glass: 0, wipe: 0 };
      coach.say("Quick, shut the window!", 3);
    }
  }

  // =====================================================================================================
  // Particles (world x, height h in metres; drawn on the machine line)
  // =====================================================================================================
  var parts = [];
  function addPart(p) { if (parts.length > 220) parts.shift(); p.t = 0; p.rot = p.rot || Math.random() * 3; parts.push(p); }
  function updateParts(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i]; p.t += dt;
      if (p.t >= p.life) { parts.splice(i, 1); continue; }
      if (p.kind === "puff") { p.x += p.vx * dt; p.h += p.vh * dt; p.size += (p.grow || 0.5) * dt; continue; }
      p.vh -= (p.g === undefined ? 9 : p.g) * dt; p.x += p.vx * dt; p.h += p.vh * dt; p.rot += (p.spin || 0) * dt;
      var fl = p.floor || 0;
      if (p.h < fl) { p.h = fl; p.vh = 0; p.vx *= 0.2; p.spin = 0; if (p.t < p.life - 0.25) p.t = p.life - 0.25; }
    }
  }
  function drawParts(sc) {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], s = sc.k, x = sc.X(p.x, 1), y = sc.gY - p.h * s, z = Math.max(1, p.size * s), f = p.t / p.life;
      if (x < -40 || x > sc.W + 40) continue;
      ctx.globalAlpha = p.kind === "puff" ? (p.alpha || 0.5) * (1 - f) : (f > 0.7 ? (1 - f) / 0.3 : 1);
      ctx.fillStyle = p.col;
      if (p.kind === "puff" || p.kind === "drop") { ctx.beginPath(); ctx.arc(x, y, z, 0, TAU); ctx.fill(); }
      else if (p.kind === "straw") { ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.fillRect(-z, -z * 0.2, z * 2, z * 0.4); ctx.restore(); }
      else { ctx.beginPath(); ctx.ellipse(x, y, z * 1.2, z * 0.85, p.rot, 0, TAU); ctx.fill(); if (z > 3) { ctx.lineWidth = Math.max(1, sc.lw * 0.5); ctx.strokeStyle = INK; ctx.stroke(); } }
    }
    ctx.globalAlpha = 1;
  }
  function muckCol() { var r = Math.random(); return r < 0.45 ? MUCK[0] : (r < 0.8 ? MUCK[1] : MUCK[3]); }

  // =====================================================================================================
  // Input: every part is hit-tested on the canvas; the part the ring marks wins a near miss
  // =====================================================================================================
  function W2(x, h) { return [scF.X(x, 1), scF.gY - h * scF.k]; }       // world (x, height) -> canvas px
  function tractorPt() { return W2(rig.x - 2.2, 1.7); }
  function rigPt() { return W2(rig.x + 4.2, 1.6); }
  function beaterPt() { return W2(rig.x + 7.05, 2.2); }
  function platePt() { return W2(rig.x + 8.0, 1.25); }
  function pumpPt() { return W2(rig.x + 1.95, 3.5 - rig.load * 0.12); }
  function armPt() { var g = armGeo(scF); return [lerp(g.px, g.ex, 0.5), lerp(g.py, g.ey, 0.5) - (1 - rig.arm) * 0.1 * scF.k]; }
  function forkPt() { var f = forkWorld(); return W2(f[0] - tele.dir * 0.2, f[1] - 0.1); }
  function telePt() { return W2(tele.x + tele.d, 1.5); }
  function scrPt() { return W2(scr.x - 2.5, 1.6); }
  function heapPt() { return W2(HX0 + HW / 2 + 0.5, 0.9); }
  function lagoonPt() { return [scF.X(40.5, 1), scF.Y(1.4)]; }
  function barnPt() { return W2(BX0 + 6.5, 1.6); }
  function controls() {
    var k = scF.k, list = [];
    if (scr.st !== "away") list.push({ id: "scraper", p: scrPt(), r: 2.4 * k });
    if (job === "muck") {
      list.push({ id: "fork", p: forkPt(), r: 1.0 * k });
      list.push({ id: "tele", p: telePt(), r: 1.9 * k });
      list.push({ id: "heap", p: heapPt(), r: 1.8 * k });
      list.push({ id: "beaters", p: beaterPt(), r: 1.0 * k });
    } else {
      list.push({ id: "arm", p: armPt(), r: 0.9 * k });
      list.push({ id: "pump", p: pumpPt(), r: 0.8 * k });
      list.push({ id: "plate", p: platePt(), r: 0.8 * k });
      list.push({ id: "lagoon", p: lagoonPt(), r: 1.8 * k });
    }
    list.push({ id: "tractor", p: tractorPt(), r: 2.0 * k });
    list.push({ id: "rig", p: rigPt(), r: 2.6 * k });
    list.push({ id: "barn", p: barnPt(), r: 2.4 * k });
    return list;
  }
  // the part under a point on the canvas (canvas px), or null (the sky, the field)
  function hitAt(x, y) {
    var minR = Math.max(24, (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--tb-key")) || 110) * 0.3);
    var best = null, bd = 1e9, want = wantPart();
    controls().forEach(function (c) {
      var d = Math.hypot(x - c.p[0], y - c.p[1]), r = Math.max(c.r, minR);
      if (c.id === want) { r *= 1.3; d *= 0.6; }      // the part the ring marks wins a near miss
      if (d <= r && d < bd) { bd = d; best = c.id; }
    });
    return best;
  }
  // the screen point (canvas px) of the part the ring marks
  function wantPt() { return partPt(wantPart()); }
  function partPt(id) {
    return id ? ({ scraper: scrPt, fork: forkPt, tele: telePt, heap: heapPt, arm: armPt, pump: pumpPt, plate: platePt,
      beaters: beaterPt, tractor: tractorPt, rig: rigPt, lagoon: lagoonPt, barn: barnPt }[id] || function () { return null; })() : null;
  }
  // a part's real name, as a small tag, when he taps it
  function tagPart(part) {
    var sl = job === "slurry";
    if (part === "scraper") { snd.horn(); tagW(scF, "Yard scraper", scr.x - 4.5, 1.6); return true; }
    if (part === "fork") { snd.tick(); var f = forkWorld(); tagW(scF, "Muck fork", f[0], f[1] + 0.6); return true; }
    if (part === "tele") { snd.horn(); tagW(scF, "Telehandler", tele.x + tele.d, 3.6); return true; }
    if (part === "beaters") { snd.tick(); tagW(scF, "Beaters", rig.x + 7.05, 3.3); return true; }
    if (part === "plate") { snd.tick(); tagW(scF, "Splash plate", rig.x + 8.0, 2.0); return true; }
    if (part === "pump") { snd.tick(); tagW(scF, "Vacuum pump", rig.x + 1.95, 4.0); return true; }
    if (part === "arm") { snd.tick(); tagW(scF, "Suction arm", rig.x + 8.6, 3.8); return true; }
    if (part === "tractor") { snd.horn(); tagW(scF, "Tractor", rig.x - 2.2, 3.4); return true; }
    if (part === "rig") { snd.tick(); tagW(scF, sl ? "Slurry tanker" : "Muck spreader", rig.x + 4.2, sl ? 3.4 : 3.0); return true; }
    if (part === "heap") {
      tagW(scF, "Muck heap", HX0 + HW / 2, 2.6);
      for (var i = 0; i < 5; i++) addPart({ kind: "puff", x: HX0 + 1 + Math.random() * 3, h: 1.4 + Math.random(), vx: 0.1, vh: 0.6, life: 1.6, size: 0.15, grow: 0.3, col: "#E8ECEF", alpha: 0.5 });
      return true;
    }
    if (part === "lagoon") { tagW(scF, "Slurry lagoon", 40, 1.2); lagoon.stir = 1.5; snd.pop(); return true; }
    if (part === "barn") { tagW(scF, "Cows", BX0 + 6.5, 2.2); cowNod = Math.floor(Math.random() * 4); cowNodT = 0; return true; }
    return false;
  }
  function tapPart(part) {
    if (Farm.locked(ending)) return;
    if (phase === "done") { if (part === "barn" || part === "heap" || part === "lagoon") tagPart(part); else again(); return; }
    if (phase === "ready" && act(part)) return;
    var named = tagPart(part);
    if (part === "barn" || part === "heap" || part === "lagoon") { if (phase === "ready") flash = 3; return; }
    if (phase !== "ready") { if (!named) busyHint(); return; }
    hint();
  }
  // He drives by drag too: a drag on the yard scraper (scraping) or on the tractor and its spreader / tanker (to the
  // field, or across it) moves it under his finger; when he lets go it carries on to its stop.
  function dragWorld(clientX) { var b = cv.getBoundingClientRect(); return scF.wx(clientX - b.left, 1); }
  function driving(part) {
    var k = key();
    if (k === "scrape.push" && part === "scraper") return "scraper";
    if ((k === "spread.drive" || k === "spread.beat" || k === "spread.plate") && (part === "tractor" || part === "rig" || part === "beaters" || part === "plate")) return "rig";
    return null;
  }
  Toybox.press(cv, {
    any: true,
    hit: function (x, y) { var b = cv.getBoundingClientRect(); return hitAt(x - b.left, y - b.top); },
    dragStart: function (part, e, s) {
      grab = null;
      if (Farm.locked(ending) || phase !== "ready") return;
      var who = driving(part);
      if (!who) return;
      act(part);
      auto = false;
      var X0 = who === "scraper" ? scr.x : rig.x;
      grab = { who: who, off: dragWorld(s.x) - X0 };
    },
    move: function (part, e, s) { if (grab) grab.to = dragWorld(s.x) - grab.off; },
    up: function (part, e, s) { if (grab && !s.tap) auto = true; grab = null; },
    tap: function (part) { tapPart(part); }
  });

  // =====================================================================================================
  // Simulation
  // =====================================================================================================

    }
  }
  function fieldPaint(sc, part, P) {
    var rows = part === "near" ? sc.rowsNear : sc.rowsFar, w = P.wipe, near = part === "near";
    if (sc.X(0, 1) > sc.W + 40 && sc.X(L, 1) > sc.W + 40) return;
    if (sc.X(L, 3) < -40 && sc.X(L, 1) < -40) return;
    function run(stage, xa, xb) {
      if (xb - xa < 0.01) return;
      ctx.save(); sc.clipX(ctx, xa, xb);
      for (var i = 0; i < rows.length; i++) paintRow(sc, rows[i], stage, P, xa, xb, near);
      ctx.restore();
    }
    if (!w) run(P.stage, 0, L);
    else { var bx = clamp(w.bx, 0, L); run(P.stage, 0, bx); run(w.to, bx, L); }
    if (part === "far") {
      ctx.save(); ctx.strokeStyle = "rgba(61,90,40,0.55)"; ctx.lineWidth = Math.max(1.5, sc.lw);
      [0, L].forEach(function (x) { ctx.beginPath(); ctx.moveTo(sc.X(x, sc.rH), sc.Y(sc.rH)); ctx.lineTo(sc.X(x, 1), sc.gY); ctx.lineTo(sc.X(x, sc.rN), sc.Y(sc.rN)); ctx.stroke(); });
      ctx.restore();
    }
  }

  // ---------- Loop ----------
  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
    if (!(window.Toybox && Toybox.timer.phase() === "resting")) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  function onEnding(done) {
    ending = true; auto = false; grab = null; rig.v = 0; scr.v = 0; coach.clear();
    setTimeout(function () { snd.engine(-1); snd.soil(0); snd.pour(0); done(); }, 2600);
  }
  function onWake() {
    ending = false; dusk = 0;
    if (phase === "ready") coach.step(sayFor(key()));
    else if (phase === "done") coach.step(againLine());
  }

  // ---------- Start ----------
  resize();
  bringIn(firstStep());
  if (job === "muck") scr.x = SCR_START + 5;
  follow(0, true);
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  else window.addEventListener("resize", resize);

  Toybox.init({
    app: "farm",
    badge: $("tbadge"),
    timerIntro: "When time is up, the machines stop and park, and the controls lock. The timer carries on across the Tractor Ted pages.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "Soft engine and splatty sounds. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: onWake,
    onWake: onWake,
    onSound: function (on) { if (on) snd.chime(); }
  });
  // leaving the page while a machine works switches it off quietly
  Toybox.offFirst({
    running: function () { return scr.st === "push" || tele.st === "grab" || tele.st === "drop" || rig.pump || rig.st === "road" || rig.st === "go"; },
    off: function (done) { auto = false; grab = null; rig.v = 0; scr.v = 0; snd.engine(-1); snd.soil(0); snd.pour(0); done(); }
  });
  requestAnimationFrame(loop);

  if (/[?&]debug\b/.test(location.search)) window.__farm = {
    state: function () {
      return { phase: phase, step: stepId, sub: sub, want: wantPart(), job: job, rig: rig.st, x: rig.x, load: rig.load, arm: rig.arm, scr: scr.st,
        tele: tele.st, forkfuls: tele.n, heap: heap.V, field: field.stage, loads: loads, coach: coach.text(), parts: parts.length, cam: scF.cam, k: scF.k };
    },
    // viewport point of a part ("scraper", "fork", "tele", "heap", "arm", "pump", "plate", "beaters", "tractor", "rig",
    // "lagoon", "barn"; "want" = the part the ring marks)
    screen: function (id) { var p = partPt(id === "want" || !id ? wantPart() : id), b = cv.getBoundingClientRect(); return p ? { x: b.left + p[0], y: b.top + p[1] } : null; },
    want: function () { var p = wantPt(), b = cv.getBoundingClientRect(); return p ? { x: b.left + p[0], y: b.top + p[1] } : null; },
    // play the station by script: tap(part) is a tap on that part ("want" = the ringed part, null = the field)
    tap: function (part) { tapPart(part === "want" ? wantPart() : (part || null)); },
    // is the whole working machine on screen? (canvas px boxes of the scraper, the rig, the telehandler)
    inView: function () {
      function box(x0, x1, h) { var a = Math.min(scF.X(x0, 1), scF.X(x1, 1)), b = Math.max(scF.X(x0, 1), scF.X(x1, 1)); return { l: Math.round(a), r: Math.round(b), top: Math.round(scF.gY - h * scF.k), ok: a >= -1 && b <= W + 1 }; }
      return { W: Math.round(W), H: Math.round(H), rig: box(rig.x - 5.4, rig.x + REAR[job] + 0.7, 4), scraper: scr.st === "away" ? null : box(scr.x - 5.0, scr.x + 0.4, 3.4),
        tele: job === "muck" ? box(tele.x - 3.5, tele.x + 6, 5) : null };
    },
    surprise: surprise,
    ghost: function () { return ghost.show(); }
  };
})();
</script>
</body>
</html>
