}

<script>
(function () {
  "use strict";
  // Mucky Muck: feeding the grass with what the cows leave behind, the way the episode shows it.
  // Spreader:      the yard scraper (the green tractor with a rubber-edged blade on the front) pushes the muck
  //                down the barn passage onto the muck heap; the telehandler's muck fork lifts it, turns round
  //                and drops it into the rear-discharge muck spreader; the tractor tows the spreader to the
  //                field, where the two upright beaters fling the muck out behind it.
  // Slurry tanker: the vacuum tanker's suction arm dips into the slurry lagoon and the tank fills (it sits down
  //                on its tyres and burps when it is full); in the field the splash plate sprays it over the grass.
  // Either way the field goes dark where it was fed, then weeks go by and the grass grows thick and green.
  // One world along the machine line: the field (x 0..L) on the left, then the farmyard: the spreader (or the
  // tanker) parked by the muck heap (or the lagoon), the telehandler, and the cow barn with its passage. On a
  // wide stage one camera follows the work; on an upright stage the stage is split: the whole rig on
  // top (following the action from the yard to the field) and a big close-up of the work happening below.
  // Machine drawings live here for now in farm.js's style and function shapes (metres, y up negative, origin
  // at the drawbar eye with the ground at y = +0.5, facing +x) so they can move into farm.js later:
  // scraper (tractor units), spreader / tanker (drawbar eye), teleBody / teleBoom (between the axles), cow.
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.u, clamp = U.clamp, lerp = U.lerp, ease = U.ease, hash = U.hash, mix = U.mix, INK = U.INK;
  var D = Farm.draw, SH = Farm.shape, snd = Farm.sound, TAU = Math.PI * 2;
  var Pp = SH.P, Rr = SH.R, Cc = SH.C, Ln = SH.Ln, tube = SH.tube, fs = SH.fs;
  var NAME = (Farm.NAMES && Farm.NAMES.muck) || "Mucky Muck";
  document.title = NAME; $("title").textContent = NAME;
  function LW() { return Farm.LW; }
  function shine(ctx, x1, y1, x2, y2, w) { Ln(ctx, x1, y1, x2, y2, "rgba(255,255,255,0.45)", w); }
  var G = { body: "#3E9F3A", dark: "#2B7A2A", frame: "#2B3040", glass: "#BFE7FA", steel: "#C3CCD6", grey: "#7C8696" };
  var MUCK = ["#6B4A2B", "#52371F", "#C9A45A", "#7E5A34"], SLURRY = ["#6B5233", "#4F3B24", "#8C7446"];
  var reduce = !!U.reduceMotion;

  // ---------- State ----------
  var KEY = "farm-muck-v1";
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  if (startFresh || typeof saved !== "object" || Array.isArray(saved)) saved = {};
  var loads = typeof saved.loads === "number" && isFinite(saved.loads) && saved.loads >= 0 ? Math.floor(saved.loads) : 0;
  var job = saved.job === "slurry" ? "slurry" : "muck";
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ loads: loads, job: job })); } catch (e) { /* ignore */ } }

  // ---------- The world (metres along the machine line) ----------
  var L = 20, EYE = 27.5, TX = 37.2, HX0 = 39.8, HW = 4.0, HX1 = HX0 + HW, BX0 = 46.6, BX1 = 60.6, XMAX = BX1 + 9;
  var LG0 = 31, LG1 = 45;                       // the slurry lagoon (behind the machine line)
  var SCR_END = HX1 + 4.7, SCR_START = BX1 + 4.3; // the scraper's rear axle: start and where the blade meets the heap
  var V_SPREAD = 4.2, V_SCRAPE = 3.3;
  var REAR = { muck: 7.0, slurry: 7.95 };       // drawbar eye -> beaters / splash plate (behind the tractor)

  // ---------- Small drawing helpers (farm.js style) ----------
  function wheel(ctx, cx, cy, r, rot, o) {
    o = o || {};
    var n = o.lugs || Math.round(r * 22), i, a, l0 = LW();
    ctx.save(); ctx.translate(cx, cy);
    for (i = 0; i < n; i++) {
      a = rot + i * TAU / n;
      var c = Math.cos(a), s = Math.sin(a), c2 = Math.cos(a + 0.12), s2 = Math.sin(a + 0.12);
      Pp(ctx, [c * r * 0.93, s * r * 0.93, c * r * 1.06, s * r * 1.06, c2 * r * 1.06, s2 * r * 1.06, c2 * r * 0.93, s2 * r * 0.93], "#2A2C36", l0 * 0.7);
    }
    Cc(ctx, 0, 0, r * 0.97, "#33363F", l0);
    if (o.squash) { ctx.beginPath(); ctx.ellipse(0, r * 0.88, r * (0.55 + o.squash * 2.5), r * 0.16, 0, 0, TAU); fs(ctx, "#33363F", l0 * 0.8); }
    Cc(ctx, 0, 0, r * 0.8, "#40434E", 0);
    var rimR = r * (o.rim || 0.6);
    Cc(ctx, 0, 0, rimR, o.rimCol || "#C3CCD6", l0);
    Cc(ctx, 0, 0, rimR * 0.78, "#A9B4C1", l0 * 0.6);
    Cc(ctx, 0, 0, rimR * 0.36, "#8C97A6", l0 * 0.7);
    for (i = 0; i < 6; i++) { a = rot + i * TAU / 6; Cc(ctx, Math.cos(a) * rimR * 0.55, Math.sin(a) * rimR * 0.55, rimR * 0.07, "#6E7887", 0); }
    ctx.restore();
  }
  function driverHead(ctx, x, y) {
    var l0 = LW();
    Rr(ctx, x - 0.26, y + 0.1, 0.52, 0.5, 0.16, "#3D6FB6", l0 * 0.7);
    Cc(ctx, x, y, 0.17, "#F2C8A0", l0 * 0.7);
    Pp(ctx, [x - 0.18, y - 0.04, x - 0.16, y - 0.2, x + 0.16, y - 0.2, x + 0.3, y - 0.06], "#E8473B", l0 * 0.6);
  }
  // a lumpy mound of muck along y0 from xa to xb, height hh (straw flecks on it)
  function muckMound(ctx, xa, xb, y0, hh, seed, col) {
    if (hh <= 0.01 || xb - xa < 0.05) return;
    var n = Math.max(6, Math.round((xb - xa) * 4)), i;
    ctx.beginPath(); ctx.moveTo(xa, y0);
    for (i = 0; i <= n; i++) {
      var f = i / n, x = lerp(xa, xb, f);
      ctx.lineTo(x, y0 - hh * Math.pow(Math.sin(f * Math.PI), 0.55) - (i % 2 ? 0.05 : 0) * Math.min(1, hh * 3) * hash(i, seed));
    }
    ctx.closePath(); fs(ctx, col || MUCK[0], LW() * 0.8);
    ctx.save(); ctx.clip();
    for (i = 0; i < Math.round((xb - xa) * 5); i++) {
      var sx = lerp(xa, xb, hash(i, seed + 1)), sy = y0 - hh * hash(i, seed + 2) * 0.9;
      Ln(ctx, sx, sy, sx + 0.16 * (hash(i, seed + 3) - 0.3), sy - 0.05, i % 3 ? MUCK[2] : MUCK[1], 0.045);
    }
    ctx.restore();
  }

  // =====================================================================================================
  // The machines (could move into farm.js as Farm.draw.scraper / spreader / tanker / telehandler / cow)
  // =====================================================================================================
  // The yard scraper: a steel blade with a rubber edge on the tractor's front linkage. Tractor units.
  function scraper(ctx, st) {
    var l0 = LW(), up = (st.lift || 0) * 0.3;
    tube(ctx, 3.95, -1.25, 4.4, -0.95 - up, 0.12, G.grey);
    tube(ctx, 3.95, -0.8, 4.4, -0.45 - up, 0.12, G.grey);
    Rr(ctx, 4.35, -1.25 - up, 0.28, 1.15, 0.05, "#F2C230");
    shine(ctx, 4.43, -1.15 - up, 4.43, -0.3 - up, 0.05);
    Rr(ctx, 4.38, -0.14 - up, 0.24, 0.16, 0.03, "#2A2C36", l0 * 0.7);
  }
  // Rear-discharge muck spreader with two upright beaters. Origin at the drawbar eye, ground at y = +0.5.
  // st = { wheel, load (0..1), beat (angle), door (0..1 open), time }
  function spreader(ctx, st) {
    var l0 = LW(), Rd = "#D8403A", RD = "#A82E28", load = clamp(st.load || 0, 0, 1), i;
    Pp(ctx, [0.1, 0.05, -1.85, -0.72, -1.85, -0.48, 0.1, 0.14], G.grey);
    Rr(ctx, -6.75, -0.98, 5.1, 0.24, 0.04, "#3A3F4E");
    wheel(ctx, -3.6, -0.12, 0.62, (st.wheel || 0) / 0.62, { rim: 0.55, rimCol: "#E2E6EB" });
    wheel(ctx, -4.95, -0.12, 0.62, (st.wheel || 0) / 0.62, { rim: 0.55, rimCol: "#E2E6EB" });
    if (load > 0.01) muckMound(ctx, -6.45, -1.85, -2.15, 0.15 + load * 0.75, 3);
    // the box, with ribs, and the mesh guard at the front
    Rr(ctx, -6.5, -2.22, 4.75, 1.3, 0.08, Rd);
    Rr(ctx, -6.58, -2.32, 4.9, 0.16, 0.06, RD, l0 * 0.8);
    for (i = 1; i < 6; i++) Ln(ctx, -6.5 + i * 0.79, -2.15, -6.5 + i * 0.79, -1.0, RD, 0.07);
    shine(ctx, -6.35, -2.05, -1.95, -2.05, 0.07);
    Rr(ctx, -1.9, -2.95, 0.14, 0.75, 0.03, "#5D6675", l0 * 0.7);
    for (i = 0; i < 3; i++) Ln(ctx, -1.85, -2.85 + i * 0.22, -1.7, -2.85 + i * 0.22, "#5D6675", 0.035);
    // the beaters at the back: two upright rotors with spiral tines (one behind the other)
    var b = st.beat || 0;
    [-6.92, -7.12].forEach(function (sx, k) {
      Ln(ctx, sx, -0.85, sx, -2.55, INK, 0.16); Ln(ctx, sx, -0.85, sx, -2.55, k ? "#5D6675" : "#8C97A6", 0.1);
      for (var j = 0; j < 8; j++) {
        var y = -0.95 - j * 0.2, c = Math.cos(b * (k ? -1 : 1) + j * 0.85);
        Ln(ctx, sx, y, sx + c * 0.34, y - 0.05, INK, 0.09); Ln(ctx, sx, y, sx + c * 0.34, y - 0.05, "#C3CCD6", 0.05);
      }
    });
    // the beater frame: a hood on top and the spreading floor below
    Pp(ctx, [-6.5, -2.42, -7.5, -2.42, -7.6, -2.62, -6.5, -2.62], "#5D6675", l0 * 0.8);
    Pp(ctx, [-6.5, -0.86, -7.5, -0.86, -7.55, -0.74, -6.5, -0.74], "#5D6675", l0 * 0.8);
    // the hydraulic door between the box and the beaters slides up to let the muck out
    var dy = clamp(st.door || 0, 0, 1) * 1.15;
    Rr(ctx, -6.62, -2.2 - dy, 0.16, 1.25, 0.03, RD, l0 * 0.8);
  }
  // Vacuum slurry tanker: a galvanised tank on two axles, the vacuum pump at the front, the suction arm's
  // turret at the back top (the page draws the arm) and the splash plate under the rear outlet.
  // Origin at the drawbar eye, ground at y = +0.5. st = { wheel, load (0..1), time, spray (0..1) }
  var TK = { arm: [-6.75, -2.95] };
  function tanker(ctx, st) {
    var l0 = LW(), load = clamp(st.load || 0, 0, 1), sq = load * 0.12, i, Tc = "#B9C3CD", Td = "#8E9AA8";
    Pp(ctx, [0.1, 0.05, -1.75, -0.78, -1.75, -0.52, 0.1, 0.14], G.grey);
    Rr(ctx, -7.6, -1.0, 6.2, 0.22, 0.04, "#3A3F4E");
    wheel(ctx, -4.0, -0.14, 0.66, (st.wheel || 0) / 0.66, { rim: 0.55, rimCol: "#E2E6EB", squash: sq });
    wheel(ctx, -5.4, -0.14, 0.66, (st.wheel || 0) / 0.66, { rim: 0.55, rimCol: "#E2E6EB", squash: sq });
    ctx.save(); ctx.translate(0, sq);
    // the rear outlet and the splash plate
    tube(ctx, -7.3, -1.25, -7.8, -0.95, 0.2, Td);
    Pp(ctx, [-7.7, -0.78, -8.25, -1.12, -8.3, -0.98, -7.78, -0.66], "#5D6675", l0 * 0.8);
    // the tank
    Rr(ctx, -7.55, -2.8, 6.15, 1.9, 0.92, Tc);
    for (i = 0; i < 3; i++) Rr(ctx, -2.95 - i * 1.6, -2.82, 0.18, 1.94, 0.06, Td, l0 * 0.7);
    shine(ctx, -6.9, -2.55, -2.1, -2.55, 0.1);
    Ln(ctx, -6.9, -1.12, -2.1, -1.12, "rgba(29,35,64,0.18)", 0.12);
    // the manlid dome on top, the vacuum pump at the front with its pulley and pipe
    ctx.beginPath(); ctx.arc(-4.2, -2.8, 0.32, Math.PI, 0); ctx.closePath(); fs(ctx, Td, l0 * 0.8);
    Rr(ctx, -2.35, -3.25, 0.85, 0.5, 0.08, "#3A3F4E", l0 * 0.8);
    Cc(ctx, -1.95, -3.0, 0.16, "#8C97A6", l0 * 0.6);
    tube(ctx, -2.35, -3.1, -2.75, -2.75, 0.09, "#5D6675");
    // the arm's turret at the back
    Rr(ctx, TK.arm[0] - 0.32, TK.arm[1] - 0.05, 0.64, 0.32, 0.06, "#5D6675", l0 * 0.8);
    Cc(ctx, TK.arm[0], TK.arm[1], 0.2, "#7C8696", l0 * 0.8);
    ctx.restore();
  }
  // The telehandler (origin on the ground between the axles, facing +x): body, and the boom with the muck fork.
  var TELE = { pivot: [-1.5, -2.05], len: 3.9 };
  function teleBody(ctx, st) { D.telehandler(ctx, st); }
  function teleEnd(a, ext) { var len = TELE.len + (ext || 0); return [TELE.pivot[0] + Math.cos(a) * len, TELE.pivot[1] + Math.sin(a) * len]; }
  // st = { a (boom angle, + down), ext (m), curl (fork angle, + tips down), load (0..1 muck on the fork), grip }
  function teleBoom(ctx, st) {
    var T = "#F2B33A", TD = "#C98A1A", l0 = LW(), a = st.a || 0, c = Math.cos(a), s = Math.sin(a);
    var p = TELE.pivot, e = teleEnd(a, st.ext), m = [p[0] + c * 3.3, p[1] + s * 3.3];
    tube(ctx, 0.35, -1.35, p[0] + c * 1.9, p[1] + s * 1.9 + 0.18, 0.13, G.steel);
    tube(ctx, m[0] - c * 0.4, m[1] - s * 0.4, e[0], e[1], 0.26, TD);
    tube(ctx, p[0], p[1], m[0], m[1], 0.42, T);
    shine(ctx, p[0] + c * 0.3, p[1] + s * 0.3 - 0.1, m[0] - c * 0.2, m[1] - s * 0.2 - 0.1, 0.06);
    Cc(ctx, p[0], p[1], 0.16, "#7C8696", l0);
    ctx.save(); ctx.translate(e[0], e[1]); ctx.rotate(st.curl || 0);
    // the muck fork: a carriage, long tines, and the grab jaws that close on top
    Rr(ctx, -0.12, -0.42, 0.26, 0.92, 0.05, "#5D6675", l0 * 0.8);
    if (st.load > 0.02) muckMound(ctx, 0.2, 1.5, 0.4, 0.15 + st.load * 0.5, 7);
    tube(ctx, 0.08, 0.42, 1.55, 0.4, 0.08, "#C3CCD6");
    Ln(ctx, 1.5, 0.4, 1.62, 0.3, INK, 0.08);
    var j = 0.25 + (1 - clamp(st.grip || 0, 0, 1)) * 0.55;
    ctx.save(); ctx.translate(0.05, -0.38); ctx.rotate(-j + 0.25);
    tube(ctx, 0, 0, 1.3, 0.2, 0.09, "#5D6675");
    for (var i = 0; i < 3; i++) Ln(ctx, 0.5 + i * 0.35, 0.15, 0.55 + i * 0.35, 0.36, INK, 0.06);
    ctx.restore();
    Cc(ctx, 0, 0, 0.08, "#C3CCD6", l0 * 0.6);
    ctx.restore();
  }
  // A cow (black and white), origin at its feet in the middle, facing +x. ph = head bob phase.
  function cow(ctx, ph, time) { D.cow(ctx, { ph: ph, graze: true, time: time }); }

  // =====================================================================================================
  // Machine state
  // =====================================================================================================
  var heap = { V: 0.45, tgt: 0.45, steam: 0 };
  var floorMuck = { b: BX1, clean: BX1 };          // muck on the passage floor from HX1 to clean
  var scr = { x: SCR_START + 8, v: 0, wheel: 0, st: "away", t: 0, roll: 0, tip: 0, lift: 1 };
  var tele = { x: TX, d: 0, dir: 1, a: 0.25, ext: 0, curl: -0.1, load: 0, grip: 0, wheel: 0, st: "idle", t: 0, n: 0 };
  var rig = { x: EYE, v: 0, wheel: 0, st: "park", load: 0, beat: 0, door: 0, spray: 0, arm: 0, fillT: -1, flow: 0, burp: 0 };
  var field = { stage: "hungry", from: "muck", g: 0, wipe: null };

  function fieldPaint(sc, part, P) {
    var rows = part === "near" ? sc.rowsNear : sc.rowsFar, w = P.wipe, near = part === "near";
    if (sc.X(0, 1) > sc.W + 40 && sc.X(L, 1) > sc.W + 40) return;
    if (sc.X(L, 3) < -40 && sc.X(L, 1) < -40) return;
    function run(stage, xa, xb) {
      if (xb - xa < 0.01) return;
      ctx.save(); sc.clipX(ctx, xa, xb);
      for (var i = 0; i < rows.length; i++) paintRow(sc, rows[i], stage, P, xa, xb, near);
      ctx.restore();
    }
    if (!w) run(P.stage, 0, L);
    else { var bx = clamp(w.bx, 0, L); run(P.stage, 0, bx); run(w.to, bx, L); }
    if (part === "far") {
      ctx.save(); ctx.strokeStyle = "rgba(61,90,40,0.55)"; ctx.lineWidth = Math.max(1.5, sc.lw);
      [0, L].forEach(function (x) { ctx.beginPath(); ctx.moveTo(sc.X(x, sc.rH), sc.Y(sc.rH)); ctx.lineTo(sc.X(x, 1), sc.gY); ctx.lineTo(sc.X(x, sc.rN), sc.Y(sc.rN)); ctx.stroke(); });
      ctx.restore();
    }
  }

  // ---------- Loop ----------
  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
    if (!(window.Toybox && Toybox.timer.phase() === "resting")) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  function onEnding(done) { ending = true; auto = false; grab = null; rig.v = 0; scr.v = 0; setTimeout(function () { snd.engine(-1); snd.soil(0); snd.pour(0); done(); }, 2600); }
  function onWake() { ending = false; dusk = 0; }

  // ---------- Start ----------
  showSteps();
  resize();
  bringIn(firstStep());
  if (job === "muck") scr.x = SCR_START + 5;
  follow(0, true);
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  else window.addEventListener("resize", resize);

  Toybox.init({
    app: "farm",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the machines stop and park, and the controls lock. The timer carries on across the farm pages.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "Soft engine and splatty sounds. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: onWake,
    onWake: onWake,
    onSound: function (on) { if (on) snd.chime(); }
  });
  requestAnimationFrame(loop);

  if (/[?&]debug\b/.test(location.search)) window.__farm = {
    state: function () { return { phase: phase, step: stepId, cur: steps.current(), finished: steps.finished(), job: job, rig: rig.st, x: rig.x, load: rig.load, scr: scr.st, tele: tele.st, heap: heap.V, field: field.stage, loads: loads, coach: coach.text(), split: split, parts: parts.length }; },
    screen: function (id) { return partScreen(id || stepId); },
    surprise: surprise,
    ghost: function () { return ghost.show(); }
  };
})();
</script>
</body>
