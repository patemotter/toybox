}

}
:root[data-theme="dark"] { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }

  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;

}

@media (prefers-reduced-motion: reduce) { .loads.pop { animation: none; } }

<script>
(function () {
  "use strict";
  // Munchy Crunchy: the carrot harvest, the way the episode shows it. The field is full of carrots in beds,
  // their feathery green tops in rows. Three jobs, one tap each:
  //   Top:   the topper's flails spin and chop the green tops off; the tops fly out into a row.
  //   Lift:  the carrot harvester's share runs under the bed and loosens it; the carrots ride up the belt and
  //          the side elevator into the big wooden crates on the trailer that drives alongside.
  //   Stack: the trailer drives to the packhouse and the forklift stacks the crates of bright orange carrots.
  // A giant wonky carrot comes up once per harvest: tap it and it goes to the pony at the field edge.
  // The stage is split like Spuds in Mud: the field with the whole rig (the farm's shared side view) and a
  // close-up below (or beside) that cuts through the bed, so he sees the carrots in the soil, the flails and
  // the belt; at the end the close-up is the inside of the packhouse.
  // Machine drawings live here for now, written like farm.js's (machine units = metres, y up negative, origin
  // at the hitch pin / drawbar eye with the ground at y = +0.5, facing +x) so they can move into farm.js later.
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.u, clamp = U.clamp, lerp = U.lerp, ease = U.ease, hash = U.hash, mix = U.mix, INK = U.INK;
  var D = Farm.draw, SH = Farm.shape, snd = Farm.sound, TAU = Math.PI * 2;
  var P = SH.P, R = SH.R, C = SH.C, Ln = SH.Ln, tube = SH.tube, fs = SH.fs, rr = SH.rr;
  var NAME = (Farm.NAMES && Farm.NAMES.carrots) || "Munchy Crunchy";
  document.title = NAME; $("title").textContent = NAME;
  function LWu() { return Farm.LW; }

  // ---------- State ----------
  var KEY = "farm-carrots-v1";
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  if (startFresh) saved = {};
  var count = typeof saved.crates === "number" && isFinite(saved.crates) ? Math.max(0, saved.crates) : 0;
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ crates: count })); } catch (e) { /* ignore */ } }
  function world(fn) { try { Farm.world.update(fn); } catch (e) { /* ignore */ } }
  if (startFresh) world(function (w) { w.carrots = "grown"; });

  var L = 24, STORE_X = L + 22, VPASS = 5.2, TR_FAR = 1.7, PONY_X = L + 2.2, PONY_R = 0.86, SP = 0.26;
  var ORANGE = "#F5841F", ORANGE_D = "#C95F0E", ORANGE_L = "#FFB060";
  var G = { body: "#3E9F3A", grey: "#7C8696", steel: "#C3CCD6", frame: "#2B3040" };
  // the machines: len = metres behind the hitch / drawbar, work = where it works (the rotor, the share)
  var MCH = {
    topper: { name: "Topper", len: 2.65, work: 1.35, trailed: false, front: true },
    harvester: { name: "Carrot harvester", len: 7.8, work: 2.2, trailed: true, pivot: [-6.35, -2.6] }
  };
  // The steps. go = the Go pill (what will happen), ready = the coach while it waits for him, work = the coach
  // while the machine works, busy = when he taps while it works, span = metres the field view shows (whole rig).
  var JOBS = {
    top: { m: "topper", to: "topped", go: "Top them", step: "Top", tag: "Topper", span: 11.5,
      ready: "The topper cuts off the tops.", work: "The flails chop off the green tops.", busy: "The topper is cutting the tops." },
    lift: { m: "harvester", to: "lifted", go: "Lift them", step: "Lift", tag: "Carrot harvester", span: 17.5,
      ready: "Now lift the carrots.", work: "The carrots ride up the belt.", busy: "The harvester is lifting carrots." },
    stack: { go: "Stack them", step: "Stack", tag: "Forklift", span: 22,
      ready: "The forklift stacks the crates.", work: "The forklift takes the crates in.", busy: "The forklift is stacking." }
  };
  var ORDER = ["top", "lift", "stack"];
  var w0 = Farm.world.get();
  var field = { stage: w0.carrots === "topped" ? "topped" : "grown", g: 1, wipe: null };
  var job = field.stage === "topped" ? "lift" : "top";
  var rig = { m: null, x: -20, v: 0, wheel: 0, out: 0, flash: 0 };
  var tr = { x: -60, r: TR_FAR, v: 0, wheel: 0, crates: [0, 0, 0], slot: 0, state: "away", t: 0, lane: 0 };
  var phase = "arrive", phaseT = 0, auto = false, grab = null, ending = false, dusk = 0;
  var hare = null, jam = null, wonky = null, fly = null, pony = { eat: 0, nod: 0, t: 0, fed: 0 };
  var fk = { t: 0, i: 0, done: false };            // the forklift's stacking run
  var shedBase = Math.min(count, 6);               // full crates already in the packhouse when this load arrives

  function trailed() { return rig.m && MCH[rig.m].trailed; }
  // The topper rides on the tractor's front linkage (FRONT m ahead of the rear axle, facing forward), so the
  // tall tops are seen going into it; the harvester is trailed behind.
  var FRONT = 4.25, RX = 1.35;
  function front() { return rig.m && MCH[rig.m].front; }
  function hitchOff() { return trailed() ? -Farm.DRAWBAR[0] : -Farm.HITCH[0]; }
  function originX() { return front() ? rig.x + FRONT : rig.x - hitchOff(); }   // world x of the machine's origin
  function workX() { return front() ? originX() + MCH[rig.m].work : originX() - MCH[rig.m].work; }
  function rearX() { return front() ? rig.x - 1.3 : originX() - MCH[rig.m].len; }
  function frontX() { return front() ? originX() + MCH[rig.m].len : rig.x + 4.3; }
  function startX(m) { return m.front ? -0.8 - m.work - FRONT : -0.8 + (m.trailed ? -Farm.DRAWBAR[0] : -Farm.HITCH[0]) + m.work; }
  function locked() { return ending || (window.Toybox && Toybox.timer.locked()); }
  function progress() { if (phase === "drive") return clamp(workX() / L, 0, 1); return phase === "leave" || phase === "out" ? 1 : 0; }
  function working() { return phase === "drive" && rig.v > 0.3 && !jam; }

  // ---------- The stage: the field view and the close-up ----------
  var zoom = { span: 11.5, target: 11.5 };
  var sc = new Farm.Scene({ L: L, xmin: -16, xmax: STORE_X + 9, rowDz: 1.4, fit: function (w, h) { return Math.min(w * 0.92 / zoom.span, h * 0.42 / 3.6); } });
  var parts = new Farm.Particles();
  var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
  var W = 300, H = 300, DPR = 1, time = 0;
  var RG = { f: { x: 0, y: 0, w: 300, h: 150 }, c: { x: 0, y: 150, w: 300, h: 150 }, side: false, pad: 8 };
  var phoneCoach = window.matchMedia ? matchMedia("(max-width: 600px), (orientation: landscape) and (max-height: 520px)") : null;
  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(50, r.width); H = Math.max(50, r.height);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    RG.side = W / H > 1.4;
    if (RG.side) { var fw = Math.round(W * 0.56); RG.f = { x: 0, y: 0, w: fw, h: H }; RG.c = { x: fw, y: 0, w: W - fw, h: H }; }
    else { var fh = Math.round(H * 0.52); RG.f = { x: 0, y: 0, w: W, h: fh }; RG.c = { x: 0, y: fh, w: W, h: H - fh }; }
    // On phones the coach pill sits at the bottom of the stage: keep the close-up's story above it.
    RG.pad = phoneCoach && phoneCoach.matches ? 48 : 8;
    sc.layout(RG.f.w, RG.f.h);
    sc.follow(camTarget(), 0, true);
  }
  function setZoom(span, snap) { zoom.target = span; if (snap) { zoom.span = span; sc.layout(RG.f.w, RG.f.h); } }

  // ---------- Coach, counter, name tags ----------
  var coach = Toybox.coach($("coach"));
  function setCount() { var el = $("loads"); el.textContent = "Crates: " + count; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  $("loads").textContent = "Crates: " + count;
  // a point on the machine: dx metres from its origin along the field (+ = ahead), ly in machine units
  function mScreen(dx, ly) { return { x: sc.X(originX(), 1) + dx * sc.k, y: sc.gY + (ly - 0.5) * sc.k }; }
  function tagAt(text, x, y) { var b = cv.getBoundingClientRect(); Toybox.nametag(text, b.left + x, b.top + y, 2400); }
  function tagRig() { if (!rig.m) return; var p = mScreen((front() ? 1 : -1) * MCH[rig.m].len * 0.5, rig.m === "harvester" ? -3.0 : -1.6); tagAt(JOBS[job].tag, p.x, Math.max(26, p.y)); }

  // =====================================================================================================
  // Drawings (machine units)
  // =====================================================================================================
  // a tyre with tread marks that turn, a rim and a hub (rot in radians)
  function tyre(x, y, r, rot, rim) {
    C(ctx, x, y, r, "#33363F");
    ctx.save(); ctx.translate(x, y);
    for (var i = 0; i < 10; i++) { var a = rot + i * TAU / 10; Ln(ctx, Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8, Math.cos(a) * r * 0.98, Math.sin(a) * r * 0.98, "#22242C", r * 0.12); }
    ctx.restore();
    C(ctx, x, y, r * 0.58, rim || "#E2E6EB", LWu() * 0.8);
    C(ctx, x, y, r * 0.22, "#8C97A6", LWu() * 0.6);
    for (i = 0; i < 5; i++) { var b = rot + i * TAU / 5; C(ctx, x + Math.cos(b) * r * 0.38, y + Math.sin(b) * r * 0.38, r * 0.05, "#6E7887", 0); }
  }
  function headstock() {
    P(ctx, [0.06, 0.1, 0.06, -0.86, -0.18, -0.86, -0.46, -0.12, -0.46, 0.1], G.grey);
    C(ctx, 0, 0, 0.07, G.steel, LWu() * 0.7); C(ctx, 0.04, -0.8, 0.07, G.steel, LWu() * 0.7);
  }
  function shine(x1, y1, x2, y2, w) { Ln(ctx, x1, y1, x2, y2, "rgba(255,255,255,0.45)", w); }
  // The topper (mounted on the three-point hitch). A blue hood over a rotor of swinging flails that spins
  // just above the carrots and chops the leaves off; the gauge wheels keep it at the right height.
  var ROTOR = [-1.35, 0.06, 0.4];
  function topper(st) {
    var B = "#2F7FD1", BD = "#215E9E", rot = st.rot || 0;
    tube(ctx, 0.15, -0.42, -0.45, -0.95, 0.1, "#F2C230");          // PTO shaft
    headstock();
    R(ctx, -0.95, -1.18, 0.6, 0.38, 0.06, BD);                       // gearbox
    tube(ctx, -0.65, -0.85, -1.35, -0.6, 0.12, "#4A505E");           // drive down to the rotor
    // hood
    P(ctx, [-0.3, 0.18, -0.3, -0.55, -0.6, -0.86, -2.2, -0.86, -2.48, -0.58, -2.48, 0.16, -2.25, 0.2], B);
    shine(-0.65, -0.78, -2.15, -0.78, 0.06);
    R(ctx, -2.5, -0.92, 2.22, 0.14, 0.05, BD, LWu() * 0.8);
    // the window onto the rotor: the drum and its flails turning
    C(ctx, ROTOR[0], ROTOR[1], ROTOR[2] + 0.04, "#1F3550", LWu() * 0.8);
    ctx.save(); ctx.beginPath(); ctx.arc(ROTOR[0], ROTOR[1], ROTOR[2] + 0.04, 0, TAU); ctx.clip();
    for (var i = 0; i < 8; i++) {
      var a = -rot + i * TAU / 8, ca = Math.cos(a), sa = Math.sin(a);
      Ln(ctx, ROTOR[0] + ca * 0.12, ROTOR[1] + sa * 0.12, ROTOR[0] + ca * ROTOR[2], ROTOR[1] + sa * ROTOR[2], "#C3CCD6", 0.05);
      Ln(ctx, ROTOR[0] + ca * ROTOR[2], ROTOR[1] + sa * ROTOR[2], ROTOR[0] + Math.cos(a + 0.35) * ROTOR[2] * 0.92, ROTOR[1] + Math.sin(a + 0.35) * ROTOR[2] * 0.92, "#E2E6EB", 0.06);
    }
    ctx.restore();
    C(ctx, ROTOR[0], ROTOR[1], 0.13, "#8C97A6", LWu() * 0.8);
    ctx.beginPath(); ctx.arc(ROTOR[0], ROTOR[1], ROTOR[2] + 0.04, 0, TAU); ctx.lineWidth = LWu(); ctx.strokeStyle = INK; ctx.stroke();
    // the rubber flap at the back and the two gauge wheels
    P(ctx, [-2.48, 0.1, -2.62, 0.38, -2.5, 0.4, -2.38, 0.14], "#3A3F4E", LWu() * 0.6);
    tyre(-0.5, 0.3, 0.2, (st.wheel || 0) / 0.2);
    tyre(-2.2, 0.3, 0.2, (st.wheel || 0) / 0.2);
  }
  // The carrot harvester (trailed, beside a trailer). The share runs under the bed and lifts it; the carrots
  // ride up the belt (seen through the side window) to the top, and the side elevator carries them out over
  // the trailer. WEB = the belt's bottom and top ends.
  var WEB = [-3.05, 0.42, -5.2, -1.48];
  function harvester(st) {
    var Rd = "#D9443A", RD = "#A92F27", run = st.run || 0;
    tube(ctx, 0, 0, -2.2, -0.75, 0.14, G.grey);                      // drawbar
    Ln(ctx, -0.55, -0.2, -0.55, 0.42, INK, 0.06);
    tube(ctx, 0.15, -0.42, -2.0, -1.0, 0.1, "#F2C230");              // PTO shaft
    // the share (a steel blade under the bed) and the discs that cut the bed's sides
    P(ctx, [-1.95, 0.86, -2.25, 0.8, -3.1, 0.46, -3.15, 0.56, -2.3, 0.92], G.steel);
    C(ctx, -2.55, 0.22, 0.28, G.steel); C(ctx, -2.55, 0.22, 0.06, G.grey, LWu() * 0.6);
    // body
    P(ctx, [-2.4, 0.3, -2.45, -0.32, -3.1, -0.9, -5.3, -2.28, -7.5, -2.28, -7.8, -1.4, -7.5, -0.55, -6.4, -0.22, -3.3, 0.4], Rd);
    shine(-3.15, -0.82, -5.25, -2.14, 0.07); shine(-5.5, -2.18, -7.35, -2.18, 0.07);
    // window onto the belt
    var wx0 = WEB[0], wy0 = WEB[1], wx1 = WEB[2], wy1 = WEB[3];
    ctx.save();
    P(ctx, [wx0 + 0.12, wy0 - 0.3, wx1 + 0.12, wy1 - 0.3, wx1 - 0.18, wy1 + 0.18, wx0 - 0.14, wy0 + 0.12], "#4A2E1E", LWu() * 0.7);
    ctx.clip();
    for (var i = 0; i < 14; i++) {
      var f = ((i / 14 + run * 0.09) % 1 + 1) % 1, x = lerp(wx0, wx1, f), y = lerp(wy0, wy1, f);
      Ln(ctx, x - 0.05, y - 0.16, x + 0.08, y + 0.1, "#C3CCD6", 0.035);
      if (st.work && st.busy !== false && hash(i, Math.floor(run * 0.09 + i / 14)) > 0.45) carrotSide(x + 0.02, y - 0.1, 0.32, 0.07, -0.65, i);
    }
    ctx.restore();
    // the top: a cross conveyor under a roof with a rail where the pickers stand
    R(ctx, -7.6, -2.62, 2.6, 0.32, 0.08, RD);
    Ln(ctx, -7.5, -2.62, -7.5, -3.05, INK, 0.05); Ln(ctx, -5.1, -2.62, -5.1, -3.05, INK, 0.05); Ln(ctx, -7.55, -3.05, -5.05, -3.05, INK, 0.05);
    // the big wheel
    tyre(-6.25, -0.15, 0.65, (st.wheel || 0) / 0.65);
    ctx.beginPath(); ctx.arc(-6.25, -0.15, 0.82, -Math.PI + 0.3, -0.3); ctx.arc(-6.25, -0.15, 0.72, -0.3, -Math.PI + 0.3, true); ctx.closePath(); fs(ctx, RD);
    // the side elevator: folded along the top, or swung out (the page draws the swung tube)
    if (!st.out) { R(ctx, -7.4, -2.95, 4.2, 0.24, 0.06, "#5D6675"); C(ctx, MCH.harvester.pivot[0], MCH.harvester.pivot[1] - 0.25, 0.14, "#5D6675"); }
    else C(ctx, MCH.harvester.pivot[0], MCH.harvester.pivot[1], 0.16, "#5D6675");
  }
  // A carrot lying along an angle (side view, machine units): shoulder at (x, y), length len, width w,
  // pointing at angle a (0 = straight down).
  function carrotSide(x, y, len, w, a, k) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    var bend = (hash(k, 3) - 0.5) * w * 0.8;
    ctx.beginPath(); ctx.moveTo(-w, 0); ctx.quadraticCurveTo(-w * 0.9, len * 0.5, bend, len); ctx.quadraticCurveTo(w * 0.9, len * 0.5, w, 0);
    ctx.quadraticCurveTo(0, -w * 0.5, -w, 0); ctx.closePath(); fs(ctx, ORANGE, LWu() * 0.7);
    ctx.restore();
  }
  // A big wooden crate (bulk box): bottom centre at (cx, yb), load 0..1 (carrots seen between the slats and

  var CRATE_X = [-2.35, -4.4, -6.45], CRATE_W = 1.85, CRATE_H = 1.3, DECK = -1.08;

    return res;
  }
  function fieldFk() { var f = fieldFkState(); return { x: f.x - 1.0 * f.s, y: f.y - 1.4 * f.s }; }

  // ---------- Drawing the field view ----------
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(RG.f.x, RG.f.y);
    ctx.beginPath(); ctx.rect(0, 0, RG.f.w, RG.f.h); ctx.clip();
    drawField();
    ctx.restore();
    drawClose();
    if (fly) drawFly();
  }
  function band(row, col) { ctx.fillStyle = col; ctx.fillRect(0, row.y1 - 0.5, sc.W, row.y0 - row.y1 + 1); }
  function eachX(row, sp, minPx, xa, xb, fn) {
    var rg = sc.xRange(row.rc), a = rg[2], b = rg[3];
    while (a * sp < minPx) sp *= 2;
    var lo = Math.max(rg[0], xa - sp), hi = Math.min(rg[1], xb + sp);
    for (var j = Math.floor(lo / sp); j <= Math.ceil(hi / sp); j++) { var x = (j + hash(j, row.i) * 0.6) * sp; fn(x, a * x + b, j); }
  }
  function lumpRow(row, yb, hp, col, seed) {
    var step = Math.max(5, hp * 0.9), off = sc.cam * sc.k / row.rc;
    ctx.beginPath(); ctx.moveTo(-5, yb);
    for (var x = -5; x <= sc.W + step; x += step) { var q = Math.floor((x + off) / step); ctx.lineTo(x, yb - hp * (0.65 + 0.35 * hash(q, row.i + seed))); }
    ctx.lineTo(sc.W + step, yb); ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    if (hp > 3) { ctx.lineWidth = Math.max(1, Math.min(sc.lw * 0.6, hp * 0.12)); ctx.strokeStyle = mix(col, "#1D2340", 0.35); ctx.stroke(); }
  }
  // The carrot field's painter: beds of carrots in rows. "grown": feathery green tops; "topped": the orange
  // shoulders of the carrots along the beds and the chopped leaves in a row beside each bed; "lifted": loose soil.
  function paint(row, stage, Pp, xa, xb) {
    var s = row.s, odd = row.i & 1, hgt = row.y0 - row.y1, near = row.r0 < 1, t = time, n = sc.night || 0;
    band(row, mix(stage === "lifted" ? (odd ? "#A87A52" : "#A3744C") : (odd ? "#9A6740" : "#94623C"), "#2B3A55", n * 0.4));
    var fine = row.fine && hgt >= 3;
    if (fine) { ctx.fillStyle = mix(stage === "lifted" ? "#7E5434" : "#5A3520", "#2B3A55", n * 0.4); ctx.fillRect(0, row.y0 - hgt * 0.22, sc.W, hgt * 0.22 + 0.5); }
    if (stage === "grown") {
      var g = clamp(Pp.g === undefined ? 1 : Pp.g, 0, 1);
      if (g < 0.03) return;
      var hp = (near ? 0.2 : 0.4) * s * g, yb = row.y0 - hgt * (fine ? 0.2 : 0);
      var col = mix("#5DB040", "#2B3A55", n * 0.5), lt = mix("#9BDB6A", "#2B3A55", n * 0.5);
      if (hp < 2 || !row.fine) { ctx.fillStyle = col; ctx.fillRect(0, yb - Math.max(1, hp) - hgt * 0.2, sc.W, Math.max(1, hp) + hgt * 0.4); return; }
      var step = Math.max(3, Math.min(8, hp * 0.32)), off = sc.cam * sc.k / row.rc;
      ctx.beginPath(); ctx.moveTo(-5, yb);
      for (var x = -5; x <= sc.W + step; x += step) {
        var q = Math.floor((x + off) / step), sw = Math.sin(t * 1.5 + (x + off) * 0.03 + row.i) * hp * 0.07;
        ctx.lineTo(x + sw, yb - hp * (0.78 + 0.3 * hash(q, row.i)));
        ctx.lineTo(x + step * 0.5 + sw, yb - hp * (0.5 + 0.2 * hash(q, row.i + 3)));
      }
      ctx.lineTo(sc.W + step, yb); ctx.closePath();
      ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = Math.max(1, Math.min(sc.lw * 0.6, hp * 0.05)); ctx.strokeStyle = lt; ctx.stroke();
      if (s * 0.05 > 1.4) {
        // feathery sprigs on the near beds
        ctx.strokeStyle = mix("#3E8A2E", "#2B3A55", n * 0.5); ctx.lineWidth = Math.max(1, s * 0.012);
        eachX(row, 0.3, Math.max(6, s * 0.12), xa, xb, function (x2, sx, j) {
          var top = yb - hp * (0.95 + 0.2 * hash(j, row.i + 5)), sw2 = Math.sin(t * 1.5 + (sx + off) * 0.03 + row.i) * hp * 0.07;
          ctx.beginPath(); ctx.moveTo(sx, yb - hp * 0.3); ctx.lineTo(sx + sw2, top);
          ctx.moveTo(sx + sw2 * 0.6, yb - hp * 0.65); ctx.lineTo(sx - hp * 0.12 + sw2, yb - hp * 0.82);
          ctx.moveTo(sx + sw2 * 0.6, yb - hp * 0.6); ctx.lineTo(sx + hp * 0.12 + sw2, yb - hp * 0.78); ctx.stroke();
        });
      }
      return;
    }
    if (!fine) {
      if (stage === "topped") { ctx.fillStyle = "rgba(245,132,31,0.35)"; ctx.fillRect(0, row.y1, sc.W, hgt * 0.4); }
      return;
    }
    if (stage === "topped" && s * 0.04 > 1.0) {
      // the orange tops of the carrots along the bed
      eachX(row, 0.2, Math.max(3.5, s * 0.06), xa, xb, function (x2, sx, j) {
        var z = s * 0.035, y = row.y1 + hgt * (0.4 + 0.15 * hash(j, 6));
        ctx.beginPath(); ctx.ellipse(sx, y, z * 1.2, z * 0.8, 0, 0, TAU); ctx.fillStyle = ORANGE; ctx.fill();
        if (z > 2.2) { ctx.lineWidth = Math.max(0.8, sc.lw * 0.4); ctx.strokeStyle = INK; ctx.stroke(); ctx.fillStyle = "#6CC65C"; ctx.fillRect(sx - z * 0.25, y - z * 1.4, z * 0.5, z * 0.7); }
      });
    }
    // the chopped leaves lie in a row beside each bed
    lumpRow(row, row.y0 - hgt * 0.06, Math.max(1.5, Math.min(hgt * 0.45, 0.16 * s)), mix(stage === "lifted" ? "#8FA84A" : "#5FA83E", "#2B3A55", n * 0.4), 5);
  }
  function fieldPart(part, Pp) {
    var rows = part === "near" ? sc.rowsNear : sc.rowsFar, w = Pp.wipe;
    function run(stg, xa, xb) {
      if (xb - xa < 0.01) return;
      ctx.save(); sc.clipX(ctx, xa, xb);
      for (var i = 0; i < rows.length; i++) paint(rows[i], stg, Pp, xa, xb);
      ctx.restore();
    }
    if (!w) run(Pp.stage, 0, L);
    else { run(w.to, 0, clamp(w.bx, 0, L)); run(Pp.stage, clamp(w.bx, 0, L), L); }
    if (w && w.bx > 0 && w.bx < L && w.to === "topped") {
      ctx.save(); ctx.strokeStyle = "rgba(60,30,15,0.6)"; ctx.lineWidth = Math.max(2, sc.lw * 1.1); ctx.lineCap = "round";
      var r0 = part === "near" ? sc.rN : 1, r1 = part === "near" ? 1 : sc.rH;
      ctx.beginPath(); ctx.moveTo(sc.X(w.bx, r0), sc.Y(r0)); ctx.lineTo(sc.X(w.bx, r1), sc.Y(r1)); ctx.stroke(); ctx.restore();
    }
    if (part === "far") {
      ctx.save(); ctx.strokeStyle = "rgba(61,90,40,0.55)"; ctx.lineWidth = Math.max(1.5, sc.lw);
      [0, L].forEach(function (x) { ctx.beginPath(); ctx.moveTo(sc.X(x, sc.rH), sc.Y(sc.rH)); ctx.lineTo(sc.X(x, 1), sc.gY); ctx.lineTo(sc.X(x, sc.rN), sc.Y(sc.rN)); ctx.stroke(); });
      ctx.restore();
    }
  }
  function drawField() {
    var season = "autumn";
    sc.sky(ctx, { time: time, arc: phase === "grow" ? clamp(phaseT / 3.2, 0, 1) : null, season: season, dusk: dusk });
    sc.hedge(ctx, { season: season });
    var Pp = { stage: field.stage, g: field.g, wipe: field.wipe };
    fieldPart("far", Pp);
    parts.draw(ctx, sc, function (p) { return p.r > 1.0; });
    if (tr.state !== "away" && tr.r > 1) drawTrailer();
    if (rig.m) drawRig();
    if (rig.m === "harvester" && rig.out > 0.01 && tr.r > 1) drawElevator();
    fieldPart("near", Pp);
    drawHare();
    parts.draw(ctx, sc, function (p) { return p.r <= 1.0 && p.r > sc.TRACK + 0.03; });
    sc.verge(ctx, {});
    sc.put(ctx, STORE_X, 1.02, 1, function () { packhouse(shedBase + (fk.done ? 3 : (phase === "stack" ? fk.i : 0))); });
    drawPony();
    drawFieldFk();
    if (tr.state !== "away" && tr.r <= 1) drawTrailer();
    parts.draw(ctx, sc, function (p) { return p.r <= sc.TRACK + 0.03; });
  }
  function drawRig() {
    var m = rig.m, tl = trailed();
    var st = { wheel: rig.wheel, time: time, work: working() ? 1 : 0, rot: rigRun * 7, run: rigRun * 2, out: m === "harvester" && rig.out > 0.01 };
    sc.put(ctx, rig.x, 1, 1, function () { rigUnits(st); });
    if (Math.random() < 0.12) parts.add({ kind: "puff", x: rig.x + 1.33, h: 3.45, r: 1, vx: -0.6 - rig.v * 0.5, vh: 1.2, life: 1.2, size: 0.1, grow: 0.35, col: "#8A8FA0", alpha: 0.3 });
  }
  function drawElevator() {
    var sp = elevSpout(), u = rig.out, wk = working();
    D.boom(ctx, sp.px, sp.py, sp.x, sp.y, 0.4 * sc.k, lerp(0.4, 0.5, u) * sc.k, rigRun * 2.5, "belt-empty", sc.lw);
    var lw = Math.max(1, sc.lw * 0.5);
    if (wk && u > 0.9) {
      // carrots riding the elevator and dropping into the crate
      var n = 6, i;
      for (i = 0; i < n; i++) {
        var f = ((rigRun * 1.6 + i / n) % 1), x = lerp(sp.px, sp.x, f), y = lerp(sp.py, sp.y, f) - 0.2 * sc.k;
        miniCarrot(x, y, 0.3 * sc.k, -1.2, lw);
      }
      var t = trScreen(), yb = crateScreen(clamp(Math.round(tr.slotF), 0, 2)).y + 0.35 * t.s;
      for (i = 0; i < 4; i++) { var g = ((time * 2.4 + i / 4) % 1); miniCarrot(sp.x + Math.sin(i * 2.1) * 0.1 * sc.k, lerp(sp.y + 0.3 * sc.k, yb, g * g), 0.3 * sc.k, 0.6 + i, lw); }
    }
  }
  function miniCarrot(x, y, len, a, lw) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(-len * 0.2, 0); ctx.lineTo(len * 0.2, 0); ctx.lineTo(0, len); ctx.closePath();
    ctx.fillStyle = ORANGE; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore();
  }
  function drawTrailer() {
    var t = trScreen();
    Farm.inUnits(ctx, t.x, t.y, t.s, sc.lw, function () {
      ctx.translate(0, -0.5);
      crateTrailer({ wheel: tr.wheel, crates: tr.crates });
      ctx.translate(-Farm.DRAWBAR[0], 0.5);
      D.tractor(ctx, { wheel: tr.wheel, time: time, drawbar: true });
    });
  }
  function drawFieldFk() {
    var F = fieldFkState();
    if (!F.show) return;
    var dx = sc.X(STORE_X + DOOR[0], 1.02);
    ctx.save();
    if (F.x > dx) { ctx.beginPath(); ctx.rect(0, 0, sc.X(STORE_X + DOOR[1], 1.02) + 2, sc.H); ctx.rect(0, 0, dx, sc.H); ctx.clip(); }
    Farm.inUnits(ctx, F.x, F.y, F.s, sc.lw, function () { ctx.scale(-1, 1); forklift({ lift: F.lift, load: F.load, wheel: F.x / F.s }); });
    ctx.restore();
  }
  function ponyScreen() { return { x: sc.X(PONY_X, PONY_R), y: sc.Y(PONY_R) - 1.0 * sc.S(PONY_R) }; }
  function drawPony() {
    var x0 = sc.X(PONY_X - 2.2, PONY_R);
    if (x0 > RG.f.w + 40 || sc.X(PONY_X + 3, PONY_R) < -40) return;
    sc.put(ctx, PONY_X, PONY_R, 1, function () {
      fence(-2.2, 2.6);
      ponyDraw({ time: time, eat: pony.eat > 0 ? Math.min(1, pony.eat * 2, (4.5 - pony.eat) * 3) : 0, nod: pony.nod, walk: 0 });
      ctx.save(); ctx.translate(1.25, 0); trough();
      if (pony.eat > 0.3) { var k = clamp(pony.eat / 4.5, 0, 1); ctx.save(); ctx.translate(-0.1, -0.45); ctx.scale(k, k); carrotSide(0, 0, 0.6, 0.14, -Math.PI / 2 + 0.2, 4); ctx.restore(); }
      ctx.restore();
    });
    if (pony.eat > 0.3 && Math.random() < 0.15) { var tq = troughScreen(); parts.add({ kind: "dot", x: sc.wx(tq.x, PONY_R) + (Math.random() - 0.5) * 0.4, h: 0.6, r: PONY_R, vx: (Math.random() - 0.5) * 1.5, vh: 1.2, g: 6, life: 0.5, size: 0.04, col: ORANGE }); }
  }
  function drawFly() {
    var f = clamp(fly.t / fly.dur, 0, 1), e = ease(f);
    var x = lerp(fly.x0, fly.x1, e), y = lerp(fly.y0, fly.y1, e) - Math.sin(f * Math.PI) * Math.min(H * 0.25, 160);
    var u = lerp(CL.u * 0.8, sc.S(PONY_R) * 1.0, e);
    wonkyPx(x, y, u, f * 6, 2);
  }
  var HARE_R = 0.92;
  function drawHare() {
    if (!hare) return;
    var t = hare.t, x, ph = t * 2.4, s = sc.S(HARE_R), flip = false;
    var stopAt = 2.2, eatT = 3.4;
    if (t < stopAt) x = lerp(hare.x0, hare.stop, ease(t / stopAt));
    else if (t < stopAt + eatT) { x = hare.stop; ph = 0.1; }
    else x = lerp(hare.stop, hare.x1, ease((t - stopAt - eatT) / 3));
    var sx = sc.X(x, HARE_R), sy = sc.Y(HARE_R);
    D.hare(ctx, sx, sy, s * 1.7, ph, flip);
    if (t > stopAt && t < stopAt + eatT) {
      // nibbling: a few bits of leaf fly
      if (Math.random() < 0.1) parts.add({ kind: "chunk", x: x + 0.5, h: 0.4, r: HARE_R, vx: (Math.random() - 0.5), vh: 1, g: 5, life: 0.6, size: 0.05, col: "#5DB040" });
    }
  }

  // ---------- Loop ----------
  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
    if (!(window.Toybox && Toybox.timer.phase() === "resting")) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  function onEnding(done) { ending = true; auto = false; grab = null; rig.v = 0; setTimeout(function () { snd.engine(-1); snd.soil(0); snd.pour(0); done(); }, 2600); }
  function onWake() { ending = false; dusk = 0; }

  // ---------- Start ----------
  resize();
  bringIn(job);
  setZoom(JOBS[job].span, true);
  var v0 = VIEW[cview]; ccam.cx = v0.cx; ccam.hw = v0.hw; ccam.up = v0.up; ccam.dn = v0.dn;
  if (phase === "arrive") { rig.x = rig.target - 7; }
  sc.follow(camTarget(), 0, true);
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  else window.addEventListener("resize", resize);

  Toybox.init({
    app: "farm",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the tractor stops and parks, and the controls lock. The timer carries on across the farm pages.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "Soft engine and soil sounds. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: onWake,
    onWake: onWake,
    onSound: function (on) { if (on) snd.chime(); }
  });
  requestAnimationFrame(loop);

  if (/[?&]debug\b/.test(location.search)) window.__farm = {
    state: function () { return { phase: phase, job: job, step: steps.current(), finished: steps.finished(), x: rig.x, m: rig.m, field: field.stage, trailer: tr.state, crates: tr.crates.slice(), count: count, jam: !!jam, wonky: wonky ? wonky.s : null, pony: pony.fed, coach: coach.text(), fk: fk.i, shed: shed.v }; },
    screen: function (id) {
      var b = cv.getBoundingClientRect(), p;
      if (id === "jam") p = jamScreen();
      else if (id === "wonky") p = wonkyScreen();
      else if (id === "fork") p = fkScreen();
      else if (id === "close") p = closeMachinePart();
      else p = rigPart();
      return { x: b.left + p.x, y: b.top + p.y };
    },
    surprise: surprise,
    ghost: function () { return ghost.show(); }
  };
})();
</script>
