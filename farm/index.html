<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Farm">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<script src="farm.js"></script>
<style>
:root {
  --bg: #CDE9FF; --panel: #FFFFFF; --ink: #1D2340; --muted: #4A5578; --edge: #1D2340; --accent: #FFC93C; --plate: #F4FAFF; --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.tb-head a { text-decoration: none; }
.stage { background: #A9DCFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
.loads { font-variant-numeric: tabular-nums; }
.loads.pop { animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel { display: none; }
body.ending .tb-panel, body.ending .homebtn, body.ending .mapbtn { pointer-events: none; opacity: 0.4; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
.tb-place-label { font-size: 1.1rem; }
@media (prefers-reduced-motion: reduce) { .loads.pop { animation: none; } }
</style>
</head>
<body>
<div class="tb-app-shell tb-v2 wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Farm</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="The farm: a wheat field with a combine harvester and the grain store, and a potato field with a tractor and the potato store."></canvas>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var D = Farm.draw, U = Farm.u;
  var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
  var W = 300, H = 300, DPR = 1, time = 0, dusk = 0, ending = false;
  // Two fields drawn as one landscape: the wheat field at the back (with the grain store), the potato field in
  // front (with the potato store). Each is a whole place to tap (Toybox.map), read live from farm-world-v1.
  function viewM() { return W < H ? 19 : 32; }
  function fit(w) { return w / viewM(); }
  var A = new Farm.Scene({ L: 10, fit: fit, xmin: -100, xmax: 100 });
  var B = new Farm.Scene({ L: 10, fit: fit, xmin: -100, xmax: 100, rowDz: 0.9 });
  var hA = 0, hB = 0, world = Farm.world.get(), V = 20, STX = 0, MX = 0;
  var NEXT = { soil: "bedformer", harvested: "bedformer", beds: "destoner", destoned: "planter", planted: "planter", grown: "harvester" };

  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(50, r.width); H = Math.max(50, r.height);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    V = viewM();
    hA = Math.round(H * 0.52);
    // each field: the field from the left edge, its store at the right, the machine on the near strip
    var port = W < H, left = 3;
    A.L = B.L = left + (port ? V - 7 : V - 11.5); STX = left + (port ? V - 1.2 : V - 5.2); MX = left + (port ? 4.2 : 0.3 * V);
    A.layout(W, hA);
    hB = H - hA; B.layout(W, hB); var fr = B.Y(B.rH) / hB;
    hB = Math.ceil((H - hA) / (1 - fr) + B.B * 0.1); B.layout(W, hB);
    A.cam = B.cam = V / 2 + left;
    if (mp) mp.layout();
  }
  function offB() { return hA - B.Y(B.rH) + B.B * 0.08; }
  function draw() {
    world = Farm.world.get();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var season = world.season === "autumn" ? "autumn" : "summer";
    // the wheat field, the combine, the grain store
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, hA + 2); ctx.clip();
    A.sky(ctx, { time: time, season: season, dusk: dusk });
    A.hedge(ctx, { season: season });
    var PA = { crop: "wheat", stage: world.wheat === "golden" ? "golden" : "stubble", time: time };
    A.field(ctx, "far", PA);
    A.put(ctx, MX + 2.2, 1, 1, function () { D.combine(ctx, { time: time, reel: time * 0.8, tank: 0.3, wheel: 0 }); });
    A.field(ctx, "near", PA);
    A.verge(ctx, {});
    A.store(ctx, Math.min(1.1, world.grain / 8), { x: STX, kind: "grain", time: time });
    ctx.restore();
    // the potato field in front, its machine and the potato store
    ctx.save(); ctx.beginPath(); ctx.rect(0, hA, W, H - hA); ctx.clip();
    ctx.fillStyle = "#82C257"; ctx.fillRect(0, hA, W, H - hA);
    ctx.translate(0, offB());
    B.hedge(ctx, { season: season });
    var st = world.spuds, PB = { crop: "spuds", stage: st === "grown" ? "grow" : st, g: 1, time: time };
    B.field(ctx, "far", PB);
    var m = NEXT[st] || "bedformer", trl = Farm.MACHINES[m].trailed, bx = MX + (trl ? 3.6 : 1.6);
    B.put(ctx, bx, 1, 1, function () {
      ctx.save(); ctx.translate(trl ? Farm.DRAWBAR[0] : Farm.HITCH[0], trl ? Farm.DRAWBAR[1] : Farm.HITCH[1]);
      D[m](ctx, { time: time, wheel: 0, level: 1 }); ctx.restore();
      D.tractor(ctx, { time: time, hitch: trl ? null : { lift: 0.6 }, drawbar: trl });
    });
    B.field(ctx, "near", PB);
    B.verge(ctx, {});
    B.store(ctx, Math.min(1.1, world.potatoes / 8), { x: STX, kind: "potato", time: time });
    ctx.restore();
    // the hedge line between the two fields
    ctx.fillStyle = "rgba(29,35,64,0.12)"; ctx.fillRect(0, hA, W, 3);
    if (dusk > 0) { ctx.fillStyle = "rgba(20,24,60," + (dusk * 0.4) + ")"; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- The places ----------
  var mp = null, going = false;
  mp = Toybox.map({
    stage: stage,
    places: [
      { href: "combine.html", name: Farm.NAMES.combine, pic: Farm.pic("combine"), rect: function () { return [0, 0, W, hA]; } },
      { href: "spuds.html", name: Farm.NAMES.spuds, pic: Farm.pic("harvester"), rect: function () { return [0, hA, W, H - hA]; } }
    ],
    onPress: function () { going = true; Farm.sound.horn(); if (ghost) ghost.learned("map"); }
  });
  var ghost = Toybox.ghost({
    max: 2,
    plan: function () {
      if (going) return null;
      var b = stage.getBoundingClientRect();
      return { pts: [[b.left + W * 0.45, b.top + hA * 0.7]], tap: true, key: "map" };
    }
  });

  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
    time += dt;
    if (ending) dusk = Math.min(1, dusk + dt * 0.4);
    if (!(window.Toybox && Toybox.timer.phase() === "resting")) draw();
    requestAnimationFrame(loop);
  }
  resize();
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  else window.addEventListener("resize", resize);

  Toybox.init({
    app: "farm",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the sun sets over the farm and the controls lock. The timer keeps going on every Farm page.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "Soft tractor sounds. Hold for 2 seconds.",
    onEnding: function (done) { ending = true; setTimeout(done, U.reduceMotion ? 600 : 3000); },
    onWake: function () { ending = false; dusk = 0; },
    onBig: function () { setTimeout(resize, 30); },
    onSound: function (on) { if (on) Farm.sound.chime(); }
  });
  requestAnimationFrame(loop);

  if (/[?&]debug\b/.test(location.search)) window.__farmMap = { world: function () { return Farm.world.get(); } };
})();
</script>
</body>
</html>
