<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Farm">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<script src="farm.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }
.scene { background: #9AD36B; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
/* The one station: a big green "go" button at the front of its lot (the lot itself is tappable too). */
.sbtn {
  position: absolute; left: 0; top: 0; z-index: 2; transform: translate(-50%, -50%);
  display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; text-decoration: none;
  color: #FFFFFF; background: #2EA05A; border-color: #1D2340; box-shadow: 5px 5px 0 #1D2340;
  font-size: clamp(1.3rem, 3vw, 1.9rem); font-weight: 800; line-height: 1; min-height: 76px;
  padding: 0.3rem 0.9rem 0.3rem 0.4rem; border-width: 4px; border-radius: 24px;
}
.sbtn:active { transform: translate(-50%, -50%) translate(3px, 3px); box-shadow: 0 0 0 #1D2340; }
.sbtn canvas { width: 3.4em; height: 2.25em; flex: none; display: block; pointer-events: none; background: #E8F4FF; border: 3px solid #1D2340; border-radius: 14px; }
.sbtn span { pointer-events: none; padding-top: 0.12em; }
.sbtn svg { width: 1.1em; height: 1.1em; flex: none; fill: #FFFFFF; stroke: #1D2340; stroke-width: 2.5; stroke-linejoin: round; pointer-events: none; }
body.ending .sbtn, body.ending .homebtn { pointer-events: none; opacity: 0.4; }
body.big .tb-head > :not(.bigtoggle) { display: none; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
@media (max-width: 600px), (orientation: landscape) and (max-height: 520px) {
  .sbtn { min-height: 66px; border-width: 3px; box-shadow: 4px 4px 0 #1D2340; padding: 0.2rem 0.7rem 0.2rem 0.3rem; gap: 8px; }
}
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Farm</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>
  <div class="tb-body">
    <main class="tb-stage scene" id="stage">
      <canvas id="cv" role="img" aria-label="The farm: the farmyard with the barn and the silo, sheep and cows, and the field with the green tractor"></canvas>
      <a class="btn sbtn" id="fieldBtn" href="field.html"><canvas id="fieldIcon" width="150" height="100" aria-hidden="true"></canvas><span>It's Sow Time</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5 19 12 7 19.5z"/></svg></a>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.util, clamp = U.clamp, lerp = U.lerp;
  var reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  function rand(a, b) { return a + Math.random() * (b - a); }
  var LEN = 1400, FKEY = "farm-field-v1";

  // A fresh visit puts the field back to stubble (the stores are kept).
  if (Toybox.fresh()) {
    try { localStorage.removeItem(FKEY); } catch (e) { /* ignore */ }
    Farm.world.resetField();
  }
  function fieldState() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(FKEY) || "null"); } catch (e) { s = null; }
    s = s && typeof s === "object" ? s : {};
    return { imp: Farm.IMPLEMENTS[s.imp] ? s.imp : "plow", tracks: !!s.tracks };
  }
  var W = Farm.world.get(), F = fieldState();

  var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage"), btn = $("fieldBtn");
  var Wd = 1, Ht = 1, dpr = 1, L = null;
  function layout() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (w < 10 || h < 10) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    Wd = w; Ht = h; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    var hy = clamp(h * 0.24, 56, 200), wide = w > h * 1.15, lot, yard;
    if (wide) {
      yard = { x: 0, y: hy, w: w * 0.4, h: h - hy };
      lot = { x: w * 0.4, y: hy + (h - hy) * 0.08, w: w * 0.57, h: (h - hy) * 0.84 };
    } else {
      yard = { x: 0, y: hy, w: w, h: (h - hy) * 0.3 };
      lot = { x: w * 0.04, y: hy + (h - hy) * 0.33, w: w * 0.92, h: (h - hy) * 0.6 };
    }
    L = { hy: hy, wide: wide, lot: lot, yard: yard };
    // The station button sits at the front edge of the field lot.
    btn.style.left = (lot.x + lot.w / 2) + "px";
    btn.style.top = Math.min(lot.y + lot.h - 4, h - btn.offsetHeight / 2 - 10) + "px";
  }

  // ---------- Life ----------
  var animals = [], hopT = 0, sparks = [], tod = 0, todTarget = 0;
  function makeAnimals() {
    animals = [
      { k: "sheep", f: 0.18, v: 0.006, t: 0 }, { k: "sheep", f: 0.32, v: -0.005, t: 2 }, { k: "cow", f: 0.55, v: 0.004, t: 1 },
      { k: "sheep", f: 0.72, v: -0.006, t: 3 }, { k: "sheep", f: 0.86, v: 0.005, t: 5 }
    ];
  }
  makeAnimals();

  // ---------- Drawing ----------
  function lotGeo() {
    var lot = L.lot, SC = [1, 0.9, 0.81, 0.73], tot = 3.44, fh = lot.h * 0.7, top = lot.y + lot.h * 0.06, out = [];
    var kk0 = lot.w * 0.9 / LEN, cx = lot.x + lot.w / 2;
    var y = top;
    for (var i = 3; i >= 0; i--) {
      var h = fh * SC[i] / tot, kk = kk0 * SC[i];
      out[i] = { top: y, h: h, kk: kk, lane: i, sx: (function (k) { return function (wx) { return cx + (wx - LEN / 2) * k; }; })(kk) };
      y += h;
    }
    out.track = { top: y, h: lot.h * 0.14 };
    return out;
  }
  function draw(time) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var hy = L.hy, season = W.season || "spring";
    Farm.sky(ctx, { w: Wd, h: hy, time: time, farmX: 5, sunX: L.wide ? 0.12 : 0.18 }, season, tod);
    ctx.fillStyle = "#9AD36B"; ctx.fillRect(0, hy, Wd, Ht - hy);
    U.seg(ctx, 0, hy, Wd, hy, "#1D2340", 3);
    drawYard(time);
    drawLot(time);
    // Little sparkles where he tapped.
    sparks = sparks.filter(function (s) { s.t += 1 / 60; return s.t < 0.7; });
    sparks.forEach(function (s) {
      for (var k = 0; k < 6; k++) {
        var a = k * Math.PI / 3, r = 8 + s.t * 50;
        star(s.x + Math.cos(a) * r, s.y + Math.sin(a) * r, 6, 1 - s.t / 0.7);
      }
    });
    if (tod > 0.01) { ctx.fillStyle = "rgba(20,24,60," + (tod * 0.3) + ")"; ctx.fillRect(0, hy, Wd, Ht - hy); }
  }
  function star(x, y, r, a) {
    ctx.save(); ctx.globalAlpha = Math.max(0, a); ctx.translate(x, y); ctx.beginPath();
    for (var k = 0; k < 8; k++) { var rr = k % 2 ? r * 0.4 : r; ctx.lineTo(Math.cos(k * Math.PI / 4) * rr, Math.sin(k * Math.PI / 4) * rr); }
    ctx.closePath(); ctx.fillStyle = "#FFE14D"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#1D2340"; ctx.stroke(); ctx.restore();
  }
  function drawYard(time) {
    var y = L.yard, s = Math.min(y.w / 330, y.h / 140) * (L.wide ? 0.95 : 1.05);
    s = clamp(s, 0.5, 2.2);
    // The farmyard: house, barn and silo (the big buildings), a yard of gravel.
    var bx = L.wide ? y.x + y.w * 0.5 : y.x + y.w * 0.36, by = L.wide ? y.y + Math.min(y.h * 0.36, 150 * s) : y.y + y.h * 0.62;
    ctx.fillStyle = "#D9C49A"; ctx.beginPath(); ctx.ellipse(bx + 10 * s, by + 4 * s, 170 * s, 22 * s, 0, 0, Math.PI * 2); ctx.fill();
    Farm.farmstead(ctx, bx, by, s, W.season || "spring");
    // Pasture with sheep and cows behind a fence.
    var px0 = L.wide ? y.x + 8 : y.x + y.w * 0.66, px1 = L.wide ? y.x + y.w - 8 : y.x + y.w - 8;
    var py = L.wide ? by + Math.min(y.h * 0.42, 190 * s) : y.y + y.h * 0.86;
    var as = clamp(s * 0.62, 0.35, 1.2);
    var room = Math.max(2, Math.min(animals.length, Math.floor((px1 - px0) / (62 * as))));
    animals.forEach(function (a, ai) {
      a.px = null;
      if (ai >= room) return;
      a.t += 1 / 60;
      var walk = Math.sin(a.t * 0.25 + a.f * 9) > 0.4;
      if (walk) a.f += a.v / 60 * 3;
      if (a.f < 0.06 || a.f > 0.94) a.v = -a.v;
      a.f = clamp(a.f, 0.05, 0.95);
      var x = lerp(px0, px1, a.f), yy = py - (L.wide ? 0 : (a.f * 7 % 1) * 6);
      var hop = a.hop ? Math.sin(a.hop / 0.6 * Math.PI) * 14 : 0;
      if (a.hop) a.hop = Math.max(0, a.hop - 1 / 60);
      var graze = walk ? 0 : 0.5 + 0.5 * Math.sin(a.t * 0.9);
      if (a.k === "sheep") Farm.drawSheep(ctx, x, yy - hop, as, { graze: graze, t: a.t }, a.v < 0);
      else Farm.drawCow(ctx, x, yy - hop, as * 1.25, { graze: graze, t: a.t }, a.v < 0);
      a.px = x; a.py = yy; a.s = as;
      if (a.say) { a.say = Math.max(0, a.say - 1 / 60); bubble(x, yy - 70 * as, a.k === "sheep" ? "Baa!" : "Moo!"); }
    });
    // Fence in front of the pasture.
    var fy = py + 8;
    U.seg(ctx, px0 - 6, fy - 12, px1 + 6, fy - 12, "#1D2340", 7); U.seg(ctx, px0 - 6, fy - 12, px1 + 6, fy - 12, "#C9965A", 3.5);
    for (var x = px0; x <= px1 + 1; x += Math.max(24, 40 * s)) { U.rrect(ctx, x - 3, fy - 24, 6, 26, 2); U.fs(ctx, "#B07A42", 2.5); }
  }
  function drawLot(time) {
    var lot = L.lot, G = lotGeo(), lanes = W.field.lanes, bounce = hopT > 0 ? Math.sin(hopT / 0.5 * Math.PI) * 10 : 0;
    ctx.save(); ctx.translate(0, -bounce);
    // Hedge round the field, then the four lanes in the field's current look.
    var t3 = G[3].top, b0 = G[0].top + G[0].h;
    U.rrect(ctx, lot.x - 6, t3 - 14, lot.w + 12, G.track.top + G.track.h - t3 + 22, 18); U.fs(ctx, "#3F8A3A", 3);
    for (var i = 3; i >= 0; i--) {
      var g = G[i], l = lanes[i];
      ctx.fillStyle = "#7DBA52"; ctx.fillRect(lot.x, g.top, lot.w, g.h + 0.5);
      var lo = l.lo * LEN, hi = l.hi * LEN;
      if (lo > 0) Farm.paintLane(ctx, g, l.b, 0, lo, { time: time });
      if (hi < LEN) Farm.paintLane(ctx, g, l.b, hi, LEN, { time: time });
      if (hi > lo) Farm.paintLane(ctx, g, l.a, lo, hi, { time: time });
    }
    var x3 = G[3].sx(0), x0 = G[0].sx(0), r3 = G[3].sx(LEN), r0 = G[0].sx(LEN);
    ctx.fillStyle = "#7DBA52";
    U.poly(ctx, [lot.x - 1, t3, x3, t3, x0, b0, lot.x - 1, b0], "#7DBA52", 0);
    U.poly(ctx, [lot.x + lot.w + 1, t3, r3, t3, r0, b0, lot.x + lot.w + 1, b0], "#7DBA52", 0);
    U.seg(ctx, x3, t3, x0, b0, "rgba(29,35,64,0.35)", 3); U.seg(ctx, r3, t3, r0, b0, "rgba(29,35,64,0.35)", 3);
    // The field track and the tractor parked on it with its implement.
    var tk = G.track;
    ctx.fillStyle = "#C9A06A"; ctx.fillRect(lot.x, tk.top, lot.w, tk.h);
    U.seg(ctx, lot.x, tk.top, lot.x + lot.w, tk.top, "#1D2340", 3);
    var k = clamp(lot.h * 0.36 / 250, 0.12, 0.6), tx = lot.x + lot.w * 0.08 + (Farm.HITCH + Farm.IMPLEMENTS[F.imp].len) * k, ty = tk.top + tk.h * 0.7;
    tx = Math.min(tx, lot.x + lot.w * 0.7);
    ctx.save(); ctx.translate(tx, ty); ctx.scale(k, k);
    Farm.drawTractor(ctx, { lw: Math.max(4, 2.6 / k), tracks: F.tracks, time: time, bounce: Math.sin(time * 30) * 0.8, unfold: 0, level: 1 }, F.imp);
    ctx.restore();
    // Exhaust puffs.
    var ph = (time * 0.8) % 1;
    ctx.globalAlpha = 0.5 * (1 - ph);
    U.circ(ctx, tx + 132 * k - ph * 20 * k, ty - 206 * k - ph * 60 * k, (6 + ph * 14) * k * 2, "#9AA5B1", 0);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  function bubble(x, y, txt) {
    ctx.save(); ctx.font = "800 16px 'Baloo 2', sans-serif"; var w = ctx.measureText(txt).width + 16;
    U.rrect(ctx, x - w / 2, y - 26, w, 26, 12); U.fs(ctx, "#FFFFFF", 3);
    ctx.fillStyle = "#1D2340"; ctx.textAlign = "center"; ctx.fillText(txt, x, y - 8); ctx.restore();
  }

  // ---------- The station button's picture ----------
  (function () {
    var c = $("fieldIcon"), x = c.getContext("2d"), s = 0.2;
    x.fillStyle = "#6B4127"; x.fillRect(0, 84, 150, 16);
    x.translate(84, 88); x.scale(s, s);
    Farm.drawTractor(x, { lw: 9, driver: false, level: 1 }, "plow");
  })();

  // ---------- Going to the field ----------
  var going = false;
  function go() {
    if (going || Toybox.timer.locked()) return;
    going = true; hopT = 0.5;
    Farm.sound.horn();
    setTimeout(function () { Toybox.beforeLeave(function () { location.href = "field.html"; }); }, reduce ? 0 : 520);
  }
  btn.addEventListener("click", function (e) { e.preventDefault(); go(); });
  cv.addEventListener("pointerdown", function (e) {
    if (Toybox.timer.locked() || !L) return;
    var r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, lot = L.lot;
    if (x > lot.x && x < lot.x + lot.w && y > lot.y && y < lot.y + lot.h) { go(); return; }
    for (var i = 0; i < animals.length; i++) {
      var a = animals[i];
      if (a.px != null && Math.abs(x - a.px) < 50 * Math.max(0.6, a.s) && y < a.py + 14 && y > a.py - 80 * a.s) { a.hop = 0.6; a.say = 1.6; Farm.sound.baa(); return; }
    }
    sparks.push({ x: x, y: y, t: 0 });
    Farm.sound.pop();
  });
  window.addEventListener("pageshow", function () { going = false; hopT = 0; W = Farm.world.get(); F = fieldState(); });

  // ---------- Loop ----------
  var last = performance.now();
  function loop(t) {
    var dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (!document.hidden && Toybox.timer.phase() !== "resting" && L) {
      hopT = Math.max(0, hopT - dt);
      tod += (todTarget - tod) * Math.min(1, dt);
      draw(t / 1000);
    }
    requestAnimationFrame(loop);
  }

  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", function () { setTimeout(layout, 200); });
  window.addEventListener("storage", function (e) { if (e.key === Farm.world.KEY || e.key === FKEY) { W = Farm.world.get(); F = fieldState(); } });

  Farm.ghost(function () {
    var b = btn.getBoundingClientRect();
    if (!btn.offsetParent) return null;
    return { pts: [[b.left + b.width / 2, b.top + b.height / 2]], tap: true };
  });

  layout();
  Toybox.init({
    app: "farm",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the sun sets over the farm and the controls lock. The timer keeps going on every Farm page.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The animals and machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "A soft tractor engine and field sounds. Hold for 2 seconds.",
    onEnding: function (done) { todTarget = 1; setTimeout(done, reduce ? 600 : 3000); },
    onWake: function () { todTarget = 0; },
    onBig: function () { setTimeout(layout, 30); },
    onSound: function (on) { if (on) Farm.sound.chime(); }
  });
  requestAnimationFrame(loop);

  if (/[?&]debug\b/.test(location.search)) window.__farmMap = {
    layout: function () { return L; },
    world: function () { return Farm.world.get(); }
  };
})();
</script>
</body>
</html>
