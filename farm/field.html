<!doctype html>
<html lang="en">
<head>

<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --tile: #E8F4FF;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; --tile: #E6F2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; --tile: #E6F2FF;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }
.tb-title .t-short { display: none; }
.scene { background: #A9DCFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
.tb-counter.pop { animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
body.ending .tb-panel, body.ending .tb-back, body.ending .homebtn { pointer-events: none; opacity: 0.4; }
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel { display: none; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
.tb-tabs .btn { flex: 1 1 0; }
/* Panel buttons: big, an icon and a short word each. */
.btn.pbtn { min-height: 64px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; }
.tb-tabs .btn.pbtn { min-height: 64px; font-size: 1.15rem; }
.btn.pbtn svg { width: 30px; height: 30px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.btn.tb-go.pbtn { min-height: 68px; }
.btn.tb-go.pbtn svg { width: 34px; height: 34px; }
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(30%, 300px); justify-content: space-between; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-head:has(.tb-back) .tb-title { display: block; }
  .tb-body .tb-panel { width: 244px; padding: 6px; gap: 6px; }
  .tb-tabs .btn.pbtn { font-size: 0.98rem; gap: 4px; padding: 0.1rem 0.2rem; }
  .btn.pbtn svg { width: 24px; height: 24px; }
}
@media (max-width: 600px) {
  .tb-head:has(.tb-back) .tb-title { display: block; }
  .tb-title .t-long { display: none; }
  .tb-title .t-short { display: inline; }
}

/* ---------- Step strip: the steps of a job in their fixed order (progress, not buttons) ----------
   A self-contained piece (markup built by stepStrip() in the script below), meant to move to common/ later.
   No outlines or shadows: the steps read as a picture of progress, not as things to press. */
.stepstrip { list-style: none; margin: 0; padding: 2px 0; display: flex; align-items: center; justify-content: center; gap: 2px; min-width: 0; }
.stepstrip .ss-step { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 0;
  color: var(--ink); font-weight: 800; font-size: 0.9rem; line-height: 1.1; text-align: center; opacity: 0.5;
  transition: opacity 0.4s ease, transform 0.4s cubic-bezier(.3, 1.5, .5, 1); }
.stepstrip .ss-pic { position: relative; width: 100%; max-width: 72px; aspect-ratio: 172 / 124; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.stepstrip .ss-pic canvas { width: 100%; height: 100%; display: block; }
.stepstrip .ss-label { white-space: nowrap; overflow: hidden; text-overflow: clip; max-width: 100%; padding-top: 1px; }
.stepstrip .ss-step[data-state="done"] { opacity: 0.85; }
.stepstrip .ss-step[data-state="current"] { opacity: 1; transform: scale(1.14); z-index: 1; }
.stepstrip .ss-step[data-state="current"] .ss-pic { background: radial-gradient(closest-side, rgba(255, 201, 60, 0.95), rgba(255, 201, 60, 0.55) 70%, rgba(255, 201, 60, 0)); }
.stepstrip .ss-step[data-state="current"] .ss-label { text-decoration: underline 3px #FFC93C; text-underline-offset: 3px; }
.stepstrip .ss-tick { position: absolute; right: 2px; top: -2px; width: 22px; height: 22px; display: none; }
.stepstrip .ss-step[data-state="done"] .ss-tick { display: block; }
.stepstrip .ss-arrow { flex: 0 0 auto; width: 12px; height: 16px; color: var(--muted); opacity: 0.8; }
.stepstrip .ss-arrow svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.stepstrip .ss-step.ss-now { animation: ss-now 0.9s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes ss-now { 0% { transform: scale(0.8); } 55% { transform: scale(1.3); } 100% { transform: scale(1.14); } }
@media (orientation: landscape) and (min-height: 521px) {
  /* A tall side panel: the steps run down the column, picture and name side by side. */
  .stepstrip { flex-direction: column; align-items: stretch; gap: 0; flex: 1 1 auto; justify-content: space-evenly; }
  .stepstrip .ss-step { flex: 0 1 auto; flex-direction: row; gap: 10px; font-size: 1.15rem; text-align: left; transform-origin: 30% 50%; }
  .stepstrip .ss-pic { width: 46%; max-width: 104px; flex: none; }
  .stepstrip .ss-arrow { align-self: flex-start; margin-left: calc(min(46%, 104px) / 2 - 6px); transform: rotate(90deg); height: 14px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  /* A short side panel on a phone held sideways: the steps run down the column, no arrows. */
  .stepstrip { flex-direction: column; align-items: stretch; justify-content: space-evenly; flex: 1 1 auto; gap: 0; padding: 0 4px; }
  .stepstrip .ss-step { flex: 1 1 0; min-height: 0; flex-direction: row; gap: 8px; font-size: 1rem; text-align: left; transform-origin: 20% 50%; }
  .stepstrip .ss-step[data-state="current"] { transform: scale(1.08); }
  .stepstrip .ss-pic { width: auto; height: 100%; max-height: 40px; max-width: none; flex: none; }
  .stepstrip .ss-arrow { display: none; }
  .stepstrip .ss-tick { width: 16px; height: 16px; right: -4px; top: -2px; }
}
@media (min-width: 700px) and (min-height: 700px) and (orientation: portrait) {
  .stepstrip .ss-step { font-size: 1.15rem; }
  .stepstrip .ss-pic { max-width: 110px; }
  .stepstrip .ss-arrow { width: 18px; height: 24px; }
}
@media (prefers-reduced-motion: reduce) { .tb-counter.pop, .stepstrip .ss-step.ss-now { animation: none; } .stepstrip .ss-step { transition: none; } }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back" href="./" aria-label="Back to the farm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Farm</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title"><span class="t-long">It's Sow Time</span><span class="t-short">Sow Time</span></h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>
  <div class="tb-body">
    <main class="tb-stage scene" id="stage">
      <canvas id="cv" role="img" aria-label="A field in spring with a green tractor and a plow. Tap or drag the tractor to drive it across the field."></canvas>
      <div class="tb-counter" id="count">Jobs: 0</div>
      <div class="tb-coach" id="coach" role="status" aria-live="polite">Tap the tractor!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
    <section class="tb-panel" id="panel">
      <button class="btn tb-go pbtn" id="drive"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.2"/><path d="M3.8 10.5h6M14.2 10.5h6M12 14.2v6"/></svg><span>Drive!</span></button>
      <ol class="stepstrip" id="steps" aria-label="The jobs, in order"></ol>
      <nav class="tb-tabs">
        <button class="btn tb-new pbtn" id="newBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.8 3.8v4.4h-4.4"/></svg><span>New</span></button>
        <button class="btn tb-surprise pbtn" id="surpriseBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.3 6.1 6.1 2.3-6.1 2.3L12 19.6l-2.3-6.1-6.1-2.3 6.1-2.3z"/><path d="M19 17.5v4M17 19.5h4"/></svg><span>Surprise</span></button>
      </nav>
    </section>
  </div>
</div>


<script>
/* ---------- Step strip (self-contained; meant to move to common/ for every app) ----------
   stepStrip(el, steps, state) builds the strip inside an <ol> and returns { set(state), el }.
     steps: [{ id, label, pic: function () -> an element (canvas/svg/img) }]
     state: { current: id, done: [ids] }   (current is the step happening now; done steps get a tick)
   The steps are pictures joined by arrows: progress, not buttons (nothing in it is tappable). */
function stepStrip(el, steps, state) {
  var items = {};
  var TICK = '<svg class="ss-tick" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#2EA05A" stroke="#1D2340" stroke-width="2.5"/>' +
    '<path d="M7 12.5l3.4 3.4L17.2 8.6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  el.innerHTML = "";
  el.classList.add("stepstrip");
  steps.forEach(function (st, i) {
    if (i) {
      var ar = document.createElement("li");
      ar.className = "ss-arrow"; ar.setAttribute("aria-hidden", "true");
      ar.innerHTML = '<svg viewBox="0 0 12 16"><path d="M3 2.5 9 8l-6 5.5"/></svg>';
      el.appendChild(ar);
    }
    var li = document.createElement("li");
    li.className = "ss-step"; li.dataset.step = st.id; li.dataset.state = "todo";
    var pic = document.createElement("div"); pic.className = "ss-pic";
    if (st.pic) pic.appendChild(st.pic());
    pic.insertAdjacentHTML("beforeend", TICK);
    var lab = document.createElement("span"); lab.className = "ss-label"; lab.textContent = st.label;
    li.appendChild(pic); li.appendChild(lab);
    el.appendChild(li);
    items[st.id] = li;
  });
  var cur = null;
  function set(s) {
    s = s || {};
    var done = {};
    (s.done || []).forEach(function (id) { done[id] = true; });
    steps.forEach(function (st) {
      var li = items[st.id], k = done[st.id] ? "done" : (st.id === s.current ? "current" : "todo");
      if (li.dataset.state !== k) li.dataset.state = k;
      if (k === "current") li.setAttribute("aria-current", "step"); else li.removeAttribute("aria-current");
      li.setAttribute("aria-label", st.label + (k === "done" ? ", done" : (k === "current" ? ", now" : "")));
    });
    if (s.current !== cur) {
      cur = s.current;
      var li = items[cur];
      if (li) { li.classList.remove("ss-now"); void li.offsetWidth; li.classList.add("ss-now"); }
    }
  }
  set(state);
  return { set: set, el: el };
}

(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.util, clamp = U.clamp, lerp = U.lerp, IMP = Farm.IMPLEMENTS, HITCH = Farm.HITCH;
  var reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  function rand(a, b) { return a + Math.random() * (b - a); }
  function now() { return performance.now(); }

  // ---------- State ----------
  // The steps run in the real order, one pass across the whole field each: plow, harrow, seed drill, sprayer,
  // then the weeks go by and the wheat turns golden. The tractor hitches the next implement by itself.
  // This page's own key keeps the step, the machine and the counter; the field lives in farm-world-v1.
  var KEY = "farm-field-v1";
  var ORDER = ["plow", "harrow", "drill", "sprayer"];
  var LABEL = { plow: "Plow", harrow: "Harrow", drill: "Drill", sprayer: "Sprayer", wheat: "Wheat" };
  var NOW = { plow: "Now the plow!", harrow: "Now the harrow!", drill: "Now the seed drill!", sprayer: "Now the sprayer!" };
  var LEN = 900;
  if (Toybox.fresh()) {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    Farm.world.resetField();
  }
  function load() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { s = null; }
    if (!s || typeof s !== "object") s = {};
    var step = Math.floor(+s.step);
    if (!(step >= 0 && step <= 4)) step = Math.max(0, ORDER.indexOf(s.imp)); // older saves had only imp
    var jobs = Math.max(0, Math.floor(+(s.jobs != null ? s.jobs : s.passes) || 0));
    var x = typeof s.x === "number" && isFinite(s.x) ? s.x : null;
    return { step: step, jobs: jobs, dir: s.dir === -1 ? -1 : 1, x: x, started: !!s.started };
  }
  var S = load();
  function imp() { return ORDER[Math.min(S.step, 3)]; }
  // The field: one look for the whole strip (a = the worked look, b = the look not yet worked, lo..hi = worked).
  var F = (function () { var l = Farm.world.get().field.lanes[0]; return { a: l.a, b: l.b, lo: l.lo, hi: l.hi, by: l.by }; })();
  function save() {
    var m = E.m;
    if (!E.busy() && m.phase === "work") { S.x = m.x; S.dir = m.dir; }
    try { localStorage.setItem(KEY, JSON.stringify({ v: 2, step: S.step, imp: imp(), jobs: S.jobs, dir: S.dir, x: S.x, started: S.started })); } catch (e) { /* ignore */ }
  }
  var worldDirty = false;
  function saveWorld() {
    worldDirty = false;
    Farm.world.update(function (w) {
      w.field.lanes = [0, 1, 2, 3].map(function () { return { a: F.a, b: F.b, lo: F.lo, hi: F.hi, by: F.by }; });
      w.field.stage = Farm.world.fieldStage(w.field);
      w.season = "spring";
    });
  }
  function isGolden() { return F.a === 7 && F.hi - F.lo >= 0.999; }

  // ---------- Canvas, engine ----------
  var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
  var Wd = 1, Ht = 1, dpr = 1;
  var attached = imp();
  var E = Farm.strip({
    canvas: cv, len: LEN, head: 560, vmax: 250, span: 610,
    work: function () { return HITCH + IMP[imp()].work; },
    reach: function () { return { front: 262, back: HITCH + (attached ? IMP[attached].len : 0) }; },
    canDrive: function () { return !ending && !(hare && hare.block); },
    locked: function () { return Toybox.timer.locked(); },
    onWork: onWork,
    onPass: onPass,
    onGrab: function () { firstTouch(); puffNow(); },
    onDrag: function () { learn(); },
    onRelease: function (tap) {
      if (Toybox.timer.locked()) return;
      if (tap) { Farm.sound.horn(); lightsT = 0.8; shake = 0.15; }
      if (canWork()) { E.drive(); learn(); } else answerIdle();
    },
    onTap: onTap
  });
  var cap = Math.min(innerWidth, innerHeight) > 700 ? 700 : 400;
  var P = new Farm.Particles(cap);

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (w < 10 || h < 10) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    Wd = w; Ht = h;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    E.layout(w, h);
  }

  // ---------- Starting position ----------
  function startX(id, dir) { var wk = HITCH + IMP[id].work; return dir > 0 ? wk : LEN - wk; }
  if (S.step >= 4 && !isGolden()) { F.a = 7; F.b = 7; F.lo = 0; F.hi = 1; F.by = "sprayer"; saveWorld(); }
  E.place(S.x == null ? startX(imp(), S.dir) : S.x, S.dir);
  if (S.step >= 4) E.park();

  // ---------- Driving and working the soil ----------
  var passOpen = false, lastWork = -9;
  function startPass() {
    var after = IMP[imp()].after, cov = F.hi - F.lo, d = E.m.dir;
    if (F.a !== after || cov <= 0.0001 || cov >= 0.999) {
      F.b = cov >= 0.5 ? F.a : F.b;
      F.a = after;
      if (d > 0) { F.lo = 0; F.hi = 0; } else { F.lo = 1; F.hi = 1; }
      rip = null;
    }
    passOpen = true;
    if (!S.started) { S.started = true; save(); }
  }
  function onWork(wxp, v, dt) {
    if (!passOpen) startPass();
    var f = clamp(wxp / LEN, 0, 1);
    if (E.m.dir > 0) { F.lo = 0; F.hi = Math.max(F.hi, f); } else { F.hi = 1; F.lo = Math.min(F.lo, f); }
    worldDirty = true;
    lastWork = now() / 1000;
    emitWork(wxp, v, dt);
  }
  // A pass is done: count the job, then the next implement hitches by itself (or, after the sprayer, the
  // weeks go by and the wheat turns golden).
  function onPass(dir) {
    F.lo = 0; F.hi = 1; F.by = imp(); passOpen = false;
    if (imp() === "drill") rip = { t0: now() + 300, from: dir > 0 ? 0 : LEN, to: dir > 0 ? LEN : 0 };
    S.jobs++; showCount(true);
    sweep = { t: 0 };
    Farm.sound.chime();
    var last = S.step >= 3;
    S.step = Math.min(4, S.step + 1);
    S.dir = -dir; S.x = null; S.started = false;
    save(); saveWorld(); refreshSteps();
    if (last) {
      E.play([{ dur: 0.35, lift: 1 }, { dur: 0.9, x: startX("sprayer", -dir), face: -dir }, { dur: 0.35, lift: 0 }], function () {
        E.park(); E.m.dir = -dir; startWeeks();
      });
    } else turnAndHitch(dir, ORDER[S.step]);
  }
  function turnAndHitch(dir, to) {
    var m = E.m;
    hitch = { to: to };
    coach.say(NOW[to], 3600);
    E.play([
      { dur: 0.3, lift: 1 },
      { fn: function () { dropped = { id: attached, x: m.x - dir * HITCH, face: dir, a: 1, fade: true }; attached = null; Farm.sound.clunk(); shake = 0.15; } },
      { dur: 0.8, x: startX(to, -dir), face: -dir },
      { fn: function () { attached = to; shake = 0.25; Farm.sound.clunk(); sparks(); } },
      { dur: 0.3, lift: 0 }
    ], function () {
      hitch = null;
      m.dir = -dir; m.face = -dir; m.phase = "work";
      save();
      ghost.again();
    });
  }
  function canWork() { return E.m.phase === "work" && !E.busy() && !weeks && !ending && S.step < 4; }

  // ---------- Sprouts after the drill, and "weeks go by" after the sprayer ----------
  var rip = null, weeks = null, goldNow = 0, growNow = 1;
  function startWeeks() {
    weeks = { t: 0, dur: reduce ? 2 : 3.2 };
    coach.say("The wheat is growing!", 3200);
  }
  function stepWeeks(dt) {
    if (!weeks) return;
    weeks.t += dt;
    var p = clamp(weeks.t / weeks.dur, 0, 1);
    goldNow = clamp((p - 0.3) / 0.65, 0, 1);
    growNow = 0.7 + 0.3 * clamp(p / 0.5, 0, 1);
    if (p >= 1) {
      weeks = null; goldNow = 0; growNow = 1;
      F.a = 7; F.b = 7; F.lo = 0; F.hi = 1;
      saveWorld(); save(); refreshSteps();
      sweep = { t: 0 };
      Farm.sound.chime();
      coach.say("Ready to harvest!", 4000);
      setTimeout(function () { Toybox.kind(); }, 1800);
    }
  }

  // ---------- Particles from the work (dy: across the field strip) ----------
  var smokeT = 0, tickT = 0;
  function emitWork(wxp, v, dt) {
    var m = E.m, d = m.dir, id = imp(), n, i;
    if (id === "plow") {
      n = v * dt / 10;
      for (i = 0; i < 4; i++) if (Math.random() < n / 4 * 3) {
        var bx = m.x - d * (HITCH + 62 + i * 52 + 30);
        P.add({ kind: "chunk", x: bx, h: 14, vx: -d * rand(10, 60), vh: rand(50, 110), g: 320, dy: rand(-0.05, 0.03), vdy: rand(-0.1, 0.1), size: rand(7, 12), vr: rand(-6, 6), life: rand(0.7, 1.1), col: ["#6B4127", "#583420", "#7E4E2E"][i % 3] });
      }

  function parkedImp(id, pinX, face, a) {
    var g = E.geo(), k = g.kk, x = E.sx(pinX);
    ctx.save(); ctx.globalAlpha = Math.max(0, a); ctx.translate(x, g.ground - 36 * k); ctx.scale(k * (face < 0 ? -1 : 1), k);
    Farm.drawImplement(ctx, id, { lw: Math.max(3.5, 2.8 / k), time: 0, level: 1, unfold: 0, span: g.h / k * 0.66 });
    ctx.restore();
  }
  function drawGullAt(gl) {
    var g = E.geo(), x = E.sx(gl.x), y = g.ground + gl.dy * g.h - gl.h * g.kk - (gl.hop || 0);
    Farm.drawGull(ctx, x, y, g.kk * 2.5, gl.flap, gl.h < 8, (E.m.face >= 0) === (gl.h < 8));
  }
  var unfold = 0;
  function drawMachine(time) {
    var m = E.m, g = E.geo(), k = g.kk, fd = m.face >= 0 ? 1 : -1, sxs = fd * Math.max(0.22, Math.abs(m.face));
    var tx = E.sx(m.x), ty = g.ground + (shake ? Math.sin(shake * 80) * 2 : 0);
    var working = m.phase === "work" && !E.busy() && m.v > 4 ? Math.min(1, m.v / 60) : 0;
    var wantUnfold = m.lift < 0.3 && m.phase === "work" && !hitch ? 1 : 0;
    unfold += (wantUnfold - unfold) * 0.06;
    var prog = m.phase === "work" && !E.busy() ? (m.dir > 0 ? F.hi : 1 - F.lo) : 0;
    if (!passOpen) prog = 0;
    var look = null;
    if (E.finger) look = [(E.finger[0] - tx) / (sxs * k), (E.finger[1] - ty) / k];
    ctx.save(); ctx.translate(tx, ty); ctx.scale(sxs * k, k);
    Farm.drawTractor(ctx, {
      lw: Math.max(3.5, 2.8 / k), lift: m.lift, wheel: m.dist, tracks: tracksT > 0, time: time,
      bounce: ending ? 0 : Math.sin(time * 38) * (m.v > 4 ? 1.4 : 0.7), lights: lightsT > 0 ? Math.min(1, lightsT * 3) * (Math.sin(time * 18) > -0.3 ? 1 : 0.3) : 0,
      face: faceT > 0 ? Math.min(1, faceT, (6 - faceT) * 3) : 0, look: look, work: working, level: 1 - 0.65 * prog,
      unfold: unfold, span: g.h / k * 0.66
    }, attached);
    ctx.restore();
  }

  // ---------- Loop ----------
  var last = now(), ending = false, sinceSave = 0, sndT = 0, frameMs = 0, frames = 0;
  function loop() {
    var t = now(), dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    if (!document.hidden && Toybox.timer.phase() !== "resting") {
      var t0 = now();
      E.update(dt);
      stepWeeks(dt);
      stepLife(dt);
      emitSmoke(dt);
      P.update(dt);
      tod += (todTarget - tod) * Math.min(1, dt * 0.8);
      draw(t / 1000);
      sinceSave += dt;
      if (worldDirty && sinceSave > 1.5) { sinceSave = 0; saveWorld(); save(); }
      sndT -= dt;
      if (sndT <= 0) {
        sndT = 0.1;
        var m = E.m, lvl = clamp(m.v / 250, 0, 1), wk = now() / 1000 - lastWork < 0.2;
        Farm.sound.engine(ending ? -1 : lvl);
        Farm.sound.soil(wk && (imp() === "plow" || imp() === "harrow") ? lvl : 0);
        Farm.sound.spray(wk && imp() === "sprayer" ? lvl : 0);
      }
      frameMs += now() - t0; frames++;
    }
    requestAnimationFrame(loop);
  }

  // ---------- Timer ----------
  function onEnding(done) {
    ending = true; todTarget = 1;
    E.stop();
    hare = null;
    if (!E.busy() && E.m.phase === "work") E.play([{ dur: 0.6, lift: 1 }], function () { E.m.phase = "work"; });
    Farm.sound.engine(-1);
    setTimeout(done, reduce ? 800 : 3500);
  }
  function onWake() {
    ending = false; todTarget = 0;
    if (!E.busy() && E.m.phase === "work" && E.m.lift > 0) E.play([{ dur: 0.5, lift: 0 }]);
  }

  window.addEventListener("pagehide", function () { if (worldDirty) saveWorld(); save(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) { if (worldDirty) saveWorld(); save(); } });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });

  // ---------- Ghost hand: pulls the tractor across the field ----------
  var ghost = Farm.ghost(function () {
    var r = cv.getBoundingClientRect(), m = E.m;
    if (!canWork() || E.driving() || S.started) return null;
    var R = E.machineRect(), y = r.top + R.ground - (R.ground - R.top) * 0.4, x = r.left + (R.left + R.right) / 2;
    var dx = m.dir * Math.min(180, r.width * 0.35);
    return { pts: [[x, y], [x + dx, y]], dur: 3200 };
  }, { ok: function () { return !weeks; } });

  // ---------- Start ----------
  resize();
  showCount(false);
  refreshSteps();
  Toybox.init({
    app: "farm",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the tractor lifts its implement and stops, and the sky turns to evening. The timer keeps going on every Farm page.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The animals and machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "A soft tractor engine and field sounds. Hold for 2 seconds.",
    onEnding: onEnding,
    onWake: onWake,
    onBig: function () { setTimeout(resize, 30); },
    onSound: function (on) { if (on) Farm.sound.chime(); }
  });
  Toybox.offFirst({
    running: function () { return E.m.v > 0 || E.busy(); },
    off: function (done) { E.stop(); Farm.sound.stop(); if (done) done(); }
  });
  requestAnimationFrame(loop);

  // Test hook, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) window.__farm = {
    state: function () {
      var m = E.m;
      return { step: S.step, imp: imp(), attached: attached, jobs: S.jobs, x: m.x, dir: m.dir, v: m.v, phase: m.phase, busy: E.busy(), lift: m.lift,
        field: { a: F.a, b: F.b, lo: +F.lo.toFixed(3), hi: +F.hi.toFixed(3) }, golden: isGolden(), weeks: !!weeks, coach: coach.text(),
        particles: P.a.length, hare: !!hare, rain: !!rain, face: faceT > 0, tracks: tracksT > 0, frameMs: frames ? frameMs / frames : 0 };
    },
    resetTiming: function () { frameMs = 0; frames = 0; },
    machine: function () { var r = cv.getBoundingClientRect(), R = E.machineRect(); return { x: r.left + (R.left + R.right) / 2, y: r.top + R.ground - (R.ground - R.top) * 0.4, left: r.left + R.left, right: r.left + R.right, top: r.top + R.top, ground: r.top + R.ground }; },
    ghost: function () { return ghost.show(); },
    world: function () { return Farm.world.get(); }
  };
})();
</script>
</body>
