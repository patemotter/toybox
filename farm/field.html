<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>It's Sow Time</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Farm">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<script src="farm.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --tile: #E8F4FF;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; --tile: #E6F2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; --tile: #E6F2FF;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }
.tb-title .t-short { display: none; }
.scene { background: #A9DCFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
.tb-counter.pop { animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }

/* Panel: Drive!, the implement tiles (or Wheels / Tracks), then the tab bar. */
.tb-tile { background: var(--tile); color: #1D2340; font-weight: 800; }
.tb-tile canvas { width: 56px; height: 40px; pointer-events: none; }
.tb-tile span { pointer-events: none; white-space: nowrap; }
.tb-tile[aria-pressed="true"] { background: var(--accent); }
.imps { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.rig { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.tb-choices[hidden] { display: none; }
.tb-tile.glow { animation: glow 1.3s ease-in-out infinite; }
@keyframes glow {
  0%, 100% { box-shadow: 3px 3px 0 var(--edge), 0 0 0 0 rgba(255, 201, 60, 0); }
  50% { box-shadow: 3px 3px 0 var(--edge), 0 0 0 6px rgba(255, 201, 60, 0.95); background: #FFF3C4; }
}
.tb-tabs .btn[aria-selected="true"] { background: var(--accent); color: #1D2340; }
body.ending .tb-panel, body.ending .tb-back, body.ending .homebtn { pointer-events: none; opacity: 0.4; }
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel { display: none; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }

@media (max-width: 600px) {
  /* Phones: the title stays, shortened, next to Back and Home. */
  .tb-head:has(.tb-back) .tb-title { display: block; }
  .tb-title .t-long { display: none; }
  .tb-title .t-short { display: inline; }
  .tb-tile { min-height: 64px; font-size: 0.86rem; padding: 3px 2px; }
  .tb-tile canvas { width: 50px; height: 36px; }
}
@media (min-width: 700px) and (min-height: 700px) {
  .tb-tile canvas { width: 86px; height: 62px; }
}
@media (orientation: landscape) {
  .imps { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
  .rig { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  .tb-body .tb-panel .tb-choices { overflow: visible; align-content: stretch; }
  .tb-tile { min-height: 0; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-head:has(.tb-back) .tb-title { display: block; }
  .tb-body .tb-panel { width: 280px; padding: 6px; gap: 6px; }
  .tb-tile { font-size: 0.86rem; padding: 2px; }
  .tb-tile canvas { width: 48px; height: 34px; }
  .tb-tabs .btn { font-size: 0.86rem; }
}
@media (prefers-reduced-motion: reduce) { .tb-tile.glow, .tb-counter.pop { animation: none; } .tb-tile.glow { box-shadow: 0 0 0 5px #FFC93C; } }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back" href="./" aria-label="Back to the farm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Farm</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title"><span class="t-long">It's Sow Time</span><span class="t-short">Sow Time</span></h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>
  <div class="tb-body">
    <main class="tb-stage scene" id="stage">
      <canvas id="cv" role="img" aria-label="A field in spring with a green tractor and a plow. Drag the tractor to drive it along the field."></canvas>
      <div class="tb-counter" id="count">Passes: 0</div>
      <div class="tb-coach" id="coach" role="status" aria-live="polite">Drag the tractor!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
    <section class="tb-panel" id="panel">
      <button class="btn tb-go" id="drive">Drive!</button>
      <div class="tb-choices imps" id="imps" role="group" aria-label="Machines to hitch"></div>
      <div class="tb-choices rig" id="rig" role="group" aria-label="Wheels or tracks" hidden></div>
      <nav class="tb-tabs" role="tablist">
        <button class="btn" id="tabJobs" role="tab" aria-selected="true">Jobs</button>
        <button class="btn" id="tabRig" role="tab" aria-selected="false">Tractor</button>
        <button class="btn tb-new" id="newBtn">New</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.util, clamp = U.clamp, lerp = U.lerp, IMP = Farm.IMPLEMENTS, HITCH = Farm.HITCH;
  var reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  function rand(a, b) { return a + Math.random() * (b - a); }
  function now() { return performance.now(); }

  // ---------- State ----------
  // This page's own key keeps the machine and the counter; the field itself lives in farm-world-v1
  // (shared with the map and, later, the Combine).
  var KEY = "farm-field-v1";
  var ORDER = ["plow", "harrow", "drill", "spreader", "sprayer"];
  var LABEL = { plow: "Plow", harrow: "Harrow", drill: "Drill", spreader: "Spreader", sprayer: "Sprayer" };
  var CALL = { plow: "plow", harrow: "harrow", drill: "seed drill", spreader: "spreader", sprayer: "sprayer" };
  var LEN = 1400;
  if (Toybox.fresh()) {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    Farm.world.resetField();
  }
  function load() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { s = null; }
    if (!s || typeof s !== "object") s = {};
    if (ORDER.indexOf(s.imp) < 0) s.imp = "plow";
    s.tracks = !!s.tracks;
    s.passes = Math.max(0, Math.floor(+s.passes || 0));
    if (typeof s.lane !== "number" || s.lane < 0 || s.lane > 3) s.lane = 0;
    s.lane = Math.round(s.lane);
    if (s.dir !== -1) s.dir = 1;
    if (typeof s.x !== "number" || !isFinite(s.x)) s.x = null;
    if (s.phase !== "park") s.phase = "work";
    if (typeof s.done !== "string") s.done = "";
    return s;
  }
  var S = load();
  var lanes = Farm.world.get().field.lanes;
  function save() {
    var m = E.m;
    if (!E.busy()) { S.lane = Math.round(m.lane); S.x = m.x; S.dir = m.dir; S.phase = m.phase === "park" ? "park" : "work"; }
    try { localStorage.setItem(KEY, JSON.stringify({ v: 1, imp: S.imp, tracks: S.tracks, passes: S.passes, lane: S.lane, x: S.x, dir: S.dir, phase: S.phase, done: S.done })); } catch (e) { /* ignore */ }
  }
  var worldDirty = false;
  function saveWorld() {
    worldDirty = false;
    Farm.world.update(function (w) {
      w.field.lanes = lanes.map(function (l) { return { a: l.a, b: l.b, lo: l.lo, hi: l.hi, by: l.by }; });
      w.field.stage = Farm.world.fieldStage(w.field);
      w.season = "spring";
    });
  }
  function isGolden() { return lanes.every(function (l) { return l.a === 7 && l.hi - l.lo >= 0.999; }); }

  // ---------- Canvas, engine ----------
  var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
  var Wd = 1, Ht = 1, dpr = 1;
  var attached = S.imp;
  var passOpen = {};
  var learned = { drag: false, tile: false };
  var E = Farm.lanes({
    canvas: cv, len: LEN, head: 460,
    parkAt: function () { return { x: -150, lane: 0, face: 1 }; }, vmax: 210, span: 610,
    work: function () { return HITCH + IMP[S.imp].work; },
    reach: function () { return { front: 262, back: HITCH + (attached ? IMP[attached].len : 0) }; },
    canDrive: function () { return !ending && !(hare && hare.block) && !weeks; },
    locked: function () { return Toybox.timer.locked(); },
    onWork: onWork,
    onPass: onPass,
    onTurn: function () { save(); },
    onFieldDone: onFieldDone,
    onTap: onTap,
    onDrag: function () { firstTouch(); }
  });
  var cap = Math.min(innerWidth, innerHeight) > 700 ? 700 : 400;
  var P = new Farm.Particles(cap);

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (w < 10 || h < 10) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    Wd = w; Ht = h;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    E.layout(w, h);
  }

  // ---------- Starting position ----------
  function startX(id) { return HITCH + IMP[id].work; }
  if (S.x == null) { S.lane = 0; S.dir = 1; S.x = startX(S.imp); S.phase = "work"; }
  E.place(S.lane, S.x, S.dir);
  if (S.phase === "park") E.park();

  // ---------- Driving and working the soil ----------
  var lastWork = -9, sinceSave = 0, moved = 0;
  function startPass(li) {
    var L = lanes[li], after = IMP[S.imp].after, cov = L.hi - L.lo, d = E.m.dir;
    if (L.a !== after || cov <= 0.0001 || cov >= 0.999) {
      L.b = cov >= 0.5 ? L.a : L.b;
      L.a = after;
      if (d > 0) { L.lo = 0; L.hi = 0; } else { L.lo = 1; L.hi = 1; }
      delete rip[li];
    }
    passOpen[li] = true;
  }
  function onWork(li, wxp, v, dt) {
    if (!passOpen[li]) startPass(li);
    var L = lanes[li], f = clamp(wxp / LEN, 0, 1), m = E.m;
    if (m.dir > 0) { L.lo = 0; L.hi = Math.max(L.hi, f); } else { L.hi = 1; L.lo = Math.min(L.lo, f); }
    worldDirty = true;
    lastWork = now() / 1000;
    moved += v * dt;
    if (!learned.drag && moved > 140) { learned.drag = true; ghost.learned(); }
    emitWork(li, wxp, v, dt);
  }
  function onPass(li) {
    var L = lanes[li];
    L.lo = 0; L.hi = 1; L.by = S.imp;
    delete passOpen[li];
    if (S.imp === "drill") rip[li] = { t0: now() + 300, from: E.m.dir > 0 ? 0 : LEN, to: E.m.dir > 0 ? LEN : 0 };
    S.passes++;
    showCount(true);
    Farm.sound.pop();
    saveWorld(); save();
  }
  function onFieldDone() {
    S.phase = "park"; S.done = S.imp;
    passOpen = {};
    sweep = { t: 0 };
    Farm.sound.chime();
    if (S.imp === "sprayer") startWeeks();
    else {
      showTab("jobs");
      coach.say(NOW[nextImp()] || "", 4000);
      ghost.again();
      setTimeout(function () { Toybox.kind(); }, 2600);
    }
    save(); saveWorld();
    refreshTiles();
  }
  var NOW = { harrow: "Now the harrow!", drill: "Now the seed drill!", spreader: "Now the spreader!", sprayer: "Now the sprayer!" };
  function nextImp() {
    if (S.phase !== "park" || S.done !== S.imp || isGolden() || weeks) return "";
    return ORDER[ORDER.indexOf(S.imp) + 1] || "";
  }

  // ---------- Sprouts after the drill, and "weeks go by" after the sprayer ----------
  var rip = {};
  var weeks = null, goldNow = 0, growNow = 1;
  function startWeeks() {
    weeks = { t: 0, dur: reduce ? 2.5 : 6.5 };
  }
  function stepWeeks(dt) {
    if (!weeks) return;
    weeks.t += dt;
    var p = clamp(weeks.t / weeks.dur, 0, 1);
    goldNow = clamp((p - 0.35) / 0.6, 0, 1);
    growNow = 0.75 + 0.25 * clamp(p / 0.5, 0, 1);
    if (p >= 1) {
      weeks = null; goldNow = 0; growNow = 1;
      lanes.forEach(function (l) { l.a = 7; l.b = 7; l.lo = 0; l.hi = 1; });
      saveWorld(); save();
      sweep = { t: 0 };
      Farm.sound.chime();
      coach.say("Ready to harvest!", 4000);
      setTimeout(function () { Toybox.kind(); }, 1800);
      refreshTiles();
    }
  }

  // ---------- Particles from the work ----------
  var smokeT = 0, tickT = 0, soilSnd = 0, spraySnd = 0;
  function emitWork(li, wxp, v, dt) {
    var m = E.m, d = m.dir, id = S.imp, n, i;
    if (id === "plow") {
      n = v * dt / 10;
      for (i = 0; i < 4; i++) if (Math.random() < n / 4 * 3) {
        var bx = m.x - d * (HITCH + 62 + i * 52 + 30);
        P.add({ kind: "chunk", lane: li, x: bx, h: 14, vx: -d * rand(10, 60), vh: rand(50, 110), g: 320, dy: rand(-0.15, 0.08), vdy: rand(-0.3, 0.3), size: rand(7, 12), vr: rand(-6, 6), life: rand(0.7, 1.1), col: ["#6B4127", "#583420", "#7E4E2E"][i % 3] });
      }
      if (Math.random() < v * dt / 900 && worms.length < 4) worms.push({ lane: li, x: m.x - d * (HITCH + 280 + rand(0, 120)), t: 0, life: 7 });
    } else if (id === "harrow") {
      n = v * dt / 9;
      if (Math.random() < n) P.add({ kind: "puff", lane: li, x: m.x - d * (HITCH + rand(30, 190)), h: 8, vx: -d * rand(5, 25), vh: rand(10, 30), dy: rand(-0.2, 0.1), size: rand(6, 10), grow: 2.5, fade: true, life: rand(0.8, 1.3), col: "rgba(205,168,118,0.55)" });
      if (Math.random() < n) P.add({ kind: "chunk", lane: li, x: m.x - d * (HITCH + rand(40, 150)), h: 6, vx: -d * rand(5, 30), vh: rand(30, 60), g: 300, dy: rand(-0.1, 0.05), size: rand(4, 6), vr: rand(-5, 5), life: 0.6, col: "#8D623A" });
    } else if (id === "drill") {
      if (Math.random() < v * dt / 40) P.add({ kind: "puff", lane: li, x: m.x - d * (HITCH + rand(60, 170)), h: 4, vx: -d * 10, vh: 12, dy: rand(-0.1, 0.05), size: 6, grow: 2, fade: true, life: 0.9, col: "rgba(205,168,118,0.45)" });
      tickT -= dt; if (tickT < 0) { tickT = 0.12; Farm.sound.tick(); }
    } else if (id === "spreader") {
      n = v * dt / 3.5;
      for (i = 0; i < 3; i++) if (Math.random() < n / 3) P.add({ kind: "dot", lane: li, x: m.x - d * (HITCH + 74), h: 40, vx: -d * rand(40, 220), vh: rand(10, 90), g: 260, dy: 0, vdy: rand(-1.3, 0.5), size: 4.5, life: rand(0.6, 0.9), col: Math.random() < 0.3 ? "#E7A9B9" : "#FFFFFF" });
    } else if (id === "sprayer") {
      n = v * dt / 6;
      for (i = 0; i < 2; i++) if (Math.random() < n) P.add({ kind: "puff", lane: li, x: m.x - d * (HITCH + 160 + rand(0, 30)), h: rand(5, 30), vx: -d * rand(5, 25), vh: -10, dy: rand(-0.65, 0.22), size: rand(5, 8), grow: 1.6, fade: true, life: rand(0.6, 1.0), col: "rgba(226,245,255,0.75)" });
    }
  }
  function emitSmoke(dt) {
    var m = E.m, g;
    if (ending) return;
    smokeT -= dt;
    if (smokeT > 0) return;
    smokeT = m.v > 20 ? 0.16 : 0.7;
    var fd = m.face >= 0 ? 1 : -1, sxs = Math.max(0.22, Math.abs(m.face));
    P.add({ kind: "puff", lane: m.lane, x: m.x + fd * 132 * sxs, h: 206, vx: -fd * rand(10, 30), vh: rand(40, 60), size: m.v > 20 ? 9 : 7, grow: 2.2, fade: true, life: 1.2, col: firstPuff ? "rgba(60,64,80,0.75)" : "rgba(110,116,130,0.45)" });
    firstPuff = false;
  }
  var firstPuff = false, touched = false;
  function firstTouch() {
    if (touched) return;
    touched = true; firstPuff = true; smokeT = 0;
    for (var i = 0; i < 3; i++) setTimeout(function () { firstPuff = true; smokeT = 0; }, i * 140);
  }

  // ---------- Life on the farm: worms, gulls, sheep and cows; Surprise moments ----------
  var worms = [], gulls = [], hare = null, rain = null, faceT = 0, sweep = null, shake = 0, lightsT = 0, arrowT = 0;
  var animals = [
    { k: "sheep", x: -260, v: 6, t: 0, flip: false }, { k: "sheep", x: 120, v: -5, t: 2, flip: true }, { k: "sheep", x: 260, v: 4, t: 4, flip: false },
    { k: "cow", x: 720, v: 3, t: 1, flip: false }, { k: "sheep", x: 1080, v: -6, t: 3, flip: true }, { k: "cow", x: 1460, v: -3, t: 5, flip: true },
    { k: "sheep", x: 1760, v: 5, t: 6, flip: false }
  ];
  var gullFollow = 0; // seconds left of the Surprise flock
  function stepLife(dt) {
    var m = E.m, t = now() / 1000;
    animals.forEach(function (a) {
      a.t += dt;
      var walk = Math.sin(a.t * 0.23) > 0.3;
      if (walk) { a.x += a.v * dt * 3; a.flip = a.v < 0; }
      if (Math.random() < dt * 0.03) a.v = -a.v;
      a.graze = walk ? 0 : 0.5 + 0.5 * Math.sin(a.t * 0.9);
      if (a.hop) a.hop = Math.max(0, a.hop - dt);
      if (a.say) a.say = Math.max(0, a.say - dt);
    });
    worms = worms.filter(function (w) { w.t += dt; return w.t < w.life; });
    // Gulls: behind the plow while it works, and the Surprise flock behind any implement.
    var plowing = S.imp === "plow" && attached === "plow" && t - lastWork < 2.5 && m.phase === "work";
    gullFollow = Math.max(0, gullFollow - dt);
    var want = gullFollow > 0 ? 6 : (plowing ? 3 : 0);
    while (gulls.filter(function (g) { return !g.leave; }).length < want) {
      var fd = m.face >= 0 ? 1 : -1;
      gulls.push({ x: m.x - fd * rand(300, 900), lane: Math.max(0, Math.round(m.lane)), h: rand(260, 380), dy: rand(-0.3, 0.1), flap: rand(0, 6), i: gulls.length, sit: false, leave: false });
    }
    var active = 0;
    gulls.forEach(function (g) {
      if (!g.leave) { active++; if (active > want) g.leave = true; }
      g.flap += dt * (g.sit ? 0 : 9);
      if (g.leave) { g.h += dt * 140; g.x += dt * 120 * (g.i % 2 ? 1 : -1); g.sit = false; return; }
      var fd = m.face >= 0 ? 1 : -1, back = HITCH + (attached ? IMP[attached].len : 100) + 60 + (g.i % 6) * 55;
      var tx = m.x - fd * back, th = gullFollow > 0 && g.i % 2 ? 40 + 20 * Math.sin(t * 2 + g.i) : 0;
      g.lane += (Math.max(0, m.lane) - g.lane) * Math.min(1, dt * 2);
      g.x += (tx - g.x) * Math.min(1, dt * 1.6);
      g.h += (th - g.h) * Math.min(1, dt * 1.8);
      g.sit = g.h < 6 && Math.abs(tx - g.x) < 60;
      if (g.sit) g.hop = Math.abs(Math.sin(t * 5 + g.i)) * 6;
    });
    gulls = gulls.filter(function (g) { return g.h < 900; });

  }
  function drawGullAt(g, time) {
    var gg = E.geo(Math.max(0, g.lane)), x = E.sx(g.x, g.lane), y = gg.ground + g.dy * gg.h - g.h * gg.kk - (g.hop || 0);
    Farm.drawGull(ctx, x, y, gg.kk * 2.5, g.flap, g.h < 8, (E.m.face >= 0) === (g.h < 8));
  }
  var unfold = 0;
  function drawMachine(time) {
    var m = E.m, g = E.geo(m.lane), k = g.kk, fd = m.face >= 0 ? 1 : -1, sxs = fd * Math.max(0.22, Math.abs(m.face));
    var tx = E.sx(m.x, m.lane), ty = g.ground + (shake ? Math.sin(shake * 80) * 2 : 0);
    var working = m.phase === "work" && !E.busy() && m.v > 4 ? Math.min(1, m.v / 60) : 0;
    var wantUnfold = m.lift < 0.3 && (m.phase === "work") && !hitch ? 1 : 0;
    unfold += (wantUnfold - unfold) * 0.06;
    var prog = 0;
    var L = lanes[Math.round(m.lane)];
    if (L && m.phase === "work" && !E.busy()) prog = m.dir > 0 ? L.hi : 1 - L.lo;
    var look = null;
    if (E.finger) look = [(E.finger[0] - tx) / (sxs * k), (E.finger[1] - ty) / k];
    ctx.save(); ctx.translate(tx, ty); ctx.scale(sxs * k, k);
    Farm.drawTractor(ctx, {
      lw: Math.max(3.5, 2.8 / k), lift: m.lift, wheel: m.dist, tracks: S.tracks, time: time,
      bounce: ending ? 0 : Math.sin(time * 38) * (m.v > 4 ? 1.4 : 0.7), lights: lightsT > 0 ? Math.min(1, lightsT * 3) * (Math.sin(time * 18) > -0.3 ? 1 : 0.3) : 0,
      face: faceT > 0 ? Math.min(1, faceT, (6 - faceT) * 3) : 0, look: look, work: working, level: 1 - 0.65 * prog,
      unfold: unfold, span: g.h / k
    }, attached);
    ctx.restore();
  }

  // ---------- Loop ----------
  var last = now(), ending = false, saveT = 0, sndT = 0, frameMs = 0, frames = 0;
  function loop() {
    var t = now(), dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    if (!document.hidden && Toybox.timer.phase() !== "resting") {
      var t0 = now();
      if (queued && !E.busy() && !weeks && !ending) { var q = queued; queued = null; doHitch(q); }
      E.update(dt);
      stepWeeks(dt);
      stepLife(dt);
      emitSmoke(dt);
      P.update(dt);
      tod += (todTarget - tod) * Math.min(1, dt * 0.8);
      draw(t / 1000);
      sinceSave += dt;
      if (worldDirty && sinceSave > 1.5) { sinceSave = 0; saveWorld(); save(); }
      sndT -= dt;
      if (sndT <= 0) {
        sndT = 0.1;
        var m = E.m, lvl = clamp(m.v / 210, 0, 1), wk = now() / 1000 - lastWork < 0.2;
        Farm.sound.engine(ending ? -1 : lvl);
        Farm.sound.soil(wk && (S.imp === "plow" || S.imp === "harrow") ? lvl : 0);
        Farm.sound.spray(wk && (S.imp === "sprayer" || S.imp === "spreader") ? lvl : 0);
      }
      frameMs += now() - t0; frames++;
    }
    requestAnimationFrame(loop);
  }

  // ---------- Timer ----------
  function onEnding(done) {
    ending = true; todTarget = 1;
    E.hold(false); E.inp.drag = null; E.inp.tap = null;
    hare = null;
    if (!E.busy() && E.m.phase === "work") E.play([{ dur: 0.6, lift: 1 }], function () { E.m.phase = "work"; });
    Farm.sound.engine(-1);
    setTimeout(done, reduce ? 800 : 3500);
  }
  function onWake() {
    ending = false; todTarget = 0;
    if (!E.busy() && E.m.phase === "work" && E.m.lift > 0) E.play([{ dur: 0.5, lift: 0 }]);
  }

  window.addEventListener("pagehide", function () { if (worldDirty) saveWorld(); save(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) { if (worldDirty) saveWorld(); save(); } });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });

  // ---------- Ghost hand ----------
  var ghost = Farm.ghost(function () {
    var r = cv.getBoundingClientRect(), m = E.m;
    var nx = nextImp();
    if (nx && $("panel").offsetParent && !$("imps").hidden) {
      var b = tiles[nx].getBoundingClientRect();
      return { pts: [[b.left + b.width / 2, b.top + b.height / 2]], tap: true };
    }
    if (learned.drag || m.phase !== "work" || E.busy()) return null;
    var R = E.machineRect(), y = r.top + R.ground - (R.ground - R.top) * 0.4, x = r.left + (R.left + R.right) / 2;
    var dx = m.dir * Math.min(180, r.width * 0.35);
    return { pts: [[x, y], [x + dx, y]], dur: 3200 };
  }, { ok: function () { return !weeks; } });

  // ---------- Start ----------
  resize();
  showCount(false);
  refreshTiles();
  if (S.phase === "park" && nextImp()) { /* the next tile glows */ }
  Toybox.init({
    app: "farm",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the tractor lifts its implement and stops, and the sky turns to evening. The timer keeps going on every Farm page.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The animals and machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "A soft tractor engine and field sounds. Hold for 2 seconds.",
    onEnding: onEnding,
    onWake: onWake,
    onBig: function () { setTimeout(resize, 30); },
    onSound: function (on) { if (on) Farm.sound.chime(); }
  });
  Toybox.offFirst({
    running: function () { return E.m.v > 0 || E.busy(); },
    off: function (done) { E.hold(false); E.inp.drag = null; Farm.sound.stop(); if (done) done(); }
  });
  requestAnimationFrame(loop);

  // Test hook, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) window.__farm = {
    state: function () {
      var m = E.m;
      return { lift: E.m.lift, imp: S.imp, attached: attached, tracks: S.tracks, passes: S.passes, lane: m.lane, x: m.x, dir: m.dir, v: m.v, phase: m.phase, busy: E.busy(),
        lanes: lanes.map(function (l) { return { a: l.a, b: l.b, lo: +l.lo.toFixed(3), hi: +l.hi.toFixed(3), by: l.by }; }),
        golden: isGolden(), weeks: !!weeks, next: nextImp(), coach: coach.text(), particles: P.a.length, gulls: gulls.length,
        hare: !!hare, rain: !!rain, face: faceT > 0, frameMs: frames ? frameMs / frames : 0 };
    },
    resetTiming: function () { frameMs = 0; frames = 0; },
    machine: function () { var r = cv.getBoundingClientRect(), R = E.machineRect(); return { x: r.left + (R.left + R.right) / 2, y: r.top + R.ground - (R.ground - R.top) * 0.4, left: r.left + R.left, right: r.left + R.right, top: r.top + R.top, ground: r.top + R.ground }; },
    lanePt: function (li, wx) { var r = cv.getBoundingClientRect(), g = E.geo(li); return { x: r.left + E.sx(wx, li), y: r.top + g.top + g.h * 0.5 }; },
    ghost: function () { return ghost.show(); },
    world: function () { return Farm.world.get(); }
  };
})();
</script>
</body>
</html>
