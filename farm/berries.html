<style>
:root {
  --bg: #CDE9FF; --panel: #FFFFFF; --ink: #1D2340; --muted: #4A5578; --edge: #1D2340; --accent: #FFC93C; --plate: #F4FAFF; --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.tb-head a { text-decoration: none; }
.stage { background: #A9DCFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
.loads { font-variant-numeric: tabular-nums; }
.loads.pop { animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel { display: none; }
body.ending .tb-panel, body.ending .homebtn, body.ending .mapbtn { pointer-events: none; opacity: 0.4; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
.mapbtn .tb-mapic { width: 30px; height: 30px; background: #FFFFFF; border-radius: 8px; }
/* The Go says a short phrase ("Shake them"): on a narrow row it wraps to two lines instead of being cut off. */
#steps .tb-go-word { white-space: normal; text-align: center; text-wrap: balance; }
@media (prefers-reduced-motion: reduce) { .loads.pop { animation: none; } }
</style>

  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="mapbtn" href="./" aria-label="Back to the farm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><svg class="tb-mapic" viewBox="0 0 40 40" aria-hidden="true"><path d="M3 33h34" stroke="#1D2340" stroke-width="3" stroke-linecap="round"/><path d="M8 33V18l8-8 8 8v15z" fill="#D2483D" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="12" y="22" width="8" height="11" fill="#A8352D" stroke="#1D2340" stroke-width="2"/><rect x="27" y="14" width="8" height="19" rx="2" fill="#D3DAE2" stroke="#1D2340" stroke-width="2.5"/></svg><span>Farm</span></a>

<script>
(function () {
  "use strict";
  // Juicy Squeezy: the blackcurrant harvest, the way the episode shows it. A field of blackcurrant bushes in long
  // rows, heavy with dark purple berries. Three jobs, one tap each:
  //   Shake: the tall straddle harvester drives OVER the row (the bushes pass through its middle). Its shaker
  //          rods shake each bush, the berries shower down onto the catching plates, ride the elevator up and
  //          drop into the crates on its platform.
  //   Load:  the green tractor brings the flatbed trailer alongside; the full crates roll onto it.
  //   Press: the trailer drives to the juice press. Each crate tips into the press basket, the press plate
  //          squeezes the berries, dark juice runs into the tank and fills the bottles, which line up on the bench.
  // Then weeks go by and the next row is ripe. The stage is split like Spuds in Mud: the field with the whole
  // machine on top (the farm's shared side view) and a close-up below (or beside) that always shows the work
  // happening now: looking into the harvester from the front (the shakers and the falling berries), a closer
  // side view of the crates going onto the trailer, then the inside of the juice press.
  // Machine drawings live here for now, written like farm.js's (metres, y up negative, facing +x) so they can
  // move into farm.js later: hvFar / hvNear (the straddle harvester's far and near halves, origin on the ground
  // under the shakers), hvEnd (the same from the front), flatbed (origin at the drawbar eye, ground at +0.5),
  // crateSide, bottle, pressHouse, blackbird.
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.u, clamp = U.clamp, lerp = U.lerp, ease = U.ease, hash = U.hash, mix = U.mix, INK = U.INK;
  var D = Farm.draw, SH = Farm.shape, snd = Farm.sound, TAU = Math.PI * 2;
  var P = SH.P, R = SH.R, C = SH.C, Ln = SH.Ln, tube = SH.tube, fs = SH.fs, rr = SH.rr;
  var NAME = (Farm.NAMES && Farm.NAMES.berries) || "Juicy Squeezy";
  document.title = NAME; $("title").textContent = NAME;
  function LWu() { return Farm.LW; }

  // ---------- State ----------
  var KEY = "farm-berries-v1";
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  if (startFresh) saved = {};
  var count = typeof saved.bottles === "number" && isFinite(saved.bottles) ? Math.max(0, Math.floor(saved.bottles)) : 0;
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ bottles: count })); } catch (e) { /* ignore */ } }
  function world(fn) { try { Farm.world.update(fn); } catch (e) { /* ignore */ } }
  world(function (w) { w.berries = "ripe"; });

  // the row: bushes every BS metres from x = 0.45 to the end of the field (L)
  var L = 16, BS = 0.9, NB = 18;
  function bx(i) { return 0.45 + i * BS; }
  var VPASS = 2.9, TR_R = 1.5, HX0 = -0.9, HX_END = L + 3.0, STORE_X = L + 23, GROW_T = 3.2;
  var ROWS = [2.05, 2.7, 3.5, 4.5, 5.5];        // the depths of the other rows, behind the one being picked
  var BERRY = "#3A1C4C", BERRY_HI = "#9A7BC0", UNRIPE = "#A8D25A", JUICE = "#6A1240", JUICE_HI = "#B04A80";
  var LEAF = "#3F8D36", LEAF_L = "#64B24F";
  var HVC = { body: "#F5A21E", dark: "#C47A0C", far: "#B98A3A" };
  var CRATE_C = "#3C9BD6", CRATE_D = "#24689A";
  var G = { grey: "#7C8696", steel: "#C3CCD6", frame: "#2B3040", glass: "#BFE7FA" };
  // The straddle harvester in machine units: origin on the ground under the shakers, facing +x. The crate
  // platform hangs on its far side at the front: cr = the crates' middles (filled in this order), deck = the
  // platform's top. x0 / x1 = its back and front ends.
  var HV = { fw: 1.75, rw: -1.85, wr: 0.55, deck: -1.7, cr: [2.36, 3.02, 3.68], crc: 3.02, cw: 0.6, ch: 0.46, x0: -2.45, x1: 4.1 };
  // the flatbed: its middle behind the drawbar eye, its deck height, the crates' places on it (trailer units).
  // Alongside, it waits just in front of the harvester (on the far side), so the crates roll forward onto it.
  var FBC = 3.5, FB_DECK = -1.08, FBXS = [-4.75, -3.55, -2.35];
  function fbX(j) { return FBXS[j]; }

  // The steps. go = the Go pill, ready = the coach while it waits for him, work = while it works, busy = when he
  // taps while it works.
  var JOBS = {
    shake: { go: "Shake them", step: "Shake", ready: "Shake the berries off the bushes.", work: "The shaker rods shake the bushes.", busy: "The harvester is shaking the bushes." },
    load: { go: "Load them", step: "Load", ready: "Put the crates on the trailer.", work: "The crates roll onto the trailer.", busy: "The crates are going on." },
    press: { go: "Press them", step: "Press", ready: "Now press the berries.", work: "The press squeezes out the juice.", busy: "The press is squeezing." }
  };
  var ORDER = ["shake", "load", "press"];
  var field = { stage: "ripe", g: 1 };
  var job = "shake", phase = "arrive", phaseT = 0, auto = false, grab = null, ending = false, dusk = 0;
  var hv = { on: true, x: HX0 - 9, v: 0, wheel: 0, target: HX0, run: 0, flash: 0 };
  var crates = [{ load: 0 }, { load: 0 }, { load: 0 }], slot = 0, slotF = 0;
  var tr = { x: -40, r: TR_R, v: 0, wheel: 0, state: "away", t: 0, lane: 0, crates: [-1, -1, -1] };
  var ld = { t: 0 };                               // the loading run
  var pr = { t: 0, n: 0, show: 0 };                // the press run: bottles filled in this batch
  var carry = null;                                 // a crate going from the trailer into the press house
  var bird = null, shuf = null;

  function locked() { return ending || (window.Toybox && Toybox.timer.locked()); }
  function shaking() { return phase === "drive" && hv.v > 0.3; }
  function progress() { return clamp((hv.x - HX0) / (L + 0.3 - HX0), 0, 1); }

  // ---------- The stage: the field view and the close-up ----------
  var phoneCoach = window.matchMedia ? matchMedia("(max-width: 600px), (orientation: landscape) and (max-height: 520px)") : null;
  function topRoom() { return phoneCoach && phoneCoach.matches ? 34 : 66; }
  function gyOf(w, h) { var port = h > w * 1.05, short = !port && h < 460; return h * (short ? 0.75 : 0.7); }
  var zoomF = { span: 8.6, target: 8.6 }, zoomC = { span: 6.4, target: 6.4 };
  var scF = new Farm.Scene({ L: L, xmin: -14, xmax: STORE_X + 16, fit: function (w, h) { return Math.min(w * 0.9 / zoomF.span, (gyOf(w, h) - topRoom()) / 4.95); } });
  var scC = new Farm.Scene({ L: L, xmin: -14, xmax: STORE_X + 16, fit: function (w, h) { return Math.min(w * 0.94 / zoomC.span, (gyOf(w, h) - 12) / 3.0); } });
  var parts = new Farm.Particles();
  var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
  var W = 300, H = 300, DPR = 1, time = 0;
  var RG = { f: { x: 0, y: 0, w: 300, h: 150 }, c: { x: 0, y: 150, w: 300, h: 150 }, side: false, pad: 8 };
  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(50, r.width); H = Math.max(50, r.height);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    RG.side = W / H > 1.4;
    if (RG.side) { var fw = Math.round(W * 0.56); RG.f = { x: 0, y: 0, w: fw, h: H }; RG.c = { x: fw, y: 0, w: W - fw, h: H }; }
    else { var fh = Math.round(H * 0.52); RG.f = { x: 0, y: 0, w: W, h: fh }; RG.c = { x: 0, y: fh, w: W, h: H - fh }; }
    // On phones the coach pill sits at the bottom of the stage: keep the close-up's story above it.
    RG.pad = phoneCoach && phoneCoach.matches ? 48 : 8;
    scF.layout(RG.f.w, RG.f.h); scC.layout(RG.c.w, RG.c.h);
    scF.follow(camTarget(), 0, true); scC.follow(camC(), 0, true);
  }

  // ---------- Coach, counter, name tags ----------
  var coach = Toybox.coach($("coach"));
  function setCount() { var el = $("loads"); el.textContent = "Bottles: " + count; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  $("loads").textContent = "Bottles: " + count;
  function tagAt(text, x, y) { var b = cv.getBoundingClientRect(); Toybox.nametag(text, b.left + x, b.top + y, 2400); }
  // a point on the harvester in the field view: dx metres from its origin, ly in machine units (y up negative)
  function hvScreen(dx, ly) { return { x: scF.X(hv.x, 1) + dx * scF.k, y: scF.gY + ly * scF.k }; }
  function tagHv() { var p = hvScreen(0.8, -4.9); tagAt("Blackcurrant harvester", p.x, Math.max(26, p.y)); }

  // =====================================================================================================
  // Drawings (machine units)
  // =====================================================================================================
  function shine(x1, y1, x2, y2, w) { Ln(ctx, x1, y1, x2, y2, "rgba(255,255,255,0.45)", w); }
  // a tyre with tread marks that turn, a rim and a hub (rot in radians)
  function tyre(x, y, r, rot, rim, dark) {
    C(ctx, x, y, r, dark ? "#24262D" : "#33363F");
    ctx.save(); ctx.translate(x, y);
    for (var i = 0; i < 10; i++) { var a = rot + i * TAU / 10; Ln(ctx, Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8, Math.cos(a) * r * 0.98, Math.sin(a) * r * 0.98, "#1E2026", r * 0.12); }
    ctx.restore();
    C(ctx, x, y, r * 0.56, rim || (dark ? "#8C97A6" : "#E2E6EB"), LWu() * 0.8);
    C(ctx, x, y, r * 0.22, "#8C97A6", LWu() * 0.6);
    for (i = 0; i < 5; i++) { var b = rot + i * TAU / 5; C(ctx, x + Math.cos(b) * r * 0.38, y + Math.sin(b) * r * 0.38, r * 0.05, "#6E7887", 0); }
  }
  // the driver in a cab: shoulders, head and cap (front: facing us)
  function driverU(x, y, s, front) {
    R(ctx, x - 0.26 * s, y + 0.1 * s, 0.52 * s, 0.5 * s, 0.16 * s, "#3D6FB6", LWu() * 0.7);
    C(ctx, x, y, 0.17 * s, "#F2C8A0", LWu() * 0.7);
    if (front) {
      P(ctx, [x - 0.19 * s, y - 0.05 * s, x - 0.16 * s, y - 0.2 * s, x + 0.16 * s, y - 0.2 * s, x + 0.19 * s, y - 0.05 * s], "#E8473B", LWu() * 0.6);
      C(ctx, x - 0.06 * s, y + 0.02 * s, 0.022 * s, INK, 0); C(ctx, x + 0.06 * s, y + 0.02 * s, 0.022 * s, INK, 0);
      ctx.beginPath(); ctx.arc(x, y + 0.06 * s, 0.06 * s, 0.2 * Math.PI, 0.8 * Math.PI); ctx.lineWidth = LWu() * 0.7; ctx.strokeStyle = INK; ctx.stroke();
    } else P(ctx, [x - 0.18 * s, y - 0.04 * s, x - 0.16 * s, y - 0.2 * s, x + 0.16 * s, y - 0.2 * s, x + 0.3 * s, y - 0.06 * s], "#E8473B", LWu() * 0.6);
  }
  // a cluster of berries hanging from a stalk (a strig): top at (x, y), n berries of radius r
  function strig(x, y, n, r, col, sw) {
    Ln(ctx, x, y - r, x + sw, y + (n - 1) * r * 1.5, "#5A7A2E", r * 0.35);
    for (var q = 0; q < n; q++) {
      var px = x + sw * q / Math.max(1, n - 1) + (q % 2 ? r * 0.5 : -r * 0.4), py = y + q * r * 1.5;
      C(ctx, px, py, r, col, LWu() * 0.55);
      C(ctx, px - r * 0.35, py - r * 0.35, r * 0.28, "rgba(255,255,255,0.45)", 0);
    }
  }
  // One blackcurrant bush seen from the side, its foot at (x, 0). ber = berries on it (0 = picked),
  // g = ripeness (0 green, 1 dark purple), jig = it is being shaken.
  var BUSH = [[-0.3, -0.7, 0.33], [0.3, -0.74, 0.35], [0, -1.07, 0.36], [-0.14, -0.48, 0.28], [0.2, -0.46, 0.27], [0.02, -0.82, 0.3]];
  function bushSide(x, k, ber, g, jig) {
    var j = jig ? Math.sin(time * 34 + k) * 0.06 : Math.sin(time * 1.3 + k * 0.7) * 0.012, i;
    Ln(ctx, x, 0, x - 0.2 + j * 0.4, -0.52, INK, 0.12); Ln(ctx, x, 0, x - 0.2 + j * 0.4, -0.52, "#7A5234", 0.07);
    Ln(ctx, x, 0, x + 0.17 + j * 0.4, -0.55, INK, 0.12); Ln(ctx, x, 0, x + 0.17 + j * 0.4, -0.55, "#7A5234", 0.07);
    // foliage: one outline round the clumps (a thick ink pass, then the fills)
    for (i = 0; i < BUSH.length; i++) { ctx.beginPath(); ctx.arc(x + BUSH[i][0] + j, BUSH[i][1], BUSH[i][2], 0, TAU); ctx.lineWidth = LWu() * 2; ctx.strokeStyle = INK; ctx.stroke(); }
    for (i = 0; i < BUSH.length; i++) { ctx.beginPath(); ctx.arc(x + BUSH[i][0] + j, BUSH[i][1], BUSH[i][2], 0, TAU); ctx.fillStyle = i % 2 ? LEAF : "#47973C"; ctx.fill(); }
    for (i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x + BUSH[i][0] + j - 0.08, BUSH[i][1] - 0.1, BUSH[i][2] * 0.45, 0, TAU); ctx.fillStyle = LEAF_L; ctx.fill(); }
    if (ber > 0) {
      var col = mix(UNRIPE, BERRY, g), n = Math.round(6 * ber);
      for (i = 0; i < n; i++) strig(x + (hash(k, i) - 0.5) * 0.72 + j, -0.5 - hash(i, k + 3) * 0.6, 3, 0.075, col, 0.04);
    }
  }
  // A plastic berry crate seen from the side: bottom middle at (cx, yb); load 0..1 (the berries heap above the
  // rim when it is full).
  function crateSide(cx, yb, w, h, load) {
    var x0 = cx - w / 2, top = yb - h, lv = clamp(load, 0, 1), i;
    if (lv > 0.55) {
      var hh = (lv - 0.55) / 0.45 * h * 0.42;
      ctx.beginPath(); ctx.moveTo(x0 + w * 0.04, top + 0.01);
      for (i = 0; i <= 8; i++) { var f = i / 8; ctx.lineTo(x0 + w * 0.04 + w * 0.92 * f, top - hh * Math.pow(Math.sin(f * Math.PI), 0.6)); }
      ctx.closePath(); fs(ctx, BERRY, LWu() * 0.7);
      for (i = 0; i < 6; i++) { var fx = 0.15 + 0.7 * hash(i, 3); C(ctx, x0 + w * fx, top - hh * 0.6 * Math.sin(fx * Math.PI) * hash(i, 5), w * 0.06, BERRY_HI, 0); }
    }
    R(ctx, x0, top, w, h, w * 0.06, CRATE_C);
    // the slots in the side show the berries inside up to the load
    for (i = 0; i < 2; i++) {
      var sy = top + h * (0.22 + i * 0.36), full = lv > (1 - i * 0.4 - 0.5);
      R(ctx, x0 + w * 0.12, sy, w * 0.76, h * 0.16, h * 0.06, full ? BERRY : CRATE_D, LWu() * 0.5);
    }
    shine(x0 + w * 0.1, top + h * 0.08, x0 + w * 0.9, top + h * 0.08, h * 0.06);
  }
  // The straddle harvester's far half: drawn before the row, so the bushes pass in front of it. st = { wheel,
  // time, work, run (belt phase), slot (0..2, the crate being filled), crates: [{ x, load, hop }] }
  var E0 = [1.15, -0.34], E1 = [2.02, -2.62];
  function hvFar(st) {
    var sh = st.work ? Math.sin(time * 30) * 0.05 : 0, i;
    ctx.save(); ctx.translate(0.16, -0.1);
    R(ctx, 1.52, -2.85, 0.46, 1.95, 0.06, HVC.far);
    R(ctx, -2.08, -2.85, 0.46, 1.95, 0.06, HVC.far);
    tyre(HV.fw, -HV.wr, HV.wr, st.wheel / HV.wr, null, true);
    tyre(HV.rw, -HV.wr, HV.wr, st.wheel / HV.wr, null, true);
    R(ctx, -0.12 + sh, -2.4, 0.24, 2.0, 0.08, "#4F5866");
    ctx.restore();
    // the elevator: from the catching plates up to the crate conveyor
    var ang = Math.atan2(E1[1] - E0[1], E1[0] - E0[0]);
    tube(ctx, E0[0], E0[1], E1[0], E1[1], 0.3, "#5D6675");
    for (i = 0; i < 9; i++) {

    if (Math.random() < dt * 26) parts.add({ kind: "dot", x: hv.x + (Math.random() - 0.5) * 1.1, h: 0.6 + Math.random() * 0.7, r: 0.995, vx: (Math.random() - 0.5) * 0.4, vh: 0, g: 9, floor: 0.32, life: 0.55, size: 0.07, col: BERRY });
  }
  function updateTrailer(dt) {
    if (tr.state === "come") {
      var target = trWithX(), d = target - tr.x;
      tr.v = clamp(d * 2.2, 1.2, 14); tr.x += Math.min(tr.v * dt, Math.max(d, 0.001)); tr.wheel += tr.v * dt;
      if (d < 0.02 && HX_END - hv.x < 0.05) {
        tr.x = target; tr.v = 0; tr.state = "with";
        setPhase("ready"); steps.busy(false);
        tagAt("Flatbed trailer", trScreenF().x - 2.4 * trScreenF().s, trScreenF().y - 2.4 * trScreenF().s);
        snd.clunk();
      }
    } else if (tr.state === "go") {
      tr.t += dt;
      var tg = parkX(scF), dg = tg - tr.x;
      tr.v = Math.min(clamp(dg * 2.2, 1.2, 15), tr.v + dt * 8); tr.x += Math.min(tr.v * dt, Math.max(dg, 0.01)); tr.wheel += tr.v * dt;
      var rearW = tr.x - 5.7 * trScale(scF, tr.r) / scF.k;
      if (rearW > hv.x + HV.x1 + 0.4 || tr.lane) { tr.lane = Math.min(1, (tr.lane || 0) + dt / 1.1); tr.r = lerp(TR_R, scF.TRACK, ease(tr.lane)); }
      if (dg < 0.05 && tr.lane >= 1) { tr.x = tg; atPress(); }
    }
  }
  var LT = 1.2;
  function updateLoad(dt) {
    var b = ld.t; ld.t += dt;
    for (var j = 0; j < 3; j++) {
      var t0 = j * LT;
      if (b < t0 && ld.t >= t0) { crates[j].moving = true; snd.tick(); }
      if (b < t0 + LT * 0.85 && ld.t >= t0 + LT * 0.85) { crates[j].moving = false; crates[j].load = -1; tr.crates[j] = 1; snd.clunk(); }
    }
    if (ld.t >= 3 * LT + 0.5) loadDone();
  }
  function movingCrate() {
    for (var j = 0; j < 3; j++) if (crates[j].moving) return { j: j, f: clamp((ld.t - j * LT) / (LT * 0.85), 0, 1) };
    return null;
  }
  function updatePress(dt) {
    var b = pr.t; pr.t += dt;
    for (var k = 0; k < 3; k++) { var t0 = k * TIP; if (b < t0 && pr.t >= t0) { tr.crates[k] = -1; carry = { k: k, t: 0 }; snd.clunk(); } }
    for (var j = 0; j < NBOT; j++) {
      var tc = T_B0 + j * TB + TB * 0.6;
      if (b < tc && pr.t >= tc) {
        count++; pr.show = j + 1; save(); setCount(); snd.pop(); if (j === NBOT - 1) snd.chime();
        world(function (w) { w.juice = (typeof w.juice === "number" && isFinite(w.juice) ? w.juice : 0) + 1; });
      }
    }
    if (pr.t >= T_END) finishJob();
  }

  // ---------- Drawing the field (and the side close-up: the same world, nearer) ----------
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(RG.f.x, RG.f.y);
    ctx.beginPath(); ctx.rect(0, 0, RG.f.w, RG.f.h); ctx.clip();
    drawWorld(scF, true);
    ctx.restore();
    drawClose();
  }
  function farRow(S, r) {
    var s = S.S(r), y = S.Y(r), xa = S.X(-0.1, r), xb = S.X(L + 0.1, r), n = scF.night || 0, i;
    if (xb < -20 || xa > S.W + 20) return;
    var h = 1.35 * s;
    ctx.fillStyle = mix("#8A6A45", "#2B3A55", n * 0.4);
    ctx.beginPath(); ctx.moveTo(xa - s * 0.3, y + s * 0.08); ctx.lineTo(xb + s * 0.3, y + s * 0.08); ctx.lineTo(xb + s * 0.2, y - s * 0.1); ctx.lineTo(xa - s * 0.2, y - s * 0.1); ctx.closePath(); ctx.fill();
    var i0 = 0, i1 = NB - 1, x0 = S.X(bx(0) - 0.45, r);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0, y - h * 0.55);
    for (i = i0; i <= i1; i++) {
      var cx = S.X(bx(i), r), ex = S.X(bx(i) + 0.45, r);
      ctx.quadraticCurveTo(cx, y - h * (1.3 + 0.18 * hash(i, r * 10)), ex, y - h * 0.6);
    }
    ctx.lineTo(S.X(bx(i1) + 0.45, r), y); ctx.closePath();
    ctx.fillStyle = mix(r < 2.4 ? "#47973C" : "#4E9E44", "#2B3A55", n * 0.45 + (r - 2) * 0.03); ctx.fill();
    ctx.lineWidth = Math.max(1, Math.min(S.lw * 0.8, s * 0.04)); ctx.strokeStyle = INK; ctx.stroke();
    if (s * 0.07 > 1.2) {
      ctx.fillStyle = mix(UNRIPE, BERRY, ripeG());
      var rg = S.xRange(r);
      for (i = Math.max(0, Math.floor(rg[0] / BS) - 1); i <= Math.min(NB - 1, Math.ceil(rg[1] / BS) + 1); i++) {
        for (var q = 0; q < 4; q++) {
          var px = S.X(bx(i) + (hash(i, q + r) - 0.5) * 0.7, r), py = y - h * (0.35 + 0.5 * hash(q, i + r));
          ctx.beginPath(); ctx.arc(px, py, Math.max(1.2, s * 0.07), 0, TAU); ctx.fill();
        }
      }
    }
  }
  function rowBushes(S) {
    var rg = S.xRange(1), i0 = Math.max(0, Math.floor((rg[0] - 1) / BS)), i1 = Math.min(NB - 1, Math.ceil((rg[1] + 1) / BS));
    var g = ripeG(), wk = shaking();
    for (var i = i0; i <= i1; i++) {
      var x = bx(i), ber = 1;
      if (field.stage === "picked") ber = 0;
      else if (hv.on && job === "shake" && phase === "drive" && x < hv.x + 0.25) ber = 0;
      bushSide(x, i, ber, g, wk && Math.abs(x - hv.x) < 0.9);
    }
  }
  function drawWorld(S, isField) {
    S.sky(ctx, { time: time, arc: phase === "grow" ? clamp(phaseT / GROW_T, 0, 1) : null, season: "summer", dusk: dusk });
    S.hedge(ctx, { season: "summer" });
    for (var k = ROWS.length - 1; k >= 0; k--) farRow(S, ROWS[k]);
    // the soil strip under our row
    var y1 = S.Y(1), n = scF.night || 0;
    ctx.fillStyle = mix("#8A6A45", "#2B3A55", n * 0.4); ctx.fillRect(S.X(-0.2, 1), y1 - S.k * 0.06, (L + 0.4) * S.k, S.k * 0.12);
    if (tr.state !== "away" && tr.r > 1) drawTrailer(S);
    if (hv.on) S.put(ctx, hv.x, 1, 1, function () { hvFar(hvSt()); });
    drawMovingCrate(S);
    S.put(ctx, 0, 1, 1, function () { rowBushes(S); });
    parts.draw(ctx, S, function (p) { return p.r > 0.97 && p.r < 1.03; });
    if (hv.on) S.put(ctx, hv.x, 1, 1, function () { hvNear(hvSt()); });
    S.verge(ctx, {});
    S.put(ctx, STORE_X, 1.02, 1, pressHouse);
    drawCarry(S);
    if (tr.state !== "away" && tr.r <= 1) drawTrailer(S);
    parts.draw(ctx, S, function (p) { return p.r <= 0.97 || p.r >= 1.03; });
    drawBird(S);
  }
  function trCrates() {
    return tr.crates.map(function (ld2, j) { if (ld2 < 0) return null; var s = shufAt(j, "trailer"); return { x: slotX([fbX(0), fbX(1), fbX(2)], s.p), load: ld2, hop: s.hop }; });
  }
  function drawTrailer(S) {
    var t = trScreenIn(S);
    if (t.x - 6 * t.s > S.W + 20 || t.x + 5 * t.s < -20) return;
    Farm.inUnits(ctx, t.x, t.y, t.s, S.lw, function () {
      ctx.translate(0, -0.5);
      flatbed({ wheel: tr.wheel, crates: trCrates() });
      ctx.translate(-Farm.DRAWBAR[0], 0.5);
      D.tractor(ctx, { wheel: tr.wheel, time: time, drawbar: true });
    });
  }
  // a crate rolling from the harvester's platform back onto the flatbed
  function drawMovingCrate(S) {
    var m = movingCrate();
    if (!m) return;
    var a = { x: S.X(hv.x + HV.cr[m.j], 1), y: S.gY + HV.deck * S.k, s: S.k };
    var t = trScreenIn(S), b = { x: t.x + fbX(m.j) * t.s, y: t.y + (FB_DECK - 0.55) * t.s, s: t.s };
    var f = ease(m.f), x = lerp(a.x, b.x, f), y = lerp(a.y, b.y, f) - Math.sin(f * Math.PI) * 0.35 * S.k, s = lerp(a.s, b.s, f);
    Farm.inUnits(ctx, x, y, s, S.lw, function () { crateSide(0, 0, HV.cw, HV.ch, 1); });
  }
  // a crate going off the trailer into the press house
  function drawCarry(S) {
    if (!carry) return;
    var t = trScreenIn(S), f = ease(clamp(carry.t / 0.6, 0, 1));
    var a = { x: t.x + fbX(carry.k) * t.s, y: t.y + (FB_DECK - 0.55) * t.s };
    var dx = S.X(STORE_X + (DOOR[0] + DOOR[1]) / 2 * 1.02, 1.02), dy = S.Y(1.02) - 0.9 * S.S(1.02);
    ctx.save(); ctx.globalAlpha *= 1 - f * 0.8;
    Farm.inUnits(ctx, lerp(a.x, dx, f), lerp(a.y, dy, f), lerp(t.s, S.S(1.02) * 0.9, f), S.lw, function () { crateSide(0, 0, HV.cw, HV.ch, 1); });
    ctx.restore();
  }
  function drawBird(S) {
    if (!bird) return;
    var b = bird, t = b.t, s = S.S(b.r), x0 = S.X(b.x, b.r), y0 = S.Y(b.r) - b.h * s, x, y, fly = true, berry = false;
    if (t < BIRD.inT) { var f = ease(t / BIRD.inT); x = lerp(x0 + 7 * s, x0, f); y = lerp(y0 - 5 * s, y0, f) - Math.sin(f * Math.PI) * s; }
    else if (t < BIRD.inT + BIRD.peck) { x = x0; y = y0; fly = false; var pk = (t - BIRD.inT) / BIRD.peck; berry = pk > 0.6; if (pk < 0.6) y += Math.abs(Math.sin(pk * 18)) * s * 0.06; }
    else { var f2 = ease((t - BIRD.inT - BIRD.peck) / BIRD.outT); x = lerp(x0, x0 - 8 * s, f2); y = lerp(y0, y0 - 6 * s, f2); berry = true; }
    blackbird(x, y, s * 1.9, time * 3, true, fly, berry);
  }

  // ---------- Loop ----------
  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
    if (!(window.Toybox && Toybox.timer.phase() === "resting")) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  function onEnding(done) { ending = true; auto = false; grab = null; hv.v = 0; setTimeout(function () { snd.engine(-1); snd.soil(0); snd.pour(0); done(); }, 2600); }
  function onWake() { ending = false; dusk = 0; }

  // ---------- Start ----------
  resize();
  bringIn();
  hv.x = HX0 - 6;
  zoomF.span = zoomF.target; scF.layout(RG.f.w, RG.f.h);
  scF.follow(camTarget(), 0, true); scC.follow(camC(), 0, true);
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  else window.addEventListener("resize", resize);

  Toybox.init({
    app: "farm",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the machines stop and park, and the controls lock. The timer carries on across the farm pages.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "Soft engine, shaking and pouring sounds. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: onWake,
    onWake: onWake,
    onSound: function (on) { if (on) snd.chime(); }
  });
  requestAnimationFrame(loop);

  if (/[?&]debug\b/.test(location.search)) window.__farm = {
    state: function () { return { phase: phase, job: job, step: steps.current(), finished: steps.finished(), x: hv.x, field: field.stage, trailer: tr.state, crates: crates.map(function (c) { return c.load; }), onTrailer: tr.crates.slice(), count: count, coach: coach.text(), cmode: cmode, bird: !!bird, shuf: shuf ? shuf.what : null }; },
    screen: function (id) {
      var b = cv.getBoundingClientRect(), p;
      if (id === "crate") p = closeCrate();
      else if (id === "press") p = pressScreen();
      else if (id === "hvc") p = { x: RG.c.x + CX(0.3), y: RG.c.y + CY(-1.2) };
      else p = hvPart();
      return { x: b.left + p.x, y: b.top + p.y };
    },
    surprise: surprise,
    ghost: function () { return ghost.show(); }
  };
})();
</script>
