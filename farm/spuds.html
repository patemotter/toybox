<style>
:root {
  --bg: #CDE9FF; --panel: #FFFFFF; --ink: #1D2340; --muted: #4A5578; --edge: #1D2340; --accent: #FFC93C; --plate: #F4FAFF; --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.tb-head a { text-decoration: none; }
.stage { background: #A9DCFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
.loads { font-variant-numeric: tabular-nums; }
.loads.pop { animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel { display: none; }
body.ending .tb-panel, body.ending .homebtn, body.ending .mapbtn { pointer-events: none; opacity: 0.4; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
.mapbtn .tb-mapic { width: 30px; height: 30px; background: #FFFFFF; border-radius: 8px; }
/* The Go says a short phrase ("Take out stones"): on a narrow row it wraps to two lines instead of being cut off. */
#steps .tb-go-word { white-space: normal; text-align: center; text-wrap: balance; }
@media (prefers-reduced-motion: reduce) { .loads.pop { animation: none; } }

<body>
<div class="tb-app-shell tb-v2 wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="mapbtn" href="./" aria-label="Back to the farm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><svg class="tb-mapic" viewBox="0 0 40 40" aria-hidden="true"><path d="M3 33h34" stroke="#1D2340" stroke-width="3" stroke-linecap="round"/><path d="M8 33V18l8-8 8 8v15z" fill="#D2483D" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="12" y="22" width="8" height="11" fill="#A8352D" stroke="#1D2340" stroke-width="2"/><rect x="27" y="14" width="8" height="19" rx="2" fill="#D3DAE2" stroke="#1D2340" stroke-width="2.5"/></svg><span>Farm</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title" id="title">Spuds in Mud</h1>

  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A potato field with a green tractor and a bed former, and a close-up of the rows in the soil. Tap the tractor to make the rows."></canvas>
      <div class="tb-counter loads" id="loads">Loads: 0</div>
      <div id="coach"></div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
    <section class="tb-panel" id="panel">
      <ol id="steps"></ol>
      <div id="bottom"></div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";
  // Spuds in Mud: the potato year on one field, the way the episode shows it. Four machines, one tap each:
  // the bed former makes the rows, the destoner takes out the stones, the potato planter plants, weeks go by
  // (automatic), the potato harvester digs them up into a trailer, and the trailer tips them into the store.
  // The stage is split: the field with the whole rig on it (side view, the farm's shared scene), and a close-up
  // that looks along the rows from just behind the machine, with a cut through the soil, so he SEES the job:
  // the rows rising, stones riding the conveyor into the wheeling, seed potatoes dropping into the row, new
  // potatoes growing under the plant, and the harvest riding up the elevator into the trailer beside it.
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.u, clamp = U.clamp, lerp = U.lerp, ease = U.ease, hash = U.hash, mix = U.mix, INK = U.INK;
  var D = Farm.draw, RV = Farm.rear, SH = Farm.shape, snd = Farm.sound, M = Farm.MACHINES;
  var NAME = Farm.NAMES.spuds;
  document.title = NAME; $("title").textContent = NAME;

  // ---------- State ----------
  var KEY = "farm-spuds-v1";
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  if (startFresh) { saved = {}; Farm.world.update(function (w) { w.spuds = "soil"; }); }
  var loads = typeof saved.loads === "number" ? saved.loads : 0;
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ loads: loads })); } catch (e) { /* ignore */ } }

  var L = 24, STORE_X = L + 20, VPASS = 5.6, TR_FAR = 1.7;
  // The jobs in order. go = the Go pill (what will happen), ready = the coach while it waits for him,
  // work = the coach while the machine works, span = how much of the field the camera shows (whole rig).
  var JOBS = {
    rows: { m: "bedformer", to: "beds", go: "Make the rows", step: "Rows", tag: "Bed former", span: 11.5,
      ready: "The bed former makes rows.", work: "Look! Rows of soil for the potatoes.", busy: "The bed former is making the rows." },
    stones: { m: "destoner", to: "destoned", go: "Take out stones", step: "Stones", tag: "Destoner", span: 15,
      ready: "The destoner takes out the stones.", work: "The stones roll into the furrow.", busy: "The destoner is taking out the stones." },
    plant: { m: "planter", to: "planted", go: "Plant potatoes", step: "Plant", tag: "Potato planter", span: 11.5,
      ready: "Now plant the seed potatoes.", work: "The potatoes go into the rows.", busy: "The planter is planting." },
    dig: { m: "harvester", to: "harvested", go: "Dig them up", step: "Dig", tag: "Potato harvester", span: 18,
      ready: "The potatoes are ready to dig.", work: "The potatoes ride up into the trailer.", busy: "The harvester is digging." }
  };
  var ORDER = ["rows", "stones", "plant", "dig"];
  var w0 = Farm.world.get();
  var field = { stage: w0.spuds, g: 1, wipe: null };
  var job = ({ soil: "rows", harvested: "rows", beds: "stones", destoned: "plant", planted: "plant", grown: "dig" })[field.stage] || "rows";
  if (field.stage === "planted") field.stage = "destoned";        // the growing happens on screen: plant again
  var rig = { m: null, x: -20, v: 0, wheel: 0, out: 0, flash: 0 };
  var tr = { x: -60, r: 1.7, v: 0, wheel: 0, load: 0, tip: 0, state: "away", t: 0 };
  var phase = "arrive", phaseT = 0, auto = false, grab = null, ending = false, dusk = 0;
  var storeLevel = Math.min(1.1, w0.potatoes / 8), storeRun = 0, growG = 0;
  var gulls = [], rock = null;

  function trailed() { return rig.m && M[rig.m].trailed; }
  function hitchOff() { return trailed() ? -Farm.DRAWBAR[0] : -Farm.HITCH[0]; }
  function workX() { return rig.x - hitchOff() - M[rig.m].work; }
  function rearX() { return rig.x - hitchOff() - M[rig.m].len; }
  function startX(m) { return -0.8 + (m.trailed ? -Farm.DRAWBAR[0] : -Farm.HITCH[0]) + m.work; }
  function locked() { return ending || (window.Toybox && Toybox.timer.locked()); }
  function progress() { if (phase === "drive") return clamp(workX() / L, 0, 1); return phase === "leave" || phase === "out" ? 1 : 0; }

  // ---------- The stage: the field view and the close-up ----------
  var zoom = { span: 11.5, target: 11.5 };
  var sc = new Farm.Scene({ L: L, xmin: -16, xmax: STORE_X + 9, rowDz: 1.4, fit: function (w, h) { return Math.min(w * 0.92 / zoom.span, h * 0.42 / 3.6); } });
  var parts = new Farm.Particles();
  var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
  var W = 300, H = 300, DPR = 1, time = 0;
  var RG = { f: { x: 0, y: 0, w: 300, h: 150 }, c: { x: 0, y: 150, w: 300, h: 150 }, side: false, pad: 8 };
  var phoneCoach = window.matchMedia ? matchMedia("(max-width: 600px), (orientation: landscape) and (max-height: 520px)") : null;
  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(50, r.width); H = Math.max(50, r.height);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    RG.side = W / H > 1.4;
    if (RG.side) { var fw = Math.round(W * 0.56); RG.f = { x: 0, y: 0, w: fw, h: H }; RG.c = { x: fw, y: 0, w: W - fw, h: H }; }
    else { var fh = Math.round(H * 0.52); RG.f = { x: 0, y: 0, w: W, h: fh }; RG.c = { x: 0, y: fh, w: W, h: H - fh }; }
    // On phones the coach pill sits at the bottom of the stage: keep the close-up's story above it.
    RG.pad = phoneCoach && phoneCoach.matches ? 48 : 8;
    sc.layout(RG.f.w, RG.f.h);
    sc.follow(camTarget(), 0, true);
  }
  function setZoom(span, snap) { zoom.target = span; if (snap) { zoom.span = span; sc.layout(RG.f.w, RG.f.h); } }

  // ---------- Coach, counter, name tags ----------
  var coach = Toybox.coach($("coach"));
  function setLoads() { var el = $("loads"); el.textContent = "Loads: " + loads; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  $("loads").textContent = "Loads: " + loads;
  function mScreen(lx, ly) { var o = trailed() ? Farm.DRAWBAR : Farm.HITCH; return { x: sc.X(rig.x, 1) + (o[0] + lx) * sc.k, y: sc.gY + (o[1] + ly) * sc.k }; }
  function tagAt(text, x, y) { var b = cv.getBoundingClientRect(); Toybox.nametag(text, b.left + x, b.top + y, 2400); }
  function tagRig() { if (!rig.m) return; var p = mScreen(-M[rig.m].len * 0.5, -1.7); tagAt(JOBS[job].tag, p.x, Math.max(26, p.y)); }

  // ---------- The flow ----------
  function setPhase(p) { phase = p; phaseT = 0; }
  // a tractor with the job's machine drives in from the left to the start of the field; in the close-up the
  // machine is lowered onto the rows
  function bringIn(id) {
    job = id; var J = JOBS[id];
    steps.at(id);
    rig.m = J.m; rig.out = 0; rig.v = 0;
    rig.target = startX(M[J.m]); rig.x = rig.target - 10;
    setZoom(J.span);
    setPhase("arrive"); steps.busy(true);
    closeStart(id);
    if (id === "dig") { tr.state = "with"; tr.r = TR_FAR; tr.lane = 0; tr.load = 0; tr.tip = 0; }
  }
  function arrived() {
    setPhase("ready"); steps.busy(false); rig.v = 0;
    tagRig(); snd.clunk();
  }
  function go() {
    if (phase !== "ready" && !(phase === "drive" && !auto)) return false;
    if (phase === "ready") {
      setPhase("drive"); var J = JOBS[job];
      field.wipe = { bx: workX(), dir: 1, to: J.to };
      snd.horn();
      coach.say(J.work, 4);
    }
    if (rock) return true;
    auto = true; steps.busy(true);
    if (ghost) ghost.learned("go");
    return true;
  }
  function passDone() {
    auto = false; var J = JOBS[job];
    field.stage = J.to; field.wipe = null;
    cs.beyond2 = J.to; cs.mix = 0;
    Farm.world.update(function (w) { w.spuds = J.to; });
    if (job === "dig") { setPhase("out"); tr.state = "go"; tr.t = 0; steps.busy(true); coach.say("To the potato store!", 3); return; }
    steps.done(job);
    setPhase("leave"); steps.busy(true);
  }
  function startGrow() {
    setPhase("grow"); steps.busy(true); rig.m = null; growG = 0; field.stage = "grow"; field.g = 0;
    setZoom(13);
    closeStart("grow");
    coach.say("Weeks go by. The plants grow.", 3);
  }
  function grown() {
    field.stage = "grown"; field.g = 1; growG = 1;
    Farm.world.update(function (w) { w.spuds = "grown"; w.season = "autumn"; });
    bringIn("dig");
  }
  function again() {
    if (phase !== "done") return false;
    if (ghost) ghost.learned("again");
    tr.state = "away"; tr.x = -60; storeMix.target = 0;
    steps.reset();
    bringIn("rows");
    return true;
  }

  // ---------- Steps, bar, ghost ----------
  var PICS = { rows: "bedformer", stones: "destoner", plant: "planter", dig: "harvester" };
  var STEPS = ORDER.map(function (id) { var J = JOBS[id]; return { id: id, name: J.step, pic: Farm.pic(PICS[id]), go: J.go, coach: J.ready }; });
  var ghost = Toybox.ghost({
    max: 3,
    onShow: function (p, on) { if (steps) steps.pulse(on); },
    plan: function () {
      if (locked()) return null;
      var b = cv.getBoundingClientRect();
      if (rock) { var q = rockScreen(); return { pts: [[b.left + q.x, b.top + q.y]], tap: true, key: "rock" }; }
      if (phase === "ready") {
        var p = mScreen(-M[rig.m].work, -0.9);
        if (ghost.shown("go") >= 1) return { pts: [[b.left + p.x, b.top + p.y], [b.left + p.x + Math.min(RG.f.w * 0.35, 160), b.top + p.y]], key: "go" };
        return { pts: [[b.left + p.x, b.top + p.y]], tap: true, key: "go" };
      }
      if (phase === "done" && phaseT > 4) { var g = steps.go.el.getBoundingClientRect(); if (g.width) return { pts: [[g.left + g.width / 2, g.top + g.height / 2]], tap: true, key: "again" }; }
      return null;
    }
  });
  var steps = Toybox.steps($("steps"), {
    steps: STEPS, coach: coach, ghost: ghost,
    onGo: function () { return doGo(); },
    onAgain: function () { again(); },
    onBusy: function () { busyHint(); }
  });
  function doGo() {
    if (locked()) return false;
    if (rock) { popRock(); return true; }
    if (phase === "ready" || (phase === "drive" && !auto)) return go();
    if (phase === "done") return again();
    busyHint(); return true;
  }
  function busyHint() {
    if (rock) { popRock(); return; }
    if (phase === "grow") coach.say("The potatoes are still growing.", 3);
    else if (phase === "drive") { snd.horn(); rig.flash = 1.2; coach.say(JOBS[job].busy, 3); }
    else if (phase === "arrive") coach.say("Here comes the " + JOBS[job].tag.toLowerCase() + ".", 3);
    else if (phase === "leave") coach.say("Here comes the next machine.", 3);
    else if (phase === "out" || phase === "store") coach.say("The trailer is going to the store.", 3);
  }
  Toybox.bar($("bottom"), { onNew: startOver, onSurprise: surprise });

  function startOver() {
    if (locked()) return;
    parts.clear(); cps.length = 0; gulls = []; rock = null; closeGull = null;
    tr.state = "away"; tr.x = -60; auto = false; grab = null; storeMix.v = storeMix.target = 0;
    field.stage = "soil"; field.wipe = null;
    Farm.world.update(function (w) { w.spuds = "soil"; });
    steps.reset();
    bringIn("rows");
    setZoom(JOBS.rows.span, true);
    sc.follow(camTarget(), 0, true);
    coach.say("A new field!", 3);
  }

  // ---------- Surprise: a fun moment on the scene, taking turns ----------
  var surpriseN = 0, closeGull = null;
  function surprise() {
    if (locked()) return;
    var list = ["gulls"];
    if (phase === "drive" && (job === "stones" || job === "dig") && !rock && progress() < 0.8) list.unshift("rock");
    var pick = list[surpriseN++ % list.length];
    if (pick === "rock") {
      rock = { t: 0, x: 0.12, y: -0.98 }; auto = false; rig.flash = 99; snd.clunk();
      coach.say("A big rock is stuck. Tap it!", 4); return;
    }
    if (pick === "gulls") {
      gulls = [];
      for (var i = 0; i < 6; i++) gulls.push({ t: -i * 0.25, ox: -1 - i * 1.3 - Math.random(), r: 1.08 + Math.random() * 0.5, ph: Math.random() });
      closeGull = { t: -0.6 };
      coach.say("The gulls look for worms.", 3);
    }
  }
  function popRock() {
    if (!rock) return;
    var q = rock;
    cps.push({ kind: "rock", x: q.x, y: q.y, vx: -2.2, vy: -2.4, g: 9, r: 0.2, life: 2.6, spin: 5, floor: 0, bounce: 0.3 });
    rock = null; rig.flash = 0; snd.pop(); coach.say("Out comes the rock!", 3);
    if (ghost) ghost.learned("rock");
    if (phase === "drive") { auto = true; steps.busy(true); }
  }

  // ---------- The close-up: looking along the rows, a cut through the soil ----------
  // Close-up units are metres across the rows (x) and up (y negative), the ground at y = 0. Two rows (crests at
  // x = -0.5 and 0.5) make a bed, then a flat wheeling (where the wheels run and the stones go), then the next bed.
  var RH = 0.38;
  function bump(x) { var P = 2.6, xx = ((x + 1.3) % P + P) % P - 1.3, a = Math.abs(xx); if (a > 1.0) return 0; return Math.pow(0.5 + 0.5 * Math.cos(Math.PI * (a - 0.5) / 0.5), 0.65); }
  // views: cx = the middle, hw = half the width shown, up / dn = metres shown above / below the ground
  var VIEW = { rows: { cx: 0, hw: 1.15, up: 1.25, dn: 0.4 }, stones: { cx: -0.15, hw: 1.42, up: 1.5, dn: 0.42 }, plant: { cx: 0, hw: 1.2, up: 1.6, dn: 0.4 },
    grow: { cx: 0, hw: 1.2, up: 1.15, dn: 0.48 }, dig: { cx: 1.05, hw: 2.05, up: 2.85, dn: 0.36 } };
  var ccam = { cx: 0, hw: 1.3, up: 1.3, dn: 0.42 }, cview = "rows";
  var CL = { u: 100, gy: 100, hy: 20 };
  function clLayout() {
    var c = RG.c, avail = c.h - RG.pad - 6;
    var u = Math.min(c.w / (2 * ccam.hw), avail / (ccam.up + ccam.dn));
    var extra = avail - (ccam.up + ccam.dn) * u;
    CL.u = u; CL.gy = 6 + extra * 0.7 + ccam.up * u; CL.hy = Math.max(c.h * 0.07, CL.gy - 1.25 * u);
  }
  function CX(x) { return RG.c.w / 2 + (x - ccam.cx) * CL.u; }
  function CY(y) { return CL.gy + y * CL.u; }
  // the cut: ridge height (0..1), lumps, flattened (dug), the notch the planter opens in each row
  var cs = { ridge: 0, rough: 0, flat: 0, notch: [0, 0], lowered: 0, beyond: "soil", beyondG: 0 };
  var stones = [], pile = [], seeds = [], tubers = [], drops = [], riders = [], falls = [], cps = [];
  var spawnT = 0, dropT = 0, digLift = 0;
  function profH(x) {
    var b = bump(x), h = RH * b * cs.ridge;
    if (cs.rough > 0) h += cs.rough * 0.03 * (Math.sin(x * 23.1) + Math.sin(x * 41.7 + 1.3)) * b;
    for (var k = 0; k < 2; k++) if (cs.notch[k] > 0) { var d = Math.abs(x - (k ? 0.5 : -0.5)); if (d < 0.16) h -= cs.notch[k] * 0.2 * (0.5 + 0.5 * Math.cos(Math.PI * d / 0.16)); }
    if (cs.flat > 0) h = lerp(h, 0.04 + 0.015 * Math.sin(x * 11) + 0.01 * Math.sin(x * 29), cs.flat);
    return h;
  }
  function rnd(i, j) { return hash(i * 1.37 + 0.11, j * 2.71 + 0.3); }
  // set the close-up up for a job (its "before")
  function closeStart(id) {
    cview = id; stones = []; drops = []; riders = []; falls = []; spawnT = 0; dropT = 0; digLift = 0; rock = null;
    cs.lowered = 0; cs.notch = [0, 0]; cs.flat = 0; cs.level = 1; cs.beyond2 = null; cs.mix = 0; cs.told = false;
    if (id === "rows") { cs.ridge = 0; cs.rough = 0; cs.beyond = "soil"; seeds = []; tubers = []; pile = []; }
    else if (id === "stones") {
      cs.ridge = 1; cs.rough = 1; cs.beyond = "beds"; seeds = []; tubers = []; pile = [];
      var n = 0;
      [-0.5, 0.5].forEach(function (c, k) {
        for (var i = 0; i < 4; i++) {
          var x = c + (rnd(i, k) - 0.5) * 0.56, r = i === 3 ? 0.075 : 0.05 + 0.035 * rnd(i, k + 5);
          var top = -RH * bump(x) + r + 0.03, y = lerp(top, 0.22, 0.15 + 0.7 * rnd(i, k + 9));
          stones.push({ x: x, y: y, r: r, kind: i === 3 ? "clod" : "stone", s: "soil", t: 0, at: 0.04 + 0.07 * n++, seed: i + k * 7 });

    if (rock) rock.t += dt;
    if (tr.state === "with") { tr.v = rig.v; tr.x = trWithX(); tr.wheel = rig.wheel; tr.r = TR_FAR; }
    else if (tr.state === "off") { tr.t += dt; tr.v = Math.min(9, tr.v + dt * 6); tr.x += tr.v * dt; tr.wheel += tr.v * dt; if (tr.t > 4) tr.state = "away"; }
    rig.wheel += rig.v * dt;
    if (phase === "drive" && rig.v > 0.3 && !rock) rigRun += dt * 1.6;
    if (rig.flash && rig.flash < 50) rig.flash = Math.max(0, rig.flash - dt);
    gulls.forEach(function (g) { g.t += dt; }); if (gulls.length && gulls[0].t > 9) gulls = [];
    if (ending) dusk = Math.min(1, dusk + dt * 0.5);
    parts.update(dt);
    updateClose(dt);
    sc.follow(camTarget(), dt);
    var lvl = phase === "drive" ? 0.2 + drive * 0.8 : (phase === "arrive" || phase === "leave" ? 0.6 : (rig.m ? 0.15 : 0));
    engLevel += (lvl - engLevel) * Math.min(1, dt * 4);
    snd.engine(ending || (!rig.m && tr.state === "away") ? -1 : engLevel);
    snd.soil(phase === "drive" ? drive : 0);
    snd.pour(tr.state === "tip" ? 0.6 : 0);
  }
  // what each machine does in the field view
  function workEffects(dt) {
    if (rig.v < 0.4) return;
    var wx = workX(), m = rig.m;
    if (m === "bedformer") {
      if (Math.random() < dt * 30) parts.add({ kind: "chunk", x: wx - 0.4, h: 0.4, r: 0.95 + Math.random() * 0.1, vx: -1.5 - Math.random() * 2, vh: 1.5 + Math.random() * 2, g: 12, life: 0.9, size: 0.09, col: Math.random() > 0.4 ? "#8E5A36" : "#A87450", spin: 9 });
    } else if (m === "destoner") {
      if (Math.random() < dt * 3) parts.add({ kind: "stone", x: rig.x - hitchOff() - M.destoner.drop, h: 1.0, r: 0.97, vx: -0.5, vh: -0.5, g: 12, life: 3, size: 0.12, col: "#A9ADB5", bounce: 0.2 });
    } else if (m === "harvester") {
      if (Math.random() < dt * 8) parts.add({ kind: "puff", x: wx - 0.3, h: 0.3, r: 0.95, vx: -1, vh: 0.5, life: 1.2, size: 0.25, grow: 0.7, col: "#C9A27A", alpha: 0.4 });
      tr.load = clamp((workX() + 0.8) / (L + 1.4), 0, 1);
    }
  }
  // the trailer and its tractor: on the far side of the harvester while it digs (so the harvester stays in
  // full view), then out onto the farm track to the store
  function trScale(r) { return r < 1 ? sc.k * lerp(1, 1.04, (1 - r) / 0.23) : sc.k / r; }
  function trWithX() { var piv = rig.x + Farm.DRAWBAR[0] + M.harvester.pivot[0]; return piv + 0.4 + 4.55 * trScale(TR_FAR) / sc.k; }
  function trScreen() { var s = trScale(tr.r); return { x: sc.X(tr.x, Math.min(1, tr.r)), y: sc.Y(tr.r), s: s }; }
  function elevSpout() {
    var piv = mScreen(M.harvester.pivot[0], M.harvester.pivot[1]), u = rig.out, t = trScreen();
    var tx = t.x - 4.55 * t.s, ty = t.y - (3.5 + tr.load * 0.4) * t.s;
    return { x: lerp(piv.x - 0.6 * sc.k, tx, u), y: lerp(piv.y, ty, u), px: piv.x, py: piv.y };
  }
  function trX(dx) { return tr.x + dx * trScale(sc.TRACK) * sc.TRACK / sc.k; }
  function updateTrailer(dt) {
    var ts = tr.state;
    if (ts === "go") {
      tr.t += dt;
      rig.out = Math.max(0, rig.out - dt);
      var target = (sc.pit ? sc.pit.x : STORE_X - 2.6) + 7.7 * trScale(sc.TRACK) * sc.TRACK / sc.k, dg = target - tr.x;
      tr.v = Math.min(clamp(dg * 2.4, 1.2, 18), tr.v + dt * 10); tr.x += Math.min(tr.v * dt, Math.max(dg, 0.01)); tr.wheel += tr.v * dt;
      // once it is past the tractor, out of the field onto the track
      var rearW = tr.x - 7.6 * trScale(tr.r) / sc.k;
      if (rearW > rig.x + 4.6 || tr.lane) { tr.lane = Math.min(1, (tr.lane || 0) + dt / 1.1); tr.r = lerp(TR_FAR, sc.TRACK, ease(tr.lane)); }
      if (dg < 0.05 && tr.lane >= 1) { tr.x = target; tr.v = 0; tr.state = "tip"; tr.t = 0; setPhase("store"); coach.say("The trailer tips the potatoes out.", 3); var p = sc.X(STORE_X, 1.02); tagAt("Potato store", p, sc.Y(1.02) - 7.4 * sc.S(1.02)); }
    } else if (ts === "tip") {
      tr.t += dt; tr.tip = ease(tr.t / 0.8);
      if (tr.t > 0.6) {
        tr.load = Math.max(0, 1 - (tr.t - 0.6) / 1.8); storeRun = 1; storeLevel = Math.min(1.1, storeLevel + dt * 0.07);
        var tx = trX(-7.8), hk = trScale(sc.TRACK) * sc.TRACK / sc.k;
        if (Math.random() < dt * 14) parts.add({ kind: "potato", x: tx - Math.random() * 0.3, h: (1 + Math.random() * 0.5) * hk, r: sc.TRACK, vx: -0.6, vh: 0, g: 9, life: 0.45, size: 0.09, col: "#C9935A" });
      }
      if (tr.t > 2.4) { tr.state = "untip"; tr.t = 0; tr.load = 0; storedLoad(); finishJob(); }
    } else if (ts === "untip") {
      tr.t += dt; tr.tip = 1 - ease(tr.t / 0.9); storeRun = Math.max(0, storeRun - dt);
      if (tr.t >= 0.9) { tr.tip = 0; tr.state = "parked"; tr.t = 0; }
    }
  }
  function storedLoad() {
    loads++; save(); setLoads();
    Farm.world.update(function (w) { w.potatoes = (w.potatoes || 0) + 1; });
    snd.chime();
  }
  function finishJob() {
    setPhase("done"); steps.done("dig"); steps.finish("Again!"); steps.busy(false);
    coach.say("Look at all the potatoes!", 5);
    Toybox.kind();
  }

  // ---------- Drawing the field view ----------
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(RG.f.x, RG.f.y);
    ctx.beginPath(); ctx.rect(0, 0, RG.f.w, RG.f.h); ctx.clip();
    drawField();
    ctx.restore();
    drawClose();
  }
  function drawField() {
    var season = field.stage === "grown" || field.stage === "harvested" || (phase === "grow" && growG > 0.75) ? "autumn" : (phase === "grow" && growG > 0.3 ? "summer" : "spring");
    sc.sky(ctx, { time: time, arc: phase === "grow" ? clamp(phaseT / 5.5, 0, 1) : null, season: season, dusk: dusk });
    sc.hedge(ctx, { season: season });
    var P = { crop: "spuds", stage: field.stage === "grown" ? "grown" : field.stage, g: field.stage === "grown" ? 1 : field.g, wipe: field.wipe, time: time, edge: "rgba(60,30,15,0.7)" };
    if (P.wipe && P.wipe.to === "harvested") P.edge = null;
    sc.field(ctx, "far", P);
    drawGulls(true);
    parts.draw(ctx, sc, function (p) { return p.r > 1.0; });
    if (tr.state !== "away" && tr.r > 1) drawTrailer();
    if (rig.m) drawRig();
    if (rig.m === "harvester" && rig.out > 0.01 && tr.r > 1) drawElevator();
    sc.field(ctx, "near", P);
    parts.draw(ctx, sc, function (p) { return p.r <= 1.0 && p.r > sc.TRACK + 0.03; });
    sc.verge(ctx, {});
    sc.store(ctx, storeLevel, { x: STORE_X, kind: "potato", run: storeRun, time: time });
    if (tr.state !== "away" && tr.r <= 1) drawTrailer();
    parts.draw(ctx, sc, function (p) { return p.r <= sc.TRACK + 0.03; });
    drawGulls(false);
  }
  function drawRig() {
    var m = rig.m, tl = trailed();
    var st = { wheel: rig.wheel, time: time, work: phase === "drive" && rig.v > 0.3 ? 1 : 0, level: m === "planter" ? 1 - (field.wipe ? clamp(workX() / L, 0, 1) * 0.6 : 0) : 1, out: m === "harvester" && rig.out > 0.01 };
    sc.put(ctx, rig.x, 1, 1, function () {
      ctx.save();
      if (tl) ctx.translate(Farm.DRAWBAR[0], Farm.DRAWBAR[1]); else ctx.translate(Farm.HITCH[0], Farm.HITCH[1]);
      D[m](ctx, st);
      ctx.restore();
      D.tractor(ctx, { wheel: rig.wheel, time: time, hitch: tl ? null : { lift: phase === "drive" ? 0 : 0.6 }, drawbar: tl, lights: rig.flash ? 1 : 0, beacon: !!rig.flash });
    });
    if (phase !== "grow" && Math.random() < 0.12) parts.add({ kind: "puff", x: rig.x + 1.33, h: 3.45, r: 1, vx: -0.6 - rig.v * 0.5, vh: 1.2, life: 1.2, size: 0.1, grow: 0.35, col: "#8A8FA0", alpha: 0.3 });
  }
  function drawElevator() {
    var sp = elevSpout(), u = rig.out, work = phase === "drive" && rig.v > 0.3 && !rock;
    D.boom(ctx, sp.px, sp.py, sp.x, sp.y, 0.4 * sc.k, lerp(0.4, 0.5, u) * sc.k, rigRun * 2.5, work ? "belt" : "belt-empty", sc.lw);
    if (work && u > 0.9) {
      var t = trScreen(), yb = t.y - (2.75 + tr.load * 0.4) * t.s, n = 5;
      for (var i = 0; i < n; i++) {
        var f = ((time * 2.2 + i / n) % 1), x = sp.x + Math.sin(i * 2.1) * 0.12 * sc.k, y = lerp(sp.y + 0.3 * sc.k, yb, f * f);
        D.potato(ctx, x, y, 0.12 * sc.k, i);
      }
    }
  }
  function drawTrailer() {
    var t = trScreen();
    Farm.inUnits(ctx, t.x, t.y, t.s, sc.lw, function () {
      ctx.translate(0, -0.5);
      D.trailer(ctx, { wheel: tr.wheel, load: tr.load, tip: tr.tip, crop: "potato", time: time });
      ctx.translate(-Farm.DRAWBAR[0], 0.5);
      D.tractor(ctx, { wheel: tr.wheel, time: time, drawbar: true });
    });
  }
  function drawGulls(far) {
    if (!gulls.length) return;
    var base = rig.m && phase === "drive" ? workX() : (rig.m ? rearX() - 1 : L / 2);
    gulls.forEach(function (g) {
      if (g.t < 0) return;
      if ((g.r > 1) !== far) return;
      var t = g.t, s = sc.S(g.r) * 1.3, x, y, gx = sc.X(base + g.ox, g.r), gy = sc.Y(g.r);
      if (t < 1.6) { var f = ease(t / 1.6); x = lerp(gx - RG.f.w * 0.3, gx, f); y = lerp(-20, gy - 0.2 * s, f); D.gull(ctx, x, y, s, t * 3, false); }
      else if (t < 7.5) { var hop = Math.abs(Math.sin(t * 5 + g.ph * 6)) * 0.12 * s; D.gull(ctx, gx, gy - 0.12 * s - hop, s, 0.25, Math.sin(t + g.ph * 4) > 0.6); }
      else { var e = (t - 7.5) / 1.5; D.gull(ctx, gx + e * RG.f.w * 0.4, gy - e * RG.f.h * 0.6, s, t * 3, false); }
    });
  }

  // ---------- Loop ----------
  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
    if (!(window.Toybox && Toybox.timer.phase() === "resting")) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  function onEnding(done) { ending = true; auto = false; grab = null; rig.v = 0; setTimeout(function () { snd.engine(-1); snd.soil(0); done(); }, 2600); }
  function onWake() { ending = false; dusk = 0; }

  // ---------- Start ----------
  resize();
  if (job === "dig") { closeStart("grow"); growG = 1; field.stage = "grown"; }
  bringIn(job);
  setZoom(JOBS[job].span, true);
  var v0 = VIEW[cview]; ccam.cx = v0.cx; ccam.hw = v0.hw; ccam.up = v0.up; ccam.dn = v0.dn;
  if (phase === "arrive") { rig.x = rig.target - 7; }
  sc.follow(camTarget(), 0, true);
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  else window.addEventListener("resize", resize);

  Toybox.init({
    app: "farm",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the tractor stops and parks, and the controls lock. The timer carries on across the farm pages.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "Soft engine and soil sounds. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: onWake,
    onWake: onWake,
    onSound: function (on) { if (on) snd.chime(); }
  });
  requestAnimationFrame(loop);

  if (/[?&]debug\b/.test(location.search)) window.__farm = {
    state: function () { return { phase: phase, job: job, step: steps.current(), finished: steps.finished(), x: rig.x, m: rig.m, field: field.stage, trailer: tr.state, load: tr.load, loads: loads, stones: stones.length, pile: pile.length, rock: !!rock, coach: coach.text(), grow: growG }; },
    screen: function (id) {
      var b = cv.getBoundingClientRect(), p;
      if (id === "rock") p = rockScreen();
      else if (id === "stone") { var s = stones.filter(function (q) { return q.s === "belt" || q.s === "web" || q.s === "soil"; })[0]; p = s ? stoneScreen(s) : closeMachinePart(); }
      else if (id === "close") p = closeMachinePart();
      else p = rigPart();
      return { x: b.left + p.x, y: b.top + p.y };
    },
    surprise: surprise,
    ghost: function () { return ghost.show(); }
  };
})();
</script>
</body>
