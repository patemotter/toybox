<style>
:root {
  --bg: #CDE9FF; --panel: #FFFFFF; --ink: #1D2340; --muted: #4A5578; --edge: #1D2340; --accent: #FFC93C; --plate: #F4FAFF; --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.tb-head a { text-decoration: none; }
.stage { background: #A9DCFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
.loads { font-variant-numeric: tabular-nums; }
.loads.pop { animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel { display: none; }
body.ending .tb-panel, body.ending .homebtn, body.ending .mapbtn { pointer-events: none; opacity: 0.4; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
.mapbtn .tb-mapic { width: 30px; height: 30px; background: #FFFFFF; border-radius: 8px; }
/* The Go says a short phrase ("Feed them"): on a narrow row it wraps to two lines instead of being cut off. */
#steps .tb-go-word { white-space: normal; text-align: center; text-wrap: balance; }
@media (prefers-reduced-motion: reduce) { .loads.pop { animation: none; } }
</style>

<script>
(function () {
  "use strict";
  // Moooovie Time: feeding the dairy cows, the way the episode shows it.
  // Load: the telehandler's shear grab cuts a block of silage out of the clamp face and drops it into the mixer
  //       wagon (behind the green tractor), then lifts in a straw bale while the meal bin's auger pours in meal.
  // Mix:  the tractor's PTO turns the wagon's vertical auger; the silage, straw and meal swirl into one feed
  //       (seen over the top of the tub).
  // Feed: the tractor drives the wagon down the feed passage of the cow barn; the chute lays a line of feed
  //       along the feed barrier and the cows put their heads through and munch.
  // Then, by itself: milking time. The cows walk one by one into the milking parlor (no milking is shown).
  // One world along the machine line: the clamp on the left, the telehandler, the wagon and tractor, the barn
  // (feed passage on the machine line, the barrier and the cows behind it), the milking parlor, the calf hutch.
  // The stage is split like Mucky Muck: the whole rig on top (or left), a close-up of the work below (right).
  // Machine drawings live here for now in farm.js's style and function shapes (metres, y up negative, facing +x)
  // so they can move into farm.js later: mixer (drawbar eye, ground at +0.5), teleBody / teleBoom with the shear
  // grab (between the axles), cowSide (feet), cowFront / cowHead (feet / neck), cat (feet), hutch.
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.u, clamp = U.clamp, lerp = U.lerp, ease = U.ease, hash = U.hash, mix = U.mix, INK = U.INK;
  var D = Farm.draw, SH = Farm.shape, snd = Farm.sound, TAU = Math.PI * 2;
  var Pp = SH.P, Rr = SH.R, Cc = SH.C, Ln = SH.Ln, tube = SH.tube, fs = SH.fs;
  var NAME = (Farm.NAMES && Farm.NAMES.cows) || "Moooovie Time";
  document.title = NAME; $("title").textContent = NAME;
  function LW() { return Farm.LW; }
  function shine(ctx, x1, y1, x2, y2, w) { Ln(ctx, x1, y1, x2, y2, "rgba(255,255,255,0.45)", w); }
  var SIL = ["#8DB846", "#6E9A36", "#B5CF6A"], STRAW = ["#F2D272", "#D9B24A", "#FBE7A1"], MEAL = ["#D98A3A", "#B96E28", "#EDB070"];
  var FEED = "#9A9A48", FEED2 = "#7E7E38";
  var reduce = !!U.reduceMotion;

  // ---------- State ----------
  var KEY = "farm-cows-v1";
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  if (startFresh || typeof saved !== "object" || Array.isArray(saved)) saved = {};
  var feeds = typeof saved.feeds === "number" && isFinite(saved.feeds) && saved.feeds >= 0 ? Math.floor(saved.feeds) : 0;
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ feeds: feeds })); } catch (e) { /* ignore */ } }

  // ---------- The world (metres along the machine line) ----------
  var CLF = 9.0, TX = 13.6, WAG = 23.0, BX0 = 30, BX1 = 44, PX0 = 45.5, PX1 = 54, DOOR = 47.6, DOORW = 2.4, PARK = 66, XMAX = 74;
  var MEALX = 20.2, HUTCH = [26.4, 57.2], BALE = [9.05, 9.95], RB = 1.2, RCOW = 1.3, RFEED = 1.11, RPAR = 1.45, RWALL = 1.62;
  var COWX = [32.6, 35.4, 38.2, 41.0], CHUTE = -7.05, V_FEED = 3.2;

  // ---------- Small drawing helpers (farm.js style) ----------
  function wheel(ctx, cx, cy, r, rot, o) {
    o = o || {};
    var n = o.lugs || Math.round(r * 22), i, a, l0 = LW();
    ctx.save(); ctx.translate(cx, cy);
    for (i = 0; i < n; i++) {
      a = rot + i * TAU / n;
      var c = Math.cos(a), s = Math.sin(a), c2 = Math.cos(a + 0.12), s2 = Math.sin(a + 0.12);
      Pp(ctx, [c * r * 0.93, s * r * 0.93, c * r * 1.06, s * r * 1.06, c2 * r * 1.06, s2 * r * 1.06, c2 * r * 0.93, s2 * r * 0.93], "#2A2C36", l0 * 0.7);
    }
    Cc(ctx, 0, 0, r * 0.97, "#33363F", l0);
    Cc(ctx, 0, 0, r * 0.8, "#40434E", 0);
    var rimR = r * (o.rim || 0.6);
    Cc(ctx, 0, 0, rimR, o.rimCol || "#C3CCD6", l0);
    Cc(ctx, 0, 0, rimR * 0.78, "#A9B4C1", l0 * 0.6);
    Cc(ctx, 0, 0, rimR * 0.36, "#8C97A6", l0 * 0.7);
    for (i = 0; i < 6; i++) { a = rot + i * TAU / 6; Cc(ctx, Math.cos(a) * rimR * 0.55, Math.sin(a) * rimR * 0.55, rimR * 0.07, "#6E7887", 0); }
    ctx.restore();
  }
  function driverHead(ctx, x, y) {
    var l0 = LW();
    Rr(ctx, x - 0.26, y + 0.1, 0.52, 0.5, 0.16, "#3D6FB6", l0 * 0.7);
    Cc(ctx, x, y, 0.17, "#F2C8A0", l0 * 0.7);
    Pp(ctx, [x - 0.18, y - 0.04, x - 0.16, y - 0.2, x + 0.16, y - 0.2, x + 0.3, y - 0.06], "#E8473B", l0 * 0.6);
  }
  function strands(ctx, x0, y0, w, h, cols, seed, n) {
    for (var i = 0; i < n; i++) {
      var sx = x0 + w * hash(i, seed), sy = y0 + h * hash(i, seed + 1);
      Ln(ctx, sx, sy, sx + 0.2 * (hash(i, seed + 2) - 0.3), sy - 0.05, cols[i % cols.length], 0.045);
    }
  }
  // a straw bale (big square), origin bottom-left, w x h
  function bale(ctx, x, y, w, h) {
    var l0 = LW();
    Rr(ctx, x, y - h, w, h, 0.06, STRAW[0]);
    ctx.save(); SH.rr(ctx, x, y - h, w, h, 0.06); ctx.clip(); strands(ctx, x, y - h, w, h, [STRAW[1], STRAW[2]], 11, Math.round(w * h * 30)); ctx.restore();
    Ln(ctx, x + w * 0.3, y - h, x + w * 0.3, y, "#C0392B", 0.035); Ln(ctx, x + w * 0.7, y - h, x + w * 0.7, y, "#C0392B", 0.035);
    SH.rr(ctx, x, y - h, w, h, 0.06); fs(ctx, null, l0);
  }

  // =====================================================================================================
  // The machines (could move into farm.js as Farm.draw.mixer / telehandler / cow ...)
  // =====================================================================================================
  // Vertical-auger mixer wagon. Origin at the drawbar eye, ground at y = +0.5, facing +x.
  // st = { wheel, time, spin (auger angle), door (0..1), chute (0..1 out), belt, peek (how far we see in),
  //        chunks: [{ a, rr, col, s }], mound: { col, h } (a block sitting on top before mixing), fill (0..1), pto }
  var MX = { cx: -3.85, rimY: -2.78, rx: 2.3, ry: 0.3 };
  function mixer(ctx, st) {
    var l0 = LW(), i, B = "#2F7FD1", BD = "#1F5FA6";
    // drawbar and the PTO shaft (stripes run when it turns)
    Pp(ctx, [0.1, 0.05, -1.7, -0.62, -1.7, -0.4, 0.1, 0.16], "#7C8696");
    tube(ctx, 0.95, -0.55, -1.55, -1.05, 0.13, "#F2C230");
    for (i = 0; i < 6; i++) { var f = ((i / 6) + (st.pto || 0) * 0.15) % 1; Ln(ctx, lerp(0.85, -1.45, f), lerp(-0.57, -1.03, f), lerp(0.85, -1.45, f) - 0.06, lerp(-0.57, -1.03, f) - 0.12, INK, 0.04); }
    Rr(ctx, -6.0, -0.78, 4.5, 0.22, 0.04, "#3A3F4E");
    wheel(ctx, -3.3, 0.0, 0.5, (st.wheel || 0) / 0.5, { rim: 0.55, rimCol: "#E2E6EB" });
    wheel(ctx, -4.45, 0.0, 0.5, (st.wheel || 0) / 0.5, { rim: 0.55, rimCol: "#E2E6EB" });
    // the chute at the rear: folded up against the tub, or out with its belt running
    var th = lerp(-Math.PI / 2 - 0.25, Math.PI - 0.32, ease(st.chute || 0));
    ctx.save(); ctx.translate(-5.75, -0.98); ctx.rotate(th);
    Rr(ctx, -0.05, -0.14, 1.3, 0.28, 0.06, "#5D6675", l0 * 0.8);
    for (i = 0; i < 5; i++) { var bx = ((i / 5 + (st.belt || 0)) % 1) * 1.15 + 0.05; Ln(ctx, bx, -0.12, bx, 0.12, "#2A2C36", 0.05); }
    ctx.restore();
    // the tub: wider at the top, ribs, the opening seen from a little above
    Pp(ctx, [-5.55, -0.75, -2.15, -0.75, -1.5, MX.rimY, -6.2, MX.rimY], B);
    for (i = 1; i < 5; i++) { var rx0 = lerp(-5.55, -2.15, i / 5), rx1 = lerp(-6.2, -1.5, i / 5); Ln(ctx, rx0, -0.8, rx1, MX.rimY + 0.05, BD, 0.07); }
    shine(ctx, -5.9, -2.45, -1.85, -2.45, 0.08);
    // the side door at the rear (slides up to let the feed onto the chute)
    var dy = clamp(st.door || 0, 0, 1) * 0.55;
    Rr(ctx, -5.55, -1.55, 0.6, 0.62, 0.04, "#2A2D38", l0 * 0.6);
    Rr(ctx, -5.6, -1.6 - dy, 0.7, 0.66, 0.05, BD, l0 * 0.8);
    // the opening
    var ry = MX.ry * (st.peek || 1), cx = MX.cx, cy = MX.rimY;
    ctx.beginPath(); ctx.ellipse(cx, cy, MX.rx, ry, 0, 0, TAU); fs(ctx, "#2A2D38", l0);
    var fill = clamp(st.fill || 0, 0, 1);
    if (fill > 0.01) {
      ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy, MX.rx * 0.96, ry * 0.92, 0, 0, TAU); ctx.clip();
      ctx.beginPath(); ctx.ellipse(cx, cy + ry * (1 - fill) * 0.4, MX.rx * 0.96, ry * 0.92, 0, 0, TAU); ctx.fillStyle = st.base || FEED; ctx.fill();
      (st.chunks || []).forEach(function (c) {
        var x = cx + Math.cos(c.a) * c.rr * MX.rx * 0.9, y = cy + Math.sin(c.a) * c.rr * ry * 0.85;
        ctx.beginPath(); ctx.ellipse(x, y, c.s, c.s * 0.45 * (st.peek || 1), c.a * 0.3, 0, TAU); ctx.fillStyle = c.col; ctx.fill();
      });
      ctx.restore();
    }
    // the auger's top cone sticks up through the feed; its flight turns
    var ah = 0.5 + 0.15 * (st.peek || 1), sp = st.spin || 0;
    Pp(ctx, [cx - 0.42, cy + 0.04, cx, cy - ah, cx + 0.42, cy + 0.04], "#C3CCD6", l0 * 0.8);
    ctx.save(); ctx.beginPath(); ctx.moveTo(cx - 0.42, cy + 0.04); ctx.lineTo(cx, cy - ah); ctx.lineTo(cx + 0.42, cy + 0.04); ctx.closePath(); ctx.clip();
    for (i = 0; i < 4; i++) { var q = ((i / 4) + sp / TAU) % 1, yy = cy + 0.04 - q * (ah + 0.1); Ln(ctx, cx - 0.5, yy + 0.12, cx + 0.5, yy - 0.12, "#7C8696", 0.06); }
    ctx.restore();
    if (st.mound && st.mound.h > 0.02) {
      var mh = st.mound.h;
      ctx.beginPath(); ctx.moveTo(cx - 1.3, cy + 0.05);
      ctx.quadraticCurveTo(cx - 1.25, cy - mh * 1.1, cx - 0.2, cy - mh); ctx.quadraticCurveTo(cx + 0.9, cy - mh * 1.05, cx + 1.4, cy + 0.05); ctx.closePath();
      fs(ctx, st.mound.col, l0 * 0.8);
      ctx.save(); ctx.clip(); strands(ctx, cx - 1.3, cy - mh, 2.7, mh, [SIL[1], STRAW[0], SIL[2]], 5, 24); ctx.restore();
    }
    // the front lip of the opening
    ctx.beginPath(); ctx.ellipse(cx, cy, MX.rx, ry, 0, 0, Math.PI); ctx.lineWidth = l0 * 1.6; ctx.strokeStyle = BD; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, MX.rx, ry, 0, 0, Math.PI); ctx.lineWidth = l0; ctx.strokeStyle = INK; ctx.stroke();
    // ladder at the front
    Ln(ctx, -1.95, -0.9, -1.6, -2.6, INK, 0.05); Ln(ctx, -1.75, -0.9, -1.4, -2.6, INK, 0.05);
    for (i = 0; i < 5; i++) { var ly = -1.1 - i * 0.33; Ln(ctx, -1.93 + i * 0.07, ly, -1.72 + i * 0.07, ly, INK, 0.04); }
  }
  // Telehandler: body (origin on the ground between the axles, facing +x) and the boom with the shear grab.
  var TELE = { pivot: [-1.5, -2.05], len: 3.9 };
  function teleBody(ctx, st) { D.telehandler(ctx, st); }
  function teleEnd(a, ext) { var len = TELE.len + (ext || 0); return [TELE.pivot[0] + Math.cos(a) * len, TELE.pivot[1] + Math.sin(a) * len]; }
  // st = { a (boom angle, + down), ext, curl (+ tips the front down), jaw (0 shut .. 1 open), load: null | "silage" | "straw" }
  function teleBoom(ctx, st) {
    var T = "#F2B33A", TD = "#C98A1A", l0 = LW(), a = st.a || 0, c = Math.cos(a), s = Math.sin(a);
    var p = TELE.pivot, e = teleEnd(a, st.ext), m = [p[0] + c * 3.3, p[1] + s * 3.3];
    tube(ctx, 0.35, -1.35, p[0] + c * 1.9, p[1] + s * 1.9 + 0.18, 0.13, "#C3CCD6");
    tube(ctx, m[0] - c * 0.4, m[1] - s * 0.4, e[0], e[1], 0.26, TD);
    tube(ctx, p[0], p[1], m[0], m[1], 0.42, T);
    shine(ctx, p[0] + c * 0.3, p[1] + s * 0.3 - 0.1, m[0] - c * 0.2, m[1] - s * 0.2 - 0.1, 0.06);
    Cc(ctx, p[0], p[1], 0.16, "#7C8696", l0);
    ctx.save(); ctx.translate(e[0], e[1]); ctx.rotate(st.curl || 0);
    shearGrab(ctx, st);
    ctx.restore();
  }
  // The shear grab (block cutter): a back frame with tines along the bottom and a U-shaped blade on top that
  // swings down to slice the block out of the clamp face. Origin at the boom pin; tines at y = +1.08.
  function shearGrab(ctx, st) {
    var l0 = LW(), G = "#5D6675", jaw = clamp(st.jaw || 0, 0, 1);
    if (st.load === "silage") {
      Rr(ctx, 0.14, -0.45, 1.24, 1.48, 0.05, SIL[0], l0 * 0.8);
      ctx.save(); SH.rr(ctx, 0.14, -0.45, 1.24, 1.48, 0.05); ctx.clip();
      for (var k = 0; k < 6; k++) Ln(ctx, 0.14, -0.3 + k * 0.24, 1.38, -0.28 + k * 0.24, SIL[1], 0.04);
      strands(ctx, 0.14, -0.45, 1.24, 1.48, [SIL[1], SIL[2]], 3, 26); ctx.restore();
    } else if (st.load === "straw") bale(ctx, 0.2, 1.03, 0.9, 0.8);
    Rr(ctx, -0.14, -0.58, 0.26, 1.72, 0.05, G, l0 * 0.8);
    tube(ctx, 0.05, 1.08, 1.48, 1.08, 0.08, "#C3CCD6");
    Ln(ctx, 1.44, 1.08, 1.56, 1.0, INK, 0.07);
    ctx.save(); ctx.translate(0.0, -0.52); ctx.rotate(-jaw * 1.2);
    // the blade frame: a top bar and the cutting blade hanging down at the front, a light brace between
    tube(ctx, 0, 0, 1.45, 0, 0.12, "#E2B33A");
    Ln(ctx, 0.1, 0.05, 1.38, 1.3, "rgba(29,35,64,0.55)", 0.05);
    Rr(ctx, 1.36, -0.06, 0.12, 1.62, 0.03, "#C3CCD6", l0 * 0.8);
    for (var i = 0; i < 6; i++) Pp(ctx, [1.36, 0.15 + i * 0.25, 1.28, 0.27 + i * 0.25, 1.36, 0.39 + i * 0.25], "#E2E6EB", l0 * 0.4);
    ctx.restore();
    Cc(ctx, 0, -0.52, 0.09, "#C3CCD6", l0 * 0.6);
    Cc(ctx, 0, 0, 0.08, "#C3CCD6", l0 * 0.6);
  }
  // A cow in profile (black and white), origin at its feet in the middle, facing +x. ph = walk phase.
  function cowSide(ctx, ph, walk, time, moo) { D.cow(ctx, { ph: ph, walk: walk, time: time, moo: moo }); }
  // A cow seen from the front: her chest and front legs behind the barrier (origin at her feet).
  function cowFront(ctx, k) {
    var l0 = LW();
    Ln(ctx, -0.3, -0.7, -0.3, 0, INK, 0.2); Ln(ctx, -0.3, -0.7, -0.3, -0.04, "#FAFAFA", 0.13);
