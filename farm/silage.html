}

<script>
(function () {
  "use strict";
  // Glorious Grass: making silage, the way the episode shows it. Grass: the disc mower lays the grass in
  // swaths, the forage harvester picks the swath up and blows it, chopped, from its spout into a trailer driving
  // alongside, the trailer tips it at the silage clamp and a loader pushes it up the heap, a heavy tractor rolls
  // it flat (it gets flat and shiny), and the black sheet goes on with tires on top. Maize (A-maizing Day): the
  // forage harvester with a maize header cuts the tall maize instead, then the same clamp work.
  // One world: the field (x 0..L) and, along the farm track to the right, the silage clamp in the yard. On a
  // wide stage one camera follows the work from the field to the clamp; on an upright stage the stage is split:
  // the field on top and the clamp below, so he sees the trailer go from one to the other.
  // Machine drawings live here for now in farm.js's style and function shapes (origin and units as there), so
  // they can move into farm.js later: mower (at the hitch pin), forage (front axle), loader / heavy (tractor).
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.u, clamp = U.clamp, lerp = U.lerp, ease = U.ease, hash = U.hash, mix = U.mix, INK = U.INK;
  var D = Farm.draw, SH = Farm.shape, snd = Farm.sound, TAU = Math.PI * 2;
  var Pp = SH.P, Rr = SH.R, Cc = SH.C, Ln = SH.Ln, tube = SH.tube, fs = SH.fs;
  var NAME = (Farm.NAMES && Farm.NAMES.silage) || "Glorious Grass";
  document.title = NAME; $("title").textContent = NAME;
  // the trailer's heap colours for chopped grass and maize (the shared trailer looks them up by crop)
  if (Farm.CROP) { if (!Farm.CROP.grass) Farm.CROP.grass = ["#86C04A", "#4E8F2E"]; if (!Farm.CROP.maize) Farm.CROP.maize = ["#C3CB55", "#7E9A2C"]; }
  function LW() { return Farm.LW; }
  function shine(ctx, x1, y1, x2, y2, w) { Ln(ctx, x1, y1, x2, y2, "rgba(255,255,255,0.45)", w); }
  var G = { body: "#3E9F3A", dark: "#2B7A2A", light: "#6CC65C", frame: "#2B3040", glass: "#BFE7FA", steel: "#C3CCD6", grey: "#7C8696" };

  // ---------- State ----------
  var KEY = "farm-silage-v1";
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  if (startFresh || typeof saved !== "object") saved = {};
  var loads = typeof saved.loads === "number" && isFinite(saved.loads) ? saved.loads : 0;
  var crop = saved.job === "maize" ? "maize" : "grass";

  var L = 24, CL0 = L + 13, CLL = 8, CL1 = CL0 + CLL, XMAX = CL1 + 19, TR_FAR = 1.5, VPASS = 5.6;
  var WAIT_X = CL1 + 11.5, TIP_X = CL1 + 9.2;

  // ---------- Small drawing helpers (farm.js style, machine units: metres, y up negative) ----------
  function wheel(ctx, cx, cy, r, rot, o) {
    o = o || {};
    var n = o.lugs || Math.round(r * 22), i, a, l0 = LW();
    ctx.save(); ctx.translate(cx, cy);
    if (!o.smooth) {
      for (i = 0; i < n; i++) {
        a = rot + i * TAU / n;
        var c = Math.cos(a), s = Math.sin(a), c2 = Math.cos(a + 0.12), s2 = Math.sin(a + 0.12);
        Pp(ctx, [c * r * 0.93, s * r * 0.93, c * r * 1.06, s * r * 1.06, c2 * r * 1.06, s2 * r * 1.06, c2 * r * 0.93, s2 * r * 0.93], o.dual ? "#23252D" : "#2A2C36", l0 * 0.7);
      }
    }
    Cc(ctx, 0, 0, r * (o.smooth ? 1 : 0.97), o.dual ? "#2B2E36" : "#33363F", l0);
    Cc(ctx, 0, 0, r * 0.8, "#40434E", 0);
    var rimR = r * (o.rim || 0.6);
    Cc(ctx, 0, 0, rimR, o.rimCol || "#C3CCD6", l0);
    Cc(ctx, 0, 0, rimR * 0.78, o.rimIn || "#A9B4C1", l0 * 0.6);
    Cc(ctx, 0, 0, rimR * 0.36, "#8C97A6", l0 * 0.7);
    for (i = 0; i < 6; i++) { a = rot + i * TAU / 6; Cc(ctx, Math.cos(a) * rimR * 0.55, Math.sin(a) * rimR * 0.55, rimR * 0.07, "#6E7887", 0); }
    ctx.beginPath(); ctx.arc(0, 0, r * 0.88, -2.5, -1.4); ctx.strokeStyle = "rgba(255,255,255,0.13)"; ctx.lineWidth = r * 0.1; ctx.stroke();
    ctx.restore();
  }
  function driver(ctx, x, y) {
    var l0 = LW();
    Rr(ctx, x - 0.26, y + 0.1, 0.52, 0.5, 0.16, "#3D6FB6", l0 * 0.7);
    Cc(ctx, x, y, 0.17, "#F2C8A0", l0 * 0.7);
    Pp(ctx, [x - 0.18, y - 0.04, x - 0.16, y - 0.2, x + 0.16, y - 0.2, x + 0.3, y - 0.06], "#E8473B", l0 * 0.6);
  }

  // =====================================================================================================
  // The machines (could move into farm.js as Farm.draw.mower / forage / loader / heavy)
  // =====================================================================================================
  // Disc mower conditioner on the three-point hitch. Origin at the hitch pin, the ground at y = +0.5, facing +x.
  // st = { time, spin (disc angle), work (0..1) }. MOW.work = metres behind the hitch where it cuts.
  var MOW = { len: 3.6, work: 1.8 };
  function mower(ctx, st) {
    var spin = st.spin || 0, Rd = "#D8403A", RD = "#A82E28", l0 = LW(), i;
    tube(ctx, 0.15, -0.42, -0.95, -0.82, 0.1, "#F2C230");
    Pp(ctx, [0.06, 0.1, 0.06, -0.86, -0.18, -0.86, -0.46, -0.12, -0.46, 0.1], G.grey);
    Cc(ctx, 0, 0, 0.07, G.steel, l0 * 0.7); Cc(ctx, 0.04, -0.8, 0.07, G.steel, l0 * 0.7);
    tube(ctx, -0.3, -0.6, -1.1, -1.0, 0.15, G.grey);
    // the hood, with the conditioner rollers turning behind a window
    Pp(ctx, [-0.95, 0.16, -1.0, -0.72, -1.3, -1.08, -3.0, -1.08, -3.3, -0.72, -3.3, 0.16], Rd);
    shine(ctx, -1.35, -0.97, -2.95, -0.97, 0.07);
    Rr(ctx, -2.75, -0.82, 1.2, 0.6, 0.1, "#3A2E22", l0 * 0.7);
    ctx.save(); SH.rr(ctx, -2.75, -0.82, 1.2, 0.6, 0.1); ctx.clip();
    for (i = 0; i < 2; i++) {
      var rx = -2.45 + i * 0.6, a0 = spin * 0.5 * (i ? -1 : 1);
      Cc(ctx, rx, -0.52, 0.24, "#8F9AAA", l0 * 0.6);
      for (var k = 0; k < 4; k++) { var a = a0 + k * TAU / 4; Ln(ctx, rx, -0.52, rx + Math.cos(a) * 0.24, -0.52 + Math.sin(a) * 0.24, "#5D6675", 0.05); }
      if (st.work) for (k = 0; k < 3; k++) Ln(ctx, rx - 0.3 + k * 0.2, -0.3 - 0.1 * hash(k, Math.floor(spin * 2)), rx - 0.2 + k * 0.2, -0.38, "#6FB443", 0.06);
    }
    ctx.restore();
    // the swath boards at the back, folding the cut grass into a swath
    Pp(ctx, [-3.3, -0.55, -3.65, -0.25, -3.65, 0.3, -3.3, 0.24], RD, l0 * 0.8);
    // the cutter bar on its skid under the hood, with the discs spinning (seen a little from above)
    Rr(ctx, -3.15, 0.2, 2.3, 0.28, 0.1, "#9AA5B4");
    [-1.45, -2.55].forEach(function (cx, k) {
      ctx.beginPath(); ctx.ellipse(cx, 0.2, 0.48, 0.14, 0, 0, TAU); fs(ctx, "#C3CCD6", l0 * 0.8);
      for (var j = 0; j < 2; j++) {
        var a = spin * (k ? -1 : 1) + j * Math.PI, c = Math.cos(a), s = Math.sin(a);
        Pp(ctx, [cx + c * 0.34, 0.2 + s * 0.1, cx + c * 0.6, 0.2 + s * 0.16, cx + Math.cos(a + 0.45) * 0.52, 0.2 + Math.sin(a + 0.45) * 0.15], "#EEF1F4", l0 * 0.5);
      }
      Cc(ctx, cx, 0.17, 0.09, "#8C97A6", l0 * 0.6);
    });
    // the rubber curtain at the front
    for (i = 0; i < 4; i++) Ln(ctx, -1.02 - i * 0.03, -0.65 + i * 0.2, -1.02 - i * 0.03, -0.5 + i * 0.2, "#2B3040", 0.07);
  }
  // Self-propelled forage harvester. Origin on the ground under the front axle, facing +x.
  // st = { wheel, time, spin (drum and pickup), work, header: "pickup" | "maize", face, beacon }.
  // The spout turns on FH.pivot; the page draws the spout tube (folded along the top, or out over a trailer).
  var FH = { pivot: [-0.85, -3.4], back: -5.35, front: { pickup: 4.0, maize: 4.85 } };
  function forage(ctx, st) {
    var t = st.time || 0, rot = st.wheel || 0, spin = st.spin || 0, l0 = LW(), i;
    // engine bay, with a dark lower band, the cooler grille at the back and the exhaust
    Pp(ctx, [-0.5, -0.85, -4.95, -0.85, -5.35, -1.4, -5.35, -2.6, -4.95, -3.05, -1.0, -3.1, -0.5, -2.75], G.body);
    Pp(ctx, [-0.5, -0.85, -4.95, -0.85, -5.35, -1.4, -5.35, -1.62, -0.5, -1.62], G.dark, l0 * 0.8);
    shine(ctx, -1.1, -2.97, -4.85, -2.97, 0.08);
    Rr(ctx, -5.2, -2.7, 0.55, 1.0, 0.06, "#2D3242", l0 * 0.7);
    for (i = 0; i < 5; i++) Ln(ctx, -5.12, -2.58 + i * 0.18, -4.73, -2.58 + i * 0.18, "#59607A", 0.04);
    Ln(ctx, -3.0, -2.95, -3.0, -1.75, G.dark, 0.05); Ln(ctx, -1.7, -3.0, -1.7, -1.75, G.dark, 0.05);
    Rr(ctx, -4.7, -3.42, 2.3, 0.38, 0.1, G.dark, l0 * 0.8);
    for (i = 0; i < 6; i++) Ln(ctx, -4.55 + i * 0.36, -3.34, -4.55 + i * 0.36, -3.1, "#24602A", 0.04);
    tube(ctx, -3.3, -3.05, -3.3, -3.95, 0.12, "#4E5463");
    Rr(ctx, -3.39, -4.1, 0.18, 0.18, 0.04, "#3A3F4E", l0 * 0.6);
    // the throat under the cab: feed rollers, and the chopper drum behind its round cover
    Pp(ctx, [-0.6, -0.8, -0.6, -2.75, 0.95, -2.6, 1.8, -1.45, 1.8, -0.55, 0.6, -0.55], G.dark);
    Cc(ctx, 0.25, -1.62, 0.55, "#9AA5B4");
    for (i = 0; i < 6; i++) { var a = spin * 1.6 + i * TAU / 6; Ln(ctx, 0.25 + Math.cos(a) * 0.14, -1.62 + Math.sin(a) * 0.14, 0.25 + Math.cos(a) * 0.48, -1.62 + Math.sin(a) * 0.48, "#5D6675", 0.06); }
    Cc(ctx, 0.25, -1.62, 0.12, "#6E7887", l0 * 0.6);
    Cc(ctx, 1.35, -0.95, 0.2, "#5D6675", l0 * 0.6); Cc(ctx, 1.35, -1.38, 0.17, "#5D6675", l0 * 0.6);
    // the cab, high up at the front, the driver, roof, beacon, mirror and ladder
    Pp(ctx, [-0.6, -2.7, -0.55, -4.25, 1.2, -4.25, 1.6, -2.7], G.frame);
    Pp(ctx, [-0.47, -2.83, -0.44, -4.12, 1.1, -4.12, 1.46, -2.83], G.glass, l0 * 0.6);
    driver(ctx, 0.45, -3.55);
    Ln(ctx, 0.85, -3.2, 1.05, -3.45, INK, 0.05);
    ctx.save(); ctx.globalAlpha = 0.55;
    Pp(ctx, [-0.2, -4.12, 0.12, -4.12, -0.32, -3.0, -0.4, -3.4], "#FFFFFF", 0);
    Pp(ctx, [0.55, -4.12, 0.72, -4.12, 0.3, -2.85, 0.14, -2.85], "#FFFFFF", 0);
    ctx.restore();
    Rr(ctx, -0.72, -4.47, 2.1, 0.25, 0.09, G.body);
    shine(ctx, -0.6, -4.41, 1.25, -4.41, 0.05);
    var bc = st.beacon ? (Math.sin(t * 9) > 0 ? "#FFD34D" : "#F08A1C") : "#F2A23A";
    if (st.beacon) { ctx.save(); ctx.globalAlpha = 0.35 + 0.3 * Math.max(0, Math.sin(t * 9)); Cc(ctx, 0.3, -4.55, 0.38, "#FFD34D", 0); ctx.restore(); }
    ctx.beginPath(); ctx.arc(0.3, -4.47, 0.13, Math.PI, 0); ctx.closePath(); fs(ctx, bc, l0 * 0.7);
    Ln(ctx, 1.55, -3.95, 1.8, -4.1, INK, 0.04); Rr(ctx, 1.75, -4.25, 0.1, 0.28, 0.04, G.frame, l0 * 0.5);
    Ln(ctx, -0.75, -2.7, -0.95, -0.95, INK, 0.05); Ln(ctx, -1.0, -2.7, -1.2, -0.95, INK, 0.05);
    for (i = 0; i < 5; i++) Ln(ctx, -0.77 - i * 0.04, -2.45 + i * 0.35, -1.02 - i * 0.04, -2.45 + i * 0.35, INK, 0.04);
    // the spout's turret behind the cab
    Rr(ctx, FH.pivot[0] - 0.42, FH.pivot[1] + 0.05, 0.84, 0.4, 0.08, G.dark, l0 * 0.8);
    Cc(ctx, FH.pivot[0], FH.pivot[1], 0.3, G.body);
    // the header in front
    if (st.header === "maize") maizeHeader(ctx, st); else pickupHeader(ctx, st);
    // wheels: small steering wheels at the back, big drive wheels at the front
    wheel(ctx, -3.85, -0.65, 0.65, rot / 0.65, { rim: 0.56 });
    wheel(ctx, 0, -1.0, 1.0, rot / 1.0, { rim: 0.58 });
    ctx.beginPath(); ctx.arc(0, -1.0, 1.18, -Math.PI + 0.25, -0.35); ctx.arc(0, -1.0, 1.05, -0.35, -Math.PI + 0.25, true); ctx.closePath(); fs(ctx, G.body);
    ctx.beginPath(); ctx.arc(-3.85, -0.65, 0.82, -Math.PI + 0.45, -0.45); ctx.arc(-3.85, -0.65, 0.72, -0.45, -Math.PI + 0.45, true); ctx.closePath(); fs(ctx, G.body);
  }
  function pickupHeader(ctx, st) {
    var spin = st.spin || 0, l0 = LW(), i;
    // the auger trough, with the auger turning, and the frame out to the pickup
    Pp(ctx, [1.7, -1.6, 3.0, -1.4, 3.5, -0.95, 3.3, -0.4, 1.7, -0.45], "#D9DEE4");
    shine(ctx, 1.85, -1.5, 2.95, -1.33, 0.06);
    Cc(ctx, 2.45, -0.92, 0.33, "#B8C0CA", l0 * 0.8);
    for (i = 0; i < 3; i++) { var ox = ((spin * 0.25 + i * 0.22) % 0.66) - 0.33; Ln(ctx, 2.45 + ox - 0.1, -1.18, 2.45 + ox + 0.1, -0.66, "#7C8696", 0.06); }
    // the pickup drum: spring tines turning round it lift the swath
    var px = 3.42, py = -0.4;
    for (i = 0; i < 10; i++) {
      var a = -spin * 2.2 + i * TAU / 10, c = Math.cos(a), s = Math.sin(a);
      Ln(ctx, px + c * 0.26, py + s * 0.26, px + c * 0.46 + s * 0.08, py + s * 0.46 - c * 0.08, "#2B3040", 0.05);
    }
    Cc(ctx, px, py, 0.27, "#F2C230");
    Cc(ctx, px, py, 0.08, "#8C97A6", l0 * 0.6);
    // the crop roller over the pickup, on its arm
    tube(ctx, 2.95, -1.35, 3.72, -0.86, 0.08, G.grey);
    Cc(ctx, 3.75, -0.82, 0.19, "#9AA5B4");
    Ln(ctx, 3.75 + Math.cos(spin) * 0.15, -0.82 + Math.sin(spin) * 0.15, 3.75 - Math.cos(spin) * 0.15, -0.82 - Math.sin(spin) * 0.15, "#5D6675", 0.04);
  }
  function maizeHeader(ctx, st) {
    var spin = st.spin || 0, l0 = LW(), i;

    c.beginPath(); c.ellipse(0, -0.16 * k, 0.24 * k, 0.07 * k, 0, 0, TAU); fs(c, "#6B7280", Farm.LW * 0.6);
    c.restore();
  }
  function drawClamp(sc) {
    if (sc.X(CL0 - 1, 1) > sc.W + 20 || sc.X(CL0 + HX, 1) < -20) return;
    var n = sc.night || 0;
    put(sc, CL0, 1, 1, function () {
      var l0 = LW(), i;
      // the far wall (concrete panels) and the end wall
      Rr(ctx, 0, -2.35, CLL, 2.35, 0.04, mix("#D5D9DE", "#3B4660", n * 0.5));
      for (i = 1; i < 6; i++) Ln(ctx, i * CLL / 6, -2.3, i * CLL / 6, -0.05, "rgba(29,35,64,0.25)", 0.04);
      Rr(ctx, -0.05, -2.52, CLL + 0.1, 0.2, 0.05, mix("#B9BFC7", "#3B4660", n * 0.5));
      Rr(ctx, -0.5, -2.6, 0.5, 2.6, 0.05, mix("#BCC2CA", "#3B4660", n * 0.5));
      // the heap of silage
      var packed = 0, cnt = 0;
      for (i = 0; i < HN; i++) if (heap.h[i] > 0.05) { packed += heap.shine[i]; cnt++; }
      packed = cnt ? packed / cnt : 0;
      var base = heap.crop === "maize" ? ["#C2C454", "#A7AE44", "#8F9A36"] : ["#93C04C", "#7EA640", "#5E8A2E"];
      if (cnt) {
        ctx.beginPath(); ctx.moveTo(0, 0);
        for (i = 0; i < HN; i++) ctx.lineTo(i * HDX, -heap.h[i]);
        ctx.lineTo(HX, 0); ctx.closePath();
        ctx.fillStyle = mix(base[0], base[1], packed); ctx.fill();
        ctx.save(); ctx.clip();
        for (i = 0; i < 70; i++) { var fx = hash(i, 31) * HX, fy = -hash(i, 32) * 2; Ln(ctx, fx, fy, fx + 0.18, fy - 0.06, base[2], 0.05); }
        ctx.restore();
        ctx.beginPath(); ctx.moveTo(0, 0); for (i = 0; i < HN; i++) ctx.lineTo(i * HDX, -heap.h[i]); ctx.lineTo(HX, 0);
        ctx.lineWidth = l0; ctx.strokeStyle = INK; ctx.lineJoin = "round"; ctx.stroke();
        // shine where the heavy tractor has rolled it
        for (i = 0; i < HN - 1; i++) {
          var sh = Math.min(heap.shine[i], heap.shine[i + 1]);
          if (sh < 0.05 || heap.h[i] < 0.05) continue;
          ctx.globalAlpha = sh * 0.8;
          Ln(ctx, i * HDX, -heap.h[i] + 0.12, (i + 1) * HDX, -heap.h[i + 1] + 0.12, "#F2FBD8", 0.14);
          ctx.globalAlpha = sh * 0.35;
          Ln(ctx, i * HDX, -heap.h[i] + 0.34, (i + 1) * HDX, -heap.h[i + 1] + 0.34, "#F2FBD8", 0.12);
          ctx.globalAlpha = sh;
          if (i % 6 === 2 && heap.cover < 0.5) { var gx = (i + 0.5) * HDX, gy = -heap.h[i] + 0.2, gs = 0.12 + 0.05 * Math.sin(time * 3 + i); Ln(ctx, gx - gs, gy, gx + gs, gy, "#FFFFFF", 0.05); Ln(ctx, gx, gy - gs, gx, gy + gs, "#FFFFFF", 0.05); }
          ctx.globalAlpha = 1;
        }
      }
      // the black sheet, unrolled from the end wall toward the open end
      if (heap.cover > 0.001 && cnt) {
        var end = rampEnd() - CL0 + 0.25, xs = heap.cover * end, k;
        ctx.beginPath(); ctx.moveTo(-0.1, -heap.h[0] - 0.05);
        for (k = 0; k * HDX <= xs; k++) ctx.lineTo(k * HDX, -(k < HN ? heap.h[k] : 0) - 0.06);
        var hx = xs / HDX, ys = -hAtLocal(xs) - 0.06;
        ctx.lineTo(xs, ys);
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.strokeStyle = INK; ctx.lineWidth = 0.22; ctx.stroke();
        ctx.strokeStyle = "#24272E"; ctx.lineWidth = 0.14; ctx.stroke();
        ctx.beginPath(); for (k = 1; k * HDX <= xs - 0.3; k += 3) { ctx.moveTo(k * HDX, -heap.h[k] - 0.1); ctx.lineTo((k + 1.2) * HDX, -heap.h[Math.min(HN - 1, k + 1)] - 0.1); }
        ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 0.04; ctx.stroke();
        if (heap.cover < 0.999 || uncover) { Cc(ctx, xs, ys - 0.24, 0.26, "#2E3138"); ctx.beginPath(); ctx.arc(xs, ys - 0.24, 0.13, 0, 4.5); ctx.strokeStyle = "#5A606C"; ctx.lineWidth = 0.04; ctx.stroke(); }
        // the wind lifts the sheet's end
        if (heap.flap) {
          var fl = 0.55 + 0.35 * Math.sin(heap.flap.t * 9), ex = end - 0.1, ey = -hAtLocal(ex) - 0.06;
          ctx.beginPath(); ctx.moveTo(ex - 1.1, -hAtLocal(ex - 1.1) - 0.06);
          ctx.quadraticCurveTo(ex - 0.3, ey - fl * 1.2, ex + 0.3, ey - fl * 0.9);
          ctx.lineTo(ex, ey); ctx.closePath(); fs(ctx, "#2A2D34", l0);
          var pr = 0.75 + 0.1 * Math.sin(time * 6);
          ctx.beginPath(); ctx.arc(ex - 0.3, ey - 0.6, pr, 0, TAU); ctx.strokeStyle = "rgba(255,201,60,0.9)"; ctx.lineWidth = 0.09; ctx.stroke();
        }
      }
      // the tires on top of the sheet
      heap.tires.forEach(function (q) {
        var ty = -hAtLocal(q.x) - 0.08, a = Math.atan2(hAtLocal(q.x + 0.3) - hAtLocal(q.x - 0.3), 0.6);
        if (q.st === "wait") return;
        if (q.st === "fall") { var f = clamp(q.t / 0.45, 0, 1); ty -= (1 - f * f) * 2.2; }
        if (q.st === "hop") { var g = q.t; ctx.save(); ctx.globalAlpha = clamp(1 - g / 0.6, 0, 1); tireShape(ctx, q.x + g * 1.5, ty - g * 2.4 + g * g * 3, 1, g * 4); ctx.restore(); return; }
        tireShape(ctx, q.x, ty, 1, -a);

    });
  }
  function hAtLocal(x) { return hAt(CL0 + x); }
  function drawHare(sc) {
    var t = hare.t, f = t / 3.4, r = lerp(hare.r0, 3.0, ease(f)), x = hare.x + f * 9;
    var hop = Math.abs(Math.sin(t * 7)) * 0.35, s = sc.S(r) * 1.4;
    D.hare(ctx, sc.X(x, r), sc.Y(r) - hop * sc.S(r), s, t * 3.5 % 1, false);
  }

  // ---------- The field: grass and maize (painted like farm.js's field, with this page's own crops) ----------
  function eachX(sc, row, sp, minPx, xa, xb, fn) {
    var rg = sc.xRange(row.rc), a = rg[2], b = rg[3];
    while (a * sp < minPx) sp *= 2;
    var lo = Math.max(rg[0], xa - sp), hi = Math.min(rg[1], xb + sp);
    for (var j = Math.floor(lo / sp); j <= Math.ceil(hi / sp); j++) { var x = (j + hash(j, row.i) * 0.6) * sp; fn(x, a * x + b, j); }
  }
  function band(sc, row, col) { ctx.fillStyle = col; ctx.fillRect(0, row.y1 - 0.5, sc.W, row.y0 - row.y1 + 1); }
  function jagged(sc, row, hp, col, lt, t, k) {
    var step = Math.max(4, Math.min(10, hp * 0.5)), yc = row.yc, off = sc.cam * sc.k / row.rc;
    ctx.beginPath(); ctx.moveTo(-5, row.y0 + 0.5);
    for (var x = -5; x <= sc.W + step; x += step) {
      var q = Math.floor((x + off) / step), sw = Math.sin(t * 1.5 + (x + off) * 0.02 + row.i * 0.6) * hp * 0.06;
      ctx.lineTo(x + sw, yc - hp * (0.88 + k * hash(q, row.i)));
    }
    ctx.lineTo(sc.W + step, row.y0 + 0.5); ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    if (lt) { ctx.lineWidth = Math.max(1, Math.min(sc.lw * 0.8, hp * 0.05)); ctx.strokeStyle = lt; ctx.stroke(); }
  }
  var PAINT = {
    grass: function (sc, row, stage, P, xa, xb, near) {
      var s = row.s, odd = row.i & 1, hgt = row.y0 - row.y1, t = P.time || 0;
      if (stage === "swaths" || stage === "stubble") {
        band(sc, row, odd ? "#C6DE8E" : "#BEDA86");
        if (row.fine && s * 0.06 > 1.5) {
          ctx.strokeStyle = "#9CC765"; ctx.lineWidth = Math.max(1, s * 0.015); ctx.beginPath();
          eachX(sc, row, 0.15, 5, xa, xb, function (x, sx, j) { var yy = row.y0 - hgt * hash(j, 3) * 0.8; ctx.moveTo(sx, yy); ctx.lineTo(sx + s * 0.01, yy - s * 0.06 * (0.6 + hash(j, 4))); });
          ctx.stroke();
        }
        if (stage === "swaths" && !near && row.i % 4 === 0) {
          // the cut grass lies in long rows (swaths)
          var hp = Math.max(1.5, s * 0.26);
          if (row.fine && hgt > 2) jagged(sc, row, hp, "#5E9F36", "#86C455", 0, 0.3);
          else { ctx.fillStyle = "#6AA93F"; ctx.fillRect(0, row.y1, sc.W, Math.max(1, hgt * 0.6)); }
        }
        return;
      }
      var g = stage === "grass" ? 1 : clamp(P.g || 0, 0, 1);
      if (g < 0.06) { band(sc, row, odd ? "#C6DE8E" : "#BEDA86"); return; }
      var h = lerp(0.06, 0.7, g) * (near ? 0.7 : 1), col = mix("#A9D26E", "#3F9A34", g), dk = mix("#93C35E", "#2E7A28", g), lt = mix("#C2E08E", "#7CC653", g);
      band(sc, row, dk);
      var hp = h * s;
      if (hp < 2 || !row.fine) { ctx.fillStyle = col; ctx.fillRect(0, row.y1 - hp, sc.W, hgt * 0.7 + hp); return; }
      jagged(sc, row, hp, col, lt, t, 0.25);
      if (g > 0.6 && s * 0.05 > 1.6) {
        // buttercups and clover in the meadow
        eachX(sc, row, 0.7, 14, xa, xb, function (x, sx, j) {
          if (hash(j, row.i + 3) < 0.55) return;
          var fy = row.yc - hp * (0.9 + 0.2 * hash(j, 6)), fr = Math.max(1.5, s * 0.035);
          ctx.beginPath(); ctx.arc(sx, fy, fr, 0, TAU); ctx.fillStyle = hash(j, 8) > 0.5 ? "#FFD84D" : "#FFFFFF"; ctx.fill();
        });
      }
    },
    maize: function (sc, row, stage, P, xa, xb, near) {
      var s = row.s, odd = row.i & 1, hgt = row.y0 - row.y1, t = P.time || 0;
      if (stage === "maizestub") {
        band(sc, row, odd ? "#CDB774" : "#C5AE6A");
        if (row.fine && s * 0.06 > 1.5) {
          ctx.strokeStyle = "#8E7C3E"; ctx.lineWidth = Math.max(1, s * 0.03); ctx.beginPath();
          eachX(sc, row, 0.35, 6, xa, xb, function (x, sx, j) { ctx.moveTo(sx, row.yc); ctx.lineTo(sx, row.yc - s * 0.12); });
          ctx.stroke();
        }
        return;
      }
      var g = stage === "maize" ? 1 : clamp(P.g || 0, 0, 1);
      if (g < 0.06) { band(sc, row, odd ? "#9C6B44" : "#94643F"); return; }
      var h = lerp(0.1, 2.3, g), hp = Math.min(h, near ? 0.7 : 9) * s, col = mix("#7CC24F", "#4E9A34", g), dk = mix("#5DA03C", "#2F6E24", g), lt = mix("#9AD670", "#C9B04A", clamp((g - 0.6) / 0.4, 0, 1));
      band(sc, row, dk);
      if (hp < 2 || !row.fine) { ctx.fillStyle = col; ctx.fillRect(0, row.y1 - hp, sc.W, hgt * 0.7 + hp); return; }
      // the standing maize is a tall green wall; the plants along its edge are drawn with the machines
      jagged(sc, row, hp, odd ? col : mix(col, dk, 0.35), null, t, 0.12);
    }
  };
  function fieldPaint(sc, part, P) {
    var rows = part === "near" ? sc.rowsNear : sc.rowsFar, painter = PAINT[P.crop] || PAINT.grass, w = P.wipe, near = part === "near";
    if (sc.X(0, 1) > sc.W + 40 && sc.X(L, 1) > sc.W + 40) return;
    if (sc.X(L, 3) < -40 && sc.X(L, 1) < -40) return;
    function run(stage, xa, xb) {
      if (xb - xa < 0.01) return;
      ctx.save(); sc.clipX(ctx, xa, xb);
      for (var i = 0; i < rows.length; i++) painter(sc, rows[i], stage, P, xa, xb, near);
      ctx.restore();
    }
    if (!w) run(P.stage, 0, L);
    else { run(w.to, 0, clamp(w.bx, 0, L)); run(P.stage, clamp(w.bx, 0, L), L); }

      ctx.save(); ctx.strokeStyle = "rgba(61,90,40,0.55)"; ctx.lineWidth = Math.max(1.5, sc.lw);
      [0, L].forEach(function (x) { ctx.beginPath(); ctx.moveTo(sc.X(x, sc.rH), sc.Y(sc.rH)); ctx.lineTo(sc.X(x, 1), sc.gY); ctx.lineTo(sc.X(x, sc.rN), sc.Y(sc.rN)); ctx.stroke(); });
      ctx.restore();
    }
  }

  // ---------- Loop ----------
  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
    if (!(window.Toybox && Toybox.timer.phase() === "resting")) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  function onEnding(done) { ending = true; auto = false; grab = null; rig.v = 0; setTimeout(function () { snd.engine(-1); snd.soil(0); snd.pour(0); done(); }, 2600); }
  function onWake() { ending = false; dusk = 0; }

  // ---------- Start ----------
  (function restore() {
    var c = saved.clamp || {};
    var V = typeof c.V === "number" && isFinite(c.V) ? clamp(Math.round(c.V), 0, 4) : 0;
    heap.V = V; heap.crop = c.crop === "maize" ? "maize" : (c.crop === "grass" ? "grass" : crop);
    if (V > 0) { setFlat(V, 1); if (c.covered) { heap.cover = 1; heap.tires = makeTires(); landTires(); } }
  })();
  showSteps();
  field.stage = cropStage(crop);
  resize();
  bringIn(firstStep());
  rig.x = rig.target - 7;
  setZoom(zoomA.target, zoomA.mht, true);
  follow(0, true);
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  else window.addEventListener("resize", resize);

  Toybox.init({
    app: "farm",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the machines stop and park, and the controls lock. The timer carries on across the farm pages.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "Soft engine and grass sounds. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: onWake,
    onWake: onWake,
    onSound: function (on) { if (on) snd.chime(); }
  });
  requestAnimationFrame(loop);

  if (/[?&]debug\b/.test(location.search)) window.__farm = {
    state: function () { return { phase: phase, step: stepId, cur: steps.current(), finished: steps.finished(), crop: crop, x: rig.x, m: rig.m, field: field.stage, trailer: tr.st, tx: tr.x, tr: tr.r, load: tr.load, loader: ld.st, roller: ro.st, V: heap.V, cover: heap.cover, tires: heap.tires.length, loads: loads, coach: coach.text(), split: split, flap: !!heap.flap }; },
    screen: function (id) { return id === "flap" ? flapScreen() : partScreen(id || stepId); },
    surprise: surprise,
    ghost: function () { return ghost.show(); }
  };
})();
