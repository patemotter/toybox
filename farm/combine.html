<style>
:root {
  --bg: #CDE9FF; --panel: #FFFFFF; --ink: #1D2340; --muted: #4A5578; --edge: #1D2340; --accent: #FFC93C; --plate: #F4FAFF; --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.tb-head a { text-decoration: none; }
.stage { background: #A9DCFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
.loads { font-variant-numeric: tabular-nums; }
.loads.pop { animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel { display: none; }
body.ending .tb-panel, body.ending .homebtn, body.ending .mapbtn { pointer-events: none; opacity: 0.4; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
.mapbtn .tb-mapic { width: 30px; height: 30px; background: #FFFFFF; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { .loads.pop { animation: none; } }
</style>
</head>
<body>
<div class="tb-app-shell tb-v2 wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="mapbtn" href="./" aria-label="Back to the farm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><svg class="tb-mapic" viewBox="0 0 40 40" aria-hidden="true"><path d="M3 33h34" stroke="#1D2340" stroke-width="3" stroke-linecap="round"/><path d="M8 33V18l8-8 8 8v15z" fill="#D2483D" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="12" y="22" width="8" height="11" fill="#A8352D" stroke="#1D2340" stroke-width="2"/><rect x="27" y="14" width="8" height="19" rx="2" fill="#D3DAE2" stroke="#1D2340" stroke-width="2.5"/></svg><span>Farm</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title" id="title">Combine Time</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A golden wheat field with a green combine harvester. Tap the combine to harvest."></canvas>
      <div class="tb-counter loads" id="loads">Loads: 0</div>
      <div id="coach"></div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
    <section class="tb-panel" id="panel">
      <ol id="steps"></ol>
      <div id="bottom"></div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.u, clamp = U.clamp, lerp = U.lerp, ease = U.ease, hash = U.hash;
  var D = Farm.draw, snd = Farm.sound, C = Farm.COMBINE;
  var NAME = Farm.NAMES.combine;
  document.title = NAME; $("title").textContent = NAME;

  // ---------- State ----------
  var KEY = "farm-combine-v1";
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  if (startFresh) saved = {};
  var loads = typeof saved.loads === "number" ? saved.loads : 0;
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ loads: loads })); } catch (e) { /* ignore */ } }

  var L = 24, STORE_X = L + 20, VMAX = 5.6;
  var sc = new Farm.Scene({ L: L, span: 11.6, mh: 4.7, xmin: -15, xmax: STORE_X + 9, rowDz: 0.5 });
  var parts = new Farm.Particles();
  var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
  var W = 300, H = 300, DPR = 1, time = 0;

  var crop = { stage: "golden", g: 1, wipe: null };
  var cb = { x: -5.6, dir: 1, face: 1, v: 0, wheel: 0, reel: 0, tank: 0, auger: 0, beacon: false };
  var tr = { x: -40, v: 0, wheel: 0, load: 0, tip: 0, state: "away" };
  var phase = "ready", phaseT = 0, auto = false, grab = null, ending = false, arc = null, dusk = 0, storeLevel = 0, storeRun = 0;
  var straw = { x0: 0, x1: 0, on: false }, dogS = null, deer = null, hawk = null, faceT = 0, gulls = [];
  var w0 = Farm.world.get();
  storeLevel = Math.min(1.1, w0.grain / 8);

  function cutX() { return cb.x + cb.dir * C.cut; }
  function pivotX() { return cb.x + cb.dir * C.pivot[0]; }
  function startX(dir) { return dir > 0 ? -0.8 - C.cut : L + 0.8 + C.cut; }
  function endX(dir) { return dir > 0 ? L + 1.2 - C.cut : -1.2 + C.cut; }
  function locked() { return ending || (window.Toybox && Toybox.timer.locked()); }

  // ---------- Layout ----------
  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(50, r.width); H = Math.max(50, r.height);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    sc.layout(W, H);
    sc.follow(camTarget(), 0, true);
  }

  // ---------- Coach, counter, name tags ----------
  var coach = Toybox.coach($("coach"));
  function setLoads() { var el = $("loads"); el.textContent = "Loads: " + loads; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  $("loads").textContent = "Loads: " + loads;
  function tag(text, x, h, r) {
    var b = cv.getBoundingClientRect();
    Toybox.nametag(text, b.left + sc.X(x, r || 1), b.top + sc.Y(r || 1) - h * sc.S(r || 1), 2200);
  }
  var tagged = {};
  function tagOnce(id, text, x, h, r) { if (tagged[id]) return; tagged[id] = 1; tag(text, x, h, r); }

  // ---------- The flow: weeks go by -> Harvest -> Unload -> Again ----------
  function setPhase(p) { phase = p; phaseT = 0; }
  function grow(turn) {
    setPhase("grow"); arc = 0; crop.stage = "grow"; crop.g = 0; crop.wipe = null; straw.on = false; dogS = null;
    cb.turnFrom = cb.dir; cb.turn = !!turn;
    steps.at("harvest"); steps.busy(true);
    coach.say("Weeks go by...", 4);
  }
  function ready() {
    setPhase("ready"); arc = null; crop.stage = "golden"; crop.g = 1; crop.wipe = null; steps.busy(false);
    Farm.world.update(function (w) { w.wheat = "golden"; w.season = "summer"; });
    steps.at("harvest");
  }
  function harvest() {
    if (phase !== "ready" && phase !== "drive") return false;
    if (phase === "ready") { setPhase("drive"); crop.wipe = { bx: cutX(), dir: cb.dir, to: "stubble" }; straw.on = true; straw.x0 = cb.x - cb.dir * 6; straw.x1 = straw.x0; snd.horn(); }
    auto = true; steps.busy(true);
    if (ghost) ghost.learned("harvest");
    tagOnce("reel", "Reel", cb.x + cb.dir * 3.9, 2.6);
    return true;
  }
  function passDone() {
    auto = false; cb.v = 0; setPhase("full"); cb.beacon = true; steps.busy(false);
    crop.stage = "stubble"; crop.wipe = null;
    Farm.world.update(function (w) { w.wheat = "stubble"; });
    steps.done("harvest");
    tag("Grain tank", cb.x + cb.dir * -2.2, 4.7);
    snd.horn();
  }
  function unload() {
    if (phase !== "full") return false;
    setPhase("unload"); steps.busy(true);
    tr.state = "in"; tr.x = sc.wx(-60, sc.TRACK) - 2; tr.load = 0; tr.tip = 0;
    if (ghost) ghost.learned("unload");
    return true;
  }
  function again() {
    if (phase !== "done") return false;
    if (ghost) ghost.learned("again");
    grow(true);
    return true;
  }

  // ---------- Steps, bar, ghost ----------
  var STEPS = [
    { id: "harvest", name: "Harvest", pic: Farm.pic("combine"), go: "Harvest!", coach: "Tap the combine!" },
    { id: "unload", name: "Unload", pic: Farm.pic("graintrailer"), go: "Unload!", coach: "Unload the grain!" }
  ];
  var ghost = Toybox.ghost({
    max: 3,
    onShow: function (p, on) { if (steps) steps.pulse(on); },
    plan: function () {
      if (locked()) return null;
      var b = cv.getBoundingClientRect();
      function at(x, h, r) { return [b.left + sc.X(x, r || 1), b.top + sc.Y(r || 1) - h * sc.S(r || 1)]; }
      if (phase === "ready") {
        var p = at(cb.x - cb.dir * 1.5, 2.0);
        if (ghost.shown("harvest") >= 1) return { pts: [p, [p[0] + cb.dir * Math.min(W * 0.35, 160), p[1]]], key: "harvest" };
        return { pts: [p], tap: true, key: "harvest" };
      }
      if (phase === "full") return { pts: [at(cb.x - cb.dir * 1.5, 2.0)], tap: true, key: "unload" };
      if (phase === "done" && phaseT > 4) { var g = steps.go.el.getBoundingClientRect(); if (g.width) return { pts: [[g.left + g.width / 2, g.top + g.height / 2]], tap: true, key: "again" }; }
      return null;
    }
  });
  var steps = Toybox.steps($("steps"), {
    steps: STEPS, coach: coach, ghost: ghost,
    onGo: function (id) { return doGo(id); },
    onAgain: function () { again(); },
    onBusy: function () { busyHint(); }
  });
  function doGo() {
    if (locked()) return false;
    if (tr.state === "drift") { bringBack(); return true; }
    if (phase === "ready" || (phase === "drive" && !auto)) return harvest();
    if (phase === "full") return unload();
    if (phase === "done") return again();
    busyHint(); return true;
  }
  function busyHint() {
    if (phase === "grow") coach.say("The wheat is growing!", 3);
    else if (phase === "drive") { snd.horn(); coach.say("Harvesting!", 3); }
    else if (tr.state === "drift") bringBack();
    else if (phase === "unload") coach.say(tr.state === "tip" || tr.state === "go" ? "Into the grain store!" : "Pouring the grain!", 3);
  }
  Toybox.bar($("bottom"), { onNew: startOver, onSurprise: surprise });

  function startOver() {
    if (locked()) return;
    parts.clear(); deer = hawk = null; gulls = []; faceT = 0; dogS = null; tagged = {};
    tr.state = "away"; tr.x = -40; cb.auger = 0; cb.tank = 0; cb.beacon = false; auto = false; cb.v = 0;
    cb.dir = 1; cb.face = 1; cb.x = startX(1);
    sc.follow(camTarget(), 0, true);
    if (Farm.world.get().wheat === "golden") ready(); else grow(false);
    coach.say("A new field!", 3);
  }

  // ---------- Surprise: a fun moment on the scene, taking turns ----------
  var surpriseN = 0;
  function surprise() {
    if (locked()) return;
    var list = ["deer", "hawk", "faces"];
    if (phase === "unload" && tr.state === "pour") list.unshift("drift");
    var pick = list[surpriseN++ % list.length];
    if (pick === "drift") { tr.state = "drift"; tr.dT = 0; coach.say("Tap the trailer!", 4); return; }
    if (pick === "deer") {
      var fromWheat = crop.stage !== "stubble" && crop.wipe;
      var x0 = fromWheat ? cutX() + cb.dir * 5 : sc.wx(W * 0.25, 1);
      deer = { x: x0, r: 2.6, t: 0, dir: hash(surpriseN, 3) > 0.5 ? 1 : -1 };
      coach.say("A deer!", 3);
      return;
    }
    if (pick === "hawk") { hawk = { t: 0, x0: W * 0.5, y0: sc.hY * 0.4 }; coach.say("A hawk!", 3); return; }
    faceT = 6; coach.say("Hello, combine!", 3);
  }
  function bringBack() { if (tr.state !== "drift") return; tr.state = "back"; snd.horn(); coach.say("Back you come!", 3); }

  // ---------- Input: tap or drag (Toybox.press) ----------
  function cbPart() { return { id: "combine", x: sc.X(cb.x - cb.dir * 1.2, 1), y: sc.gY - 2.0 * sc.k, r: 2.8 * sc.k }; }
  function trPart() { var s = TS(), x0 = sc.X(tr.x, sc.TRACK); return { id: "trailer", x: x0 - 4.2 * s, y: sc.Y(sc.TRACK) - 1.6 * s, r: 2.8 * s }; }
  var press = Toybox.press(cv, {
    any: true,
    parts: function () {
      var b = cv.getBoundingClientRect(), list = [], p = cbPart();
      list.push({ id: "combine", x: b.left + p.x, y: b.top + p.y, r: p.r });
      if (tr.state !== "away") { var q = trPart(); list.push({ id: "trailer", x: b.left + q.x, y: b.top + q.y, r: q.r }); }
      return list;
    },
    dragStart: function (part, e, s) {
      if (locked() || part !== "combine" || (phase !== "ready" && phase !== "drive")) return;
      if (phase === "ready") harvest();
      auto = false; grab = { off: sc.wx(s.x - cv.getBoundingClientRect().left, 1) - cb.x };
      if (ghost) ghost.learned("harvest");
    },
    move: function (part, e, s) {
      if (!grab) return;
      grab.to = sc.wx(s.x - cv.getBoundingClientRect().left, 1) - grab.off;
    },
    up: function (part, e, s) {
      if (grab && !s.tap) { grab = null; if (phase === "drive") steps.busy(false); }
      grab = null;
    },
    tap: function (part, x, y) {
      if (locked()) return;
      var b = cv.getBoundingClientRect(), px = x - b.left, py = y - b.top;
      if (part === "trailer") {
        if (tr.state === "drift") { bringBack(); return; }
        snd.horn(); tag("Trailer", tr.x - 4.2, 3.4, sc.TRACK); return;
      }
      if (part === "combine") {
        if (phase === "ready" || (phase === "drive" && !auto)) { harvest(); return; }
        if (phase === "full") { unload(); return; }
        snd.horn(); cb.flash = 1.2; tag("Combine harvester", cb.x - cb.dir * 1.2, 4.9); return;
      }
      // anywhere else: the store, or a little puff of chaff and the step's line
      var sx = sc.X(STORE_X, 1.02);
      if (Math.abs(px - sx) < 5 * sc.S(1.02) && py < sc.Y(1.02) && py > sc.Y(1.02) - 7 * sc.S(1.02)) { tag("Grain store", STORE_X, 7.4, 1.02); return; }
      var r = clamp(sc.B / Math.max(4, py - sc.hY), 0.6, 5);
      for (var i = 0; i < 6; i++) parts.add({ kind: "puff", x: sc.wx(px, Math.min(1, r)) + (Math.random() - 0.5), h: 0.3, r: Math.min(1, r), vx: (Math.random() - 0.5), vh: 0.6, life: 1, size: 0.12, grow: 0.5, col: "#F3DE9A", alpha: 0.7 });
      if (phase === "done") steps.sayStep && coach.say("Tap Again!", 3); else steps.sayStep();
      if (ghost) ghost.poke();
    }
  });

  // ---------- Simulation ----------
  function camTarget() {
    if (phase === "unload" && (tr.state === "tip" || tr.state === "untip" || tr.state === "off")) return STORE_X;
    if (phase === "unload" && tr.state === "go") return Math.min(STORE_X, trX(-4));
    if (phase === "unload") return (pivotX() + (tr.state === "in" ? Math.max(tr.x - 5, pivotX() - 6) : pivotX())) / 2;
    if (phase === "done") return cb.x - cb.dir * 2.5;
    return cb.x + cb.dir * (sc.port ? 0.6 : 1.4);
  }
  var engLevel = 0;
  function update(dt) {
    time += dt; phaseT += dt;
    var drive = 0;
    // weeks go by
    if (phase === "grow") {
      var GT = 4.6;
      arc = clamp(phaseT / GT, 0, 1);
      crop.g = ease(arc);
      if (cb.turn) {
        var tt = clamp((phaseT - 0.3) / 1.1, 0, 1);
        if (tt > 0 && tt < 1) { cb.face = lerp(cb.turnFrom, -cb.turnFrom, ease(tt)); }
        if (tt >= 1 && cb.dir === cb.turnFrom) { cb.dir = -cb.turnFrom; cb.face = cb.dir; cb.tank = 0; }
        cb.x = lerp(cb.x, startX(cb.turnFrom > 0 ? -1 : 1), Math.min(1, dt * 2));
      } else { cb.x = lerp(cb.x, startX(cb.dir), Math.min(1, dt * 3)); }
      if (phaseT >= GT) { if (cb.turn) { cb.x = startX(cb.dir); } ready(); }
    }
    // the harvest pass
    if (phase === "drive") {
      var vt = 0;
      if (grab && grab.to !== undefined) { var ahead = (grab.to - cb.x) * cb.dir; vt = clamp(ahead * 3, 0, VMAX * 1.4); }
      else if (auto) vt = VMAX;
      cb.v += (vt - cb.v) * Math.min(1, dt * (vt > cb.v ? 3 : 6));
      cb.x += cb.v * cb.dir * dt; drive = cb.v / VMAX;
      var cx = cutX();
      crop.wipe.bx = cx;
      var prog = clamp(cb.dir > 0 ? (cx + 0.8) / (L + 1.6) : (L + 0.8 - cx) / (L + 1.6), 0, 1);
      cb.tank = Math.max(cb.tank, prog);
      straw.x1 = cb.x - cb.dir * 6.2;
      if (cb.tank > 0.55) tagOnce("tank", "Grain tank", cb.x - cb.dir * 2.2, 4.7);
      if (cb.v > 0.5) {
        // wheat tipping into the header, straw and chaff out of the back, dust
        if (Math.random() < dt * 30) parts.add({ kind: "straw", x: cx + cb.dir * (0.1 + Math.random() * 0.3), h: 0.7 + Math.random() * 0.4, r: 0.9 + Math.random() * 0.2, vx: -cb.dir * (1.5 + Math.random()), vh: 0.5, g: 4, life: 0.5, size: 0.12, col: "#F0C84E", spin: 6 });
        if (Math.random() < dt * 40) parts.add({ kind: "straw", x: cb.x - cb.dir * 6.3, h: 1.2, r: 0.92 + Math.random() * 0.16, vx: -cb.dir * (2 + Math.random() * 2), vh: 1 + Math.random(), g: 6, drag: 1.5, life: 1.6, size: 0.14, col: Math.random() > 0.5 ? "#F3DA8E" : "#D9B35C", spin: (Math.random() - 0.5) * 12 });
        if (Math.random() < dt * 10) parts.add({ kind: "puff", x: cb.x - cb.dir * 6.5, h: 1.4, r: 1.0, vx: -cb.dir * 1.2, vh: 0.6, life: 1.4, size: 0.25, grow: 0.7, col: "#F6E7B8", alpha: 0.45 });
        if (Math.random() < dt * 4) parts.add({ kind: "puff", x: cb.x + cb.dir * 1.0, h: 4.6, r: 1.0, vx: -cb.dir * 0.6, vh: 1.0, life: 1.4, size: 0.12, grow: 0.3, col: "#8A8FA0", alpha: 0.25 });
      }
      if ((cb.dir > 0 && cb.x >= endX(1)) || (cb.dir < 0 && cb.x <= endX(-1))) { cb.x = endX(cb.dir); passDone(); }
    }
    // unloading: the trailer comes alongside, the auger swings out, grain pours, off to the store
    if (phase === "unload" || tr.state === "off") updateUnload(dt);
    if (phase === "full" || phase === "unload") drive = Math.max(drive, 0.2);
    cb.wheel += cb.v * dt; cb.reel += dt * (phase === "drive" ? 1.4 + cb.v * 0.4 : 0.35);
    if (cb.flash) cb.flash = Math.max(0, cb.flash - dt);
    // the farm dog jumps into the straw when the job is done
    if (dogS) updateDog(dt);
    if (deer) { deer.t += dt; if (deer.t > 4) deer = null; }
    if (hawk) { hawk.t += dt; if (hawk.t > 6) hawk = null; }
    if (faceT > 0) faceT = Math.max(0, faceT - dt);
    if (ending) dusk = Math.min(1, dusk + dt * 0.5);
    parts.update(dt);
    sc.follow(camTarget(), dt);
    var lvl = phase === "drive" ? drive : (tr.state === "in" || tr.state === "go" || tr.state === "off" ? 0.6 : 0.15);
    engLevel += (lvl - engLevel) * Math.min(1, dt * 4);
    snd.engine(ending ? -1 : engLevel);
    snd.pour(tr.state === "pour" || tr.state === "tip" ? 0.8 : 0);
  }
  var POUR = 2.6;
  function updateUnload(dt) {
    var spot = sc.wx(sc.X(pivotX(), 1) - cb.dir * 1.4 * sc.k + 4.5 * TS(), sc.TRACK), ts = tr.state;
    if (ts === "in") {
      var d = spot - tr.x;
      tr.v = clamp(d * 2.2, 0.8, 12); tr.x += Math.min(tr.v * dt, Math.max(d, 0.01));
      if (d < 0.05) { tr.x = spot; tr.v = 0; tr.state = "swing"; tr.t = 0; tagOnce("trailer" + loads, "Trailer", trX(-4.2), 3.0, sc.TRACK); }
    } else if (ts === "swing") {
      tr.t += dt; cb.auger = ease(tr.t / 1.0);
      if (tr.t >= 1.0) { tr.state = "pour"; tr.t = 0; }
    } else if (ts === "pour") {
      tr.t += dt; var f = clamp(tr.t / POUR, 0, 1);
      if (tr.t > 1.2) tagOnce("auger" + loads, "Unloading auger", pivotX(), 4.6, 0.9);
      cb.tank = 1 - f; tr.load = f;
      if (f >= 1) { tr.state = "fold"; tr.t = 0; cb.beacon = false; }
    } else if (ts === "drift") {
      tr.dT += dt; if (tr.dT < 1.4) { tr.v = 1.6; tr.x += tr.v * dt; } else tr.v = 0;
    } else if (ts === "back") {
      var db = spot - tr.x; tr.x += clamp(db * 3, -4, -0.6) * dt; tr.v = -1;
      if (tr.x <= spot) { tr.x = spot; tr.v = 0; tr.state = "pour"; }
    } else if (ts === "fold") {
      tr.t += dt; cb.auger = 1 - ease(tr.t / 0.9);
      if (tr.t >= 0.9) { cb.auger = 0; tr.state = "go"; tr.t = 0; }
    } else if (ts === "go") {
      var target = (sc.pit ? sc.pit.x : STORE_X - 2.6) + 7.7 * TS() * sc.TRACK / sc.k;
      var dg = target - tr.x;
      tr.v = clamp(dg * 2.2, 1.2, 15); tr.x += Math.min(tr.v * dt, Math.max(dg, 0.01));
      if (dg < 0.05) { tr.x = target; tr.v = 0; tr.state = "tip"; tr.t = 0; tag("Grain store", STORE_X, 7.4, 1.02); }
    } else if (ts === "tip") {
      tr.t += dt;
      tr.tip = ease(tr.t / 0.8);
      if (tr.t > 0.6) { tr.load = Math.max(0, 1 - (tr.t - 0.6) / 1.6); tipStream(dt); storeRun = 1; storeLevel = Math.min(1.1, storeLevel + dt * 0.075); }
      if (tr.t > 2.3) { tr.state = "untip"; tr.t = 0; tr.load = 0; storedLoad(); }
    } else if (ts === "untip") {
      tr.t += dt; tr.tip = 1 - ease(tr.t / 0.9); storeRun = Math.max(0, storeRun - dt);
      if (tr.t >= 0.9) { tr.tip = 0; tr.state = "off"; tr.t = 0; }
    } else if (ts === "off") {
      tr.t += dt; tr.v = Math.min(9, tr.v + dt * 6); tr.x += tr.v * dt;
      if (tr.t > 0.6 && phase === "unload") finishJob();
      if (tr.t > 4) { tr.state = "away"; tr.x = -40; }
    }
    tr.wheel += tr.v * dt;
  }
  function storedLoad() {
    loads++; save(); setLoads();
    Farm.world.update(function (w) { w.grain = (w.grain || 0) + 1; });
    snd.chime();
  }
  function finishJob() {
    setPhase("done"); steps.done("unload"); steps.finish("Again!"); steps.busy(false);
    coach.say("All in the grain store!", 4);
    Toybox.kind();
    // the farm dog bounds in and hops into the straw
    var sx = (straw.x0 + straw.x1) / 2;
    dogS = { x: sc.wx(-30, 0.75), r: 0.75, tx: clamp(sx, Math.min(straw.x0, straw.x1) + 2, Math.max(straw.x0, straw.x1) - 2), t: 0, st: "run" };
  }
  function updateDog(dt) {
    var d = dogS; d.t += dt;
    if (d.st === "run") { var dx = d.tx - d.x; d.x += clamp(dx * 2, -7, 7) * dt; d.ph = (d.ph || 0) + dt * 3; if (Math.abs(dx) < 0.3) { d.st = "jump"; d.jt = 0; } }
    else if (d.st === "jump") {
      d.jt += dt; var f = clamp(d.jt / 0.7, 0, 1); d.r = lerp(0.75, 1.0, f); d.h = Math.sin(f * Math.PI) * 1.0;
      if (f >= 1) { d.st = "sit"; d.h = 0; for (var i = 0; i < 14; i++) parts.add({ kind: "straw", x: d.x + (Math.random() - 0.5), h: 0.3, r: 1.0, vx: (Math.random() - 0.5) * 3, vh: 2 + Math.random() * 2, g: 7, drag: 1, life: 1.4, size: 0.12, col: "#F3DA8E", spin: 8 }); }
    } else d.ph = (d.ph || 0) + dt * 0.8;
  }
  function grainStream(dt) {
    var sp = spout();
    for (var i = 0; i < 3; i++) parts.add({ kind: "dot", x: sp.x + (Math.random() - 0.5) * 0.25, h: sp.h, r: sc.TRACK + 0.02, vx: 0, vh: -1, g: 9, life: 0.5, size: 0.06, col: Math.random() > 0.3 ? "#EBB93E" : "#C99322", floor: 2.6 });
  }
  function tipStream() {
    var tx = trX(-7.8), hk = TS() * sc.TRACK / sc.k;
    for (var i = 0; i < 3; i++) parts.add({ kind: "dot", x: tx - Math.random() * 0.3, h: (1.0 + Math.random() * 0.5) * hk, r: sc.TRACK, vx: -0.6, vh: 0, g: 9, life: 0.4, size: 0.07, col: Math.random() > 0.3 ? "#EBB93E" : "#C99322" });
  }
  // the auger's spout: from folded (along the side) to out over the trailer
  function spout() {
    var u = cb.auger, r = lerp(1, sc.TRACK + 0.04, u);
    return { x: pivotX() + cb.dir * lerp(-2.5, 0, u), h: lerp(3.4, 4.4, u), r: r };
  }

  // ---------- Drawing ----------
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    sc.sky(ctx, { time: time, arc: phase === "grow" ? arc : null, season: "summer", dusk: dusk });
    sc.hedge(ctx, { season: "summer" });
    var P = { crop: "wheat", stage: crop.stage, g: crop.g, wipe: crop.wipe, time: time, edge: "#B88A2C" };
    sc.field(ctx, "far", P);
    drawStraw();
    if (deer && deer.r > 1) drawDeer();
    parts.draw(ctx, sc, function (p) { return p.r > 1.0; });
    drawCombine();
    if (dogS && dogS.st === "sit") drawDog();
    sc.field(ctx, "near", P);
    parts.draw(ctx, sc, function (p) { return p.r <= 1.0 && p.r > sc.TRACK + 0.03; });
    sc.verge(ctx, {});
    sc.store(ctx, storeLevel, { x: STORE_X, kind: "grain", run: storeRun, time: time });
    if (tr.state !== "away") drawTrailer();
    if (cb.auger > 0.01) drawAuger();
    parts.draw(ctx, sc, function (p) { return p.r <= sc.TRACK + 0.03; });
    if (dogS && dogS.st !== "sit") drawDog();
    if (deer && deer.r <= 1) drawDeer();
    if (hawk) drawHawk();
  }
  function drawStraw() {
    if (!straw.on && phase !== "full" && phase !== "unload" && phase !== "done") return;
    var a = Math.min(straw.x0, straw.x1), b = Math.max(straw.x0, straw.x1), r = 1.04;
    a = Math.max(a, 0); b = Math.min(b, L);
    if (b - a < 0.2) return;
    var s = sc.S(r), y = sc.Y(r), step = 0.4;
    ctx.beginPath(); ctx.moveTo(sc.X(a, r), y);
    for (var x = a; x <= b; x += step) ctx.lineTo(sc.X(x, r), y - s * (0.28 + 0.1 * hash(Math.floor(x / step), 3)));
    ctx.lineTo(sc.X(b, r), y); ctx.closePath();
    ctx.fillStyle = "#F0D27E"; ctx.fill(); ctx.lineWidth = Math.max(1, sc.lw * 0.6); ctx.strokeStyle = "#B88F3A"; ctx.stroke();
  }
  function drawCombine() {
    var f = faceT > 0 ? Math.min(1, faceT, 6 - faceT) : 0;
    sc.put(ctx, cb.x, 1, cb.face, function () {
      D.combine(ctx, { wheel: cb.wheel, time: time, tank: cb.tank, reel: cb.reel, auger: cb.auger > 0.01, beacon: cb.beacon || cb.flash > 0, face: f, look: [0, 1] });
    });
  }
  function drawAuger() {
    var sp = spout(), lw = sc.lw;
    var x1 = sc.X(pivotX(), 1), y1 = sc.Y(1) - (-C.pivot[1]) * sc.S(1);
    var u = cb.auger, sS = lerp(sc.S(1), TS(), u);
    var x2 = lerp(sc.X(pivotX() + cb.dir * -2.5, 1), sc.X(tr.x, sc.TRACK) - 4.5 * TS(), u), y2 = lerp(sc.Y(1), sc.Y(sc.TRACK), u) - sp.h * sS;
    D.boom(ctx, x1, y1, x2, y2, 0.26 * sc.S(1), lerp(0.26, 0.46, u) * sS, time * (tr.state === "pour" ? 3 : 0), "auger", lw);
    if (tr.state === "pour") {
      // the golden stream from the spout into the trailer
      var yb = sc.Y(sc.TRACK) - (2.75 + tr.load * 0.4) * TS(), wv = 0.16 * sS;
      ctx.beginPath(); ctx.moveTo(x2 - wv, y2 + wv); ctx.lineTo(x2 + wv, y2 + wv);
      ctx.lineTo(x2 + wv * 1.4 + Math.sin(time * 20) * 1.5, yb); ctx.lineTo(x2 - wv * 1.4, yb); ctx.closePath();
      ctx.fillStyle = "#EBB93E"; ctx.fill(); ctx.lineWidth = Math.max(1, lw * 0.6); ctx.strokeStyle = "#B4862A"; ctx.stroke();
    }
  }
  // Vehicles on the track are drawn at the machine line's size (a picture-book cheat: true perspective
  // would make the trailer hide the combine).
  function TS() { return sc.S(1) * 1.04; }
  // world x on the track of a point dx metres along the trailer (drawn at TS), and its height factor
  function trX(dx) { return tr.x + dx * TS() * sc.TRACK / sc.k; }
  function drawTrailer() {
    var r = sc.TRACK, f = faceT > 0 ? Math.min(1, faceT, 6 - faceT) : 0;
    sc.put(ctx, tr.x, r, 1, function () {
      ctx.translate(0, -0.5);
      D.trailer(ctx, { wheel: tr.wheel, load: tr.load, tip: tr.tip, crop: "grain", face: f, time: time, look: [0, 1] });
      ctx.translate(-Farm.DRAWBAR[0], 0.5);
      D.tractor(ctx, { wheel: tr.wheel, time: time, drawbar: true, face: f, look: [0, 1] });
    }, TS());
    if (tr.state === "drift" && Math.sin(time * 8) > 0) {
      ctx.save(); ctx.globalAlpha = 0.25; ctx.fillStyle = "#FFC93C";
      var q = trPart(); ctx.beginPath(); ctx.arc(q.x, q.y, q.r * 0.9, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
  }
  function drawDog() {
    var d = dogS, s = sc.S(d.r);
    D.dog(ctx, sc.X(d.x, d.r), sc.Y(d.r) - (d.h || 0) * s - (d.st === "sit" ? 0.18 * s : 0), s * 1.1, d.ph || 0, false, d.st === "sit");
  }
  function drawDeer() {
    var f = deer.t / 4, r = lerp(2.6, 0.6, f), x = deer.x + deer.dir * f * 10;
    deer.r = r;
    var hop = Math.abs(Math.sin(deer.t * 5)) * 0.6;
    D.deer(ctx, sc.X(x, r), sc.Y(r) - hop * sc.S(r), sc.S(r) * 1.2, deer.t * 2.5 % 1, deer.dir < 0);
  }
  function drawHawk() {
    var t = hawk.t, x, y, s = Math.max(28, sc.k * 1.2);
    if (t < 3.5) { x = W * 0.5 + Math.cos(t * 1.6) * W * 0.25; y = sc.hY * 0.5 + Math.sin(t * 1.6) * sc.hY * 0.15; }
    else if (t < 4.6) { var f = (t - 3.5) / 1.1; x = W * 0.5 + W * 0.25 * Math.cos(3.5 * 1.6) + f * W * 0.15; y = lerp(sc.hY * 0.5, sc.gY - sc.k * 0.4, Math.sin(f * Math.PI / 2)); }
    else { var g = (t - 4.6) / 1.4; x = W * 0.5 + W * 0.25 * Math.cos(5.6) + W * 0.15 + g * W * 0.5; y = lerp(sc.gY - sc.k * 0.4, -40, g); }
    D.hawk(ctx, x, y, s, t * 1.3, Math.cos(t * 1.6) > 0 && t < 3.5);
  }

  // ---------- Loop ----------
  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
    if (!(window.Toybox && Toybox.timer.phase() === "resting")) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }

  // ---------- Timer ending ----------
  function onEnding(done) {
    ending = true; auto = false; grab = null;
    if (phase === "drive") { cb.v = 0; }
    setTimeout(function () { cb.auger = 0; snd.engine(-1); done(); }, 2600);
  }
  function onWake() { ending = false; dusk = 0; }

  // ---------- Start ----------
  resize();
  cb.dir = 1; cb.face = 1; cb.x = startX(1);
  sc.follow(camTarget(), 0, true);
  if (Farm.world.get().wheat === "golden") ready(); else grow(false);
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  else window.addEventListener("resize", resize);

  Toybox.init({
    app: "farm",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the combine stops and parks, and the controls lock. The timer carries on across the farm pages.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "Soft engine and grain sounds. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: onWake,
    onWake: onWake,
    onSound: function (on) { if (on) snd.chime(); }
  });
  requestAnimationFrame(loop);

  if (/[?&]debug\b/.test(location.search)) window.__farm = {
    state: function () { return { phase: phase, step: steps.current(), finished: steps.finished(), tank: cb.tank, x: cb.x, dir: cb.dir, trailer: tr.state, tx: tr.x, tv: tr.v, cam: sc.cam, load: tr.load, loads: loads, coach: coach.text(), crop: crop.stage }; },
    screen: function (id) { var b = cv.getBoundingClientRect(), p = id === "trailer" ? trPart() : cbPart(); return { x: b.left + p.x, y: b.top + p.y }; },
    ghost: function () { return ghost.show(); }
  };
})();
</script>
</body>
</html>
