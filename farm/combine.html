<style>
:root {
  --bg: #CDE9FF; --panel: #FFFFFF; --ink: #1D2340; --muted: #4A5578; --edge: #1D2340; --accent: #FFC93C; --plate: #F4FAFF; --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.tb-head a { text-decoration: none; }

#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.loads.pop { animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel { display: none; }

@media (prefers-reduced-motion: reduce) { .loads.pop { animation: none; } }

<body>
<div class="tb-app-shell tb-v2 wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="mapbtn" href="./" aria-label="Back to the farm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><svg class="tb-mapic" viewBox="0 0 40 40" aria-hidden="true"><path d="M3 33h34" stroke="#1D2340" stroke-width="3" stroke-linecap="round"/><path d="M8 33V18l8-8 8 8v15z" fill="#D2483D" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="12" y="22" width="8" height="11" fill="#A8352D" stroke="#1D2340" stroke-width="2"/><rect x="27" y="14" width="8" height="19" rx="2" fill="#D3DAE2" stroke="#1D2340" stroke-width="2.5"/></svg><span>Farm</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title" id="title">Combine Time</h1>

  </header>
  <div class="tb-body app">
    <div class="tb-stagecol">
      <main class="tb-stage stage" id="stage">
        <canvas id="cv" role="img" aria-label="A golden wheat field with a green combine harvester. Tap the combine to harvest."></canvas>
        <div class="tb-counter loads" id="loads">Loads: 0</div>
        <div id="coach"></div>
        <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
      </main>
      <div id="jobs"></div>
    </div>
    <section class="tb-panel" id="panel">
      <ol id="stepsW"></ol>
      <ol id="stepsS" hidden></ol>
      <div id="bottom"></div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.u, clamp = U.clamp, lerp = U.lerp, ease = U.ease, hash = U.hash;
  var D = Farm.draw, snd = Farm.sound, C = Farm.COMBINE;
  var TAU = Math.PI * 2, INK = U.INK, picCache = {};
  var NAME = Farm.NAMES.combine;
  document.title = NAME; $("title").textContent = NAME;

  // ---------- State ----------
  var KEY = "farm-combine-v1";
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  if (startFresh) saved = {};
  var loads = typeof saved.loads === "number" ? saved.loads : 0;
  // The job ("Sunny Seeds" is the Sunflowers job): "wheat" | "sun". Older saves have no job: wheat.
  var job = saved.job === "sun" ? "sun" : "wheat";
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ loads: loads, job: job })); } catch (e) { /* ignore */ } }
  // Sunflower seeds: black with white stripes (the shared CROP table gets a "seed" entry for the trailer and store).
  var SEED = ["#3D3936", "#ECE8DE"];
  Farm.CROP.seed = Farm.CROP.seed || SEED;
  var SUN_H = 1.8;

  var L = 24, STORE_X = L + 20, VMAX = 5.6;
  // zoom.f < 1 zooms out when what must be in view (the trailer tipping at the store) is wider than the screen
  var zoom = { f: 1, want: 1 };
  var sc = new Farm.Scene({ L: L, span: 11.6, spanPort: 12.6, mh: 4.7, xmin: -15, xmax: STORE_X + 13, rowDz: 0.5,
    fit: function (w, h) { var port = h > w * 1.05, short = !port && h < 460; return zoom.f * Math.min(port ? w * 0.95 / 12.6 : w * 0.84 / 11.6, h * (port ? 0.28 : (short ? 0.37 : 0.32)) / 4.7); } });
  var parts = new Farm.Particles();
  var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
  var W = 300, H = 300, DPR = 1, time = 0;

  var crop = { stage: "golden", g: 1, wipe: null };
  var cb = { x: -5.6, dir: 1, face: 1, v: 0, wheel: 0, reel: 0, tank: 0, auger: 0, beacon: false };
  var tr = { x: -40, v: 0, wheel: 0, load: 0, tip: 0, state: "away" };
  var phase = "ready", phaseT = 0, auto = false, grab = null, ending = false, arc = null, dusk = 0, storeLevel = 0, storeRun = 0;
  var straw = { x0: 0, x1: 0, on: false }, dogS = null, deer = null, hawk = null, faceT = 0, gulls = [];
  // The field's state lives in the shared farm: wheat "golden"|"stubble", sunflowers (w.sun) the same words.
  function worldCrop() { var w = Farm.world.get(); return job === "sun" ? (w.sun === "stubble" ? "stubble" : "golden") : w.wheat; }
  function setWorldCrop(v) { Farm.world.update(function (w) { if (job === "sun") w.sun = v; else w.wheat = v; }); }
  function storeFor() { var w = Farm.world.get(), n = job === "sun" ? (typeof w.seeds === "number" && isFinite(w.seeds) ? w.seeds : 0) : w.grain; return Math.min(1.1, Math.max(0, n) / 8); }
  storeLevel = storeFor();
  var birds = null;

  function cutX() { return cb.x + cb.dir * C.cut; }
  function pivotX() { return cb.x + cb.dir * C.pivot[0]; }
  function startX(dir) { return dir > 0 ? -0.8 - C.cut : L + 0.8 + C.cut; }
  function endX(dir) { return dir > 0 ? L + 1.2 - C.cut : -1.2 + C.cut; }
  function locked() { return ending || (window.Toybox && Toybox.timer.locked()); }

  // ---------- Layout ----------
  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(50, r.width); H = Math.max(50, r.height);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    sc.layout(W, H);
    sc.follow(camTarget(), 0, true);
  }

  // ---------- Coach, counter, name tags ----------
  var coach = Toybox.coach($("coach"));
  function setLoads() { var el = $("loads"); el.textContent = "Loads: " + loads; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  $("loads").textContent = "Loads: " + loads;
  function tag(text, x, h, r) {
    var b = cv.getBoundingClientRect();
    Toybox.nametag(text, b.left + sc.X(x, r || 1), b.top + sc.Y(r || 1) - h * sc.S(r || 1), 2200);
  }
  var tagged = {};
  function tagOnce(id, text, x, h, r) { if (tagged[id]) return; tagged[id] = 1; tag(text, x, h, r); }

  // ---------- The flow: weeks go by -> Harvest -> Unload -> Again ----------
  function setPhase(p) { phase = p; phaseT = 0; }
  function grow(turn) {
    setPhase("grow"); arc = 0; crop.stage = "grow"; crop.g = 0; crop.wipe = null; straw.on = false; dogS = null;
    cb.turnFrom = cb.dir; cb.turn = !!turn;
    steps.at("harvest"); steps.busy(true);
    coach.say("Weeks go by...", 4);
  }
  function ready() {
    setPhase("ready"); arc = null; crop.stage = "golden"; crop.g = 1; crop.wipe = null; steps.busy(false);
    setWorldCrop("golden"); Farm.world.update(function (w) { w.season = "summer"; });
    steps.at("harvest");
  }
  function harvest() {
    if (phase !== "ready" && phase !== "drive") return false;
    if (phase === "ready") {
      setPhase("drive"); crop.wipe = { bx: cutX(), dir: cb.dir, to: "stubble" }; straw.on = job !== "sun"; straw.x0 = cb.x - cb.dir * 6; straw.x1 = straw.x0; snd.horn();
      if (job === "sun") coach.say("The header takes the heads.", 4);
    }
    auto = true; steps.busy(true);
    if (ghost) ghost.learned("harvest");
    if (job === "sun") tagOnce("sunhead", "Sunflower header", cb.x + cb.dir * 4.3, 1.9);
    else tagOnce("reel", "Reel", cb.x + cb.dir * 3.9, 2.6);
    return true;
  }
  function passDone() {
    auto = false; cb.v = 0; setPhase("full"); cb.beacon = true; steps.busy(false);
    crop.stage = "stubble"; crop.wipe = null;
    setWorldCrop("stubble");
    steps.done("harvest");
    tag("Grain tank", cb.x + cb.dir * -2.2, 4.7);
    snd.horn();
  }
  function unload() {
    if (phase !== "full") return false;
    setPhase("unload"); steps.busy(true);
    tr.state = "in"; tr.x = sc.wx(-60, sc.TRACK) - 2; tr.load = 0; tr.tip = 0;
    if (ghost) ghost.learned("unload");
    return true;
  }
  function again() {
    if (phase !== "done") return false;
    if (ghost) ghost.learned("again");
    grow(true);
    return true;
  }

  // ---------- Steps, bar, ghost ----------
  var STEPS = [
    { id: "harvest", name: "Harvest", pic: Farm.pic("combine"), go: "Harvest!", coach: "Tap the combine!" },
    { id: "unload", name: "Unload", pic: Farm.pic("graintrailer"), go: "Unload!", coach: "Unload the grain!" }
  ];
  var STEPS_SUN = [
    { id: "harvest", name: "Harvest", pic: pic("combineSun"), go: "Harvest!", coach: "Tap the combine!" },
    { id: "unload", name: "Unload", pic: pic("seedtrailer"), go: "Unload!", coach: "Unload the seeds!" }
  ];
  var ghost = Toybox.ghost({
    max: 3,
    onShow: function (p, on) { if (steps) steps.pulse(on); },
    plan: function () {
      if (locked()) return null;
      var b = cv.getBoundingClientRect();
      function at(x, h, r) { return [b.left + sc.X(x, r || 1), b.top + sc.Y(r || 1) - h * sc.S(r || 1)]; }
      if (phase === "ready") {
        var p = at(cb.x - cb.dir * 1.5, 2.0);
        if (ghost.shown("harvest") >= 1) return { pts: [p, [p[0] + cb.dir * Math.min(W * 0.35, 160), p[1]]], key: "harvest" };
        return { pts: [p], tap: true, key: "harvest" };
      }
      if (phase === "full") return { pts: [at(cb.x - cb.dir * 1.5, 2.0)], tap: true, key: "unload" };
      if (phase === "done" && phaseT > 4) { var g = steps.go.el.getBoundingClientRect(); if (g.width) return { pts: [[g.left + g.width / 2, g.top + g.height / 2]], tap: true, key: "again" }; }
      return null;
    }
  });
  function makeSteps(el, list) {
    return Toybox.steps(el, {
      steps: list, coach: coach, ghost: ghost,
      onGo: function (id) { return doGo(id); },
      onAgain: function () { again(); },
      onBusy: function () { busyHint(); }
    });
  }
  var stepsW = makeSteps($("stepsW"), STEPS), stepsS = makeSteps($("stepsS"), STEPS_SUN);
  var steps = job === "sun" ? stepsS : stepsW;
  function showSteps() {
    steps = job === "sun" ? stepsS : stepsW;
    $("stepsW").hidden = job === "sun"; $("stepsS").hidden = job !== "sun";
    cv.setAttribute("aria-label", job === "sun" ? "A field of ripe sunflowers with a green combine harvester. Tap the combine to harvest." : "A golden wheat field with a green combine harvester. Tap the combine to harvest.");
  }
  var jobs = Toybox.jobs($("jobs"), {
    jobs: [{ id: "wheat", name: "Wheat", pic: Farm.pic("wheat") }, { id: "sun", name: "Sunflowers", pic: pic("sunflower") }],
    value: job,
    onPick: function (id) { switchJob(id); }
  });
  function doGo() {
    if (locked()) return false;
    if (tr.state === "drift") { bringBack(); return true; }
    if (phase === "ready" || (phase === "drive" && !auto)) return harvest();
    if (phase === "full") return unload();
    if (phase === "done") return again();
    busyHint(); return true;
  }
  function busyHint() {
    if (phase === "grow") coach.say(job === "sun" ? "The sunflowers are growing!" : "The wheat is growing!", 3);
    else if (phase === "drive") { snd.horn(); coach.say("Harvesting!", 3); }
    else if (tr.state === "drift") bringBack();
    else if (phase === "unload") coach.say(tr.state === "tip" || tr.state === "go" ? "Into the grain store!" : (job === "sun" ? "Pouring the seeds!" : "Pouring the grain!"), 3);
  }
  Toybox.bar($("bottom"), { onNew: startOver, onSurprise: surprise });

  function startOver() {
    if (locked()) return;
    resetScene();
    coach.say("A new field!", 3);
  }
  function resetScene() {
    parts.clear(); deer = hawk = birds = null; gulls = []; faceT = 0; dogS = null; tagged = {}; grab = null;
    tr.state = "away"; tr.x = -40; tr.load = 0; tr.tip = 0; cb.auger = 0; cb.tank = 0; cb.beacon = false; auto = false; cb.v = 0;
    cb.dir = 1; cb.face = 1; cb.x = startX(1); straw.on = false;
    storeLevel = storeFor(); storeRun = 0;
    if (steps.reset) steps.reset();
    if (worldCrop() === "golden") ready(); else grow(false);
    sc.follow(camTarget(), 0, true);
  }
  function switchJob(id) {
    if (locked()) { jobs.set(job); return; }
    job = id === "sun" ? "sun" : "wheat";
    showSteps(); resetScene(); save();
    coach.say(job === "sun" ? "Time for the sunflowers!" : "Time for the wheat!", 3);
  }

  // ---------- Surprise: a fun moment on the scene, taking turns ----------
  var surpriseN = 0;
  function surprise() {
    if (locked()) return;
    var list = job === "sun" ? ["finches", "faces", "deer"] : ["deer", "hawk", "faces"];
    if (phase === "unload" && tr.state === "pour") list.unshift("drift");
    var pick = list[surpriseN++ % list.length];
    if (pick === "finches") { finches(); return; }
    if (pick === "drift") { tr.state = "drift"; tr.dT = 0; coach.say("Tap the trailer!", 4); return; }
    if (pick === "deer") {
      var fromWheat = crop.stage !== "stubble" && crop.wipe;
      var x0 = fromWheat ? cutX() + cb.dir * 5 : sc.wx(W * 0.25, 1);
      deer = { x: x0, r: 2.6, t: 0, dir: hash(surpriseN, 3) > 0.5 ? 1 : -1 };
      coach.say("A deer!", 3);
      return;
    }
    if (pick === "hawk") { hawk = { t: 0, x0: W * 0.5, y0: sc.hY * 0.4 }; coach.say("A hawk!", 3); return; }
    faceT = 6; coach.say("Hello, combine!", 3);
  }
  function bringBack() { if (tr.state !== "drift") return; tr.state = "back"; snd.horn(); coach.say("Back you come!", 3); }

  // ---------- Input: tap or drag (Toybox.press) ----------
  function cbPart() { return { id: "combine", x: sc.X(cb.x - cb.dir * 1.2, 1), y: sc.gY - 2.0 * sc.k, r: 2.8 * sc.k }; }
  function trPart() { var s = TS(), x0 = sc.X(tr.x, sc.TRACK); return { id: "trailer", x: x0 - 4.2 * s, y: sc.Y(sc.TRACK) - 1.6 * s, r: 2.8 * s }; }
  var press = Toybox.press(cv, {
    any: true,
    parts: function () {
      var b = cv.getBoundingClientRect(), list = [], p = cbPart();
      list.push({ id: "combine", x: b.left + p.x, y: b.top + p.y, r: p.r });
      if (tr.state !== "away") { var q = trPart(); list.push({ id: "trailer", x: b.left + q.x, y: b.top + q.y, r: q.r }); }
      return list;
    },
    dragStart: function (part, e, s) {
      if (locked() || part !== "combine" || (phase !== "ready" && phase !== "drive")) return;
      if (phase === "ready") harvest();
      auto = false; grab = { off: sc.wx(s.x - cv.getBoundingClientRect().left, 1) - cb.x };
      if (ghost) ghost.learned("harvest");
    },
    move: function (part, e, s) {
      if (!grab) return;
      grab.to = sc.wx(s.x - cv.getBoundingClientRect().left, 1) - grab.off;
    },
    up: function (part, e, s) {
      if (grab && !s.tap) { grab = null; if (phase === "drive") steps.busy(false); }
      grab = null;
    },
    tap: function (part, x, y) {
      if (locked()) return;
      var b = cv.getBoundingClientRect(), px = x - b.left, py = y - b.top;
      if (part === "trailer") {
        if (tr.state === "drift") { bringBack(); return; }
        snd.horn(); tag("Trailer", tr.x - 4.2, 3.4, sc.TRACK); return;
      }
      if (part === "combine") {
        if (phase === "ready" || (phase === "drive" && !auto)) { harvest(); return; }
        if (phase === "full") { unload(); return; }
        snd.horn(); cb.flash = 1.2; tag("Combine harvester", cb.x - cb.dir * 1.2, 4.9); return;
      }
      // anywhere else: the store, or a little puff of chaff and the step's line
      var sx = sc.X(STORE_X, 1.02);
      if (Math.abs(px - sx) < 5 * sc.S(1.02) && py < sc.Y(1.02) && py > sc.Y(1.02) - 7 * sc.S(1.02)) { tag("Grain store", STORE_X, 7.4, 1.02); return; }
      var r = clamp(sc.B / Math.max(4, py - sc.hY), 0.6, 5);
      for (var i = 0; i < 6; i++) parts.add({ kind: "puff", x: sc.wx(px, Math.min(1, r)) + (Math.random() - 0.5), h: 0.3, r: Math.min(1, r), vx: (Math.random() - 0.5), vh: 0.6, life: 1, size: 0.12, grow: 0.5, col: "#F3DE9A", alpha: 0.7 });
      if (phase === "done") steps.sayStep && coach.say("Tap Again!", 3); else steps.sayStep();
      if (ghost) ghost.poke();
    }
  });

  // ---------- Simulation ----------
  // The camera keeps the whole machine (and the trailer beside it, or the trailer at the store) on screen with
  // a margin, as close as it can to the view it would like (a little ahead of the combine while it works).
  var camLim = null;
  function sxAt(x, r, cam) { return W / 2 + (x - cam) * sc.k / r; }
  function frame(pts, pref) {
    var m = Math.max(10, W * 0.03);
    function lo(c) { var v = 1e9; for (var i = 0; i < pts.length; i++) v = Math.min(v, sxAt(pts[i][0], pts[i][1], c) + pts[i][2]); return v; }
    function hi(c) { var v = -1e9; for (var i = 0; i < pts.length; i++) v = Math.max(v, sxAt(pts[i][0], pts[i][1], c) + pts[i][2]); return v; }
    function solve(f, target) { var a = pref - 80, b = pref + 80; for (var i = 0; i < 36; i++) { var c = (a + b) / 2; if (f(c) > target) a = c; else b = c; } return (a + b) / 2; }
    var cMax = solve(lo, m), cMin = solve(hi, W - m);
    // the zoom that makes these points fit with the margin (never closer than the usual view)
    var span = hi(pref) - lo(pref);
    zoom.want = span > 1 ? Math.min(1, zoom.f * (W - 2 * m) / span * 0.97) : 1;
    if (cMin <= cMax) { camLim = [cMin, cMax]; return clamp(pref, cMin, cMax); }
    var mid = solve(function (c) { return (lo(c) + hi(c)) / 2; }, W / 2);
    camLim = [mid, mid];
    return mid;
  }
  function combinePts() { return [[cb.x - cb.dir * 6.75, 1, 0], [cb.x + cb.dir * (job === "sun" ? 6.0 : 5.8), 1, 0]]; }
  function trailerPts() { var t = TS(), tip = tr.state === "tip" || tr.state === "untip"; return [[tr.x, sc.TRACK, (tip ? -9.3 : -8.1) * t], [tr.x, sc.TRACK, 6.5 * t]]; }

    timerIntro: "When time is up, the combine stops and parks, and the controls lock. The timer carries on across the farm pages.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "Soft engine and grain sounds. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: onWake,
    onWake: onWake,
    onSound: function (on) { if (on) snd.chime(); }
  });
  requestAnimationFrame(loop);

  if (/[?&]debug\b/.test(location.search)) window.__farm = {
    surprise: surprise,
    job: function (id) { if (id) switchJob(id); return job; },
    state: function () { return { zoom: zoom.f, job: job, birds: birds ? birds.list.map(function (b) { return b.st; }).join(",") : "", phase: phase, step: steps.current(), finished: steps.finished(), tank: cb.tank, x: cb.x, dir: cb.dir, trailer: tr.state, tx: tr.x, tv: tr.v, cam: sc.cam, load: tr.load, loads: loads, coach: coach.text(), crop: crop.stage }; },
    screen: function (id) { var b = cv.getBoundingClientRect(), p = id === "trailer" ? trPart() : cbPart(); return { x: b.left + p.x, y: b.top + p.y }; },
    ghost: function () { return ghost.show(); }
  };
})();
</script>
