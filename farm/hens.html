<script>
(function () {
  "use strict";
  // Feathered Friends: a morning with the hens, the way the episode shows it. A green tractor on rubber tracks
  // pulls the feed trailer through a muddy field (the wide tracks spread the weight, so it glides over the mud
  // and never sinks) to the hen house on wheels in its grassy paddock. Three jobs, one tap each:
  //   Drive: the tractor drives through the mud and the gate and parks beside the hen house.
  //   Feed:  the feed trailer's auger swings up and fills the feed bin on the end of the hen house; the grain
  //          runs down the pipe into the hanging feeders under the house and the hens run over and peck.
  //   Eggs:  the lid of the nest boxes opens, the egg belt runs and the eggs roll out of the end of the house,
  //          down the chute and into an egg carton; full cartons close and go onto the stack on the table.
  // Then night falls and it is the next morning. The stage is split like the other stations: the wide view
  // with the whole tractor, trailer and hen house on top, and a close-up below (or beside) that always shows the
  // work now: the tracks gliding over the mud, the grain pouring into the feeders with the hens pecking, the
  // eggs rolling into the carton.
  // Drawings live here for now, written like farm.js's (metres, y up negative, facing +x) so they can move into
  // farm.js later: tracked (the green tractor on rubber tracks, origin on the ground under the rear drive wheel),
  // feedTrailer (origin at its drawbar eye, ground at +0.55), henHouse (origin on the ground in its middle),
  // eggTable, henU (a hen or the cockerel, origin at its feet), chickU, cartonOpen / cartonShut.
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.u, clamp = U.clamp, lerp = U.lerp, ease = U.ease, hash = U.hash, mix = U.mix, INK = U.INK;
  var D = Farm.draw, SH = Farm.shape, snd = Farm.sound, TAU = Math.PI * 2;
  var P = SH.P, R = SH.R, C = SH.C, Ln = SH.Ln, tube = SH.tube, fs = SH.fs, rr = SH.rr;
  var NAME = (Farm.NAMES && Farm.NAMES.hens) || "Feathered Friends";
  document.title = NAME; $("title").textContent = NAME;
  function LWu() { return Farm.LW; }

  // ---------- State ----------
  var KEY = "farm-hens-v1";
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  if (startFresh || typeof saved !== "object") saved = {};
  function num(v) { return typeof v === "number" && isFinite(v) ? Math.max(0, Math.floor(v)) : 0; }
  var count = num(saved.eggs), cartons = num(saved.cartons);
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ eggs: count, cartons: cartons })); } catch (e) { /* ignore */ } }
  function world(fn) { try { Farm.world.update(fn); } catch (e) { /* ignore */ } }

  // ---------- The farm layout (world metres along the machine line) ----------
  // The tractor drives along its lane at depth TL (a little nearer than the hen house's line at depth 1), so
  // when it parks beside the hen house the feed trailer stands in front of the house's bin end and the
  // feeders under the house stay in view.
  var TL = 0.86, HX = 21, BINX = HX + 3.0, PANS = [-1.7, -0.45, 0.8], TABLE = HX - 3.9, FENCE = 16, MUD_END = 15.2;
  var TX0 = 4, TX_PARK = BINX + 4.4, VDRIVE = 3.4;
  var DBAR = [-1.25, -0.55];                 // the tractor's drawbar eye (tractor units)
  var RIG = { back: DBAR[0] - 4.2, front: 4.3, top: 3.55 };
  var AUG = { pivot: [-1.2, -0.66], fold: [-3.95, -2.25], tip: [3.0, -4.2] };   // trailer units / house units
  var PAD = { x0: FENCE + 1.2, x1: 31, r0: 0.93, r1: 1.42 };
  var GRAIN = "#E8BE5C", GRAIN_D = "#B98A2E", MUD = "#8A623E", MUD_D = "#6B4A2C", MUD_L = "#A47B52";
  var WALL = "#F3E4C2", ROOF = "#C9473C", WOOD = "#C9975A", GALV = "#C3CCD6", CART = "#F4D77C", CART_D = "#D8B556";
  var EGGC = ["#C98B55", "#F8F4EA"];
  var G = { body: "#3E9F3A", dark: "#2B7A2A", frame: "#2B3040", glass: "#BFE7FA", grey: "#7C8696" };

  var JOBS = {
    drive: { go: "Drive there", step: "Drive", ready: "Drive the tractor to the hens.", work: "The tracks glide over the mud.", busy: "The tractor is on its way." },
    feed: { go: "Feed them", step: "Feed", ready: "Fill the feeders with grain.", work: "The grain pours into the feeders.", busy: "The hens are getting their grain." },
    eggs: { go: "Get eggs", step: "Eggs", ready: "Collect the eggs.", work: "The eggs roll into the carton.", busy: "The eggs are rolling out." }
  };
  var ORDER = ["drive", "feed", "eggs"];
  var job = "drive", phase = "ready", phaseT = 0, auto = false, grab = null, ending = false, dusk = 0;
  var tr = { x: TX0, v: 0, run: 0, mud: 0, load: 1, flash: 0 };
  var prints = { a: TX0, b: TX0 + 3.0 };     // the track prints in the mud (world x of their ends)
  var fd = { t: 0 }, eg = { t: 0 }, feedOn = false, panLvl = 0, binLvl = 0.15, swing = 0, augRun = 0, flow = 0, lid = 0, beltRun = 0;
  var crowS = null, chicks = null, perch = null;

  function locked() { return ending || (window.Toybox && Toybox.timer.locked()); }
  function driving() { return phase === "drive" && Math.abs(tr.v) > 0.2; }

  // ---------- The stage: the wide view and the close-up ----------
  var phoneCoach = window.matchMedia ? matchMedia("(max-width: 600px), (orientation: landscape) and (max-height: 520px)") : null;
  function topRoom() { return phoneCoach && phoneCoach.matches ? 36 : 66; }
  // The scene's ground line at depth r (the same as Farm.Scene.layout, which does not depend on the zoom).
  function yAt(w, h, r) {
    var port = h > w * 1.05, short = !port && h < 460, gY = h * (short ? 0.75 : 0.7);
    var hY = h * lerp(0.31, 0.4, clamp((w / h - 0.8) / 0.9, 0, 1));
    return hY + (gY - hY) / r;
  }
  var camF = { k: 30, cam: TX0, hard: false }, camC = { k: 60, kT: 60, cam: TX0, off: 0, mode: "track" };
  var scF = new Farm.Scene({ L: 34, xmin: -12, xmax: 42, fit: function () { return camF.k; } });
  var scC = new Farm.Scene({ L: 34, xmin: -12, xmax: 42, fit: function () { return camC.k; } });
  var parts = new Farm.Particles();
  var cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
  var W = 300, H = 300, DPR = 1, time = 0;
  var RG = { f: { x: 0, y: 0, w: 300, h: 150 }, c: { x: 0, y: 150, w: 300, h: 150 }, side: false, pad: 8 };
  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(50, r.width); H = Math.max(50, r.height);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    RG.side = W / H > 1.45;
    if (RG.side) { var fw = Math.round(W * 0.58); RG.f = { x: 0, y: 0, w: fw, h: H }; RG.c = { x: fw, y: 0, w: W - fw, h: H }; }
    else { var fh = Math.round(H * (W > H ? 0.56 : 0.47)); RG.f = { x: 0, y: 0, w: W, h: fh }; RG.c = { x: 0, y: fh, w: W, h: H - fh }; }
    RG.pad = phoneCoach && phoneCoach.matches ? 48 : 8;
    camF.k = fitF(true).k;
    scF.layout(RG.f.w, RG.f.h);
    var cf = fitF(true); camF.cam = cf.cam; scF.cam = camF.cam;
    camC.k = camC.kT = closeK(camC.mode); scC.layout(RG.c.w, RG.c.h); camC.off = 0; scC.cam = camC.cam = closeTarget(camC.mode);
  }

  // ---------- Coach, counter, name tags ----------
  var coach = Toybox.coach($("coach"));
  function setCount() { var el = $("loads"); el.textContent = "Eggs: " + count; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  $("loads").textContent = "Eggs: " + count;
  function tagAt(text, x, y) { var b = cv.getBoundingClientRect(); Toybox.nametag(text, b.left + x, b.top + Math.max(24, y), 2400); }
  // a point on the rig in a view: (ux, uy) in tractor units
  function rigPt(S, ux, uy) { var s = S.S(TL); return { x: S.X(tr.x, TL) + ux * s, y: S.Y(TL) + uy * s, s: s }; }
  // a point on the hen house: (ux, uy) in house units
  function housePt(S, ux, uy) { return { x: S.X(HX, 1) + ux * S.k, y: S.Y(1) + uy * S.k, s: S.k }; }

  // =====================================================================================================
  // Drawings (machine units)
  // =====================================================================================================
  function shine(x1, y1, x2, y2, w) { Ln(ctx, x1, y1, x2, y2, "rgba(255,255,255,0.45)", w); }
  function tyre(x, y, r, rot, dark) {
    C(ctx, x, y, r, dark ? "#24262D" : "#33363F");
    ctx.save(); ctx.translate(x, y);
    for (var i = 0; i < 10; i++) { var a = rot + i * TAU / 10; Ln(ctx, Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8, Math.cos(a) * r * 0.98, Math.sin(a) * r * 0.98, "#1E2026", r * 0.12); }
    ctx.restore();
    C(ctx, x, y, r * 0.56, dark ? "#8C97A6" : "#E2E6EB", LWu() * 0.8);
    C(ctx, x, y, r * 0.22, "#8C97A6", LWu() * 0.6);
  }
  function driverU(x, y, s) {
    R(ctx, x - 0.26 * s, y + 0.1 * s, 0.52 * s, 0.5 * s, 0.16 * s, "#3D6FB6", LWu() * 0.7);
    C(ctx, x, y, 0.17 * s, "#F2C8A0", LWu() * 0.7);
    P(ctx, [x - 0.18 * s, y - 0.04 * s, x - 0.16 * s, y - 0.2 * s, x + 0.16 * s, y - 0.2 * s, x + 0.3 * s, y - 0.06 * s], "#E8473B", LWu() * 0.6);
  }

  // ---- The tractor on rubber tracks: the farm's green tractor (generic, no logos) with a track unit on each
  // side in place of the wheels. Origin on the ground under the rear drive wheel, facing +x. st = { run (m
  // driven: the track belt turns), time, beacon, mud (0..1 mud on the track) }.
  var TK = { rx: 0, ry: -0.82, rr: 0.82, fx: 3.0, fy: -0.5, fr: 0.5 };
  var TK_LEN = (function () { var top = Math.hypot(TK.fx - TK.rx, (TK.fy - TK.fr) - (TK.ry - TK.rr)); return [TK.fx - TK.rx, Math.PI * TK.rr, top, Math.PI * TK.fr]; })();
  var TK_PER = TK_LEN[0] + TK_LEN[1] + TK_LEN[2] + TK_LEN[3];
  // a point on the track belt at distance s along it (from the front of the bottom run, backwards along the
  // ground, up round the drive wheel, forward along the top, down round the idler): [x, y, nx, ny]
  function trackAt(s) {
    s = ((s % TK_PER) + TK_PER) % TK_PER;
    if (s < TK_LEN[0]) return [TK.fx - s, 0, 0, 1];
    s -= TK_LEN[0];
    if (s < TK_LEN[1]) { var a = Math.PI / 2 + s / TK.rr; return [TK.rx + Math.cos(a) * TK.rr, TK.ry + Math.sin(a) * TK.rr, Math.cos(a), Math.sin(a)]; }
    s -= TK_LEN[1];
    if (s < TK_LEN[2]) { var f = s / TK_LEN[2], x0 = TK.rx, y0 = TK.ry - TK.rr, x1 = TK.fx, y1 = TK.fy - TK.fr, dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy); return [lerp(x0, x1, f), lerp(y0, y1, f), dy / d, -dx / d]; }
    s -= TK_LEN[2];
    var b = -Math.PI / 2 + s / TK.fr; return [TK.fx + Math.cos(b) * TK.fr, TK.fy + Math.sin(b) * TK.fr, Math.cos(b), Math.sin(b)];
  }
  function trackUnit(st, far) {
    var run = st.run || 0, i;
    ctx.save();
    if (far) { ctx.translate(0.14, -0.06); }
    // the belt
    ctx.beginPath();
    ctx.moveTo(TK.rx, 0); ctx.lineTo(TK.fx, 0);
    ctx.arc(TK.fx, TK.fy, TK.fr, Math.PI / 2, -Math.PI / 2, true);
    ctx.lineTo(TK.rx, TK.ry - TK.rr);
    ctx.arc(TK.rx, TK.ry, TK.rr, -Math.PI / 2, Math.PI / 2, true);
    ctx.closePath(); fs(ctx, far ? "#202228" : "#2E3038");
    if (!far) {
      // the lugs (tread bars) round the outside, moving with the belt
      var n = Math.round(TK_PER / 0.27);
      for (i = 0; i < n; i++) {
        var p = trackAt(i * TK_PER / n + run);
        Ln(ctx, p[0] - p[3] * 0.0 + p[2] * 0.0, p[1], p[0] + p[2] * 0.07, p[1] + p[3] * 0.07, INK, 0.13);
        var muddy = st.mud > 0.05 && hash(i, 7) < st.mud * 0.8;
        Ln(ctx, p[0], p[1], p[0] + p[2] * 0.05, p[1] + p[3] * 0.05, muddy ? MUD_L : "#3E4049", 0.08);
      }
      // the inner face of the belt, the bogie frame, the wheels
      ctx.beginPath();
      ctx.moveTo(TK.rx, -0.13); ctx.lineTo(TK.fx, -0.13);
      ctx.arc(TK.fx, TK.fy, TK.fr - 0.13, Math.PI / 2, -Math.PI / 2, true);
      ctx.lineTo(TK.rx, TK.ry - TK.rr + 0.13);
      ctx.arc(TK.rx, TK.ry, TK.rr - 0.13, -Math.PI / 2, Math.PI / 2, true);
      ctx.closePath(); fs(ctx, "#474A53", LWu() * 0.6);
      R(ctx, TK.rx + 0.2, -0.62, TK.fx - TK.rx - 0.3, 0.24, 0.08, "#5D6675", LWu() * 0.8);
      [0.95, 1.6, 2.25].forEach(function (x) { C(ctx, x, -0.3, 0.17, "#8C97A6", LWu() * 0.8); C(ctx, x, -0.3, 0.06, "#5D6675", 0); });
      var rot = run / TK.rr;
      C(ctx, TK.rx, TK.ry, TK.rr - 0.15, "#8C97A6", LWu() * 0.9);
      for (i = 0; i < 8; i++) { var a = rot + i * TAU / 8; Ln(ctx, TK.rx + Math.cos(a) * 0.3, TK.ry + Math.sin(a) * 0.3, TK.rx + Math.cos(a) * 0.6, TK.ry + Math.sin(a) * 0.6, "#6E7887", 0.1); }
      C(ctx, TK.rx, TK.ry, 0.26, "#C3CCD6", LWu() * 0.8);
      C(ctx, TK.fx, TK.fy, TK.fr - 0.15, "#8C97A6", LWu() * 0.8);
      C(ctx, TK.fx, TK.fy, 0.13, "#C3CCD6", LWu() * 0.7);
      // mud on the lower belt
      if (st.mud > 0.05) for (i = 0; i < 9; i++) { if (hash(i, 3) > st.mud) continue; var q = trackAt(hash(i, 5) * TK_LEN[0] * 0.9 + 0.1); C(ctx, q[0], q[1] - 0.08, 0.06 + 0.05 * hash(i, 2), MUD, LWu() * 0.5); }
    }
    ctx.restore();
  }
  function tracked(st) {
    st = st || {};
    var t = st.time || 0, i;
    trackUnit(st, true);
    tube(ctx, -0.2, -0.55, DBAR[0], DBAR[1], 0.14, G.grey);
    // frame / engine block, front weights
    R(ctx, -0.45, -1.36, 4.15, 0.55, 0.1, "#3A3F4E");
    R(ctx, 3.72, -1.42, 0.5, 0.66, 0.08, "#8B95A5");
    for (i = 0; i < 3; i++) Ln(ctx, 3.8, -1.29 + i * 0.18, 4.14, -1.29 + i * 0.18, "#5D6675", LWu() * 0.8);
    // hood
    ctx.beginPath();
    ctx.moveTo(1.0, -2.14); ctx.lineTo(3.4, -2.06); ctx.quadraticCurveTo(3.8, -2.04, 3.82, -1.68); ctx.lineTo(3.84, -1.18); ctx.lineTo(1.0, -1.18); ctx.closePath();
    fs(ctx, G.body);
    shine(1.15, -2.04, 3.3, -1.98, 0.07);
    for (i = 0; i < 4; i++) Ln(ctx, 2.0 + i * 0.22, -1.92, 2.12 + i * 0.22, -1.62, G.dark, 0.06);
    R(ctx, 3.62, -1.92, 0.24, 0.72, 0.06, G.frame, LWu() * 0.8);
    for (i = 0; i < 4; i++) Ln(ctx, 3.66, -1.8 + i * 0.16, 3.82, -1.8 + i * 0.16, "#59607A", 0.04);
    R(ctx, 3.32, -2.03, 0.34, 0.14, 0.05, "#FFE98A", LWu() * 0.7);
    // cab
    P(ctx, [-0.62, -1.62, -0.56, -3.04, 1.12, -3.04, 1.24, -1.62], G.frame);
    P(ctx, [-0.5, -1.74, -0.46, -2.94, 1.02, -2.94, 1.11, -1.74], G.glass, LWu() * 0.6);
    driverU(0.3, -2.46, 1);

    HENS.forEach(function (h) { if (h.gone || h.st === "home" || h.st === "ramp") { h.gone = false; h.h = 0; h.st = "idle"; h.t = Math.random() * 2; h.x = HX + 1.4 + Math.random() * 3; h.r = lerp(PAD.r0, 1.05, Math.random()); } });
    if (feedOn) startFeeding();
  }
  // ---------- Start ----------
  resize();
  bringIn();
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  else window.addEventListener("resize", resize);
  Toybox.init({
    app: "farm",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the machines stop and park, and the controls lock. The timer carries on across the farm pages.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The hens are asleep in their house.",
    restArt: Farm.restArt,
    soundNote: "Soft engine, mud, grain and clucking sounds. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: onWake,
    onWake: onWake,
    onSound: function (on) { if (on) snd.chime(); }
  });
  requestAnimationFrame(loop);
  if (/[?&]debug\b/.test(location.search)) window.__farm = {
    state: function () { return { phase: phase, job: job, step: steps.current(), finished: steps.finished(), x: tr.x, count: count, cartons: cartons, coach: coach.text(), cmode: camC.mode, feedOn: feedOn, pans: panLvl, k: camF.k, cam: camF.cam, hard: camF.hard, perch: perch ? perch.stage : null, crow: !!crowS, chicks: !!chicks }; },
    // the rig's and the house's screen extents in the wide view (for the "always fully visible" check)
    extents: function () {
      var S = scF, a = rigPt(S, RIG.back, -RIG.top), b = rigPt(S, RIG.front, 0), h0 = housePt(S, TABLE - HX - 0.6, -4.2), h1 = housePt(S, 3.5, 0);
      return { w: RG.f.w, h: RG.f.h, rig: [a.x, a.y, b.x, b.y], house: [h0.x, h0.y, h1.x, h1.y], top: topRoom() };
    },
    screen: function (id) {
      var b = cv.getBoundingClientRect(), p;
      if (id === "nest") p = nestClose();
      else if (id === "carton") p = cartonClose();
      else if (id === "trailer") p = trailerPart();
      else p = rigPart();
      return { x: b.left + p.x, y: b.top + p.y };
    },
    surprise: surprise,
    ghost: function () { return ghost.show(); }
  };
})();
</script>
