<style>
:root {
  --bg: #CDE9FF; --panel: #FFFFFF; --ink: #1D2340; --muted: #4A5578; --edge: #1D2340; --accent: #FFC93C; --plate: #F4FAFF; --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.tb-head a { text-decoration: none; }
.stage { background: #A9DCFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
.loads { font-variant-numeric: tabular-nums; }
.loads.pop { animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
/* Big: the header, the job bar, the chips and the bottom bar hide; Go stays (a tap on the machine does every step too). */
body.big .tb-head > :not(.bigtoggle), body.big .tb-chip, body.big .tb-bottombar, body.big .tb-jobs { display: none; }
body.ending .tb-panel, body.ending .tb-jobs, body.ending .homebtn, body.ending .mapbtn { pointer-events: none; opacity: 0.4; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
.mapbtn .tb-mapic { width: 30px; height: 30px; background: #FFFFFF; border-radius: 8px; }
/* The Go says a short phrase ("Stack the bales"): on a narrow row it wraps to two lines instead of being cut off. */
.tb-steps .tb-go-word { white-space: normal; text-align: center; text-wrap: balance; }
@media (prefers-reduced-motion: reduce) { .loads.pop { animation: none; } }
</style>

<script>
(function () {
  "use strict";
  // Brilliant Baler (with Hey Haylage as the second job): grass into bales, the way the episodes show it.
  // Hay:     the disc mower cuts the grass into swaths, the sun dries it, the wheel rake rolls two swaths into
  //          one windrow, the big square baler picks it up (the plunger packs it, the knotters tie it) and drops
  //          big bales, the telehandler stacks them on a trailer and the tractor takes them to the hay barn.
  // Haylage: mow and rake the same, the round baler rolls the grass into round bales (it stops, net-wraps,
  //          opens its tailgate and drops each one), and the bale wrapper picks each bale up, spins it in film
  //          and tips it onto its end: a row of wrapped bales.
  // The stage is split like Spuds in Mud: the field with the whole rig (the farm's shared side view) and a
  // close-up that shows the work: the discs cutting, the rake wheels from above, a cut through the baler, the
  // trailer being stacked, the bale spinning on the wrapper from above.
  // Machine drawings live here for now, written like farm.js's (machine units = metres, y up negative, origin
  // at the drawbar eye with the ground at y = +0.5, facing +x) so they can move into farm.js later.
  var $ = function (id) { return document.getElementById(id); };
  var U = Farm.u, clamp = U.clamp, lerp = U.lerp, ease = U.ease, hash = U.hash, mix = U.mix, INK = U.INK;
  var D = Farm.draw, SH = Farm.shape, snd = Farm.sound, TAU = Math.PI * 2;
  var P = SH.P, R = SH.R, C = SH.C, Ln = SH.Ln, tube = SH.tube, fs = SH.fs, rr = SH.rr;
  var NAME = (Farm.NAMES && Farm.NAMES.bales) || "Brilliant Baler";
  document.title = NAME; $("title").textContent = NAME;
  function LWu() { return Farm.LW; }

  // ---------- State ----------
  var KEY = "farm-bales-v1";
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  if (startFresh) saved = {};
  var count = typeof saved.bales === "number" ? saved.bales : 0;
  var kind = saved.job === "haylage" ? "haylage" : "hay";
  var filmN = typeof saved.film === "number" ? saved.film : 0;
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ bales: count, job: kind, film: filmN })); } catch (e) { /* ignore */ } }
  var w0 = Farm.world.get();
  var barnBales = typeof w0.bales === "number" && isFinite(w0.bales) ? Math.max(0, w0.bales) : 0;

  var L = 26, STORE_X = L + 20, VPASS = 5.6, TR_FAR = 1.4, BARN_R = 1.3, NB = 3;
  var FILMS = [{ id: "black", c: "#2B2E36", hi: "rgba(255,255,255,0.35)", name: "black" }, { id: "white", c: "#F1F3F5", hi: "rgba(255,255,255,0.9)", name: "white" }];
  var MACH = {
    mower: { name: "Disc mower", len: 4.6, work: 1.95 },
    rake: { name: "Wheel rake", len: 5.7, work: 3.3 },
    sqbaler: { name: "Big baler", len: 9.2, work: 2.25 },
    rbaler: { name: "Round baler", len: 4.7, work: 1.9 },
    wrapper: { name: "Bale wrapper", len: 4.3, work: 1.9 }
  };
  // The steps. go = the Go pill (what will happen), ready = the coach while it waits for him, work = the coach
  // while the machine works, busy = when he taps while it works, span = metres the field view shows (whole rig).
  var JOBS = {
    mow: { m: "mower", to: "mown", go: "Mow it", step: "Mow", span: 12, pic: "mower",
      ready: "The disc mower cuts the grass.", work: "The cut grass falls in a row.", busy: "The mower is cutting the grass." },
    rake: { m: "rake", to: "raked", go: "Rake it", step: "Rake", span: 13.5, pic: "rake",
      ready: "The wheel rake makes one big row.", work: "The wheels roll it into a row.", busy: "The rake is raking." },
    bale: { m: "sqbaler", to: "baled", go: "Bale it", step: "Bale", span: 17, pic: "sqbaler",
      ready: "The baler makes big bales.", work: "The plunger packs the hay tight.", busy: "The baler is making bales." },
    rbale: { m: "rbaler", to: "baled", go: "Bale it", step: "Bale", span: 13, pic: "rbaler",
      ready: "The baler rolls up the grass.", work: "The grass rolls round and round.", busy: "The round baler is baling." },
    stack: { m: "tele", go: "Stack them", step: "Stack", span: 16.5, pic: "tele",
      ready: "The telehandler stacks them.", work: "The bales go onto the trailer.", busy: "The telehandler is stacking." },
    wrap: { m: "wrapper", go: "Wrap them", step: "Wrap", span: 13, pic: "wrapper",
      ready: "The wrapper wraps each bale.", work: "The bale spins in the wrap.", busy: "The wrapper is wrapping." }
  };
  var ORDER = { hay: ["mow", "rake", "bale", "stack"], haylage: ["mow", "rake", "rbale", "wrap"] };

  var field = { stage: "grass", wipe: null, dry: 0 };
  var rig = { m: null, x: -20, v: 0, wheel: 0, target: 0, flash: 0, hold: null, gate: 0 };
  var tele = { on: false, x: -30, v: 0, wheel: 0, clamp: 0, tip: null, from: null, back: 0 };
  var tr = { state: "away", x: -60, r: TR_FAR, v: 0, wheel: 0, lane: 0, target: 0 };
  var bales = [];             // { k: "square"|"round", x, st, t, slot, wrap, film, rot }
  var job = "mow", phase = "arrive", phaseT = 0, auto = false, grab = null, ending = false, dusk = 0;
  var seq = null, baleN = 0, clump = null, hare = null, dog = null, film = FILMS[filmN % 2];

  function locked() { return ending || (window.Toybox && Toybox.timer.locked()); }
  function M() { return MACH[rig.m]; }
  function workX() { return rig.x + Farm.DRAWBAR[0] - M().work; }
  function rearX() { return rig.x + Farm.DRAWBAR[0] - M().len; }
  function startX(id) { return -0.8 - Farm.DRAWBAR[0] + MACH[id].work; }
  function progress() { if (phase === "drive") return clamp(workX() / L, 0, 1); return phase === "leave" ? 1 : 0; }
  function isPass() { return job === "mow" || job === "rake" || job === "bale" || job === "rbale"; }

  // =====================================================================================================
  // Drawing helpers (machine units)
  // =====================================================================================================
  function wheel(ctx, cx, cy, r, rot, o) {
    o = o || {};
    var lw = LWu(), n = o.lugs || Math.round(r * 22), i, a;
    ctx.save(); ctx.translate(cx, cy);
    if (!o.smooth) for (i = 0; i < n; i++) {
      a = rot + i * TAU / n;
      var c = Math.cos(a), s = Math.sin(a), c2 = Math.cos(a + 0.12), s2 = Math.sin(a + 0.12);
      P(ctx, [c * r * 0.93, s * r * 0.93, c * r * 1.06, s * r * 1.06, c2 * r * 1.06, s2 * r * 1.06, c2 * r * 0.93, s2 * r * 0.93], "#2A2C36", lw * 0.7);
    }
    C(ctx, 0, 0, r * (o.smooth ? 1 : 0.97), "#33363F");
    var rimR = r * (o.rim || 0.58);
    C(ctx, 0, 0, rimR, o.rimCol || "#C3CCD6");
    C(ctx, 0, 0, rimR * 0.36, "#8C97A6", lw * 0.7);
    for (i = 0; i < 5; i++) { a = rot + i * TAU / 5; C(ctx, Math.cos(a) * rimR * 0.62, Math.sin(a) * rimR * 0.62, rimR * 0.09, "#6E7887", 0); }
    ctx.restore();
  }
  function shine(ctx, x1, y1, x2, y2, w) { Ln(ctx, x1, y1, x2, y2, "rgba(255,255,255,0.45)", w); }
  function pto(ctx, x2, y2) { tube(ctx, 0.15, -0.42, x2, y2, 0.1, "#F2C230"); }
  function drawbar(ctx, x2, y2, col) { tube(ctx, 0.05, 0.02, x2, y2, 0.14, col || "#7C8696"); C(ctx, 0, 0, 0.08, "#C3CCD6"); }
  var HAY = { hay: ["#E7C65C", "#C9A23E", "#F3DA86"], lage: ["#BFC75C", "#7E8A2E", "#D7DD86"] };
  function hayCols() { return kind === "hay" ? HAY.hay : HAY.lage; }
  function swathCol() { return kind === "hay" ? mix("#7DBA45", "#DCC25A", field.dry) : "#8DB948"; }

  // ---------- The disc mower (a trailed mower-conditioner, side view) ----------
  function mower(ctx, st) {
    var Rd = "#D63B33", RD = "#A42A24", t = st.time || 0, lw = LWu();
    pto(ctx, -1.45, -0.72);
    drawbar(ctx, -1.6, -0.55);
    R(ctx, -2.0, -1.05, 0.55, 0.5, 0.08, "#7C8696");                 // gearbox on its swivel
    wheel(ctx, -3.55, 0.17, 0.33, (st.wheel || 0) / 0.33, { rim: 0.6 });
    // the hood over the discs and the conditioner
    P(ctx, [-1.75, 0.36, -1.75, -0.5, -2.1, -0.86, -3.75, -0.86, -4.1, -0.5, -4.1, 0.28], Rd);
    shine(ctx, -2.15, -0.76, -3.7, -0.76, 0.06);
    Ln(ctx, -1.78, -0.12, -4.06, -0.12, RD, 0.05);
    if (st.cut) {
      // a window into the hood: the two conditioner rollers turning and the cut grass going through
      ctx.save(); rr(ctx, -3.55, -0.62, 1.45, 0.62, 0.1); ctx.fillStyle = "#2E2A22"; ctx.fill(); ctx.clip();
      var ph = st.run || 0;
      if (st.work) for (var g = 0; g < 9; g++) { var f = ((g / 9 + ph * 0.9) % 1), gx = lerp(-2.15, -3.6, f); Ln(ctx, gx, -0.28 + Math.sin(g * 2.3) * 0.05, gx - 0.22, -0.3 + Math.sin(g * 1.7) * 0.06, swathCol(), 0.05); }
      [[-2.55, -0.42], [-2.65, -0.18]].forEach(function (c, k) {
        C(ctx, c[0], c[1], 0.15, "#8C97A6", lw * 0.8);
        for (var q = 0; q < 4; q++) { var a = (k ? -1 : 1) * ph * 9 + q * Math.PI / 2; Ln(ctx, c[0], c[1], c[0] + Math.cos(a) * 0.14, c[1] + Math.sin(a) * 0.14, "#4E5666", 0.04); }
      });
      ctx.restore();
      R(ctx, -3.55, -0.62, 1.45, 0.62, 0.1, null, lw * 0.8);
    }
    // the rubber curtain at the front and the cutter bar with a spinning disc under it
    for (var i = 0; i < 4; i++) R(ctx, -1.82 - i * 0.12, 0.0, 0.1, 0.36, 0.02, "#2B3040", lw * 0.5);
    R(ctx, -2.35, 0.34, 0.75, 0.12, 0.04, "#5D6675", lw * 0.8);
    var spin = st.work ? t * 22 : 0;
    ctx.beginPath(); ctx.ellipse(-1.95, 0.42, 0.32, 0.07, 0, 0, TAU); fs(ctx, "#9AA5B4", lw * 0.7);
    for (i = 0; i < 2; i++) {
      var a2 = spin + i * Math.PI, kx = -1.95 + Math.cos(a2) * 0.34, ky = 0.42 + Math.sin(a2) * 0.075;
      P(ctx, [kx - 0.07, ky - 0.025, kx + 0.07, ky - 0.025, kx + 0.04, ky + 0.03, kx - 0.04, ky + 0.03], "#E2E6EB", lw * 0.5);
    }
    if (st.work) { ctx.save(); ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.ellipse(-1.95, 0.42, 0.38, 0.09, 0, 0, TAU); ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 0.03; ctx.stroke(); ctx.restore(); }
    // swath fins at the back
    P(ctx, [-4.08, -0.15, -4.55, 0.18, -4.5, 0.4, -4.08, 0.26], "#C3CCD6", lw * 0.8);
  }

  // ---------- The wheel rake (trailed V rake; the near row of tined wheels shows) ----------
  function rake(ctx, st) {
    var Y = "#F2B705", YD = "#C48F00", rot = (st.wheel || 0) / 0.7, lw = LWu();
    tube(ctx, 0.05, 0.02, -1.3, -0.95, 0.15, Y); C(ctx, 0, 0, 0.08, "#C3CCD6");
    tube(ctx, -1.3, -0.95, -5.5, -1.25, 0.16, Y);
    wheel(ctx, -5.35, 0.22, 0.28, (st.wheel || 0) / 0.28, { rim: 0.6 });
    tube(ctx, -5.35, 0.2, -5.35, -1.2, 0.09, YD);
    for (var w = 0; w < 4; w++) {
      var cx = -1.85 - w * 1.0, cy = -0.2, rx = 0.33, ry = 0.68;
      tube(ctx, cx + 0.1, -1.0 - w * 0.07, cx, cy, 0.07, YD);
      // the wheel is tilted, so from the side it is an oval; tines on its rim comb the grass
      ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU); ctx.strokeStyle = INK; ctx.lineWidth = 0.09 + lw; ctx.stroke(); ctx.strokeStyle = "#C3CCD6"; ctx.lineWidth = 0.08; ctx.stroke();
      for (var k = 0; k < 12; k++) {
        var a = rot + k * TAU / 12 + w * 0.4, ex = cx + Math.cos(a) * rx, ey = cy + Math.sin(a) * ry;
        Ln(ctx, cx, cy, ex, ey, "#8C97A6", 0.025);
        var tx = cx + Math.cos(a) * (rx + 0.13), ty = cy + Math.sin(a) * (ry + 0.2);
        Ln(ctx, ex, ey, tx, ty, INK, 0.035);
      }
      C(ctx, cx, cy, 0.09, "#6E7887", lw * 0.7);
    }
  }

  // ---------- The big square baler (side view) ----------
  function sqbaler(ctx, st) {
    var Rd = "#D9443A", RD = "#A92F27", CR = "#F4EFE6", t = st.time || 0, lw = LWu(), fly = st.fly || 0;
    pto(ctx, -1.9, -1.2);
    tube(ctx, 0.05, 0.02, -2.25, -1.0, 0.18, Rd); C(ctx, 0, 0, 0.08, "#C3CCD6");
    // pickup at the front, low: spring tines turning
    P(ctx, [-1.75, 0.42, -1.6, 0.05, -2.2, -0.55, -3.0, -0.55, -3.0, 0.42], "#5D6675");
    ctx.save(); ctx.beginPath(); ctx.rect(-2.0, 0.0, 0.6, 0.5); ctx.clip();
    for (var i = 0; i < 6; i++) { var a = -(st.run || 0) * 6 + i * TAU / 6; Ln(ctx, -1.75, 0.2, -1.75 + Math.cos(a) * 0.28, 0.2 + Math.sin(a) * 0.28, "#E2E6EB", 0.035); }
    ctx.restore();
    // wheels (tandem) and the chute at the back
    P(ctx, [-7.7, -0.95, -9.15, -0.25, -9.15, -0.08, -7.7, -0.72], "#7C8696", lw * 0.8);
    for (i = 0; i < 5; i++) C(ctx, -7.95 - i * 0.26, -0.78 + i * 0.13, 0.06, "#C3CCD6", lw * 0.4);
    wheel(ctx, -5.55, 0.05, 0.45, (st.wheel || 0) / 0.45, { rim: 0.55 });
    wheel(ctx, -6.55, 0.05, 0.45, (st.wheel || 0) / 0.45, { rim: 0.55 });
    // the bale chamber body
    R(ctx, -7.75, -2.35, 5.15, 1.62, 0.12, Rd);
    R(ctx, -7.75, -2.35, 5.15, 0.36, 0.1, CR, lw * 0.8);
    shine(ctx, -7.55, -2.25, -2.8, -2.25, 0.06);
    Ln(ctx, -5.25, -1.98, -5.25, -0.78, RD, 0.05); Ln(ctx, -6.6, -1.98, -6.6, -0.78, RD, 0.05);
    // twine boxes: a window with the balls of twine
    R(ctx, -5.05, -1.82, 1.9, 0.62, 0.08, "#2D2A26", lw * 0.8);
    for (i = 0; i < 4; i++) { C(ctx, -4.8 + i * 0.47, -1.51, 0.2, "#EAD9A8", lw * 0.6); C(ctx, -4.8 + i * 0.47, -1.51, 0.06, "#B79A57", 0); }
    // knotters on top (they turn when a bale is tied)
    R(ctx, -6.9, -2.75, 1.3, 0.42, 0.1, "#E2E6EB");
    for (i = 0; i < 3; i++) { var kx = -6.6 + i * 0.36; C(ctx, kx, -2.55, 0.12, "#9AA5B4", lw * 0.6); Ln(ctx, kx, -2.55, kx + Math.cos(st.knot || 0) * 0.11, -2.55 + Math.sin(st.knot || 0) * 0.11, INK, 0.03); }
    // the flywheel at the front
    C(ctx, -2.55, -1.55, 0.62, "#9AA5B4");
    for (i = 0; i < 5; i++) { var fa = fly + i * TAU / 5; Ln(ctx, -2.55, -1.55, -2.55 + Math.cos(fa) * 0.55, -1.55 + Math.sin(fa) * 0.55, "#5D6675", 0.06); }
    C(ctx, -2.55, -1.55, 0.14, "#6E7887");
  }

  // ---------- The round baler (side view); st.gate 0..1 lifts the tailgate ----------
  function rbaler(ctx, st) {
    var O = "#F07E22", OD = "#C9600F", lw = LWu(), g = clamp(st.gate || 0, 0, 1);

      }
    }
    if (Math.random() < 0.12) parts.add({ kind: "puff", x: rig.x + 1.33, h: 3.45, r: 1, vx: -0.6 - rig.v * 0.5, vh: 1.2, life: 1.2, size: 0.1, grow: 0.35, col: "#8A8FA0", alpha: 0.3 });
  }
  function drawTele() {
    var t = teleScreen(), k = sc.k;
    Farm.inUnits(ctx, t.x, t.y, k, sc.lw, function () { teleBody(ctx, { wheel: tele.wheel, beacon: !!rig.flash }); });
    // where the grab is: at rest, at a bale, carrying one over to the trailer, or coming back
    var cb = bales.filter(function (b) { return b.st === "carry"; })[0], g = null, rest = { x: t.x + TELE.rest[0] * k, y: t.y + TELE.rest[1] * k, s: k };
    if (seq && seq.s === "grab") rest.y = lerp(rest.y, t.y, ease(seq.t / GRAB_T));
    if (cb) {
      var f2 = ease(clamp(cb.t / LIFT_T, 0, 1)), a = { x: sc.X(cb.x, 1) - 1.25 * k, y: sc.gY, s: k }, bpt = slotGrab(cb);
      g = { x: lerp(a.x, bpt.x, f2), y: lerp(a.y, bpt.y, f2) - Math.sin(f2 * Math.PI) * 1.3 * k, s: lerp(k, bpt.s, f2) };
    } else if (seq && seq.s === "release" && seq.b) g = slotGrab(seq.b);
    else if (tele.from && seq && seq.s === "back") { var e = ease(clamp(seq.t / 0.3, 0, 1)); g = { x: lerp(tele.from.x, rest.x, e), y: lerp(tele.from.y, rest.y, e), s: lerp(tele.from.s, k, e) }; }
    else g = rest;
    // the boom: from its pivot at the back to the grab's pin (two sections and the lift ram)
    var pv = { x: t.x + TELE.pivot[0] * k, y: t.y + TELE.pivot[1] * k }, pin = { x: g.x, y: g.y - 0.65 * g.s };
    var dx = pin.x - pv.x, dy = pin.y - pv.y, mid = { x: pv.x + dx * 0.58, y: pv.y + dy * 0.58 };
    var rm = { x: t.x + TELE.ram[0] * k, y: t.y + TELE.ram[1] * k }, rb = { x: pv.x + dx * 0.33, y: pv.y + dy * 0.33 };
    function seg(a, b2, w, col) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.lineCap = "round"; ctx.strokeStyle = INK; ctx.lineWidth = w + sc.lw * 2; ctx.stroke(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke(); }
    seg(rm, rb, 0.16 * k, "#C3CCD6");
    seg(mid, pin, 0.3 * lerp(k, g.s, 0.6), "#E2A52E");
    seg(pv, mid, 0.44 * k, "#F2B33A");
    ctx.beginPath(); ctx.arc(pv.x, pv.y, 0.14 * k, 0, TAU); ctx.fillStyle = "#7C8696"; ctx.fill(); ctx.lineWidth = sc.lw; ctx.strokeStyle = INK; ctx.stroke();
    if (cb) { var gg = g; Farm.inUnits(ctx, gg.x + 1.25 * gg.s, gg.y, gg.s, sc.lw, function () { squareBale(ctx, {}); }); }
    Farm.inUnits(ctx, g.x, g.y, g.s, sc.lw, function () { grabber(ctx, tele.clamp); });
    if (Math.random() < 0.1) parts.add({ kind: "puff", x: tele.x - 1.6, h: 2.2, r: 1, vx: -0.6, vh: 1.2, life: 1.1, size: 0.1, grow: 0.35, col: "#8A8FA0", alpha: 0.3 });
  }
  function drawTrailer() {
    var t = trScreen();
    Farm.inUnits(ctx, t.x, t.y, t.s, sc.lw, function () {
      ctx.translate(0, -0.5);
      flatbed(ctx, { wheel: tr.wheel });
      bales.forEach(function (b) { if (b.st === "trailer") { ctx.save(); ctx.translate(SLOTS[b.slot].x, SLOTS[b.slot].y); squareBale(ctx, {}); ctx.restore(); } });
      ctx.translate(-Farm.DRAWBAR[0], 0.5);
      D.tractor(ctx, { wheel: tr.wheel, time: time, drawbar: true });
    });
  }
  function drawClumpField() {
    var p = clumpScreen(), k = sc.k, wob = Math.sin(time * 16) * 0.03 * k;
    ctx.beginPath();
    for (var i = 0; i < 12; i++) { var a = i * TAU / 12, rad = 0.38 * k * (0.8 + 0.3 * hash(i, 4)); ctx.lineTo(p.x + wob + Math.cos(a) * rad, p.y - 0.2 * k + Math.sin(a) * rad * 0.8); }
    ctx.closePath(); ctx.fillStyle = swathCol(); ctx.fill(); ctx.lineWidth = sc.lw; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x, p.y - 0.2 * k, Math.max(18, 0.7 * k) * (1 + 0.12 * Math.sin(time * 6)), 0, TAU); ctx.strokeStyle = "rgba(255,201,60,0.95)"; ctx.lineWidth = Math.max(3, sc.lw * 1.4); ctx.stroke();
  }
  function drawHare(far) {
    var t = hare.t, r = far ? 1.3 : 0.92, x0 = hare.x, s = sc.S(r) * 1.2;
    var f = t / 4.5, x = x0 - 1 + f * 7, hop = Math.abs(Math.sin(t * 7)) * 0.35;
    if (far !== (t < 1.6)) return;
    var rr2 = t < 1.6 ? lerp(1.3, 0.94, ease(t / 1.6)) : 0.94;
    D.hare(ctx, sc.X(x, Math.min(1, rr2)), sc.Y(rr2) - hop * sc.S(rr2), sc.S(rr2) * 2.2, t * 1.4, false);
    void s;
  }
  function drawDog() {
    var k = sc.k, x = sc.X(dog.x, 1), y = sc.gY;
    var b = dog.bale, onTop = dog.up && dog.up < 3.4 && b;
    if (onTop) {
      var jt = clamp(dog.up / 0.4, 0, 1), hgt = b.st === "stand" ? 1.2 : (b.k === "square" ? 0.9 : 1.45);
      y -= (Math.sin(jt * Math.PI) * 0.6 + jt * hgt) * k;
      x = sc.X(b.x, 1);
    } else if (dog.up && dog.up >= 3.4) {
      var jd = clamp((dog.up - 3.4) / 0.4, 0, 1), hb = b ? (b.st === "stand" ? 1.2 : (b.k === "square" ? 0.9 : 1.45)) : 0;
      y -= (1 - jd) * hb * k;
    }
    D.dog(ctx, x, y, k * 1.15, time * (onTop ? 0.4 : 2.2), false, onTop && dog.up > 0.4);
  }

  // =====================================================================================================
  // Loop and start
  // =====================================================================================================
  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
    if (!(window.Toybox && Toybox.timer.phase() === "resting")) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  function onEnding(done) { ending = true; auto = false; grab = null; rig.v = 0; setTimeout(function () { snd.engine(-1); snd.soil(0); done(); }, 2600); }
  function onWake() { ending = false; dusk = 0; }

  showRow();
  resize();
  bringIn("mow");
  setZoom(JOBS.mow.span, 3.6, true);
  rig.x = rig.target - 7;
  xfade.v = 1; pview = null;
  sc.follow(camTarget(), 0, true);
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  else window.addEventListener("resize", resize);

  Toybox.init({
    app: "farm",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the tractor stops and parks, and the controls lock. The timer carries on across the farm pages.",
    goodbyeOption: "End with a “Goodnight, farm” button to press",
    farewellText: "Time to say goodnight to the farm",
    goodbyeLabel: "Goodnight, farm",
    farewellDone: "Night night, farm!",
    restLine: "The farm is resting.",
    restLine2: "The machines will be right here next time.",
    restArt: Farm.restArt,
    soundNote: "Soft engine and grass sounds. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: onWake,
    onWake: onWake,
    onSound: function (on) { if (on) snd.chime(); }
  });
  requestAnimationFrame(loop);

  if (/[?&]debug\b/.test(location.search)) window.__farm = {
    state: function () { return { phase: phase, job: job, kind: kind, step: steps.current(), finished: steps.finished(), x: rig.x, m: rig.m, field: field.stage, bales: bales.map(function (b) { return b.st; }), count: count, coach: coach.text(), tr: tr.state, clump: !!clump }; },
    screen: function (id) {
      var b = cv.getBoundingClientRect(), p;
      if (id === "clump") p = clumpScreen(); else if (id === "close") p = closePart(); else p = rigPart();
      return { x: b.left + p.x, y: b.top + p.y };
    },
    surprise: surprise,
    ghost: function () { return ghost.show(); }
  };
})();
</script>
</body>
