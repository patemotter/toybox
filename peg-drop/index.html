<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Peg Drop</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Peg Drop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
button { -webkit-touch-callout: none; }
.stage { background: #121633; }
#board {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: pointer;
}
#board.aimcursor { cursor: crosshair; }
#board.grabcursor { cursor: grab; }
#board.grabbing { cursor: grabbing; }
#total.pop { transform: scale(1.15); }
#total { transition: transform 0.12s ease; font-variant-numeric: tabular-nums; }
.mins {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 1;
  pointer-events: none;
  background: #FFFFFF;
  color: #1D2340;
  border: 3px solid #1D2340;
  border-radius: 999px;
  padding: 0 12px;
  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1.55;
  box-shadow: 3px 3px 0 #1D2340;
}
.mins[hidden], .timebar[hidden] { display: none; }
.timebar {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 7px;
  z-index: 1;
  pointer-events: none;
  background: rgba(255, 255, 255, 0.15);
}
.timebar i { display: block; height: 100%; width: 100%; background: #2E9E5B; }

/* ---------- Controls: the picked tab's choices (every group on tablets), then the tab bar with Empty ---------- */
.pd-choices { display: flex; flex-direction: column; gap: 10px; }
.tb-tabs .tab { display: none; }
.btn.tb-new.emptybtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.emptybtn svg { width: 28px; height: 28px; flex: none; }
.actions {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.act {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 60px;
  font-size: 1.35rem;
  font-weight: 800;
  padding: 0.2rem 0.4rem;
  white-space: nowrap;
  color: #1D2340;
  border-color: #1D2340;
}
.act svg { width: 34px; height: 34px; flex: none; }
#drop10 { background: #FFC93C; }
#rain { background: #8FDBFF; }
#rain[aria-pressed="true"] {
  background: repeating-linear-gradient(135deg, #8FDBFF 0 14px, #C4ECFF 14px 28px);
  background-size: 40px 40px;
  animation: rainbg 0.8s linear infinite;
}
@keyframes rainbg { from { background-position: 0 0; } to { background-position: 40px 0; } }
#shootBtn { background: #C9BCFF; }
#shootBtn[aria-pressed="true"] {
  background: repeating-linear-gradient(135deg, #B7F08A 0 14px, #DDFBC4 14px 28px);
  background-size: 40px 40px;
  animation: rainbg 0.8s linear infinite;
}
.group { display: flex; align-items: center; gap: 10px; min-width: 0; }
.glabel {
  flex: none;
  width: 3.6em;
  font-weight: 800;
  font-size: 1.05rem;
  text-align: right;
  color: var(--muted);
}
.boards {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.boardbtn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 6px 2px 2px;
  font-size: 1.05rem;
  line-height: 1.15;
  min-width: 0;
}
.boardbtn svg { width: 50px; height: 50px; display: block; }
.ballrow { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; }
.swatches {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 8px;
}
.swatch {
  aspect-ratio: 1;
  width: 100%;
  max-width: 58px;
  justify-self: center;
  border-radius: 50%;
  border: 3px solid #1D2340;
  cursor: pointer;
  padding: 0;
  font: inherit;
  font-size: 1.3rem;
  font-weight: 800;
  color: #1D2340;
  display: grid;
  place-items: center;
  box-shadow: 2px 2px 0 #1D2340;
}
.swatch[data-color="rainbow"] {
  background: conic-gradient(#FF4D6D, #FF9F1C, #FFD23F, #5BE36B, #3EC8FF, #5B7CFF, #B26BFF, #FF6FD8, #FF4D6D);
}
.swatch[aria-pressed="true"] { outline: 5px solid var(--accent); outline-offset: 2px; }
.swatch:focus-visible { outline: 5px solid var(--focus); outline-offset: 2px; }
.swatch .tick {
  width: 58%;
  height: 58%;
  border-radius: 50%;
  background: #FFFFFF;
  border: 2px solid #1D2340;
  display: grid;
  place-items: center;
  font-size: 0.9em;
  line-height: 1;
}
.sizes { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sizebtn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 96px;
  font-size: 1.1rem;
  padding: 0.2rem 0.5rem;
}
.sizebtn i { display: block; border-radius: 50%; background: #FF4D6D; border: 2px solid #1D2340; flex: none; }

/* ---------- Timer: the shared toast and ending banner (common/toybox.js) sit on the board here ---------- */
.stage .toast { position: absolute; top: 54px; z-index: 2; font-size: 1.3rem; }
.stage .farewell { position: absolute; top: 30%; bottom: auto; z-index: 2; }
.stage .farewell p { font-size: 1.25rem; }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }

/* Rest picture: a snapshot of the board. */
img.rest-art {
  width: auto;
  max-width: min(72vw, 360px);
  max-height: 50vh;
  border: 3px solid #1D2340;
  border-radius: 18px;
  opacity: 0.92;
}

/* ---------- Landscape: board on the left, controls on the right ---------- */
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(40%, 420px); justify-content: space-between; }
  .pd-choices { gap: 14px; }
  .group { flex-direction: column; align-items: stretch; gap: 6px; }
  .glabel { width: auto; text-align: left; padding-left: 4px; }
  .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .actions #drop10 { grid-column: 1 / -1; }
  .act { padding: 4px 6px; }
  .boards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .boardbtn { flex-direction: row; justify-content: flex-start; gap: 8px; padding: 6px 8px; }
  .ballrow { flex-direction: column; align-items: stretch; gap: 12px; }
  .swatches { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .sizes .sizebtn { min-height: 56px; }
}

/* ---------- Phones (portrait) ---------- */
@media (max-width: 600px) and (orientation: portrait) {
  .pd-choices { gap: 8px; }
  .actions { gap: 6px; }
  .act { min-height: 56px; font-size: 0.95rem; gap: 0; flex-direction: column; line-height: 1.05; padding: 3px 2px 2px; }
  .act svg { width: 26px; height: 26px; }
  .glabel { display: none; }
  .boards { gap: 6px; }
  .boardbtn { font-size: 0.86rem; padding: 3px 1px 1px; border-radius: 12px; }
  .boardbtn svg { width: 34px; height: 34px; }
  .ballrow { flex-direction: column; align-items: stretch; gap: 8px; }
  .swatches { gap: 6px; }
  .swatch { font-size: 1rem; }
  .sizes .sizebtn { min-height: 42px; }
  .mins { font-size: 1rem; top: 7px; right: 7px; }
}

/* ---------- Big screens (tablets) ---------- */
@media (min-width: 744px) and (min-height: 640px) {
  .tb-panel { gap: 12px; }
  .mins { font-size: 1.35rem; top: 12px; right: 12px; }
  .act { min-height: 68px; font-size: 1.5rem; }
  .act svg { width: 40px; height: 40px; }
  .boardbtn { font-size: 1.15rem; }
  .boardbtn svg { width: 56px; height: 56px; }
  .sizebtn { min-height: 58px; font-size: 1.2rem; }
}

@media (min-width: 744px) and (min-height: 640px) and (orientation: landscape) {
  .pd-choices { gap: 18px; }
  .act { min-height: 74px; }
  .act svg { width: 44px; height: 44px; }
  .boardbtn { min-height: 76px; }
  .group { gap: 8px; }
}

/* ---------- Short landscape phones: a tighter panel ---------- */
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: min(44%, 330px); gap: 6px; }
  .glabel { display: none; }
  .actions { gap: 6px; }
  .act { min-height: 42px; font-size: 1rem; gap: 3px; flex-direction: row; padding: 0.2rem 0.3rem; }
  .act svg { width: 22px; height: 22px; }
  .boards { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .boardbtn { flex-direction: column; justify-content: center; gap: 0; font-size: 0.74rem; padding: 2px 1px 1px; border-radius: 12px; min-height: 48px; }
  .boardbtn svg { width: 28px; height: 28px; }
  .ballrow { gap: 6px; }
  .swatches { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; }
  .swatch { border-width: 2px; font-size: 0.9rem; }
  .sizes .sizebtn { min-height: 40px; font-size: 0.95rem; }
  .mins { font-size: 0.95rem; top: 6px; right: 6px; }
}

/* ---------- Phones: tabs (Play / Board / Balls) show one group of controls at a time ---------- */
@media (max-width: 600px) and (orientation: portrait), (orientation: landscape) and (max-height: 520px) {
  .tb-tabs .tab { display: block; }
  .tb-tabs .emptybtn svg { display: none; }
  .tb-panel[data-tab="play"] [data-pane]:not([data-pane="play"]),
  .tb-panel[data-tab="board"] [data-pane]:not([data-pane="board"]),
  .tb-panel[data-tab="balls"] [data-pane]:not([data-pane="balls"]) { display: none; }
  /* Every pane is the same height (two rows), so switching tabs never resizes the board. */
  [data-pane] { height: 102px; }
  .actions, .boards { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 48px 48px; gap: 6px; }
  .actions #drop10 { grid-column: 1 / -1; }
  .act { min-height: 0; height: 48px; flex-direction: row; gap: 6px; font-size: 1.1rem; padding: 2px 6px; }
  .act svg { width: 28px; height: 28px; }
  .boardbtn { min-height: 0; height: 48px; flex-direction: row; justify-content: center; gap: 6px; font-size: 1.05rem; padding: 2px 6px; border-radius: 14px; }
  .boardbtn svg { width: 34px; height: 34px; }
  .group[data-pane] { align-items: stretch; }
  .ballrow { flex-direction: row; align-items: center; gap: 8px; }
  .swatches { grid-template-columns: repeat(4, 46px); grid-template-rows: 46px 46px; gap: 8px; flex: none; }
  .swatch { width: 46px; max-width: none; border-width: 3px; font-size: 1.05rem; }
  .sizes { flex: 1 1 auto; grid-template-columns: 1fr; grid-template-rows: 46px 46px; gap: 8px; }
  .sizes .sizebtn { min-width: 0; min-height: 0; height: 46px; font-size: 1.05rem; }
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
  #rain[aria-pressed="true"], #shootBtn[aria-pressed="true"] { animation: none; }
  #total { transition: none; }
}
/* Ghost hand: a see-through hand that shows the main move once (same look as Bulldozer and Measuring). */
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Peg Drop</h1>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="board" role="img" aria-label="A board of pegs with a ball cannon at the top. Tap to drop balls, or pull the cannon to shoot."></canvas>
      <div class="timebar" id="timebar" hidden><i id="timefill"></i></div>
      <div class="mins" id="mins" hidden></div>
      <div class="tb-counter" id="total" aria-live="polite">Total: <span id="totalNum">0</span></div>
    </main>

    <section class="tb-panel" id="panel" data-tab="play">
      <div class="tb-choices pd-choices">
      <div class="actions" data-pane="play">
        <button class="btn act" id="drop10"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="11" cy="10" r="6" fill="#FF4D6D" stroke="#1D2340" stroke-width="3"/><circle cx="27" cy="16" r="6" fill="#3EC8FF" stroke="#1D2340" stroke-width="3"/><circle cx="15" cy="29" r="6" fill="#5BE36B" stroke="#1D2340" stroke-width="3"/><path d="M30 26v9m-4-4 4 4 4-4" fill="none" stroke="#1D2340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Drop 10</span></button>
        <button class="btn act" id="rain" aria-pressed="false"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 20a8 8 0 0 1 5-12 10 10 0 0 1 18 4 6 6 0 0 1-1 11H11a5 5 0 0 1-2-3z" fill="#FFFFFF" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><circle cx="12" cy="30" r="3.5" fill="#FFD23F" stroke="#1D2340" stroke-width="2.5"/><circle cx="21" cy="34" r="3.5" fill="#FF6FD8" stroke="#1D2340" stroke-width="2.5"/><circle cx="30" cy="30" r="3.5" fill="#5B7CFF" stroke="#1D2340" stroke-width="2.5"/></svg><span>Rain</span></button>
        <button class="btn act" id="shootBtn" aria-pressed="false"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 3h16" stroke="#1D2340" stroke-width="3.5" stroke-linecap="round"/><g transform="rotate(-38 16 10)"><rect x="11" y="10" width="10" height="20" rx="3" fill="#FF4D6D" stroke="#1D2340" stroke-width="3"/><rect x="9" y="26" width="14" height="7" rx="2.5" fill="#FFD23F" stroke="#1D2340" stroke-width="3"/></g><circle cx="16" cy="10" r="7.5" fill="#5B7CFF" stroke="#1D2340" stroke-width="3"/><circle cx="33" cy="33" r="4.5" fill="#5BE36B" stroke="#1D2340" stroke-width="2.5"/></svg><span>Shoot</span></button>
      </div>
      <div class="group" data-pane="board">
        <div class="glabel">Board</div>
        <div class="boards" id="boards"></div>
      </div>
      <div class="group" data-pane="balls">
        <div class="glabel">Balls</div>
        <div class="ballrow">
          <div class="swatches" id="swatches"></div>
          <div class="sizes">
            <button class="btn sizebtn" data-size="small"><i style="width:12px;height:12px"></i>Small</button>
            <button class="btn sizebtn" data-size="big"><i style="width:22px;height:22px"></i>Big</button>
          </div>
        </div>
      </div>
      </div>
      <nav class="tb-tabs" id="tabs">
        <button class="btn tab" data-tab="play" aria-pressed="true">Play</button>
        <button class="btn tab" data-tab="board" aria-pressed="false">Board</button>
        <button class="btn tab" data-tab="balls" aria-pressed="false">Balls</button>
        <button class="btn tb-new emptybtn" id="emptyBtn"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 6v20h28V6" fill="none" stroke="#1D2340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 26l9 7M32 26l-9 7" stroke="#1D2340" stroke-width="3.5" stroke-linecap="round"/><circle cx="20" cy="34" r="3.5" fill="#FFD23F" stroke="#1D2340" stroke-width="2.5"/><circle cx="14" cy="20" r="4" fill="#5BE36B" stroke="#1D2340" stroke-width="2.5"/><circle cx="25" cy="20" r="4" fill="#FF4D6D" stroke="#1D2340" stroke-width="2.5"/></svg><span>Empty</span></button>
      </nav>
    </section>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
