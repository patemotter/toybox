<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Peg Drop</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Peg Drop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
button { -webkit-touch-callout: none; }
/* Big mode: the panel goes away, the header stays (Big turns into Back). */
body.big .tb-panel { display: none; }
.stage { background: #121633; }
#board {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: pointer;
}
#board.aimcursor { cursor: crosshair; }
#board.grabcursor { cursor: grab; }
#board.grabbing { cursor: grabbing; }
#total.pop { transform: scale(1.15); }
#total { transition: transform 0.12s ease; font-variant-numeric: tabular-nums; }
.mins {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 1;
  pointer-events: none;
  background: #FFFFFF;
  color: #1D2340;
  border: 3px solid #1D2340;
  border-radius: 999px;
  padding: 0 12px;
  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1.55;
  box-shadow: 3px 3px 0 #1D2340;
}
.mins[hidden], .timebar[hidden] { display: none; }
.timebar {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 7px;
  z-index: 1;
  pointer-events: none;
  background: rgba(255, 255, 255, 0.15);
}
.timebar i { display: block; height: 100%; width: 100%; background: #2E9E5B; }

/* ---------- Controls: the picked tab's choices (every group on tablets), then the tab bar with Empty ---------- */
.pd-choices { display: flex; flex-direction: column; gap: 10px; }
.tb-tabs .tab { display: none; }
.btn.tb-new.emptybtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.emptybtn svg { width: 28px; height: 28px; flex: none; }
.actions {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.act {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 60px;
  font-size: 1.35rem;
  font-weight: 800;
  padding: 0.2rem 0.4rem;
  white-space: nowrap;
  color: #1D2340;
  border-color: #1D2340;
}
.act svg { width: 34px; height: 34px; flex: none; }
#drop10 { background: #FFC93C; }
#rain { background: #8FDBFF; }
#rain[aria-pressed="true"] {
  background: repeating-linear-gradient(135deg, #8FDBFF 0 14px, #C4ECFF 14px 28px);
  background-size: 40px 40px;
  animation: rainbg 0.8s linear infinite;
}
@keyframes rainbg { from { background-position: 0 0; } to { background-position: 40px 0; } }
#shootBtn { background: #C9BCFF; }
#shootBtn[aria-pressed="true"] {
  background: repeating-linear-gradient(135deg, #B7F08A 0 14px, #DDFBC4 14px 28px);
  background-size: 40px 40px;
  animation: rainbg 0.8s linear infinite;
}
.group { display: flex; align-items: center; gap: 10px; min-width: 0; }
.glabel {
  flex: none;
  width: 3.6em;
  font-weight: 800;
  font-size: 1.05rem;
  text-align: right;
  color: var(--muted);
}
.boards {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.boardbtn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 6px 2px 2px;
  font-size: 1.05rem;
  line-height: 1.15;
  min-width: 0;
}
.boardbtn svg { width: 50px; height: 50px; display: block; }
.ballrow { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; }
.swatches {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 8px;
}
.swatch {
  aspect-ratio: 1;
  width: 100%;
  max-width: 58px;
  justify-self: center;
  border-radius: 50%;
  border: 3px solid #1D2340;
  cursor: pointer;
  padding: 0;
  font: inherit;
  font-size: 1.3rem;
  font-weight: 800;
  color: #1D2340;
  display: grid;
  place-items: center;
  box-shadow: 2px 2px 0 #1D2340;
}
.swatch[data-color="rainbow"] {
  background: conic-gradient(#FF4D6D, #FF9F1C, #FFD23F, #5BE36B, #3EC8FF, #5B7CFF, #B26BFF, #FF6FD8, #FF4D6D);
}
.swatch[aria-pressed="true"] { outline: 5px solid var(--accent); outline-offset: 2px; }
.swatch:focus-visible { outline: 5px solid var(--focus); outline-offset: 2px; }
.swatch .tick {
  width: 58%;
  height: 58%;
  border-radius: 50%;
  background: #FFFFFF;
  border: 2px solid #1D2340;
  display: grid;
  place-items: center;
  font-size: 0.9em;
  line-height: 1;
}
.sizes { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sizebtn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 96px;
  font-size: 1.1rem;
  padding: 0.2rem 0.5rem;
}
.sizebtn i { display: block; border-radius: 50%; background: #FF4D6D; border: 2px solid #1D2340; flex: none; }

/* ---------- Timer: the shared toast and ending banner (common/toybox.js) sit on the board here ---------- */
.stage .toast { position: absolute; top: 54px; z-index: 2; font-size: 1.3rem; }
.stage .farewell { position: absolute; top: 30%; bottom: auto; z-index: 2; }
.stage .farewell p { font-size: 1.25rem; }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }

/* Rest picture: a snapshot of the board. */
img.rest-art {
  width: auto;
  max-width: min(72vw, 360px);
  max-height: 50vh;
  border: 3px solid #1D2340;
  border-radius: 18px;
  opacity: 0.92;
}

/* ---------- Landscape: board on the left, controls on the right ---------- */
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(40%, 420px); justify-content: space-between; }
  .pd-choices { gap: 14px; }
  .group { flex-direction: column; align-items: stretch; gap: 6px; }
  .glabel { width: auto; text-align: left; padding-left: 4px; }
  .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .actions #drop10 { grid-column: 1 / -1; }
  .act { padding: 4px 6px; }
  .boards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .boardbtn { flex-direction: row; justify-content: flex-start; gap: 8px; padding: 6px 8px; }
  .ballrow { flex-direction: column; align-items: stretch; gap: 12px; }
  .swatches { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .sizes .sizebtn { min-height: 56px; }
}

/* ---------- Phones (portrait) ---------- */
@media (max-width: 600px) and (orientation: portrait) {
  .pd-choices { gap: 8px; }
  .actions { gap: 6px; }
  .act { min-height: 56px; font-size: 0.95rem; gap: 0; flex-direction: column; line-height: 1.05; padding: 3px 2px 2px; }
  .act svg { width: 26px; height: 26px; }
  .glabel { display: none; }
  .boards { gap: 6px; }
  .boardbtn { font-size: 0.86rem; padding: 3px 1px 1px; border-radius: 12px; }
  .boardbtn svg { width: 34px; height: 34px; }
  .ballrow { flex-direction: column; align-items: stretch; gap: 8px; }
  .swatches { gap: 6px; }
  .swatch { font-size: 1rem; }
  .sizes .sizebtn { min-height: 42px; }
  .mins { font-size: 1rem; top: 7px; right: 7px; }
}

/* ---------- Big screens (tablets) ---------- */
@media (min-width: 744px) and (min-height: 640px) {
  .tb-panel { gap: 12px; }
  .mins { font-size: 1.35rem; top: 12px; right: 12px; }
  .act { min-height: 68px; font-size: 1.5rem; }
  .act svg { width: 40px; height: 40px; }
  .boardbtn { font-size: 1.15rem; }
  .boardbtn svg { width: 56px; height: 56px; }
  .sizebtn { min-height: 58px; font-size: 1.2rem; }
}

@media (min-width: 744px) and (min-height: 640px) and (orientation: landscape) {
  .pd-choices { gap: 18px; }
  .act { min-height: 74px; }
  .act svg { width: 44px; height: 44px; }
  .boardbtn { min-height: 76px; }
  .group { gap: 8px; }
}

/* ---------- Short landscape phones: a tighter panel ---------- */
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: min(44%, 330px); gap: 6px; }
  .glabel { display: none; }
  .actions { gap: 6px; }
  .act { min-height: 42px; font-size: 1rem; gap: 3px; flex-direction: row; padding: 0.2rem 0.3rem; }
  .act svg { width: 22px; height: 22px; }
  .boards { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .boardbtn { flex-direction: column; justify-content: center; gap: 0; font-size: 0.74rem; padding: 2px 1px 1px; border-radius: 12px; min-height: 48px; }
  .boardbtn svg { width: 28px; height: 28px; }
  .ballrow { gap: 6px; }
  .swatches { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; }
  .swatch { border-width: 2px; font-size: 0.9rem; }
  .sizes .sizebtn { min-height: 40px; font-size: 0.95rem; }
  .mins { font-size: 0.95rem; top: 6px; right: 6px; }
}

/* ---------- Phones: tabs (Play / Board / Balls) show one group of controls at a time ---------- */
@media (max-width: 600px) and (orientation: portrait), (orientation: landscape) and (max-height: 520px) {
  .tb-tabs .tab { display: block; }
  .tb-tabs .emptybtn svg { display: none; }
  .tb-panel[data-tab="play"] [data-pane]:not([data-pane="play"]),
  .tb-panel[data-tab="board"] [data-pane]:not([data-pane="board"]),
  .tb-panel[data-tab="balls"] [data-pane]:not([data-pane="balls"]) { display: none; }
  /* Every pane is the same height (two rows), so switching tabs never resizes the board. */
  [data-pane] { height: 102px; }
  .actions, .boards { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 48px 48px; gap: 6px; }
  .actions #drop10 { grid-column: 1 / -1; }
  .act { min-height: 0; height: 48px; flex-direction: row; gap: 6px; font-size: 1.1rem; padding: 2px 6px; }
  .act svg { width: 28px; height: 28px; }
  .boardbtn { min-height: 0; height: 48px; flex-direction: row; justify-content: center; gap: 6px; font-size: 1.05rem; padding: 2px 6px; border-radius: 14px; }
  .boardbtn svg { width: 34px; height: 34px; }
  .group[data-pane] { align-items: stretch; }
  .ballrow { flex-direction: row; align-items: center; gap: 8px; }
  .swatches { grid-template-columns: repeat(4, 46px); grid-template-rows: 46px 46px; gap: 8px; flex: none; }
  .swatch { width: 46px; max-width: none; border-width: 3px; font-size: 1.05rem; }
  .sizes { flex: 1 1 auto; grid-template-columns: 1fr; grid-template-rows: 46px 46px; gap: 8px; }
  .sizes .sizebtn { min-width: 0; min-height: 0; height: 46px; font-size: 1.05rem; }
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
  #rain[aria-pressed="true"], #shootBtn[aria-pressed="true"] { animation: none; }
  #total { transition: none; }
}
/* Ghost hand: a see-through hand that shows the main move once (same look as Bulldozer and Measuring). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Peg Drop</h1>
    <button class="btn tb-iconbtn" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="board" role="img" aria-label="A board of pegs with a ball cannon at the top. Tap to drop balls, or pull the cannon to shoot."></canvas>
      <div class="timebar" id="timebar" hidden><i id="timefill"></i></div>
      <div class="mins" id="mins" hidden></div>
      <div class="tb-counter" id="total" aria-live="polite">Total: <span id="totalNum">0</span></div>
    </main>

    <section class="tb-panel" id="panel" data-tab="play">
      <div class="tb-choices pd-choices">
      <div class="actions" data-pane="play">
        <button class="btn act" id="drop10"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="11" cy="10" r="6" fill="#FF4D6D" stroke="#1D2340" stroke-width="3"/><circle cx="27" cy="16" r="6" fill="#3EC8FF" stroke="#1D2340" stroke-width="3"/><circle cx="15" cy="29" r="6" fill="#5BE36B" stroke="#1D2340" stroke-width="3"/><path d="M30 26v9m-4-4 4 4 4-4" fill="none" stroke="#1D2340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Drop 10</span></button>
        <button class="btn act" id="rain" aria-pressed="false"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 20a8 8 0 0 1 5-12 10 10 0 0 1 18 4 6 6 0 0 1-1 11H11a5 5 0 0 1-2-3z" fill="#FFFFFF" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><circle cx="12" cy="30" r="3.5" fill="#FFD23F" stroke="#1D2340" stroke-width="2.5"/><circle cx="21" cy="34" r="3.5" fill="#FF6FD8" stroke="#1D2340" stroke-width="2.5"/><circle cx="30" cy="30" r="3.5" fill="#5B7CFF" stroke="#1D2340" stroke-width="2.5"/></svg><span>Rain</span></button>
        <button class="btn act" id="shootBtn" aria-pressed="false"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 3h16" stroke="#1D2340" stroke-width="3.5" stroke-linecap="round"/><g transform="rotate(-38 16 10)"><rect x="11" y="10" width="10" height="20" rx="3" fill="#FF4D6D" stroke="#1D2340" stroke-width="3"/><rect x="9" y="26" width="14" height="7" rx="2.5" fill="#FFD23F" stroke="#1D2340" stroke-width="3"/></g><circle cx="16" cy="10" r="7.5" fill="#5B7CFF" stroke="#1D2340" stroke-width="3"/><circle cx="33" cy="33" r="4.5" fill="#5BE36B" stroke="#1D2340" stroke-width="2.5"/></svg><span>Shoot</span></button>
      </div>
      <div class="group" data-pane="board">
        <div class="glabel">Board</div>
        <div class="boards" id="boards"></div>
      </div>
      <div class="group" data-pane="balls">
        <div class="glabel">Balls</div>
        <div class="ballrow">
          <div class="swatches" id="swatches"></div>
          <div class="sizes">
            <button class="btn sizebtn" data-size="small"><i style="width:12px;height:12px"></i>Small</button>
            <button class="btn sizebtn" data-size="big"><i style="width:22px;height:22px"></i>Big</button>
          </div>
        </div>
      </div>
      </div>
      <nav class="tb-tabs" id="tabs">
        <button class="btn tab" data-tab="play" aria-pressed="true">Play</button>
        <button class="btn tab" data-tab="board" aria-pressed="false">Board</button>
        <button class="btn tab" data-tab="balls" aria-pressed="false">Balls</button>
        <button class="btn tb-new emptybtn" id="emptyBtn"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 6v20h28V6" fill="none" stroke="#1D2340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 26l9 7M32 26l-9 7" stroke="#1D2340" stroke-width="3.5" stroke-linecap="round"/><circle cx="20" cy="34" r="3.5" fill="#FFD23F" stroke="#1D2340" stroke-width="2.5"/><circle cx="14" cy="20" r="4" fill="#5BE36B" stroke="#1D2340" stroke-width="2.5"/><circle cx="25" cy="20" r="4" fill="#FF4D6D" stroke="#1D2340" stroke-width="2.5"/></svg><span>Empty</span></button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var KEY = "pegdrop-v1";
  // Timer, sound and Big are shared Toybox-wide (common/toybox.js); these old keys carry over once.
  var OLD_TKEY = "pegdrop-timer-v1", OLD_SKEY = "pegdrop-sound-v1", OLD_BKEY = "pegdrop-big-v1";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var COLORS = [
    ["Red", "#FF4D6D"], ["Orange", "#FF9F1C"], ["Yellow", "#FFD23F"], ["Green", "#5BE36B"],
    ["Sky", "#3EC8FF"], ["Blue", "#5B7CFF"], ["Purple", "#B26BFF"], ["Pink", "#FF6FD8"]
  ];
  var NC = COLORS.length;
  var LAYOUTS = [["classic", "Classic"], ["bumpers", "Bumpers"], ["spinners", "Spinners"], ["zigzag", "Zigzag"]];
  var LAYOUT_IDS = LAYOUTS.map(function (l) { return l[0]; });
  var CAP = 150;               // most live (moving) balls at once
  var STEP = 1 / 240;          // fixed physics timestep
  var SIM_SPEED = 0.4;         // slow motion: physics runs at this fraction of real time (calm pacing)
  var POUR_MS = 220;           // gap between balls while a finger pours
  var RAIN_MS = 230;           // gap between balls while it rains
  var DROP10_MS = 200;         // gap between the balls of "Drop 10"
  var TRAIL = 7;               // trail length in frames

  // Bins are fixed per device (not per orientation), so turning the iPad keeps the counts.
  var scrMin = Math.min(window.screen && screen.width || window.innerWidth, window.screen && screen.height || window.innerHeight);
  var B = scrMin >= 600 ? 11 : 9;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  // ---------- Saved settings ----------
  function emptyCounts() {
    var a = [], i, k, row;
    for (i = 0; i < B; i++) { row = []; for (k = 0; k < NC; k++) row.push(0); a.push(row); }
    return a;
  }
  function freshState() {
    return { layout: "classic", color: "rainbow", size: "small", mode: "drop", bins: {} };
  }
  // Opening Peg Drop from the Toybox home screen (Toybox.fresh) starts the first-visit board with
  // empty bins; a reload keeps the board and the piles.
  if (window.Toybox && Toybox.fresh()) {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
  }
  function loadState() {
    var s = freshState();
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (o && typeof o === "object") {
        if (LAYOUT_IDS.indexOf(o.layout) !== -1) s.layout = o.layout;
        if (o.color === "rainbow" || (Number.isInteger(o.color) && o.color >= 0 && o.color < NC)) s.color = o.color;
        if (o.size === "small" || o.size === "big") s.size = o.size;
        if (o.mode === "drop" || o.mode === "shoot") s.mode = o.mode;
        if (o.bins && typeof o.bins === "object") {
          LAYOUT_IDS.forEach(function (id) {
            var b = o.bins[id];
            if (!Array.isArray(b) || b.length !== B) return;
            var ok = b.every(function (row) {

      bn.count = bn.packed.length + bn.loose;
      if (bn.count > bn.shown) { bn.pop = 1; bn.pc = bn.gc; countsDirty = true; }
      else if (bn.count < bn.shown) countsDirty = true;
      bn.shown = bn.count;
      bn.glow = Math.max(0, bn.glow - dt * 1.6);
      bn.pop = Math.max(0, bn.pop - dt * 3);
      if (bn.dirty) drawBinCache(bn);
      total += bn.count;
    }
    if (total !== totalShown) {
      var up = total > totalShown && totalShown >= 0;
      totalShown = total;
      $("totalNum").textContent = String(total);
      if (up && !reduce) {
        var t = $("total");
        t.classList.add("pop");
        clearTimeout(popT);
        popT = setTimeout(function () { t.classList.remove("pop"); }, 120);
      }
    }
    // Pegs fade back to white.
    for (i = activePegs.length - 1; i >= 0; i--) {
      var p = activePegs[i];
      p.lit = Math.max(0, p.lit - dt * 3);
      p.tint = Math.max(0, p.tint - dt * 0.28);
      if (p.tint <= 0 && p.lit <= 0) { p.active = false; activePegs[i] = activePegs[activePegs.length - 1]; activePegs.pop(); }
    }
    for (i = 0; i < bumpers.length; i++) bumpers[i].flash = Math.max(0, bumpers[i].flash - dt * 3);
    for (i = 0; i < bodies.length; i++) {
      if (bodies[i].kind === "bucket") updateBucket(bodies[i], sdt);
      if (bodies[i].flash) bodies[i].flash = Math.max(0, bodies[i].flash - dt * 3);
    }
    // Particles.
    for (i = parts.length - 1; i >= 0; i--) {
      p = parts[i];
      p.life -= dt;
      if (p.life <= 0 || p.y > H + 40) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      if (p.k === 2) { p.vy += G * dt; }
      else if (p.k === 0) { p.vy += G * 0.25 * dt; p.vx *= 0.98; p.vy *= 0.98; }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    // Trapdoors.
    if (emptyT > 0) emptyT -= dt;
    for (i = 0; i < bins.length; i++) {
      bn = bins[i];
      var want = emptyT > 0.5 ? 1 : 0;
      bn.door += (want - bn.door) * Math.min(1, dt * (want ? 9 : 5));
      if (want === 0 && bn.door < 0.02) bn.door = 0;
    }
    if (countsDirty && performance.now() - lastCountsSave > 2500) saveCounts();
  }
  var popT = null;

  function pop(i) {
    var b = balls[i];
    burst(b.x, b.y, b.c, 8, 200, 0.5);
    ring(b.x, b.y, b.c, b.r, 0.35);
    balls[i] = balls[balls.length - 1];
    balls.pop();
  }

  function countsArray() {
    return bins.map(function (bn) {
      var row = [], k;
      for (k = 0; k < NC; k++) row.push(0);
      bn.packed.forEach(function (c) { row[c]++; });
      return row;
    });
  }
  function saveCounts() {
    if (!bins.length) return;
    var arr = countsArray();
    // Loose balls sitting in bins count too.
    balls.forEach(function (b) { if (b.bin >= 0) arr[b.bin][b.c]++; });
    state.bins[state.layout] = arr;
    save();
    countsDirty = false;
    lastCountsSave = performance.now();
  }
  // Rebuild packed lists from saved per-color counts, mixing the colors.
  function packedFromCounts(row) {
    var left = row.slice(), out = [], any = true, k;
    while (any) {
      any = false;
      for (k = 0; k < NC; k++) if (left[k] > 0) { out.push(k); left[k]--; any = true; }
    }
    return out;
  }
  function loadBinsFor(id) {
    var saved = state.bins[id];
    bins = [];
    for (var i = 0; i < B; i++) bins.push({ packed: saved ? packedFromCounts(saved[i]) : [] });
  }

  // ---------- Drawing ----------
  function render(now) {
    var i, k, b, p, bn, s;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.drawImage(base, 0, 0, CW, CH);
    ctx.save();
    ctx.translate(OX, 0);
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();

    // Bin glow.
    ctx.globalCompositeOperation = "lighter";
    for (i = 0; i < bins.length; i++) {
      bn = bins[i];
      if (bn.glow > 0.01) {
        ctx.globalAlpha = bn.glow * 0.45;
        ctx.fillStyle = COLORS[bn.gc][1];
        ctx.fillRect(bn.x0 + divR, binTop, bw - 2 * divR, binH);
        ctx.globalAlpha = bn.glow * 0.8;
        ctx.drawImage(glow[bn.gc], bn.x0 - bw * 0.2, binTop - bw * 0.5, bw * 1.4, bw);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    // Packed balls.
    for (i = 0; i < bins.length; i++) {
      bn = bins[i];
      if (!bn.packed.length || !bn.cache) continue;
      var drop = bn.door > 0.05 ? bn.door * binH : 0;
      var lift = (bn.L ? bn.L.h : 0) - bn.ph;
      ctx.drawImage(bn.cache, bn.x0, binTop + drop + lift, bw, binH);
    }

    // Lit pegs.
    ctx.globalCompositeOperation = "lighter";
    for (i = 0; i < activePegs.length; i++) {
      p = activePegs[i];
      var gs = p.r * (3.2 + 4 * p.lit);
      ctx.globalAlpha = Math.min(1, 0.3 * p.tint + 0.7 * p.lit);
      ctx.drawImage(glow[p.c], p.x - gs, p.y - gs, gs * 2, gs * 2);
    }
    ctx.globalCompositeOperation = "source-over";
    for (i = 0; i < activePegs.length; i++) {
      p = activePegs[i];
      var pr = p.r * (1 + 0.5 * p.lit);
      ctx.globalAlpha = Math.min(1, p.tint * 1.3);
      ctx.beginPath();
      ctx.arc(p.x, p.y, pr, 0, Math.PI * 2);
      ctx.fillStyle = COLORS[p.c][1];
      ctx.fill();
      if (p.lit > 0.3) {
        ctx.globalAlpha = p.lit;
        ctx.beginPath();
        ctx.arc(p.x, p.y, pr * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = "#FFFFFF";
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // Bumpers.
    for (i = 0; i < bumpers.length; i++) {
      p = bumpers[i];
      var br = p.r * (1 + 0.16 * p.flash);
      if (p.flash > 0.02) {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = p.flash;
        ctx.drawImage(glow[p.c], p.x - br * 2.2, p.y - br * 2.2, br * 4.4, br * 4.4);
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
      }
      ctx.beginPath(); ctx.arc(p.x, p.y, br + 2.5 * su, 0, Math.PI * 2); ctx.fillStyle = "#0B0F2A"; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y, br, 0, Math.PI * 2); ctx.fillStyle = p.flash > 0.3 ? COLORS[p.c][1] : "#FF5FAE"; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y, br * 0.66, 0, Math.PI * 2); ctx.fillStyle = "#FFE066"; ctx.fill();
      ctx.lineWidth = 2.5 * su; ctx.strokeStyle = "#0B0F2A"; ctx.stroke();
      drawStar(p.x, p.y, br * 0.42, p.flash);
    }

    // Moving pieces.
    for (i = 0; i < bodies.length; i++) {
      var bd = bodies[i];
      if (bd.kind === "mill") drawMill(bd);
      else drawBucket(bd);
    }

    // Trails (glowing) then balls.
    ctx.globalCompositeOperation = "lighter";
    var trailN = reduce ? 3 : TRAIL;
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      if (b.sleep) continue;
      var vx = b.x - b.tx[TRAIL - 1], vy = b.y - b.ty[TRAIL - 1];
      if (vx * vx + vy * vy < 9 * su * su) continue;
      for (k = trailN - 1; k >= 1; k--) {
        var f = 1 - k / trailN;
        var tr = b.r * (0.9 + 1.1 * f);
        ctx.globalAlpha = 0.12 + 0.4 * f;
        ctx.drawImage(glow[b.c], b.tx[k] - tr, b.ty[k] - tr, tr * 2, tr * 2);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    var lw = Math.max(1.5, 2.2 * su);
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = COLORS[b.c][1];
      ctx.fill();
      ctx.lineWidth = lw;
      ctx.strokeStyle = "#0B0F2A";
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.32, b.y - b.r * 0.34, b.r * 0.32, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.fill();
    }

    // Particles.
    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      var a = p.life / p.ttl;
      if (p.k === 0) {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = Math.min(1, a * 1.4);
        var ps = p.s * (0.6 + a);
        ctx.drawImage(glow[p.c], p.x - ps, p.y - ps, ps * 2, ps * 2);
        ctx.globalAlpha = a;
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(p.x - ps * 0.18, p.y - ps * 0.18, ps * 0.36, ps * 0.36);
      } else if (p.k === 1) {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = a;
        ctx.lineWidth = 4 * su * a + 1;
        ctx.strokeStyle = COLORS[p.c][1];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.s + (1 - a) * 46 * su, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
        ctx.fillStyle = COLORS[p.c][1];
        ctx.fill();
        ctx.lineWidth = Math.max(1, p.s * 0.14);
        ctx.strokeStyle = "#0B0F2A";
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    // Trapdoors.
    for (i = 0; i < bins.length; i++) {
      bn = bins[i];
      var x0 = bn.x0 + divR, len = bw - 2 * divR;
      ctx.save();
      ctx.translate(x0, floorY);
      ctx.rotate(bn.door * 1.45);
      ctx.fillStyle = "#0B0F2A";
      ctx.fillRect(-1, -3.5 * su, len + 2, 7 * su);
      ctx.fillStyle = "hsl(" + binHue(i) + ",85%,62%)";
      ctx.fillRect(0, -2 * su, len, 4 * su);
      ctx.restore();
    }

    // Big counts under the bins.
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (i = 0; i < bins.length; i++) {
      bn = bins[i];
      var sc = 1 + 0.45 * bn.pop;
      var fsz = Math.round(numFont * sc);
      var txt = String(bn.count);
      var fit = Math.min(fsz, Math.floor((bw - 4) / (txt.length * 0.55)));
      ctx.font = "800 " + fit + "px 'Baloo 2', 'Trebuchet MS', sans-serif";
      ctx.fillStyle = bn.pop > 0.05 ? COLORS[bn.pc][1] : (bn.count ? "#FFFFFF" : "rgba(255,255,255,0.35)");
      ctx.fillText(txt, bn.x0 + bw / 2, floorY + labelH / 2 + 2);
    }

    // Drop markers for fingers, and the "Tap to drop" hint on an empty board.
    var fk;
    for (fk in fingers) {
      if (!Object.prototype.hasOwnProperty.call(fingers, fk)) continue;
      var fg = fingers[fk];
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.9;
      var gsz = 26 * su;
      ctx.drawImage(glow[fg.c], fg.x - gsz, 4 * su - gsz * 0.5, gsz * 2, gsz * 2);
      ctx.globalAlpha = 0.25;
      ctx.drawImage(glow[fg.c], fg.x - gsz * 1.2, fg.y - gsz * 1.2, gsz * 2.4, gsz * 2.4);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }
    drawLauncher(now);
    drawAim(now);
    if (!ending && !aim && (hintT > 0 || (!balls.length && totalShown === 0))) drawHint(now);
    ctx.restore();
  }

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // A chunky cannon hanging from the top: a bracket, a turning barrel, a round turret.
  function drawLauncher(now) {
    var L = launcher, ink = "#0B0F2A", ow = Math.max(2.5, 3 * su);
    var p = L.pull, live = state.mode === "shoot" || !!aim;
    var jig = (p > 0.75 && !reduce) ? (Math.random() - 0.5) * (p - 0.75) * 10 * su : 0;
    var back = LL * (0.12 * p + 0.28 * L.recoil);
    var c = Math.cos(L.a), s = Math.sin(L.a);
    var ballC = nextColorPeek(), br = state.size === "big" ? bigR : smallR;
    ctx.save();
    ctx.translate(LX + jig, LY);
    ctx.lineJoin = "round";
    // Glow behind the cannon while it is ready to shoot.
    if (live || L.flash > 0.01) {
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = Math.min(1, 0.35 + 0.25 * Math.sin(now / 260) * (reduce ? 0 : 1) + 0.5 * p + L.flash);
      var gsz = LS * (1.2 + 0.5 * p);
      ctx.drawImage(glow[ballC], -gsz, -gsz, gsz * 2, gsz * 2);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }
    // Ceiling bracket.
    ctx.fillStyle = "#3EC8FF";
    ctx.strokeStyle = ink;
    ctx.lineWidth = ow;
    ctx.beginPath();
    ctx.moveTo(-LR * 1.25, -LY - 4);
    ctx.lineTo(LR * 1.25, -LY - 4);
    ctx.lineTo(LR * 0.7, 0);
    ctx.lineTo(-LR * 0.7, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Barrel (pulled back while aiming, kicked back on a shot).
    ctx.save();
    ctx.rotate(L.a);
    var x0 = -LR * 0.3 - back, x1 = LL - back, hw = LBW / 2;
    // The loaded ball peeks out of the muzzle.
    ctx.beginPath();
    ctx.arc(x1 - br * 0.35, 0, Math.min(br, hw * 0.95), 0, Math.PI * 2);
    ctx.fillStyle = COLORS[ballC][1];
    ctx.fill();
    ctx.lineWidth = ow * 0.8;
    ctx.strokeStyle = ink;
    ctx.stroke();
    rrect(x0, -hw, x1 - x0 - LBW * 0.3, LBW, hw * 0.55);
    ctx.fillStyle = "#FF4D6D";
    ctx.fill();
    ctx.lineWidth = ow;
    ctx.stroke();
    // Stripes and a shine.
    ctx.fillStyle = "#FFFFFF";
    ctx.globalAlpha = 0.55;
    rrect(x0 + LBW * 0.3, -hw * 0.62, (x1 - x0) * 0.55, hw * 0.34, hw * 0.17);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#FFD23F";
    rrect(x0 + (x1 - x0) * 0.42, -hw, LBW * 0.28, LBW, 2 * su);
    ctx.fill();
    ctx.stroke();
    // Muzzle ring.
    rrect(x1 - LBW * 0.48, -hw * 1.28, LBW * 0.5, LBW * 1.28, hw * 0.4);
    ctx.fillStyle = "#FFD23F";
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    // Turret.
    ctx.beginPath();
    ctx.arc(0, 0, LR, 0, Math.PI * 2);
    ctx.fillStyle = "#5B7CFF";
    ctx.fill();
    ctx.lineWidth = ow;
    ctx.strokeStyle = ink;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-LR * 0.3, -LR * 0.32, LR * 0.32, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.fill();
    // Power ring around the turret while pulling.
    if (p > 0.02) {
      ctx.lineCap = "round";
      ctx.lineWidth = Math.max(4, 5.5 * su);
      ctx.strokeStyle = ink;
      ctx.beginPath(); ctx.arc(0, 0, LR + 7 * Math.max(su, 0.7), -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ctx.stroke();
      ctx.lineWidth = Math.max(2.5, 3.5 * su);
      ctx.strokeStyle = p > 0.7 ? "#FF6FD8" : (p > 0.35 ? "#FFD23F" : "#5BE36B");
      ctx.beginPath(); ctx.arc(0, 0, LR + 7 * Math.max(su, 0.7), -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ctx.stroke();
    }
    drawStar(0, 0, LR * 0.5, p > 0.5 ? 1 : 0);
    ctx.restore();
    // Muzzle flash.
    if (L.flash > 0.01) {
      var mx = LX + c * LL, my = LY + s * LL, f = L.flash, fs = LS * (0.6 + 1.1 * f);
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = f;
      ctx.drawImage(glow[L.fc], mx - fs * 1.4, my - fs * 1.4, fs * 2.8, fs * 2.8);
      ctx.drawImage(glow[WHITE], mx - fs * 0.7, my - fs * 0.7, fs * 1.4, fs * 1.4);
      ctx.globalCompositeOperation = "source-over";
      ctx.save();
      ctx.translate(mx, my);
      ctx.rotate(L.a);
      ctx.fillStyle = "#FFF6B0";
      ctx.beginPath();
      for (var k = 0; k < 14; k++) {
        var ang = -Math.PI * 0.55 + k * (Math.PI * 1.1 / 13), rr = (k % 2 ? 0.35 : 1) * fs * 0.75;
        if (k) ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
        else ctx.moveTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  // Peggle-style dotted aiming line (dots march along it), with a ring where it first hits.
  function drawAim(now) {
    var n = predPts.length / 2;
    if (!n) return;
    var col = nextColorPeek(), base = aim ? 1 : 0.5, k;
    var ds = Math.max(2.6, 4.2 * su);
    var shift = reduce ? 0 : (now / 140) % 1;
    for (k = 0; k < n; k++) {
      var f = 1 - (k + shift) / (n + 1);
      var x = predPts[k * 2], y = predPts[k * 2 + 1];
      ctx.globalAlpha = base * (0.35 + 0.65 * f);
      ctx.globalCompositeOperation = "lighter";
      ctx.drawImage(glow[col], x - ds * 2.6, y - ds * 2.6, ds * 5.2, ds * 5.2);
      ctx.globalCompositeOperation = "source-over";
      ctx.beginPath();
      ctx.arc(x, y, ds * (0.6 + 0.4 * f), 0, Math.PI * 2);
      ctx.fillStyle = "#FFFFFF";
      ctx.fill();
      ctx.lineWidth = Math.max(1, 1.4 * su);
      ctx.strokeStyle = "#0B0F2A";
      ctx.stroke();
    }
    if (predEnd) {
      var pr = predEnd.r * (1.15 + (reduce ? 0 : 0.15 * Math.sin(now / 120)));
      ctx.globalAlpha = base;
      ctx.lineWidth = Math.max(2, 3 * su);
      ctx.strokeStyle = "#FFFFFF";
      ctx.beginPath(); ctx.arc(predEnd.x, predEnd.y, pr, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = COLORS[col][1];
      ctx.lineWidth = Math.max(1.5, 1.8 * su);
      ctx.beginPath(); ctx.arc(predEnd.x, predEnd.y, pr + 3 * su, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // A short hint under the cannon: on an empty board, and for a moment after switching modes.
  function drawHint(now) {
    var shoot = state.mode === "shoot";
    var big = shoot ? "Drag to aim. Let go!" : "Tap to drop!";
    var small = "";   // one short line only
    var a = hintT > 0 ? Math.min(1, hintT * 2) : 1;
    if (balls.length || totalShown) a = Math.min(a, 1);
    var bob = reduce ? 0 : Math.sin(now / 300) * 3 * su;
    var hs = Math.round(clamp(28 * su, 18, 32)), ss = Math.round(hs * 0.62);
    ctx.font = "800 " + hs + "px 'Baloo 2', 'Trebuchet MS', sans-serif";
    var w1 = ctx.measureText(big).width;
    ctx.font = "700 " + ss + "px 'Baloo 2', 'Trebuchet MS', sans-serif";
    var w2 = ctx.measureText(small).width;
    var pw = Math.min(W - 16, Math.max(w1, w2) + hs * 1.2), ph = hs * 1.15 + (small ? ss * 1.25 : 0) + 10;
    var py = LY + LL + LBW * 0.9 + bob;
    ctx.globalAlpha = a;
    rrect(W / 2 - pw / 2, py, pw, ph, Math.min(18, ph / 2));
    ctx.fillStyle = "rgba(11,15,42,0.82)";
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = shoot ? "#B7F08A" : "rgba(255,255,255,0.5)";
    ctx.stroke();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "800 " + hs + "px 'Baloo 2', 'Trebuchet MS', sans-serif";
    ctx.fillText(big, W / 2, py + 5 + hs * 0.58);
    if (small) {
      ctx.fillStyle = shoot ? "#B7F08A" : "#8FDBFF";
      ctx.font = "700 " + ss + "px 'Baloo 2', 'Trebuchet MS', sans-serif";
      ctx.fillText(small, W / 2, py + 5 + hs * 1.15 + ss * 0.6);
    }
    ctx.globalAlpha = 1;
  }

  function drawStar(x, y, r, flash) {
    ctx.beginPath();
    for (var k = 0; k < 10; k++) {
      var a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r;
      if (k) ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      else ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = flash > 0.3 ? "#FFFFFF" : "#FF5FAE";
    ctx.fill();
  }

  var MILL_COLS = ["#FFD23F", "#FF9F1C", "#FFD23F", "#FF9F1C"];
  function drawMill(bd) {

      '<circle cx="40" cy="36" r="9" fill="#FF5FAE" stroke="#0B0F2A" stroke-width="2"/><circle cx="40" cy="36" r="5" fill="#FFE066"/>' +
      [[40, 14], [12, 38], [24, 44], [48, 52], [14, 52], [30, 30]].map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="#E4EAFF"/>'; }).join(""),
    spinners: '<rect x="2" y="2" width="56" height="56" rx="12" fill="#2E3A93" stroke="#1D2340" stroke-width="3"/>' +
      '<g transform="rotate(20 30 30)"><path d="M30 12 V48 M12 30 H48" stroke="#0B0F2A" stroke-width="9" stroke-linecap="round"/><path d="M30 12 V48" stroke="#FFD23F" stroke-width="5" stroke-linecap="round"/><path d="M12 30 H48" stroke="#FF9F1C" stroke-width="5" stroke-linecap="round"/></g>' +
      '<circle cx="30" cy="30" r="5" fill="#FF4D6D" stroke="#0B0F2A" stroke-width="2"/>' +
      [[10, 10], [50, 10], [10, 50], [50, 50]].map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="#E4EAFF"/>'; }).join(""),
    zigzag: '<rect x="2" y="2" width="56" height="56" rx="12" fill="#2E3A93" stroke="#1D2340" stroke-width="3"/>' +
      '<path d="M6 10 L38 18 M54 22 L22 30" stroke="#8FDBFF" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="M20 38 L23 48 H37 L40 38" fill="none" stroke="#0B0F2A" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<path d="M20 38 L23 48 H37 L40 38" fill="none" stroke="#FF9F1C" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="30" cy="43" r="3.4" fill="#5BE36B"/><circle cx="44" cy="17" r="3.4" fill="#FF4D6D"/>'
  };
  LAYOUTS.forEach(function (l) {
    var b = document.createElement("button");
    b.className = "btn boardbtn";
    b.dataset.layout = l[0];
    b.innerHTML = '<svg viewBox="0 0 60 60" aria-hidden="true">' + BOARD_ICONS[l[0]] + "</svg><span>" + l[1] + "</span>";
    $("boards").appendChild(b);
  });
  (function () {
    var r = document.createElement("button");
    r.className = "swatch";
    r.dataset.color = "rainbow";
    r.setAttribute("aria-label", "Rainbow");
    r.title = "Rainbow";
    $("swatches").appendChild(r);
    COLORS.slice(0, 7).forEach(function (c, i) {
      var b = document.createElement("button");
      b.className = "swatch";
      b.dataset.color = String(i);
      b.style.background = c[1];
      b.setAttribute("aria-label", c[0]);
      b.title = c[0];
      $("swatches").appendChild(b);
    });
  })();

  function renderControls() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-layout]"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.layout === state.layout));
    });
    Array.prototype.forEach.call(document.querySelectorAll(".swatch"), function (b) {
      var on = String(state.color) === b.dataset.color;
      b.setAttribute("aria-pressed", String(on));
      b.innerHTML = on ? '<span class="tick">✓</span>' : "";
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-size]"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.size === state.size));
    });
  }

  function switchLayout(id) {
    if (id === state.layout) return;
    saveCounts();
    balls.forEach(function (b) { burst(b.x, b.y, b.c, 2, 120, 0.4); });
    balls = [];
    emptyT = 0;
    state.layout = id;
    loadBinsFor(id);
    build();
    totalShown = -1;
    save();
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    // The extra Big/Back buttons use the shared module (common/toybox.js).
    if (t.dataset.action === "big") { Toybox.setBig(!Toybox.isBig()); return; }
    if (t.id === "bigToggle" || t.closest(".modal, .farewell, .rest")) return;
    // Phone tabs (Play / Board / Balls): show one group of controls at a time.
    if (t.classList.contains("tab")) {
      $("panel").dataset.tab = t.dataset.tab;
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) { b.setAttribute("aria-pressed", String(b === t)); });
      return;
    }
    if (playLocked()) return;
    if (t.id === "drop10") { drop10(); return; }
    if (t.id === "rain") { setRain(!raining); return; }
    if (t.id === "emptyBtn") { emptyBins(); return; }
    if (t.id === "shootBtn") { setMode(state.mode === "shoot" ? "drop" : "shoot"); return; }
    if (t.dataset.layout) { switchLayout(t.dataset.layout); renderControls(); return; }
    if (t.dataset.color) { state.color = t.dataset.color === "rainbow" ? "rainbow" : Number(t.dataset.color); save(); renderControls(); return; }
    if (t.dataset.size) { state.size = t.dataset.size; save(); renderControls(); return; }
  });

  // ---------- Main loop ----------
  var last = performance.now(), acc = 0, dbgSpeed = 1;
  var frameCost = 0;
  function frame(now) {
    var t0 = performance.now();
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (built) {

      if (!playLocked()) {
        var fk;
        for (fk in fingers) {
          if (!Object.prototype.hasOwnProperty.call(fingers, fk)) continue;
          var f = fingers[fk];
          if (now >= f.next) { dropAt(f.x); f.next = now + POUR_MS; f.c = state.color === "rainbow" ? (rainbowI + 1) % NC : state.color; }
        }
        while (queue.length && queue[0].t <= now) dropAt(queue.shift().x);
        if (raining && now >= rainNext) { dropAt(rand(0.04, 0.96) * W); rainNext = now + RAIN_MS; }
      }
      // Ball motion runs in slow motion (sdt); glows, sparkles and doors stay in real time (dt).
      updateLauncher(dt);
      var sdt = dt * SIM_SPEED * dbgSpeed;
      acc += sdt;
      var n = 0;
      while (acc >= STEP && n < 14) { step(STEP); acc -= STEP; n++; }
      if (n >= 14) acc = 0;
      perFrame(dt, sdt);
      render(now);
      // Ending: tell the shared timer once every ball has settled in a bin.
      if (ending && endingDone && allSettled()) { endingDone(); endingDone = null; }
      frameCost = frameCost * 0.95 + (performance.now() - t0) * 0.05;
    }
    requestAnimationFrame(frame);
  }

  function resize() {
    build();
    if (built) render(performance.now());
  }
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  else window.addEventListener("resize", resize);

  // ---------- Play timer (shared, common/toybox.js) ----------
  // A bar along the top of the board shows the time left; an optional chip shows the minutes.
  function drawTimer(info) {
    if (info.phase !== "running" && info.phase !== "ending") { $("timebar").hidden = true; $("mins").hidden = true; return; }
    var f = info.fraction;
    var col = f > 0.5 ? "#2E9E5B" : (f > 0.2 ? "#FFC93C" : "#F77F00");
    $("timebar").hidden = false;
    $("timefill").style.width = (f * 100).toFixed(1) + "%";
    $("timefill").style.background = col;
    var showM = info.showMinutes && info.phase === "running";
    $("mins").hidden = !showM;
    if (showM) $("mins").textContent = "⏱ " + info.minutes + " min";
  }
  // Ending: the balls stop dropping and settle into the bins (frame() calls endingDone once they have).
  var endingDone = null;
  function onEnding(done) {
    ending = true;
    // Stop dropping: no more rain, pours or queued drops.
    setRain(false);
    fingers = {};
    queue = [];
    aim = null;
    hover = null;
    canvas.classList.remove("grabbing");
    endingDone = done;
  }
  // One last little shower of rainbow balls down the middle.
  function lastDrop() {
    var keep = state.color;
    state.color = "rainbow";
    for (var k = 0; k < 5; k++) spawn(W / 2 + (k - 2) * bw * 0.6);
    state.color = keep;
    chime();
  }

  function allSettled() {
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (b.bin < 0) return false;
      if (!b.sleep && b.vx * b.vx + b.vy * b.vy > 900 * su * su) return false;
    }
    for (i = 0; i < bodies.length; i++) {
      if (bodies[i].kind === "bucket" && bodies[i].phase !== "move") return false;
    }
    return emptyT <= 0;
  }

  function snapshot() {
    try {
      if (built) render(performance.now());
      var w = 320, h = Math.round(320 * H / W);
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(canvas, OX * DPR, 0, W * DPR, H * DPR, 0, 0, w, h);
      return c.toDataURL("image/png");
    } catch (e) { return ""; }
  }

  function restArt() {
    var url = snapshot();
    if (!url) return "";
    var img = document.createElement("img");
    img.className = "rest-art";
    img.alt = "";
    img.src = url;
    return img;
  }
  function onRest() {
    ending = false;
    endingDone = null;
    absorbAllInBins();
    balls = [];
    updatePackCols();
    bins.forEach(function (bn) { bn.L = packLayout(bn.packed.length); bn.ph = bn.L.h; bn.door = 0; drawBinCache(bn); });
    parts = [];
    saveCounts();
    perFrame(0, 0);
  }
  function onWake() { ending = false; endingDone = null; }

  document.addEventListener("visibilitychange", function () { if (document.hidden) saveCounts(); });
  window.addEventListener("pagehide", saveCounts);

  loadBinsFor(state.layout);
  renderControls();
  $("shootBtn").setAttribute("aria-pressed", String(state.mode === "shoot"));
  canvas.classList.toggle("aimcursor", state.mode === "shoot");
  build();
  // The old sound key said "on"/"off"; the shared module reads "1" for on.
  try { if (localStorage.getItem(OLD_SKEY) === "on") localStorage.setItem(OLD_SKEY, "1"); } catch (e) { /* ignore */ }
  // The shared grown-up layer: play timer, sound, Big. It may start the ending right away
  // (a timer that ran out while away), so the board is built first.
  Toybox.init({
    app: "peg-drop",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the balls stop dropping and settle into the bins, and the controls lock.",
    goodbyeOption: "End with a Last drop button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Last drop",
    farewellDone: "Bye bye!",
    restLine: "The pegs are resting.",
    restLine2: "They will be right here next time.",
    restArt: restArt,
    soundNote: "Soft plinks as the balls bounce. Hold for 2 seconds.",
    legacy: { timer: OLD_TKEY, sound: OLD_SKEY, big: OLD_BKEY },
    onEnding: onEnding,
    onGoodbye: lastDrop,
    onRest: onRest,
    onWake: onWake,
    onSound: function (on) { if (on) chime(); },
    onTimer: drawTimer
  });
  $("stage").appendChild($("tb-toast"));
  $("stage").appendChild($("tb-farewell"));
  requestAnimationFrame(frame);

  // Test hook for automated checks, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) {
    window.__pegdrop = {
      balls: function () { return balls.length; },
      total: function () { return totalShown; },
      counts: function () { return bins.map(function (b) { return b.count; }); },
      layout: function () { return state.layout; },
      cost: function () { return frameCost; },
      shots: function () { return shots; },
      mode: function () { return state.mode; },
      speed: function (k) { dbgSpeed = k; },
      cannon: function () {
        var r = canvas.getBoundingClientRect();
        return { x: r.left + OX + LX, y: r.top + LY, a: launcher.a, W: W, H: H, binTop: binTop, left: r.left + OX, top: r.top };
      },
      ballsInfo: function () { return balls.map(function (b) { return [Math.round(b.x), Math.round(b.y), b.bin]; }); }
    };
  }
})();
</script>
</body>
</html>
