<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.tb-head a { text-decoration: none; }
.stage { background: #F3E3CC; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage .tbadge { position: absolute; top: 52px; right: 10px; z-index: 3; }
/* The coach line sits at the bottom of the stage everywhere: the step pictures use the top. */
.tb-coach { top: auto; bottom: 10px; }
/* Where he is in the routine: small step pictures, the current one glows. */
.steps { position: absolute; top: 9px; right: 10px; z-index: 3; display: flex; gap: 3px; padding: 3px 6px;
  background: #FFFFFF; border: 3px solid #1D2340; border-radius: 999px; box-shadow: 3px 3px 0 #1D2340; pointer-events: none; }
.steps[hidden] { display: none; }
.steps i { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; opacity: 0.35; transition: opacity 0.4s ease, background 0.4s ease; }
.steps i.done { opacity: 0.75; }
.steps i.now { opacity: 1; background: #FFC93C; box-shadow: 0 0 0 2px #1D2340; }
.steps svg { width: 26px; height: 26px; display: block; overflow: visible; }
@media (prefers-reduced-motion: no-preference) {
  .steps i.now { animation: glow 1.6s ease-in-out infinite; }
}
@keyframes glow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.tb-counter { white-space: nowrap; }
/* Choices: drinks to pick, or the drink being made plus its toppings. */
.tb-choices.pick { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tb-choices.drink { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tb-tile { position: relative; min-width: 0; }
.tb-tile svg { pointer-events: none; overflow: visible; }
.tb-tile span { pointer-events: none; white-space: nowrap; }
.tb-tile small { display: block; font-size: 0.78em; font-weight: 700; color: var(--muted); line-height: 1; pointer-events: none; }
.tb-tile[aria-pressed="true"] small { color: #1D2340; }
.tb-choices.pick .tb-tile { min-height: 96px; }
.tb-choices.pick .tb-tile svg { width: 56px; height: 56px; }
.tb-tile.this { cursor: default; }
.tb-tile:disabled { opacity: 0.4; }
.tb-tabs .btn[aria-disabled="true"] { opacity: 0.45; }
.btn.tb-go:disabled { opacity: 0.55; }
@media (max-width: 600px) {
  .tb-tile { font-size: 0.86rem; min-height: 66px; }
  .tb-tile svg { width: 40px; height: 40px; }
  .tb-choices.pick .tb-tile { min-height: 88px; }
  .tb-choices.pick .tb-tile svg { width: 50px; height: 50px; }
  .steps i { width: 26px; height: 26px; }
  .steps svg { width: 21px; height: 21px; }
  .steps { gap: 1px; padding: 2px 4px; top: 8px; right: 8px; }
  .stage .tbadge { top: 44px; right: 8px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-choices { gap: 6px; }
  .tb-tile { min-height: 58px; font-size: 0.8rem; }
  .tb-tile svg { width: 32px; height: 32px; }
  .tb-choices.pick { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tb-choices.pick .tb-tile { min-height: 84px; }
  .tb-choices.pick .tb-tile svg { width: 44px; height: 44px; }
  .tb-choices.drink { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .steps i { width: 24px; height: 24px; }
  .steps svg { width: 19px; height: 19px; }
  .steps { gap: 1px; padding: 2px 4px; top: 6px; right: 6px; }
  .stage .tbadge { top: 40px; right: 6px; }
}
@media (orientation: landscape) and (min-height: 521px) {
  .tb-choices.drink { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tb-choices.pick { grid-template-columns: repeat(1, minmax(0, 1fr)); }
  .tb-choices.pick .tb-tile { flex-direction: row; gap: 14px; justify-content: flex-start; padding-left: 18px; min-height: 92px; }
  .tb-choices.pick .tb-tile span { text-align: left; }
}
@media (min-width: 700px) and (min-height: 700px) {
  .steps i { width: 38px; height: 38px; }
  .steps svg { width: 30px; height: 30px; }
  .stage .tbadge { top: 60px; }
}
body.big .tb-panel { display: none; }
body.ending .tb-panel, body.resting .tb-panel { pointer-events: none; }
body.ending .tb-panel { opacity: 0.5; }
body.ending .steps, body.big .steps { visibility: hidden; }
.rest-art { width: min(70vw, 300px, 42vh); aspect-ratio: 1; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
/* Ghost hand (tools/snippets/ghost-hand.css) */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Espresso Machine</h1>
    <button class="btn tb-iconbtn" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>
  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A coffee cart with an espresso machine, a grinder, a scale and a tray for the drinks"></canvas>
      <div class="tb-counter" id="counter">Drinks: 0</div>
      <div class="steps" id="steps" aria-hidden="true" hidden></div>
      <div class="tb-coach" id="coach">Pick a drink!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
    <section class="tb-panel" id="panel">
      <button class="btn tb-go" id="goBtn" hidden>Do it!</button>
      <div class="tb-choices pick" id="choices"></div>
      <nav class="tb-tabs">
        <button class="btn tb-new" id="newBtn">New</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var TAU = Math.PI * 2, INK = "#1D2340";
  var FONT = '"Baloo 2", "Trebuchet MS", system-ui, sans-serif';
  // Everything that plays by itself runs about a third slower than real life (AGENTS.md "Pace").
  // The scale's seconds still tick in real seconds.
  var PACE = 1.35;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ease(t) { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function easeOut(t) { t = clamp(t, 0, 1); return 1 - (1 - t) * (1 - t); }
  function now() { return performance.now() / 1000; }
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function srand(seed) {
    var s = (seed | 0) % 2147483647; if (s <= 0) s += 2147483646;
    return function () { s = s * 16807 % 2147483647; return (s - 1) / 2147483646; };
  }
  function val(v) { return typeof v === "function" ? v() : v; }
  function mix(c1, c2, t) {
    var a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
    var r = Math.round(lerp(a >> 16, b >> 16, t)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t)), bl = Math.round(lerp(a & 255, b & 255, t));
    return "#" + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
  }

  // ---------- The cart: world units, x to the right, y down; the cart top's front edge is y = 0 ----------
  // Left to right: bag of beans, scale, grinder, funnel spot, portafilter stand, tamper, the espresso
  // machine (needle tool on its side, syrups and milk jug on top), knock box, the tray for finished drinks.
  var BASE = -0.3;                     // where things stand on the cart
  var XB = 1.4, XSW = 4.25, XG = 7.35, XFP = 9.75, XST = 11.1, XTA = 12.95, XHK = 13.5;
  var ML = 13.85, MR = 20.25, MT = -8.0, XGR = 16.45;
  var BY = -6.8, BR = 0.36;
  var BTN = { power: 14.6, one: 15.6, two: 16.45, milk: 17.3 };
  var DRIP = -1.0;                     // the drip tray grate
  var GROUP_RIM = -5.05;               // portafilter rim when locked in
  var STAND_TOP = -1.9, STAND_RING = -1.55;
  var GRB = -0.6;                      // grinder base plate
  var SCALE_H = 0.8, DC_H = 1.15;
  var XW = 20.95, WAND_TIP = -1.05, JUG_H = 1.75, JUG_HX = 18.85;
  var XK = 23.0;
  var TRAY_L = 24.4, TRAY_R = 30.0, TRAY_Y = -0.62, SLOTS = [25.4, 27.2, 29.0];
  var WORLD_L = -0.6, WORLD_R = 30.6;
  var WDT_Y = -3.75;                   // needle tips when it hangs on its hook

  // Camera regions [x0, x1, top, bottom]: the stage frames the area of the current step.
  var REG = {
    choose: [13.0, 30.3, -10.7, 0.9],
    mach: [12.9, 22.0, -8.4, 0.6],
    tip: [9.7, 22.0, -8.0, 0.6],
    weigh: [-0.3, 6.0, -5.7, 0.9],
    hopper: [2.4, 9.4, -11.0, 0.9],
    grind: [4.4, 9.8, -9.8, 0.6],
    dump: [5.6, 13.0, -6.6, 0.6],
    puck: [8.6, 14.4, -6.0, 0.6],
    lock: [9.0, 18.4, -7.6, 0.6],
    shot: [13.3, 19.6, -7.6, 0.6],
    jug: [13.3, 22.8, -10.2, 0.6],
    steam: [13.3, 22.8, -7.8, 0.6],
    pour: [13.3, 22.8, -9.9, 0.6],
    serve: [14.4, 30.3, -7.4, 0.6],
    knock: [13.4, 24.4, -6.4, 0.6],
    trayTall: [20.6, 30.4, -10.7, 0.9],
    serveTall: [15.6, 30.4, -10.7, 0.9]
  };


  // ---------- Drinks ----------
  var CUPS = {
    latte: { rx: 0.9, brx: 0.56, h: 1.2, col: "#F79BB6", dark: "#D46F8F", esp: 0.3, name: "Latte", who: "for Mom", art: "heart", fun: ["tulip", "rosetta", "bear"], foam: 0.45, gpm: 210 },
    cappuccino: { rx: 0.8, brx: 0.5, h: 1.0, col: "#78AEEB", dark: "#4A80C4", esp: 0.38, name: "Cappuccino", who: "for Dad", art: "cloud", fun: ["cocoaheart", "cocoastar"], foam: 1, gpm: 140 },
    steamer: { rx: 0.68, brx: 0.62, h: 1.35, col: "#FFD34D", dark: "#E0A91C", esp: 0, name: "Steamer", who: "for me", art: "plain", fun: ["bear", "heart"], foam: 0.35, gpm: 200 }
  };
  var DRINKS = ["latte", "cappuccino", "steamer"];
  var ORDER = {
    coffee: ["power", "flush", "tip", "weigh", "hopper", "grind", "dump", "whisk", "funnel", "tamp", "lock", "shot", "jug", "steam", "pour", "serve", "knock", "rinse"],
    steamer: ["power", "jug", "steam", "pour", "serve"]
  };
  // Progress pictures: which group each step belongs to.
  var PHASE = { power: "warm", flush: "warm", tip: "warm", weigh: "weigh", hopper: "grind", grind: "grind", dump: "puck", whisk: "puck",
    funnel: "puck", tamp: "puck", lock: "shot", shot: "shot", jug: "milk", steam: "milk", pour: "pour", serve: "pour", knock: "clean", rinse: "clean" };
  var PHASES = { coffee: ["warm", "weigh", "grind", "puck", "shot", "milk", "pour", "clean"], steamer: ["warm", "milk", "pour"] };
  function isCoffee() { return S.drink && S.drink !== "steamer"; }
  function seq() { return S.drink === "steamer" ? ORDER.steamer : ORDER.coffee; }

  // ---------- Saved state ----------
  // localStorage "espresso-machine-v1": { v, drink, step, art, syr, cocoa, flushed, on, tray: [{d, art, cocoa}], count, pucks }
  var KEY = "espresso-machine-v1";
  var S = { drink: null, step: "choose", art: "", syr: [], cocoa: false, flushed: false, on: false, tray: [], count: 0, pucks: 0 };
  function load() {
    var o = null;
    try { o = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { o = null; }
    if (!o || typeof o !== "object") return;
    if (CUPS[o.drink]) S.drink = o.drink;
    var list = seq();
    S.step = S.drink && list.indexOf(o.step) >= 0 ? o.step : "choose";
    if (S.step === "choose") S.drink = null;
    S.art = typeof o.art === "string" ? o.art : "";
    S.syr = Array.isArray(o.syr) ? o.syr.filter(function (s) { return s === "vanilla" || s === "caramel"; }).slice(0, 3) : [];
    S.cocoa = !!o.cocoa;
    S.flushed = !!o.flushed;
    S.on = !!o.on;
    S.tray = Array.isArray(o.tray) ? o.tray.filter(function (t) { return t && CUPS[t.d]; }).slice(-3).map(function (t) { return { d: t.d, art: String(t.art || ""), cocoa: !!t.cocoa }; }) : [];
    S.count = Math.max(0, Math.floor(+o.count || 0));
    S.pucks = clamp(Math.floor(+o.pucks || 0), 0, 99);
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ v: 1, drink: S.drink, step: S.step, art: S.art, syr: S.syr, cocoa: S.cocoa, flushed: S.flushed,
        on: S.on, tray: tray.map(function (t) { return { d: t.d, art: t.art, cocoa: t.cocoa }; }), count: S.count, pucks: S.pucks }));
    } catch (e) { /* ignore */ }
  }
  // Opened from the home screen: a fresh start (machine off, no drink, empty tray).
  if (Toybox.fresh()) { try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } } else load();

  // ---------- Things on the cart ----------
  var scale = { x: XSW, y: BASE, up: false, shown: 0, ok: 0 };
  var dcup = { x: XG, y: GRB, rot: 0, beans: 0, grounds: 0, up: false };
  var scoop = { x: XB + 0.3, y: -3.55, rot: 0, load: 0, inBag: true, up: false };
  var pf = { x: XGR, y: GROUP_RIM, rot: 0, twist: 1, at: "group", grounds: 0, fluff: 0, tamped: 0, spent: false, wet: 0, up: false };
  var funnel = { x: XST, y: STAND_RING, at: "stand", up: false };
  var wdt = { x: XHK, y: WDT_Y, at: "hook", up: false };
  var tamper = { x: XTA, y: BASE, press: 0, at: "home", up: false };
  var cup = null;
  var jug = { x: JUG_HX, y: MT, rot: 0, milk: 0, foam: 0, swirl: 0, lift: 0, at: "top", pouring: 0, up: false };
  var hopper = { beans: 0 };
  var tray = [], leaving = [];
  var syrups = [
    { id: "vanilla", name: "Vanilla", hx: 14.6, x: 14.6, y: MT, rot: 0, liq: "#F1DDAE", up: false, pump: 0 },
    { id: "caramel", name: "Caramel", hx: 15.55, x: 15.55, y: MT, rot: 0, liq: "#C2702A", up: false, pump: 0 }
  ];
  var carton = null, shaker = null, puckFall = null;
  var M = { on: false, heat: 0, pump: null, flash: {}, pending: null, offTries: 0 };
  var G = null;                                       // grinding: { t, dur }
  var SH = { ph: "ready", timer: null, stop: null, w: 0, held: false, letGo: false, soakT: 0, pourT: 0, pourDur: 20, finalW: 35, w0: 0, autoLet: 0 };
  var STM = null;                                     // steaming: { t, dur, mode, target }
  var WG = { g: 0, done: false };                     // grams of beans in the dosing cup
  var whisk = { on: false, trail: [], n: 0, auto: 0 };
  var parts = [];
  var learnedSteps = {};

  // ---------- Animation queue ----------
  // MAIN runs one action at a time (the routine); FX runs little side shows in parallel (syrup pumps).
  var MAIN = [], FX = [], cur = MAIN;
  function q(fn) { cur.push(fn); }
  function tw(ms, f) { var e = 0, d = ms * PACE / 1000; q(function (dt) { e += dt; var k = d > 0 ? Math.min(1, e / d) : 1; f(ease(k), k); return k >= 1; }); }
  function wait(ms) { var e = 0; q(function (dt) { e += dt; return e >= ms * PACE / 1000; }); }
  function call(f) { q(function () { f(); return true; }); }
  function until(c) { q(function () { return !!c(); }); }
  function move(o, x, y, ms, lift, rot) {
    var x0, y0, r0, e = 0, d = ms * PACE / 1000, tx, ty;
    q(function (dt) {
      if (x0 === undefined) { x0 = o.x; y0 = o.y; r0 = o.rot || 0; tx = val(x); ty = val(y); o.up = true; }
      e += dt;
      var k = Math.min(1, e / d), s = ease(k);
      o.x = lerp(x0, tx, s);
      o.y = lerp(y0, ty, s) - (lift || 0) * Math.sin(Math.PI * s);
      if (rot !== undefined) o.rot = lerp(r0, rot, s);
      if (k >= 1) { o.up = false; return true; }
      return false;
    });
  }
  function spawn(build) { var s = [], keep = cur; cur = s; build(); cur = keep; FX.push(s); }
  function runSeq(list, dt) {
    var n = 0;
    while (list.length && n < 30) { if (list[0](dt)) { list.shift(); dt = 0; n++; } else break; }
  }
  function busy() { return MAIN.length > 0; }

  // ---------- Canvas, camera ----------
  var stage = $("stage"), cv = $("cv"), ctx = cv.getContext("2d");
  var W = 300, H = 300, dpr = 1, LW = 0.05, phone = true, padT = 40, padB = 8;
  var cam = { cx: 16, cy: -5, s: 30, sy: 150 }, camInit = false;
  var SMAX = 92;
  function layout() {
    var r = stage.getBoundingClientRect();
    W = Math.max(50, r.width); H = Math.max(50, r.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    phone = Math.min(innerWidth, innerHeight) < 560;
    padT = phone ? 34 : 50;
    padB = 6;
    if (!camInit) { var t = fit(region()); cam.cx = t.cx; cam.cy = t.cy; cam.s = t.s; cam.sy = t.sy; camInit = true; }
  }
  function region() {
    var st = S.step, tall = H > W * 1.1;
    if (st === "choose") return tall ? REG.trayTall : REG.choose;
    if (st === "power" || st === "flush") return REG.mach;
    if (st === "serve") return tall ? REG.serveTall : REG.serve;
    if (st === "whisk" || st === "funnel" || st === "tamp") return REG.puck;
    if (st === "rinse") return REG.knock;
    return REG[st] || REG.mach;
  }
  function fit(reg) {
    var aw = W - 12, ah = Math.max(40, H - padT - padB);
    var rw = reg[1] - reg[0], rh = reg[3] - reg[2];
    var s = Math.min(aw / rw, ah / rh, SMAX);
