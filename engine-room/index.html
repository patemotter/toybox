<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Engine Room</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Engine Room">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 1366px;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header h1 { margin: 0; white-space: nowrap; font-size: 1.35rem; font-weight: 800; line-height: 1; letter-spacing: -0.01em; }
.homebtn {
  flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 34px;
  padding: 2px 12px 2px 9px; font-weight: 700; font-size: 1rem; color: var(--ink); text-decoration: none;
  background: var(--panel); border: 3px solid var(--edge); border-radius: 12px; box-shadow: 2px 2px 0 var(--edge);
}
.homebtn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }
.homebtn:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
.homebtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.hdr-right { display: flex; gap: 10px; align-items: center; }
.app { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }

/* ---------- Stage ---------- */
.stage {
  position: relative; flex: 1 1 auto; min-height: 0; background: var(--plate);
  border: 3px solid var(--edge); border-radius: 24px; box-shadow: 4px 4px 0 var(--edge); padding: 6px;
}
.scene {
  position: relative; width: 100%; height: 100%; border: 3px solid #1D2340; border-radius: 18px;
  overflow: hidden; background: #DCEAF7; touch-action: none;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hint {
  position: absolute; left: 50%; top: 64px; transform: translateX(-50%); z-index: 2; pointer-events: none;
  background: var(--accent); color: #1D2340; border: 4px solid #1D2340; border-radius: 22px;
  box-shadow: 4px 4px 0 #1D2340; padding: 0.1rem 1rem 0.2rem; font-size: clamp(1.1rem, 3.4vw, 2rem);
  font-weight: 800; max-width: calc(100% - 24px); text-align: center; line-height: 1.15;
}
.hint[hidden] { display: none; }
.hint.go { animation: hintPop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hintPop { 0% { transform: translateX(-50%) scale(0.3); } 100% { transform: translateX(-50%) scale(1); } }
.slowtag {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 2; pointer-events: none;
  background: #8338EC; color: #FFFFFF; border: 3px solid #1D2340; border-radius: 999px; padding: 0 0.9rem;
  font-weight: 800; font-size: clamp(1rem, 2.6vw, 1.4rem); box-shadow: 3px 3px 0 #1D2340; white-space: nowrap;
}
.slowtag[hidden] { display: none; }

/* Play-timer gauge */
.fuel { position: absolute; top: 8px; left: 8px; z-index: 2; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.fuel[hidden] { display: none; }
.fuel-bar { width: clamp(70px, 18vw, 150px); height: 18px; background: rgba(255, 255, 255, 0.8); border: 3px solid #1D2340; border-radius: 999px; overflow: hidden; }
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num { min-width: 40px; height: 40px; display: grid; place-items: center; background: #FFFFFF; color: #1D2340; border: 3px solid #1D2340; border-radius: 50%; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.fuel-num[hidden] { display: none; }

/* Big mode */
.bigtoggle {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  color: #1D2340; background: #FFFFFF; border-color: #1D2340; box-shadow: 3px 3px 0 #1D2340;
}
.bigtoggle[aria-pressed="true"] { background: var(--accent); }
.bigtoggle:active { box-shadow: 0 0 0 #1D2340; }
body.big header, body.big .panel { display: none; }
body.big .wrap { max-width: none; padding: max(6px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); }
body.big .app { margin-top: 0; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }

/* ---------- Panel ---------- */
.panel {
  flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 10px 10px;
  background: var(--panel); border: 3px solid var(--edge); border-bottom-width: 0; border-radius: 24px 24px 0 0;
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
}
.ctrl { display: flex; gap: 8px; align-items: stretch; }
.mach { flex: 1 1 0; min-width: 0; padding: 0.2rem 0.3rem; font-size: clamp(0.9rem, 2.8vw, 1.2rem); line-height: 1.05; }
.drive { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.crank { flex: none; width: 112px; height: 112px; touch-action: none; cursor: grab; border-radius: 50%; }
.crank svg { width: 100%; height: 100%; display: block; pointer-events: none; overflow: visible; }
.drivecol { flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.drivecol .btn { width: 100%; white-space: nowrap; }
.start { background: #2E9E5B; color: #FFFFFF; font-size: 1.35rem; min-height: 60px; }
.start.on { background: #E63946; }
.throttle { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; touch-action: none; cursor: pointer; }
.throttle .track { position: relative; width: 56px; height: 104px; background: #E6EEF8; border: 3px solid #1D2340; border-radius: 16px; overflow: hidden; }
.throttle .tfill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#F77F00, #FFC93C); }
.throttle .knob { position: absolute; left: 4px; right: 4px; height: 24px; background: #FFFFFF; border: 3px solid #1D2340; border-radius: 10px; }
.throttle span { font-weight: 800; font-size: 0.95rem; line-height: 1; }
.gate { display: flex; gap: 6px; padding: 6px; background: #3B4766; border: 3px solid #1D2340; border-radius: 18px; }
.gate[hidden] { display: none; }
.gate .btn { flex: 1 1 0; min-width: 0; min-height: 52px; padding: 0; font-size: 1.3rem; border-radius: 999px; }
.gate .abbtn[aria-pressed="true"] { background: #F77F00; color: #FFFFFF; }
body.ending .panel { pointer-events: none; opacity: 0.4; }

/* Rest picture: the sleepy engine on a night sky (the rest screen itself is in common/toybox.css). */
.rest-art { aspect-ratio: 1; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }

/* Landscape: machine on the left, controls on the right. */
@media (orientation: landscape) {
  .app { flex-direction: row; }
  .stage { margin-bottom: 8px; }
  .panel { flex: 0 0 min(36%, 360px); margin-bottom: 8px; border-bottom-width: 3px; border-radius: 24px; justify-content: center; padding-bottom: 10px; }
  .machines { flex-direction: column; }
  .mach { flex: 0 0 auto; min-height: 56px; }
}
@media (min-width: 744px) and (min-height: 640px) {
  .wrap { padding-top: 12px; }
  header h1 { font-size: 2rem; }
  .homebtn { min-height: 44px; font-size: 1.1rem; }
  .app { gap: 14px; margin-top: 10px; }
  .stage { padding: 10px; }
  .panel { gap: 12px; padding: 12px 14px 14px; }
  .mach { min-height: 62px; font-size: 1.3rem; }
  .crank { width: 140px; height: 140px; }
  .throttle .track { width: 64px; height: 130px; }
  .fuel-num { min-width: 48px; height: 48px; font-size: 1.5rem; }
  .bigtoggle { top: 14px; right: 14px; }
  .gate .btn { min-height: 60px; font-size: 1.5rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  header { justify-content: flex-end; }
  header h1 { display: none; }
  #timerbtn { min-height: 36px !important; }
  .wrap { padding-top: 6px; }
  .app { margin-top: 0; }
  .panel { gap: 5px; padding: 6px 8px; }
  .machines { flex-direction: row; gap: 5px; }
  .mach { flex: 1 1 0; min-height: 44px; font-size: 0.85rem; padding: 0.1rem; }
  .crank { width: 92px; height: 92px; }
  .throttle .track { width: 48px; height: 80px; }
  .start { min-height: 48px; font-size: 1.1rem; }
  .drivecol .btn { min-height: 44px; }
  .gate { padding: 4px; }
  .gate .btn { min-height: 40px; font-size: 1.1rem; }
}
@media (max-width: 480px) {
  header h1 { font-size: 1.15rem; }
  .homebtn span { display: none; }
  .homebtn { padding: 2px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .hint.go { animation: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Engine Room</h1>
    <div class="hdr-right">
      <a class="homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg><span>Home</span></a>
      <button class="btn" id="timerbtn" style="min-height:44px;font-size:1rem;padding:0.1rem 0.8rem;white-space:nowrap">⏱ Grown-ups</button>
    </div>
  </header>

  <main class="app">
    <div class="stage">
      <div class="scene" id="scene">
        <canvas id="cv" aria-label="A machine with moving parts"></canvas>
        <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
        <div class="hint" id="hint" hidden></div>
        <div class="slowtag" id="slowTag" hidden>Slow motion</div>
        <button class="btn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls">Big</button>
      </div>
    </div>

    <div class="panel">
      <div class="ctrl machines">
        <button class="btn mach" data-mach="car" aria-pressed="true">Car engine</button>
        <button class="btn mach" data-mach="steam" aria-pressed="false">Steam engine</button>
        <button class="btn mach" data-mach="gear" aria-pressed="false">Gearbox</button>
        <button class="btn mach" data-mach="jet" aria-pressed="false">Jet engine</button>
      </div>
      <div class="drive">
        <div class="crank" id="crank" role="slider" aria-label="Crank: turn it by hand" tabindex="0">
          <svg viewBox="-60 -60 120 120" aria-hidden="true">
            <circle r="55" fill="#E6EEF8" stroke="#1D2340" stroke-width="4"/>
            <circle r="44" fill="none" stroke="#1D2340" stroke-width="2" stroke-dasharray="4 8" opacity="0.5"/>
            <g id="crankArm">
              <rect x="-9" y="-44" width="18" height="52" rx="9" fill="#E63946" stroke="#1D2340" stroke-width="4"/>
              <circle cy="-38" r="15" fill="#FFC93C" stroke="#1D2340" stroke-width="4"/>
            </g>
            <circle r="9" fill="#1D2340"/>
          </svg>
        </div>
        <div class="drivecol">
          <button class="btn start" id="startBtn">Start</button>
          <button class="btn" id="slowBtn" aria-pressed="false">Slow-mo</button>
        </div>
        <div class="throttle" id="throttle" role="slider" aria-label="Throttle" aria-valuemin="0" aria-valuemax="100" tabindex="0">
          <div class="track"><div class="tfill" id="tfill"></div><div class="knob" id="tknob"></div></div>
          <span>Throttle</span>
        </div>
      </div>
      <div class="gate" id="gate" hidden>
        <button class="btn" data-gear="0">N</button>
        <button class="btn" data-gear="1">1</button>
        <button class="btn" data-gear="2">2</button>
        <button class="btn" data-gear="3">3</button>
        <button class="btn" data-gear="4">4</button>
      </div>
      <div class="gate jetrow" id="jetRow" hidden>
        <button class="btn abbtn" id="abBtn" aria-pressed="false">Afterburner</button>
      </div>
    </div>
  </main>

</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function mod(a, n) { return ((a % n) + n) % n; }
  var TAU = Math.PI * 2, PI = Math.PI;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var INK = "#1D2340", LW = 5, SLOW = 0.125;

  // ---------- Machines ----------
  // Each machine has its own world box (drawn in world units, fitted to the canvas),
  // a pivot used when you drag on the picture to turn it, and a speed range for the throttle.
  var MACH = {
    car: { W: 1000, H: 730, pivot: [230, 560], minRpm: 60, maxRpm: 360 },
    steam: { W: 1000, H: 640, pivot: [800, 430], minRpm: 20, maxRpm: 150 },
    gear: { W: 1200, H: 600, pivot: [85, 230], minRpm: 60, maxRpm: 360 },
    jet: { W: 1330, H: 560, pivot: [160, 280], minRpm: 50, maxRpm: 220 }
  };
  // Gearbox: four gear pairs on the same two shafts (teeth add up to 54, so they all share one spacing).
  var PAIRS = [
    { n: "1st", a: 12, b: 42, x: 307, col: "#E63946" },
    { n: "2nd", a: 18, b: 36, x: 554, col: "#F77F00" },
    { n: "3rd", a: 22, b: 32, x: 773, col: "#2E9E5B" },
    { n: "4th", a: 27, b: 27, x: 960, col: "#3A86FF" }
  ];
  var GY1 = 230, GY2 = 380, GMOD = 300 / 54;
  function gR(T) { return T * GMOD / 2; }
  // Car engine: cylinders 1-4 left to right; firing order 1-3-4-2 over two turns (720°).
  var CX = [380, 520, 660, 800], OFF = [0, 3 * PI, PI, 2 * PI];
  var CYC = 560, CR = 45, CL = 150;

  // ---------- State ----------
  var KEY = "engineroom-state-v1";
  var st = { machine: "car", throttle: 0.35, slow: false, gear: 1, ab: false };
  try {
    var so = JSON.parse(localStorage.getItem(KEY) || "null");
    if (so && typeof so === "object") {
      if (MACH[so.machine]) st.machine = so.machine;
      if (typeof so.throttle === "number") st.throttle = clamp(so.throttle, 0, 1);
      if (typeof so.slow === "boolean") st.slow = so.slow;
      if (typeof so.ab === "boolean") st.ab = so.ab;
      if (typeof so.gear === "number" && so.gear >= 0 && so.gear <= 4) st.gear = Math.round(so.gear);
    }
  } catch (e) { /* defaults */ }
  function saveState() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* ignore */ } }

  var eng = { th: 0, w: 0, running: false, prevTh: 0, fc: [0, 0, 0, 0], pc: 0, drag: 0, dragAcc: 0 };
  var flash = [0, 0, 0, 0], lastFire = -1, firePulse = 0;
  var gov = 0.3, psi = 0, wOut = 0, collarX = PAIRS[0].x, roadOff = 0, needle = 0;
  var fx = [], rings = [], picks = [], parts = [];
  var ending = false, now = 0, lastT = 0;
  function resetCounters() {
    for (var k = 0; k < 4; k++) eng.fc[k] = Math.floor((eng.th - OFF[k]) / (2 * TAU));
    eng.pc = Math.floor(eng.th / PI);
    eng.prevTh = eng.th;
  }
  resetCounters();

  // ---------- Canvas ----------
  var cv = $("cv"), ctx = cv.getContext("2d"), scene = $("scene");
  var CW = 1, CH = 1, DPR = 1, S = 1, OX = 0, OY = 0;
  function resize() {
    var r = scene.getBoundingClientRect(), m = MACH[st.machine];
    CW = Math.max(1, r.width - 6); CH = Math.max(1, r.height - 6);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
    S = Math.min(CW / m.W, CH / m.H) * 0.97;
    OX = (CW - m.W * S) / 2; OY = (CH - m.H * S) / 2;
  }
  window.addEventListener("resize", resize);
  function toWorld(cx, cy) {
    var r = cv.getBoundingClientRect();
    return { x: (cx - r.left - OX) / S, y: (cy - r.top - OY) / S };
  }

  // ---------- Drawing helpers (world units) ----------
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fs(fill, lw) { if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (lw !== 0) { ctx.lineWidth = lw || LW; ctx.strokeStyle = INK; ctx.stroke(); } }
  function box(x, y, w, h, r, fill, lw) { rr(x, y, w, h, r); fs(fill, lw); }
  function disc(x, y, r, fill, lw) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); fs(fill, lw); }
  function bar(x1, y1, x2, y2, w, fill) {
    var a = Math.atan2(y2 - y1, x2 - x1), len = Math.hypot(x2 - x1, y2 - y1);
    ctx.save(); ctx.translate(x1, y1); ctx.rotate(a); rr(-w / 2, -w / 2, len + w, w, w / 2); fs(fill); ctx.restore();
  }
  function part(id, name, shape) { shape.id = id; shape.name = name; parts.push(shape); }
  function pc(id, name, x, y, r) { part(id, name, { t: "c", x: x, y: y, r: r }); }
  function pr(id, name, x, y, w, h) { part(id, name, { t: "r", x: x, y: y, w: w, h: h }); }
  function pb(id, name, x1, y1, x2, y2, w) { part(id, name, { t: "s", x1: x1, y1: y1, x2: x2, y2: y2, w: w }); }
  function hitShape(p, x, y) {
    if (p.t === "c") return Math.hypot(x - p.x, y - p.y) <= p.r;
    if (p.t === "r") return x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h;
    var dx = p.x2 - p.x1, dy = p.y2 - p.y1, L2 = dx * dx + dy * dy || 1;
    var t = clamp(((x - p.x1) * dx + (y - p.y1) * dy) / L2, 0, 1);
    return Math.hypot(x - (p.x1 + t * dx), y - (p.y1 + t * dy)) <= p.w / 2 + 6;
  }
  function gearPath(cx, cy, r, T, ang) {
    var m = 2 * r / T, ro = r + m, ri = r - 1.25 * m, per = TAU / T;
    ctx.beginPath();
    for (var i = 0; i < T; i++) {
      var a0 = ang + i * per;
      var pts = [[a0 - 0.3 * per, ri], [a0 - 0.15 * per, ro], [a0 + 0.15 * per, ro], [a0 + 0.3 * per, ri]];
      for (var j = 0; j < 4; j++) {
        var px = cx + Math.cos(pts[j][0]) * pts[j][1], py = cy + Math.sin(pts[j][0]) * pts[j][1];
        if (i === 0 && j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
    }
    ctx.closePath();
  }
  function spokes(cx, cy, r, n, ang, w, col) {
    ctx.save(); ctx.lineCap = "round";
    for (var i = 0; i < n; i++) {
      var a = ang + i * TAU / n;
      ctx.strokeStyle = INK; ctx.lineWidth = w + LW * 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke();
      ctx.strokeStyle = col; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke();
    }
    ctx.restore();
  }

    ctx.strokeStyle = "rgba(29,35,64,0.06)"; ctx.lineWidth = 1;
    for (var gx = 0; gx < CW; gx += 32) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, CH); ctx.stroke(); }
    for (var gy = 0; gy < CH; gy += 32) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(CW, gy); ctx.stroke(); }
    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
    ctx.lineJoin = "round";
    parts = [];
    if (st.machine === "car") drawCar(); else if (st.machine === "steam") drawSteam(); else if (st.machine === "jet") drawJet(); else drawGearbox();
    fx.forEach(function (q) {
      var f = q.life / q.max;
      ctx.globalAlpha = q.smoke ? 0.85 * (1 - f) : 1 - f;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fillStyle = q.col; ctx.fill();
      if (q.smoke) { ctx.lineWidth = 3; ctx.strokeStyle = "rgba(29,35,64,0.35)"; ctx.stroke(); }
    });
    ctx.globalAlpha = 1;
    rings.forEach(function (q) {
      var f = q.life / 0.6;
      ctx.globalAlpha = 1 - f; ctx.lineWidth = 8; ctx.strokeStyle = "#FFC93C";
      ctx.beginPath(); ctx.arc(q.x, q.y, 20 + 90 * f, 0, TAU); ctx.stroke();
    });
    ctx.globalAlpha = 1;
    // Highlights for tapped parts, with their names.
    picks.forEach(function (pk) {
      var p = null;
      for (var i = 0; i < parts.length; i++) if (parts[i].id === pk.id) { p = parts[i]; break; }
      if (!p) return;
      var pulse = 0.6 + 0.4 * Math.sin(now / 120);
      ctx.save(); ctx.lineWidth = 10; ctx.strokeStyle = "rgba(255,201,60," + pulse + ")";
      ctx.setLineDash([]);
      var lx, ly;
      if (p.t === "c") { ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 6, 0, TAU); ctx.stroke(); lx = p.x; ly = p.y - p.r - 10; }
      else if (p.t === "r") { rr(p.x - 6, p.y - 6, p.w + 12, p.h + 12, 12); ctx.stroke(); lx = p.x + p.w / 2; ly = p.y - 10; }
      else { ctx.lineCap = "round"; ctx.lineWidth = p.w + 14; ctx.strokeStyle = "rgba(255,201,60," + (pulse * 0.6) + ")"; ctx.beginPath(); ctx.moveTo(p.x1, p.y1); ctx.lineTo(p.x2, p.y2); ctx.stroke(); lx = (p.x1 + p.x2) / 2; ly = Math.min(p.y1, p.y2) - p.w / 2 - 10; }
      ctx.restore();
      pk.lx = lx; pk.ly = ly; pk.name = p.name;
    });
    // Name tags drawn in screen pixels so they stay readable on a phone.
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    picks.forEach(function (pk) {
      if (pk.lx == null) return;
      var size = clamp(Math.min(CW, CH) * 0.045, 18, 30);
      ctx.font = "800 " + size + "px \"Baloo 2\", \"Trebuchet MS\", sans-serif";
      var w = ctx.measureText(pk.name).width + size * 1.2, h = size * 1.6;
      var x = clamp(OX + pk.lx * S - w / 2, 6, CW - w - 6), y = clamp(OY + pk.ly * S - h, 6, CH - h - 6);
      rr(x, y, w, h, h / 2); ctx.fillStyle = "#FFFFFF"; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
      label(pk.name, x + w / 2, y + h / 2 + 1, size, INK);
    });
    drawTach();
    var ang = eng.th * 180 / PI;
    $("crankArm").setAttribute("transform", "rotate(" + (ang % 360).toFixed(1) + ")");
  }
  function loop(t) {
    var dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0.016;
    lastT = t; now = t;
    step(dt);
    draw();
    // Ending: tell the shared timer once the engine has wound down to a stop.
    if (endingDone && Toybox.timer.phase() === "ending" && Math.abs(eng.w) < 0.05) { endingDone(); endingDone = null; }
    requestAnimationFrame(loop);
  }

  // ---------- Hint ----------
  var hintTimer = null;
  function hint(text, ms) {
    var el = $("hint");
    el.textContent = text; el.hidden = false;
    el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { el.hidden = true; }, ms || 2600);
  }

  // ---------- Input: drag the picture to turn it, tap a part to see its name ----------
  var ptrs = {};
  function angleAt(p) { var m = MACH[st.machine]; return Math.atan2(p.y - m.pivot[1], p.x - m.pivot[0]); }
  function wrapA(a) { return Math.atan2(Math.sin(a), Math.cos(a)); }
  cv.addEventListener("pointerdown", function (e) {
    if (ending) return;
    e.preventDefault();     try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    var w = toWorld(e.clientX, e.clientY);
    ptrs[e.pointerId] = { sx: e.clientX, sy: e.clientY, a: angleAt(w), crank: false };
  });
  cv.addEventListener("pointermove", function (e) {
    var p = ptrs[e.pointerId];
    if (!p || ending) return;
    var w = toWorld(e.clientX, e.clientY);
    if (!p.crank && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 12 && !anyCrank()) { p.crank = true; eng.drag++; p.a = angleAt(w); }
    if (p.crank) { var a = angleAt(w), d = wrapA(a - p.a); p.a = a; turnBy(d); }
  });
  function anyCrank() { for (var k in ptrs) if (ptrs[k].crank) return true; return false; }
  function endPtr(e) {
    var p = ptrs[e.pointerId];
    if (!p) return;
    delete ptrs[e.pointerId];
    if (p.crank) { eng.drag = Math.max(0, eng.drag - 1); return; }
    if (e.type === "pointercancel" || ending) return;
    tapAt(toWorld(e.clientX, e.clientY));
  }
  cv.addEventListener("pointerup", endPtr);
  cv.addEventListener("pointercancel", endPtr);
  function turnBy(d) { eng.th += d; eng.dragAcc += d; }
  function tapAt(w) {
    rings.push({ x: w.x, y: w.y, life: 0 });
    for (var i = parts.length - 1; i >= 0; i--) {
      if (hitShape(parts[i], w.x, w.y)) {
        var id = parts[i].id;
        picks = picks.filter(function (q) { return q.id !== id; });
        picks.push({ id: id, until: now + 3500 });
        if (picks.length > 3) picks.shift();
        blip();
        return;
      }
    }
    pop();
  }

  // Panel crank
  var crankEl = $("crank"), crankPtr = null, crankA = 0;
  function crankAngle(e) { var r = crankEl.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)); }
  crankEl.addEventListener("pointerdown", function (e) {
    if (ending || crankPtr !== null) return;
    e.preventDefault();     crankPtr = e.pointerId; crankA = crankAngle(e); eng.drag++;
    try { crankEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  crankEl.addEventListener("pointermove", function (e) {
    if (crankPtr !== e.pointerId) return;
    var a = crankAngle(e), d = wrapA(a - crankA); crankA = a; turnBy(d);
  });
  function crankUp(e) { if (crankPtr !== e.pointerId) return; crankPtr = null; eng.drag = Math.max(0, eng.drag - 1); }
  crankEl.addEventListener("pointerup", crankUp);
  crankEl.addEventListener("pointercancel", crankUp);
  crankEl.addEventListener("keydown", function (e) { if (e.key === "ArrowRight" || e.key === "ArrowUp") { eng.th += 0.4; e.preventDefault(); } else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { eng.th -= 0.4; e.preventDefault(); } });

  // Throttle lever
  var thrEl = $("throttle"), thrPtr = null;
  function drawThrottle() {
    var track = thrEl.querySelector(".track"), h = track.clientHeight, kh = $("tknob").offsetHeight;
    $("tfill").style.height = (st.throttle * 100).toFixed(1) + "%";
    $("tknob").style.top = ((1 - st.throttle) * (h - kh)).toFixed(1) + "px";
    thrEl.setAttribute("aria-valuenow", String(Math.round(st.throttle * 100)));
  }
  function thrSet(e) {
    var r = thrEl.querySelector(".track").getBoundingClientRect();
    st.throttle = clamp(1 - (e.clientY - r.top - 12) / Math.max(1, r.height - 24), 0, 1);
    drawThrottle();
  }
  thrEl.addEventListener("pointerdown", function (e) {
    if (ending) return;
    e.preventDefault(); thrPtr = e.pointerId;
    try { thrEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    thrSet(e);
    if (!eng.running) setRunning(true);
  });
  thrEl.addEventListener("pointermove", function (e) { if (thrPtr === e.pointerId) thrSet(e); });
  function thrUp(e) { if (thrPtr === e.pointerId) { thrPtr = null; saveState(); } }
  thrEl.addEventListener("pointerup", thrUp);
  thrEl.addEventListener("pointercancel", thrUp);
  thrEl.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp" || e.key === "ArrowRight") st.throttle = clamp(st.throttle + 0.1, 0, 1);
    else if (e.key === "ArrowDown" || e.key === "ArrowLeft") st.throttle = clamp(st.throttle - 0.1, 0, 1);
    else return;
    e.preventDefault(); drawThrottle(); saveState();
  });

  function setRunning(on) {
    eng.running = !!on;
    var b = $("startBtn");
    b.textContent = on ? "Stop" : "Start";
    b.classList.toggle("on", !!on);
    if (on) {
      var m = MACH[st.machine];
      rings.push({ x: m.pivot[0], y: m.pivot[1], life: 0 });
      if (Math.abs(eng.w) < 2) eng.w = Math.max(eng.w, 2);
      vroom();
    }
    jetPhase();
  }
  // Jet: Start runs the starter first (it turns the shaft), then the fuel lights.
  function jetPhase() {
    if (!eng.running || st.machine !== "jet") { jet.phase = "off"; return; }
    if (jet.phase !== "off") return;
    jet.phase = "start";
    jet.t = eng.w > rpmW(MACH.jet.minRpm) * 0.4 ? 0.9 : 0;
    if (!ending) hint("The starter turns the fan…", 1800);
  }
  function setAB(on) {
    st.ab = !!on; saveState();
    $("abBtn").setAttribute("aria-pressed", String(st.ab));
    if (st.ab && !eng.running) setRunning(true);
    if (st.ab) { rings.push({ x: 1080, y: JCY, life: 0 }); tone(140, 0.6, 0.05, "triangle", 70); } else blip();
  }
  function setMachine(name) {
    st.machine = name; saveState();
    Array.prototype.forEach.call(document.querySelectorAll("[data-mach]"), function (b) { b.setAttribute("aria-pressed", String(b.dataset.mach === name)); });
    $("gate").hidden = name !== "gear";
    $("jetRow").hidden = name !== "jet";
    picks = []; fx = []; rings = []; jet.p = []; jet.phase = "off"; jet.flame = 0; jet.ab = 0; jet.ign = 0;
    jetPhase();
    resetCounters();
    resize();
  }
  function setGear(g) {
    if (g === st.gear) return;
    st.gear = g; saveState();
    Array.prototype.forEach.call(document.querySelectorAll("[data-gear]"), function (b) { b.setAttribute("aria-pressed", String(Number(b.dataset.gear) === g)); });
    if (g > 0) rings.push({ x: PAIRS[g - 1].x, y: GY2, life: 0 });
    clack();
  }
  function setSlow(on) {
    st.slow = !!on; saveState();
    $("slowBtn").setAttribute("aria-pressed", String(st.slow));
    $("slowTag").hidden = !st.slow;
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.mach && !ending) { setMachine(t.dataset.mach); blip(); }
    else if (t.dataset.gear && !ending) setGear(Number(t.dataset.gear));
    else if (t.id === "startBtn" && !ending) { setRunning(!eng.running); }
    else if (t.id === "slowBtn" && !ending) { setSlow(!st.slow); blip(); }
    else if (t.id === "abBtn" && !ending) { setAB(!st.ab); }
  });
  // Slide a finger along the gear gate to shift.
  $("gate").addEventListener("pointermove", function (e) {
    if (ending || !e.buttons) return;
    var el = document.elementFromPoint(e.clientX, e.clientY);
    if (el && el.dataset && el.dataset.gear) setGear(Number(el.dataset.gear));
  });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { if (!e.target.closest("input")) e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { if (!e.target.closest(".sheet")) e.preventDefault(); }, { passive: false });

  // ---------- Sound (off by default; soft and synthesized) ----------
  // The on/off setting and the AudioContext are shared Toybox-wide (common/toybox.js); the module
  // starts/resumes audio on every touch while sound is on. Engine Room keeps its own master gain.
  var master = null, masterCtx = null, lastSnd = 0;
  function out(ac) {
    if (masterCtx !== ac) { master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination); masterCtx = ac; }
    return master;
  }
  function tone(freq, dur, vol, type, slideTo) {
    var actx = Toybox.sound.ready();
    if (!actx) return;
    var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out(actx));
    o.start(t); o.stop(t + dur + 0.05);
  }
  function limited() { if (now - lastSnd < 45) return true; lastSnd = now; return false; }
  function putt() { if (!limited()) tone(rand(105, 125), 0.09, 0.05, "triangle", 60); }
  function chuff() { if (!limited()) tone(rand(260, 300), 0.22, 0.03, "sine", 110); }
  function blip() { tone(rand(520, 720), 0.14, 0.04, "sine", 880); }
  function pop() { tone(380, 0.12, 0.03, "sine", 620); }
  function clack() { tone(660, 0.06, 0.05, "triangle"); setTimeout(function () { tone(990, 0.08, 0.04, "triangle"); }, 60); }
  function whoosh() { tone(180, 0.7, 0.05, "sine", 520); setTimeout(function () { tone(90, 0.8, 0.04, "triangle", 60); }, 80); }
  function vroom() { tone(90, 0.5, 0.05, "triangle", 220); }
  function chime() { tone(523, 0.4, 0.04); setTimeout(function () { tone(784, 0.6, 0.04); }, 120); }
  // ---------- Play timer hooks (the timer, sheet, toast and rest screen live in common/toybox.js) ----------
  var endingDone = null;
  // The fuel gauge in the picture's corner shows the time left.
  function drawFuel(info) {
    var active = info.phase === "running" || info.phase === "ending";
    $("fuel").hidden = !active;
    if (!active) return;
    var f = info.fraction, fill = $("fuelFill");
    fill.style.width = (f * 100).toFixed(1) + "%";
    fill.style.background = f > 0.5 ? "#2E9E5B" : (f > 0.2 ? "#FFC93C" : "#F77F00");
    $("fuelNum").hidden = !(info.showMinutes && info.phase === "running");
    $("fuelNum").textContent = String(info.minutes);
  }
  function releaseAll() {
    ptrs = {}; crankPtr = null; thrPtr = null; eng.drag = 0; eng.dragAcc = 0;
  }
  // Ending: let go of the crank and turn the engine off; it winds down on its own.
  function onEnding(done) {
    ending = true;
    endingDone = done;
    releaseAll();
    setRunning(false);
    picks = [];
  }
  // Last spin: one more whirl before it stops.
  function goodbyeSpin() {
    eng.w = rpmW(MACH[st.machine].maxRpm * 0.6);
    chime();
  }
  function onRest() { ending = true; endingDone = null; eng.w = 0; wOut = 0; }
  function onWake() { ending = false; endingDone = null; }
  function restSVG() {
    var o = '<svg class="rest-art" viewBox="-50 -50 100 100" aria-hidden="true">';
    o += '<circle cx="34" cy="-36" r="9" fill="#FFF4CC" stroke="#1D2340" stroke-width="2"/><circle cx="38" cy="-39" r="8" fill="#2B3A67"/>';
    // A sleepy engine: block, cylinders, flywheel.
    o += '<rect x="-38" y="-6" width="60" height="38" rx="5" fill="#AEB9C8" stroke="#1D2340" stroke-width="2.5"/>';
    o += '<rect x="-34" y="-20" width="52" height="16" rx="4" fill="#5E6B85" stroke="#1D2340" stroke-width="2.5"/>';
    for (var i = 0; i < 4; i++) o += '<rect x="' + (-32 + i * 12.5) + '" y="0" width="9" height="20" rx="2" fill="#2C3550"/>';
    o += '<circle cx="30" cy="22" r="17" fill="#3B4766" stroke="#1D2340" stroke-width="2.5"/><circle cx="30" cy="22" r="11" fill="#DCEAF7" stroke="#1D2340" stroke-width="2"/>';
    o += '<path d="M30 11v22M19 22h22" stroke="#5C677D" stroke-width="3"/><circle cx="30" cy="22" r="3.5" fill="#E63946" stroke="#1D2340" stroke-width="1.5"/>';
    o += '<rect x="-44" y="32" width="90" height="6" rx="3" fill="#8D99AE" stroke="#1D2340" stroke-width="2"/>';
    o += '<text x="-36" y="-28" font-family="Baloo 2, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">z</text><text x="-26" y="-38" font-family="Baloo 2, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">z</text><text x="-19" y="-45" font-family="Baloo 2, sans-serif" font-weight="800" font-size="7" fill="#FFFFFF">z</text>';
    return o + "</svg>";
  }

  // ---------- Start ----------
  setMachine(st.machine);
  var g0 = st.gear; st.gear = -1; setGear(g0);
  if (g0 > 0) collarX = PAIRS[g0 - 1].x;
  setSlow(st.slow);
  $("abBtn").setAttribute("aria-pressed", String(st.ab));
  drawThrottle();
  // The old Engine Room sound key held "on"/"off"; the shared migration reads "1"/"true", so translate it once.
  try { if (localStorage.getItem("engineroom-sound-v1") === "on") localStorage.setItem("engineroom-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "engine-room",
    grownButton: $("timerbtn"),
    grownLabel: ["⏱ Grown-ups", "⏱ Timer on"],
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the engine winds down and rests, and the controls lock.",
    goodbyeOption: "End with a Last spin button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Last spin",
    farewellDone: "Bye bye, engine!",
    restLine: "The engine is resting.",
    restLine2: "It will be right here next time.",
    restArt: restSVG,
    soundNote: "Soft engine putts. Hold for 2 seconds.",
    legacy: { timer: "engineroom-timer-v1", sound: "engineroom-sound-v1", big: "engineroom-big-v1" },
    onEnding: onEnding,
    onGoodbye: goodbyeSpin,
    onRest: onRest,
    onWake: onWake,
    onBig: function () { resize(); drawThrottle(); },
    onSound: function (on) { if (on) setTimeout(chime, 60); },
    onTimer: drawFuel
  });
  window.addEventListener("resize", drawThrottle);
  setTimeout(function () { if (!eng.running && !eng.w && !Toybox.timer.locked()) hint("Press Start, or turn the crank!", 3500); }, 600);
  requestAnimationFrame(loop);

  // Test hook, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) window.__engine = {
    state: function () { return { machine: st.machine, th: eng.th, w: eng.w, running: eng.running, gear: st.gear, slow: st.slow, throttle: st.throttle, picks: picks.map(function (p) { return p.name; }), psi: psi, wOut: wOut, jet: { phase: jet.phase, flame: jet.flame, ab: jet.ab, air: jet.p.length, hot: jet.p.filter(function (q) { return q.heat > 0.05; }).length } }; },
    toScreen: function (x, y) { var r = cv.getBoundingClientRect(); return { x: r.left + OX + x * S, y: r.top + OY + y * S }; }
  };
})();
</script>
<script>
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline install unavailable */ });
    });
  }
</script>
</body>
</html>
