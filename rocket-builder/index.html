<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rocket Builder</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rocket Builder">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --go: #E63946;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
/* ---------- Stage: the rocket on its launch pad ---------- */
.stage { background: #8FD0F7; }
.stage-inner { height: 100%; display: flex; flex-direction: column; }
.scene {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
  background: #8FD0F7;
  touch-action: none;
  cursor: pointer;
}
#art { display: block; width: 100%; height: 100%; touch-action: none; }
/* Go row: the trip picker next to the green Launch button. */
.launchbar { flex: none; display: flex; justify-content: center; align-items: stretch; gap: 8px; }
/* Trip picker next to Launch: three picture buttons. */
.trips { flex: none; display: flex; gap: 6px; }
.trip {
  width: auto;
  min-width: 62px;
  padding-left: 4px !important;
  padding-right: 4px !important;
  min-height: 60px;
  padding: 3px 2px 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  font-size: 0.9rem;
  line-height: 1.05;
  color: #1D2340;
  background: #FFFFFF;
  border-color: #1D2340;
  box-shadow: 3px 3px 0 #1D2340;
  white-space: nowrap;
}
.trip svg { width: 32px; height: 32px; display: block; flex: none; }
.trip[aria-pressed="true"] { background: var(--accent); outline: 4px solid var(--accent); outline-offset: 2px; }
.launchbar .launch { flex: 1 1 auto; min-width: 0; width: auto; max-width: 560px; }
.launch {
  width: min(100%, 560px);
  min-height: 60px;
  font-size: 1.9rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  line-height: 1;
  color: #FFFFFF;
  background: var(--go);
  border-color: #1D2340;
  box-shadow: 4px 4px 0 #1D2340;
  text-shadow: 2px 2px 0 #1D2340;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.launch:active { box-shadow: 0 0 0 #1D2340; }
.launch svg { width: 1.3em; height: 1.3em; flex: none; }
@media (prefers-reduced-motion: no-preference) {
  .launch { animation: throb 1.6s ease-in-out infinite; }
  .launch:active { animation: none; }
}
@keyframes throb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

/* Builder animations on the SVG rocket. */
.rocket, .spark, .puff { transform-box: fill-box; }
.rocket { transform-origin: 50% 100%; }
.rocket.pop { animation: pop 0.7s cubic-bezier(.3, 1.6, .5, 1); }
.rocket.hop { animation: hop 0.9s ease-out; }
@keyframes pop { 0% { transform: scale(0.9, 1.1); } 45% { transform: scale(1.07, 0.94); } 100% { transform: none; } }
@keyframes hop { 0% { transform: none; } 30% { transform: translateY(-46px) rotate(-3deg); } 62% { transform: translateY(0) scale(1.06, 0.93); } 82% { transform: translateY(-8px) rotate(1deg); } 100% { transform: none; } }
.spark { transform-origin: 50% 50%; animation: spark 0.95s ease-out forwards; }
@keyframes spark { 0% { transform: scale(0) rotate(0deg); opacity: 1; } 45% { transform: scale(1.25) rotate(60deg); opacity: 1; } 100% { transform: scale(0) rotate(120deg); opacity: 0; } }
.puff { transform-origin: 50% 50%; animation: puff 1.2s ease-out forwards; }
@keyframes puff { 0% { transform: scale(0.3); opacity: 0.95; } 100% { transform: scale(2.2); opacity: 0; } }
.night { opacity: 0; transition: opacity 4s ease; }
body.ending .night { opacity: 1; }

/* Play-timer gauge in the corner of the picture. */
.fuel {
  position: absolute;
  top: 8px;
  left: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  pointer-events: none;
}
.fuel[hidden] { display: none; }
.fuel-bar {
  width: clamp(70px, 22vw, 170px);
  height: 18px;
  background: rgba(255, 255, 255, 0.7);
  border: 3px solid #1D2340;
  border-radius: 999px;
  overflow: hidden;
}
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num {
  min-width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  background: #FFFFFF;
  color: #1D2340;
  border: 3px solid #1D2340;
  border-radius: 50%;
  font-size: 1.3rem;
  font-weight: 800;
  line-height: 1;
}
.fuel-num[hidden] { display: none; }

/* ---------- Big mode: the panel goes away, the header stays (Big turns into Back) ---------- */
body.big .tb-panel { display: none; }

/* ---------- Panel: build + colors ---------- */
.tb-panel .panel-body.tb-choices {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0;
  overflow: hidden;
}
.panel-body > [data-pane] { grid-area: 1 / 1; visibility: hidden; margin: 0; min-width: 0; }
.tb-panel[data-tab="build"] [data-pane="build"],
.tb-panel[data-tab="colors"] [data-pane="colors"] { visibility: visible; }
.panel-body section + section { margin-top: 10px; }
.row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  padding-right: 3px;
}
.row .btn {
  flex: 0 0 calc((100% - 12px) / 3);
  min-width: 0;
  min-height: 40px;
  padding: 0.2rem 0.2rem;
  font-size: clamp(0.76rem, 3.5vw, 1rem);
  white-space: nowrap;
  overflow: hidden;
}
.row.four .btn { flex-basis: calc((100% - 18px) / 4); font-size: clamp(0.68rem, 3vw, 1rem); padding: 0.2rem 0.1rem; }
.row.four .dot { width: 11px; height: 11px; margin-right: 3px; border-width: 1.5px; }
.dot {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid #1D2340;
  vertical-align: -2px;
  margin-right: 4px;
}
#buildParts, #colorParts { min-height: 86px; align-content: flex-start; }
/* Phones: one part at a time, picked with arrows (instead of two rows of part buttons). */
.stepper { display: none; align-items: stretch; justify-content: center; gap: 8px; }
.stepper .btn { min-height: 44px; }
.sbtn { flex: none; width: 56px; padding: 0; font-size: 1.9rem; line-height: 1; }
.slabel { flex: 0 1 200px; min-width: 0; font-size: 1.15rem; padding: 0.1rem 0.6rem; white-space: nowrap; }
@media (max-width: 600px), (orientation: landscape) and (max-height: 520px) {
  .stepper { display: flex; }
  #buildParts, #colorParts { display: none; }
  #colorStep { margin-bottom: 2px; }
  .launchbar .launch svg { display: none; }
  .landbar .launch { font-size: 1.6rem; }
  .launchbar .launch { font-size: 1.6rem; padding-left: 0.3rem; padding-right: 0.3rem; }
}
.options {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 6px;
  max-width: 520px;
  margin: 0 auto;
}
.opt {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 5px 2px 3px;
  min-height: 0;
  font-size: clamp(0.7rem, 3.2vw, 0.95rem);
  line-height: 1.15;
  white-space: nowrap;
}
.opt svg { width: 44px; height: 54px; display: block; }
.swatches {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
  margin-top: 8px;
}
.swatch {
  aspect-ratio: 1;
  width: 100%;
  border-radius: 50%;
  border: 3px solid var(--edge);
  cursor: pointer;
  padding: 0;
  font: inherit;
  font-size: 1.1rem;
  font-weight: 800;
  display: grid;
  place-items: center;
  box-shadow: 2px 2px 0 var(--edge);
}
.swatch[aria-pressed="true"] { outline: 5px solid var(--accent); outline-offset: 2px; }
.swatch:focus-visible { outline: 5px solid var(--focus); outline-offset: 2px; }
.tb-tabs .tab[aria-selected="true"] { background: var(--accent); color: #1D2340; }

/* ---------- Timer: the shared toast and ending banner (common/toybox.js) ---------- */
.toast { top: max(12px, env(safe-area-inset-top, 0px)); z-index: 45; font-size: 1.3rem; }
.stage .farewell { position: absolute; bottom: 12px; z-index: 2; }
.stage .farewell p { font-size: 1.25rem; }
/* The rocket's own .opt (part options) must not restyle the sheet's "(optional)" note. */
.sheet .opt { display: inline; padding: 0; font-size: inherit; line-height: inherit; white-space: normal; }
body.ending .panel-body,
body.ending [data-action="surprise"] { pointer-events: none; opacity: 0.4; }
body.ending .launchbar { visibility: hidden; }

/* The minute buttons in the shared sheet: three per row, as before. */
.sheet .row .btn { flex-basis: calc((100% - 12px) / 3); min-height: 48px; font-size: 1rem; }
/* Rest picture: the child's rocket on its pad. */
.rest-art {
  display: block;
  width: min(62vw, 240px, 34vh);
  aspect-ratio: 520 / 660;
  height: auto;
  margin: 0 auto 6px;
  border: 3px solid #1D2340;
  border-radius: 18px;
}

/* ---------- Flight: full-screen launch ---------- */
.flight {
  position: fixed;
  inset: 0;
  z-index: 40;
  overflow: hidden;
  background: #5BB8F0;
  touch-action: none;
  color: #1D2340;
}
.flight[hidden] { display: none; }
/* A goodbye flight that is still in the air when the rest screen comes up finishes on top of it. */
body.resting .flight { z-index: 55; }
#fcv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.pname {
  position: absolute;
  left: 50%;
  top: max(72px, calc(env(safe-area-inset-top, 0px) + 66px));
  transform: translateX(-50%);
  pointer-events: none;
  font-size: clamp(2.4rem, 11vw, 5.6rem);
  font-weight: 800;
  line-height: 1;
  color: #FFC93C;
  -webkit-text-stroke: 0.035em #1D2340;
  text-shadow: 0.05em 0.05em 0 #1D2340;
  white-space: nowrap;
}
.pname[hidden] { display: none; }
.pname.go { animation: namePop 0.7s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes namePop { 0% { transform: translateX(-50%) scale(0.3); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }
.fback {
  position: absolute;
  top: max(10px, env(safe-area-inset-top, 0px));
  left: max(10px, env(safe-area-inset-left, 0px));
  min-height: 48px;
  font-size: 1.05rem;
  padding: 0.2rem 0.9rem;
  color: #1D2340;
  background: #FFFFFF;
  border-color: #1D2340;
  box-shadow: 3px 3px 0 #1D2340;
}
.count {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
}
.count span {
  display: block;
  font-size: min(58vh, 78vw);
  font-weight: 800;
  line-height: 1;
  color: #FFC93C;
  -webkit-text-stroke: 0.03em #1D2340;
  text-shadow: 0.05em 0.05em 0 #1D2340;
  opacity: 0;
}
.count span.lift { font-size: min(22vh, 17vw); color: #FFFFFF; }
.count span.go { animation: countPop 0.75s cubic-bezier(.2, .9, .3, 1) forwards; }
.count span.lift.go { animation: liftPop 1.2s ease-out forwards; }
@keyframes countPop {
  0% { transform: scale(2.4); opacity: 0; }
  22% { transform: scale(0.95); opacity: 1; }
  32% { transform: scale(1.04); opacity: 1; }
  78% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0.55); opacity: 0; }
}
@keyframes liftPop {
  0% { transform: scale(0.3) rotate(-6deg); opacity: 0; }
  20% { transform: scale(1.1) rotate(2deg); opacity: 1; }
  70% { transform: scale(1) rotate(0deg); opacity: 1; }
  100% { transform: scale(1.4) translateY(-30%); opacity: 0; }
}
.banner {
  position: absolute;
  left: 50%;
  top: max(15%, 104px);
  transform: translateX(-50%);
  pointer-events: none;
  background: #FFC93C;
  color: #1D2340;
  border: 4px solid #1D2340;
  border-radius: 22px;
  box-shadow: 5px 5px 0 #1D2340;
  padding: 0.1rem 1.1rem 0.25rem;
  font-size: clamp(1.6rem, 5.6vw, 3.2rem);
  font-weight: 800;
  line-height: 1.15;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.banner[hidden] { display: none; }
.banner.go { animation: bannerPop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bannerPop { 0% { transform: translateX(-50%) scale(0.3); } 100% { transform: translateX(-50%) scale(1); } }
.fhint {
  position: absolute;
  left: 50%;
  bottom: max(16px, env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  pointer-events: none;
  background: rgba(255, 255, 255, 0.93);
  border: 3px solid #1D2340;
  border-radius: 999px;
  padding: 0.1rem 1rem 0.2rem;
  font-size: clamp(1.1rem, 3.6vw, 1.6rem);
  font-weight: 800;
  white-space: nowrap;
  transition: opacity 0.5s ease;
}
.fhint[hidden] { display: none; }
.fhint.fade { opacity: 0; }
.landbar {
  position: absolute;
  left: 50%;
  bottom: max(14px, env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  align-items: stretch;
  width: min(92vw, 560px);
}
.landbar[hidden] { display: none; }
.landbar .launch { flex: 1 1 auto; width: auto; }
.landbar .bbuild { flex: none; font-size: 1.2rem; color: #1D2340; background: #FFFFFF; border-color: #1D2340; box-shadow: 3px 3px 0 #1D2340; }

/* Landscape (phone on its side, tablet, desktop): picture on the left, controls on the right. */
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(56%, 460px); }
  .tb-body .tb-panel .panel-body.tb-choices { align-content: center; }
}

/* Larger screens (tablets, desktop): bigger touch targets, and controls kept to a comfortable width. */
@media (min-width: 744px) and (min-height: 640px) {
  .tb-panel { gap: 12px; }
  .launchbar .btn.tb-go.launch { min-height: 76px; font-size: 2.2rem; }
  .panel-body > [data-pane] { width: 100%; max-width: 560px; justify-self: center; }
  .panel-body section + section { margin-top: 16px; }
  .row { gap: 10px; }
  .row .btn { flex-basis: calc((100% - 20px) / 3); min-height: 56px; font-size: 1.1rem; }
  .row.four .btn { flex-basis: calc((100% - 30px) / 4); font-size: 1.05rem; }
  .row .dot { width: 18px; height: 18px; margin-right: 6px; }
  #buildParts, #colorParts { min-height: 122px; }
  .options { gap: 10px; }
  .opt { font-size: 1.05rem; padding: 7px 4px 5px; }
  .opt svg { width: 76px; height: 94px; }
  .swatches { gap: 10px; margin-top: 12px; }
  .swatch { font-size: 1.4rem; }
  .fuel { top: 12px; left: 12px; }
  .fuel-bar { height: 22px; }
  .fuel-num { min-width: 48px; height: 48px; font-size: 1.5rem; }
  .fback { min-height: 56px; font-size: 1.25rem; }
  .landbar .launch { min-height: 84px; font-size: 2.6rem; }
  .landbar .bbuild { font-size: 1.4rem; padding: 0.4rem 1.4rem; }
  .trips { gap: 10px; }
  .trip { width: 92px; min-height: 76px; font-size: 1.1rem; }
  .trip svg { width: 44px; height: 44px; }
}
@media (min-width: 744px) and (min-height: 640px) and (orientation: landscape) {
  .tb-body .tb-panel { width: min(44%, 520px); }
  .trip { width: 80px; }
  .launchbar .btn.tb-go.launch { font-size: 1.8rem; padding-left: 0.4rem; padding-right: 0.4rem; gap: 6px; }
  .row .btn { min-height: 64px; }
  .opt svg { width: 88px; height: 110px; }
}

/* Short landscape phones: no title, tighter panel. */
@media (orientation: landscape) and (max-height: 520px) {
  .tb-panel { gap: 6px; }
  .launchbar .btn.tb-go.launch { min-height: 52px; font-size: 1.5rem; }
  .trip { min-height: 52px; width: 58px; font-size: 0.82rem; }
  .trip svg { width: 24px; height: 24px; }
  .swatches { gap: 6px; }
  /* vw-based sizes are tuned for portrait; the landscape panel is narrower than the screen width suggests. */
  .row .btn, .row.four .btn { font-size: 0.82rem; }
  .opt { font-size: 0.72rem; }
  .opt svg { width: 40px; height: 48px; }
  .pname { top: 12px; font-size: 2.6rem; }
  .landbar {
    left: auto;
    top: max(10px, env(safe-area-inset-top, 0px));
    bottom: auto;
    right: max(14px, env(safe-area-inset-right, 0px));
    transform: none;
    width: auto;
    flex-direction: column;
    align-items: stretch;
  }
  .landbar .launch { min-height: 56px; font-size: 1.4rem; padding: 0.3rem 1rem; }
  .banner { left: max(14px, env(safe-area-inset-left, 0px)); top: 42%; transform: none; font-size: 1.6rem; }
  .banner.go { animation: bannerPopL 0.45s cubic-bezier(.3, 1.6, .5, 1); }
}
@keyframes bannerPopL { 0% { transform: scale(0.3); } 100% { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  .btn, .tab { transition: none; }
  .rocket.pop, .rocket.hop { animation: none; }
}
/* Tapping a part of the rocket opens its choices: the panel flashes. */
.tb-panel.flash { animation: panelflash 0.9s ease-out; }
@keyframes panelflash { 0% { outline: 6px solid #FFC93C; outline-offset: 2px; } 100% { outline: 6px solid rgba(255, 201, 60, 0); outline-offset: 2px; } }
/* Ghost hand: a see-through hand that shows the main move once (same look as Bulldozer and Measuring). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Rocket Builder</h1>
    <button class="btn tb-iconbtn" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <div class="stage-inner">
        <div class="scene" id="scene">
          <svg id="art" viewBox="-260 -600 520 660" preserveAspectRatio="xMidYMax meet" role="img" aria-label="A rocket on its launch pad"></svg>
          <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
        </div>
      </div>
    </main>

    <section class="tb-panel" data-tab="build">
      <div class="launchbar">
        <div class="trips" role="group" aria-label="Pick a trip">
          <button class="btn trip" data-trip="moon" aria-pressed="false"><svg viewBox="-30 -30 60 60" aria-hidden="true"><circle r="24" fill="#C9D2E3" stroke="#1D2340" stroke-width="4"/><circle cx="-8" cy="-7" r="7" fill="#9AA3AF"/><circle cx="9" cy="8" r="5.5" fill="#9AA3AF"/><circle cx="7" cy="-12" r="3.5" fill="#9AA3AF"/><circle cx="-9" cy="12" r="3" fill="#9AA3AF"/></svg><span>Moon</span></button>
          <button class="btn trip" data-trip="mars" aria-pressed="false"><svg viewBox="-30 -30 60 60" aria-hidden="true"><circle r="24" fill="#D9643A" stroke="#1D2340" stroke-width="4"/><ellipse cx="0" cy="-19" rx="10" ry="3.5" fill="#FFFFFF"/><ellipse cx="-7" cy="3" rx="10" ry="5" fill="#B44A2B"/><ellipse cx="10" cy="11" rx="6" ry="3" fill="#B44A2B"/><ellipse cx="8" cy="-6" rx="5" ry="2.5" fill="#EE9A6A"/></svg><span>Mars</span></button>
          <button class="btn trip" data-trip="planets" aria-pressed="false"><svg viewBox="-34 -30 68 60" aria-hidden="true"><g transform="rotate(-18)"><path d="M -31 0 A 31 9 0 0 1 31 0" fill="none" stroke="#1D2340" stroke-width="9"/><path d="M -31 0 A 31 9 0 0 1 31 0" fill="none" stroke="#FFC93C" stroke-width="4.5"/></g><circle r="17" fill="#F0D58C" stroke="#1D2340" stroke-width="4"/><path d="M -15 -5 H 15 M -14 6 H 14" stroke="#D9B86A" stroke-width="4"/><g transform="rotate(-18)"><path d="M 31 0 A 31 9 0 0 1 -31 0" fill="none" stroke="#1D2340" stroke-width="9"/><path d="M 31 0 A 31 9 0 0 1 -31 0" fill="none" stroke="#FFC93C" stroke-width="4.5"/></g></svg><span>Planets</span></button>
        </div>
        <button class="btn tb-go launch" id="launch"><svg viewBox="-50 -60 100 120" aria-hidden="true"><path d="M0 -55 C 22 -35 24 -5 20 25 L -20 25 C -24 -5 -22 -35 0 -55 Z" fill="#FFFFFF" stroke="#1D2340" stroke-width="7" stroke-linejoin="round"/><circle cy="-12" r="9" fill="#5BC0EB" stroke="#1D2340" stroke-width="6"/><path d="M -20 0 L -40 30 L -20 25 Z M 20 0 L 40 30 L 20 25 Z" fill="#FFC93C" stroke="#1D2340" stroke-width="6" stroke-linejoin="round"/><path d="M -12 30 Q 0 62 12 30 Z" fill="#F77F00" stroke="#1D2340" stroke-width="6" stroke-linejoin="round"/></svg><span>Launch!</span></button>
      </div>
      <div class="tb-choices panel-body">
        <div data-pane="build" id="pane-build" role="tabpanel" aria-labelledby="tab-build">
          <section>
            <div class="row" id="buildParts"></div>
            <div class="stepper" id="buildStep"><button class="btn sbtn" data-step="build" data-dir="-1" aria-label="Previous part">&lsaquo;</button><button class="btn slabel" data-step="build" data-dir="1" id="buildStepLabel">Nose</button><button class="btn sbtn" data-step="build" data-dir="1" aria-label="Next part">&rsaquo;</button></div>
          </section>
          <section>
            <div class="options" id="options"></div>
          </section>
        </div>
        <div data-pane="colors" id="pane-colors" role="tabpanel" aria-labelledby="tab-colors">
          <section>
            <div class="row four" id="colorParts"></div>
            <div class="stepper" id="colorStep"><button class="btn sbtn" data-step="color" data-dir="-1" aria-label="Previous part">&lsaquo;</button><button class="btn slabel" data-step="color" data-dir="1" id="colorStepLabel">Nose</button><button class="btn sbtn" data-step="color" data-dir="1" aria-label="Next part">&rsaquo;</button></div>
            <div class="swatches" id="swatches"></div>
          </section>
        </div>
      </div>
      <nav class="tb-tabs" role="tablist" aria-label="Controls">
        <button class="btn tab" role="tab" id="tab-build" data-tab="build" aria-controls="pane-build">Build</button>
        <button class="btn tab" role="tab" id="tab-colors" data-tab="colors" aria-controls="pane-colors">Colors</button>
        <button class="btn tb-surprise" data-action="surprise">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<!-- Full-screen launch -->
<div class="flight" id="flight" hidden>
  <canvas id="fcv" aria-label="The rocket flying"></canvas>
  <div class="count" aria-live="polite"><span id="countNum"></span></div>
  <div class="pname" id="pname" aria-live="polite" hidden></div>
  <div class="banner" id="banner" hidden></div>
  <div class="fhint" id="fhint" hidden>Tap to boost!</div>
  <button class="btn fback" id="fback">Back</button>
  <div class="landbar" id="landbar" hidden>
    <button class="btn launch" id="again"><span>Launch again!</span></button>
    <button class="btn bbuild" id="fbuild">Build</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var OUT = "#1D2340";
  var KEY = "rocketbuilder-v1";
  // Timer, sound and Big are shared Toybox-wide (common/toybox.js); these old keys carry over once.
  var OLD_TKEY = "rocketbuilder-timer-v1", OLD_SKEY = "rocketbuilder-sound-v1", OLD_BKEY = "rocketbuilder-big-v1";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var PALETTE = [
    ["Red", "#E63946"], ["Orange", "#F77F00"], ["Yellow", "#FFC93C"], ["Lime", "#A7D129"],
    ["Green", "#2E9E5B"], ["Teal", "#1FA6A0"], ["Sky", "#5BC0EB"], ["Blue", "#2D5BD7"],
    ["Purple", "#7B4FC9"], ["Pink", "#F26CA7"], ["Brown", "#8B5A3C"], ["Gray", "#9AA3AF"],
    ["White", "#FFFFFF"], ["Black", "#26282E"]
  ];
  var HEX = {};
  PALETTE.forEach(function (p) { HEX[p[0]] = p[1]; });
  var NAMES = PALETTE.map(function (p) { return p[0]; });
  function hex(name) { return HEX[name] || "#999999"; }
  function rgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function isDark(h) {
    var c = rgb(h);
    return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) < 120;
  }
  // Linear blend of hex color a toward hex color b by fraction t.
  function mix(a, b, t) {
    var x = rgb(a), y = rgb(b);
    return "#" + [0, 1, 2].map(function (k) {
      var v = Math.round(x[k] + (y[k] - x[k]) * t);
      return (v < 16 ? "0" : "") + v.toString(16);
    }).join("");
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function n2(v) { return (Math.round(v * 100) / 100).toString(); }

  // ---------- What can be built ----------
  var BUILD = [
    { id: "nose", label: "Nose", opts: [["pointy", "Pointy"], ["round", "Round"], ["capsule", "Capsule"], ["dome", "Dome"]] },
    { id: "stages", label: "Stages", opts: [[1, "1 stage"], [2, "2 stages"], [3, "3 stages"]] },
    { id: "size", label: "Size", opts: [["short", "Short"], ["medium", "Medium"], ["tall", "Tall"]] },
    { id: "fins", label: "Fins", opts: [["swept", "Swept"], ["big", "Big"], ["round", "Round"], ["zigzag", "Zigzag"]] },
    { id: "windows", label: "Windows", opts: [[0, "None"], [1, "1 window"], [2, "2 windows"], [3, "3 windows"]] },
    { id: "boosters", label: "Boosters", opts: [[0, "None"], [2, "2 boosters"]] }
  ];
  var TRIPS = ["moon", "mars", "planets"];
  var BUILD_BY = {};
  BUILD.forEach(function (b) { BUILD_BY[b.id] = b; });
  var CPARTS = [["nose", "Nose"], ["body", "Body"], ["bands", "Stripes"], ["fins", "Fins"],
    ["windows", "Windows"], ["boosters", "Boosters"], ["flame", "Flame"]];

  function freshState() {
    return {
      nose: "pointy", stages: 2, size: "medium", fins: "swept", windows: 2, boosters: 0,
      colors: { nose: "Red", body: "White", bands: "Blue", fins: "Red", windows: "Sky", boosters: "Gray", flame: "Orange" },
      buildPart: "nose", colorPart: "nose", trip: "moon"
    };
  }
  function validOpt(id, v) {
    return BUILD_BY[id].opts.some(function (o) { return o[0] === v; });
  }
  // Opening Rocket Builder from the Toybox home screen (Toybox.fresh) starts the first-visit rocket,
  // parts tab and trip again; a reload keeps the current build. (Tilt is a grown-up setting, kept.)
  if (window.Toybox && Toybox.fresh()) {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
  }
  function loadState() {
    var s = freshState();
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (o && typeof o === "object") {
        BUILD.forEach(function (b) { if (validOpt(b.id, o[b.id])) s[b.id] = o[b.id]; });
        if (o.colors) Object.keys(s.colors).forEach(function (k) { if (HEX[o.colors[k]]) s.colors[k] = o.colors[k]; });
        if (BUILD_BY[o.buildPart]) s.buildPart = o.buildPart;
        if (CPARTS.some(function (p) { return p[0] === o.colorPart; })) s.colorPart = o.colorPart;
        if (TRIPS.indexOf(o.trip) >= 0) s.trip = o.trip;
      }
    } catch (e) { /* storage unavailable or bad data: use defaults */ }
    return s;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }
  var state = loadState();

  // ---------- Rocket geometry (SVG units; y = 0 is the pad, up is negative) ----------
  var NOZ = 20;   // engine bell height under each stage
  var AD = 16;    // adapter (stripe colored) between stages
  var TOTAL = { short: 190, medium: 250, tall: 320 };
  var FR = { 1: [1], 2: [0.56, 0.44], 3: [0.4, 0.32, 0.28] };
  var WID = { 1: [96], 2: [100, 82], 3: [104, 86, 72] };
  var FIN_S = 56;
  var FIN_REACH = { swept: 1, big: 1.35, round: 1.2, zigzag: 1.1 };

  function rectS(x, y, w, h, fill, extra) {
    return '<rect x="' + n2(x) + '" y="' + n2(y) + '" width="' + n2(w) + '" height="' + n2(h) + '" fill="' + fill + '"' + (extra || "") + "/>";
  }
  var STROKE5 = ' stroke="' + OUT + '" stroke-width="5" stroke-linejoin="round"';

  function bellS(cx, yb, w, h) {
    return '<path d="M ' + n2(cx - 0.21 * w) + " " + n2(yb - 2) + " L " + n2(cx - 0.3 * w) + " " + n2(yb + h) + " L " + n2(cx + 0.3 * w) + " " + n2(yb + h) +
      " L " + n2(cx + 0.21 * w) + " " + n2(yb - 2) + ' Z" fill="#5B6684"' + STROKE5 + "/>" +
      '<path d="M ' + n2(cx - 0.29 * w) + " " + n2(yb + h - 5) + " L " + n2(cx + 0.29 * w) + " " + n2(yb + h - 5) + '" stroke="#9AA3AF" stroke-width="3"/>';
  }
  // A cylinder section with shading: highlight on the left, shadow on the right.
  function tubeS(cx, top, w, h, fill, stripeY, stripe) {
    var x = cx - w / 2, o = "";
    o += rectS(x, top, w, h, fill);
    if (stripe) o += rectS(x, stripeY, w, 12, stripe, ' stroke="' + OUT + '" stroke-width="3"');
    o += rectS(x + w * 0.14, top + 2, w * 0.13, h - 4, "rgba(255,255,255,0.45)");
    o += rectS(x + w * 0.72, top + 2, w * 0.17, h - 4, "rgba(29,35,64,0.13)");
    o += rectS(x, top, w, h, "none", STROKE5 + ' rx="4"');
    return o;
  }
  function windowS(y, r, glass) {
    return '<circle cx="0" cy="' + n2(y) + '" r="' + n2(r + 6) + '" fill="#C9D2E3"' + STROKE5 + "/>" +
      '<circle cx="0" cy="' + n2(y) + '" r="' + n2(r) + '" fill="' + glass + '" stroke="' + OUT + '" stroke-width="3.5"/>' +
      '<ellipse cx="' + n2(-r * 0.32) + '" cy="' + n2(y - r * 0.35) + '" rx="' + n2(r * 0.28) + '" ry="' + n2(r * 0.2) + '" transform="rotate(-35 ' + n2(-r * 0.32) + " " + n2(y - r * 0.35) + ')" fill="rgba(255,255,255,0.8)"/>';
  }

  function noseS(type, w, y0, c) {
    var col = hex(c.nose), o = "", h, top, d;
    if (type === "round") {
      h = 0.8 * w;
      d = "M " + n2(-w / 2) + " " + y0 + " C " + n2(-w / 2) + " " + n2(y0 - 0.72 * h) + " " + n2(-0.27 * w) + " " + n2(y0 - h) + " 0 " + n2(y0 - h) +
        " C " + n2(0.27 * w) + " " + n2(y0 - h) + " " + n2(w / 2) + " " + n2(y0 - 0.72 * h) + " " + n2(w / 2) + " " + y0 + " Z";
      o += '<path d="' + d + '" fill="' + col + '"' + STROKE5 + "/>";
      o += '<ellipse cx="' + n2(-0.22 * w) + '" cy="' + n2(y0 - 0.45 * h) + '" rx="' + n2(0.07 * w) + '" ry="' + n2(0.22 * h) + '" fill="rgba(255,255,255,0.45)"/>';
      top = y0 - h;
    } else if (type === "capsule") {
      h = 0.62 * w;
      var tw = 0.2 * w;
      d = "M " + n2(-w / 2) + " " + y0 + " L " + n2(-tw) + " " + n2(y0 - h + 8) + " Q " + n2(-tw) + " " + n2(y0 - h) + " " + n2(-tw + 8) + " " + n2(y0 - h) +
        " L " + n2(tw - 8) + " " + n2(y0 - h) + " Q " + n2(tw) + " " + n2(y0 - h) + " " + n2(tw) + " " + n2(y0 - h + 8) + " L " + n2(w / 2) + " " + y0 + " Z";
      o += '<line x1="0" y1="' + n2(y0 - h) + '" x2="0" y2="' + n2(y0 - h - 32) + '" stroke="' + OUT + '" stroke-width="10" stroke-linecap="round"/>';
      o += '<line x1="0" y1="' + n2(y0 - h) + '" x2="0" y2="' + n2(y0 - h - 32) + '" stroke="#C9D2E3" stroke-width="4" stroke-linecap="round"/>';
      o += '<circle cx="0" cy="' + n2(y0 - h - 36) + '" r="8" fill="' + hex(c.bands) + '"' + STROKE5 + "/>";
      o += '<path d="' + d + '" fill="' + col + '"' + STROKE5 + "/>";
      o += '<path d="M ' + n2(-0.33 * w) + " " + n2(y0 - 4) + " L " + n2(-0.17 * w) + " " + n2(y0 - h + 10) + '" stroke="rgba(255,255,255,0.5)" stroke-width="' + n2(0.07 * w) + '" stroke-linecap="round"/>';
      top = y0 - h - 44;
    } else if (type === "dome") {
      var R = w / 2 - 3;
      var glass = mix(hex(c.windows), "#FFFFFF", 0.45);
      o += '<path d="M ' + n2(-R) + " " + n2(y0 - 10) + " A " + n2(R) + " " + n2(R) + " 0 0 1 " + n2(R) + " " + n2(y0 - 10) + ' Z" fill="' + glass + '"' + STROKE5 + "/>";
      // a little star inside the glass
      o += '<path d="' + starD(0, y0 - 10 - R * 0.45, R * 0.36, R * 0.16, 5) + '" fill="#FFC93C" stroke="' + OUT + '" stroke-width="3" stroke-linejoin="round"/>';
      o += '<path d="M ' + n2(-R * 0.62) + " " + n2(y0 - 10 - R * 0.35) + " A " + n2(R * 0.72) + " " + n2(R * 0.72) + " 0 0 1 " + n2(-R * 0.15) + " " + n2(y0 - 10 - R * 0.85) + '" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="6" stroke-linecap="round"/>';
      o += rectS(-w / 2, y0 - 14, w, 16, col, STROKE5 + ' rx="5"');
      top = y0 - 10 - R;
    } else {
      h = 1.25 * w;
      d = "M " + n2(-w / 2) + " " + y0 + " C " + n2(-w / 2) + " " + n2(y0 - 0.45 * h) + " " + n2(-0.2 * w) + " " + n2(y0 - 0.85 * h) + " 0 " + n2(y0 - h) +
        " C " + n2(0.2 * w) + " " + n2(y0 - 0.85 * h) + " " + n2(w / 2) + " " + n2(y0 - 0.45 * h) + " " + n2(w / 2) + " " + y0 + " Z";
      o += '<path d="' + d + '" fill="' + col + '"' + STROKE5 + "/>";
      o += '<path d="M ' + n2(-0.3 * w) + " " + n2(y0 - 6) + " Q " + n2(-0.28 * w) + " " + n2(y0 - 0.5 * h) + " " + n2(-0.08 * w) + " " + n2(y0 - 0.82 * h) + '" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="' + n2(0.07 * w) + '" stroke-linecap="round"/>';
      top = y0 - h;
    }
    return { svg: o, top: top };
  }

  function starD(cx, cy, R, r, n) {
    var d = "", k, a, rr;
    for (k = 0; k < n * 2; k++) {
      a = k * Math.PI / n;
      rr = k % 2 ? r : R;
      d += (k ? " L " : "M ") + n2(cx + rr * Math.sin(a)) + " " + n2(cy - rr * Math.cos(a));
    }
    return d + " Z";
  }

  function finD(style, x0, yb, L, S) {
    if (style === "big") {
      return "M " + n2(x0) + " " + n2(yb - 1.25 * L) + " L " + n2(x0 + 1.35 * S) + " -6 L " + n2(x0 + 1.35 * S) + " 0 L " + n2(x0) + " 0 Z";
    }
    if (style === "round") {
      return "M " + n2(x0) + " " + n2(yb - L) + " C " + n2(x0 + 1.25 * S) + " " + n2(yb - 0.9 * L) + " " + n2(x0 + 1.2 * S) + " 0 " + n2(x0 + 0.55 * S) + " 0 L " + n2(x0) + " 0 Z";
    }
    if (style === "zigzag") {
      return "M " + n2(x0) + " " + n2(yb - L) + " L " + n2(x0 + 0.75 * S) + " " + n2(yb - 0.62 * L) + " L " + n2(x0 + 0.42 * S) + " " + n2(yb - 0.38 * L) +
        " L " + n2(x0 + 1.1 * S) + " 0 L " + n2(x0 + 0.2 * S) + " 0 L " + n2(x0) + " " + n2(yb) + " Z";
    }
    return "M " + n2(x0) + " " + n2(yb - L) + " L " + n2(x0 + S) + " -12 L " + n2(x0 + S) + " 0 L " + n2(x0 + 0.25 * S) + " 0 L " + n2(x0) + " " + n2(yb) + " Z";
  }

  // Builds the rocket as drawing layers. Each layer belongs to a group that moves as one piece in flight:
  // stage index (0 = bottom), or "bL"/"bR" for the side boosters. Layers are listed back to front.
  function geo(cfg) {
    var c = cfg.colors, n = cfg.stages, total = TOTAL[cfg.size];
    var st = [], y = -NOZ, i, k, h;
    for (i = 0; i < n; i++) {
      h = total * FR[n][i];
      st.push({ i: i, w: WID[n][i], yb: y, yt: y - h, top: i === n - 1 });
      y -= h;
    }
    st.forEach(function (s) { s.bodyTop = s.top ? s.yt : s.yt + AD; s.exit = s.yb + NOZ; });
    var T = st[n - 1];
    var nose = noseS(cfg.nose, T.w, T.yt, c);

    // Windows: a column of portholes from the top down, each belonging to the stage it sits on.
    var r = 14, wins = [], wy = T.bodyTop + r + 16, si = n - 1;
    for (k = 0; k < cfg.windows && si >= 0; k++) {
      while (si >= 0 && wy > st[si].yb - 30 - r) {
        si--;
        if (si >= 0) wy = Math.max(wy, st[si].bodyTop + r + 12);
      }
      if (si < 0) break;
      if (wy < st[si].bodyTop + r + 10) wy = st[si].bodyTop + r + 10;
      if (wy > st[si].yb - 30 - r) { k--; continue; }
      wins.push({ y: wy, s: si });
      wy += 2 * r + 16;
    }
    var glass = hex(c.windows);

    var s0 = st[0];
    var h0 = s0.yb - s0.bodyTop;
    var L = clamp(h0 * 0.75, 44, 92);
    var x0 = s0.w / 2 - 3;
    var reach = FIN_S * FIN_REACH[cfg.fins];
    var bw = Math.max(28, 0.32 * s0.w);
    var bh = clamp(h0 * 0.85, 80, 170);
    var bcx = s0.w / 2 + bw / 2 - 6;

    var layers = [];
    for (i = n - 1; i >= 0; i--) {
      var s = st[i];
      if (i === 0) {
        var fd = finD(cfg.fins, x0, s0.yb, L, FIN_S);
        var finTop = s0.yb - (cfg.fins === "big" ? 1.25 : 1) * L;
        layers.push({
          group: "0",
          svg: '<path d="' + fd + '" transform="scale(-1 1)" fill="' + hex(c.fins) + '"' + STROKE5 + "/>" +
            '<path d="' + fd + '" fill="' + hex(c.fins) + '"' + STROKE5 + "/>",
          bbox: [-(x0 + reach) - 8, finTop - 8, x0 + reach + 8, 8]
        });
        if (cfg.boosters) {
          [-1, 1].forEach(function (side) {
            var cx = side * bcx, btop = s0.yb - bh, ch = bw * 1.25, o = "";
            o += bellS(cx, s0.yb, bw * 1.4, NOZ * 0.75);
            o += tubeS(cx, btop, bw, bh, hex(c.boosters), btop + 14, hex(c.bands));
            o += '<path d="M ' + n2(cx - bw / 2) + " " + n2(btop) + " Q " + n2(cx - bw / 2) + " " + n2(btop - ch * 0.7) + " " + n2(cx) + " " + n2(btop - ch) +
              " Q " + n2(cx + bw / 2) + " " + n2(btop - ch * 0.7) + " " + n2(cx + bw / 2) + " " + n2(btop) + ' Z" fill="' + hex(c.nose) + '"' + STROKE5 + "/>";
            layers.push({
              group: side < 0 ? "bL" : "bR",
              svg: o,
              bbox: [cx - bw * 0.7 - 6, btop - ch - 8, cx + bw * 0.7 + 6, s0.yb + NOZ + 8]
            });
          });
        }
      }
      var o2 = bellS(0, s.yb, s.w, NOZ);
      o2 += tubeS(0, s.bodyTop, s.w, s.yb - s.bodyTop, hex(c.body), s.yb - 28, hex(c.bands));

  // ---------- Ghost hand (same look as Bulldozer and Measuring) ----------
  // After a few quiet seconds, a see-through hand shows the main move once. A touch re-arms it, it shows
  // at most twice per visit, and never again once the child has done the move (ghost.learned()).
  // plan() returns { pts: [[x, y], ...] in page px, tap: true for a tap, carry: { html, size } for a see-through

  function makeGhost(plan, opt) {

      el.innerHTML = '<svg viewBox="-24 -18 64 84"><circle class="gh-press" cx="0" cy="0" r="17" fill="rgba(255,201,60,0.55)"/>' +
        '<g fill="#FFFFFF" stroke="#1D2340" stroke-width="3" stroke-linejoin="round">' +
        '<rect x="-9" y="-6" width="18" height="40" rx="9"/><rect x="-12" y="22" width="44" height="40" rx="16"/>' +
        '<rect x="10" y="14" width="14" height="24" rx="7"/></g>' +
        '<circle cx="0" cy="2" r="5" fill="rgba(255,201,60,0.9)"/></svg>';
      el.insertBefore(carryEl, el.firstChild);
      document.body.appendChild(el);
    }
    function stop() { run = null; if (el) { el.style.display = "none"; carryEl.innerHTML = ""; } }

    carryEl.className = "gh-carry";
    function poke() { last = Date.now(); armed = true; if (run) stop(); }
    document.addEventListener("pointerdown", poke, true);
    document.addEventListener("keydown", poke, true);
    function blocked() {
      if (document.hidden) return true;
      if (window.Toybox && (Toybox.sheetOpen() || Toybox.timer.phase() === "ending" || Toybox.timer.phase() === "resting")) return true;
      return !!(opt.ok && !opt.ok());
    }
    function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function at(pts, f) {
      if (pts.length < 2) return pts[0];
      var segs = [], tot = 0, i;
      for (i = 1; i < pts.length; i++) { var l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); tot += l; }
      var d = f * tot;
      for (i = 0; i < segs.length; i++) {
        if (d <= segs[i] || i === segs.length - 1) { var t = segs[i] ? Math.min(1, d / segs[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; }
        d -= segs[i];
      }
      return pts[pts.length - 1];
    }
    function frame() {
      if (!run) return;
      var t = (Date.now() - run.t0) / run.dur, p = run.p, s = run.s, x, y, a, press, sc = 1;
      if (t >= 1) { stop(); return; }
      if (p.tap || p.pts.length < 2) {
        var pt = p.pts[0];
        x = pt[0]; y = pt[1];
        a = t < 0.15 ? t / 0.15 : (t > 0.85 ? (1 - t) / 0.15 : 1);
        press = (t > 0.3 && t < 0.42) || (t > 0.55 && t < 0.67);
        sc = press ? 0.92 : 1;
        if (t < 0.3) { var k = 1 - t / 0.3; x += 26 * s * k; y += 30 * s * k; }
      } else {
        a = t < 0.1 ? t / 0.1 : (t > 0.9 ? (1 - t) / 0.1 : 1);
        var f = reduce ? 0.5 : ease(Math.max(0, Math.min(1, (t - 0.16) / 0.66)));
        var q = at(p.pts, f); x = q[0]; y = q[1];
        press = t > 0.12 && t < 0.86;
        sc = t < 0.12 ? 1.12 - 0.12 * (t / 0.12) : 1;
      }
      el.style.opacity = (0.85 * a).toFixed(3);
      el.style.transform = "translate(" + (x - 24 * s) + "px," + (y - 18 * s) + "px) rotate(-14deg) scale(" + sc + ")";
      el.lastChild.firstChild.style.opacity = press ? "1" : "0";
      carryEl.style.opacity = press ? "0.75" : "0";
      requestAnimationFrame(frame);
    }
    function show(p) {
      if (!el) build();
      var s = Math.max(1, Math.min(1.7, Math.min(innerWidth, innerHeight) / 360));
      el.style.width = (64 * s) + "px"; el.style.height = (84 * s) + "px";

      if (p.carry) {
        var c = p.carry.size;

      }
      run = { p: p, s: s, t0: Date.now(), dur: p.dur || (p.tap ? 2400 : 3200) };

    }

      if (run || learned || !armed || shown >= MAX || Date.now() - last < IDLE) return;
      if (blocked()) { last = Date.now(); return; }
      var p = plan();
      if (!p || !p.pts || !p.pts.length) return;
      armed = false; shown++;
      show(p);
    }, 250);
    return {
      learned: function () { learned = true; stop(); },
      // something new to show (a new mode): allow the hint again
      again: function () { learned = false; shown = 0; armed = true; last = Date.now(); },
      poke: poke,
      // test hook: show it now
      show: function () { var p = plan(); if (p) show(p); return !!p; }

  }

  document.addEventListener("click", function (e) {

        p.vx *= Math.exp(-dt * 2.5);
        p.vy *= Math.exp(-dt * 2.5);
        p.vy += H * 0.25 * dt;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.r = Math.max(0.5, p.r + p.gr * dt);
      // Exhaust hitting the pad spreads out sideways.
      if (!fl.space && (p.kind === 0 || p.kind === 1) && p.y > padY - 2 && p.vy > 0) {
        p.y = padY - 2;
        p.vx = (p.x < W / 2 + fl.x ? -1 : 1) * Math.max(Math.abs(p.vx), H * rand(0.4, 1.0));
        p.vy = -Math.abs(p.vy) * 0.08;
      }
    }
  }

  // ---- separation ----
  function separate(plan) {
    var groups = plan.kind === "boosters" ? ["bL", "bR"] : [String(plan.idx)];
    var o = rocketOrigin();
    groups.forEach(function (gid) {
      fl.groups[gid].on = false;
      var ls = [];
      layerList.forEach(function (l) { if (l.group === gid) ls.push(l); });
      var piv;
      if (gid === "bL" || gid === "bR") piv = { x: (gid === "bL" ? -1 : 1) * G.booster.cx, y: G.stages[0].yb - 60 };
      else { var s = G.stages[plan.idx]; piv = { x: 0, y: (s.yb + s.yt) / 2 }; }
      var side = gid === "bL" ? -1 : gid === "bR" ? 1 : (Math.random() < 0.5 ? -1 : 1);
      fl.debris.push({
        layers: ls, ox: o.x, oy: o.y, piv: piv, ang: fl.ang, dx: 0, dy: 0,
        vx: side * W * (gid.charAt(0) === "b" ? 0.22 : 0.05), vy: -fl.v * 0.9,
        va: side * (gid.charAt(0) === "b" ? 1.2 : 0.7), age: 0
      });
      var wp = toWorld(piv.x, piv.y);
      for (var i = 0; i < 16; i++) addP(1, wp.x + rand(-30, 30) * SC, wp.y + rand(0, 60) * SC, rand(-1, 1) * H * 0.3, -fl.v * 0.6 + rand(-0.2, 0.2) * H, rand(14, 30) * SC, Math.min(W, H) * 0.06, rand(0.8, 1.3), Math.random());
      sparkleBurst(wp.x, wp.y + fl.cam, 14, H * 0.6);
    });
    if (plan.kind === "stage") {
      fl.active = plan.idx + 1;
      fl.flameGap = 0.35;
      var joint = toWorld(0, G.stages[plan.idx].yt);
      fl.rings.push({ x: joint.x, y: joint.y, world: true, r: 20 * SC, life: 0, max: 0.8, col: "#FFFFFF", w: 10 });
      banner("Stage away!", 2600);
    } else {
      banner("Boosters away!", 2600);
    }
    if (!reduce) fl.shake = Math.max(fl.shake, 7);
    whoosh(0.08);
  }

  // ---- visitors: satellites, a friendly UFO, asteroids ----
  function spawnSat() {
    var side = Math.random() < 0.5 ? -1 : 1;
    fl.sats.push({ x: W / 2 + side * W * rand(0.22, 0.4), y: -M * 0.2, vx: -side * W * rand(0.02, 0.05), rot: rand(-0.5, 0.5), vr: rand(-0.25, 0.25), s: clamp(M * 0.06, 22, 60) });
  }
  function spawnUFO(stay) {
    var side = Math.random() < 0.5 ? -1 : 1;
    var w = clamp(M * 0.3, 110, 250);
    fl.ufo = { side: side, x: W / 2 + side * (W / 2 + w), y: H * rand(0.24, 0.32), t: 0, st: "in", stay: stay || 3.2, w: w, vx: 0, tap: 0 };
    tone(660, 0.5, 0.04, "sine", 990);
  }
  function updateVisitors(dt, speed) {
    fl.sats = fl.sats.filter(function (s) {
      s.x += s.vx * dt;
      s.y += (H * 0.1 + speed * 0.07) * dt;
      s.rot += s.vr * dt;
      return s.y < H + M * 0.3;
    });
    var u = fl.ufo;
    if (u) {
      u.t += dt;
      u.tap = Math.max(0, u.tap - dt);
      var hx = W / 2 + u.side * W * 0.27;
      if (u.st === "in") {
        u.x += (hx - u.x) * Math.min(1, dt * 2.6);
        if (u.t > 1.4) { u.st = "stay"; u.t = 0; }
      } else if (u.st === "stay") {
        u.x += (hx - u.x) * Math.min(1, dt * 2.6);
        if (u.t > u.stay) { u.st = "out"; u.t = 0; whoosh(0.05); }
      } else {
        u.vx -= u.side * W * 1.6 * dt;
        u.x += u.vx * dt;
        if (Math.abs(u.x - W / 2) > W / 2 + u.w) fl.ufo = null;
      }
    }
    fl.asts = fl.asts.filter(function (a) {
      a.x += a.vx * dt;
      a.y += (a.vy + speed * 0.05) * dt;
      a.rot += a.vr * dt;
      return a.y < H + a.r * 2;
    });
  }
  function spawnAsteroid() {
    var r = M * rand(0.035, 0.085), shape = [];
    for (var i = 0; i < 9; i++) shape.push(rand(0.75, 1.1));
    var x = rand(0.05, 0.95) * W;
    // Keep the middle (where the rocket flies) a bit clearer.
    if (Math.abs(x - W / 2) < W * 0.12) x += (x < W / 2 ? -1 : 1) * W * 0.16;
    fl.asts.push({ x: x, y: -r * 1.4, r: r, rot: rand(0, 6), vr: rand(-1, 1), vx: rand(-0.04, 0.04) * W, vy: H * rand(0.18, 0.36), shape: shape });
  }
  function hitUFO(x, y) {
    var u = fl.ufo;
    return u && Math.abs(x - u.x) < u.w * 0.6 && Math.abs(y - u.y) < u.w * 0.45;
  }

  // ---- the destination: a big round Moon/Mars/planet ----
  // b.d = distance from the rocket's middle, b.a = which way it lies (0 = straight up the screen).
  function placeBody() {
    var b = fl.body;
    b.x = W / 2 + b.d * Math.sin(b.a);
    b.y = fl.cy - b.d * Math.cos(b.a);
  }
  function groundY(x) {
    var b = fl.body;
    if (!b) return H;
    var dx = clamp(x - b.x, -b.r * 0.98, b.r * 0.98);
    return b.y - Math.sqrt(b.r * b.r - dx * dx);
  }
  function astroH() { return clamp(M * 0.12, 44, 110); }
  // Hatch and ladder on the right side of the rocket, once it has landed.
  function hatch() {
    var o = rocketOrigin();
    var hw = G.top.w / 2 * SC;
    return { x: o.x, y: o.y - (NOZ + 52) * SC, lx: o.x + hw + 6 * SC, hw: hw };
  }

  // ---- input on the flight screen: every finger gets a big response ----
  cv.addEventListener("pointerdown", function (e) {
    if (!fl) return;
    e.preventDefault();
    var x = e.clientX, y = e.clientY;
    fl.ptrs[e.pointerId] = x;
    sparkleBurst(x, y, 9, H * 0.5);
    // While the timer winds down, taps only sparkle.
    if (Toybox.timer.locked()) return;
    var ph = fl.phase;
    if (fl.ufo && hitUFO(x, y)) {
      fl.ufo.tap = 2.2;
      if (fl.ufo.st === "stay") fl.ufo.t = Math.min(fl.ufo.t, fl.ufo.stay - 2.2);
      fl.texts.push({ text: "Hi!", x: fl.ufo.x, y: fl.ufo.y - fl.ufo.w * 0.4, age: 0, life: 1.6, col: "#A7D129" });
      tone(880, 0.3, 0.04, "sine", 660);
      return;
    }
    if (ph === "tour" && popAsteroid(x, y)) return;
    if (ph === "ascent" || ph === "coast" || ph === "ignite" || ph === "cruise" || ph === "tour" || ph === "tourEnd" || ph === "homeward") {
      fl.boost = Math.min(3, fl.boost + 1);
      if (ph === "coast") { fl.v += H * 0.6; fl.flameGap = 0; }
      if (!reduce) fl.shake = Math.max(fl.shake, 5);
      var nz = nozzles();
      if (nz.length) {
        var p = nz[0].p, c = Math.cos(fl.ang), s = Math.sin(fl.ang);
        fl.rings.push({ x: p.x, y: p.y, world: true, r: nz[0].w * 0.6, life: 0, max: 0.6, col: "#FFE066", w: 12 });
        var cols = flameCols();
        for (var i = 0; i < 24; i++) {
          var lx = rand(-1, 1) * H * 0.45, ly = H * rand(0.6, 1.8);
          addP(0, p.x, p.y, lx * c - ly * s, lx * s + ly * c - (fl.space ? 0 : fl.v), nz[0].w * rand(0.25, 0.45), -nz[0].w * 0.3, rand(0.3, 0.5), pick(cols));
        }
        fl.texts.push({ text: pick(["Boost!", "Zoom!", "Whoosh!", "Faster!"]), x: clamp(x, W * 0.2, W * 0.8), y: y, age: 0, life: 1.3, col: pick(SPARK_COLS) });
      }
      whoosh(0.1);
    } else if (ph === "count") {
      for (var k = 0; k < 6; k++) addP(1, W / 2 + fl.x + rand(-1, 1) * 80 * SC, padY - 4, rand(-1, 1) * H * 0.4, -H * rand(0.05, 0.2), rand(16, 30) * SC, Math.min(W, H) * 0.08, rand(0.9, 1.4), Math.random());
    } else if (ph === "descent") {
      fl.swayV += (x < W / 2 ? -1 : 1) * 0.9;
    } else if (ph === "explore") {
      exploreTap(x, y);
    }
  });
  function ptrMove(e) { if (fl && fl.ptrs[e.pointerId] !== undefined) fl.ptrs[e.pointerId] = e.clientX; }
  function ptrUp(e) { if (fl) delete fl.ptrs[e.pointerId]; }
  cv.addEventListener("pointermove", ptrMove);
  cv.addEventListener("pointerup", ptrUp);
  cv.addEventListener("pointercancel", ptrUp);
  cv.addEventListener("pointerleave", ptrUp);
  F.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  function popAsteroid(x, y) {
    for (var i = fl.asts.length - 1; i >= 0; i--) {
      var a = fl.asts[i];
      if (Math.hypot(x - a.x, y - a.y) < a.r * 1.2 + 22) {
        fl.asts.splice(i, 1);
        sparkleBurst(a.x, a.y, 14, H * 0.6);
        for (var k = 0; k < 10; k++) addP(3, a.x, a.y, rand(-1, 1) * H * 0.3, rand(-1, 1) * H * 0.3, a.r * rand(0.15, 0.3), 0, rand(0.6, 1.0), pick(["#8B7B6B", "#A89584", "#6E6156"]));
        fl.texts.push({ text: "Pop!", x: a.x, y: a.y, age: 0, life: 1.2, col: "#FFC93C" });
        tone(rand(440, 620), 0.18, 0.05, "triangle", 220);
        return true;
      }
    }
    return false;
  }

  function exploreTap(x, y) {
    var a = fl.astro, AH = astroH();
    if (a && a.st === "idle" && Math.abs(x - a.x) < Math.max(AH * 0.7, 40) && y > a.y - AH * 1.25 && y < a.y + 24) {
      hop(a);
      return;
    }
    var rv = fl.rover;
    if (rv && Math.abs(x - rv.x) < AH * 0.8 && Math.abs(y - (groundY(rv.x) - AH * 0.4)) < AH * 0.7) {
      if (!rv.air) { rv.air = true; rv.vy = -H * 0.32; }
      fl.texts.push({ text: "Beep!", x: rv.x, y: groundY(rv.x) - AH * 1.2, age: 0, life: 1.3, col: "#5BC0EB" });
      tone(990, 0.12, 0.04, "square"); setTimeout(function () { tone(1320, 0.12, 0.04, "square"); }, 140);
      return;
    }
    var gy = groundY(x);
    if (y > gy - 30) dustPuff(x, gy, 8, M * 0.12);
  }
  function hop(a) {
    if (a.air) { a.vy = Math.min(a.vy, -H * 0.3); return; }
    a.air = true;
    a.vy = -H * 0.6;
    dustPuff(a.x, a.y, 6, M * 0.1);
    fl.texts.push({ text: pick(["Hop!", "Boing!", "Wheee!"]), x: a.x, y: a.y - astroH() * 1.6, age: 0, life: 1.3, col: pick(SPARK_COLS) });
    tone(300, 0.45, 0.05, "sine", 620);
  }

  // ---- simulation ----
  var COUNT_STEP = 0.85;
  var DESCENT_T = 6;
  function altFromRise(r) { return 760 * Math.pow(Math.max(0, r) / H, 1.92); }
  // Stars stream past in the direction the rocket is flying (turned with the scene).
  function streamStars(v, dt) { fl.P += v * dt * (Math.cos(fl.rot) >= 0 ? 1 : -1); }

  function step(dt) {
    var f = fl;
    f.t += dt;
    f.total += dt;
    f.boost = Math.max(0, f.boost - dt * 1.1);
    f.shake *= Math.exp(-dt * 5);
    f.flameGap = Math.max(0, f.flameGap - dt);
    var prevCam = f.cam;
    var ph = f.phase;

    // Steering: tilt and dragging fingers nudge the rocket sideways while it flies.
    var free = ph === "ascent" || ph === "coast" || ph === "cruise" || ph === "tour" || ph === "tourEnd" || ph === "homeward" || (ph === "descent" && f.t < DESCENT_T * 0.65);
    var drag = 0, nd = 0;
    Object.keys(f.ptrs).forEach(function (k) { drag += f.ptrs[k] - W / 2; nd++; });
    var target = free ? (tiltOn ? tiltX * W * 0.3 : 0) + (nd ? clamp(drag / nd, -W * 0.3, W * 0.3) * 0.5 : 0) : 0;
    if (ph === "tour") target += f.dodge;
    target = clamp(target, -W * 0.32, W * 0.32);
    f.vx += ((target - f.x) * 5 - f.vx * 3.2) * dt;
    f.x += f.vx * dt;
    if (ph !== "flip" && ph !== "swing") {
      f.ang = (ph === "ascent" || ph === "coast" || ph === "cruise" || ph === "tour" || ph === "tourEnd" || ph === "homeward") ? clamp(f.vx / W * 0.5, -0.3, 0.3) : 0;
    }

    if (ph === "count") {
      var n = 3 - Math.floor(f.t / COUNT_STEP);
      if (n !== f.lastCount && n > 0) { f.lastCount = n; showCount(n); beep(false); }
      // Venting steam while waiting.
      if (Math.random() < dt * 14) addP(1, W / 2 + rand(-1, 1) * 70 * SC, padY - rand(10, 60) * SC, rand(-1, 1) * H * 0.15, -H * 0.05, rand(10, 18) * SC, Math.min(W, H) * 0.04, rand(0.8, 1.2), Math.random());
      if (f.t >= COUNT_STEP * 3) {
        f.phase = "ignite"; f.t = 0;
        showCount(0);
        beep(true);
        startRumble();
        if (!reduce) f.shake = 12;
      }
    } else if (ph === "ignite") {
      // Big clouds of smoke roll out from the pad before the rocket moves.
      f.flame = Math.min(1, f.t / 0.45);
      if (!reduce) f.shake = Math.max(f.shake, 5);
      setRumble(0.05 + 0.06 * f.flame);
      if (f.t >= 1.1) {
        f.phase = "ascent"; f.t = 0;
        $("fhint").hidden = false;
        $("fhint").classList.remove("fade");
      }
    } else if (ph === "ascent") {
      // A calm climb (about 15 s to space); taps add short bursts.
      f.flame = 1;
      var vt = H * (f.goodbye || f.homeAsap ? 1.25 : 0.95) * (1 + 0.85 * f.boost);
      f.v += (vt - f.v) * Math.min(1, dt * (0.45 + 0.7 * Math.min(1, f.t / 3)));
      f.rise += f.v * dt;
      f.alt = altFromRise(f.rise);
      if (!reduce && f.t < 1.6) f.shake = Math.max(f.shake, 4 * (1 - f.t / 1.6));
      setRumble(0.07 + 0.03 * f.boost);
      if (f.t > 4.5) $("fhint").classList.add("fade");
      while (f.sepIdx < f.seps.length && f.alt >= f.seps[f.sepIdx].alt) { separate(f.seps[f.sepIdx]); f.sepIdx++; }
      if (f.ufoAt > 0 && f.alt >= f.ufoAt && !f.ufo) { spawnUFO(); f.ufoAt = -1; }
      if (f.satAt.length && f.alt >= f.satAt[0]) { spawnSat(); f.satAt.shift(); }
      if (f.alt >= 100000) {
        banner("Space!", 3000);
        chime();
        $("fhint").classList.add("fade");
        if (f.trip === "home" || f.homeAsap) { f.phase = "coast"; f.t = 0; }
        else enterSpace();
      }
    } else if (ph === "coast") {
      f.flame = Math.max(Math.min(1, f.boost), 1 - f.t / 0.6, 0);
      f.v *= Math.exp(-dt * 1.25);
      f.rise += f.v * dt;
      f.alt = altFromRise(f.rise);
      setRumble(0.06 * f.flame);
      if (f.t >= 2.6 && f.v < H * 0.45) startDescent();
    } else if (ph === "cruise") {
      // Coasting toward the Moon or Mars; it grows bigger and bigger.
      var CR = 7.5;
      f.t += dt * 0.5 * f.boost;   // taps hurry it along a little
      f.flame = 0.4 + 0.6 * Math.min(1, f.boost);
      f.sv += (H * (1.5 + 1.6 * f.boost) - f.sv) * Math.min(1, dt * 1.2);
      streamStars(f.sv, dt);
      f.earthDrop += f.sv * dt * 0.15;
      f.cy += (H * 0.6 - f.cy) * Math.min(1, dt);
      setRumble(0.03 + 0.03 * f.boost);
      var u = ease(f.t / CR);
      if (!f.body) f.body = { kind: f.trip, r: 0, d: 0, a: 0, rot: 0 };
      f.body.r = M * (0.05 + 0.26 * u);
      f.body.d = H * (1.05 - 0.6 * u);
      placeBody();
      if (f.t > 1.8 && !f.named) { f.named = true; showName(TRIP_NAME[f.trip], 4500); }
      if (f.t > 3 && f.satAt.length < 2 && !f.cruiseSat) { f.cruiseSat = true; spawnSat(); }
      if (f.t >= CR) {
        f.phase = "flip"; f.t = 0; f.ang0 = f.ang;
        banner("Turn around!", 3000);
        whoosh(0.06);
      }
    } else if (ph === "flip") {
      // Engine off; the rocket turns around so its engine points at the Moon.
      var FT = 2.6;
      f.flame = 0;
      setRumble(0.0001);
      f.sv += (H * 0.5 - f.sv) * Math.min(1, dt * 1.5);
      streamStars(f.sv, dt);
      f.cy += (H * 0.5 - f.cy) * Math.min(1, dt * 1.2);
      f.ang = f.ang0 + (PI - f.ang0) * ease(f.t / FT);
      placeBody();
      if (f.t >= FT) {
        f.phase = "swing"; f.t = 0;
        f.sw = { r0: f.body.r, g0: f.body.d - f.body.r };
        banner("Slow down!", 3000);
        startRumble();
      }
    } else if (ph === "swing") {
      // Engine burning to slow down; the view swings round until the Moon is the ground below.
      var ST = 4.2, us = ease(f.t / ST);
      f.flame = 0.9;
      setRumble(0.06);
      f.rot = PI * us;
      f.ang = PI + f.rot;   // the engine keeps pointing at the Moon
      f.sv *= Math.exp(-dt * 1.0);
      streamStars(f.sv, dt);
      f.cy += (H * 0.5 - f.cy) * Math.min(1, dt * 2);
      var r1 = Math.max(W, H) * 1.4, g1 = H * 0.34;
      f.body.r = f.sw.r0 * Math.pow(r1 / f.sw.r0, us);
      f.body.d = f.body.r + lerp(f.sw.g0, g1, us) * (1 - 0.7 * Math.sin(PI * us));
      f.body.a = f.rot;
      f.body.rot = f.rot;
      placeBody();
      if (f.t >= ST) {
        f.phase = "touch"; f.t = 0; f.rot = PI; f.ang = 0;
        f.body.a = PI; f.body.rot = PI;
        placeBody();
        f.tc0 = f.cy;
      }
    } else if (ph === "touch") {
      // Gently down on the engine, legs out, dust blowing.
      var TT = 4.4, ut = clamp(f.t / TT, 0, 1);
      var gy = groundY(W / 2 + f.x);
      var cyEnd = gy + f.rc * SC - FOOT * SC;
      f.cy = lerp(f.tc0, cyEnd, 1 - Math.pow(1 - ut, 2.2));
      f.legs = ease((ut - 0.1) / 0.4);
      f.flame = lerp(0.65, 0.3, ut);
      setRumble(0.05 * (1 - ut) + 0.01);
      if (cyEnd - f.cy < H * 0.14 && Math.random() < dt * 30) dustPuff(W / 2 + f.x, gy, 2, M * 0.16);
      if (ut >= 1) touchdown();
    } else if (ph === "explore" || ph === "stow") {
      explore(dt);
    } else if (ph === "leave") {
      // Lift off from the Moon: dust, flame, up and away.
      var bdy = f.body;
      if (f.t < 0.9) {
        f.flame = f.t / 0.9;
        if (Math.random() < dt * 30) dustPuff(W / 2 + f.x, groundY(W / 2 + f.x), 2, M * 0.16);
        if (!reduce) f.shake = Math.max(f.shake, 3);
      } else {
        f.flame = 1;
        f.lv = (f.lv || 0) + H * 0.55 * dt;
        f.legs = 1 - ease((f.t - 0.9) / 1.2);
        if (f.cy > H * 0.42) f.cy -= f.lv * dt;
        else { bdy.y += f.lv * dt; streamStars(f.lv, dt); }
        if (bdy.y - bdy.r > H + 60) startHomeward();
      }
      setRumble(0.07);
    } else if (ph === "tour") {
      tour(dt);
    } else if (ph === "tourEnd") {
      f.flame = 0.3 + 0.7 * Math.min(1, f.boost);
      f.sv += (H * (0.8 + 1.6 * f.boost) - f.sv) * Math.min(1, dt * 1.2);
      streamStars(f.sv, dt);
      setRumble(0.02 + 0.03 * f.boost);
      if (f.t > 1.8 && !f.waitHome && !f.homeShown) { f.homeShown = true; f.waitHome = true; showLandbar(true); }
    } else if (ph === "homeward") {
      // Back toward Earth; a white flash, and then the parachute ride down to the pad.
      f.flame = 0.5 + 0.5 * Math.min(1, f.boost);
      f.sv += (H * (1.6 + 1.6 * f.boost) - f.sv) * Math.min(1, dt * 1.2);
      streamStars(f.sv, dt);
      f.cy += (H * 0.62 - f.cy) * Math.min(1, dt);
      setRumble(0.04);
      var uh = ease(f.t / 4.6);
      f.body.r = M * (0.06 + 0.42 * uh);
      f.body.d = H * (1.05 - 0.5 * uh);
      placeBody();
      if (f.t > 1.2 && !f.named) { f.named = true; showName("Earth", 3200); }
      if (f.t >= 4.4) f.flash = Math.min(1, (f.t - 4.4) / 0.5);
      if (f.t >= 4.9) landFromSpace();
    } else if (ph === "descent") {
      f.flame = 0;
      f.flash = Math.max(0, f.flash - dt * 1.4);
      var ud = Math.min(1, f.t / DESCENT_T);
      f.rise = f.D * Math.pow(1 - ud, 1.55);
      f.alt = f.apogee * Math.pow(f.rise / f.D, 3);
      f.chute = f.t < 0.4 ? 0 : Math.min(1, (f.t - 0.4) / 0.8);
      if (f.t >= 0.4 && !f.chuteShown) { f.chuteShown = true; banner("Parachute!", 3000); tone(330, 0.25, 0.05, "sine", 160); }
      f.swayV += (-f.sway * 3 - f.swayV * 0.9) * dt;
      f.sway += f.swayV * dt;
      f.sway = clamp(f.sway, -0.35, 0.35);
      if (ud >= 1) land();
    } else if (ph === "landed") {
      f.chute = Math.max(0, 1 - f.t / 0.8);
      f.sway *= Math.exp(-dt * 4);
      // Rebuild: lower stages pop back in, the top piece lifts back into place.
      var rb = clamp((f.t - 0.7) / 0.9, 0, 1);
      var e2 = rb === 0 ? 0 : 1 + 2.7 * Math.pow(rb - 1, 3) + 1.7 * Math.pow(rb - 1, 2);
      Object.keys(f.groups).forEach(function (k) {
        var gs = f.groups[k];
        if (k === String(G.stages.length - 1)) { gs.dy = f.topDrop * (1 - Math.min(1, e2)); return; }
        gs.on = rb > 0;
        gs.s = Math.max(0, e2);
      });
      if (rb > 0 && !f.rebuilt) {
        f.rebuilt = true;
        var c0 = toWorld(0, G.stages[0].yb - 80);
        sparkleBurst(c0.x, c0.y + f.cam, 26, H * 0.7);
      }
      if (f.t > 1.9 && !f.done) landedDone();
    }

    // Camera follows the rocket once it is high enough (on the way up and down only).
    if (!f.space) {
      var follow = f.phase === "descent" ? H * 0.78 : followY;
      f.cam = Math.max(0, f.rise - (padY - follow));
      if (!f.resetCam) f.P += f.cam - prevCam;
      f.resetCam = false;
    }

    // Debris.
    f.debris = f.debris.filter(function (d) {
      d.age += dt;
      d.vy += H * 1.6 * dt;
      d.dx += d.vx * dt;
      d.dy += d.vy * dt;
      d.ang += d.va * dt;
      return d.age < 5 && d.oy + d.dy + f.cam < H + 600;
    });
    updateVisitors(dt, f.space ? f.sv : f.v);
    emit(dt);
    updateParts(dt);
    f.texts = f.texts.filter(function (t) { t.age += dt; t.y -= H * 0.18 * dt; return t.age < t.life; });
    f.rings = f.rings.filter(function (r) { r.life += dt; return r.life < r.max; });
  }

  // From the climb into the space part of a trip: same picture, new frame of reference
  // (the screen no longer scrolls; stars stream past instead).
  function enterSpace() {
    var f = fl, oldCam = f.cam;
    while (f.sepIdx < f.seps.length) { separate(f.seps[f.sepIdx]); f.sepIdx++; }
    var top = G.stages.length - 1, o = rocketOrigin();
    f.parts.forEach(function (p) { p.y += oldCam; });
    f.debris.forEach(function (d) { d.oy += oldCam; });
    f.rings.forEach(function (r) { if (r.world) r.y += oldCam; });
    f.topDrop = -G.top.exit;
    f.groups[String(top)].dy = f.topDrop;
    f.active = top;
    f.rc = (G.noseTop + f.topDrop) / 2;
    var oy = o.y + oldCam - f.topDrop * SC;
    f.cy = oy + f.rc * SC * Math.cos(f.ang);
    f.space = true;
    f.cam = 0;
    f.sv = f.v;
    f.v = 0;
    f.t = 0;
    f.named = false;
    f.phase = f.trip === "planets" ? "tour" : "cruise";
  }

  function touchdown() {
    var f = fl;
    f.phase = "explore"; f.t = 0;
    f.flame = 0;
    f.legs = 1;
    stopRumble();
    var gy = groundY(W / 2 + f.x);
    dustPuff(W / 2 + f.x, gy, 30, M * 0.22);
    if (!reduce) f.shake = 5;
    banner(LANDED_TEXT[f.trip] || "Landed!", 3200);
    chime();
    tone(110, 0.4, 0.07, "sine", 60);
    f.astro = { st: "wait", t: 0, x: 0, y: 0, vy: 0, air: false, face: 1, walk: 0 };
    f.flag = null;
    f.rover = f.trip === "mars" ? { x: W * 0.16, dir: 1, wheel: 0, air: false, vy: 0, yOff: 0 } : null;
    if (f.homeAsap) stow(true);
  }

  // Out on the surface: the astronaut climbs down, plants a flag, and hops when tapped.
  function explore(dt) {
    var f = fl, a = f.astro, AH = astroH(), hh = hatch();
    var g = H * 0.5;   // low gravity
    if (a) {
      a.t += dt;
      if (a.st === "wait") {
        if (a.t > 1.2) {
          a.st = "climb"; a.t = 0; a.x = hh.lx + AH * 0.18; a.y = hh.y + AH * 0.35;
          sparkleBurst(a.x, a.y - AH * 0.5, 10, H * 0.3);
        }
      } else if (a.st === "climb") {
        var uc = clamp(a.t / 2.0, 0, 1);
        a.y = lerp(hh.y + AH * 0.35, groundY(a.x), uc);
        a.walk = a.t * 7;
        if (uc >= 1) { a.st = "walk"; a.t = 0; a.x0 = a.x; a.x1 = Math.min(W - AH * 1.45 - 8, hh.x + Math.max(W * 0.3, hh.hw + AH * 1.6)); }
      } else if (a.st === "walk") {
        var uw = clamp(a.t / 2.2, 0, 1);
        a.x = lerp(a.x0, a.x1, ease(uw));
        a.y = groundY(a.x);
        a.walk = a.t * 8;
        if (uw >= 1) { a.st = "plant"; a.t = 0; f.flag = { x: a.x + AH * 0.5, h: 0 }; a.walk = 0; }
      } else if (a.st === "plant") {
        f.flag.h = AH * 1.5 * ease(a.t / 1.0);
        a.y = groundY(a.x);
        if (a.t >= 1.0) {
          a.st = "idle"; a.t = 0; a.face = -1;
          sparkleBurst(f.flag.x, groundY(f.flag.x) - AH * 1.4, 12, H * 0.4);
          chimeSoft();
          if (f.phase === "explore" && !f.homeAsap) { f.waitHome = true; showLandbar(true); }
        }
      } else if (a.st === "idle") {
        if (a.t > 1.2 && !a.demo) { a.demo = true; hop(a); }
      } else if (a.st === "back") {
        if (!a.air) {
          var tx = hh.lx + AH * 0.18, dir = tx < a.x ? -1 : 1;
          a.face = dir;
          a.x += dir * Math.min(Math.abs(tx - a.x), W * 0.22 * dt);
          a.y = groundY(a.x);
          a.walk += dt * 8;
          if (Math.abs(tx - a.x) < 1) { a.st = "up"; a.t = 0; }
        }
      } else if (a.st === "up") {
        var uu = clamp(a.t / 1.2, 0, 1);
        a.y = lerp(groundY(a.x), hh.y + AH * 0.35, uu);
        a.walk = a.t * 7;
        if (uu >= 1) {
          sparkleBurst(a.x, a.y - AH * 0.5, 10, H * 0.3);
          f.astro = null;
          startLeave();
        }
      }
      // Hops: a slow, floaty arc.
      if (a.air) {
        a.vy += g * dt;
        a.y += a.vy * dt;
        var gyy = groundY(a.x);
        if (a.y >= gyy && a.vy > 0) { a.y = gyy; a.air = false; a.vy = 0; dustPuff(a.x, gyy, 5, M * 0.08); }
      }
    }
    var rv = f.rover;
    if (rv) {
      var lim = hh.x - hh.hw - AH * 1.2;
      rv.x += rv.dir * W * 0.035 * dt;
      rv.wheel += rv.dir * dt * 3;
      if (rv.x > lim) { rv.x = lim; rv.dir = -1; }
      if (rv.x < AH * 0.8) { rv.x = AH * 0.8; rv.dir = 1; }
      if (rv.air) { rv.vy += g * dt; rv.yOff -= rv.vy * dt; if (rv.yOff <= 0) { rv.yOff = 0; rv.air = false; dustPuff(rv.x, groundY(rv.x), 4, M * 0.08); } }
      if (Math.random() < dt * 3) addP(3, rv.x - rv.dir * AH * 0.5, groundY(rv.x) - 4, -rv.dir * H * 0.03, -H * 0.02, AH * 0.08, AH * 0.1, 1.2, dustCol());
    }
    // Sometimes a UFO drops by to say hello.
    if (f.phase === "explore" && f.t > 9 && !f.exploreUfo) { f.exploreUfo = true; if (Math.random() < 0.5) spawnUFO(3.5); }
  }

  function stow(quick) {
    var f = fl;
    f.waitHome = false;
    $("landbar").hidden = true;
    var a = f.astro;
    if (quick || !a || a.st === "wait") {
      if (a && a.st !== "wait") sparkleBurst(a.x, a.y - astroH() * 0.5, 12, H * 0.4);
      f.astro = null;
      startLeave();
      return;
    }
    f.phase = "stow";
    if (a.st === "climb" || a.st === "up") a.st = "up";
    else a.st = "back";
    a.t = 0;
  }
  function startLeave() {
    var f = fl;
    f.phase = "leave"; f.t = 0; f.lv = 0;
    banner("Bye bye, " + (f.trip === "mars" ? "Mars!" : "Moon!"), 3000);
    startRumble();
  }
  function startHomeward() {
    var f = fl;
    f.waitHome = false;
    $("landbar").hidden = true;
    f.phase = "homeward"; f.t = 0;
    f.named = false;
    f.flag = null; f.rover = null; f.astro = null; f.asts = [];
    f.legs = 0;
    f.dodge = 0;
    hideName();
    f.body = { kind: "earth", r: M * 0.06, d: H * 1.05, a: 0, rot: 0 };
    if (f.ufo && f.ufo.st !== "out") { f.ufo.st = "out"; f.ufo.t = 0; }
    startRumble();
    placeBody();
  }
  // From space back to the sky above the launch pad (behind a white flash).
  function landFromSpace() {
    var f = fl;
    f.space = false;
    f.rot = 0;
    f.body = null;
    f.legs = 0;
    f.ang = 0;
    f.flash = 1;
    f.sats = []; f.ufo = null; f.asts = [];
    hideName();
    f.alt = 70000;
    startDescent();
  }

  function tour(dt) {
    var f = fl;
    f.flame = 0.4 + 0.6 * Math.min(1, f.boost);
    f.sv += (H * (1.2 + 1.6 * f.boost) - f.sv) * Math.min(1, dt * 1.2);
    streamStars(f.sv, dt);
    f.earthDrop += f.sv * dt * 0.15;
    f.cy += (H * 0.62 - f.cy) * Math.min(1, dt);
    setRumble(0.03 + 0.03 * f.boost);
    var tt = f.t - 1.4, idx = -1, u = 0, acc = 0, i;
    if (tt >= 0) {
      for (i = 0; i < TOUR.length; i++) {
        if (tt < acc + TOUR_STEP) { idx = i; u = (tt - acc) / TOUR_STEP; break; }
        acc += TOUR_STEP;
      }
      if (idx < 0) { endTour(); return; }
    }
    if (idx !== f.ti) {
      f.ti = idx;
      if (idx >= 0) {
        var it = TOUR[idx], side = idx % 2 ? -1 : 1;
        f.tside = side;
        f.body = it.k === "belt" ? null : { kind: it.k, r: M * it.r, rot: rand(-0.25, 0.25), x: 0, y: 0, a: 0, d: 0 };
        if (f.body) f.body.x = W / 2 + side * clamp(W * 0.5 - f.body.r - 12, W * 0.2, W * 0.34);
        f.dodge = it.k === "belt" ? 0 : -side * W * 0.17;
        f.beltNext = 0;
        if (it.k === "saturn" && !f.ufo && Math.random() < 0.6) spawnUFO();
      }
    }
    if (idx < 0) return;
    var item = TOUR[idx];
    if (f.body) {
      var s = 2 * u - 1, r = f.body.r;
      f.body.y = H * 0.45 + (0.35 * s + 0.65 * s * s * s) * (H * 0.55 + r * (item.k === "saturn" ? 1.4 : 1) + 10);
    } else {
      f.beltNext -= dt;
      if (u < 0.8 && f.beltNext <= 0) { spawnAsteroid(); f.beltNext = rand(0.18, 0.4); }
    }
    if (u > 0.12 && u < 0.86) showName(item.n);
    else if (u >= 0.86) hideName();
  }
  function endTour() {
    var f = fl;
    f.phase = "tourEnd"; f.t = 0;
    f.body = null; f.dodge = 0;
    showName("Bye, planets!", 5000);
    if (!f.ufo) spawnUFO(9999); else { f.ufo.st = "stay"; f.ufo.stay = 9999; }
    if (f.homeAsap) startHomeward();
  }

  // Time is up during a trip: head home now (the controls are locked).
  function homeNow() {
    var f = fl;
    if (!f) return;
    f.homeAsap = true;
    f.waitHome = false;
    $("landbar").hidden = true;
    if (f.phase === "explore") stow(true);
    else if (f.phase === "cruise" || f.phase === "tour" || f.phase === "tourEnd") startHomeward();
  }
  function flyHome() {
    var f = fl;
    if (!f || !f.waitHome) return;
    f.waitHome = false;
    $("landbar").hidden = true;
    if (f.phase === "explore") stow(false);
    else if (f.phase === "tourEnd") startHomeward();
    blip();
  }

  function startDescent() {
    var f = fl;
    f.apogee = f.alt;
    f.phase = "descent"; f.t = 0;
    f.v = 0; f.boost = 0;
    stopRumble();
    // Jump the world to just above the clouds; nothing on screen is tied to the ground right now.
    f.D = H * 7.5;
    f.rise = f.D;
    f.resetCam = true;
    f.cam = Math.max(0, f.rise - (padY - H * 0.78));
    f.parts = f.parts.filter(function (p) { return p.kind === 2; });
    f.debris = [];
    f.sats = []; f.asts = [];
    if (f.ufo && f.ufo.st !== "out") { f.ufo.st = "out"; f.ufo.t = 0; }
    f.clouds = newClouds(H * 1.0, H * 4.6, 7).concat([{ x: W * 0.18, rise: H * 0.62, s: Math.min(W, H) * 0.3, fg: false }, { x: W * 0.86, rise: H * 0.42, s: Math.min(W, H) * 0.24, fg: false }]);
    // Only the top piece comes home; draw it shifted so its engine bell sits on the pad.
    var topId = String(G.stages.length - 1);
    f.topDrop = -G.top.exit;
    f.groups[topId].dy = f.topDrop;
    f.active = G.stages.length - 1;
    Object.keys(f.groups).forEach(function (k) { if (k !== topId) f.groups[k].on = false; });
  }

  function land() {
    var f = fl;
    f.phase = "landed"; f.t = 0;
    f.rise = 0;
    f.alt = 0;
    var o = rocketOrigin();
    for (var i = 0; i < 18; i++) {
      var side = i % 2 ? 1 : -1;
      addP(1, o.x + side * rand(10, 60) * SC, padY - 4, side * H * rand(0.2, 0.6), -H * rand(0, 0.08), rand(12, 24) * SC, Math.min(W, H) * 0.05, rand(0.8, 1.3), Math.random());
    }
    banner(f.goodbye ? "Home!" : "Welcome home!", 3200);
    $("fback").hidden = true;
    $("fhint").hidden = true;
    chime();
  }

  function landedDone() {
    var f = fl;
    f.done = true;
    if (f.goodbye) {
      banner("Bye bye, rocket!", 3000);
      // The goodbye rocket is home: the shared timer can go to rest.
      if (endingDone) { endingDone(); endingDone = null; }
      // Already resting (the shared timer waits a while at most): close the flight to show the rest screen.
      if (Toybox.timer.phase() === "resting") setTimeout(function () { if (fl === f) closeFlight(); }, 2600);
      return;
    }
    if (Toybox.timer.locked()) {
      setTimeout(function () { if (fl === f) closeFlight(); }, 1800);
      return;
    }
    showLandbar(false);
  }

  // ---- drawing ----
  function drawCloud(x, y, s) {
    var parts = [[-0.36, 0.06, 0.27], [0, -0.14, 0.36], [0.36, 0.04, 0.26], [0.14, 0.14, 0.26], [-0.16, 0.14, 0.26]];
    ctx.fillStyle = OUT;
    ctx.beginPath();
    parts.forEach(function (p) { ctx.moveTo(x + p[0] * s + p[2] * s + 3, y + p[1] * s); ctx.arc(x + p[0] * s, y + p[1] * s, p[2] * s + 3, 0, Math.PI * 2); });
    ctx.fill();
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    parts.forEach(function (p) { ctx.moveTo(x + p[0] * s + p[2] * s - 1, y + p[1] * s); ctx.arc(x + p[0] * s, y + p[1] * s, p[2] * s - 1, 0, Math.PI * 2); });
    ctx.fill();
  }

  function drawGround(cam) {
    var gy = padY + cam;
    if (gy - H * 0.6 > H) return;
    var m = Math.min(W, H);
    ctx.lineWidth = 4;
    ctx.strokeStyle = OUT;
    // hills
    ctx.fillStyle = "#5DAE4A";
    ctx.beginPath(); ctx.ellipse(W * 0.12, gy + 14, W * 0.4, m * 0.14, 0, Math.PI, 0); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(W * 0.92, gy + 18, W * 0.42, m * 0.12, 0, Math.PI, 0); ctx.fill(); ctx.stroke();
    // ground
    ctx.fillStyle = "#7CC55A";
    ctx.fillRect(-20, gy + 14 * SC, W + 40, H + 40);
    ctx.beginPath(); ctx.moveTo(-20, gy + 14 * SC); ctx.lineTo(W + 20, gy + 14 * SC); ctx.stroke();
    // tower
    var cx = W / 2, x1 = cx - 228 * SC, x2 = cx - 192 * SC, top = gy - 400 * SC, yy;
    ctx.lineCap = "round";
    var path = function () {
      ctx.beginPath();
      for (yy = gy; yy > top + 1; yy -= 36 * SC) {
        ctx.moveTo(x1, yy); ctx.lineTo(x2, yy - 36 * SC);
        ctx.moveTo(x2, yy); ctx.lineTo(x1, yy - 36 * SC);
      }
      ctx.moveTo(x1, gy); ctx.lineTo(x1, top);
      ctx.moveTo(x2, gy); ctx.lineTo(x2, top);
    };
    path(); ctx.lineWidth = 11 * SC; ctx.strokeStyle = OUT; ctx.stroke();
    path(); ctx.lineWidth = 5 * SC; ctx.strokeStyle = "#E63946"; ctx.stroke();
    ctx.lineWidth = 4;
    ctx.strokeStyle = OUT;
    ctx.fillStyle = "#FFC93C";
    roundRect(x1 - 8 * SC, top - 16 * SC, 52 * SC, 18 * SC, 5 * SC); ctx.fill(); ctx.stroke();
    // pad
    ctx.fillStyle = "#6C7590";
    ctx.fillRect(cx - 128 * SC, gy + 22 * SC, 20 * SC, 20 * SC); ctx.strokeRect(cx - 128 * SC, gy + 22 * SC, 20 * SC, 20 * SC);
    ctx.fillRect(cx + 108 * SC, gy + 22 * SC, 20 * SC, 20 * SC); ctx.strokeRect(cx + 108 * SC, gy + 22 * SC, 20 * SC, 20 * SC);
    ctx.fillStyle = "#9AA3AF";
    roundRect(cx - 150 * SC, gy - 2 * SC, 300 * SC, 24 * SC, 5 * SC); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#FFC93C";
    ctx.lineWidth = 2;
    for (var k = 0; k < 5; k++) {
      var px = cx + (-120 + k * 54) * SC;
      ctx.beginPath(); ctx.moveTo(px, gy + 3 * SC); ctx.lineTo(px + 18 * SC, gy + 3 * SC); ctx.lineTo(px + 8 * SC, gy + 17 * SC); ctx.lineTo(px - 10 * SC, gy + 17 * SC); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawEarth(alt, drop) {
    var vis = clamp((alt - 55000) / 50000, 0, 1);
    if (vis <= 0) return;
    var R = Math.max(W, H) * 3, top = H - vis * H * 0.2 + (drop || 0), cx = W / 2, cy = top + R;
    if (top > H + 20) return;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R + 16, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(91,192,235,0.35)"; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = "#2D5BD7"; ctx.fill();
    ctx.clip();
    ctx.fillStyle = "#2E9E5B";
    [[-0.3, 0.02, 0.16], [0.18, 0.05, 0.12], [0.42, 0.01, 0.08], [-0.05, 0.09, 0.1]].forEach(function (c) {
      ctx.beginPath(); ctx.ellipse(cx + c[0] * W, top + c[1] * H + 10, c[2] * W, c[2] * W * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    [[-0.12, 0.01, 0.1], [0.3, 0.03, 0.08]].forEach(function (c) {
      ctx.beginPath(); ctx.ellipse(cx + c[0] * W, top + c[1] * H + 6, c[2] * W, c[2] * W * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.lineWidth = 4; ctx.strokeStyle = OUT; ctx.stroke();
  }

  // ---- planets ----
  var BODY = {
    moon: "#C9D2E3", mars: "#D9643A", earth: "#2D6FD7", mercury: "#B0A49B", venus: "#F0CE84",
    jupiter: "#EBD3AE", saturn: "#F0D58C", uranus: "#9FE3E8", neptune: "#3B6EE0"
  };
  function blob(x, y, rx, ry, col, rot) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); ctx.fill();
  }
  function craters(r, list, dark, light) {
