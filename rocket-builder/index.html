      var fx = d * lerp(hw + 2, hw + 44, k) * SC, fy = lerp((s.yb + dy - 6), FOOT, k) * SC;
      limb(hx, hy, fx, fy, 5 * SC + 2, "#C9D2E3");
      limb(d * (hw - 4) * SC, (s.yb + dy - 4) * SC, lerp(hx, fx, 0.6), lerp(hy, fy, 0.6), 3 * SC + 1, "#9AA3AF");
      if (k > 0.3) { ctx.beginPath(); ctx.ellipse(fx, fy, 13 * SC, 5 * SC, 0, 0, TAU); ctx.fillStyle = "#9AA3AF"; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke(); }
    });
  }

  function drawFlame(n, len, t) {
    var w = n.w, x = n.p.x, y = n.p.y + fl.cam;
    var cols = flameCols();
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(fl.ang);
    var layer = function (ww, ll, col, stroke) {
      ctx.beginPath();
      ctx.moveTo(-ww / 2, -2);
      ctx.bezierCurveTo(-ww * 0.7, ll * 0.35, -ww * 0.2, ll * 0.75, 0, ll);
      ctx.bezierCurveTo(ww * 0.2, ll * 0.75, ww * 0.7, ll * 0.35, ww / 2, -2);
      ctx.closePath();
      ctx.fillStyle = col;
      ctx.fill();
      if (stroke) { ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke(); }
    };
    var fl1 = 0.85 + 0.15 * Math.sin(t * 40 + x) + 0.1 * Math.random();
    layer(w * 1.05, len * fl1, cols[0], true);
    layer(w * 0.75, len * 0.72 * fl1, cols[1], false);
    layer(w * 0.45, len * 0.42 * fl1, "#FFF8DC", false);
    ctx.restore();
  }

  function drawLayerSet(ls, groups) {
    ls.forEach(function (l) {
      var gs = groups ? groups[l.group] : null;
      if (groups && (!gs || !gs.on || gs.s <= 0.01)) return;
      var img = l.canvas || l.old;
      if (!img) return;
      var x = l.bbox[0] * SC, y = l.bbox[1] * SC, w = (l.bbox[2] - l.bbox[0]) * SC, h = (l.bbox[3] - l.bbox[1]) * SC;
      if (gs) {
        y += gs.dy * SC;
        if (gs.s !== 1) {
          var cx = x + w / 2, cy = y + h / 2;
          x = cx - w / 2 * gs.s; y = cy - h / 2 * gs.s; w *= gs.s; h *= gs.s;
        }
      }
      ctx.drawImage(img, x, y, w, h);
    });
  }

  function drawChute(k) {
    // In rocket-local px, above the top piece's nose.
    var wTop = G.top.w * SC, noseY = (G.noseTop + fl.groups[String(G.stages.length - 1)].dy) * SC;
    var full = wTop * 2.4, cw = full * (0.15 + 0.85 * k), ch = cw * 0.48;
    var cy = noseY - full * 0.8 * (0.3 + 0.7 * k);
    var nose = hex(state.colors.nose);
    var c1 = nose === "#FFFFFF" ? hex(state.colors.bands) : nose;
    ctx.save();
    ctx.globalAlpha = Math.min(1, k * 3);
    // lines
    ctx.lineWidth = 2;
    ctx.strokeStyle = OUT;
    ctx.beginPath();
    [-0.5, -0.25, 0, 0.25, 0.5].forEach(function (s) { ctx.moveTo(s * cw, cy); ctx.lineTo(0, noseY + 4); });
    ctx.stroke();
    // canopy
    var dome = function () {
      ctx.beginPath();
      ctx.ellipse(0, cy, cw / 2, ch, 0, Math.PI, 0);
      var g = 6, i;
      for (i = g; i > 0; i--) {
        var xa = -cw / 2 + cw * i / g, xb = -cw / 2 + cw * (i - 1) / g;
        ctx.quadraticCurveTo((xa + xb) / 2, cy + ch * 0.16, xb, cy);
      }
      ctx.closePath();
    };
    dome();
    ctx.fillStyle = "#FFFFFF";
    ctx.fill();
    ctx.save();
    dome(); ctx.clip();
    ctx.fillStyle = c1;
    for (var i = 0; i < 6; i += 2) ctx.fillRect(-cw / 2 + cw * i / 6, cy - ch - 4, cw / 6, ch + ch * 0.3);
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath(); ctx.ellipse(-cw * 0.18, cy - ch * 0.62, cw * 0.14, ch * 0.16, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    dome();
    ctx.lineWidth = 4; ctx.strokeStyle = OUT; ctx.stroke();
    ctx.restore();
    return cy;
  }

  function drawStar4(x, y, r, rot) {
    ctx.beginPath();
    for (var k = 0; k < 8; k++) {
      var a = rot + k * Math.PI / 4, rr2 = k % 2 ? r * 0.38 : r;
      if (k) ctx.lineTo(x + rr2 * Math.sin(a), y - rr2 * Math.cos(a)); else ctx.moveTo(x + rr2 * Math.sin(a), y - rr2 * Math.cos(a));
    }
    ctx.closePath();
  }

  function draw() {
    var f = fl, cam = f.cam;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var sk = skyAt(f.alt);
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, sk[0]); grad.addColorStop(1, sk[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    var sx = 0, sy = 0;
    if (f.shake > 0.3 && !reduce) { sx = (Math.random() - 0.5) * 2 * f.shake; sy = (Math.random() - 0.5) * 2 * f.shake; }
    ctx.translate(sx, sy);

    // Stars (a square field, turned with the view while the rocket swings round).
    var starA = f.space ? 1 : clamp((f.alt - 22000) / 40000, 0, 1);
    if (starA > 0) {
      ctx.fillStyle = "#FFF6C8";
      var cr = Math.cos(f.rot), sr = Math.sin(f.rot);
      stars.forEach(function (s) {
        var lx = s.x * SQ - SQ / 2, ly = ((s.y * SQ + f.P * s.d) % SQ + SQ) % SQ - SQ / 2;
        var px = W / 2 + lx * cr - ly * sr, py = H / 2 + lx * sr + ly * cr;
        if (px < -12 || px > W + 12 || py < -12 || py > H + 12) return;
        ctx.globalAlpha = starA * (0.65 + 0.35 * Math.sin(f.total * 3 + s.tw));
        if (s.big) { drawStar4(px, py, s.r * 4, f.rot); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(px, py, s.r, 0, Math.PI * 2); ctx.fill(); }
      });
      ctx.globalAlpha = 1;
    }

    var AH = astroH(), hh = null;
    if (!f.space) {
      drawEarth(f.alt, 0);
      // Sun (far away, so it barely moves) and clouds.
      var sunA = clamp(1 - f.alt / 20000, 0, 1);
      if (sunA > 0) {
        var m = Math.min(W, H);
        ctx.globalAlpha = sunA;
        ctx.beginPath(); ctx.arc(W * 0.84, H * 0.2 + cam * 0.05, m * 0.07, 0, Math.PI * 2);
        ctx.fillStyle = "#FFC93C"; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = OUT; ctx.stroke();
        ctx.beginPath(); ctx.arc(W * 0.84, H * 0.2 + cam * 0.05, m * 0.047, 0, Math.PI * 2); ctx.fillStyle = "#FFE07A"; ctx.fill();
        ctx.globalAlpha = 1;
      }
      f.clouds.forEach(function (c) { if (!c.fg) { var y = padY - c.rise + cam; if (y > -c.s && y < H + c.s) drawCloud(c.x, y, c.s); } });
      drawGround(cam);
    } else {
      drawEarth(Math.max(f.alt, 105000), f.earthDrop);
      var landed = f.body && f.body.r > 1.3 * M && (f.trip === "moon" || f.trip === "mars");
      if (landed && f.trip === "moon") drawBody({ kind: "earth", x: W * 0.8, y: H * 0.16, r: M * 0.07, rot: 0 });
      if (landed && f.trip === "mars") {
        // Dusty pink haze over the Martian ground.
        var gtop = f.body.y - f.body.r;
        var hz = ctx.createLinearGradient(0, gtop - H * 0.45, 0, gtop);
        hz.addColorStop(0, "rgba(240,150,100,0)"); hz.addColorStop(1, "rgba(240,150,100,0.45)");
        ctx.fillStyle = hz; ctx.fillRect(0, gtop - H * 0.45, W, H * 0.45 + 4);
      }
    }
    f.sats.forEach(drawSat);
    if (f.body) drawBody(f.body);
    f.asts.forEach(drawAsteroid);
    if (f.flag) drawFlag(f.flag);
    if (f.rover) drawRover(f.rover);

    // Smoke and dust behind everything that flies.
    var ps = f.parts, i, p, a;
    for (i = 0; i < ps.length; i++) {
      p = ps[i];
      if (p.kind !== 1 && p.kind !== 3) continue;
      a = 1 - p.age / p.life;
      ctx.globalAlpha = 0.85 * Math.pow(a, 0.7);
      if (p.kind === 3) {
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y + cam, p.r, 0, Math.PI * 2); ctx.fill();
        continue;
      }
      ctx.fillStyle = "#AEB8CC";
      ctx.beginPath(); ctx.arc(p.x + p.r * 0.12, p.y + cam + p.r * 0.12, p.r * 1.04, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = p.col < 0.5 ? "#F4F6FA" : "#E4E9F2";
      ctx.beginPath(); ctx.arc(p.x, p.y + cam, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Flames, then fire particles.
    if (f.flame > 0.02 && f.flameGap <= 0) {
      nozzles().forEach(function (n) {
        var len = n.w * Math.min(5, 2.0 + 1.5 * f.boost) * f.flame * (n.main ? 1.15 : 0.8) * (f.phase === "ignite" ? 0.8 : 1);
        drawFlame(n, len, f.total);
      });
    }
    for (i = 0; i < ps.length; i++) {
      p = ps[i];
      if (p.kind !== 0) continue;
      a = 1 - p.age / p.life;
      ctx.globalAlpha = Math.min(1, a * 1.4);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y + cam, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Spent stages and boosters tumbling away.
    f.debris.forEach(function (d) {
      ctx.save();
      var px = d.ox + d.dx + d.piv.x * SC, py = d.oy + d.dy + cam + d.piv.y * SC;
      ctx.translate(px, py);
      ctx.rotate(d.ang);
      ctx.translate(-d.piv.x * SC, -d.piv.y * SC);
      drawLayerSet(d.layers, null);
      ctx.restore();
    });

    // The rocket.
    if (layerList) {
      var o = rocketOrigin();
      ctx.save();
      ctx.translate(o.x, o.y + cam);
      ctx.rotate(f.ang);
      if (f.phase === "descent" || (f.phase === "landed" && f.chute > 0)) {
        var piv = (G.noseTop + f.groups[String(G.stages.length - 1)].dy) * SC - G.top.w * SC * 2;
        ctx.translate(0, piv); ctx.rotate(f.sway); ctx.translate(0, -piv);
        if (f.chute > 0) drawChute(f.chute);
      }
      if (f.legs > 0.01) drawLegs(f.legs);
      drawLayerSet(layerList, f.groups);
      ctx.restore();
    }
    // The ladder and the astronaut stand in front of the rocket.
    if (f.space && (f.phase === "explore" || f.phase === "stow") && f.astro && f.astro.st !== "wait") {
      hh = hatch();
      drawLadder(hh, AH);
      drawAstronaut(f.astro);
    }

    f.clouds.forEach(function (c) { if (c.fg && !f.space) { var y = padY - c.rise + cam; if (y > -c.s && y < H + c.s) { ctx.globalAlpha = 0.92; drawCloud(c.x, y, c.s); ctx.globalAlpha = 1; } } });
    if (f.ufo) drawUFO(f.ufo);

    // Speed lines when going fast.
    var sp = Math.abs(f.phase === "descent" ? 0 : f.v) / H;
    var inten = clamp((sp - 1.2) / 1.8, 0, 1);
    if (inten > 0 && !reduce) {
      ctx.strokeStyle = "rgba(255,255,255," + (0.5 * inten).toFixed(3) + ")";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      speedLines.forEach(function (s) {
        var len = H * 0.18 * s.l * inten;
        var y = ((s.y * H * 1.4 + f.P * 1.6 * s.l) % (H * 1.4) + H * 1.4) % (H * 1.4) - len;
        ctx.moveTo(s.x * W, y); ctx.lineTo(s.x * W, y + len);
      });
      ctx.stroke();
    }

    // Rings, sparkles and words.
    f.rings.forEach(function (r) {
      var k = r.life / r.max;
      ctx.globalAlpha = 1 - k;
      ctx.lineWidth = r.w * (1 - k) + 2;
      ctx.strokeStyle = r.col;
      ctx.beginPath(); ctx.arc(r.x, r.y + (r.world ? cam : 0), r.r * (1 + k * 3), 0, Math.PI * 2); ctx.stroke();
    });
    ctx.globalAlpha = 1;
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = OUT;
    ctx.lineJoin = "round";
    for (i = 0; i < ps.length; i++) {
      p = ps[i];
      if (p.kind !== 2) continue;
      a = 1 - p.age / p.life;
      var rr2 = p.r * (a < 0.3 ? a / 0.3 : 1);
      ctx.fillStyle = p.col;
      drawStar4(p.x, p.y + cam, rr2, p.rot + p.age * 4);
      ctx.fill(); ctx.stroke();
    }
    var fs = Math.round(clamp(Math.min(W, H) * 0.075, 26, 64));
    ctx.font = "800 " + fs + "px 'Baloo 2', 'Trebuchet MS', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    f.texts.forEach(function (t) {
      var k = t.age / t.life;
      ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
      var s = k < 0.15 ? 0.5 + k / 0.15 * 0.5 : 1;
      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.scale(s, s);
      ctx.lineWidth = fs * 0.16;
      ctx.strokeStyle = OUT;
      ctx.strokeText(t.text, 0, 0);
      ctx.fillStyle = t.col;
      ctx.fillText(t.text, 0, 0);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (f.flash > 0) { ctx.globalAlpha = f.flash; ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  }

  function loop(t) {
    if (!running) return;
    var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
    lastT = t;
    if (fl) {
      // (Automated checks with ?debug can run the trip faster.)
      for (var k = 0; k < (dbg ? dbg.speed : 1) && fl; k++) step(dt);
      if (fl) draw();
    }
    requestAnimationFrame(loop);
  }

  // ---------- Play timer (shared, common/toybox.js) ----------
  // Gauge in the corner of the picture: the bar is the time left.
  function drawTimer(info) {
    if (info.phase !== "running" && info.phase !== "ending") { $("fuel").hidden = true; return; }
    var f = info.fraction;
    $("fuel").hidden = false;
    var fill = $("fuelFill");
    fill.style.width = (f * 100).toFixed(1) + "%";
    fill.style.background = f > 0.5 ? "#2E9E5B" : (f > 0.2 ? "#FFC93C" : "#F77F00");
    var num = $("fuelNum");
    num.hidden = !(info.showMinutes && info.phase === "running");
    num.textContent = String(info.minutes);
  }

  // Ending: the night falls (CSS), a rocket in the air lands, and the rocket rests once it is home on its pad.
  // With the Goodbye launch option, it rests after that last flight lands.
  var endingDone = null, goodbyeWanted = false;
  function tryDone() {
    if (!endingDone || fl || goodbyeWanted) return;
    endingDone();
    endingDone = null;
  }
  function onEnding(done) {
    endingDone = done;
    // The module shows the Goodbye button only when that option is on.
    goodbyeWanted = !$("tb-goodbye").hidden;
    // A rocket on a trip turns for home right away (a short trip home) and lands; it just can't go again.
    $("landbar").hidden = true;
    if (fl && !fl.goodbye) {
      if (fl.done) setTimeout(function () { if (fl && fl.done) closeFlight(); }, 1200);
      else homeNow();
    }
    tryDone();
  }
  function restArt() {
    return '<svg class="rest-art" viewBox="-260 -600 520 660" preserveAspectRatio="xMidYMax slice" aria-hidden="true">' + sceneSVG(state, true) + "</svg>";
  }

  showTab(tab);
  render();
  // The old sound key said "on"/"off"; the shared module reads "1" for on.
  try { if (localStorage.getItem(OLD_SKEY) === "on") localStorage.setItem(OLD_SKEY, "1"); } catch (e) { /* ignore */ }
  // The shared grown-up layer: play timer, sound, Big. It may start the ending right away
  // (a timer that ran out while away), so the rocket is drawn first.
  Toybox.init({
    app: "rocket-builder",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the rocket flies home, lands and rests, and the controls lock.",
    goodbyeOption: "End with a Goodbye launch button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Goodbye launch",
    farewellDone: "Bye bye!",
    restLine: "The rocket is resting.",
    restLine2: "It will be right here next time.",
    restArt: restArt,
    soundNote: "Soft beeps and rocket rumble. Hold for 2 seconds.",
    legacy: { timer: OLD_TKEY, sound: OLD_SKEY, big: OLD_BKEY },
    onEnding: onEnding,
    // The goodbye flight takes about 26 s, and a trip cut short flies home in about 30 s at most;
    // give it room to land before the rest screen.
    endingMaxMs: 36000,
    onGoodbye: function () { openFlight(true); },
    // A goodbye flight still in the air finishes on top of the rest screen and closes itself when it lands.
    onRest: function () { endingDone = null; if (!F.hidden && !(fl && fl.goodbye && !fl.done)) closeFlight(); },
    onWake: function () { endingDone = null; goodbyeWanted = false; },
    onSound: function (on) { if (on) setTimeout(chime, 60); else stopRumble(); },
    onTimer: drawTimer
  });
  $("stage").appendChild($("tb-farewell"));

  // Test hook for automated checks, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) { dbg = { speed: 1, flight: function () { return fl; } }; window.__rocket = dbg; }
})();
</script>
<script>
  // Offline support: register the service worker when served over http(s).
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline install unavailable */ });
    });
  }
</script>
</body>
