<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jigsaw</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jigsaw">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tb-stage .tbadge { position: absolute; right: 10px; top: 10px; z-index: 3; pointer-events: none; }
.tb-counter[hidden] { display: none; }

/* Picture chooser and My puzzles shelf: grids of big picture cards over the stage. */
.cards { position: absolute; inset: 0; display: grid; justify-content: center; align-content: center; gap: 12px;
  padding: 62px 12px 12px; touch-action: manipulation; }
.cards[hidden] { display: none; }
.card { font: inherit; color: #1D2340; background: #FFFFFF; border: 4px solid #1D2340; border-radius: 18px;
  box-shadow: 4px 4px 0 #1D2340; padding: 5px 5px 2px; display: flex; flex-direction: column; align-items: stretch;
  gap: 2px; cursor: pointer; min-width: 0; transition: transform 0.08s ease, box-shadow 0.08s ease; position: relative; }
.card:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #1D2340; }
.card canvas { display: block; width: 100%; aspect-ratio: 4 / 3; height: auto; border-radius: 10px; border: 3px solid #1D2340; background: #E6F2FF; }
.card span { font-weight: 800; font-size: 1.05rem; line-height: 1.15; text-align: center; white-space: nowrap; overflow: hidden; }
.card.now { background: var(--accent); }
.card .mark { position: absolute; right: -8px; top: -10px; width: 40px; height: 40px; pointer-events: none; }
.card.pop { animation: cardpop 0.5s cubic-bezier(.3,1.6,.5,1); }
@keyframes cardpop { 0% { transform: scale(0.9); } 100% { transform: scale(1); } }
/* The shelf: finished puzzles stand on wooden planks; the others wait as faint pictures. */
.shelf .card { background: #FFF6E0; box-shadow: 0 9px 0 -1px #B9773A, 4px 13px 0 -1px #1D2340; }
.shelf .card.empty { background: rgba(255, 255, 255, 0.45); border-style: dashed; border-color: rgba(29, 35, 64, 0.35); box-shadow: 0 9px 0 -1px rgba(185, 119, 58, 0.45); cursor: default; }
.shelf .card.empty canvas { filter: grayscale(1) opacity(0.28); border-color: rgba(29, 35, 64, 0.25); }
.shelf .card.empty span { color: rgba(29, 35, 64, 0.4); }
.chip { position: absolute; left: 50%; top: -12px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 4px;
  background: #FFFFFF; border: 3px solid #1D2340; border-radius: 999px; padding: 0 8px 0 5px; font-weight: 800; font-size: 0.95rem;
  line-height: 1.4; box-shadow: 2px 2px 0 #1D2340; pointer-events: none; white-space: nowrap; }
.chip svg { width: 22px; height: 17px; }

/* Panel: the green Go (Peek / Next puzzle), the size choices, then the tabs. */
.btn.tb-go { display: inline-flex; align-items: center; justify-content: center; gap: 10px; white-space: nowrap; }
.btn.tb-go svg { width: 38px; height: 30px; flex: none; }
.btn.tb-go[hidden] { display: none; }
.sizes { grid-template-columns: repeat(3, 1fr); }
.sizes[hidden] { display: none; }
.sizes .tb-tile { min-height: 64px; gap: 0; }
.sizes .tb-tile svg { width: 46px; height: 35px; }
.sizes .tb-tile b { font-size: 1.25rem; line-height: 1; font-weight: 800; }
.tb-tabs .btn[hidden] { display: none; }
.tb-tabs .btn.news { animation: newsglow 1s ease-in-out 3; }
@keyframes newsglow { 50% { transform: scale(1.08); background: var(--accent); } }

/* Phones held upright: everything in one row so the board stays big. */
@media (orientation: portrait) and (max-width: 600px) {
  .sizes { grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .sizes .tb-tile { min-height: 58px; padding: 2px; }
  .sizes .tb-tile svg { width: 36px; height: 27px; }
  .sizes .tb-tile b { font-size: 1.1rem; }
  body.m-play .sizes { display: none; }
  .cards { padding: 12px 10px 52px; gap: 10px; }
  .card { border-width: 3px; border-radius: 14px; box-shadow: 3px 3px 0 #1D2340; padding: 4px 4px 1px; }
  .card canvas { border-width: 2px; border-radius: 8px; }
  .card span { font-size: 0.95rem; }
}
/* Phones held sideways: a narrower panel, so the play area gets the room. */
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: min(36%, 300px); }
  .sizes { gap: 5px; }
  .sizes .tb-tile { min-height: 50px; padding: 2px; }
  .sizes .tb-tile svg { width: 34px; height: 26px; }
  .sizes .tb-tile b { font-size: 1.05rem; }
  .tb-tabs { flex-wrap: wrap; }
  .tb-tabs .btn { flex: 1 1 40%; min-height: 44px; }
  .cards { padding: 10px 10px 50px; gap: 8px; }
  .card { border-width: 3px; border-radius: 14px; box-shadow: 3px 3px 0 #1D2340; padding: 3px 3px 0; }
  .card canvas { border-width: 2px; border-radius: 8px; }
  .card span { font-size: 0.9rem; }
  .btn.tb-go svg { width: 30px; height: 24px; }
}
/* Tablets: bigger size tiles. */
@media (min-width: 700px) and (min-height: 700px) {
  .sizes .tb-tile { min-height: 92px; }
  .sizes .tb-tile svg { width: 60px; height: 45px; }
  .sizes .tb-tile b { font-size: 1.5rem; }
  .card span { font-size: 1.25rem; }
  .cards { gap: 16px; padding: 74px 18px 18px; }
}
@media (orientation: landscape) {
  .tb-body .tb-panel .sizes { flex: 0 0 auto; }
  .tb-panel .tb-tabs { margin-top: auto; flex-wrap: wrap; }
  .tb-panel .tb-tabs .btn { flex: 1 1 40%; }
}
/* Phones held sideways, while puzzling: a slim panel (Peek and the tabs), so the board gets the room. */
@media (orientation: landscape) and (max-height: 520px) {
  body.m-play .sizes { display: none; }
  body.m-play .tb-body .tb-panel { width: 216px; }
}

/* Surprise on the picture chooser: the cards hop like popcorn, or rise in a wave. */
@keyframes jgHop { 0%,100% { transform: translate(0,0) rotate(0); } 25% { transform: translate(var(--hx), -26px) rotate(var(--hr)); } 50% { transform: translate(calc(var(--hx) * 1.4), 0) rotate(0); } 75% { transform: translate(calc(var(--hx) * 0.6), -18px) rotate(calc(var(--hr) * -1)); } }
@keyframes jgWave { 0%,100% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-22px) rotate(-5deg) scale(1.05); } 70% { transform: translateY(4px) rotate(2deg); } }
.cards .card.jg-hop { animation: jgHop 1.5s ease-in-out both; animation-delay: var(--d); }
.cards .card.jg-wave { animation: jgWave 1.2s ease-in-out both; animation-delay: var(--d); }
.jg-spark { position: absolute; z-index: 7; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; animation: jgSpark 0.9s ease-out both; }
@keyframes jgSpark { 0% { transform: translate(0,0) scale(0.3) rotate(0); opacity: 1; } 100% { transform: translate(var(--sx), var(--sy)) scale(1) rotate(160deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .cards .card.jg-hop, .cards .card.jg-wave { animation-duration: 0.8s; animation-name: jgGlow; }
  @keyframes jgGlow { 0%,100% { filter: none; } 50% { filter: brightness(1.18) saturate(1.2); } }
}
/* Big: the controls go away. */
body.big .tb-panel { display: none; }
/* Time is up: the board dims and the controls rest. */
#cv, .cards { transition: filter 1.8s ease; }
body.ending #cv, body.ending .cards, body.resting #cv { filter: brightness(0.62) saturate(0.8); }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }
.tb-stage .toast { position: absolute; top: 10px; z-index: 6; max-width: calc(100% - 20px); font-size: 1.25rem; }
.tb-stage .farewell { position: absolute; top: 12px; bottom: auto; z-index: 6; }

/* Ghost hand: a see-through hand that shows the main move once (same look in every app). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-carry img { display: block; width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
@media (prefers-reduced-motion: reduce) {
  .card, .btn { transition: none; }
  .card.pop, .tb-tabs .btn.news { animation: none; }
}
</style>
</head>
<body class="m-choose">
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Jigsaw</h1>
    <button class="btn tb-iconbtn" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>
  <div class="tb-body">
    <main class="tb-stage" id="stage">
      <canvas id="cv" role="img" aria-label="A jigsaw puzzle. Drag the pieces onto the board."></canvas>
      <div class="cards chooser" id="chooser" aria-label="Pick a picture"></div>
      <div class="cards shelf" id="shelf" aria-label="My puzzles" hidden></div>
      <div class="tb-counter" id="counter" hidden>Pieces: 0 of 6</div>
      <div class="tb-coach" id="coach">Pick a picture!</div>
      <svg class="tbadge" id="badge" viewBox="0 0 60 60" hidden aria-hidden="true"></svg>
    </main>
    <section class="tb-panel">
      <button class="btn tb-go" id="goBtn" hidden></button>
      <div class="tb-choices sizes" id="sizes" aria-label="How many pieces"></div>
      <nav class="tb-tabs">
        <button class="btn" id="tabPics" aria-pressed="true">Pictures</button>
        <button class="btn" id="tabShelf" aria-pressed="false" aria-label="My puzzles">My shelf</button>
        <button class="btn tb-new" id="newBtn" hidden>New</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  var OUT = "#1D2340";
  var TAU = Math.PI * 2;
  var KEY = "jigsaw-v1";
  var SIZES = [4, 6, 9, 12, 16, 24];
  var GRIDS = { 4: [2, 2], 6: [3, 2], 9: [3, 3], 12: [4, 3], 16: [4, 4], 24: [6, 4] };
  var DEFAULT_SIZE = 6;
  var IW = 1200, IH = 900;            // every picture is drawn in a 1200 x 900 box (4:3)
  var DEBUG = /[?&]debug\b/.test(location.search);
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function (id) { return document.getElementById(id); };
  var DPR = Math.min(2, window.devicePixelRatio || 1);

  // Stop iOS pinch / double-tap zoom and the long-press menu.
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("gesturechange", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // ---------- Small helpers ----------
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }
  function easeOut(u) { u = clamp(u, 0, 1); return 1 - Math.pow(1 - u, 3); }
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Keyframes [[t, v1, v2, ...], ...] with a smooth step between them.
  function kf(frames, t) {
    if (t <= frames[0][0]) return frames[0].slice(1);
    for (var i = 1; i < frames.length; i++) {
      if (t <= frames[i][0]) {
        var a = frames[i - 1], b = frames[i], u = smooth((t - a[0]) / (b[0] - a[0])), out = [];
        for (var j = 1; j < a.length; j++) out.push(a[j] + (b[j] - a[j]) * u);
        return out;
      }
    }
    return frames[frames.length - 1].slice(1);
  }
  function now() { return performance.now(); }

  // ---------- SVG helpers for the pictures (static parts) ----------
  function f1(v) { return Math.round(v * 10) / 10; }
  function R(x, y, w, h, rx, fill, ex) { return '<rect x="' + f1(x) + '" y="' + f1(y) + '" width="' + f1(w) + '" height="' + f1(h) + '" rx="' + (rx || 0) + '" fill="' + fill + '"' + (ex || "") + "/>"; }
  function C(cx, cy, r, fill, ex) { return '<circle cx="' + f1(cx) + '" cy="' + f1(cy) + '" r="' + f1(r) + '" fill="' + fill + '"' + (ex || "") + "/>"; }
  function E(cx, cy, rx, ry, fill, ex) { return '<ellipse cx="' + f1(cx) + '" cy="' + f1(cy) + '" rx="' + f1(rx) + '" ry="' + f1(ry) + '" fill="' + fill + '"' + (ex || "") + "/>"; }
  function P(d, fill, ex) { return '<path d="' + d + '" fill="' + fill + '"' + (ex || "") + "/>"; }
  function L(x1, y1, x2, y2, col, w) { return '<line x1="' + f1(x1) + '" y1="' + f1(y1) + '" x2="' + f1(x2) + '" y2="' + f1(y2) + '" stroke="' + (col || OUT) + '" stroke-width="' + (w || 7) + '"/>'; }
  var NS = ' stroke="none"';
  function SW(w) { return ' stroke-width="' + w + '"'; }
  function grad(id, stops) {
    return '<linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' + stops.map(function (s) {
      return '<stop offset="' + s[0] + '" stop-color="' + s[1] + '"/>';
    }).join("") + "</linearGradient>";
  }
  function cloud(x, y, s, fill) {
    return P("M" + f1(x - 80 * s) + " " + f1(y + 20 * s) + " A" + f1(32 * s) + " " + f1(32 * s) + " 0 0 1 " + f1(x - 45 * s) + " " + f1(y - 25 * s) +
      " A" + f1(48 * s) + " " + f1(48 * s) + " 0 0 1 " + f1(x + 35 * s) + " " + f1(y - 38 * s) +
      " A" + f1(40 * s) + " " + f1(40 * s) + " 0 0 1 " + f1(x + 85 * s) + " " + f1(y + 20 * s) + " Z", fill || "#FFFFFF", SW(6));
  }
  function sun(x, y, r) {
    var s = "";
    for (var i = 0; i < 10; i++) {
      var a = i * Math.PI / 5;
      s += L(x + Math.cos(a) * (r + 16), y + Math.sin(a) * (r + 16), x + Math.cos(a) * (r + 42), y + Math.sin(a) * (r + 42), "#FFB000", 12);
    }
    return s + C(x, y, r, "#FFD23F");
  }
  function tree(x, y, s) {
    return R(x - 10 * s, y - 10 * s, 20 * s, 70 * s, 6, "#9A5F2C", SW(6)) + C(x, y - 40 * s, 46 * s, "#3FAE4F", SW(6)) +
      C(x - 26 * s, y - 14 * s, 30 * s, "#4CC25E", SW(6)) + C(x + 26 * s, y - 16 * s, 30 * s, "#4CC25E", SW(6));
  }
  function svgDoc(pxW, defs, body) {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + pxW + '" height="' + Math.round(pxW * IH / IW) + '" viewBox="0 0 ' + IW + " " + IH + '">' +
      "<defs>" + defs + "</defs>" +
      '<g stroke="' + OUT + '" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">' + body + "</g></svg>";
  }

  // ---------- Canvas helpers for the moving parts ----------
  var P2D = {};
  function pd(c, d, fill, lw) {
    var p = P2D[d] || (P2D[d] = new Path2D(d));
    if (fill) { c.fillStyle = fill; c.fill(p); }
    if (lw !== 0) { c.strokeStyle = OUT; c.lineWidth = lw || 7; c.stroke(p); }
  }
  function fs(c, fill, lw) {
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (lw !== 0) { c.strokeStyle = OUT; c.lineWidth = lw || 7; c.stroke(); }
  }
  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
  function tube(c, x1, y1, x2, y2, w, fill) {
    c.lineCap = "round";
    c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2);
    c.strokeStyle = OUT; c.lineWidth = w + 14; c.stroke();
    c.strokeStyle = fill; c.lineWidth = w; c.stroke();
  }
  function star(c, x, y, r, rot, fill) {
    c.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = rot + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r * 0.45 : r;
      if (i) c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); else c.moveTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    c.closePath();
    fs(c, fill, Math.max(2, r * 0.16));
  }
  // Deterministic bursts of stars (no state, so an animation can replay exactly).
  function burst(c, x, y, age, life, n, spread, seed) {
    if (age < 0 || age > life) return;
    var u = age / life, r = rng(seed);
    c.globalAlpha = 1 - u * u;
    for (var i = 0; i < n; i++) {
      var a = r() * TAU, d = spread * (0.4 + 0.6 * r()) * easeOut(u);
      star(c, x + Math.cos(a) * d, y + Math.sin(a) * d - 20 * u, 12 + 8 * r(), u * 3, ["#FFD23F", "#FF6FD8", "#3DB4FF", "#FFFFFF"][i % 4]);
    }
    c.globalAlpha = 1;
  }

  // ======================================================================
  // The pictures. Each has a static SVG (base) and a draw(c, t) for its moving parts, in 1200 x 900
  // units. t = 0 is the resting pose (the puzzle picture); t in (0, dur) is the "comes alive" show,
  // which ends back on the resting pose so the finished picture stays the same.
  // ======================================================================
  var PICS = [];

  // ---- 1. Excavator digging ----
  (function () {
    function base() {
      var s = "";
      s += R(0, 0, IW, IH, 0, "url(#skyA)", NS);
      s += sun(1060, 130, 60);
      s += cloud(230, 140, 1.1) + cloud(640, 95, 0.8) + cloud(860, 230, 0.6);
      s += P("M0 520 Q 180 400 380 500 Q 560 410 760 490 Q 980 400 1200 470 V 720 H 0 Z", "#9AD975");
      s += tree(1110, 470, 0.8) + tree(90, 500, 0.7);
      s += P("M0 600 Q 300 530 620 590 Q 900 540 1200 585 V 900 H 0 Z", "#5DB04E");
      s += P("M0 665 Q 400 625 760 650 Q 1000 668 1200 642 V 900 H 0 Z", "#D99B5C");
      [[120, 790, 60], [330, 830, 44], [620, 800, 70], [980, 840, 50], [1120, 780, 36]].forEach(function (q) { s += E(q[0], q[1], q[2], q[2] * 0.3, "#C2834A", NS); });
      s += P("M690 725 Q 760 600 860 560 Q 940 525 1010 582 Q 1100 650 1165 740 Z", "#A8652E");
      s += C(900, 640, 16, "#9AA3B5", SW(5)) + C(1010, 690, 12, "#C9D3E0", SW(5)) + C(810, 690, 10, "#9AA3B5", SW(5));
      // traffic cones
      [[70, 760], [150, 800]].forEach(function (q) {
        var x = q[0], y = q[1];
        s += R(x - 34, y, 68, 14, 4, "#FF7A1A", SW(6)) + P("M" + (x - 22) + " " + y + " L" + (x - 6) + " " + (y - 70) + " L" + (x + 6) + " " + (y - 70) + " L" + (x + 22) + " " + y + " Z", "#FF7A1A", SW(6)) +
          P("M" + (x - 15) + " " + (y - 28) + " L" + (x + 15) + " " + (y - 28) + " L" + (x + 11) + " " + (y - 44) + " L" + (x - 11) + " " + (y - 44) + " Z", "#FFFFFF", SW(4));
      });
      // tracks and wheels
      s += R(190, 640, 420, 92, 46, "#3A3F55");
      [240, 320, 400, 480, 560].forEach(function (x) { s += C(x, 686, 26, "#9AA3B5", SW(6)) + C(x, 686, 8, "#4A5578", NS); });
      s += R(270, 616, 280, 30, 8, "#4A5578");
      // body, counterweight, cab

  // Ghost hand (master copy: tools/snippets/ghost-hand.js)
  // ======================================================================
  function makeGhost(plan, opt) {
    opt = opt || {};
    var IDLE = opt.idle || 4500, MAX = opt.max || 2;
    var last = Date.now(), shown = 0, armed = true, learned = false, run = null, el = null;
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    function build() {
      el = document.createElement("div");
      el.className = "ghosthand";
      el.setAttribute("aria-hidden", "true");
      el.innerHTML = '<svg viewBox="-24 -18 64 84"><circle class="gh-press" cx="0" cy="0" r="17" fill="rgba(255,201,60,0.55)"/>' +
        '<g fill="#FFFFFF" stroke="#1D2340" stroke-width="3" stroke-linejoin="round">' +
        '<rect x="-9" y="-6" width="18" height="40" rx="9"/><rect x="-12" y="22" width="44" height="40" rx="16"/>' +
        '<rect x="10" y="14" width="14" height="24" rx="7"/></g>' +
        '<circle cx="0" cy="2" r="5" fill="rgba(255,201,60,0.9)"/></svg>';
      el.insertBefore(carryEl, el.firstChild);
      document.body.appendChild(el);
    }
    function stop() { run = null; if (el) { el.style.display = "none"; carryEl.innerHTML = ""; } }
    var carryEl = document.createElement("div");
    carryEl.className = "gh-carry";
    function poke() { last = Date.now(); armed = true; if (run) stop(); }
    document.addEventListener("pointerdown", poke, true);
    document.addEventListener("keydown", poke, true);
    function blocked() {
      if (document.hidden) return true;
      if (window.Toybox && (Toybox.sheetOpen() || Toybox.timer.phase() === "ending" || Toybox.timer.phase() === "resting")) return true;
      return !!(opt.ok && !opt.ok());
    }
    function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function at(pts, f) {
      if (pts.length < 2) return pts[0];
      var segs = [], tot = 0, i;
      for (i = 1; i < pts.length; i++) { var l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); tot += l; }
      var d = f * tot;
      for (i = 0; i < segs.length; i++) {
        if (d <= segs[i] || i === segs.length - 1) { var t = segs[i] ? Math.min(1, d / segs[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; }
        d -= segs[i];
      }
      return pts[pts.length - 1];
    }
    function frame() {
      if (!run) return;
      var t = (Date.now() - run.t0) / run.dur, p = run.p, s = run.s, x, y, a, press, sc = 1;
      if (t >= 1) { stop(); return; }
      if (p.tap || p.pts.length < 2) {
        var pt = p.pts[0];
        x = pt[0]; y = pt[1];
        a = t < 0.15 ? t / 0.15 : (t > 0.85 ? (1 - t) / 0.15 : 1);
        press = (t > 0.3 && t < 0.42) || (t > 0.55 && t < 0.67);
        sc = press ? 0.92 : 1;
        if (t < 0.3) { var k = 1 - t / 0.3; x += 26 * s * k; y += 30 * s * k; }
      } else {
        a = t < 0.1 ? t / 0.1 : (t > 0.9 ? (1 - t) / 0.1 : 1);
        var f = reduce ? 0.5 : ease(Math.max(0, Math.min(1, (t - 0.16) / 0.66)));
        var q = at(p.pts, f); x = q[0]; y = q[1];
        press = t > 0.12 && t < 0.86;
        sc = t < 0.12 ? 1.12 - 0.12 * (t / 0.12) : 1;
      }
      el.style.opacity = (0.85 * a).toFixed(3);
      el.style.transform = "translate(" + (x - 24 * s) + "px," + (y - 18 * s) + "px) rotate(-14deg) scale(" + sc + ")";
      el.lastChild.firstChild.style.opacity = press ? "1" : "0";
      carryEl.style.opacity = press ? "0.75" : "0";
      requestAnimationFrame(frame);
    }
    function show(p) {
      if (!el) build();
      var s = Math.max(1, Math.min(1.7, Math.min(innerWidth, innerHeight) / 360));
      el.style.width = (64 * s) + "px"; el.style.height = (84 * s) + "px";
      el.style.transformOrigin = (24 * s) + "px " + (18 * s) + "px";
      el.style.display = "block";
      carryEl.innerHTML = p.carry ? p.carry.html : "";
      if (p.carry) {
        var c = p.carry.size;
        carryEl.style.cssText = "position:absolute;left:" + (24 * s - c / 2) + "px;top:" + (18 * s - c / 2) + "px;width:" + c + "px;height:" + c + "px";
      }
      run = { p: p, s: s, t0: Date.now(), dur: p.dur || (p.tap ? 2400 : 3200) };
      requestAnimationFrame(frame);
    }
    setInterval(function () {
      if (run || learned || !armed || shown >= MAX || Date.now() - last < IDLE) return;
      if (blocked()) { last = Date.now(); return; }
      var p = plan();
      if (!p || !p.pts || !p.pts.length) return;
      armed = false; shown++;
      show(p);
    }, 250);
    return {
      learned: function () { learned = true; stop(); },
      again: function () { learned = false; shown = 0; armed = true; last = Date.now(); },
      poke: poke,
      show: function () { var p = plan(); if (p) show(p); return !!p; }
    };
  }
  function ghostPt(elm, fx2, fy2) {
    var r = elm.getBoundingClientRect();
    return [r.left + r.width * fx2, r.top + r.height * fy2];
  }
  // The best piece to show: one that fits next to pieces already down (or a corner), nearest its spot.
  function bestPiece() {
    if (!puz || !LY) return null;
    var placed = {};
    puz.pieces.forEach(function (p) { if (p.placed) placed[p.r + "," + p.c] = 1; });
    var best = null, bs = -1e9;
    order.forEach(function (p) {
      if (p.heldBy != null || p.anim) return;
      var nb = (placed[(p.r - 1) + "," + p.c] || 0) + (placed[(p.r + 1) + "," + p.c] || 0) + (placed[p.r + "," + (p.c - 1)] || 0) + (placed[p.r + "," + (p.c + 1)] || 0);
      var corner = (p.r === 0 || p.r === puz.R - 1) && (p.c === 0 || p.c === puz.C - 1) ? 1 : 0;
      var score = nb * 3 + corner * 2 - Math.hypot(p.x - p.homeX, p.y - p.homeY) / 400;
      if (score > bs) { bs = score; best = p; }
    });
    return best;
  }
  var ghost = makeGhost(function () {
    if (st.mode === "choose") {
      var card = chooser.children[0];
      return card ? { pts: [ghostPt(card, 0.5, 0.45)], tap: true } : null;
    }
    if (st.mode !== "play" || !st.cur || st.cur.done || !LY) return null;
    var p = bestPiece();
    if (!p) return null;
    if (!p.dataURL) { try { p.dataURL = p.img.toDataURL(); } catch (e) { p.dataURL = ""; } }
    var r = cv.getBoundingClientRect(), size = Math.max(p.w, p.h);
    return {
      pts: [[r.left + p.x, r.top + p.y], [r.left + p.homeX, r.top + p.homeY]],
      carry: p.dataURL ? { html: '<img alt="" src="' + p.dataURL + '">', size: size } : null,
      dur: 3600
    };
  }, { max: 3 });

  // ======================================================================
  // Timer ending, rest art, Big
  // ======================================================================
  var endingDone = null;
  function onEnding(done) {
    // hands let go; pieces settle where they are, moving pieces finish their move, the board dims
    Object.keys(held).forEach(function (id) { var h = held[id]; delete held[id]; h.p.heldBy = null; h.p.tsc = inBoard(h.p.x, h.p.y) ? 1 : (LY ? LY.t : 1); });
    peekT0 = -1e9; aliveT0 = -1e9; mo = null;
    if (puz) puz.pieces.forEach(function (p) { p.hop = null; });
    if (view) viewT0 = -1e9;
    endingDone = function () { setTimeout(done, 1800); };
    dirty = true;
  }
  function restArt() {
    return '<svg class="rest-art" viewBox="0 0 260 220" aria-hidden="true">' +
      '<g stroke="#1D2340" stroke-width="7" stroke-linejoin="round">' +
      '<path d="M30 80 H62 a18 18 0 1 1 36 0 H130 V112 a18 18 0 1 1 0 36 V180 H30 Z" fill="#3DB4FF"/>' +
      '<path d="M130 80 H162 a18 18 0 1 1 36 0 H230 V180 H130 V148 a18 18 0 1 0 0 -36 Z" fill="#FFD23F"/>' +
      "</g>" +
      '<g font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" fill="#1D2340" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">' +
      '<text x="196" y="52" font-size="34">z</text><text x="220" y="30" font-size="26">z</text><text x="238" y="14" font-size="20">z</text></g></svg>';
  }

  // ======================================================================
  // Start
  // ======================================================================
  load();
  if (window.Toybox && Toybox.fresh()) freshStart();
  buildChooser();
  resizeCanvas();
  if (st.mode === "play" && st.cur) startPuzzle(st.cur.pic, st.cur.n, st.cur.seed, st.cur.placed, st.cur.done, false);
  else setMode(st.mode === "shelf" ? "shelf" : "choose");
  if (st.cur && st.cur.done) { finishT0 = -1e9; aliveT0 = -1e9; }
  if ("ResizeObserver" in window) new ResizeObserver(function () { onResize(); }).observe(stage);
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", function () { setTimeout(onResize, 250); });

  Toybox.init({
    app: "jigsaw",
    big: { button: $("bigToggle") },
    badge: $("badge"),
    timerIntro: "When time is up, the pieces settle, the board dims and the controls lock.",
    goodbyeOption: "End with a Goodnight button to press",
    farewellText: "Time to say goodnight",
    goodbyeLabel: "Goodnight, puzzle",
    farewellDone: "Night night, puzzle!",
    restLine: "The puzzle is resting.",
    restLine2: "It will be right here next time.",
    restArt: restArt,
    soundNote: "Soft clicks when a piece fits. Hold for 2 seconds.",
    onEnding: onEnding,
    onGoodbye: function () {
      if (LY && st.mode === "play") for (var i = 0; i < 4; i++) fx.push({ kind: "snap", x: LY.bx + LY.bw * (0.2 + 0.2 * i), y: LY.by + LY.bh * 0.5, s: Math.min(LY.bw, LY.bh) * 0.4, t0: now() + i * 250, dur: 900, seed: i + 5 });
      dirty = true;
    },
    onRest: function () { dirty = true; },
    onWake: function () { endingDone = null; dirty = true; },
    onBig: function () { requestAnimationFrame(onResize); }
  });
  stage.appendChild($("tb-toast"));
  stage.appendChild($("tb-farewell"));
  requestAnimationFrame(frame);

  // Test hook (only with ?debug in the address).
  if (DEBUG) window.__jig = {
    state: function () {
      return { mode: st.mode, size: st.size, cur: st.cur && { pic: st.cur.pic, n: st.cur.n, done: st.cur.done, placed: st.cur.placed.filter(function (x) { return x; }).length },
        shelf: st.shelf.map(function (e) { return e.p + ":" + e.n.join("/"); }), layout: LY && { kind: LY.kind, t: LY.t, s: LY.s, bx: LY.bx, by: LY.by, bw: LY.bw, bh: LY.bh },
        coach: coach.classList.contains("off") ? "" : coach.textContent, counter: counter.hidden ? "" : counter.textContent, ready: !!(puz && big && LY), view: !!view };
    },
    // page coordinates of a loose piece's center and of its spot
    piece: function (i) { var p = puz.pieces[i], r = cv.getBoundingClientRect(); return { x: r.left + p.x, y: r.top + p.y, hx: r.left + p.homeX, hy: r.top + p.homeY, placed: p.placed, misses: p.misses, anim: !!p.anim, sc: p.sc }; },
    loose: function () { return order.map(function (p) { return p.i; }); },
    // put every piece but `leave` in place
    solveAllBut: function (leave) {
      leave = leave == null ? 1 : leave;
      var left = order.slice(0, Math.max(0, order.length - leave));
      left.forEach(function (p) { p.x = p.homeX; p.y = p.homeY; snapPiece(p); p.anim = null; p.sc = 1; });
      boardDirty = true; dirty = true;
    },
    ghost: function () { return ghost.show(); },
    pics: PICS.map(function (p) { return p.id; }),
    alive: function () { aliveT0 = now(); dirty = true; },
    surprise: function (k) { if (k) { mo = null; if (momentOk(k)) startMoment(k); return momentOk(k); } surprise(); },
    moment: function () { return mo ? mo.kind : ""; },
    snapshot: function () { return { placed: st.cur && st.cur.placed.join(""), loose: order.map(function (p) { return p.i + ":" + Math.round(p.x) + "," + Math.round(p.y); }).join(" "), pic: st.cur && st.cur.pic, seed: st.cur && st.cur.seed }; }
  };
})();
</script>
