# Check the Toybox, then publish it to GitHub Pages.
# Needs Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# "Run workflow" in the Actions tab republishes on demand.
#
# The check job builds _site (the published files only: no tools/, archive/, plans/, .github/ or Markdown), stamps the
# offline cache version into _site/sw.js, checks that every file is in the service worker's CORE list, and loads
# every page in a browser at four sizes (tools/smoke.js: page errors, page scroll). If any of that fails, nothing
# is published and the live Toybox stays as it was.
#
# The report job runs the slow finders (tools/fit.js: cut-off labels at five sizes; tools/buttons.js: taps that
# change nothing, phone and iPad) on the pages this push changed (tools/changed-pages.js; every page on "Run
# workflow"). It never blocks the deploy: agents read its log or the run summary and fix what it lists.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the full history: the cache version counts commits

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build _site (published files only)
        run: |
          mkdir _site
          git ls-files -z | grep -zvE '^(tools|archive|plans|\.github)/|\.md$|^\.' | xargs -0 cp --parents -t _site

      # The cache version goes up by one with every commit that changes a published file, so devices download
      # a fresh offline copy after each real change (and not after a change to the docs or tools only).
      - name: Stamp the offline cache version
        run: |
          n=$(( 1000 + $(git rev-list --count HEAD -- . ':(exclude)tools' ':(exclude)archive' ':(exclude)plans' ':(exclude).github' ':(exclude)*.md') ))
          sed -i 's/^const CACHE = "toybox-v0";/const CACHE = "toybox-v'"$n"'";/' _site/sw.js
          grep -q "^const CACHE = \"toybox-v$n\";" _site/sw.js || { echo "sw.js has no 'const CACHE = \"toybox-v0\";' line to stamp"; exit 1; }
          echo "Offline cache: toybox-v$n"

      - name: Every published file is cached offline
        run: node tools/check-site.js _site

      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Load every page (iPad and iPhone, both ways round)
        run: |
          npx --yes http-server@14.1.1 _site -p 8120 -c-1 -s &
          for i in $(seq 1 30); do curl -sf http://localhost:8120/ >/dev/null && break; sleep 1; done
          pages=$(grep -o '"\./[^"]*\.html"' _site/sw.js | sed 's/^"\.\///; s/"$//')
          SIZE=1180x820 node tools/smoke.js $pages > smoke-ipad-wide.txt 2>&1 & a=$!
          SIZE=820x1180 node tools/smoke.js $pages > smoke-ipad.txt 2>&1 & b=$!
          SIZE=390x844 MOBILE=1 node tools/smoke.js $pages > smoke-phone.txt 2>&1 & c=$!
          SIZE=844x390 MOBILE=1 node tools/smoke.js $pages > smoke-phone-wide.txt 2>&1 & d=$!
          fail=0
          for j in $a $b $c $d; do wait $j || fail=1; done
          for f in smoke-*.txt; do echo "== $f"; grep -v '^ok' "$f" || echo "all ok"; done
          exit $fail

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  report:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pages this change touched
        id: pages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then base="${{ github.event.before }}"
          else base=all; fi
          node tools/changed-pages.js "$base" HEAD > pages.txt
          echo "count=$(grep -c . pages.txt || true)" >> "$GITHUB_OUTPUT"
          echo "Pages to check:"; cat pages.txt

      - name: Install Playwright (Chromium)
        if: steps.pages.outputs.count != '0'
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Cut-off labels (fit.js) and dead buttons (buttons.js)
        if: steps.pages.outputs.count != '0'
        run: |
          npx --yes http-server@14.1.1 . -p 8120 -c-1 -s &
          for i in $(seq 1 30); do curl -sf http://localhost:8120/ >/dev/null && break; sleep 1; done
          pages=$(cat pages.txt)
          mkdir -p report
          SHOTS=report/fit node tools/fit.js $pages > report/fit.txt 2>&1 & a=$!
          SIZE=390x844 MOBILE=1 SHOTS=report/buttons-phone node tools/buttons.js $pages > report/buttons-phone.txt 2>&1 & b=$!
          SIZE=1180x820 SHOTS=report/buttons-ipad node tools/buttons.js $pages > report/buttons-ipad.txt 2>&1 & c=$!
          wait $a $b $c
          # The "ui warn" / "warn" lines measure pages against the reverted redesign's sizes (AGENTS.md §3): they
          # stay in the artifact's full files but are left out of the log and summary, so only real findings show.
          for f in report/fit.txt report/buttons-phone.txt report/buttons-ipad.txt; do
            grep -vE 'ui warn|^warn |^ok ' "$f" > "${f%.txt}-findings.txt" || true; done
          for f in report/*-findings.txt; do echo "===== $f"; cat "$f"; done
          { echo "## Toybox report"; echo; echo "Pages: $(tr '\n' ' ' < pages.txt)"; echo
            for f in report/*-findings.txt; do
              echo "### $(basename "$f" -findings.txt)"; echo '```'; tail -c 30000 "$f"; echo '```'; done; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.pages.outputs.count != '0'
        with:
          name: toybox-report
          path: report/
          retention-days: 14

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
