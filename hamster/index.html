<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hamster</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hamster">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #FFE3BD;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
.scene { background: #FFE3BD; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.scene .tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; pointer-events: none; }

/* Panel: the green "Give a treat" button, then the tab bar with Surprise. */
.btn.tb-go { display: flex; align-items: center; justify-content: center; gap: 10px; }
.tb-go svg { width: 40px; height: 40px; flex: none; overflow: visible; }
.tb-tabs .btn.tb-surprise { font-size: 1.15rem; }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }
.tb-go.pop svg { animation: treatPop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes treatPop { 0% { transform: scale(0.4) rotate(-30deg); } 100% { transform: none; } }

@media (orientation: landscape) {
  .tb-body .tb-panel { width: clamp(150px, 20vw, 240px); }
  .btn.tb-go { flex: 1 1 auto; max-height: 230px; flex-direction: column; gap: 2px; }
  .tb-go svg { width: clamp(40px, 11vh, 84px); height: clamp(40px, 11vh, 84px); }
  .tb-tabs { margin-top: auto; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .btn.tb-go { max-height: 160px; }
}
@media (min-width: 700px) and (min-height: 700px) {
  .tb-tabs .btn.tb-surprise { font-size: 1.3rem; }
  .tb-go svg { width: 52px; height: 52px; }
}
/* A soft yellow ring on "Give a treat" until he has given one this visit, like the rings on the untried things in
   the cage (index.js, "Coach line"): every untried thing glows at once, so none of them looks like the one to do. */
.btn.tb-go.is-invite { box-shadow: 0 var(--tb-lip-h) 0 var(--tb-go-lip), 0 0 0 4px rgba(255, 201, 60, 0.85);
  animation: treatInvite 2.6s ease-in-out infinite; }
@keyframes treatInvite {
  0%, 100% { box-shadow: 0 var(--tb-lip-h) 0 var(--tb-go-lip), 0 0 0 4px rgba(255, 201, 60, 0.85); }
  50% { box-shadow: 0 var(--tb-lip-h) 0 var(--tb-go-lip), 0 0 0 9px rgba(255, 201, 60, 0.4); }
}
@media (prefers-reduced-motion: reduce) {
  .tb-go.pop svg { animation: none; }
  .btn.tb-go.is-invite { animation: none; }
}

/* Rest picture: the hamster asleep in its little house (the rest screen itself is in common/toybox.css). */
.rest-art { border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }

</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Hamster</h1>
  </header>

  <div class="tb-body">
    <main class="tb-stage scene" id="scene">
      <canvas id="cv" aria-label="A hamster in its cage with a wheel, a food bowl, a water bottle and a little house"></canvas>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" hidden></svg>
      <div class="tb-coach off" id="coach" role="status" aria-live="polite"></div>
    </main>

    <section class="tb-panel">
      <button class="btn tb-go" id="treatBtn"><svg id="treatPic" viewBox="-30 -30 60 60" aria-hidden="true"></svg><span>Give a treat</span></button>
      <nav class="tb-tabs">
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
