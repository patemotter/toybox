<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Garden</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garden">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #BFE6FF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
.scene { background: #9ED8FF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.scene .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; }
body.big .tb-panel { display: none; }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }

/* Seed packets: picture tiles you can drag onto the soil (or tap, then tap a spot). */
.seeds .tb-tile { touch-action: none; cursor: grab; }
.seeds .tb-tile svg { pointer-events: none; }
.seeds .tb-tile span { pointer-events: none; white-space: nowrap; }
.seeds .tb-tile.lift { opacity: 0.45; }
.dragpacket { position: fixed; left: 0; top: 0; z-index: 40; width: 78px; height: 78px; pointer-events: none;
  filter: drop-shadow(5px 7px 0 rgba(29, 35, 64, 0.3)); will-change: transform; }
.dragpacket[hidden] { display: none; }
.dragpacket svg { display: block; width: 100%; height: 100%; }

/* Landscape: a slimmer panel so the garden gets the room. */
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(30%, 340px); }
  .seeds { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (orientation: landscape) and (min-width: 1000px) and (min-height: 700px) {
  .seeds .tb-tile { min-height: 132px; font-size: 1.2rem; }
  .seeds .tb-tile svg { width: 84px; height: 84px; }
}
/* Upright phones: all six packets in one row, pictures only (the packet shows what grows). */
@media (max-width: 600px) and (orientation: portrait) {
  .seeds { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
  .seeds .tb-tile { min-height: 64px; padding: 3px 2px; border-radius: 14px; }
  .seeds .tb-tile svg { width: 100%; max-width: 50px; height: auto; aspect-ratio: 1; }
  .seeds .tb-tile span { display: none; }
}
/* Phones held sideways: two columns of packets with their names. */
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: min(30%, 260px); }
  .seeds { gap: 6px; }
  .seeds .tb-tile { min-height: 0; padding: 3px 2px; font-size: 0.9rem; }
  .seeds .tb-tile svg { width: 38px; height: 38px; }
}
/* Upright tablets: one row of six. */
@media (min-width: 700px) and (min-height: 700px) and (orientation: portrait) {
  .seeds { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}
.rest-art { border: 3px solid #1D2340; border-radius: 18px; background: #22305E; }
/* Ghost hand: a see-through hand that shows the main move (same look in every app). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Garden</h1>
    <button class="btn tb-iconbtn" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage scene" id="stage">
      <canvas id="cv" aria-label="A garden bed with the sun, a cloud, a watering can, a trowel and a basket"></canvas>
      <div class="tb-counter" id="count">Picked: 0</div>
      <div class="tb-coach" id="coach" role="status" aria-live="polite">Plant a seed!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>

    <section class="tb-panel">
      <div class="tb-choices seeds" id="seeds"></div>
      <nav class="tb-tabs">
        <button class="btn tb-new" id="newBtn">New</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<div class="dragpacket" id="dragPacket" hidden></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ease(t) { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function now() { return performance.now(); }
  var TAU = Math.PI * 2, PI = Math.PI, OUT = "#1D2340";
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var phoneQ = window.matchMedia("(max-width: 600px), (orientation: landscape) and (max-height: 520px)");

  // ---------- What grows ----------
  // Stages: 0 seed under the soil, 1 sprout, 2 leaves, 3 bud (or flowers on a vegetable), 4 flower or ripe fruit.
  // Seeds need water to sprout; after that water or the sun grow a stage. Nothing wilts.
  var KINDS = ["sunflower", "carrot", "tomato", "strawberry", "pumpkin", "tulip"];
  var NAMES = { sunflower: "Sunflower", carrot: "Carrot", tomato: "Tomato", strawberry: "Strawberry", pumpkin: "Pumpkin", tulip: "Tulip" };
  // Fruit positions in plant units (x, y up is negative, radius).
  var FRUITS = {
    carrot: [[0, -2, 7]],
    tomato: [[-9, -24, 6.5], [9, -36, 6.5], [-7, -48, 6]],
    strawberry: [[-13, -6, 5.5], [1, -5, 5.5], [13, -7, 5.5]],
    pumpkin: [[0, -10, 12]]
  };
  var TOPS = { sunflower: [0, 16, 42, 92, 104], tulip: [0, 12, 26, 54, 64], carrot: [0, 9, 16, 24, 30], tomato: [0, 12, 24, 64, 64], strawberry: [0, 10, 16, 20, 20], pumpkin: [0, 10, 20, 22, 24] };
  var STEMS = { sunflower: [0, 13, 38, 78, 80], tulip: [0, 8, 18, 44, 44], carrot: [0, 6, 12, 18, 24], tomato: [0, 9, 20, 54, 54], strawberry: [0, 7, 11, 13, 13], pumpkin: [0, 7, 9, 12, 12] };
  var TULIPS = ["#FF4D6D", "#FF8FC8", "#A66CFF", "#FF9F1C"];
  var LEAF = "#5CC83B", LEAF2 = "#3E9E2E", STEM = "#47A934";
  var NSPOT = 5, NEED = 18, KEY = "garden-v1";
  function fruitsOf(k) { return FRUITS[k] ? FRUITS[k].length : 0; }
  // A giant strawberry: about half the fence high, resting on the soil beside its plant (one per bed).
  var GIANT = [[6, -14, 13]];
  function fl(p) { return p.g ? GIANT : FRUITS[p.k]; }
  function nF(p) { var f = fl(p); return f ? f.length : 0; }
  function hasGiant() { return S.spots.some(function (q) { return q && q.g; }); }

  var S = { spots: [], picked: 0, basket: [], giants: 0 };
  for (var si = 0; si < NSPOT; si++) S.spots.push(null);

  function mkSpot(k, s) {
    return { k: k, s: s || 0, w: 0, m: 0, c: Math.floor(Math.random() * TULIPS.length), pa: 1, pop: 0, wig: 0,
      ph: rand(0, TAU), next: 0, sh: 0, sc: 1, taps: 0, pull: null, from: null };
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        spots: S.spots.map(function (p) { return p ? { k: p.k, s: p.s, m: p.m, c: p.c, g: p.g ? 1 : 0 } : null; }),
        picked: S.picked, basket: S.basket.slice(-30), giants: S.giants
      }));
    } catch (e) { /* ignore */ }
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!o || typeof o !== "object") return;
      if (Array.isArray(o.spots)) for (var i = 0; i < NSPOT; i++) {
        var q = o.spots[i];
        if (q && NAMES[q.k]) {
          var p = mkSpot(q.k, clamp(q.s | 0, 0, 4));
          p.m = q.m | 0; p.c = clamp(q.c | 0, 0, TULIPS.length - 1);
          if (q.g && q.k === "strawberry" && !hasGiant()) { p.g = true; p.m &= 1; }
          if (p.s === 4 && nF(p) && !p.m) p.m = (1 << nF(p)) - 1;
          S.spots[i] = p;
        }
      }
      S.picked = Math.max(0, o.picked | 0);
      S.giants = clamp(o.giants | 0, 0, 99);
      if (Array.isArray(o.basket)) S.basket = o.basket.filter(function (k) { return !!FRUITS[k]; }).slice(-30);
    } catch (e) { /* ignore */ }
  }
  // Opening the Garden from the home screen: an empty bed and an empty basket (the dad's choice).
  if (window.Toybox && Toybox.fresh()) { try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } }
  load();

  // ---------- Canvas and layout ----------
  var stage = $("stage"), cv = $("cv"), ctx = cv.getContext("2d");
  var W = 0, H = 0, DPR = 1, L = {};
  var can = { x: 0, y: 0, tilt: 0, held: null, auto: null, acc: 0, fs: 1, px: 0, py: 0, ox: 0, oy: 0, lx: 0, ly: 0, still: 0 };
  var trowel = { x: 0, y: 0, a: 0, held: null, auto: null, dig: 0 };
  var cloud = { x: 0, y: 0, held: null, rainUntil: 0, acc: 0, moved: false };
  function resize() {
    W = stage.clientWidth; H = stage.clientHeight;
    if (!W || !H) return;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    layout();
  }
  function layout() {
    var m = Math.min(W, H), i;
    L.side = W / H > 1.15;
    L.phone = phoneQ.matches;
    L.soilTop = Math.round(H * (L.side ? 0.7 : 0.68));
    L.sp = L.side ? W * 0.14 : W * 0.175;
    L.spots = [];
    for (i = 0; i < NSPOT; i++) L.spots.push(L.side ? W * (0.22 + i * 0.14) : W * (0.19 + i * 0.175));
    L.k = Math.min(L.sp / 32, L.soilTop * 0.8 / 104);
    L.lw = clamp(L.k * 1.25, 2, 4);
    L.fenceTop = L.soilTop - Math.min(44 * L.k, L.soilTop * 0.42);
    L.sunR = clamp(m * 0.075, 24, 60);
    var topPad = L.phone ? 52 : 66;
    L.sunX = W * (L.side ? 0.7 : 0.72); L.sunY = topPad + L.sunR * 0.6;
    L.cw = clamp(W * (L.side ? 0.2 : 0.28), 90, 230); L.ch = L.cw * 0.5;
    L.cloudX = W * (L.side ? 0.36 : 0.36); L.cloudY = topPad + L.ch * 0.3;
    L.raise = (L.phone && !L.side) ? 46 : 0;
    L.base = H - 6 - L.raise;
    L.cs = clamp(m * (L.side ? 0.2 : 0.21), 62, 150);
    L.bw = clamp(m * (L.side ? 0.24 : 0.25), 76, 140);
    L.canHome = { x: L.side ? Math.max(L.cs * 0.42 + 4, W * 0.08) : L.cs * 0.45 + 8, y: L.base - L.cs * 0.33 };
    L.bx = W - L.bw / 2 - 6;
    L.tl = clamp(m * 0.2, 56, 130);
    if (L.side) { L.trA = 0.22; var tx = W * 0.075, ty = L.soilTop + L.tl * 0.1; L.trHome = { x: tx + Math.sin(L.trA) * L.tl * 0.8, y: ty - Math.cos(L.trA) * L.tl * 0.8 }; }
    else { L.trA = -1.3; L.trHome = { x: W * 0.47 - L.tl * 0.3, y: L.base - L.tl * 0.2 }; }
    L.specks = [];
    for (i = 0; i < Math.round(W * (H - L.soilTop) / 900); i++) L.specks.push([rand(0, W), rand(L.soilTop + 8, H), rand(1.2, 3.2), Math.random() < 0.5 ? "#7B4A24" : "#B07A47"]);
    L.pickets = [];
    var pw = clamp(W / 16, 18, 44);
    for (var x = -pw * 0.3; x < W + pw; x += pw * 1.22) L.pickets.push(x);
    L.pw = pw;
    if (!can.held && !can.auto) { can.x = L.canHome.x; can.y = L.canHome.y; can.tilt = 0; }
    if (!trowel.held && !trowel.auto) { trowel.x = L.trHome.x; trowel.y = L.trHome.y; trowel.a = L.trA; }
    if (!cloud.held) { cloud.x = L.cloudX; cloud.y = L.cloudY; }
    if (V.bird) { V.bird.y = L.fenceTop; }
  }
  function pos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  // ---------- Plant geometry ----------
  // A plant is drawn in plant units around its base on the soil line: scale sc, sway shear sh.
  function plantPt(i, lx, ly) {
    var p = S.spots[i];
    return { x: L.spots[i] + (lx + p.sh * ly) * p.sc, y: L.soilTop + ly * p.sc };
  }
  function fruitPt(i, j) {
    var p = S.spots[i], f = fl(p)[j], pt = plantPt(i, f[0], f[1]);
    if (p.pull && p.pull.j === j) { pt.x += p.pull.dx; pt.y += p.pull.dy; }
    return pt;
  }
  function ripe(p) { return p && p.pa >= 1 && p.s === 4 && nF(p) > 0 && p.m; }
  function flowerSpots(p) {
    // Open flowers a bee or butterfly can visit (plant units).
    if (!p || p.pa < 1) return [];
    if (p.k === "sunflower" && p.s === 4) return [[0, -86, 1]];
    if (p.k === "tulip" && p.s === 4) return [[0, -58, 1]];
    if (p.s === 3 && FRUITS[p.k]) {
      if (p.k === "pumpkin") return [[7, -10, 0]];
      return FRUITS[p.k].map(function (f) { return [f[0], f[1] - (p.k === "strawberry" ? 6 : 0), 0]; });
    }
    return [];
  }

  // ---------- Particles, flying fruit, visitors ----------
  var parts = [], flyers = [], sinkers = [];
  var V = { bee: null, fly: null, lady: null, bird: null, worm: null };
  var due = {}, paradeUntil = 0;
  var night = 0, shine = 0, sunGrowAt = 0, rainbowUntil = 0, rb = 0, ending = false, endT0 = 0;
  var wet = [0, 0, 0, 0, 0];
  var sel = null; // a seed packet picked with a tap
  var learned = { plant: false, water: false, sun: false, pick: false };
  function part(o) { if (parts.length < 500) parts.push(o); return o; }
  function sparkle(x, y, n, col) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, TAU), v = rand(30, 110);
      part({ t: "spark", x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: rand(0.8, 1.4), max: 1.4, c: col || ["#FFE14D", "#FF8FC8", "#7CF29A", "#FFFFFF"][i % 4], r: rand(3, 6) });
    }
  }
  function dirt(x, y, n) {
    for (var i = 0; i < n; i++) part({ t: "dirt", x: x + rand(-8, 8), y: y, vx: rand(-90, 90), vy: rand(-220, -90), life: rand(0.6, 1), max: 1, c: Math.random() < 0.5 ? "#7B4A24" : "#9A6435", r: rand(2.5, 5) });
  }
  function heart(x, y, n) { for (var i = 0; i < (n || 2); i++) part({ t: "heart", x: x + rand(-14, 14), y: y - 6, vx: rand(-15, 15), vy: rand(-60, -40), life: 1.6, max: 1.6, c: i % 2 ? "#FF6FA5" : "#FF4D6D", r: rand(7, 10) }); }
  function notes(x, y, n) { for (var i = 0; i < (n || 2); i++) part({ t: "note", x: x + rand(-10, 10), y: y - 10, vx: rand(-20, 20), vy: rand(-55, -35), life: 1.8, max: 1.8, c: ["#3DB4FF", "#8E6CFF", "#FF6FD8"][i % 3], r: rand(7, 9), d: i * 0.25 }); }

  // ---------- Garden actions ----------
  function nearestEmpty(x) {
    var best = -1, bd = 1e9;
    for (var i = 0; i < NSPOT; i++) if (!S.spots[i]) { var d = Math.abs(L.spots[i] - x); if (d < bd) { bd = d; best = i; } }
    return best;
  }
  function plantAt(kind, x, y) {
    var i = nearestEmpty(x);
    if (i < 0) { say("The bed is full! Tap New."); bonk(); return false; }
    var p = mkSpot(kind, 0);
    if (kind === "strawberry" && !hasGiant() && Math.random() < 0.5) p.g = true;
    p.pa = 0; p.from = { x: x, y: Math.min(y, L.soilTop - 10) };
    S.spots[i] = p;
    learned.plant = true;
    setSel(null);
    plop();
    save();
    return true;
  }
  function grow(i, quiet) {
    var p = S.spots[i];
    if (!p || p.s >= 4 || p.pa < 1) return false;
    p.s++; p.pop = 1; p.w = 0; p.next = now() + 900;
    if (p.s === 4 && nF(p)) p.m = (1 << nF(p)) - 1;
    if (p.s === 4 && p.g) { var gp = fruitPt(i, 0); sparkle(gp.x, gp.y, 18); say("A giant strawberry!"); }
    var top = plantPt(i, 0, -TOPS[p.k][p.s] * 0.7);
    sparkle(top.x, top.y, p.s === 4 ? 14 : 7, p.s === 4 ? null : "#9BF07A");
    if (!quiet) growSnd(p.s);
    save();
    return true;
  }
  function water(i, n) {
    wet[i] = Math.min(1, wet[i] + 0.06 * n);
    var p = S.spots[i];
    if (!p || p.pa < 1 || p.s >= 4) return;
    p.w += n;
    if (p.w >= NEED && now() >= p.next) { if (grow(i)) learned.water = true; }
  }
  function sunTap() {
    shine = 1; sunSnd();
    learned.sun = true;
    var t = now();
    if (t - sunGrowAt < 1300) return;
    var list = [], seeds = false;
    S.spots.forEach(function (p, i) { if (p && p.pa >= 1 && p.s >= 1 && p.s < 4) list.push(i); if (p && p.s === 0) seeds = true; });
    if (!list.length) { if (seeds) say("Water the seed first!"); return; }
    sunGrowAt = t;
    list.forEach(function (i, j) {
      var p = S.spots[i];
      setTimeout(function () { if (!ending && S.spots[i] === p) grow(i, j > 0); }, 350 + j * 260);
    });
  }
  function pick(i, j) {
    var p = S.spots[i];
    if (!p || !(p.m & (1 << j))) return;
    var pt = fruitPt(i, j);
    p.m &= ~(1 << j); p.pull = null; p.taps = 0;
    learned.pick = true;
    if (p.g) { flyers.push({ k: p.k, big: true, x0: pt.x, y0: pt.y, t: 0, r: GIANT[0][2] * L.k, rot: 0 }); sparkle(pt.x, pt.y, 22); boing(); }
    else flyers.push({ k: p.k, x0: pt.x, y0: pt.y, t: 0, r: FRUITS[p.k][j][2] * p.sc, rot: 0 });
    popSnd();
    sparkle(pt.x, pt.y, 6);
    if (p.k === "carrot") { dirt(L.spots[i], L.soilTop, 10); S.spots[i] = null; }
    else if (!p.m) { p.s = 3; p.w = 0; p.next = now() + 700; }
    save();
  }
  function wiggle(i) {
    var p = S.spots[i];
    p.wig = 1; rustle();
    var t = plantPt(i, 0, -TOPS[p.k][p.s] * 0.6);
    for (var n = 0; n < 3; n++) part({ t: "leaf", x: t.x + rand(-10, 10), y: t.y, vx: rand(-40, 40), vy: rand(-50, -10), life: 1.4, max: 1.4, c: LEAF, r: rand(4, 6), a: rand(0, TAU) });
  }

  setInterval(coachTick, 300);

  // ---------- Ghost hand (same look in every app) ----------
  // After a few quiet seconds, a see-through hand shows the main move once. A touch re-arms it, it shows
  // at most twice per visit, and never again once the child has done the move (ghost.learned()).
  function makeGhost(plan, opt) {
    opt = opt || {};
    var IDLE = opt.idle || 4500, MAX = opt.max || 2;
    var last = Date.now(), shown = 0, armed = true, learnedAll = false, run = null, el = null;
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    function build() {
      el = document.createElement("div");
      el.className = "ghosthand";
      el.setAttribute("aria-hidden", "true");
      el.innerHTML = '<svg viewBox="-24 -18 64 84"><circle class="gh-press" cx="0" cy="0" r="17" fill="rgba(255,201,60,0.55)"/>' +
        '<g fill="#FFFFFF" stroke="#1D2340" stroke-width="3" stroke-linejoin="round">' +
        '<rect x="-9" y="-6" width="18" height="40" rx="9"/><rect x="-12" y="22" width="44" height="40" rx="16"/>' +
        '<rect x="10" y="14" width="14" height="24" rx="7"/></g>' +
        '<circle cx="0" cy="2" r="5" fill="rgba(255,201,60,0.9)"/></svg>';
      el.insertBefore(carryEl, el.firstChild);
      document.body.appendChild(el);
    }
    function stop() { run = null; if (el) { el.style.display = "none"; carryEl.innerHTML = ""; } }
    var carryEl = document.createElement("div");
    carryEl.className = "gh-carry";
    function poke() { last = Date.now(); armed = true; if (run) stop(); }
    document.addEventListener("pointerdown", poke, true);
    document.addEventListener("keydown", poke, true);
    function blocked() {
      if (document.hidden) return true;
      if (window.Toybox && (Toybox.sheetOpen() || Toybox.timer.phase() === "ending" || Toybox.timer.phase() === "resting")) return true;
      return !!(opt.ok && !opt.ok());
    }
    function easeG(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function at(pts, f) {
      if (pts.length < 2) return pts[0];
      var segs = [], tot = 0, i;
      for (i = 1; i < pts.length; i++) { var l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); tot += l; }
      var d = f * tot;
      for (i = 0; i < segs.length; i++) {
        if (d <= segs[i] || i === segs.length - 1) { var t = segs[i] ? Math.min(1, d / segs[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; }
        d -= segs[i];
      }
      return pts[pts.length - 1];
    }
    function frame() {
      if (!run) return;
      var t = (Date.now() - run.t0) / run.dur, p = run.p, s = run.s, x, y, a, press, sc = 1;
      if (t >= 1) { stop(); return; }
      if (p.tap || p.pts.length < 2) {
        var pt = p.pts[0];
        x = pt[0]; y = pt[1];
        a = t < 0.15 ? t / 0.15 : (t > 0.85 ? (1 - t) / 0.15 : 1);
        press = (t > 0.3 && t < 0.42) || (t > 0.55 && t < 0.67);
        sc = press ? 0.92 : 1;
        if (t < 0.3) { var k = 1 - t / 0.3; x += 26 * s * k; y += 30 * s * k; }
      } else {
        a = t < 0.1 ? t / 0.1 : (t > 0.9 ? (1 - t) / 0.1 : 1);
        var f = reduce ? 0.5 : easeG(Math.max(0, Math.min(1, (t - 0.16) / 0.66)));
        var q = at(p.pts, f); x = q[0]; y = q[1];
        press = t > 0.12 && t < 0.86;
        sc = t < 0.12 ? 1.12 - 0.12 * (t / 0.12) : 1;
      }
      el.style.opacity = (0.85 * a).toFixed(3);
      el.style.transform = "translate(" + (x - 24 * s) + "px," + (y - 18 * s) + "px) rotate(-14deg) scale(" + sc + ")";
      el.lastChild.firstChild.style.opacity = press ? "1" : "0";
      carryEl.style.opacity = press ? "0.75" : "0";
      requestAnimationFrame(frame);
    }
    function show(p) {
      if (!el) build();
      var s = Math.max(1, Math.min(1.7, Math.min(innerWidth, innerHeight) / 360));
      el.style.width = (64 * s) + "px"; el.style.height = (84 * s) + "px";
      el.style.transformOrigin = (24 * s) + "px " + (18 * s) + "px";
      el.style.display = "block";
      carryEl.innerHTML = p.carry ? p.carry.html : "";
      if (p.carry) {
        var c = p.carry.size;
        carryEl.style.cssText = "position:absolute;left:" + (24 * s - c / 2) + "px;top:" + (18 * s - c / 2) + "px;width:" + c + "px;height:" + c + "px";
      }
      run = { p: p, s: s, t0: Date.now(), dur: p.dur || (p.tap ? 2400 : 3200) };
      requestAnimationFrame(frame);
    }
    setInterval(function () {
      if (run || learnedAll || !armed || shown >= MAX || Date.now() - last < IDLE) return;
      if (blocked()) { last = Date.now(); return; }
      var p = plan();
      if (!p || !p.pts || !p.pts.length) return;
      armed = false; shown++;
      show(p);
    }, 250);
    return {
      learned: function () { learnedAll = true; stop(); },
      again: function () { learnedAll = false; shown = 0; armed = true; last = Date.now(); },
      poke: poke,
      show: function () { var p = plan(); if (p) show(p); return !!p; }
    };
  }
  function ghostPt(elm, fx, fy) {
    var r = elm.getBoundingClientRect();
    return [r.left + r.width * fx, r.top + r.height * fy];
  }
  // The next move, once each until he has done it (at most twice per move per visit).
  var ghostShown = { plant: 0, water: 0, sun: 0, pick: 0 };
  function ghostPlan() {
    var rc = cv.getBoundingClientRect(), i, p, move = null, plan = null;
    if (sel || drag || Object.keys(ptrs).length) return null;
    for (i = 0; i < NSPOT && !plan; i++) {
      p = S.spots[i];
      if (ripe(p) && !learned.pick) {
        for (var j = 0; j < nF(p); j++) if (p.m & (1 << j)) {
          var f = p.k === "carrot" ? plantPt(i, 0, -8) : fruitPt(i, j);
          move = "pick"; plan = { pts: [[rc.left + f.x, rc.top + f.y], [rc.left + f.x, rc.top + f.y - 80]], dur: 2800 }; break;
        }
      }
    }
    for (i = 0; i < NSPOT && !plan; i++) {
      p = S.spots[i];
      if (p && p.s === 0 && p.pa >= 1 && !learned.water) {
        move = "water";
        plan = { pts: [[rc.left + can.x, rc.top + can.y - L.cs * 0.3], [rc.left + L.spots[i] - spoutOff(0.75), rc.top + Math.max(L.cs * 0.6, L.soilTop - L.cs * 0.9) - L.cs * 0.3]], dur: 3400 };
      }
    }
    if (!plan && !learned.sun && S.spots.some(function (q) { return q && q.pa >= 1 && q.s >= 1 && q.s < 4; })) {
      move = "sun"; plan = { pts: [[rc.left + L.sunX, rc.top + L.sunY]], tap: true };
    }
    if (!plan && !learned.plant && !S.spots.some(function (q) { return q; }) && !document.body.classList.contains("big")) {
      var tile = tiles.sunflower, k = nearestEmpty(W / 2);
      if (tile && tile.offsetWidth && k >= 0) {
        move = "plant";
        plan = { pts: [ghostPt(tile, 0.5, 0.45), [rc.left + L.spots[k], rc.top + L.soilTop - 10]], carry: { html: packetSVG("sunflower"), size: 64 } };
      }
    }
    if (!plan || ghostShown[move] >= 2) return null;
    ghostShown[move]++;
    return plan;
  }
  var ghost = makeGhost(ghostPlan, { max: 8, ok: function () { return !ending; } });

  // ---------- Sound (off by default; soft and synthesized) ----------
  var master = null, masterCtx = null;
  function out(ac) {
    if (masterCtx !== ac) { master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination); masterCtx = ac; }
    return master;
  }
  function tone(freq, dur, vol, type, slideTo, delay) {
    var actx = Toybox.sound.ready();
    if (!actx) return;
    var t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out(actx));
    o.start(t); o.stop(t + dur + 0.05);
  }
  function plink() { tone(rand(1300, 2100), 0.09, 0.015, "sine", null); }
  function plop() { tone(330, 0.18, 0.05, "sine", 150); tone(900, 0.08, 0.02, "sine", null, 0.12); }
  function growSnd(s) { var b = 392 + (s || 1) * 40; tone(b, 0.25, 0.03); tone(b * 1.25, 0.25, 0.03, "sine", null, 0.09); tone(b * 1.5, 0.35, 0.03, "sine", null, 0.18); }
  function popSnd() { tone(420, 0.14, 0.05, "sine", 900); }
  function thud() { tone(220, 0.14, 0.04, "triangle", 160); }
  function sunSnd() { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.6, 0.022, "triangle", null, i * 0.06); }); }
  function buzz() { tone(220, 0.4, 0.02, "triangle", 260); }
  function chirp() { tone(2200, 0.08, 0.025, "sine", 3200); tone(2400, 0.1, 0.025, "sine", 3400, 0.12); }
  function chime() { tone(784, 0.4, 0.03); tone(1047, 0.5, 0.025, "sine", null, 0.1); }
  function boing() { tone(200, 0.3, 0.04, "sine", 480); }
  function rustle() { tone(700, 0.08, 0.015, "triangle", 500); }
  function blip() { tone(600, 0.12, 0.03, "sine", 820); }
  function bonk() { tone(260, 0.22, 0.035, "sine", 200); }
  function whoosh() { tone(700, 0.35, 0.03, "sine", 200); }
  function gliss() { [523, 587, 659, 784, 880, 1047].forEach(function (f, i) { tone(f, 0.3, 0.025, "sine", null, i * 0.07); }); }

  // ---------- Play timer hooks ----------
  // Ending: the sun sets, the flowers close, the visitors go home, the garden sleeps.
  function onEnding(done) {
    ending = true; endT0 = now();
    releaseAll(); setSel(null);
    if (drag) { dp.hidden = true; drag.b.classList.remove("lift"); drag = null; }
    visitorsLeave();
    rainbowUntil = 0;
    setTimeout(done, 6500);
  }
  function onGoodbye() { notes(W / 2, L.fenceTop, 3); chime(); }
  function onWake() { ending = false; due = {}; }
  function restSVG() {
    var o = '<svg class="rest-art" viewBox="0 0 100 100" aria-hidden="true">';
    o += '<circle cx="24" cy="22" r="11" fill="#FFF4C2" stroke="#1D2340" stroke-width="2"/><circle cx="29" cy="19" r="10" fill="#22305E"/>';
    [[60, 14], [78, 26], [46, 30], [88, 12], [70, 40]].forEach(function (s) { o += '<circle cx="' + s[0] + '" cy="' + s[1] + '" r="1.6" fill="#FFFFFF"/>'; });
    o += '<path d="M0 62q30-14 60-4t40-6v48H0z" fill="#2A4A3A"/>';
    o += '<rect x="0" y="74" width="100" height="26" fill="#5A3A22" stroke="#1D2340" stroke-width="2"/>';
    o += '<path d="M30 74V44" stroke="#3E8E2E" stroke-width="3"/><path d="M30 60q-8-2-10-8 7 0 10 6zM30 52q8-2 10-8-7 0-10 6z" fill="#4CB944" stroke="#1D2340" stroke-width="1.5"/>';
    o += '<g transform="translate(30 42) rotate(35)"><ellipse cx="0" cy="0" rx="9" ry="6" fill="#FFC93C" stroke="#1D2340" stroke-width="1.5"/><circle cx="0" cy="0" r="4.5" fill="#7A4A1E" stroke="#1D2340" stroke-width="1.5"/></g>';
    o += '<path d="M66 74V56" stroke="#3E8E2E" stroke-width="3"/><path d="M66 74q-9-6-7-16 6 6 7 16zM66 74q9-6 7-16-6 6-7 16z" fill="#4CB944" stroke="#1D2340" stroke-width="1.5"/>';
    o += '<path d="M61 56q5-14 10 0z" fill="#FF4D6D" stroke="#1D2340" stroke-width="1.5"/>';
    o += '<text x="74" y="52" font-family="Baloo 2, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">z</text><text x="81" y="44" font-family="Baloo 2, sans-serif" font-weight="800" font-size="7" fill="#FFFFFF">z</text>';
    return o + "</svg>";
  }

  // ---------- Loop and start ----------
  var lastT = 0;
  function loop(ts) {
    var dt = lastT ? Math.min(0.05, (ts - lastT) / 1000) : 0.016;
    lastT = ts;
    if (W) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }
  $("count").textContent = "Picked: " + S.picked;
  resize();
  window.addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
  coachTick();
  Toybox.init({
    app: "garden",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the sun sets, the flowers close and the garden sleeps.",
    goodbyeOption: "End with a Goodnight button to press",
    farewellText: "Time to say goodnight",
    goodbyeLabel: "Goodnight, garden",
    farewellDone: "Night night, garden!",
    restLine: "The garden is sleeping.",
    restLine2: "It will be right here next time.",
    restArt: restSVG,
    soundNote: "Soft drips and chimes. Hold for 2 seconds.",
    onEnding: onEnding,
    onGoodbye: onGoodbye,
    onWake: onWake,
    onBig: function () { resize(); },
    onSound: function (on) { if (on) setTimeout(chime, 60); }
  });
  requestAnimationFrame(loop);

  // Test hook, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) window.__garden = {
    state: function () { return { spots: S.spots.map(function (p) { return p ? { k: p.k, s: p.s, m: p.m, pa: p.pa } : null; }), picked: S.picked, basket: S.basket.length, visitors: Object.keys(V).filter(function (k) { return !!V[k]; }), coach: coachEl.textContent, rb: rb, night: night }; },
    pt: function (name, i, j) {
      var r = cv.getBoundingClientRect(), p;
      if (name === "spot") p = { x: L.spots[i], y: L.soilTop };
      else if (name === "can") p = { x: can.x, y: can.y };
      else if (name === "sun") p = { x: L.sunX, y: L.sunY };
      else if (name === "cloud") p = { x: cloud.x, y: cloud.y };
      else if (name === "trowel") p = { x: trowel.x, y: trowel.y };
      else if (name === "basket") p = { x: L.bx, y: L.base - L.bw * 0.3 };
      else if (name === "fruit") p = S.spots[i].k === "carrot" ? plantPt(i, 0, -8) : fruitPt(i, j || 0);
      else if (name === "plant") p = plantPt(i, 0, -TOPS[S.spots[i].k][S.spots[i].s] * 0.5);
      else if (V[name]) { var v = V[name]; p = name === "worm" ? wormHead(v) : name === "bird" ? { x: v.x, y: v.y - bodySize() } : { x: v.x, y: v.y }; }
      return p ? { x: r.left + p.x, y: r.top + p.y } : null;
    },
    grow: function (i) { var p = S.spots[i]; if (p) { p.pa = 1; p.next = 0; } return grow(i); },
    plant: function (k, i, g) { S.spots[i] = mkSpot(k, 0); if (k === "strawberry" && g !== undefined) S.spots[i].g = !!g && !hasGiant(); save(); },
    canAim: function (i) { var r = cv.getBoundingClientRect(); return { x: r.left + L.spots[i] - spoutOff(0.75), y: r.top + Math.max(L.cs * 0.6, L.soilTop - L.cs * 0.9) }; },
    can: function () { return { x: can.x, tilt: can.tilt, fs: can.fs, cs: L.cs, tip: spoutTip(), W: W }; },
    ghost: function () { return ghost.show(); }
  };
})();
</script>
