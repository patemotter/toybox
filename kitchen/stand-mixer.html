<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stand Mixer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.tb-head a { text-decoration: none; }
/* ---------- Standard app shell (common/toybox.css, tb-v2) ----------
   The stage (the mixer on the counter, the recipe's ingredients standing beside it), the job bar hanging from
   it (Cookies, Whipped cream, Bread), and the panel: the step row (Add, Mix, Serve: the current step is the
   green Go) and the bottom bar (New, Surprise), all built by the shared components in common/toybox.js. */
.stage { background: #FFF3DC; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; }
/* The thing under his finger while he drags an ingredient, and the container pouring over the bowl. */
.float { position: fixed; left: 0; top: 0; z-index: 30; width: 84px; height: 84px; pointer-events: none;
  filter: drop-shadow(3px 4px 0 rgba(29, 35, 64, 0.25)); will-change: transform; transform-origin: 50% 50%; }
.float svg { width: 100%; height: 100%; display: block; overflow: visible; }
/* Big: the header, the job bar, the chips and the bottom bar hide; Go stays (stage taps do every step too). */
body.big .tb-head > :not(.bigtoggle), body.big .tb-chip, body.big .tb-bottombar, body.big .tb-jobs { display: none; }
body.ending .tb-panel, body.resting .tb-panel, body.ending .tb-jobs, body.resting .tb-jobs { pointer-events: none; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
/* The Back button shows the kitchen's picture (and its name on an iPad). */
.backbtn .tb-mapic { width: 30px; height: 30px; }
</style>
</head>
<body>
<div class="tb-app-shell tb-v2">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back backbtn" id="backbtn" href="./" aria-label="Back to the kitchen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><svg class="tb-mapic" viewBox="0 0 40 40" aria-hidden="true"><path d="M11 20a7 7 0 0 1 3-13 8 8 0 0 1 12 0 7 7 0 0 1 3 13v4H11z" fill="#FFFFFF" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="11" y="24" width="18" height="8" rx="2" fill="#FFFFFF" stroke="#1D2340" stroke-width="2.5"/><path d="M16 24v8M24 24v8" stroke="#1D2340" stroke-width="2"/></svg><span>Kitchen</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Stand Mixer</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>
  <div class="tb-body">
    <div class="tb-stagecol">
      <main class="tb-stage stage" id="stage">
        <canvas id="cv" role="img" aria-label="A stand mixer with a steel bowl on the kitchen counter, the recipe's ingredients beside it"></canvas>
        <div class="tb-counter" id="counter">Bowls: 0</div>
        <div id="coach"></div>
        <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
      </main>
      <div id="jobs"></div>
    </div>
    <section class="tb-panel" id="panel">
      <ol id="steps"></ol>
      <div id="bottom"></div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Getting ready (once per visit, on the kitchen page) ----------
  var STATION = "stand-mixer";
  var readyOn = true;
  try { readyOn = sessionStorage.getItem("kitchen-ready") === "on"; } catch (e) { readyOn = true; }
  if (!readyOn) { location.replace("./?next=" + STATION); return; }

  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ease(t) { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function now() { return performance.now() / 1000; }
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var INK = "#1D2340";

  var STATEKEY = "kitchen-mixer-v1";
  // The kitchen table (his collection, kept across visits). This station adds { k: "cookies" | "cream" |
  // "bread", c: "#rrggbb" (the food's color), s: "#rrggbb" (topping color, or ""), t: ms timestamp }.
  var TABLEKEY = "kitchen-table-v1", TABLE_MAX = 12;

  // ---------- Recipes, beaters, ingredients ----------
  // vol: share of the bowl it fills; mixc: its color in the mix (null: stays as bits, like chips);
  // how: the way it goes in; spout: the opening of its picture (60 x 60), for pouring.
  var ING = {
    butter:  { name: "Butter",  the: "the butter",  col: "#FFE07A", mixc: "#FFE9A0", vol: 0.13, how: "cubes" },
    sugar:   { name: "Sugar",   the: "the sugar",   col: "#FFFFFF", mixc: "#FFFDF6", vol: 0.12, how: "grains", grain: "#FFFFFF", spout: [44, 18] },
    egg:     { name: "Eggs",    the: "the eggs",    col: "#FFC93C", mixc: "#FFD45A", vol: 0.12, how: "egg" },
    flour:   { name: "Flour",   the: "the flour",   col: "#FFFDF7", mixc: "#FFFDF7", vol: 0.26, how: "flour", spout: [40, 12] },
    chips:   { name: "Chips",   the: "the chocolate chips", col: "#5A3418", mixc: null, vol: 0.05, how: "chips", spout: [42, 22] },
    cream:   { name: "Cream",   the: "the cream",   col: "#FFFBF0", mixc: "#FFFBF0", vol: 0.42, how: "liquid", spout: [30, 4], stream: "#FFFFFF" },
    vanilla: { name: "Vanilla", the: "the vanilla", col: "#7A4A22", mixc: "#F2DEC0", vol: 0.02, how: "drops", spout: [30, 4] },
    water:   { name: "Water",   the: "the water",   col: "#8FD0FF", mixc: "#EEF6F8", vol: 0.2, how: "liquid", spout: [50, 14], stream: "#8FD0FF" },
    yeast:   { name: "Yeast",   the: "the yeast",   col: "#C9A06A", mixc: "#EBD8B4", vol: 0.03, how: "grains", grain: "#B98A55", spout: [40, 12] }
  };
  // T: seconds of mixing on High (slower speeds take longer). col: the mixed batter; food: the table color.
  var RECIPES = {
    cookies: { name: "Cookies", beater: "paddle", ing: ["butter", "sugar", "egg", "flour", "chips"], col: "#E4B271", food: "#D99A4E", T: 5, mix: "Watch it mix!" },
    cream:   { name: "Whipped cream", beater: "whisk", ing: ["cream", "sugar", "vanilla"], col: "#FFFBF2", food: "#FFF6E8", T: 5.5, mix: "Watch it whip!" },
    bread:   { name: "Bread", beater: "hook", ing: ["flour", "water", "yeast"], col: "#F2DCAE", food: "#C98B4F", T: 5.5, mix: "Watch the dough climb!" }
  };
  var REC_ORDER = ["cookies", "cream", "bread"];
  var BEATERS = { paddle: { name: "Paddle", the: "the paddle" }, whisk: { name: "Whisk", the: "the whisk" }, hook: { name: "Dough hook", the: "the dough hook" } };
  var TOPPINGS = { sprinkles: { col: "#FF6FB5" }, chips: { col: "#5A3418" } };
  var SPRINKLE_COLS = ["#FF4D6D", "#FFB627", "#4CD964", "#3DB4FF", "#8E6CFF", "#FF6FD8"];

  // ---------- Small SVG pictures (panel tiles, the dragged thing, the ghost hand) ----------
  function sv(inner) { return '<svg viewBox="0 0 60 60" aria-hidden="true">' + inner + "</svg>"; }
  var ST = ' stroke="#1D2340" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
  var ST2 = ' stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"';
  var ICON = {
    paddle: sv('<rect x="26" y="1" width="8" height="12" rx="2" fill="#C9D3E0"' + ST2 + '/><path d="M30 12 L23 15 Q9 36 15 50 Q22 58 30 58 Q38 58 45 50 Q51 36 37 15 Z M27 22 Q18 36 21 49 L27 51 Z M33 22 Q42 36 39 49 L33 51 Z" fill="#F4F6FA" fill-rule="evenodd"' + ST + '/>'),
    whisk: sv('<rect x="25" y="1" width="10" height="14" rx="3" fill="#C9D3E0"' + ST2 + '/><g fill="none" stroke="#1D2340" stroke-width="2.5" stroke-linecap="round"><path d="M30 14 Q4 44 30 58 Q56 44 30 14"/><path d="M30 14 Q14 46 30 58 Q46 46 30 14"/><path d="M30 14 L30 58"/></g>'),
    hook: sv('<rect x="25" y="1" width="10" height="12" rx="3" fill="#C9D3E0"' + ST2 + '/><path d="M30 12 L30 30 Q30 50 42 52 Q53 51 50 38" fill="none" stroke="#1D2340" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 12 L30 30 Q30 50 42 52 Q53 51 50 38" fill="none" stroke="#F4F6FA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>'),
    butter: sv('<path d="M6 30 L40 22 L54 28 L54 40 L20 48 L6 42 Z" fill="#FFE07A"' + ST + '/><path d="M6 30 L20 36 L54 28 M20 36 L20 48" fill="none"' + ST + '/><path d="M34 30 L54 26 L54 40 L34 44 Z" fill="#FFFFFF"' + ST2 + '/><path d="M38 33 L50 30" stroke="#2D7BE5" stroke-width="3" stroke-linecap="round"/>'),
    sugar: sv('<path d="M14 26 Q30 8 46 26 Z" fill="#FFFFFF"' + ST + '/><path d="M10 26 L50 26 L45 54 L15 54 Z" fill="#3DB4FF"' + ST + '/><path d="M10 34 Q2 34 4 42 Q6 48 13 46" fill="none"' + ST + '/><g fill="#FFFFFF"><circle cx="22" cy="20" r="1.6"/><circle cx="32" cy="16" r="1.6"/><circle cx="38" cy="21" r="1.6"/></g><path d="M18 34 L42 34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>'),
    egg: sv('<path d="M30 5 C43 5 51 27 51 38 C51 50 42 57 30 57 C18 57 9 50 9 38 C9 27 17 5 30 5 Z" fill="#FFF4E0"' + ST + '/><path d="M20 22 Q23 14 28 12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>'),
    flour: sv('<path d="M12 14 L48 14 L52 56 L8 56 Z" fill="#F3E6CF"' + ST + '/><path d="M12 14 L17 8 L22 14 L27 8 L32 14 L37 8 L42 14 L48 8 L48 14" fill="#F3E6CF"' + ST2 + '/><path d="M30 46 L30 26 M30 30 L24 26 M30 30 L36 26 M30 37 L24 33 M30 37 L36 33 M30 44 L24 40 M30 44 L36 40" fill="none" stroke="#C98B4F" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="9" r="4" fill="#FFFFFF" stroke="none"/><circle cx="40" cy="7" r="5" fill="#FFFFFF" stroke="none"/>'),
    chips: sv('<path d="M8 32 L52 32 Q50 54 30 54 Q10 54 8 32 Z" fill="#FF9A4D"' + ST + '/><g fill="#5A3418"' + ST2 + '><path d="M16 32 Q20 18 24 32 Z"/><path d="M26 32 Q30 14 34 32 Z"/><path d="M36 32 Q40 18 44 32 Z"/><path d="M21 26 Q25 12 29 26 Z"/><path d="M31 26 Q35 12 39 26 Z"/></g>'),
    cream: sv('<path d="M16 22 L30 10 L44 22 L44 56 L16 56 Z" fill="#FFFFFF"' + ST + '/><path d="M16 22 L44 22" fill="none"' + ST + '/><rect x="27" y="3" width="8" height="8" rx="2" fill="#FF6FB5"' + ST2 + '/><rect x="16" y="32" width="28" height="14" fill="#FF9EC9" stroke="none"/><path d="M16 22 L44 22 L44 56 L16 56 Z" fill="none"' + ST + '/><path d="M24 42 Q26 34 30 36 Q34 34 36 42 Z" fill="#FFFFFF"/>'),
    vanilla: sv('<rect x="24" y="4" width="12" height="8" rx="2" fill="#2B3045"' + ST2 + '/><rect x="26" y="11" width="8" height="10" fill="#7A4A22"' + ST2 + '/><path d="M18 26 Q18 20 26 20 L34 20 Q42 20 42 26 L42 54 L18 54 Z" fill="#7A4A22"' + ST + '/><rect x="20" y="32" width="20" height="14" rx="2" fill="#FFF4CC" stroke="none"/><path d="M24 42 Q30 30 36 36" fill="none" stroke="#2EA05A" stroke-width="2.5" stroke-linecap="round"/>'),
    water: sv('<path d="M12 12 L46 12 L52 18 L46 56 L16 56 Z" fill="rgba(214,238,255,0.9)"' + ST + '/><path d="M14 28 L48 28 L46 56 L16 56 Z" fill="#8FD0FF" stroke="none"/><path d="M12 12 L46 12 L52 18 L46 56 L16 56 Z" fill="none"' + ST + '/><path d="M14 20 Q2 22 4 34 Q6 44 15 44" fill="none"' + ST + '/><path d="M38 34 L36 50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>'),
    yeast: sv('<rect x="12" y="8" width="36" height="46" rx="5" fill="#FFC93C"' + ST + '/><path d="M12 16 L48 16" fill="none"' + ST2 + '/><circle cx="30" cy="35" r="11" fill="#C9A06A"' + ST2 + '/><g fill="#8A5A2B"><circle cx="26" cy="32" r="1.8"/><circle cx="33" cy="31" r="1.8"/><circle cx="30" cy="38" r="1.8"/><circle cx="35" cy="38" r="1.6"/><circle cx="25" cy="39" r="1.6"/></g>'),
    rcookies: sv('<ellipse cx="30" cy="44" rx="27" ry="9" fill="#FFFFFF"' + ST + '/><ellipse cx="30" cy="40" rx="15" ry="6" fill="#D99A4E"' + ST + '/><ellipse cx="30" cy="32" rx="15" ry="6" fill="#D99A4E"' + ST + '/><ellipse cx="30" cy="24" rx="15" ry="6" fill="#E4AD62"' + ST + '/><g fill="#5A3418"><circle cx="24" cy="23" r="2"/><circle cx="33" cy="21" r="2"/><circle cx="36" cy="26" r="2"/><circle cx="28" cy="27" r="1.8"/></g>'),
    rcream: sv('<path d="M8 34 Q10 56 30 56 Q50 56 52 34 Z" fill="rgba(214,238,255,0.9)"' + ST + '/><path d="M10 34 Q12 22 22 22 Q24 12 32 12 Q34 4 38 8 Q36 14 40 18 Q50 20 50 34 Z" fill="#FFFDF6"' + ST + '/><path d="M18 28 Q30 22 42 28" fill="none" stroke="#E8DCC8" stroke-width="2.5" stroke-linecap="round"/><circle cx="44" cy="12" r="5" fill="#E63946"' + ST2 + '/>'),
    rbread: sv('<rect x="4" y="46" width="52" height="8" rx="3" fill="#E7B77A"' + ST + '/><path d="M8 46 L7 34 Q7 14 30 13 Q53 14 53 34 L52 46 Z" fill="#D9984A"' + ST + '/><path d="M18 26 L24 20 M28 26 L34 20 M38 26 L44 20" fill="none" stroke="#F6D7A7" stroke-width="3.5" stroke-linecap="round"/>')
  };

  // ---------- Saved state ----------
  // recipe: what he is making ("" while picking); items: what is in the bowl: { id, a (how much is in),
  // m (how mixed) }; beater: the one clicked on; up: head tilted up; food: the last finished food, still on
  // the counter ({ k, c, s }); top: Surprise topping in the bowl; count: bowls this visit.
  // job: the picked job tab (the recipe he makes next; kept while the finished food stands on the counter).
  var S = { recipe: "", job: "cookies", items: [], beater: "", up: false, food: null, top: "", count: 0 };
  function load() {
    var o = null;
    try { o = JSON.parse(localStorage.getItem(STATEKEY) || "null"); } catch (e) { o = null; }
    if (!o || typeof o !== "object") return;
    S.recipe = RECIPES[o.recipe] ? o.recipe : "";
    S.job = RECIPES[o.job] ? o.job : (S.recipe || (o.food && RECIPES[o.food.k] ? o.food.k : "cookies"));
    if (S.recipe && Array.isArray(o.items)) {
      S.items = o.items.filter(function (it) { return it && ING[it.id]; }).map(function (it) {
        return { id: it.id, a: clamp(+it.a || 0, 0, 1), m: clamp(+it.m || 0, 0, 1) };
      }).filter(function (it) { return it.a > 0; });
    }
    S.beater = BEATERS[o.beater] ? o.beater : "";
    S.up = !!o.up;
    if (o.food && typeof o.food === "object" && /^(cookies|cream|bread)$/.test(o.food.k)) S.food = { k: o.food.k, c: String(o.food.c || ""), s: String(o.food.s || "") };
    S.top = TOPPINGS[o.top] && S.recipe ? o.top : "";
    S.count = Math.max(0, Math.floor(+o.count || 0));
  }
  var saveT = 0;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      try {
        localStorage.setItem(STATEKEY, JSON.stringify({ v: 1, recipe: S.recipe, job: S.job, items: S.items, beater: S.beater, up: S.up, food: S.food, top: S.top, count: S.count }));
      } catch (e) { /* ignore */ }
    }, 200);
  }
  if (window.Toybox && Toybox.fresh()) { try { localStorage.removeItem(STATEKEY); } catch (e) { /* ignore */ } }
  else load();
  function addToTable(entry) {
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem(TABLEKEY) || "[]"); } catch (e) { arr = []; }
    if (!Array.isArray(arr)) arr = [];
    arr.push(entry);
    while (arr.length > TABLE_MAX) arr.shift();
    try { localStorage.setItem(TABLEKEY, JSON.stringify(arr)); } catch (e) { /* ignore */ }
  }

  // ---------- Canvas and layout ----------
  // The scene is drawn in "mixer units": B px each, origin on the counter top under the middle of the
  // bowl, y down. The mixer faces left: the bowl at x = 0, the column and the head's hinge on the right.
  var stage = $("stage"), cv = $("cv"), ctx = cv.getContext("2d");
  var cw = 300, ch = 300, dpr = 1, B = 100, ox = 150, oy = 250, LW = 0.03;
  // Wide stages: the finished food stands on the counter left of the mixer. Upright stages: the counter is
  // deeper and the food stands in front, so the mixer itself can be bigger.
  var X_L = -1.46, X_R = 1.33, H_TOP = 2.58, tall = false, FOOD_X = -1.04, FOOD_Y = 0, COUNTER_D = 0.08;
  function layout() {
    var r = stage.getBoundingClientRect();
    cw = Math.max(50, r.width); ch = Math.max(50, r.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    var phone = Math.min(innerWidth, innerHeight) < 560;
    tall = ch > cw * 0.85;
    // Wide: the ingredients stand in a row on the counter left of the mixer (room for five), the finished
    // food stands there too. Upright: they stand along the front of the deeper counter.
    X_L = tall ? -0.78 : -3.02;
    FOOD_X = tall ? -0.36 : -1.84; FOOD_Y = tall ? 0.3 : 0; COUNTER_D = tall ? 0.4 : 0.08;
    ROW_S = tall ? 0.36 : 0.42; ROW.gap = tall ? 0.4 : 0.46;
    ROW.x0 = tall ? (X_L + X_R) / 2 - 2 * ROW.gap : -0.92 - 4 * ROW.gap; ROW.y = tall ? COUNTER_D - 0.04 : 0;
    // Phones: the coach line sits at the bottom, over the cupboards. Tablets: at the top, over the wall.
    var dn = COUNTER_D + 0.22 + (phone ? (tall ? 0.18 : 0.62) : 0), top = H_TOP + (phone ? 0 : 0.22);
    B = Math.min((cw - 12) / (X_R - X_L), (ch - 10) / (top + dn));
    B = Math.max(30, Math.min(B, 380));
    ox = cw / 2 - B * (X_L + X_R) / 2;
    var spare = ch - B * (top + dn);
    oy = ch - B * dn - Math.max(0, spare) * 0.3;
    LW = 3.4 / B;
  }
  function toLocal(px, py) { var r = cv.getBoundingClientRect(); return { x: (px - r.left - ox) / B, y: (py - r.top - oy) / B }; }
  function toPage(x, y) { var r = cv.getBoundingClientRect(); return [r.left + ox + x * B, r.top + oy + y * B]; }

  // ---------- The machine ----------
  var HX = 0.8, HY = -1.3, UP = 0.78;                      // head hinge; how far the head tilts up
  var RIM_Y = -0.84, RIM_RX = 0.5, RIM_RY = 0.16, BOT_Y = -0.28; // the bowl
  var SHAFT_Y = -1.1, ORB = 0.1, BLEN = 0.74;               // beater shaft (head coords), orbit radius, length
  var LV_X0 = 0.36, LV_DX = 0.145, LV_Y = -1.5;             // lever notches (head coords)
  var LOCK = { x: 0.8, y: -0.92 };
  var EGG_SPOT = { x: -0.32, y: -0.73 };
  var POUR_SPOT = { x: -0.76, y: -1.26 };

      else if (q.kind === "drop") { ctx.beginPath(); ctx.moveTo(0, -q.r * 1.4); ctx.quadraticCurveTo(q.r, 0, 0, q.r); ctx.quadraticCurveTo(-q.r, 0, 0, -q.r * 1.4); ctx.fillStyle = q.col; ctx.fill(); }
      else { circ(0, 0, q.r); ctx.fillStyle = q.col; ctx.fill(); if (q.kind === "flour") { ctx.strokeStyle = "rgba(29,35,64,0.25)"; ctx.lineWidth = LW * 0.4; ctx.stroke(); } }
      ctx.restore();
    });
  }
  function drawStreams() {
    pours.forEach(function (p) {
      if (p.how !== "liquid" || !p.on || p.sx == null) return;
      var L = level(), sf = surf(L), x1 = -0.1, y1 = L > 0.004 ? sf.y : BOT_Y;
      var k = (now() - p.t0) / p.dur, w = 0.05 * (k > 0.78 ? (0.86 - k) / 0.08 : 1);
      if (w <= 0.003) return;
      var col = ING[p.id].stream || "#FFFFFF";
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.quadraticCurveTo(p.sx + 0.25, p.sy + 0.02, x1, y1);
      ctx.lineWidth = w + 2 * LW; ctx.strokeStyle = INK; ctx.stroke();
      ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke();
    });
  }
  function drawTake() {
    if (!take) return;
    var k = ease(take.k), x = lerp(0, FOOD_X, k), y = lerp(RIM_Y - 0.1, FOOD_Y - 0.3, k) - Math.sin(take.k * Math.PI) * 0.6;
    var r = 0.18 + 0.06 * Math.sin(take.k * Math.PI);
    ell(x, y, r * 1.2, r); fs(take.col);
    ctx.fillStyle = "rgba(255,255,255,0.35)"; ell(x - r * 0.4, y - r * 0.4, r * 0.35, r * 0.2); ctx.fill();
  }
  function drawParts() {
    parts.forEach(function (q) {
      var a = 1 - q.life / q.max;
      ctx.globalAlpha = Math.max(0, q.kind === "puff" ? a * 0.85 : a);
      if (q.kind === "star") {
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.life * 3);
        ctx.beginPath();
        for (var i = 0; i < 8; i++) { var r = i % 2 ? q.r * 0.45 : q.r * 1.4, an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); }
        ctx.closePath(); fs(q.col, 0.6); ctx.restore();
      } else if (q.kind === "puff") {
        circ(q.x, q.y, q.r); ctx.fillStyle = "#FFFFFF"; ctx.fill(); ctx.strokeStyle = "rgba(29,35,64,0.18)"; ctx.lineWidth = LW * 0.6; ctx.stroke();
      } else { circ(q.x, q.y, q.r); ctx.fillStyle = q.col; ctx.fill(); }
    });
    ctx.globalAlpha = 1;
  }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.setTransform(dpr * B, 0, 0, dpr * B, dpr * ox, dpr * oy);
    ctx.lineJoin = "round";
    drawRoom();
    if (!tall) { drawFoods(); drawRow(); }
    drawBase();
    drawBowlBack();
    drawContents();
    drawBeaterClipped();
    drawClimb();
    drawBowlFront();
    drawBeaterPlace();
    drawHead();
    drawSpeedLabel();
    drawOldBeater();
    if (tall) { drawFoods(); drawRow(); }
    drawEgg();
    drawStreams();
    drawDrops();
    drawTake();
    drawParts();
  }
  function drawFoods() {
    var big = tall ? 1.25 : 1;
    if (S.food) drawFood(S.food, FOOD_X, popScale() * big);
    if (foodSlide) { var fk = ease((now() - foodSlide.t0) / foodSlide.dur); drawFood(foodSlide.food, lerp(FOOD_X, -ox / B - 0.6, fk), big); }
  }
  function popScale() {
    if (foodPop >= 1) return 1;
    var u = foodPop - 1;
    return 0.3 + 0.7 * (1 + 2.70158 * u * u * u + 1.70158 * u * u);
  }
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Timer ----------
  function locked() { return Toybox.timer.locked(); }
  function onEnding(done) {
    // The mixer switches off and spins down; everything settles.
    stopMotor();
    FUN.cur = {};
    Object.keys(itemDrags).forEach(function (k) { rm(itemDrags[k].f); });
    itemDrags = {}; stageDrags = {}; autoAdd = false;
    if (head.a > 0 && head.a < UP && !head.anim) animHead(head.a > UP / 2 ? UP : 0);
    setTimeout(done, reduce ? 300 : 3200);
  }
  function restArt() {
    var o = '<rect width="400" height="300" fill="#2B3A67"/>';
    o += '<rect x="40" y="30" width="120" height="100" rx="8" fill="#1B2550" stroke="#1D2340" stroke-width="4"/><circle cx="120" cy="66" r="18" fill="#FFF4CC"/><circle cx="130" cy="60" r="16" fill="#1B2550"/>';
    o += '<circle cx="60" cy="50" r="2.5" fill="#FFF4CC"/><circle cx="80" cy="100" r="2.5" fill="#FFF4CC"/><circle cx="145" cy="110" r="2" fill="#FFF4CC"/>';
    o += '<rect y="214" width="400" height="86" fill="#4C77A6"/><rect y="204" width="400" height="14" fill="#C9A06A" stroke="#1D2340" stroke-width="4"/>';
    o += '<g transform="translate(150 204)"><rect x="0" y="-12" width="150" height="12" rx="5" fill="#3E8F87" stroke="#1D2340" stroke-width="4"/>' +
      '<path d="M108 -10 L108 -96 Q108 -110 122 -110 L130 -110 Q144 -110 144 -96 L144 -10 Z" fill="#3E8F87" stroke="#1D2340" stroke-width="4"/>' +
      '<path d="M10 -84 L90 -84 Q88 -24 50 -20 Q12 -24 10 -84 Z" fill="#AEB9CA" stroke="#1D2340" stroke-width="4"/><ellipse cx="50" cy="-84" rx="40" ry="8" fill="#7F8BA2" stroke="#1D2340" stroke-width="3"/>' +
      '<path d="M8 -128 Q8 -146 30 -146 L136 -146 Q156 -146 156 -126 L156 -112 Q156 -100 140 -100 L30 -100 Q8 -100 8 -116 Z" fill="#3E8F87" stroke="#1D2340" stroke-width="4"/>' +
      '<path d="M40 -100 L60 -100 L56 -92 L44 -92 Z" fill="#AEB9CA" stroke="#1D2340" stroke-width="3"/></g>';
    o += '<text x="300" y="120" font-family="Baloo 2, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">z</text><text x="324" y="96" font-family="Baloo 2, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">z</text><text x="344" y="76" font-family="Baloo 2, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">z</text>';
    return '<svg class="rest-art" viewBox="0 0 400 300" aria-hidden="true">' + o + "</svg>";
  }

  // ---------- Panel: the job bar, the step row (Go is the current step) and the bottom bar ----------
  // Step pictures: flat colors, 2 px ink outline (shared by the chip and the Go of a step).
  function pic(body) { return '<svg viewBox="0 0 40 40">' + body + "</svg>"; }
  var PIC = {
    add: pic('<path d="M7 12h18l-3 20H10z" fill="#FFFFFF" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round" transform="rotate(-28 16 22)"/><g fill="#F3E6CF" stroke="#1D2340" stroke-width="1.5"><circle cx="28" cy="25" r="2.6"/><circle cx="31" cy="31" r="2.3"/><circle cx="26" cy="33" r="2.3"/></g><path d="M22 36h16" stroke="#1D2340" stroke-width="2.5" stroke-linecap="round"/>'),
    mix: pic('<path d="M20 4v8" stroke="#1D2340" stroke-width="3" stroke-linecap="round"/><g fill="none" stroke="#1D2340" stroke-width="2.4" stroke-linecap="round"><path d="M20 11Q6 26 20 35Q34 26 20 11"/><path d="M20 11Q13 27 20 35Q27 27 20 11"/></g><path d="M5 20a15 15 0 0 1 4-8M35 20a15 15 0 0 1-4 8" fill="none" stroke="#3DB4FF" stroke-width="2.5" stroke-linecap="round"/>'),
    serve: pic('<ellipse cx="20" cy="31" rx="17" ry="5" fill="#FFFFFF" stroke="#1D2340" stroke-width="2.5"/><path d="M9 29q0-15 11-15t11 15z" fill="#E4AD62" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><path d="M15 21l3-3M21 21l3-3" stroke="#F6D7A7" stroke-width="2.5" stroke-linecap="round"/>')
  };
  var STEPS = [
    { id: "add", name: "Add", pic: PIC.add, go: "Add!", coach: "Add the ingredients!" },
    { id: "mix", name: "Mix", pic: PIC.mix, go: "Mix!", coach: "Mix it up!" },
    { id: "serve", name: "Serve", pic: PIC.serve, go: "Serve!", coach: "Serve it!" }
  ];
  function stepFor(ph) {
    if (ph === "recipe" || ph === "done") return "";
    if (ph === "lower" || ph === "run" || ph === "mix") return "mix";
    if (ph === "bowl" || ph === "take") return "serve";
    return "add";
  }
  var lastStep = null, lastBusy = null;
  function updateSteps() {
    if (!steps) return;
    var ph = phase(), id = stepFor(ph), R = recipe();
    if (!id) { if (!steps.finished()) { steps.finish("Again!"); lastStep = ""; say("Yum! Make it again!", 4000); } }
    else if (id !== lastStep) { lastStep = id; steps.at(id); }
    // Go shows a fill while a motion runs by itself (a press then wiggles): the ingredients going in one
    // after another, the beater mixing, the batter lifting out.
    var v = false;
    if (id === "add" && autoAdd) {
      var n = R ? R.ing.length : 1, a = 0;
      if (R) R.ing.forEach(function (k) { a += Math.min(1, amountIn(k)); });
      v = clamp(a / n, 0.04, 1);
    } else if (id === "mix" && running() && headDown()) v = clamp(progress(), 0.04, 1);
    else if (id === "serve" && take) v = clamp(take.k, 0.04, 1);
    var k = v === false ? "no" : Math.round(v * 40);
    if (k !== lastBusy) { lastBusy = k; steps.busy(v); }
  }
  // One press: Go does the current step for him, at the calm pace.
  function doStep(id) {
    if (locked()) return false;
    if (id === "add") { usedTap.add = true; if (eggWait) crackEgg(); autoAdd = true; if (!busy()) addNext(); return; }
    if (id === "mix") { usedTap.mix = true; return doMix(); }
    if (id === "serve") { if (phase() !== "bowl") return false; ghost.learned("serve"); serve(); return; }
    return false;
  }

  // The ghost hand: the tap first (the next ingredient, the lever, the bowl); the real move (carry an
  // ingredient to the bowl, slide the lever) once he has used the tap.
  var usedTap = {};
  function knobPage(pos, a) { var p = h2s(LV_X0 + pos * LV_DX, LV_Y - 0.12, a); return toPage(p.x, p.y); }
  var ghost = Toybox.ghost({
    max: 3,
    onShow: function (p, on) { if (steps) steps.pulse(on); },
    plan: function () {
      if (Object.keys(stageDrags).length || document.body.classList.contains("big") || take) return null;
      var ph = phase();
      if (ph === "crack") return { pts: [toPage(EGG_SPOT.x, EGG_SPOT.y - 0.09)], tap: true, key: "crack" };
      if (ph === "add" && !autoAdd && !busy()) {
        var m = missing()[0], pg = m && itemPage(m);
        if (!pg) return null;
        if (!usedTap.add) return { pts: [pg], tap: true, key: "add" };
        return { pts: [pg, toPage(0, RIM_Y - 0.25)], carry: { html: ICON[m], size: 64 }, key: "add" };
      }
      if (ph === "run") return usedTap.mix ? { pts: [knobPage(0, 0), knobPage(3, 0)], key: "mix" } : { pts: [knobPage(0, 0)], tap: true, key: "mix" };
      if (ph === "bowl") return { pts: [toPage(0.05, -0.5)], tap: true, key: "serve" };
      if (ph === "done") { var gr = steps.go.el.getBoundingClientRect(); return { pts: [[gr.left + gr.width / 2, gr.top + gr.height / 2]], tap: true, key: "again" }; }
      return null;
    }
  });
  var JOBS = REC_ORDER.map(function (id) { return { id: id, name: id === "cream" ? "Cream" : RECIPES[id].name, pic: ICON["r" + id] }; });
  var jobs = Toybox.jobs($("jobs"), {
    jobs: JOBS,
    value: S.job,
    onPick: function (id) {
      if (take) { jobs.set(S.job); return; }
      stopMotor();
      var L = level();
      if (L > 0.01) { var sf = surf(L); burst(0, sf.y, 16, batterColor() || "#FFFFFF"); }
      clearFlying();
      S.recipe = "";
      startRecipe(id);
      say(RECIPES[id].name + "!");
    }
  });
  var steps = Toybox.steps($("steps"), {
    steps: STEPS,
    coach: coach,
    ghost: ghost,
    onGo: function (id) { return doStep(id); },
    onAgain: function () { ghost.learned("again"); startRecipe(S.job); },
    onBusy: function (id) {
      var R = recipe();
      if (id === "mix" && R) say(R.mix);
      else if (id === "add") say("In it goes!");
    }
  });
  Toybox.bar($("bottom"), { onNew: newBowl, onSurprise: surprise });

  // ---------- Start ----------
  updateCounter();
  layout();
  // Nothing on the go (a fresh visit): the picked recipe starts at once (the head tilts up, the beater clicks in).
  if (!S.recipe && !S.food) startRecipe(S.job);
  else if (S.recipe) rowT0 = now() - 1;
  // The step row can change the stage's height (a phone held sideways): keep the canvas sharp.
  if (window.ResizeObserver) new ResizeObserver(function () { layout(); }).observe(stage);
  var resizeT = 0;
  function onResize() { clearTimeout(resizeT); resizeT = setTimeout(layout, 60); layout(); }
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", function () { setTimeout(layout, 250); });
  Toybox.init({
    app: "kitchen",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the stand mixer switches off and spins down, and the controls lock. The timer carries on across the kitchen pages.",
    goodbyeOption: "End with a “Clean up” button to press",
    farewellText: "Time to finish cooking",
    goodbyeLabel: "Clean up",
    farewellDone: "Bye bye, kitchen!",
    restLine: "The kitchen is resting.",
    restLine2: "Your food will be on the table next time.",
    restArt: restArt,
    soundNote: "Soft whirs, clicks and plops. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: function () { stopMotor(); },
    onWake: function () { lastT = now(); },
    onBig: function () { setTimeout(layout, 30); },
    onSound: function (on) { if (on) chime(); }
  });
  Toybox.offFirst({
    running: function () { return running() || M.speed > 0.05; },
    name: "stand mixer",
    off: function (done) {
      stopMotor(); notch();
      var t0 = performance.now();
      var iv = setInterval(function () {
        if (M.speed <= 0.05 || performance.now() - t0 > 1500) { clearInterval(iv); done(); }
      }, 40);
    },
    flash: function () { M.flashUntil = now() + 3; }
  });
  requestAnimationFrame(loop);

  // Test hooks, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) {
    window.__mixer = {
      state: function () {
        return { phase: phase(), recipe: S.recipe, items: S.items.map(function (it) { return it.id + ":" + it.a.toFixed(2) + "/" + it.m.toFixed(2); }),
          beater: S.beater, head: +head.a.toFixed(2), up: S.up, lever: M.pos, speed: +M.speed.toFixed(2), food: S.food, top: S.top, count: S.count,
          coach: coach.text(), step: steps.current(), finished: steps.finished(), go: steps.go.label(), goBusy: steps.go.isBusy(), job: S.job, progress: +progress().toFixed(3), level: +level().toFixed(3), egg: !!eggWait, busy: busy(), climb: +climb.toFixed(2), B: +B.toFixed(1) };
      },
      pt: function (name) {
        if (name === "head") { var h = h2s(-0.3, -1.5, head.a); return toPage(h.x, h.y); }
        if (name === "headUp") { var hu = h2s(-0.3, -1.5, UP); return toPage(hu.x, hu.y); }
        if (name === "headDown") { var hd = h2s(-0.3, -1.5, 0); return toPage(hd.x, hd.y); }
        if (name === "lock") return toPage(LOCK.x, LOCK.y);
        if (name === "knob") return knobPage(M.pos, head.a);
        var m = /^lever(\d)$/.exec(name);
        if (m) { var lp = h2s(LV_X0 + (+m[1]) * LV_DX, LV_Y, head.a); return toPage(lp.x, lp.y); }
        if (name === "bowl") return toPage(0.05, -0.5);
        if (name === "egg") return toPage(EGG_SPOT.x, EGG_SPOT.y - 0.09);
        if (name === "food") return toPage(FOOD_X, FOOD_Y - 0.25);
        if (name === "shaft") { var sp = h2s(0, SHAFT_Y + 0.36, head.a); return toPage(sp.x, sp.y); }
        if (name.indexOf("ing:") === 0) return itemPage(name.slice(4));
        return null;
      },
      ghost: function () { return ghost.show(); },
      fun: function () { return { cur: Object.keys(FUN.cur), last: FUN.last, top: S.top }; },
      table: function () { try { return JSON.parse(localStorage.getItem(TABLEKEY) || "[]"); } catch (e) { return []; } }
    };
  }
})();
</script>
</body>
