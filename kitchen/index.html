<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }

/* ---------- The kitchen ---------- */
.scene { background: #FFF3DC; touch-action: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#map [data-go], #map [data-food] { cursor: pointer; }
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; }
/* Map labels (Toybox.map) on the cupboards in front of each station; smaller when the stations are drawn small. */
.tb-place-label { bottom: 4px; }
.scene.lbl-s .tb-place-label { font-size: 15px; gap: 4px; padding: 2px 8px 2px 4px; }
.scene.lbl-s .tb-place-label .tb-pic { width: 24px; height: 24px; }
.food { transform-box: fill-box; transform-origin: 50% 100%; }
.food.wig { animation: wig 0.7s ease-in-out; }
@keyframes wig { 20% { transform: rotate(-8deg) scale(1.06); } 45% { transform: rotate(7deg) scale(1.06); } 70% { transform: rotate(-4deg); } 100% { transform: none; } }
.food.newpop { animation: newpop 0.7s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
@keyframes newpop { 0% { transform: translateY(-40px) scale(0.3); opacity: 0; } 100% { transform: none; opacity: 1; } }
.mach.hop { animation: hop2 0.55s ease-out; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes hop2 { 40% { transform: translateY(-18px); } 100% { transform: none; } }
.puff { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; border-radius: 50%; border: 2px solid rgba(29, 35, 64, 0.35); }
body.big .tb-head > :not(.bigtoggle) { display: none; }
body.ending .homebtn, body.ending .tb-place, body.ending #map [data-go] { pointer-events: none; }
body.ending .homebtn, body.ending .tb-place-label { opacity: 0.4; }
.confetti { position: fixed; left: 0; top: 0; z-index: 70; width: 12px; height: 12px; border: 2px solid #1D2340; border-radius: 3px; pointer-events: none; }

/* ---------- Getting ready (Toybox.gate): wash hands, apron and chef hat, one tap does all three ---------- */
.tb-gate { background-color: #DDEFFC; }
.gate-home { position: absolute; z-index: 2; left: max(12px, env(safe-area-inset-left, 0px)); top: max(10px, env(safe-area-inset-top, 0px)); }
.rubbing { animation: rub 0.32s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes rub { 50% { transform: translateX(5px) rotate(8deg); } }

/* Timer pieces above the gate (z-index 40). */
.toast { top: max(70px, calc(env(safe-area-inset-top, 0px) + 70px)); z-index: 46; }
.farewell { z-index: 45; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }

@media (orientation: landscape) and (max-height: 520px) {
  .gate-home { top: 8px; }
  /* Phone held sideways: the station labels run along the bottom, so the coach line goes to the top. */
  #coach.tb-coach { top: 8px; bottom: auto; }
}
/* Upright: a bigger chef. */
@media (orientation: portrait) { .tb-gate-worker { width: min(78vw, 50vh, 420px); } }
/* The three getting-ready items in one row. */
.tb-gate .tb-gate-items { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (prefers-reduced-motion: reduce) {
  .rubbing { animation: none; }
}
</style>
</head>
<body>
<div class="tb-app-shell tb-v2">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Kitchen</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>
  <div class="tb-body">
    <main class="tb-stage stage scene" id="scene">
      <svg id="map" role="img" aria-label="A sunny kitchen with a blender, a stand mixer, a cutting board, a stove and a table"></svg>
      <div id="coach"></div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ANIM = !reduceMotion;

  // ---------- Keys shared by every kitchen page ----------
  var READY_KEY = "kitchen-ready";
  // The table: food finished at the stations (his collection, kept across visits).
  // Each entry: { k: "smoothie", c: "#rrggbb", s: "#rrggbb" straw, t: ms }. Stations append; oldest drop off.
  var TABLEKEY = "kitchen-table-v1", TABLE_MAX = 12, SEENKEY = "kitchen-table-seen";
  // Stations: only the ones that exist are tappable; the others are drawn as part of the kitchen.
  var STATIONS = [
    { id: "blender", label: "Blender", ready: true },
    { id: "cutting-board", label: "Cutting board", ready: true },
    { id: "stand-mixer", label: "Stand mixer", ready: true },
    { id: "stove", label: "Stove", ready: true }
  ];
  function readyOn() { try { return sessionStorage.getItem(READY_KEY) === "on"; } catch (e) { return true; } }
  var NEXT = (function () {
    var m = /[?&]next=([a-z-]+)/.exec(location.search);
    if (!m) return "";

  // ---------- SVG helpers ----------

  function Rc(x, y, w, h, rx, fill, sw, extra) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 0) + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (sw == null ? 4 : sw) + '"' + (extra || "") + "/>"; }
  function C(cx, cy, r, fill, sw, extra) { return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (sw == null ? 4 : sw) + '"' + (extra || "") + "/>"; }

  function Ln(x1, y1, x2, y2, col, w) { return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>'; }

  // ---------- Stations (each drawn in a 300 x 340 tile; the counter top is at y = 250) ----------
  function blenderArt(icon) {
    var o = "";

      // A bunch of bananas and a cup waiting.
      o += shadow(70, 250, 34, 5) + P("M40 246 Q44 214 78 206 Q66 222 66 246 Z", "#FFD84D", 3.5) + P("M56 248 Q62 216 96 214 Q82 228 84 248 Z", "#FFE16B", 3.5) + Rc(72, 200, 10, 10, 3, "#8A5A2B", 3);

    o += Rc(116, 186, 68, 12, 3, "#3B4256", 3.5);
    o += Rc(116, 208, 68, 26, 6, "#2B3045", 3);
    o += C(128, 220, 6, "#7ED957", 2.5) + C(150, 220, 6, "#FFB627", 2.5) + C(172, 220, 6, "#5AC8FA", 2.5);
    o += P("M106 82 Q78 82 84 116 L90 156 Q92 170 112 168", "none", 11) + S("M106 82 Q78 82 84 116 L90 156 Q92 170 112 168", "#5B6276", 5);
    o += P("M114 186 L186 186 L196 70 L104 70 Z", "rgba(214,238,255,0.65)", 0);
    o += P("M109 124 L191 124 L186 184 L114 184 Z", "#F07A9A", 0);
    o += '<ellipse cx="150" cy="124" rx="40" ry="5" fill="#F7A9BE"/>';
    o += P("M114 186 L186 186 L196 70 L104 70 Z", "none", 4);
    o += S("M176 82 L170 172", "rgba(255,255,255,0.9)", 5);
    o += Rc(98, 58, 104, 14, 6, "#3B4256", 4) + Rc(138, 47, 24, 12, 4, "#5B6276", 3);

  }
  function mixerArt() {
    var o = shadow(150, 250, 84, 6);
    o += Rc(66, 234, 166, 16, 7, "#4DB6AC", 4);
    o += P("M190 236 L190 128 Q190 116 202 116 L218 116 Q230 116 230 128 L230 236 Z", "#4DB6AC", 4);
    o += P("M78 176 L170 176 Q168 236 124 240 Q80 236 78 176 Z", "#C9D3E0", 4) + E(124, 176, 46, 8, "#E6ECF3", 3.5);

    return o;
  }
  function boardArt() {
    var o = "";

    o += shadow(206, 250, 54, 5);
    o += C(188, 188, 17, "#E63946", 3.5) + C(220, 186, 17, "#FF9A1F", 3.5) + C(204, 172, 16, "#7ED957", 3.5) + Ln(204, 157, 207, 150, INK, 3);
    o += P("M156 196 L256 196 Q252 244 206 248 Q160 244 156 196 Z", "#3DB4FF", 4);

  }
  function stoveArt() {
    var o = "";
    // The range: oven below the counter line, cooktop on top.
    o += Rc(18, 250, 264, 90, 4, "#E9EEF4", 4);
    o += Rc(18, 250, 264, 24, 4, "#C9D3E0", 4);
    for (var i = 0; i < 4; i++) o += C(54 + i * 64, 262, 7, "#3B4256", 3);

    o += Rc(60, 276, 180, 8, 4, "#9AA5B8", 3);
    o += Rc(14, 232, 272, 20, 5, "#2B3045", 4);
    o += E(84, 240, 44, 7, "#4A5066", 3) + E(216, 240, 44, 7, "#4A5066", 3);
    // Pot with a lid on the left, frying pan with a pancake on the right.
    o += P("M50 176 L118 176 L114 236 Q84 242 54 236 Z", "#E63946", 4) + Rc(42, 166, 84, 12, 6, "#B8323E", 4) + Rc(76, 154, 16, 12, 5, "#3B4256", 3);
    o += Rc(36, 186, 16, 8, 4, "#3B4256", 3) + Rc(116, 186, 16, 8, 4, "#3B4256", 3);
    o += E(212, 230, 44, 10, "#3B4256", 4) + E(212, 227, 30, 6, "#F2B45A", 3) + Rc(254, 224, 38, 9, 4, "#3B4256", 3);
    return o;
  }
  var ART = { blender: blenderArt, "stand-mixer": mixerArt, "cutting-board": boardArt, stove: stoveArt };

  // ---------- Food on the table ----------
  function readTable() {
    var a = [];
    try { a = JSON.parse(localStorage.getItem(TABLEKEY) || "[]"); } catch (e) { a = []; }
    if (!Array.isArray(a)) return [];
    return a.filter(function (x) { return x && typeof x === "object"; }).slice(-TABLE_MAX);
  }
  function okCol(c, d) { return /^#[0-9a-fA-F]{6}$/.test(c || "") ? c : d; }
  // Each food is drawn standing on (0, 0), about 60 wide and 100 tall.
  function foodArt(f) {
    var c = okCol(f.c, "#F07A9A");
    if (f.k === "snack") {
      var s2 = okCol(f.s, c);
      return shadow(0, 0, 30, 4) + C(-12, -22, 9, c, 3) + C(15, -21, 8, s2, 3) + C(3, -27, 9, c, 3) + P("M-30 -18 L30 -18 Q26 0 0 2 Q-26 0 -30 -18 Z", "#3DB4FF", 3.5);
    }
    if (f.k === "smoothie") {
      var s = okCol(f.s, "#FFC93C");
      var o = shadow(0, 0, 24, 4);
      o += '<g transform="rotate(14 4 -4)">' + Rc(-4, -100, 9, 96, 4, "#FFFFFF", 3);
      for (var y = -94; y < -10; y += 16) o += '<rect x="-2.5" y="' + y + '" width="6" height="8" fill="' + s + '"/>';
      o += Rc(-4, -100, 9, 96, 4, "none", 3) + "</g>";
      o += P("M-22 -66 L22 -66 L17 0 L-17 0 Z", "rgba(214,238,255,0.7)", 0);
      o += P("M-20.5 -54 L20.5 -54 L17 0 L-17 0 Z", c, 0) + '<ellipse cx="0" cy="-54" rx="20" ry="4" fill="rgba(255,255,255,0.35)"/>';
      o += P("M-22 -66 L22 -66 L17 0 L-17 0 Z", "none", 3.5) + S("M12 -58 L9 -8", "rgba(255,255,255,0.85)", 3.5);
      return o;
    }
    // Something else from a station: a plate with the food's color on it.
    return shadow(0, 0, 30, 4) + E(0, -8, 30, 8, "#FFFFFF", 3.5) + P("M-18 -10 Q-16 -34 0 -34 Q16 -34 18 -10 Z", c, 3.5);
  }
  function emptyTableArt() {
    // A little vase with a flower while the table waits for food.
    return shadow(0, 0, 16, 3) + P("M-12 0 L-14 -30 Q0 -36 14 -30 L12 0 Z", "#3DB4FF", 3.5) + S("M0 -32 L0 -66", "#2EA05A", 4) +
      P("M0 -66 Q10 -76 0 -86 Q-10 -76 0 -66 Z", "#FF6FB5", 3) + P("M0 -66 Q12 -60 20 -70 Q10 -78 0 -66 Z", "#FF6FB5", 3) + P("M0 -66 Q-12 -60 -20 -70 Q-10 -78 0 -66 Z", "#FF6FB5", 3) + C(0, -70, 5, "#FFC93C", 2.5);
  }

  // ---------- Map layout ----------
  var mapSvg = $("map"), scene = $("scene");
  var TW = 300, TH = 340, TOP = 150, TBH = 300, TRW = 440;
  var L = null;
  function chooseLayout(cw, ch) {
    var best = null, n = STATIONS.length;
    [[n, 1], [Math.ceil(n / 2), 2]].forEach(function (g) {
      var kw = g[0] * TW, kh = TOP + g[1] * TH;
      // Table below the counters, or beside them.
      [["below", kw, kh + TBH], ["right", kw + TRW, kh]].forEach(function (t) {
        var s = Math.min(cw / t[1], ch / t[2]);
        if (!best || s > best.s + 0.0001) best = { cols: g[0], rows: g[1], table: t[0], s: s, w: t[1], h: t[2] };

    });
    best.VW = cw / best.s; best.VH = ch / best.s;
    best.gx = (best.VW - best.w) / 2;

    return best;
  }
  var tableItems = [], foodBox = null;
  function buildMap() {
    var cw = scene.clientWidth, ch = scene.clientHeight;
    if (cw < 10 || ch < 10) return;
    L = chooseLayout(cw, ch);
    var VW = L.VW, VH = L.VH, gx = L.gx, gy = L.gy;
    var kw = L.cols * TW, kBottom = gy + TOP + L.rows * TH;
    var o = "<defs>" +
      '<pattern id="tiles" width="34" height="34" patternUnits="userSpaceOnUse"><rect width="34" height="34" fill="#E3F1FB"/><path d="M0 0.5H34M0.5 0V34" stroke="#BFD9EC" stroke-width="2"/></pattern>' +
      '<pattern id="planks" width="120" height="40" patternUnits="userSpaceOnUse"><rect width="120" height="40" fill="#E2B07A"/><path d="M0 1H120M60 0V20M0 21H120M20 20V40" stroke="#C98B4F" stroke-width="2.5"/></pattern>' +
      '<pattern id="check" width="36" height="36" patternUnits="userSpaceOnUse"><rect width="36" height="36" fill="#FFFFFF"/><rect width="18" height="18" fill="#FF8FA3"/><rect x="18" y="18" width="18" height="18" fill="#FF8FA3"/></pattern>' +
      "</defs>";
    // Wall, floor.
    var floorY = L.table === "right" ? kBottom : kBottom;
    o += '<rect x="0" y="0" width="' + VW + '" height="' + floorY + '" fill="#FFF3DC"/>';
    o += '<rect x="0" y="' + floorY + '" width="' + VW + '" height="' + (VH - floorY + 2) + '" fill="url(#planks)"/>' + Ln(0, floorY, VW, floorY, INK, 4);
    // Window with the sun, and a rail of utensils, on the wall above the counters.
    var wy = gy + 14, wh = Math.min(TOP - 30, 120), wx = gx + kw / 2 - 110;
    if (gy + TOP > 90) {
      var top0 = Math.max(10, gy + TOP - 30 - Math.min(gy + TOP - 30, 220));
      // Keep the window clear of the coach line when it sits at the top (tablets).
      var ce = $("coach"), cr = ce.getBoundingClientRect(), sr = scene.getBoundingClientRect();
      if (cr.height && cr.top - sr.top < sr.height / 2) top0 = Math.max(top0, (cr.bottom - sr.top + 10) / L.s);
      wy = top0; wh = gy + TOP - 26 - top0;
    }
    if (wh > 50) {
      o += Rc(wx, wy, 220, wh, 10, "#9ED8FF", 5);
      o += C(wx + 160, wy + wh * 0.38, Math.min(26, wh * 0.22), "#FFD84D", 3.5);
      o += P("M" + (wx + 20) + " " + (wy + wh * 0.62) + " q16 -14 32 0 q12 -10 26 0 z", "#FFFFFF", 3);

  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { if (!e.target.closest || !e.target.closest(".sheet")) e.preventDefault(); }, { passive: false });

  var buildPending = false, lastSize = "";
  function scheduleBuild() {
    if (buildPending) return;
    buildPending = true;
    requestAnimationFrame(function () {
      buildPending = false;
      var key = scene.clientWidth + "x" + scene.clientHeight;
      if (key === lastSize) return;
      lastSize = key;
      buildMap();
    });
  }
  window.addEventListener("resize", scheduleBuild);
  window.addEventListener("orientationchange", function () { setTimeout(scheduleBuild, 200); });
  // The table changes when a station adds food in another tab.
  window.addEventListener("storage", function (e) { if (e.key === TABLEKEY || e.key === null) { lastSize = ""; scheduleBuild(); } });

  // ---------- Coach and ghost hand ----------
  var coach = Toybox.coach($("coach"));
  coach.step("Tap the blender!");
  function midOf(el) { var r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
  var ghost = Toybox.ghost({
    max: 2,
    plan: function () {
      if (gateOpen()) {
        if (washing) return null;
        var w = gt.el.querySelector(".tb-gate-worker");
        return w ? { pts: [midOf(w)], tap: true, key: "gate" } : null;
      }
      var go = mp && mp.places[0];
      return go && !go.hidden ? { pts: [midOf(go)], tap: true, key: "map" } : null;
    }
  });

  // ---------- Start ----------
  Toybox.init({
    app: "kitchen",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the kitchen switches off and the controls lock. The timer carries on across the kitchen pages.",
    goodbyeOption: "End with a “Clean up” button to press",
    farewellText: "Time to finish cooking",
    goodbyeLabel: "Clean up",
    farewellDone: "Bye bye, kitchen!",
    restLine: "The kitchen is resting.",
    restLine2: "Your food will be on the table next time.",
    restArt: restArt,
    soundNote: "Soft whirs, plops and chimes. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: function () { try { mapSvg.pauseAnimations(); } catch (e) { /* ignore */ } },
    onWake: onWake,
    onBig: function () { lastSize = ""; scheduleBuild(); },
    onSound: function (on) { if (on) chime(); }
  });
  makeMap();
  scheduleBuild();
  if (readyOn()) {
    if (NEXT && Toybox.timer.phase() !== "resting") { location.replace(NEXT); }
  } else if (!locked()) {
    showGate();
  }

  // Test hooks, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) {
    window.__kitchen = {
      layout: function () { return L && { cols: L.cols, rows: L.rows, table: L.table, s: L.s }; },
      gate: function () { return { hidden: !gateOpen(), washing: washing, dress: gt ? { hands: gt.isOn("hands"), apron: gt.isOn("apron"), hat: gt.isOn("hat") } : null, ready: readyOn() }; },
      table: function () { return mapSvg.querySelectorAll("[data-food]").length; },
      ghost: function () { return ghost.show(); }
    };
  }
})();
</script>
</body>
</html>
