<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen</title>
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }

/* ---------- The kitchen ---------- */
.scene { background: #FFF3DC; touch-action: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#map [data-go], #map [data-food] { cursor: pointer; }
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; }
.sbtn {
  position: absolute; left: 0; top: 0; z-index: 2; transform: translate(-50%, -50%);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none;
  color: #1D2340; background: #FFFFFF; border-color: #1D2340; box-shadow: 4px 4px 0 #1D2340;
  font-size: clamp(1.05rem, 2.6vw, 1.6rem); font-weight: 800; line-height: 1; min-height: 56px;
  padding: 0.25rem 1rem 0.25rem 0.5rem; border-width: 4px; border-radius: 20px;
}
.sbtn:active { transform: translate(-50%, -50%) translate(3px, 3px); box-shadow: 0 0 0 #1D2340; }
.sbtn svg { width: 1.7em; height: 1.9em; flex: none; display: block; overflow: visible; pointer-events: none; }
.sbtn span { pointer-events: none; padding-top: 0.12em; }
.sbtn.small { min-height: 46px; font-size: 1rem; padding: 0.15rem 0.7rem 0.15rem 0.35rem; border-width: 3px; box-shadow: 3px 3px 0 #1D2340; }
.food { transform-box: fill-box; transform-origin: 50% 100%; }
.food.wig { animation: wig 0.7s ease-in-out; }
@keyframes wig { 20% { transform: rotate(-8deg) scale(1.06); } 45% { transform: rotate(7deg) scale(1.06); } 70% { transform: rotate(-4deg); } 100% { transform: none; } }
.food.newpop { animation: newpop 0.7s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
@keyframes newpop { 0% { transform: translateY(-40px) scale(0.3); opacity: 0; } 100% { transform: none; opacity: 1; } }
.mach.hop { animation: hop2 0.55s ease-out; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes hop2 { 40% { transform: translateY(-18px); } 100% { transform: none; } }
.puff { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; border-radius: 50%; border: 2px solid rgba(29, 35, 64, 0.35); }
body.big .tb-head > :not(.bigtoggle) { display: none; }
body.ending .homebtn, body.ending .sbtn, body.ending #map [data-go] { pointer-events: none; }
body.ending .homebtn, body.ending .sbtn { opacity: 0.4; }

/* ---------- Getting ready: wash hands, apron and chef hat ---------- */
.gate {
  position: fixed; inset: 0; z-index: 40; overflow: hidden;
  background-color: #DDEFFC;
  background-image: linear-gradient(#BFD9EC 3px, transparent 3px), linear-gradient(90deg, #BFD9EC 3px, transparent 3px);
  background-size: 64px 64px; transition: opacity 0.7s ease;
}
.gate[hidden] { display: none; }
.gate.open { opacity: 0; pointer-events: none; }
.gtop {
  position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
}
.gtop .homebtn {
  flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 44px;
  padding: 2px 12px 2px 9px; font-weight: 700; font-size: 1rem; color: #1D2340; text-decoration: none;
  background: #FFFFFF; border: 3px solid #1D2340; border-radius: 12px; box-shadow: 2px 2px 0 #1D2340;
}
.gtop .homebtn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #1D2340; }
.gtop .homebtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.gcard {
  position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(760px, calc(100% - 28px)); height: min(900px, calc(100% - 96px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
  margin-top: 26px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px;
  background: var(--panel); color: var(--ink); border: 4px solid var(--edge); border-radius: 28px; box-shadow: 6px 6px 0 var(--edge); padding: 12px 14px 16px;
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.gcard.leaving { opacity: 0; transform: translate(-50%, -40%) scale(0.95); pointer-events: none; }
.gtitle { text-align: center; }
.gtitle h2 { margin: 0; font-size: clamp(1.9rem, 6.5vw, 3.2rem); font-weight: 800; line-height: 1; }
.gtitle p { margin: 4px 0 0; font-size: clamp(1.2rem, 3.6vw, 1.7rem); font-weight: 800; color: #2D5BD7; line-height: 1.2; min-height: 1.2em; }
.gscene { position: relative; min-height: 0; touch-action: none; overflow: hidden; }
#washWrap { border: 3px solid #1D2340; border-radius: 20px; background: #E3F1FB; }
.gscene[hidden] { display: none; }
.gscene svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; touch-action: none; }
#wash [data-hit] { cursor: pointer; }
#wash .water { stroke-dasharray: 10 14; animation: flow 0.5s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.glow { animation: glow 1.3s ease-in-out infinite; }
@keyframes glow { 50% { opacity: 0.2; } }
.gsteps { display: flex; justify-content: center; gap: clamp(8px, 3vw, 20px); padding: 2px 0 4px; }
.gsteps[hidden], .gtray[hidden] { display: none; }
.gstep { position: relative; width: clamp(54px, 13vw, 88px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  border: 3px dashed #9AA8C6; background: #F4FAFF; }
.gstep svg { width: 70%; height: 70%; }
.gstep.now { border: 4px solid #FFC93C; background: #FFF6D6; }
.gstep.ok { border: 3px solid #1D2340; background: #BDF0C8; }
.gstep .tick { position: absolute; right: -6px; top: -6px; width: 26px; height: 26px; border-radius: 50%; background: #2E9E5B; color: #FFFFFF;
  border: 3px solid #1D2340; font-size: 0.9rem; font-weight: 800; line-height: 20px; text-align: center; display: none; }
.gstep.ok .tick { display: block; }
.gtray { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.gslot { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #FFE3C2; color: #1D2340;
  border: 3px solid #1D2340; border-radius: 20px; padding: 6px 6px 8px; }
.gslot.on { background: #BDF0C8; }
.gitem { width: min(220px, 100%); height: clamp(60px, 11vh, 120px); touch-action: none; cursor: grab; position: relative; z-index: 2; }
.gitem svg { width: 100%; height: 100%; overflow: visible; display: block; pointer-events: none; }
.gitem.drag { z-index: 45; transition: none; }
.gitem.back { transition: transform 0.35s cubic-bezier(0.3, 1.4, 0.5, 1); }
.gitem.gone { transition: transform 0.3s ease, opacity 0.3s ease; opacity: 0; }
.glabel { font-weight: 800; font-size: clamp(1.1rem, 3.2vw, 1.5rem); line-height: 1.1; text-align: center; }
.glabel .ok { display: none; color: #1E7A43; }
.gslot.on .ok { display: inline; }
.tgt { animation: tgtpulse 1.4s ease-in-out infinite; }
@keyframes tgtpulse { 50% { opacity: 0.25; } }
.popin { transform-box: fill-box; transform-origin: 50% 50%; animation: popin 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }
@keyframes popin { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
.hop { animation: hop 0.6s ease-out 2; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes hop { 30% { transform: translateY(-16px); } 60% { transform: translateY(0); } }
.confetti { position: fixed; left: 0; top: 0; z-index: 70; width: 12px; height: 12px; border: 2px solid #1D2340; border-radius: 3px; pointer-events: none; }

/* Timer pieces above the gate (z-index 40). */
.toast { top: max(70px, calc(env(safe-area-inset-top, 0px) + 70px)); z-index: 46; }
.farewell { z-index: 45; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }

@media (min-width: 744px) and (min-height: 640px) {
  .sbtn.small { min-height: 56px; font-size: 1.15rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .gcard { grid-template-columns: 1.55fr 1fr; grid-template-rows: auto minmax(0, 1fr); margin-top: 22px; height: calc(100% - 70px); column-gap: 14px; }
  .gtitle { grid-column: 1 / 3; }
  .gtitle h2 { font-size: 1.7rem; display: inline; }
  .gtitle p { font-size: 1.15rem; display: inline; margin-left: 12px; }
  .gscene { grid-column: 1; grid-row: 2; }
  .gsteps, .gtray { grid-column: 2; grid-row: 2; align-content: center; align-self: center; }
  .gsteps { display: grid; grid-template-columns: 1fr 1fr; justify-items: center; gap: 10px; }
  .gstep { width: min(72px, 16vh); }
  .gtray { grid-template-columns: 1fr; gap: 6px; }
  .gslot { padding: 3px 4px 4px; border-radius: 16px; }
  .gitem { height: clamp(40px, 15vh, 64px); }
  .glabel { font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) {
  .tgt, .hop, .glow, #wash .water { animation: none; }
}
/* Ghost hand (tools/snippets/ghost-hand.css) */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Kitchen</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls">Big</button>
  </header>
  <div class="tb-body">
    <main class="tb-stage stage scene" id="scene">
      <svg id="map" role="img" aria-label="A sunny kitchen with a blender, a stand mixer, a cutting board, a stove and a table"></svg>
      <div id="sbtns"></div>
      <div class="tb-coach" id="coach">Tap the blender!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
  </div>
</div>

<!-- Getting ready: wash hands, then apron and chef hat. -->
<div class="gate" id="gate" hidden>
  <div class="gtop">
    <a class="homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg><span>Home</span></a>
  </div>
  <div class="gcard" id="gcard">
    <div class="gtitle"><h2 id="gTitle">Wash your hands!</h2><p id="gSub">Press the soap!</p></div>
    <div class="gscene" id="washWrap"><svg id="wash" viewBox="0 0 400 320" role="img" aria-label="Hands over a sink with soap, a tap and a towel"></svg></div>
    <div class="gscene" id="dressWrap" hidden><svg id="gChar" viewBox="0 -24 200 316" role="img" aria-label="A little chef getting ready"></svg></div>
    <div class="gsteps" id="gsteps" aria-hidden="true"></div>
    <div class="gtray" id="gtray" hidden>
      <div class="gslot" id="slotApron">
        <div class="gitem" id="itApron" data-item="apron" role="button" tabindex="0" aria-label="Apron"><svg viewBox="54 84 92 176" aria-hidden="true"></svg></div>
        <div class="glabel">Apron <span class="ok">✓</span></div>
      </div>
      <div class="gslot" id="slotHat">
        <div class="gitem" id="itHat" data-item="hat" role="button" tabindex="0" aria-label="Chef hat"><svg viewBox="44 -28 112 80" aria-hidden="true"></svg></div>
        <div class="glabel">Chef hat <span class="ok">✓</span></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ANIM = !reduceMotion;

  // ---------- Keys shared by every kitchen page ----------
  var READY_KEY = "kitchen-ready";
  // The table: food finished at the stations (his collection, kept across visits).
  // Each entry: { k: "smoothie", c: "#rrggbb", s: "#rrggbb" straw, t: ms }. Stations append; oldest drop off.
  var TABLEKEY = "kitchen-table-v1", TABLE_MAX = 12, SEENKEY = "kitchen-table-seen";
  // Stations: only the ones that exist are tappable; the others are drawn as part of the kitchen.
  var STATIONS = [
    { id: "blender", label: "Blender", ready: true },
    { id: "board", label: "Cutting board", ready: false },
    { id: "mixer", label: "Stand mixer", ready: false },
    { id: "stove", label: "Stove", ready: false }
  ];
  function readyOn() { try { return sessionStorage.getItem(READY_KEY) === "on"; } catch (e) { return true; } }
  function setReady() { try { sessionStorage.setItem(READY_KEY, "on"); } catch (e) { /* ignore */ } }
  var NEXT = (function () {
    var m = /[?&]next=([a-z-]+)/.exec(location.search);
    if (!m) return "";
    for (var i = 0; i < STATIONS.length; i++) if (STATIONS[i].ready && STATIONS[i].id === m[1]) return m[1] + ".html";
    return "";
  })();

  // ---------- SVG helpers ----------
  var INK = "#1D2340", SKIN = "#F2C49B";
  function P(d, fill, sw, extra) { return '<path d="' + d + '" fill="' + (fill || "none") + '" stroke="' + INK + '" stroke-width="' + (sw == null ? 4 : sw) + '" stroke-linejoin="round" stroke-linecap="round"' + (extra || "") + "/>"; }
  function S(d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linejoin="round" stroke-linecap="round"/>'; }
  function Rc(x, y, w, h, rx, fill, sw, extra) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 0) + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="' + (sw == null ? 4 : sw) + '"' + (extra || "") + "/>"; }

  // ---------- Stations (each drawn in a 300 x 340 tile; the counter top is at y = 250) ----------
  function blenderArt(icon) {

      // A bunch of bananas and a cup waiting.

    o += Rc(116, 186, 68, 12, 3, "#3B4256", 3.5);
    o += Rc(116, 208, 68, 26, 6, "#2B3045", 3);

    o += Rc(98, 58, 104, 14, 6, "#3B4256", 4) + Rc(138, 47, 24, 12, 4, "#5B6276", 3);
    return o;
  }
  function mixerArt() {
    var o = shadow(150, 250, 84, 6);
    o += Rc(66, 234, 166, 16, 7, "#4DB6AC", 4);
    o += P("M190 236 L190 128 Q190 116 202 116 L218 116 Q230 116 230 128 L230 236 Z", "#4DB6AC", 4);
    o += P("M78 176 L170 176 Q168 236 124 240 Q80 236 78 176 Z", "#C9D3E0", 4) + E(124, 176, 46, 8, "#E6ECF3", 3.5);

    o += P("M76 104 Q76 82 100 82 L212 82 Q236 82 236 106 L236 126 Q236 140 220 140 L94 140 Q76 140 76 124 Z", "#4DB6AC", 4);
    o += S("M92 92 L200 92", "rgba(255,255,255,0.5)", 5);
    o += Rc(236, 98, 16, 8, 3, "#3B4256", 3) + C(96, 112, 7, "#3B4256", 3);
    return o;
  }
  function boardArt() {
    var o = "";
    // Fruit bowl behind.
    o += shadow(206, 250, 54, 5);
    o += C(188, 188, 17, "#E63946", 3.5) + C(220, 186, 17, "#FF9A1F", 3.5) + C(204, 172, 16, "#7ED957", 3.5) + Ln(204, 157, 207, 150, INK, 3);
    o += P("M156 196 L256 196 Q252 244 206 248 Q160 244 156 196 Z", "#3DB4FF", 4);
    // Cutting board with a carrot, cucumber slices and a kid's nylon knife.
    o += shadow(140, 254, 110, 5);
    o += P("M30 232 L246 232 L256 250 L22 250 Z", "#E7B77A", 4) + Rc(22, 248, 234, 10, 3, "#C98B4F", 3.5);

    el.addEventListener("pointermove", dressMove);
    el.addEventListener("pointerup", dressUp);
    el.addEventListener("pointercancel", dressUp);

  });
  function resetDress() {

  }
  var stage2 = "wash";
  function startDress() {

    $("gSub").textContent = "Put them on the chef!";

    $("dressWrap").hidden = false; $("gtray").hidden = false;

    if (ghost) ghost.again();
  }
  function dressDone() {
    stage2 = "done";
    setTimeout(function () {
      chime();
      $("gTitle").textContent = "Ready to cook!";
      $("gSub").textContent = "Let's go!";
      var c = $("charAll");
      c.classList.remove("hop"); void c.getBoundingClientRect(); if (!reduceMotion) c.classList.add("hop");
      var r = $("gChar").getBoundingClientRect();

      setTimeout(openKitchen, reduceMotion ? 400 : 2200);
    }, 250);
  }
  function confetti(x, y, n) {
    if (reduceMotion) n = Math.min(n, 6);
    var cols = ["#FFC93C", "#FF6FB5", "#3A86FF", "#2E9E5B", "#E63946"];
    for (var i = 0; i < n; i++) {
      var d = document.createElement("div");

      d.style.background = cols[i % cols.length];
      document.body.appendChild(d);
      var a = rand(0, Math.PI * 2), sp = rand(80, 260), dx = Math.cos(a) * sp, dy = Math.sin(a) * sp - 60;
      if (!d.animate) { d.remove(); continue; }
      d.animate([{ transform: "translate(" + (x - 6) + "px," + (y - 6) + "px) rotate(0deg)", opacity: 1 },
        { transform: "translate(" + (x - 6 + dx) + "px," + (y - 6 + dy + 140) + "px) rotate(" + rand(-400, 400) + "deg)", opacity: 0 }],
        { duration: rand(800, 1300), easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = (function (el) { return function () { el.remove(); }; })(d);
    }
  }

  // ----- The gate as a whole -----
  var gateEl = $("gate"), gcard = $("gcard"), gateTimer = null, opening = false;
  function showGate() {
    clearTimeout(gateTimer); opening = false;
    stage2 = "wash";
    $("gTitle").textContent = "Wash your hands!";
    $("washWrap").hidden = false; $("gsteps").hidden = false;
    $("dressWrap").hidden = true; $("gtray").hidden = true;
    gateEl.hidden = false;
    gateEl.classList.remove("open");
    gcard.classList.remove("leaving");

    resetDress();
  }
  function openKitchen() {
    if (opening || locked()) return;

    setReady();
    gcard.classList.add("leaving");
    // The full getting-ready was just shown: the first station he opens skips its quick check.
    try { sessionStorage.setItem("kitchen-check-skip", "1"); } catch (e) { /* ignore */ }

      if (NEXT && !locked()) { location.replace(NEXT); return; }
      gateEl.classList.add("open");
      gateTimer = setTimeout(function () { gateEl.hidden = true; opening = false; if (ghost) ghost.again(); }, reduceMotion ? 200 : 750);
    }, reduceMotion ? 50 : 450);
  }

  // ---------- Sound (off by default; soft and synthesized) ----------
  var master = null, masterCtx = null;
  function out(ac) { if (masterCtx !== ac) { master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination); masterCtx = ac; } return master; }
  function tone(freq, dur, vol, type, slideTo, delay) {
    var ac = Toybox.sound.ready();
    if (!ac) return;
    var t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    o.start(t); o.stop(t + dur + 0.05);
  }
  function blip() { tone(rand(520, 720), 0.12, 0.035, "sine", 880); }
  function plop() { tone(360, 0.14, 0.05, "sine", 180); }
  function whir() { tone(140, 0.4, 0.03, "sawtooth", 260); }
  function chime() { tone(523, 0.4, 0.04); tone(784, 0.6, 0.04, "sine", null, 0.12); }

  // ---------- Play timer hooks ----------
  function locked() { return Toybox.timer.locked(); }
  function onEnding(done, info) {
    try { mapSvg.pauseAnimations(); } catch (e) { /* ignore */ }
    if (info.goodbye) { done(); return; }
    setTimeout(done, 3000);
  }
  function onWake() {
    try { mapSvg.unpauseAnimations(); } catch (e) { /* ignore */ }
    if (!readyOn() && gateEl.hidden) showGate();
  }
  function restArt() {
    var o = '<rect width="400" height="300" fill="#2B3A67"/>';
    o += '<rect x="130" y="26" width="140" height="96" rx="8" fill="#1B2550" stroke="#1D2340" stroke-width="4"/><circle cx="226" cy="60" r="18" fill="#FFF4CC"/><circle cx="236" cy="54" r="16" fill="#1B2550"/>';
    [[150, 46], [170, 100], [250, 104], [196, 40]].forEach(function (s) { o += '<circle cx="' + s[0] + '" cy="' + s[1] + '" r="2.5" fill="#FFF4CC"/>'; });
    o += '<rect y="196" width="400" height="104" fill="#4C77A6"/><rect y="188" width="400" height="14" fill="#C9A06A" stroke="#1D2340" stroke-width="4"/>';
    o += '<g transform="translate(-10 -62)">' + stoveArt() + "</g>";
    o += '<g transform="translate(180 -62) scale(0.9)">' + blenderArt(true) + "</g>";
    o += '<g transform="translate(330 188)">' + foodArt({ k: "smoothie", c: "#E56B8A", s: "#FFC93C" }) + "</g>";
    o += '<text x="300" y="100" font-family="Baloo 2, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">z</text><text x="324" y="76" font-family="Baloo 2, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">z</text><text x="344" y="56" font-family="Baloo 2, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">z</text>';
    return '<svg class="rest-art" viewBox="0 0 400 300" aria-hidden="true">' + o + "</svg>";
  }

  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { if (!e.target.closest || !e.target.closest(".sheet")) e.preventDefault(); }, { passive: false });

  var buildPending = false, lastSize = "";
  function scheduleBuild() {
    if (buildPending) return;
    buildPending = true;
    requestAnimationFrame(function () {
      buildPending = false;
      var key = scene.clientWidth + "x" + scene.clientHeight;
      if (key === lastSize) return;
      lastSize = key;
      buildMap();
    });
  }
  window.addEventListener("resize", scheduleBuild);
  window.addEventListener("orientationchange", function () { setTimeout(scheduleBuild, 200); });
  // The table changes when a station adds food in another tab.
  window.addEventListener("storage", function (e) { if (e.key === TABLEKEY || e.key === null) { lastSize = ""; scheduleBuild(); } });

  // ---------- Ghost hand (tools/snippets/ghost-hand.js) ----------
  function makeGhost(plan, opt) {
    opt = opt || {};
    var IDLE = opt.idle || 4500, MAX = opt.max || 2;
    var last = Date.now(), shown = 0, armed = true, learnedF = false, run = null, el = null;
    var reduceG = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    function build() {
      el = document.createElement("div");
      el.className = "ghosthand";
      el.setAttribute("aria-hidden", "true");
      el.innerHTML = '<svg viewBox="-24 -18 64 84"><circle class="gh-press" cx="0" cy="0" r="17" fill="rgba(255,201,60,0.55)"/>' +
        '<g fill="#FFFFFF" stroke="#1D2340" stroke-width="3" stroke-linejoin="round">' +
        '<rect x="-9" y="-6" width="18" height="40" rx="9"/><rect x="-12" y="22" width="44" height="40" rx="16"/>' +
        '<rect x="10" y="14" width="14" height="24" rx="7"/></g>' +
        '<circle cx="0" cy="2" r="5" fill="rgba(255,201,60,0.9)"/></svg>';
      el.insertBefore(carryEl, el.firstChild);
      document.body.appendChild(el);
    }
    function stop() { run = null; if (el) { el.style.display = "none"; carryEl.innerHTML = ""; } }
    var carryEl = document.createElement("div");
    carryEl.className = "gh-carry";
    function poke() { last = Date.now(); armed = true; if (run) stop(); }
    document.addEventListener("pointerdown", poke, true);
    document.addEventListener("keydown", poke, true);
    function blocked() {
      if (document.hidden) return true;
      if (window.Toybox && (Toybox.sheetOpen() || Toybox.timer.phase() === "ending" || Toybox.timer.phase() === "resting")) return true;
      return !!(opt.ok && !opt.ok());
    }
    function easeG(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function at(pts, f) {
      if (pts.length < 2) return pts[0];
      var segs = [], tot = 0, i;
      for (i = 1; i < pts.length; i++) { var l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); tot += l; }
      var d = f * tot;
      for (i = 0; i < segs.length; i++) {
        if (d <= segs[i] || i === segs.length - 1) { var t = segs[i] ? Math.min(1, d / segs[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; }
        d -= segs[i];
      }
      return pts[pts.length - 1];
    }
    function frame() {
      if (!run) return;
      var t = (Date.now() - run.t0) / run.dur, p = run.p, s = run.s, x, y, a, press, sc = 1;
      if (t >= 1) { stop(); return; }
      if (p.tap || p.pts.length < 2) {
        var pt = p.pts[0];
        x = pt[0]; y = pt[1];
        a = t < 0.15 ? t / 0.15 : (t > 0.85 ? (1 - t) / 0.15 : 1);
        press = (t > 0.3 && t < 0.42) || (t > 0.55 && t < 0.67);
        sc = press ? 0.92 : 1;
        if (t < 0.3) { var k = 1 - t / 0.3; x += 26 * s * k; y += 30 * s * k; }
      } else {
        a = t < 0.1 ? t / 0.1 : (t > 0.9 ? (1 - t) / 0.1 : 1);
        var f = reduceG ? 0.5 : easeG(Math.max(0, Math.min(1, (t - 0.16) / 0.66)));
        var q = at(p.pts, f); x = q[0]; y = q[1];
        press = t > 0.12 && t < 0.86;
        sc = t < 0.12 ? 1.12 - 0.12 * (t / 0.12) : 1;
      }
      el.style.opacity = (0.85 * a).toFixed(3);
      el.style.transform = "translate(" + (x - 24 * s) + "px," + (y - 18 * s) + "px) rotate(-14deg) scale(" + sc + ")";
      el.lastChild.firstChild.style.opacity = press ? "1" : "0";
      carryEl.style.opacity = press ? "0.75" : "0";
      requestAnimationFrame(frame);
    }
    function show(p) {
      if (!el) build();
      var s = Math.max(1, Math.min(1.7, Math.min(innerWidth, innerHeight) / 360));
      el.style.width = (64 * s) + "px"; el.style.height = (84 * s) + "px";
      el.style.transformOrigin = (24 * s) + "px " + (18 * s) + "px";
      el.style.display = "block";
      carryEl.innerHTML = p.carry ? p.carry.html : "";
      if (p.carry) {
        var c = p.carry.size;
        carryEl.style.cssText = "position:absolute;left:" + (24 * s - c / 2) + "px;top:" + (18 * s - c / 2) + "px;width:" + c + "px;height:" + c + "px";
      }
      run = { p: p, s: s, t0: Date.now(), dur: p.dur || (p.tap ? 2400 : 3200) };
      requestAnimationFrame(frame);
    }
    setInterval(function () {
      if (run || learnedF || !armed || shown >= MAX || Date.now() - last < IDLE) return;
      if (blocked()) { last = Date.now(); return; }
      var p = plan();
      if (!p || !p.pts || !p.pts.length) return;
      armed = false; shown++;
      show(p);
    }, 250);
    return {
      learned: function () { learnedF = true; stop(); },
      again: function () { learnedF = false; shown = 0; armed = true; last = Date.now(); },
      poke: poke,
      show: function () { var p = plan(); if (p) show(p); return !!p; }
    };
  }
  function midOf(el) { var r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
  var ghost = null;
  function learnedStep() { if (ghost) ghost.learned(); }
  ghost = makeGhost(function () {
    if (!gateEl.hidden) {
      if (opening || washDrag || Object.keys(dressDrags).length) return null;
      if (stage2 === "wash" && W && !W.done && !W.busy && !W.auto) {
        if (W.step === 0) return { pts: [svgToPage(344, 56)], tap: true };
        if (W.step === 1) { var a = svgToPage(HX - 50, HY), b = svgToPage(HX + 50, HY); return { pts: [a, b, a, b, a], dur: 3600 }; }
        if (W.step === 2 && !W.water) return { pts: [svgToPage(146, 107)], tap: true };
        if (W.step === 3) return { pts: [svgToPage(W.towel.x + 30, W.towel.y + 50), svgToPage(HX - 40, HY - 10), svgToPage(HX + 40, HY - 10), svgToPage(HX - 30, HY - 10)], dur: 3800 };
        return null;
      }
      if (stage2 === "dress") {
        if (!DRESS.apron) return { pts: [midOf($("itApron")), midOf($("apronTgt"))] };
        if (!DRESS.hat) return { pts: [midOf($("itHat")), midOf($("hatTgt"))] };
      }
      return null;
    }
    var go = btnEls.blender || mapSvg.querySelector("[data-go]");
    return go ? { pts: [midOf(go)], tap: true } : null;
  });

  // ---------- Start ----------
  Toybox.init({
    app: "kitchen",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the kitchen switches off and the controls lock. The timer carries on across the kitchen pages.",
    goodbyeOption: "End with a “Clean up” button to press",
    farewellText: "Time to finish cooking",
    goodbyeLabel: "Clean up",
    farewellDone: "Bye bye, kitchen!",
    restLine: "The kitchen is resting.",
    restLine2: "Your food will be on the table next time.",
    restArt: restArt,
    soundNote: "Soft whirs, plops and chimes. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: function () { try { mapSvg.pauseAnimations(); } catch (e) { /* ignore */ } },
    onWake: onWake,
    onBig: function () { lastSize = ""; scheduleBuild(); },
    onSound: function (on) { if (on) chime(); }
  });
  scheduleBuild();
  if (readyOn()) {
    if (NEXT && Toybox.timer.phase() !== "resting") { location.replace(NEXT); }
  } else if (!locked()) {
    showGate();
  }
  // Tapping a station on the map is "the move"; once done the hand stops for the map.
  sbtns.addEventListener("pointerdown", function () { if (gateEl.hidden && ghost) ghost.learned(); });

  // Test hooks, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) {
    window.__kitchen = {
      layout: function () { return L && { cols: L.cols, rows: L.rows, table: L.table, s: L.s }; },
      gate: function () { return { hidden: gateEl.hidden, stage: stage2, step: W && W.step, foam: W && W.foam, wet: W && W.wet, dry: W && W.dry, dress: { apron: DRESS.apron, hat: DRESS.hat }, ready: readyOn(), sub: $("gSub").textContent }; },
      wash: function (x, y) { return svgToPage(x, y); },
      spots: { soap: [344, 56], lever: [146, 107], hands: [HX, HY], towel: function () { return [W.towel.x + 30, W.towel.y + 50]; } },
      table: function () { return mapSvg.querySelectorAll("[data-food]").length; },
      ghost: function () { return ghost.show(); }
    };
  }
})();
</script>
