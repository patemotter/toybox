<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blender</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }
.stage { background: #FFF3DC; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; }
/* The thing under his finger while he drags an ingredient from the counter. */
.float { position: fixed; left: 0; top: 0; z-index: 30; width: 84px; height: 84px; pointer-events: none;
  filter: drop-shadow(3px 4px 0 rgba(29, 35, 64, 0.25)); will-change: transform; }
.float svg { width: 100%; height: 100%; display: block; overflow: visible; }
/* Big: the header, the step chips and the bottom bar hide; Go stays (the scene does every step too). */
body.big .tb-head > :not(.bigtoggle), body.big .tb-chip, body.big .tb-bottombar { display: none; }
body.ending .tb-panel, body.resting .tb-panel { pointer-events: none; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
/* The Back button shows the kitchen's picture (and its name on an iPad). */
/* Phone held sideways: the ingredients run along the bottom, so the coach line goes to the top. */
@media (orientation: landscape) and (max-height: 520px) { #coach.tb-coach { top: 8px; bottom: auto; } }
.mapbtn .tb-mapic { width: 30px; height: 30px; background: #FFFFFF; border-radius: 8px; }
</style>
</head>
<body>
<div class="tb-app-shell tb-v2">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="backbtn" href="./" aria-label="Back to the kitchen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><svg class="tb-mapic" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 33h28" stroke="#1D2340" stroke-width="3" stroke-linecap="round"/><path d="M9 17h22l-2 14H11z" fill="#E63946" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="7" y="12" width="26" height="6" rx="3" fill="#B8323E" stroke="#1D2340" stroke-width="2.5"/><rect x="17" y="7" width="6" height="5" rx="2" fill="#3B4256" stroke="#1D2340" stroke-width="2"/><path d="M4 20h5M31 20h5" stroke="#1D2340" stroke-width="3" stroke-linecap="round"/></svg><span>Kitchen</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Blender</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>
  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A blender on the kitchen counter with a cup next to it and fruit, yogurt, milk and ice in front"></canvas>
      <div class="tb-counter" id="counter">Smoothies: 0</div>
      <div id="coach"></div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
    <section class="tb-panel" id="panel">
      <ol id="steps"></ol>
      <div id="bottom"></div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Getting ready (once per visit, on the kitchen page) ----------
  var readyOn = true;
  try { readyOn = sessionStorage.getItem("kitchen-ready") === "on"; } catch (e) { readyOn = true; }
  if (!readyOn) { location.replace("./?next=blender"); return; }

  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ease(t) { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function now() { return performance.now() / 1000; }
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var INK = "#1D2340";

  var STATEKEY = "kitchen-blender-v1";
  // The kitchen table (his collection, kept across visits). Each entry: { k: "smoothie", c: "#rrggbb"
  // (the food's color), s: "#rrggbb" (straw color), t: ms timestamp }. Other stations add their own k.
  var TABLEKEY = "kitchen-table-v1", TABLE_MAX = 12;

  // ---------- Ingredients ----------
  // vol: share of the jar it fills; w: how strongly its color shows in the mix; n: pieces (solids).
  var ING = {
    banana:     { name: "Banana",     col: "#F6E3A0", w: 0.8,  vol: 0.18, n: 5, r: 0.085 },
    strawberry: { name: "Strawberry", col: "#EC2F55", w: 1.6,  vol: 0.18, n: 5, r: 0.08 },
    blueberry:  { name: "Blueberry",  col: "#5236A8", w: 1.4,  vol: 0.14, n: 9, r: 0.048 },
    spinach:    { name: "Spinach",    col: "#3FA83A", w: 1.1,  vol: 0.14, n: 5, r: 0.085 },
    yogurt:     { name: "Yogurt",     col: "#FFF6E6", w: 0.4,  vol: 0.20, liquid: true },
    milk:       { name: "Milk",       col: "#FFFFFF", w: 0.4,  vol: 0.26, liquid: true },
    ice:        { name: "Ice",        col: "#E6F6FF", w: 0.2,  vol: 0.14, n: 4, r: 0.07 }
  };
  var ING_ORDER = ["banana", "strawberry", "blueberry", "spinach", "yogurt", "milk", "ice"];
  var STRAWS = [
    { id: "red", name: "Red", col: "#E63946" }, { id: "orange", name: "Orange", col: "#FF8A1F" },
    { id: "yellow", name: "Yellow", col: "#FFC93C" }, { id: "green", name: "Green", col: "#2EA05A" },
    { id: "blue", name: "Blue", col: "#2D7BE5" }, { id: "purple", name: "Purple", col: "#8E5CE0" },
    { id: "pink", name: "Pink", col: "#FF6FB5" }
  ];
  var CAP = 0.86; // the jar is full at this share

  // ---------- Small SVG pictures (panel tiles, the dragged thing, the ghost hand) ----------
  function sv(inner) { return '<svg viewBox="0 0 60 60" aria-hidden="true">' + inner + "</svg>"; }
  var ST = ' stroke="#1D2340" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
  var ICON = {
    banana: sv('<path d="M10 20 Q14 46 38 50 Q52 52 54 44 Q40 44 30 36 Q20 28 18 16 Z" fill="#FFD84D"' + ST + '/><path d="M18 16 L14 9 L10 12 L10 20" fill="#8A5A2B"' + ST + '/><path d="M20 26 Q26 40 40 45" fill="none" stroke="#E8B820" stroke-width="2.5" stroke-linecap="round"/>'),
    strawberry: sv('<path d="M30 54 Q10 40 12 24 Q14 14 30 16 Q46 14 48 24 Q50 40 30 54 Z" fill="#E8344E"' + ST + '/><path d="M18 16 L24 10 L30 15 L36 10 L42 16 L30 20 Z" fill="#3E9B3A"' + ST + '/><g fill="#FFE68A"><circle cx="22" cy="28" r="1.8"/><circle cx="32" cy="26" r="1.8"/><circle cx="40" cy="30" r="1.8"/><circle cx="26" cy="38" r="1.8"/><circle cx="36" cy="40" r="1.8"/><circle cx="30" cy="47" r="1.6"/></g>'),
    blueberry: sv('<circle cx="20" cy="36" r="12" fill="#4B4FA8"' + ST + '/><circle cx="40" cy="38" r="12" fill="#3F3F96"' + ST + '/><circle cx="30" cy="20" r="12" fill="#5458B8"' + ST + '/><path d="M26 17 L30 21 L34 17" fill="none" stroke="#1D2340" stroke-width="2.5" stroke-linecap="round"/><circle cx="25" cy="15" r="3" fill="rgba(255,255,255,0.45)"/>'),
    spinach: sv('<path d="M8 50 Q6 22 30 10 Q34 34 8 50 Z" fill="#3E9B3A"' + ST + '/><path d="M8 50 Q20 30 28 14" fill="none" stroke="#9BE08C" stroke-width="2.5" stroke-linecap="round"/><path d="M22 54 Q30 26 54 22 Q50 46 22 54 Z" fill="#2F8A34"' + ST + '/><path d="M22 54 Q36 38 50 25" fill="none" stroke="#9BE08C" stroke-width="2.5" stroke-linecap="round"/>'),
    yogurt: sv('<path d="M14 22 L46 22 L42 54 L18 54 Z" fill="#FFFFFF"' + ST + '/><rect x="16" y="32" width="28" height="12" fill="#7EC8FF" stroke="none"/><path d="M14 22 L46 22 L42 54 L18 54 Z" fill="none"' + ST + '/><rect x="10" y="16" width="40" height="8" rx="3" fill="#2D7BE5"' + ST + '/><path d="M22 16 Q24 4 32 8 Q40 6 38 16 Z" fill="#FFF6E6"' + ST + '/>'),
    milk: sv('<path d="M16 22 L30 10 L44 22 L44 56 L16 56 Z" fill="#FFFFFF"' + ST + '/><path d="M16 22 L44 22" fill="none"' + ST + '/><rect x="27" y="4" width="8" height="8" rx="2" fill="#2D7BE5"' + ST + '/><rect x="16" y="32" width="28" height="14" fill="#7EC8FF" stroke="none"/><path d="M16 22 L44 22 L44 56 L16 56 Z" fill="none"' + ST + '/><circle cx="30" cy="39" r="4" fill="#FFFFFF"/>'),
    ice: sv('<rect x="6" y="24" width="24" height="24" rx="5" fill="#DDF3FF"' + ST + ' transform="rotate(-10 18 36)"/><rect x="28" y="16" width="24" height="24" rx="5" fill="#C8ECFF"' + ST + ' transform="rotate(12 40 28)"/><path d="M12 30 L18 28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><path d="M34 22 L40 23" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>')
  };
  // The same pictures drawn on the canvas: the ingredients stand on the counter in front of the blender.
  var IMG = {};
  ING_ORDER.forEach(function (id) {
    var im = new Image();
    im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(ICON[id].replace('<svg viewBox="0 0 60 60" aria-hidden="true">', '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="240" height="240">'));
    IMG[id] = im;
  });
  // Step pictures (the chip and the Go of a step share one).
  function pic(inner) { return '<svg viewBox="0 0 40 40">' + inner + "</svg>"; }
  var PS = ' stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"';
  var PIC = {
    fill: pic('<path d="M10 16 L30 16 L27 36 L13 36 Z" fill="#D6EEFF"' + PS + '/><path d="M20 4 Q12 2 13 9 Q14 14 20 14 Q26 14 27 9 Q28 2 20 4 Z" fill="#E8344E"' + PS + '/><path d="M16 4 L20 1 L24 4" fill="none" stroke="#3E9B3A" stroke-width="2.5" stroke-linecap="round"/>'),
    blend: pic('<path d="M10 6 L30 6 L27 24 L13 24 Z" fill="#F07A9A"' + PS + '/><path d="M14 13 Q20 9 26 13 M15 19 Q20 15 25 19" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/><path d="M9 36 L31 36 L29 25 L11 25 Z" fill="#E63946"' + PS + '/><circle cx="20" cy="31" r="2.6" fill="#FFB627" stroke="#1D2340" stroke-width="1.6"/>'),
    pour: pic('<path d="M11 14 L29 14 L26 37 L14 37 Z" fill="#D6EEFF"' + PS + '/><path d="M12 21 L28 21 L26 37 L14 37 Z" fill="#F07A9A"/><path d="M11 14 L29 14 L26 37 L14 37 Z" fill="none"' + PS + '/><path d="M21 33 L27 3" stroke="#1D2340" stroke-width="5.5" stroke-linecap="round"/><path d="M21 33 L27 3" stroke="#FFC93C" stroke-width="2.5" stroke-linecap="round"/>')
  };

  // ---------- Saved state ----------
  // items: what is in the jar, in order: { id, f } where f is how far it has mixed in (liquids: how much
  // has been poured). lid: on the jar? cup: the smoothie poured into the cup. count: smoothies this visit.
  var S = { items: [], lid: false, cup: { fill: 0, c: "", straw: "", done: false }, count: 0 };
  function load() {
    var o = null;
    try { o = JSON.parse(localStorage.getItem(STATEKEY) || "null"); } catch (e) { o = null; }
    if (!o || typeof o !== "object") return;
    if (Array.isArray(o.items)) S.items = o.items.filter(function (it) { return it && ING[it.id]; }).map(function (it) { return { id: it.id, f: clamp(+it.f || 0, 0, 1) }; });
    S.lid = !!o.lid;
    if (o.cup && typeof o.cup === "object") S.cup = { fill: clamp(+o.cup.fill || 0, 0, 1), c: String(o.cup.c || ""), straw: String(o.cup.straw || ""), done: !!o.cup.done };
    S.count = Math.max(0, Math.floor(+o.count || 0));
  }
  var saveT = 0;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      try { localStorage.setItem(STATEKEY, JSON.stringify({ v: 1, items: S.items, lid: S.lid, cup: S.cup, count: S.count })); } catch (e) { /* ignore */ }
    }, 200);
  }
  if (window.Toybox && Toybox.fresh()) { try { localStorage.removeItem(STATEKEY); } catch (e) { /* ignore */ } }
  else load();
  function addToTable(entry) {
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem(TABLEKEY) || "[]"); } catch (e) { arr = []; }
    if (!Array.isArray(arr)) arr = [];
    arr.push(entry);
    while (arr.length > TABLE_MAX) arr.shift();
    try { localStorage.setItem(TABLEKEY, JSON.stringify(arr)); } catch (e) { /* ignore */ }
  }

  // ---------- Canvas and layout ----------
  // The scene is drawn in "blender units": B px each, origin at the middle of the blender's foot on the
  // counter top, y down. The blender is about 1 unit wide and 2 tall; the cup stands at x = 0.95.
  var stage = $("stage"), cv = $("cv"), ctx = cv.getContext("2d");
  var cw = 300, ch = 300, dpr = 1, B = 100, ox = 150, oy = 250, LW = 0.03;
  var X_L = -1.64, X_R = 1.3, H_UP = 2.14, H_DN = 0.62, tall = false, TOPD = 0.5;
  // The ingredients stand on the worktop in front of the blender (operator's view, a little from above):
  // upright stages in two rows (4 + 3), wide stages in one row of 7. ROW[i] = { id, x, y (its foot), s (size) }.
  var ROW = [];
  function layoutRow() {
    ROW = [];
    var W = X_R - X_L;
    if (tall) {
      var sp = W / 4;
      ING_ORDER.forEach(function (id, i) {
        var back = i < 4, k = back ? i : i - 4;
        ROW.push({ id: id, x: X_L + (back ? sp / 2 + k * sp : sp + k * sp), y: back ? 0.42 : 0.86, s: 0.42, hop: -9 });
      });
    } else {
      var sp2 = W / 7;
      ING_ORDER.forEach(function (id, i) { ROW.push({ id: id, x: X_L + sp2 / 2 + i * sp2, y: 0.5, s: Math.min(0.38, sp2 * 0.9), hop: -9 }); });
    }
  }
  function layout() {
    var r = stage.getBoundingClientRect();
    cw = Math.max(50, r.width); ch = Math.max(50, r.height);
    // Upright stages: the lid waits on a little wall shelf above the blender, so the blender can be bigger.
    var wasTall = tall;
    tall = ch > cw * 1.08;
    X_L = tall ? -0.98 : -1.64; H_UP = tall ? 2.5 : 2.26;
    H_DN = tall ? 0.98 : 0.62; TOPD = tall ? 0.9 : 0.56;
    LID_PARK = tall ? { x: -0.45, y: -2.12 } : { x: -1.12, y: -0.07 };
    if (wasTall !== tall && !S.lid && !lid.anim && lid.drag == null) { lid.x = LID_PARK.x; lid.y = LID_PARK.y; }
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    var dn = H_DN;
    // Room under the ingredients for the coach line when it sits at the bottom of the stage (upright phones).
    var ce = $("coach"), ch0 = ce ? ce.offsetHeight : 0, mm = window.matchMedia;
    var bottomCoach = mm && mm("(max-width: 600px)").matches && !mm("(orientation: landscape) and (max-height: 520px)").matches;
    var room = bottomCoach ? Math.max(ch0, 34) + 14 : 0;
    B = Math.min((cw - 12) / (X_R - X_L), (ch - 10 - room) / (H_UP + dn));
    B = Math.max(30, Math.min(B, 340));
    ox = cw / 2 - B * (X_L + X_R) / 2;
    var spare = ch - room - B * (H_UP + dn);
    oy = ch - room - B * dn - Math.max(0, spare) * 0.3;
    LW = 3.4 / B;
    layoutRow();
  }
  function toLocal(px, py) { var r = cv.getBoundingClientRect(); return { x: (px - r.left - ox) / B, y: (py - r.top - oy) / B }; }
  function toPage(x, y) { var r = cv.getBoundingClientRect(); return [r.left + ox + x * B, r.top + oy + y * B]; }

  // ---------- The machine's state ----------
  var JAR_C = -1.13, JAR_H = 0.59; // jar centre y on the base, half height
  var INNER = [[-0.385, -0.56], [0.385, -0.56], [0.255, 0.55], [-0.255, 0.55]]; // jar inside, jar-local, y down
  var CUP_X = 0.98, CUP_H = 0.74;
  var LID_PARK = { x: -1.12, y: -0.07 };
  var lid = { x: LID_PARK.x, y: LID_PARK.y, anim: null, drag: null, flashUntil: 0, tries: 0, wig: 0 };
  var POUR_A = 1.85; // the tilt for pouring (about 106 degrees)
  function pourPose() {
    var c = Math.cos(POUR_A), s = Math.sin(POUR_A), sx = 0.44, sy = -0.6;
    var rx = sx * c - sy * s, ry = sx * s + sy * c;
    return { x: CUP_X + cup.off - 0.07 - rx, y: -CUP_H - 0.3 - ry, a: POUR_A };
  }
  // Motor: mode 0 off, 1 Low, 2 High; Pulse runs while held.
  var M = { mode: 0, pulse: 0, speed: 0, blade: 0, stir: 0, flashBtn: -1, flashUntil: 0, shake: 0 };
  function target() { return M.pulse ? 1 : (M.mode === 1 ? 0.55 : (M.mode === 2 ? 1 : 0)); }
  function running() { return target() > 0; }
  var jar = { x: 0, y: JAR_C, a: 0, state: "base", t0: 0, from: null, to: null, pourK: 0, level0: 0, drag: null, wig: 0 };
  var cup = { off: 0, anim: null, wig: 0, strawK: 1, cream: null };
  var pieces = [];   // chunks in (or falling into) the jar: { k (item index), id, r0, p, fx, x, y, vy, fall, phi, psi, rot, rate }
  var pourers = [];  // milk carton / yogurt cup pouring over the jar: { id, k, t0, dur }
  var dollops = [];  // yogurt blobs falling: { k, x, y, vy, amt }
  var parts = [];    // sparkles and drips (scene coords): { x, y, vx, vy, life, max, col, r, star }

  function makePieces(k, startX, startY) {
    var it = S.items[k], g = ING[it.id];
    if (!g.n) return;
    for (var i = 0; i < g.n; i++) {
      pieces.push({ k: k, id: it.id, r0: g.r * rand(0.88, 1.12), p: it.f, fx: rand(-1, 1), x: startX + rand(-0.12, 0.12), y: startY - i * 0.09 - rand(0, 0.05),
        vy: rand(0, 0.4), fall: true, phi: rand(0, Math.PI * 2), psi: rand(0, Math.PI * 2), rot: rand(-1, 1), spin: rand(-3, 3), rate: rand(0.9, 1.15) });
    }
  }
  // Pieces for the items restored from a save (already sitting in the jar).
  function rebuildPieces() {
    pieces = [];
    S.items.forEach(function (it, k) {
      var g = ING[it.id];
      if (!g.n || it.f >= 1) return;
      makePieces(k, 0, 0);
    });
    pieces.forEach(function (p) { p.fall = false; p.p = S.items[p.k].f; });
    settle(true);
  }
  function pieceR(p) { return p.r0 * Math.pow(Math.max(0, 1 - p.p), 0.6); }
  function hwAt(y) { return 0.255 + 0.13 * clamp((0.55 - y) / 1.11, 0, 1); }
  // Where each chunk rests in the jar when nothing stirs it: stacked from the bottom.
  function settle(snap) {
    var h = 0;
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i], r = pieceR(p);
      var y = Math.max(-0.5, 0.55 - r - h * 0.8);
      p.ry = y;
      p.rx = p.fx * Math.max(0, hwAt(y) - r - 0.02);
      h += Math.PI * r * r / 0.5 * 1.15;
      if (snap && !p.fall) { p.x = p.rx; p.y = p.ry; }
    }
  }

      drawPiece(p.id, jar.x + p.x, jar.y + p.y, pieceR(p), p.rot, 1);
    });
  }
  function drawParts() {
    parts.forEach(function (q) {
      var a = 1 - q.life / q.max;
      ctx.globalAlpha = Math.max(0, a);
      if (q.star) {
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.life * 3);
        ctx.beginPath();
        for (var i = 0; i < 8; i++) { var r = i % 2 ? q.r * 0.45 : q.r * 1.4, an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); }
        ctx.closePath(); fs(q.col, 0.6); ctx.restore();
      } else { circ(q.x, q.y, q.r); ctx.fillStyle = q.col; ctx.fill(); }
    });
    ctx.globalAlpha = 1;
  }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.setTransform(dpr * B, 0, 0, dpr * B, dpr * ox, dpr * oy);
    ctx.lineJoin = "round";
    drawRoom();
    drawCup();
    var dn = danceNow();
    if (dn) { ctx.save(); ctx.translate(dn.x, dn.y); ctx.rotate(dn.a); }
    drawBase();
    if (jar.state !== "base") drawStream();
    drawJar(dn);
    if (dn) ctx.restore();
    drawLidLoose();
    drawRow();
    drawPourers();
    drawFalling();
    drawParts();
  }
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Timer ----------
  function locked() { return Toybox.timer.locked(); }
  function onEnding(done) {
    // The blender switches off and spins down; the contents settle.
    stopMotor();
    FUN.cur = {};
    lid.drag = null;
    if (jar.state === "drag") { jar.state = "back"; jar.t0 = now(); jar.from = { x: jar.x, y: jar.y, a: jar.a }; jar.dur = 0.6; }
    Object.keys(ingDrags).forEach(function (k) { var d = ingDrags[k]; if (d.f && d.f.parentNode) d.f.parentNode.removeChild(d.f); });
    ingDrags = {}; stageDrags = {}; fillQ = [];
    setTimeout(done, reduce ? 300 : 3200);
  }
  function restArt() {
    var o = '<rect width="400" height="300" fill="#2B3A67"/>';
    o += '<rect x="40" y="30" width="120" height="100" rx="8" fill="#1B2550" stroke="#1D2340" stroke-width="4"/><circle cx="120" cy="66" r="18" fill="#FFF4CC"/><circle cx="130" cy="60" r="16" fill="#1B2550"/>';
    o += '<circle cx="60" cy="50" r="2.5" fill="#FFF4CC"/><circle cx="80" cy="100" r="2.5" fill="#FFF4CC"/><circle cx="145" cy="110" r="2" fill="#FFF4CC"/>';
    o += '<rect y="214" width="400" height="86" fill="#4C77A6"/><rect y="204" width="400" height="14" fill="#C9A06A" stroke="#1D2340" stroke-width="4"/>';
    o += '<g transform="translate(205 204)"><path d="M-46 0 L46 0 L40 -44 L-40 -44 Z" fill="#B8323E" stroke="#1D2340" stroke-width="4"/><rect x="-30" y="-52" width="60" height="9" rx="3" fill="#3B4256" stroke="#1D2340" stroke-width="3"/>' +
      '<path d="M-38 -150 L38 -150 L28 -52 L-28 -52 Z" fill="rgba(214,238,255,0.5)" stroke="#1D2340" stroke-width="4"/><rect x="-42" y="-160" width="84" height="12" rx="5" fill="#3B4256" stroke="#1D2340" stroke-width="4"/></g>';
    o += '<g transform="translate(300 204)"><path d="M-22 -64 L22 -64 L17 0 L-17 0 Z" fill="#E56B8A" stroke="#1D2340" stroke-width="4"/><path d="M4 -4 L22 -94" stroke="#1D2340" stroke-width="9" stroke-linecap="round"/><path d="M4 -4 L22 -94" stroke="#FFC93C" stroke-width="4" stroke-linecap="round"/></g>';
    o += '<text x="250" y="110" font-family="Baloo 2, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">z</text><text x="274" y="86" font-family="Baloo 2, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">z</text><text x="294" y="66" font-family="Baloo 2, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">z</text>';
    return '<svg class="rest-art" viewBox="0 0 400 300" aria-hidden="true">' + o + "</svg>";
  }

  // ---------- Ghost hand, step row, bottom bar ----------
  // The ghost taps the part that does the current step (the one-press way); the drag only once he has used the tap.
  function learned(m) {
    if (m === "add") ghost.learned("fill");
    else if (m === "run") ghost.learned("blend");
    else if (m === "pour") ghost.learned("pour");
  }
  var steps = null;
  var ghost = Toybox.ghost({
    max: 3,
    onShow: function (p, on) { if (steps) steps.pulse(on); },
    plan: function () {
      if (Object.keys(ingDrags).length || Object.keys(stageDrags).length || document.body.classList.contains("big")) return null;
      var k = stepNow(), top = toPage(jar.x, jar.y - JAR_H - 0.2);
      if (k === "fill" && !fillQ.length && !inFlight) {
        var r = rowOf("banana"); if (!r) return null;
        var at = rowPage(r);
        return usedTap && !usedDrag ? { pts: [at, top], carry: { html: ICON.banana, size: 64 }, key: "fill" } : { pts: [at], tap: true, key: "fill" };
      }
      if (k === "blend" && !running()) return { pts: [toPage(0, -0.3)], tap: true, key: "blend" };
      if (k === "pour" && canPour()) return { pts: [toPage(jar.x, jar.y)], tap: true, key: "pour" };
      return null;
    }
  });
  steps = Toybox.steps($("steps"), {
    steps: STEPS,
    coach: coach,
    ghost: ghost,
    onGo: function (id) {
      if (id === "fill") { if (!startFill()) return false; learned("add"); return true; }
      if (id === "blend") {
        if (!S.items.length) return false;
        needLid(function () { M.mode = 2; M.flashBtn = 1; M.flashUntil = now() + 0.6; click(); learned("run"); });
        return true;
      }
      if (id === "pour") { if (!canPour()) return false; startPour(false); return true; }
      return false;
    },
    onAgain: function () { if (startFill()) learned("add"); else steps.go.wiggle(); },
    onBusy: function (id) {
      if (id === "blend" && M.mode === 1) { M.mode = 2; click(); say("Faster!"); }
      else if (id === "blend") say("It's blending!");
      else if (id === "fill") say("In it goes!");
    }
  });
  Toybox.bar($("bottom"), { onNew: newSmoothie, onSurprise: surprise });

  // ---------- Start ----------
  rebuildPieces();
  updateCounter();
  layout();
  syncSteps();
  var resizeT = 0;
  function onResize() { clearTimeout(resizeT); resizeT = setTimeout(layout, 60); layout(); }
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", function () { setTimeout(layout, 250); });
  // The step row can change the stage's height: keep the canvas sharp.
  if (window.ResizeObserver) new ResizeObserver(function () { layout(); }).observe(stage);
  Toybox.init({
    app: "kitchen",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the blender switches off and spins down, and the controls lock. The timer carries on across the kitchen pages.",
    goodbyeOption: "End with a “Clean up” button to press",
    farewellText: "Time to finish cooking",
    goodbyeLabel: "Clean up",
    farewellDone: "Bye bye, kitchen!",
    restLine: "The kitchen is resting.",
    restLine2: "Your food will be on the table next time.",
    restArt: restArt,
    soundNote: "Soft whirs, plops and clinks. Hold for 2 seconds.",
    onEnding: onEnding,
    onRest: function () { stopMotor(); },
    onWake: function () { lastT = now(); },
    onBig: function () { setTimeout(layout, 30); },
    onSound: function (on) { if (on) chime(); }
  });
  Toybox.offFirst({
    running: function () { return running() || M.speed > 0.05; },
    name: "blender",
    off: function (done) {
      stopMotor(); click();
      var t0 = performance.now();
      var iv = setInterval(function () {
        if (M.speed <= 0.05 || performance.now() - t0 > 1500) { clearInterval(iv); done(); }
      }, 40);
    },
    flash: function () { M.flashBtn = M.mode === 2 ? 1 : (M.mode === 1 ? 0 : 2); M.flashUntil = now() + 3; }
  });
  requestAnimationFrame(loop);

  // Test hooks, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) {
    window.__blender = {
      state: function () {
        return { phase: stepNow(), items: S.items.map(function (it) { return it.id + ":" + it.f.toFixed(2); }), lid: S.lid, mode: M.mode, speed: +M.speed.toFixed(2),
          jar: jar.state, cup: S.cup, count: S.count, pieces: pieces.length, coach: coach.text(), level: +level().toFixed(3), color: mixColor(false),
          step: steps.current(), finished: steps.finished(), go: steps.go.label(), busy: steps.go.isBusy() };
      },
      pt: function (name) {
        if (name === "jar") return toPage(jar.x, jar.y);
        if (name === "jarTop") return toPage(jar.x, jar.y - JAR_H - 0.2);
        if (name === "lid") return S.lid ? toPage(lidSpot().x, lidSpot().y) : toPage(lid.x, lid.y);
        if (name === "cup") return toPage(CUP_X + cup.off, -CUP_H / 2);
        if (name === "low") return toPage(-0.27, -0.3);
        if (name === "high") return toPage(0, -0.3);
        if (name === "pulse") return toPage(0.27, -0.3);
        if (name.indexOf("ing:") === 0) { var r = rowOf(name.slice(4)); return r ? rowPage(r) : null; }
        return null;
      },
      ghost: function () { return ghost.show(); },
      fun: function () { return { cur: Object.keys(FUN.cur), last: FUN.last, cream: !!cup.cream }; },
      table: function () { try { return JSON.parse(localStorage.getItem(TABLEKEY) || "[]"); } catch (e) { return []; } }
    };
  }
})();
</script>
