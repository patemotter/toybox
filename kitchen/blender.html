<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blender</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }
.stage { background: #FFF3DC; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; }
/* Choices: the ingredients (or the straws), dragged into the jar or tapped. */
.tb-choices { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
.tb-tile { touch-action: none; cursor: grab; position: relative; }
.tb-tile svg { pointer-events: none; overflow: visible; }
.tb-tile span { pointer-events: none; white-space: nowrap; }
.tb-tile.picked { opacity: 0.45; }
@media (max-width: 600px) { .tb-tile { font-size: 0.84rem; min-height: 66px; } }
@media (min-width: 700px) and (min-height: 700px) {
  .tb-choices { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  .tb-tile { font-size: 0.98rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-choices { gap: 6px; }
  .tb-tile { min-height: 60px; font-size: 0.8rem; }
  .tb-tile svg { width: 34px; height: 34px; }
}
/* The thing under his finger while he drags it from the panel. */
.float { position: fixed; left: 0; top: 0; z-index: 30; width: 84px; height: 84px; pointer-events: none;
  filter: drop-shadow(3px 4px 0 rgba(29, 35, 64, 0.25)); will-change: transform; }
.float svg { width: 100%; height: 100%; display: block; overflow: visible; }
body.big .tb-head > :not(.bigtoggle) { display: none; }
body.big .tb-panel { display: none; }
body.ending .tb-panel, body.resting .tb-panel { pointer-events: none; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
/* Ghost hand (tools/snippets/ghost-hand.css) */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back" id="backbtn" href="./" aria-label="Back to the kitchen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Kitchen</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Blender</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls">Big</button>
  </header>
  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A blender on the kitchen counter with a cup next to it"></canvas>
      <div class="tb-counter" id="counter">Smoothies: 0</div>
      <div class="tb-coach" id="coach">Drag fruit into the jar!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
    <section class="tb-panel" id="panel">
      <div class="tb-choices" id="choices"></div>
      <nav class="tb-tabs">
        <button class="btn tb-new" id="newBtn">New</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Getting ready (once per visit, on the kitchen page) ----------
  var readyOn = true;
  try { readyOn = sessionStorage.getItem("kitchen-ready") === "on"; } catch (e) { readyOn = true; }
  if (!readyOn) { location.replace("./?next=blender"); return; }

  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ease(t) { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function now() { return performance.now() / 1000; }
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var INK = "#1D2340";

  var STATEKEY = "kitchen-blender-v1";
  // The kitchen table (his collection, kept across visits). Each entry: { k: "smoothie", c: "#rrggbb"
  // (the food's color), s: "#rrggbb" (straw color), t: ms timestamp }. Other stations add their own k.
  var TABLEKEY = "kitchen-table-v1", TABLE_MAX = 12;

  // ---------- Ingredients ----------
  // vol: share of the jar it fills; w: how strongly its color shows in the mix; n: pieces (solids).
  var ING = {
    banana:     { name: "Banana",     col: "#F6E3A0", w: 0.8,  vol: 0.18, n: 5, r: 0.085 },
    strawberry: { name: "Strawberry", col: "#EC2F55", w: 1.6,  vol: 0.18, n: 5, r: 0.08 },
    blueberry:  { name: "Blueberry",  col: "#5236A8", w: 1.4,  vol: 0.14, n: 9, r: 0.048 },
    spinach:    { name: "Spinach",    col: "#3FA83A", w: 1.1,  vol: 0.14, n: 5, r: 0.085 },
    yogurt:     { name: "Yogurt",     col: "#FFF6E6", w: 0.4,  vol: 0.20, liquid: true },
    milk:       { name: "Milk",       col: "#FFFFFF", w: 0.4,  vol: 0.26, liquid: true },
    ice:        { name: "Ice",        col: "#E6F6FF", w: 0.2,  vol: 0.14, n: 4, r: 0.07 }
  };
  var ING_ORDER = ["banana", "strawberry", "blueberry", "spinach", "yogurt", "milk", "ice"];
  var STRAWS = [
    { id: "red", name: "Red", col: "#E63946" }, { id: "orange", name: "Orange", col: "#FF8A1F" },
    { id: "yellow", name: "Yellow", col: "#FFC93C" }, { id: "green", name: "Green", col: "#2EA05A" },
    { id: "blue", name: "Blue", col: "#2D7BE5" }, { id: "purple", name: "Purple", col: "#8E5CE0" },
    { id: "pink", name: "Pink", col: "#FF6FB5" }
  ];
  var RECIPES = [
    ["strawberry", "banana", "milk"], ["blueberry", "banana", "yogurt"], ["spinach", "banana", "milk"],
    ["strawberry", "blueberry", "yogurt"], ["banana", "ice", "milk"], ["strawberry", "ice", "yogurt"],
    ["blueberry", "spinach", "milk"]
  ];
  var CAP = 0.86; // the jar is full at this share

  // ---------- Small SVG pictures (panel tiles, the dragged thing, the ghost hand) ----------
  function sv(inner) { return '<svg viewBox="0 0 60 60" aria-hidden="true">' + inner + "</svg>"; }
  var ST = ' stroke="#1D2340" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
  var ICON = {
    banana: sv('<path d="M10 20 Q14 46 38 50 Q52 52 54 44 Q40 44 30 36 Q20 28 18 16 Z" fill="#FFD84D"' + ST + '/><path d="M18 16 L14 9 L10 12 L10 20" fill="#8A5A2B"' + ST + '/><path d="M20 26 Q26 40 40 45" fill="none" stroke="#E8B820" stroke-width="2.5" stroke-linecap="round"/>'),
    strawberry: sv('<path d="M30 54 Q10 40 12 24 Q14 14 30 16 Q46 14 48 24 Q50 40 30 54 Z" fill="#E8344E"' + ST + '/><path d="M18 16 L24 10 L30 15 L36 10 L42 16 L30 20 Z" fill="#3E9B3A"' + ST + '/><g fill="#FFE68A"><circle cx="22" cy="28" r="1.8"/><circle cx="32" cy="26" r="1.8"/><circle cx="40" cy="30" r="1.8"/><circle cx="26" cy="38" r="1.8"/><circle cx="36" cy="40" r="1.8"/><circle cx="30" cy="47" r="1.6"/></g>'),
    blueberry: sv('<circle cx="20" cy="36" r="12" fill="#4B4FA8"' + ST + '/><circle cx="40" cy="38" r="12" fill="#3F3F96"' + ST + '/><circle cx="30" cy="20" r="12" fill="#5458B8"' + ST + '/><path d="M26 17 L30 21 L34 17" fill="none" stroke="#1D2340" stroke-width="2.5" stroke-linecap="round"/><circle cx="25" cy="15" r="3" fill="rgba(255,255,255,0.45)"/>'),
    spinach: sv('<path d="M8 50 Q6 22 30 10 Q34 34 8 50 Z" fill="#3E9B3A"' + ST + '/><path d="M8 50 Q20 30 28 14" fill="none" stroke="#9BE08C" stroke-width="2.5" stroke-linecap="round"/><path d="M22 54 Q30 26 54 22 Q50 46 22 54 Z" fill="#2F8A34"' + ST + '/><path d="M22 54 Q36 38 50 25" fill="none" stroke="#9BE08C" stroke-width="2.5" stroke-linecap="round"/>'),
    yogurt: sv('<path d="M14 22 L46 22 L42 54 L18 54 Z" fill="#FFFFFF"' + ST + '/><rect x="16" y="32" width="28" height="12" fill="#7EC8FF" stroke="none"/><path d="M14 22 L46 22 L42 54 L18 54 Z" fill="none"' + ST + '/><rect x="10" y="16" width="40" height="8" rx="3" fill="#2D7BE5"' + ST + '/><path d="M22 16 Q24 4 32 8 Q40 6 38 16 Z" fill="#FFF6E6"' + ST + '/>'),
    milk: sv('<path d="M16 22 L30 10 L44 22 L44 56 L16 56 Z" fill="#FFFFFF"' + ST + '/><path d="M16 22 L44 22" fill="none"' + ST + '/><rect x="27" y="4" width="8" height="8" rx="2" fill="#2D7BE5"' + ST + '/><rect x="16" y="32" width="28" height="14" fill="#7EC8FF" stroke="none"/><path d="M16 22 L44 22 L44 56 L16 56 Z" fill="none"' + ST + '/><circle cx="30" cy="39" r="4" fill="#FFFFFF"/>'),
    ice: sv('<rect x="6" y="24" width="24" height="24" rx="5" fill="#DDF3FF"' + ST + ' transform="rotate(-10 18 36)"/><rect x="28" y="16" width="24" height="24" rx="5" fill="#C8ECFF"' + ST + ' transform="rotate(12 40 28)"/><path d="M12 30 L18 28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><path d="M34 22 L40 23" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>')
  };
  function strawIcon(col) {
    return sv('<g transform="rotate(30 30 30)"><rect x="25" y="2" width="10" height="56" rx="4" fill="#FFFFFF"' + ST + '/>' +
      '<g fill="' + col + '"><rect x="26.5" y="8" width="7" height="6"/><rect x="26.5" y="20" width="7" height="6"/><rect x="26.5" y="32" width="7" height="6"/><rect x="26.5" y="44" width="7" height="6"/></g>' +
      '<rect x="25" y="2" width="10" height="56" rx="4" fill="none"' + ST + '/></g>');
  }

  // ---------- Saved state ----------
  // items: what is in the jar, in order: { id, f } where f is how far it has mixed in (liquids: how much
  // has been poured). lid: on the jar? cup: the smoothie poured into the cup. count: smoothies this visit.
  var S = { items: [], lid: false, cup: { fill: 0, c: "", straw: "", done: false }, count: 0 };
  function load() {
    var o = null;
    try { o = JSON.parse(localStorage.getItem(STATEKEY) || "null"); } catch (e) { o = null; }
    if (!o || typeof o !== "object") return;
    if (Array.isArray(o.items)) S.items = o.items.filter(function (it) { return it && ING[it.id]; }).map(function (it) { return { id: it.id, f: clamp(+it.f || 0, 0, 1) }; });
    S.lid = !!o.lid;
    if (o.cup && typeof o.cup === "object") S.cup = { fill: clamp(+o.cup.fill || 0, 0, 1), c: String(o.cup.c || ""), straw: String(o.cup.straw || ""), done: !!o.cup.done };
    S.count = Math.max(0, Math.floor(+o.count || 0));
  }
  var saveT = 0;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      try { localStorage.setItem(STATEKEY, JSON.stringify({ v: 1, items: S.items, lid: S.lid, cup: S.cup, count: S.count })); } catch (e) { /* ignore */ }
    }, 200);
  }
  if (window.Toybox && Toybox.fresh()) { try { localStorage.removeItem(STATEKEY); } catch (e) { /* ignore */ } }
  else load();
  function addToTable(entry) {
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem(TABLEKEY) || "[]"); } catch (e) { arr = []; }
    if (!Array.isArray(arr)) arr = [];
    arr.push(entry);
    while (arr.length > TABLE_MAX) arr.shift();
    try { localStorage.setItem(TABLEKEY, JSON.stringify(arr)); } catch (e) { /* ignore */ }
  }

  // ---------- Canvas and layout ----------
  // The scene is drawn in "blender units": B px each, origin at the middle of the blender's foot on the
  // counter top, y down. The blender is about 1 unit wide and 2 tall; the cup stands at x = 0.95.
  var stage = $("stage"), cv = $("cv"), ctx = cv.getContext("2d");
  var cw = 300, ch = 300, dpr = 1, B = 100, ox = 150, oy = 250, LW = 0.03;
  var X_L = -1.64, X_R = 1.3, H_UP = 2.14, H_DN = 0.3, tall = false;
  function layout() {
    var r = stage.getBoundingClientRect();
    cw = Math.max(50, r.width); ch = Math.max(50, r.height);
    // Upright stages: the lid waits on a little wall shelf above the blender, so the blender can be bigger.
    var wasTall = tall;
    tall = ch > cw * 1.08;
    X_L = tall ? -0.98 : -1.64; H_UP = tall ? 2.5 : 2.26;
    LID_PARK = tall ? { x: -0.45, y: -2.36 } : { x: -1.12, y: -0.07 };
    if (wasTall !== tall && !S.lid && !lid.anim && lid.drag == null) { lid.x = LID_PARK.x; lid.y = LID_PARK.y; }
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    var phone = Math.min(innerWidth, innerHeight) < 560;
    var dn = H_DN + (phone ? 0.1 : 0);
    B = Math.min((cw - 12) / (X_R - X_L), (ch - 10) / (H_UP + dn));
    B = Math.max(30, Math.min(B, 340));
    ox = cw / 2 - B * (X_L + X_R) / 2;
    var spare = ch - B * (H_UP + dn);
    oy = ch - B * dn - Math.max(0, spare) * 0.3;
    LW = 3.4 / B;
  }
  function toLocal(px, py) { var r = cv.getBoundingClientRect(); return { x: (px - r.left - ox) / B, y: (py - r.top - oy) / B }; }
  function toPage(x, y) { var r = cv.getBoundingClientRect(); return [r.left + ox + x * B, r.top + oy + y * B]; }

  // ---------- The machine's state ----------
  var JAR_C = -1.13, JAR_H = 0.59; // jar centre y on the base, half height
  var INNER = [[-0.385, -0.56], [0.385, -0.56], [0.255, 0.55], [-0.255, 0.55]]; // jar inside, jar-local, y down
  var CUP_X = 0.98, CUP_H = 0.74;
  var LID_PARK = { x: -1.12, y: -0.07 };
  var lid = { x: LID_PARK.x, y: LID_PARK.y, anim: null, drag: null, flashUntil: 0, tries: 0, wig: 0 };
  var POUR_A = 1.85; // the tilt for pouring (about 106 degrees)
  function pourPose() {
    var c = Math.cos(POUR_A), s = Math.sin(POUR_A), sx = 0.44, sy = -0.6;
    var rx = sx * c - sy * s, ry = sx * s + sy * c;
    return { x: CUP_X + cup.off - 0.07 - rx, y: -CUP_H - 0.3 - ry, a: POUR_A };
  }
  // Motor: mode 0 off, 1 Low, 2 High; Pulse runs while held.
  var M = { mode: 0, pulse: 0, speed: 0, blade: 0, stir: 0, flashBtn: -1, flashUntil: 0, shake: 0 };
  function target() { return M.pulse ? 1 : (M.mode === 1 ? 0.55 : (M.mode === 2 ? 1 : 0)); }
  function running() { return target() > 0; }
  var jar = { x: 0, y: JAR_C, a: 0, state: "base", t0: 0, from: null, to: null, pourK: 0, level0: 0, drag: null, wig: 0 };
  var cup = { off: 0, anim: null, wig: 0, strawK: 1 };
  var pieces = [];   // chunks in (or falling into) the jar: { k (item index), id, r0, p, fx, x, y, vy, fall, phi, psi, rot, rate }
  var pourers = [];  // milk carton / yogurt cup pouring over the jar: { id, k, t0, dur }
  var dollops = [];  // yogurt blobs falling: { k, x, y, vy, amt }
  var parts = [];    // sparkles and drips (scene coords): { x, y, vx, vy, life, max, col, r, star }
  var sayMsg = "", sayUntil = 0;

  function makePieces(k, startX, startY) {
    var it = S.items[k], g = ING[it.id];
    if (!g.n) return;
    for (var i = 0; i < g.n; i++) {
      pieces.push({ k: k, id: it.id, r0: g.r * rand(0.88, 1.12), p: it.f, fx: rand(-1, 1), x: startX + rand(-0.12, 0.12), y: startY - i * 0.09 - rand(0, 0.05),
        vy: rand(0, 0.4), fall: true, phi: rand(0, Math.PI * 2), psi: rand(0, Math.PI * 2), rot: rand(-1, 1), spin: rand(-3, 3), rate: rand(0.9, 1.15) });
    }
  }
  // Pieces for the items restored from a save (already sitting in the jar).
  function rebuildPieces() {
    pieces = [];
    S.items.forEach(function (it, k) {
      var g = ING[it.id];
      if (!g.n || it.f >= 1) return;
      makePieces(k, 0, 0);
    });
    pieces.forEach(function (p) { p.fall = false; p.p = S.items[p.k].f; });
    settle(true);
  }
  function pieceR(p) { return p.r0 * Math.pow(Math.max(0, 1 - p.p), 0.6); }
  function hwAt(y) { return 0.255 + 0.13 * clamp((0.55 - y) / 1.11, 0, 1); }
  // Where each chunk rests in the jar when nothing stirs it: stacked from the bottom.
  function settle(snap) {
    var h = 0;
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i], r = pieceR(p);
      var y = Math.max(-0.5, 0.55 - r - h * 0.8);
      p.ry = y;
      p.rx = p.fx * Math.max(0, hwAt(y) - r - 0.02);
      h += Math.PI * r * r / 0.5 * 1.15;
      if (snap && !p.fall) { p.x = p.rx; p.y = p.ry; }
    }
  }
  function itemShare(it) { var g = ING[it.id]; return g.vol * it.f * (g.liquid ? 1 : 0.92); }
  function level() { var s = 0; S.items.forEach(function (it) { s += itemShare(it); }); return Math.min(CAP + 0.04, s); }
  function totalVol() { var s = 0; S.items.forEach(function (it) { s += ING[it.id].vol; }); return s; }
  function hex(h) { h = h.replace("#", ""); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
  function toHex(c) { return "#" + c.map(function (v) { var s = Math.round(clamp(v, 0, 255)).toString(16); return s.length < 2 ? "0" + s : s; }).join(""); }
  // The smoothie's color: a weighted mix (in linear light) of everything that has mixed in so far.
  function mixColor(all) {
    var acc = [0, 0, 0], wsum = 0;
    S.items.forEach(function (it) {
      var g = ING[it.id], f = all ? 1 : it.f;
      if (f <= 0) return;
      var c = hex(g.col), w = g.w * f;
      for (var i = 0; i < 3; i++) acc[i] += c[i] * w;
      wsum += w;
    });
    if (wsum <= 0) return null;
    var out = acc.map(function (v) { return v / wsum; });
    // Richer than a plain average, like real fruit.
    var m = (out[0] + out[1] + out[2]) / 3;
    out = out.map(function (v) { return m + (v - m) * 1.35; });
    return toHex(out);
  }
  function busyAdding() { return pourers.length > 0 || dollops.length > 0 || pieces.some(function (p) { return p.fall; }); }
  function blended() {
    if (!S.items.length || busyAdding()) return false;
    for (var i = 0; i < S.items.length; i++) if (S.items[i].f < 0.999) return false;
    return true;
  }
  function phase() {
    if (jar.state !== "base") return "pour";

    if (!S.items.length) return S.cup.done ? "done" : "add";

  var COACH = {
    add: "Drag fruit into the jar!", done: "Yum! Make another one!", lid: "Put the lid on!", run: "Press Low or High!",
    blend: "Watch it blend!", pour: "Pour it in the cup!", straw: "Add a straw!"

  // ---------- Sound (off by default; soft and synthesized) ----------
  var master = null, masterCtx = null, hum = null;

  function clink() { tone(rand(1500, 1900), 0.18, 0.025, "triangle"); }
  function click() { tone(900, 0.06, 0.04, "square", 600); }
  function glug(d) { tone(rand(180, 240), 0.12, 0.04, "sine", 320, d || 0); }

  // The motor: a soft filtered buzz that rises with the speed.
  function updateHum() {
    var ac = Toybox.sound.ready();
    if (!ac) { if (hum) { try { hum.g.gain.value = 0; } catch (e) { /* ignore */ } } return; }
    if (!hum || masterCtx !== ac) {
      out(ac);
      var o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = "sawtooth"; f.type = "lowpass"; f.Q.value = 2; g.gain.value = 0;

    hum.o.frequency.setTargetAtTime(60 + 110 * s, t, 0.05);
    hum.f.frequency.setTargetAtTime(300 + 1100 * s, t, 0.05);

  }

  // ---------- Panel: ingredients or straws ----------
  var choicesEl = $("choices"), choiceMode = "";
  function renderChoices() {

    if (mode === choiceMode) return;
    choiceMode = mode;
    var h = "";
    if (mode === "ing") ING_ORDER.forEach(function (id) { h += '<button class="btn tb-tile" data-ing="' + id + '" aria-label="' + ING[id].name + '">' + ICON[id] + "<span>" + ING[id].name + "</span></button>"; });
    else STRAWS.forEach(function (s) { h += '<button class="btn tb-tile" data-straw="' + s.id + '" aria-label="' + s.name + ' straw">' + strawIcon(s.col) + "<span>" + s.name + "</span></button>"; });

  // Dragging a tile out of the panel: a floating copy follows the finger; let go anywhere on the

  // ---------- Adding ingredients ----------

  // ---------- The lid ----------
  function lidSpot() {
    // Lid centre when it is on the jar (scene coords), following the jar.
    var c = Math.cos(jar.a), s = Math.sin(jar.a), ly = -JAR_H - 0.075;

  // ---------- Buttons on the blender ----------
  function needLid(go) {

    if (lid.anim) return;

  }
  function pressButton(which, pid) {
    if (jar.state !== "base") return;

      });
      return;
    }

  }

  }

  // ---------- New and Surprise ----------

  // ---------- Touch on the stage ----------

  }
  function onLidParked(p) { return !S.lid && !lid.anim && Math.abs(p.x - lid.x) < 0.56 && Math.abs(p.y - lid.y) < 0.3; }

  // ---------- Particles ----------
  function burst(x, y, n, col, star) {
    if (reduce) n = Math.min(n, 4);
    var cols = ["#FFC93C", "#FF6FB5", "#3DB4FF", "#4CD964", "#FFFFFF"];
    for (var i = 0; i < n; i++) {
      var a = rand(0, Math.PI * 2), sp = rand(0.4, 1.3);
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6, life: 0, max: rand(0.9, 1.5), col: col || cols[i % cols.length], r: rand(0.025, 0.05), star: !!star });
    }
  }
  function drip(x, y, col) { parts.push({ x: x, y: y, vx: rand(-0.4, 0.4), vy: rand(-0.9, -0.3), life: 0, max: 0.6, col: col, r: rand(0.015, 0.03), star: false }); }

  // ---------- Update ----------
  var lastT = now();
  function update() {
    var t = now(), dt = Math.min(0.05, t - lastT);
    lastT = t;
    // Motor: spins up quickly, winds down calmly.
    var tg = target();
    M.speed += (tg - M.speed) * Math.min(1, dt * (tg > M.speed ? 5 : 2.2));
    if (M.speed < 0.003) M.speed = 0;
    M.blade += M.speed * dt * 40;
    M.stir += ((M.speed > 0.08 ? 1 : 0) - M.stir) * Math.min(1, dt * (M.speed > 0.08 ? 3 : 1.6));
    updateHum();

    // Pouring from the milk carton / yogurt cup.
    for (var i = pourers.length - 1; i >= 0; i--) {
      var pr = pourers[i], k = (t - pr.t0) / pr.dur, it = S.items[pr.k];
      if (!it) { pourers.splice(i, 1); continue; }
      if (pr.id === "milk") {
        it.f = clamp((k - 0.2) / 0.65, 0, 1);
        if (k > 0.2 && k < 0.85 && Math.random() < 0.4) glug();
      } else if (pr.id === "yogurt") {
        if (k > 0.3 && !pr.d1) { pr.d1 = true; dollops.push({ k: pr.k, x: jar.x + 0.03, y: jar.y - JAR_H - 0.25, vy: 0, amt: 0.5 }); plop(); }

        if (name === "cup") return toPage(CUP_X + cup.off, -CUP_H / 2);
        if (name === "low") return toPage(-0.27, -0.3);
        if (name === "high") return toPage(0, -0.3);
        if (name === "pulse") return toPage(0.27, -0.3);
        return null;
      },
      ghost: function () { return ghost.show(); },
      table: function () { try { return JSON.parse(localStorage.getItem(TABLEKEY) || "[]"); } catch (e) { return []; } }
    };
  }
})();
</script>
