<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stove</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.tb-head a { text-decoration: none; }
.stage { background: #FFF3DC; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; }
/* Choices: what to cook (Pancakes, Soup, Pasta), then the food or toppings, dragged in or tapped. */
.tb-choices { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
.tb-tile { touch-action: none; cursor: grab; position: relative; }
.tb-tile.recipe { cursor: pointer; color: #1D2340; }
.tb-tile.recipe[aria-pressed="true"] { background: var(--accent); }
.tb-tile svg { pointer-events: none; overflow: visible; }
.tb-tile span { pointer-events: none; white-space: nowrap; }
.tb-tile.picked { opacity: 0.45; }
@media (max-width: 600px) { .tb-tile { font-size: 0.84rem; min-height: 66px; } }
@media (min-width: 700px) and (min-height: 700px) {
  .tb-choices { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  .tb-tile { font-size: 0.98rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-choices { gap: 6px; }
  .tb-tile { min-height: 60px; font-size: 0.8rem; }
  .tb-tile svg { width: 34px; height: 34px; }
}
/* The thing under his finger while he drags it from the panel. */
.float { position: fixed; left: 0; top: 0; z-index: 30; width: 84px; height: 84px; pointer-events: none;
  filter: drop-shadow(3px 4px 0 rgba(29, 35, 64, 0.25)); will-change: transform; }
.float svg { width: 100%; height: 100%; display: block; overflow: visible; }
body.ending .tb-panel, body.resting .tb-panel { pointer-events: none; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back" id="backbtn" href="./" aria-label="Back to the kitchen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Kitchen</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title"><span class="tb-app">Kitchen · </span><span class="tb-station">Stove</span></h1>
  </header>
  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A stove with a frying pan or a pot on the burner, a batter jug, a plate and a bowl"></canvas>
      <div class="tb-coach" id="coach">Turn the knob!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
    <section class="tb-panel" id="panel">
      <div class="tb-choices" id="choices"></div>
      <nav class="tb-tabs">
        <button class="btn tb-new" id="newBtn">New</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script src="stove.js"></script>
</body>
</html>
