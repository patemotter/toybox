<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cutting board</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }
.stage { background: #DCE7F1; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; }
/* Choices: the foods for the board (a tap puts one on). */
.tb-choices { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
.tb-tile { touch-action: manipulation; position: relative; }
.tb-tile svg { pointer-events: none; overflow: visible; }
.tb-tile span { pointer-events: none; white-space: nowrap; }
@media (max-width: 600px) { .tb-tile { font-size: 0.84rem; min-height: 66px; } }
@media (min-width: 700px) and (min-height: 700px) {
  .tb-choices { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  .tb-tile { font-size: 0.98rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-choices { gap: 6px; }
  .tb-tile { min-height: 60px; font-size: 0.8rem; }
  .tb-tile svg { width: 34px; height: 34px; }
}
body.big .tb-head > :not(.bigtoggle) { display: none; }
body.big .tb-panel { display: none; }
body.ending .tb-panel, body.resting .tb-panel { pointer-events: none; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
/* Ghost hand (tools/snippets/ghost-hand.css) */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back" id="backbtn" href="./" aria-label="Back to the kitchen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Kitchen</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Cutting board</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls">Big</button>
  </header>
  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A wooden cutting board with food to slice, a kid's nylon knife and a bowl"></canvas>
      <div class="tb-counter" id="counter">Snacks: 0</div>
      <div class="tb-coach" id="coach">Cut it in half!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
    <section class="tb-panel" id="panel">
      <div class="tb-choices" id="choices"></div>
      <nav class="tb-tabs">
        <button class="btn tb-new" id="newBtn">New</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Getting ready (once per visit, on the kitchen page) ----------
  var readyOn = true;
  try { readyOn = sessionStorage.getItem("kitchen-ready") === "on"; } catch (e) { readyOn = true; }
  if (!readyOn) { location.replace("./?next=cutting-board"); return; }

  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ease(t) { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function backOut(t) { t = clamp(t, 0, 1) - 1; return 1 + 2.2 * t * t * t + 1.2 * t * t; }
  function now() { return performance.now() / 1000; }
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var INK = "#1D2340";

  var STATEKEY = "kitchen-cut-v1";
  // The kitchen table (his collection, kept across visits). This station adds { k: "snack", c: "#rrggbb"
  // (the main food's color), s: "#rrggbb" (a second food's color), t: ms timestamp, f: [food ids] }.
  var TABLEKEY = "kitchen-table-v1", TABLE_MAX = 12;
  var BOWL_FULL = 3; // foods in a full snack bowl

  // ---------- Small SVG pictures (panel tiles and the ghost hand's knife) ----------
  function sv(inner) { return '<svg viewBox="0 0 60 60" aria-hidden="true">' + inner + "</svg>"; }
  var ST = ' stroke="#1D2340" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
  var ICON = {
    banana: sv('<path d="M10 20 Q14 46 38 50 Q52 52 54 44 Q40 44 30 36 Q20 28 18 16 Z" fill="#FFD84D"' + ST + '/><path d="M18 16 L14 9 L10 12 L10 20" fill="#8A5A2B"' + ST + '/><path d="M20 26 Q26 40 40 45" fill="none" stroke="#E8B820" stroke-width="2.5" stroke-linecap="round"/>'),
    cucumber: sv('<path d="M8 44 Q4 34 16 28 L42 14 Q54 8 57 16 Q60 25 48 31 L22 46 Q12 52 8 44 Z" fill="#3E8E3A"' + ST + '/><path d="M14 38 L47 20" stroke="#7CC46A" stroke-width="3" stroke-linecap="round"/><g fill="#BDE8A8"><circle cx="22" cy="40" r="1.7"/><circle cx="33" cy="31" r="1.7"/><circle cx="44" cy="27" r="1.7"/><circle cx="27" cy="31" r="1.5"/></g>'),
    carrot: sv('<path d="M17 15 L8 6 M20 13 L18 2 M22 15 L31 7" stroke="#2EA05A" stroke-width="4.5" stroke-linecap="round"/><path d="M14 16 Q24 8 31 18 L53 51 Q51 56 46 53 L14 28 Q7 22 14 16 Z" fill="#FF8A1F"' + ST + '/><path d="M24 26 L29 22 M32 35 L37 31 M40 43 L44 40" stroke="#D96A12" stroke-width="2.5" stroke-linecap="round"/>'),
    strawberry: sv('<path d="M30 54 Q10 40 12 24 Q14 14 30 16 Q46 14 48 24 Q50 40 30 54 Z" fill="#E8344E"' + ST + '/><path d="M18 16 L24 10 L30 15 L36 10 L42 16 L30 20 Z" fill="#3E9B3A"' + ST + '/><g fill="#FFE68A"><circle cx="22" cy="28" r="1.8"/><circle cx="32" cy="26" r="1.8"/><circle cx="40" cy="30" r="1.8"/><circle cx="26" cy="38" r="1.8"/><circle cx="36" cy="40" r="1.8"/><circle cx="30" cy="47" r="1.6"/></g>'),
    cheese: sv('<path d="M6 30 L22 16 L56 16 L40 30 Z" fill="#FFE07A"' + ST + '/><path d="M6 30 L40 30 L40 50 L6 50 Z" fill="#FFC93C"' + ST + '/><path d="M40 30 L56 16 L56 36 L40 50 Z" fill="#E8A41E"' + ST + '/><circle cx="17" cy="40" r="2.6" fill="#E8A41E"/><circle cx="29" cy="44" r="1.8" fill="#E8A41E"/><circle cx="30" cy="22" r="1.8" fill="#F2C440"/>'),
    bread: sv('<path d="M12 54 L12 27 Q5 11 20 8 Q30 4 40 8 Q55 11 48 27 L48 54 Z" fill="#C98B4F"' + ST + '/><path d="M17 50 L17 28 Q12 15 22 13 Q30 10 38 13 Q48 15 43 28 L43 50 Z" fill="#FFF1D6"/><g fill="#EBD3A6"><circle cx="24" cy="30" r="2"/><circle cx="34" cy="38" r="2"/><circle cx="26" cy="44" r="1.6"/><circle cx="36" cy="24" r="1.6"/></g>'),
    apple: sv('<circle cx="30" cy="35" r="20" fill="#E63946"' + ST + '/><path d="M30 17 Q31 11 34 6" stroke="#7A4B1E" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M33 13 Q42 4 51 10 Q42 18 33 13 Z" fill="#3E9B3A"' + ST + '/><ellipse cx="22" cy="29" rx="4" ry="6" fill="rgba(255,255,255,0.45)"/>')
  };
  var KNIFE_SVG = sv('<g transform="rotate(-50 30 30)"><rect x="2" y="25" width="22" height="10" rx="5" fill="#2D7BE5"' + ST + '/><path d="M24 25 L52 25 Q58 26 58 30 L56 34 L53 32 L50 35 L47 32 L44 35 L41 32 L38 35 L35 32 L32 35 L29 32 L26 35 L24 35 Z" fill="#8FE0C4"' + ST + '/></g>');

  // ---------- Foods ----------
  // Each food is drawn in its own units (about 2 wide), centred on the board. `pts` is its outline,
  // `steps` the cuts asked for, each a list of guide lines [x1, y1, x2, y2] (any drag snaps to the nearest).
  function longOutline(L, yc, t) {
    var top = [], bot = [], n = 40;
    for (var i = 0; i <= n; i++) {
      var x = -L + 2 * L * i / n;
      top.push([x, yc(x) - t(x)]);
      bot.push([x, yc(x) + t(x)]);
    }
    return top.concat(bot.reverse());
  }
  function bez(out, p0, p1, p2, p3, n) {
    for (var i = (out.length ? 1 : 0); i <= n; i++) {
      var t = i / n, u = 1 - t;
      out.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
                u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);
    }
    return out;
  }
  var LH = 0.95; // half length of the long foods
  function coinCuts(L) { return [[-L / 4, -1, -L / 4, 1], [L / 4, -1, L / 4, 1], [-3 * L / 4, -1, -3 * L / 4, 1], [3 * L / 4, -1, 3 * L / 4, 1]]; }
  function halfQuarterCuts(L) { return [{ say: "Cut it in half!", cuts: [[0, -1, 0, 1]] }, { say: "Now in quarters!", cuts: [[-L / 2, -1, -L / 2, 1], [L / 2, -1, L / 2, 1]] }]; }

  var bananaYc = function (x) { return 0.22 * (1 - x * x / (LH * LH)) - 0.1; };
  var bananaT = function (x) { return 0.03 + 0.17 * Math.pow(Math.max(0, 1 - Math.pow(Math.abs(x) / LH, 2.4)), 0.5); };
  var cucT = function (x) { return 0.255 * Math.pow(Math.max(0, 1 - Math.pow(Math.abs(x) / LH, 6)), 1 / 6); };
  var carT = function (x) {
    var u = (x + LH) / (2 * LH), t = 0.27 * (1 - u) + 0.035 * u;
    if (x < -LH + 0.1) t *= Math.sqrt(Math.max(0, 1 - Math.pow((-LH + 0.1 - x) / 0.1, 2)));
    return Math.max(0.004, t);
  };
  var FOODS = {
    banana: { name: "Banana", col: "#FFD84D", pts: longOutline(LH, bananaYc, bananaT), t: bananaT, yc: bananaYc,
      steps: halfQuarterCuts(LH).concat([{ say: "Slice it into coins!", cuts: coinCuts(LH) }]), coins: true, sep: 0.06, cut: "#FFF7D8" },
    cucumber: { name: "Cucumber", col: "#7CC46A", pts: longOutline(LH, function () { return 0; }, cucT), t: cucT, yc: function () { return 0; },
      steps: halfQuarterCuts(LH).concat([{ say: "Slice it into circles!", cuts: coinCuts(LH) }]), coins: true, sep: 0.06, cut: "#DDF5C0" },
    carrot: { name: "Carrot", col: "#FF8A1F", pts: longOutline(LH, function () { return 0; }, carT), t: carT, yc: function () { return 0; },
      steps: halfQuarterCuts(LH).concat([{ say: "Slice it into coins!", cuts: coinCuts(LH) }]), coins: true, sep: 0.06, cut: "#FFB86A", padL: 0.42 },
    strawberry: { name: "Strawberry", col: "#E8344E", sep: 0.12, cut: "#FFE3E8", flipAfter: 0,
      pts: (function () {
        var o = [];
        bez(o, [0, 0.86], [-0.5, 0.62], [-0.78, -0.12], [-0.6, -0.5], 14);
        bez(o, [-0.6, -0.5], [-0.48, -0.78], [-0.16, -0.8], [0, -0.7], 10);
        bez(o, [0, -0.7], [0.16, -0.8], [0.48, -0.78], [0.6, -0.5], 10);
        bez(o, [0.6, -0.5], [0.78, -0.12], [0.5, 0.62], [0, 0.86], 14);
        o.pop();
        return o;
      })(),
      steps: [{ say: "Cut it in half!", cuts: [[0, -1.2, 0, 1.2]] }, { say: "Now in quarters!", cuts: [[-1, 0.06, 1, 0.06]] }] },
    cheese: { name: "Cheese", col: "#FFC93C", pts: [[-0.9, -0.42], [0.9, -0.42], [0.9, 0.42], [-0.9, 0.42]], depth: 0.16, side: "#E8A41E", sep: 0.07, cut: "#FFE07A",
      steps: [{ say: "Cut it in half!", cuts: [[0, -1, 0, 1]] }, { say: "Now in quarters!", cuts: [[-0.45, -1, -0.45, 1], [0.45, -1, 0.45, 1]] },
        { say: "Now make cubes!", cuts: [[-1, 0, 1, 0]] }] },
    bread: { name: "Bread", col: "#E2B07A", depth: 0.07, side: "#A8693A", sep: 0.11, cut: "#FFF1D6",
      pts: (function () {
        var o = [[-0.7, 0.7], [-0.72, -0.28]];
        bez(o, [-0.72, -0.28], [-0.98, -0.66], [-0.7, -0.92], [-0.36, -0.86], 10);
        bez(o, [-0.36, -0.86], [-0.15, -0.94], [0.15, -0.94], [0.36, -0.86], 8);
        bez(o, [0.36, -0.86], [0.7, -0.92], [0.98, -0.66], [0.72, -0.28], 10);
        o.push([0.7, 0.7]);
        return o;
      })(),
      steps: [{ say: "Cut it in half!", cuts: [[-0.85, -0.95, 0.85, 0.75]] }, { say: "Now in quarters!", cuts: [[0.85, -0.95, -0.85, 0.75]] }] },
    apple: { name: "Apple", col: "#E63946", apple: true, steps: [{ say: "Press the slicer down!", cuts: [] }] }
  };
  var ORDER = ["banana", "cucumber", "carrot", "strawberry", "cheese", "bread", "apple"];
  var AR = 0.66, CORE_R = 0.17; // apple radius, core radius

  // Guide lines, bounds and starting piece for each food.
  ORDER.forEach(function (id) {
    var f = FOODS[id];
    f.id = id;
    if (f.apple) { f.G = [[]]; f.rb = [-AR, -AR, AR, AR]; return; }
    var x0 = 9, y0 = 9, x1 = -9, y1 = -9;
    f.pts.forEach(function (p) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); });
    f.rb = [x0, y0, x1, y1];
    var pd = 0.45;
    f.box = [[x0 - pd - (f.padL || 0), y0 - pd], [x1 + pd, y0 - pd], [x1 + pd, y1 + pd + (f.depth || 0)], [x0 - pd - (f.padL || 0), y1 + pd + (f.depth || 0)]];
    f.G = f.steps.map(function (st, s) {
      return st.cuts.map(function (l, j) {
        var dx = l[2] - l[0], dy = l[3] - l[1], len = Math.hypot(dx, dy);
        dx /= len; dy /= len;
        // The knife's tip points up the screen (or left for a level cut).
        if (dy > 0.01 || (Math.abs(dy) <= 0.01 && dx > 0)) { dx = -dx; dy = -dy; }
        var nx = -dy, ny = dx;
        return { gid: s + "." + j, s: s, j: j, x: l[0], y: l[1], dx: dx, dy: dy, nx: nx, ny: ny, c: nx * l[0] + ny * l[1], a: Math.atan2(dy, dx) };
      });
    });
  });

  // ---------- Polygon helpers ----------
  function clipHalf(poly, nx, ny, c) { // keep the part where nx*x + ny*y <= c
    var out = [];
    for (var i = 0; i < poly.length; i++) {
      var p = poly[i], q = poly[(i + 1) % poly.length];
      var vp = nx * p[0] + ny * p[1] - c, vq = nx * q[0] + ny * q[1] - c;
      if (vp <= 0) out.push(p);
      if ((vp < 0 && vq > 0) || (vp > 0 && vq < 0)) { var t = vp / (vp - vq); out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); }
    }
    return out;
  }
  function areaOf(poly) { var a = 0; for (var i = 0; i < poly.length; i++) { var p = poly[i], q = poly[(i + 1) % poly.length]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; }
  function centroid(poly) {
    var a = areaOf(poly), cx = 0, cy = 0;
    if (Math.abs(a) < 1e-6) { poly.forEach(function (p) { cx += p[0]; cy += p[1]; }); return [cx / Math.max(1, poly.length), cy / Math.max(1, poly.length)]; }
    for (var i = 0; i < poly.length; i++) { var p = poly[i], q = poly[(i + 1) % poly.length], k = p[0] * q[1] - q[0] * p[1]; cx += (p[0] + q[0]) * k; cy += (p[1] + q[1]) * k; }
    return [cx / (6 * a), cy / (6 * a)];
  }
  function boundsOf(poly) { var b = [9, 9, -9, -9]; poly.forEach(function (p) { b[0] = Math.min(b[0], p[0]); b[1] = Math.min(b[1], p[1]); b[2] = Math.max(b[2], p[0]); b[3] = Math.max(b[3], p[1]); }); return b; }

  // ---------- A food on the board, as pieces ----------
  // piece: { box, shape (clip polygons), planes [[nx, ny, c]], cx, cy (centre, food units), ox, oy (offset now),
  //          tx, ty (offset target), vx, vy, face (cut side up), coin (lying flat as a round), r, flipT, prev }
  function mkPiece(f) {
    var c = centroid(f.pts);
    return { box: f.box, shape: f.pts, planes: [], cx: c[0], cy: c[1], ox: 0, oy: 0, tx: 0, ty: 0, vx: 0, vy: 0, face: false, coin: false, r: 0, flipT: -99, prev: null };
  }
  function buildFood(id, cuts, anim) {
    var f = FOODS[id];
    var c = { id: id, f: f, pieces: [], done: {}, order: [], enterT: -99, ex: 0, ey: 0, flying: false, wig: 0, pressT: -99, pressed: false };
    if (f.apple) {
      if (cuts.length) { c.pressed = true; c.order = ["0.0"]; makeWedges(c, false); }
      return c;
    }
    c.pieces = [mkPiece(f)];
    cuts.forEach(function (g) { doCut(c, g, !!anim); });
    return c;
  }
  function guideOf(f, gid) { var a = gid.split("."), s = f.G[+a[0]]; return s ? s[+a[1]] || null : null; }
  function stepOf(c) {
    var f = c.f;
    if (f.apple) return c.pressed ? 1 : 0;
    for (var s = 0; s < f.G.length; s++) for (var j = 0; j < f.G[s].length; j++) if (!c.done[f.G[s][j].gid]) return s;
    return f.G.length;
  }
  function complete(c) { return c.f.apple ? c.pressed : stepOf(c) >= c.f.G.length; }
  function remaining(c) {
    var s = stepOf(c);
    if (c.f.apple || s >= c.f.G.length) return [];
    return c.f.G[s].filter(function (g) { return !c.done[g.gid]; });
  }
  function doCut(c, gid, anim) {
    var f = c.f, g = guideOf(f, gid);
    if (!g || c.done[gid]) return false;
    var t = now(), out = [];
    c.pieces.forEach(function (p) {
      if (p.coin) { out.push(p); return; }
      var a = clipHalf(p.shape, g.nx, g.ny, g.c), b = clipHalf(p.shape, -g.nx, -g.ny, -g.c);
      if (Math.abs(areaOf(a)) < 1e-3 || Math.abs(areaOf(b)) < 1e-3) { out.push(p); return; }
      [[a, 1], [b, -1]].forEach(function (pr) {
        var k = pr[1], q = {}, key;
        for (key in p) q[key] = p[key];
        q.shape = pr[0];
        q.box = clipHalf(p.box, k * g.nx, k * g.ny, k * g.c);
