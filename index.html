<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toybox</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Toybox">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
}
.wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));
}
header { display: flex; align-items: center; gap: 14px; }
header img { width: 72px; height: 72px; border-radius: 18px; border: 3px solid var(--edge); flex: none; }
h1 {
  margin: 0;
  font-size: clamp(2.3rem, 7vw, 3.6rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.01em;
}
.apps {
  list-style: none;
  margin: 28px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  /* Every row as tall as the tallest tile, so all tiles match no matter how long their text is. */
  grid-auto-rows: 1fr;
  gap: 20px;
}
/* The link fills its grid cell, so the visible tile is the full cell size. */
.apps li { display: flex; min-width: 0; }
.apps li > .app { flex: 1 1 auto; }
.app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 20px 16px 16px;
  color: var(--ink);
  text-decoration: none;
  text-align: center;
  background: var(--panel);
  border: 3px solid var(--edge);
  border-radius: 24px;
  box-shadow: 5px 5px 0 var(--edge);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
  -webkit-tap-highlight-color: transparent;
}
.app:active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--edge); }
.app:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }
.app img { width: 128px; height: 128px; border-radius: 28px; }
.app .name { font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
.app .what { color: var(--muted); font-size: 1rem; }
/* Phones: two smaller tiles per row so more apps fit on one screen. */
@media (max-width: 600px) {
  .wrap { padding-top: 16px; }
  header img { width: 52px; height: 52px; border-radius: 14px; }
  .apps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
  .app { gap: 6px; padding: 12px 8px 10px; border-radius: 18px; box-shadow: 4px 4px 0 var(--edge); }
  .app:active { transform: translate(4px, 4px); }
  .app img { width: 84px; height: 84px; border-radius: 20px; }
  .app .name { font-size: 1.15rem; }
  .app .what { font-size: 0.82rem; line-height: 1.25; }
}
@media (prefers-reduced-motion: reduce) {
  .app { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icons/icon-192.png" alt="">
    <h1>Toybox</h1>
  </header>
  <ul class="apps" id="apps"></ul>
</div>

<script>
(function () {
  "use strict";
  // To add an app: put it in its own folder, add an entry here,
  // and add its files to CORE in sw.js (then bump CACHE there).
  var APPS = [
    {
      name: "Workshop",
      what: "Put on your safety gear, then use real drills, saws, hammers and screws.",
      href: "workshop/",
      icon: "workshop/icons/icon-512.png"
    },
    {
      name: "Spin Shop",
      what: "Build a wheel, fan, flower or pinwheel and spin it.",
      href: "spin-shop/",
      icon: "spin-shop/icons/icon-512.png"
    },
    {
      name: "Kaleidoscope",
      what: "Draw with your fingers and every line is mirrored into a big spinning pattern.",
      href: "kaleidoscope/",
      icon: "kaleidoscope/icons/icon-512.png"
    },
    {
      name: "Fish Tank",
      what: "Feed the fish, make them flip, and fill the tank with your own sea friends.",
      href: "fish-tank/",
      icon: "fish-tank/icons/icon-512.png"
    },
    {
      name: "Peg Drop",
      what: "Drop balls through glowing pegs and count them in the bins.",
      href: "peg-drop/",
      icon: "peg-drop/icons/icon-512.png"
    },
    {
      name: "Rocket Builder",
      what: "Build a rocket from parts, then count down and launch it into space.",
      href: "rocket-builder/",
      icon: "rocket-builder/icons/icon-512.png"
    },
    {
      name: "Color Mixing",
      what: "Pour paints into a big bowl, stir with your finger, and see what new color you made.",
      href: "color-mixing/",
      icon: "color-mixing/icons/icon-512.png"
    },
    {
      name: "Gear Box",
      what: "Build gear trains and crank them. Watch the speeds, ratios and turns.",
      href: "gear-box/",
      icon: "gear-box/icons/icon-512.png"
    },
    {
      name: "Marble Run",
      what: "Pull the plunger or press Drop, then watch marbles race down the runs and ride the lift back up.",
      href: "marble-run/",
      icon: "marble-run/icons/icon-512.png"
    },
    {
      name: "Car Builder",
      what: "Build a digger, race car or monster truck, then drive it: dig, dump, race laps and crush cars.",
      href: "car-builder/",
      icon: "car-builder/icons/icon-512.png"
    },
    {
      name: "Math Grid",
      what: "Tap, drag and build blocks on a big times and plus table.",
      href: "math-grid/",
      icon: "math-grid/icons/icon-512.png"
    },
    {
      name: "3D Printer",
      what: "Pick spool colors, print a Benchy layer by layer, and fill your shelf.",
      href: "3d-printer/",
      icon: "3d-printer/icons/icon-512.png"
    }
  ];

  var list = document.getElementById("apps");
  APPS.forEach(function (app) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "app";
    a.href = app.href;

    var img = document.createElement("img");
    img.src = app.icon;
    img.alt = "";

    var name = document.createElement("span");
    name.className = "name";
    name.textContent = app.name;

    var what = document.createElement("span");
    what.className = "what";
    what.textContent = app.what;

    a.appendChild(img);
    a.appendChild(name);
    a.appendChild(what);
    li.appendChild(a);
    list.appendChild(li);
  });
})();
</script>
<script>
(function () {
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline install unavailable */ });
    });
  }
})();
</script>
</body>
</html>
