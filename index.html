<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toybox</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Toybox">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common/toybox.css">
<script src="common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
}
/* The home screen fits on one screen with no scrolling: a fixed-height column (the header, then the grid
   of tiles filling the rest). The grid has exactly the rows the apps need, and fitGrid() below sizes the
   pictures to the room left in a row after the names. The tile order never changes, so every app keeps
   its place on the screen. */
.wrap {
  max-width: 1000px;
  margin: 0 auto;
  height: 100vh;
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
}
header { display: flex; align-items: center; gap: 14px; flex: none; }
header .grownbtn { margin-left: auto; min-height: 48px; font-size: 1.05rem; padding: 0.3rem 0.9rem; white-space: nowrap; flex: none; }
@media (max-width: 600px) { header .grownbtn { font-size: 0.95rem; min-height: 44px; padding: 0.2rem 0.7rem; } h1 { font-size: 2.1rem; } }
#tb-appSettings h4.tb-app { margin: 14px 0 4px; font-size: 1.05rem; }
#tb-appSettings .tb-set + .tb-set { margin-top: 8px; }
#offline .status { margin: 0 auto; max-width: 30em; text-align: center; font-weight: 700; }
#offline .status.ok { color: #2E9E5B; }
#offline .status.warn { color: #B35C00; }
header img { width: 72px; height: 72px; border-radius: 18px; border: 3px solid var(--edge); flex: none; }
h1 {
  margin: 0;
  font-size: clamp(2.3rem, 7vw, 3.6rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.01em;
}
.apps {
  /* --cols is chosen per screen size below; --rows and --icon are set by fitGrid(). */
  --cols: 4;
  --rows: 4;
  --gap: 14px;
  --icon: 96px;
  list-style: none;
  margin: 18px 0 0;
  padding: 0;
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
  gap: var(--gap);
}
/* The link fills its grid cell, so the visible tile is the full cell size. */
.apps li { display: flex; min-width: 0; min-height: 0; }
.apps li > .app { flex: 1 1 auto; min-width: 0; }
.app {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 10px 10px;
  color: var(--ink);
  text-decoration: none;
  text-align: center;
  background: var(--panel);
  border: 3px solid var(--edge);
  border-radius: 24px;
  box-shadow: 5px 5px 0 var(--edge);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
  -webkit-tap-highlight-color: transparent;
}
.app:active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--edge); }
.app:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }
.app img { width: var(--icon); height: var(--icon); border-radius: calc(var(--icon) * 0.22); flex: none; }
.app .name {
  flex: none;
  font-size: clamp(1rem, 2.6vmin, 1.4rem);
  font-weight: 800;
  line-height: 1.1;
  max-width: 100%;
  /* The slot is as tall as the tallest name (set by fitGrid), so pictures line up across a row. */
  min-height: var(--name-h, 0px);
  align-content: center;
  -webkit-hyphens: auto;
  hyphens: auto;
  overflow-wrap: break-word;
}
/* Just the picture and the name on every screen, so the home screen is calm and quick to scan.
   The descriptions stay in APPS (and in the README) for grown-ups. */
.app .what { display: none; }
/* Upright phones: three tiles per row. */
@media (max-width: 600px) {
  .wrap { padding-top: 12px; padding-bottom: 10px; }
  header img { width: 48px; height: 48px; border-radius: 14px; }
  .apps { --cols: 3; --gap: 8px; margin-top: 12px; }
  .app { gap: 4px; padding: 7px 4px 5px; border-radius: 16px; box-shadow: 3px 3px 0 var(--edge); }
  .app:active { transform: translate(3px, 3px); }
  .app .name { font-size: 0.86rem; }
}
/* Phones held sideways: six tiles per row, and a smaller header so the tiles get the height. */
@media (orientation: landscape) and (max-height: 520px) {
  .wrap { padding-top: 8px; padding-bottom: 8px; }
  header img { display: none; }
  h1 { font-size: 1.9rem; }
  header .grownbtn { min-height: 44px; font-size: 0.95rem; padding: 0.2rem 0.7rem; }
  .apps { --cols: 6; --gap: 8px; margin-top: 8px; }
  .app { gap: 3px; padding: 6px 4px 4px; border-radius: 16px; box-shadow: 3px 3px 0 var(--edge); }
  .app:active { transform: translate(3px, 3px); }
  .app .name { font-size: 0.8rem; }
}
@media (prefers-reduced-motion: reduce) {
  .app { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icons/icon-192.png" alt="">
    <h1>Toybox</h1>
    <!-- The only Grown-ups button in the Toybox: timer, sound and every app's settings. -->
    <button class="btn grownbtn" id="grownbtn" aria-label="Grown-ups">Grown-ups</button>
  </header>
  <ul class="apps" id="apps"></ul>
</div>

<!-- Grown-ups sheet: is every app saved on this device for use with no network (e.g. on a plane)? -->
<section id="offline" hidden>
  <h3>Offline (for the plane)</h3>
  <p class="status" id="offStatus" role="status" aria-live="polite">Not checked yet.</p>
  <div class="sheet-actions">
    <button class="btn" id="offCheck">Check again</button>
    <button class="btn primary" id="offFill" hidden>Save everything now</button>
  </div>
</section>

<script>
(function () {
  "use strict";
  // To add an app: put it in its own folder, add an entry here,
  // and add its files to CORE in sw.js (then bump CACHE there).
  // Coming back to the home screen takes the safety gear off, so the Workshop and the
  // Construction Site ask for it again next time (moving between their own pages keeps it on).
  function takeGearOff() {
    try { sessionStorage.removeItem("workshop-gear"); sessionStorage.removeItem("site-gear"); sessionStorage.removeItem("kitchen-ready"); } catch (e) { /* storage blocked: nothing to clear */ }
  }
  takeGearOff();
  window.addEventListener("pageshow", takeGearOff); // also when Back restores this page from cache

  var APPS = [
    {
      name: "Workshop",
      what: "Put on your safety gear, then use real drills, saws, hammers and screws.",
      href: "workshop/",
      icon: "workshop/icons/icon-512.png"
    },
    {
      name: "Spin Shop",
      what: "Build a wheel, fan, flower or pinwheel and spin it.",
      href: "spin-shop/",
      icon: "spin-shop/icons/icon-512.png"
    },
    {
      name: "Kaleidoscope",
      what: "Draw with your fingers and every line is mirrored into a big spinning pattern.",
      href: "kaleidoscope/",
      icon: "kaleidoscope/icons/icon-512.png"
    },
    {
      name: "Peg Drop",
      what: "Drop balls through glowing pegs and count them in the bins.",
      href: "peg-drop/",
      icon: "peg-drop/icons/icon-512.png"
    },
    {
      name: "Rocket Builder",
      what: "Build a rocket from parts, then count down and launch it into space.",
      href: "rocket-builder/",
      icon: "rocket-builder/icons/icon-512.png"
    },
    {
      name: "Gear Box",
      what: "Build gear trains, crank them and watch every gear turn.",
      href: "gear-box/",
      icon: "gear-box/icons/icon-512.png"
    },
    {
      name: "Marble Run",
      what: "Pull the plunger or press Drop, then watch marbles race down the runs and ride the lift back up.",
      href: "marble-run/",
      icon: "marble-run/icons/icon-512.png"
    },
    {
      name: "Car Builder",
      what: "Build a digger, race car or monster truck, then drive it: dig, dump, race laps and crush cars.",
      href: "car-builder/",
      icon: "car-builder/icons/icon-512.png"
    },
    {
      name: "Math Grid",
      what: "Tap, drag and build blocks on a big times and plus table.",
      href: "math-grid/",
      icon: "math-grid/icons/icon-512.png"
    },
    {
      name: "3D Printer",
      what: "Pick spool colors, print a Benchy layer by layer, and fill your shelf.",
      href: "3d-printer/",
      icon: "3d-printer/icons/icon-512.png"
    },
    {
      name: "Water Works",
      what: "Pour water into the funnels, turn the valves and spin the wheels on a water table.",
      href: "water-works/",
      icon: "water-works/icons/icon-512.png"
    },
    {
      name: "Construction Site",
      what: "Gear up, then dig with an excavator, pour a concrete road, and swing a wrecking ball.",
      href: "construction-site/",
      icon: "construction-site/icons/icon-512.png"
    },
    {
      name: "Train Builder",
      what: "Build a train car by car, then run it on an oval, a figure-8 or a track with switches.",
      href: "train-builder/",
      icon: "train-builder/icons/icon-512.png"
    },
    {
      name: "Bubbles",
      what: "Switch on the bubble machine, blow bubbles with a big wand, and pop them all.",
      href: "bubble-machine/",
      icon: "bubble-machine/icons/icon-512.png"
    },
    {
      name: "Hamster",
      what: "Take care of a happy hamster: tap the wheel, the food, the water or its little house.",
      href: "hamster/",
      icon: "hamster/icons/icon-512.png"
    },
    {
      name: "Garden",
      what: "Plant seeds, water them, tap the sun to make them grow, and pick carrots and tomatoes.",
      href: "garden/",
      icon: "garden/icons/icon-512.png"
    },
    {
      name: "Spinning Tops",
      what: "Pull the ripcord to launch spinning tops into a bowl and watch them spin, wobble and bump.",
      href: "spinning-tops/",
      icon: "spinning-tops/icons/icon-512.png"
    },
    {
      name: "Kitchen",
      what: "Wash your hands, put on an apron and chef hat, then make smoothies in the blender.",
      href: "kitchen/",
      icon: "kitchen/icons/icon-512.png"
    }
  ];

  var list = document.getElementById("apps");
  APPS.forEach(function (app) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "app";
    a.href = app.href;
    // Opening an app from here starts it fresh (see Toybox.fresh in common/toybox.js).
    a.addEventListener("click", function () {
      try { sessionStorage.setItem("toybox-launch", String(Date.now())); } catch (e) { /* storage blocked: apps keep their state */ }
    });

    var img = document.createElement("img");
    img.src = app.icon;
    img.alt = "";

    var name = document.createElement("span");
    name.className = "name";
    name.textContent = app.name;

    var what = document.createElement("span");
    what.className = "what";
    what.textContent = app.what;

    a.appendChild(img);
    a.appendChild(name);
    a.appendChild(what);
    li.appendChild(a);
    list.appendChild(li);
  });

  // Fit every app on one screen. The stylesheet picks the columns for the screen (--cols); this works
  // out the rows, then sizes the pictures to the room left in a row after the tallest name, so nothing
  // is cut off and the pictures are as big as they can be. Runs again when the screen turns or the
  // font arrives (the names can wrap differently).
  function fitGrid() {
    var cols = parseInt(getComputedStyle(list).getPropertyValue("--cols"), 10) || 4;
    list.style.setProperty("--rows", String(Math.ceil(APPS.length / cols)));
    var tile = list.querySelector(".app");
    if (!tile) return;
    // Every name gets the height of the tallest one, so the pictures line up across a row.
    list.style.removeProperty("--name-h");
    var names = list.querySelectorAll(".name");
    var nameH = 0;
    for (var i = 0; i < names.length; i++) nameH = Math.max(nameH, names[i].offsetHeight);
    list.style.setProperty("--name-h", nameH + "px");
    var cs = getComputedStyle(tile);
    var room = tile.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - (parseFloat(cs.rowGap) || 0) - nameH - 1;
    list.style.setProperty("--icon", Math.max(40, Math.min(160, Math.floor(room))) + "px");
  }
  fitGrid();
  window.addEventListener("resize", function () { requestAnimationFrame(fitGrid); });
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitGrid); }

  // ---------- Offline check (Grown-ups sheet) ----------
  // Asks the home screen's service worker (sw.js) which of its files are saved on this device. When
  // online it first looks for a newer Toybox and waits for it to download, so the answer covers the
  // newest apps. "Save everything now" asks the worker to fetch whatever is missing.
  var NAMES = {};
  APPS.forEach(function (a) { NAMES[a.href.replace(/\/$/, "")] = a.name; });
  var offBusy = false, offUpdated = false;
  function offSay(text, cls) {
    var el = document.getElementById("offStatus");
    el.textContent = text;
    el.className = "status" + (cls ? " " + cls : "");
  }
  function askWorker(sw, type) {
    return new Promise(function (resolve, reject) {
      var ch = new MessageChannel(), t = setTimeout(function () { reject(new Error("timeout")); }, 120000);
      ch.port1.onmessage = function (e) { clearTimeout(t); resolve(e.data); };
      sw.postMessage({ type: type }, [ch.port2]);
    });
  }
  function waitInstalled(reg) {
    return new Promise(function (resolve) {
      var t0 = Date.now();
      (function poll() {
        if (!reg.installing && !reg.waiting) { resolve(); return; }
        if (Date.now() - t0 > 120000) { resolve(); return; }
        setTimeout(poll, 400);
      })();
    });
  }
  function missingApps(missing) {
    var seen = {}, out = [];
    missing.forEach(function (u) {
      var m = /^\.\/([^\/]+)\//.exec(u), key = m ? m[1] : "";
      var name = key ? (NAMES[key] || null) : "The home screen";
      if (key === "common") name = "The home screen";
      if (name && !seen[name]) { seen[name] = 1; out.push(name); }
    });
    return out;
  }
  function offCheck(fill) {
    if (offBusy) return;
    var fillBtn = document.getElementById("offFill");
    if (!("serviceWorker" in navigator) || !window.caches || !/^https?:$/.test(location.protocol)) {
      offSay("This browser can't save the Toybox for offline use.", "warn"); fillBtn.hidden = true; return;
    }
    offBusy = true;
    offSay(fill ? "Saving everything…" : "Checking…");
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg) throw new Error("none");
      var online = navigator.onLine !== false;
      var upd = online && !fill ? reg.update().catch(function () {}) : Promise.resolve();
      return upd.then(function () {
        if (reg.installing || reg.waiting) { offUpdated = true; offSay("Downloading the newest Toybox…"); }
        return waitInstalled(reg);
      }).then(function () {
        var sw = reg.active || navigator.serviceWorker.controller;
        if (!sw) throw new Error("none");
        return askWorker(sw, fill ? "toybox-offline-fill" : "toybox-offline-check");
      }).then(function (r) {
        offBusy = false;
        var miss = r && r.missing ? r.missing : [];
        if (!miss.length) {
          offSay("Ready for the plane ✓ All " + APPS.length + " apps are saved on this device." +
            (offUpdated ? " New apps were downloaded: close the Toybox and open it again to see them." : ""), "ok");
          fillBtn.hidden = true;
        } else {
          var names = missingApps(miss);
          offSay("Not ready yet: " + (names.length ? names.join(", ") : miss.length + " files") + (names.length === 1 ? " is" : " are") +
            " not saved. " + (online ? "Tap \"Save everything now\"." : "Connect to the internet, then tap \"Save everything now\"."), "warn");
          fillBtn.hidden = !online;
        }
      });
    }).catch(function () {
      offBusy = false;
      offSay("Not saved for offline yet. Open the Toybox once while online, close it, and open it again.", "warn");
      fillBtn.hidden = true;
    });
  }
  document.getElementById("offCheck").addEventListener("click", function () { offCheck(false); });
  document.getElementById("offFill").addEventListener("click", function () { offCheck(true); });

  // The Grown-ups sheet: play timer, sound, and the App settings for every app.
  Toybox.init({
    app: "launcher",
    home: true,
    sections: [document.getElementById("offline")],
    onOpen: function () { offCheck(false); },
    grownButton: document.getElementById("grownbtn"),
    grownLabel: ["Grown-ups", "⏱ Grown-ups"],
    timerIntro: "When time is up, the app he is playing winds down and rests, and the controls lock.",
    restLine: "The Toybox is resting.",
    restArt: function () { return '<img class="rest-art" src="icons/icon-512.png" alt="" style="width:min(50vw,220px);border-radius:28px">'; }
  });
})();
</script>
<script>
(function () {
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline install unavailable */ });
    });
  }
})();
</script>
</body>
</html>
