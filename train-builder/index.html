<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Train Builder</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Train Builder">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
.stage { background: #9ED8F5; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#count { transition: transform 0.1s ease; }
#count.pop { animation: pop 0.35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
.btn.tb-go[hidden] { display: none; }

/* ---------- Panel: Go!, the Paint choices, then the tab bar ----------
   Engines and Cars have no panel choices: the pieces wait in the yard on the stage and he drags them on. */
[data-pane] { display: none; }
.tb-panel[data-tab="paint"] [data-pane="paint"] { display: block; }
.tb-panel .panel-body.tb-choices { display: block; min-height: 0; }
.tb-panel:not([data-tab="paint"]) .panel-body { display: none; }
.tb-tabs { margin-top: auto; }
.prow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.prow:first-child { margin-top: 0; }
.sw { flex: 1 0 34px; height: 44px; min-height: 44px; padding: 0; border-radius: 12px; }
.sw[aria-pressed="true"] { outline: 4px solid var(--focus); outline-offset: 1px; }
.st { flex: 1 0 40px; min-height: 46px; padding: 2px; font-size: 1.15rem; font-weight: 800; background: var(--plate); color: #1D2340; }
.st canvas { width: 100%; height: 34px; display: block; pointer-events: none; }
.st[aria-pressed="true"] { outline: 4px solid var(--focus); outline-offset: 1px; }
.hint { margin: 0 0 6px; font-weight: 700; color: var(--muted); font-size: 1rem; line-height: 1.2; }
.tb-tabs .tab[aria-selected="true"] { background: var(--accent); color: #1D2340; }
.prow#swatches { flex-wrap: nowrap; }
#swatches .sw { flex: 1 1 0; min-width: 0; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 2; }

/* Big mode: the panel goes away, the header stays. */
body.big .tb-panel { display: none; }

/* Small phones */
@media (max-width: 480px) {
  .sw { height: 38px; min-height: 38px; flex-basis: 26px; }
  .st { min-height: 40px; flex-basis: 28px; }
}
/* Tablets */
@media (min-width: 744px) and (min-height: 640px) {
  .tb-panel { gap: 12px; }
  .sw { height: 54px; min-height: 54px; }
  .st { min-height: 56px; font-size: 1.4rem; }
  .st canvas { height: 42px; }
}
/* Landscape: the panel is a slim column on the right: Go on top, the paint choices in a scrolling block when
   Paint is picked, and the tab buttons stacked one per row at the bottom. The stage takes the rest. */
@media (orientation: landscape) {
  .tb-body .tb-panel { width: 170px; flex: none; gap: 8px; align-self: flex-start; max-height: 100%; }
  .tb-panel .panel-body.tb-choices { flex: 1 1 auto; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
  .tb-tabs { flex-direction: column; flex-wrap: nowrap; gap: 6px; margin-top: 0; }
  .tb-tabs .btn { flex: none; width: 100%; min-height: 48px; font-size: 1.05rem; }
  .btn.tb-go { flex: none; min-height: 56px; font-size: 1.45rem; padding: 0 4px; }
  .prow#swatches { flex-wrap: wrap; }
  #swatches .sw { flex: 1 0 36px; height: 40px; min-height: 40px; }
  .st { flex: 1 0 44px; min-height: 44px; font-size: 1rem; }
  .st canvas { height: 30px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: 130px; padding: 6px; gap: 4px; }
  .tb-tabs { gap: 4px; }
  .tb-tabs .btn { min-height: 44px; font-size: 0.95rem; padding: 0.1rem 0.2rem; }
  .btn.tb-go { min-height: 44px; font-size: 1.2rem; }
  /* Five 44px tabs plus Go fill the column: while Paint is picked, Go steps aside for the paint block. */
  .tb-panel[data-tab="paint"] .btn.tb-go { display: none; }
  .sw { height: 32px; min-height: 32px; flex-basis: 22px; }
  #swatches .sw { flex: 1 0 30px; height: 32px; min-height: 32px; }
  .st { min-height: 34px; font-size: 0.9rem; flex-basis: 24px; }
  .st canvas { height: 22px; }
  .prow { margin-top: 4px; gap: 4px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #count.pop { animation: none; }
}
/* Ghost hand: a see-through hand that shows the main move once (same look as Bulldozer and Measuring). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Train Builder</h1>
    <button class="btn tb-iconbtn" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" aria-label="The train"></canvas>
      <div class="tb-counter" id="count">Cars: 0</div>
      <div class="tb-coach" id="coach">Drag an engine onto the track!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" hidden></svg>
    </main>

    <section class="tb-panel" id="panel" data-tab="engines">
      <button class="btn tb-go" id="go" hidden>Go!</button>
      <div class="tb-choices panel-body">
        <div data-pane="paint">
          <p class="hint" id="paintHint">Tap a train car to paint it.</p>
          <div class="prow" id="swatches"></div>
          <div class="prow" id="styles"></div>
        </div>
      </div>
      <nav class="tb-tabs" role="tablist" aria-label="Controls">
        <button class="btn tab" role="tab" data-tab="engines">Engines</button>
        <button class="btn tab" role="tab" data-tab="cars">Cars</button>
        <button class="btn tab" role="tab" data-tab="paint">Paint</button>
        <button class="btn tb-new" id="newBtn">New</button>
        <button class="btn tb-surprise" id="surprise">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";
  var OUT = "#1D2340";
  var KEY = "trainbuilder-v1";
  var TAU = Math.PI * 2;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  // Repeatable pseudo-random number for scenery item n (0..1).
  function hsh(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  var COLORS = ["#E63946", "#F77F00", "#FFC93C", "#A7D129", "#2E9E5B", "#1FA6A0",
    "#5BC0EB", "#2D5BD7", "#7B4FC9", "#F26CA7", "#8B5A3C", "#26282E"];
  function rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function shade(h, f) {
    var c = rgb(h);
    var t = f < 0 ? 0 : 255, k = Math.abs(f);
    return "rgb(" + c.map(function (v) { return Math.round(v + (t - v) * k); }).join(",") + ")";
  }
  function isDark(h) { var c = rgb(h); return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) < 120; }

  // ---------- Piece catalog ----------
  // len: side-view length in build units. eng: an engine. Every piece is about 185 units tall.
  var TYPES = {
    steam:    { name: "Steam", len: 250, eng: true, color: "#26282E" },
    diesel:   { name: "Diesel", len: 180, eng: true, color: "#FFC93C" },
    electric: { name: "Electric", len: 180, eng: true, color: "#2D5BD7" },
    fast:     { name: "High-speed", len: 220, eng: true, color: "#FFFFFF" },
    boxcar:   { name: "Boxcar", len: 160, color: "#E63946" },
    tanker:   { name: "Tanker", len: 160, color: "#9AA3AF" },
    hopper:   { name: "Hopper", len: 145, color: "#2E9E5B" },
    logs:     { name: "Logs", len: 165, color: "#8B5A3C" },
    pipes:    { name: "Pipes", len: 165, color: "#2D5BD7" },
    boxes:    { name: "Containers", len: 165, color: "#7B4FC9" },
    passenger:{ name: "Passenger", len: 180, color: "#1FA6A0" },
    coal:     { name: "Coal", len: 130, color: "#F77F00" },
    caboose:  { name: "Caboose", len: 125, color: "#E63946" }
  };
  // Where the driver's controls sit on each engine (units from the front end / above the rail):
  // the throttle in the cab is a quadrant lever: it pivots at (x, y) near the cab floor, its arm is r long,
  // it lies flat pointing forward at Stop and stands straight up at Fast. The whistle (or horn) has a pull
  // handle at (hx, hy); the headlight is the lamp.
  var CTRL = {
    steam:    { lever: { x: 158, y: -56, r: 38 }, whistle: { x: 98, y: -128, hx: 96, hy: -90, cord: true }, lamp: { x: 10, y: -92, r: 9 }, stack: { x: 33, y: -142 } },
    diesel:   { lever: { x: 54, y: -56, r: 30 }, whistle: { x: 36, y: -146, hx: 36, hy: -140 }, lamp: { x: 8, y: -60, r: 8 }, stack: { x: 70, y: -106, diesel: true } },
    electric: { lever: { x: 70, y: -56, r: 34 }, whistle: { x: 30, y: -144, hx: 30, hy: -138 }, lamp: { x: 10, y: -56, r: 7 } },
    fast:     { lever: { x: 92, y: -60, r: 28 }, whistle: { x: 112, y: -138, hx: 112, hy: -132 }, lamp: { x: 16, y: -74, r: 8 } }
  };
  var ENGINES = ["steam", "diesel", "electric", "fast"];
  var CARS = ["boxcar", "tanker", "hopper", "logs", "pipes", "boxes", "passenger", "coal", "caboose"];
  var STYLES = ["plain", "stripe", "dots", "zigzag"];
  var MAXP = 12;
  var GAP = 14; // coupler gap between pieces (build units)
  var PH = 185; // piece height (units) used for framing and hit boxes

  // ---------- Saved state ----------
  // speed is the lever (0 = Stop). ran: he has moved the train once (the coach line and ghost hand move on).
  var state = { pieces: [], night: false, speed: 0, tab: "engines", sel: -1, ran: false };
  // Opened from the Toybox home screen: an empty track and first-visit choices (nothing here is a collection).
  var startFresh = !!(window.Toybox && Toybox.fresh());
  (function load() {
    if (startFresh) return;
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (o && typeof o === "object") {
        if (Array.isArray(o.pieces)) {
          o.pieces.forEach(function (p) {
            if (p && TYPES[p.t] && state.pieces.length < MAXP) {
              state.pieces.push({ t: p.t, color: COLORS.indexOf(p.color) >= 0 || p.color === "#FFFFFF" || p.color === "#9AA3AF" ? p.color : TYPES[p.t].color,
                style: STYLES.indexOf(p.style) >= 0 ? p.style : "plain", num: (p.num | 0) >= 1 && (p.num | 0) <= 9 ? p.num | 0 : 1 });
            }
          });
        }
        state.night = !!o.night;
        if (typeof o.speed === "number") state.speed = clamp(o.speed, 0, 1);
        var tab = o.tab === "track" ? "cars" : o.tab; // older saves had a Track tab (the map view, gone now)
        if (["engines", "cars", "paint"].indexOf(tab) >= 0) state.tab = tab;
        if (typeof o.sel === "number" && o.sel >= 0 && o.sel < state.pieces.length) state.sel = o.sel;
        state.ran = !!o.ran;
      }
    } catch (e) { /* defaults */ }
  })();
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ v: 2, pieces: state.pieces.map(function (p) { return { t: p.t, color: p.color, style: p.style, num: p.num }; }),
        night: state.night, speed: state.speed, tab: state.tab, sel: state.sel, ran: state.ran }));
    } catch (e) { /* ignore */ }
  }
  if (startFresh) save();

  // ---------- Sound (only when the grown-up turned it on) ----------
  function ac() { return Toybox.sound.ready(); }
  function tone(ctx, type, f0, f1, t0, dur, vol) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function sClunk() {
    var ctx = ac(); if (!ctx) return;
    var t = ctx.currentTime;
    tone(ctx, "sine", 150, 55, t, 0.22, 0.22);
    tone(ctx, "triangle", 420, 180, t, 0.07, 0.06);
  }
  function sWhistle() {
    var ctx = ac(); if (!ctx) return;
    var t = ctx.currentTime, d = 1.1;
    [523, 659, 784].forEach(function (f) {
      var o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      lfo.frequency.value = 5.5; lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.045, t + 0.08);
      g.gain.setValueAtTime(0.045, t + d - 0.3);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); lfo.start(t); o.stop(t + d + 0.05); lfo.stop(t + d + 0.05);
    });
  }
  function sHorn() {
    var ctx = ac(); if (!ctx) return;
    var t = ctx.currentTime;
    [311, 392].forEach(function (f) { tone(ctx, "triangle", f, f, t, 0.8, 0.05); });
  }
  function sPoof() { var ctx = ac(); if (!ctx) return; tone(ctx, "sine", 700, 200, ctx.currentTime, 0.25, 0.08); }
  function sClick() { var ctx = ac(); if (!ctx) return; tone(ctx, "square", 900, 600, ctx.currentTime, 0.05, 0.03); }
  function sDing() { var ctx = ac(); if (!ctx) return; tone(ctx, "sine", 988, 980, ctx.currentTime, 0.35, 0.04); }
  function sChime() {
    var ctx = ac(); if (!ctx) return;
    var t = ctx.currentTime;
    tone(ctx, "sine", 659, 659, t, 0.5, 0.06); tone(ctx, "sine", 523, 523, t + 0.25, 0.7, 0.06);
  }
  // A soft "chuff": a short puff of filtered noise, once per half turn of the driving wheels.
  var noiseBuf = null, noiseCtx = null;
  function sChuff(vol) {
    var ctx = ac(); if (!ctx) return;
    if (!noiseBuf || noiseCtx !== ctx) {
      noiseCtx = ctx;
      noiseBuf = ctx.createBuffer(1, Math.round(ctx.sampleRate * 0.12), ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    }
    var src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain(), t = ctx.currentTime;
    src.buffer = noiseBuf; bp.type = "bandpass"; bp.frequency.value = 520; bp.Q.value = 0.7;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t);
  }

  // ---------- Drawing helpers ----------
  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }
  function trim(c, color, lw) { c.fillStyle = color; c.fill(); c.lineWidth = lw || 5; c.strokeStyle = OUT; c.stroke(); }
  // Fill the current path with the piece color and its style pattern, then outline it.
  function body(c, p, x, y, w, h) {
    c.fillStyle = p.color; c.fill();
    if (p.style !== "plain") {
      c.save(); c.clip();
      var alt = isDark(p.color) ? "#FFFFFF" : (p.color === "#FFFFFF" ? "#E63946" : OUT);
      c.fillStyle = alt; c.strokeStyle = alt;
      if (p.style === "stripe") { c.fillRect(x - 5, y + h * 0.55, w + 10, h * 0.14); c.globalAlpha = 0.6; c.fillRect(x - 5, y + h * 0.75, w + 10, h * 0.06); }
      else if (p.style === "dots") {
        c.globalAlpha = 0.85;
        for (var i = 0; i * 26 < w + 30; i++) for (var j = 0; j * 26 < h + 30; j++) {
          c.beginPath(); c.arc(x + i * 26 + (j % 2 ? 13 : 0), y + 8 + j * 26, 5, 0, TAU); c.fill();
        }
      } else if (p.style === "zigzag") {
        c.lineWidth = 7; c.lineJoin = "miter"; c.beginPath();
        for (var k = 0; k * 20 <= w + 20; k++) c.lineTo(x + k * 20, y + h * 0.55 + (k % 2 ? -12 : 12));
        c.stroke();
      }
      c.restore();
    }
    c.lineWidth = 5; c.strokeStyle = OUT; c.lineJoin = "round"; c.stroke();
  }
  function wheel(c, x, y, r, spin) {
    c.beginPath(); c.arc(x, y, r, 0, TAU); trim(c, "#4A5578", 4);
    c.beginPath(); c.arc(x, y, r * 0.55, 0, TAU); c.fillStyle = "#C9D3E6"; c.fill();
    c.strokeStyle = OUT; c.lineWidth = 3; c.beginPath();
    c.moveTo(x, y); c.lineTo(x + Math.cos(spin) * r * 0.8, y + Math.sin(spin) * r * 0.8); c.stroke();
    c.beginPath(); c.arc(x, y, 3.5, 0, TAU); c.fillStyle = OUT; c.fill();
  }
  // Car numbers are not drawn (no numbers on the trains). p.num stays in saves.
  function decal() {}
  function win(c, x, y, w, h, lit) { rr(c, x, y, w, h, 5); trim(c, lit ? "#FFE680" : "#BEE9FF", 4); }
  function truck(c, x0, len, y, spin, r) {
    r = r || 15;
    wheel(c, x0 + len * 0.17, y - r, r, spin); wheel(c, x0 + len * 0.17 + r * 2.3, y - r, r, spin);
    wheel(c, x0 + len * 0.83, y - r, r, spin); wheel(c, x0 + len * 0.83 - r * 2.3, y - r, r, spin);
  }
  function couplers(c, x0, len, y) {
    c.fillStyle = "#4A5578"; c.strokeStyle = OUT; c.lineWidth = 3;
    c.fillRect(x0 - 9, y - 30, 12, 10); c.strokeRect(x0 - 9, y - 30, 12, 10);
    c.fillRect(x0 + len - 3, y - 30, 12, 10); c.strokeRect(x0 + len - 3, y - 30, 12, 10);

  Array.prototype.forEach.call(document.querySelectorAll(".tab[data-tab]"), function (b) {
    b.addEventListener("click", function () { if (!Toybox.timer.locked()) setTab(b.dataset.tab); });
  });
  var goShown = null;
  function updateGo() {
    var show = engIdx() >= 0 && state.speed === 0 && !moving && !ending.on;
    if (show !== goShown) { goShown = show; $("go").hidden = !show; }
  }
  $("go").addEventListener("click", function () { if (!Toybox.timer.locked() && engIdx() >= 0) { setSpeed(0.5, true); save(); ghostDone("run"); } });
  $("newBtn").addEventListener("click", function () {
    if (Toybox.timer.locked()) return;
    clearTrain(); setTab("engines"); focus("rear");
  });
  // Surprise: a random train rolls in, one piece after another.
  var surpriseT = [];
  $("surprise").addEventListener("click", function () {
    if (Toybox.timer.locked()) return;
    surpriseT.forEach(clearTimeout); surpriseT = [];
    state.speed = 0; clearTrain();
    var picks = [ENGINES[Math.floor(Math.random() * ENGINES.length)]];
    var n = 3 + Math.floor(Math.random() * 3);
    for (var i = 0; i < n; i++) picks.push(CARS[Math.floor(Math.random() * (CARS.length - 1))]);
    if (Math.random() < 0.7) picks.push("caboose");
    setTab("cars");
    picks.forEach(function (t, i) {
      surpriseT.push(setTimeout(function () {
        if (Toybox.timer.locked()) return;
        if (addPiece(t, undefined, false)) {
          var a = anim[anim.length - 1];
          a.p.color = COLORS[Math.floor(Math.random() * COLORS.length)];
          if (TYPES[t].eng && t === "fast") a.p.color = "#FFFFFF";
          a.p.style = STYLES[Math.floor(Math.random() * STYLES.length)];
          save();
        }
      }, 200 + i * 650));
    });
  });

  // Paint pane
  COLORS.concat(["#FFFFFF"]).forEach(function (col) {
    var b = document.createElement("button");
    b.className = "btn sw"; b.style.background = col; b.dataset.color = col; b.setAttribute("aria-label", "Color");
    b.addEventListener("click", function () { paint({ color: col }); });
    $("swatches").appendChild(b);
  });
  STYLES.forEach(function (st) {
    var b = document.createElement("button");
    b.className = "btn st"; b.dataset.style = st; b.setAttribute("aria-label", st);
    var c = document.createElement("canvas"); b.appendChild(c);
    b._draw = function () {
      thumb(c, function (cc, w, h) {
        var col = selPiece() ? selPiece().color : "#E63946";
        rr(cc, 4, 4, w - 8, h - 8, 6);
        body(cc, { color: col, style: st }, 4, 4, w - 8, h - 8);
      });
    };
    b.addEventListener("click", function () { paint({ style: st }); });
    $("styles").appendChild(b);
  });
  function renderStyles() {
    Array.prototype.forEach.call(document.querySelectorAll(".st"), function (b) { if (b.offsetParent && b._draw) b._draw(); });
  }
  function selPiece() { return state.sel >= 0 && state.sel < state.pieces.length ? state.pieces[state.sel] : null; }
  function paint(ch) {
    if (Toybox.timer.locked()) return;
    if (!selPiece()) { if (!state.pieces.length) return; state.sel = state.pieces.length - 1; }
    var p = selPiece();
    for (var k in ch) p[k] = ch[k];
    var a = anim[state.sel]; if (a) a.jig = 1;
    if (a) {
      var x = pieceSX(a) + TYPES[p.t].len / 2 * cam.s;
      for (var i = 0; i < 12; i++) { var ang = rand(0, TAU), sp = rand(100, 300); fx.push({ k: "bit", x: x, y: view.gy - 80 * cam.s, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 150, t: 0, life: 0.7, r: rand(5, 10), c: p.color }); }
    }
    sClick(); save(); refreshPaint();
  }
  function refreshPaint() {
    var p = selPiece();
    if (!p && state.pieces.length && state.tab === "paint") { state.sel = state.pieces.length - 1; p = selPiece(); }
    $("paintHint").textContent = p ? "Painting the " + TYPES[p.t].name.toLowerCase() : "Add a train car first.";
    Array.prototype.forEach.call(document.querySelectorAll(".sw"), function (b) { b.setAttribute("aria-pressed", String(!!p && b.dataset.color === p.color)); });
    Array.prototype.forEach.call(document.querySelectorAll(".st"), function (b) { b.setAttribute("aria-pressed", String(!!p && b.dataset.style === p.style)); if (b.offsetParent && b._draw) b._draw(); });
  }

  // ---------- Coach line ----------
  function coachText() {
    if (moving || state.speed > 0) return "";
    if (engIdx() < 0) return "Drag an engine onto the track!";
    if (!carCount()) return "Drag a car onto the train!";
    if (!state.ran) return "Push the lever up!";
    return "";
  }
  var phoneCoach = window.matchMedia ? window.matchMedia("(max-width: 600px), (orientation: landscape) and (max-height: 520px)") : null;
  function updateCoach() {
    var el = $("coach"), txt = coachText();
    if (txt) el.textContent = txt;
    el.classList.toggle("off", !txt);
    // Phones put the pill at the bottom of the stage: keep it just above the yard strip, not over the cars.
    el.style.bottom = phoneCoach && phoneCoach.matches ? (view.stripH + 8) + "px" : "";
  }

  // ---------- iOS zoom guards ----------
  ["gesturestart", "gesturechange"].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // ---------- Timer ending: the train slows to a stop and the lights dim ----------
  function onEnding(done) {
    ending.on = true; ending.dim = 0; ending.t = 0; ending.done = done;
    if (!state.pieces.length || !moving) { ending.done = null; setTimeout(done, 1800); }
    updateGo();
  }
  function restArt() {
    return '<svg class="rest-art" viewBox="0 0 300 200" aria-hidden="true">' +
      '<rect x="0" y="0" width="300" height="200" rx="24" fill="#2B3B78"/>' +
      '<circle cx="240" cy="44" r="22" fill="#FFF3A0"/><circle cx="250" cy="38" r="20" fill="#2B3B78"/>' +
      '<rect x="0" y="150" width="300" height="50" fill="#2C5A3E"/>' +
      '<rect x="150" y="70" width="120" height="58" rx="6" fill="#E63946" stroke="#1D2340" stroke-width="5"/>' +
      '<rect x="140" y="58" width="140" height="18" rx="6" fill="#8B5A3C" stroke="#1D2340" stroke-width="5"/>' +
      '<rect x="196" y="96" width="28" height="32" fill="#FFE680" stroke="#1D2340" stroke-width="4"/>' +
      '<rect x="0" y="146" width="300" height="8" fill="#5B6478"/>' +
      '<rect x="30" y="92" width="80" height="44" rx="18" fill="#26282E" stroke="#1D2340" stroke-width="5"/>' +
      '<rect x="92" y="78" width="40" height="58" rx="5" fill="#26282E" stroke="#1D2340" stroke-width="5"/>' +
      '<rect x="100" y="86" width="24" height="18" rx="3" fill="#FFE680" stroke="#1D2340" stroke-width="3"/>' +
      '<rect x="38" y="70" width="18" height="24" fill="#26282E" stroke="#1D2340" stroke-width="5"/>' +
      '<circle cx="54" cy="142" r="12" fill="#4A5578" stroke="#1D2340" stroke-width="4"/><circle cx="88" cy="142" r="12" fill="#4A5578" stroke="#1D2340" stroke-width="4"/><circle cx="118" cy="142" r="10" fill="#4A5578" stroke="#1D2340" stroke-width="4"/>' +
      '<text x="62" y="52" font-size="26" font-weight="800" fill="#FFFFFF" font-family="sans-serif">z z</text></svg>';
  }

  // ---------- Ghost hand (same look as Bulldozer and Measuring) ----------
  // After a few quiet seconds, a see-through hand shows the main move once. A touch re-arms it, it shows
  // at most twice per visit, and never again once the child has done the move (ghost.learned()).
  // plan() returns { pts: [[x, y], ...] in page px, tap: true for a tap, carry: { html, size } for a see-through
  // thing under the finger (a gear being dragged), dur: ms } or null when there is nothing to show.
  function makeGhost(plan, opt) {
    opt = opt || {};
    var IDLE = opt.idle || 4500, MAX = opt.max || 2;
    var last = Date.now(), shown = 0, armed = true, learned = false, run = null, el = null;
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    function build() {
      el = document.createElement("div");
      el.className = "ghosthand";
      el.setAttribute("aria-hidden", "true");
      el.innerHTML = '<svg viewBox="-24 -18 64 84"><circle class="gh-press" cx="0" cy="0" r="17" fill="rgba(255,201,60,0.55)"/>' +
        '<g fill="#FFFFFF" stroke="#1D2340" stroke-width="3" stroke-linejoin="round">' +
        '<rect x="-9" y="-6" width="18" height="40" rx="9"/><rect x="-12" y="22" width="44" height="40" rx="16"/>' +
        '<rect x="10" y="14" width="14" height="24" rx="7"/></g>' +
        '<circle cx="0" cy="2" r="5" fill="rgba(255,201,60,0.9)"/></svg>';
      el.insertBefore(carryEl, el.firstChild);
      document.body.appendChild(el);
    }
    function stop() { run = null; if (el) { el.style.display = "none"; carryEl.innerHTML = ""; } }
    var carryEl = document.createElement("div");
    carryEl.className = "gh-carry";
    function poke() { last = Date.now(); armed = true; if (run) stop(); }
    document.addEventListener("pointerdown", poke, true);
    document.addEventListener("keydown", poke, true);
    function blocked() {
      if (document.hidden) return true;
      if (window.Toybox && (Toybox.sheetOpen() || Toybox.timer.phase() === "ending" || Toybox.timer.phase() === "resting")) return true;
      return !!(opt.ok && !opt.ok());
    }
    function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function at(pts, f) {
      if (pts.length < 2) return pts[0];
      var segs = [], tot = 0, i;
      for (i = 1; i < pts.length; i++) { var l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); tot += l; }
      var d = f * tot;
      for (i = 0; i < segs.length; i++) {
        if (d <= segs[i] || i === segs.length - 1) { var t = segs[i] ? Math.min(1, d / segs[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; }
        d -= segs[i];
      }
      return pts[pts.length - 1];
    }
    function frame() {
      if (!run) return;
      var t = (Date.now() - run.t0) / run.dur, p = run.p, s = run.s, x, y, a, press, sc = 1;
      if (t >= 1) { stop(); return; }
      if (p.tap || p.pts.length < 2) {
        var pt = p.pts[0];
        x = pt[0]; y = pt[1];
        a = t < 0.15 ? t / 0.15 : (t > 0.85 ? (1 - t) / 0.15 : 1);
        press = (t > 0.3 && t < 0.42) || (t > 0.55 && t < 0.67);
        sc = press ? 0.92 : 1;
        if (t < 0.3) { var k = 1 - t / 0.3; x += 26 * s * k; y += 30 * s * k; }
      } else {
        a = t < 0.1 ? t / 0.1 : (t > 0.9 ? (1 - t) / 0.1 : 1);
        var f = reduce ? 0.5 : ease(Math.max(0, Math.min(1, (t - 0.16) / 0.66)));
        var q = at(p.pts, f); x = q[0]; y = q[1];
        press = t > 0.12 && t < 0.86;
        sc = t < 0.12 ? 1.12 - 0.12 * (t / 0.12) : 1;
      }
      el.style.opacity = (0.85 * a).toFixed(3);
      el.style.transform = "translate(" + (x - 24 * s) + "px," + (y - 18 * s) + "px) rotate(-14deg) scale(" + sc + ")";
      el.lastChild.firstChild.style.opacity = press ? "1" : "0";
      carryEl.style.opacity = press ? "0.75" : "0";
      requestAnimationFrame(frame);
    }
    function show(p) {
      if (!el) build();
      var s = Math.max(1, Math.min(1.7, Math.min(innerWidth, innerHeight) / 360));
      el.style.width = (64 * s) + "px"; el.style.height = (84 * s) + "px";
      el.style.transformOrigin = (24 * s) + "px " + (18 * s) + "px";
      el.style.display = "block";
      carryEl.innerHTML = p.carry ? p.carry.html : "";
      if (p.carry) {
        var c = p.carry.size;
        carryEl.style.cssText = "position:absolute;left:" + (24 * s - c / 2) + "px;top:" + (18 * s - c / 2) + "px;width:" + c + "px;height:" + c + "px";
      }
      run = { p: p, s: s, t0: Date.now(), dur: p.dur || (p.tap ? 2400 : 3200) };
      requestAnimationFrame(frame);
    }
    setInterval(function () {
      if (run || learned || !armed || shown >= MAX || Date.now() - last < IDLE) return;
      if (blocked()) { last = Date.now(); return; }
      var p = plan();
      if (!p || !p.pts || !p.pts.length) return;
      armed = false; shown++;
      show(p);
    }, 250);
    return {
      learned: function () { learned = true; stop(); },
      // something new to show (a new mode): allow the hint again
      again: function () { learned = false; shown = 0; armed = true; last = Date.now(); },
      poke: poke,
      // test hook: show it now
      show: function () { var p = plan(); if (p) show(p); return !!p; }
    };
  }
  // Page px of a point inside an element, as fractions of its box.
  function ghostPt(elm, fx, fy) {
    var r = elm.getBoundingClientRect();
    return [r.left + r.width * fx, r.top + r.height * fy];
  }
  // What the hand shows depends on where he is: an engine first, then a car, then the lever.
  function ghostPhase() {
    if (engIdx() < 0) return "engine";
    if (!carCount()) return "car";
    if (!state.ran) return "run";
    return "done";
  }
  var ghostSeen = ghostPhase();
  function tabBtn(name) { return document.querySelector('.tab[data-tab="' + name + '"]'); }
  var ghost = makeGhost(function () {
    if (Toybox.timer.locked() || moving || yard.v < 0.95 || carry) return null;
    var ph = ghostPhase(), r = cv.getBoundingClientRect();
    function P(x, y) { return [r.left + x, r.top + y]; }
    if (ph === "done") return null;
    if (ph === "run") {
      var cp = ctrlPos(); if (!cp) return null;
      if (cp.lever.x < 10 || cp.lever.x > W - 10) return { pts: [ghostPt($("go"), 0.5, 0.5)], tap: true };
      var lv = cp.lever, arc = [P(lv.x, lv.ky)];
      for (var q = 1; q <= 3; q++) { var th = Math.max(state.speed, q * 0.27) * Math.PI / 2; arc.push(P(lv.px - Math.cos(th) * lv.r, lv.py - Math.sin(th) * lv.r)); }
      return { pts: arc, dur: 3000 };
    }
    var wantTab = ph === "engine" ? "engines" : "cars";
    if (state.tab !== wantTab && !(ph === "car" && state.tab === "paint")) return { pts: [ghostPt(tabBtn(wantTab), 0.5, 0.5)], tap: true };
    if (state.tab === "paint") return { pts: [ghostPt(tabBtn("cars"), 0.5, 0.5)], tap: true };
    var y = yardLayout(), i = 0;
    while (i < y.items.length - 1 && y.xs[i] - y.scroll + TYPES[y.items[i]].len * view.ys > W - 10) i++;
    var X = y.xs[i] - y.scroll + TYPES[y.items[i]].len * view.ys / 2, Y = yardRail() - 70 * view.ys;
    var tx, ty;
    if (anim.length) { var lastA = anim[anim.length - 1]; tx = clamp(pieceSX(lastA) + (TYPES[lastA.p.t].len + 60) * cam.s, 40, W - 40); ty = view.gy - 70 * cam.s; }
    else { tx = W / 2; ty = view.gy - 70 * cam.s; }
    var size = Math.round(clamp(TYPES[y.items[i]].len * view.ys * 1.1, 70, 170));
    return { pts: [P(X, Y), P(tx, ty)], dur: 3400, carry: { html: pieceHTML(y.items[i], size), size: size } };
  }, { max: 2 });
  function ghostDone(what) {
    // He did the move: the hand may show the next one after a quiet spell.
    var ph = ghostPhase();
    if (ph !== ghostSeen) { ghostSeen = ph; ghost.again(); }
    if (what === "run") ghost.poke();
  }
  setInterval(function () { var ph = ghostPhase(); if (ph !== ghostSeen) { ghostSeen = ph; ghost.again(); } }, 1000);

  // ---------- Start ----------
  $("count").textContent = counterText();
  setTab(state.tab === "paint" && !state.pieces.length ? "engines" : state.tab);
  resize();
  cam.s = cam.sT; cam.rel = cam.relT;
  updateCoach(); updateGo();
  requestAnimationFrame(frame);

  Toybox.init({
    app: "train-builder",
    orientation: "landscape",
    badge: $("tbadge"),
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the train slows to a stop and rests, and the controls lock.",
    goodbyeOption: "End with a Goodbye toot button to press",
    farewellText: "Last stop!",
    goodbyeLabel: "Goodbye toot",
    farewellDone: "Bye bye, train!",
    restLine: "The train is resting.",
    restLine2: "It will be right here next time.",
    restArt: restArt,
    soundNote: "Soft chuffs, clunks, a whistle and a station bell. Hold for 2 seconds.",
    endingMaxMs: 20000,
    onEnding: onEnding,
    onGoodbye: function () { train.toot = TOOT_T; sWhistle(); },
    onWake: function () { ending.on = false; ending.dim = 0; ending.done = null; updateGo(); updateCoach(); },
    onBig: function () { setTimeout(resize, 30); },
    onSound: function (on) { if (on) setTimeout(sChime, 60); }
  });
  stage.appendChild($("tb-farewell"));
  if (/[?&]debug\b/.test(location.search)) window.__train = { state: state, train: train, cam: cam, view: view, anim: anim, add: addPiece, ghost: ghost,
    ctrl: function () { var cp = ctrlPos(), r = cv.getBoundingClientRect(); if (!cp) return null; return { lever: { x: r.left + cp.lever.x, ky: r.top + cp.lever.ky, y0: r.top + cp.lever.y0, y1: r.top + cp.lever.y1, px: r.left + cp.lever.px, py: r.top + cp.lever.py, r: cp.lever.r }, whistle: { x: r.left + cp.whistle.x, y: r.top + cp.whistle.y }, lamp: { x: r.left + cp.lamp.x, y: r.top + cp.lamp.y } }; },
    yardItem: function (i) { var y = yardLayout(), r = cv.getBoundingClientRect(); return { x: r.left + y.xs[i] - y.scroll + TYPES[y.items[i]].len * view.ys / 2, y: r.top + yardRail() - 60 * view.ys }; },
    rail: function () { var r = cv.getBoundingClientRect(); return { y: r.top + view.gy, x: r.left + W / 2 }; },
    piecePos: function (i) { var a = anim[i], r = cv.getBoundingClientRect(); return { x: r.left + pieceSX(a) + TYPES[a.p.t].len / 2 * cam.s, y: r.top + view.gy - 50 * cam.s }; } };
})();
</script>
