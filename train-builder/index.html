<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Train Builder</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Train Builder">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F; --panel: #1C3157; --ink: #EEF3FF; --muted: #B4C1DE; --edge: #9FB8E8; --plate: #E6F2FF; --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
.stage { background: #7CC95A; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#count { transition: transform 0.1s ease; }
#count.pop { animation: pop 0.35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 2; }

/* Go row: the green Go! (it reads Stop while the train runs) and Toot!. Hidden until there is an engine. */
.gorow { display: flex; gap: 8px; }
.gorow[hidden] { display: none; }
.gorow .tb-go { flex: 1 1 auto; min-width: 0; }
.btn.tb-go.stop { background: #E63946; }
.btn.toot { flex: 0 0 auto; min-width: 96px; background: #FFC93C; color: #1D2340; font-weight: 800; font-size: 1.35rem; }
.btn.toot.pop { animation: pop 0.35s cubic-bezier(.3, 1.6, .5, 1); }

/* Choices: one pane at a time (the picked tab, or the tapped car's colors). */
.tb-panel .panel-body.tb-choices { display: block; min-height: 0; }
[data-pane] { display: none; }
.tb-panel[data-tab="engines"] [data-pane="engines"],
.tb-panel[data-tab="cars"] [data-pane="cars"],
.tb-panel[data-tab="track"] [data-pane="track"] { display: grid; }
.tb-panel[data-tab="sel"] [data-pane="sel"] { display: flex; }
.tb-tabs .tab[aria-selected="true"] { background: var(--accent); color: #1D2340; }
.picks { grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 8px; }
#engPicks { --cols: 4; }
#carPicks { --cols: 5; }
#trackPicks { --cols: 3; }
.pick {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  padding: 4px 2px 2px; min-height: 70px; font-size: 0.95rem; line-height: 1.05;
  background: var(--plate); color: #1D2340;
}
.pick canvas { width: 100%; height: 44px; display: block; pointer-events: none; }
.pick span { white-space: nowrap; overflow: hidden; max-width: 100%; }
.pick.hop { animation: hop 0.3s ease; }
@keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-8px); } 100% { transform: translateY(0); } }
.pick[aria-pressed="true"] { background: var(--accent); }
/* The tapped car: its picture, Take off, Done, then its colors. */
#selPane { flex-direction: column; gap: 8px; }
.selhead { display: flex; gap: 8px; align-items: stretch; }
.selpic { flex: 1 1 auto; min-width: 0; height: 52px; border: 3px solid #1D2340; border-radius: 14px; background: #FFF4C2; position: relative; }
.selpic canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.selhead .btn { flex: 0 0 auto; min-height: 52px; font-size: 1.05rem; padding: 0 0.7rem; }
.btn.takeoff { background: #FFFFFF; color: #1D2340; }
.btn.seldone { background: #2EA05A; color: #FFFFFF; }
.swatches { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.sw { height: 44px; min-height: 44px; padding: 0; border-radius: 12px; }
.sw[aria-pressed="true"] { outline: 4px solid var(--focus); outline-offset: 1px; }

/* Big mode: the panel goes away. */
body.big .tb-panel { display: none; }

/* Tablets */
@media (min-width: 700px) and (min-height: 700px) {
  .pick { min-height: 96px; font-size: 1.1rem; }
  .pick canvas { height: 62px; }
  .sw { height: 56px; min-height: 56px; }
  .selpic { height: 64px; }
  .selhead .btn { min-height: 64px; font-size: 1.2rem; }
  .btn.toot { min-width: 130px; font-size: 1.6rem; }
}
@media (orientation: landscape) and (min-width: 1000px) and (min-height: 700px) {
  .tb-body .tb-panel { width: min(36%, 420px); }
  .picks { grid-auto-rows: minmax(118px, auto); }
  .tb-tabs .btn { font-size: 1rem; padding: 0.15rem 0.2rem; }
}
@media (orientation: portrait) and (min-width: 700px) {
  #trackPicks { --cols: 6; }
}
/* Landscape: the panel is a column on the right. */
@media (orientation: landscape) {
  #engPicks { --cols: 2; }
  #carPicks { --cols: 3; }
  .tb-tabs .btn { padding: 0.15rem 0.2rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: 316px; padding: 6px; gap: 6px; }
  .tb-tabs { gap: 4px; }
  .tb-tabs .btn { flex: 1 1 auto; min-height: 44px; font-size: 0.86rem; padding: 0.1rem 0.15rem; }
  .btn.tb-go { min-height: 48px; font-size: 1.25rem; }
  .btn.toot { min-height: 48px; min-width: 84px; font-size: 1.15rem; }
  .picks { gap: 6px; }
  .pick { min-height: 56px; font-size: 0.85rem; padding: 2px; }
  .pick canvas { height: 30px; }
  #engPicks .pick { min-height: 66px; }
  #engPicks .pick canvas { height: 40px; }
  .selpic { height: 46px; }
  .selhead .btn { min-height: 46px; font-size: 0.95rem; padding: 0 0.5rem; }
  .sw { height: 40px; min-height: 40px; }
}
@media (max-width: 480px) {
  .pick { min-height: 62px; font-size: 0.8rem; }
  .pick canvas { height: 36px; }
  .selhead .btn { font-size: 0.95rem; padding: 0 0.5rem; }
}
@media (prefers-reduced-motion: reduce) {
  #count.pop, .pick.hop, .btn.toot.pop { animation: none; }
}
/* Ghost hand: a see-through hand that shows the main move once (same look in every app). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Train Builder</h1>
    <button class="btn tb-iconbtn" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" aria-label="The train set"></canvas>
      <div class="tb-counter" id="count">Cars: 0</div>
      <div class="tb-coach" id="coach">Tap an engine!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" hidden></svg>
    </main>

    <section class="tb-panel" id="panel" data-tab="engines">
      <div class="gorow" id="gorow" hidden>
        <button class="btn tb-go" id="go">Go!</button>
        <button class="btn toot" id="toot">Toot!</button>
      </div>
      <div class="tb-choices panel-body">
        <div data-pane="engines" class="picks" id="engPicks"></div>
        <div data-pane="cars" class="picks" id="carPicks"></div>
        <div data-pane="track" class="picks" id="trackPicks"></div>
        <div data-pane="sel" id="selPane">
          <div class="selhead">
            <div class="selpic"><canvas id="selPic"></canvas></div>
            <button class="btn takeoff" id="takeOff">Take off</button>
            <button class="btn seldone" id="selDone">Done</button>
          </div>
          <div class="swatches" id="swatches"></div>
        </div>
      </div>
      <nav class="tb-tabs" role="tablist" aria-label="Controls">
        <button class="btn tab" role="tab" data-tab="engines">Engines</button>
        <button class="btn tab" role="tab" data-tab="cars">Cars</button>
        <button class="btn tab" role="tab" data-tab="track">Track</button>
        <button class="btn tb-new" id="newBtn">New</button>
        <button class="btn tb-surprise" id="surprise">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";
  var OUT = "#1D2340";
  var KEY = "trainbuilder-v1";
  var TAU = Math.PI * 2;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // Paint colors for the tapped car (ten swatches). Older saves may hold a few more; they still load.
  var COLORS = ["#E63946", "#F77F00", "#FFC93C", "#A7D129", "#2E9E5B", "#1FA6A0", "#5BC0EB", "#2D5BD7", "#7B4FC9", "#F26CA7"];
  var OKCOLORS = COLORS.concat(["#8B5A3C", "#26282E", "#FFFFFF", "#9AA3AF"]);
  function rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function shade(h, f) {
    var c = rgb(h);
    var t = f < 0 ? 0 : 255, k = Math.abs(f);
    return "rgb(" + c.map(function (v) { return Math.round(v + (t - v) * k); }).join(",") + ")";
  }
  function isDark(h) { var c = rgb(h); return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) < 120; }

  // ---------- Piece catalog ----------
  // len: side-view length in picture units (the run uses RSC of it). eng: an engine.
  var TYPES = {
    steam:    { name: "Steam", len: 250, eng: true, color: "#26282E" },
    diesel:   { name: "Diesel", len: 180, eng: true, color: "#FFC93C" },
    electric: { name: "Electric", len: 180, eng: true, color: "#2D5BD7" },
    fast:     { name: "High-speed", len: 220, eng: true, color: "#FFFFFF" },
    boxcar:   { name: "Boxcar", len: 160, color: "#E63946" },
    tanker:   { name: "Tanker", len: 160, color: "#9AA3AF" },
    hopper:   { name: "Hopper", len: 145, color: "#2E9E5B" },
    logs:     { name: "Logs", len: 165, color: "#8B5A3C" },
    pipes:    { name: "Pipes", len: 165, color: "#2D5BD7" },
    boxes:    { name: "Containers", len: 165, color: "#7B4FC9" },
    passenger:{ name: "Passenger", len: 180, color: "#1FA6A0" },
    coal:     { name: "Coal", len: 130, color: "#F77F00" },
    caboose:  { name: "Caboose", len: 125, color: "#E63946" }
  };
  var ENGINES = ["steam", "diesel", "electric", "fast"];
  var CARS = ["boxcar", "tanker", "hopper", "logs", "pipes", "boxes", "passenger", "coal", "caboose"];
  var STYLES = ["plain", "stripe", "dots", "zigzag"];
  var MAXP = 12;

  // ---------- Saved state ----------
  // pieces: front to back. go: he pressed Go (the train runs its loop and stops at the station each time round).
  var state = { pieces: [], layout: "oval", night: false, fast: false, tab: "engines", go: false };
  // Opened from the Toybox home screen: an empty track and first-visit choices (nothing here is a collection).
  var startFresh = !!(window.Toybox && Toybox.fresh());
  function mkPiece(t, color, style, num) {
    return { t: t, color: color || TYPES[t].color, style: style || "plain", num: num || 1, extra: 0, lead: 0, jig: 0 };
  }
  (function load() {
    if (startFresh) return;
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (o && typeof o === "object") {
        if (Array.isArray(o.pieces)) {
          o.pieces.forEach(function (p) {
            if (p && TYPES[p.t] && state.pieces.length < MAXP) {
              state.pieces.push(mkPiece(p.t, OKCOLORS.indexOf(p.color) >= 0 ? p.color : TYPES[p.t].color,
                STYLES.indexOf(p.style) >= 0 ? p.style : "plain", (p.num | 0) >= 1 && (p.num | 0) <= 9 ? p.num | 0 : 1));
            }
          });
        }
        if (["oval", "eight", "switch"].indexOf(o.layout) >= 0) state.layout = o.layout;
        state.night = !!o.night;
        state.fast = o.fast === true;
        if (["engines", "cars", "track"].indexOf(o.tab) >= 0) state.tab = o.tab;
        state.go = o.v === 3 && !!o.go;
      }
    } catch (e) { /* defaults */ }
  })();
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ v: 3, pieces: state.pieces.map(function (p) { return { t: p.t, color: p.color, style: p.style, num: p.num }; }),
        layout: state.layout, night: state.night, fast: state.fast, tab: state.tab, go: state.go }));
    } catch (e) { /* ignore */ }
  }
  if (startFresh) save();

  // ---------- Sound (only when the grown-up turned it on) ----------
  function ac() { return Toybox.sound.ready(); }
  function tone(ctx, type, f0, f1, t0, dur, vol) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function sClunk() {
    var ctx = ac(); if (!ctx) return;
    var t = ctx.currentTime;
    tone(ctx, "sine", 150, 55, t, 0.22, 0.22);
    tone(ctx, "triangle", 420, 180, t, 0.07, 0.06);
  }
  function sWhistle() {
    var ctx = ac(); if (!ctx) return;
    var t = ctx.currentTime, d = 1.1;
    [523, 659, 784].forEach(function (f) {
      var o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      lfo.frequency.value = 5.5; lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.045, t + 0.08);
      g.gain.setValueAtTime(0.045, t + d - 0.3);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); lfo.start(t); o.stop(t + d + 0.05); lfo.stop(t + d + 0.05);
    });
  }
  function sPoof() { var ctx = ac(); if (!ctx) return; tone(ctx, "sine", 700, 200, ctx.currentTime, 0.25, 0.08); }
  function sClick() { var ctx = ac(); if (!ctx) return; tone(ctx, "square", 900, 600, ctx.currentTime, 0.05, 0.03); }
  function sDing() { var ctx = ac(); if (!ctx) return; tone(ctx, "sine", 988, 980, ctx.currentTime, 0.35, 0.04); }
  function sChime() {
    var ctx = ac(); if (!ctx) return;
    var t = ctx.currentTime;
    tone(ctx, "sine", 659, 659, t, 0.5, 0.06); tone(ctx, "sine", 523, 523, t + 0.25, 0.7, 0.06);
  }
  // A soft "chuff": a short puff of filtered noise, once per half turn of the driving wheels.
  var noiseBuf = null, noiseCtx = null;
  function sChuff(vol) {
    var ctx = ac(); if (!ctx) return;
    if (!noiseBuf || noiseCtx !== ctx) {
      noiseCtx = ctx;
      noiseBuf = ctx.createBuffer(1, Math.round(ctx.sampleRate * 0.12), ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    }
    var src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain(), t = ctx.currentTime;
    src.buffer = noiseBuf; bp.type = "bandpass"; bp.frequency.value = 520; bp.Q.value = 0.7;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t);
  }


  // ---------- Drawing helpers ----------
  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }
  function trim(c, color, lw) { c.fillStyle = color; c.fill(); c.lineWidth = lw || 5; c.strokeStyle = OUT; c.stroke(); }
  // Fill the current path with the piece color and its style pattern, then outline it.
  function body(c, p, x, y, w, h) {
    c.fillStyle = p.color; c.fill();
    if (p.style !== "plain") {
      c.save(); c.clip();
      var alt = isDark(p.color) ? "#FFFFFF" : (p.color === "#FFFFFF" ? "#E63946" : OUT);
      c.fillStyle = alt; c.strokeStyle = alt;
      if (p.style === "stripe") { c.fillRect(x - 5, y + h * 0.55, w + 10, h * 0.14); c.globalAlpha = 0.6; c.fillRect(x - 5, y + h * 0.75, w + 10, h * 0.06); }
      else if (p.style === "dots") {
        c.globalAlpha = 0.85;
        for (var i = 0; i * 26 < w + 30; i++) for (var j = 0; j * 26 < h + 30; j++) {
          c.beginPath(); c.arc(x + i * 26 + (j % 2 ? 13 : 0), y + 8 + j * 26, 5, 0, TAU); c.fill();
        }
      } else if (p.style === "zigzag") {
        c.lineWidth = 7; c.lineJoin = "miter"; c.beginPath();
        for (var k = 0; k * 20 <= w + 20; k++) c.lineTo(x + k * 20, y + h * 0.55 + (k % 2 ? -12 : 12));
        c.stroke();
      }
      c.restore();
    }
    c.lineWidth = 5; c.strokeStyle = OUT; c.lineJoin = "round"; c.stroke();
  }
  function wheel(c, x, y, r, spin) {
    c.beginPath(); c.arc(x, y, r, 0, TAU); trim(c, "#4A5578", 4);
    c.beginPath(); c.arc(x, y, r * 0.55, 0, TAU); c.fillStyle = "#C9D3E6"; c.fill();
    c.strokeStyle = OUT; c.lineWidth = 3; c.beginPath();
    c.moveTo(x, y); c.lineTo(x + Math.cos(spin) * r * 0.8, y + Math.sin(spin) * r * 0.8); c.stroke();
    c.beginPath(); c.arc(x, y, 3.5, 0, TAU); c.fillStyle = OUT; c.fill();
  }
  // Car numbers are no longer drawn (declutter: no numbers on the trains). p.num stays in saves.
  function decal() {}
  function win(c, x, y, w, h, lit) { rr(c, x, y, w, h, 5); trim(c, lit ? "#FFE680" : "#BEE9FF", 4); }
  function truck(c, x0, len, y, spin, r) {
    r = r || 15;
    wheel(c, x0 + len * 0.17, y - r, r, spin); wheel(c, x0 + len * 0.17 + r * 2.3, y - r, r, spin);
    wheel(c, x0 + len * 0.83, y - r, r, spin); wheel(c, x0 + len * 0.83 - r * 2.3, y - r, r, spin);
  }
  function couplers(c, x0, len, y) {
    c.fillStyle = "#4A5578"; c.strokeStyle = OUT; c.lineWidth = 3;
    c.fillRect(x0 - 9, y - 30, 12, 10); c.strokeRect(x0 - 9, y - 30, 12, 10);
    c.fillRect(x0 + len - 3, y - 30, 12, 10); c.strokeRect(x0 + len - 3, y - 30, 12, 10);
  }
  // Side view of one piece; x0 = front (left) end, gy = rail top. Faces left.
  function drawSide(c, p, x0, gy, spin, lit) {

  function counterText() { return "Cars: " + carCount(); }
  function bumpCount() {
    var el = $("count"), txt = counterText();
    if (el.textContent === txt) return;
    el.textContent = txt;
    el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  }

  // ---------- Coach line ----------
  function coachText() {
    if (!state.pieces.length) return "Tap an engine!";
    if (!hasEngine()) return "Add an engine!";
    if (!carCount()) return "Now add cars!";
    if (!state.go) return "Tap Go!";
    if (state.layout === "switch" && !flipped) return "Tap a yellow arrow!";
    if (!tooted) return "Tap the engine!";
    return "";
  }
  var coachT = 0;
  function updateCoach() {
    var el = $("coach"), txt = coachText();
    clearTimeout(coachT);
    if (txt) { el.textContent = txt; el.classList.remove("off"); }
    else el.classList.add("off");
  }

  // ---------- iOS zoom guards ----------
  ["gesturestart", "gesturechange"].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // ---------- Timer ending: the train pulls into the station and stops ----------
  function onEnding(done) {
    clearSurprise(); endSel();
    if (!run || !hasEngine()) { setTimeout(done, 1500); return; }
    var lay = run.lay;
    if (lay.stationWay) { var sw = lay.stationWay.sw; if (sw.on !== lay.stationWay.on) flipSwitch(sw); }
    run.ending = true;
    if (run.atStation && run.v < 1) { setTimeout(done, 1500); return; }
    run.endDone = done;
  }
  // ---------- Ghost hand (same look in every app) ----------
  // After a few quiet seconds, a see-through hand shows the main move once. A touch re-arms it, it shows
  // at most twice per visit, and never again once the child has done the move (ghost.learned()).
  // plan() returns { pts: [[x, y], ...] in page px, tap: true for a tap, carry: { html, size } for a see-through
  // thing under the finger (a gear being dragged), dur: ms } or null when there is nothing to show.
  function makeGhost(plan, opt) {
    opt = opt || {};
    var IDLE = opt.idle || 4500, MAX = opt.max || 2;
    var last = Date.now(), shown = 0, armed = true, learned = false, run = null, el = null;
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    function build() {
      el = document.createElement("div");
      el.className = "ghosthand";
      el.setAttribute("aria-hidden", "true");
      el.innerHTML = '<svg viewBox="-24 -18 64 84"><circle class="gh-press" cx="0" cy="0" r="17" fill="rgba(255,201,60,0.55)"/>' +
        '<g fill="#FFFFFF" stroke="#1D2340" stroke-width="3" stroke-linejoin="round">' +
        '<rect x="-9" y="-6" width="18" height="40" rx="9"/><rect x="-12" y="22" width="44" height="40" rx="16"/>' +
        '<rect x="10" y="14" width="14" height="24" rx="7"/></g>' +
        '<circle cx="0" cy="2" r="5" fill="rgba(255,201,60,0.9)"/></svg>';
      el.insertBefore(carryEl, el.firstChild);
      document.body.appendChild(el);
    }
    function stop() { run = null; if (el) { el.style.display = "none"; carryEl.innerHTML = ""; } }
    var carryEl = document.createElement("div");
    carryEl.className = "gh-carry";
    function poke() { last = Date.now(); armed = true; if (run) stop(); }
    document.addEventListener("pointerdown", poke, true);
    document.addEventListener("keydown", poke, true);
    function blocked() {
      if (document.hidden) return true;
      if (window.Toybox && (Toybox.sheetOpen() || Toybox.timer.phase() === "ending" || Toybox.timer.phase() === "resting")) return true;
      return !!(opt.ok && !opt.ok());
    }
    function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function at(pts, f) {
      if (pts.length < 2) return pts[0];
      var segs = [], tot = 0, i;
      for (i = 1; i < pts.length; i++) { var l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); tot += l; }
      var d = f * tot;
      for (i = 0; i < segs.length; i++) {
        if (d <= segs[i] || i === segs.length - 1) { var t = segs[i] ? Math.min(1, d / segs[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; }
        d -= segs[i];
      }
      return pts[pts.length - 1];
    }
    function frame() {
      if (!run) return;
      var t = (Date.now() - run.t0) / run.dur, p = run.p, s = run.s, x, y, a, press, sc = 1;
      if (t >= 1) { stop(); return; }
      if (p.tap || p.pts.length < 2) {
        var pt = p.pts[0];
        x = pt[0]; y = pt[1];
        a = t < 0.15 ? t / 0.15 : (t > 0.85 ? (1 - t) / 0.15 : 1);
        press = (t > 0.3 && t < 0.42) || (t > 0.55 && t < 0.67);
        sc = press ? 0.92 : 1;
        if (t < 0.3) { var k = 1 - t / 0.3; x += 26 * s * k; y += 30 * s * k; }
      } else {
        a = t < 0.1 ? t / 0.1 : (t > 0.9 ? (1 - t) / 0.1 : 1);
        var f = reduce ? 0.5 : ease(Math.max(0, Math.min(1, (t - 0.16) / 0.66)));
        var q = at(p.pts, f); x = q[0]; y = q[1];
        press = t > 0.12 && t < 0.86;
        sc = t < 0.12 ? 1.12 - 0.12 * (t / 0.12) : 1;
      }
      el.style.opacity = (0.85 * a).toFixed(3);
      el.style.transform = "translate(" + (x - 24 * s) + "px," + (y - 18 * s) + "px) rotate(-14deg) scale(" + sc + ")";
      el.lastChild.firstChild.style.opacity = press ? "1" : "0";
      carryEl.style.opacity = press ? "0.75" : "0";
      requestAnimationFrame(frame);
    }
    function show(p) {
      if (!el) build();
      var s = Math.max(1, Math.min(1.7, Math.min(innerWidth, innerHeight) / 360));
      el.style.width = (64 * s) + "px"; el.style.height = (84 * s) + "px";
      el.style.transformOrigin = (24 * s) + "px " + (18 * s) + "px";
      el.style.display = "block";
      carryEl.innerHTML = p.carry ? p.carry.html : "";
      if (p.carry) {
        var c = p.carry.size;
        carryEl.style.cssText = "position:absolute;left:" + (24 * s - c / 2) + "px;top:" + (18 * s - c / 2) + "px;width:" + c + "px;height:" + c + "px";
      }
      run = { p: p, s: s, t0: Date.now(), dur: p.dur || (p.tap ? 2400 : 3200) };
      requestAnimationFrame(frame);
    }
    setInterval(function () {
      if (run || learned || !armed || shown >= MAX || Date.now() - last < IDLE) return;
      if (blocked()) { last = Date.now(); return; }
      var p = plan();
      if (!p || !p.pts || !p.pts.length) return;
      armed = false; shown++;
      show(p);
    }, 250);
    return {
      learned: function () { learned = true; stop(); },
      // something new to show (a new mode): allow the hint again
      again: function () { learned = false; shown = 0; armed = true; last = Date.now(); },
      poke: poke,
      // test hook: show it now
      show: function () { var p = plan(); if (p) show(p); return !!p; }
    };
  }
  // Page px of a point inside an element, as fractions of its box.
  function ghostPt(elm, fx, fy) {
    var r = elm.getBoundingClientRect();
    return [r.left + r.width * fx, r.top + r.height * fy];
  }
  // Idle help: tap an engine, then a car, then Go!, then (on Switches) a yellow arrow.
  function vis(el) { return el && el.offsetParent && !document.body.classList.contains("big"); }
  function ghostPhase() {
    if (!state.pieces.length) return "engine";
    if (!carCount()) return "car";
    if (!state.go) return "go";
    if (state.layout === "switch" && !flipped) return "switch";
    return "";
  }
  var ghost = makeGhost(function () {
    if (Toybox.timer.locked() || !run) return null;
    var ph = ghostPhase();
    if (ph === "engine" || ph === "car") {
      var tile = document.querySelector((ph === "engine" ? "#engPicks" : "#carPicks") + " button");
      if (vis(tile)) return { pts: [ghostPt(tile, 0.5, 0.5)], tap: true };
      var tab = document.querySelector('.tab[data-tab="' + (ph === "engine" ? "engines" : "cars") + '"]');
      if (vis(tab)) return { pts: [ghostPt(tab, 0.5, 0.5)], tap: true };
      return null;
    }
    if (ph === "go") { var g = $("go"); return vis(g) && !$("gorow").hidden ? { pts: [ghostPt(g, 0.5, 0.5)], tap: true } : null; }
    if (ph === "switch") {
      var sw = run.lay.switches[0], r = cv.getBoundingClientRect();
      if (sw && sw.sx !== undefined) return { pts: [[r.left + sw.sx, r.top + sw.sy]], tap: true };
    }
    return null;
  });
  var ghostSeen = ghostPhase();
  function ghostDone() { var ph = ghostPhase(); if (ph !== ghostSeen) { ghostSeen = ph; ghost.again(); } }
  setInterval(ghostDone, 1000);

  function restArt() {
    return '<svg class="rest-art" viewBox="0 0 300 200" aria-hidden="true">' +
      '<rect x="0" y="0" width="300" height="200" rx="24" fill="#2B3B78"/>' +
      '<circle cx="240" cy="44" r="22" fill="#FFF3A0"/><circle cx="250" cy="38" r="20" fill="#2B3B78"/>' +
      '<rect x="0" y="150" width="300" height="50" fill="#2C5A3E"/>' +
      '<rect x="150" y="70" width="120" height="58" rx="6" fill="#E63946" stroke="#1D2340" stroke-width="5"/>' +
      '<rect x="140" y="58" width="140" height="18" rx="6" fill="#8B5A3C" stroke="#1D2340" stroke-width="5"/>' +
      '<rect x="196" y="96" width="28" height="32" fill="#FFE680" stroke="#1D2340" stroke-width="4"/>' +
      '<rect x="0" y="146" width="300" height="8" fill="#5B6478"/>' +
      '<rect x="30" y="92" width="80" height="44" rx="18" fill="#26282E" stroke="#1D2340" stroke-width="5"/>' +
      '<rect x="92" y="78" width="40" height="58" rx="5" fill="#26282E" stroke="#1D2340" stroke-width="5"/>' +
      '<rect x="100" y="86" width="24" height="18" rx="3" fill="#FFE680" stroke="#1D2340" stroke-width="3"/>' +
      '<rect x="38" y="70" width="18" height="24" fill="#26282E" stroke="#1D2340" stroke-width="5"/>' +
      '<circle cx="54" cy="142" r="12" fill="#4A5578" stroke="#1D2340" stroke-width="4"/><circle cx="88" cy="142" r="12" fill="#4A5578" stroke="#1D2340" stroke-width="4"/><circle cx="118" cy="142" r="10" fill="#4A5578" stroke="#1D2340" stroke-width="4"/>' +
      '<text x="62" y="52" font-size="26" font-weight="800" fill="#FFFFFF" font-family="sans-serif">z z</text></svg>';
  }

  // ---------- Start ----------
  $("count").textContent = counterText();
  setTab(state.tab);
  resize();
  updateGo(); updateCoach();
  requestAnimationFrame(frame);

  Toybox.init({
    app: "train-builder",
    orientation: "landscape",
    badge: $("tbadge"),
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the train pulls into the station and rests, and the controls lock.",
    goodbyeOption: "End with a Goodbye toot button to press",
    farewellText: "Last stop!",
    goodbyeLabel: "Goodbye toot",
    farewellDone: "Bye bye, train!",
    restLine: "The train is resting.",
    restLine2: "It will be right here next time.",
    restArt: restArt,
    soundNote: "Soft clunks, a whistle, a crossing bell and a station chime. Hold for 2 seconds.",
    endingMaxMs: 30000,
    onEnding: onEnding,
    onGoodbye: function () { if (run && hasEngine()) { run.toot = TOOT_T; sWhistleSoft(); } },
    onWake: function () {
      if (run) { run.ending = false; run.endDone = null; run.dwell = 1; }
      state.go = false; save(); updateGo(); updateCoach();
    },
    onBig: function () { setTimeout(resize, 30); },
    onSound: function (on) { if (on) setTimeout(sChime, 60); }
  });
  if ($("tb-farewell")) stage.appendChild($("tb-farewell"));
  if (/[?&]debug\b/.test(location.search)) window.__train = { state: state, run: function () { return run; }, add: addPiece, ghost: ghost,
    pieces: function () { var r = cv.getBoundingClientRect(); return carPoses().map(function (q) { return { t: q.p.t, x: r.left + SX(q.x), y: r.top + SY(q.y, q.z + 12), sx: SX(q.x), sy: SY(q.y, q.z) }; }); },
    switches: function () { var r = cv.getBoundingClientRect(); return run.lay.switches.map(function (s) { return { x: r.left + s.sx, y: r.top + s.sy, on: s.on }; }); } };
})();
</script>
</body>
</html>
