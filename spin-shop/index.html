<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin Shop</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spin Shop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
}
html, body { height: 100%; }
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
.stage { background: var(--plate); padding: 6px; }
.stage-inner { height: 100%; display: flex; align-items: center; justify-content: center; }
#art {
  display: block;
  flex: 0 1 auto;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  cursor: pointer;
  touch-action: none;
  border-radius: 24px;
}
#art:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
.hint { display: none; }
/* Speed: Stop / Slow / Fast / Zoom, the first row of the panel. */
.speeds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.speeds .btn { min-height: 46px; font-size: 1.05rem; padding: 0.2rem 0.3rem; }
/* Big mode: the panel goes away, the header stays (Big turns into Back). */
body.big .tb-panel { display: none; }
/* Timer: the shared toast and ending banner (common/toybox.js) sit inside the picture frame here. */
.stage .toast { position: absolute; top: 10px; z-index: 2; font-size: 1.3rem; }
.stage .farewell { position: absolute; bottom: 12px; z-index: 2; }
.stage .farewell p { font-size: 1.25rem; }
body.ending .panel-body,
body.ending .speeds,
body.ending [data-action="surprise"] { pointer-events: none; opacity: 0.4; }

/* Surprise sparkles */
.sspark { transform-box: fill-box; transform-origin: 50% 50%; animation: sspark 0.9s ease-out forwards; }
@keyframes sspark { 0% { transform: scale(0) rotate(0deg); opacity: 1; } 45% { transform: scale(1.25) rotate(60deg); opacity: 1; } 100% { transform: scale(0) rotate(120deg); opacity: 0; } }
/* ---------- Panel: speeds, the picked tab's choices, then the tab bar with Surprise ---------- */
.panel-body {
  display: grid;
  min-height: 0;
  overflow: hidden;
  overscroll-behavior: none;
}
.tb-panel .panel-body.tb-choices { grid-template-columns: minmax(0, 1fr); gap: 0; }
.panel-body h2 { display: none; }
.panel-body > [data-pane] { grid-area: 1 / 1; visibility: hidden; margin: 0; min-width: 0; }
.tb-panel[data-tab="make"] [data-pane="make"] { visibility: visible; }
.panel-body section + section { margin-top: 10px; }
.panel-body section.sec-swatches { margin-top: 0; }
.note { display: none; }
.readout { display: none; }
.tb-tabs .tab[aria-selected="true"] { background: var(--accent); color: #1D2340; }
.tb-tabs .tab-style { display: none; }

.modes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.mode {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: clamp(0.68rem, 2.9vw, 0.95rem);
  padding: 6px 1px 4px;
  white-space: nowrap;
}
.mode svg { width: 44px; height: 44px; display: block; }
/* All styles for the current thing share one row, so nothing is hidden off-screen. */
.styles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.style {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: clamp(0.64rem, 2.8vw, 0.9rem);
  padding: 5px 1px 3px;
  min-height: 0;
}
.style svg { width: 38px; height: 38px; display: block; }
.style span { white-space: nowrap; }
.styles.six { gap: 4px; }
.counter {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 10px;
  row-gap: 2px;
}
.counter .btn {
  width: 48px;
  height: 48px;
  font-size: 1.8rem;
  line-height: 1;
  padding: 0;
  flex: none;
}
.cgroup { display: flex; align-items: center; gap: 10px; }
/* Min / Max jump straight to the fewest or most. */
.counter .btn.minmax { width: auto; min-width: 48px; padding: 0 8px; font-size: 0.95rem; }
.cgroup[hidden] { display: none; }
/* Narrow phones: no room for Min/Max next to the lights counter, so hide them there. */
@media (max-width: 600px) { .counter.has-lights .btn.minmax { display: none; } }
.numbox { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.num {
  font-size: 2.25rem;
  font-weight: 800;
  line-height: 1;
  min-width: 1.6ch;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
/* What the number counts ("spokes", "lights"), so two counters side by side read clearly. */
.numcap { font-size: 0.78rem; font-weight: 700; color: var(--muted); line-height: 1; margin-top: 1px; }
/* "Dome" in place of a number: smaller, so the counter keeps its width. */
.num.word { font-size: 1.25rem; height: 2.25rem; display: flex; align-items: center; justify-content: center; }
.counter.two { gap: 18px; }
.counter.two .cgroup { gap: 6px; }
.counter.two .btn { width: 44px; }
.row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  padding-right: 3px;
}
.row .btn {
  flex: 0 0 calc((100% - 12px) / 3);
  min-width: 0;
  min-height: 40px;
  padding: 0.2rem 0.2rem;
  font-size: clamp(0.76rem, 3.5vw, 1rem);
  white-space: nowrap;
  overflow: hidden;
}
.dot {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid #1D2340;
  vertical-align: -2px;
  margin-right: 4px;
}
/* Reserve two rows for color parts so the panel height (and picture size) never jumps. */
#parts { min-height: 86px; align-content: flex-start; }
.swatches {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
  margin-top: 8px;
}
.swatch {
  aspect-ratio: 1;
  width: 100%;
  border-radius: 50%;
  border: 3px solid var(--edge);
  cursor: pointer;
  padding: 0;
  font: inherit;
  font-size: 1.1rem;
  font-weight: 800;
  display: grid;
  place-items: center;
  box-shadow: 2px 2px 0 var(--edge);
}
.swatch[aria-pressed="true"] { outline: 5px solid var(--accent); outline-offset: 2px; }
/* Palette swatches and ceiling-fan light swatches share one spot, so the panel height never changes. */
.swatchbox { display: grid; }
.swatchbox > .swatches { grid-area: 1 / 1; }
.swatchbox.lit #swatches,
.swatchbox:not(.lit) #lightSwatches { visibility: hidden; }
.lightswatch { color: #1D2340; }
/* Ceiling-fan lights glow softly (they sit on the still light kit, so they don't spin). */
#over .glow { animation: glowpulse 2.4s ease-in-out infinite alternate; }
@keyframes glowpulse { from { opacity: 0.72; } to { opacity: 1; } }
.swatch:focus-visible { outline: 5px solid var(--focus); outline-offset: 2px; }

/* Landscape: the panel is a column on the right; the choices sit in the middle of it. */
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(52%, 460px); justify-content: space-between; }
  .tb-body .tb-panel .panel-body.tb-choices { flex: 1 1 auto; align-content: center; }
}

/* Larger screens (tablets, desktop): bigger touch targets. */
@media (min-width: 700px) and (min-height: 700px) {
  .tb-panel { gap: 12px; }
  .panel-body > [data-pane] { width: 100%; max-width: 560px; justify-self: center; }
  .modes { gap: 12px; }
  .mode { font-size: 1.1rem; padding: 8px 4px 6px; }
  .mode svg { width: 64px; height: 64px; }
  .styles { gap: 10px; }
  .style { font-size: 0.95rem; padding: 7px 2px 5px; }
  .style svg { width: 54px; height: 54px; }
  .styles.six { gap: 8px; }
  .panel-body section + section { margin-top: 16px; }
  .counter .btn { width: 60px; height: 60px; font-size: 2.1rem; }
  .counter .btn.minmax { min-width: 60px; font-size: 1.1rem; }
  .num { font-size: 2.8rem; }
  .num.word { font-size: 1.5rem; height: 2.8rem; }
  .numcap { font-size: 0.95rem; }
  .counter.two { gap: 28px; }
  .counter.two .cgroup { gap: 10px; }
  .counter.two .btn { width: 56px; }
  .row { gap: 10px; }
  .row .btn { flex-basis: calc((100% - 20px) / 3); min-height: 50px; font-size: 1.05rem; }
  .row .dot { width: 18px; height: 18px; margin-right: 6px; }
  #parts { min-height: 110px; }
  .swatches { gap: 10px; margin-top: 12px; }
  .speeds { gap: 10px; }
  .speeds .btn { min-height: 54px; font-size: 1.15rem; }
}
@media (min-width: 700px) and (min-height: 700px) and (orientation: landscape) {
  .tb-body .tb-panel { width: min(42%, 520px); }
  .style { font-size: 0.85rem; }
  .modes { gap: 10px; }
  .mode { font-size: 0.9rem; }
}

/* Short landscape phones: tighter panel. */
@media (orientation: landscape) and (max-height: 520px) {
  .speeds .btn { font-size: 0.9rem; min-height: 44px; }
  .swatches { gap: 6px; }
  .row .btn { font-size: 0.82rem; }
  .style { font-size: 0.68rem; }
  .mode { font-size: 0.8rem; }
}

/* Phones: fewer controls at once. Make (thing + how many), Style (style + pattern) and Colors
   each show two rows; the sections share two grid rows so the panel never changes height. */
@media (max-width: 600px) and (orientation: portrait), (orientation: landscape) and (max-height: 520px) {
  .tb-tabs .tab-style { display: block; }
  .tb-panel .panel-body.tb-choices { grid-template-rows: auto auto; row-gap: 10px; align-content: center; }
  .panel-body > [data-pane] { display: contents; }
  .panel-body section { margin: 0 !important; min-width: 0; visibility: hidden; align-self: center; }
  .sec-modes, .sec-styles, .sec-parts { grid-area: 1 / 1; }
  .sec-count, .sec-pattern, .sec-swatches { grid-area: 2 / 1; }
  .tb-panel[data-tab="make"] .sec-modes, .tb-panel[data-tab="make"] .sec-count,
  .tb-panel[data-tab="style"] .sec-styles, .tb-panel[data-tab="style"] .sec-pattern { visibility: visible; }

  /* Just - and + on phones; Min and Max stay on bigger screens. */
  .counter .btn.minmax { display: none; }
  /* Picture buttons are just pictures on a phone: the names would have to be squeezed tiny. */
  .mode span, .style span { display: none; }
  .mode, .style { padding: 4px 1px; min-height: 60px; justify-content: center; }
  .mode svg { width: 50px; height: 50px; }
  .style svg { width: 46px; height: 46px; }
  .row .btn { font-size: 1rem; min-height: 44px; }
  .swatches { gap: 4px; }
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
  #over .glow { animation: none; }
}
/* ---------- Coloring: tap a part on the picture; it glows and its colors show here ---------- */
.tb-panel.picking .panel-body > [data-pane]:not([data-pane="pick"]) { visibility: hidden; }
.tb-panel.picking .panel-body > [data-pane="pick"] { visibility: visible; }
.panel-body > [data-pane="pick"] { display: flex; align-items: center; justify-content: center; }
.pick { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; max-width: 520px; margin: 0 auto; }
.pickpic {
  display: flex; flex-direction: column; align-items: center; gap: 0; width: clamp(78px, 24vw, 128px);
  padding: 4px 4px 2px; border: 3px solid var(--edge); border-radius: 16px; background: #E4F3FF;
  box-shadow: 3px 3px 0 var(--edge); color: #1D2340; font-weight: 800; font-size: 1.05rem; line-height: 1.15;
}
.pickpic svg { display: block; width: 100%; height: clamp(52px, 9vh, 92px); }
.pickswatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; justify-items: center; padding: 7px; }
.pickswatches .swatch { width: 100%; max-width: 66px; min-width: 44px; }
@media (min-width: 700px) and (min-height: 700px) {
  .pick { gap: 16px; }
  .pickswatches { gap: 14px; }
  .pickswatches .swatch { max-width: 92px; }
  .pickpic { font-size: 1.2rem; width: 150px; }
}
.pickswatches .swatch.pop { animation: swpop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes swpop { 0% { transform: scale(0.8); } 60% { transform: scale(1.15); } 100% { transform: none; } }
/* The picked part glows: a soft yellow halo pulses behind it (a copy of the part, drawn fat). */
.halo, .halo * { fill: #FFE14D; stroke: #FFE14D; stroke-linejoin: round !important; stroke-dasharray: none !important; pointer-events: none; }
/* Its color runs yellow, pink, blue, so it shows on every paint color. */
.halo * { animation: halocol 1.8s linear infinite; }
@keyframes halocol {
  0%, 100% { fill: #FFE14D; stroke: #FFE14D; }
  33% { fill: #FF5FB0; stroke: #FF5FB0; }
  66% { fill: #3FC4FF; stroke: #3FC4FF; }
}
.pickpic .dim { opacity: 0.25; }
@media (prefers-reduced-motion: reduce) { .halo *, .pickswatches .swatch.pop { animation: none; } }
/* On phones the sections sit in a shared grid; the picked part's colors take both rows. */
@media (max-width: 600px) and (orientation: portrait), (orientation: landscape) and (max-height: 520px) {
  .pick { grid-area: 1 / 1 / 3 / 2; align-self: center; }
  .panel-body > [data-pane="pick"] { display: contents; }
  .tb-panel.picking .panel-body section { visibility: hidden !important; }
}
/* Things drawn over the spinning part (grilles, shine, the light glow) let taps through to it. */
#over > :not([data-c]) { pointer-events: none; }
/* Ghost hand: a see-through hand that shows the main move once (same look as Bulldozer and Measuring). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Spin Shop</h1>
    <button class="btn tb-iconbtn" id="bigbtn" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <div class="stage-inner">
        <svg id="art" viewBox="-250 -250 500 500" role="img" tabindex="0" aria-label="">
          <defs id="artdefs"></defs>
          <g id="artwrap">
            <g id="still"></g>
            <g id="spinner"></g>
            <g id="over"></g>
          </g>
          <g id="timerG"></g>
        </svg>
      </div>
      <div class="tb-coach" id="coach" role="status" aria-live="polite">Spin it!</div>
    </main>

    <section class="tb-panel" data-tab="make">
      <div class="speeds" id="speeds"></div>
      <div class="tb-choices panel-body">
        <div data-pane="make" id="pane-make" role="tabpanel" aria-labelledby="tab-make">
          <section class="sec-modes">
            <h2>Make a</h2>
            <div class="modes" id="modes"></div>
          </section>

          <section class="sec-styles">
            <h2>Style</h2>
            <div class="styles" id="styles"></div>
          </section>

          <section class="sec-pattern">
            <h2>Pattern</h2>
            <div class="row" id="patterns"></div>
          </section>

          <section class="sec-count">
            <h2>How many</h2>
            <div class="counter" id="counter">
              <div class="cgroup">
                <button class="btn minmax" id="minBtn" aria-label="Fewest">Min</button>
                <button class="btn" id="minus" aria-label="One less">−</button>
                <div class="numbox"><div class="num" id="num" aria-live="polite">6</div><div class="numcap" id="numCap">spokes</div></div>
                <button class="btn" id="plus" aria-label="One more">+</button>
                <button class="btn minmax" id="maxBtn" aria-label="Most">Max</button>
              </div>
              <div class="cgroup" id="lightsGroup" hidden>
                <button class="btn" id="lminus" aria-label="One less light">−</button>
                <div class="numbox"><div class="num" id="lnum" aria-live="polite">3</div><div class="numcap" id="lnumCap">lights</div></div>
                <button class="btn" id="lplus" aria-label="One more light">+</button>
              </div>
            </div>
          </section>
        </div>

        <div data-pane="pick" id="pane-pick" aria-live="polite">
          <div class="pick">
            <div class="pickpic" id="pickPic"><svg id="pickSvg" viewBox="-250 -250 500 500" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg><span id="pickName">Spokes</span></div>
            <div class="pickswatches" id="pickSw"></div>
          </div>
        </div>
      </div>

      <nav class="tb-tabs" role="tablist" aria-label="Controls">
        <button class="btn tab" role="tab" id="tab-make" data-tab="make" aria-controls="pane-make">Make</button>
        <button class="btn tab tab-style" role="tab" id="tab-style" data-tab="style" aria-controls="pane-make">Style</button>
        <button class="btn tb-surprise" data-action="surprise">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  var OUT = "#1D2340";
  var KEY = "spinshop-v1";
  var MIN = 1;
  var MAX = 30;

  var PALETTE = [
    ["Red", "#E63946"], ["Orange", "#F77F00"], ["Yellow", "#FFC93C"], ["Lime", "#A7D129"],
    ["Green", "#2E9E5B"], ["Teal", "#1FA6A0"], ["Sky", "#5BC0EB"], ["Blue", "#2D5BD7"],
    ["Purple", "#7B4FC9"], ["Pink", "#F26CA7"], ["Brown", "#8B5A3C"], ["Gray", "#9AA3AF"],
    ["White", "#FFFFFF"], ["Black", "#26282E"]
  ];
  var HEX = {};
  PALETTE.forEach(function (p) { HEX[p[0]] = p[1]; });
  function hex(name) { return HEX[name] || "#999999"; }
  function rgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function isDark(h) {
    var c = rgb(h);
    return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) < 120;
  }
  // Linear blend of hex color a toward hex color b by fraction t.
  function mix(a, b, t) {
    var x = rgb(a), y = rgb(b);
    return "#" + [0, 1, 2].map(function (k) {
      var v = Math.round(x[k] + (y[k] - x[k]) * t);
      return (v < 16 ? "0" : "") + v.toString(16);
    }).join("");
  }

  // Each style may hide parts it doesn't draw (e.g. a ceiling fan has no guard ring).
  var MODES = {
    wheel: {
      label: "Wheel", one: "spoke", many: "spokes",
      parts: [["main", "Spokes"], ["main2", "Spokes 2"], ["tire", "Tire"], ["rim", "Rim"], ["hub", "Hub"]],
      styles: [
        { id: "classic", label: "Classic", hide: [] },
        { id: "split", label: "Split", hide: [] },
        { id: "swirl", label: "Swirl", hide: [] },
        { id: "mesh", label: "Mesh", hide: [] },
        { id: "windows", label: "Windows", hide: [] }
      ],
      defaults: { count: 6, pattern: "one", style: "classic", colors: { main: "Yellow", main2: "Red", tire: "Black", rim: "Gray", hub: "Red" } }
    },
    // "paddle" is the ceiling fan (its id is kept so saved creations still load). Only the
    // ceiling fan has a light kit: state.per.fan.lights (0-6 bulbs, or LDOME for one big dome) and .lightColor.
    fan: {
      label: "Fan", one: "blade", many: "blades",

      top += '<circle r="38" fill="' + hex(c.badge) + '" stroke="' + OUT + '" stroke-width="5"/>' +

        '<path d="M 0 -12 L 3.5 -4 L 12 -3.7 L 5.5 2 L 7.5 10.5 L 0 6 L -7.5 10.5 L -5.5 2 L -12 -3.7 L -3.5 -4 Z" fill="#FFFFFF" stroke="' + OUT + '" stroke-width="2" stroke-linejoin="round"/>';
      return { still: still, spin: s, head: head, top: top };
    } else if (style === "box") {

      var fr = hex(c.frame), cage = hex(c.cage);

        '<path d="M -222 -150 L -222 -206 Q -222 -222 -206 -222 L -150 -222" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="7" stroke-linecap="round"/>';
      [[-205, 205], [205, -205], [-205, -205]].forEach(function (q) {
        still += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="7" fill="' + mix(fr, "#FFFFFF", 0.5) + '" stroke="' + OUT + '" stroke-width="3"/>';
      });
      still += '<circle cx="200" cy="200" r="24" fill="' + hex(c.hub) + '" stroke="' + OUT + '" stroke-width="4"/>' +
        '<line x1="200" y1="200" x2="200" y2="182" stroke="' + OUT + '" stroke-width="5" stroke-linecap="round"/>';
      still += '<circle r="208" fill="' + mix(fr, OUT, 0.62) + '" stroke="' + OUT + '" stroke-width="6"/>';
      s += sweptBlades(cfg, 40, 196, 0.48, 0.72, 0.3);
      s += '<circle r="42" fill="' + hex(c.hub) + '" stroke="' + OUT + '" stroke-width="5"/>';
      s += '<circle r="15" fill="rgba(255,255,255,0.45)" stroke="' + OUT + '" stroke-width="3"/>';
      var grid = [], x, h;
      for (x = -180; x <= 180; x += 36) {

        grid.push({ d: "M " + x + " " + (-h).toFixed(2) + " L " + x + " " + h.toFixed(2), col: cage });

    } else if (style === "leaf") {

      for (i = 0; i < n; i++) {

        s += '<path d="M 0 -58 Q ' + (hw * 0.15).toFixed(2) + ' -135 0 -210" fill="none" stroke="rgba(29,35,64,0.5)" stroke-width="3" stroke-linecap="round" pointer-events="none"/>';

        });

      }
    } else if (style === "propeller") {
      // Airplane-prop blades: narrow, widest in the middle, painted tips.

      var hwR = function (r) { return hwL(r) * 0.75; };
      var blade = profilePath(45, 215, hwL, hwR);
      var tip = profilePath(188, 215, hwL, hwR);
      for (i = 0; i < n; i++) {
        rot = 'transform="rotate(' + (i * 360 / n).toFixed(3) + ')"';
        s += '<path d="' + blade + '" ' + rot + ' data-c="' + mc(cfg, i) + '" fill="' + colorFor(cfg, i, n) + '" stroke="' + OUT + '" stroke-width="5" stroke-linejoin="round"/>';
        s += '<path d="' + tip + '" ' + rot + ' fill="' + hex(c.tips) + '" stroke="' + OUT + '" stroke-width="4" stroke-linejoin="round" pointer-events="none"/>';

    s += '<circle r="58" fill="' + hex(c.hub) + '" stroke="' + OUT + '" stroke-width="6"/>';
    s += '<circle r="20" fill="rgba(255,255,255,0.45)" stroke="' + OUT + '" stroke-width="4"/>';
    return { still: still, spin: s, head: "", top: top };
  }

  // ---------- Jet engine ----------
  // Front view: cowling ring with an inlet lip, dark duct, fan blades and a spinner with a swirl.
  // Darkens a fill (hex or the rainbow's hsl) by fraction t.
  function shade(col, t) {
    if (col.charAt(0) === "#") return mix(col, OUT, t);
    return col.replace(/(\d+)%\)$/, function (m0, l) { return Math.round(l * (1 - t)) + "%)"; });
  }
  function arc(r, a0, a1) {
    return "M " + pt(r, a0) + " A " + r + " " + r + " 0 " + (a1 - a0 > Math.PI ? 1 : 0) + " 1 " + pt(r, a1);
  }

  // Twisted fan blades seen from the front. Each blade is centered on a curve that sweeps sideways
  // toward the tip; a light strip on one edge and a shadow on the other make it look twisted.
  function jetBlades(cfg, o) {
    var n = cfg.count, slot = 2 * Math.PI / n, s = "", i, k, steps = 12;
    for (i = 0; i < n; i++) {
      var a = i * slot, L = [], T = [], HL = [], ST = [];
      for (k = 0; k <= steps; k++) {
        var u = k / steps, r = o.r0 + (o.r1 - o.r0) * u;
        var cc = a + o.sweep * Math.pow(u, 1.5);
        var hw = Math.min(o.cap, slot * (o.w0 + (o.w1 - o.w0) * u) / 2);
        L.push(pt(r, cc + hw)); T.push(pt(r, cc - hw));
        HL.push(pt(r, cc + hw * 0.3)); ST.push(pt(r, cc - hw * 0.5));
      }
      var body = "M " + T.join(" L ") + " A " + o.r1 + " " + o.r1 + " 0 0 1 " + L[steps] + " L " + L.slice(0, steps).reverse().join(" L ") + " Z";
      var col = colorFor(cfg, i, n);
      if (o.dark) col = shade(col, o.dark);
      s += '<g data-c="' + mc(cfg, i) + '"><path d="' + body + '" fill="' + col + '"/>';
      s += '<path d="M ' + L.join(" L ") + " L " + HL.reverse().join(" L ") + ' Z" fill="rgba(255,255,255,0.38)"/>';
      s += '<path d="M ' + T.join(" L ") + " L " + ST.reverse().join(" L ") + ' Z" fill="rgba(29,35,64,0.22)"/>';
      s += '<path d="' + body + '" fill="none" stroke="' + OUT + '" stroke-width="' + o.sw + '" stroke-linejoin="round"/></g>';
    }
    return s;
  }

  // The classic spinner swirl: a spiral stripe from the tip that widens toward the edge.
  function swirlPath(R, a0) {
    var steps = 30, left = [], right = [], k, turn = 5.2, lim = R * 0.97;
    for (k = 0; k <= steps; k++) {
      var t = k / steps;
      var r = R * (0.1 + 0.84 * t), th = a0 + turn * t;
      var dr = 0.84 * R, dt = r * turn, len = Math.sqrt(dr * dr + dt * dt);
      var nr = -dt / len, nt = dr / len;
      var hw = R * (0.03 + 0.055 * Math.sqrt(t));
      left.push(pt(Math.min(lim, r + nr * hw), th + nt * hw / Math.max(r, 1)));
      right.push(pt(Math.min(lim, r - nr * hw), th - nt * hw / Math.max(r, 1)));

    return "M " + left.join(" L ") + " L " + right.reverse().join(" L ") + " Z";
  }
  function jetSpinner(cfg, R, arms) {
    var c = cfg.colors, sp = hex(c.spinner), s = "", j;
    s += '<circle r="' + R + '" fill="' + sp + '" stroke="' + OUT + '" stroke-width="5"/>';
    for (j = 0; j < arms; j++) {
      s += '<path d="' + swirlPath(R, j * 2 * Math.PI / arms) + '" fill="' + hex(c.swirl) + '" stroke="' + OUT + '" stroke-width="2.5" stroke-linejoin="round"/>';
    }
    s += '<circle r="' + (R * 0.12).toFixed(2) + '" fill="' + mix(sp, "#FFFFFF", 0.35) + '" stroke="' + OUT + '" stroke-width="3"/>';
    return s;
  }
  // Fixed light on the spinner and blades (drawn over them, so it stays put while they spin).
  function jetShine(R) {
    return '<ellipse cx="' + (-R * 0.34).toFixed(2) + '" cy="' + (-R * 0.4).toFixed(2) + '" rx="' + (R * 0.34).toFixed(2) + '" ry="' + (R * 0.2).toFixed(2) +
      '" transform="rotate(-38 ' + (-R * 0.34).toFixed(2) + " " + (-R * 0.4).toFixed(2) + ')" fill="url(#ssshine)"/>';
  }

  function jetCowling(c, Rc, Rl, Rd, pylon) {
    var cowl = hex(c.cowl), lip = hex(c.lip), s = '<g data-c="cowl">';
    if (pylon) s += '<path d="M -34 -262 L 34 -262 L 30 -' + (Rc - 12) + ' L -30 -' + (Rc - 12) + ' Z" fill="' + shade(cowl, 0.18) + '" stroke="' + OUT + '" stroke-width="5" stroke-linejoin="round"/>';
    s += '<circle r="' + Rc + '" fill="' + cowl + '" stroke="' + OUT + '" stroke-width="6"/>';
    s += '<circle r="' + (Rc - 3) + '" fill="url(#sscowl)"/>';
    s += '<path d="' + arc((Rc + Rl) / 2 + 2, -1.35, -0.35) + '" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="5" stroke-linecap="round"/>';

    });
    s += '<circle r="' + Rl + '" fill="' + lip + '" stroke="' + OUT + '" stroke-width="5"/>';
    s += '<path d="' + arc((Rl + Rd) / 2, -1.5, -0.2) + '" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="' + Math.max(3, (Rl - Rd) * 0.3).toFixed(1) + '" stroke-linecap="round"/>';
    s += '<circle r="' + Rd + '" fill="url(#ssjet-duct)" stroke="' + OUT + '" stroke-width="5" pointer-events="none"/></g>';
    return s;
  }

  function drawJet(cfg) {
    var c = cfg.colors, style = cfg.style, still = "", s = "", top = "", j;
    if (style === "turboprop") {
      // Nacelle on a wing with a chin intake, and a big propeller in front.
      var cowl = hex(c.cowl), lip = hex(c.lip), slot = 2 * Math.PI / cfg.count;
      still += '<path d="M -262 22 Q 0 -4 262 22 L 262 52 Q 0 78 -262 52 Z" fill="' + shade(cowl, 0.15) + '" stroke="' + OUT + '" stroke-width="5" stroke-linejoin="round"/>';
      still += '<ellipse cx="0" cy="34" rx="112" ry="150" fill="' + cowl + '" stroke="' + OUT + '" stroke-width="6"/>';

      var kk = Math.min(1, 0.9 * 120 * halfSin(slot) / 40);
      var hwL = function (r) { var u = clamp((r - 40) / 166, 0, 1); return kk * (12 + 30 * Math.pow(Math.sin(Math.PI * (0.15 + 0.7 * u)), 0.8)); };

      var hiL = function (r) { return -hwL(r) * 0.2; };
      var hiR = function (r) { return hwR(r) * 0.82; };

        s += '<path d="' + blade + '" ' + rot + ' data-c="' + mc(cfg, j) + '" fill="' + colorFor(cfg, j, cfg.count) + '" stroke="' + OUT + '" stroke-width="5" stroke-linejoin="round"/>';
        s += '<path d="' + hi + '" ' + rot + ' fill="rgba(255,255,255,0.3)" pointer-events="none"/>';

    }

    if (style === "fighter") {
      // Smaller, darker fan behind a thick intake, with still guide vanes in front.
      still += jetCowling(c, 236, 206, 180, false);
      s += jetBlades(cfg, { r0: 46, r1: 179, w0: 0.42, w1: 0.62, sweep: 0.2, cap: 0.42, dark: 0.28, sw: 3.5 });
      s += jetSpinner(cfg, 56, 1);
      top = '<circle r="180" fill="url(#ssjet-vig)"/>';
      var vanes = [], vc = shade(hex(c.lip), 0.2);
      for (j = 0; j < 12; j++) {
        var a = (j + 0.5) * Math.PI / 6;

      var vs = "";
      for (j = 0; j < 48; j++) vs += "M " + pt(56, j * Math.PI / 24) + " L " + pt(200, j * Math.PI / 24) + " ";

      still += '<circle r="128" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>';
      s += jetBlades(cfg, { r0: 44, r1: 203, w0: 0.5, w1: 0.56, sweep: 0.1, cap: 0.3, dark: 0, sw: 3 });
      s += jetSpinner(cfg, 50, 1);
      top = '<circle r="204" fill="url(#ssjet-vig)"/>' + jetShine(50);

    s += jetSpinner(cfg, 66, 1);
    top = '<circle r="198" fill="url(#ssjet-vig)"/>' + jetShine(66);
    return { still: still, spin: s, head: "", top: top };
  }

  // ---------- Flower ----------
  function drawFlower(cfg) {
    var n = cfg.count, c = cfg.colors, s = "", i, p, rot;
    var slot = 2 * Math.PI / n;
    var style = cfg.style;
    var stem = hex(c.stem);
    var still = '<g data-c="stem"><line x1="0" y1="-45" x2="0" y2="252" stroke="' + OUT + '" stroke-width="30"/>' +
      '<line x1="0" y1="-45" x2="0" y2="252" stroke="' + stem + '" stroke-width="18"/>' +
      '<ellipse cx="42" cy="165" rx="22" ry="50" transform="rotate(55 42 165)" fill="' + stem + '" stroke="' + OUT + '" stroke-width="5"/>' +
      '<ellipse cx="-42" cy="210" rx="22" ry="50" transform="rotate(-55 -42 210)" fill="' + stem + '" stroke="' + OUT + '" stroke-width="5"/></g>';

      }

        } else if (style === "heart") {

            " Q " + (0.12 * w).toFixed(2) + " -178 0 -160" +
            " Q " + (-0.12 * w).toFixed(2) + " -178 " + (-0.5 * w).toFixed(2) + " -178" +
            " C " + (-1.5 * w).toFixed(2) + " -178 " + (-1.6 * w).toFixed(2) + ' -60 0 -38 Z" ' + rot + ' data-c="' + mc(cfg, i) + '" fill="' + colorFor(cfg, i, n) + line;
        } else {

  }

  // ---------- Pinwheel ----------
  function drawPinwheel(cfg) {
    var n = cfg.count, c = cfg.colors, s = "", i, rot;
    var R = 210;

        " Q " + pt(R * 0.62, slot * 0.62) + " 0 0 Z";
      flap = "M 0 0 C " + pt(R * 0.55, -slot * 0.12) + " " + pt(R * 1.05, slot * 0.02) + " " + pt(R * 0.92, slot * 0.3) +

    }

  var DRAW = { wheel: drawWheel, fan: drawFan, flower: drawFlower, pinwheel: drawPinwheel, jet: drawJet };

  // still: drawn behind; spin: rotates; top: optional still layer in front (grilles, lights, shine).
  function svgInner(o) {

      (o.top ? '<g transform="' + o.head + '">' + o.top + "</g>" : "");
  }

  var $ = function (id) { return document.getElementById(id); };

    // While ending, everything winds down to a stop more gently than a normal speed change.
    var target = ending ? 0 : SPEEDS[state.speed];
    vel += (target - vel) * Math.min(1, dt * (ending ? 0.4 : 0.95));
    if (grab && grab.turning) { /* the finger is turning it */ }
    else if (Math.abs(vel) > 0.5 || target !== 0) {
      angle = (angle + vel * dt) % 360;
      applyTransform();
    }
    // Ending: tell the shared timer once the picture has slowed to a stop.
    if (ending && endingDone && Math.abs(vel) < 2) { endingDone(); endingDone = null; }
    requestAnimationFrame(frame);
  }

  // ---------- Play timer (shared, common/toybox.js) ----------
  // Ring around the picture: the colored arc is the time left, shrinking back toward the top.
  var RING_R = 238;
  function drawTimer(info) {
    var g = $("timerG"), wrap = $("artwrap");
    if (info.phase !== "running" && info.phase !== "ending") { g.innerHTML = ""; wrap.removeAttribute("transform"); return; }
    var f = info.fraction, mins = info.minutes;
    wrap.setAttribute("transform", "scale(0.86)");
    var col = f > 0.5 ? "#2E9E5B" : (f > 0.2 ? "#FFC93C" : "#F77F00");
    var sv = '<circle r="' + RING_R + '" fill="none" stroke="rgba(29,35,64,0.14)" stroke-width="20"/>';
    if (f >= 0.9995) {
      sv += '<circle r="' + RING_R + '" fill="none" stroke="' + col + '" stroke-width="20"/>';
    } else if (f > 0.002) {
      var a = f * 2 * Math.PI;
      sv += '<path d="M ' + pt(RING_R, 0) + " A " + RING_R + " " + RING_R + " 0 " + (a > Math.PI ? 1 : 0) + " 1 " + pt(RING_R, a) +
        '" fill="none" stroke="' + col + '" stroke-width="20" stroke-linecap="round"/>';
    }
    if (info.showMinutes && info.phase === "running") {
      sv += '<circle cx="214" cy="-214" r="32" fill="#FFFFFF" stroke="' + OUT + '" stroke-width="4"/>' +
        '<text x="214" y="-212" text-anchor="middle" dominant-baseline="central" font-size="' + (mins > 9 ? 30 : 36) +
        '" font-weight="800" font-family="Baloo 2, Trebuchet MS, sans-serif" fill="' + OUT + '">' + mins + "</text>";
    }
    g.innerHTML = sv;
  }

  // Ending: the picture winds down in frame(); endingDone is called once it has stopped.
  var endingDone = null;
  function restArt() {
    var m = state.mode;
    return '<svg class="rest-art" viewBox="-250 -250 500 500" aria-hidden="true">' + svgInner(DRAW[m](state.per[m])) + "</svg>";
  }

  showTab(tab);
  render();
  fitLabels();
  // The shared grown-up layer: play timer, sound, Big. It may start the ending right away
  // (a timer that ran out while away), so the picture is set up first.
  // The toast and the ending banner sit inside the picture frame, as before.
  Toybox.init({
    app: "spin-shop",
    big: { button: $("bigbtn") },
    timerIntro: "For grown-ups. When time is up, the picture slows down and rests, and the controls lock.",
    goodbyeOption: "End with a Goodbye spin button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Goodbye spin",
    farewellDone: "Bye bye!",
    restLine: "The picture is resting.",
    restLine2: "It will be right here next time.",
    restArt: restArt,
    soundNote: "Spin Shop is quiet. This sets sound for all the Toybox apps. Hold for 2 seconds.",
    legacy: { timer: "spinshop-timer-v1" },
    onEnding: function (done) { endingDone = done; },
    onGoodbye: function () { vel += 700; },
    onRest: function () {
      endingDone = null;
      vel = 0;
      Toybox.setBig(false);
      $("tb-restLine").textContent = "The " + MODES[state.mode].label.toLowerCase() + " is resting.";
    },
    onWake: function () { endingDone = null; },
    onBig: function (on) { if (!on) queueFit(); else if (picking) setPicking(""); },
    onTimer: drawTimer
  });
  $("stage").appendChild($("tb-toast"));
  // Idle help: the ghost hand turns the picture once around.
  var ghost = makeGhost(function () {
    var r = art.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = Math.min(r.width, r.height) * 0.3, pts = [];
    if (R < 30) return null;
    for (var i = 0; i <= 12; i++) { var a = (-150 + i * 15) * Math.PI / 180; pts.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]); }
    return { pts: pts };
  });
  $("stage").appendChild($("tb-farewell"));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
