<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin Shop</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spin Shop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
html, body { height: 100%; }
/* ---------- Standard app shell (common/toybox.css, tb-v2): header, stage, panel ----------
   The stage is the toy: tap it to spin it, drag round to turn it, tap a part to color it. The wheel's spoke
   count sits in the stage's corner. The panel: the five toy tiles (or the picked part's colors, with a Toys tile
   to go back), then the bottom bar (New, Surprise). Both tile sets are two rows, so the panel never changes
   height. */
.tb-head a { text-decoration: none; }
.stage { background: var(--plate); }
.stage-inner { position: absolute; inset: 0; padding: 6px; display: flex; align-items: center; justify-content: center; }
/* Room for the spoke count: a band above the toy (upright), at its left (sideways). */
@media (orientation: portrait) { .stage-inner { padding-top: 64px; } }
@media (orientation: landscape) { .stage-inner { padding-left: 68px; } }
#art {
  display: block;
  flex: 0 1 auto;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  cursor: pointer;
  touch-action: none;
  border-radius: 24px;
}
#art:focus { outline: none; }
#art:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Spoke count (the wheel only): a number he chooses, with − and + beside it. */
.spokes { position: absolute; left: 10px; top: 10px; z-index: 3; display: flex; align-items: center; gap: 8px; }
.spokes[hidden] { display: none; }
.spokes .btn { width: 52px; height: 52px; min-height: 52px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
.spokes .btn svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
.snum { background: #FFFFFF; color: #1D2340; border: var(--tb-outline) solid #1D2340; border-radius: 999px; padding: 2px 12px;
  font-weight: 800; font-size: var(--tb-fs-count); line-height: 1.15; text-align: center; white-space: nowrap; pointer-events: none; }
.snum b { display: inline-block; font-size: 1.25em; font-variant-numeric: tabular-nums; }
@media (orientation: landscape) {
  .spokes { flex-direction: column-reverse; }
  .snum { padding: 2px 6px; border-radius: 16px; min-width: 52px; }
  .snum span { display: block; font-size: var(--tb-fs-small); }
}

/* Tiles: the toys (3 + 2, centered) or the picked part's colors (4 a row). */
#tiles .tb-pic svg { width: 100%; height: 100%; display: block; }
#tiles.is-toys { grid-template-columns: repeat(6, minmax(0, 1fr)); }
#tiles.is-toys > .tb-tile { grid-column: span 2; }
#tiles.is-toys > .tb-tile:nth-child(4) { grid-column: 2 / span 2; }
#tiles.is-colors { grid-template-columns: repeat(4, minmax(0, 1fr)); }
/* A color tile: the fill is the paint; its word sits on a small white label so it reads on every color. */
#tiles .is-swatch .tb-tile-word { background: #FFFFFF; color: #1D2340; border-radius: 999px; padding: 0 5px; max-width: 100%; }
#tiles .is-swatch .tb-pic[hidden] { display: none; }
#tiles .tb-tile.pop, #num.pop { animation: swpop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes swpop { 0% { transform: scale(0.85); } 60% { transform: scale(1.1); } 100% { transform: none; } }
/* Phone held sideways: a wider column, so four colors fit a row at full size (the toy is limited by the height). */
@media (orientation: landscape) and (max-height: 520px) {
  .tb-v2 .tb-body .tb-panel { width: calc(4 * var(--tb-tile) + 3 * var(--tb-s2) + 24px); }
}
/* iPad held sideways: three colors a row in the side column. */
@media (orientation: landscape) and (min-height: 521px) {
  #tiles.is-colors { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* Big: the header, the panel and the spoke count hide; tapping the toy still spins it. */
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel, body.big .spokes { display: none; }
body.ending .tb-panel, body.ending .homebtn, body.ending .spokes { pointer-events: none; opacity: 0.4; }
/* Timer: the shared toast and ending banner (common/toybox.js) sit inside the picture frame here. */
.stage .toast { position: absolute; top: 10px; z-index: 4; }
.stage .farewell { position: absolute; bottom: 12px; z-index: 4; }

/* Surprise sparkles */
.sspark { transform-box: fill-box; transform-origin: 50% 50%; animation: sspark 0.9s ease-out forwards; }
@keyframes sspark { 0% { transform: scale(0) rotate(0deg); opacity: 1; } 45% { transform: scale(1.25) rotate(60deg); opacity: 1; } 100% { transform: scale(0) rotate(120deg); opacity: 0; } }
/* Ceiling-fan lights glow softly (they sit on the still light kit, so they don't spin). */
#over .glow { animation: glowpulse 2.4s ease-in-out infinite alternate; }
@keyframes glowpulse { from { opacity: 0.72; } to { opacity: 1; } }
/* The picked part glows: a soft yellow halo pulses behind it (a copy of the part, drawn fat). */
.halo, .halo * { fill: #FFE14D; stroke: #FFE14D; stroke-linejoin: round !important; stroke-dasharray: none !important; pointer-events: none; }
/* Its color runs yellow, pink, blue, so it shows on every paint color. */
.halo * { animation: halocol 1.8s linear infinite; }
@keyframes halocol {
  0%, 100% { fill: #FFE14D; stroke: #FFE14D; }
  33% { fill: #FF5FB0; stroke: #FF5FB0; }
  66% { fill: #3FC4FF; stroke: #3FC4FF; }
}
/* Things drawn over the spinning part (grilles, shine, the light glow) let taps through to it. */
#over > :not([data-c]) { pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  #over .glow, .halo *, #tiles .tb-tile.pop, #num.pop { animation: none; }
}
</style>
</head>
<body>
<div class="tb-app-shell tb-v2">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Spin Shop</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigbtn" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <div class="stage-inner">
        <svg id="art" viewBox="-250 -250 500 500" role="img" tabindex="0" aria-label="">
          <defs id="artdefs"></defs>
          <g id="artwrap">
            <g id="still"></g>
            <g id="spinner"></g>
            <g id="over"></g>
          </g>
          <g id="timerG"></g>
        </svg>
      </div>
      <div class="spokes" id="spokes" hidden>
        <button class="btn" id="minus" aria-label="One less spoke"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <div class="snum" aria-live="polite"><b id="num">6</b> <span id="numCap">spokes</span></div>
        <button class="btn" id="plus" aria-label="One more spoke"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>
      <div id="coach"></div>
    </main>

    <section class="tb-panel" id="panel">
      <div id="tiles" role="group" aria-label="Toys"></div>
      <div id="bottom"></div>
    </section>
  </div>
</div>
<script>
(function () {
  "use strict";

  var OUT = "#1D2340";
  var KEY = "spinshop-v1";
  var MIN = 1;
  var MAX = 30;

  var PALETTE = [
    ["Red", "#E63946"], ["Orange", "#F77F00"], ["Yellow", "#FFC93C"], ["Lime", "#A7D129"],
    ["Green", "#2E9E5B"], ["Teal", "#1FA6A0"], ["Sky", "#5BC0EB"], ["Blue", "#2D5BD7"],
    ["Purple", "#7B4FC9"], ["Pink", "#F26CA7"], ["Brown", "#8B5A3C"], ["Gray", "#9AA3AF"],
    ["White", "#FFFFFF"], ["Black", "#26282E"]
  ];
  var HEX = {};
  PALETTE.forEach(function (p) { HEX[p[0]] = p[1]; });
  function hex(name) { return HEX[name] || "#999999"; }
  function rgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function isDark(h) {
    var c = rgb(h);
    return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) < 120;
  }
  // Linear blend of hex color a toward hex color b by fraction t.
  function mix(a, b, t) {
    var x = rgb(a), y = rgb(b);
    return "#" + [0, 1, 2].map(function (k) {
      var v = Math.round(x[k] + (y[k] - x[k]) * t);
      return (v < 16 ? "0" : "") + v.toString(16);
    }).join("");
  }

  // Each style may hide parts it doesn't draw (e.g. a ceiling fan has no guard ring).
  var MODES = {
    wheel: {
      label: "Wheel", one: "spoke", many: "spokes",
      parts: [["main", "Spokes"], ["main2", "Spokes 2"], ["tire", "Tire"], ["rim", "Rim"], ["hub", "Hub"]],
      styles: [
        { id: "classic", label: "Classic", hide: [] },
        { id: "split", label: "Split", hide: [] },
        { id: "swirl", label: "Swirl", hide: [] },
        { id: "mesh", label: "Mesh", hide: [] },
        { id: "windows", label: "Windows", hide: [] }
      ],
      defaults: { count: 6, pattern: "one", style: "classic", colors: { main: "Yellow", main2: "Red", tire: "Black", rim: "Gray", hub: "Red" } }
    },
    // "paddle" is the ceiling fan (its id is kept so saved creations still load). Only the
    // ceiling fan has a light kit: state.per.fan.lights (0-6 bulbs, or LDOME for one big dome) and .lightColor.
    fan: {
      label: "Fan", one: "blade", many: "blades",
      parts: [["main", "Blades"], ["main2", "Blades 2"], ["hub", "Hub"], ["tips", "Tips"], ["ring", "Ring"],
        ["frame", "Frame"], ["cage", "Grille"], ["badge", "Badge"], ["light", "Lights"]],
      styles: [
        { id: "paddle", label: "Ceiling", hide: ["tips", "ring", "frame", "cage", "badge"] },
        { id: "desk", label: "Desk", hide: ["tips", "ring", "frame", "light"] },
        { id: "box", label: "Box", hide: ["tips", "ring", "badge", "light"] },
        { id: "swoosh", label: "Swoosh", hide: ["tips", "frame", "cage", "badge", "light"] },
        { id: "leaf", label: "Leaf", hide: ["tips", "ring", "frame", "cage", "badge", "light"] },
        { id: "propeller", label: "Propeller", hide: ["frame", "cage", "badge", "light"] }
      ],
      defaults: { count: 5, pattern: "one", style: "paddle", lights: 3, lightColor: "warm",
        colors: { main: "Brown", main2: "White", hub: "Gray", tips: "Yellow", ring: "Gray", frame: "Sky", cage: "Gray", badge: "Red" } }
    },
    flower: {
      label: "Flower", one: "petal", many: "petals",
      parts: [["main", "Petals"], ["main2", "Petals 2"], ["middle", "Middle"], ["stem", "Stem"]],
      styles: [
        { id: "round", label: "Round", hide: [] },
        { id: "pointy", label: "Pointy", hide: [] },
        { id: "heart", label: "Heart", hide: [] },
        { id: "double", label: "Double", hide: [] }
      ],
      defaults: { count: 8, pattern: "one", style: "round", colors: { main: "Pink", main2: "Purple", middle: "Yellow", stem: "Green" } }
    },
    pinwheel: {
      label: "Pinwheel", one: "vane", many: "vanes",
      parts: [["main", "Vanes"], ["main2", "Vanes 2"], ["fold", "Folds"], ["pin", "Pin"], ["stick", "Stick"]],
      styles: [
        { id: "classic", label: "Classic", hide: [] },
        { id: "pointy", label: "Pointy", hide: [] },
        { id: "swirl", label: "Swirl", hide: [] }
      ],
      defaults: { count: 4, pattern: "turns", style: "classic", colors: { main: "Red", main2: "Blue", fold: "White", pin: "Yellow", stick: "Brown" } }
    },
    jet: {
      label: "Jet engine", one: "blade", many: "blades", surprise: [10, 26],
      parts: [["main", "Blades"], ["main2", "Blades 2"], ["cowl", "Cowling"], ["spinner", "Spinner"], ["swirl", "Swirl"], ["lip", "Lip"]],
      // fit: [lowest, highest, usual] blade count. Picking a style whose count is outside its range
      // switches to the usual count (a propeller has a few blades, a turbofan many).
      styles: [
        { id: "airliner", label: "Airliner", hide: [], fit: [10, 30, 18] },
        { id: "fighter", label: "Fighter", hide: [], fit: [10, 30, 20] },
        { id: "turboprop", label: "Turboprop", hide: [], fit: [2, 8, 6] },
        { id: "turbojet", label: "Turbojet", hide: [], fit: [14, 30, 24] }
      ],
      defaults: { count: 18, pattern: "one", style: "airliner", colors: { main: "Gray", main2: "White", cowl: "White", spinner: "Black", swirl: "White", lip: "Gray" } }
    }
  };
  var ORDER = ["wheel", "fan", "flower", "pinwheel", "jet"];
  // Ceiling-fan bulb colors: [id, name, glass color, glow color]. Rainbow gives each bulb its own color.
  var LIGHTS = [["warm", "Warm white", "#FFE3A0", "#FFC23D"], ["cool", "Cool white", "#E4F3FF", "#8CCBFF"], ["yellow", "Yellow", "#FFE04A", "#FFD000"],
    ["pink", "Pink", "#FF9FCF", "#FF5FAE"], ["blue", "Blue", "#8FD0FF", "#3FA4FF"], ["green", "Green", "#9BF0A6", "#3FD964"], ["rainbow", "Rainbow", ""]];
  var RAINBOW_LIGHTS = ["#FF8A8A", "#FFB35C", "#FFE04A", "#9BF0A6", "#8FD0FF", "#C9A2FF"];
  var RAINBOW_GLOWS = ["#FF4D4D", "#FF9A1F", "#FFD000", "#3FD964", "#3FA4FF", "#A66BFF"];
  var LIGHT_IDS = LIGHTS.map(function (l) { return l[0]; });
  var LMAX = 6;       // most bulbs
  var LDOME = 7;      // the step after 6 bulbs: one big glass dome instead
  var SPEEDS = { stop: 0, slow: 40, fast: 190, zoom: 560 };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function styleIds(m) { return MODES[m].styles.map(function (s) { return s.id; }); }
  function styleOf(m, id) { return MODES[m].styles.filter(function (s) { return s.id === id; })[0] || MODES[m].styles[0]; }
  // The blade count a style gets when it is picked (see fit above).
  function fitCount(m, id, count) {
    var f = styleOf(m, id).fit;
    return (f && (count < f[0] || count > f[1])) ? f[2] : count;
  }

  function freshState() {
    var per = {};
    var part = {};
    ORDER.forEach(function (m) {
      var d = MODES[m].defaults;
      per[m] = { count: d.count, pattern: d.pattern, style: d.style, colors: Object.assign({}, d.colors) };
      if (d.lights !== undefined) { per[m].lights = d.lights; per[m].lightColor = d.lightColor; }
      part[m] = "main";
    });
    return { mode: "wheel", speed: reduce ? "stop" : "slow", per: per, part: part };
  }

  // Opening the Spin Shop from the Toybox home screen (Toybox.fresh) starts the first-visit design
  // again; a reload keeps the current one. Nothing here is a collection.
  if (window.Toybox && Toybox.fresh()) {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
  }
  function loadState() {
    var s = freshState();
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return s;
      var o = JSON.parse(raw);
      if (ORDER.indexOf(o.mode) !== -1) s.mode = o.mode;
      if (Object.prototype.hasOwnProperty.call(SPEEDS, o.speed)) s.speed = o.speed;
      ORDER.forEach(function (m) {
        var src = o.per && o.per[m];
        if (!src) return;
        var dst = s.per[m];
        if (Number.isInteger(src.count) && src.count >= MIN && src.count <= MAX) dst.count = src.count;
        if (["one", "turns", "rainbow"].indexOf(src.pattern) !== -1) dst.pattern = src.pattern;
        if (styleIds(m).indexOf(src.style) !== -1) dst.style = src.style;
        if (src.colors) Object.keys(dst.colors).forEach(function (k) { if (HEX[src.colors[k]]) dst.colors[k] = src.colors[k]; });
        if ("lights" in dst) {
          if (Number.isInteger(src.lights) && src.lights >= 0 && src.lights <= LDOME) dst.lights = src.lights;
          if (LIGHT_IDS.indexOf(src.lightColor) !== -1) dst.lightColor = src.lightColor;
        }
        if (o.part && MODES[m].parts.some(function (p) { return p[0] === o.part[m]; })) s.part[m] = o.part[m];
      });
    } catch (e) { /* storage unavailable or bad data: use defaults */ }
    return s;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  var state = loadState();

  // Polar point: angle a in radians measured clockwise from straight up.
  function pt(r, a) {
    return (r * Math.sin(a)).toFixed(2) + " " + (-r * Math.cos(a)).toFixed(2);
  }
  function xy(r, a) {
    return { x: (r * Math.sin(a)).toFixed(2), y: (-r * Math.cos(a)).toFixed(2) };
  }
  // Half-angle used for width math, capped at 90 degrees so 1-2 parts don't collapse to zero width.
  function halfSin(slot) { return Math.sin(Math.min(slot / 2, Math.PI / 2)); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // dark=true returns a deeper shade of the same color (used for back-layer petals).
  // Which color a blade uses ("main", or "main2" for every other one when they take turns): tags it for tapping.
  function mc(cfg, i) { return cfg.pattern === "turns" && i % 2 === 1 ? "main2" : "main"; }
  function colorFor(cfg, i, n, dark) {
    if (cfg.pattern === "rainbow") return "hsl(" + Math.round(i * 360 / n) + ", 85%, " + (dark ? "42%" : "58%") + ")";
    var base = (cfg.pattern === "turns" && i % 2 === 1) ? hex(cfg.colors.main2) : hex(cfg.colors.main);
    return dark ? mix(base, OUT, 0.3) : base;
  }

  // Draws every outline first, then every fill line, so crossing strokes merge cleanly.
  function strokes(items, outlineWidth, colorWidth) {
    var s = "";
    items.forEach(function (it) {
      s += '<path' + (it.c ? ' data-c="' + it.c + '"' : "") + ' d="' + it.d + '" fill="none" stroke="' + OUT + '" stroke-width="' + outlineWidth + '" stroke-linecap="round" stroke-linejoin="round"/>';
    });
    items.forEach(function (it) {
      s += '<path' + (it.c ? ' data-c="' + it.c + '" data-nohalo="1"' : "") + ' d="' + it.d + '" fill="none" stroke="' + it.col + '" stroke-width="' + colorWidth + '" stroke-linecap="round" stroke-linejoin="round"/>';
    });
    return s;
  }

  // ---------- Wheel ----------
  function wheelSpokes(cfg) {
    var n = cfg.count, slot = 2 * Math.PI / n, items = [], i, a, d;
    var style = cfg.style;
    for (i = 0; i < n; i++) {
      a = i * slot;
      if (style === "split") {
        d = Math.min(slot * 0.18, 0.2);
        items.push({ d: "M " + pt(40, a) + " L " + pt(92, a) + " L " + pt(164, a - d) + " M " + pt(92, a) + " L " + pt(164, a + d), col: colorFor(cfg, i, n), c: mc(cfg, i) });
      } else if (style === "swirl") {
        items.push({ d: "M " + pt(40, a) + " C " + pt(85, a + 0.05) + " " + pt(130, a + 0.18) + " " + pt(164, a + 0.55), col: colorFor(cfg, i, n), c: mc(cfg, i) });
      } else if (style === "mesh") {
        d = Math.min(slot * 0.5, Math.PI / 3);
        items.push({ d: "M " + pt(50, a) + " L " + pt(164, a + d) + " M " + pt(50, a) + " L " + pt(164, a - d), col: colorFor(cfg, i, n), c: mc(cfg, i) });
      } else {
        items.push({ d: "M " + pt(40, a) + " L " + pt(164, a), col: colorFor(cfg, i, n), c: mc(cfg, i) });
      }
    }
    if (style === "split") return strokes(items, 22, 12);
    if (style === "swirl") return strokes(items, 20, 11);
    if (style === "mesh") return strokes(items, 15, 8);
    return strokes(items, 24, 14);
  }

  // Solid face cut by n windows. Face wedge i is centered on angle i*slot; windows sit between wedges.
  function wheelWindows(cfg) {
    var n = cfg.count, slot = 2 * Math.PI / n, s = "", i, a;
    var R = 160;
    for (i = 0; i < n; i++) {
      a = i * slot;
      if (n === 1) {
        s += '<circle r="' + R + '" data-c="' + mc(cfg, i) + '" fill="' + colorFor(cfg, i, n) + '"/>';
      } else {
        s += '<path d="M 0 0 L ' + pt(R, a - slot / 2) + " A " + R + " " + R + " 0 " + (slot > Math.PI ? 1 : 0) + " 1 " + pt(R, a + slot / 2) + ' Z" data-c="' + mc(cfg, i) + '" fill="' + colorFor(cfg, i, n) + '"/>';
      }

  function drawWheel(cfg) {
    var c = cfg.colors, s = "", i, a, p1, p2;

  // ---------- Fan ----------
  // Blade outline built from a half-width profile: left edge out, rounded cap, right edge back.
  // Local coordinates: the blade points straight up (negative y).
  function profilePath(r0, r1, hwLeft, hwRight) {
    var steps = 16, k, r, left = [], right = [];

      right.push(hwRight(r).toFixed(2) + " " + (-r).toFixed(2));
    }
    var cap = ((hwLeft(r1) + hwRight(r1)) / 2).toFixed(2);
    return "M " + left.join(" L ") + " A " + cap + " " + cap + " 0 0 1 " + right[steps] + " L " + right.slice(0, steps).reverse().join(" L ") + " Z";
  }

  // Swept blades like a desk fan (r0: root radius, rt: tip radius, wf/wmax: width as a share of the slot / cap).
  function sweptBlades(cfg, r0, rt, wf, wmax, sk) {
    var n = cfg.count, slot = 2 * Math.PI / n, s = "", i;
    var w = Math.min(wf * slot, wmax);
    var d = "M " + pt(r0, -w * 0.5) +
      " Q " + pt(rt * 0.55, -w * 1.05 + sk * 0.4) + " " + pt(rt, -w * 0.75 + sk) +
      " Q " + pt(rt * 1.06, sk) + " " + pt(rt, w * 0.75 + sk) +
      " Q " + pt(rt * 0.55, w * 1.05 + sk * 0.4) + " " + pt(r0, w * 0.5) + " Z";
    for (i = 0; i < n; i++) {
      s += '<path d="' + d + '" transform="rotate(' + (i * 360 / n).toFixed(3) + ')" data-c="' + mc(cfg, i) + '" fill="' + colorFor(cfg, i, n) + '" stroke="' + OUT + '" stroke-width="5" stroke-linejoin="round"/>';
    }
    return s;
  }

  function lightHex(cfg, j) {
    if (cfg.lightColor === "rainbow") return RAINBOW_LIGHTS[j % RAINBOW_LIGHTS.length];

    return l[2];

    return "url(#ssglow-" + (cfg.lightColor === "rainbow" ? "r" + (j % RAINBOW_LIGHTS.length) : cfg.lightColor) + ")";
  }

  // Ceiling-fan light kit. It hangs from the still motor housing, so it is drawn over the blades and does not spin.
  // cfg.lights: 0 none, 1-6 bulbs, LDOME one big glass dome.
  function lightKit(cfg) {
    var n = cfg.lights || 0, hub = hex(cfg.colors.hub), s = "", glows = "", j, a, p;

          s += '<path d="M 0 0 L ' + pt(R, j * Math.PI / 3) + " A " + R + " " + R + " 0 0 1 " + pt(R, (j + 1) * Math.PI / 3) + ' Z" fill="' + lightHex(cfg, j) + '"/>';
        }
        s += '<circle r="' + R + '" fill="none" stroke="' + OUT + '" stroke-width="6"/>';
      } else {
        glows += '<circle r="205" fill="' + glowFill(cfg, 0) + '"/>';
        s += '<circle r="' + R + '" fill="' + lightHex(cfg, 0) + '" stroke="' + OUT + '" stroke-width="6"/>';
      }
      // Metal trim ring, frosted glass rings and a shine.
      s += '<circle r="' + (R + 7) + '" fill="none" stroke="' + OUT + '" stroke-width="16"/><circle r="' + (R + 7) + '" fill="none" stroke="' + hub + '" stroke-width="8"/>';
      s += '<circle r="70" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="7"/>';
      s += '<circle r="40" fill="rgba(255,255,255,0.55)"/>';
      s += '<ellipse cx="-38" cy="-44" rx="22" ry="11" transform="rotate(-40 -38 -44)" fill="rgba(255,255,255,0.9)"/>';
      s += '<circle r="13" fill="' + hub + '" stroke="' + OUT + '" stroke-width="4"/>';
      return '<g data-c="light"><g class="glow" pointer-events="none">' + glows + "</g>" + s + "</g>";
    }
    if (n === 1) {
      // One round globe hanging in the middle.
      glows += '<circle r="150" fill="' + glowFill(cfg, 0) + '"/>';
      s += '<circle r="62" fill="' + hub + '" stroke="' + OUT + '" stroke-width="5"/>';
      s += '<circle r="48" fill="' + lightHex(cfg, 0) + '" stroke="' + OUT + '" stroke-width="5"/>';
      s += '<circle r="28" fill="rgba(255,255,255,0.75)"/>';
      s += '<ellipse cx="-18" cy="-22" rx="11" ry="6" transform="rotate(-40 -18 -22)" fill="#FFFFFF"/>';
      return '<g data-c="light"><g class="glow" pointer-events="none">' + glows + "</g>" + s + "</g>";
    }

    var Rb = 90, arms = [];
    for (j = 0; j < n; j++) {
      a = (j + 0.5) * 2 * Math.PI / n;

      glows += '<circle cx="' + p.x + '" cy="' + p.y + '" r="100" fill="' + glowFill(cfg, j) + '"/>';
      arms.push({ d: "M " + pt(30, a) + " L " + pt(Rb, a), col: hub });
    }
    s += strokes(arms, 18, 9);
    s += '<circle r="48" fill="' + hub + '" stroke="' + OUT + '" stroke-width="5"/>';
    s += '<circle r="32" fill="rgba(255,255,255,0.3)" stroke="' + OUT + '" stroke-width="3"/>';
    for (j = 0; j < n; j++) {
      a = (j + 0.5) * 2 * Math.PI / n;
      p = xy(Rb, a);
      s += '<circle cx="' + p.x + '" cy="' + p.y + '" r="34" fill="' + lightHex(cfg, j) + '" stroke="' + OUT + '" stroke-width="5"/>';
      s += '<circle cx="' + p.x + '" cy="' + p.y + '" r="19" fill="rgba(255,255,255,0.75)"/>';
    }
    s += '<circle r="12" fill="' + hub + '" stroke="' + OUT + '" stroke-width="4"/>';
    return '<g data-c="light"><g class="glow" pointer-events="none">' + glows + "</g>" + s + "</g>";
  }

  // Wire grille in front of the blades: rim, rings and spokes (desk fan).
  function roundGrille(cage, R) {
    var items = [], j, s = "";
    for (j = 0; j < 24; j++) items.push({ d: "M " + pt(46, j * Math.PI / 12) + " L " + pt(R, j * Math.PI / 12), col: cage });

    s += '<circle r="' + R + '" fill="none" stroke="' + cage + '" stroke-width="9"/>';

  function drawFan(cfg) {

        still += '<rect x="' + (x - 20) + '" y="216" width="40" height="18" rx="8" fill="' + (k === 0 ? hex(c.badge) : mix(hubc, "#FFFFFF", 0.45)) + '" stroke="' + OUT + '" stroke-width="3.5"/>';
      });

      top = roundGrille(hex(c.cage), 214);
      top += '<circle r="38" fill="' + hex(c.badge) + '" stroke="' + OUT + '" stroke-width="5"/>' +
        '<circle r="25" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="4"/>' +
        '<path d="M 0 -12 L 3.5 -4 L 12 -3.7 L 5.5 2 L 7.5 10.5 L 0 6 L -7.5 10.5 L -5.5 2 L -12 -3.7 L -3.5 -4 Z" fill="#FFFFFF" stroke="' + OUT + '" stroke-width="2" stroke-linejoin="round"/>';

    } else if (style === "box") {

      still = '<rect x="-238" y="-238" width="476" height="476" rx="36" fill="' + fr + '" stroke="' + OUT + '" stroke-width="6"/>' +
        '<rect x="-56" y="-231" width="112" height="16" rx="8" fill="' + mix(fr, OUT, 0.6) + '" stroke="' + OUT + '" stroke-width="3"/>' +
        '<path d="M -222 -150 L -222 -206 Q -222 -222 -206 -222 L -150 -222" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="7" stroke-linecap="round"/>';
      [[-205, 205], [205, -205], [-205, -205]].forEach(function (q) {
        still += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="7" fill="' + mix(fr, "#FFFFFF", 0.5) + '" stroke="' + OUT + '" stroke-width="3"/>';
      });
      still += '<circle cx="200" cy="200" r="24" fill="' + hex(c.hub) + '" stroke="' + OUT + '" stroke-width="4"/>' +
        '<line x1="200" y1="200" x2="200" y2="182" stroke="' + OUT + '" stroke-width="5" stroke-linecap="round"/>';
      still += '<circle r="208" fill="' + mix(fr, OUT, 0.62) + '" stroke="' + OUT + '" stroke-width="6"/>';
      s += sweptBlades(cfg, 40, 196, 0.48, 0.72, 0.3);
      s += '<circle r="42" fill="' + hex(c.hub) + '" stroke="' + OUT + '" stroke-width="5"/>';
      s += '<circle r="15" fill="rgba(255,255,255,0.45)" stroke="' + OUT + '" stroke-width="3"/>';
      var grid = [], x, h;
      for (x = -180; x <= 180; x += 36) {
        h = Math.sqrt(208 * 208 - x * x) - 3;
        grid.push({ d: "M " + x + " " + (-h).toFixed(2) + " L " + x + " " + h.toFixed(2), col: cage });
        grid.push({ d: "M " + (-h).toFixed(2) + " " + x + " L " + h.toFixed(2) + " " + x, col: cage });
      }
      top = strokes(grid, 5.5, 2.6);

    } else if (style === "leaf") {

      for (i = 0; i < n; i++) {
        s += '<g transform="rotate(' + (i * 360 / n).toFixed(3) + ')">';
        s += '<path d="M 0 -55 Q ' + (2 * hw).toFixed(2) + ' -110 0 -215 Q ' + (-2 * hw).toFixed(2) + ' -145 0 -55 Z" data-c="' + mc(cfg, i) + '" fill="' + colorFor(cfg, i, n) + '" stroke="' + OUT + '" stroke-width="5" stroke-linejoin="round"/>';
        s += '<path d="M 0 -58 Q ' + (hw * 0.15).toFixed(2) + ' -135 0 -210" fill="none" stroke="rgba(29,35,64,0.5)" stroke-width="3" stroke-linecap="round" pointer-events="none"/>';

          var vx = (hw * v[1]).toFixed(2);

        s += '<path d="' + tip + '" ' + rot + ' fill="' + hex(c.tips) + '" stroke="' + OUT + '" stroke-width="4" stroke-linejoin="round" pointer-events="none"/>';
      }

      // Swoosh: swept blades inside a guard ring.
      s += sweptBlades(cfg, 50, 205, 0.42, 0.55, 0.25);

    s += '<circle r="58" fill="' + hex(c.hub) + '" stroke="' + OUT + '" stroke-width="6"/>';
    s += '<circle r="20" fill="rgba(255,255,255,0.45)" stroke="' + OUT + '" stroke-width="4"/>';
    return { still: still, spin: s, head: "", top: top };
  }

  // ---------- Jet engine ----------
  // Front view: cowling ring with an inlet lip, dark duct, fan blades and a spinner with a swirl.
  // Darkens a fill (hex or the rainbow's hsl) by fraction t.
  function shade(col, t) {
    if (col.charAt(0) === "#") return mix(col, OUT, t);

  }
  function arc(r, a0, a1) {
    return "M " + pt(r, a0) + " A " + r + " " + r + " 0 " + (a1 - a0 > Math.PI ? 1 : 0) + " 1 " + pt(r, a1);
  }

  // Twisted fan blades seen from the front. Each blade is centered on a curve that sweeps sideways
  // toward the tip; a light strip on one edge and a shadow on the other make it look twisted.
  function jetBlades(cfg, o) {
    var n = cfg.count, slot = 2 * Math.PI / n, s = "", i, k, steps = 12;
    for (i = 0; i < n; i++) {
      var a = i * slot, L = [], T = [], HL = [], ST = [];
      for (k = 0; k <= steps; k++) {

      var col = colorFor(cfg, i, n);
      if (o.dark) col = shade(col, o.dark);
      s += '<g data-c="' + mc(cfg, i) + '"><path d="' + body + '" fill="' + col + '"/>';
      s += '<path d="M ' + L.join(" L ") + " L " + HL.reverse().join(" L ") + ' Z" fill="rgba(255,255,255,0.38)"/>';
      s += '<path d="M ' + T.join(" L ") + " L " + ST.reverse().join(" L ") + ' Z" fill="rgba(29,35,64,0.22)"/>';
      s += '<path d="' + body + '" fill="none" stroke="' + OUT + '" stroke-width="' + o.sw + '" stroke-linejoin="round"/></g>';
    }
    return s;
  }

  // The classic spinner swirl: a spiral stripe from the tip that widens toward the edge.
  function swirlPath(R, a0) {
    var steps = 30, left = [], right = [], k, turn = 5.2, lim = R * 0.97;
    for (k = 0; k <= steps; k++) {
      var t = k / steps;
      var r = R * (0.1 + 0.84 * t), th = a0 + turn * t;
      var dr = 0.84 * R, dt = r * turn, len = Math.sqrt(dr * dr + dt * dt);
      var nr = -dt / len, nt = dr / len;
      var hw = R * (0.03 + 0.055 * Math.sqrt(t));
      left.push(pt(Math.min(lim, r + nr * hw), th + nt * hw / Math.max(r, 1)));
      right.push(pt(Math.min(lim, r - nr * hw), th - nt * hw / Math.max(r, 1)));

  }
  function jetSpinner(cfg, R, arms) {
    var c = cfg.colors, sp = hex(c.spinner), s = "", j;
    s += '<circle r="' + R + '" fill="' + sp + '" stroke="' + OUT + '" stroke-width="5"/>';
    for (j = 0; j < arms; j++) {
      s += '<path d="' + swirlPath(R, j * 2 * Math.PI / arms) + '" fill="' + hex(c.swirl) + '" stroke="' + OUT + '" stroke-width="2.5" stroke-linejoin="round"/>';
    }
    s += '<circle r="' + (R * 0.12).toFixed(2) + '" fill="' + mix(sp, "#FFFFFF", 0.35) + '" stroke="' + OUT + '" stroke-width="3"/>';
    return s;
  }
  // Fixed light on the spinner and blades (drawn over them, so it stays put while they spin).
  function jetShine(R) {
    return '<ellipse cx="' + (-R * 0.34).toFixed(2) + '" cy="' + (-R * 0.4).toFixed(2) + '" rx="' + (R * 0.34).toFixed(2) + '" ry="' + (R * 0.2).toFixed(2) +
      '" transform="rotate(-38 ' + (-R * 0.34).toFixed(2) + " " + (-R * 0.4).toFixed(2) + ')" fill="url(#ssshine)"/>';
  }

  function jetCowling(c, Rc, Rl, Rd, pylon) {
    var cowl = hex(c.cowl), lip = hex(c.lip), s = '<g data-c="cowl">';
    if (pylon) s += '<path d="M -34 -262 L 34 -262 L 30 -' + (Rc - 12) + ' L -30 -' + (Rc - 12) + ' Z" fill="' + shade(cowl, 0.18) + '" stroke="' + OUT + '" stroke-width="5" stroke-linejoin="round"/>';

    s += '<circle r="' + (Rc - 3) + '" fill="url(#sscowl)"/>';
    s += '<path d="' + arc((Rc + Rl) / 2 + 2, -1.35, -0.35) + '" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="5" stroke-linecap="round"/>';

    if (!grab || e.pointerId !== grab.id) return;
    if (Toybox.timer.locked()) { grab = null; return; }
    var a = ptrAng(e, grab.c), d = a - grab.a, now = performance.now(), dt = Math.max(0.008, (now - grab.t) / 1000);
    if (d > 180) d -= 360; if (d < -180) d += 360;
    grab.moved += Math.hypot(e.clientX - grab.x, e.clientY - grab.y);
    grab.x = e.clientX; grab.y = e.clientY;
    if (!grab.turning && grab.moved > 12 && grab.far) { grab.turning = true; vel = 0; }
    if (grab.turning) {
      angle = (angle + d) % 360;
      applyTransform();
      grab.v = grab.v * 0.5 + clamp(d / dt, -1600, 1600) * 0.5;
    }
    grab.a = a; grab.t = now;
  });
  function letGo(e) {
    if (!grab || e.pointerId !== grab.id) return;
    // A fling keeps going; a finger that stopped before letting go leaves it still.
    if (grab.turning) { vel = performance.now() - grab.t > 140 ? 0 : grab.v; spun(true); }
    else if (e.type === "pointerup" && grab.moved < 12 && !Toybox.timer.locked()) { spun(false); tapPick(grab.el, e.clientX, e.clientY); }
    grab = null;
  }
  // A tap on the stage around the picture puts the colors away too.
  $("stage").addEventListener("pointerdown", function (e) {
    if (picking && !(e.target.closest && e.target.closest("#art, button"))) setPicking("");
  });
  art.addEventListener("pointerup", letGo);
  art.addEventListener("pointercancel", letGo);
  art.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); kick(); }
  });

  // ---------- Coach, ghost hand, bottom bar ----------
  var coach = Toybox.coach($("coach"));
  // Idle help: the ghost hand taps the toy first (a tap spins it); on its next showing it turns the toy round
  // with a finger; once he has spun it, it taps a big part to color it.
  var ghost = Toybox.ghost({
    max: 2,
    plan: function () {
      if (mo || document.body.classList.contains("big")) return null;
      var r = art.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = Math.min(r.width, r.height) * 0.3, pts = [];
      if (R < 30) return null;
      if (!paintHint) {
        if (ghost.shown("spin") < 1) return { pts: [[cx + R * 0.55, cy - R * 0.55]], tap: true, key: "spin" };
        for (var i = 0; i <= 12; i++) { var a = (-150 + i * 15) * Math.PI / 180; pts.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]); }
        return { pts: pts, key: "turn" };
      }
      if (pickedOnce || picking) return null;
      // a big part: the tire, the blades or petals, the cowling
      var el = art.querySelector('[data-c="tire"]') || art.querySelector('[data-c="main"]');
      if (!el) return null;
      var b = el.getBoundingClientRect();
      var p = state.mode === "wheel" ? [b.left + b.width * 0.5, b.top + b.height * 0.04] : [b.left + b.width / 2, b.top + b.height / 2];
      return { pts: [p], tap: true, key: "part" };
    }
  });
  // New: the toy on screen goes back to how it first looked (his other toys keep their colors).
  function startOver() {
    if (Toybox.timer.locked()) return;
    momentStop();
    var m = state.mode, d = MODES[m].defaults;
    state.per[m] = { count: d.count, pattern: d.pattern, style: d.style, colors: Object.assign({}, d.colors) };
    if (d.lights !== undefined) { state.per[m].lights = d.lights; state.per[m].lightColor = d.lightColor; }
    state.part[m] = "main";
    tilesFor = "";
    picking = "";
    render();
    vel += 300;
    sparkleAt(0, 0, 10, 200);
    coach.say("A fresh " + MODES[m].label.toLowerCase() + "!", 3);
  }
  tiles = Toybox.tiles($("tiles"), { items: [], kind: "pick", rows: 2, onPick: onTile });
  Toybox.bar($("bottom"), { onNew: startOver, onSurprise: function () { if (picking) setPicking(""); surprise(); } });
  var last = performance.now();
  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    var ending = Toybox.timer.phase() === "ending";
    // While ending, everything winds down to a stop more gently than a normal speed change.
    var target = ending ? 0 : (reduce ? 0 : SPEEDS.slow);
    vel += (target - vel) * Math.min(1, dt * (ending ? 0.4 : 0.95));
    if (grab && grab.turning) { /* the finger is turning it */ }
    else if (Math.abs(vel) > 0.5 || target !== 0) {
      angle = (angle + vel * dt) % 360;
      applyTransform();
    }
    // Ending: tell the shared timer once the picture has slowed to a stop.
    if (ending && endingDone && Math.abs(vel) < 2) { endingDone(); endingDone = null; }
    requestAnimationFrame(frame);
  }

  // ---------- Play timer (shared, common/toybox.js) ----------
  // Ring around the picture: the colored arc is the time left, shrinking back toward the top.
  var RING_R = 238;
  function drawTimer(info) {
    var g = $("timerG"), wrap = $("artwrap");
    if (info.phase !== "running" && info.phase !== "ending") { g.innerHTML = ""; wrap.removeAttribute("transform"); return; }
    var f = info.fraction, mins = info.minutes;
    wrap.setAttribute("transform", "scale(0.86)");
    var col = f > 0.5 ? "#2E9E5B" : (f > 0.2 ? "#FFC93C" : "#F77F00");
    var sv = '<circle r="' + RING_R + '" fill="none" stroke="rgba(29,35,64,0.14)" stroke-width="20"/>';
    if (f >= 0.9995) {
      sv += '<circle r="' + RING_R + '" fill="none" stroke="' + col + '" stroke-width="20"/>';
    } else if (f > 0.002) {
      var a = f * 2 * Math.PI;
      sv += '<path d="M ' + pt(RING_R, 0) + " A " + RING_R + " " + RING_R + " 0 " + (a > Math.PI ? 1 : 0) + " 1 " + pt(RING_R, a) +
        '" fill="none" stroke="' + col + '" stroke-width="20" stroke-linecap="round"/>';
    }
    if (info.showMinutes && info.phase === "running") {
      sv += '<circle cx="214" cy="-214" r="32" fill="#FFFFFF" stroke="' + OUT + '" stroke-width="4"/>' +
        '<text x="214" y="-212" text-anchor="middle" dominant-baseline="central" font-size="' + (mins > 9 ? 30 : 36) +
        '" font-weight="800" font-family="Baloo 2, Trebuchet MS, sans-serif" fill="' + OUT + '">' + mins + "</text>";
    }
    g.innerHTML = sv;
  }

  // Ending: the picture winds down in frame(); endingDone is called once it has stopped.
  var endingDone = null;
  function restArt() {
    var m = state.mode;
    return '<svg class="rest-art" viewBox="-250 -250 500 500" aria-hidden="true">' + svgInner(DRAW[m](state.per[m])) + "</svg>";
  }

  render();
  coach.step("Spin the " + MODES[state.mode].label.toLowerCase() + "!");
  // The shared grown-up layer: play timer, sound, Big. It may start the ending right away
  // (a timer that ran out while away), so the picture is set up first.
  // The toast and the ending banner sit inside the picture frame, as before.
  Toybox.init({
    app: "spin-shop",
    big: { button: $("bigbtn") },
    timerIntro: "For grown-ups. When time is up, the picture slows down and rests, and the controls lock.",
    goodbyeOption: "End with a Goodbye spin button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Goodbye spin",
    farewellDone: "Bye bye!",
    restLine: "The picture is resting.",
    restLine2: "It will be right here next time.",
    restArt: restArt,
    soundNote: "Spin Shop is quiet. This sets sound for all the Toybox apps. Hold for 2 seconds.",
    legacy: { timer: "spinshop-timer-v1" },
    onEnding: function (done) { endingDone = done; },
    onGoodbye: function () { vel += 700; },
    onRest: function () {
      endingDone = null;
      vel = 0;
      Toybox.setBig(false);
      $("tb-restLine").textContent = "The " + MODES[state.mode].label.toLowerCase() + " is resting.";
    },
    onWake: function () { endingDone = null; },
    onBig: function (on) { if (on && picking) setPicking(""); },
    onTimer: drawTimer
  });
  $("stage").appendChild($("tb-toast"));
  $("stage").appendChild($("tb-farewell"));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
