<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gear Box</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gear Box">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 1366px;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header h1 { margin: 0; white-space: nowrap; font-size: 1.35rem; font-weight: 800; line-height: 1; letter-spacing: -0.01em; }
.homebtn {
  flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 34px;
  padding: 2px 12px 2px 9px; font-weight: 700; font-size: 1rem; color: var(--ink); text-decoration: none;
  background: var(--panel); border: 3px solid var(--edge); border-radius: 12px; box-shadow: 2px 2px 0 var(--edge);
}
.homebtn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }
.homebtn:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
.homebtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.hdr-right { display: flex; gap: 10px; align-items: center; }
.app { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }

/* ---------- Stage: the gear plate ---------- */
.stage {
  position: relative; flex: 1 1 auto; min-height: 0; background: var(--plate);
  border: 3px solid var(--edge); border-radius: 24px; box-shadow: 4px 4px 0 var(--edge); padding: 6px;
}
.scene {
  position: relative; width: 100%; height: 100%; border: 3px solid #1D2340; border-radius: 18px;
  overflow: hidden; background: #9FB3C8; touch-action: none;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.info {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 2;
  display: flex; align-items: center; gap: 10px; max-width: calc(100% - 150px);
  background: #FFFFFF; color: #1D2340; border: 3px solid #1D2340; border-radius: 18px;
  box-shadow: 3px 3px 0 #1D2340; padding: 4px 8px 4px 14px; font-weight: 800;
  font-size: clamp(1rem, 2.6vw, 1.5rem); line-height: 1.15; font-variant-numeric: tabular-nums;
}
.info[hidden] { display: none; }
.info .btn { min-height: 44px; font-size: 1rem; padding: 0.1rem 0.7rem; color: #1D2340; background: var(--accent); border-color: #1D2340; box-shadow: 2px 2px 0 #1D2340; white-space: nowrap; }
.info .btn[hidden] { display: none; }
.hint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2; pointer-events: none;
  background: var(--accent); color: #1D2340; border: 4px solid #1D2340; border-radius: 22px;
  box-shadow: 4px 4px 0 #1D2340; padding: 0.1rem 1rem 0.2rem; font-size: clamp(1.1rem, 3.4vw, 2rem);
  font-weight: 800; white-space: nowrap;
}
.hint[hidden] { display: none; }
.hint.go { animation: hintPop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hintPop { 0% { transform: translateX(-50%) scale(0.3); } 100% { transform: translateX(-50%) scale(1); } }
.ghost { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; filter: drop-shadow(6px 8px 0 rgba(29, 35, 64, 0.35)); }
.ghost svg { display: block; width: 100%; height: 100%; }

/* Play-timer gauge */
.fuel { position: absolute; top: 8px; left: 8px; z-index: 2; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.fuel[hidden] { display: none; }
.fuel-bar { width: clamp(70px, 18vw, 150px); height: 18px; background: rgba(255, 255, 255, 0.8); border: 3px solid #1D2340; border-radius: 999px; overflow: hidden; }
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num { min-width: 40px; height: 40px; display: grid; place-items: center; background: #FFFFFF; color: #1D2340; border: 3px solid #1D2340; border-radius: 50%; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.fuel-num[hidden] { display: none; }

/* Big mode */
.bigtoggle {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  color: #1D2340; background: #FFFFFF; border-color: #1D2340; box-shadow: 3px 3px 0 #1D2340;
}
.bigtoggle[aria-pressed="true"] { background: var(--accent); }
.bigtoggle:active { box-shadow: 0 0 0 #1D2340; }
body.big header, body.big .panel { display: none; }
body.big .wrap { max-width: none; padding: max(6px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); }
body.big .app { margin-top: 0; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }

/* ---------- Panel: tray, drive, examples ---------- */
.panel {
  flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 10px 10px;
  background: var(--panel); border: 3px solid var(--edge); border-bottom-width: 0; border-radius: 24px 24px 0 0;
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
}
.tray { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.tg {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0;
  padding: 6px 2px 4px; min-height: 0; font-size: clamp(1.05rem, 3.6vw, 1.5rem); font-weight: 800; line-height: 1;
  touch-action: none;
}
.tg svg { width: 100%; max-width: 104px; aspect-ratio: 1; display: block; pointer-events: none; }
.tg span { pointer-events: none; }
.ctrl { display: flex; gap: 8px; align-items: stretch; flex-wrap: nowrap; }
.ctrl .btn { min-width: 0; padding: 0.2rem 0.4rem; font-size: clamp(0.85rem, 2.8vw, 1.15rem); white-space: nowrap; }
.seg { display: flex; gap: 6px; flex: 1 1 0; min-width: 0; }
.seg .btn { flex: 1 1 0; }
.dialbox { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
.dial { width: 64px; height: 64px; touch-action: none; cursor: pointer; flex: none; }
.dial svg { width: 100%; height: 100%; display: block; pointer-events: none; }
.dialnum { font-weight: 800; font-size: 1.1rem; min-width: 4.2ch; line-height: 1.05; text-align: center; font-variant-numeric: tabular-nums; }
.dialnum small { display: block; font-size: 0.75rem; color: var(--muted); }
body:not(.motor) .dialbox { opacity: 0.35; pointer-events: none; }
.ex { flex: 1 1 0; }
.btn.clear { background: #FFE3E3; color: #1D2340; }
body.ending .panel { pointer-events: none; opacity: 0.4; }

/* Rest picture: the sleeping gears on a night sky (the rest screen itself is in common/toybox.css). */
.rest-art { aspect-ratio: 1; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }

/* Landscape: plate on the left, controls on the right. */
@media (orientation: landscape) {
  .app { flex-direction: row; }
  .stage { margin-bottom: 8px; }
  .panel { flex: 0 0 min(40%, 400px); margin-bottom: 8px; border-bottom-width: 3px; border-radius: 24px; justify-content: space-between; padding-bottom: 10px; }
  .tray { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 420px) {
  header { gap: 8px; }
  header h1 { font-size: 1.15rem; }
  .hdr-right { gap: 6px; }
  #timerbtn { padding: 0.1rem 0.55rem !important; }
}
@media (min-width: 744px) and (min-height: 640px) {
  .wrap { padding-top: 12px; }
  header h1 { font-size: 2rem; }
  .homebtn { min-height: 44px; font-size: 1.1rem; }
  .app { gap: 14px; margin-top: 10px; }
  .stage { padding: 10px; }
  .panel { gap: 12px; padding: 12px 14px 14px; }
  .tray { gap: 10px; }
  .ctrl { gap: 10px; }
  .ctrl .btn { min-height: 60px; font-size: 1.2rem; }
  .dial { width: 76px; height: 76px; }
  .fuel-num { min-width: 48px; height: 48px; font-size: 1.5rem; }
  .bigtoggle { top: 14px; right: 14px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  /* Keep a slim header (not display:none) so Home and Grown-ups stay reachable. */
  .wrap { padding-top: max(4px, env(safe-area-inset-top, 0px)); }
  header h1 { font-size: 1.05rem; }
  .homebtn { min-height: 34px; }
  #timerbtn { min-height: 34px !important; }
  .app { margin-top: 4px; }
  .panel { gap: 5px; padding: 6px 8px; }
  .tray { gap: 4px; }
  .tg svg { max-width: 52px; }
  .tg { font-size: 1rem; }
  .ctrl .btn { min-height: 44px; font-size: 0.85rem; }
  .dial { width: 48px; height: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  .hint.go { animation: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gear Box</h1>
    <div class="hdr-right">
      <a class="homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg><span>Home</span></a>
      <button class="btn" id="timerbtn" style="min-height:44px;font-size:1rem;padding:0.1rem 0.8rem;white-space:nowrap">⏱ Grown-ups</button>
    </div>
  </header>

  <main class="app">
    <div class="stage">
      <div class="scene" id="scene">
        <canvas id="cv" aria-label="A plate of pegs with gears"></canvas>
        <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
        <div class="info" id="info" hidden><span id="infoText"></span><button class="btn" id="driveThis" hidden>Drive this</button></div>
        <div class="hint" id="hint" hidden></div>
        <button class="btn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls">Big</button>
      </div>
    </div>

    <div class="panel">
      <div class="tray" id="tray"></div>
      <div class="ctrl">
        <div class="seg">
          <button class="btn" data-mode="crank" aria-pressed="true">Crank</button>
          <button class="btn" data-mode="motor" aria-pressed="false">Motor</button>
        </div>
        <div class="dialbox">
          <div class="dial" id="dial" role="slider" aria-label="Motor speed" aria-valuemin="0" aria-valuemax="60" tabindex="0"><svg viewBox="-50 -50 100 100" id="dialSvg"></svg></div>
          <div class="dialnum"><span id="dialNum">Slow</span></div>
        </div>
      </div>
      <div class="ctrl">
        <button class="btn ex" data-ex="long">Long train</button>
        <button class="btn ex clear" data-ex="clear">Clear</button>
      </div>
    </div>
  </main>

</div>

<div class="ghost" id="ghost" hidden></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  var TAU = Math.PI * 2;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Gear model ----------
  // World units: pitch radius = teeth / 4, so any two gears mesh when their centers are
  // (teethA + teethB) / 4 pegs apart. Pegs sit on every whole unit.
  var WW = 44, WH = 36;
  var SIZES = [8, 12, 16, 20, 24, 32, 40];
  var COLORS = { 8: "#E63946", 12: "#F77F00", 16: "#FFC93C", 20: "#2E9E5B", 24: "#3A86FF", 32: "#8338EC", 40: "#FF5DA2" };
  var MESH_TOL = 0.36;
  function R(T) { return T / 4; }
  function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function mix(a, b, t) {
    var x = hexRgb(a), y = hexRgb(b);
    return "rgb(" + [0, 1, 2].map(function (k) { return Math.round(x[k] + (y[k] - x[k]) * t); }).join(",") + ")";
  }

  var shapes = {};
  function gearPts(T) {
    if (shapes[T]) return shapes[T];
    var r = R(T), ro = r + 0.5, rr = r - 0.62, per = TAU / T, pts = [];
    for (var i = 0; i < T; i++) {
      var c = i * per;
      [[c - 0.31 * per, rr], [c - 0.15 * per, ro], [c + 0.15 * per, ro], [c + 0.31 * per, rr]].forEach(function (p) {
        pts.push([Math.cos(p[0]) * p[1], Math.sin(p[0]) * p[1]]);
      });
    }
    shapes[T] = pts;
    return pts;
  }
  function holeCount(T) { return T >= 32 ? 6 : T >= 20 ? 5 : T >= 16 ? 4 : T >= 12 ? 3 : 0; }
  function hubR(T) { return clamp(R(T) * 0.42, 1.05, 2.3); }

  // SVG version (tray buttons, ghost, rest picture).
  function gearSVG(T, cx, cy, sc, rot, sw) {
    var pts = gearPts(T), d = "", ca = Math.cos(rot || 0), sa = Math.sin(rot || 0);
    pts.forEach(function (p, i) {
      var x = cx + (p[0] * ca - p[1] * sa) * sc, y = cy + (p[0] * sa + p[1] * ca) * sc;
      d += (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
    });
    var col = COLORS[T], r = R(T), o = '<path d="' + d + 'Z" fill="' + col + '" stroke="#1D2340" stroke-width="' + sw + '" stroke-linejoin="round"/>';
    var hc = holeCount(T), hr = (r - 0.62 + hubR(T)) / 2;
    for (var i = 0; i < hc; i++) {
      var a = (rot || 0) + i * TAU / hc;
      o += '<circle cx="' + (cx + Math.cos(a) * hr * sc).toFixed(2) + '" cy="' + (cy + Math.sin(a) * hr * sc).toFixed(2) + '" r="' + (Math.min(0.32 * (r - 0.62 - hubR(T)), 0.55 * hr * Math.PI / hc) * sc).toFixed(2) + '" fill="' + mix(col, "#1D2340", 0.45) + '"/>';
    }
    o += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (hubR(T) * sc).toFixed(2) + '" fill="#FFFFFF" stroke="#1D2340" stroke-width="' + sw * 0.8 + '"/>';
    return o;
  }

  // ---------- State ----------
  var KEY = "gearbox-state-v1";
  var gears = [], nextId = 1, driverId = 0, mode = "crank", motorRpm = 10;
  var selected = [];
  function mkGear(T, x, y) {
    return { id: nextId++, T: T, x: x, y: y, a: 0, w: 0, acc: 0, turns: 0, flash: 0, wob: 0 };
  }
  function byId(id) { for (var i = 0; i < gears.length; i++) if (gears[i].id === id) return gears[i]; return null; }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        gears: gears.map(function (g) { return { T: g.T, x: g.x, y: g.y }; }),
        driver: Math.max(0, gears.indexOf(byId(driverId))), mode: mode, rpm: motorRpm
      }));
    } catch (e) { /* ignore */ }
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!o || typeof o !== "object") return false;
      if (o.mode === "motor" || o.mode === "crank") mode = o.mode;
      if (typeof o.rpm === "number") motorRpm = clamp(Math.round(o.rpm), 0, 60);
      (o.gears || []).forEach(function (s) {
        if (SIZES.indexOf(s.T) === -1 || typeof s.x !== "number" || typeof s.y !== "number") return;
        if (!validSpot(s.T, s.x, s.y, null)) return;
        // Older saves may carry an "att" (flag/clock/winch add-on) and "lift": those are gone, so they are ignored.
        gears.push(mkGear(s.T, s.x, s.y));
      });
      var d = gears[o.driver | 0] || gears[0];
      driverId = d ? d.id : 0;
      return true;
    } catch (e) { return false; }
  }

  // ---------- Placement ----------
  function inBounds(T, x, y) { var r = R(T); return x - r >= 0 && x + r <= WW && y - r >= 0 && y + r <= WH; }
  // Returns -1 if the spot is blocked, else how many gears it meshes with.
  function spotMeshes(T, x, y, ignore) {
    if (!inBounds(T, x, y)) return -1;
    var n = 0;
    for (var i = 0; i < gears.length; i++) {
      var g = gears[i];
      if (g === ignore) continue;
      var d = Math.hypot(g.x - x, g.y - y), need = R(T) + R(g.T);
      if (Math.abs(d - need) < MESH_TOL) n++;
      else if (d < need + 1.15) return -1;
    }
    return n;
  }
  function validSpot(T, x, y, ignore) { return spotMeshes(T, x, y, ignore) >= 0; }
  function findPeg(T, x, y, rad, ignore) {
    var best = null, bs = Infinity, x0 = Math.round(x), y0 = Math.round(y);
    for (var px = x0 - rad; px <= x0 + rad; px++) {
      for (var py = y0 - rad; py <= y0 + rad; py++) {
        var m = spotMeshes(T, px, py, ignore);
        if (m < 0) continue;
        var s = (px - x) * (px - x) + (py - y) * (py - y) - (m > 0 ? 6 + m : 0);
        if (s < bs) { bs = s; best = { x: px, y: py, m: m }; }
      }
    }
    return best;
  }
  function autoPlace(T) {
    if (!gears.length) return findPeg(T, WW / 2, WH / 2, 20, null);
    var anchor = byId(selected[selected.length - 1]) || gears[gears.length - 1];
    var need = R(T) + R(anchor.T);
    var angs = [0, Math.PI / 2, -Math.PI / 2, Math.PI, Math.PI / 4, -Math.PI / 4, 3 * Math.PI / 4, -3 * Math.PI / 4, 0.64, -0.64, 0.93, -0.93];
    for (var i = 0; i < angs.length; i++) {
      var p = findPeg(T, anchor.x + Math.cos(angs[i]) * need, anchor.y + Math.sin(angs[i]) * need, 1, null);
      if (p && p.m > 0) return p;
    }
    return findPeg(T, anchor.x, anchor.y, 30, null);
  }

  // ---------- Mesh graph ----------
  var adj = {}, comps = [], driverComp = null, jammed = false;
  function rebuild() {
    adj = {};
    gears.forEach(function (g) { adj[g.id] = []; });
    for (var i = 0; i < gears.length; i++) for (var j = i + 1; j < gears.length; j++) {
      var a = gears[i], b = gears[j];
      if (Math.abs(Math.hypot(a.x - b.x, a.y - b.y) - R(a.T) - R(b.T)) < MESH_TOL) { adj[a.id].push(b); adj[b.id].push(a); }
    }
    if (!byId(driverId)) driverId = gears.length ? gears[0].id : 0;
    comps = []; driverComp = null; jammed = false;
    var seen = {};
    var roots = gears.slice();
    var d = byId(driverId);
    if (d) { roots.splice(roots.indexOf(d), 1); roots.unshift(d); }
    roots.forEach(function (root) {
      if (seen[root.id]) return;
      var order = [], parent = {}, color = {}, bad = false, q = [root];
      seen[root.id] = true; color[root.id] = 0;
      while (q.length) {
        var g = q.shift();
        order.push(g);
        adj[g.id].forEach(function (n) {
          if (!seen[n.id]) { seen[n.id] = true; parent[n.id] = g; color[n.id] = 1 - color[g.id]; q.push(n); }
          else if (color[n.id] === color[g.id]) bad = true;
        });
      }
      var c = { order: order, parent: parent, bad: bad };
      comps.push(c);
      if (root.id === driverId) { driverComp = c; jammed = bad; }
    });
    var known = {};
    gears.forEach(function (g) { known[g.id] = 1; });
    selected = selected.filter(function (id) { return known[id]; });

    }
    if (p.kind === "press") { if (!cancel) tapGear(p.gear); return; }
    if (p.kind === "drag" || p.kind === "new") {
      if (p.kind !== "drag" && !p.started) { ghost.hidden = true; if (!cancel) tapTray(p); return; }
      if (!anyGhost()) ghost.hidden = true;
      var w = toWorld(p.cx, p.cy);
      if (!w.inside || cancel) {
        if (p.kind === "drag") {
          // dragged off the plate: gone
          poof(p.cx - rc.left, p.cy - rc.top, p.T);
          rebuild(); save();
        }
        return;
      }
      var spot = findPeg(p.T, w.x, w.y, 8, null);
      if (!spot && p.kind === "drag") spot = { x: p.from.x, y: p.from.y, m: 0 };
      if (!spot) { hint("No room there!", 1500); return; }
      var gg = p.kind === "drag" ? p.gear : mkGear(p.T, spot.x, spot.y);
      gg.x = spot.x; gg.y = spot.y;
      gears.push(gg);
      if (!driverId || p.wasDriver) driverId = gg.id;
      placed(gg, spot.m);
    }
  }
  function anyGhost() { return Object.keys(ptrs).some(function (k) { var p = ptrs[k]; return p.kind === "drag" || p.started; }); }
  window.addEventListener("pointerup", endPtr);
  window.addEventListener("pointercancel", endPtr);

  function placed(g, meshes) {
    rebuild();
    save();
    var x = OX + g.x * S, y = OY + g.y * S;
    ring(x, y, (R(g.T) + 1) * S, meshes ? "#FFC93C" : "#FFFFFF");
    burst(x, y, meshes ? 16 : 8, null);
    if (meshes) clack(); else pop();
  }
  function poof(x, y, T) { burst(x, y, 14, COLORS[T]); whooshSnd(); }

  function tapGear(g) {
    var i = selected.indexOf(g.id);
    if (i !== -1) selected.splice(i, 1);
    else { selected.push(g.id); if (selected.length > 2) selected.shift(); }
    ring(OX + g.x * S, OY + g.y * S, (R(g.T) + 1) * S, "#FFC93C");
    blip();
    updateInfo(true);
  }
  function tapTray(p) {
    var spot = autoPlace(p.T);
    if (!spot) { hint("No room! Drag a gear off.", 1800); return; }
    var gg = mkGear(p.T, spot.x, spot.y);
    gears.push(gg);
    if (!driverId) driverId = gg.id;
    placed(gg, spot.m);
  }

  $("driveThis").addEventListener("click", function () {
    var g = byId(selected[0]);
    if (!g) return;
    var old = byId(driverId);
    var w = old ? old.w : 0;
    driverId = g.id;
    rebuild();
    g.w = 0;
    save();
    ring(OX + g.x * S, OY + g.y * S, (R(g.T) + 1.4) * S, "#E63946");
    chime();
    updateInfo(true);
  });

  // ---------- Tray ----------
  SIZES.forEach(function (T) {
    var b = document.createElement("button");
    b.className = "btn tg";
    b.setAttribute("aria-label", T + " teeth gear");
    var r = R(T) + 0.7, vb = r / (0.5 + 0.5 * T / 40);
    b.innerHTML = '<svg viewBox="' + (-vb) + " " + (-vb) + " " + 2 * vb + " " + 2 * vb + '" aria-hidden="true">' + gearSVG(T, 0, 0, 1, 0, 0.3 * vb / 6) + "</svg><span>" + T + "</span>";
    b.addEventListener("pointerdown", function (e) { startTrayDrag(e, { kind: "new", T: T }); });
    $("tray").appendChild(b);
  });

  // ---------- Drive mode + speed dial ----------
  function setMode(m) {
    mode = m;
    document.body.classList.toggle("motor", m === "motor");
    Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"), function (b) { b.setAttribute("aria-pressed", String(b.dataset.mode === m)); });
    save();
  }
  function drawDial() {
    var a = (-135 + motorRpm / 60 * 270) * Math.PI / 180;
    var o = '<circle r="44" fill="#E6F2FF" stroke="#1D2340" stroke-width="5"/>';
    for (var i = 0; i <= 6; i++) {
      var t = (-135 + i * 45) * Math.PI / 180;
      o += '<line x1="' + (Math.sin(t) * 34).toFixed(1) + '" y1="' + (-Math.cos(t) * 34).toFixed(1) + '" x2="' + (Math.sin(t) * 41).toFixed(1) + '" y2="' + (-Math.cos(t) * 41).toFixed(1) + '" stroke="#1D2340" stroke-width="3" stroke-linecap="round"/>';
    }
    o += '<circle r="26" fill="#FFC93C" stroke="#1D2340" stroke-width="5"/>';
    o += '<line x1="0" y1="0" x2="' + (Math.sin(a) * 30).toFixed(1) + '" y2="' + (-Math.cos(a) * 30).toFixed(1) + '" stroke="#E63946" stroke-width="8" stroke-linecap="round"/>';
    o += '<circle r="6" fill="#1D2340"/>';
    $("dialSvg").innerHTML = o;
    $("dialNum").textContent = motorRpm === 0 ? "Off" : motorRpm <= 20 ? "Slow" : motorRpm <= 40 ? "Medium" : "Fast";
    $("dial").setAttribute("aria-valuenow", String(motorRpm));
  }
  var dialPtr = null;
  function dialSet(e) {
    var r = $("dial").getBoundingClientRect();
    var a = Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) * 180 / Math.PI;
    var v = clamp((a + 135) / 270 * 60, 0, 60);
    var nv = Math.round(v / 5) * 5;
    if (nv !== motorRpm) { motorRpm = nv; drawDial(); blip(); save(); }
  }
  $("dial").addEventListener("pointerdown", function (e) { e.preventDefault(); dialPtr = e.pointerId; try { this.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } dialSet(e); });
  $("dial").addEventListener("pointermove", function (e) { if (dialPtr === e.pointerId) dialSet(e); });
  $("dial").addEventListener("pointerup", function () { dialPtr = null; });
  $("dial").addEventListener("pointercancel", function () { dialPtr = null; });
  $("dial").addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp" || e.key === "ArrowRight") motorRpm = Math.min(60, motorRpm + 5);
    else if (e.key === "ArrowDown" || e.key === "ArrowLeft") motorRpm = Math.max(0, motorRpm - 5);
    else return;
    e.preventDefault(); drawDial(); save();
  });

  // ---------- Examples ----------
  function example(name) {
    gears = []; selected = []; driverId = 0;
    function add(T, x, y) { var g = mkGear(T, x, y); gears.push(g); return g; }
    if (name === "long") {
      // Seven gears in one chain (each pair exactly (Ta + Tb) / 4 pegs apart, no loops, so nothing jams).
      add(16, 5, 12); add(12, 12, 12); add(20, 20, 12); add(8, 27, 12); add(24, 35, 12);
      add(32, 35, 26); add(12, 24, 26);
      setMode("motor"); if (!motorRpm) motorRpm = 10;
    }
    drawDial();
    driverId = gears.length ? gears[0].id : 0;
    rebuild(); save();
    gears.forEach(function (g) { burst(OX + g.x * S, OY + g.y * S, 6, COLORS[g.T]); });
    if (name === "clear") whooshSnd(); else chime();
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (Toybox.timer.locked()) return;
    if (t.dataset.mode) { setMode(t.dataset.mode); blip(); }
    else if (t.dataset.ex) example(t.dataset.ex);
  });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { if (!e.target.closest("input")) e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { if (!e.target.closest(".sheet")) e.preventDefault(); }, { passive: false });

  // ---------- Sound (off by default; soft and synthesized) ----------
  // The on/off setting and the AudioContext are shared Toybox-wide (common/toybox.js); the module
  // starts/resumes audio on every touch while sound is on. Gear Box keeps its own master gain.
  var master = null, masterCtx = null;
  function out(ac) {
    if (masterCtx !== ac) { master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination); masterCtx = ac; }
    return master;
  }
  function tone(freq, dur, vol, type, slideTo) {
    var actx = Toybox.sound.ready();
    if (!actx) return;
    var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out(actx));
    o.start(t); o.stop(t + dur + 0.05);
  }
  function tick() { tone(rand(1500, 1800), 0.035, 0.018, "triangle"); }
  function blip() { tone(rand(520, 720), 0.14, 0.04, "sine", 880); }
  function pop() { tone(380, 0.12, 0.04, "sine", 620); }
  function clack() { tone(660, 0.06, 0.05, "triangle"); setTimeout(function () { tone(990, 0.08, 0.04, "triangle"); }, 60); }
  function bonk() { tone(220, 0.25, 0.05, "sine", 180); }
  function whooshSnd() { tone(700, 0.25, 0.035, "sine", 250); }
  function chime() { tone(523, 0.4, 0.04); setTimeout(function () { tone(784, 0.6, 0.04); }, 120); }

  // ---------- Play timer hooks (the timer, sheet, toast and rest screen live in common/toybox.js) ----------
  // The fuel gauge in the plate's corner shows the time left.
  function drawFuel(info) {
    var active = info.phase === "running" || info.phase === "ending";
    $("fuel").hidden = !active;
    if (!active) return;
    var f = info.fraction, fill = $("fuelFill");
    fill.style.width = (f * 100).toFixed(1) + "%";
    fill.style.background = f > 0.5 ? "#2E9E5B" : (f > 0.2 ? "#FFC93C" : "#F77F00");
    $("fuelNum").hidden = !(info.showMinutes && info.phase === "running");
    $("fuelNum").textContent = String(info.minutes);
  }
  // Ending: let go of any crank or drag in progress; the gears coast to a stop.
  function onEnding(done) {
    ending = true;
    endingDone = done;
    Object.keys(ptrs).forEach(function (k) { if (ptrs[k].kind === "drag") { gears.push(ptrs[k].gear); } delete ptrs[k]; });
    ghost.hidden = true;
    if (cranking) { var d = byId(driverId); if (d) d.w = crankW; cranking = null; }
    selected = []; rebuild();
  }
  // Last spin: one more whirl before the gears stop.
  function goodbyeSpin() {
    var d = byId(driverId);
    if (d && !jammed) { d.w = 9; coastBoost = 1.6; }
    chime();
  }
  function onRest() {
    ending = false; endingDone = null; coastBoost = 0;
    gears.forEach(function (g) { g.w = 0; });
  }
  function onWake() { ending = false; endingDone = null; coastBoost = 0; }
  function restSVG() {
    var o = '<svg class="rest-art" viewBox="-50 -50 100 100" aria-hidden="true">';
    o += '<circle cx="34" cy="-36" r="9" fill="#FFF4CC" stroke="#1D2340" stroke-width="2"/><circle cx="38" cy="-39" r="8" fill="#2B3A67"/>';
    o += '<g opacity="0.95">' + gearSVG(40, -12, 14, 2.6, 0.1, 1.4) + gearSVG(20, 23.1, 14, 2.6, 0.22, 1.4) + "</g>";
    o += '<text x="-36" y="-26" font-family="Baloo 2, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">z</text><text x="-26" y="-36" font-family="Baloo 2, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">z</text><text x="-19" y="-43" font-family="Baloo 2, sans-serif" font-weight="800" font-size="7" fill="#FFFFFF">z</text>';
    return o + "</svg>";
  }

  // ---------- Start ----------
  if (!load()) example("long");
  setMode(mode);
  drawDial();
  resize();
  rebuild();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { plateKey = ""; });
  // Old Gear Box sound key held "on"/"off"; the shared migration reads "1"/"true", so translate it once.
  try { if (localStorage.getItem("gearbox-sound-v1") === "on") localStorage.setItem("gearbox-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "gear-box",
    grownButton: $("timerbtn"),
    grownLabel: ["⏱ Grown-ups", "⏱ Timer on"],
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the gears coast to a stop and rest, and the controls lock.",
    goodbyeOption: "End with a Last spin button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Last spin",
    farewellDone: "Bye bye, gears!",
    restLine: "The gears are resting.",
    restLine2: "They will be right here next time.",
    restArt: restSVG,
    soundNote: "Soft tooth clicks. Hold for 2 seconds.",
    legacy: { timer: "gearbox-timer-v1", sound: "gearbox-sound-v1", big: "gearbox-big-v1" },
    onEnding: onEnding,
    onGoodbye: goodbyeSpin,
    onRest: onRest,
    onWake: onWake,
    onBig: function () { resize(); },
    onSound: function (on) { if (on) setTimeout(chime, 60); },
    onTimer: drawFuel
  });
  requestAnimationFrame(loop);

  // Test hook, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) window.__gears = {
    gears: function () { return gears.map(function (g) { return { id: g.id, T: g.T, x: g.x, y: g.y, rpm: rpmOf(g), w: g.w, turns: g.turns }; }); },
    jammed: function () { return jammed; }, driver: function () { return driverId; },
    toScreen: function (x, y) { var r = cv.getBoundingClientRect(); return { x: r.left + OX + x * S, y: r.top + OY + y * S }; },
    knob: function () { var d = byId(driverId); if (!d) return null; var k = knobPos(d, d.a), r = cv.getBoundingClientRect(); return { x: r.left + k.x, y: r.top + k.y, cx: r.left + OX + d.x * S, cy: r.top + OY + d.y * S }; },
    load: function (list) { gears = []; selected = []; list.forEach(function (s) { gears.push(mkGear(s[0], s[1], s[2])); }); driverId = gears.length ? gears[0].id : 0; rebuild(); save(); }
  };
})();
</script>
<script>
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline install unavailable */ });
    });
  }
</script>
</body>
