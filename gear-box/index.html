<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gear Box</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gear Box">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css, tb-v2): header, stage, panel ----------
   The panel is the green Go ("Turn!": the motor on and off), the seven gear tiles (tap = the gear snaps into the
   next meshing spot; drag one onto the plate to put it exactly there) and the bottom bar (New, Surprise), built
   by the shared components in common/toybox.js. On the plate: turn the red crank handle (a tap turns it twice),
   drag gears around or off the plate, tap two gears to hear how fast the second turns. */
.scene { background: #9FB3C8; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
/* The gear being dragged (from a tile or off its peg). */
.ghost { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; filter: drop-shadow(6px 8px 0 rgba(29, 35, 64, 0.35)); }
.ghost svg { display: block; width: 100%; height: 100%; }

/* Play-timer gauge (top-left of the plate) */
.fuel { position: absolute; top: 10px; left: 10px; z-index: 2; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.fuel[hidden] { display: none; }
.fuel-bar { width: clamp(70px, 18vw, 150px); height: 18px; background: rgba(255, 255, 255, 0.8); border: 2px solid #1D2340; border-radius: 999px; overflow: hidden; }
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num { min-width: 40px; height: 40px; display: grid; place-items: center; background: #FFFFFF; color: #1D2340; border: 2px solid #1D2340; border-radius: 50%; font-size: var(--tb-fs-count); font-weight: 800; line-height: 1; }
.fuel-num[hidden] { display: none; }

/* Big mode: the panel goes away, the header stays (Big turns into Back). */
body.big .tb-panel { display: none; }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }

/* ---------- Panel: Go and the gear tiles share one grid ----------
   Tablets: Go is a full row above the tiles. Phones: four columns, two rows: the seven gears and Go in the last
   cell (its picture above its word), so the panel stays under 300 px and the plate keeps its size. */
.gb-act { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--tb-s2); }
.gb-act > #go { grid-column: 1 / -1; display: flex; }
.gb-act > #go .btn { flex: 1 1 auto; }
.gb-act > #tiles.tb-tilerow { display: contents; }
/* The tooth count is the tile's word, big. */
.gb-act .tb-tile .tb-tile-word { font-size: calc(var(--tb-fs-tile) + 4px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
@media (max-width: 600px) and (orientation: portrait), (orientation: landscape) and (max-height: 520px) {
  .gb-act > #go { grid-column: auto; order: 9; }
  .gb-act > #go .btn { flex-direction: column; gap: 2px; min-height: var(--tb-tile); padding: 4px; font-size: 22px; line-height: 1; }
  .gb-act > #go .tb-pic { width: 34px; height: 34px; }
}
@media (min-width: 700px) and (min-height: 700px) { .gb-act { gap: var(--tb-s3); } }
@media (orientation: landscape) and (min-height: 521px) { .gb-act { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (orientation: landscape) and (max-height: 520px) { .tb-v2 .tb-body .tb-panel { width: 372px; } }

/* Rest picture: the sleeping gears on a night sky (the rest screen itself is in common/toybox.css). */
.rest-art { aspect-ratio: 1; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
@media (min-width: 700px) and (min-height: 700px) {
  .fuel-num { min-width: 48px; height: 48px; }
}
</style>
</head>
<body>
<div class="tb-app-shell tb-v2">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Gear Box</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage scene" id="scene">
      <canvas id="cv" role="img" aria-label="A plate of pegs with gears. Turn the red handle, or add gears from the tiles."></canvas>
      <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
      <div id="coach"></div>
    </main>

    <section class="tb-panel">
      <div class="gb-act">
        <div id="go"></div>
        <div id="tiles" aria-label="Gears"></div>
      </div>
      <div id="bottom"></div>
    </section>
  </div>
</div>

<div class="ghost" id="ghost" hidden></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  var TAU = Math.PI * 2;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Gear model ----------
  // World units: pitch radius = teeth / 4, so any two gears mesh when their centers are
  // (teethA + teethB) / 4 pegs apart. Pegs sit on every whole unit.
  var WW = 44, WH = 36;
  // On a tall screen the plate stands up (36 x 44): the layout is mirrored across the diagonal, which
  // keeps every mesh. Saves always use the wide plate's coordinates.
  var tall = false;
  var SIZES = [8, 12, 16, 20, 24, 32, 40];
  var COLORS = { 8: "#E63946", 12: "#F77F00", 16: "#FFC93C", 20: "#2E9E5B", 24: "#3A86FF", 32: "#8338EC", 40: "#FF5DA2" };
  var MESH_TOL = 0.36;
  function R(T) { return T / 4; }
  function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function mix(a, b, t) {
    var x = hexRgb(a), y = hexRgb(b);
    return "rgb(" + [0, 1, 2].map(function (k) { return Math.round(x[k] + (y[k] - x[k]) * t); }).join(",") + ")";
  }

  var shapes = {};
  function gearPts(T) {
    if (shapes[T]) return shapes[T];
    var r = R(T), ro = r + 0.5, rr = r - 0.62, per = TAU / T, pts = [];
    for (var i = 0; i < T; i++) {
      var c = i * per;
      [[c - 0.31 * per, rr], [c - 0.15 * per, ro], [c + 0.15 * per, ro], [c + 0.31 * per, rr]].forEach(function (p) {
        pts.push([Math.cos(p[0]) * p[1], Math.sin(p[0]) * p[1]]);
      });
    }
    shapes[T] = pts;
    return pts;
  }
  function holeCount(T) { return T >= 32 ? 6 : T >= 20 ? 5 : T >= 16 ? 4 : T >= 12 ? 3 : 0; }
  function hubR(T) { return clamp(R(T) * 0.42, 1.05, 2.3); }

  // SVG version (tray buttons, ghost, rest picture).
  function gearSVG(T, cx, cy, sc, rot, sw, noNum) {
    var pts = gearPts(T), d = "", ca = Math.cos(rot || 0), sa = Math.sin(rot || 0);
    pts.forEach(function (p, i) {
      var x = cx + (p[0] * ca - p[1] * sa) * sc, y = cy + (p[0] * sa + p[1] * ca) * sc;
      d += (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
    });
    var col = COLORS[T], r = R(T), o = '<path d="' + d + 'Z" fill="' + col + '" stroke="#1D2340" stroke-width="' + sw + '" stroke-linejoin="round"/>';
    var hc = holeCount(T), hr = (r - 0.62 + hubR(T)) / 2;
    for (var i = 0; i < hc; i++) {
      var a = (rot || 0) + i * TAU / hc;
      o += '<circle cx="' + (cx + Math.cos(a) * hr * sc).toFixed(2) + '" cy="' + (cy + Math.sin(a) * hr * sc).toFixed(2) + '" r="' + (Math.min(0.32 * (r - 0.62 - hubR(T)), 0.55 * hr * Math.PI / hc) * sc).toFixed(2) + '" fill="' + mix(col, "#1D2340", 0.45) + '"/>';
    }
    o += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (hubR(T) * sc).toFixed(2) + '" fill="#FFFFFF" stroke="#1D2340" stroke-width="' + sw * 0.8 + '"/>';
    var fs = hubR(T) * sc * (T < 10 ? 1.35 : 1.15);
    if (!noNum) o += '<text x="' + cx + '" y="' + (cy + fs * 0.36).toFixed(2) + '" text-anchor="middle" font-size="' + fs.toFixed(2) + '" font-weight="800" font-family="Baloo 2, Trebuchet MS, sans-serif" fill="#1D2340">' + T + '</text>';
    return o;
  }

  // ---------- State ----------
  var KEY = "gearbox-state-v1";
  // Opening Gear Box from the Toybox home screen (Toybox.fresh) starts the first-visit gear layout,
  // crank/motor mode and speed again; a reload keeps the current layout.
  if (window.Toybox && Toybox.fresh()) {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
  }
  // mode: "motor" while Go has the motor running, "crank" when the hand crank is his (the redesign cut the
  // Crank/Motor switch and the speed dial: the motor runs at one calm speed). Saves keep mode and rpm.
  var MOTOR_RPM = 30;
  var gears = [], nextId = 1, driverId = 0, mode = "crank", motorRpm = MOTOR_RPM;
  var selected = [];
  function mkGear(T, x, y) {
    return { id: nextId++, T: T, x: x, y: y, a: 0, w: 0, acc: 0, turns: 0, flash: 0, wob: 0 };
  }
  function byId(id) { for (var i = 0; i < gears.length; i++) if (gears[i].id === id) return gears[i]; return null; }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        gears: gears.map(function (g) { return tall ? { T: g.T, x: g.y, y: g.x } : { T: g.T, x: g.x, y: g.y }; }),
        driver: Math.max(0, gears.indexOf(byId(driverId))), mode: mode, rpm: motorRpm
      }));
    } catch (e) { /* ignore */ }
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!o || typeof o !== "object") return false;
      if (o.mode === "motor" || o.mode === "crank") mode = o.mode;
      (o.gears || []).forEach(function (s) {
        if (SIZES.indexOf(s.T) === -1 || typeof s.x !== "number" || typeof s.y !== "number") return;
        if (!validSpot(s.T, s.x, s.y, null)) return;
        // Older saves may carry an "att" (flag/clock/winch add-on) and "lift": those are gone, so they are ignored.
        gears.push(mkGear(s.T, s.x, s.y));
      });
      var d = gears[o.driver | 0] || gears[0];
      driverId = d ? d.id : 0;
      return true;
    } catch (e) { return false; }
  }

  // ---------- Placement ----------
  function inBounds(T, x, y) { var r = R(T); return x - r >= 0 && x + r <= WW && y - r >= 0 && y + r <= WH; }
  // Returns -1 if the spot is blocked, else how many gears it meshes with.
  function spotMeshes(T, x, y, ignore) {
    if (!inBounds(T, x, y)) return -1;
    var n = 0;
    for (var i = 0; i < gears.length; i++) {
      var g = gears[i];
      if (g === ignore) continue;
      var d = Math.hypot(g.x - x, g.y - y), need = R(T) + R(g.T);
      if (Math.abs(d - need) < MESH_TOL) n++;
      else if (d < need + 1.15) return -1;
    }
    return n;
  }
  function validSpot(T, x, y, ignore) { return spotMeshes(T, x, y, ignore) >= 0; }
  // single: skip spots that would mesh with two gears at once (a tap never builds a stuck triangle).
  function findPeg(T, x, y, rad, ignore, single) {
    var best = null, bs = Infinity, x0 = Math.round(x), y0 = Math.round(y);
    for (var px = x0 - rad; px <= x0 + rad; px++) {
      for (var py = y0 - rad; py <= y0 + rad; py++) {
        var m = spotMeshes(T, px, py, ignore);
        if (m < 0 || (single && m > 1)) continue;
        var s = (px - x) * (px - x) + (py - y) * (py - y) - (m > 0 ? 6 + m : 0);
        if (s < bs) { bs = s; best = { x: px, y: py, m: m }; }
      }
    }
    return best;
  }
  function autoPlace(T) {
    // The first gear goes up and to the left of the middle, so even the big 40 still fits beside it.
    if (!gears.length) return findPeg(T, Math.max(R(T) + 1, WW * 0.32), Math.max(R(T) + 1, WH * 0.3), 20, null);
    var anchor = byId(selected[selected.length - 1]) || gears[gears.length - 1];
    var angs = [0, Math.PI / 2, -Math.PI / 2, Math.PI, Math.PI / 4, -Math.PI / 4, 3 * Math.PI / 4, -3 * Math.PI / 4, 0.64, -0.64, 0.93, -0.93];
    var i, p, others = gears.slice().reverse();
    // First a spot that meshes with the picked (or newest) gear only, then with any one gear, then anywhere.
    [anchor].concat(others).some(function (a) {
      var nd = R(T) + R(a.T);
      for (i = 0; i < angs.length; i++) {
        var q = findPeg(T, a.x + Math.cos(angs[i]) * nd, a.y + Math.sin(angs[i]) * nd, 1, null, true);
        if (q && q.m === 1) { p = q; return true; }
      }
      return false;
    });
    return p || findPeg(T, anchor.x, anchor.y, 30, null, true) || findPeg(T, anchor.x, anchor.y, 30, null);
  }

  // ---------- Mesh graph ----------
  var adj = {}, comps = [], driverComp = null, jammed = false;
  function rebuild() {
    adj = {};
    gears.forEach(function (g) { adj[g.id] = []; });
    for (var i = 0; i < gears.length; i++) for (var j = i + 1; j < gears.length; j++) {
      var a = gears[i], b = gears[j];
      if (Math.abs(Math.hypot(a.x - b.x, a.y - b.y) - R(a.T) - R(b.T)) < MESH_TOL) { adj[a.id].push(b); adj[b.id].push(a); }
    }
    if (!byId(driverId)) driverId = gears.length ? gears[0].id : 0;
    comps = []; driverComp = null; jammed = false;
    var seen = {};
    var roots = gears.slice();
    var d = byId(driverId);
    if (d) { roots.splice(roots.indexOf(d), 1); roots.unshift(d); }
    roots.forEach(function (root) {
      if (seen[root.id]) return;
      var order = [], parent = {}, color = {}, bad = false, q = [root];
      seen[root.id] = true; color[root.id] = 0;
      while (q.length) {
        var g = q.shift();
        order.push(g);
        adj[g.id].forEach(function (n) {
          if (!seen[n.id]) { seen[n.id] = true; parent[n.id] = g; color[n.id] = 1 - color[g.id]; q.push(n); }
          else if (color[n.id] === color[g.id]) bad = true;
        });
      }
      var c = { order: order, parent: parent, bad: bad };
      comps.push(c);
      if (root.id === driverId) { driverComp = c; jammed = bad; }
    });
    var known = {};
    gears.forEach(function (g) { known[g.id] = 1; });
    selected = selected.filter(function (id) { return known[id]; });
    updateInfo(true);
  }
  // Angle of gear B so its teeth sit in the gaps of gear A.
  function lockAngle(A, B) {
    var phi = Math.atan2(B.y - A.y, B.x - A.x);
    return phi + Math.PI - (Math.PI - (phi - A.a) * A.T) / B.T;
  }

  // ---------- Canvas ----------
  var cv = $("cv"), ctx = cv.getContext("2d"), scene = $("scene");
  var CW = 1, CH = 1, DPR = 1, S = 10, OX = 0, OY = 0;
  function resize() {
    CW = Math.max(1, scene.clientWidth); CH = Math.max(1, scene.clientHeight);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
    var t = CH > CW * 1.12;
    if (t !== tall) {
      tall = t;
      var ww = WW; WW = WH; WH = ww;
      gears.forEach(function (g) { var x = g.x; g.x = g.y; g.y = x; });
      selected = [];
      if (gears.length) rebuild();
    }
    S = Math.min(CW / (WW + 1), CH / (WH + 1));
    OX = (CW - WW * S) / 2; OY = (CH - WH * S) / 2;
  }
  window.addEventListener("resize", resize);
  function toWorld(cx, cy) {
    var r = cv.getBoundingClientRect();
    return { x: (cx - r.left - OX) / S, y: (cy - r.top - OY) / S, inside: cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom };
  }

  function drawGear(g, ang, lift) {
    var pts = gearPts(g.T), col = COLORS[g.T], r = R(g.T);
    var x = OX + g.x * S, y = OY + g.y * S - (lift || 0);
    ctx.save();
    ctx.translate(x, y);
    // shadow
    ctx.save(); ctx.translate(S * 0.35, S * 0.45); ctx.beginPath(); ctx.arc(0, 0, (r + 0.3) * S, 0, TAU); ctx.fillStyle = "rgba(29,35,64,0.28)"; ctx.fill(); ctx.restore();
    ctx.rotate(ang);
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) { var px = pts[i][0] * S, py = pts[i][1] * S; if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.lineJoin = "round"; ctx.lineWidth = Math.max(2, S * 0.2); ctx.strokeStyle = "#1D2340"; ctx.stroke();
    // inner rim ring
    ctx.beginPath(); ctx.arc(0, 0, (r - 0.95) * S, 0, TAU); ctx.lineWidth = Math.max(1.5, S * 0.12); ctx.strokeStyle = mix(col, "#1D2340", 0.3); ctx.stroke();
    var hc = holeCount(g.T), hr = (r - 0.62 + hubR(g.T)) / 2, rad = Math.min(0.32 * (r - 0.62 - hubR(g.T)), 0.55 * hr * Math.PI / Math.max(1, hc));
    ctx.fillStyle = mix(col, "#1D2340", 0.45);
    for (var k = 0; k < hc; k++) { var a = k * TAU / hc; ctx.beginPath(); ctx.arc(Math.cos(a) * hr * S, Math.sin(a) * hr * S, rad * S, 0, TAU); ctx.fill(); }
    if (!hc) { ctx.beginPath(); ctx.arc(hr * S, 0, 0.28 * S, 0, TAU); ctx.fillStyle = "#FFFFFF"; ctx.fill(); }
    ctx.restore();
  }
  function drawHub(g, lift) {
    var x = OX + g.x * S, y = OY + g.y * S - (lift || 0), h = hubR(g.T) * S;
    ctx.beginPath(); ctx.arc(x, y, h, 0, TAU); ctx.fillStyle = "#FFFFFF"; ctx.fill();
    ctx.lineWidth = Math.max(2, S * 0.17); ctx.strokeStyle = "#1D2340"; ctx.stroke();
    // The tooth count, big in the hub (the dad wants it; a deliberate exception to the numbers rule). The hub
    // doesn't turn, so the number stays upright and readable while the gear spins.
    teethNum(g.T, x, y, h);
  }
  function teethNum(T, x, y, h) {
    var fs = Math.max(13, h * (T < 10 ? 1.35 : 1.15));
    ctx.font = "800 " + Math.round(fs) + "px " + FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#1D2340";
    ctx.fillText(String(T), x, y + fs * 0.07);
  }
  var FONT = '"Baloo 2", "Trebuchet MS", system-ui, sans-serif';
  function pill(text, x, y, size, bg) {
    ctx.font = "800 " + Math.round(size) + "px " + FONT;
    var w = ctx.measureText(text).width + size * 0.9, h = size * 1.35;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); else ctx.rect(x - w / 2, y - h / 2, w, h);
    ctx.fillStyle = bg || "#FFFFFF"; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = "#1D2340"; ctx.stroke();
    ctx.fillStyle = "#1D2340"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, x, y + size * 0.06);
  }
  function rpmOf(g) { return Math.round(Math.abs(g.w) * 60 / TAU); }

        var spot = autoPlace(20);
        if (!spot) return null;
        return { pts: [bp, [rc.left + OX + spot.x * S, rc.top + OY + spot.y * S]], carry: gearCarry(20), key: "tiledrag" };
      }
      if (d && mode === "crank" && !cranked) {
        var k = knobPos(d, d.a), kx = rc.left + k.x, ky = rc.top + k.y;
        if (ghostHand.shown("crank") < 1) return { pts: [[kx, ky]], tap: true, key: "crank" };
        var cx = rc.left + OX + d.x * S, cy = rc.top + OY + d.y * S, a0 = Math.atan2(ky - cy, kx - cx), rr = Math.hypot(kx - cx, ky - cy), pts = [];
        for (var i = 0; i <= 24; i++) { var a = a0 + i / 24 * Math.PI * 2; pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
        return { pts: pts, dur: 3800, key: "crankdrag" };
      }
      return null;
    }
  });

  // ---------- Panel: Go "Turn!" (the motor), the gear tiles, New and Surprise ----------
  var PIC_TURN = '<svg viewBox="0 0 48 48"><path d="M38 24a14 14 0 1 1-4.1-9.9" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>' +
    '<path d="M35 6v9h-9" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="24" cy="24" r="6" fill="#FFC93C" stroke="#1D2340" stroke-width="2.5"/></svg>';
  var PIC_STOP = '<svg viewBox="0 0 48 48"><rect x="12" y="12" width="24" height="24" rx="5" fill="#FFFFFF" stroke="#1D2340" stroke-width="2.5"/></svg>';
  var go = Toybox.go($("go"), {
    label: "Turn!", icon: PIC_TURN,
    onPress: function () {
      if (ending) return false;
      if (!byId(driverId)) return false;
      setMode(mode === "motor" ? "crank" : "motor");
      autoTurn = null;
      blip();
      ghostHand.learned("go");
    },
    onIdle: function () { if (!gears.length) coach.say("Add a gear first!", 3); }
  });
  function tilePic(T) {
    var r = R(T) + 0.7, vb = r / (0.5 + 0.5 * T / 40);
    return '<svg viewBox="' + (-vb) + " " + (-vb) + " " + 2 * vb + " " + 2 * vb + '">' + gearSVG(T, 0, 0, 1, 0, 0.3 * vb / 6, true) + "</svg>";
  }
  var tiles = Toybox.tiles($("tiles"), {
    kind: "action", rows: 2,
    items: SIZES.map(function (T) { return { id: T, name: String(T), pic: tilePic(T) }; }),
    onPick: function (T) {
      // The click that ends a drag from the tile is not a tap.
      if (performance.now() - tileDragEnd < 500) return;
      tapTray({ T: T });
      ghostHand.learned("tile");
    }
  });
  SIZES.forEach(function (T) {
    var b = tiles.button(T);
    b.setAttribute("aria-label", CNAME[T] + " gear, " + T + " teeth");
    b.style.touchAction = "none";
    b.addEventListener("pointerdown", function (e) { if (!Toybox.isPalm(e)) startTrayDrag(e, { kind: "new", T: T }); });
  });

  function setMode(m) {
    mode = m;
    if (m === "motor") motorRpm = MOTOR_RPM;
    updateCoach();
    if (go) go.set(m === "motor" ? "Stop" : "Turn!", m === "motor" ? PIC_STOP : PIC_TURN);
    save();
  }

  // ---------- Examples ----------
  function example(name) {
    gears = []; selected = []; driverId = 0;
    function add(T, x, y) { var g = tall ? mkGear(T, y, x) : mkGear(T, x, y); gears.push(g); return g; }
    if (name === "long") {
      // Seven gears in one chain (each pair exactly (Ta + Tb) / 4 pegs apart, no loops, so nothing jams).
      add(16, 5, 12); add(12, 12, 12); add(20, 20, 12); add(8, 27, 12); add(24, 35, 12);
      add(32, 35, 26); add(12, 24, 26);
    }
    driverId = gears.length ? gears[0].id : 0;
    rebuild(); save();
    gears.forEach(function (g) { burst(OX + g.x * S, OY + g.y * S, 6, COLORS[g.T]); });
    autoTurn = null;
    updateCoach();
    if (name === "clear") whooshSnd(); else chime();
  }

  var bar = Toybox.bar($("bottom"), {
    onNew: function () { if (ending) return; setMode("crank"); example("clear"); ghostHand.learned("new"); },
    onSurprise: function () { surprise(); }
  });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { if (!e.target.closest("input")) e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { if (!e.target.closest(".sheet")) e.preventDefault(); }, { passive: false });

  // ---------- Surprise: a fun moment on the plate right now ----------
  // On an empty plate it builds the long train (see surprise()). Otherwise it takes turns: (1) happy faces:
  // every gear gets a cartoon face (eyes above the hub, a smile below it, staying
  // upright while the gear turns; the tooth number stays in the hub) that grins wider the faster it spins;
  // (2) super spin: the train spins up to super fast, then coasts back down to how it was. With no train
  // turning (no gears, one gear, or a jam), a little gear rolls across the plate like a wheel and back instead.
  // His gears never move or change.
  var surpriseTurn = 0, faceT = 0, faceK = 0, superT = 0, superDir = 1, roller = null, finger = null;
  var FACE_S = reduceMotion ? 5 : 8, SUPER_S = reduceMotion ? 4 : 8;
  var SUPER_W = 52 * TAU / 60;
  function trainReady() { var d = byId(driverId); return !!(d && driverComp && driverComp.order.length >= 2 && !jammed); }
  // Driver speed during the super spin: up over 1.6 s, hold, then coast down (gentler with reduced motion).
  function superW(dt, w) {
    superT -= dt;
    var t = SUPER_S - superT, top = reduceMotion ? SUPER_W * 0.6 : SUPER_W, base = mode === "motor" ? motorRpm * MOTOR_SCALE * TAU / 60 : 0;
    var up = Math.min(1, t / 1.6), down = clamp(superT / 3.4, 0, 1);
    var k = Math.min(up * up * (3 - 2 * up), down * down * (3 - 2 * down) + (superT > 3.4 ? 1 : 0));
    var tgt = superDir * (Math.abs(base) + (top - Math.abs(base)) * Math.min(1, k));
    if (superT <= 0) { superT = 0; return mode === "motor" ? w : tgt; }
    return tgt;
  }
  function stepSurprise(dt) {
    faceT = Math.max(0, faceT - dt);
    var ft = faceT > 0 ? 1 : 0;
    faceK += (ft - faceK) * Math.min(1, dt * (ft ? 6 : 3));
    if (!ft && faceK < 0.01) faceK = 0;
    if (roller) {
      roller.t += dt;
      var half = roller.dur / 2, u = roller.t < half ? roller.t / half : 2 - roller.t / half;
      u = u * u * (3 - 2 * u);
      var r = R(roller.T), nx = -r - 1 + (WW + 2 * r + 2) * u;
      roller.a += (nx - roller.x) / r;   // rolls without slipping, like a wheel
      roller.w = (nx - roller.x) / Math.max(dt, 1e-3) / r;
      roller.x = nx;
      if (roller.t >= roller.dur) roller = null;
    }
  }
  function surprise() {
    if (Toybox.timer.locked() || ending) return;
    // An empty plate (or a lone gear): the long train builds itself and the motor spins it (the old "Long
    // train" button); there is nothing of his to change.
    if (gears.length <= 1 && !ptrsBusy()) {
      example("long");
      setMode("motor");
      hint("A long gear train!", 3200);
      return;
    }
    var pick = surpriseTurn % 2 === 0 ? "faces" : "spin";
    surpriseTurn = pick === "faces" ? 1 : 0;
    if (pick === "faces") {
      faceT = FACE_S;
      if (!gears.length && !roller) startRoller();
      gears.forEach(function (g) { ring(OX + g.x * S, OY + g.y * S, R(g.T) * S, "#FFFFFF"); });
      chime();
      return;
    }
    if (trainReady()) {
      var d = byId(driverId);
      superDir = d.w < 0 ? -1 : 1;
      superT = SUPER_S;
      driverComp.order.forEach(function (g) { burst(OX + g.x * S, OY + g.y * S, 5, COLORS[g.T]); });
      hint("Super fast!", 3200);
      whooshSnd();
    } else startRoller();
  }
  function ptrsBusy() { return Object.keys(ptrs).length > 0; }
  function startRoller() {
    roller = { T: 20, x: -R(20) - 1, a: 0, w: 0, t: 0, dur: reduceMotion ? 6 : 8 };
    blip();
  }
  cv.addEventListener("pointermove", function (e) { finger = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  cv.addEventListener("pointerdown", function (e) { finger = { x: e.clientX, y: e.clientY, t: performance.now() }; });

  function drawSurprise() {
    var spinning = superT > 0 && driverComp;
    if (spinning && !reduceMotion) {
      // Whoosh lines round the spinning gears.
      var al = clamp(Math.min(SUPER_S - superT, superT) / 1.2, 0, 1) * 0.75;
      driverComp.order.forEach(function (g) {
        var x = OX + g.x * S, y = OY + g.y * S, rr = (R(g.T) + 0.9) * S, base = g.a * (g.w < 0 ? 1 : 1);
        ctx.lineCap = "round";
        for (var k = 0; k < 3; k++) {
          var a0 = base + k * TAU / 3;
          ctx.beginPath(); ctx.arc(x, y, rr, a0, a0 + (g.w < 0 ? -0.9 : 0.9), g.w < 0);
          ctx.lineWidth = Math.max(3, S * 0.3); ctx.strokeStyle = "rgba(255,255,255," + al.toFixed(2) + ")"; ctx.stroke();
        }
      });
    }
    if (faceK > 0.01) gears.forEach(function (g) { drawFace(OX + g.x * S, OY + g.y * S, g.T, g.w, g.id); });
    if (roller) {
      var ry = OY + (WH - R(roller.T) - 0.4) * S, rx = OX + roller.x * S;
      drawGear({ T: roller.T, x: roller.x, y: WH - R(roller.T) - 0.4 }, roller.a);
      var h = hubR(roller.T) * S;
      ctx.beginPath(); ctx.arc(rx, ry, h, 0, TAU); ctx.fillStyle = "#FFFFFF"; ctx.fill();
      ctx.lineWidth = Math.max(2, S * 0.17); ctx.strokeStyle = "#1D2340"; ctx.stroke();
      teethNum(roller.T, rx, ry, h);
      drawFace(rx, ry, roller.T, roller.w, 99, 1);
    }
  }
  // A face round the hub: eyes above it, a smile below it (upright while the gear turns). The faster it
  // spins, the wider the grin, up to a big open laugh.
  function drawFace(x, y, T, w, id, force) {
    var k = force || faceK;
    var h = hubR(T) * S, r = R(T) * S, room = r - h;
    var sp = clamp(Math.abs(w || 0) / (MAX_W * 1.4), 0, 1);
    var ew = clamp(room * 0.3, 3.5, h * 0.62), eh = ew * 1.2;
    var ey = y - h - Math.min(room * 0.42, eh * 1.15), ex = Math.min(h * 0.7, room * 0.9);
    var now2 = performance.now();
    var blink = ((now2 / 1000 + (id * 0.37) % 1 * 3) % 3.4) < 0.14;
    var lx = Math.sin(now2 / 1400 + id) * 0.4, ly = 0.15;
    if (finger && now2 - finger.t < 2500) {
      var rb = cv.getBoundingClientRect(), dx = finger.x - rb.left - x, dy = finger.y - rb.top - y, dl = Math.hypot(dx, dy) || 1;
      lx = dx / dl; ly = dy / dl;
    }
    ctx.save();
    ctx.globalAlpha = Math.min(1, k * 1.5);
    ctx.lineCap = "round"; ctx.strokeStyle = "#1D2340";
    for (var s2 = -1; s2 <= 1; s2 += 2) {
      var cx = x + s2 * ex;
      if (blink) {
        ctx.lineWidth = Math.max(2.5, ew * 0.4);
        ctx.beginPath(); ctx.moveTo(cx - ew, ey); ctx.quadraticCurveTo(cx, ey + ew * 0.6, cx + ew, ey); ctx.stroke();
        continue;
      }
      ctx.beginPath(); ctx.ellipse(cx, ey, ew, eh, 0, 0, TAU);
      ctx.fillStyle = "#FFFFFF"; ctx.fill(); ctx.lineWidth = Math.max(2, ew * 0.28); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + lx * ew * 0.4, ey + ly * eh * 0.4, ew * 0.52, 0, TAU); ctx.fillStyle = "#1D2340"; ctx.fill();
      ctx.beginPath(); ctx.arc(cx + lx * ew * 0.4 - ew * 0.18, ey + ly * eh * 0.4 - ew * 0.22, ew * 0.17, 0, TAU); ctx.fillStyle = "#FFFFFF"; ctx.fill();
    }
    // The smile hugs the bottom of the hub; it widens (and opens) with speed.
    var span = 0.32 + 0.5 * sp, mr = h * 1.02 + Math.min(room * 0.25, ew * 0.8), my = y + h * 0.15;
    var a0 = Math.PI / 2 - span, a1 = Math.PI / 2 + span;
    if (sp > 0.35) {
      ctx.beginPath(); ctx.arc(x, my, mr, a0, a1);
      ctx.arc(x, my, h * 1.04, a1, a0, true); ctx.closePath();
      ctx.fillStyle = "#1D2340"; ctx.fill();
      ctx.lineWidth = Math.max(2, ew * 0.3); ctx.stroke();
      ctx.save(); ctx.clip();
      ctx.beginPath(); ctx.arc(x, my + mr, mr * 0.45, 0, TAU); ctx.fillStyle = "#FF6F91"; ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(x, my, mr, a0, a1);
      ctx.lineWidth = Math.max(4.5, ew * 0.75); ctx.strokeStyle = "#FFFFFF"; ctx.stroke();
      ctx.lineWidth = Math.max(2.5, ew * 0.42); ctx.strokeStyle = "#1D2340"; ctx.stroke();
    }
    // Rosy cheeks beside the hub.
    ctx.fillStyle = "rgba(255,111,160,0.6)";
    ctx.beginPath(); ctx.arc(x - h - ew * 0.6, y + h * 0.35, ew * 0.55, 0, TAU); ctx.arc(x + h + ew * 0.6, y + h * 0.35, ew * 0.55, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // ---------- Sound (off by default; soft and synthesized) ----------
  // The on/off setting and the AudioContext are shared Toybox-wide (common/toybox.js); the module
  // starts/resumes audio on every touch while sound is on. Gear Box keeps its own master gain.
  var master = null, masterCtx = null;
  function out(ac) {
    if (masterCtx !== ac) { master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination); masterCtx = ac; }
    return master;
  }
  function tone(freq, dur, vol, type, slideTo) {
    var actx = Toybox.sound.ready();
    if (!actx) return;
    var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out(actx));
    o.start(t); o.stop(t + dur + 0.05);
  }
  function tick() { tone(rand(1500, 1800), 0.035, 0.018, "triangle"); }
  function blip() { tone(rand(520, 720), 0.14, 0.04, "sine", 880); }
  function pop() { tone(380, 0.12, 0.04, "sine", 620); }
  function clack() { tone(660, 0.06, 0.05, "triangle"); setTimeout(function () { tone(990, 0.08, 0.04, "triangle"); }, 60); }
  function bonk() { tone(220, 0.25, 0.05, "sine", 180); }
  function whooshSnd() { tone(700, 0.25, 0.035, "sine", 250); }
  function chime() { tone(523, 0.4, 0.04); setTimeout(function () { tone(784, 0.6, 0.04); }, 120); }

  // ---------- Play timer hooks (the timer, sheet, toast and rest screen live in common/toybox.js) ----------
  // The fuel gauge in the plate's corner shows the time left.
  function drawFuel(info) {
    var active = info.phase === "running" || info.phase === "ending";
    $("fuel").hidden = !active;
    if (!active) return;
    var f = info.fraction, fill = $("fuelFill");
    fill.style.width = (f * 100).toFixed(1) + "%";
    fill.style.background = f > 0.5 ? "#2E9E5B" : (f > 0.2 ? "#FFC93C" : "#F77F00");
    $("fuelNum").hidden = !(info.showMinutes && info.phase === "running");
    $("fuelNum").textContent = String(info.minutes);
  }
  // Ending: let go of any crank or drag in progress; the gears coast to a stop.
  function onEnding(done) {
    ending = true;
    superT = 0; roller = null; faceT = Math.min(faceT, 0.8);
    endingDone = done;
    Object.keys(ptrs).forEach(function (k) { if (ptrs[k].kind === "drag") { gears.push(ptrs[k].gear); } delete ptrs[k]; });
    ghost.hidden = true;
    if (cranking) { var d = byId(driverId); if (d) d.w = crankW; cranking = null; }
    selected = []; rebuild();
  }
  // Last spin: one more whirl before the gears stop.
  function goodbyeSpin() {
    var d = byId(driverId);
    if (d && !jammed) { d.w = 9; coastBoost = 1.6; }
    chime();
  }
  function onRest() {
    ending = false; endingDone = null; coastBoost = 0;
    gears.forEach(function (g) { g.w = 0; });
  }
  function onWake() { ending = false; endingDone = null; coastBoost = 0; }
  function restSVG() {
    var o = '<svg class="rest-art" viewBox="-50 -50 100 100" aria-hidden="true">';
    o += '<circle cx="34" cy="-36" r="9" fill="#FFF4CC" stroke="#1D2340" stroke-width="2"/><circle cx="38" cy="-39" r="8" fill="#2B3A67"/>';
    o += '<g opacity="0.95">' + gearSVG(40, -12, 14, 2.6, 0.1, 1.4) + gearSVG(20, 23.1, 14, 2.6, 0.22, 1.4) + "</g>";
    o += '<text x="-36" y="-26" font-family="Baloo 2, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">z</text><text x="-26" y="-36" font-family="Baloo 2, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">z</text><text x="-19" y="-43" font-family="Baloo 2, sans-serif" font-weight="800" font-size="7" fill="#FFFFFF">z</text>';
    return o + "</svg>";
  }

  // ---------- Start ----------
  // First visit: the long train stands ready, the handle waits for him (the motor is off until he presses Go).
  if (!load()) example("long");
  setMode(mode);
  resize();
  rebuild();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { plateKey = ""; });
  // Old Gear Box sound key held "on"/"off"; the shared migration reads "1"/"true", so translate it once.
  try { if (localStorage.getItem("gearbox-sound-v1") === "on") localStorage.setItem("gearbox-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "gear-box",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the gears coast to a stop and rest, and the controls lock.",
    goodbyeOption: "End with a Last spin button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Last spin",
    farewellDone: "Bye bye, gears!",
    restLine: "The gears are resting.",
    restLine2: "They will be right here next time.",
    restArt: restSVG,
    soundNote: "Soft tooth clicks. Hold for 2 seconds.",
    legacy: { timer: "gearbox-timer-v1", sound: "gearbox-sound-v1", big: "gearbox-big-v1" },
    onEnding: onEnding,
    onGoodbye: goodbyeSpin,
    onRest: onRest,
    onWake: onWake,
    onBig: function () { resize(); },
    onSound: function (on) { if (on) setTimeout(chime, 60); },
    onTimer: drawFuel
  });
  requestAnimationFrame(loop);

  // Test hook, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) window.__gears = {
    gears: function () { return gears.map(function (g) { return { id: g.id, T: g.T, x: g.x, y: g.y, rpm: rpmOf(g), w: g.w, turns: g.turns }; }); },
    jammed: function () { return jammed; }, surprise: surprise,
    state: function () { return { faceK: faceK, superT: superT, roller: !!roller, n: gears.length }; },
    driver: function () { return driverId; },
    toScreen: function (x, y) { var r = cv.getBoundingClientRect(); return { x: r.left + OX + x * S, y: r.top + OY + y * S }; },
    knob: function () { var d = byId(driverId); if (!d) return null; var k = knobPos(d, d.a), r = cv.getBoundingClientRect(); return { x: r.left + k.x, y: r.top + k.y, cx: r.left + OX + d.x * S, cy: r.top + OY + d.y * S }; },
    load: function (list) { gears = []; selected = []; list.forEach(function (s) { gears.push(mkGear(s[0], s[1], s[2])); }); driverId = gears.length ? gears[0].id : 0; rebuild(); save(); }
  };
})();
</script>
</body>
</html>
