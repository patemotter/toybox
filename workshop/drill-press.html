<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Drill Press</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workshop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<script src="projects.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
.tb-head a { text-decoration: none; }
.stage { background: #C9A877; }
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
/* Panel: the bit case (one tile per bit), then New board. */
.bits { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.bit { min-height: 76px; }
.bit canvas { pointer-events: none; }
body.ending .toolbar { pointer-events: none; opacity: 0.4; }

/* Rest picture size (the rest screen itself is in common/toybox.css). */
.rest-art { width: min(60vw, 240px); }

/* Phones: one row of bit pictures without words. */
@media (max-width: 600px), (orientation: landscape) and (max-height: 520px) {
  .bit { min-height: 56px; padding: 2px; }
  .bit span { display: none; }
  .bit canvas { width: 44px; height: 44px; }
}
@media (max-width: 600px) and (orientation: portrait) {
  .bits { gap: 6px; }
}
/* Landscape: the bits are a two-column grid in the side panel. */
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(24%, 260px); }
  .bits { grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); }
  .tb-body .tb-panel .tb-tabs .btn { white-space: normal; line-height: 1.1; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: 150px; padding: 6px; gap: 6px; }
  .bits { gap: 5px; }
  .bit { min-height: 0; }
  .bit canvas { width: 40px; height: 40px; }
}
/* ---------- Project mode (drill-press.html?project=..&step=..): one step of a Workshop project ---------- */
body.project #holesCount,
body.project #tabsRow { display: none; }
/* The story line sits at the top as information; the shared coach pill (#coach) keeps its shared place. */
.pj-banner { top: 10px; bottom: auto; white-space: normal; text-align: center; max-width: calc(100% - 20px); }
.pj-banner[hidden], .pj-done[hidden] { display: none; }
.pj-done { position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; padding: 12px; background: rgba(29, 35, 64, 0.3); pointer-events: none; }
.pj-card { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: min(92%, 460px); padding: 14px 22px 18px; text-align: center;
  background: var(--panel); color: var(--ink); border: 4px solid var(--edge); border-radius: 24px; box-shadow: 6px 6px 0 var(--edge);
  animation: pj-in 0.4s cubic-bezier(0.3, 1.5, 0.5, 1) both; }
.pj-card h2 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.8rem); line-height: 1.05; font-weight: 800; }
.pj-card p { margin: 0; font-size: clamp(1.05rem, 3.6vw, 1.5rem); font-weight: 700; line-height: 1.2; }
.pj-card .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0.3rem 1.4rem; font-size: 1.35rem; text-decoration: none; }
@keyframes pj-in { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 600px), (orientation: landscape) and (max-height: 520px) {
  .pj-banner { top: 8px; bottom: auto; }
  .pj-card { padding: 10px 16px 14px; gap: 8px; }
  .pj-card .btn { min-height: 50px; font-size: 1.15rem; }
}
@media (prefers-reduced-motion: reduce) { .pj-card { animation: none; } }
</style>
</head>
<body>
<div class="tb-app-shell wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back wallbtn" id="wallbtn" href="./" aria-label="Back to the Tool Wall"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Tool Wall</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title"><span class="tb-app">Workshop · </span><span class="tb-station">Drill Press</span></h1>
  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A drill press seen from the front"></canvas>
      <div class="tb-counter" id="holesCount">Holes: 0</div>
      <div class="tb-coach pj-banner" id="pjBanner" data-coach="info" hidden></div>
      <div class="coach" id="coach"></div>
      <div class="pj-done" id="pjDone" role="dialog" aria-labelledby="pjDoneTitle" hidden>
        <div class="pj-card">
          <h2 id="pjDoneTitle">Done! ✓</h2>
          <p id="pjDoneLine"></p>
          <a class="btn tb-go" id="pjBack" href="project.html">Back to the plan</a>
        </div>
      </div>
    </main>
    <section class="tb-panel toolbar" id="toolbar">
      <div class="tb-choices bits" id="bits" role="group" aria-label="Bit case"></div>
      <nav class="tb-tabs" id="tabsRow"><button class="btn tb-new newbtn" id="newBoard" aria-label="New board">New board</button></nav>
    </section>
  </div>
</div>

<script src="drill-press.js"></script>
</body>
</html>
