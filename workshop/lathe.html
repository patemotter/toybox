<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
/* ---------- Standard app shell (common/toybox.css, tb-v2): header, stage, panel ----------
   The panel: the green Go ("Turn the wood": one shaping pass with the picked tool; "Put it on the shelf" once that
   tool has cut), the four tools and Sand as picture tiles, and the bottom bar (Shelf, New, Surprise). The big switch
   and the speed dial are drawn on the stage: they are the machine's own controls. */
.tb-head a { text-decoration: none; }
.stage { background: #E9D3A8; touch-action: none; }
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#tiles .tb-pic svg { width: 100%; height: 100%; display: block; }
/* The Back button shows the Workshop's picture (and its name on an iPad). */
.mapbtn .tb-mapic { width: 30px; height: 30px; flex: none; }
/* Shelf: his finished pieces on wooden shelves (a full-stage view behind the Shelf button). */
.shelfview { position: absolute; inset: 0; z-index: 3; overflow-y: auto; overscroll-behavior: contain; background: #F3E6CC;
  padding: 16px 16px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 12px; align-content: start;
  -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.shelfview[hidden] { display: none; }
.sv-item { display: flex; flex-direction: column; justify-content: flex-end; aspect-ratio: 2 / 1; }
.sv-item canvas { display: block; width: 100%; flex: 1 1 0; min-height: 0; }
.sv-item::after { content: ""; display: block; flex: none; height: 12px; margin: 0 -8px; border: 2px solid #1D2340; border-radius: 4px; background: #C98B4E; }
.sv-item.is-new canvas { animation: sv-pop 0.6s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes sv-pop { from { transform: scale(0.4); } to { transform: none; } }
.sv-empty { grid-column: 1 / -1; display: grid; gap: 64px; padding-top: 72px; }
.sv-empty i { display: block; height: 14px; border: 2px solid #1D2340; border-radius: 4px; background: #C98B4E; }
@media (min-width: 700px) and (min-height: 700px) { .shelfview { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 28px 20px; padding: 24px; } }
/* Big: the header, the tiles' words and the bottom bar hide; the switch, the dial and the wood do everything. */
body.big .tb-head > :not(.bigtoggle) { display: none; }
body.big .tb-panel { display: none; }
body.ending .tb-panel, body.resting .tb-panel { pointer-events: none; }
body.ending .tb-panel, body.ending .mapbtn { opacity: 0.5; }
body.ending .mapbtn { pointer-events: none; }
.rest-art { width: min(60vw, 240px); }
/* Landscape: the panel is a right-hand column (Go, the tools three a row, the bottom bar). */
@media (orientation: landscape) {
  .tb-v2 .tb-body .tb-panel { width: min(36%, 400px); }
  .tb-v2 #tiles.tb-tilerow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-v2 .tb-body .tb-panel { width: 330px; gap: 8px; }
  .tb-v2 #tiles.tb-tilerow { gap: 6px; }
  .tb-v2 #tiles .btn.tb-tile { min-height: 78px; }
}
@media (prefers-reduced-motion: reduce) { .sv-item.is-new canvas { animation: none; } }
</style>
</head>
<body>
<div class="tb-app-shell tb-v2 wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="wallbtn" href="./" aria-label="Back to the Workshop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><svg class="tb-mapic" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 16 20 5l16 11v20H4Z" fill="#E7B86A" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="10" y="18" width="20" height="18" fill="#AEB9C5" stroke="#1D2340" stroke-width="2.5"/><path d="M10 23h20M10 28h20M10 33h20" stroke="#1D2340" stroke-width="1.6"/></svg><span>Workshop</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Lathe</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A wood lathe with a square blank"></canvas>
      <div class="tb-counter" id="piecesCount">Pieces: 0</div>
      <div id="coach"></div>
      <div class="shelfview" id="shelfview" hidden aria-label="Your finished pieces"></div>
    </main>
    <section class="tb-panel" id="panel">
      <div id="go"></div>
      <div id="tiles" role="group" aria-label="Turning tools"></div>
      <div id="bottom"></div>
    </section>
  </div>
</div>
<script>
(function () {
  "use strict";

  // ---------- Deep links and the safety-gear check ----------
  var params = {};
  try {
    location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf("=");
      var k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));
      params[k] = i < 0 ? "" : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " "));
    });
  } catch (e) { /* ignore bad query */ }
  var gearOn = true;
  try { gearOn = sessionStorage.getItem("workshop-gear") === "on"; } catch (e) { gearOn = true; }
  if (!gearOn) {
    location.replace("./?next=lathe");
    return;
  }

  var OUT = "#1D2340";
  var SKEY = "workshop-lathe-v1";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var TAU = Math.PI * 2;

  // ---------- The lathe in world units (x 0..1000, y 0..540) ----------
  var WW = 1000, WH = 540;
  var N = 150;                       // slices along the blank
  var WX0 = 300, WX1 = 790;          // blank ends (between the centers)
  var DX = (WX1 - WX0) / N;
  var AXY = 190;                     // spindle axis height
  var R0 = 60;                       // half the side of the square blank
  var RC = R0 * Math.SQRT2;          // corner radius of the square
  var REST_Y = Math.round(AXY + RC + 12);   // top of the tool rest
  var BED_Y = 345, BED_H = 42, FLOOR = 522;
  var TIP_MAX = REST_Y - 5 - AXY;    // tool tip fully pulled back (distance below the axis)
  var SPEEDS = [0, 1.5, 3.1, 5.7];   // spin (turns per second, visual only)
  var SPEED_NAMES = ["Off", "Slow", "Medium", "Fast"];
  var DIAL_ANG = [-110, -38, 38, 110].map(function (d) { return d * Math.PI / 180; });

  var WOODS = {
    pine: { name: "Pine", base: "#EFCB8A", dark: "#B9844A", light: "#FBE6BD" },
    oak: { name: "Oak", base: "#CC9A5A", dark: "#86592B", light: "#E8C48E" },
    walnut: { name: "Walnut", base: "#7E5536", dark: "#3E2514", light: "#A87C58" },
    cherry: { name: "Cherry", base: "#BE6A40", dark: "#7A341A", light: "#DE9670" }
  };
  var WOOD_ORDER = ["pine", "oak", "walnut", "cherry"];
  // Tools: half-width of the cutting edge (world units), how round the edge is, how fast it cuts,
  // how deep it may go (distance from the axis it never passes), finish it leaves, cut rate on square parts.
  var TOOLS = {
    rough: { name: "Roughing gouge", short: "Roughing", hw: 18, round: 0.55, rate: 230, minR: 24, fin: 0.15, sq: 1, handle: "#E63946", curl: "chunk" },
    spindle: { name: "Spindle gouge", short: "Spindle", hw: 10, round: 1, rate: 120, minR: 17, fin: 0.5, sq: 0.35, handle: "#2D5BD7", curl: "long" },
    skew: { name: "Skew chisel", short: "Skew", hw: 15, round: 0, rate: 90, minR: 19, fin: 1, sq: 0.3, handle: "#2E9E5B", curl: "ribbon" },
    parting: { name: "Parting tool", short: "Parting", hw: 3.5, round: 0, rate: 140, minR: 11, fin: 0.35, sq: 0.6, handle: "#F77F00", curl: "small" }
  };
  var TOOL_ORDER = ["rough", "spindle", "skew", "parting"];

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function fill(n, v) { var a = []; for (var i = 0; i < n; i++) a.push(v); return a; }
  var $ = function (id) { return document.getElementById(id); };
  var coach = Toybox.coach($("coach"));

  // ---------- Saved state: the piece on the lathe, the shelf, the counter ----------
  function freshState() {
    return { wood: "pine", tool: "rough", speed: 2, pieces: 0, shelf: [], r: fill(N, RC), fin: fill(N, 0), gloss: fill(N, 0) };
  }
  function numArr(a, lo, hi) {
    if (!Array.isArray(a) || a.length !== N) return null;
    var out = [];
    for (var i = 0; i < N; i++) {
      var v = a[i];
      if (typeof v !== "number" || !isFinite(v)) return null;
      out.push(clamp(v, lo, hi));
    }
    return out;
  }
  function loadState() {
    var s = freshState();
    try {
      var o = JSON.parse(localStorage.getItem(SKEY) || "null");
      if (o && typeof o === "object") {
        if (WOODS[o.wood]) s.wood = o.wood;
        if (TOOLS[o.tool]) s.tool = o.tool;
        if (o.speed === 0 || o.speed === 1 || o.speed === 2 || o.speed === 3) s.speed = o.speed;
        if (typeof o.pieces === "number" && o.pieces >= 0 && isFinite(o.pieces)) s.pieces = Math.floor(o.pieces);
        var r = numArr(o.r, 8, RC), f = numArr(o.fin, 0, 1), g = numArr(o.gloss, 0, 1);
        if (r && f && g) { s.r = r; s.fin = f; s.gloss = g; }
        if (Array.isArray(o.shelf)) {
          o.shelf.forEach(function (p) {
            var pr = p && WOODS[p.wood] ? numArr(p.r, 8, RC) : null;
            if (pr) s.shelf.push({ wood: p.wood, r: pr, fin: clamp(+p.fin || 0, 0, 1), gloss: clamp(+p.gloss || 0, 0, 1) });
          });
          s.shelf = s.shelf.slice(-8);
        }
      }
    } catch (e) { /* ignore bad storage */ }
    return s;
  }
  function r1(v) { return Math.round(v * 10) / 10; }
  function r2(v) { return Math.round(v * 100) / 100; }
  var saveTimer = null;
  function save() {
    if (saveTimer) return;
    saveTimer = setTimeout(function () { saveTimer = null; writeNow(); }, 400);
  }
  function writeNow() {
      try {
        localStorage.setItem(SKEY, JSON.stringify({
          wood: S.wood, tool: S.tool, speed: S.speed, pieces: S.pieces,
          r: S.r.map(r1), fin: S.fin.map(r2), gloss: S.gloss.map(r2),
          shelf: S.shelf.map(function (p) { return { wood: p.wood, r: p.r.map(r1), fin: r2(p.fin), gloss: r2(p.gloss) }; })
        }));
      } catch (e) { /* ignore */ }
  }
  var S = loadState();
  // Opened from the Toybox home screen: a new square blank and first-visit settings; keep the shelf.
  if (window.Toybox && Toybox.fresh()) { var keepShelf = S.shelf; S = freshState(); S.shelf = keepShelf; writeNow(); }
  function flushSave() { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; } writeNow(); }
  window.addEventListener("pagehide", flushSave);
  document.addEventListener("visibilitychange", function () { if (document.hidden) flushSave(); });

  // ---------- Live (not saved) machine state ----------
  var R = {
    on: false,            // the big switch
    sw: 0,                // switch paddle animation 0 = off, 1 = on
    spin: 0,              // turns per second (spins up and down)
    phase: 0,             // rotation angle of the work
    dialA: DIAL_ANG[S.speed],
    toolHeld: false,
    tipX: (WX0 + WX1) / 2, wantX: (WX0 + WX1) / 2,
    tipD: TIP_MAX,        // tool tip distance below the axis
    wantD: TIP_MAX,
    cutting: 0,
    sand: null, sandX: 0,
    seq: null,            // new blank / done sequence
    fastStop: false,
    hintAt: -10, savedAt: 0,
    toolPop: 0,
    shake: 0,
    shine: 0,
    flash: {},
    everCut: false,
    used: {},             // tools that have cut this blank (Go then offers the shelf)
    pass: null, sandPick: false, sandWait: false, face: null, newOnShelf: false
  };
  var fresh = new Float32Array(N);
  var parts = [];

  // ---------- Canvas and layout ----------
  var cv = $("cv"), ctx = cv.getContext("2d");
  var DPR = 1, CW = 300, CH = 300;
  var M = { x: 0, y: 0, w: 1, h: 1, s: 1, ox: 0, oy: 0 };   // lathe region; world -> screen
  var P = { x: 0, y: 0, w: 1, h: 1, s: 1, ox: 0, oy: 0, vert: false }; // control panel
  var bgCanvas = document.createElement("canvas");
  var PW_H = 490, PH_H = 200, PW_V = 290, PH_V = 350;      // panel sizes (panel units)

  // The whole machine stays on screen (AGENTS.md): the lathe from the outboard handwheel to the tailstock
  // lever and down to its feet always fits, with a margin; the switch box and the speed dial get their own
  // strip (under it when upright, at its right when sideways). The shelf lives behind the Shelf button.
  var LX0 = 14, LX1 = 986, LY0 = 40, LY1 = 530;   // the lathe's drawn extent (world units)
  function layout() {
    var pad = CW < 520 || CH < 420 ? 8 : 12;
    var land = CW / CH >= 1.2;
    var s;
    if (land) {
      var pw = Math.round(clamp(CW * 0.22, 120, 250));
      var lw = CW - pw - 3 * pad, lh = CH - 2 * pad;
      s = Math.min(lw / (LX1 - LX0), lh / (LY1 - LY0));
      M = { x: pad, y: pad, w: lw, h: lh, s: s };
      P = { x: CW - pad - pw, y: pad, w: pw, h: lh, vert: true };
    } else {
      // (the top 40 px stay clear for the Pieces counter)
      var lw2 = CW - 2 * pad, avail = CH - 3 * pad - 40;
      s = Math.min(lw2 / (LX1 - LX0), avail * 0.62 / (LY1 - LY0));
      var lh2 = Math.round((LY1 - LY0) * s);
      var ph = Math.round(Math.min(avail - lh2, PH_H * Math.min(1.25, lw2 / PW_H)));
      var top = pad + 40 + Math.max(0, (avail - lh2 - ph) * 0.4);
      M = { x: pad, y: top, w: lw2, h: lh2, s: s };
      P = { x: pad, y: top + lh2 + pad, w: lw2, h: ph, vert: false };
    }
    M.ox = M.x + M.w / 2 - (LX0 + LX1) / 2 * M.s;
    M.oy = M.y + M.h / 2 - (LY0 + LY1) / 2 * M.s;
    var pW = P.vert ? PW_V : PW_H, pH = P.vert ? PH_V : PH_H;
    P.s = Math.max(0.2, Math.min(P.w / pW, P.h / pH, 1.5));
    P.ox = P.x + (P.w - pW * P.s) / 2;
    P.oy = P.y + (P.h - pH * P.s) / 2;
  }
  function toWorld(px, py) { return { x: (px - M.ox) / M.s, y: (py - M.oy) / M.s }; }
  function worldXf() { ctx.setTransform(DPR * M.s, 0, 0, DPR * M.s, DPR * M.ox, DPR * M.oy); }
  function screenXf() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  function panelXf() { ctx.setTransform(DPR * P.s, 0, 0, DPR * P.s, DPR * P.ox, DPR * P.oy); }

  function resize() {
    var r = cv.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    CW = Math.max(100, r.width); CH = Math.max(100, r.height);
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
    shadeGrad = null;
    layout();
    buildBg();
  }

  // ---------- Drawing helpers ----------
  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function fs(c, fill, lw, stroke) {
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (lw) { c.lineWidth = lw; c.strokeStyle = stroke || OUT; c.lineJoin = "round"; c.lineCap = "round"; c.stroke(); }
  }
  function hgrad(c, x0, x1, stops) {
    var g = c.createLinearGradient(x0, 0, x1, 0);
    stops.forEach(function (s) { g.addColorStop(s[0], s[1]); });
    return g;
  }
  function vgrad(c, y0, y1, stops) {
    var g = c.createLinearGradient(0, y0, 0, y1);
    stops.forEach(function (s) { g.addColorStop(s[0], s[1]); });
    return g;
  }
  function steelV(c, y0, y1) { return vgrad(c, y0, y1, [[0, "#6E7683"], [0.3, "#E9EDF2"], [0.55, "#B6BDC7"], [1, "#5D6470"]]); }
  function steelH(c, x0, x1) { return hgrad(c, x0, x1, [[0, "#6E7683"], [0.3, "#E9EDF2"], [0.55, "#B6BDC7"], [1, "#5D6470"]]); }
  function label(c, text, x, y, size, color, align, weight) {
    c.font = (weight || 800) + " " + size + "px \"Baloo 2\", \"Trebuchet MS\", sans-serif";
    c.textAlign = align || "center";
    c.textBaseline = "middle";
    c.fillStyle = color;
    c.fillText(text, x, y);
  }
  function line(c, x0, y0, x1, y1, w, col) {
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1);
    c.lineWidth = w; c.strokeStyle = col || OUT; c.lineCap = "round"; c.stroke();
  }

  // Wall, pegboard and floor behind everything (pre-rendered on resize)
  function buildBg() {
    bgCanvas.width = cv.width; bgCanvas.height = cv.height;
    var c = bgCanvas.getContext("2d");
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = vgrad(c, 0, CH, [[0, "#F1DDB4"], [1, "#E2C796"]]);
    c.fillRect(0, 0, CW, CH);
    // pegboard holes
    c.fillStyle = "rgba(120, 82, 40, 0.22)";
    var step = Math.max(16, Math.min(26, CW / 40));
    for (var y = step / 2; y < CH; y += step) for (var x = step / 2; x < CW; x += step) { c.beginPath(); c.arc(x, y, 1.8, 0, TAU); c.fill(); }
    // floor under the lathe
    var fy = M.oy + (FLOOR - 4) * M.s;
    c.fillStyle = vgrad(c, fy, CH, [[0, "#9C8466"], [1, "#7D6850"]]);
    c.fillRect(0, fy, CW, CH - fy);
    c.fillStyle = "rgba(29,35,64,0.35)"; c.fillRect(0, fy, CW, 3);
    // panel backing plate
    c.setTransform(DPR * P.s, 0, 0, DPR * P.s, DPR * P.ox, DPR * P.oy);
    var pw = P.vert ? PW_V : PW_H, ph = P.vert ? PH_V : PH_H;
    rr(c, 0, 0, pw, ph, 22);
    fs(c, vgrad(c, 0, ph, [[0, "#4D93E0"], [1, "#2F6DB8"]]), 4);
    c.fillStyle = "#1D2340";
    [[14, 14], [pw - 14, 14], [14, ph - 14], [pw - 14, ph - 14]].forEach(function (q) { c.beginPath(); c.arc(q[0], q[1], 4, 0, TAU); c.fill(); });
  }

  // ---------- Sound (only when the grown-up turned it on) ----------
  var AC = null, master = null, humG = null, humO1 = null, humO2 = null, grindG = null, grindF = null;

      var lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420;

      humO2 = a.createOscillator(); humO2.type = "triangle"; humO2.frequency.value = 100;

    var f = Math.min(1, R.spin / SPEEDS[3]);
    humG.gain.setTargetAtTime(on && R.spin > 0.1 ? 0.03 + 0.04 * f : 0, t, 0.08);
    humO1.frequency.setTargetAtTime(38 + f * 30, t, 0.1);
    humO2.frequency.setTargetAtTime(80 + f * 120, t, 0.1);
    grindG.gain.setTargetAtTime(on ? R.cutting * 0.06 + (R.sand ? 0.03 : 0) : 0, t, 0.05);

  }

  // ---------- Prompts ----------
  var now = 0;
  function say(msg, flashKey) {
    coach.say(msg, 3.4);
    if (flashKey) R.flash[flashKey] = now + 3.2;
  }
  function busy() { return Toybox.timer.locked(); }
  function flashOn(k) { return R.flash[k] && R.flash[k] > now; }

  // ---------- Machine logic ----------
  function spinTarget() { return R.on && S.speed > 0 ? SPEEDS[S.speed] : 0; }
  function updateMachine(dt) {
    R.sw += ((R.on ? 1 : 0) - R.sw) * Math.min(1, dt * 14);
    var target = spinTarget();
    if (R.spin < target) R.spin = Math.min(target, R.spin + 5 * dt);
    else R.spin = Math.max(target, R.spin - (R.fastStop ? 9 : 2.6) * dt);
    R.phase = (R.phase + R.spin * TAU * dt) % (TAU * 64);
    var da = DIAL_ANG[S.speed] - R.dialA;
    R.dialA += da * Math.min(1, dt * 12);
    if (!R.toolHeld) R.wantD = Math.min(TIP_MAX, R.wantD + 150 * dt);
    // The tool slides along the rest (no teleporting), so a quick sweep still cuts all the way
    var dxw = R.wantX - R.tipX, mx = 1100 * dt;
    R.tipX += clamp(dxw, -mx, mx);
    for (var i = 0; i < N; i++) if (fresh[i] > 0) fresh[i] = Math.max(0, fresh[i] - dt * 0.7);
    R.shake *= Math.pow(0.02, dt);
    R.toolPop = Math.max(0, R.toolPop - dt * 3);
    R.shine = Math.max(0, R.shine - dt * 0.6);
    R.cutting *= Math.pow(0.03, dt);
  }
  function kernel(T, dx) {
    var a = Math.abs(dx);
    if (a > T.hw) return -1;
    if (T.round > 0) return T.round * (T.hw - Math.sqrt(T.hw * T.hw - a * a));
    return a > T.hw - 2 ? (a - (T.hw - 2)) * 1.5 : 0;
  }
  function sliceX(i) { return WX0 + (i + 0.5) * DX; }
  function toolRange(T) { return [WX0 + T.hw + 3, WX1 - T.hw - 3]; }
  function updateTool(dt) {
    var T = TOOLS[S.tool];
    var spinning = R.spin > 0.5;
    // a whole pass played for him (R.pass) bites a little deeper, so one pass shows a clear shape
    var bite = spinning ? (R.pass ? 18 : 6) : 0;
    var i0 = Math.max(0, Math.floor((R.tipX - T.hw - WX0) / DX) - 1);
    var i1 = Math.min(N - 1, Math.ceil((R.tipX + T.hw - WX0) / DX) + 1);
    var block = T.minR, i, add;
    for (i = i0; i <= i1; i++) {
      add = kernel(T, sliceX(i) - R.tipX);
      if (add < 0) continue;
      block = Math.max(block, S.r[i] - add - bite);
    }
    var want = clamp(R.wantD, T.minR, TIP_MAX);
    var d = Math.max(want, block);
    R.tipD += (d - R.tipD) * Math.min(1, dt * (R.pass ? 40 : 22));
    if (R.tipD < block) R.tipD = block;
    if (!R.toolHeld || R.seq) return;
    if (!spinning) {
      if (want < block - 4 && now - R.hintAt > 3.5) {
        R.hintAt = now;
        if (R.on && S.speed === 0) say("Turn the dial to spin", "dial");
        else if (!R.on) {
          R.offTries = (R.offTries || 0) + 1;
          // Second try with the lathe off: switch it on for him (the switch flips where he can see it).
          if (R.offTries >= 2) { R.offTries = 0; toggleSwitch(); say("Switched on! Now cut", "switch"); }
          else say("Switch on to cut", "switch");
        }
      }
      return;
    }
    var removed = 0, sq = false, spdF = R.spin / SPEEDS[2];
    for (i = i0; i <= i1; i++) {
      add = kernel(T, sliceX(i) - R.tipX);
      if (add < 0) continue;
      var target = Math.max(T.minR, R.tipD + add);
      if (S.r[i] > target + 0.01) {
        var isSq = S.r[i] > R0 + 1;
        if (isSq) sq = true;
        var rate = T.rate * (0.45 + 0.55 * spdF) * (isSq ? T.sq : 1) * (R.pass ? 1.8 : 1);
        var cut = Math.min(S.r[i] - target, rate * dt);
        S.r[i] -= cut;
        removed += cut;
        S.fin[i] += (T.fin - S.fin[i]) * Math.min(1, cut * 0.5);
        S.gloss[i] = Math.max(0, S.gloss[i] - cut * 0.3);

    }
    if (removed > 0.05) {

      R.cutting = Math.min(1, R.cutting + removed * 0.06);

      emitShavings(T, removed, sq, AXY + R.tipD);

    }
  }

  // ---------- Shavings, chips, dust and sparkles ----------

  var emitAcc = 0;

      if (n >= MAX_PARTS) for (k = 0; k < parts.length; k++) if (parts[k].type !== "star") { parts.splice(k, 1); break; }
    }
    var p = {
      type: type, x: x, y: y, vx: rnd(-240, 240), vy: rnd(-600, -250), a: rnd(0, TAU), va: rnd(-9, 9),
      len: 0, lmax: 20, rad: 6, w: 4, col: Math.random() < 0.6 ? W.light : W.base, t: 0,
      bounces: 0, bed: Math.random() < 0.45, life: rnd(0.85, 1.25)

    else if (type === "ribbon") { p.lmax = rnd(60, 110); p.rad = rnd(9, 14); p.w = rnd(6, 9); p.vy = rnd(-420, -200); p.col = W.light; }
    else if (type === "small") { p.lmax = rnd(10, 22); p.rad = rnd(3, 5); p.w = 3; }
    else if (type === "chunk") { p.lmax = rnd(7, 13); p.w = rnd(5, 9); p.vy = rnd(-650, -300); p.vx = rnd(-300, 300); }
    else if (type === "dust") { p.lmax = rnd(2, 4.5); p.vy = rnd(-160, -40); p.vx = rnd(-120, 120); p.col = W.light; p.life = 0.9; }
    else if (type === "star") { p.lmax = rnd(8, 16); p.vy = rnd(-80, -20); p.vx = rnd(-40, 40); p.col = "#FFFFFF"; p.life = 1.2; }
    else if (type === "giant") { p.lmax = 900; p.rad = 34; p.w = 14; p.vx = rnd(150, 220); p.vy = -520; p.va = 1.4; p.life = 3.4; p.col = W.light; }

      }

      p.vy += (light ? 900 : 1300) * dt;

      var floorY = (p.bed && p.x > 45 && p.x < 955 && p.y < BED_Y + 10 && p.vy > 0) ? BED_Y - 2 : FLOOR - 2;
      if (p.x > 45 && p.x < 955 && p.y > BED_Y + 10) floorY = FLOOR - 2;
      if (p.y >= floorY && p.vy > 0) {

  function partAlpha(p) { return Math.max(0, Math.min(1, (p.life - p.t) / 0.45)); }
  function drawParts(c) {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];

        c.globalAlpha = Math.max(0, 1 - p.t / p.life) * 0.8;

  // ---------- Sanding ----------
  function startSand() {
    if (busy() || R.seq) return;
    if (R.sand) return;
    if (R.spin < 0.5) { say(R.on && S.speed === 0 ? "Turn the dial, then sand" : "Switch on, then sand", R.on ? "dial" : "switch"); return; }
    R.sand = { t: 0, dur: 4.3 };
    R.toolHeld = false;
    blip(1200, 0.08, 0.04, "triangle", 900);
  }
  function updateSand(dt) {
    var q = R.sand;
    if (!q) return;
    if (R.spin < 0.3 || R.seq) { R.sand = null; return; }
    q.t += dt;
    var f = q.t / q.dur;
    if (f >= 1) {
      R.sand = null; R.shine = 1; R.used.sand = true;
      var W = WOODS[S.wood];
      for (var k = 0; k < (reduce ? 6 : 16); k++) spawn("star", rnd(WX0 + 20, WX1 - 20), AXY + rnd(-50, 30), W);
      say("Shiny!");
      blip(880, 0.12, 0.06, "sine", 1320);
      save();
      return;
    }
    var tri = f < 0.5 ? f * 2 : 2 - f * 2;
    R.sandX = WX0 + 24 + (WX1 - WX0 - 48) * ease(tri);
    var i0 = Math.max(1, Math.floor((R.sandX - 30 - WX0) / DX)), i1 = Math.min(N - 2, Math.ceil((R.sandX + 30 - WX0) / DX));
    for (var i = i0; i <= i1; i++) {

      S.fin[i] = Math.min(1, Math.max(S.fin[i], S.fin[i] + dt * 1.5));
      var avg = (S.r[i - 1] + S.r[i] + S.r[i + 1]) / 3;
      if (S.r[i] > avg) S.r[i] -= (S.r[i] - avg) * Math.min(1, dt * 2);
    }
    if (Math.random() < dt * 40) spawn("dust", R.sandX + rnd(-20, 20), AXY + Math.min(S.r[clamp(Math.round((R.sandX - WX0) / DX), 0, N - 1)], R0) + 4, WOODS[S.wood]);
  }

  // ---------- New blank and "Put it on the shelf" ----------
  function cutSomething() { for (var i = 0; i < N; i++) if (S.r[i] < RC - 2) return true; return false; }
  function releaseTool() {
    for (var k in drags) if (drags[k].type === "tool") delete drags[k];
    R.toolHeld = false;
    R.pass = null;
  }
  // Each new blank is the next wood by itself (no wood picker): pine, oak, walnut, cherry, pine...
  function nextWood() { return WOOD_ORDER[(WOOD_ORDER.indexOf(S.wood) + 1) % WOOD_ORDER.length]; }
  function startSeq(kind, wood) {
    var piece = { wood: S.wood, r: S.r.slice(), fin: avg(S.fin), gloss: avg(S.gloss) };
    R.seq = { kind: kind, wood: wood, stage: "away", t: 0, piece: piece, from: { ox: M.ox, oy: M.oy, s: M.s }, to: shelfTarget() };
    R.sand = null;
    releaseTool();
    resetBlank(wood);
    blip(kind === "done" ? 520 : 300, 0.12, 0.06, "triangle", kind === "done" ? 780 : 200);
  }
  // Where the finished piece flies: the Shelf button in the bottom bar (canvas pixels), or the top corner.
  function shelfTarget() {
    var b = bbar && bbar.shelf, cr = cv.getBoundingClientRect();
    if (b) { var r = b.getBoundingClientRect(); if (r.width > 0) return { x: r.left + r.width / 2 - cr.left, y: r.top + r.height / 2 - cr.top }; }
    return { x: CW - 40, y: 20 };
  }
  function shelfIt() {
    if (busy() || R.seq) return false;
    if (!cutSomething()) { say("Turn a shape first!"); return false; }
    startSeq("done", nextWood());
    return true;
  }
  function newBlank() {
    if (busy() || R.seq) return;
    showShelf(false);
    startSeq("new", nextWood());
  }
  function resetBlank(wood) {
    S.wood = wood;
    S.r = fill(N, RC); S.fin = fill(N, 0); S.gloss = fill(N, 0);
    for (var i = 0; i < N; i++) fresh[i] = 0;
    R.phase = 0; R.everCut = false; R.used = {}; R.sandPick = false;
    if (tiles) updateToolbar();
    save();
  }
  function updateSeq(dt) {
    var q = R.seq;
    if (!q) return;
    q.t += dt;
    if (q.stage === "away") {
      if (q.t >= 1.3) {
        if (q.kind === "done") {
          S.pieces++;
          S.shelf.push(q.piece);
          S.shelf = S.shelf.slice(-8);
          R.flash.shelf = now + 1.8;
          R.newOnShelf = true;
          blip(990, 0.1, 0.06, "sine", 1480);
          if (bbar && bbar.shelf) Toybox.wiggle(bbar.shelf);
          coach.say("It's on the shelf!", 3);
          Toybox.kind();
        }
        q.stage = "in"; q.t = 0;
      }
    } else if (q.stage === "in") {
      if (q.t >= 0.75) { R.seq = null; R.fastStop = false; save(); blip(220, 0.08, 0.06, "triangle", 330); }
    }
  }
  function avg(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }

  // ---------- Pieces (the live blank, the flying one and the shelf ones) ----------
  var HB = new Float32Array(N);
  var shadeGrad = null;
  var GRAIN = [0.25, 0.9, 1.45, 2.05, 2.6, 3.3, 3.9, 4.5, 5.15, 5.8];
  function getShade(c) {
    if (!shadeGrad) {
      shadeGrad = c.createLinearGradient(0, -1, 0, 1);
      shadeGrad.addColorStop(0, "rgba(0,0,0,0.30)");
      shadeGrad.addColorStop(0.12, "rgba(255,255,255,0.10)");
      shadeGrad.addColorStop(0.3, "rgba(255,255,255,0.32)");
      shadeGrad.addColorStop(0.5, "rgba(255,255,255,0.06)");
      shadeGrad.addColorStop(0.78, "rgba(0,0,0,0.16)");
      shadeGrad.addColorStop(1, "rgba(0,0,0,0.42)");
    }
    return shadeGrad;
  }
  function profilePath(c, h, ox, ax, s) {
    var i;
    c.beginPath();
    c.moveTo(ox + WX0 * s, ax - h[0] * s);
    for (i = 0; i < N; i++) c.lineTo(ox + sliceX(i) * s, ax - h[i] * s);
    c.lineTo(ox + WX1 * s, ax - h[N - 1] * s);
    c.lineTo(ox + WX1 * s, ax + h[N - 1] * s);
    for (i = N - 1; i >= 0; i--) c.lineTo(ox + sliceX(i) * s, ax + h[i] * s);

    c.closePath();
  }
  // p = {wood, r[], fin (array or number), gloss (array or number)}; screen mapping x' = ox + x*s, y' = oy + y*s
  function drawPiece(c, p, ox, oy, s, live) {
    var W = WOODS[p.wood], r = p.r, i, k, j;
    var spin = live ? R.spin : 0;
    var th = live ? R.phase : 0;

    var sqH = R0 * (Math.abs(Math.cos(th)) + Math.abs(Math.sin(th)));
    var anySq = false;
    for (i = 0; i < N; i++) {
      HB[i] = Math.min(r[i], live && !blurMode ? sqH : R0);
      if (r[i] > R0 + 0.5) anySq = true;
    }
    screenXf();
    var ax = oy + AXY * s;
    var lw = Math.max(1.5, Math.min(3.5, 4 * s));

    F.t += 1 / 60;
    if (F.t > F.dur) { R.face = null; return; }
    var a = clamp(Math.min(F.t, F.dur - F.t) / 0.3, 0, 1);
    var cx = (WX0 + WX1) / 2, rr0 = Math.min(S.r[N >> 1], R0), wink = F.t > 1.4 && F.t < 1.8;
    c.save(); c.globalAlpha = a; c.lineCap = "round";
    c.fillStyle = OUT; c.strokeStyle = OUT; c.lineWidth = 4;
    c.beginPath(); c.arc(cx - 22, AXY - rr0 * 0.25, 6, 0, TAU); c.fill();
    if (wink) { c.beginPath(); c.moveTo(cx + 15, AXY - rr0 * 0.25); c.lineTo(cx + 29, AXY - rr0 * 0.25); c.stroke(); }
    else { c.beginPath(); c.arc(cx + 22, AXY - rr0 * 0.25, 6, 0, TAU); c.fill(); }
    c.beginPath(); c.arc(cx, AXY + rr0 * 0.05, rr0 * 0.42, 0.15 * Math.PI, 0.85 * Math.PI); c.lineWidth = 5; c.stroke();
    c.fillStyle = "rgba(255,120,140,0.45)";
    c.beginPath(); c.arc(cx - 40, AXY + rr0 * 0.08, 8, 0, TAU); c.arc(cx + 40, AXY + rr0 * 0.08, 8, 0, TAU); c.fill();
    c.restore();
  }

  // ---------- Panel: Go, the tools and Sand (tiles), the bottom bar (Shelf, New, Surprise) ----------
  function toolSVG(id) {
    var T = TOOLS[id], s = '<svg viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(50 50) rotate(-40) scale(0.86) translate(-62 -18)">';
    s += '<path d="M4 12 Q2 18 4 24 L50 26 L50 10 Z" fill="#D9A066" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/>';
    s += '<path d="M4 12 Q2 18 4 24 L16 24.6 L16 11.4 Z" fill="' + T.handle + '" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/>';
    s += '<rect x="50" y="9" width="9" height="18" rx="2" fill="#E8B83A" stroke="#1D2340" stroke-width="3"/>';
    if (id === "rough") s += '<path d="M59 8 L106 8 Q120 8 120 18 Q120 28 106 28 L59 28 Z" fill="#D9DDE3" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><path d="M66 13 L104 13 Q113 13 113 18 Q113 23 104 23 L66 23 Z" fill="#3B4250"/>';
    else if (id === "spindle") s += '<path d="M59 12 L104 12 Q118 13 120 18 Q118 23 104 24 L59 24 Z" fill="#D9DDE3" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><path d="M66 16.5 L108 17 Q112 18 108 19 L66 19.5 Z" fill="#3B4250"/>';
    else if (id === "skew") s += '<path d="M59 10 L110 10 L120 26 L59 26 Z" fill="#D9DDE3" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><path d="M102 10 L110 10 L120 26 L112 26 Z" fill="#FFFFFF" stroke="#1D2340" stroke-width="2" stroke-linejoin="round"/>';
    else s += '<path d="M59 14 L114 14 L120 18 L114 22 L59 22 Z" fill="#D9DDE3" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/>';
    return s + "</g></svg>";
  }
  var SAND_SVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="14" y="26" width="72" height="48" rx="6" fill="#E8B25A" stroke="#1D2340" stroke-width="5"/>' +
    '<path d="M26 40h4M42 54h4M58 38h4M70 56h4M34 64h4M62 48h4" stroke="#8A5A1E" stroke-width="5" stroke-linecap="round"/></svg>';
  var GO_TURN = '<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="6" y="13" width="28" height="14" rx="3" fill="#EFCB8A" stroke="#1D2340" stroke-width="2.4"/>' +
    '<path d="M13 13v14M20 13v14M27 13v14" stroke="#B9844A" stroke-width="2"/><path d="M3 20h3M34 20h3" stroke="#1D2340" stroke-width="2.4" stroke-linecap="round"/></svg>';
  var GO_SHELF = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 19h22l-2 4 2 4H9l2-4z" fill="#EFCB8A" stroke="#1D2340" stroke-width="2.2" stroke-linejoin="round"/>' +
    '<rect x="4" y="29" width="32" height="5" rx="1.5" fill="#C98B4E" stroke="#1D2340" stroke-width="2.2"/></svg>';
  var goBtn = null, tiles = null, bbar = null, goShown = "";
  function goState() {
    var cur = R.sandPick ? "sand" : S.tool;
    if (R.everCut && R.used[cur]) return "shelf";
    return cur === "sand" ? "sand" : "turn";
  }
  function updateGo() {
    if (!goBtn) return;
    var st = goState();
    if (st !== goShown) {
      goShown = st;
      if (st === "shelf") goBtn.set("Put it on the shelf", GO_SHELF);
      else if (st === "sand") goBtn.set("Sand it", SAND_SVG);
      else goBtn.set("Turn the wood", GO_TURN);
    }
    goBtn.busy(!!(R.pass || R.sand || R.sandWait || R.seq));
  }
  function goPress() {
    ensureAudio();
    if (R.pass || R.sand || R.seq) return false;
    ghost.learned("turn");
    if (goState() === "shelf") return shelfIt();
    return startPass("go");
  }
  function buildPanel() {
    goBtn = Toybox.go($("go"), {
      label: "Turn the wood", icon: GO_TURN,
      onPress: goPress,
      onBusy: function () { coach.say(R.seq ? "Off it goes!" : (R.sand || R.sandWait ? "Sanding!" : "Turning!"), 3); }
    });
    var items = TOOL_ORDER.map(function (id) { return { id: id, name: TOOLS[id].short, pic: toolSVG(id) }; });
    items.push({ id: "sand", name: "Sand", pic: SAND_SVG });
    tiles = Toybox.tiles($("tiles"), {
      kind: "pick", rows: 2, items: items, value: S.tool,
      onPick: function (id) { ensureAudio(); if (id === "sand") pickSand(); else selectTool(id); }
    });
    TOOL_ORDER.forEach(function (id) { var b = tiles.button(id); if (b) b.setAttribute("aria-label", TOOLS[id].name); });
    bbar = Toybox.bar($("bottom"), {
      shelf: function () { showShelf($("shelfview").hidden); },
      onNew: function () { ensureAudio(); newBlank(); },
      onSurprise: function () { ensureAudio(); surprise(); }
    });
  }
  function updateToolbar() {
    if (tiles) tiles.set(R.sandPick ? "sand" : S.tool);
  }
  function pickSand() {
    if (busy()) return;
    R.sandPick = true; R.pass = null;
    blip(1200, 0.05, 0.04, "triangle", 900);
    updateToolbar();
    if (R.spin > 0.6 && !R.seq) startSand();
  }
  function selectTool(id, quiet) {
    if (busy() || !TOOLS[id]) return;
    R.sandPick = false;
    if (S.tool !== id) { S.tool = id; R.toolPop = 1; R.pass = null; setToolX(R.tipX, true); save(); if (!quiet) blip(640, 0.05, 0.05, "triangle"); }
    updateToolbar();
  }
  document.addEventListener("keydown", function (e) {
    if ((e.key === " " || e.key === "Enter") && e.target === document.body && !busy() && !Toybox.sheetOpen()) { e.preventDefault(); toggleSwitch(); }
    if (e.key === "Escape") showShelf(false);
  });

  // ---------- Play timer hooks (the shared Toybox timer: it keeps going on every Workshop page) ----------
  // Ending: the lathe switches off ("Switch off" button, or by itself) and the work spins down to a stop.
  var endingDone = null;
  function goodbyeOn() {
    try { var t = JSON.parse(localStorage.getItem("toybox-timer-v1") || "null"); return !t || t.goodbye !== false; } catch (e) { return true; }
  }
  function onEnding(done) {
    endingDone = done;
    drags = {};
    R.toolHeld = false;
    R.sand = null;
    R.pass = null; R.sandWait = false; R.face = null;
    showShelf(false);
    if (!goodbyeOn()) R.on = false;
    else if (!R.on) {
      setTimeout(function () { var gb = $("tb-goodbye"); if (Toybox.timer.phase() === "ending" && gb && !gb.hidden) gb.click(); }, 0);
    }
  }
  function goodbye() {
    if (R.on) blip(140, 0.12, 0.08, "sine", 80);
    R.on = false;
  }
  function endingFrame() {
    if (endingDone && !R.on && R.spin < 0.02 && !R.seq) { endingDone(); endingDone = null; }
  }
  function onRest() { endingDone = null; R.on = false; R.spin = 0; save(); }
  function onWake() { endingDone = null; }
  function restArt() {
    // A small lathe with a finished spindle between centers, switched off
    return '<svg class="rest-art" viewBox="0 0 240 200" aria-hidden="true">' +
      '<path d="M40 150 L64 150 L70 190 L34 190 Z M176 150 L200 150 L206 190 L170 190 Z" fill="#3A4150" stroke="#1D2340" stroke-width="4" stroke-linejoin="round"/>' +
      '<rect x="12" y="136" width="216" height="16" rx="4" fill="#9AA4B2" stroke="#1D2340" stroke-width="4"/>' +
      '<path d="M20 136 L20 76 Q20 66 30 66 L68 66 Q78 66 78 76 L78 136 Z" fill="#3E86D8" stroke="#1D2340" stroke-width="4" stroke-linejoin="round"/>' +
      '<rect x="176" y="84" width="40" height="52" rx="10" fill="#3E86D8" stroke="#1D2340" stroke-width="4"/>' +
      '<path d="M84 104 L96 104 Q104 92 112 104 L126 104 Q134 90 146 104 L170 104 L170 116 L146 116 Q134 130 126 116 L112 116 Q104 128 96 116 L84 116 Z" fill="#EFCB8A" stroke="#1D2340" stroke-width="4" stroke-linejoin="round"/>' +
      '<path d="M78 104 L84 110 L78 116 Z M176 104 L170 110 L176 116 Z" fill="#C8CDD6" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/>' +
      '<rect x="96" y="126" width="64" height="8" rx="3" fill="#C8CDD6" stroke="#1D2340" stroke-width="3"/>' +
      '<circle cx="49" cy="96" r="9" fill="#E63946" stroke="#1D2340" stroke-width="3"/>' +
      '<path d="M190 34 q8 -8 16 0 M196 22 q6 -6 12 0" fill="none" stroke="#2D5BD7" stroke-width="3" stroke-linecap="round"/>' +
      '<text x="200" y="50" font-family="Baloo 2, sans-serif" font-weight="800" font-size="18" fill="#2D5BD7">z</text>' +
      '<text x="214" y="36" font-family="Baloo 2, sans-serif" font-weight="800" font-size="14" fill="#2D5BD7">z</text></svg>';
  }

  // ---------- Start up ----------
  buildPanel();
  updateToolbar();
  for (var i0 = 0; i0 < N; i0++) if (S.r[i0] < RC - 2) { R.everCut = true; break; }
  resize();
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 120); });
  if (window.ResizeObserver) { try { new ResizeObserver(function () { resize(); }).observe($("stage")); } catch (e) { /* ignore */ } }

  try { if (localStorage.getItem("workshop-sound-v1") === "on") localStorage.setItem("workshop-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "workshop-lathe",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the lathe switches off, spins down to a stop and rests, and the controls lock. The timer carries on across Workshop pages.",
    goodbyeOption: "End with a “Switch off” button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Switch off",
    farewellDone: "Bye bye!",
    restLine: "The lathe is resting.",
    restLine2: "Your piece will be right here next time.",
    restArt: restArt,
    soundNote: "Motor hum and a soft cutting sound. Hold for 2 seconds.",
    legacy: { timer: "workshop-timer-v1", sound: "workshop-sound-v1" },
    onEnding: onEnding,
    onGoodbye: goodbye,
    onRest: onRest,
    onWake: onWake,
    onBig: function () { resize(); },
    onSound: function (on) { if (on) { ensureAudio(); blip(660, 0.15, 0.08, "sine", 880); } },
    onTimer: function (info) { TI = info; }
  });
  Toybox.offFirst({
    running: function () { return R.on || R.spin > 0.05; },
    name: "wood lathe",
    off: function (done) {
      if (R.on) blip(160, 0.1, 0.08, "triangle", 90);
      R.on = false; R.fastStop = true; R.sand = null; releaseTool();
      var t0 = performance.now();
      var iv = setInterval(function () {
        if ((!R.on && R.spin <= 0.05) || performance.now() - t0 >= 850) {
          clearInterval(iv);
          R.spin = 0; R.fastStop = false;
          done();
        }
      }, 30);
    },
    flash: function () { R.flash.switch = now + 3.2; }
  });

  var lastLabel = "";
  function updateAria() {
    var t = "Lathe, " + (R.on ? "switched on, speed " + SPEED_NAMES[S.speed] : "switched off") + ". " +
      WOODS[S.wood].name + " blank" + (R.everCut ? ", being turned" : ", still square") + ". Tool: " + TOOLS[S.tool].name + ". Pieces: " + S.pieces + ".";
    if (t !== lastLabel) { lastLabel = t; cv.setAttribute("aria-label", t); }
  }
  var lastT = performance.now(), ariaAt = 0;
  function frame(t) {
    var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
    lastT = t;
    now = t / 1000;
    if (Toybox.timer.phase() !== "resting") {
      updateMachine(dt);
      updateSeq(dt);
      updatePass(dt);
      updateTool(dt);
      updateSand(dt);
      updateParts(dt);
      updateGo();
      if (Toybox.timer.phase() === "ending") endingFrame();
      draw();
      if (now - ariaAt > 1) { ariaAt = now; updateAria(); }
    }
    updateSound();
    requestAnimationFrame(frame);
  }
  if (params.debug === "1") window.__lathe = { S: function () { return S; }, R: R, M: function () { return M; }, P: function () { return P; }, hits: function () { return hits; }, parts: function () { return parts.length; },
    ui: function () { return { go: goBtn.label(), busy: goBtn.isBusy(), pass: !!R.pass, sand: !!(R.sand || R.sandWait), seq: !!R.seq, coach: coach.text(), pieces: S.pieces, shelf: S.shelf.length, wood: S.wood, on: R.on, cut: R.everCut }; },
    wood: function () { var cr = cv.getBoundingClientRect(); return [cr.left + M.ox + (WX0 + WX1) / 2 * M.s, cr.top + M.oy + AXY * M.s]; },
    zone: function (k) { var cr = cv.getBoundingClientRect(); for (var i = 0; i < hits.length; i++) if (hits[i].kind === k) return [cr.left + hits[i].x + hits[i].w / 2, cr.top + hits[i].y + hits[i].h / 2]; return null; },
    tool: function () { var cr = cv.getBoundingClientRect(); return [cr.left + M.ox + R.tipX * M.s, cr.top + M.oy + (AXY + R.tipD + 60) * M.s]; },
    ghost: function () { return ghost.show(); } };
  requestAnimationFrame(frame);
})();
</script>
</body>
