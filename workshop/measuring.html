<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
/* ---------- Standard app shell (common/toybox.css, tb-v2): header, stage with the job bar, panel ----------
   Job bar: Tape | Level | Square | Caliper (each its own scene on the bench). Panel: the bottom bar (New, Surprise).
   The readings on the bench are the point (the Numbers rule keeps them); units are a grown-up setting. */
.tb-head a { text-decoration: none; }
.stage { background: #C9A877; touch-action: none; }
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#jobs svg { display: block; }
/* Upright phones: four job tabs, so each tab stacks its picture over its word (the words keep their size). */
@media (max-width: 520px) {
  #jobs .tb-job { flex-direction: column; gap: 0; padding: 2px 2px 0; }
  #jobs .tb-job .tb-pic { width: 34px; height: 24px; }
}
/* The coach line turns green for a reading ("The board is 12 in long!"). */
.tb-coach.ok { background: #CDF5D0; }
/* The Back button shows the Workshop's picture (and its name on an iPad). */
.mapbtn .tb-mapic { width: 30px; height: 30px; flex: none; }
/* Big: the header, the job bar and the panel hide; every tool still works on the bench. */
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel, body.big .tb-jobs { display: none; }
body.ending .tb-panel, body.ending .tb-jobs, body.resting .tb-panel { pointer-events: none; }
body.ending .tb-panel, body.ending .tb-jobs, body.ending .mapbtn { opacity: 0.5; }
body.ending .mapbtn { pointer-events: none; }
.rest-art { width: min(60vw, 240px); }
/* Landscape: the panel is a narrow right-hand column with the bottom bar at its foot. */
@media (orientation: landscape) {
  .tb-v2 .tb-body .tb-panel { width: min(22%, 240px); justify-content: flex-end; }
  .tb-v2 .tb-panel .tb-bottombar { flex-direction: column; align-items: stretch; }
  .tb-v2 .tb-panel .tb-bottombar .btn { flex: none; width: 100%; margin-left: 0; }
  .tb-v2 .tb-panel .tb-bottombar .tb-bb-surprise { margin-top: calc(var(--tb-gap-new) - var(--tb-s3)); }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-v2 .tb-body .tb-panel { width: 170px; }
}
/* ---------- Project mode (opened from the Workshop project plan with ?project=&step=) ----------
   The tape alone: no job bar, no panel (the stage takes the screen). A white step banner sits at the top with the
   coach line centred under it. */
body.pj .tb-panel, body.pj .tb-jobs { display: none; }
.pjstep {
  position: absolute;
  left: 50%;
  top: 10px;
  z-index: 3;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 24px);
  white-space: nowrap;
  overflow: hidden;
  background: #FFFFFF;
  color: #1D2340;
  border: var(--tb-outline) solid #1D2340;
  border-radius: var(--tb-r-pill);
  padding: 2px 16px;
  font-size: 1.4rem;
  font-weight: 800;
  line-height: 1.15;
  text-align: center;
  pointer-events: none;
}
.pjstep[hidden] { display: none; }
body.pj .tb-v2 .tb-coach, body.pj .tb-coach { top: var(--pj-coach, 56px); bottom: auto; }
body.ending .pjstep { visibility: hidden; }
@media (max-width: 700px), (orientation: landscape) and (max-height: 520px) {
  .pjstep { font-size: 1.1rem; padding: 1px 12px; }
}
.pjdone {
  position: absolute;
  left: 50%;
  bottom: 12px;
  z-index: 4;
  transform: translateX(-50%);
  width: min(calc(100% - 24px), 460px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  color: var(--ink);
  border: var(--tb-outline) solid var(--edge);
  border-radius: 24px;
  box-shadow: var(--tb-card);
  padding: 12px 14px 14px;
  text-align: center;
  animation: pj-in 0.5s cubic-bezier(.3,1.4,.5,1) both;
}
.pjdone .pjdone-t { font-size: 2rem; font-weight: 800; line-height: 1.05; color: var(--tb-go); }
.pjdone .pjdone-l { font-size: 1.25rem; font-weight: 800; line-height: 1.15; }
.pjdone .btn.tb-go { width: 100%; min-height: var(--tb-go-h); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: var(--tb-fs-btn); color: #FFFFFF; background: var(--tb-go); box-shadow: 0 var(--tb-lip-h) 0 var(--tb-go-lip); }
.pjdone .btn.tb-go svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
@keyframes pj-in { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@media (orientation: landscape) and (max-height: 520px) {
  /* Short screens: the board fills the height, so the card takes the coach line's place under the banner
     (the coach line is off once the step is done) and stays off the board. */
  .pjdone { top: var(--pj-top, 56px); bottom: auto; flex-direction: row; justify-content: space-between; width: min(calc(100% - 24px), 640px); padding: 6px 10px; gap: 10px; text-align: left; animation-name: pj-in-top; }
  .pjdone .pjdone-txt { display: flex; flex-direction: column; gap: 0; min-width: 0; }
  .pjdone .pjdone-t { font-size: 1.4rem; }
  .pjdone .pjdone-l { font-size: 1.05rem; }
  .pjdone .btn.tb-go { width: auto; flex: none; min-height: 52px; padding: 0 16px; }
}
@keyframes pj-in-top { from { transform: translate(-50%, -24px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pjdone { animation: none; } }
</style>
</head>
<body>
<div class="tb-app-shell tb-v2 wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="wallbtn" href="./" aria-label="Back to the Workshop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><svg class="tb-mapic" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 16 20 5l16 11v20H4Z" fill="#E7B86A" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="10" y="18" width="20" height="18" fill="#AEB9C5" stroke="#1D2340" stroke-width="2.5"/><path d="M10 23h20M10 28h20M10 33h20" stroke="#1D2340" stroke-width="1.6"/></svg><span>Workshop</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Measuring</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>
  <div class="tb-body app">
    <div class="tb-stagecol">
      <main class="tb-stage stage" id="stage">
        <canvas id="cv" role="img" aria-label="A tape measure on the workbench"></canvas>
        <div class="pjstep" id="pjstep" role="status" hidden></div>
        <div id="coach"></div>
      </main>
      <div id="jobs"></div>
    </div>
    <section class="tb-panel" id="panel">
      <div id="bottom"></div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- The safety-gear check ----------
  var gearOn = true;
  try { gearOn = sessionStorage.getItem("workshop-gear") === "on"; } catch (e) { gearOn = true; }
  if (!gearOn) {
    // A project step (a plan sent us here): gear up through the plan page, which keeps the step.
    var projArg = (location.search.match(/[?&]project=([a-z0-9-]+)/) || [])[1];
    if (projArg) { location.replace("project.html?project=" + projArg); return; }
    var toolArg = (location.search.match(/[?&]tool=([a-z]+)/) || [])[1];
    location.replace("./?next=measuring" + (toolArg ? "&tool=" + toolArg : ""));
    return;
  }

  var OUT = "#1D2340";
  var SKEY = "workshop-measuring-v1";
  var TOOLS = ["tape", "combosquare", "level", "square", "caliper"];
  var JOBS = ["tape", "level", "square", "caliper"];   // the job bar (the combination square stays for a project step)
  var coach = Toybox.coach(document.getElementById("coach"));
  // Inches or centimetres: a grown-up choice on the home screen (App settings), never a button for him.
  function unitNow() { var v = null; try { v = Toybox.settings.get("measuring-cm"); } catch (e) { v = null; } return v === true ? "cm" : "in"; }
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var FONT = "\"Baloo 2\", \"Trebuchet MS\", sans-serif";
  var DEG = Math.PI / 180;

  // ---------- Project mode: one "mark" step of a Workshop project (see projects.js) ----------
  // Opened as measuring.html?project=<id>&step=<stepId>. The bench holds only the project board, the tape or
  // combination square reads inches in halves, and the step ends with a "Done!" card that leads back to the plan.
  // Nothing here touches the saved free-play state. PJ is null in normal play.
  var PSTEP = window.ToyboxProjects ? ToyboxProjects.fromQuery() : null;
  if (PSTEP && !(PSTEP.job && PSTEP.job.kind === "mark" && PSTEP.job.board)) PSTEP = null;
  var pjInitTool = (PSTEP && PSTEP.tool === "combosquare" && PSTEP.job.target <= 12) ? "combosquare" : "tape";
  var PJ = PSTEP ? {
    tool: pjInitTool,         // "tape" or "combosquare"
    phase: pjInitTool === "combosquare" ? "combo" : "tape", // tape|combo -> tick -> square | x -> done
    target: PSTEP.job.target, // inches from the board's left end
    mark: PSTEP.job.mark,     // "line": a square line across the board; "x": an X for the entrance hole
    board: null,              // the one thing on the bench (also T.objs[0])
    comboIn: 1.5, comboD: 0, comboHeld: false, knobLock: 0, lastHalf: 3, // combination square head along the 12-in rule
    tickX: 0, tick: 0,        // the pencil tick: x in px, draw progress 0..1
    onTarget: false, misses: 0,
    onTick: false, cover: null, lineT: 0, sqIn: 0, sqOff: 1.2, sqAway: 0,  // the square phase (sqAway: glide off the line once drawn)
    xT: 0,                    // the X: two strokes, 0..2
    wait: 0, msg: null, card: null, href: null, finished: false
  } : null;
  if (PJ) {
    document.body.classList.add("pj");
    if (PJ.target > 12) document.body.classList.add("pj-long");
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  var $ = function (id) { return document.getElementById(id); };
  function seeded(seed) {
    var s = (seed >>> 0) || 1;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

  // ---------- Saved state ----------
  function freshState() {
    return { tool: PJ ? PJ.tool : "tape", unit: PJ ? "in" : unitNow(), sq: 90, sqF: 0.25, comboF: 0.5, flip: false, lines: [], item: null, zero: 0, gap: 30, boardA: 6 };
  }
  function loadState() {
    var s = freshState();
    try {
      var o = JSON.parse(localStorage.getItem(SKEY) || "null");
      if (!o || typeof o !== "object") return s;
      if (JOBS.indexOf(o.tool) !== -1) s.tool = o.tool;
      else if (o.tool === "combosquare") s.tool = "square";   // the combination square merged into Square
      if (o.sq === 45) s.sq = 45;
      if (typeof o.sqF === "number" && isFinite(o.sqF)) s.sqF = clamp(o.sqF, 0, 1);
      if (typeof o.comboF === "number" && isFinite(o.comboF)) s.comboF = clamp(o.comboF, 0, 1);
      s.flip = !!o.flip;
      if (Array.isArray(o.lines)) s.lines = o.lines.filter(function (l) { return l && [l.x0, l.y0, l.x1, l.y1].every(function (v) { return typeof v === "number" && isFinite(v); }); }).slice(-80);
      if (o.item && ITEMS[o.item]) s.item = o.item;
      // the caliper zeroes itself now (no Zero button): an old saved zero is ignored
      if (typeof o.gap === "number" && isFinite(o.gap)) s.gap = clamp(o.gap, 0, GMAX);
      if (typeof o.boardA === "number" && isFinite(o.boardA)) s.boardA = clamp(o.boardA, -15, 15);
    } catch (e) { /* ignore */ }
    if (s.item && s.gap < ITEMS[s.item].w) s.gap = ITEMS[s.item].w;
    return s;
  }
  var saveTimer = null;
  function save() {
    if (PJ) return;  // project mode: fresh state in memory only, the saved free-play state is left alone
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
    }, 250);
  }

  // Caliper parts (mm): w = the size the jaws measure.
  var ITEMS = {
    bolt: { name: "Bolt", w: 8 },
    nut: { name: "Nut", w: 13 },
    dowel: { name: "Dowel", w: 19 },
    washer: { name: "Washer", w: 24 }
  };
  var ITEM_ORDER = ["bolt", "nut", "washer", "dowel"];
  var GMAX = 54; // widest caliper opening (mm)

  // Opened from the Toybox home screen: first-visit tool and a clean board (nothing here is a collection).
  // A project step always starts from the fresh state (tape or combosquare, inches) and is never saved.
  var startFresh = !!(window.Toybox && Toybox.fresh());
  var S = PJ || startFresh ? freshState() : loadState();
  if (startFresh && !PJ) save();

  // ---------- Canvas and layout ----------
  var cv = $("cv"), ctx = cv.getContext("2d");
  var DPR = 1, CW = 300, CH = 300, U = 300, PAD = 10, OPTH = 70;
  var bgCanvas = document.createElement("canvas");

  // Tape measure
  var T = {
    ppi: 40, cs: 120, bw: 30, objs: [], c: { x: 0, y: 0 }, a: 0, d: 0, zip: false, zv: 0, hookHeld: false,
    snap: null, shown: 0, live: false, bump: 0, burst: [], lastIn: 0, maxIn: 25, caseFly: null, home: null,
    // Coaching: which thing to measure next, the happy result line, the ghost hand
    goal: 0, msg: null, moveAt: 0, needAlign: false, lastTouch: 0, ghost: null, ghostDone: false, coachKey: ""
  };
  // Combination square (free play)
  var C = { bx: 0, by: 0, bw: 300, bh: 200, ppi: 30, rw: 28, headW: 48, F: 40, live: null, edgeFlash: 0, everSlid: false, lastTick: 0 };
  // Spirit level
  var L = { pv: { x: 0, y: 0 }, lb: 400, tb: 24, ll: 320, hl: 70, wh: 100, amax: 12, a: S.boardA, bub: [], wasLevel: false, glow: 0, sparks: [], aT: null };
  // Speed square
  var Q = { bx: 0, by: 0, bw: 300, bh: 200, sl: 160, lip: 14, xd: 0, flipT: S.flip ? 1 : 0, live: null, clearT: 0, edgeFlash: 0, clack: 0 };
  // Caliper
  var K = { k: 4, ox: 0, oy: 0, gd: S.gap, contact: 0, zeroFlash: 0, trayY: 0, trayH: 0, slots: {}, fly: {}, bubble: false, wasTouch: false };

  var now = 0;

  var pjCoachTop = 56;
  // Where the coach line sits (top-centre on tablets, bottom-centre on phones): the space to keep clear for it.
  function coachBand() {
    var el = coach.el, h = Math.max(36, el.offsetHeight || 0), st = $("stage").getBoundingClientRect(), r = el.getBoundingClientRect();
    var atTop = !r.height ? CW >= 600 && CH >= 520 : (r.top + r.height / 2 - st.top) < CH / 2;
    return atTop ? { top: h + 14, bot: 0 } : { top: 0, bot: h + 16 };
  }
  function layout() {
    U = Math.min(CW, CH);
    PAD = U < 500 ? 8 : 14;
    OPTH = 4;  // the options moved out of the stage into the panel
    layoutTape();
    layoutCombo();
    layoutLevel();
    layoutSquare();
    layoutCaliper();
  }

  // The step banner: one line that must fit the stage width (shrink the font rather than wrap or cut).
  function fitBanner() {
    var el = $("pjstep");
    if (!PJ || el.hidden) return;
    var small = window.matchMedia && (matchMedia("(max-width: 700px)").matches || matchMedia("(orientation: landscape) and (max-height: 520px)").matches);
    var size = small ? 17.6 : 22.4;
    el.style.fontSize = size + "px";
    while (el.scrollWidth > el.clientWidth + 1 && size > 11) { size -= 1; el.style.fontSize = size + "px"; }
  }
  // Project mode: the project board alone, lying with its left end at the tape hook (or under the 12-inch
  // combination square rule).
  function layoutProject() {
    fitBanner();
    var isCombo = PJ.tool === "combosquare";
    var cs = clamp(U * 0.2, 74, 150);
    var xL = isCombo ? PAD + Math.max(24, Math.round(cs * 0.32)) : PAD + cs + 12;
    var bannerH = $("pjstep").offsetHeight || 0;
    pjCoachTop = 10 + bannerH + 8;
    $("stage").style.setProperty("--pj-coach", pjCoachTop + "px");
    $("stage").style.setProperty("--pj-top", (10 + bannerH + 6) + "px");  // short screens: the Done card goes here
    var top = 10 + bannerH + 8 + (coach.el.offsetHeight || 0) + 12;
    var w = PSTEP.job.board.w, l = PSTEP.job.board.l;
    var visIn = Math.max(isCombo ? 13.2 : 10, PJ.target * 1.35, PJ.target + 6);
    var ppi = Math.max(3, Math.min((CW - xL - 10) / visIn, (CH - top - 50) / (w * 1.25)));
    var h = Math.max(w * ppi, 40);
    var sl = Math.max(h * 1.15, 64);
    var lip = clamp(sl * 0.09, 10, 26);
    var cyMin = top + (sl - h) + h / 2 + 8, cyMax = CH - 22 - lip - h / 2;
    var cy = cyMax < cyMin ? cyMin : clamp(CH * 0.52, cyMin, cyMax);
    var o = { id: "board", len: l, w: w, x0: xL, x1: xL + l * ppi, h: h, cy: cy };
    T.ppi = ppi; T.cs = cs; T.objs = [o]; T.F = clamp(U * 0.085, 30, 66);
    T.bw = clamp(ppi * 0.95, 24, 58);
    T.maxIn = l;
    T.home = { x: o.x0 - cs / 2, y: o.cy };
    T.c.x = T.home.x; T.c.y = T.home.y; T.a = 0; T.caseFly = null;
    T.d = 0; T.zip = false;
    PJ.board = o; PJ.tickX = o.x0 + PJ.target * ppi;
    PJ.comboD = PJ.comboIn * ppi;
    // The speed square (or upright combination square) rides the project board's near (bottom) edge.
    Q.bx = o.x0; Q.by = o.cy - h / 2; Q.bw = o.x1 - o.x0; Q.bh = h; Q.sl = sl; Q.lip = lip; Q.flipT = 1;
    if (PJ.lineT > 0) Q.xd = PJ.tickX + easeIO(PJ.sqAway) * 1.5 * ppi;
    else Q.xd = PJ.onTick ? PJ.tickX : clamp(PJ.tickX + PJ.sqOff * ppi, o.x0, Math.min(o.x1 - ppi * 0.3, CW - sl * 0.3));
  }

  function layoutCombo() {
    if (PJ) return;
    C.F = clamp(U * 0.085, 30, 60);
    var topSpace = PAD + C.F * 1.45 + 18;
    var ppi = Math.max(12, Math.min((CW - 2 * PAD - 76) / 12, (CH - OPTH - topSpace - PAD - 20) / 4.8));
    C.ppi = ppi;
    C.rw = clamp(ppi * 0.78, 22, 42);
    C.headW = clamp(C.rw * 1.65, 42, 74);
    C.bw = 12 * ppi;
    C.bh = clamp(ppi * 4.4, 110, Math.max(120, CH - OPTH - topSpace - PAD - 12));
    C.bx = Math.max(PAD + 14, (CW - C.bw - C.headW * 0.7) / 2);
    C.by = Math.max(topSpace, (CH - OPTH + topSpace - C.bh) / 2);
  }

  function layoutTape() {
    if (PJ) { layoutProject(); return; }
    var cs = clamp(U * 0.2, 60, 170);
    var availW = CW - 2 * PAD - cs - 12;

  // ---------- Sound (off by default; soft synthesized) ----------

    else if (S.tool === "level") { var a = L.a * DEG, y0 = -L.tb - L.hl / 2; x = L.pv.x - Math.sin(a) * y0 + Math.cos(a) * L.ll * 0.34; y = L.pv.y + Math.cos(a) * y0 + Math.sin(a) * L.ll * 0.34; r = L.hl * 0.42; }
    else if (S.tool === "square") { var G = sqGeom(); x = G.corner.x + Q.sl * 0.25; y = G.corner.y + G.dir * Q.sl * 0.25; r = Q.sl * 0.12; }
    else { var p0 = km(S.gap + 21, -2); x = p0.x; y = p0.y; r = 9 * K.k; }
    var t = F.t, al = clamp(Math.min(t, F.dur - t) / 0.3, 0, 1), blink = (t > 1.2 && t < 1.4) || (t > 2.5 && t < 2.65);
    c.save(); c.globalAlpha = al; c.translate(x, y); c.lineCap = "round";
    [-1, 1].forEach(function (sx) {
      var ex = sx * r * 0.5, ey = -r * 0.2;
      if (blink) { c.strokeStyle = OUT; c.lineWidth = r * 0.16; c.beginPath(); c.moveTo(ex - r * 0.25, ey); c.lineTo(ex + r * 0.25, ey); c.stroke(); return; }
      c.beginPath(); c.arc(ex, ey, r * 0.3, 0, Math.PI * 2); c.fillStyle = "#FFFFFF"; c.fill(); c.lineWidth = r * 0.09; c.strokeStyle = OUT; c.stroke();
      c.beginPath(); c.arc(ex + r * 0.05, ey + r * 0.05, r * 0.14, 0, Math.PI * 2); c.fillStyle = OUT; c.fill();
    });
    c.beginPath(); c.arc(0, r * 0.2, r * 0.42, 0.15 * Math.PI, 0.85 * Math.PI);
    c.strokeStyle = "#FFFFFF"; c.lineWidth = r * 0.28; c.stroke(); c.strokeStyle = OUT; c.lineWidth = r * 0.13; c.stroke();
    c.restore();
  }

  // =====================================================================
  // PROJECT MODE: the coach line, the phase clock, the Done! card, the idle hand
  // =====================================================================
  // A short hint on top of the phase's coach line, for a few seconds ("A bit more!", "Right on 12!").
  function pjSay(text, cls, secs) {
    if (!PJ) return;
    PJ.msg = { text: text, cls: cls || "flash", until: now + (secs || 3) };
  }
  function pjBaseCoach() {
    if (PJ.phase === "combo") return PJ.onTarget && PJ.comboHeld ? "Let go!" : "Slide the square to " + ToyboxProjects.fmt(PJ.target) + "!";
    if (PJ.phase === "tape") return PJ.onTarget && T.hookHeld ? "Let go!" : "Pull the tape to " + ToyboxProjects.fmt(PJ.target) + "!";
    if (PJ.phase === "square") return PJ.lineT > 0 ? "A straight line!" : (PJ.onTick ? "Draw along the square!" : "Slide the square to the mark!");
    if (PJ.phase === "x") return "X marks the door!";
    return "";
  }
  function pjCoach() {
    var el = coach.el;
    if (PJ.msg && now >= PJ.msg.until) PJ.msg = null;
    var text = PJ.msg ? PJ.msg.text : pjBaseCoach();
    var happy = PJ.lineT > 0 || PJ.xT >= 2 || (PJ.phase === "tape" && PJ.onTarget && T.hookHeld) || (PJ.phase === "combo" && PJ.onTarget && PJ.comboHeld);
    var cls = PJ.msg ? PJ.msg.cls : (happy ? "ok" : "");
    var off = PJ.phase === "done" || !text;
    var key = text + "|" + cls + "|" + off;
    if (key !== T.coachKey) {
      T.coachKey = key;
      if (off) coach.clear(); else coach.step(text);
      el.classList.toggle("ok", cls === "ok");
    }
  }
  // After the tick: the square slides in to the right of the tick (a "line" step) or the X draws itself.
  // When using the combination square, it is already at the mark, so it hooks upright at PJ.tickX ready to draw!
  function startPhaseB() {
    PJ.msg = null; T.coachKey = "";
    if (PJ.mark === "x") { PJ.phase = "x"; PJ.xT = reduce ? 2 : 0.001; PJ.wait = 1.0; return; }
    PJ.phase = "square"; PJ.sqIn = reduce ? 1 : 0.001; PJ.cover = null; PJ.lineT = 0; PJ.sqAway = 0;
    S.sq = 90; S.flip = true; S.lines = []; Q.flipT = 1; Q.live = null; Q.clearT = 0;
    if (PJ.tool === "combosquare") {
      PJ.onTick = true; PJ.sqOff = 0; Q.xd = PJ.tickX; Q.clack = 1; Q.edgeFlash = 1;
    } else {
      PJ.onTick = false; PJ.sqOff = 1.2;
      Q.xd = clamp(PJ.tickX + PJ.sqOff * T.ppi, PJ.board.x0, Math.min(PJ.board.x1 - T.ppi * 0.3, CW - Q.sl * 0.3));
    }
    blip(600, 0.08, 0.05, "triangle", 420);
  }
  // The job is done: record it, then the card with the one way on (a real link, never automatic).
  function finishJob() {
    if (PJ.finished) return;
    PJ.finished = true; PJ.phase = "done"; PJ.msg = null;
    PJ.href = ToyboxProjects.finish(PSTEP);
    var card = document.createElement("div");
    card.className = "pjdone";
    card.setAttribute("role", "dialog");
    card.setAttribute("aria-label", "Done");
    card.innerHTML = '<div class="pjdone-txt"><div class="pjdone-t">Done! ✓</div><div class="pjdone-l"></div></div><a class="btn tb-go" id="pjback"></a>';
    card.querySelector(".pjdone-l").textContent = PSTEP.done;
    var a = card.querySelector("a");
    a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Back to the plan</span>';
    a.href = PJ.href;
    $("stage").appendChild(card);
    PJ.card = card;
    chime();
    updateAria(true);
  }
  // Called every frame in project mode: the marks that draw themselves and the calm pauses between phases.
  function updateProject(dt) {
    PJ.knobLock = Math.max(0, PJ.knobLock - dt * 2.2);
    if (PJ.phase === "combo" && PJ.comboHeld && PJ.onTarget) {
      PJ.comboD = lerp(PJ.comboD, PJ.target * T.ppi, Math.min(1, dt * 14));
      PJ.comboIn = PJ.comboD / T.ppi;
    }
    if (PJ.tick > 0 && PJ.tick < 1) PJ.tick = reduce ? 1 : Math.min(1, PJ.tick + dt / 0.6);
    if (PJ.autoLine && now >= PJ.autoLine && PJ.phase === "square" && PJ.onTick && PJ.lineT === 0 && Math.abs(Q.xd - PJ.tickX) < 1.5) {
      // one press: the pencil runs along the square by itself
      PJ.autoLine = 0; Q.live = null; S.lines = [];
      PJ.lineT = 0.001; PJ.wait = 1.2;
      pjSay("A straight line!", "ok", 60);
      chime();
    }
    if (PJ.phase === "tick") {
      var settledTool = PJ.tool === "combosquare" ? true : (!T.zip && T.d <= 0);
      if (settledTool && PJ.tick >= 1 && !busy()) { PJ.wait -= dt; if (PJ.wait <= 0) startPhaseB(); }
    } else if (PJ.phase === "square") {
      if (PJ.sqIn < 1) PJ.sqIn = Math.min(1, PJ.sqIn + dt / 0.5);
      if (PJ.lineT === 0 && PJ.onTick && Math.abs(Q.xd - PJ.tickX) > 0.1) Q.xd = lerp(Q.xd, PJ.tickX, Math.min(1, dt * 12));
      if (PJ.lineT > 0 && PJ.lineT < 1) PJ.lineT = reduce ? 1 : Math.min(1, PJ.lineT + dt / 0.8);
      else if (PJ.lineT >= 1 && !busy()) { PJ.wait -= dt; if (PJ.wait <= 0) finishJob(); }
    } else if (PJ.phase === "x") {
      if (PJ.xT < 2) PJ.xT = Math.min(2, PJ.xT + dt / 0.7);
      else if (!busy()) { PJ.wait -= dt; if (PJ.wait <= 0) finishJob(); }
    }
    // once the line is drawn the square glides a little to the right, so the line shows (also under the card)
    if (PJ.mark === "line" && PJ.lineT >= 1 && PJ.sqAway < 1) {
      PJ.sqAway = reduce ? 1 : Math.min(1, PJ.sqAway + dt / 0.9);
      Q.xd = PJ.tickX + easeIO(PJ.sqAway) * 1.5 * T.ppi;
    }
    pjCoach();
  }
  // ---------- The job bar (Tape | Level | Square | Caliper) and the bottom bar (New, Surprise) ----------
  var JOB_PIC = {
    tape: '<svg viewBox="0 0 58 44" aria-hidden="true"><path d="M30 27 H54 V33 H30 Z" fill="#FFE27A" stroke="#1D2340" stroke-width="2.5"/><path d="M36 27v3M42 27v4M48 27v3" stroke="#1D2340" stroke-width="1.8"/><rect x="52" y="24" width="4" height="12" rx="1" fill="#C98A2B" stroke="#1D2340" stroke-width="2"/><rect x="3" y="6" width="30" height="32" rx="10" fill="#FFC93C" stroke="#1D2340" stroke-width="3"/><circle cx="18" cy="22" r="7" fill="#26282E" stroke="#1D2340" stroke-width="2"/><rect x="8" y="3" width="12" height="6" rx="3" fill="#E63946" stroke="#1D2340" stroke-width="2.5"/></svg>',
    level: '<svg viewBox="0 0 58 44" aria-hidden="true"><rect x="2" y="14" width="54" height="16" rx="3" fill="#FFC93C" stroke="#1D2340" stroke-width="3"/><rect x="2" y="14" width="7" height="16" rx="2" fill="#26282E"/><rect x="49" y="14" width="7" height="16" rx="2" fill="#26282E"/><rect x="19" y="17" width="20" height="10" rx="5" fill="#B9F04A" stroke="#1D2340" stroke-width="2.5"/><ellipse cx="29" cy="22" rx="4" ry="3" fill="#FFFFFF"/></svg>',
    square: '<svg viewBox="0 0 58 44" aria-hidden="true"><path d="M10 6 H50 L10 40 Z" fill="#C7D0DA" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><path d="M17 13 H36 L17 29 Z" fill="#C9A877" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="6" y="3" width="46" height="6" rx="2" fill="#9AA6B4" stroke="#1D2340" stroke-width="2.5"/></svg>',
    caliper: '<svg viewBox="0 0 58 44" aria-hidden="true"><rect x="2" y="12" width="54" height="6" fill="#D5DBE2" stroke="#1D2340" stroke-width="2.5"/><path d="M4 18 H11 V36 L8 41 H6 L4 33 Z" fill="#C7D0DA" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><path d="M20 18 H27 V33 L25 41 H23 L20 36 Z" fill="#C7D0DA" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="20" y="4" width="26" height="20" rx="3" fill="#B6BDC7" stroke="#1D2340" stroke-width="2.5"/><rect x="24" y="7" width="18" height="9" rx="1.5" fill="#C9E3B0" stroke="#1D2340" stroke-width="2"/></svg>'
  };
  var JOB_NAME = { tape: "Tape", level: "Level", square: "Square", caliper: "Caliper" };
  var jobs = null;
  if (!PJ) {
    jobs = Toybox.jobs($("jobs"), {
      jobs: JOBS.map(function (id) { return { id: id, name: JOB_NAME[id], pic: JOB_PIC[id] }; }),
      value: S.tool,
      onPick: function (id) { ensureAudio(); setTool(id); }
    });
    Toybox.bar($("bottom"), {
      shelf: null,
      onNew: function () { ensureAudio(); newBench(); },
      onSurprise: function () { ensureAudio(); surprise(); }
    });
  }
  function setTool(t, quiet) {
    if (TOOLS.indexOf(t) === -1) return;
    if (PJ) {
      if (PJ.finished || PJ.card) return;
      if (t !== "tape" && t !== "combosquare") return;
      if (t === "combosquare" && PJ.target > 12) return;
      releaseAll();
      PJ.tool = t;
      S.tool = t;
      PJ.phase = t === "combosquare" ? "combo" : "tape";
      PJ.onTarget = false; PJ.onTick = false; PJ.tick = 0; PJ.lineT = 0; PJ.xT = 0;
      PJ.cover = null; PJ.sqIn = 0; PJ.sqAway = 0; PJ.msg = null; PJ.knobLock = 0;
      PJ.comboIn = 1.5; PJ.comboHeld = false;
      T.d = 0; T.zip = false; T.hookHeld = false; T.shown = 0; T.auto = null;
      S.lines = []; Q.live = null; C.live = null;
      if (!quiet) blip(560, 0.08, 0.06, "triangle", 840);
      T.lastTouch = now; T.coachKey = "";
      layoutProject();
      pjCoach();
      updateAria(true);
      return;
    }
    if (t === "combosquare") t = "square";
    if (t !== S.tool) {
      releaseAll(); fun = null; T.auto = null; Q.auto = null;
      okUntil = 0; clearTimeout(okTimer); coach.el.classList.remove("ok"); lastLine = null;
    }
    S.tool = t;
    if (jobs) jobs.set(t);
    if (!quiet) { blip(560, 0.08, 0.06, "triangle", 840); save(); }
    T.lastTouch = now; T.coachKey = "";
    updateAria(true);
  }

  // ---------- Play timer hooks (the shared Toybox timer: it keeps going on every Workshop page) ----------
  // Ending: the tape zips back, the board on the level settles flat, then done().
  var endingDone = null;
  function onEnding(done) {
    endingDone = done;
    releaseAll();
    if (T.d > 1 && !T.zip) { T.hookHeld = false; T.zip = true; T.zv = 200; T.shown = tapeValue(T.d); whoosh(0.45, 2200, 500, 0.05); }
    L.aT = 0;
    Q.live = null;
    C.live = null;
    if (PJ) PJ.comboHeld = false;
  }
  function goodbye() {
    if (T.d > 1 && !T.zip) { T.zip = true; T.zv = 200; }
    L.aT = 0;
    chime();
  }
  function settled() {
    var bubOk = L.bub.every(function (b) { return Math.abs(b.v) < 0.05; });
    var flying = Object.keys(K.fly).length > 0;
    return !T.zip && T.d < 1 && L.aT === null && Math.abs(L.a) < 0.1 && bubOk && !flying && T.bump < 0.05;
  }
  function endingFrame() {
    if (endingDone && settled()) { S.boardA = 0; save(); endingDone(); endingDone = null; }
  }
  function onRest() { endingDone = null; T.d = 0; T.zip = false; }
  function onWake() { endingDone = null; }
  function restArt() {
    // A toolbox with the measuring tools put away on top
    return '<svg class="rest-art" viewBox="0 0 240 200" aria-hidden="true">' +
      '<rect x="10" y="172" width="220" height="14" rx="4" fill="#D99A55" stroke="#1D2340" stroke-width="4"/>' +
      '<path d="M84 96 V80 Q84 70 94 70 H146 Q156 70 156 80 V96" fill="none" stroke="#1D2340" stroke-width="7" stroke-linecap="round"/>' +
      '<rect x="34" y="96" width="172" height="76" rx="10" fill="#E63946" stroke="#1D2340" stroke-width="4"/>' +
      '<rect x="34" y="96" width="172" height="20" rx="8" fill="#F06A74" stroke="#1D2340" stroke-width="4"/>' +
      '<rect x="108" y="122" width="24" height="12" rx="3" fill="#C8CDD6" stroke="#1D2340" stroke-width="3"/>' +
      '<rect x="44" y="60" width="34" height="36" rx="10" fill="#FFC93C" stroke="#1D2340" stroke-width="4"/>' +
      '<circle cx="61" cy="78" r="7" fill="#2E3138"/>' +
      '<rect x="76" y="86" width="8" height="10" rx="2" fill="#E2B04A" stroke="#1D2340" stroke-width="3"/>' +
      '<rect x="150" y="84" width="74" height="14" rx="3" fill="#FFC93C" stroke="#1D2340" stroke-width="4" transform="rotate(-8 187 91)"/>' +
      '<rect x="178" y="85" width="18" height="9" rx="4.5" fill="#B9F04A" stroke="#1D2340" stroke-width="2.5" transform="rotate(-8 187 91)"/>' +
      '<path d="M196 30 q8 -8 16 0 M202 18 q6 -6 12 0" fill="none" stroke="#2D5BD7" stroke-width="3" stroke-linecap="round"/>' +
      '<text x="206" y="46" font-family="Baloo 2, sans-serif" font-weight="800" font-size="18" fill="#2D5BD7">z</text>' +
      '<text x="220" y="32" font-family="Baloo 2, sans-serif" font-weight="800" font-size="14" fill="#2D5BD7">z</text></svg>';
  }

  // ---------- Accessibility label ----------
  var lastLabel = "";
  function updateAria(force) {
    var t;
    if (PJ) {
      var pjRead = PJ.tool === "combosquare" ? "Combination square reading " + tapeText(PJ.comboHeld || PJ.comboD > 0 ? tapeValue(PJ.comboD) : T.shown) : "Tape measure reading " + tapeText(T.hookHeld ? tapeValue(T.d) : T.shown);
      t = PSTEP.title + ". " + (PJ.phase === "done" ? PSTEP.done + " Done." : pjRead + ".");
    }
    else if (S.tool === "tape") t = "Tape measure. Reading " + tapeText(T.hookHeld ? tapeValue(T.d) : T.shown) + ". A board, a pencil, a toy car and a block are on the bench.";
    else if (S.tool === "combosquare") t = "Combination square on a board, reading " + comboText() + ". " + S.lines.length + " pencil lines.";
    else if (S.tool === "level") { var phi = effTilt(); t = "Spirit level on a board. " + (Math.abs(phi) < 0.5 ? "It is level." : Math.round(Math.abs(phi)) + " degrees off level."); }
    else if (S.tool === "square") t = "Speed square on a board, marking the " + S.sq + " degree edge. " + S.lines.length + " pencil lines.";
    else t = "Digital caliper reading " + calText() + (S.item ? ", with a " + ITEMS[S.item].name.toLowerCase() + " in the jaws." : ".");
    if (force || t !== lastLabel) { lastLabel = t; cv.setAttribute("aria-label", t); }
  }

  // ---------- Frame ----------
  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bgCanvas, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.lineJoin = "round";
    if (PJ) drawProject(ctx);
    else if (S.tool === "tape") drawTape(ctx);
    else if (S.tool === "combosquare") drawCombo(ctx);
    else if (S.tool === "level") drawLevel(ctx);
    else if (S.tool === "square") drawSquare(ctx);
    else drawCaliper(ctx);
    if (!PJ) drawFunFace(ctx);
  }
  // Opened from the Tool Wall's "Try it" button: start on that tool.
  (function () {
    if (PJ) return;
    var m = location.search.match(/[?&]tool=([a-z]+)/);
    var WALL = { tape: "tape", combosquare: "combosquare", level: "level", speedsquare: "square", calipers: "caliper" };
    if (m && WALL[m[1]]) S.tool = WALL[m[1]];
  })();
  if (PJ) {
    // Project mode chrome: Back leads to the plan, the step banner and the first coach line are shown
    // before the first layout (the board is placed under them).
    var wallBtn = $("wallbtn");
    wallBtn.href = ToyboxProjects.planUrl(PSTEP.project);
    wallBtn.setAttribute("aria-label", "Back to the plan");
    wallBtn.querySelector("span").textContent = "Plan";
    var banner = $("pjstep");
    banner.textContent = PSTEP.title;
    banner.hidden = false;
    coach.step(pjBaseCoach());
    document.title = "Measuring: " + PSTEP.title;
  }
  setTool(S.tool, true);
  resize();
  // Inches or centimetres changed on the home screen: the readings follow.
  try {
    Toybox.settings.onChange(function (id) {
      if (id !== "measuring-cm" || PJ) return;
      var u = unitNow();
      if (u !== S.unit) { T.shown = u === "cm" ? Math.round(T.shown * 2.54) : Math.round(T.shown / 2.54); S.unit = u; save(); }
    });
  } catch (e) { /* ignore */ }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 120); });
  if (window.ResizeObserver) { try { new ResizeObserver(function () { resize(); }).observe($("stage")); } catch (e) { /* ignore */ } }

  try { if (localStorage.getItem("workshop-sound-v1") === "on") localStorage.setItem("workshop-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "workshop-measuring",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the tape zips back, the tools settle and rest, and the controls lock. The timer carries on across Workshop pages.",
    goodbyeOption: "End with a “Put away” button to press",
    farewellText: "Time to put the tools away",
    goodbyeLabel: "Put away",
    farewellDone: "Bye bye, tools!",
    restLine: "The tools are put away.",
    restLine2: "They will be right here next time.",
    restArt: restArt,
    soundNote: "Soft clicks, a zip and a chime. Hold for 2 seconds.",
    legacy: { timer: "workshop-timer-v1", sound: "workshop-sound-v1" },
    onEnding: onEnding,
    onGoodbye: goodbye,
    onRest: onRest,
    onWake: onWake,
    onBig: function () { resize(); },
    onSound: function (on) { if (on) { ensureAudio(); blip(660, 0.15, 0.08, "sine", 880); } }
  });

  var lastT = performance.now(), ariaAt = 0;
  function frame(t) {
    var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
    lastT = t;
    now = t / 1000;
    if (Toybox.timer.phase() !== "resting") {
      updateTape(dt);
      updateCombo(dt);
      updateLevel(dt);
      updateSquare(dt);
      updateCaliper(dt);
      updateFun(dt);
      updateCoach();
      if (PJ) updateProject(dt);
      if (Toybox.timer.phase() === "ending") endingFrame();
      draw();
      if (now - ariaAt > 1) { ariaAt = now; updateAria(); }
    }
    requestAnimationFrame(frame);
  }
  if (/[?&]debug=1/.test(location.search)) window.__ms = { S: S, T: T, C: C, L: L, Q: Q, K: K, PJ: PJ, PSTEP: PSTEP, hookPt: hookPt, km: km, sqEdge: sqEdge, sqGeom: sqGeom, levelEnds: levelEnds, itemPos: itemPos };
  requestAnimationFrame(frame);
})();
</script>
