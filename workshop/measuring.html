<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Measuring</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workshop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<script src="projects.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }
.stage { background: #C9A877; }
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
/* Panel: the options for the tool on the bench (choices), then the four tools as the tab bar. */
.tb-tabs .tool { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 64px; font-size: 1.15rem; overflow: hidden; }
.tool svg { flex: none; width: 58px; height: 44px; display: block; }
.opts { display: flex; gap: 8px; min-height: 52px; }
.optset { display: none; gap: 8px; flex: 1 1 auto; }
.optset.on { display: flex; }
.ob {
  flex: 1 1 0;
  min-height: 52px;
  min-width: 64px;
  padding: 0.1rem 0.8rem;
  font-size: 1.25rem;
  color: #1D2340;
  background: #FFFFFF;
  border-color: #1D2340;
  box-shadow: 3px 3px 0 #1D2340;
  white-space: nowrap;
}
.ob[aria-pressed="true"] { background: var(--accent); }
.ob.zero { background: #8FD694; min-width: 90px; }
/* Friendly hint at the top of the bench */
.prompt {
  position: absolute;
  left: 50%;
  top: 10px;
  z-index: 3;
  transform: translate(-50%, -12px) scale(0.92);
  width: max-content;
  max-width: calc(100% - 24px);
  background: #FFC93C;
  color: #1D2340;
  border: 4px solid #1D2340;
  border-radius: 22px;
  padding: 0.35rem 1.1rem;
  font-size: 1.45rem;
  font-weight: 800;
  line-height: 1.15;
  text-align: center;
  box-shadow: 4px 4px 0 #1D2340;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s cubic-bezier(.3,1.6,.5,1);
}
.prompt.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
/* Big: the tools stay so they can still be swapped; the header shrinks to the Big button. */
body.big .tb-head > :not(.bigtoggle) { display: none; }
body.ending .tb-panel,
body.ending .wallbtn { pointer-events: none; opacity: 0.4; }
body.ending .ob { pointer-events: none; }
.rest-art { width: min(60vw, 240px); }
@media (max-width: 600px), (orientation: landscape) and (max-height: 520px) {
  .tb-tabs .tool { flex-direction: column; gap: 0; min-height: 62px; font-size: 0.86rem; line-height: 1.05; padding: 0.1rem 0.15rem; }
  .tool svg { width: 42px; height: 30px; }
  .opts { min-height: 48px; }
  .ob { min-height: 48px; min-width: 52px; font-size: 1.1rem; padding: 0.1rem 0.55rem; }
  .prompt { font-size: 1.15rem; max-width: calc(100% - 24px); }
}
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(26%, 280px); }
  .opts { flex: 1 1 auto; flex-direction: column; }
  .optset { flex-direction: column; flex: none; }
  .tb-tabs { flex-wrap: wrap; }
  .tb-tabs .tool { flex: 1 1 40%; flex-direction: column; gap: 0; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: 184px; padding: 6px; gap: 6px; }
  .opts { flex: none; min-height: 40px; }
  .optset { flex-direction: row; flex-wrap: wrap; gap: 4px; }
  .tb-tabs { gap: 4px; }
  .tb-tabs .tool { min-height: 46px; font-size: 0.8rem; line-height: 1; padding: 2px; }
  .tool svg { width: 34px; height: 24px; }
  .ob { min-height: 38px; min-width: 44px; font-size: 0.95rem; padding: 0.05rem 0.4rem; }
}
/* Tape coach: one short line that names the next thing to measure. */
.mcoach {
  position: absolute;
  left: 50%;
  top: 10px;
  z-index: 2;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 150px);
  background: #FFFFFF;
  color: #1D2340;
  border: 4px solid #1D2340;
  border-radius: 22px;
  box-shadow: 4px 4px 0 #1D2340;
  padding: 0.2rem 1rem;
  font-size: 1.4rem;
  font-weight: 800;
  line-height: 1.15;
  text-align: center;
  pointer-events: none;
  transition: background-color 0.3s ease;
}
.mcoach.off { visibility: hidden; }
.mcoach.ok { background: #CDF5D0; }
.mcoach.flash { background: #FFE9A8; }
body.ending .mcoach { visibility: hidden; }
@media (max-width: 700px) {
  .mcoach { left: 10px; transform: none; max-width: calc(100% - 80px); font-size: 1.02rem; padding: 0.15rem 0.7rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .mcoach { left: 10px; transform: none; max-width: calc(100% - 80px); font-size: 1.05rem; padding: 0.1rem 0.8rem; }
}
@media (prefers-reduced-motion: reduce) {
  .prompt { transition: opacity 0.2s ease; }
}
/* ---------- Project mode (opened from a Workshop project plan with ?project=&step=) ----------
   For <= 12 in steps, the panel shows Tape and Combo so he can choose; for > 12 in (pj-long), the panel is hidden.
   A yellow step banner sits at the top with the coach pill centred under it. */
body.pj .opts { display: none; }
body.pj .toolbar [data-tool="level"],
body.pj .toolbar [data-tool="square"],
body.pj .toolbar [data-tool="caliper"] { display: none; }
body.pj-long .tb-panel { display: none; }
@media (orientation: landscape) {
  body.pj .tb-body .tb-panel { width: min(18%, 130px); justify-content: center; }
  body.pj .tb-tabs { flex-direction: column; flex: 1 1 auto; }
  body.pj .tb-tabs .tool { flex: 1 1 0; width: 100%; }
}
.pjstep {
  position: absolute;
  left: 50%;
  top: 10px;
  z-index: 3;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 24px);
  white-space: nowrap;
  overflow: hidden;
  background: #FFC93C;
  color: #1D2340;
  border: 4px solid #1D2340;
  border-radius: 22px;
  box-shadow: 4px 4px 0 #1D2340;
  padding: 0.2rem 1rem;
  font-size: 1.4rem;
  font-weight: 800;
  line-height: 1.15;
  text-align: center;
  pointer-events: none;
}
.pjstep[hidden] { display: none; }
body.pj .mcoach { left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); }
body.ending .pjstep { visibility: hidden; }
@media (max-width: 700px), (orientation: landscape) and (max-height: 520px) {
  .pjstep { font-size: 1.1rem; padding: 0.15rem 0.8rem; border-width: 3px; box-shadow: 3px 3px 0 #1D2340; }
}
.pjdone {
  position: absolute;
  left: 50%;
  bottom: 12px;
  z-index: 4;
  transform: translateX(-50%);
  width: min(calc(100% - 24px), 460px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  color: var(--ink);
  border: 4px solid var(--edge);
  border-radius: 24px;
  box-shadow: 5px 5px 0 var(--edge);
  padding: 12px 14px 14px;
  text-align: center;
  animation: pj-in 0.5s cubic-bezier(.3,1.4,.5,1) both;
}
.pjdone .pjdone-t { font-size: 2rem; font-weight: 800; line-height: 1.05; color: #2EA05A; }
.pjdone .pjdone-l { font-size: 1.25rem; font-weight: 800; line-height: 1.15; }
.pjdone .tb-go { width: 100%; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
@keyframes pj-in { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@media (orientation: landscape) and (max-height: 520px) {
  /* Short screens: the board fills the height, so the card takes the coach pill's place under the banner
     (the coach line is off once the step is done) and stays off the board. */
  .pjdone { top: var(--pj-top, 56px); bottom: auto; flex-direction: row; justify-content: space-between; width: min(calc(100% - 24px), 640px); padding: 6px 10px; gap: 10px; text-align: left; animation-name: pj-in-top; }
  .pjdone .pjdone-txt { display: flex; flex-direction: column; gap: 0; min-width: 0; }
  .pjdone .pjdone-t { font-size: 1.4rem; }
  .pjdone .pjdone-l { font-size: 1.05rem; }
  .pjdone .tb-go { width: auto; flex: none; min-height: 46px; font-size: 1.25rem; padding: 0 16px; }
}
@keyframes pj-in-top { from { transform: translate(-50%, -24px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pjdone { animation: none; } }
</style>
</head>
<body>
<div class="tb-app-shell wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back wallbtn" id="wallbtn" href="./" aria-label="Back to the Tool Wall"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Tool Wall</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Measuring</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the header">Big</button>
  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A tape measure on the workbench"></canvas>
      <div class="pjstep" id="pjstep" role="status" hidden></div>
      <div class="prompt" id="prompt" role="status" aria-live="polite"></div>
      <div class="mcoach off" id="mcoach" role="status" aria-live="polite">Pull the tape to the board!</div>
    </main>
    <section class="tb-panel">
        <div class="opts" id="opts">
      <div class="optset" data-for="tape">
        <button class="btn ob" data-unit="in" aria-pressed="true" aria-label="Inches">in</button>
        <button class="btn ob" data-unit="cm" aria-pressed="false" aria-label="Centimetres">cm</button>
      </div>
      <div class="optset" data-for="combosquare">
        <button class="btn ob" data-unit="in" aria-pressed="true" aria-label="Inches">in</button>
        <button class="btn ob" data-unit="cm" aria-pressed="false" aria-label="Centimetres">cm</button>
        <button class="btn ob clear tb-new">Clear</button>
      </div>
      <div class="optset" data-for="level">
      </div>
      <div class="optset" data-for="square">
        <button class="btn ob" data-sq="90" aria-pressed="true" aria-label="Mark along the 90 degree edge">90°</button>
        <button class="btn ob" data-sq="45" aria-pressed="false" aria-label="Mark along the 45 degree edge">45°</button>
        <button class="btn ob clear tb-new" id="clearBtn">Clear</button>
      </div>
      <div class="optset" data-for="caliper">
        <button class="btn ob zero" id="zeroBtn">Zero</button>
      </div>
    </div>
      <nav class="tb-tabs toolbar" id="toolbar" aria-label="Tools">
      <button class="btn tool" data-tool="tape" aria-pressed="true"><svg viewBox="0 0 58 44" aria-hidden="true"><path d="M30 27 H54 V33 H30 Z" fill="#FFE27A" stroke="#1D2340" stroke-width="2.5"/><path d="M36 27v3M42 27v4M48 27v3" stroke="#1D2340" stroke-width="1.8"/><rect x="52" y="24" width="4" height="12" rx="1" fill="#C98A2B" stroke="#1D2340" stroke-width="2"/><rect x="3" y="6" width="30" height="32" rx="10" fill="#FFC93C" stroke="#1D2340" stroke-width="3"/><circle cx="18" cy="22" r="7" fill="#26282E" stroke="#1D2340" stroke-width="2"/><rect x="8" y="3" width="12" height="6" rx="3" fill="#E63946" stroke="#1D2340" stroke-width="2.5"/></svg><span>Tape</span></button>
      <button class="btn tool" data-tool="combosquare" aria-pressed="false"><svg viewBox="0 0 58 44" aria-hidden="true"><rect x="3" y="13" width="52" height="9" rx="1.5" fill="#D5DBE2" stroke="#1D2340" stroke-width="2.5"/><line x1="8" y1="17.5" x2="50" y2="17.5" stroke="#1D2340" stroke-width="1.8" stroke-linecap="round"/><path d="M12 13v3M20 13v3.5M28 13v3M36 13v3.5M44 13v3M50 13v3" stroke="#1D2340" stroke-width="1.5"/><path d="M16 4 H30 V40 H24 L16 32 Z" fill="#5C7088" stroke="#1D2340" stroke-width="2.6" stroke-linejoin="round"/><rect x="20" y="25" width="7" height="11" rx="3.5" fill="#B9F04A" stroke="#1D2340" stroke-width="2"/><circle cx="23.5" cy="30.5" r="2" fill="#FFFFFF"/><circle cx="23" cy="8" r="3.5" fill="#E2B04A" stroke="#1D2340" stroke-width="2"/></svg><span>Combo</span></button>
      <button class="btn tool" data-tool="level" aria-pressed="false"><svg viewBox="0 0 58 44" aria-hidden="true"><rect x="2" y="14" width="54" height="16" rx="3" fill="#FFC93C" stroke="#1D2340" stroke-width="3"/><rect x="2" y="14" width="7" height="16" rx="2" fill="#26282E"/><rect x="49" y="14" width="7" height="16" rx="2" fill="#26282E"/><rect x="19" y="17" width="20" height="10" rx="5" fill="#B9F04A" stroke="#1D2340" stroke-width="2.5"/><ellipse cx="29" cy="22" rx="4" ry="3" fill="#FFFFFF"/></svg><span>Level</span></button>
      <button class="btn tool" data-tool="square" aria-pressed="false"><svg viewBox="0 0 58 44" aria-hidden="true"><path d="M10 6 H50 L10 40 Z" fill="#C7D0DA" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><path d="M17 13 H36 L17 29 Z" fill="#C9A877" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="6" y="3" width="46" height="6" rx="2" fill="#9AA6B4" stroke="#1D2340" stroke-width="2.5"/></svg><span>Square</span></button>
      <button class="btn tool" data-tool="caliper" aria-pressed="false"><svg viewBox="0 0 58 44" aria-hidden="true"><rect x="2" y="12" width="54" height="6" fill="#D5DBE2" stroke="#1D2340" stroke-width="2.5"/><path d="M4 18 H11 V36 L8 41 H6 L4 33 Z" fill="#C7D0DA" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><path d="M20 18 H27 V33 L25 41 H23 L20 36 Z" fill="#C7D0DA" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="20" y="4" width="26" height="20" rx="3" fill="#B6BDC7" stroke="#1D2340" stroke-width="2.5"/><rect x="24" y="7" width="18" height="9" rx="1.5" fill="#C9E3B0" stroke="#1D2340" stroke-width="2"/></svg><span>Caliper</span></button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- The safety-gear check ----------
  var gearOn = true;
  try { gearOn = sessionStorage.getItem("workshop-gear") === "on"; } catch (e) { gearOn = true; }
  if (!gearOn) {
    // A project step (a plan sent us here): gear up through the plan page, which keeps the step.
    var projArg = (location.search.match(/[?&]project=([a-z0-9-]+)/) || [])[1];
    if (projArg) { location.replace("project.html?project=" + projArg); return; }
    var toolArg = (location.search.match(/[?&]tool=([a-z]+)/) || [])[1];
    location.replace("./?next=measuring" + (toolArg ? "&tool=" + toolArg : ""));
    return;
  }

  var OUT = "#1D2340";
  var SKEY = "workshop-measuring-v1";
  var TOOLS = ["tape", "combosquare", "level", "square", "caliper"];
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var FONT = "\"Baloo 2\", \"Trebuchet MS\", sans-serif";
  var DEG = Math.PI / 180;

  // ---------- Project mode: one "mark" step of a Workshop project (see projects.js) ----------
  // Opened as measuring.html?project=<id>&step=<stepId>. The bench holds only the project board, the tape or
  // combination square reads inches in halves, and the step ends with a "Done!" card that leads back to the plan.
  // Nothing here touches the saved free-play state. PJ is null in normal play.
  var PSTEP = window.ToyboxProjects ? ToyboxProjects.fromQuery() : null;
  if (PSTEP && !(PSTEP.job && PSTEP.job.kind === "mark" && PSTEP.job.board)) PSTEP = null;
  var pjInitTool = (PSTEP && PSTEP.tool === "combosquare" && PSTEP.job.target <= 12) ? "combosquare" : "tape";
  var PJ = PSTEP ? {
    tool: pjInitTool,         // "tape" or "combosquare"
    phase: pjInitTool === "combosquare" ? "combo" : "tape", // tape|combo -> tick -> square | x -> done
    target: PSTEP.job.target, // inches from the board's left end
    mark: PSTEP.job.mark,     // "line": a square line across the board; "x": an X for the entrance hole
    board: null,              // the one thing on the bench (also T.objs[0])
    comboIn: 1.5, comboD: 0, comboHeld: false, knobLock: 0, lastHalf: 3, // combination square head along the 12-in rule
    tickX: 0, tick: 0,        // the pencil tick: x in px, draw progress 0..1
    onTarget: false, misses: 0,
    onTick: false, cover: null, lineT: 0, sqIn: 0, sqOff: 1.2, sqAway: 0,  // the square phase (sqAway: glide off the line once drawn)
    xT: 0,                    // the X: two strokes, 0..2
    wait: 0, msg: null, card: null, href: null, finished: false
  } : null;
  if (PJ) {
    document.body.classList.add("pj");
    if (PJ.target > 12) document.body.classList.add("pj-long");
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  var $ = function (id) { return document.getElementById(id); };
  function seeded(seed) {
    var s = (seed >>> 0) || 1;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

  // ---------- Saved state ----------
  function freshState() {
    return { tool: PJ ? PJ.tool : "tape", unit: "in", sq: 90, sqF: 0.25, comboF: 0.5, flip: false, lines: [], item: null, zero: 0, gap: 30, boardA: 6 };
  }
  function loadState() {
    var s = freshState();
    try {
      var o = JSON.parse(localStorage.getItem(SKEY) || "null");
      if (!o || typeof o !== "object") return s;
      if (TOOLS.indexOf(o.tool) !== -1) s.tool = o.tool;
      if (o.unit === "cm") s.unit = "cm";
      if (o.sq === 45) s.sq = 45;
      if (typeof o.sqF === "number" && isFinite(o.sqF)) s.sqF = clamp(o.sqF, 0, 1);
      if (typeof o.comboF === "number" && isFinite(o.comboF)) s.comboF = clamp(o.comboF, 0, 1);
      s.flip = !!o.flip;
      if (Array.isArray(o.lines)) s.lines = o.lines.filter(function (l) { return l && [l.x0, l.y0, l.x1, l.y1].every(function (v) { return typeof v === "number" && isFinite(v); }); }).slice(-80);
      if (o.item && ITEMS[o.item]) s.item = o.item;
      if (typeof o.zero === "number" && isFinite(o.zero)) s.zero = clamp(o.zero, 0, GMAX);
      if (typeof o.gap === "number" && isFinite(o.gap)) s.gap = clamp(o.gap, 0, GMAX);
      if (typeof o.boardA === "number" && isFinite(o.boardA)) s.boardA = clamp(o.boardA, -15, 15);
    } catch (e) { /* ignore */ }
    if (s.item && s.gap < ITEMS[s.item].w) s.gap = ITEMS[s.item].w;
    return s;
  }
  var saveTimer = null;
  function save() {

  // Caliper parts (mm): w = the size the jaws measure.

    snap: null, shown: 0, live: false, bump: 0, burst: [], lastIn: 0, maxIn: 25, caseFly: null, home: null,
    // Coaching: which thing to measure next, the happy result line, the ghost hand

  };
  // Combination square (free play)

  // Spirit level
  var L = { pv: { x: 0, y: 0 }, lb: 400, tb: 24, ll: 320, hl: 70, wh: 100, amax: 12, a: S.boardA, bub: [], wasLevel: false, glow: 0, sparks: [], aT: null };
  // Speed square
  var Q = { bx: 0, by: 0, bw: 300, bh: 200, sl: 160, lip: 14, xd: 0, flipT: S.flip ? 1 : 0, live: null, clearT: 0, edgeFlash: 0, clack: 0 };
  // Caliper
  var K = { k: 4, ox: 0, oy: 0, gd: S.gap, contact: 0, zeroFlash: 0, trayY: 0, trayH: 0, slots: {}, fly: {}, bubble: false, wasTouch: false };

  var now = 0;

  function layout() {
    U = Math.min(CW, CH);
    PAD = U < 500 ? 8 : 14;
    OPTH = 4;  // the options moved out of the stage into the panel
    layoutTape();
    layoutCombo();
    layoutLevel();

  }

  // The step banner: one line that must fit the stage width (shrink the font rather than wrap or cut).
  function fitBanner() {
    var el = $("pjstep");
    if (!PJ || el.hidden) return;
    var small = window.matchMedia && (matchMedia("(max-width: 700px)").matches || matchMedia("(orientation: landscape) and (max-height: 520px)").matches);
    var size = small ? 17.6 : 22.4;
    el.style.fontSize = size + "px";
    while (el.scrollWidth > el.clientWidth + 1 && size > 11) { size -= 1; el.style.fontSize = size + "px"; }
  }
  // Project mode: the project board alone, lying with its left end at the tape hook (or under the 12-inch
  // combination square rule).
  function layoutProject() {
    fitBanner();
    var isCombo = PJ.tool === "combosquare";
    var cs = clamp(U * 0.2, 74, 150);
    var xL = isCombo ? PAD + Math.max(24, Math.round(cs * 0.32)) : PAD + cs + 12;
    var bannerH = $("pjstep").offsetHeight || 0;
    $("mcoach").style.top = (10 + bannerH + 8) + "px";
    $("stage").style.setProperty("--pj-top", (10 + bannerH + 6) + "px");  // short screens: the Done card goes here
    var top = 10 + bannerH + 8 + ($("mcoach").offsetHeight || 0) + 12;
    var w = PSTEP.job.board.w, l = PSTEP.job.board.l;
    var visIn = Math.max(isCombo ? 13.2 : 10, PJ.target * 1.35, PJ.target + 6);
    var ppi = Math.max(3, Math.min((CW - xL - 10) / visIn, (CH - top - 50) / (w * 1.25)));
    var h = Math.max(w * ppi, 40);
    var sl = Math.max(h * 1.15, 64);
    var lip = clamp(sl * 0.09, 10, 26);
    var cyMin = top + (sl - h) + h / 2 + 8, cyMax = CH - 22 - lip - h / 2;
    var cy = cyMax < cyMin ? cyMin : clamp(CH * 0.52, cyMin, cyMax);
    var o = { id: "board", len: l, w: w, x0: xL, x1: xL + l * ppi, h: h, cy: cy };
    T.ppi = ppi; T.cs = cs; T.objs = [o]; T.F = clamp(U * 0.085, 30, 66);
    T.bw = clamp(ppi * 0.95, 24, 58);
    T.maxIn = l;
    T.home = { x: o.x0 - cs / 2, y: o.cy };
    T.c.x = T.home.x; T.c.y = T.home.y; T.a = 0; T.caseFly = null;
    T.d = 0; T.zip = false;
    PJ.board = o; PJ.tickX = o.x0 + PJ.target * ppi;
    PJ.comboD = PJ.comboIn * ppi;
    // The speed square (or upright combination square) rides the project board's near (bottom) edge.
    Q.bx = o.x0; Q.by = o.cy - h / 2; Q.bw = o.x1 - o.x0; Q.bh = h; Q.sl = sl; Q.lip = lip; Q.flipT = 1;
    if (PJ.lineT > 0) Q.xd = PJ.tickX + easeIO(PJ.sqAway) * 1.5 * ppi;
    else Q.xd = PJ.onTick ? PJ.tickX : clamp(PJ.tickX + PJ.sqOff * ppi, o.x0, Math.min(o.x1 - ppi * 0.3, CW - sl * 0.3));
  }

  function layoutCombo() {
    if (PJ) return;
    C.F = clamp(U * 0.085, 30, 60);
    var topSpace = PAD + C.F * 1.45 + 18;
    var ppi = Math.max(12, Math.min((CW - 2 * PAD - 76) / 12, (CH - OPTH - topSpace - PAD - 20) / 4.8));
    C.ppi = ppi;
    C.rw = clamp(ppi * 0.78, 22, 42);
    C.headW = clamp(C.rw * 1.65, 42, 74);
    C.bw = 12 * ppi;
    C.bh = clamp(ppi * 4.4, 110, Math.max(120, CH - OPTH - topSpace - PAD - 12));
    C.bx = Math.max(PAD + 14, (CW - C.bw - C.headW * 0.7) / 2);
    C.by = Math.max(topSpace, (CH - OPTH + topSpace - C.bh) / 2);
  }

  function layoutTape() {
    if (PJ) { layoutProject(); return; }
    var cs = clamp(U * 0.2, 74, 170);
    var availW = CW - 2 * PAD - cs - 12;
    var boardIn = availW / 12.6 >= 30 ? 12 : 9;
    var ppi = Math.min(U / 13, availW / (boardIn + 0.6));
    var objs = [
      { id: "board", len: boardIn, w: 3.5 },
      { id: "pencil", len: 7, w: 0.42 },
      { id: "car", len: 4, w: 1.9 },
      { id: "block", len: 2, w: 2 }
    ];
    var F = clamp(U * 0.085, 30, 66);
    var coachH = $("mcoach").offsetHeight || 0;
    var top = PAD + (coachH ? coachH + 8 : 0) + F * 1.7 + 14, bot = CH - OPTH - 8;
    var hs = objs.map(function (o) { return Math.max(o.w * ppi, 18); });
    var sum = hs.reduce(function (a, b) { return a + b; }, 0);
    var avail = bot - top;
    if (sum > avail * 0.85) { ppi *= avail * 0.85 / sum; hs = objs.map(function (o) { return Math.max(o.w * ppi, 16); }); sum = hs.reduce(function (a, b) { return a + b; }, 0); }
    var gap = Math.min((avail - sum) / (objs.length + 1), ppi * 2.6);
    var y = top + (avail - sum - gap * (objs.length - 1)) / 2;
    // the case and the longest thing sit in the middle of the board (spare width split both sides)
    var xL = PAD + cs + 12 + Math.max(0, (availW - (boardIn + 0.6) * ppi) / 2);
    objs.forEach(function (o, i) {
      o.x0 = xL; o.x1 = xL + o.len * ppi; o.h = hs[i];
      o.cy = y + hs[i] / 2;
      y += hs[i] + gap;
    });
    T.ppi = ppi; T.cs = cs; T.objs = objs; T.F = F;
    T.bw = clamp(ppi * 0.95, 24, 58);
    T.maxIn = Math.max(14, Math.floor((Math.hypot(CW, CH) - cs) / ppi));
    var g0 = objs[T.goal % objs.length];
    T.home = { x: g0.x0 - cs / 2, y: g0.cy };
    T.c.x = T.home.x; T.c.y = T.home.y; T.a = 0; T.caseFly = null;
    T.d = 0; T.zip = false;
  }
  function layoutLevel() {
    L.lb = Math.min(CW - 2 * PAD - 60, U * 1.45);
    L.tb = clamp(U * 0.045, 16, 34);
    L.ll = L.lb * 0.8;
    L.hl = clamp(L.lb * 0.11, 40, 104);
    L.wh = clamp(U * 0.2, 70, 200);
    L.pv = { x: CW / 2, y: Math.min(CH - OPTH - L.wh, CH * 0.62) };
    L.amax = Math.min(15, Math.asin(Math.min(0.99, (L.wh * 0.85) / (L.lb / 2))) / DEG);
    L.a = clamp(L.a, -L.amax, L.amax);
    L.F = clamp(U * 0.1, 34, 80);
    if (!L.bub.length) for (var i = 0; i < 3; i++) L.bub.push({ p: 0, v: 0 });
  }
  function layoutSquare() {
    if (PJ) return;  // the square rides the project board (layoutProject)
    Q.bx = PAD + 16; Q.bw = CW - 2 * Q.bx;
    var maxH = (CH - OPTH - 2 * PAD - 20) / 1.25;
    Q.bh = clamp(Math.min(maxH, U * 0.55), 110, 420);
    Q.by = Math.max(PAD + Q.bh * 0.12 + 20, (CH - OPTH) / 2 - Q.bh / 2 + 10);
    Q.sl = Math.min(Q.bh * 0.88, Q.bw * 0.5);
    Q.lip = clamp(Q.sl * 0.09, 10, 26);

  }
  function sqX() { return Q.bx + S.sqF * (Q.bw - Q.sl); }
  function layoutCaliper() {
    var wide = CW / CH > 1.35;
    K.wide = wide;
    K.BF = clamp(U * 0.1, 34, 64);
    function fit(topSpace) {
      if (wide) return Math.min((CW * 0.7 - 2 * PAD) / 122, (CH - 2 * PAD - topSpace) / 80);
      return Math.min((CW - 2 * PAD - 8) / 122, (CH - OPTH - 2 * PAD - 6 - topSpace) / 125);
    }

    var topSpace = K.bubble ? K.BF * 1.5 + 16 : 6;
    if (K.bubble) k = fit(topSpace);
    K.k = k;
    // wide: keep the fixed jaw clear of the Zero button in the bottom-left corner
    K.ox = wide ? Math.max(PAD + 26 * k, (U < 500 ? 118 : 130) + 17 * k) : CW / 2 - 37 * k;
    K.oy = PAD + topSpace + 26 * k;
    var tr;
    if (wide) {
      var tx = K.ox + 100 * k;
      tr = { x: tx, y: PAD + 66, w: CW - PAD - 6 - tx, h: CH - 2 * PAD - 72 };
    } else {
      var ty = K.oy + 56 * k;
      tr = { x: PAD + 4, y: ty, w: CW - 2 * PAD - 8, h: Math.max(40, CH - OPTH - 6 - ty) };
    }
    K.tray = tr;
    var cols = wide ? 2 : 4, rows = wide ? 2 : 1;
    ITEM_ORDER.forEach(function (id, i) {
      var cx = i % cols, cy = Math.floor(i / cols);
      K.slots[id] = { x: tr.x + tr.w * (cx + 0.5) / cols, y: tr.y + tr.h * (cy + 0.5) / rows };
    });
  }
  function resize() {
    var r = cv.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    CW = Math.max(100, r.width); CH = Math.max(100, r.height);
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
    layout();
    buildBg();
  }

  // ---------- Drawing helpers ----------
  function rr(c, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function fs(c, fill, lw, stroke) {
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (lw) { c.lineWidth = lw; c.strokeStyle = stroke || OUT; c.stroke(); }
  }
  function poly(c, pts) {
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.closePath();
  }
  function lgrad(c, x0, y0, x1, y1, stops) {
    var g = c.createLinearGradient(x0, y0, x1, y1);
    stops.forEach(function (s) { g.addColorStop(s[0], s[1]); });
    return g;
  }
  function font(size, weight) { return (weight || 800) + " " + Math.round(size) + "px " + FONT; }
  function text(c, t, x, y, size, color, align, weight) {
    c.font = font(size, weight);
    c.textAlign = align || "center";
    c.textBaseline = "middle";
    c.fillStyle = color || OUT;
    c.fillText(t, x, y);
  }
  // A big readout bubble with a little tail pointing at (tx, ty).
  function readout(c, msg, x, y, size, glow, tx, ty) {
    c.font = font(size);
    var w = c.measureText(msg).width + size * 0.9, h = size * 1.3;
    x = clamp(x, w / 2 + 6, CW - w / 2 - 6);
    y = clamp(y, h / 2 + 6, CH - h / 2 - 6);
    c.save();
    if (glow > 0) { c.shadowColor = "rgba(120,255,140," + (0.9 * glow) + ")"; c.shadowBlur = 26 * glow; }
    if (tx !== undefined) {
      var up = ty < y;
      var by = up ? y - h / 2 + 2 : y + h / 2 - 2;
      var bx = clamp(tx, x - w / 2 + 18, x + w / 2 - 18);
      c.beginPath();
      c.moveTo(bx - 12, by); c.lineTo(clamp(tx, bx - 30, bx + 30), up ? Math.max(ty, by - 26) : Math.min(ty, by + 26)); c.lineTo(bx + 12, by);
      c.closePath();
      fs(c, glow > 0.5 ? "#CDF5D0" : "#FFFFFF", 4);
    }
    rr(c, x - w / 2, y - h / 2, w, h, h * 0.4);
    fs(c, glow > 0.5 ? "#CDF5D0" : "#FFFFFF", 4);
    c.restore();
    if (tx !== undefined) {
      // cover the tail's join line
      c.fillStyle = glow > 0.5 ? "#CDF5D0" : "#FFFFFF";
      var up2 = ty < y;
      c.fillRect(clamp(tx, x - w / 2 + 18, x + w / 2 - 18) - 9, up2 ? y - h / 2 + 1 : y + h / 2 - 5, 18, 4);
    }
    text(c, msg, x, y + size * 0.04, size, OUT);
  }

  // ---------- The workbench (cached) ----------
  function buildBg() {
    bgCanvas.width = cv.width; bgCanvas.height = cv.height;
    var c = bgCanvas.getContext("2d");
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    var r = seeded(7);
    var ph = clamp(U * 0.2, 70, 170);
    var tones = ["#D9B07A", "#CFA36B", "#DDB683", "#C99C64"];
    for (var y = 0, i = 0; y < CH; y += ph, i++) {
      c.fillStyle = tones[i % tones.length];
      c.fillRect(0, y, CW, ph);
      c.strokeStyle = "rgba(120,78,34,0.22)";
      c.lineWidth = 1.5;
      for (var g = 0; g < 6; g++) {
        var gy = y + r() * ph;
        c.beginPath();
        c.moveTo(0, gy);
        for (var x = 0; x <= CW; x += 60) c.lineTo(x, gy + Math.sin(x / 90 + g + i) * 3 + (r() - 0.5) * 2);
        c.stroke();
      }
      c.fillStyle = "rgba(90,55,20,0.35)";
      c.fillRect(0, y + ph - 3, CW, 3);
      // a knot or two
      if (r() < 0.7) {
        var kx = r() * CW, ky = y + ph * (0.3 + r() * 0.4);
        c.beginPath(); c.ellipse(kx, ky, 14, 6, 0, 0, Math.PI * 2);
        c.fillStyle = "rgba(120,78,34,0.28)"; c.fill();
      }
    }
  }

  // ---------- Sound (off by default; soft synthesized) ----------
  var AC = null, master = null, noiseBuf = null;
  function ensureAudio() {
    var a = Toybox.sound.ready();
    if (!a || a === AC) return;
    try {
      master = a.createGain(); master.gain.value = 0.7; master.connect(a.destination);
      noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.6), a.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      AC = a;
    } catch (e) { /* audio unavailable */ }
  }
  function blip(freq, dur, vol, type, freq2) {
    ensureAudio();
    if (!Toybox.sound.on() || !AC || Toybox.timer.phase() === "resting") return;
    try {
      var t = AC.currentTime;
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t);
      if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* ignore */ }
  }
  function whoosh(dur, f0, f1, vol) {
    ensureAudio();
    if (!Toybox.sound.on() || !AC || !noiseBuf) return;
    try {
      var t = AC.currentTime;
      var src = AC.createBufferSource(); src.buffer = noiseBuf;
      var f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 2;
      f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      var g = AC.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.05);
    } catch (e) { /* ignore */ }
  }
  function chime() { blip(660, 0.25, 0.07, "sine", 660); setTimeout(function () { blip(990, 0.35, 0.06, "sine", 990); }, 110); }

  // ---------- Hints ----------
  var promptTimer = null;
  function say(msg) {
    if (PJ) { pjSay(msg, "flash", 3); return; }
    if (S.tool === "tape") { T.msg = { text: msg, until: now + 3.5, flash: true }; return; }
    var el = $("prompt");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(promptTimer);
    promptTimer = setTimeout(function () { el.classList.remove("show"); }, 3500);
  }
  function busy() { return Toybox.timer.locked(); }

  // =====================================================================
  // TAPE MEASURE
  // =====================================================================
  function tapeDir() { return { x: Math.cos(T.a), y: Math.sin(T.a) }; }
  function mouth() { var d = tapeDir(); return { x: T.c.x + d.x * T.cs / 2, y: T.c.y + d.y * T.cs / 2 }; }
  function hookPt() { var m = mouth(), d = tapeDir(); return { x: m.x + d.x * T.d, y: m.y + d.y * T.d }; }
  // Whole inches (or cm) in free play; a project step reads inches in halves ("7.5").
  function tapeValue(len) {
    if (PJ) return Math.round(len / T.ppi * 2) / 2;
    return S.unit === "cm" ? Math.round(len / T.ppi * 2.54) : Math.round(len / T.ppi);
  }
  function tapeText(v) { return (PJ ? ToyboxProjects.fmt(v) : v) + (S.unit === "cm" ? " cm" : " in"); }
  // Project mode: the tape runs straight along the board. Near the target the hook sticks softly (it eases
  // onto the exact number in updateTape); after two misses the magnet reaches a whole inch.
  // Gesture gain for the project tape: the step's length takes at most about 170 px of finger.
  function pjTapeGain() { return PJ ? Math.max(1, PJ.target * T.ppi / 170) : 1; }
  function setHookPJ(hx) {
    var m = mouth();
    var maxD = Math.min(PJ.board.x1 - m.x, CW - 6 - m.x);
    var tx = PJ.target * T.ppi;
    // The finger is geared (pjTapeGain, in tapeMove), so the magnet zone grows with it; the hook still eases
    // onto the exact number, so the reading stays exact.
    var gk = pjTapeGain();
    var d = clamp(hx - m.x, 0, maxD);
    var zone = (PJ.misses >= 2 ? Math.max(T.ppi, 40) : Math.max(0.25 * T.ppi, 14)) * Math.max(1, gk * 0.6);
    var was = PJ.onTarget;
    PJ.onTarget = Math.abs(d - tx) < (was ? zone * 1.4 : zone);
    T.a = 0;
    if (!PJ.onTarget) T.d = d;
    else if (!was) { PJ.msg = null; blip(1200, 0.06, 0.05, "triangle", 1500); }  // the coach says "Let go!" now
  }
  // Put the hook at (hx, hy): the case turns to face it and the blade runs out.
  function setHook(hx, hy) {
    if (PJ) { setHookPJ(hx); return; }
    hx = clamp(hx, 4, CW - 4); hy = clamp(hy, 4, CH - 4);
    var dx = hx - T.c.x, dy = hy - T.c.y, r = Math.hypot(dx, dy);
    if (r < T.cs / 2 + 2) { T.d = 0; return; }
    T.a = Math.atan2(dy, dx);
    T.d = Math.min(r - T.cs / 2, T.maxIn * T.ppi);
    // Snap the hook onto the far end of an object when the tape runs along it: near the end, or (so the big
    // iPad bench needs no long reach) as soon as the tape has been pulled a short way along the object.
    // The reading is the object's exact length either way.
    T.snap = null;
    var sr = Math.max(26, T.ppi * 0.45), h = hookPt();
    for (var i = 0; i < T.objs.length; i++) {
      var o = T.objs[i];
      var a2 = Math.atan2(o.cy - T.c.y, o.x1 - T.c.x);

    card.querySelector(".pjdone-l").textContent = PSTEP.done;
    var a = card.querySelector("a");
    a.textContent = "Back to the plan";
    a.href = PJ.href;
    $("stage").appendChild(card);
    PJ.card = card;
    chime();
    updateAria(true);
  }
  // Called every frame in project mode: the marks that draw themselves and the calm pauses between phases.
  function updateProject(dt) {
    PJ.knobLock = Math.max(0, PJ.knobLock - dt * 2.2);
    if (PJ.phase === "combo" && PJ.comboHeld && PJ.onTarget) {
      PJ.comboD = lerp(PJ.comboD, PJ.target * T.ppi, Math.min(1, dt * 14));
      PJ.comboIn = PJ.comboD / T.ppi;
    }
    if (PJ.tick > 0 && PJ.tick < 1) PJ.tick = reduce ? 1 : Math.min(1, PJ.tick + dt / 0.6);
    if (PJ.phase === "tick") {
      var settledTool = PJ.tool === "combosquare" ? true : (!T.zip && T.d <= 0);
      if (settledTool && PJ.tick >= 1 && !busy()) { PJ.wait -= dt; if (PJ.wait <= 0) startPhaseB(); }
    } else if (PJ.phase === "square") {
      if (PJ.sqIn < 1) PJ.sqIn = Math.min(1, PJ.sqIn + dt / 0.5);
      if (PJ.lineT === 0 && PJ.onTick && Math.abs(Q.xd - PJ.tickX) > 0.1) Q.xd = lerp(Q.xd, PJ.tickX, Math.min(1, dt * 12));
      if (PJ.lineT > 0 && PJ.lineT < 1) PJ.lineT = reduce ? 1 : Math.min(1, PJ.lineT + dt / 0.8);
      else if (PJ.lineT >= 1 && !busy()) { PJ.wait -= dt; if (PJ.wait <= 0) finishJob(); }
    } else if (PJ.phase === "x") {
      if (PJ.xT < 2) PJ.xT = Math.min(2, PJ.xT + dt / 0.7);
      else if (!busy()) { PJ.wait -= dt; if (PJ.wait <= 0) finishJob(); }
    }
    // once the line is drawn the square glides a little to the right, so the line shows (also under the card)
    if (PJ.mark === "line" && PJ.lineT >= 1 && PJ.sqAway < 1) {
      PJ.sqAway = reduce ? 1 : Math.min(1, PJ.sqAway + dt / 0.9);
      Q.xd = PJ.tickX + easeIO(PJ.sqAway) * 1.5 * T.ppi;
    }
    pjCoach();
  }
  // The idle hand shows the current move: pull the hook, slide the square, draw along its edge.
  if (PJ) makeIdleGhost(function () {
    if (busy() || Object.keys(drags).length || PJ.card || T.zip) return null;
    var cr = cv.getBoundingClientRect();
    function scr(x, y) { return [cr.left + x, cr.top + y]; }
    if (PJ.phase === "combo") {
      var ry = pjRuleY(), hx = PJ.board.x0 + PJ.comboD;
      return { pts: [scr(hx + 20, ry), scr(hx + 20 + (PJ.tickX - hx) / pjTapeGain(), ry)], duration: 3800 };
    }
    if (PJ.phase === "tape") {
      var h = hookPt();
      var tk = pjTapeGain();   // the geared tape: a shorter finger move
      return { pts: [scr(h.x, h.y), scr(h.x + (PJ.tickX - h.x) / tk, h.y)], duration: 3800 };
    }
    if (PJ.phase === "square" && PJ.lineT === 0 && PJ.sqIn >= 1) {
      var G = sqGeom();
      if (!PJ.onTick) {
        var gx = G.corner.x + Q.sl * 0.3, gy = G.ey - Q.sl * 0.2;
        return { pts: [scr(gx, gy), scr(gx - (Q.xd - PJ.tickX), gy)] };
      }
      var e = sqEdge(), tb = Q.bh / Q.sl;
      return { pts: [scr(e.a.x - 4, e.a.y), scr(lerp(e.a.x, e.b.x, tb) - 4, lerp(e.a.y, e.b.y, tb))] };
    }
    return null;
  }, { max: 3 });

  var HINTS = { tape: "Pull the hook out!", combosquare: "Slide the square or draw a line!", level: "Make the bubble sit in the middle", square: "Draw along the red edge", caliper: "Put a part in the jaws" };
  function setTool(t, quiet) {
    if (TOOLS.indexOf(t) === -1) return;
    if (PJ) {
      if (PJ.finished || PJ.card) return;
      if (t !== "tape" && t !== "combosquare") return;
      if (t === "combosquare" && PJ.target > 12) return;
      releaseAll();
      PJ.tool = t;
      S.tool = t;
      PJ.phase = t === "combosquare" ? "combo" : "tape";
      PJ.onTarget = false; PJ.onTick = false; PJ.tick = 0; PJ.lineT = 0; PJ.xT = 0;
      PJ.cover = null; PJ.sqIn = 0; PJ.sqAway = 0; PJ.msg = null; PJ.knobLock = 0;
      PJ.comboIn = 1.5; PJ.comboHeld = false;
      T.d = 0; T.zip = false; T.hookHeld = false; T.shown = 0;
      S.lines = []; Q.live = null; C.live = null;
      Array.prototype.forEach.call(document.querySelectorAll("[data-tool]"), function (b) { b.setAttribute("aria-pressed", String(b.dataset.tool === t)); });
      if (!quiet) blip(560, 0.08, 0.06, "triangle", 840);
      T.lastTouch = now; T.coachKey = "";
      layoutProject();
      pjCoach();
      updateAria(true);
      return;
    }
    if (t !== S.tool) releaseAll();
    S.tool = t;
    Array.prototype.forEach.call(document.querySelectorAll("[data-tool]"), function (b) { b.setAttribute("aria-pressed", String(b.dataset.tool === t)); });
    Array.prototype.forEach.call(document.querySelectorAll(".optset"), function (o) { o.classList.toggle("on", o.dataset.for === t); });
    if (!quiet) { blip(560, 0.08, 0.06, "triangle", 840); if (t !== "tape") say(HINTS[t]); save(); }
    T.lastTouch = now; T.coachKey = "";
    $("mcoach").classList.toggle("off", t !== "tape");
    updateOpts();
    updateAria(true);
  }
  function updateOpts() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-unit]"), function (b) { b.setAttribute("aria-pressed", String(b.dataset.unit === S.unit)); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-sq]"), function (b) { b.setAttribute("aria-pressed", String(+b.dataset.sq === S.sq)); });
  }
  $("toolbar").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || busy()) return;
    ensureAudio();
    setTool(b.dataset.tool);
  });
  $("opts").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || busy()) return;
    ensureAudio();
    if (b.dataset.unit) {
      if (S.unit !== b.dataset.unit) { S.unit = b.dataset.unit; T.shown = S.unit === "cm" ? Math.round(T.shown * 2.54) : Math.round(T.shown / 2.54); blip(700, 0.06, 0.05, "triangle", 900); }
    } else if (b.dataset.sq) {
      S.sq = +b.dataset.sq; Q.edgeFlash = 1; blip(S.sq === 45 ? 880 : 660, 0.06, 0.05, "triangle");
    } else if (b.id === "clearBtn" || b.classList.contains("clear")) clearLines();
    else if (b.id === "zeroBtn") doZero();
    updateOpts();
    save();
  });

  // ---------- Play timer hooks (the shared Toybox timer: it keeps going on every Workshop page) ----------
  // Ending: the tape zips back, the board on the level settles flat, then done().
  var endingDone = null;
  function onEnding(done) {
    endingDone = done;
    releaseAll();
    if (T.d > 1 && !T.zip) { T.hookHeld = false; T.zip = true; T.zv = 200; T.shown = tapeValue(T.d); whoosh(0.45, 2200, 500, 0.05); }
    L.aT = 0;
    Q.live = null;
    C.live = null;
    if (PJ) PJ.comboHeld = false;
  }
  function goodbye() {
    if (T.d > 1 && !T.zip) { T.zip = true; T.zv = 200; }
    L.aT = 0;
    chime();
  }
  function settled() {
    var bubOk = L.bub.every(function (b) { return Math.abs(b.v) < 0.05; });
    var flying = Object.keys(K.fly).length > 0;
    return !T.zip && T.d < 1 && L.aT === null && Math.abs(L.a) < 0.1 && bubOk && !flying && T.bump < 0.05;
  }
  function endingFrame() {
    if (endingDone && settled()) { S.boardA = 0; save(); endingDone(); endingDone = null; }
  }
  function onRest() { endingDone = null; T.d = 0; T.zip = false; }
  function onWake() { endingDone = null; }
  function restArt() {
    // A toolbox with the measuring tools put away on top
    return '<svg class="rest-art" viewBox="0 0 240 200" aria-hidden="true">' +
      '<rect x="10" y="172" width="220" height="14" rx="4" fill="#D99A55" stroke="#1D2340" stroke-width="4"/>' +
      '<path d="M84 96 V80 Q84 70 94 70 H146 Q156 70 156 80 V96" fill="none" stroke="#1D2340" stroke-width="7" stroke-linecap="round"/>' +
      '<rect x="34" y="96" width="172" height="76" rx="10" fill="#E63946" stroke="#1D2340" stroke-width="4"/>' +
      '<rect x="34" y="96" width="172" height="20" rx="8" fill="#F06A74" stroke="#1D2340" stroke-width="4"/>' +
      '<rect x="108" y="122" width="24" height="12" rx="3" fill="#C8CDD6" stroke="#1D2340" stroke-width="3"/>' +
      '<rect x="44" y="60" width="34" height="36" rx="10" fill="#FFC93C" stroke="#1D2340" stroke-width="4"/>' +
      '<circle cx="61" cy="78" r="7" fill="#2E3138"/>' +
      '<rect x="76" y="86" width="8" height="10" rx="2" fill="#E2B04A" stroke="#1D2340" stroke-width="3"/>' +
      '<rect x="150" y="84" width="74" height="14" rx="3" fill="#FFC93C" stroke="#1D2340" stroke-width="4" transform="rotate(-8 187 91)"/>' +
      '<rect x="178" y="85" width="18" height="9" rx="4.5" fill="#B9F04A" stroke="#1D2340" stroke-width="2.5" transform="rotate(-8 187 91)"/>' +
      '<path d="M196 30 q8 -8 16 0 M202 18 q6 -6 12 0" fill="none" stroke="#2D5BD7" stroke-width="3" stroke-linecap="round"/>' +
      '<text x="206" y="46" font-family="Baloo 2, sans-serif" font-weight="800" font-size="18" fill="#2D5BD7">z</text>' +
      '<text x="220" y="32" font-family="Baloo 2, sans-serif" font-weight="800" font-size="14" fill="#2D5BD7">z</text></svg>';
  }

  // ---------- Accessibility label ----------
  var lastLabel = "";
  function updateAria(force) {
    var t;
    if (PJ) {
      var pjRead = PJ.tool === "combosquare" ? "Combination square reading " + tapeText(PJ.comboHeld || PJ.comboD > 0 ? tapeValue(PJ.comboD) : T.shown) : "Tape measure reading " + tapeText(T.hookHeld ? tapeValue(T.d) : T.shown);
      t = PSTEP.title + ". " + (PJ.phase === "done" ? PSTEP.done + " Done." : pjRead + ".");
    }
    else if (S.tool === "tape") t = "Tape measure. Reading " + tapeText(T.hookHeld ? tapeValue(T.d) : T.shown) + ". A board, a pencil, a toy car and a block are on the bench.";
    else if (S.tool === "combosquare") t = "Combination square on a board, reading " + comboText() + ". " + S.lines.length + " pencil lines.";
    else if (S.tool === "level") { var phi = effTilt(); t = "Spirit level on a board. " + (Math.abs(phi) < 0.5 ? "It is level." : Math.round(Math.abs(phi)) + " degrees off level."); }
    else if (S.tool === "square") t = "Speed square on a board, marking the " + S.sq + " degree edge. " + S.lines.length + " pencil lines.";
    else t = "Digital caliper reading " + calText() + (S.item ? ", with a " + ITEMS[S.item].name.toLowerCase() + " in the jaws." : ".");
    if (force || t !== lastLabel) { lastLabel = t; cv.setAttribute("aria-label", t); }
  }

  // ---------- Frame ----------
  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bgCanvas, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.lineJoin = "round";
    if (PJ) drawProject(ctx);
    else if (S.tool === "tape") drawTape(ctx);
    else if (S.tool === "combosquare") drawCombo(ctx);
    else if (S.tool === "level") drawLevel(ctx);
    else if (S.tool === "square") drawSquare(ctx);
    else drawCaliper(ctx);
  }
  // Opened from the Tool Wall's "Try it" button: start on that tool.
  (function () {
    if (PJ) return;
    var m = location.search.match(/[?&]tool=([a-z]+)/);
    var WALL = { tape: "tape", combosquare: "combosquare", level: "level", speedsquare: "square", calipers: "caliper" };
    if (m && WALL[m[1]]) S.tool = WALL[m[1]];
  })();
  if (PJ) {
    // Project mode chrome: Back leads to the plan, the step banner and the first coach line are shown
    // before the first layout (the board is placed under them).
    var wallBtn = $("wallbtn");
    wallBtn.href = ToyboxProjects.planUrl(PSTEP.project);
    wallBtn.setAttribute("aria-label", "Back to the plan");
    wallBtn.querySelector("span").textContent = "Plan";
    var banner = $("pjstep");
    banner.textContent = PSTEP.title;
    banner.hidden = false;
    $("mcoach").textContent = pjBaseCoach();
    document.title = "Measuring: " + PSTEP.title;
  }
  setTool(S.tool, true);
  resize();
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 120); });
  if (window.ResizeObserver) { try { new ResizeObserver(function () { resize(); }).observe($("stage")); } catch (e) { /* ignore */ } }

  try { if (localStorage.getItem("workshop-sound-v1") === "on") localStorage.setItem("workshop-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "workshop-measuring",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the tape zips back, the tools settle and rest, and the controls lock. The timer carries on across Workshop pages.",
    goodbyeOption: "End with a “Put away” button to press",
    farewellText: "Time to put the tools away",
    goodbyeLabel: "Put away",
    farewellDone: "Bye bye, tools!",
    restLine: "The tools are put away.",
    restLine2: "They will be right here next time.",
    restArt: restArt,
    soundNote: "Soft clicks, a zip and a chime. Hold for 2 seconds.",
    legacy: { timer: "workshop-timer-v1", sound: "workshop-sound-v1" },
    onEnding: onEnding,
    onGoodbye: goodbye,
    onRest: onRest,
    onWake: onWake,
    onBig: function () { resize(); },
    onSound: function (on) { if (on) { ensureAudio(); blip(660, 0.15, 0.08, "sine", 880); } }
  });

  var lastT = performance.now(), ariaAt = 0;
  function frame(t) {
    var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
    lastT = t;
    now = t / 1000;
    if (Toybox.timer.phase() !== "resting") {
      updateTape(dt);
      updateCombo(dt);
      updateLevel(dt);
      updateSquare(dt);
      updateCaliper(dt);
      if (PJ) updateProject(dt);
      if (Toybox.timer.phase() === "ending") endingFrame();
      draw();
      if (now - ariaAt > 1) { ariaAt = now; updateAria(); }
    }
    requestAnimationFrame(frame);
  }
  if (/[?&]debug=1/.test(location.search)) window.__ms = { S: S, T: T, C: C, L: L, Q: Q, K: K, PJ: PJ, PSTEP: PSTEP, hookPt: hookPt, km: km, sqEdge: sqEdge, sqGeom: sqGeom, levelEnds: levelEnds, itemPos: itemPos };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
