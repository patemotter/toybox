<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Measuring</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workshop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 1400px;
  margin: 0 auto;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
}
header {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
header h1 {
  margin: 0;
  font-size: 1.6rem;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.spacer { flex: 1 1 auto; }
.homebtn, .wallbtn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 46px;
  padding: 2px 12px 2px 9px;
  font-weight: 700;
  font-size: 1rem;
  color: var(--ink);
  text-decoration: none;
  background: var(--panel);
  border: 3px solid var(--edge);
  border-radius: 14px;
  box-shadow: 2px 2px 0 var(--edge);
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}
.wallbtn { background: var(--accent); color: #1D2340; border-color: #1D2340; box-shadow: 2px 2px 0 #1D2340; }
.homebtn:active, .wallbtn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }
.homebtn:focus-visible, .wallbtn:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
.homebtn svg, .wallbtn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px 2px 6px;
  border: 3px dashed var(--edge);
  border-radius: 999px;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
}
.badge svg { width: 52px; height: 30px; display: block; }
.gubtn { flex: none; min-height: 46px; font-size: 1rem; padding: 0.2rem 0.7rem; white-space: nowrap; }
button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
.app {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}
.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  border: 3px solid var(--edge);
  border-radius: 24px;
  box-shadow: 4px 4px 0 var(--edge);
  overflow: hidden;
  background: #C9A877;
}
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
/* The four tools: picture buttons, all visible at once */
.toolbar {
  flex: none;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.tool {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 64px;
  padding: 0.2rem 0.4rem;
  font-size: 1.2rem;
  white-space: nowrap;
  overflow: hidden;
}
.tool svg { flex: none; width: 58px; height: 44px; display: block; }
.tool[aria-pressed="true"] { background: var(--accent); color: #1D2340; border-color: #1D2340; box-shadow: 4px 4px 0 #1D2340; }
/* Options for the tool on the bench, bottom-left of the bench */
.opts {
  position: absolute;
  left: 10px;
  bottom: 10px;
  z-index: 3;
  display: flex;
  gap: 8px;
  pointer-events: none;
}
.optset { display: none; gap: 8px; }
.optset.on { display: flex; }
.ob {
  pointer-events: auto;
  min-height: 52px;
  min-width: 64px;
  padding: 0.1rem 0.8rem;
  font-size: 1.25rem;
  color: #1D2340;
  background: #FFFFFF;
  border-color: #1D2340;
  box-shadow: 3px 3px 0 #1D2340;
  white-space: nowrap;
}
.ob[aria-pressed="true"] { background: var(--accent); }
.ob.clear { background: #FF8A3D; }
.ob.zero { background: #8FD694; min-width: 90px; }
.tiltchip {
  align-self: center;
  padding: 0.25rem 0.8rem;
  border: 3px solid #1D2340;
  border-radius: 999px;
  background: #CDF5D0;
  color: #1D2340;
  font-weight: 800;
  font-size: 1.05rem;
}
/* Friendly hint at the top of the bench */
.prompt {
  position: absolute;
  left: 50%;
  top: 10px;
  z-index: 3;
  transform: translate(-50%, -12px) scale(0.92);
  max-width: calc(100% - 150px);
  background: #FFC93C;
  color: #1D2340;
  border: 4px solid #1D2340;
  border-radius: 22px;
  padding: 0.35rem 1.1rem;
  font-size: 1.45rem;
  font-weight: 800;
  line-height: 1.15;
  text-align: center;
  box-shadow: 4px 4px 0 #1D2340;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s cubic-bezier(.3,1.6,.5,1);
}
.prompt.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
/* ---------- Timer: the toast, banner, sheet and rest screen come from common/toybox.css ---------- */
/* Big: hide the header; the four tool buttons stay so the tools can still be swapped. */
.stage .bigtoggle { position: absolute; top: 10px; right: 10px; z-index: 4; color: #1D2340; background: #FFFFFF; border-color: #1D2340; box-shadow: 3px 3px 0 #1D2340; }
.stage .bigtoggle[aria-pressed="true"] { background: var(--accent); }
body.big header { display: none; }
body.big .app { margin-top: 0; }
body.ending .toolbar,
body.ending .opts,
body.ending .wallbtn { pointer-events: none; opacity: 0.4; }
body.ending .ob { pointer-events: none; }

.rest-art { width: min(60vw, 240px); }

/* Phones and narrow screens */
@media (max-width: 700px) {
  header h1 { font-size: 1.25rem; }
  .badge span, .homebtn span { display: none; }
  .badge { padding: 0 6px; }
  .badge svg { width: 40px; height: 24px; }
  .homebtn { padding: 2px 8px; }
  .toolbar { gap: 6px; }
  .tool { flex-direction: column; gap: 0; min-height: 66px; font-size: 0.95rem; line-height: 1.05; padding: 0.15rem; }
  .tool svg { width: 48px; height: 34px; }
  .ob { min-height: 48px; min-width: 52px; font-size: 1.1rem; padding: 0.1rem 0.55rem; }
  .prompt { font-size: 1.15rem; max-width: calc(100% - 90px); }
}
@media (max-width: 480px) {
  header h1 { display: none; }
  .gubtn { font-size: 0.9rem; padding: 0.2rem 0.5rem; }
  .wallbtn { padding: 2px 10px 2px 6px; }
}
/* Short landscape phones: compact chrome so the bench gets the height. */
@media (orientation: landscape) and (max-height: 520px) {
  .wrap { padding-top: 4px; padding-bottom: 4px; }
  header h1 { font-size: 1.15rem; }
  .homebtn, .wallbtn, .gubtn { min-height: 38px; font-size: 0.9rem; }
  .badge span { display: none; }
  .app { flex-direction: row; margin-top: 4px; gap: 6px; }
  .toolbar { grid-template-columns: 1fr; grid-auto-rows: minmax(0, 1fr); width: 104px; gap: 4px; }
  .tool { flex-direction: column; gap: 0; min-height: 0; font-size: 0.85rem; line-height: 1; padding: 0 0.2rem; }
  .tool svg { width: 40px; height: 28px; }
  .ob { min-height: 44px; font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) {
  .prompt { transition: opacity 0.2s ease; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="wallbtn" id="wallbtn" href="./" aria-label="Back to the Tool Wall"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Tool Wall</span></a>
    <h1>Measuring</h1>
    <span class="spacer"></span>
    <span class="badge" title="Eye protection and ear protection are on"><svg viewBox="0 0 52 30" aria-hidden="true"><rect x="2" y="9" width="21" height="13" rx="6" fill="#5BC0EB" stroke="#1D2340" stroke-width="2.5"/><path d="M8 13 l4 -2" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M23 15 h3" stroke="#1D2340" stroke-width="2.5"/><path d="M33 22 C33 4 49 4 49 22" fill="none" stroke="#1D2340" stroke-width="3"/><rect x="29" y="16" width="8" height="12" rx="3" fill="#E63946" stroke="#1D2340" stroke-width="2.5"/><rect x="45" y="16" width="6" height="12" rx="3" fill="#E63946" stroke="#1D2340" stroke-width="2.5"/></svg><span>Gear on</span></span>
    <a class="homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg><span>Home</span></a>
    <button class="btn gubtn" id="gubtn">Grown-ups</button>
  </header>

  <main class="app">
    <div class="stage" id="stage">
      <canvas id="cv" role="img" aria-label="A tape measure on the workbench"></canvas>
      <div class="prompt" id="prompt" role="status" aria-live="polite"></div>
      <div class="opts" id="opts">
        <div class="optset" data-for="tape">
          <button class="btn ob" data-unit="in" aria-pressed="true" aria-label="Inches">in</button>
          <button class="btn ob" data-unit="cm" aria-pressed="false" aria-label="Centimetres">cm</button>
        </div>
        <div class="optset" data-for="level">
          <span class="tiltchip" id="tiltChip" hidden>Tilt is on</span>
        </div>
        <div class="optset" data-for="square">
          <button class="btn ob" data-sq="90" aria-pressed="true" aria-label="Mark along the 90 degree edge">90°</button>
          <button class="btn ob" data-sq="45" aria-pressed="false" aria-label="Mark along the 45 degree edge">45°</button>
          <button class="btn ob clear" id="clearBtn">Clear</button>
        </div>
        <div class="optset" data-for="caliper">
          <button class="btn ob zero" id="zeroBtn">Zero</button>
        </div>
      </div>
      <button class="btn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the header">Big</button>
    </div>
    <div class="toolbar" id="toolbar">
      <button class="btn tool" data-tool="tape" aria-pressed="true"><svg viewBox="0 0 58 44" aria-hidden="true"><path d="M30 27 H54 V33 H30 Z" fill="#FFE27A" stroke="#1D2340" stroke-width="2.5"/><path d="M36 27v3M42 27v4M48 27v3" stroke="#1D2340" stroke-width="1.8"/><rect x="52" y="24" width="4" height="12" rx="1" fill="#C98A2B" stroke="#1D2340" stroke-width="2"/><rect x="3" y="6" width="30" height="32" rx="10" fill="#FFC93C" stroke="#1D2340" stroke-width="3"/><circle cx="18" cy="22" r="7" fill="#26282E" stroke="#1D2340" stroke-width="2"/><rect x="8" y="3" width="12" height="6" rx="3" fill="#E63946" stroke="#1D2340" stroke-width="2.5"/></svg><span>Tape</span></button>
      <button class="btn tool" data-tool="level" aria-pressed="false"><svg viewBox="0 0 58 44" aria-hidden="true"><rect x="2" y="14" width="54" height="16" rx="3" fill="#FFC93C" stroke="#1D2340" stroke-width="3"/><rect x="2" y="14" width="7" height="16" rx="2" fill="#26282E"/><rect x="49" y="14" width="7" height="16" rx="2" fill="#26282E"/><rect x="19" y="17" width="20" height="10" rx="5" fill="#B9F04A" stroke="#1D2340" stroke-width="2.5"/><ellipse cx="29" cy="22" rx="4" ry="3" fill="#FFFFFF"/></svg><span>Level</span></button>
      <button class="btn tool" data-tool="square" aria-pressed="false"><svg viewBox="0 0 58 44" aria-hidden="true"><path d="M10 6 H50 L10 40 Z" fill="#C7D0DA" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><path d="M17 13 H36 L17 29 Z" fill="#C9A877" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="6" y="3" width="46" height="6" rx="2" fill="#9AA6B4" stroke="#1D2340" stroke-width="2.5"/></svg><span>Square</span></button>
      <button class="btn tool" data-tool="caliper" aria-pressed="false"><svg viewBox="0 0 58 44" aria-hidden="true"><rect x="2" y="12" width="54" height="6" fill="#D5DBE2" stroke="#1D2340" stroke-width="2.5"/><path d="M4 18 H11 V36 L8 41 H6 L4 33 Z" fill="#C7D0DA" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><path d="M20 18 H27 V33 L25 41 H23 L20 36 Z" fill="#C7D0DA" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="20" y="4" width="26" height="20" rx="3" fill="#B6BDC7" stroke="#1D2340" stroke-width="2.5"/><rect x="24" y="7" width="18" height="9" rx="1.5" fill="#C9E3B0" stroke="#1D2340" stroke-width="2"/></svg><span>Caliper</span></button>
    </div>
  </main>

  <!-- Tilt: an extra section that the shared grown-up sheet (common/toybox.js) moves into itself -->
  <section id="tiltSection" hidden>
    <h3>Tilt</h3>
    <p class="sub" id="tiltState">Turn on tilt and the spirit level's bubble follows the real tilt of the device.</p>
    <div class="sheet-actions">
      <button class="btn" id="tiltBtn">Turn on tilt</button>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  // ---------- The safety-gear check ----------
  var gearOn = true;
  try { gearOn = sessionStorage.getItem("workshop-gear") === "on"; } catch (e) { gearOn = true; }
  if (!gearOn) { location.replace("./?next=measuring"); return; }

  var OUT = "#1D2340";
  var SKEY = "workshop-measuring-v1";
  var TILTKEY = "workshop-tilt-v1";
  var TOOLS = ["tape", "level", "square", "caliper"];
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var FONT = "\"Baloo 2\", \"Trebuchet MS\", sans-serif";
  var DEG = Math.PI / 180;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  var $ = function (id) { return document.getElementById(id); };
  function seeded(seed) {
    var s = (seed >>> 0) || 1;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

  // ---------- Saved state ----------
  function freshState() {
    return { tool: "tape", unit: "in", sq: 90, sqF: 0.25, flip: false, lines: [], item: null, zero: 0, gap: 30, boardA: 6 };
  }
  function loadState() {
    var s = freshState();
    try {
      var o = JSON.parse(localStorage.getItem(SKEY) || "null");
      if (!o || typeof o !== "object") return s;
      if (TOOLS.indexOf(o.tool) !== -1) s.tool = o.tool;
      if (o.unit === "cm") s.unit = "cm";
      if (o.sq === 45) s.sq = 45;
      if (typeof o.sqF === "number" && isFinite(o.sqF)) s.sqF = clamp(o.sqF, 0, 1);
      s.flip = !!o.flip;
      if (Array.isArray(o.lines)) s.lines = o.lines.filter(function (l) { return l && [l.x0, l.y0, l.x1, l.y1].every(function (v) { return typeof v === "number" && isFinite(v); }); }).slice(-80);
      if (o.item && ITEMS[o.item]) s.item = o.item;
      if (typeof o.zero === "number" && isFinite(o.zero)) s.zero = clamp(o.zero, 0, GMAX);
      if (typeof o.gap === "number" && isFinite(o.gap)) s.gap = clamp(o.gap, 0, GMAX);
      if (typeof o.boardA === "number" && isFinite(o.boardA)) s.boardA = clamp(o.boardA, -15, 15);
    } catch (e) { /* ignore */ }
    if (s.item && s.gap < ITEMS[s.item].w) s.gap = ITEMS[s.item].w;
    return s;
  }
  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
    }, 250);
  }

  // Caliper parts (mm): w = the size the jaws measure.
  var ITEMS = {
    bolt: { name: "Bolt", w: 8 },
    nut: { name: "Nut", w: 13 },
    dowel: { name: "Dowel", w: 19 },
    washer: { name: "Washer", w: 24 }
  };
  var ITEM_ORDER = ["bolt", "nut", "washer", "dowel"];
  var GMAX = 54; // widest caliper opening (mm)

  var S = loadState();

  // ---------- Canvas and layout ----------
  var cv = $("cv"), ctx = cv.getContext("2d");
  var DPR = 1, CW = 300, CH = 300, U = 300, PAD = 10, OPTH = 70;
  var bgCanvas = document.createElement("canvas");

  // Tape measure
  var T = {
    ppi: 40, cs: 120, bw: 30, objs: [], c: { x: 0, y: 0 }, a: 0, d: 0, zip: false, zv: 0, hookHeld: false,
    snap: null, shown: 0, live: false, bump: 0, burst: [], lastIn: 0, maxIn: 25, caseFly: null, home: null
  };
  // Spirit level
  var L = { pv: { x: 0, y: 0 }, lb: 400, tb: 24, ll: 320, hl: 70, wh: 100, amax: 12, a: S.boardA, bub: [], wasLevel: false, glow: 0, sparks: [], aT: null };
  // Speed square
  var Q = { bx: 0, by: 0, bw: 300, bh: 200, sl: 160, lip: 14, xd: 0, flipT: S.flip ? 1 : 0, live: null, clearT: 0, edgeFlash: 0, clack: 0 };
  // Caliper
  var K = { k: 4, ox: 0, oy: 0, gd: S.gap, contact: 0, zeroFlash: 0, trayY: 0, trayH: 0, slots: {}, fly: {}, bubble: false, wasTouch: false };

  var devTilt = 0, now = 0;
  var tilt = { on: false };

  function layout() {
    U = Math.min(CW, CH);
    PAD = U < 500 ? 8 : 14;
    OPTH = U < 500 ? 62 : 74;
    layoutTape();
    layoutLevel();
    layoutSquare();
    layoutCaliper();
  }

  function layoutTape() {
    var cs = clamp(U * 0.2, 74, 170);
    var availW = CW - 2 * PAD - cs - 12;
    var boardIn = availW / 12.6 >= 30 ? 12 : 9;
    var ppi = Math.min(U / 13, availW / (boardIn + 0.6));
    var objs = [
      { id: "board", len: boardIn, w: 3.5 },
      { id: "pencil", len: 7, w: 0.42 },
      { id: "car", len: 4, w: 1.9 },
      { id: "block", len: 2, w: 2 }
    ];
    var F = clamp(U * 0.085, 30, 66);
    var top = PAD + F * 1.7 + 14, bot = CH - OPTH - 8;
    var hs = objs.map(function (o) { return Math.max(o.w * ppi, 18); });
    var sum = hs.reduce(function (a, b) { return a + b; }, 0);
    var avail = bot - top;
    if (sum > avail * 0.85) { ppi *= avail * 0.85 / sum; hs = objs.map(function (o) { return Math.max(o.w * ppi, 16); }); sum = hs.reduce(function (a, b) { return a + b; }, 0); }
    var gap = Math.min((avail - sum) / (objs.length + 1), ppi * 2.6);
    var y = top + (avail - sum - gap * (objs.length - 1)) / 2;
    var xL = PAD + cs + 12;
    objs.forEach(function (o, i) {
      o.x0 = xL; o.x1 = xL + o.len * ppi; o.h = hs[i];
      o.cy = y + hs[i] / 2;
      y += hs[i] + gap;
    });
