<html lang="en">
<head>

<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }
.stage { background: #C9A877; }
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
/* ---------- Panel: the size row (choices), then the Wrench / Ratchet / direction tabs ---------- */
.sizes { display: flex; gap: 8px; }
.tbtn {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  overflow: hidden;
}
.tbtn svg { flex: none; display: block; }
.mode svg { width: 54px; height: 30px; }
.dirbtn { background: #BDF0C8; color: #1D2340; border-color: #1D2340; box-shadow: 3px 3px 0 #1D2340; }
.dirbtn.tight { background: #BFD7FF; }
.dirbtn svg { width: 32px; height: 32px; }
.sizebtn {
  min-height: 74px;
  flex-direction: column;
  gap: 0;
  padding: 0.15rem 0.2rem 0.05rem;
  touch-action: none;
}
.sizebtn svg { width: 92px; height: 38px; max-width: 100%; }
.sizebtn b {
  font-size: 1.55rem;
  font-weight: 800;
  line-height: 1;
  padding: 2px 10px 0;
  border-radius: 12px;
  border: 3px solid #1D2340;
  color: #FFFFFF;
  -webkit-text-stroke: 1px #1D2340;
  text-shadow: 1px 1px 0 #1D2340;
}
.sizebtn[aria-pressed="true"] { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--edge); }
/* Friendly prompt ("Too big! Try a smaller one."): the coach line spot. */
.prompt {
  position: absolute;
  left: 50%;
  top: 58px;            /* just under the counter pill, so a long line never covers it */
  z-index: 3;
  transform: translate(-50%, -12px) scale(0.92);
  width: max-content;
  max-width: calc(100% - 24px);
  background: #FFC93C;
  color: #1D2340;
  border: 4px solid #1D2340;
  border-radius: 22px;
  padding: 0.35rem 1.1rem;
  font-size: 1.45rem;
  font-weight: 800;
  line-height: 1.15;
  text-align: center;
  box-shadow: 4px 4px 0 #1D2340;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s cubic-bezier(.3,1.6,.5,1);
}
.prompt.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.tb-counter.pop { animation: cpop 0.4s cubic-bezier(.3,1.6,.5,1); }
@keyframes cpop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
/* Big: the size row is the play, so it stays; the header shrinks to the Big button. */
body.big .tb-head > :not(.bigtoggle), body.big .modes { display: none; }
body.ending .toolbar,
body.ending .wallbtn { pointer-events: none; opacity: 0.4; }

/* Rest picture size (the rest screen itself is in common/toybox.css). */
.rest-art { width: min(60vw, 240px); }

/* Phones */
@media (max-width: 600px) {
  .sizes { gap: 6px; }
  .tbtn { gap: 3px; }
  .mode svg { width: 40px; height: 24px; }
  .dirbtn svg { width: 26px; height: 26px; }
  .sizebtn { min-height: 66px; }
  .sizebtn svg { width: 64px; height: 26px; }
  .sizebtn b { font-size: 1.3rem; padding: 1px 6px 0; border-radius: 10px; }
  .prompt { font-size: 1.15rem; top: auto; bottom: 10px; }
}
@media (max-width: 480px) { .mode svg { display: none; } }
/* Landscape: the panel is a column; the sizes fill it as a grid, the tabs sit at the bottom. */
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(30%, 340px); }
  .sizes { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); }
  .sizebtn { min-height: 0; }
  .sizebtn:last-child { grid-column: span 2; }
  .modes { flex-wrap: wrap; }
  .modes .tbtn { flex: 1 1 40%; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: 190px; padding: 6px; gap: 6px; }
  .sizes { gap: 4px; }
  .modes { gap: 4px; }
  .modes .tbtn { min-height: 40px; font-size: 0.9rem; }
  .mode svg { display: none; }
  .dirbtn svg { width: 22px; height: 22px; }
  .sizebtn svg { width: 40px; height: 16px; }
  .sizebtn b { font-size: 1.1rem; padding: 0 6px; border-radius: 9px; border-width: 2px; }
  .prompt { font-size: 1.1rem; top: auto; bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .prompt { transition: opacity 0.2s ease; }
}
</style>

<div class="tb-app-shell wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back wallbtn" id="wallbtn" href="./" aria-label="Back to the Tool Wall"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Tool Wall</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Wrenches</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls">Big</button>
  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A bolt board with five hex bolts"></canvas>
      <div class="tb-counter" id="boltsCount">Bolts out: 0</div>
      <div class="prompt" id="prompt" role="status" aria-live="polite"></div>
    </main>
    <section class="tb-panel toolbar" id="toolbar">
      <div class="sizes" id="sizes" role="group" aria-label="Size"></div>
      <nav class="tb-tabs modes" role="group" aria-label="Tool">
        <button class="btn tbtn mode" id="modeWrench" aria-pressed="true"><svg id="modeWrenchIcon" viewBox="0 0 54 30" aria-hidden="true"></svg><span>Wrench</span></button>
        <button class="btn tbtn mode" id="modeRatchet" aria-pressed="false"><svg id="modeRatchetIcon" viewBox="0 0 54 30" aria-hidden="true"></svg><span>Ratchet</span></button>
        <button class="btn tbtn dirbtn" id="dirBtn" hidden aria-label="Ratchet direction: Loosen. Tap to switch."><svg id="dirIcon" viewBox="0 0 32 32" aria-hidden="true"></svg><span id="dirText">Loosen</span></button>
      </nav>
    </section>
  </div>
</div>
<script>

    var t = "Bolt board with bolts sized 8, 10, 13, 17 and 19. " + (S.mode === "wrench" ? "Wrench " : "Ratchet with socket ") + toolMM() + " selected" +
      (T.state === "on" ? ", on the " + SIZES[T.slot] + " bolt" : "") + ". " + loose + " loosened, " + outN + " in the tray. Bolts out: " + S.out + ".";
    if (t !== lastLabel) { lastLabel = t; cv.setAttribute("aria-label", t); }
  }
  var lastT = performance.now(), ariaAt = 0;
  function frame(t) {
    var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
    lastT = t;
    now = t / 1000;
    if (Toybox.timer.phase() !== "resting") {
      updateTool(dt);
      updateBolts();
      if (Toybox.timer.phase() === "ending") endingFrame();
      draw();
      if (now - ariaAt > 1) { ariaAt = now; updateAria(); }
    }
    requestAnimationFrame(frame);
  }
  if (params.debug === "1") window.__wr = { S: S, T: T, rt: rt, LY: LY, headTop: headTop, readyPose: readyPose, trayPos: trayPos, toolGeom: toolGeom, U: function () { return U; } };
  requestAnimationFrame(frame);
})();
</script>
