<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Workshop</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workshop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<script src="projects.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --peg: #C98F55;
  --peghole: #6A4220;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --peg: #A8743F;
    --peghole: #4A2C12;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.3;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button, a {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
svg { -webkit-user-select: none; user-select: none; }
/* ---------- Standard app shell (common/toybox.css): header, stage (the wall), panel (stations + sections) ---------- */
.tb-head a { text-decoration: none; }
.tb-head .tb-title { display: flex; align-items: baseline; gap: 8px; }
.tb-head .tb-title .sub1 { color: var(--muted); font-weight: 700; font-size: 1.15rem; }
.gearbadge { display: none; }
/* Time-left badge: top-right of the wall. */
.tpill {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 3;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 800;
  font-size: 1.15rem;
  background: var(--panel);
  border: 3px solid var(--edge);
  border-radius: 999px;
  padding: 2px 10px 2px 4px;
  min-height: 40px;
  pointer-events: none;
}
.tpill[hidden] { display: none; }
.tpill svg { width: 30px; height: 30px; }
.wallstage { background-color: var(--peg); }
/* Stations: picture tiles (picture on top, name under). */
.stations { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.station {
  text-decoration: none;
  color: #1D2340;
  border-color: #1D2340;
  font-weight: 800;
  text-align: center;
}
.station svg { width: 44px; height: 44px; flex: none; }
.station.s1 { background: #8CC4FF; }
.station.s2 { background: #FFB45E; }
.station.s3 { background: #FF8A8F; }
.station.s4 { background: #C9A7FF; }
.station.s5 { background: #7FDDB0; }
.station.s6 { background: #FFD84D; }
.station.s7 { background: #8FE3F0; }
.station.s8 { background: #FFB3D9; }
.station.s9 { background: #F4C88A; grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 10px; min-height: 54px; padding: 4px 12px; font-size: 1.15rem; }
.station span { min-width: 0; }
/* ---------- Section tabs ---------- */
.tabs {
  flex: none;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  overflow-y: hidden;
  touch-action: pan-x;
  scrollbar-width: none;
  padding: 2px 4px 6px 2px;
  overscroll-behavior: contain;
}
.tabs::-webkit-scrollbar { display: none; }
.chip {
  flex: 1 0 74px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 0;
  font: inherit;
  font-weight: 800;
  font-size: 0.875rem;
  line-height: 1.05;
  color: var(--ink);
  background: var(--panel);
  border: 3px solid var(--edge);
  border-radius: 14px;
  padding: 3px 3px 5px;
  min-height: 72px;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--edge);
  text-align: center;
}
.chip svg { width: 38px; height: 38px; flex: none; }
.chip[aria-selected="true"] { background: var(--accent); color: #1D2340; border-color: #1D2340; }
.chip:active { transform: translate(2px, 2px); box-shadow: none; }
.chip:focus-visible { outline: 4px solid var(--focus); outline-offset: 1px; }
/* ---------- Pegboard ---------- */
.board {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  overscroll-behavior: contain;
  background-color: var(--peg);
  padding: 0;
}
/* The holes are painted on the scrolling content itself, so they move exactly with the tools.
   (A background-attachment: local on the scroll box lags or jumps on iOS while scrolling.) */
.pegs {
  min-height: 100%;
  padding: 10px 12px 40px;
  background-image: radial-gradient(circle at 13px 13px, var(--peghole) 0 3.4px, rgba(0, 0, 0, 0) 4px);
  background-size: 26px 26px;
}
.sec { padding-top: 4px; }
.sec + .sec { margin-top: 10px; }
.sec h2 {
  display: inline-flex;
  max-width: 100%;
  white-space: nowrap;
  align-items: baseline;
  gap: 10px;
  margin: 2px 0 6px;
  padding: 2px 16px;
  font-size: 1.45rem;
  font-weight: 800;
  color: #1D2340;
  background: #F6DDB0;
  background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 60%);
  border: 3px solid #1D2340;
  border-radius: 10px;
  box-shadow: 3px 3px 0 rgba(29, 35, 64, 0.6);
}
.sec h2 small { font-size: 0.95rem; color: #6A4A20; font-weight: 700; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 6px 10px;
}
.tool {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  font: inherit;
  color: #1D2340;
  background: transparent;
  border: 0;
  padding: 0 0 4px;
  cursor: pointer;
  min-width: 0;
}
.tool svg.art { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; overflow: visible; }
.tool .tag {
  display: block;
  max-width: 100%;
  margin-top: -6px;
  padding: 1px 8px 2px;
  font-weight: 800;
  font-size: 1rem;
  line-height: 1.1;
  text-align: center;
  background: #FFF8E8;
  border: 3px solid #1D2340;
  border-radius: 10px;
  box-shadow: 2px 2px 0 rgba(29, 35, 64, 0.55);
}
.tool .tag small { display: block; font-size: 0.875rem; font-weight: 700; color: #5A4A30; }
.tool .go {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #1D2340;
  display: grid;
  place-items: center;
}
.tool .go::after { content: ""; border-left: 10px solid #1D2340; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }
.tool:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; border-radius: 14px; }
.tool.out .sw { opacity: 0; }
.tool.lift .sw { animation: lift 0.34s ease-out both; }
@keyframes lift { to { transform: translateY(-10px); opacity: 0.2; } }

/* ---------- Tool detail ---------- */
.detail {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: rgba(13, 20, 38, 0.55);
  touch-action: none;
}
.detail[hidden] { display: none; }
.dcard {
  width: 100%;
  max-width: 1240px;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 4px solid var(--edge);
  border-radius: 28px;
  box-shadow: 6px 6px 0 var(--edge);
  padding: 10px 12px 12px;
  gap: 8px;
  overflow: hidden;
  transform-origin: 50% 50%;
}
.dcard.zoom { transition: transform 0.5s cubic-bezier(0.25, 1.25, 0.45, 1), opacity 0.34s ease; }
.dhead { display: flex; align-items: center; gap: 10px; flex: none; min-width: 0; }
.dhead h2 { margin: 0; font-size: 2.1rem; font-weight: 800; line-height: 1; min-width: 0; }
.dcat {
  flex: none;
  font-weight: 800;
  font-size: 0.95rem;
  padding: 2px 10px;
  border-radius: 999px;
  border: 3px solid var(--edge);
  background: #F6DDB0;
  color: #1D2340;
}
.dhead .sp { flex: 1; }
.dclose { flex: none; font-size: 1.15rem; min-height: 54px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); }
.dclose[hidden] { display: none; }
.dbody { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.dstage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  border: 3px solid var(--edge);
  border-radius: 20px;
  background-color: #F4FAFF;
  background-image: linear-gradient(rgba(45, 91, 215, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(45, 91, 215, 0.08) 1px, transparent 1px);
  background-size: 24px 24px;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
}
.dstage > * { position: absolute; }
#jSvg { inset: 0; width: 100%; height: 100%; overflow: hidden; display: block; }
#jSvg[hidden], #dSvg[hidden], #dLines[hidden], #dLabels[hidden] { display: none; }
.dstage.parts { cursor: default; }
.vtabs { top: 8px; left: 8px; display: flex; gap: 6px; z-index: 2; }
.vtab {
  font: 800 1rem/1 var(--font);
  min-height: 44px;
  padding: 4px 14px 5px;
  border-radius: 999px;
  border: 3px solid #1D2340;
  background: #FFFFFF;
  color: #1D2340;
  box-shadow: 2px 2px 0 rgba(29, 35, 64, 0.35);
  cursor: pointer;
  touch-action: manipulation;
}
.vtab[aria-pressed="true"] { background: var(--accent); }
.vtab:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
#dLines { inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#dSvg { overflow: visible; }
#dLabels { inset: 0; pointer-events: none; }
.plabel {
  position: absolute;
  pointer-events: none;
  font-weight: 800;
  font-size: 1rem;
  line-height: 1.1;
  color: #1D2340;
  background: #FFFFFF;
  border: 3px solid #1D2340;
  border-radius: 10px;
  padding: 1px 7px 2px;
  white-space: nowrap;
  box-shadow: 2px 2px 0 rgba(29, 35, 64, 0.35);
}
.dread {
  left: 10px;
  top: 10px;
  pointer-events: none;
  font-weight: 800;
  font-size: 1.6rem;
  line-height: 1.1;
  color: #1D2340;
  background: var(--accent);
  border: 3px solid #1D2340;
  border-radius: 14px;
  padding: 2px 12px 3px;
  box-shadow: 3px 3px 0 #1D2340;
  font-variant-numeric: tabular-nums;
}
.dread[hidden] { display: none; }
.dinfo .dread { align-self: flex-start; }
.dread.pop { animation: rpop 0.25s ease-out; }
@keyframes rpop { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }
.dinfo { flex: none; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.duse { margin: 0; font-size: 1.3rem; font-weight: 800; line-height: 1.25; }
.duse b { color: var(--muted); font-weight: 800; }
.drow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 48px; }
.drow .dread { position: static; }
.again { min-height: 56px; font-size: 1.3rem; background: #8EE07A; color: #1D2340; border-color: #1D2340; box-shadow: 4px 4px 0 var(--edge); }
.again[hidden], .ddesc[hidden], .drow[hidden] { display: none; }
.dread.done { background: #8EE07A; }
.ddesc { margin: 0; font-size: 1.25rem; font-weight: 700; line-height: 1.3; }
.dhint { margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--muted); }
.dhint::before { content: "👆 "; }
.dhint.done::before { content: "🎉 "; }
.try {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 64px;
  font-size: 1.5rem;
  font-weight: 800;
  text-decoration: none;
  background: var(--accent);
  color: #1D2340;
  border-color: #1D2340;
  box-shadow: 4px 4px 0 var(--edge);
}
.try[hidden] { display: none; }
.try small { font-size: 1rem; font-weight: 700; }
.try svg { width: 30px; height: 30px; flex: none; }

/* ---------- Shutter (the roll-up shop door) ---------- */
.shutter {
  position: fixed;
  inset: 0;
  z-index: 30;
  transform: translateY(-102%);
  transition: transform 2s cubic-bezier(0.55, 0, 0.25, 1);
  pointer-events: none;
  background-color: #AEB9C5;
  background-image:
    linear-gradient(90deg, rgba(29, 35, 64, 0.18) 0 10px, rgba(0, 0, 0, 0) 10px calc(100% - 10px), rgba(29, 35, 64, 0.18) calc(100% - 10px)),
    repeating-linear-gradient(180deg, #C3CCD6 0 26px, #E1E7ED 26px 29px, #8F9AA8 29px 33px, #A6B1BE 33px 38px);
  border-bottom: 5px solid #1D2340;
}
.shutter.down, .shutter.half { pointer-events: auto; }
.shutter.down { transform: translateY(0); }
.shutter.half { transform: translateY(-58%); }
.shutter .sbar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 54px;
  border-top: 5px solid #1D2340;
  background: repeating-linear-gradient(-45deg, #FFC93C 0 22px, #1D2340 22px 44px);
}
.shutter .shandle {
  position: absolute;
  left: 50%;
  bottom: 70px;
  width: 150px;
  height: 30px;
  margin-left: -75px;
  border: 5px solid #1D2340;
  border-bottom: 0;
  border-radius: 14px 14px 0 0;
}
.shutter .ssign {
  position: absolute;
  left: 50%;
  bottom: 118px;
  transform: translateX(-50%);
  font-weight: 800;
  font-size: clamp(2rem, 7vw, 3.4rem);
  letter-spacing: 0.06em;
  color: #1D2340;
  background: #FFC93C;
  border: 5px solid #1D2340;
  border-radius: 16px;
  padding: 0 22px;
  box-shadow: 5px 5px 0 #1D2340;
  white-space: nowrap;
}

/* ---------- Gear-up screen ---------- */
.gear {
  position: fixed;
  inset: 0;
  z-index: 31;
  display: flex;
  flex-direction: column;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  touch-action: none;
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.gear[hidden] { display: none; }
.gear.leaving { opacity: 0; transform: translateY(40px) scale(0.96); pointer-events: none; }
.gtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; }
.gcard {
  flex: 1 1 auto;
  min-height: 0;
  margin-top: 10px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "title" "char" "tray";
  gap: 8px;
  background: var(--panel);
  border: 4px solid var(--edge);
  border-radius: 28px;
  box-shadow: 6px 6px 0 var(--edge);
  padding: 12px 14px 16px;
  max-width: 900px;
  width: 100%;
  margin-left: auto;
  margin-right: auto;
}
.gtitle { grid-area: title; text-align: center; }
.gtitle h2 { margin: 0; font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 800; line-height: 1; }
.gtitle p { margin: 4px 0 0; font-size: clamp(1.15rem, 3.4vw, 1.5rem); font-weight: 700; color: var(--muted); }
.gchar { grid-area: char; position: relative; min-height: 0; align-self: stretch; justify-self: stretch; display: flex; align-items: center; justify-content: center; }
.gchar svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.gtray { grid-area: tray; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; position: relative; }
.gslot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: #F6DDB0;
  border: 3px solid #1D2340;
  border-radius: 20px;
  padding: 8px 6px 8px;
  color: #1D2340;
}
.gitem { width: min(300px, 100%); aspect-ratio: 2 / 1; touch-action: none; cursor: grab; position: relative; z-index: 2; }
.gitem svg { width: 100%; height: 100%; overflow: visible; display: block; pointer-events: none; }
.gitem.drag { z-index: 40; transition: none; }
.gitem.fly { transition: transform 0.3s cubic-bezier(0.3, 1.3, 0.5, 1); }
.gitem.back { transition: transform 0.35s cubic-bezier(0.3, 1.4, 0.5, 1); }
.gitem.gone { visibility: hidden; }
.glabel { font-weight: 800; font-size: clamp(1.15rem, 3.4vw, 1.5rem); line-height: 1.1; text-align: center; }
.glabel .ok { display: none; color: #1E7A43; }
.gslot.on { background: #BDF0C8; }
.gslot.on .ok { display: inline; }
.gopen {
  position: absolute;
  inset: 0;
  z-index: 3;
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  font-weight: 800;
  background: var(--accent);
  color: #1D2340;
  border: 4px solid #1D2340;
  box-shadow: 5px 5px 0 var(--edge);
  border-radius: 22px;
  animation: pulse 1.1s ease-in-out infinite;
}
.gopen[hidden] { display: none; }
@keyframes pulse { 50% { transform: scale(1.04); } }
.tgt { animation: tgtpulse 1.4s ease-in-out infinite; }
@keyframes tgtpulse { 50% { opacity: 0.25; } }
.popin { transform-box: fill-box; transform-origin: 50% 50%; animation: popin 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }
@keyframes popin { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
.hop { animation: hop 0.6s ease-out 2; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes hop { 30% { transform: translateY(-14px); } 60% { transform: translateY(0); } }

/* ---------- Timer: the toast, banner, sheet and rest screen come from common/toybox.css ----------
   Workshop places them over its shop door (z-index 30) and makes the banner a bit bigger. */
.toast { top: max(70px, calc(env(safe-area-inset-top, 0px) + 70px)); z-index: 46; font-size: 1.45rem; padding: 0.3rem 1.1rem; }
.farewell { bottom: max(24px, env(safe-area-inset-bottom, 0px)); z-index: 45; border-width: 4px; border-radius: 24px; padding: 12px 20px 14px; box-shadow: 5px 5px 0 #1D2340; }
.farewell p { font-size: 1.5rem; }
.goodbye { font-size: 1.5rem; min-height: 64px; padding: 0.4rem 1.4rem; }
body.ending .homebtn, body.ending .station, body.ending .board, body.ending .tabs, body.ending .try, body.ending .gcard { pointer-events: none; opacity: 0.45; }

/* Rest picture: the workbench with the tools put away. */
.rest-art { width: min(64vw, 260px); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 40; pointer-events: none; }

/* ---------- Layout by screen ---------- */
/* Landscape: the tool detail puts the picture on the left and the words on the right. */
@media (orientation: landscape) {
  .dbody { flex-direction: row; }
  .dinfo { flex: 0 0 min(34%, 360px); justify-content: center; overflow-y: auto; }
  .gcard {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "char title" "char tray";
    align-items: center;
  }
  .gtray { grid-template-columns: 1fr; align-self: stretch; align-content: center; }
  .gitem { width: min(200px, 100%); }
}
/* Phones (portrait). */
@media (max-width: 600px) {
  .tb-head .tb-title .sub1 { display: none; }
  /* Stations: one row of small picture tiles with short names (swipe for more). */
  .stations { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; scrollbar-width: none; padding: 2px 4px 5px 2px; overscroll-behavior: contain; }
  .stations::-webkit-scrollbar { display: none; }
  .station, .station.s9 { flex: 0 0 auto; min-width: 70px; min-height: 58px; font-size: 0.86rem; gap: 1px; padding: 2px 6px; flex-direction: column; text-align: center; border-width: 3px; box-shadow: 3px 3px 0 var(--edge); white-space: nowrap; }
  .station svg { width: 28px; height: 28px; }
  .station span { display: none; }
  .station::after { content: attr(data-short); }

<body>
<div class="tb-app-shell wrap" id="wrap">
  <header class="tb-head top">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Workshop <span class="sub1">Tool Wall</span><svg class="gearbadge" id="gearBadge" viewBox="-120 -64 240 128" role="img" aria-label="Eye protection and ear protection on"></svg></h1>
  </header>
  <div class="tb-body">
    <div class="tb-stage wallstage">
      <main class="board" id="board" aria-label="Tool wall"></main>
      <span class="tpill" id="tpill" hidden aria-hidden="true"><svg viewBox="-20 -20 40 40" id="tpillRing"></svg><b id="tpillNum"></b></span>
    </div>
    <section class="tb-panel">
      <nav class="tb-choices stations" aria-label="Workshop stations">
        <a class="btn tb-tile station s9" aria-label="Build a birdhouse" data-short="Birdhouse" href="project.html"><svg id="icoPJ" viewBox="0 0 64 64" aria-hidden="true"><path d="M18 8h28v48H18z" fill="#D49A58" stroke="#1D2340" stroke-width="3.5" stroke-linejoin="round"/><path d="M14 22h36v34H14z" fill="#F4D7A6" stroke="#1D2340" stroke-width="3.5" stroke-linejoin="round"/><path d="M8 25 32 10l24 15-4 6-20-12-20 12z" fill="#E7B86A" stroke="#1D2340" stroke-width="3.5" stroke-linejoin="round"/><circle cx="32" cy="36" r="7" fill="#2B2F45" stroke="#1D2340" stroke-width="3.5"/><path d="M27 47h10" stroke="#1D2340" stroke-width="3.5" stroke-linecap="round"/></svg><span>Build a birdhouse</span></a>
        <a class="btn tb-tile station s1" aria-label="Drill Press" data-short="Drill" href="drill-press.html"><svg id="icoDP" aria-hidden="true"></svg><span>Drill Press</span></a>
        <a class="btn tb-tile station s2" aria-label="Saw Bench" data-short="Saw" href="saw-bench.html"><svg id="icoSB" aria-hidden="true"></svg><span>Saw Bench</span></a>
        <a class="btn tb-tile station s3" aria-label="Hammer and Screws" data-short="Hammer" href="hammer-screws.html"><svg id="icoHS" aria-hidden="true"></svg><span>Hammer &amp; Screws</span></a>
        <a class="btn tb-tile station s4" aria-label="Lathe" data-short="Lathe" href="lathe.html"><svg id="icoLA" aria-hidden="true"></svg><span>Lathe</span></a>
        <a class="btn tb-tile station s5" aria-label="Router Table" data-short="Router" href="router-table.html"><svg id="icoRT" aria-hidden="true"></svg><span>Router Table</span></a>
        <a class="btn tb-tile station s6" aria-label="Wrenches" data-short="Wrench" href="wrenches.html"><svg id="icoWR" aria-hidden="true"></svg><span>Wrenches</span></a>
        <a class="btn tb-tile station s7" aria-label="Measuring" data-short="Measure" href="measuring.html"><svg id="icoME" aria-hidden="true"></svg><span>Measuring</span></a>
        <a class="btn tb-tile station s8" aria-label="Shadow Board" data-short="Put away" href="shadow-board.html"><svg id="icoSH" aria-hidden="true"></svg><span>Shadow Board</span></a>
      </nav>
      <nav class="tb-tabs tabs" id="tabs" aria-label="Tool sections"></nav>
    </section>
  </div>
</div>

<!-- A tool lifted off the wall -->
<div class="detail" id="detail" hidden>
  <div class="dcard" id="dcard" role="dialog" aria-modal="true" aria-labelledby="dName">
    <div class="dhead">
      <h2 id="dName"></h2>
      <span class="dcat" id="dCat"></span>
      <span class="sp"></span>
      <button class="btn dclose" id="dClose">Hang it back</button>
      <a class="btn dclose" id="dPlan" href="project.html" hidden>‹ Plan</a>
    </div>
    <div class="dbody">
      <div class="dstage" id="dStage">
        <svg id="jSvg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g id="jWorld"><g id="jBack"></g><g id="jWork"></g><g id="jToolG"><g id="jArt"></g></g><g id="jFront"></g><g id="jUI"></g></g></svg>
        <svg id="dSvg" aria-hidden="true" hidden><g id="dMove"><g id="dTool"></g></g></svg>
        <svg id="dLines" aria-hidden="true" hidden></svg>
        <div id="dLabels" hidden></div>
        <div class="vtabs" role="group" aria-label="View"><button class="vtab" id="vUse" aria-pressed="true">Use it</button><button class="vtab" id="vParts" aria-pressed="false">Parts</button></div>
        <div class="tb-coach pj-banner" id="pjBanner" data-coach="info" hidden></div>
        <div class="pj-done" id="pjDone" role="dialog" aria-labelledby="pjDoneTitle" hidden>

            <h2 id="pjDoneTitle">Done! ✓</h2>
            <p id="pjDoneLine"></p>
            <a class="btn tb-go" id="pjBack" href="project.html">Back to the plan</a>
          </div>
        </div>
      </div>
      <div class="dinfo">
        <p class="duse" id="dUse"></p>
        <div class="drow"><div class="dread" id="dRead" aria-live="polite"></div><button class="btn again" id="dAgain" hidden>Again</button></div>
        <p class="dhint" id="dHint"></p>
        <p class="ddesc" id="dDesc" hidden></p>
        <a class="btn try" id="dTry" href="./" hidden><span>Try it!</span><small id="dTryAt"></small></a>
      </div>
    </div>
  </div>
</div>

<!-- Roll-up shop door -->
<div class="shutter down" id="shutter" aria-hidden="true"><div class="ssign">WORKSHOP</div><div class="shandle"></div><div class="sbar"></div></div>

<!-- Safety gear-up -->
<div class="gear" id="gear" hidden>
  <div class="gtop">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox" style="text-decoration:none"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
  </div>
  <div class="gcard">
    <div class="gtitle"><h2>Gear up!</h2><p>Put on your eye protection and ear protection.</p></div>
    <div class="gchar"><svg id="gChar" viewBox="10 4 280 326" role="img" aria-label="A worker getting ready"></svg></div>
    <div class="gtray">
      <div class="gslot" id="slotGog">
        <div class="gitem" id="itGog" data-item="gog" role="button" tabindex="0" aria-label="Eye protection"><svg viewBox="-120 -60 240 120" aria-hidden="true"></svg></div>
        <div class="glabel">Eye protection <span class="ok">✓</span></div>
      </div>
      <div class="gslot" id="slotMuf">
        <div class="gitem" id="itMuf" data-item="muf" role="button" tabindex="0" aria-label="Ear protection"><svg viewBox="-120 -125 240 175" aria-hidden="true"></svg></div>
        <div class="glabel">Ear protection <span class="ok">✓</span></div>
      </div>
      <button class="btn gopen" id="gOpen" hidden>Open the Workshop!</button>
    </div>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<script src="index.js"></script>
