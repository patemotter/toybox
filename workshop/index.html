<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workshop</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workshop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --peg: #C98F55;
  --peghole: #6A4220;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    --peg: #A8743F;
    --peghole: #4A2C12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  --peg: #A8743F;
  --peghole: #4A2C12;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.3;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button, a {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
svg { -webkit-user-select: none; user-select: none; }
.wrap {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
}
/* ---------- Header: Home, title, timer, grown-ups; station buttons under it ---------- */
.top {
  display: grid;
  grid-template-columns: auto 1fr auto auto auto;
  grid-template-areas: "home title pill big grown" "st st st st st";
  align-items: center;
  gap: 8px 10px;
  flex: none;
}
.top .homebtn { grid-area: home; }
.top h1 { grid-area: title; }
.top .tpill { grid-area: pill; }
.top .grownbtn { grid-area: grown; }
.top .bigwrap { grid-area: big; display: flex; }
/* Big: only the tool wall (and the Back button) stay. */
body.big .stations, body.big .tabs, body.big .top h1, body.big .top .homebtn, body.big .top .grownbtn { display: none; }
body.big .top { grid-template-columns: 1fr auto auto; grid-template-areas: ". pill big"; }
.stations { grid-area: st; }
.homebtn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 44px;
  padding: 2px 14px 2px 10px;
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--ink);
  text-decoration: none;
  background: var(--panel);
  border: 3px solid var(--edge);
  border-radius: 14px;
  box-shadow: 3px 3px 0 var(--edge);
}
.homebtn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--edge); }
.homebtn:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
.homebtn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.top h1 {
  margin: 0;
  font-size: 1.7rem;
  font-weight: 800;
  line-height: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
}
.top h1 .sub1 { color: var(--muted); font-weight: 700; font-size: 1.15rem; }
.gearbadge { width: 58px; height: 30px; flex: none; }
.grownbtn { min-height: 44px; font-size: 1rem; padding: 0.2rem 0.8rem; }
.tpill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 800;
  font-size: 1.15rem;
  background: var(--panel);
  border: 3px solid var(--edge);
  border-radius: 999px;
  padding: 2px 10px 2px 4px;
  min-height: 40px;
}
.tpill[hidden] { display: none; }
.tpill svg { width: 30px; height: 30px; }
.stations { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 10px; }
.station {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 56px;
  padding: 3px 8px;
  font-size: 1.2rem;
  font-weight: 800;
  line-height: 1.05;
  text-decoration: none;
  color: #1D2340;
  border-color: #1D2340;
  box-shadow: 4px 4px 0 var(--edge);
}
.station svg { width: 44px; height: 44px; flex: none; }
.station.s1 { background: #8CC4FF; }
.station.s2 { background: #FFB45E; }
.station.s3 { background: #FF8A8F; }
.station.s4 { background: #C9A7FF; }
.station.s5 { background: #7FDDB0; }
.station.s6 { background: #FFD84D; }
.station.s7 { background: #8FE3F0; }
.station.s8 { background: #FFB3D9; }
.station span { min-width: 0; }
/* ---------- Section tabs ---------- */
.tabs {
  flex: none;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  overflow-y: hidden;
  touch-action: pan-x;
  scrollbar-width: none;
  padding: 2px 4px 6px 2px;
  overscroll-behavior: contain;
}
.tabs::-webkit-scrollbar { display: none; }
.chip {
  flex: 1 0 74px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 0;
  font: inherit;
  font-weight: 800;
  font-size: 0.82rem;
  line-height: 1.05;
  color: var(--ink);
  background: var(--panel);
  border: 3px solid var(--edge);
  border-radius: 14px;
  padding: 3px 3px 5px;
  min-height: 72px;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--edge);
  text-align: center;
}
.chip svg { width: 38px; height: 38px; flex: none; }
.chip[aria-selected="true"] { background: var(--accent); color: #1D2340; border-color: #1D2340; }
.chip:active { transform: translate(2px, 2px); box-shadow: none; }
.chip:focus-visible { outline: 4px solid var(--focus); outline-offset: 1px; }
/* ---------- Pegboard ---------- */
.board {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  overscroll-behavior: contain;
  border: 4px solid var(--edge);
  border-radius: 24px;
  box-shadow: 5px 5px 0 var(--edge);
  background-color: var(--peg);
  padding: 0;
}
/* The holes are painted on the scrolling content itself, so they move exactly with the tools.
   (A background-attachment: local on the scroll box lags or jumps on iOS while scrolling.) */
.pegs {
  min-height: 100%;
  padding: 10px 12px 40px;
  background-image: radial-gradient(circle at 13px 13px, var(--peghole) 0 3.4px, rgba(0, 0, 0, 0) 4px);
  background-size: 26px 26px;
}
.sec { padding-top: 4px; }
.sec + .sec { margin-top: 10px; }
.sec h2 {
  display: inline-flex;
  max-width: 100%;
  white-space: nowrap;
  align-items: baseline;
  gap: 10px;
  margin: 2px 0 6px;
  padding: 2px 16px;
  font-size: 1.45rem;
  font-weight: 800;
  color: #1D2340;
  background: #F6DDB0;
  background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 60%);
  border: 3px solid #1D2340;
  border-radius: 10px;
  box-shadow: 3px 3px 0 rgba(29, 35, 64, 0.6);
}
.sec h2 small { font-size: 0.95rem; color: #6A4A20; font-weight: 700; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 6px 10px;
}
.tool {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  font: inherit;
  color: #1D2340;
  background: transparent;
  border: 0;
  padding: 0 0 4px;
  cursor: pointer;
  min-width: 0;
}
.tool svg.art { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; overflow: visible; }
.tool .tag {
  display: block;
  max-width: 100%;
  margin-top: -6px;
  padding: 1px 8px 2px;
  font-weight: 800;
  font-size: 1rem;
  line-height: 1.1;
  text-align: center;
  background: #FFF8E8;
  border: 3px solid #1D2340;
  border-radius: 10px;
  box-shadow: 2px 2px 0 rgba(29, 35, 64, 0.55);
}
.tool .tag small { display: block; font-size: 0.78rem; font-weight: 700; color: #5A4A30; }
.tool .go {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #1D2340;
  display: grid;
  place-items: center;
}
.tool .go::after { content: ""; border-left: 10px solid #1D2340; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }
.tool:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; border-radius: 14px; }
.tool.out .sw { opacity: 0; }
.tool.lift .sw { animation: lift 0.34s ease-out both; }
@keyframes lift { to { transform: translateY(-10px); opacity: 0.2; } }

/* ---------- Tool detail ---------- */
.detail {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: rgba(13, 20, 38, 0.55);
  touch-action: none;
}
.detail[hidden] { display: none; }
.dcard {
  width: 100%;
  max-width: 1240px;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 4px solid var(--edge);
  border-radius: 28px;
  box-shadow: 6px 6px 0 var(--edge);
  padding: 10px 12px 12px;
  gap: 8px;
  overflow: hidden;
  transform-origin: 50% 50%;
}
.dcard.zoom { transition: transform 0.5s cubic-bezier(0.25, 1.25, 0.45, 1), opacity 0.34s ease; }
.dhead { display: flex; align-items: center; gap: 10px; flex: none; min-width: 0; }
.dhead h2 { margin: 0; font-size: 2.1rem; font-weight: 800; line-height: 1; min-width: 0; }
.dcat {
  flex: none;
  font-weight: 800;
  font-size: 0.95rem;
  padding: 2px 10px;
  border-radius: 999px;
  border: 3px solid var(--edge);
  background: #F6DDB0;
  color: #1D2340;
}
.dhead .sp { flex: 1; }
.dclose { flex: none; font-size: 1.15rem; min-height: 54px; }
.dbody { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.dstage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  border: 3px solid var(--edge);
  border-radius: 20px;
  background-color: #F4FAFF;
  background-image: linear-gradient(rgba(45, 91, 215, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(45, 91, 215, 0.08) 1px, transparent 1px);
  background-size: 24px 24px;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
}
.dstage > * { position: absolute; }
#jSvg { inset: 0; width: 100%; height: 100%; overflow: hidden; display: block; }
#jSvg[hidden], #dSvg[hidden], #dLines[hidden], #dLabels[hidden] { display: none; }
.dstage.parts { cursor: default; }
.vtabs { top: 8px; left: 8px; display: flex; gap: 6px; z-index: 2; }
.vtab {
  font: 800 1rem/1 var(--font);
  min-height: 44px;
  padding: 4px 14px 5px;
  border-radius: 999px;
  border: 3px solid #1D2340;
  background: #FFFFFF;
  color: #1D2340;
  box-shadow: 2px 2px 0 rgba(29, 35, 64, 0.35);
  cursor: pointer;
  touch-action: manipulation;
}
.vtab[aria-pressed="true"] { background: var(--accent); }
.vtab:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
#dLines { inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#dSvg { overflow: visible; }
#dLabels { inset: 0; pointer-events: none; }
.plabel {
  position: absolute;
  pointer-events: none;
  font-weight: 800;
  font-size: 1rem;
  line-height: 1.1;
  color: #1D2340;
  background: #FFFFFF;
  border: 3px solid #1D2340;
  border-radius: 10px;
  padding: 1px 7px 2px;
  white-space: nowrap;
  box-shadow: 2px 2px 0 rgba(29, 35, 64, 0.35);
}
.dread {
  left: 10px;
  top: 10px;
  pointer-events: none;
  font-weight: 800;
  font-size: 1.6rem;
  line-height: 1.1;
  color: #1D2340;
  background: var(--accent);
  border: 3px solid #1D2340;
  border-radius: 14px;
  padding: 2px 12px 3px;
  box-shadow: 3px 3px 0 #1D2340;
  font-variant-numeric: tabular-nums;
}
.dread[hidden] { display: none; }
.dinfo .dread { align-self: flex-start; }
.dread.pop { animation: rpop 0.25s ease-out; }
@keyframes rpop { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }
.dinfo { flex: none; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.duse { margin: 0; font-size: 1.3rem; font-weight: 800; line-height: 1.25; }
.duse b { color: var(--muted); font-weight: 800; }
.drow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 48px; }
.drow .dread { position: static; }
.again { min-height: 56px; font-size: 1.3rem; background: #8EE07A; color: #1D2340; border-color: #1D2340; box-shadow: 4px 4px 0 var(--edge); }
.again[hidden], .ddesc[hidden], .drow[hidden] { display: none; }
.dread.done { background: #8EE07A; }
.ddesc { margin: 0; font-size: 1.25rem; font-weight: 700; line-height: 1.3; }
.dhint { margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--muted); }
.dhint::before { content: "👆 "; }
.dhint.done::before { content: "🎉 "; }
.try {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 64px;
  font-size: 1.5rem;
  font-weight: 800;
  text-decoration: none;
  background: var(--accent);
  color: #1D2340;
  border-color: #1D2340;
  box-shadow: 4px 4px 0 var(--edge);
}
.try[hidden] { display: none; }
.try small { font-size: 1rem; font-weight: 700; }
.try svg { width: 30px; height: 30px; flex: none; }

/* ---------- Shutter (the roll-up shop door) ---------- */
.shutter {
  position: fixed;
  inset: 0;
  z-index: 30;
  transform: translateY(-102%);
  transition: transform 2s cubic-bezier(0.55, 0, 0.25, 1);
  pointer-events: none;
  background-color: #AEB9C5;
  background-image:
    linear-gradient(90deg, rgba(29, 35, 64, 0.18) 0 10px, rgba(0, 0, 0, 0) 10px calc(100% - 10px), rgba(29, 35, 64, 0.18) calc(100% - 10px)),
    repeating-linear-gradient(180deg, #C3CCD6 0 26px, #E1E7ED 26px 29px, #8F9AA8 29px 33px, #A6B1BE 33px 38px);
  border-bottom: 5px solid #1D2340;
}
.shutter.down, .shutter.half { pointer-events: auto; }
.shutter.down { transform: translateY(0); }
.shutter.half { transform: translateY(-58%); }
.shutter .sbar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 54px;
  border-top: 5px solid #1D2340;
  background: repeating-linear-gradient(-45deg, #FFC93C 0 22px, #1D2340 22px 44px);
}
.shutter .shandle {
  position: absolute;
  left: 50%;
  bottom: 70px;
  width: 150px;
  height: 30px;
  margin-left: -75px;
  border: 5px solid #1D2340;
  border-bottom: 0;
  border-radius: 14px 14px 0 0;
}
.shutter .ssign {
  position: absolute;
  left: 50%;
  bottom: 118px;
  transform: translateX(-50%);
  font-weight: 800;
  font-size: clamp(2rem, 7vw, 3.4rem);
  letter-spacing: 0.06em;
  color: #1D2340;
  background: #FFC93C;
  border: 5px solid #1D2340;
  border-radius: 16px;
  padding: 0 22px;
  box-shadow: 5px 5px 0 #1D2340;
  white-space: nowrap;
}

/* ---------- Gear-up screen ---------- */
.gear {
  position: fixed;
  inset: 0;
  z-index: 31;
  display: flex;
  flex-direction: column;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  touch-action: none;
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.gear[hidden] { display: none; }
.gear.leaving { opacity: 0; transform: translateY(40px) scale(0.96); pointer-events: none; }
.gtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; }
.gcard {
  flex: 1 1 auto;
  min-height: 0;
  margin-top: 10px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "title" "char" "tray";
  gap: 8px;
  background: var(--panel);
  border: 4px solid var(--edge);
  border-radius: 28px;
  box-shadow: 6px 6px 0 var(--edge);
  padding: 12px 14px 16px;
  max-width: 900px;
  width: 100%;
  margin-left: auto;
  margin-right: auto;
}
.gtitle { grid-area: title; text-align: center; }
.gtitle h2 { margin: 0; font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 800; line-height: 1; }
.gtitle p { margin: 4px 0 0; font-size: clamp(1.15rem, 3.4vw, 1.5rem); font-weight: 700; color: var(--muted); }
.gchar { grid-area: char; position: relative; min-height: 0; align-self: stretch; justify-self: stretch; display: flex; align-items: center; justify-content: center; }
.gchar svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.gtray { grid-area: tray; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; position: relative; }
.gslot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: #F6DDB0;
  border: 3px solid #1D2340;
  border-radius: 20px;
  padding: 8px 6px 8px;
  color: #1D2340;
}
.gitem { width: min(300px, 100%); aspect-ratio: 2 / 1; touch-action: none; cursor: grab; position: relative; z-index: 2; }
.gitem svg { width: 100%; height: 100%; overflow: visible; display: block; pointer-events: none; }
.gitem.drag { z-index: 40; transition: none; }
.gitem.fly { transition: transform 0.3s cubic-bezier(0.3, 1.3, 0.5, 1); }
.gitem.back { transition: transform 0.35s cubic-bezier(0.3, 1.4, 0.5, 1); }
.gitem.gone { visibility: hidden; }
.glabel { font-weight: 800; font-size: clamp(1.15rem, 3.4vw, 1.5rem); line-height: 1.1; text-align: center; }
.glabel .ok { display: none; color: #1E7A43; }
.gslot.on { background: #BDF0C8; }
.gslot.on .ok { display: inline; }
.gopen {
  position: absolute;
  inset: 0;
  z-index: 3;
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  font-weight: 800;
  background: var(--accent);
  color: #1D2340;
  border: 4px solid #1D2340;
  box-shadow: 5px 5px 0 var(--edge);
  border-radius: 22px;
  animation: pulse 1.1s ease-in-out infinite;
}
.gopen[hidden] { display: none; }
@keyframes pulse { 50% { transform: scale(1.04); } }
.tgt { animation: tgtpulse 1.4s ease-in-out infinite; }
@keyframes tgtpulse { 50% { opacity: 0.25; } }
.popin { transform-box: fill-box; transform-origin: 50% 50%; animation: popin 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }
@keyframes popin { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
.hop { animation: hop 0.6s ease-out 2; transform-box: fill-box; transform-origin: 50% 100%; }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 40; pointer-events: none; }

<body>
<div class="wrap" id="wrap">
  <header class="top">
    <a class="homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg><span>Home</span></a>

      <a class="btn station s4" aria-label="Lathe" data-short="Lathe" href="lathe.html"><svg id="icoLA" aria-hidden="true"></svg><span>Lathe</span></a>
      <a class="btn station s5" aria-label="Router Table" data-short="Router" href="router-table.html"><svg id="icoRT" aria-hidden="true"></svg><span>Router Table</span></a>
      <a class="btn station s6" aria-label="Wrenches" data-short="Wrench" href="wrenches.html"><svg id="icoWR" aria-hidden="true"></svg><span>Wrenches</span></a>

<script>
(function () {

      "V" + n2(y + h - r) + "A" + n2(r) + " " + n2(r) + " 0 0 1 " + n2(x + w - r) + " " + n2(y + h) +
      "H" + n2(x + r) + "A" + n2(r) + " " + n2(r) + " 0 0 1 " + n2(x) + " " + n2(y + h - r) +
      "V" + n2(y + r) + "A" + n2(r) + " " + n2(r) + " 0 0 1 " + n2(x + r) + " " + n2(y) + "Z";

    shutter.classList.toggle("half", state === "half");
  }
  var NEXT = (function () {
    var q = {}, s = location.search.replace(/^\?/, "");
    s.split("&").forEach(function (kv) { var i = kv.indexOf("="); if (i > 0) { try { q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); } catch (e) { /* ignore */ } } });
    var page = ["drill-press", "saw-bench", "hammer-screws", "lathe", "router-table", "wrenches", "measuring", "shadow-board"].indexOf(q.next) !== -1 ? q.next : "";
    if (!page) return "";
    var tool = /^[a-z]{2,24}$/.test(q.tool || "") ? q.tool : "", bit = /^[a-z]{2,24}$/.test(q.bit || "") ? q.bit : "";
    return page + ".html" + (tool ? "?tool=" + tool : bit ? "?bit=" + bit : "");
  })();
  function itemTarget(el) { return el.dataset.item === "gog" ? { t: $("tGog"), i: $("iGog"), e: $("eGog"), slot: $("slotGog") } : { t: $("tMuf"), i: $("iMuf"), e: $("eMuf"), slot: $("slotMuf") }; }
  function overChar(x, y) {
    var r = $("gChar").getBoundingClientRect();
    return x > r.left - 20 && x < r.right + 20 && y > r.top - 20 && y < r.bottom + 20;
  }
  function gearDown(e) {
    var el = e.currentTarget;
    if (GEAR[el.dataset.item] || gearDrags[el.id] || locked()) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
    gearDrags[el.id] = { id: e.pointerId, sx: e.clientX, sy: e.clientY, dx: 0, dy: 0, moved: false };
    el.classList.remove("back", "fly");
    el.classList.add("drag");
    el.style.transform = "scale(1.1)";
    SND.tap();
  }
  function gearMove(e) {
    var el = e.currentTarget, d = gearDrags[el.id];
    if (!d || d.id !== e.pointerId) return;
    d.dx = e.clientX - d.sx; d.dy = e.clientY - d.sy;
    if (Math.abs(d.dx) + Math.abs(d.dy) > 10) d.moved = true;
    el.style.transform = "translate(" + d.dx + "px," + d.dy + "px) scale(1.1)";
    itemTarget(el).t.style.fill = "";
    itemTarget(el).t.style.opacity = overChar(e.clientX, e.clientY) ? "1" : "";
  }
  function gearUp(e) {
    var el = e.currentTarget, d = gearDrags[el.id];
    if (!d || d.id !== e.pointerId) return;
    delete gearDrags[el.id];
    el.classList.remove("drag");
    itemTarget(el).t.style.opacity = "";
    if (e.type === "pointercancel" && d.moved) { sendBack(el); return; }
    if (!d.moved || overChar(e.clientX, e.clientY)) putOn(el, d);
    else sendBack(el);
  }
  function sendBack(el) {
    el.classList.add("back");
    el.style.transform = "";
    SND.tok(0);
  }
  function putOn(el, d) {
    var tg = itemTarget(el);
    el.style.transform = "";
    var base = el.getBoundingClientRect(), gr = tg.i.getBoundingClientRect(), tr = tg.t.getBoundingClientRect();
    el.style.transform = "translate(" + d.dx + "px," + d.dy + "px) scale(1.1)";
    void el.offsetWidth;
    var s = gr.width ? tr.width / gr.width : 1, ce = [base.left + base.width / 2, base.top + base.height / 2], cg = [gr.left + gr.width / 2, gr.top + gr.height / 2],
      ct = [tr.left + tr.width / 2, tr.top + tr.height / 2];
    var Tx = ct[0] - ce[0] - s * (cg[0] - ce[0]), Ty = ct[1] - ce[1] - s * (cg[1] - ce[1]);
    el.classList.add("fly");
    el.style.transform = "translate(" + n2(Tx) + "px," + n2(Ty) + "px) scale(" + s.toFixed(3) + ")";
    GEAR[el.dataset.item] = true;
    setTimeout(function () {
      el.classList.add("gone");
      tg.e.style.display = "";
      tg.e.classList.remove("popin"); void tg.e.getBoundingClientRect(); tg.e.classList.add("popin");
      tg.t.style.display = "none";
      tg.slot.classList.add("on");
      burst(ct[0], ct[1], "confetti", 26);
      SND.snap();
      if (GEAR.gog && GEAR.muf) gearDone();
    }, reduce ? 60 : 300);
  }
  function gearDone() {
    setTimeout(function () {
      SND.chime();
      var c = $("charAll");
      c.classList.remove("hop"); void c.getBoundingClientRect(); if (!reduce) c.classList.add("hop");
      var r = $("gChar").getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height * 0.3, "confetti", 50);
      setTimeout(function () { $("gOpen").hidden = false; }, reduce ? 0 : 500);
    }, 250);
  }
  ["itGog", "itMuf"].forEach(function (id) {
    var el = $(id);
    el.addEventListener("pointerdown", gearDown);
    el.addEventListener("pointermove", gearMove);
    el.addEventListener("pointerup", gearUp);
    el.addEventListener("pointercancel", gearUp);
    el.addEventListener("keydown", function (e) {
      if ((e.key === "Enter" || e.key === " ") && !GEAR[el.dataset.item]) { e.preventDefault(); putOn(el, { dx: 0, dy: 0 }); }
    });
  });
  function showGear() {
    gearEl.hidden = false;
    gearEl.classList.remove("leaving");
    setShutter("down", 0);
  }
  var opening = false;
  $("gOpen").addEventListener("click", function () {
    if (opening || locked()) return;
    opening = true;
    setGearOn();
    $("gOpen").hidden = true;
    gearEl.classList.add("leaving");
    setTimeout(function () {
      setShutter("up", 2000);
      SND.shutter(1.7);
      for (var i = 0; i < 6; i++) burst(window.innerWidth * (i + 0.5) / 6, window.innerHeight - 30, "dust", 10, 0, -300);
    }, reduce ? 0 : 360);
    setTimeout(function () {
      gearEl.hidden = true;
      opening = false;
      if (NEXT) {
        // The full gear-up just happened: the station skips its safety check once.
        try { sessionStorage.setItem("workshop-check-skip", "1"); } catch (e) { /* ignore */ }
        location.replace(NEXT); return;
      }
      swings.forEach(function (s, i) { wake(s, (i % 2 ? 1 : -1) * (40 + Math.random() * 60)); });
    }, reduce ? 500 : 2000);
  });

  // ---------- Play timer hooks (the timer, sheet, toast and rest screen live in common/toybox.js) ----------
  // The timer is the shared Toybox one, so it keeps going on every Workshop page (and every app).
  // Ending: the shop door comes half down; "Close the shop" (or, with that button turned off, the
  // door by itself after a few seconds) rolls it shut, then the workshop rests.
  function locked() { return Toybox.timer.locked(); }
  var endingStartedAt = 0, closedAt = 0, endingDone = null;
  // Whether the grown-up chose the goodbye button (read-only peek at the shared timer settings).
  function goodbyeOn() {
    try { var t = JSON.parse(localStorage.getItem("toybox-timer-v1") || "null"); return !t || t.goodbye !== false; } catch (e) { return true; }
  }
  // Minutes-left pill at the top: the colored ring is the time left.
  function drawTimer(info) {
    var label = info.phase === "idle" ? "Grown-ups" : "⏱ Grown-ups";
    if ($("timerbtn2")) $("timerbtn2").textContent = label;
    var pill = $("tpill");
    var show = info.showMinutes && (info.phase === "running" || info.phase === "ending");
    pill.hidden = !show;
    if (!show) return;
    var f = info.fraction, mins = info.minutes;
    var col = f > 0.5 ? "#2E9E5B" : (f > 0.2 ? "#FFC93C" : "#F77F00"), sv = '<circle r="15" fill="none" stroke="rgba(127,140,170,0.35)" stroke-width="7"/>';
    if (f >= 0.999) sv += '<circle r="15" fill="none" stroke="' + col + '" stroke-width="7"/>';
    else if (f > 0.003) {
      var a = f * 2 * Math.PI;
      sv += '<path d="M0 -15 A15 15 0 ' + (a > Math.PI ? 1 : 0) + " 1 " + n2(15 * Math.sin(a)) + " " + n2(-15 * Math.cos(a)) + '" fill="none" stroke="' + col + '" stroke-width="7" stroke-linecap="round"/>';
    }
    $("tpillRing").innerHTML = sv;
    $("tpillNum").innerHTML = mins + '<span class="u"> min</span>';
  }
  function onEnding(done) {
    endingDone = done;
    endingStartedAt = now();
    closedAt = 0;
    closeDetail(true);
    gearEl.hidden = true;
    setShutter("half", 4000);
  }
  function closeShop() {
    if (closedAt) return;
    closedAt = now();
    setShutter("down", 1300);
    SND.shutter(1.2);
  }
  // Every frame while ending: the door comes down (by itself without the goodbye button), then it is done.
  function endingFrame() {
    if (!endingDone) return;
    var t = now();
    if (!closedAt && !goodbyeOn() && t - endingStartedAt > 4500) closeShop();
    if (closedAt && t - closedAt > 1500) { endingDone(); endingDone = null; }
  }
  function onRest() { endingDone = null; setShutter("down", 0); }
  // Back to play (stopped or unlocked): the door rolls up, or the gear-up comes back if it is not on.
  // Right after the long unlock press, ignore the click that the lifted finger makes.
  var clickBlockUntil = 0;
  function onWake() {

    endingDone = null; closedAt = 0;
    if (!gearIsOn()) showGear();

  }
  // Links are disabled while the timer winds down (and during the rest screen).
  document.addEventListener("click", function (e) {

    var a = e.target.closest && e.target.closest("a");

  }, true);
  // Rest picture: a workbench with the tools put away, fast asleep.
  function restArt() {
    return '<svg class="rest-art" viewBox="-250 -200 500 400" aria-hidden="true">' +
      R(-210, 30, 420, 34, WD, 8) + L(-200, 44, 200, 44, WDL, 4) + R(-190, 64, 30, 120, WDD, 4) + R(160, 64, 30, 120, WDD, 4) + R(-160, 130, 320, 18, WD, 4) +
      G("translate(-226 -108)", TOOL.panel.f({}, "ra")) + G("translate(10 -153)", G("rotate(-90 106 111)", TOOL.claw.f({}, "rb"))) +
      T(120, -120, "z", 44, "#2D5BD7") + T(160, -158, "z", 34, "#2D5BD7") + T(192, -188, "z", 24, "#2D5BD7") + "</svg>";
  }
  $("timerbtn2").addEventListener("click", function () { Toybox.openSheet(); });

  // ---------- Start ----------
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { if (!e.target.closest || !e.target.closest("input")) e.preventDefault(); });
  // The old Workshop sound key held "on"/"off"; the shared migration reads "1"/"true", so translate it once.
  try { if (localStorage.getItem("workshop-sound-v1") === "on") localStorage.setItem("workshop-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "workshop",
    grownButton: $("timerbtn"),
    grownLabel: ["Grown-ups", "⏱ Grown-ups"],
    big: { button: $("bigToggle") },
    sections: [$("tiltSection")],
    timerIntro: "When time is up, the shop door rolls down, the workshop rests, and the controls lock. The timer keeps going on every Workshop page.",
    goodbyeOption: "End with a “Close the shop” button to press",
    farewellText: "Time to close the shop",
    goodbyeLabel: "Close the shop",
    farewellDone: "Bye bye, tools!",
    restLine: "The workshop is resting.",
    restLine2: "The tools will be right here next time.",
    restArt: restArt,
    soundNote: "Soft tool sounds. Hold for 2 seconds.",
    legacy: { timer: "workshop-timer-v1", sound: "workshop-sound-v1" },
    onEnding: onEnding,
    onGoodbye: closeShop,
    onRest: onRest,
    onWake: onWake,
    onBig: function (on) { if (on) closeDetail(true); },
    onSound: function (on) { if (on) SND.chime(); else motorOff(); },
    onOpen: updateTiltUI,
    onTimer: drawTimer

  if (gearIsOn()) {
    if (NEXT && Toybox.timer.phase() !== "resting") { location.replace(NEXT); }

  }
