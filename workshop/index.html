<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workshop</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }

/* ---------- The workshop room (Toybox.map) ---------- */
.scene { background: #F3DEB8; touch-action: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; }
/* Map labels on the floor in front of each place; smaller when the places are drawn small. */
.tb-place-label { bottom: 4px; }
.scene.lbl-s .tb-place-label { font-size: 15px; gap: 4px; padding: 2px 8px 2px 4px; }
.scene.lbl-s .tb-place-label .tb-pic { width: 24px; height: 24px; }
/* The shadow board's painted outlines. */
.sil, .sil * { fill: #2F4A3E !important; stroke: #2F4A3E !important; }
.mach.hop { animation: hop2 0.55s ease-out; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes hop2 { 40% { transform: translateY(-16px); } 100% { transform: none; } }
.swingy { transform-box: fill-box; transform-origin: 50% 0; animation: swingy 1.1s ease-out; }
@keyframes swingy { 20% { transform: rotate(9deg); } 45% { transform: rotate(-7deg); } 70% { transform: rotate(4deg); } 100% { transform: none; } }
.puff { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; border-radius: 50%; border: 2px solid rgba(29, 35, 64, 0.35); }
.confetti { position: fixed; left: 0; top: 0; z-index: 70; width: 12px; height: 12px; border: 2px solid #1D2340; border-radius: 3px; pointer-events: none; }
body.big .tb-head > :not(.bigtoggle) { display: none; }
body.ending .homebtn, body.ending .tb-place { pointer-events: none; }
body.ending .homebtn, body.ending .tb-place-label { opacity: 0.4; }

/* ---------- Gear-up (Toybox.gate): one tap puts on the eye protection and the ear protection ---------- */
.tb-gate { background-color: #F3DEB8; }
.gate-home { position: absolute; z-index: 2; left: max(12px, env(safe-area-inset-left, 0px)); top: max(10px, env(safe-area-inset-top, 0px)); }
.tgt { animation: tgtpulse 1.4s ease-in-out infinite; }
@keyframes tgtpulse { 50% { opacity: 0.25; } }
@media (orientation: portrait) { .tb-gate-worker { width: min(70vw, 44vh, 400px); } }

/* ---------- The roll-up shop door (opens after the gear-up; comes down when the timer ends) ---------- */
.shutter {
  position: fixed;
  inset: 0;
  z-index: 29;
  transform: translateY(-102%);
  transition: transform 2s cubic-bezier(0.55, 0, 0.25, 1);
  pointer-events: none;
  background-color: #AEB9C5;
  background-image:
    linear-gradient(90deg, rgba(29, 35, 64, 0.18) 0 10px, rgba(0, 0, 0, 0) 10px calc(100% - 10px), rgba(29, 35, 64, 0.18) calc(100% - 10px)),
    repeating-linear-gradient(180deg, #C3CCD6 0 26px, #E1E7ED 26px 29px, #8F9AA8 29px 33px, #A6B1BE 33px 38px);
  border-bottom: 5px solid #1D2340;
}
.shutter.down, .shutter.half { pointer-events: auto; }
.shutter.down { transform: translateY(0); }
.shutter.half { transform: translateY(-58%); }
.shutter .sbar { position: absolute; left: 0; right: 0; bottom: 0; height: 54px; border-top: 5px solid #1D2340;
  background: repeating-linear-gradient(-45deg, #FFC93C 0 22px, #1D2340 22px 44px); }
.shutter .shandle { position: absolute; left: 50%; bottom: 70px; width: 150px; height: 30px; margin-left: -75px;
  border: 5px solid #1D2340; border-bottom: 0; border-radius: 14px 14px 0 0; }
.shutter .ssign { position: absolute; left: 50%; bottom: 118px; transform: translateX(-50%); font-weight: 800; font-size: clamp(2rem, 7vw, 3.4rem);
  letter-spacing: 0.06em; color: #1D2340; background: #FFC93C; border: 2px solid #1D2340; border-radius: 16px; padding: 0 22px; white-space: nowrap; }

/* Timer pieces above the gate and the door. */
.toast { top: max(70px, calc(env(safe-area-inset-top, 0px) + 70px)); z-index: 46; }
.farewell { z-index: 45; }
.rest-art { width: min(64vw, 260px); }

/* The labels run along the bottom of each row, so the coach line sits at the top (on the wall) everywhere. */
#coach.tb-coach { top: 8px; bottom: auto; }
@media (orientation: landscape) and (max-height: 520px) {
  .gate-home { top: 8px; }
  .shutter .ssign { bottom: 96px; }
}
@media (prefers-reduced-motion: reduce) {
  .shutter { transition-duration: 0.4s !important; }
  .tgt, .swingy { animation: none; }
}
</style>
</head>
<body>
<div class="tb-app-shell tb-v2">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Workshop</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>
  <div class="tb-body">
    <main class="tb-stage stage scene" id="scene">
      <svg id="map" role="img" aria-label="The workshop: a tool wall, a drill press, a saw bench, a hammer bench, a lathe, a router table, a bolt board, a measuring bench, a shadow board and the birdhouse plan"></svg>
      <div id="coach"></div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
  </div>
</div>

<!-- Roll-up shop door -->
<div class="shutter" id="shutter" aria-hidden="true"><div class="ssign">WORKSHOP</div><div class="shandle"></div><div class="sbar"></div></div>

<script>
(function () {
  "use strict";
  // ================= Drawing helpers and the tool drawings (the same ones as the Tool Wall, tool-wall.html) =================
  var O = "#1D2340";
  var STL = "#CBD4DE", STD = "#8E9BAA", STK = "#5D6878", SHN = "#F2F6FA", DRK = "#3A404C";
  var WD = "#DDA060", WDD = "#A9692E", WDL = "#F1C890";
  var YEL = "#FFC93C", ORG = "#F77F00", RED = "#E63946", BLU = "#2D5BD7", BLK = "#343944", GRN = "#2E9E5B";
  var BRS = "#E0B44C", CANE = "#E7C983", CANED = "#B98E3E", RUB = "#3B404C", MCH = "#3C7DD9", MCHD = "#4D5A6A";
  var FONT = "Baloo 2, Trebuchet MS, sans-serif";

  function n2(v) { return Math.round(v * 10) / 10; }
  function P(d, f, w, x) {
    return '<path d="' + d + '" fill="' + (f || "none") + '" stroke="' + O + '" stroke-width="' + (w == null ? 3 : w) +
      '" stroke-linejoin="round" stroke-linecap="round"' + (x || "") + "/>";
  }
  function F(d, f, x) { return '<path d="' + d + '" fill="' + f + '"' + (x || "") + "/>"; }
  function rr(x, y, w, h, r) {
    r = Math.max(0, Math.min(r || 0, w / 2, h / 2));
    if (!r) return "M" + n2(x) + " " + n2(y) + "h" + n2(w) + "v" + n2(h) + "h" + n2(-w) + "Z";
    return "M" + n2(x + r) + " " + n2(y) + "H" + n2(x + w - r) + "A" + n2(r) + " " + n2(r) + " 0 0 1 " + n2(x + w) + " " + n2(y + r) +
      "V" + n2(y + h - r) + "A" + n2(r) + " " + n2(r) + " 0 0 1 " + n2(x + w - r) + " " + n2(y + h) +
      "H" + n2(x + r) + "A" + n2(r) + " " + n2(r) + " 0 0 1 " + n2(x) + " " + n2(y + h - r) +
      "V" + n2(y + r) + "A" + n2(r) + " " + n2(r) + " 0 0 1 " + n2(x + r) + " " + n2(y) + "Z";
  }
  function R(x, y, w, h, f, r, sw) { return P(rr(x, y, w, h, r), f, sw); }
  function C(cx, cy, r, f, sw) {
    return '<circle cx="' + n2(cx) + '" cy="' + n2(cy) + '" r="' + n2(r) + '" fill="' + (f || "none") + '" stroke="' + O + '" stroke-width="' + (sw == null ? 3 : sw) + '"/>';
  }
  function Cf(cx, cy, r, f) { return '<circle cx="' + n2(cx) + '" cy="' + n2(cy) + '" r="' + n2(r) + '" fill="' + f + '"/>'; }
  function L(x1, y1, x2, y2, c, w, x) {
    return '<path d="M' + n2(x1) + " " + n2(y1) + "L" + n2(x2) + " " + n2(y2) + '" stroke="' + (c || O) + '" stroke-width="' + (w || 3) + '" stroke-linecap="round" fill="none"' + (x || "") + "/>";
  }
  // A thick stroked bar with a dark outline (draws the outline stroke first, then the color stroke).
  function bar(d, c, w) {
    return '<path d="' + d + '" fill="none" stroke="' + O + '" stroke-width="' + (w + 6) + '" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  function T(x, y, t, sz, f, anc, rot) {
    return '<text x="' + n2(x) + '" y="' + n2(y) + '" font-size="' + sz + '" font-weight="800" text-anchor="' + (anc || "middle") +
      '" dominant-baseline="central" fill="' + (f || O) + '" font-family="' + FONT + '"' + (rot ? ' transform="rotate(' + rot + " " + n2(x) + " " + n2(y) + ')"' : "") + ">" + t + "</text>";
  }
  function G(t, inner, cls, x) {
    return "<g" + (t ? ' transform="' + t + '"' : "") + (cls ? ' class="' + cls + '"' : "") + (x || "") + ">" + inner + "</g>";
  }
  function poly(a) {
    var s = "M" + n2(a[0]) + " " + n2(a[1]), i;
    for (i = 2; i < a.length; i += 2) s += " L" + n2(a[i]) + " " + n2(a[i + 1]);
    return s + " Z";
  }
  // Saw teeth from (x1,y1) to (x2,y2). Teeth point to the right of the travel direction by h.
  // rake > 0 leans the tips toward the travel direction, rake < 0 leans them back.
  function zig(x1, y1, x2, y2, n, h, rake) {
    var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy), ux = dx / len, uy = dy / len;
    var nx = -uy, ny = ux, seg = len / n, s = "", i, bx, by, f = 0.5 + (rake || 0) * 0.42;
    for (i = 0; i < n; i++) {
      bx = x1 + ux * seg * i; by = y1 + uy * seg * i;
      s += " L" + n2(bx) + " " + n2(by) + " L" + n2(bx + ux * seg * f + nx * h) + " " + n2(by + uy * seg * f + ny * h);
    }
    return s + " L" + n2(x2) + " " + n2(y2);
  }
  // Gear / saw-blade outline around (cx,cy).
  function gearD(cx, cy, r, n, h, hook) {
    var s = "", i, a, a2, a3;
    for (i = 0; i < n; i++) {
      a = i * 2 * Math.PI / n; a2 = a + (2 * Math.PI / n) * (hook ? 0.15 : 0.3); a3 = a + (2 * Math.PI / n) * (hook ? 0.2 : 0.6);
      s += (i ? " L" : "M") + n2(cx + r * Math.cos(a)) + " " + n2(cy + r * Math.sin(a)) +
        " L" + n2(cx + (r + h) * Math.cos(a2)) + " " + n2(cy + (r + h) * Math.sin(a2)) +
        (hook ? "" : " L" + n2(cx + (r + h) * Math.cos(a3)) + " " + n2(cy + (r + h) * Math.sin(a3)));
    }
    return s + " Z";
  }
  function star(cx, cy, r1, r2, n, rot) {
    var a = [], i, r, ang;
    for (i = 0; i < n * 2; i++) {
      r = i % 2 ? r2 : r1; ang = (rot || -90) * Math.PI / 180 + i * Math.PI / n;
      a.push(cx + r * Math.cos(ang), cy + r * Math.sin(ang));
    }
    return poly(a);
  }
  function hexD(cx, cy, r, rot) {
    var a = [], i, ang;
    for (i = 0; i < 6; i++) { ang = ((rot || 0) + i * 60) * Math.PI / 180; a.push(cx + r * Math.cos(ang), cy + r * Math.sin(ang)); }
    return poly(a);
  }
  // Animated or textured fills use <pattern>; ids get a per-drawing suffix so every SVG on the page is independent.
  function pat(id, w, h, inner, base, scroll) {
    return '<pattern id="' + id + '" patternUnits="userSpaceOnUse" width="' + w + '" height="' + h + '"' +
      (base ? ' patternTransform="' + base + '"' : "") +
      (scroll ? ' class="scr" data-v="' + scroll + '" data-w="' + w + " " + h + '" data-b="' + (base || "") + '"' : "") + ">" + inner + "</pattern>";
  }
  // Helical flutes for drill bits (slanted bands that scroll while the bit spins).
  function flutes(id, pitch, dark, light, slant) {
    return pat(id, 400, pitch, '<rect width="400" height="' + pitch + '" fill="' + (light || STL) + '"/><rect y="0" width="400" height="' + n2(pitch * 0.42) + '" fill="' + (dark || STD) + '"/><rect y="' + n2(pitch * 0.42) + '" width="400" height="2.5" fill="' + O + '" opacity="0.55"/>', "skewY(" + (slant || -28) + ")", "0 " + pitch);
  }
  function shine(x1, y1, x2, y2, w) { return L(x1, y1, x2, y2, "#FFFFFF", w || 3, ' opacity="0.7"'); }

  // ---------- Handles ----------
  function caneHandle(x, y, len, h) {
    var s = R(x, y - h / 2, len, h, CANE, h / 2), i;
    for (i = 8; i < len - 6; i += 7) s += L(x + i, y - h / 2 + 2.5, x + i - 4, y + h / 2 - 2.5, CANED, 2.2);
    return s + R(x, y - h / 2, len, h, "none", h / 2);
  }
  // Closed "D" handle of a Western saw; (x, y) is where the top of the handle meets the blade.
  function dHandle(x, y, k) {
    k = k || 1;
    function p(a, b) { return n2(x + a * k) + " " + n2(y + b * k); }
    var outer = "M" + p(0, -8) + " C" + p(26, -22) + " " + p(58, -18) + " " + p(70, -2) + " L" + p(66, 18) + " C" + p(58, 40) + " " + p(64, 62) + " " + p(76, 80) +
      " C" + p(60, 92) + " " + p(28, 90) + " " + p(12, 82) + " C" + p(4, 64) + " " + p(0, 50) + " " + p(-2, 40) + " Z";
    var hole = "M" + p(24, 8) + " C" + p(40, 2) + " " + p(50, 6) + " " + p(50, 16) + " C" + p(44, 34) + " " + p(46, 52) + " " + p(52, 66) +
      " C" + p(42, 72) + " " + p(32, 70) + " " + p(28, 62) + " C" + p(30, 42) + " " + p(26, 24) + " " + p(24, 8) + " Z";
    return P(outer + " " + hole, WD, 3, ' fill-rule="evenodd"') + L(x + 6 * k, y + 2 * k, x + 18 * k, y - 8 * k, WDL, 3) +
      C(x + 10 * k, y + 10 * k, 4.5 * k, BRS, 2) + C(x + 12 * k, y + 34 * k, 4.5 * k, BRS, 2);
  }
  function pistolGrip(x, y, k, col) {
    k = k || 1;
    function p(a, b) { return n2(x + a * k) + " " + n2(y + b * k); }
    return P("M" + p(0, -8) + " C" + p(22, -16) + " " + p(40, -8) + " " + p(42, 6) + " L" + p(36, 18) + " C" + p(32, 38) + " " + p(42, 56) + " " + p(52, 72) +
      " C" + p(40, 82) + " " + p(22, 78) + " " + p(16, 70) + " C" + p(10, 50) + " " + p(4, 36) + " " + p(-2, 30) + " Z", col || WD) +
      C(x + 9 * k, y + 8 * k, 4 * k, BRS, 2);
  }
  // Classic fluted screwdriver handle (vertical) centered on cx.
  function sdHandle(cx, top, col) {
    var s = R(cx - 19, top, 38, 70, col, 16), i;
    for (i = -10; i <= 10; i += 10) s += L(cx + i, top + 12, cx + i, top + 58, "rgba(29,35,64,0.35)", 4);
    s += R(cx - 19, top, 38, 70, "none", 16);
    s += R(cx - 11, top + 68, 22, 10, STL, 3);
    return s;
  }
  // Round "Tip" inset showing a screwdriver or key tip from the end; it turns when you twist.
  function tipInset(cx, cy, inner) {
    return G("", C(cx, cy, 25, "#FFFFFF", 3) + G("", inner, "twi", ' data-c="' + cx + " " + cy + '"') + T(cx, cy + 34, "TIP", 10, O));
  }
  // Power tool battery pack.
  function battery(x, y, w, col) {
    return R(x, y, w, 30, BLK, 6) + R(x + 6, y + 6, w - 12, 8, col || YEL, 3) + L(x + 10, y + 22, x + w - 10, y + 22, "#5A6070", 3);
  }
  function vents(x, y, n, gap, len) {
    var s = "", i;
    for (i = 0; i < n; i++) s += L(x + i * gap, y, x + i * gap, y + len, O, 3);
    return s;
  }

  // ================= The tools =================
  // n: name, sec: section, z: small subtitle (sizes), d: what it is for, p: labeled parts [label, x, y] (or a function of the state),
  // f(s, u): drawing (s = interactive state, u = unique id suffix), pl: how it plays in the big view, st: station page.
  var SECTIONS = [
    ["saws", "Saws"], ["power", "Power saws"], ["drills", "Drills & bits"], ["hammers", "Hammers"],
    ["drivers", "Screwdrivers & drivers"], ["wrenches", "Wrenches & sockets"], ["measure", "Measuring & marking"],
    ["planes", "Planes & chisels"], ["files", "Files & rasps"], ["clamps", "Clamps & vises"], ["sanders", "Sanders"],
    ["machines", "Big machines"]
  ];
  var SHORT = { saws: "Saws", power: "Power saws", drills: "Drills & bits", hammers: "Hammers", drivers: "Screw&shy;drivers",
    wrenches: "Wrenches", measure: "Measuring", planes: "Planes & chisels", files: "Files & rasps", clamps: "Clamps & vises",
    sanders: "Sanders", machines: "Big machines" };
  var STATIONS = {
    "drill-press": { name: "Drill Press", file: "drill-press.html" },
    "saw-bench": { name: "Saw Bench", file: "saw-bench.html" },
    "hammer-screws": { name: "Hammer & Screws", file: "hammer-screws.html" },
    "lathe": { name: "Lathe", file: "lathe.html" },
    "router-table": { name: "Router Table", file: "router-table.html" },
    "wrenches": { name: "Bolt Board", file: "wrenches.html" },
    "measuring": { name: "Measuring bench", file: "measuring.html" },
    "shadow-board": { name: "Shadow Board", file: "shadow-board.html" }
  };
  var TOOLS = [];
  function add(sec, t) { t.sec = sec; TOOLS.push(t); }

  // ---------- Hand saws ----------
  function japBlade(top, bottom, ripTop) {
    // Blade tapers from the tip (left, x=12) to the neck (x=128); handle on the right.
    var s = "M128 " + top[1] + " L12 " + top[0];
    s = ripTop ? "M128 " + top[1] + zig(128, top[1], 12, top[0], 11, 7, -0.8) : s;
    s += " L12 " + bottom[0] + zig(12, bottom[0], 128, bottom[1], 30, 4, 0.8) + " Z";
    return s;
  }
  add("saws", { id: "panel", n: "Panel saw", z: "Western hand saw",
    d: "The classic Western (American) hand saw. Its teeth lean toward the far end, so it cuts on the push stroke.",
    p: [["Toe", 10, 112], ["Blade", 64, 104], ["Teeth", 60, 140], ["Saw nuts", 128, 78], ["Handle", 168, 116]],
    f: function () {
      return P("M126 56 L8 96 L8 136" + zig(8, 136, 126, 136, 24, 6, -0.75) + " Z", STL) + shine(20, 112, 110, 112) +
        dHandle(118, 66);
    },

    return (strap === "head" ? R(-96, -8, 192, 16, BLK, 7) : strap === "loose" ? P("M-64 -2 C-118 -14 -120 46 -64 30 M64 -2 C118 -14 120 46 64 30", "none", 9) + P("M-64 -2 C-118 -14 -120 46 -64 30 M64 -2 C118 -14 120 46 64 30", "none", 4, ' stroke="' + BLK + '"') : "") +
      P(rr(-68, -30, 136, 60, 27), YEL, 4) + P(rr(-60, -22, 54, 44, 19), "#B9E4FF", 3) + P(rr(6, -22, 54, 44, 19), "#B9E4FF", 3) +
      L(-48, -10, -36, -15, "#FFFFFF", 5) + L(18, -10, 30, -15, "#FFFFFF", 5) + P("M-10 30 Q0 16 10 30", "#F5C9A0", 3);
  }
  function muffsArt() {
    return bar("M-88 -2 C-88 -150 88 -150 88 -2", BLK, 10) +
      R(-112, -32, 40, 66, ORG, 18) + R(-80, -26, 10, 54, BLK, 5) + L(-104, -18, -104, 20, "#FFC37A", 4) +
      R(72, -32, 40, 66, ORG, 18) + R(70, -26, 10, 54, BLK, 5) + L(104, -18, 104, 20, "#FFC37A", 4);
  }
  // The worker (in a 3:4 frame, the gate's viewBox), with faint outlines where the gear goes.
  var WORKER_VB = "0 -40 300 400";
  function workerArt() {
    return P("M26 330 Q34 248 150 238 Q266 248 274 330 Z", "#F77F00") +
      P("M92 330 L98 268 L202 268 L208 330 Z", BLU) + L(104, 270, 84, 246, BLU, 12) + L(196, 270, 216, 246, BLU, 12) +
      C(104, 272, 5, YEL, 2) + C(196, 272, 5, YEL, 2) + R(128, 284, 44, 30, "#4A73DF", 6) + R(148, 270, 8, 22, RED, 2, 2.5) +
      R(128, 210, 44, 40, SKIN, 12) + C(60, 142, 17, SKIN) + C(240, 142, 17, SKIN) + C(150, 138, 92, SKIN) +
      P("M60 128 Q56 46 150 42 Q244 46 240 128 Q228 92 198 84 Q172 102 142 86 Q100 78 60 128 Z", HAIR) +
      L(98, 106, 128, 100, HAIR, 7) + L(172, 100, 202, 106, HAIR, 7) +
      C(114, 134, 11, O, 0) + Cf(118, 130, 4, "#FFFFFF") + C(186, 134, 11, O, 0) + Cf(190, 130, 4, "#FFFFFF") +
      P("M146 148 Q150 160 158 152", "none", 4) + Cf(92, 168, 14, "rgba(242,108,167,0.35)") + Cf(208, 168, 14, "rgba(242,108,167,0.35)") +
      P("M116 176 Q150 210 184 176 Q150 192 116 176 Z", "#C2405A", 4) +
      G("translate(150 134)", P(rr(-68, -30, 136, 60, 27), "rgba(255,255,255,0.4)", 4, ' stroke-dasharray="10 8"'), "tgt") +
      G("translate(150 142)", P("M-88 -2 C-88 -150 88 -150 88 -2", "none", 4, ' stroke-dasharray="10 8"') + P(rr(-112, -32, 40, 66, 18), "rgba(255,255,255,0.4)", 4, ' stroke-dasharray="10 8"') +
        P(rr(72, -32, 40, 66, 18), "rgba(255,255,255,0.4)", 4, ' stroke-dasharray="10 8"'), "tgt");
  }
  var gt = null;
  function gateOpen() { return !!(gt && !gt.el.hidden); }
  function showGate() {
    if (gt && gt.el.parentNode) gt.el.parentNode.removeChild(gt.el);
    setShutter("down", 0);
    gt = Toybox.gate({
      flag: GEAR_KEY,
      title: "Gear up!",
      viewBox: WORKER_VB,
      worker: workerArt(),
      workerLabel: "Put on the eye protection and the ear protection",
      hint: "Tap the worker to gear up!",
      ms: 1400,
      items: [
        { id: "eyes", name: "Eye protection", art: '<svg viewBox="-124 -64 248 128">' + gogglesArt("loose") + "</svg>", onArt: G("translate(150 134)", gogglesArt("head")) },
        { id: "ears", name: "Ear protection", art: '<svg viewBox="-120 -128 240 176">' + muffsArt() + "</svg>", onArt: G("translate(150 142)", muffsArt()) }
      ],
      onPut: function () { if (ghost) ghost.learned("gate"); snap(); },
      done: openShop
    });
    // A way home for the grown-up (nothing traps him).
    var home = document.createElement("a");
    home.className = "btn tb-iconbtn gate-home";
    home.href = "../";
    home.setAttribute("aria-label", "Back to Toybox");
    home.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>';
    gt.el.appendChild(home);
    gt.el.classList.add("tb-v2");
    if (ghost) ghost.again("gate");
  }
  // Dressed: confetti, then the shop door rolls up on the workshop (or straight on to the page he was going to).
  function openShop() {
    var w = gt && gt.el.querySelector(".tb-gate-worker");
    if (w) { var r = w.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height * 0.3, 40); }
    chime();
    if (NEXT && !locked()) { location.replace(NEXT); return; }
    setShutter("up", 1600);
    rattle();
    coach.say("The workshop is open!", 3);
    if (ghost) ghost.again("map");
  }

  // ---------- Sound (off by default; soft and synthesized) ----------
  var master = null, masterCtx = null;
  function out(ac) { if (masterCtx !== ac) { master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination); masterCtx = ac; } return master; }
  function tone(freq, dur, vol, type, slideTo, delay) {
    var ac = Toybox.sound.ready();
    if (!ac) return;
    var t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out(ac));
    o.start(t); o.stop(t + dur + 0.05);
  }
  function snap() { tone(700, 0.14, 0.05, "sine", 1300); }
  function whir() { tone(140, 0.4, 0.03, "sawtooth", 260); }
  function chime() { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.4, 0.04, "sine", null, i * 0.1); }); }
  function rattle() { for (var i = 0; i < 10; i++) tone(rand(150, 210), 0.07, 0.025, "triangle", null, i * 0.12); }

  // ---------- Play timer hooks ----------
  // Ending: the shop door comes half down; "Close the shop" (or, with that button off, the door by itself after
  // a few seconds) rolls it shut, then the workshop rests.
  function locked() { return Toybox.timer.locked(); }
  var endingDone = null, endingT = null;
  function goodbyeOn() {
    try { var t = JSON.parse(localStorage.getItem("toybox-timer-v1") || "null"); return !t || t.goodbye !== false; } catch (e) { return true; }
  }
  function onEnding(done, info) {
    endingDone = done;
    if (gt) gt.hide();
    setShutter("half", 4000);
    clearTimeout(endingT);
    if (!(info && info.goodbye) && !goodbyeOn()) endingT = setTimeout(closeShop, 4500);
  }
  function closeShop() {
    clearTimeout(endingT);
    setShutter("down", 1300);
    rattle();
    endingT = setTimeout(function () { if (endingDone) { endingDone(); endingDone = null; } }, 1500);
  }
  function onWake() {
    endingDone = null; clearTimeout(endingT);
    if (!gearIsOn()) { if (!gateOpen()) showGate(); }
    else { setShutter("up", 1500); rattle(); }
  }
  // Rest picture: a workbench with the tools put away, fast asleep.
  function restArt() {
    return '<svg class="rest-art" viewBox="-250 -200 500 400" aria-hidden="true">' +
      R(-210, 30, 420, 34, WD, 8) + L(-200, 44, 200, 44, WDL, 4) + R(-190, 64, 30, 120, WDD, 4) + R(160, 64, 30, 120, WDD, 4) + R(-160, 130, 320, 18, WD, 4) +
      G("translate(-226 -108)", TOOL.panel.f({}, "ra")) + G("translate(10 -153)", G("rotate(-90 106 111)", TOOL.claw.f({}, "rb"))) +
      T(120, -120, "z", 44, "#2D5BD7") + T(160, -158, "z", 34, "#2D5BD7") + T(192, -188, "z", 24, "#2D5BD7") + "</svg>";
  }

  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { if (!e.target.closest || !e.target.closest(".sheet")) e.preventDefault(); }, { passive: false });

  var buildPending = false, lastSize = "";
  function scheduleBuild() {
    if (buildPending) return;
    buildPending = true;
    requestAnimationFrame(function () {
      buildPending = false;
      var key = scene.clientWidth + "x" + scene.clientHeight;
      if (key === lastSize) return;
      lastSize = key;
      buildMap();
    });
  }
  window.addEventListener("resize", scheduleBuild);
  window.addEventListener("orientationchange", function () { setTimeout(scheduleBuild, 200); });

  // ---------- Coach and ghost hand ----------
  var coach = Toybox.coach($("coach"));
  coach.step("Tap the Tool Wall!");
  function midOf(el) { var r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
  var ghost = Toybox.ghost({
    max: 2,
    plan: function () {
      if (gateOpen()) {
        var w = gt.el.querySelector(".tb-gate-worker");
        return w ? { pts: [midOf(w)], tap: true, key: "gate" } : null;
      }
      if (shutter.classList.contains("down")) return null;
      var a = mp && mp.places[0];
      return a && !a.hidden ? { pts: [midOf(a)], tap: true, key: "map" } : null;
    }
  });

  // ---------- Start ----------
  // The old Workshop sound key held "on"/"off"; the shared migration reads "1"/"true", so translate it once.
  try { if (localStorage.getItem("workshop-sound-v1") === "on") localStorage.setItem("workshop-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "workshop",
    big: { button: $("bigToggle") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the shop door rolls down, the workshop rests, and the controls lock. The timer keeps going on every Workshop page.",
    goodbyeOption: "End with a “Close the shop” button to press",
    farewellText: "Time to close the shop",
    goodbyeLabel: "Close the shop",
    farewellDone: "Bye bye, tools!",
    restLine: "The workshop is resting.",
    restLine2: "The tools will be right here next time.",
    restArt: restArt,
    soundNote: "Soft tool sounds. Hold for 2 seconds.",
    legacy: { timer: "workshop-timer-v1", sound: "workshop-sound-v1" },
    onEnding: onEnding,
    onGoodbye: closeShop,
    onRest: function () { endingDone = null; setShutter("down", 0); },
    onWake: onWake,
    onBig: function () { lastSize = ""; scheduleBuild(); },
    onSound: function (on) { if (on) chime(); }
  });
  makeMap();
  scheduleBuild();
  if (gearIsOn()) {
    if (NEXT && Toybox.timer.phase() !== "resting") { location.replace(NEXT); }
    setShutter(locked() ? "down" : "up", 0);
  } else if (Toybox.timer.phase() !== "resting") {
    showGate();
  } else {
    setShutter("down", 0);
  }

  // Test hooks, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) {
    window.__workshop = {
      layout: function () { return Lay && { cols: Lay.l.cols, rows: Lay.l.rows, s: Lay.s }; },
      next: function () { return NEXT; },
      gate: function () { return { open: gateOpen(), eyes: gt ? gt.isOn("eyes") : null, ears: gt ? gt.isOn("ears") : null, on: gearIsOn() }; },
      ghost: function () { return ghost.show(); }
    };
  }
})();
</script>
</body>
</html>
