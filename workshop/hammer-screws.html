<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hammer &amp; Screws</title>
<script>
  // Safety gear first: the Tool Wall puts on goggles and ear muffs once per visit.
  (function () {
    var tool = "", pj = "";
    try {
      var sp = new URLSearchParams(location.search);
      tool = sp.get("tool") || "";
      pj = sp.get("project") || "";
    } catch (e) { tool = ""; }
    try {
      if (!pj && sessionStorage.getItem("workshop-gear") !== "on") {
        location.replace("./?next=hammer-screws" + (tool ? "&tool=" + encodeURIComponent(tool) : ""));
      }
    } catch (e) { /* storage unavailable: treat gear as on */ }
  })();
</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.3;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.wrap {
  height: 100%;
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
}

/* ---------- Header ---------- */
header { flex: none; display: flex; align-items: center; gap: 8px; }
header h1 {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0 2px;
  font-size: clamp(1.15rem, 3.2vw, 1.9rem);
  font-weight: 800;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.homebtn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 44px;
  padding: 2px 12px 2px 9px;
  font-weight: 700;
  font-size: 1rem;
  color: var(--ink);
  text-decoration: none;
  background: var(--panel);
  border: 3px solid var(--edge);
  border-radius: 12px;
  box-shadow: 2px 2px 0 var(--edge);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.homebtn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }
.homebtn:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
.homebtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.wallbtn { background: var(--accent); color: #1D2340; }
.gear {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 0 8px 0 4px;
  min-height: 38px;
  border: 3px solid var(--edge);
  border-radius: 999px;
  background: #FFE9A8;
  color: #1D2340;
  font-weight: 800;
  font-size: 0.85rem;
  white-space: nowrap;
}
.gear svg { width: 50px; height: 30px; display: block; }
header .bigtoggle { flex: none; min-height: 44px; }
/* ---------- Standard app shell (common/toybox.css) ---------- */
.tb-head a { text-decoration: none; }
.tb-head .bigtoggle { border-radius: 16px; }
/* Big: only the workbench (and the Big button) stay. */
body.big .tb-head > :not(.bigtoggle), body.big .panel { display: none; }
/* The Hammer / Screw tabs (and the phone sub-tabs) are the tab bar: last in the panel. */
.panel .modetabs, .panel .subtabs { order: 9; }

/* ---------- Main layout ---------- */
.app { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; padding-bottom: 10px; }
.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
  background: #C49460;
  touch-action: none;
  container-type: size;
}
#cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ov { position: absolute; z-index: 2; pointer-events: none; display: flex; gap: 6px; }
.ov.tl { left: 8px; top: 8px; align-items: center; max-width: 62%; }
.ov.tr { right: 8px; top: 8px; flex-direction: column; align-items: flex-end; }
.pill {
  background: rgba(255, 255, 255, 0.94);
  color: #1D2340;
  border: 3px solid #1D2340;
  border-radius: 16px;
  padding: 2px 12px;
  font-weight: 800;
  box-shadow: 3px 3px 0 #1D2340;
}
.toolname { font-size: clamp(0.85rem, 2.3vmin, 1.4rem); font-size: clamp(0.8rem, 3.7cqmin, 1.45rem); line-height: 1.12; }
.toolname small { display: block; font-size: 0.7em; font-weight: 700; color: #4A5578; }
.readout { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.05; padding: 4px 12px 5px; }
.readout b { font-size: clamp(1.1rem, 3.4vmin, 2.1rem); font-size: clamp(1.05rem, 5.6cqmin, 2.2rem); font-variant-numeric: tabular-nums; }
.readout span { font-size: clamp(0.7rem, 1.8vmin, 1rem); font-size: clamp(0.66rem, 2.5cqmin, 1rem); font-weight: 700; color: #4A5578; }
.readout span:empty { display: none; }
/* The coach: one big line that always says what to do next. */
.coach {
  position: absolute;
  z-index: 3;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 20px);
  display: flex;
  align-items: center;
  gap: 0.4em;
  padding: 0.2em 0.85em 0.2em 0.22em;
  background: #FFFFFF;
  color: #1D2340;
  border: 4px solid #1D2340;
  border-radius: 999px;
  box-shadow: 4px 4px 0 #1D2340;
  font-weight: 800;
  font-size: clamp(1rem, 4.3cqmin, 1.8rem);
  line-height: 1.05;
  pointer-events: none;
}
.coach .num {
  flex: none;
  width: 1.7em;
  height: 1.7em;
  border-radius: 50%;
  background: #FFC93C;
  border: 3px solid #1D2340;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.95em;
}
.coach .ctext { display: flex; flex-direction: column; min-width: 0; }
.coach small { font-size: 0.6em; font-weight: 700; color: #4A5578; line-height: 1.15; }
.coach small:empty { display: none; }
.coach.ok .num { background: #7CFF8A; }
.coach.flash { background: #FFE9A8; }
.coach.flash .num { background: #F77F00; color: #FFFFFF; }
.coach.pop .num { animation: numpop 0.45s ease-out; }
@keyframes numpop { 0% { transform: scale(0.6); } 55% { transform: scale(1.25); } 100% { transform: scale(1); } }
.stage { --tsz: clamp(104px, 23cqmin, 164px); }
.stage.pow .coach { left: 10px; transform: none; max-width: calc(100% - var(--tsz) - 34px); }
#gcv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; z-index: 4; pointer-events: none; }
.tring { width: 52px; height: 52px; display: block; }
.trigger {
  position: absolute;
  right: 10px;
  bottom: 10px;
  z-index: 3;
  width: var(--tsz);
  height: var(--tsz);
  border-radius: 50%;
  border: 5px solid #1D2340;
  background: #FFC93C;
  color: #1D2340;
  font: inherit;
  font-weight: 800;
  font-size: calc(var(--tsz) * 0.15);
  line-height: 1;
  box-shadow: 5px 5px 0 #1D2340;
  touch-action: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.12em;
  padding: 0;
}
.trigger b { font-size: 1.45em; }
.trigger.on { transform: translate(4px, 4px); box-shadow: 1px 1px 0 #1D2340; background: #F77F00; color: #FFFFFF; }
.trigger.nudge:not(.on) { animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 50% { box-shadow: 5px 5px 0 #1D2340, 0 0 0 10px rgba(255, 201, 60, 0.75); } }
.camout {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 74px;
  transform: translateX(-50%);
  width: min(94%, 460px);
  background: #FFFFFF;
  color: #1D2340;
  border: 3px solid #1D2340;
  border-radius: 20px;
  box-shadow: 4px 4px 0 #1D2340;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.camout svg { width: 116px; height: 58px; flex: none; }
.camout .cbody { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.camout p { margin: 0; font-weight: 700; font-size: clamp(0.85rem, 2vw, 1.05rem); line-height: 1.15; }
.camout .btn { min-height: 46px; font-size: 1rem; padding: 0.15rem 0.7rem; background: #FFC93C; color: #1D2340; border-color: #1D2340; box-shadow: 3px 3px 0 #1D2340; }

/* ---------- Panel ---------- */
.panel {
  flex: none;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.modetabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modetab {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 58px;
  padding: 0.15rem 0.4rem;
  font-size: clamp(0.95rem, 2.3vw, 1.25rem);
  font-weight: 800;
  line-height: 1.05;
}
.modetab svg { width: 46px; height: 42px; flex: none; }
.pane { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
/* Every set of controls shares one spot, so the workbench never changes size. */
.panes, .stack { display: grid; }
.panes > *, .stack > * { grid-area: 1 / 1; min-width: 0; }
.stack { align-items: center; }
.off { visibility: hidden; pointer-events: none; }
.tools { display: grid; grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr)); gap: 6px; }
.tools.h { --cols: 6; }
.tools.d { --cols: 7; }
.tool {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 3px 2px 3px;
  min-height: 0;
  min-width: 0;
  font-size: clamp(0.7rem, 1.75vw, 0.92rem);
  line-height: 1.02;
  text-align: center;
  border-radius: 14px;
}
.tool svg { width: 100%; height: var(--ih, 52px); display: block; }
.tool span { min-height: 2.04em; display: flex; align-items: center; justify-content: center; }
.tool.pulse { animation: pulse 0.7s ease-in-out 4; }
@keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 0 6px #F77F00; } }
.ctx { display: flex; flex-direction: column; gap: 8px; min-height: var(--ctxh, 0); justify-content: center; }
.lbl { margin: 0; font-weight: 800; font-size: 0.95rem; color: var(--muted); }
.step { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 800; font-size: clamp(1rem, 1.9vw, 1.2rem); color: var(--ink); line-height: 1.1; }
.step b, .sn { flex: none; width: 1.55em; height: 1.55em; border-radius: 50%; background: var(--accent); color: #1D2340; border: 3px solid var(--edge); display: inline-flex; align-items: center; justify-content: center; font-size: 0.9em; font-weight: 800; }
.sn { width: 1.45em; height: 1.45em; border-width: 2px; margin-right: 4px; background: #FFFFFF; }
[aria-pressed="true"] > .sn { background: #FFFFFF; }
.bitlbl { grid-column: 1 / -1; }
.dirseg .btn b { font-size: 1.35em; line-height: 1; }
.nails { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.nailbtn { display: flex; flex-direction: column; align-items: center; padding: 2px 2px 3px; min-height: 0; font-size: clamp(0.7rem, 1.7vw, 0.9rem); line-height: 1.02; border-radius: 14px; }
.nailbtn svg { height: var(--nh, 50px); width: 100%; display: block; }
.nailbtn b { font-weight: 800; }
.nailbtn small { font-size: 0.85em; color: var(--muted); }
.nailbtn[aria-pressed="true"] small { color: #1D2340; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.seg .btn { min-height: 50px; padding: 0.2rem 0.4rem; font-size: clamp(0.85rem, 2vw, 1.05rem); display: flex; align-items: center; justify-content: center; gap: 4px; line-height: 1.05; }
.seg .btn svg { width: 34px; height: 30px; flex: none; }
.row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; justify-content: center; }
.row > .btn { flex: 1 1 0; min-width: 0; }
.note { margin: 0; text-align: center; font-weight: 700; color: var(--muted); font-size: clamp(0.85rem, 2vw, 1rem); }
.tray { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) ; gap: 6px; }
.headbtn { display: flex; flex-direction: column; align-items: center; padding: 3px 2px; min-height: 0; font-size: clamp(0.68rem, 1.65vw, 0.88rem); line-height: 1.02; border-radius: 14px; }
.headbtn svg { width: var(--hh, 40px); height: var(--hh, 40px); display: block; }
.headbtn small { font-size: 0.82em; color: var(--muted); }
.headbtn[aria-pressed="true"] small { color: #1D2340; }
.sizes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sizebtn { display: flex; align-items: center; justify-content: center; gap: 2px; min-height: 46px; padding: 0.1rem 0.2rem; font-size: clamp(0.78rem, 1.8vw, 0.98rem); line-height: 1.02; }
.sizebtn svg { width: 16px; height: 40px; flex: none; }
.sizebtn small { display: block; color: var(--muted); font-size: 0.85em; }
.sizebtn[aria-pressed="true"] small { color: #1D2340; }
.power { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 8px; align-items: center; }
.dirbtn { min-height: 48px; padding: 0.1rem 0.6rem; font-size: 1rem; white-space: nowrap; background: #E8F7EC; color: #1D2340; }
.dirbtn.rev { background: #FFE1E1; }
.subtabs { display: none; }
.bits { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.bitbtn { min-height: 44px; padding: 2px; display: flex; align-items: center; justify-content: center; }
.bitbtn svg { width: 30px; height: 30px; }
.clutch { display: flex; align-items: center; gap: 8px; }
.clutch .btn { width: 48px; min-height: 48px; padding: 0; font-size: 1.7rem; line-height: 1; flex: none; }
.clutch .cnum { font-size: 1.8rem; font-weight: 800; min-width: 2.4ch; text-align: center; font-variant-numeric: tabular-nums; line-height: 0.95; display: flex; flex-direction: column; align-items: center; }
.clutch .cnum small { font-size: 0.42em; font-weight: 700; color: var(--muted); line-height: 1; }
.rtll { margin: 0; align-self: center; text-align: center; font-weight: 800; font-size: clamp(0.95rem, 2.2vw, 1.2rem); }
.rtll span { white-space: nowrap; }
.countrow { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.count {
  flex: 1 1 0;
  min-width: 0;
  text-align: center;
  font-weight: 800;
  font-size: clamp(1rem, 2.4vw, 1.3rem);
  border: 3px dashed var(--edge);
  border-radius: 14px;
  padding: 2px 4px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.countrow .btn { flex: none; min-height: 50px; padding: 0.2rem 0.8rem; font-size: 1.05rem; }

/* Landscape: workbench left, tools right. */
@media (orientation: landscape) {
  .tb-body .panel { flex: 0 0 min(42%, 480px); width: auto; }
  .tools.h { --cols: 3; }
  .tools.d { --cols: 4; }
  .tool { --ih: 56px; }
  .nails { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .power { grid-template-columns: minmax(0, 1fr) auto; }
  .power .bits { grid-column: 1 / -1; }
}
@media (orientation: portrait) {
  .tool { --ih: 52px; }
}
/* Phones in portrait: smaller tool pictures, drivers on two rows. */
@media (orientation: portrait) and (max-width: 600px) {
  .wrap { padding-top: 6px; }
  .homebtn { padding: 2px 8px 2px 6px; font-size: 0.92rem; }
  .homebtn span.long { display: none; }
  .gear span { display: none; }
  .gear { padding: 0 4px; }
  .gear svg { width: 40px; height: 24px; }
  header { gap: 6px; }
  header .bigtoggle span { display: none; }
  header .bigtoggle { padding: 0.1rem 0.45rem; min-height: 44px; }
  .app { gap: 8px; margin-top: 6px; padding-bottom: 8px; }
  .panel { padding: 7px; gap: 6px; border-radius: 20px; }
  .modetab { min-height: 46px; font-size: 0.95rem; }
  .modetab svg { width: 34px; height: 30px; }
  .tools.d { --cols: 4; }
  .tools { gap: 5px; }
  .tool { --ih: 34px; font-size: 0.72rem; }
  .nailbtn { --nh: 34px; font-size: 0.7rem; }
  .seg .btn { min-height: 42px; }
  .headbtn { --hh: 30px; }
  .sizebtn { min-height: 40px; }
  .count { font-size: 0.98rem; }
  .countrow .btn { min-height: 44px; font-size: 0.95rem; padding: 0.1rem 0.5rem; }
}
@media (orientation: portrait) and (max-width: 420px) {
  /* Room for Big: the decorative gear badge steps aside on small phones. */
  header .gear { display: none; }
}
/* Short landscape (phones on their side): compact everything. */
@media (orientation: landscape) and (max-height: 560px) {
  .wrap { padding-top: 4px; }
  header h1 { font-size: 1.1rem; }
  .homebtn { min-height: 36px; font-size: 0.85rem; }
  .homebtn span.long { display: none; }
  .gear { min-height: 32px; }
  .gear span { display: none; }
  .gear svg { width: 38px; height: 22px; }
  .app { margin-top: 4px; gap: 8px; padding-bottom: 6px; }
  .tb-body .panel { flex-basis: min(50%, 440px); padding: 6px; gap: 5px; }
  .modetab { min-height: 40px; font-size: 0.85rem; }
  .modetab svg { width: 30px; height: 26px; }
  .tools.h { --cols: 6; }
  .tools.d { --cols: 7; }
  .tools { gap: 4px; }
  .tool { --ih: 26px; font-size: 0.6rem; border-radius: 10px; padding: 2px 1px; }
  .nails { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
  .nailbtn { --nh: 26px; font-size: 0.62rem; border-radius: 10px; }
  .seg .btn { min-height: 38px; font-size: 0.8rem; }
  .seg .btn svg { width: 26px; height: 22px; }
  .tray { gap: 4px; }
  .headbtn { --hh: 24px; font-size: 0.6rem; border-radius: 10px; }
  .sizebtn { min-height: 34px; font-size: 0.72rem; }
  .sizebtn svg { height: 28px; }
  .bitbtn { min-height: 34px; }
  .bitbtn svg { width: 22px; height: 22px; }
  .clutch .btn { width: 40px; min-height: 36px; font-size: 1.3rem; }
  .clutch .cnum { font-size: 1.4rem; }
  .lbl { font-size: 0.8rem; }
  .rtll, .note { font-size: 0.85rem; }
  .count { font-size: 0.9rem; border-width: 2px; }
  .countrow .btn { min-height: 38px; font-size: 0.85rem; }
  .ctx { gap: 5px; }
  .pane { gap: 5px; }
}
.card { display: none; }
@media (orientation: landscape) and (min-height: 700px) {
  .card {
    display: flex;
    flex: 1 1 0;
    min-height: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    overflow: hidden;
    border: 3px dashed var(--edge);
    border-radius: 18px;
    padding: 6px 10px;

}

@media (min-width: 1000px) and (min-height: 1000px) {

.pj-banner {

.rest-art { width: min(70vw, 300px); }
@media (prefers-reduced-motion: reduce) {
  .tool.pulse { animation: none; outline: 5px solid #F77F00; }
}

<body>
<div class="tb-app-shell">
  <div class="tb-head">

  </div>

  <main class="tb-body">

      <div class="pj-banner" id="pjBanner" hidden></div>

      <button class="trigger" id="trigger" hidden aria-label="Trigger: press and hold to drive"><b>Hold</b><span>to drive</span></button>
      <canvas id="gcv" aria-hidden="true"></canvas>

        <div class="cbody"><p id="camText"></p><button class="btn" id="camFix"></button></div>
      </div>

          </div>

        </div>

          <p class="step">Pick a face</p>

        </div>
        </div>
      </div>

          </div>
          <div class="row"><button class="btn tb-new" data-newboard="1">New board</button></div>
        </div>
      </div>
      </div>

      <div class="card" id="toolCard" aria-hidden="true"><div class="cardart" id="cardArt"></div><p id="cardText"></p></div>
    </div>
  </main>

</div>

    else if (t.dataset.bit) { state.bit = t.dataset.bit; hideCamout(); }
    else if (t.id === "dirBtn") { state.dir = state.dir === "fwd" ? "rev" : "fwd"; sndClick(); }
    else if (t.dataset.pick) { var pk = t.dataset.pick.split(":"); state.mode = pk[0]; sub = pk[1]; }
    else if (t.id === "camFix") {
      if (camFixTo && camFixTo.driver) { state.driver = camFixTo.driver; }
      if (camFixTo && camFixTo.bit) state.bit = camFixTo.bit;
      drv.camT = 0; hideCamout();
    }
    else if (t.dataset.newboard) { newBoard(); }
    else if (t.dataset.reset) { resetScene(t.dataset.reset); }
    else return;
    var modeMoved = !!t.dataset.mode || state.mode !== oldMode;
    if (sceneName() !== oldScene || modeMoved || t.dataset.hammer) setScene();
    if (modeMoved || t.dataset.newboard) autoScrew(false);
    render();
  });
  // Auto-match: picking a screw picks the driver (or bit) that fits it.
  function pulseBtn(sel) {
    var b = document.querySelector(sel);
    if (b) { b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse"); }
  }
  function pickHead(h) {
    state.head = h; drv.camT = 0; hideCamout();
    if (DRIVERS[state.driver].kind === "power") { if (state.bit !== h) { state.bit = h; pulseBtn('[data-bit="' + h + '"]'); } }
    else if (state.driver !== HEADS[h].driver) { state.driver = HEADS[h].driver; pulseBtn('[data-driver="' + state.driver + '"]'); }
    if (state.dir === "rev") state.dir = "fwd";
    autoScrew(true);
  }
  function pickLen(len) {
    state.len = len;
    if (state.dir === "rev") state.dir = "fwd";
    autoScrew(true);
  }
  // Picking a driver: a fresh, untouched screw changes to fit it. A screw already being
  // turned keeps its head, so a different driver on it shows the friendly cam-out slip.
  function pickDriver(id) {
    state.driver = id; drv.camT = 0; hideCamout(); drv.pend = 0;
    if (PJ) {
      if (DRIVERS[id].head) { state.head = DRIVERS[id].head; state.bit = DRIVERS[id].head; }
      return;
    }
    var q = onBoard(activeScrew, state.board.screws) ? activeScrew : null;
    var busy = q && !screwFinished(q) && !fresh(q) ? q : null;
    if (DRIVERS[id].kind === "power") state.bit = busy ? busy.h : state.head;
    else if (!busy) state.head = DRIVERS[id].head;
    if (!busy) autoScrew(true);
  }
  function fresh(q) { return !q.done && q.d <= 4.01; }
  // There is always a screw standing ready: a new one is started for you.
  // force: the screw choice changed, so a fresh screw changes to match, or a new one goes in.
  function autoScrew(force) {
    if (PJ || state.mode !== "screw" || locked() || state.dir === "rev") return;
    var q = onBoard(activeScrew, state.board.screws) ? activeScrew : null;
    if (q && fresh(q)) {
      if (q.h !== state.head || q.len !== state.len) {
        q.h = state.head; q.len = state.len; drv.camT = 0;
        var p = bpt(q.u, q.v);
        ring(p.x, p.y, 26 * LB.k, "255,201,60"); sndPlace(); saveSoon();
      }
      return;
    }
    if (q && (!force || (!screwFinished(q) && q.h === state.head && q.len === state.len))) return;
    placeScrew(null);
  }
  function newBoard() {
    state.board = freshBoard();
    activeNail = null; activeScrew = null; specks = []; pull = null;
    ham.tgt = defaultTarget();
    bgDirty = true;
    dust(W / 2, LB.yBack + LB.dTop / 2, 16, 1.5);
    stars(W / 2, LB.yBack + LB.dTop / 2, 14);
    pop("New board!", W / 2, LB.yBack - 10, 30, "#FFC93C");
    sndChime();
    updateCounts(); saveSoon();
  }
  function resetScene(which) {
    if (which === "metal") { state.metal = freshMetal(); pop("New plate!", W / 2, LM.yBack - 20, 28, "#FFC93C"); }
    else if (which === "joint") { state.joint = freshJoint(); jointDrop = 220; newJointAt = 0; pop("New wood!", W / 2, LJ.yBack - 40, 28, "#FFC93C"); }
    else if (which === "log") { state.yard.wedge = 30; state.yard.hits = 0; logSplit = null; newLogAt = 0; logDrop = 300; }
    else if (which === "stake") { state.yard.stake = 430; state.yard.shits = 0; newStakeAt = 0; stakeDrop = 400; }
    sndPlace();
    bgDirty = true; saveSoon();
  }

  // ---------- Tilt and shake (optional: the "Tilt and shake" setting on the Toybox home screen) ----------
  var tiltOn = false, tiltAllowed = false, lastShake = 0, lastAcc = null;
  function onOrient(e) {
    if (e.beta === null && e.gamma === null) return;
    var b = (e.beta || 0) * Math.PI / 180, g = (e.gamma || 0) * Math.PI / 180;
    var x = Math.sin(g), y = Math.sin(b);
    var ang = (screen.orientation && typeof screen.orientation.angle === "number") ? screen.orientation.angle : (window.orientation || 0);
    var gx = x, gy = y;
    if (ang === 90) { gx = y; gy = -x; } else if (ang === -90 || ang === 270) { gx = -y; gy = x; } else if (ang === 180) { gx = -x; gy = -y; }
    grav.x = clamp(gx, -1, 1); grav.y = clamp(gy, -0.3, 1);
  }
  function onMotion(e) {
    var a = e.accelerationIncludingGravity;
    if (!a || a.x === null) return;
    if (lastAcc) {
      var d = Math.abs(a.x - lastAcc.x) + Math.abs(a.y - lastAcc.y) + Math.abs(a.z - lastAcc.z);
      if (d > 26 && nowMs() - lastShake > 700 && !locked()) { lastShake = nowMs(); shakeOff(); }
    }
    lastAcc = { x: a.x, y: a.y, z: a.z };
  }
  function startTilt() {
    if (tiltOn || !tiltAllowed || !Toybox.settings.get("tilt")) return;
    tiltOn = true;
    window.addEventListener("deviceorientation", onOrient);
    window.addEventListener("devicemotion", onMotion);
  }
  function stopTilt() {
    if (!tiltOn) return;
    tiltOn = false; lastAcc = null;
    window.removeEventListener("deviceorientation", onOrient);
    window.removeEventListener("devicemotion", onMotion);
    grav.x = 0; grav.y = 1;
  }
  Toybox.tiltReady(function () { tiltAllowed = true; startTilt(); });
  Toybox.settings.onChange(function (id, v) { if (id === "tilt") { if (v) startTilt(); else stopTilt(); } });

  // ---------- Play timer hooks (the shared Toybox timer: it keeps going on every Workshop page) ----------
  // Ending: the tools are put down on the bench (optional Goodbye tap), then the workshop rests.
  var endingDone = null;
  function setNavDisabled(on) {
    ["wallBtn", "homeBtn"].forEach(function (id) {
      var a = $(id);
      if (on) { a.setAttribute("aria-disabled", "true"); a.setAttribute("tabindex", "-1"); }
      else { a.removeAttribute("aria-disabled"); a.removeAttribute("tabindex"); }
    });
  }
  ["wallBtn", "homeBtn"].forEach(function (id) {
    $(id).addEventListener("click", function (e) { if (locked()) e.preventDefault(); });
  });
  // Small ring on the workbench: the colored arc is the time left.
  function drawTimer(info) {
    var g = $("tring");
    var active = info.phase === "running" || info.phase === "ending";
    if (!active) { g.innerHTML = ""; g.hidden = true; return; }
    g.hidden = false;
    var f = info.fraction, mins = info.minutes;
    var R = 19, col = f > 0.5 ? "#2E9E5B" : (f > 0.2 ? "#FFC93C" : "#F77F00");
    var sv = '<circle r="26" fill="#FFFFFF" stroke="#1D2340" stroke-width="3"/><circle r="' + R + '" fill="none" stroke="rgba(29,35,64,0.14)" stroke-width="8"/>';
    if (f >= 0.9995) sv += '<circle r="' + R + '" fill="none" stroke="' + col + '" stroke-width="8"/>';
    else if (f > 0.002) {
      var a = f * 2 * Math.PI;
      sv += '<path d="M0 ' + (-R) + " A" + R + " " + R + " 0 " + (a > Math.PI ? 1 : 0) + " 1 " + n2(R * Math.sin(a)) + " " + n2(-R * Math.cos(a)) +
        '" fill="none" stroke="' + col + '" stroke-width="8" stroke-linecap="round"/>';
    }
    if (info.showMinutes && info.phase === "running") {
      sv += '<text x="0" y="1" text-anchor="middle" dominant-baseline="central" font-size="' + (mins > 9 ? 15 : 18) +
        '" font-weight="800" font-family="Baloo 2, Trebuchet MS, sans-serif" fill="#1D2340">' + mins + "</text>";
    }
    g.innerHTML = sv;
  }
  function onEnding(done) {
    endingDone = done;
    if (trig.on) setTrigger(false, null);
    pull = null; ham.g = null; drv.g = null; gest = {};
    hideCamout();
    setNavDisabled(true);
  }
  function goodbyeTap() {
    stars(W / 2, H / 2, 26);
    dust(W / 2, H * 0.7, 14, 1.4);
    sndChime();
  }
  function restArtSVG() {
    var s = '<rect x="0" y="0" width="400" height="150" rx="18" fill="#C79A64"/>', x, y;
    for (y = 14; y < 150; y += 22) for (x = 14; x < 400; x += 22) s += '<circle cx="' + x + '" cy="' + y + '" r="3" fill="#8B6038"/>';
    // tools hanging on the pegboard
    s += '<g transform="translate(46 22) rotate(90) scale(0.42)">' + partsSVG(hammerArt("claw", true).parts) + "</g>";
    s += '<g transform="translate(110 20) rotate(90) scale(0.4)">' + partsSVG(hammerArt("mallet", true).parts) + "</g>";
    s += '<g transform="translate(300 126) scale(0.52)">' + partsSVG(DRV_ART.flathead.parts) + "</g>";
    s += '<g transform="translate(330 126) scale(0.52)">' + partsSVG(DRV_ART.torx.parts) + "</g>";
    s += '<g transform="translate(360 126) scale(0.52)">' + partsSVG(DRV_ART.square.parts) + "</g>";
    s += '<text x="210" y="92" text-anchor="middle" font-size="40" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" fill="#1D2340">z z z</text>';
    // the bench, with tools put down
    s += '<rect x="0" y="140" width="400" height="60" fill="#A56C38" stroke="#1D2340" stroke-width="4"/><rect x="0" y="198" width="400" height="40" rx="6" fill="#6E4321" stroke="#1D2340" stroke-width="4"/>';
    s += '<g transform="translate(60 182) scale(0.5 0.28)">' + partsSVG(hammerArt("claw", true).parts) + "</g>";
    s += '<g transform="translate(230 178) rotate(90) scale(0.28 0.5)">' + partsSVG(DRV_ART.phillips.parts) + "</g>";
    [[220, 160, 80], [236, 164, 100], [330, 160, 70], [350, 166, 95]].forEach(function (q) {
      s += '<g transform="translate(' + q[0] + " " + q[1] + ") rotate(" + q[2] + ') scale(0.32)">' + partsSVG(nailIconParts(NAILS.c50)) + "</g>";
    });
    return '<svg class="rest-art" viewBox="0 0 400 240" aria-hidden="true">' + s + "</svg>";
  }
  function onRest() { endingDone = null; setNavDisabled(true); endPose = 1; }
  function onWake() { endingDone = null; setNavDisabled(false); }
  window.addEventListener("pagehide", function () { if (saveWanted) save(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) { if (saveWanted) save(); if (trig.on) setTrigger(false, null); motorSet(0); } });

  // ---------- Start ----------
  if (state.mode === "hammer" && HAMMERS[state.hammer].scene === "board" && state.board.nails.length) {
    var unfinished = state.board.nails.filter(function (n) { return n.d < NAILS[n.t].len; });
    activeNail = unfinished.length ? unfinished[unfinished.length - 1] : null;
  }
  if (state.mode === "screw" && state.board.screws.length) {
    var looseScrews = state.board.screws.filter(function (q) { return q.d < q.len - 0.01 && driverMatches(q); });
    activeScrew = looseScrews.length ? looseScrews[looseScrews.length - 1] : null;
  }
  idleSince = nowMs();
  render();
  setScene();
  resize();
  autoScrew(false);
  // The old Workshop sound key held "on"/"off"; the shared migration reads "1"/"true", so translate it once.
  try { if (localStorage.getItem("workshop-sound-v1") === "on") localStorage.setItem("workshop-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "workshop-hammer",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the tools are put down, the workshop rests, and the controls lock. The timer carries over to every Workshop page.",
    goodbyeOption: "End with a Goodbye tap button to press",
    farewellText: "Time to put the tools down",
    goodbyeLabel: "Goodbye tap",
    farewellDone: "Bye bye, workshop!",
    restLine: "The workshop is resting.",
    restLine2: "It will be right here next time.",
    restArt: restArtSVG,
    soundNote: "Soft taps, clicks and a motor hum. Hold for 2 seconds.",
    legacy: { timer: "workshop-timer-v1", sound: "workshop-sound-v1" },
    onEnding: onEnding,
    onGoodbye: goodbyeTap,
    onRest: onRest,
    onWake: onWake,
    onBig: function () { resize(); },
    onSound: function (on) { if (on) sndChime(); else motorSet(0); },
    onTimer: drawTimer
  });
  requestAnimationFrame(function (t) { last = t; frame(t); });
})();
</script>
</body>
</html>
