<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hammer &amp; Screws</title>
<script>
  // Safety gear first: the Tool Wall puts on goggles and ear muffs once per visit.
  (function () {
    var tool = "", pj = "";
    try {
      var sp = new URLSearchParams(location.search);
      tool = sp.get("tool") || "";
      pj = sp.get("project") || "";
    } catch (e) { tool = ""; }
    try {
      if (!pj && sessionStorage.getItem("workshop-gear") !== "on") {
        location.replace("./?next=hammer-screws" + (tool ? "&tool=" + encodeURIComponent(tool) : ""));
      }
    } catch (e) { /* storage unavailable: treat gear as on */ }
  })();
</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workshop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<script src="projects.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.3;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.wrap {
  height: 100%;
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
}

/* ---------- Header ---------- */
header { flex: none; display: flex; align-items: center; gap: 8px; }
header h1 {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0 2px;
  font-size: clamp(1.15rem, 3.2vw, 1.9rem);
  font-weight: 800;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.homebtn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 44px;
  padding: 2px 12px 2px 9px;
  font-weight: 700;
  font-size: 1rem;
  color: var(--ink);
  text-decoration: none;
  background: var(--panel);
  border: 3px solid var(--edge);
  border-radius: 12px;
  box-shadow: 2px 2px 0 var(--edge);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.homebtn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }
.homebtn:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
.homebtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.wallbtn { background: var(--accent); color: #1D2340; }
.gear {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 0 8px 0 4px;
  min-height: 38px;
  border: 3px solid var(--edge);
  border-radius: 999px;
  background: #FFE9A8;
  color: #1D2340;
  font-weight: 800;
  font-size: 0.85rem;
  white-space: nowrap;
}
.gear svg { width: 50px; height: 30px; display: block; }
/* ---------- Standard app shell (common/toybox.css) ---------- */
.tb-head a { text-decoration: none; }
/* The Hammer / Screw tabs (and the phone sub-tabs) are the tab bar: last in the panel. */
.panel .modetabs, .panel .subtabs { order: 9; }

/* ---------- Main layout ---------- */
.app { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; padding-bottom: 10px; }
.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
  background: #C49460;
  touch-action: none;
  container-type: size;
}
#cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ov { position: absolute; z-index: 2; pointer-events: none; display: flex; gap: 6px; }
.ov.tl { left: 8px; top: 8px; align-items: center; max-width: 62%; }
.ov.tr { right: 8px; top: 8px; flex-direction: column; align-items: flex-end; }
.pill {
  background: rgba(255, 255, 255, 0.94);
  color: #1D2340;
  border: 3px solid #1D2340;
  border-radius: 16px;
  padding: 2px 12px;
  font-weight: 800;
  box-shadow: 3px 3px 0 #1D2340;
}
.toolname { font-size: clamp(0.85rem, 2.3vmin, 1.4rem); font-size: clamp(0.8rem, 3.7cqmin, 1.45rem); line-height: 1.12; }
.toolname small { display: block; font-size: 0.7em; font-weight: 700; color: #4A5578; }
.readout { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.05; padding: 4px 12px 5px; }
.readout b { font-size: clamp(1.1rem, 3.4vmin, 2.1rem); font-size: clamp(1.05rem, 5.6cqmin, 2.2rem); font-variant-numeric: tabular-nums; }
.readout span { font-size: clamp(0.7rem, 1.8vmin, 1rem); font-size: clamp(0.66rem, 2.5cqmin, 1rem); font-weight: 700; color: #4A5578; }
.readout span:empty { display: none; }
.stage { --tsz: clamp(104px, 23cqmin, 164px); }
/* With a power driver the big trigger sits bottom-right, so a coach line at the bottom moves to the left of it. */
.stage.pow .tb-coach.is-seen, .stage.pow .tb-coach.is-info { left: 10px; transform: none; max-width: calc(100% - var(--tsz) - 34px); animation: none; }
.tring { width: 52px; height: 52px; display: block; }
.trigger {
  position: absolute;
  right: 10px;
  bottom: 10px;
  z-index: 3;
  width: var(--tsz);
  height: var(--tsz);
  border-radius: 50%;
  border: 5px solid #1D2340;
  background: #FFC93C;
  color: #1D2340;
  font: inherit;
  font-weight: 800;
  font-size: calc(var(--tsz) * 0.15);
  line-height: 1;
  box-shadow: 5px 5px 0 #1D2340;
  touch-action: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.12em;
  padding: 0;
}
.trigger b { font-size: 1.45em; }
.trigger.on { transform: translate(4px, 4px); box-shadow: 1px 1px 0 #1D2340; background: #F77F00; color: #FFFFFF; }
.trigger.nudge:not(.on) { animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 50% { box-shadow: 5px 5px 0 #1D2340, 0 0 0 10px rgba(255, 201, 60, 0.75); } }
.camout {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 74px;
  transform: translateX(-50%);
  width: min(94%, 460px);
  background: #FFFFFF;
  color: #1D2340;
  border: 3px solid #1D2340;
  border-radius: 20px;
  box-shadow: 4px 4px 0 #1D2340;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.camout svg { width: 116px; height: 58px; flex: none; }
.camout .cbody { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.camout p { margin: 0; font-weight: 700; font-size: clamp(0.85rem, 2vw, 1.05rem); line-height: 1.15; }
.camout .btn { min-height: 46px; font-size: 1rem; padding: 0.15rem 0.7rem; background: #FFC93C; color: #1D2340; border-color: #1D2340; box-shadow: 3px 3px 0 #1D2340; }

/* ---------- Panel ---------- */
.panel {
  flex: none;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.modetabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modetab {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 58px;
  padding: 0.15rem 0.4rem;
  font-size: clamp(0.95rem, 2.3vw, 1.25rem);
  font-weight: 800;
  line-height: 1.05;
}
.modetab svg { width: 46px; height: 42px; flex: none; }
.pane { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
/* Every set of controls shares one spot, so the workbench never changes size. */
.panes, .stack { display: grid; }
.panes > *, .stack > * { grid-area: 1 / 1; min-width: 0; }
.stack { align-items: center; }
.off { visibility: hidden; pointer-events: none; }
.tools { display: grid; grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr)); gap: 6px; }
.tools.h { --cols: 6; }
.tools.d { --cols: 7; }
.tool {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 3px 2px 3px;
  min-height: 0;
  min-width: 0;
  font-size: clamp(0.7rem, 1.75vw, 0.92rem);
  line-height: 1.02;
  text-align: center;
  border-radius: 14px;
}
.tool svg { width: 100%; height: var(--ih, 52px); display: block; }
.tool span { min-height: 2.04em; display: flex; align-items: center; justify-content: center; }
.tool.pulse { animation: pulse 0.7s ease-in-out 4; }
@keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 0 6px #F77F00; } }
.ctx { display: flex; flex-direction: column; gap: 8px; min-height: var(--ctxh, 0); justify-content: center; }
.lbl { margin: 0; font-weight: 800; font-size: 0.95rem; color: var(--muted); }
.step { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 800; font-size: clamp(1rem, 1.9vw, 1.2rem); color: var(--ink); line-height: 1.1; }
.step b, .sn { flex: none; width: 1.55em; height: 1.55em; border-radius: 50%; background: var(--accent); color: #1D2340; border: 3px solid var(--edge); display: inline-flex; align-items: center; justify-content: center; font-size: 0.9em; font-weight: 800; }
.sn { width: 1.45em; height: 1.45em; border-width: 2px; margin-right: 4px; background: #FFFFFF; }
[aria-pressed="true"] > .sn { background: #FFFFFF; }
.bitlbl { grid-column: 1 / -1; }
.dirseg .btn b { font-size: 1.35em; line-height: 1; }
.nails { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.nailbtn { display: flex; flex-direction: column; align-items: center; padding: 2px 2px 3px; min-height: 0; font-size: clamp(0.7rem, 1.7vw, 0.9rem); line-height: 1.02; border-radius: 14px; }
.nailbtn svg { height: var(--nh, 50px); width: 100%; display: block; }
.nailbtn b { font-weight: 800; }
.nailbtn small { font-size: 0.85em; color: var(--muted); }
.nailbtn[aria-pressed="true"] small { color: #1D2340; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.seg .btn { min-height: 50px; padding: 0.2rem 0.4rem; font-size: clamp(0.85rem, 2vw, 1.05rem); display: flex; align-items: center; justify-content: center; gap: 4px; line-height: 1.05; }
.seg .btn svg { width: 34px; height: 30px; flex: none; }
.row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; justify-content: center; }
.row > .btn { flex: 1 1 0; min-width: 0; }
.note { margin: 0; text-align: center; font-weight: 700; color: var(--muted); font-size: clamp(0.85rem, 2vw, 1rem); }
.tray { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) ; gap: 6px; }
.headbtn { display: flex; flex-direction: column; align-items: center; padding: 3px 2px; min-height: 0; font-size: clamp(0.68rem, 1.65vw, 0.88rem); line-height: 1.02; border-radius: 14px; }
.headbtn svg { width: var(--hh, 40px); height: var(--hh, 40px); display: block; }
.headbtn small { font-size: 0.82em; color: var(--muted); }
.headbtn[aria-pressed="true"] small { color: #1D2340; }
.sizes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sizebtn { display: flex; align-items: center; justify-content: center; gap: 2px; min-height: 46px; padding: 0.1rem 0.2rem; font-size: clamp(0.78rem, 1.8vw, 0.98rem); line-height: 1.02; }
.sizebtn svg { width: 16px; height: 40px; flex: none; }
.sizebtn small { display: block; color: var(--muted); font-size: 0.85em; }
.sizebtn[aria-pressed="true"] small { color: #1D2340; }
.power { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 8px; align-items: center; }
.dirbtn { min-height: 48px; padding: 0.1rem 0.6rem; font-size: 1rem; white-space: nowrap; background: #E8F7EC; color: #1D2340; }
.dirbtn.rev { background: #FFE1E1; }
.subtabs { display: none; }
.bits { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.bitbtn { min-height: 44px; padding: 2px; display: flex; align-items: center; justify-content: center; }
.bitbtn svg { width: 30px; height: 30px; }
.clutch { display: flex; align-items: center; gap: 8px; }
.clutch .btn { width: 48px; min-height: 48px; padding: 0; font-size: 1.7rem; line-height: 1; flex: none; }
.clutch .cnum { font-size: 1.8rem; font-weight: 800; min-width: 2.4ch; text-align: center; font-variant-numeric: tabular-nums; line-height: 0.95; display: flex; flex-direction: column; align-items: center; }
.clutch .cnum small { font-size: 0.42em; font-weight: 700; color: var(--muted); line-height: 1; }
.rtll { margin: 0; align-self: center; text-align: center; font-weight: 800; font-size: clamp(0.95rem, 2.2vw, 1.2rem); }
.rtll span { white-space: nowrap; }
.countrow { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.count {
  flex: 1 1 0;
  min-width: 0;
  text-align: center;
  font-weight: 800;
  font-size: clamp(1rem, 2.4vw, 1.3rem);
  border: var(--tb-outline) solid var(--edge);
  border-radius: 14px;
  padding: 2px 4px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.countrow .btn { flex: none; min-height: 50px; padding: 0.2rem 0.8rem; font-size: 1.05rem; }

/* Landscape: workbench left, tools right. */
@media (orientation: landscape) {
  .tb-body .panel { flex: 0 0 min(42%, 480px); width: auto; }
  .tools.h { --cols: 3; }
  .tools.d { --cols: 4; }
  .tool { --ih: 56px; }
  .nails { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .power { grid-template-columns: minmax(0, 1fr) auto; }
  .power .bits { grid-column: 1 / -1; }
}
@media (orientation: portrait) {
  .tool { --ih: 52px; }
}
/* Phones in portrait: smaller tool pictures, drivers on two rows. */
@media (orientation: portrait) and (max-width: 600px) {
  .wrap { padding-top: 6px; }
  .homebtn { padding: 2px 8px 2px 6px; font-size: 0.92rem; }
  .homebtn span.long { display: none; }
  .gear span { display: none; }
  .gear { padding: 0 4px; }
  .gear svg { width: 40px; height: 24px; }
  header { gap: 6px; }
  .app { gap: 8px; margin-top: 6px; padding-bottom: 8px; }
  .panel { padding: 7px; gap: 6px; border-radius: 20px; }
  .modetab { min-height: 46px; font-size: 0.95rem; }
  .modetab svg { width: 34px; height: 30px; }
  .tools.d { --cols: 4; }
  .tools { gap: 5px; }
  .tool { --ih: 34px; font-size: 0.72rem; }
  .nailbtn { --nh: 34px; font-size: 0.7rem; }
  .seg .btn { min-height: 42px; }
  .headbtn { --hh: 30px; }
  .sizebtn { min-height: 40px; }
  .count { font-size: 0.98rem; }
  .countrow .btn { min-height: 44px; font-size: 0.95rem; padding: 0.1rem 0.5rem; }
}
@media (orientation: portrait) and (max-width: 420px) {
  /* Room on small phones: the decorative gear badge steps aside. */
  header .gear { display: none; }
}
/* Short landscape (phones on their side): compact everything. */
@media (orientation: landscape) and (max-height: 560px) {
  .wrap { padding-top: 4px; }
  header h1 { font-size: 1.1rem; }
  .homebtn { min-height: 36px; font-size: 0.85rem; }
  .homebtn span.long { display: none; }
  .gear { min-height: 32px; }
  .gear span { display: none; }
  .gear svg { width: 38px; height: 22px; }
  .app { margin-top: 4px; gap: 8px; padding-bottom: 6px; }
  .tb-body .panel { flex-basis: min(50%, 440px); padding: 6px; gap: 5px; }
  .modetab { min-height: 40px; font-size: 0.85rem; }
  .modetab svg { width: 30px; height: 26px; }
  .tools.h { --cols: 6; }
  .tools.d { --cols: 7; }
  .tools { gap: 4px; }
  .tool { --ih: 26px; font-size: 0.6rem; border-radius: 10px; padding: 2px 1px; }
  .nails { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
  .nailbtn { --nh: 26px; font-size: 0.62rem; border-radius: 10px; }
  .seg .btn { min-height: 38px; font-size: 0.8rem; }
  .seg .btn svg { width: 26px; height: 22px; }
  .tray { gap: 4px; }
  .headbtn { --hh: 24px; font-size: 0.6rem; border-radius: 10px; }
  .sizebtn { min-height: 34px; font-size: 0.72rem; }
  .sizebtn svg { height: 28px; }
  .bitbtn { min-height: 34px; }
  .bitbtn svg { width: 22px; height: 22px; }
  .clutch .btn { width: 40px; min-height: 36px; font-size: 1.3rem; }
  .clutch .cnum { font-size: 1.4rem; }
  .lbl { font-size: 0.8rem; }
  .rtll, .note { font-size: 0.85rem; }
  .count { font-size: 0.9rem; border-width: 2px; }
  .countrow .btn { min-height: 38px; font-size: 0.85rem; }
  .ctx { gap: 5px; }
  .pane { gap: 5px; }
}
.card { display: none; }
@media (orientation: landscape) and (min-height: 700px) {
  .card {
    display: flex;
    flex: 1 1 0;
    min-height: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    overflow: hidden;
    border: var(--tb-outline) solid var(--edge);
    border-radius: 18px;
    padding: 6px 10px;
    background: rgba(255, 201, 60, 0.12);
  }
  .cardart { flex: 1 1 0; min-height: 0; width: 100%; display: flex; justify-content: center; }
  .cardart svg { height: 100%; width: 100%; max-height: 180px; display: block; }
  .card p { margin: 0; text-align: center; font-weight: 700; font-size: 1.05rem; line-height: 1.2; }
}
/* Tall landscape screens: the panel has room for bigger pictures. */
@media (orientation: landscape) and (min-height: 760px) {
  .tool { --ih: 60px; font-size: 1rem; }
  .nailbtn { --nh: 64px; font-size: 0.95rem; }
  .headbtn { --hh: 44px; }
  .seg .btn { min-height: 56px; font-size: 1.1rem; }
}
@media (orientation: landscape) and (min-height: 960px) {
  .tool { --ih: 72px; }
  .nailbtn { --nh: 76px; }
  .headbtn { --hh: 52px; }
  .panel, .pane, .ctx { gap: 12px; }
}
/* Phones: tools and supplies take turns in one spot (small tabs), so the workbench stays big. */
@media (orientation: portrait) and (max-width: 600px), (orientation: landscape) and (max-height: 560px) {
  .subtabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .subtabs .btn { min-height: 38px; padding: 0 0.4rem; font-size: 0.9rem; border-radius: 12px; box-shadow: 2px 2px 0 var(--edge); }
  .pane { display: grid; }
  .pane > * { grid-area: 1 / 1; min-width: 0; }
  .panel[data-sub="tools"] .pane > .stack,
  .panel[data-sub="tools"] .pane > .ctx,
  .panel[data-sub="supplies"] .pane > .tools { visibility: hidden; pointer-events: none; }
  .pane > .stack, .pane > .ctx { align-self: center; }
  .note, .step, .bitlbl { display: none; }
  .clutch .btn { width: 40px; min-height: 40px; font-size: 1.4rem; }
  .clutch .cnum { font-size: 1.4rem; }
  .dirbtn { min-height: 40px; font-size: 0.85rem; }
  .bitbtn { min-height: 38px; }
  .bitbtn svg { width: 24px; height: 24px; }
  .power { grid-template-columns: minmax(0, 1fr) auto auto; }
  .power .bits { grid-column: auto; }
}
@media (orientation: landscape) and (max-height: 560px) {
  .tool { --ih: 56px; font-size: 0.6rem; }
  .ov.tl { max-width: 46%; }
}
@media (orientation: portrait) and (max-width: 600px) {
  header h1 { display: none; }
  header { justify-content: space-between; }
  .ov.tl { max-width: 48%; }
  .tools.h { --cols: 3; }
  .tools.d { --cols: 4; }
  .tool { --ih: 54px; font-size: 0.8rem; }
  .nails { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .nailbtn { --nh: 36px; font-size: 0.78rem; }
  .power { grid-template-columns: minmax(0, 1fr) auto; }
  .power .bits { grid-column: 1 / -1; }
}
/* Big tablets: bigger pictures. */
@media (min-width: 1000px) and (min-height: 1000px) {
  .tool { --ih: 64px; }
  .nailbtn { --nh: 60px; }
  .headbtn { --hh: 48px; }
}

/* ---------- Declutter ---------- */
.power { display: flex; justify-content: center; }
.power .dirbtn { flex: 1 1 auto; max-width: 320px; }
#ctxScrew .row .btn, #ctxNails .row .btn { flex: 0 1 220px; min-height: 46px; }
.cbar { display: block; width: 2.6em; height: 0.5em; margin-top: 0.12em; border: 2px solid var(--edge); border-radius: 999px; overflow: hidden; background: var(--plate); }
.cbar span { display: block; height: 100%; width: 70%; background: #F77F00; }
.countrow { justify-content: flex-end; }
.wallbtn { border-color: #1D2340; box-shadow: 2px 2px 0 #1D2340; }
header .spacer { display: none; }
@media (max-width: 1000px) { header .gear span { display: none; } header .gear { padding: 0 6px; } }
/* Phones: Back, Home icon; one row of tabs; one New board button. */
@media (orientation: portrait) and (max-width: 600px), (orientation: landscape) and (max-height: 560px) {
  header .gear { display: none; }
  .homebtn span { display: none; }
  .wallbtn span { display: inline !important; }
  .homebtn { min-width: 46px; justify-content: center; padding: 2px 8px; }
  .wallbtn { padding: 2px 12px 2px 6px; }
  .modetabs { display: none; }
  .subtabs { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .subtabs .btn { min-height: 46px; font-size: 0.9rem; letter-spacing: -0.02em; padding: 0 1px; white-space: nowrap; overflow: hidden; }
  .headbtn small { display: none; }
  .countrow .btn { min-height: 44px; font-size: 1rem; }
}
@media (orientation: portrait) and (max-width: 600px) {
  header h1 { display: none; }
  header { justify-content: flex-start; }
  header .wallbtn { margin-right: auto; }
  .tool { --ih: 58px; font-size: 0.95rem; }
  .nailbtn { --nh: 44px; font-size: 0.95rem; }
  .seg .btn { min-height: 46px; font-size: 1rem; }
  .sizebtn svg { height: 40px; width: 20px; }
}
@media (orientation: landscape) and (max-height: 560px) {
  .subtabs .btn { min-height: 40px; font-size: 0.9rem; }
  .tb-body .panel { flex-basis: min(44%, 380px); }
  .tools.h { --cols: 3; }
  .tools.d { --cols: 4; }
  .tool { --ih: 44px; font-size: 0.85rem; }
  .seg .btn { min-height: 44px; font-size: 0.95rem; }
}
/* ---------- Timer: the toast, banner, sheet and rest screen come from common/toybox.css ---------- */
body.ending .panel,
body.ending .trigger { pointer-events: none; opacity: 0.4; }
body.ending .camout { display: none; }

/* ---------- Project mode (guided build from the Tool Wall) ---------- */
.pj-banner {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5;
  padding: 4px 16px; border-radius: 999px;
  background: #FFE9A8; color: #1D2340;
  border: 3px solid #1D2340; box-shadow: 0 3px 0 #1D2340;
  font-weight: 800; font-size: clamp(0.95rem, 2.2vw, 1.25rem);
  white-space: nowrap; max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis;
  pointer-events: none;
}
.pj-done {
  position: absolute; inset: 0; z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 16px; background: rgba(29, 35, 64, 0.18);
}
.pj-done[hidden] { display: none; }
.pj-card {
  width: min(440px, 100%);
  background: var(--panel); color: var(--ink);
  border: 4px solid var(--edge); border-radius: 26px;
  box-shadow: 0 8px 0 var(--edge);
  padding: 16px 20px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.pj-card h2 { margin: 0; font-size: clamp(1.5rem, 4.2vw, 2.1rem); font-weight: 800; line-height: 1.05; }
.pj-card p { margin: 0; font-weight: 800; color: var(--muted); font-size: clamp(1rem, 2.6vw, 1.25rem); }
.pj-card .btn {
  min-height: 56px; padding: 8px 24px; font-size: clamp(1.15rem, 3vw, 1.45rem);
  background: #5BE37A; color: #1D2340; text-decoration: none;
  display: inline-flex; align-items: center; gap: 10px; border-radius: 999px;
  font-weight: 800; border: 3px solid #1D2340; box-shadow: 0 4px 0 #1D2340;
}
body.project .ov.tl,
body.project .ov.tr .readout,
body.project .trigger,
body.project #subtabs,
body.project .ctx,
body.project .stack,
body.project .step,
body.project .card,
body.project [data-tool="prybar"] { display: none !important; }
body.project .modetabs { display: grid !important; }
body.project .pane:not(.off) > .tools { visibility: visible !important; pointer-events: auto !important; }

/* Rest picture size (the rest screen itself is in common/toybox.css). */
.rest-art { width: min(70vw, 300px); }
@media (prefers-reduced-motion: reduce) {
  .tool.pulse { animation: none; outline: 5px solid #F77F00; }
}
</style>
</head>
<body>
<div class="tb-app-shell">
  <div class="tb-head">
    <a class="btn tb-iconbtn tb-back" id="wallBtn" href="./" aria-label="Back to the Tool Wall"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Tool Wall</span></a>
    <a class="btn tb-iconbtn" id="homeBtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Hammer &amp; Screws</h1>
  </div>

  <main class="tb-body">
    <div class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="Workbench"></canvas>
      <div class="pj-banner" id="pjBanner" hidden></div>
      <div class="ov tl"><span class="pill toolname" id="toolName"></span></div>
      <div class="ov tr"><div class="pill readout" aria-live="polite"><b id="readBig"></b><span id="readSmall"></span></div><svg class="tring" id="tring" viewBox="-28 -28 56 56" hidden aria-hidden="true"></svg></div>
      <div id="coach"></div>
      <button class="trigger" id="trigger" hidden aria-label="Trigger: press and hold to drive"><b>Hold</b><span>to drive</span></button>
      <div class="camout" id="camout" hidden role="status">
        <svg id="camArt" viewBox="0 0 232 116" aria-hidden="true"></svg>
        <div class="cbody"><p id="camText"></p><button class="btn" id="camFix"></button></div>
      </div>
      <div class="pj-done" id="pjDone" hidden role="dialog" aria-label="Step finished">
        <div class="pj-card">
          <h2>Done! &#10003;</h2>
          <p id="pjDoneText"></p>
          <a class="btn" id="pjBack" href="index.html">Back to the plan</a>
        </div>
      </div>
    </div>

    <div class="tb-panel panel" id="panel" data-sub="tools">
      <div class="modetabs">
        <button class="btn modetab" data-mode="hammer" id="tabHammer"></button>
        <button class="btn modetab" data-mode="screw" id="tabScrew"></button>
      </div>

      <div class="subtabs" id="subtabs">
        <button class="btn" data-pick="hammer:tools" id="subHam">Hammers</button>
        <button class="btn" data-pick="hammer:supplies" id="subNails">Nails</button>
        <button class="btn" data-pick="screw:tools" id="subDrv">Drivers</button>
        <button class="btn" data-pick="screw:supplies" id="subScr">Screws</button>
      </div>
      <div class="panes">
      <div class="pane" id="paneHammer">
        <p class="step">Pick a hammer</p>
        <div class="tools h" id="hammerBtns"></div>
        <div class="stack">
        <div class="ctx" id="ctxNails">
          <div class="seg" id="hitPull">
            <button class="btn" data-act="hit"><svg viewBox="-20 -20 40 40" aria-hidden="true"><path d="M0 -16V10M-9 1L0 10L9 1" fill="none" stroke="#1D2340" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>Hit</button>
            <button class="btn" data-act="pull"><svg viewBox="-20 -20 40 40" aria-hidden="true"><path d="M0 14V-12M-9 -3L0 -12L9 -3" fill="none" stroke="#1D2340" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>Pull out</button>
          </div>
          <div class="row"><button class="btn tb-new" data-newboard="1">New board</button></div>
        </div>
        <div class="ctx" id="ctxMetal">
          <p class="step">Pick a face</p>
          <p class="note">The ball peen rounds rivets. The flat face flattens.</p>
          <div class="seg" id="faceSeg">
            <button class="btn" data-face="ball"><svg viewBox="-20 -22 40 40" aria-hidden="true"><circle cx="0" cy="-4" r="13" fill="#CBD3DE" stroke="#1D2340" stroke-width="3"/><circle cx="-4" cy="-8" r="3.5" fill="#FFFFFF"/></svg>Ball peen</button>
            <button class="btn" data-face="flat"><svg viewBox="-20 -22 40 40" aria-hidden="true"><rect x="-14" y="-16" width="28" height="22" rx="3" fill="#CBD3DE" stroke="#1D2340" stroke-width="3"/><path d="M-14 4 H14" stroke="#FFFFFF" stroke-width="3"/></svg>Flat face</button>
          </div>
          <div class="row"><button class="btn tb-new" data-reset="metal">New plate</button></div>
        </div>
        <div class="ctx" id="ctxJoint">
          <p class="step">Pick a job</p>
          <div class="seg" id="jobJoint">
            <button class="btn" data-job="post"><svg viewBox="-20 -20 40 40" aria-hidden="true"><rect x="-8" y="-17" width="16" height="22" rx="2" fill="#E9B872" stroke="#1D2340" stroke-width="3"/><rect x="-18" y="7" width="36" height="10" rx="2" fill="#E9B872" stroke="#1D2340" stroke-width="3"/></svg>Post</button>
            <button class="btn" data-job="chisel"><svg viewBox="-20 -20 40 40" aria-hidden="true"><rect x="-6" y="-18" width="12" height="17" rx="3" fill="#C8743A" stroke="#1D2340" stroke-width="3"/><path d="M-5 0H5V12L0 17L-5 12Z" fill="#CBD3DE" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/></svg>Chisel</button>
          </div>
          <p class="note">Rubber and dead-blow faces leave no dents.</p>
          <div class="row"><button class="btn tb-new" data-reset="joint">New wood</button></div>
        </div>
        <div class="ctx" id="ctxYard">
          <p class="step">Pick a job</p>
          <div class="seg" id="jobYard">
            <button class="btn" data-job="wedge"><svg viewBox="-20 -20 40 40" aria-hidden="true"><rect x="-16" y="-6" width="32" height="22" rx="4" fill="#B07A45" stroke="#1D2340" stroke-width="3"/><path d="M-6 -18H6L0 4Z" fill="#CBD3DE" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/></svg>Split log</button>
            <button class="btn" data-job="stake"><svg viewBox="-20 -20 40 40" aria-hidden="true"><path d="M-6 -18H6V8L0 16L-6 8Z" fill="#E9B872" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><path d="M-18 8H18" stroke="#3F8F3A" stroke-width="4" stroke-linecap="round"/></svg>Stake</button>
          </div>
          <p class="note">Big, slow swings! Swipe down for a big hit.</p>
          <div class="row"><button class="btn tb-new" data-reset="log">New log</button><button class="btn tb-new" data-reset="stake">New stake</button></div>
        </div>
        </div>
      </div>

      <div class="pane" id="paneScrew">
        <p class="step">Pick a driver</p>
        <div class="tools d" id="driverBtns"></div>
        <div class="ctx" id="ctxScrew">
          <div class="stack">
          <div class="power" id="powerCtl">
            <div class="bits" id="bitBtns" aria-label="Bit" hidden></div>
            <button class="btn dirbtn" id="dirBtn" aria-label="Forward or reverse"></button>
          </div>
          <div class="seg dirseg" id="handDir">
            <button class="btn" data-hdir="fwd"><b>↻</b> Righty tighty</button>
            <button class="btn" data-hdir="rev"><b>↺</b> Lefty loosey</button>
          </div>
          </div>
          <div class="row"><button class="btn tb-new" data-newboard="1">New board</button></div>
        </div>
      </div>
      </div>

      <div class="card" id="toolCard" aria-hidden="true"><div class="cardart" id="cardArt"></div><p id="cardText"></p></div>
    </div>
  </main>

</div>

<script src="hammer-screws.js"></script>
</body>
</html>
