<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Saw Bench</title>
<script>
  // Safety gear check: the Tool Wall puts eye protection and ear protection on first.
  // If sessionStorage is unavailable, treat the gear as on (never loop).
  (function () {
    var ok = true;
    try { ok = sessionStorage.getItem("workshop-gear") === "on"; } catch (e) { ok = true; }
    if (ok) return;
    var ids = " ryoba dozuki kataba panel backsaw dovetail coping fret hacksaw bow keyhole circular jigsaw bandsaw scrollsaw tablesaw mitersaw recip tracksaw ";
    var m = /[?&]tool=([a-z]+)/.exec(location.search);
    var tool = m && ids.indexOf(" " + m[1] + " ") !== -1 ? m[1] : "";
    // a project step keeps its project/step so the gear-up can send him back to it
    var pj = /[?&]project=([a-z0-9-]+)/.exec(location.search), st = /[?&]step=([a-z0-9-]+)/.exec(location.search);
    window.__sawRedirect = true;
    location.replace("./?next=saw-bench" + (tool ? "&tool=" + tool : "") + (pj && st ? "&project=" + pj[1] + "&step=" + st[1] : ""));
  })();
</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workshop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<script src="projects.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --peg: #D8B98A;
  --peghole: rgba(60, 38, 14, 0.45);
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --peg: #7A5C3A;
    --peghole: rgba(10, 6, 2, 0.55);
  }
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.3;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
button, a {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
/* ---------- Standard app shell (common/toybox.css): header, stage (the bench), panel ---------- */
.tb-head a { text-decoration: none; }
.stage { display: flex; flex-direction: column; min-width: 0; background: #3A2E26; }
#bench {
  flex: 1 1 0;
  min-height: 0;
  width: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
/* Panel, top to bottom: the picked saw's own controls, the saw rack (choices), then Hand saws / Power saws and New. */
.ctrlbar {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 8px;
}
.ctrlbar:empty { display: none; }
.ctrlbar .btn { min-height: 52px; font-size: 1.05rem; padding: 0.2rem 0.7rem; }
.ctrlbar .matbtn { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-width: 62px; padding: 2px 6px 1px; line-height: 1; }
.ctrlbar .matbtn i { width: 30px; height: 30px; display: block; flex: none; }
.ctrlbar .matbtn i svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ctrlbar .matbtn[aria-pressed="true"] { background: var(--accent); color: #1D2340; }
.ctrlbar .matbtn .mname { white-space: nowrap; font-size: 0.72rem; font-weight: 800; line-height: 1; }
.ctrlbar .matgrp { gap: 3px; }
.grp {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 4px;
  border: 3px dashed var(--edge);
  border-radius: 16px;
}
.grp .glabel { font-weight: 800; font-size: 0.95rem; margin: 0 2px 0 4px; white-space: nowrap; }
.grp .btn { min-width: 52px; padding: 0.15rem 0.5rem; }
.grp .val { min-width: 4.2em; text-align: center; font-weight: 800; font-size: 1.05rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.grp .val small { display: block; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
.grp .step { width: 52px; font-size: 1.7rem; line-height: 1; padding: 0; }
.grp .angle { min-width: 58px; padding: 0.15rem 0.3rem; }
/* The saw rack: a pegboard behind the picture tiles. */
.rackgrid {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
  gap: 8px;
  padding: 6px;
  align-content: start;
  border: 3px solid var(--edge);
  border-radius: 16px;
  background-color: var(--peg);
  background-image: radial-gradient(circle, var(--peghole) 2.6px, transparent 3.2px);
  background-size: 22px 22px;
  background-position: 6px 6px;
}
.sawcard {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  min-height: 0;
  padding: 4px 4px 3px;
  border-radius: 14px;
  font-size: 0.95rem;
  line-height: 1.05;
  text-align: center;
}
.sawcard canvas { display: block; width: 100%; aspect-ratio: 2.3 / 1; pointer-events: none; }
.sawcard span { display: block; padding: 1px 0 2px; }
.sawcard[aria-pressed="true"] { background: var(--accent); color: #1D2340; }
.racktab[aria-selected="true"] { background: var(--accent); color: #1D2340; }
.nb2 { white-space: pre; }
@media (orientation: portrait) {
  .rackgrid { max-height: 30vh; }
}
@media (orientation: landscape) {
  .tb-body .tb-panel { width: clamp(250px, 31vw, 410px); }
  .tb-body .tb-panel .rackgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: max-content; }
  .racktab .long, .tb-tabs .nb2 { display: none; }
}
/* Phones (portrait): the rack is two rows that slide sideways. */
@media (orientation: portrait) and (max-width: 600px) {
  .tb-body .tb-panel .rackgrid {
    max-height: none;
    grid-template-columns: none;
    grid-template-rows: repeat(2, auto);
    grid-auto-flow: column;
    grid-auto-columns: 88px;
    overflow-x: auto;
    overflow-y: hidden;
    touch-action: pan-x;
    gap: 6px; padding: 5px;
  }
  .sawcard { font-size: 0.8rem; padding: 3px 2px 2px; border-radius: 12px; }
  .sawcard canvas { aspect-ratio: 2 / 1; }
  .racktab .long, .ctrlbar .glabel { display: none; }
  .ctrlbar { gap: 5px; flex-wrap: wrap; }
  .ctrlbar .btn { min-height: 48px; font-size: 0.9rem; padding: 0.15rem 0.45rem; }
  .ctrlbar .matbtn { min-width: 46px; justify-content: center; padding: 0.1rem 0.3rem; }
  .ctrlbar .matbtn i { width: 30px; height: 30px; }
  .ctrlbar .matbtn .mname { display: none; }
  .grp { padding: 1px 3px; border-width: 2px; }
  .grp .btn { min-width: 46px; }
  .grp .step { width: 44px; }
  .grp .val { min-width: 3.4em; font-size: 0.9rem; }
  .grp .angle { min-width: 46px; font-size: 0.92rem; }
}
/* Short landscape phones: a compact side panel. */
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: clamp(240px, 36vw, 330px); padding: 6px; gap: 6px; }
  .tb-body .tb-panel .rackgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; padding: 5px; }
  .sawcard { font-size: 0.7rem; padding: 2px 2px 1px; border-radius: 11px; }
  .sawcard canvas { aspect-ratio: 2 / 1; }
  .racktab .long, .ctrlbar .glabel, .nb2, .ctrlbar .matbtn .mname { display: none; }
  .ctrlbar { gap: 4px; flex-wrap: wrap; }
  .ctrlbar .btn { min-height: 44px; font-size: 0.9rem; padding: 0.1rem 0.45rem; }
  .ctrlbar .matbtn { min-width: 44px; justify-content: center; padding: 0.1rem 0.25rem; }
  .ctrlbar .matbtn i { width: 28px; height: 28px; }
  .grp { gap: 3px; }
  .grp { padding: 1px 3px; border-width: 2px; }
  .grp .btn { min-width: 42px; }
  .grp .step { width: 42px; font-size: 1.4rem; }
  .grp .val { font-size: 0.9rem; min-width: 3.6em; }
  .tb-tabs .btn { min-height: 42px; }
}
/* ---------- Timer: the toast, banner, sheet and rest screen come from common/toybox.css ---------- */
body.ending .tb-panel,
body.ending .wallbtn,
body.ending .navlink { pointer-events: none; opacity: 0.4; }
/* Rest picture: a canvas drawn by the page (the rest screen itself is in common/toybox.css). */
.rest-art { width: min(72vw, 320px, 40vh); aspect-ratio: 4 / 3; border-radius: 18px; border: 3px solid #1D2340; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* ---------- Project mode (saw-bench.html?project=..&step=..): one step of a Workshop project ----------
   The panel is gone (the step needs nothing from it), a step banner sits at the top of the stage, the
   coach pill under it (bottom on phones), and a "Done!" card covers the stage when the job is finished. */
body.project-locked .tb-panel,
body.project .ctrlbar,
body.project .newbtn { display: none; }
.pj-banner { top: 10px; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); white-space: nowrap; overflow: hidden; max-width: calc(100% - 20px); }
.pj-coach { top: 66px; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); white-space: nowrap; overflow: hidden; max-width: calc(100% - 20px); }
.pj-banner[hidden], .pj-coach[hidden], .pj-done[hidden] { display: none; }
.pj-done { position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; padding: 12px; background: rgba(29, 35, 64, 0.3); }
.pj-card { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: min(92%, 460px); padding: 14px 22px 18px; text-align: center;
  background: var(--panel); color: var(--ink); border: 4px solid var(--edge); border-radius: 24px; box-shadow: 6px 6px 0 var(--edge);
  animation: pj-in 0.4s cubic-bezier(0.3, 1.5, 0.5, 1) both; }
.pj-card h2 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.8rem); line-height: 1.05; font-weight: 800; }
.pj-card p { margin: 0; font-size: clamp(1.05rem, 3.6vw, 1.5rem); font-weight: 700; line-height: 1.2; }
.pj-card .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0.3rem 1.4rem; font-size: 1.35rem; text-decoration: none; }
@keyframes pj-in { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 600px), (orientation: landscape) and (max-height: 520px) {
  .pj-banner { top: 8px; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); font-size: 1rem; }
  .pj-coach { top: 50px; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); font-size: 0.95rem; }
  .pj-card { padding: 10px 16px 14px; gap: 8px; }
  .pj-card .btn { min-height: 50px; font-size: 1.15rem; }
}
@media (prefers-reduced-motion: reduce) { .pj-card { animation: none; } }
</style>
</head>
<body>
<div class="tb-app-shell wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back wallbtn navlink" href="./" aria-label="Back to the Tool Wall"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Tool Wall</span></a>
    <a class="btn tb-iconbtn homebtn navlink" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Saw Bench</h1>
  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="bench" role="img" aria-label="The saw bench"></canvas>
      <div class="tb-coach pj-banner" id="pjBanner" hidden></div>
      <div class="tb-coach pj-coach" id="pjCoach" aria-live="polite" hidden></div>
      <div class="pj-done" id="pjDone" role="dialog" aria-labelledby="pjDoneTitle" hidden>
        <div class="pj-card">
          <h2 id="pjDoneTitle">Done! ✓</h2>
          <p id="pjDoneLine"></p>
          <a class="btn tb-go navlink" id="pjBack" href="project.html">Back to the plan</a>
        </div>
      </div>
    </main>
    <section class="tb-panel rack" id="rack" aria-label="Saw rack">
      <div class="ctrlbar" id="ctrlbar"></div>
      <div class="tb-choices rackgrid" id="rackgrid" role="tabpanel"></div>
      <nav class="tb-tabs racktabs" id="racktabs" role="tablist" aria-label="Saw groups">
        <button class="btn racktab" role="tab" id="tab-hand" data-group="hand">Hand<span class="long"> saws</span></button>
        <button class="btn racktab" role="tab" id="tab-power" data-group="power">Power<span class="long"> saws</span></button>
      </nav>
    </section>
  </div>
</div>

<script src="saw-bench.js"></script>
</body>
</html>
