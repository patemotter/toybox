<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birdhouse</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workshop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<script src="projects.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --ink: #1D2340;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
/* ---------- Standard app shell (common/toybox.css, tb-v2): header, stage, panel ----------
   The panel is the step row (the six visits: Plane, Measure, Cut, Drill, Nail, Sand; the current one is the
   green Go that opens its station) and the bottom bar (Shelf, New, Surprise). */
.tb-head a { text-decoration: none; }
.tb-back .tb-mapic { width: 30px; height: 30px; flex: none; }
/* Big: the header, the chips and the bottom bar hide; Go stays (it is the one thing to do here). */
body.big .tb-head > :not(.bigtoggle), body.big .tb-chip, body.big .tb-bottombar { display: none; }
body.ending .tb-panel, body.ending .homebtn, body.ending .mapbtn { pointer-events: none; opacity: 0.4; }
/* Six visits on an upright phone: Go keeps its word, so only the next two visits show beside it. */
@media (max-width: 520px) and (orientation: portrait) {
  .tb-steps > .tb-st-go ~ .tb-chip ~ .tb-chip ~ .tb-chip { display: none; }
}

/* The stage: the bench with the parts, then the growing birdhouse. */
.tb-stage { background: #EAF4FF; touch-action: none; }
.tb-stage svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.scene text { font-family: var(--font); font-weight: 800; pointer-events: none; }
.scene .part { cursor: pointer; }
.scene .part.pop { animation: pop 0.9s ease-out both; transform-box: fill-box; transform-origin: center; }
.scene .part.wig { animation: wig 0.6s ease-in-out; transform-box: fill-box; transform-origin: center; }
.scene .part.hop { animation: hop 0.9s ease-in-out both; transform-box: fill-box; transform-origin: center bottom; }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 55% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes wig { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 15% { transform: translateY(0) scale(1.06, 0.92); } 45% { transform: translateY(-34px) scale(0.96, 1.05) rotate(-3deg); } 75% { transform: translateY(0) scale(1.05, 0.94); } }
.scene .bird { transition: transform 5.2s cubic-bezier(0.25, 0.7, 0.3, 1); }
.scene .visitor { transition: transform 3.4s cubic-bezier(0.3, 0.6, 0.35, 1); }
.scene .spark { animation: twinkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene .note { animation: note 2.4s ease-out forwards; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 0%, 100% { transform: scale(0.5); opacity: 0.4; } 50% { transform: scale(1.2); opacity: 1; } }
@keyframes note { 0% { transform: translate(0, 0) scale(0.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(18px, -70px) scale(1.1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .scene .part.pop, .scene .part.wig, .scene .part.hop, .scene .spark, .scene .note { animation: none; }
  .scene .bird, .scene .visitor { transition: none; }
}
.tb-counter { font-variant-numeric: tabular-nums; }
.rest-art { width: min(70vw, 300px, 40vh); aspect-ratio: 6 / 5; }
</style>
</head>
<body>
<div class="tb-app-shell tb-v2 wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="mapbtn" href="./" aria-label="Back to the Workshop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><svg class="tb-mapic" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 16 20 5l16 11v20H4Z" fill="#E7B86A" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="10" y="18" width="20" height="18" fill="#AEB9C5" stroke="#1D2340" stroke-width="2.5"/><path d="M10 23h20M10 28h20M10 33h20" stroke="#1D2340" stroke-width="1.6"/></svg><span>Workshop</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title" id="title">Birdhouse</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>
  <div class="tb-body">
    <main class="tb-stage" id="stage">
      <svg class="scene" id="scene" role="img" aria-label="The workbench with the birdhouse parts"></svg>
      <div class="tb-counter" id="count" role="status" aria-live="polite">Houses: 0</div>
      <div id="coach"></div>
    </main>
    <section class="tb-panel" id="panel">
      <ol id="steps"></ol>
      <div id="bottom"></div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- The safety-gear check (same as every station) ----------
  var gearOn = true;
  try { gearOn = sessionStorage.getItem("workshop-gear") === "on"; } catch (e) { gearOn = true; }
  if (!gearOn) {
    location.replace("./?next=project");
    return;
  }

  var PJ = window.ToyboxProjects;
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var debug = /[?&]debug\b/.test(location.search);

  var pid = (location.search.match(/[?&]project=([a-z0-9-]+)/) || [])[1] || "birdhouse";
  var P = PJ.get(pid) || PJ.list[0];
  pid = P.id;
  $("title").textContent = P.name;
  document.title = P.name;

  // The Shelf view is remembered on reload and between pages of the Workshop, not across a fresh visit.
  var VKEY = "workshop-project-view-v1";
  var view = "plan";
  try { if (!(window.Toybox && Toybox.fresh())) view = localStorage.getItem(VKEY) === "shelf" ? "shelf" : "plan"; } catch (e) { view = "plan"; }

  // ---------- sound (soft, only through the shared setting) ----------
  function blip(f, dur, gain, type, f2) {
    var ac = window.Toybox && Toybox.sound.ready();
    if (!ac) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type || "sine";
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain || 0.08, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) { /* ignore */ }
  }
  function chirp() { blip(1320, 0.12, 0.05, "sine", 1760); setTimeout(function () { blip(1480, 0.1, 0.05); }, 160); }

  // ---------- state: the six visits ----------
  var prog = PJ.progress(pid);
  var just = PJ.justFinished();
  function refresh() { prog = PJ.progress(pid); }
  function isDone(id) { return !!prog.done[id]; }
  // What is on the bench, by visit (the step ids are the projects.js ids of the six visits).
  function D() {
    return { plane: isDone("plane"), measure: isDone("back-mark"), cut: isDone("back-cut"), drill: isDone("hole-drill"),
      build: isDone("build"), sand: isDone("sand") };
  }
  function locked() { return window.Toybox && Toybox.timer.locked(); }

  // ---------- pictures of each visit's tool (chips and Go share them) ----------
  var INK = "#1D2340";
  function svg40(body) { return '<svg viewBox="0 0 40 40" stroke-linejoin="round" stroke-linecap="round">' + body + "</svg>"; }
  var O = ' stroke="' + INK + '" stroke-width="2.2"';
  var PIC = {
    planer: svg40('<rect x="7" y="7" width="26" height="16" rx="3" fill="#3E8ED0"' + O + '/><path d="M12 12h16"' + O + '/><rect x="2" y="23" width="36" height="5" fill="#F3D69C"' + O + '/><rect x="6" y="28" width="28" height="6" rx="1.5" fill="#6F7782"' + O + '/>'),
    tape: svg40('<rect x="3" y="11" width="21" height="21" rx="6" fill="#FFC93C"' + O + '/><circle cx="13.5" cy="21.5" r="4" fill="#FFFFFF"' + O + '/><rect x="23" y="26" width="13" height="6" fill="#FFF3B0"' + O + '/><path d="M27 26v3M31 26v3M37 24v10"' + O + '/>'),
    miter: svg40('<rect x="4" y="32" width="32" height="5" rx="1.5" fill="#6F7782"' + O + '/><circle cx="20" cy="20" r="11" fill="#D5DAE1"' + O + '/><circle cx="20" cy="20" r="3" fill="#6F7782"' + O + '/><path d="M8.5 16A12 12 0 0 1 31.5 16" fill="none" stroke="' + INK + '" stroke-width="6"/><path d="M8.5 16A12 12 0 0 1 31.5 16" fill="none" stroke="#F77F00" stroke-width="3"/><path d="M28 10l7-6"' + ' stroke="' + INK + '" stroke-width="6"/><path d="M28 10l7-6" stroke="#F77F00" stroke-width="3"/>'),
    holesaw: svg40('<rect x="7" y="34" width="24" height="4" rx="1.5" fill="#6F7782"' + O + '/><rect x="25" y="5" width="5" height="29" fill="#AEB9C5"' + O + '/><rect x="6" y="5" width="21" height="11" rx="2.5" fill="#3E8ED0"' + O + '/><path d="M14 16v9"' + ' stroke="' + INK + '" stroke-width="3.2"/><rect x="5" y="26" width="18" height="4" fill="#F3D69C"' + O + '/>'),
    hammer: svg40('<g transform="rotate(-30 20 20)"><rect x="17.5" y="13" width="5" height="25" rx="2" fill="#D9A55E"' + O + '/><path d="M8 6h22a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H8l-3-4.5z" fill="#AEB9C5"' + O + '/></g>'),
    orbital: svg40('<path d="M8 27Q8 11 20 11Q32 11 32 27Z" fill="#3E8ED0"' + O + '/><circle cx="20" cy="9" r="3.2" fill="#6F7782"' + O + '/><rect x="5" y="27" width="30" height="5" rx="1.5" fill="#6F7782"' + O + '/><rect x="5" y="32" width="30" height="3" fill="#D9B46A"' + O + '/>')
  };

  // ---------- the panel: the step row (Go = the next visit's deep link), the bottom bar ----------
  var coach = Toybox.coach($("coach"));
  var countEl = $("count");

  function goTo(id) {
    var s = P.stepBy[id];
    if (!s) return false;
    ghost.learned("go");
    blip(660, 0.12, 0.06, "sine", 880);
    location.href = PJ.stepUrl(s);
  }
  var ghost = Toybox.ghost({
    max: 3,
    onShow: function (p, on) { if (steps) steps.pulse(on); },
    plan: function () {
      if (!steps) return null;
      var r = steps.go.el.getBoundingClientRect();
      if (!r.width) return null;
      return { pts: [[r.left + r.width / 2, r.top + r.height / 2]], tap: true, key: "go" };
    }
  });
  var steps = Toybox.steps($("steps"), {
    label: "The plan",
    steps: P.steps.map(function (s) { return { id: s.id, name: s.name, pic: PIC[s.tool], go: s.go, coach: s.plan }; }),
    coach: coach,
    ghost: ghost,
    onGo: function (id) { return goTo(id); },
    onAgain: function () { ghost.learned("go"); startOver("again"); }
  });
  var bar = Toybox.bar($("bottom"), { shelf: toggleShelf, onNew: function () { startOver("new"); }, onSurprise: surprise });

  // Puts the step row where the saved progress is.
  function syncSteps() {
    if (prog.next) steps.at(prog.next.id);
    else { steps.finish("Build another", Toybox.pics && Toybox.pics.again); coach.step("The birdhouse is finished."); }
    countEl.textContent = "Houses: " + prog.built;
    bar.shelfOpen(view === "shelf");
  }

  // New (one tap) and Again: a fresh rough board, the plan starts over; the shelf keeps the finished houses.
  function startOver(how) {
    var was = prog.count;
    PJ.reset(pid);
    refresh();
    just = null;
    setView("plan", true);
    birdState = "none";
    anim = { stock: 0 };
    animUntil = Date.now() + 1500;
    syncSteps();
    draw();
    coach.say(was ? "Here is a new rough board." : "Here is the rough board.", 3.5);
    blip(440, 0.25, 0.06, "triangle", 330);
  }

  function setView(v, quiet) {
    view = v;
    try { localStorage.setItem(VKEY, v); } catch (e) { /* ignore */ }
    bar.shelfOpen(view === "shelf");
    if (!quiet) draw();
  }
  function toggleShelf() {
    setView(view === "shelf" ? "plan" : "shelf");
    blip(520, 0.08, 0.04);
    if (view === "shelf") coach.say(prog.built ? "Your birdhouses!" : "Build the first one!", 3.5);
    else steps.sayStep();
  }

  // ---------- the scene ----------
  var scene = $("scene"), stage = $("stage");
  var W = 0, H = 0;
  var PINE = "#F3D69C", PINE_D = "#D9B46A", GRAIN = "#E2BE7A", ROUGH = "#C4A070", ROUGH_D = "#8F6B40";
  var geo = {};            // part id -> screen box {x, y, w, h} in px
  var anim = {}, animUntil = 0;   // part id -> pop delay (s) while a celebration plays

  // Redraws only when the stage really changed size (a redraw would restart the bird's flight).
  function resize(force) {
    var r = stage.getBoundingClientRect();
    var w = Math.max(200, Math.round(r.width)), h = Math.max(200, Math.round(r.height));
    if (!force && w === W && h === H) return;
    W = w; H = h;
    scene.setAttribute("viewBox", "0 0 " + W + " " + H);
    draw();
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function n(v) { return Math.round(v * 10) / 10; }
  function rect(x, y, w, h, fill, extra) {
    return '<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(w) + '" height="' + n(h) + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"' + (extra || "") + '/>';
  }
  function poly(pts, fill, extra) {
    return '<polygon points="' + pts.map(function (p) { return n(p[0]) + "," + n(p[1]); }).join(" ") + '" fill="' + fill + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"' + (extra || "") + '/>';
  }
  function label(x, y, t, size) {
    size = size || 15;
    return '<text x="' + n(x) + '" y="' + n(y) + '" text-anchor="middle" font-size="' + size + '" fill="' + INK + '" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">' + esc(t) + '</text>';
  }

  // A board drawn along the "along" axis. In portrait the bench is turned: along = up the screen, with the
  // near end of every board at the bottom (the bench front); in landscape the near end is at the left.
  // a, c, la, lc in inches (a = along, c = across); returns a px box {x, y, w, h}.
  function toPx(L, a, c, la, lc) {
    if (L.vert) return { x: L.ox + c * L.ppi, y: L.oy + L.alongPx - (a + la) * L.ppi, w: lc * L.ppi, h: la * L.ppi };
    return { x: L.ox + a * L.ppi, y: L.oy + c * L.ppi, w: la * L.ppi, h: lc * L.ppi };
  }
  // A point on a board: x inches across it, y inches along it from its near end.
  function onBoard(b, o, x, y) {
    if (o.vert) return [b.x + x * o.ppi, b.y + b.h - y * o.ppi];
    return [b.x + y * o.ppi, b.y + x * o.ppi];
  }
  function grainLines(b, vert, rough) {
    var g = "", i, k = Math.max(2, Math.floor((vert ? b.w : b.h) / 11));
    for (i = 1; i < k; i++) {
      var t = i / k;
      if (vert) g += '<line x1="' + n(b.x + b.w * t) + '" y1="' + n(b.y + 6) + '" x2="' + n(b.x + b.w * t + (rough ? 3 : 0)) + '" y2="' + n(b.y + b.h - 6) + '"';
      else g += '<line x1="' + n(b.x + 6) + '" y1="' + n(b.y + b.h * t) + '" x2="' + n(b.x + b.w - 6) + '" y2="' + n(b.y + b.h * t + (rough ? 3 : 0)) + '"';
      g += ' stroke="' + (rough ? ROUGH_D : GRAIN) + '" stroke-width="' + (rough ? 2.5 : 2) + '" stroke-linecap="round" opacity="0.8"/>';
    }
    return g;
  }
  function board(id, b, o) {
    o = o || {};
    var fill = o.rough ? ROUGH : PINE, s = "", cls = "part";
    if (anim[id] != null && Date.now() < animUntil) cls += " pop";
    s += '<g class="' + cls + '" data-part="' + id + '"' + (anim[id] ? ' style="animation-delay:' + anim[id] + 's"' : "") + '>';
    if (o.cutTop) {
      // a Side with its roof angle: the far end is sloped
      var d = Math.tan(15 * Math.PI / 180) * (o.vert ? b.w : b.h);
      if (o.vert) s += poly([[b.x, b.y + d], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]], fill);
      else s += poly([[b.x, b.y], [b.x + b.w - d, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]], fill);
    } else s += rect(b.x, b.y, b.w, b.h, fill, ' rx="3"');
    // grain lines stop short of a sloped end
    var gb = b;
    if (o.cutTop) { var dd = Math.tan(15 * Math.PI / 180) * (o.vert ? b.w : b.h); gb = o.vert ? { x: b.x, y: b.y + dd, w: b.w, h: b.h - dd } : { x: b.x, y: b.y, w: b.w - dd, h: b.h }; }
    s += grainLines(gb, o.vert, o.rough);
    (o.lines || []).forEach(function (l, k) {
      // pencil lines, l inches from the near end (the first one is the one he measured)
      var p = l * o.ppi, sw = k ? 2 : 3;
      if (o.vert) s += '<line x1="' + n(b.x) + '" y1="' + n(b.y + b.h - p) + '" x2="' + n(b.x + b.w) + '" y2="' + n(b.y + b.h - p) + '" stroke="#3A3F55" stroke-width="' + sw + '"/>';
      else s += '<line x1="' + n(b.x + p) + '" y1="' + n(b.y) + '" x2="' + n(b.x + p) + '" y2="' + n(b.y + b.h) + '" stroke="#3A3F55" stroke-width="' + sw + '"/>';
    });
    (o.xs || []).forEach(function (h) {
      var c = onBoard(b, o, h.x, h.y), r = Math.max(4, (h.r || 0.45) * o.ppi);
      s += '<path d="M' + n(c[0] - r) + ' ' + n(c[1] - r) + 'L' + n(c[0] + r) + ' ' + n(c[1] + r) + 'M' + n(c[0] + r) + ' ' + n(c[1] - r) + 'L' + n(c[0] - r) + ' ' + n(c[1] + r) + '" stroke="#3A3F55" stroke-width="2.5" stroke-linecap="round"/>';
    });
    (o.holes || []).forEach(function (h) {
      var c = onBoard(b, o, h.x, h.y);
      s += '<circle cx="' + n(c[0]) + '" cy="' + n(c[1]) + '" r="' + n(Math.max(3, h.d / 2 * o.ppi)) + '" fill="#2B2F45" stroke="' + INK + '" stroke-width="' + (h.d > 1 ? 3 : 2) + '"/>';
    });
    if (o.name) {
      var lx = b.x + b.w / 2, ly = b.y + b.h / 2;
      if (o.nameAt) { if (o.vert) ly = b.y + b.h - o.nameAt * o.ppi; else lx = b.x + o.nameAt * o.ppi; }
      if (o.nameDy) ly += o.nameDy * o.ppi;
      s += label(lx, ly + 5, o.name, Math.max(13, Math.min(20, (o.vert ? b.w : b.h) * 0.32)));
    }
    s += '</g>';
    geo[id] = b;
    return s;
  }

  // The bench: wall at the far side, the bench top below it, its front edge nearest to us.
  function bench() {
    var top = Math.round(H * 0.14), edge = Math.max(14, Math.round(H * 0.05));
    var s = '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#DCEFFF"/>';
    s += '<rect x="-4" y="' + top + '" width="' + (W + 8) + '" height="' + (H - top + 8) + '" fill="#D9A864" stroke="' + INK + '" stroke-width="4"/>';
    var i;
    for (i = 0; i < 7; i++) {
      var y = top + 20 + i * ((H - top - edge - 30) / 7);
      s += '<path d="M0 ' + n(y) + ' Q ' + n(W * 0.3) + ' ' + n(y + 6) + ' ' + n(W * 0.6) + ' ' + n(y - 4) + ' T ' + W + ' ' + n(y + 2) + '" fill="none" stroke="#C48E4E" stroke-width="2" opacity="0.6"/>';
    }
    s += '<rect x="-4" y="' + (H - edge) + '" width="' + (W + 8) + '" height="' + (edge + 8) + '" fill="#B07A45" stroke="' + INK + '" stroke-width="4"/>';
    return { html: s, top: top, edge: edge };
  }

  // Inches to px. Two rows of parts along the bench, Back, Front, Roof (5.5 wide), then Side, Side, Floor
  // (4 wide), or three shorter rows when that draws them bigger (upright screens, tall iPad stages). Before the cut the long
  // board lies in the middle and runs off the bench, like a real one.
  var ARR = {
    flat: { along: 30, across: 10.3, at: { back: [0, 0], front: [12.8, 0], roof: [22.6, 0], side1: [0, 6.3], side2: [10.8, 6.3], floor: [21.6, 6.3] } },
    vert: { along: 21.8, across: 16.6, at: { back: [0, 0], front: [12.8, 0], roof: [0, 6.3], floor: [8.3, 6.3], side1: [0, 12.6], side2: [10.8, 12.6] } }
  };
  function layout(b) {
    var vert = H > W * 1.05;
    var pad = 16, counterH = 44;
    // On upright phones the coach pill sits at the bottom of the stage: keep the near end clear of it.
    var coachPad = (vert && W < 600) ? 46 : 0;
    var alongPx = (vert ? H - b.top - b.edge - counterH - pad * 2.5 - coachPad : W - pad * 2);
    var acrossPx = (vert ? W - pad * 2 : H - b.top - b.edge - counterH - pad * 2.5);
    // whichever arrangement draws the parts bigger on this stage (a tall iPad stage takes the three rows too)
    function fit(A) { return Math.min(alongPx / A.along, acrossPx / A.across); }
    var A = fit(ARR.vert) > fit(ARR.flat) ? ARR.vert : ARR.flat, ppi = fit(A);
    var L = { vert: vert, A: A, ppi: ppi, pad: pad, ox: pad, oy: b.top + counterH + pad, alongPx: alongPx };
    // centre the used area on the bench, both ways
    var spareC = Math.max(0, acrossPx - A.across * ppi) / 2, spareA = Math.max(0, alongPx - A.along * ppi) / 2;
    if (vert) { L.ox += spareC; L.oy -= spareA; } else { L.oy += spareC; L.ox += spareA; }
    return L;
  }

  var MARKS = [12, 21, 28.5, 54.5];     // the Back, Front, Roof and Side blank lines along the long board
  var DOOR = [{ x: 2.75, y: 6, d: 1.5 }];
  var DRAINS = [{ x: 1, y: 1, d: 0.25 }, { x: 3, y: 1, d: 0.25 }, { x: 1, y: 3, d: 0.25 }, { x: 3, y: 3, d: 0.25 }];

  function draw() {
    if (!W) return;
    geo = {};
    var b = bench(), s = b.html, d = D();
    if (view === "shelf") { s += shelfScene(b); scene.innerHTML = s; return; }
    if (d.build) { s += houseScene(b, d); scene.innerHTML = s; placeBird(); return; }

    var L = layout(b), ppi = L.ppi, vert = L.vert;
    s += '<clipPath id="benchClip"><rect x="0" y="' + (b.top + 2) + '" width="' + W + '" height="' + (H - b.top - b.edge - 2) + '"/></clipPath><g clip-path="url(#benchClip)">';
    if (!d.cut) {
      // the long board: rough, then planed, then with every pencil line on it
      s += board("stock", toPx(L, 0, (L.A.across - 5.5) / 2, P.board.l, 5.5), { rough: !d.plane, vert: vert, ppi: ppi,
        lines: d.measure ? MARKS : null, name: d.plane ? "Pine board" : "Rough board", nameAt: d.measure ? 6 : 15 });
    } else {
      ["back", "front", "roof", "side1", "side2", "floor"].forEach(function (id) {
        var q = P.partBy[id], at = L.A.at[id], o = { vert: vert, ppi: ppi, name: q.name };
        if (id === "front") { if (d.drill) o.holes = DOOR; else o.xs = [{ x: 2.75, y: 6, r: 0.6 }]; o.nameAt = 2.6; }
        if (id === "side1" || id === "side2") o.cutTop = true;
        if (id === "floor") { if (q.l * ppi < 80) o.name = ""; if (d.drill) o.holes = DRAINS; else o.xs = DRAINS.map(function (h) { return { x: h.x, y: h.y, r: 0.3 }; }); }
        s += board(id, toPx(L, at[0], at[1], q.l, q.w), o);
      });
    }
    s += '</g>';
    scene.innerHTML = s;
  }

  // The assembled birdhouse (an oblique view: the front face, one side going back-right, the sloped roof,
  // the tall back poking up above the roof).
  function house(cx, cy, size, finished, pop) {
    var u = size / 14;                                   // px per inch of the house
    var fw = 5.5 * u, fh = 9 * u, dp = 4 * u * 0.55, sk = 0.42, rise = 1.07 * u;  // side depth foreshortened, skew, roof rise
    var x0 = cx - (fw + dp) / 2, y0 = cy + fh / 2 + 0.6 * u;   // front face bottom-left
    var backTop = y0 - dp * sk - 12 * u;
    var s = '<g class="part house' + (pop ? " pop" : "") + '" data-part="house">';
    // the Back: 12 tall, standing at the rear
    s += rect(x0 + dp, backTop, fw, 12 * u, PINE_D, ' rx="3"');
    // the Side (parallelogram going back-right), its top sloping up toward the back
    s += poly([[x0 + fw, y0], [x0 + fw + dp, y0 - dp * sk], [x0 + fw + dp, y0 - dp * sk - 10 * u], [x0 + fw, y0 - 9 * u]], PINE_D);
    // the Floor edge under the front
    s += rect(x0, y0 - 0.75 * u, fw, 0.75 * u, PINE_D);
    // the Front
    s += rect(x0, y0 - fh, fw, fh, PINE, ' rx="2"');
    s += grainLines({ x: x0, y: y0 - fh, w: fw, h: fh }, true, false);
    // the door
    s += '<circle cx="' + n(x0 + fw / 2) + '" cy="' + n(y0 - 6 * u) + '" r="' + n(0.75 * u) + '" fill="#2B2F45" stroke="' + INK + '" stroke-width="3"/>';
    // the Roof: overhangs the front, sits against the Back, rises toward the back
    var ov = 1.3 * u, rx0 = x0 - 0.5 * u, rx1 = x0 + fw + 0.5 * u, ry0 = y0 - fh - 0.2 * u;
    var fy = ry0 + ov * sk;                              // the roof's front edge (overhanging toward us)
    s += poly([[rx0 - ov, fy], [rx1 - ov, fy], [rx1 + dp, ry0 - dp * sk - rise], [rx0 + dp, ry0 - dp * sk - rise]], "#E7C27A");
    s += rect(rx0 - ov, fy, rx1 - rx0, 0.75 * u, "#E7C27A");
    // nails
    var i;
    for (i = 0; i < 2; i++) {
      s += '<circle cx="' + n(x0 + 0.4 * u) + '" cy="' + n(y0 - 2 * u - i * 4 * u) + '" r="2.4" fill="#8E97A6" stroke="' + INK + '" stroke-width="1.5"/>';
      s += '<circle cx="' + n(x0 + fw - 0.4 * u) + '" cy="' + n(y0 - 2 * u - i * 4 * u) + '" r="2.4" fill="#8E97A6" stroke="' + INK + '" stroke-width="1.5"/>';
    }
    s += '</g>';
    if (finished) {
      var sp = [[rx0 - ov - 22, fy - 30], [rx1 + dp + 26, ry0 - dp * sk - rise - 10], [x0 - 30, y0 - 3 * u], [x0 + fw + dp + 32, y0 - 1.5 * u]];
      sp.forEach(function (p, k) {
        s += '<path class="spark" style="animation-delay:' + (k * 0.45) + 's" d="M' + n(p[0]) + ' ' + n(p[1] - 11) + 'l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#FFC93C" stroke="' + INK + '" stroke-width="2" stroke-linejoin="round"/>';
      });
    }
    // where a bird perches: on top of the Back, a little left of centre
    return { html: s, perch: [x0 + dp + fw * 0.4, backTop], u: u, box: { x: x0 - ov, y: backTop, w: fw + dp + ov, h: y0 - backTop } };
  }
  function bird(u, id, cls) {
    var r = Math.max(9, 0.8 * u);
    return '<g class="' + cls + '" id="' + id + '" data-part="bird">' +
      '<path d="M' + n(-r * 1.6) + ' ' + n(-r * 0.2) + ' l' + n(-r * 1.1) + ' ' + n(-r * 0.6) + ' l' + n(r * 0.2) + ' ' + n(r * 0.9) + ' z" fill="#3DB4FF" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>' +
      '<ellipse cx="0" cy="0" rx="' + n(r * 1.7) + '" ry="' + n(r * 1.2) + '" fill="#3DB4FF" stroke="' + INK + '" stroke-width="3"/>' +
      '<ellipse cx="' + n(-r * 0.2) + '" cy="' + n(r * 0.25) + '" rx="' + n(r * 1.1) + '" ry="' + n(r * 0.6) + '" fill="#FFE14D" stroke="none"/>' +
      '<circle cx="' + n(r * 1.5) + '" cy="' + n(-r * 0.8) + '" r="' + n(r * 0.9) + '" fill="#3DB4FF" stroke="' + INK + '" stroke-width="3"/>' +
      '<circle cx="' + n(r * 1.75) + '" cy="' + n(-r * 0.95) + '" r="' + n(r * 0.22) + '" fill="' + INK + '"/>' +
      '<path d="M' + n(r * 2.35) + ' ' + n(-r * 0.75) + ' l' + n(r * 0.9) + ' ' + n(r * 0.25) + ' l' + n(-r * 0.9) + ' ' + n(r * 0.3) + ' z" fill="#FF9A4D" stroke="' + INK + '" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<path d="M' + n(-r * 0.3) + ' ' + n(r * 1.1) + ' v' + n(r * 0.7) + ' M' + n(r * 0.35) + ' ' + n(r * 1.1) + ' v' + n(r * 0.7) + '" stroke="#FF9A4D" stroke-width="3" stroke-linecap="round"/>' +
      '</g>';
  }
  var birdState = "none", perchAt = null, birdU = 10;   // the bird that moves into the finished house
  function houseScene(b, d) {
    var size = Math.min(W * (H > W ? 0.8 : 0.62), (H - b.top - b.edge) * 0.74);
    var cy = b.top + (H - b.top - b.edge) * (W < 600 && H > W ? 0.5 : 0.55);
    var h = house(W / 2, cy, size, d.sand, anim.house != null && Date.now() < animUntil), s = h.html;
    geo.house = h.box;
    birdU = h.u;
    perchAt = [h.perch[0], h.perch[1] - 1.75 * Math.max(9, 0.8 * h.u)];
    if (!d.sand) { birdState = "none"; return s; }
    return s + bird(h.u, "bird", "bird");
  }
  // The bird glides in from the top-right corner once, then stays on its perch.
  function placeBird() {
    var el = $("bird");
    if (!el || !perchAt) return;
    var at = "translate(" + n(perchAt[0]) + "px," + n(perchAt[1]) + "px)";
    if (birdState !== "none" || reduce) { el.style.transition = "none"; el.style.transform = at; if (birdState === "none") birdState = "landed"; return; }
    el.style.transition = "none";
    el.style.transform = "translate(" + (W + 60) + "px,-60px)";
    birdState = "flying";
    setTimeout(function () {
      var e2 = $("bird");
      if (!e2) return;
      void e2.getBoundingClientRect();
      e2.style.transition = "";
      e2.style.transform = at;
      setTimeout(function () { birdState = "landed"; chirp(); notes(perchAt[0], perchAt[1] - 20); }, 5300);
    }, 40);
  }
  function shelfScene(b) {
    var k = prog.built, s = "", i;
    var y = b.top + (H - b.top - b.edge) * 0.62, shelfH = 16;
    s += '<rect x="' + n(W * 0.06) + '" y="' + n(y) + '" width="' + n(W * 0.88) + '" height="' + shelfH + '" rx="4" fill="#B07A45" stroke="' + INK + '" stroke-width="4"/>';
    if (!k) {
      s += label(W / 2, y - 64, "Nothing on the shelf yet.", 22) + label(W / 2, y - 34, "Build the first birdhouse!", 22);
      return s;
    }
    var per = Math.min(5, k), size = Math.min(W * 0.8 / per * 0.95, (y - b.top) * 0.75);
    for (i = 0; i < per; i++) {
      var cx = W * 0.1 + (W * 0.8) * (i + 0.5) / per;
      s += house(cx, y - size * 0.42, size, false).html;
    }
    if (k > per) s += label(W / 2, y + 44, "and more!", 20);
    return s;
  }

  // Little music notes rising from a bird.
  function notes(x, y) {
    var g = document.createElementNS("http://www.w3.org/2000/svg", "g"), i, s = "";
    for (i = 0; i < 3; i++) {
      var nx = x + (i - 1) * 16, ny = y - i * 6;
      s += '<g class="note" style="animation-delay:' + (i * 0.35) + 's;opacity:0"><path d="M' + n(nx + 6) + ' ' + n(ny - 16) + 'v14" stroke="' + INK + '" stroke-width="2.5" stroke-linecap="round"/><path d="M' + n(nx + 6) + ' ' + n(ny - 16) + 'l7 3" stroke="' + INK + '" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="' + n(nx + 2.5) + '" cy="' + n(ny - 1) + '" rx="5" ry="4" fill="#2D5BD7" stroke="' + INK + '" stroke-width="2"/></g>';
    }
    g.innerHTML = s;
    scene.appendChild(g);
    setTimeout(function () { if (g.parentNode) g.parentNode.removeChild(g); }, 3600);
  }

  function wiggle(el) {
    if (!el) return;
    el.classList.remove("wig", "pop", "hop");
    void el.getBoundingClientRect();
    el.classList.add("wig");
  }

  // Back from a station: the new thing on the bench pops in. After the cut every part pops in turn
  // (the saw cut each mark one after the other).
  var CHEER = { plane: "The board is flat and smooth.", "back-mark": "Every part is marked.", "back-cut": "The saw cut every part.",
    "hole-drill": "The door hole is drilled.", build: "The birdhouse stands up.", sand: "A bird moved in!" };
  function celebrate(stepId) {
    var s = P.stepBy[stepId] || (P.alias && P.alias[stepId]);
    if (!s || !isDone(s.id)) return;
    anim = {};
    if (s.id === "plane" || s.id === "back-mark") anim.stock = 0;
    else if (s.id === "back-cut") ["back", "front", "roof", "side1", "side2", "floor"].forEach(function (id, k) { anim[id] = k * 0.5; });
    else if (s.id === "hole-drill") { anim.front = 0; anim.floor = 0.6; }
    else anim.house = 0;
    animUntil = Date.now() + 4500;
    draw();
    coach.say(CHEER[s.id] || s.done, 4);
    blip(880, 0.18, 0.06, "sine", 1320);
    if (s.id === "back-cut") [1, 2, 3, 4, 5].forEach(function (k) { setTimeout(function () { blip(700 + k * 60, 0.08, 0.04); }, k * 500); });
    if (s.id === "sand" || s.id === "build") { try { Toybox.kind(); } catch (e) { /* ignore */ } }
  }

  // ---------- touching the bench: every part wiggles and says its name ----------
  function partAt(x, y) {
    var el = document.elementFromPoint(x, y);
    var g = el && el.closest ? el.closest("[data-part]") : null;
    return g && scene.contains(g) ? g : null;
  }
  var NAMES = { stock: function () { return D().plane ? "Pine board" : "Rough board"; }, house: function () { return "Birdhouse"; }, bird: function () { return "Bluebird"; } };
  Toybox.press(scene, {
    any: true,
    hit: function (x, y) { return partAt(x, y); },
    down: function (g, e) {
      if (!g) { steps.sayStep(); if (steps.go && steps.go.wiggle) steps.go.wiggle(); blip(400, 0.06, 0.03); return; }
      var id = g.getAttribute("data-part");
      if (id === "bird") { chirp(); var r0 = g.getBoundingClientRect(); notes(perchAt ? perchAt[0] : W / 2, perchAt ? perchAt[1] - 20 : H / 3); Toybox.nametag("Bluebird", r0.left + r0.width / 2, r0.top - 6); return; }
      wiggle(g);
      blip(520 + Math.random() * 120, 0.09, 0.04);
      var q = P.partBy[id], name = q ? q.name : (NAMES[id] ? NAMES[id]() : "");
      var r = g.getBoundingClientRect();
      if (name) Toybox.nametag(name, e.clientX || (r.left + r.width / 2), Math.max(r.top, (e.clientY || r.top) - 40) - 6);
    }
  });
  stage.addEventListener("gesturestart", function (e) { e.preventDefault(); });

  // ---------- Surprise: a fun moment on the bench, taking turns ----------
  var surpriseK = 0;
  function surprise() {
    var k = surpriseK++ % 2;
    blip(660, 0.1, 0.05, "triangle", 990);
    if (k === 0) hopAll(); else visitor();
  }
  // Everything on the bench (or the shelf) hops, one after the other, like a wave.
  function hopAll() {
    var els = Array.prototype.slice.call(scene.querySelectorAll(".part"));
    els.sort(function (a, b) { var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(); return ra.left - rb.left || rb.top - ra.top; });
    els.forEach(function (el, i) {
      setTimeout(function () {
        el.classList.remove("wig", "pop", "hop"); void el.getBoundingClientRect(); el.classList.add("hop");
        blip(520 + i * 70, 0.09, 0.04);
        setTimeout(function () { el.classList.remove("hop"); }, 1000);
      }, i * 260);
    });
    coach.say(view === "shelf" ? "The birdhouses hop on the shelf." : D().build ? "The birdhouse hops." : "The parts hop on the bench.", 3);
  }
  // A little bird flies in, lands on the highest thing on the bench, sings, and flies off.
  var visitT = [];
  function visitor() {
    visitT.forEach(clearTimeout); visitT = [];
    var old = $("visitor"); if (old) old.parentNode.removeChild(old);
    var top = null;
    Array.prototype.forEach.call(scene.querySelectorAll(".part"), function (el) {
      var bb; try { bb = el.getBBox(); } catch (e) { return; }
      if (!top || bb.y < top.y) top = bb;
    });
    var u = Math.max(9, Math.min(16, Math.min(W, H) / 40)) / 0.8 * 0.8;
    var r = Math.max(9, 0.8 * u);
    var tx = top ? top.x + top.width * 0.5 + (birdState !== "none" ? r * 4 : 0) : W / 2, ty = top ? top.y - 1.75 * r : H * 0.4;
    var wrap = document.createElementNS("http://www.w3.org/2000/svg", "g");
    wrap.innerHTML = bird(u, "visitor", "visitor");
    scene.appendChild(wrap);
    var el = $("visitor");
    el.style.transition = "none";
    el.style.transform = "translate(" + (W + 70) + "px,-50px) scale(-1,1)";
    coach.say("A little bird comes to look.", 3.5);
    visitT.push(setTimeout(function () {
      void el.getBoundingClientRect();
      el.style.transition = "";
      el.style.transform = "translate(" + n(tx) + "px," + n(ty) + "px) scale(-1,1)";
    }, 40));
    visitT.push(setTimeout(function () { chirp(); notes(tx, ty - 20); }, 3500));
    visitT.push(setTimeout(function () { el.style.transform = "translate(" + n(tx) + "px," + n(ty) + "px) scale(1,1)"; el.style.transition = "transform 0.3s"; }, 5600));
    visitT.push(setTimeout(function () { el.style.transition = ""; el.style.transform = "translate(-90px," + n(ty - 160) + "px) scale(1,1)"; }, 6000));
    visitT.push(setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 9600));
  }

  // ---------- timer hooks ----------
  function restArt() {
    return '<svg class="rest-art" viewBox="0 0 240 200" aria-hidden="true">' +
      '<rect x="92" y="30" width="56" height="130" rx="4" fill="#D9B46A" stroke="#1D2340" stroke-width="4"/>' +
      '<rect x="70" y="60" width="100" height="100" fill="#F3D69C" stroke="#1D2340" stroke-width="4"/>' +
      '<polygon points="56,66 184,66 170,38 70,38" fill="#E7C27A" stroke="#1D2340" stroke-width="4" stroke-linejoin="round"/>' +
      '<circle cx="120" cy="100" r="14" fill="#2B2F45" stroke="#1D2340" stroke-width="4"/>' +
      '<ellipse cx="120" cy="22" rx="16" ry="11" fill="#3DB4FF" stroke="#1D2340" stroke-width="3"/>' +
      '<circle cx="134" cy="14" r="8" fill="#3DB4FF" stroke="#1D2340" stroke-width="3"/>' +
      '<text x="160" y="22" font-family="Baloo 2, sans-serif" font-weight="800" font-size="18" fill="#2D5BD7">z</text>' +
      '<text x="174" y="14" font-family="Baloo 2, sans-serif" font-weight="800" font-size="13" fill="#2D5BD7">z</text></svg>';
  }

  // ---------- start up ----------
  syncSteps();
  resize();
  window.addEventListener("orientationchange", function () { setTimeout(function () { resize(true); }, 120); });
  if (window.ResizeObserver) { try { new ResizeObserver(function () { resize(); }).observe(stage); } catch (e) { window.addEventListener("resize", function () { resize(); }); } }
  else window.addEventListener("resize", function () { resize(); });
  window.addEventListener("pageshow", function (e) { if (e.persisted) { refresh(); syncSteps(); resize(true); } });
  if (just) setTimeout(function () { celebrate(just); }, 350);

  Toybox.init({
    app: "workshop-project",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the plan rests and the controls lock. The timer carries on across Workshop pages.",
    goodbyeOption: "End with a \u201cBye bye, birdhouse\u201d button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Bye bye, birdhouse",
    farewellDone: "Bye bye!",
    restLine: "The birdhouse is resting.",
    restLine2: "The plan will be right here next time.",
    restArt: restArt,
    soundNote: "Soft pops and a bird. Hold for 2 seconds.",
    legacy: { timer: "workshop-timer-v1", sound: "workshop-sound-v1" },
    onEnding: function (done) { visitT.forEach(clearTimeout); setTimeout(done, 800); },
    onBig: function () { setTimeout(function () { resize(true); }, 50); },
    onSound: function (on) { if (on) blip(660, 0.15, 0.08, "sine", 880); }
  });

  if (debug) {
    window.__pj = {
      // mark the first k visits done (screenshots)
      done: function (k) { PJ.reset(pid); P.steps.slice(0, k).forEach(function (s) { PJ.complete(pid, s.id); }); refresh(); syncSteps(); draw(); },
      celebrate: celebrate, progress: function () { return prog; }, ghost: ghost, surprise: surprise
    };
  }
})();
</script>
</body>
