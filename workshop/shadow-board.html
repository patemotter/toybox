<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadow Board</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
/* ---------- Standard app shell (common/toybox.css, tb-v2): header, stage, panel ----------
   The panel: the three boards as picture tiles, then the bottom bar (New, Surprise). */
.tb-head a { text-decoration: none; }
.stage { background: #C9D7E3; }
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.tb-counter.full { background: var(--tb-pick); }
.tb-counter.bump { animation: bump 0.4s cubic-bezier(.3,1.6,.5,1); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.2); } 100% { transform: scale(1); } }
/* All put away: a cheer over the bench (it stays until New or another board) */
.done {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  background: var(--tb-surface, #FFFFFF);
  color: #1D2340;
  border: var(--tb-outline) solid #1D2340;
  border-radius: var(--tb-r-pill);
  box-shadow: var(--tb-card);
  padding: 2px 22px;
  font-size: clamp(1.5rem, 5vw, 2.4rem);
  font-weight: 800;
  line-height: 1.3;
  white-space: nowrap;
  animation: popin 0.5s cubic-bezier(.3,1.6,.5,1) both;
}
.done[hidden] { display: none; }
@keyframes popin { from { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
#tiles .tb-pic svg { width: 100%; height: 100%; display: block; }
/* The Back button shows the Workshop's picture (and its name on an iPad). */
.mapbtn .tb-mapic { width: 30px; height: 30px; flex: none; }
body.big .tb-head > :not(.bigtoggle) { display: none; }
body.big .tb-panel { display: none; }
body.ending .tb-panel, body.resting .tb-panel { pointer-events: none; }
body.ending .tb-panel, body.ending .mapbtn { opacity: 0.5; }
body.ending .mapbtn { pointer-events: none; }
.rest-art { width: min(60vw, 240px); }
/* Landscape: the panel is a right-hand column (the boards one a row, the bottom bar at its foot). */
@media (orientation: landscape) {
  .tb-v2 .tb-body .tb-panel { width: min(30%, 300px); }
  .tb-v2 #tiles.tb-tilerow { grid-template-columns: 1fr; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-v2 .tb-body .tb-panel { width: 250px; gap: 8px; }
  .tb-v2 #tiles.tb-tilerow { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .tb-counter.bump, .done { animation: none; }
}
</style>
</head>
<body>
<div class="tb-app-shell tb-v2 wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="wallbtn" href="./" aria-label="Back to the Workshop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><svg class="tb-mapic" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 16 20 5l16 11v20H4Z" fill="#E7B86A" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="10" y="18" width="20" height="18" fill="#AEB9C5" stroke="#1D2340" stroke-width="2.5"/><path d="M10 23h20M10 28h20M10 33h20" stroke="#1D2340" stroke-width="1.6"/></svg><span>Workshop</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Shadow Board</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A pegboard shadow board above a workbench with tools"></canvas>
      <div class="tb-counter" id="count" role="status" aria-live="polite">Put away: 0 of 8</div>
      <div id="coach"></div>
      <div class="done" id="doneBox" hidden>All put away!</div>
    </main>
    <section class="tb-panel" id="panel">
      <div id="tiles" role="group" aria-label="Boards"></div>
      <div id="bottom"></div>
    </section>
  </div>
</div>
<svg id="measure" width="1" height="1" aria-hidden="true" style="position:absolute;left:-9999px;top:0;visibility:hidden"><g id="measureG"></g></svg>

<script>
(function () {
  "use strict";

  // ---------- The safety-gear check ----------
  var gearOn = true;
  try { gearOn = sessionStorage.getItem("workshop-gear") === "on"; } catch (e) { gearOn = true; }
  if (!gearOn) {
    location.replace("./?next=shadow-board");
    return;
  }

  var SKEY = "workshop-shadow-v1";
  var coach = Toybox.coach(document.getElementById("coach"));
  var fun = null;        // the Surprise moment playing now: { kind, t, dur }
  var ghost = { learned: function () {}, again: function () {} };   // the idle hand (set up at the end)
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function wrapD(a) { a = a % 360; if (a > 180) a -= 360; if (a <= -180) a += 360; return a; }
  function easeOut(t) { t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); }
  function seeded(seed) {
    var s = (seed >>> 0) || 1;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  // ================= Tool drawings (the Tool Wall's SVG style and helpers) =================
  var O = "#1D2340";
  var STL = "#CBD4DE", STD = "#8E9BAA", STK = "#5D6878", SHN = "#F2F6FA";
  var WD = "#DDA060", WDD = "#A9692E", WDL = "#F1C890";
  var YEL = "#FFC93C", ORG = "#F77F00", RED = "#E63946", BLU = "#2D5BD7", BLK = "#343944", GRN = "#2E9E5B";
  var BRS = "#E0B44C", RUB = "#3B404C";
  var FONT = "Baloo 2, Trebuchet MS, sans-serif";
  var CFONT = '"Baloo 2", "Trebuchet MS", sans-serif';   // canvas font (quoted family names)

  function n2(v) { return Math.round(v * 10) / 10; }
  function P(d, f, w, x) {
    return '<path d="' + d + '" fill="' + (f || "none") + '" stroke="' + O + '" stroke-width="' + (w == null ? 3 : w) +
      '" stroke-linejoin="round" stroke-linecap="round"' + (x || "") + "/>";
  }
  function rr(x, y, w, h, r) {
    r = Math.max(0, Math.min(r || 0, w / 2, h / 2));
    if (!r) return "M" + n2(x) + " " + n2(y) + "h" + n2(w) + "v" + n2(h) + "h" + n2(-w) + "Z";
    return "M" + n2(x + r) + " " + n2(y) + "H" + n2(x + w - r) + "A" + n2(r) + " " + n2(r) + " 0 0 1 " + n2(x + w) + " " + n2(y + r) +
      "V" + n2(y + h - r) + "A" + n2(r) + " " + n2(r) + " 0 0 1 " + n2(x + w - r) + " " + n2(y + h) +
      "H" + n2(x + r) + "A" + n2(r) + " " + n2(r) + " 0 0 1 " + n2(x) + " " + n2(y + h - r) +
      "V" + n2(y + r) + "A" + n2(r) + " " + n2(r) + " 0 0 1 " + n2(x + r) + " " + n2(y) + "Z";
  }
  function R(x, y, w, h, f, r, sw) { return P(rr(x, y, w, h, r), f, sw); }
  function C(cx, cy, r, f, sw) {
    return '<circle cx="' + n2(cx) + '" cy="' + n2(cy) + '" r="' + n2(r) + '" fill="' + (f || "none") + '" stroke="' + O + '" stroke-width="' + (sw == null ? 3 : sw) + '"/>';
  }
  function Cf(cx, cy, r, f) { return '<circle cx="' + n2(cx) + '" cy="' + n2(cy) + '" r="' + n2(r) + '" fill="' + f + '"/>'; }
  function L(x1, y1, x2, y2, c, w, x) {
    return '<path d="M' + n2(x1) + " " + n2(y1) + "L" + n2(x2) + " " + n2(y2) + '" stroke="' + (c || O) + '" stroke-width="' + (w || 3) + '" stroke-linecap="round" fill="none"' + (x || "") + "/>";
  }
  function T(x, y, t, sz, f, anc, rot) {
    return '<text x="' + n2(x) + '" y="' + n2(y) + '" font-size="' + sz + '" font-weight="800" text-anchor="' + (anc || "middle") +
      '" dominant-baseline="central" fill="' + (f || O) + '" font-family="' + FONT + '"' + (rot ? ' transform="rotate(' + rot + " " + n2(x) + " " + n2(y) + ')"' : "") + ">" + t + "</text>";
  }
  function G(t, inner) { return "<g" + (t ? ' transform="' + t + '"' : "") + ">" + inner + "</g>"; }
  function poly(a) {
    var s = "M" + n2(a[0]) + " " + n2(a[1]), i;
    for (i = 2; i < a.length; i += 2) s += " L" + n2(a[i]) + " " + n2(a[i + 1]);
    return s + " Z";
  }
  // Saw teeth from (x1,y1) to (x2,y2). Teeth point to the right of the travel direction by h.
  function zig(x1, y1, x2, y2, n, h, rake) {
    var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy), ux = dx / len, uy = dy / len;
    var nx = -uy, ny = ux, seg = len / n, s = "", i, bx, by, f = 0.5 + (rake || 0) * 0.42;
    for (i = 0; i < n; i++) {
      bx = x1 + ux * seg * i; by = y1 + uy * seg * i;
      s += " L" + n2(bx) + " " + n2(by) + " L" + n2(bx + ux * seg * f + nx * h) + " " + n2(by + uy * seg * f + ny * h);
    }
    return s + " L" + n2(x2) + " " + n2(y2);
  }
  function star(cx, cy, r1, r2, n, rot) {
    var a = [], i, r, ang;
    for (i = 0; i < n * 2; i++) {
      r = i % 2 ? r2 : r1; ang = (rot || -90) * Math.PI / 180 + i * Math.PI / n;
      a.push(cx + r * Math.cos(ang), cy + r * Math.sin(ang));
    }
    return poly(a);
  }
  function circ(cx, cy, r) { return "M" + n2(cx + r) + " " + n2(cy) + " A" + n2(r) + " " + n2(r) + " 0 1 0 " + n2(cx - r) + " " + n2(cy) + " A" + n2(r) + " " + n2(r) + " 0 1 0 " + n2(cx + r) + " " + n2(cy) + " Z"; }
  function shine(x1, y1, x2, y2, w) { return L(x1, y1, x2, y2, "#FFFFFF", w || 3, ' opacity="0.7"'); }
  // Closed "D" handle of a Western saw; (x, y) is where the top of the handle meets the blade.
  function dHandle(x, y, k) {
    k = k || 1;
    function p(a, b) { return n2(x + a * k) + " " + n2(y + b * k); }
    var outer = "M" + p(0, -8) + " C" + p(26, -22) + " " + p(58, -18) + " " + p(70, -2) + " L" + p(66, 18) + " C" + p(58, 40) + " " + p(64, 62) + " " + p(76, 80) +
      " C" + p(60, 92) + " " + p(28, 90) + " " + p(12, 82) + " C" + p(4, 64) + " " + p(0, 50) + " " + p(-2, 40) + " Z";
    var hole = "M" + p(24, 8) + " C" + p(40, 2) + " " + p(50, 6) + " " + p(50, 16) + " C" + p(44, 34) + " " + p(46, 52) + " " + p(52, 66) +
      " C" + p(42, 72) + " " + p(32, 70) + " " + p(28, 62) + " C" + p(30, 42) + " " + p(26, 24) + " " + p(24, 8) + " Z";
    return P(outer + " " + hole, WD, 3, ' fill-rule="evenodd"') + L(x + 6 * k, y + 2 * k, x + 18 * k, y - 8 * k, WDL, 3) +
      C(x + 10 * k, y + 10 * k, 4.5 * k, BRS, 2) + C(x + 12 * k, y + 34 * k, 4.5 * k, BRS, 2);
  }
  // Classic fluted screwdriver handle (vertical) centered on cx.
  function sdHandle(cx, top, col) {
    var s = R(cx - 19, top, 38, 70, col, 16), i;
    for (i = -10; i <= 10; i += 10) s += L(cx + i, top + 12, cx + i, top + 58, "rgba(29,35,64,0.35)", 4);
    s += R(cx - 19, top, 38, 70, "none", 16);
    s += R(cx - 11, top + 68, 22, 10, STL, 3);
    return s;
  }
  function fgHandle(top, col, grip) {
    return P("M92 " + top + " L108 " + top + " L111 186 Q111 194 100 194 Q89 194 89 186 Z", col) +
      (grip ? P("M90 128 L110 128 L111 186 Q111 194 100 194 Q89 194 89 186 Z", grip) + L(93, 140, 107, 140, "#5A6070", 2.5) + L(93, 152, 107, 152, "#5A6070", 2.5) + L(93, 164, 107, 164, "#5A6070", 2.5) : "");
  }

  // ART[id] = { name, k: world units per drawing unit, f: drawing, turn: degrees (how it hangs on the board), label }
  var ART = {};
  function art(id, name, k, f, turn, label) { ART[id] = { id: id, name: name, k: k, f: f, turn: turn || 0, label: label || "" }; }
  function variant(id, base, turn) { var b = ART[base]; ART[id] = { id: id, name: b.name, k: b.k, f: b.f, turn: turn, label: b.label }; }
  // Tools with a hole hang from a hook through it (drawing units, before the tool's turn): the saw by its
  // handle and the hole in its toe, the speed square through its cut-out, the level through its slot.
  var HANG = { saw: [[-66, 112], [158, 74]], square: [[54, 100]], level: [[342, 24]] };

  art("hammer", "Claw hammer", 1.2, function () {
    return fgHandle(56, YEL, BLK) + P("M84 28 L116 28 L116 70 L84 70 Z", STL) +
      P("M86 36 L52 38 L48 34 L48 64 L52 60 L86 62 Z", STL) + R(34, 28, 16, 42, STL, 5) + shine(38, 34, 38, 62, 2.5) +
      P("M114 34 C140 34 162 44 178 76 L170 82 C156 62 140 56 114 60 Z", STL);
  });
  art("mallet", "Wooden mallet", 1.1, function () {
    return P("M92 70 L108 70 L110 190 Q110 196 100 196 Q90 196 90 190 Z", WD) + L(96, 80, 97, 188, WDL, 3) +
      P("M40 24 L160 18 L160 84 L40 78 Z", WDL) + L(52, 34, 150, 30, WD, 2.5) + L(52, 50, 150, 48, WD, 2.5) + L(52, 66, 150, 66, WD, 2.5) +
      R(92, 18, 16, 66, "none", 2, 2.5);
  });
  function sdArt(col, tip) {
    return function () { return sdHandle(100, 8, col) + R(95, 86, 10, 76, STL, 3) + shine(98, 92, 98, 156, 2) + tip; };
  }
  art("flat", "Flathead screwdriver", 1.05, sdArt(YEL, P("M95 160 L105 160 L109 180 L109 190 L91 190 L91 180 Z", STL)));
  art("phillips", "Phillips screwdriver", 1.05, sdArt(BLU, P("M95 160 L105 160 L104 182 L100 192 L96 182 Z", STL) + L(100, 166, 100, 188, O, 2)));
  art("chisel", "Chisel", 1.05, function () {
    return R(88, 8, 24, 66, WD, 10) + L(95, 16, 95, 66, "#FFFFFF", 2.5, ' opacity="0.45"') +
      R(91, 72, 18, 9, BRS, 2, 2.5) + R(96, 80, 8, 8, STL, 2, 2.5) + R(91, 88, 18, 90, STL, 1.5, 2.5) + R(91, 162, 18, 16, SHN, 1, 2.5);
  });
  art("adj", "Adjustable wrench", 1.2, function () {
    var k = "", i;
    for (i = 0; i < 5; i++) k += L(53 + i * 3, 96, 53 + i * 3, 114, O, 1.5);
    return P("M62 92 L186 96 Q198 100 186 106 L62 112 Z " + circ(178, 101, 4.5), STL, 3, ' fill-rule="evenodd"') +
      P("M30 58 Q30 48 42 48 L72 54 Q82 58 82 70 L82 120 Q82 130 70 130 L46 130 Q34 128 34 116 L34 80 Z", STL) +
      P("M12 82 L12 68 Q14 50 36 50 Q50 50 56 60 L56 82 Z", STL) + shine(20, 64, 40, 58) +
      P(rr(12, 96, 42, 16, 6), STL) + R(48, 92, 18, 26, STD, 4) + k;
  });
  art("pipe", "Pipe wrench", 1.15, function () {
    var g = 10, y = 50 - g, i, k = "";
    for (i = 0; i < 6; i++) k += L(40 + i * 4, 64, 40 + i * 4, 80, O, 1.5);
    return R(62, 54 - g, 12, 60 + g, STL, 2, 2.5) +
      P("M14 " + y + " L74 " + y + " L74 " + (y + 14) + " L28 " + (y + 14) + zig(28, y + 14, 14, y + 14, 4, -4, 0) + " Z", STL) +
      R(36, 62, 30, 20, STD, 4) + k +
      P("M14 104 L66 96 L66 120 L20 122 Z", RED) + P("M14 104" + zig(14, 104, 60, 97, 6, -4, 0), "none", 2.5) +
      P("M64 96 L184 100 Q196 106 184 114 L64 122 Z " + circ(176, 107, 4.5), RED, 3, ' fill-rule="evenodd"');
  });
  function comboArt(mm) {
    return function () {
      return P("M56 92 L150 94 L150 106 L56 108 Z", STL) + shine(64, 96, 144, 97) +
        P("M62 90 L42 76 Q16 72 10 90 L24 96 L24 104 L10 110 Q16 128 42 124 L62 110 Z", STL) +
        P(circ(166, 100, 22) + " " + star(166, 100, 12, 10, 12, 0), STL, 3, ' fill-rule="evenodd"');   // no size number: the shadow is the match
    };
  }
  [8, 10, 13, 17, 19].forEach(function (mm) { art("c" + mm, "Combination wrench", 0.5 + mm * 0.045, comboArt(mm), -90, ""); });
  art("ratchet", "Socket wrench", 1.15, function () {
    return P("M58 92 L184 94 Q196 100 184 106 L58 108 Z", STL) + P("M118 93 L184 94 Q196 100 184 106 L118 107 Z", RUB) +
      C(40, 100, 24, STL) + R(32, 92, 16, 16, "#5E6878", 2, 2.5) + P("M16 112 L28 118 L24 126 L12 120 Z", RED, 2.5) + shine(28, 84, 50, 80);
  }, 90);
  // Pliers: two handles from the pivot (py), jaws on top.
  function pliersArt(jaw, py, grip) {
    return function () {
      function y(v) { return n2(py + v); }
      var hd = "M34 " + y(-4) + " L46 " + y(4) + " L33 " + y(114) + " Q31 " + y(124) + " 22 " + y(124) + " Q13 " + y(123) + " 14 " + y(112) + " Z";
      var gr = "M24 " + y(40) + " L41 " + y(40) + " L35 " + y(116) + " Q32 " + y(127) + " 21 " + y(127) + " Q11 " + y(125) + " 12 " + y(112) + " Z";
      var side = P(hd, STL) + P(gr, grip) + L(20, py + 52, 36, py + 52, "rgba(29,35,64,0.35)", 3) + L(18, py + 66, 34, py + 66, "rgba(29,35,64,0.35)", 3);
      return side + G("translate(80 0) scale(-1 1)", side) + jaw + C(40, py, 10, STL) + C(40, py, 4, STK, 2);
    };
  }
  (function () {

      '<rect x="20" y="184" width="14" height="14" fill="#B7793F" stroke="#1D2340" stroke-width="3"/><rect x="206" y="184" width="14" height="14" fill="#B7793F" stroke="#1D2340" stroke-width="3"/>' +

      '<text x="212" y="160" font-family="Baloo 2, sans-serif" font-weight="800" font-size="13" fill="#2D5BD7">z</text></svg>';
  }

  // ================= Start up =================
  buildToolbar();
  resize();
  buildBoard(S.board, true);
  updateToolbar();
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 120); });
  if (window.ResizeObserver) { try { new ResizeObserver(function () { resize(); }).observe($("stage")); } catch (e) { /* ignore */ } }
  window.addEventListener("pagehide", function () { stash(); try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) { /* ignore */ } });

  try { if (localStorage.getItem("workshop-sound-v1") === "on") localStorage.setItem("workshop-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "workshop-shadow",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, any tool being carried drops back onto the bench, the board rests, and the controls lock. The timer carries on across Workshop pages.",
    goodbyeOption: "End with a “Bye bye, tools” button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Bye bye, tools",
    farewellDone: "Bye bye!",
    restLine: "Every tool is put away.",
    restLine2: "The shadow board will be right here next time.",
    restArt: restArt,
    soundNote: "Soft clicks and pops. Hold for 2 seconds.",
    legacy: { timer: "workshop-timer-v1", sound: "workshop-sound-v1" },
    onEnding: onEnding,
    onGoodbye: goodbye,
    onRest: onRest,
    onWake: onWake,
    onBig: function () { resize(); },
    onSound: function (on) { if (on) { ensureAudio(); blip(660, 0.15, 0.08, "sine", 880); } },
    onTimer: function (info) { TI = info; }
  });

  var lastT = performance.now(), twinkleAt = 0;
  function frame(t) {
    var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
    lastT = t;
    now = t / 1000;
    if (Toybox.timer.phase() !== "resting") {
      updateTools(dt);
      // A full board keeps twinkling.
      if (full && !reduce && now - twinkleAt > 0.35) {
        twinkleAt = now;
        var tt = pick(BD.tools);
        parts.push({ k: "star", x: tt.tx + rnd(-tt.w / 2, tt.w / 2), y: tt.ty + rnd(-tt.h / 2, tt.h / 2), vx: 0, vy: -20, life: 0, max: 0.9, r: rnd(8, 14), rot: 0, vr: 3, col: pick(STAR_COLS), g: 0 });
      }
      updateParts(dt);
      updateFun(dt);
      if (Toybox.timer.phase() === "ending") endingFrame();
      draw();
    }
    requestAnimationFrame(frame);
  }
  if (navigator.webdriver) window.__sb = {
    tools: function () { return BD.tools.map(function (t) { return { id: t.id, mode: t.mode, x: t.x, y: t.y, a: t.a, tx: t.tx, ty: t.ty, w: t.w, h: t.h, ready: !!t.sp }; }); },
    toScreen: function (x, y) { var r = cv.getBoundingClientRect(); return { x: r.left + V.bx + x * V.s, y: r.top + V.by + y * V.s }; },
    view: function () { return { V: V, BENCH: BENCH }; },
    board: function () { return BD.key; }
  };
  requestAnimationFrame(frame);
  // ---------- Idle help: the Toybox ghost hand ----------
  // Tap a tool on the bench (it flies to its shadow); once he has used the tap, the hand shows the drag.
  ghost = Toybox.ghost({
    max: 3,
    plan: function () {
      if (busy() || full || !BD || fun || Object.keys(drags).length) return null;
      var cr = cv.getBoundingClientRect(), t = null, i;
      for (i = BD.order.length - 1; i >= 0; i--) if (BD.order[i].mode === "bench") { t = BD.order[i]; break; }
      if (!t) return null;
      var p0 = [cr.left + V.bx + t.x * V.s, cr.top + V.by + t.y * V.s];
      if (!usedTap) return { pts: [p0], tap: true, key: "hang" };
      return { pts: [p0, [cr.left + V.bx + t.tx * V.s, cr.top + V.by + t.ty * V.s]], key: "hang" };
    }
  });
})();
</script>
