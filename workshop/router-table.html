<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Router Table</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workshop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}
/* ---------- Standard app shell (common/toybox.css, tb-v2): header, stage, panel ----------
   The panel: the five bits as picture tiles and the bottom bar (Shelf, New, Surprise). The router's switch is drawn
   on the cabinet (the machine's own control); the end view is a small corner panel on the stage. */
.tb-head a { text-decoration: none; }
.stage { background: #C9A877; touch-action: none; }
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#tiles .tb-pic svg { width: 100%; height: 100%; display: block; }
/* The Back button shows the Workshop's picture (and its name on an iPad). */
.mapbtn .tb-mapic { width: 30px; height: 30px; flex: none; }
/* Big: the header and the panel hide (the switch and the board do everything). */
body.big .tb-head > :not(.bigtoggle) { display: none; }
body.big .tb-panel { display: none; }
body.ending .tb-panel, body.resting .tb-panel { pointer-events: none; }
body.ending .tb-panel, body.ending .mapbtn { opacity: 0.5; }
body.ending .mapbtn { pointer-events: none; }
.rest-art { width: min(60vw, 240px); }
/* Landscape: the panel is a right-hand column (the bits three a row, the bottom bar). */
@media (orientation: landscape) {
  .tb-v2 .tb-body .tb-panel { width: min(36%, 400px); }
  .tb-v2 #tiles.tb-tilerow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-v2 .tb-body .tb-panel { width: 330px; gap: 8px; }
  .tb-v2 #tiles.tb-tilerow { gap: 6px; }
  /* the coach line sits in the band above the table, left of the end view (not over the switch) */
  #coach.tb-coach { top: 52px; bottom: auto; left: 34%; }
}
</style>
</head>
<body>
<div class="tb-app-shell tb-v2 wrap">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back mapbtn" id="wallbtn" href="./" aria-label="Back to the Workshop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><svg class="tb-mapic" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 16 20 5l16 11v20H4Z" fill="#E7B86A" stroke="#1D2340" stroke-width="2.5" stroke-linejoin="round"/><rect x="10" y="18" width="20" height="18" fill="#AEB9C5" stroke="#1D2340" stroke-width="2.5"/><path d="M10 23h20M10 28h20M10 33h20" stroke="#1D2340" stroke-width="1.6"/></svg><span>Workshop</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Router Table</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>
  <div class="tb-body app">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A router table"></canvas>
      <div class="tb-counter" id="boardsCount">Boards: 0</div>
      <div id="coach"></div>
    </main>
    <section class="tb-panel" id="panel">
      <div id="tiles" role="group" aria-label="Router bits"></div>
      <div id="bottom"></div>
    </section>
  </div>
</div>
<script>
(function () {
  "use strict";

  // ---------- Deep links and the safety-gear check ----------
  var params = {};
  try {
    location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf("=");
      var k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));
      params[k] = i < 0 ? "" : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " "));
    });
  } catch (e) { /* ignore bad query */ }
  var BIT_ORDER = ["roundover", "chamfer", "ogee", "cove", "straight"];
  var linkTool = /^[a-z]{2,20}$/.test(params.tool || "") ? params.tool : "";
  var linkBit = BIT_ORDER.indexOf(params.bit) !== -1 ? params.bit : (BIT_ORDER.indexOf(linkTool) !== -1 ? linkTool : "");
  var gearOn = true;
  try { gearOn = sessionStorage.getItem("workshop-gear") === "on"; } catch (e) { gearOn = true; }
  if (!gearOn) {
    var toolArg = linkTool || linkBit;
    location.replace("./?next=router-table" + (toolArg ? "&tool=" + encodeURIComponent(toolArg) : ""));
    return;
  }

  var OUT = "#1D2340";
  var SKEY = "workshop-router-v1";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- World (units: the board is 120 wide and 60 thick) ----------
  var BT = 60, BW = 120, BL = 250;     // board thickness, width (away from the fence), length (along the fence)
  var SEG = 5, N = BL / SEG;           // cut samples along the board
  var K = 31;                          // cut samples up the board's edge (0 = on the table)
  var CB = 16;                         // bit axis sits this far behind the fence face; bearing radius
  var P0 = 39;                         // full profile size of the profile bits
  var WS = 26;                         // straight bit: how far it cuts into the board (rabbet width)
  var BX0 = 62, BXMIN = -BL - 60, BXMAX = BX0 + 14;
  var KX = 0.42, KY = 0.5;              // the slightly angled view: depth goes up and to the left

  var BITS = {
    roundover: { name: "Roundover" },
    chamfer: { name: "Chamfer" },
    ogee: { name: "Ogee" },
    cove: { name: "Cove" },
    straight: { name: "Straight" }
  };
  var LV = [{ name: "Low", f: 0.45, s: 18 }, { name: "Middle", f: 0.8, s: 30 }, { name: "High", f: 1.15, s: 42 }];
  var WOODS = {
    pine: { name: "Pine", top: "#F3D69C", front: "#E2BC78", end: "#EBCB8E", dark: "#B98A45", chip: "#F7E1AC" },
    oak: { name: "Oak", top: "#CF9C64", front: "#B5824D", end: "#C58F58", dark: "#7E5228", chip: "#DDB27D" },
    walnut: { name: "Walnut", top: "#8A5D3B", front: "#704A2C", end: "#7A5233", dark: "#3A2414", chip: "#A77852" }
  };
  var WOOD_ORDER = ["pine", "oak", "walnut"];

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  var $ = function (id) { return document.getElementById(id); };
  var coach = Toybox.coach($("coach"));
  function seeded(seed) {
    var s = (seed >>> 0) || 1;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  // ---------- Bit profiles ----------
  // How far the bit cuts into the board edge at height u of the profile (u = 0 at the bottom of the profile).
  function rbit(id, u) {
    if (u < 0) u = 0;
    if (u >= P0) return 0;
    var a;
    if (id === "roundover") return P0 - Math.sqrt(Math.max(0, P0 * P0 - (P0 - u) * (P0 - u)));
    if (id === "chamfer") return P0 - u;
    if (id === "cove") return Math.sqrt(Math.max(0, P0 * P0 - u * u));
    if (id === "ogee") {
      a = P0 / 2;
      if (u < a) return a + Math.sqrt(Math.max(0, a * a - u * u));
      return a - Math.sqrt(Math.max(0, a * a - (2 * a - u) * (2 * a - u)));
    }
    return WS;
  }
  function expo(id, lvl) { return id === "straight" ? LV[lvl].s : P0 * LV[lvl].f; }
  // Cut depth at height v above the table, with the bit sticking up h above the table.
  function removalAt(id, h, v) {
    if (v > h + 1e-6) return 0;
    if (id === "straight") return WS;
    return rbit(id, v + (P0 - h));
  }
  function zk(k) { return BT * k / (K - 1); }

  // ---------- Saved state ----------
  function freshCuts() { var a = new Array(N * K); for (var i = 0; i < a.length; i++) a[i] = 0; return a; }
  function freshState() {
    return { bit: "roundover", lvl: 1, wood: "pine", count: 0, shelf: [], cuts: freshCuts(), bx: BX0 };
  }
  function loadState() {
    var s = freshState();
    try {
      var o = JSON.parse(localStorage.getItem(SKEY) || "null");
      if (!o || typeof o !== "object") return s;
      if (BITS[o.bit]) s.bit = o.bit;
      if (o.lvl === 0 || o.lvl === 1 || o.lvl === 2) s.lvl = o.lvl;
      if (WOODS[o.wood]) s.wood = o.wood;
      if (typeof o.count === "number" && o.count >= 0) s.count = Math.floor(o.count);
      if (Array.isArray(o.shelf)) s.shelf = o.shelf.filter(function (b) { return b && WOODS[b.w] && Array.isArray(b.p) && b.p.length === K; }).slice(-24);
      if (Array.isArray(o.cuts) && o.cuts.length === N * K) s.cuts = o.cuts.map(function (v) { return typeof v === "number" ? clamp(v, 0, BW - 6) : 0; });
      if (typeof o.bx === "number") s.bx = clamp(o.bx, BXMIN, BXMAX);
    } catch (e) { /* storage unavailable or bad data: use defaults */ }
    return s;
  }
  var saveQueued = false;
  function save() {
    if (saveQueued) return;
    saveQueued = true;
    setTimeout(function () {
      saveQueued = false;
      S.bx = R.bx;
      var o = { bit: S.bit, lvl: S.lvl, wood: S.wood, count: S.count, shelf: S.shelf, bx: Math.round(R.bx),
        cuts: S.cuts.map(function (v) { return Math.round(v * 2) / 2; }) };
      try { localStorage.setItem(SKEY, JSON.stringify(o)); } catch (e) { /* ignore */ }
    }, 400);
  }
  var S = loadState();
  // Opened from the Toybox home screen: a new uncut board and first-visit settings; keep the shelf.
  if (window.Toybox && Toybox.fresh()) { var keepShelf = S.shelf; S = freshState(); S.shelf = keepShelf; save(); }
  if (linkBit) S.bit = linkBit;
  S.lvl = 1;   // one good bit height (Middle): the height picker is gone, old saves keep their format

  // ---------- Live state ----------
  var R = {
    on: false, spin: 0, phase: 0,
    bitId: S.bit, lvl: S.lvl, hCur: expo(S.bit, S.lvl), show: 1,
    chg: null, pending: null,
    bx: S.bx, target: S.bx, board: true,
    bump: 0, flashSwitch: 0, cutAmt: 0, cutGlow: 0, finT: 0,
    fly: null, shelfPop: 0, woodPop: 0, fb: 0, moveAmt: 0, lastSay: -10
  };
  var segDone = new Array(N), doneCount = 0;
  function recountDone() {
    doneCount = 0;
    for (var i = 0; i < N; i++) {
      var m = 0;
      for (var k = 0; k < K; k++) if (S.cuts[i * K + k] > m) m = S.cuts[i * K + k];
      segDone[i] = m > 0.6 ? 1 : 0;
      doneCount += segDone[i];
    }
  }
  recountDone();
  function anyCut() { return doneCount > 0; }

  // The current bit's cut at each height (cached)
  var REM = new Array(K), REMMAX = 0, remKey = "";
  function updateRem() {
    var key = R.bitId + "|" + R.hCur.toFixed(2);
    if (key === remKey) return;
    remKey = key; REMMAX = 0;
    for (var k = 0; k < K; k++) { REM[k] = removalAt(R.bitId, R.hCur, zk(k)); if (REM[k] > REMMAX) REMMAX = REM[k]; }
  }

  // The spinning bit is a circle in the table's plane at each height; a board slice at distance dx along the
  // fence from the bit axis is cut sqrt(rb^2 - dx^2) - CB deep (rb = CB + the profile's depth there).
  function cutPass(bx, write) {
    updateRem();
    var inc = 0, maxRb = CB + REMMAX;
    if (REMMAX <= 0) return 0;
    var i0 = Math.max(0, Math.floor((-maxRb - bx) / SEG) - 1), i1 = Math.min(N - 1, Math.ceil((maxRb - bx) / SEG) + 1);
    for (var i = i0; i <= i1; i++) {
      var dx = bx + (i + 0.5) * SEG, adx = Math.abs(dx);
      if (adx >= maxRb) continue;
      for (var k = 0; k < K; k++) {
        var r = REM[k];
        if (r <= 0) continue;
        var rb = CB + r;
        if (rb <= adx) continue;
        var val = Math.sqrt(rb * rb - dx * dx) - CB;
        if (val <= 0) continue;
        if (val > BW - 6) val = BW - 6;
        var o = S.cuts[i * K + k];
        if (val > o + 0.05) {
          inc += val - o;
          if (write) {
            S.cuts[i * K + k] = val;
            if (!segDone[i] && val > 0.6) { segDone[i] = 1; doneCount++; }
          }
        }
      }
    }
    return inc;
  }

  // ---------- Canvas and layout ----------
  var cv = $("cv"), ctx = cv.getContext("2d");
  var DPR = 1, CW = 300, CH = 300;
  var TV = { x: 0, y: 0, w: 1, h: 1, s: 1, ox: 0, oy: 0 };   // the router table view
  var E = { x: 0, y: 0, w: 1, h: 1 };                        // end-view inset
  var H = { x: 0, y: 0, w: 1, h: 1 };                        // shelf
  var bgCanvas = document.createElement("canvas");
  var VIEW_W = 700, VIEW_H = 480, VIEW_CX = 6, VIEW_CY = 85;
  var WHOLE_W = 1080, WHOLE_CX = 26;    // the table top's ends as drawn (with the angled view's lean)
  var NARROW_W = 460, NARROW_CX = 62;   // phones held upright: a tighter frame, nudged toward the switch
  var IN_Y0 = -80, IN_Y1 = 132, IN_Z0 = -18, IN_Z1 = 96;
  function insetHead(w) { return clamp(w * 0.055, 15, 26) * 1.9 + 10; }
  function insetH(w) { return (w - 20) * (IN_Z1 - IN_Z0) / (IN_Y1 - IN_Y0) + insetHead(w); }

  // The whole machine stays on screen (AGENTS.md): the table from end to end with its cabinet and switch always
  // fits; the end view is a corner panel in the band above it (top-right, clear of the counter). The shelf
  // lives behind the Shelf button (drawn full-stage while it is open).
  function insetW(h) { var lo = 60, hi = 900; for (var i = 0; i < 24; i++) { var m = (lo + hi) / 2; if (insetH(m) > h) hi = m; else lo = m; } return lo; }
  function layout() {
    var pad = CW < 520 || CH < 420 ? 8 : 12;
    var fw = CW - 2 * pad;
    // tablets show the coach line top-center: the end view starts under it
    var topM = window.innerWidth >= 700 && window.innerHeight >= 700 ? 56 : 0;
    var s = fw / WHOLE_W;
    var want = Math.min(CH * 0.36, insetH(Math.min(fw * 0.62, 440)));
    var band = CH - VIEW_H * s - 3 * pad - topM;
    if (band < want) { band = want; s = Math.min(s, (CH - band - 3 * pad - topM) / VIEW_H); }
    band = Math.min(band, CH * 0.5, insetH(Math.min(fw * 0.62, 440)) + 4);
    var ew = Math.min(insetW(band), fw * 0.62, 440);
    E = { x: CW - pad - ew, y: pad + topM, w: ew, h: Math.round(insetH(ew)) };
    band += topM;
    TV = { x: pad, y: band + 2 * pad, w: fw, h: CH - band - 3 * pad };
    TV.s = s;
    TV.ox = TV.x + TV.w / 2 - WHOLE_CX * TV.s;
    TV.oy = TV.y + TV.h / 2 - VIEW_CY * TV.s;
    H = { x: pad, y: pad, w: CW - 2 * pad, h: CH - 2 * pad };
  }
  function resize() {
    var r = cv.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    CW = Math.max(100, r.width); CH = Math.max(100, r.height);
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
    layout();
    buildBg();
  }

  // ---------- Drawing helpers ----------
  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function fs(c, fill, lw, stroke) {
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (lw) { c.lineWidth = lw; c.strokeStyle = stroke || OUT; c.stroke(); }
  }
  function label(c, text, x, y, size, color, align, weight) {
    c.font = (weight || 800) + " " + size + "px \"Baloo 2\", \"Trebuchet MS\", sans-serif";
    c.textAlign = align || "center";
    c.textBaseline = "middle";
    c.fillStyle = color || OUT;
    c.fillText(text, x, y);
  }
  function pill(c, text, x, y, size, bg, fg, align) {
    c.font = "800 " + size + "px \"Baloo 2\", \"Trebuchet MS\", sans-serif";
    var w = c.measureText(text).width + size * 1.1, h = size * 1.55;
    var lx = align === "left" ? x : x - w / 2;
    rr(c, lx, y - h / 2, w, h, h / 2);
    fs(c, bg || "#FFFFFF", Math.max(2.5, size * 0.14));
    label(c, text, lx + w / 2, y + size * 0.06, size, fg || OUT);
    return { x: lx, y: y - h / 2, w: w, h: h };
  }
  // World -> projected (before the view scale): x along the fence, y away from the fence, z up.
  function q(X, Y, Z) { return [X + Y * KX, Y * KY - Z]; }
  function polyW(c, pts) {
    c.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var p = q(pts[i][0], pts[i][1], pts[i][2]);
      if (i) c.lineTo(p[0], p[1]); else c.moveTo(p[0], p[1]);
    }
    c.closePath();
  }
  function lw(px) { return px / TV.s; }
  function toScreen(X, Y, Z) { var p = q(X, Y, Z); return { x: TV.ox + p[0] * TV.s, y: TV.oy + p[1] * TV.s }; }
  function steelH(c, x0, x1) {
    var g = c.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, "#6E7683"); g.addColorStop(0.32, "#EEF1F5"); g.addColorStop(0.6, "#B4BBC6"); g.addColorStop(1, "#5A616D");
    return g;
  }

  // ---------- Background: pegboard wall and floor ----------
  function buildBg() {
    bgCanvas.width = cv.width; bgCanvas.height = cv.height;
    var c = bgCanvas.getContext("2d");
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = "#C9A877";
    c.fillRect(0, 0, CW, CH);
    var floorY = Math.min(CH, toScreen(0, 220, -212).y);
    var fx0 = TV.x - 12, fx1 = TV.x + TV.w + 12;
    if (fx0 < 20) fx0 = 0;
    if (fx1 > CW - 20) fx1 = CW;
    var step = Math.max(18, Math.min(30, CW / 34));
    c.fillStyle = "rgba(90,60,25,0.42)";
    for (var y = step / 2; y < floorY; y += step) {
      for (var x = step / 2; x < CW; x += step) {
        c.beginPath(); c.arc(x, y, Math.max(2, step * 0.11), 0, Math.PI * 2); c.fill();
      }
    }
    if (floorY < CH) {
      c.fillStyle = "#9AA0A6";
      c.fillRect(fx0, floorY, fx1 - fx0, CH - floorY);
      c.fillStyle = "rgba(255,255,255,0.18)";
      c.fillRect(fx0, floorY, fx1 - fx0, Math.min(6, CH - floorY));
      c.fillStyle = OUT;
      c.fillRect(fx0, floorY - 1.5, fx1 - fx0, 3);
    }
  }

  // ---------- The router table ----------
  var TAB_COL = "#D9D4C7", TAB_EDGE = "#A9A293", CAB = "#3E4552", CAB_L = "#525B6B", MDF = "#E6CD9C", MDF_D = "#C9AE78";
  var ALU = "#C3CAD4", ALU_D = "#8E97A4", YEL = "#FFC93C", RED = "#E63946";

  function drawCabinet(c) {
    // shadow
    c.fillStyle = "rgba(29,35,64,0.25)";

  function drawFence(c) {

  // The bit's radius at height v above the table (or -1 above the top).
  function bitShape(id, h, e) {

  }
  function drawBitMain(c, t) {

          var xx = Math.sin(ph) * pts[j][0];

      }

    c.beginPath();
    c.moveTo(-rb0, 0);
    for (i = 0; i < pts.length; i++) c.lineTo(-pts[i][0], -pts[i][1]);

      c.beginPath(); c.ellipse(0, bt - bh, CB - 1, (CB - 1) * KY, 0, 0, Math.PI * 2); fs(c, "#8E96A2", lw(2.5));
      c.beginPath(); c.arc(0, bt - bh, 3.5, 0, Math.PI * 2); fs(c, "#23272F");

  // ---------- Board ----------
  var grain = {};
  function grainFor(seed) {

    var r = seeded(seed), lines = [];
    for (var i = 0; i < 9; i++) lines.push([r(), r() * 6 - 3, r() * 6 - 3, r() * 0.5 + 0.5]);
    grain[seed] = lines;

  }
  function sectionPts(i) {

  function drawBoardMain(c, t) {
    if (!R.board) return;

    fs(c, wd.top, lw(4));
    c.save(); polyW(c, [[x0, 0, Zt], [x1, 0, Zt], [x1, BW, Zt], [x0, BW, Zt]]); c.clip();
    var gl = grainFor(S.wood.length * 7 + 3);
    c.strokeStyle = wd.dark; c.globalAlpha = 0.45; c.lineWidth = lw(2.2);
    gl.forEach(function (g, j) {
      var yy = (j + 0.5) / gl.length * BW + g[1];
      var a = q(x0, yy, Zt), b = q(x1, yy + g[2], Zt);
      c.beginPath(); c.moveTo(a[0], a[1]);
      c.bezierCurveTo(lerp(a[0], b[0], 0.33), a[1] + g[2] * 2, lerp(a[0], b[0], 0.66), b[1] - g[1] * 2, b[0], b[1]); c.stroke();
    });
    c.globalAlpha = 1; c.restore();
    // front
    polyW(c, [[x0, BW, Zb], [x1, BW, Zb], [x1, BW, Zt], [x0, BW, Zt]]);
    fs(c, wd.front, lw(4));
    c.strokeStyle = wd.dark; c.globalAlpha = 0.4; c.lineWidth = lw(2);
    for (var j = 1; j < 4; j++) {
      var a = q(x0, BW, Zb + BT * j / 4), b = q(x1, BW, Zb + BT * j / 4 + (j - 2) * 3);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
    }
    c.globalAlpha = 1;
    // left end face, with the cut profile at the back bottom corner
    var sec = sectionPts(0), i;
    var notch = [[0, 0]];
    for (i = 0; i < K; i++) notch.push([S.cuts[i], zk(i)]);
    notch.push([0, BT]);
    c.beginPath();
    for (i = 0; i < notch.length; i++) { var nq = q(x0, notch[i][0], Zb + notch[i][1]); if (i) c.lineTo(nq[0], nq[1]); else c.moveTo(nq[0], nq[1]); }

    c.globalAlpha = 1; c.restore();

  function drawFeatherboard(c, t) {

  // ---------- Chips ----------
  var chips = [], ichips = [];
  function spawnChips(n) {
    var wd = WOODS[S.wood];
    // Debris never hides the work (AGENTS.md): chips fly for the moment and fade within about 1.2 s; nothing
    // settles on the table or the board, and a low cap keeps the count small.
    n = Math.min(n, reduce ? 2 : 6);
    for (var i = 0; i < n; i++) {
      if (chips.length >= (reduce ? 10 : 28)) chips.shift();
      var toPort = Math.random() < 0.3;
      var p = q(rnd(-30, 26), rnd(-14, 4), rnd(BT * 0.5, BT + 14));
      chips.push({
        x: p[0], y: p[1], vx: toPort ? rnd(-60, 40) : rnd(-320, 140), vy: toPort ? rnd(-320, -220) : rnd(-420, -160),
        port: toPort, life: toPort ? 0.45 : rnd(0.8, 1.2), age: 0, rot: rnd(0, 6), vr: rnd(-14, 14),
        sz: rnd(5, 11), col: Math.random() < 0.5 ? wd.chip : wd.top, floor: q(0, rnd(126, 228), 0)[1], settled: false
      });
    }
    var m = Math.min(n, reduce ? 2 : 6);
    for (var j = 0; j < m && ichips.length < 16; j++) {
      ichips.push({ y: rnd(-4, 12), z: rnd(2, Math.max(4, R.hCur)), vy: rnd(-260, -60), vz: rnd(40, 260), age: 0, life: rnd(0.6, 1.1),
        rot: rnd(0, 6), vr: rnd(-12, 12), sz: rnd(2.5, 5), col: Math.random() < 0.5 ? wd.chip : wd.top });
    }
  }
  function updateChips(dt) {
    var i, p;
    for (i = chips.length - 1; i >= 0; i--) {
      p = chips[i];
      p.age += dt;
      if (p.age > p.life) { chips.splice(i, 1); continue; }
      if (p.settled) continue;
      p.vy += 900 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (!p.port && p.vy > 0 && p.y >= p.floor) { p.y = p.floor; p.vy = -Math.abs(p.vy) * 0.25; p.vx *= 0.6; }
    }
    for (i = ichips.length - 1; i >= 0; i--) {
      p = ichips[i];
      p.age += dt;
      if (p.age > p.life) { ichips.splice(i, 1); continue; }
      p.vz -= 520 * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.rot += p.vr * dt;
    }
  }
  function drawChips(c) {
    c.lineWidth = lw(1.5); c.strokeStyle = "rgba(29,35,64,0.7)";
    chips.forEach(function (p) {

      c.globalAlpha = Math.max(0, a);

      c.fillStyle = p.col; c.fill(); c.stroke();
      c.restore();
    });
    c.globalAlpha = 1;
  }

  // ---------- The whole table view ----------
  function drawTableView(c, t) {
    var sh = R.spin > 0.05 && !reduce ? R.spin : 0;

  // ---------- End-view inset ----------

  function drawInset(c, t) {

  // ---------- Shelf of finished boards ----------

  function drawShelfBoard(c, x, y, bs, woodId, prof, flipS) {

  // ---------- Prompt ----------

  // ---------- Sound (off by default; soft synthesized whine and cutting hiss) ----------
  var AC = null, master = null, whG = null, whO1 = null, whO2 = null, cutG = null, cutF = null;

      var lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1600;

    var f = R.spin;
    whG.gain.setTargetAtTime(on && f > 0.02 ? 0.01 + 0.022 * f : 0, t, 0.08);
    whO1.frequency.setTargetAtTime(120 + 520 * f, t, 0.08);
    whO2.frequency.setTargetAtTime(243 + 1050 * f, t, 0.08);
    cutG.gain.setTargetAtTime(on ? Math.min(1, R.cutAmt) * 0.06 : 0, t, 0.05);

  // ---------- Machine logic ----------
  function toggleSwitch() {
    if (busy() || R.chg) return;

    updateAria();
  }
  // Changing the bit needs the router stopped: it switches off by itself, the bit is swapped, and it switches

  function requestChange(bit, lvl) {

    R.pending = { bit: bit, lvl: lvl };
    R.autoFeed = false; R.target = R.bx;

  function startChange() {

    else R.chg = { t: 0, bit: p.bit, lvl: p.lvl, swapped: true, heightOnly: true, h0: R.hCur };
    S.bit = p.bit; S.lvl = p.lvl; save();

      return;

  // ---------- Input: tap or drag (Toybox.press, several fingers at once) ----------
  // Tap the switch: on/off. Tap the board: a whole pass past the bit at a calm feed (at the far end, a fully cut
  // board goes to the shelf; otherwise it comes back for another pass). Drag: push the board by hand.
  var drags = {};
  function localPt(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function inRect(p, r, m) { m = m || 0; return p.x >= r.x - m && p.x <= r.x + r.w + m && p.y >= r.y - m && p.y <= r.y + r.h + m; }
  function switchScreenRect() {
    var r = switchRect();
    return { x: TV.ox + r.x * TV.s, y: TV.oy + r.y * TV.s, w: r.w * TV.s, h: r.h * TV.s };
  }
  function boardScreenRect() {
    var a = toScreen(R.bx, 0, BT), b = toScreen(R.bx + BL, BW, 0);
    return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(b.x - a.x), h: Math.abs(b.y - a.y) };
  }
  function onDown(part, e) {
    if (busy()) return;
    var p = localPt(e);
    ensureAudio();
    if (R.shelfOpen) { drags[e.pointerId] = { shelf: true }; return; }
    if (inRect(p, switchScreenRect(), 14)) { toggleSwitch(); ghost.learned("switch"); return; }
    var onBoard = R.board && inRect(p, boardScreenRect(), 30);
    if (onBoard || inRect(p, TV)) drags[e.pointerId] = { lx: p.x, onBoard: onBoard };
  }
  function dragStart(part, e) {
    var d = drags[e.pointerId];
    if (d && !d.shelf) { R.autoFeed = false; R.target = R.bx; d.lx = localPt(e).x; }
  }
  function onMove(part, e) {
    var d = drags[e.pointerId];
    if (!d || d.shelf || busy()) return;
    var p = localPt(e);
    // Gesture gain: the whole pass past the bit takes about 170 px of finger on any screen (the board moves
    // further than the finger on the big iPad table). Lifting keeps the board where it is, so short pushes
    // one after another feed it through too.
    R.target = clamp(R.target + (p.x - d.lx) / TV.s * feedGain(), BXMIN, BXMAX);
    if (Math.abs(p.x - d.lx) > 0 && cuttingOn()) ghost.learned("push");
    d.lx = p.x;
  }
  function feedGain() { return Math.max(1, (BX0 - BXMIN) * TV.s / 170); }
  function onUp(part, e, st) {
    var d = drags[e.pointerId];
    if (!d) return;
    delete drags[e.pointerId];
    var any = false;
    for (var id in drags) if (drags.hasOwnProperty(id)) any = true;
    if (!any) R.target = clamp(R.target, BXMIN, BXMAX);
    if (st && st.tap && !busy()) {
      if (d.shelf) { showShelf(false); return; }
      tapBoard();
    }
  }
  // One press is always enough: a tap plays the whole pass.
  function tapBoard() {
    usedTap.push = true;
    if (!R.board || R.fly) return;
    if (R.chg || R.pending) { say("Changing the bit"); return; }
    if (!R.on) {
      // Two-step machine: the first tap with the router off flashes the switch; the second switches it on.
      R.flashSwitch = now + 1.6;
      if ((R.offTries = (R.offTries || 0) + 1) < 2) { say("Switch the router on!"); return; }
      R.offTries = 0; toggleSwitch();
    }
    if (R.bx <= BXMIN + 8) {
      if (doneCount >= N) { finishBoard(); return; }
      R.target = BX0;                       // back for another pass
    } else R.target = BXMIN;
    R.autoFeed = true;
  }
  var press = Toybox.press(cv, { any: true, down: onDown, dragStart: dragStart, move: onMove, up: onUp });
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });

  // ---------- Coach line and ghost hand: switch it on, then tap (later: push) the board ----------
  function coachStep() {
    if (busy() || R.chg || R.pending || R.fly || R.autoFeed || R.shelfOpen || !R.board) return "";
    if (!R.on) return "Switch the router on!";
    if (!anyCut()) return "Push the board!";
    return "";
  }
  var lastStep = null;
  setInterval(function () {
    var t = coachStep();
    if (t !== lastStep) { lastStep = t; if (t) coach.step(t); else coach.clear(); }
  }, 300);
  var usedTap = {};
  var ghost = Toybox.ghost({
    max: 3,
    plan: function () {
      if (busy() || R.chg || R.fly || !R.board || R.autoFeed || R.shelfOpen) return null;
      for (var id in drags) if (drags.hasOwnProperty(id)) return null;
      var cr = cv.getBoundingClientRect();
      if (!R.on) {
        var sr = switchScreenRect();
        return { pts: [[cr.left + sr.x + sr.w / 2, cr.top + sr.y + sr.h / 2]], tap: true, key: "switch" };
      }
      if (R.spin < 0.45 || R.bx <= BXMIN + 20 || anyCut()) return null;
      var br = boardScreenRect(), x0 = cr.left + br.x + br.w * 0.62, y0 = cr.top + br.y + br.h * 0.5;
      if (!usedTap.push) return { pts: [[x0, y0]], tap: true, key: "push" };
      var dx = Math.min((R.bx - BXMIN) * TV.s / feedGain(), cr.width * 0.55, 170);   // the geared-up push: a short move
      return { pts: [[x0, y0], [x0 - dx, y0]], key: "push" };
    }
  });

  // ---------- Surprise: a fun moment on the table, taking turns ----------
  // A long curly shaving shoots out of the bit and drapes over the fence; or the board gets a happy face and winks.
  var funTurn = 0;
  function surprise() {
    if (busy()) return;
    showShelf(false);
    if (R.fun) return;
    var kind = funTurn++ % 2 ? "face" : "curl";
    R.fun = { kind: kind, t: 0, dur: kind === "curl" ? 3.4 : 3.6 };
    coach.say(kind === "curl" ? "A long curly shaving!" : "The board says hi!", 3);
    blip(kind === "curl" ? 700 : 520, 0.16, 0.06, "sine", kind === "curl" ? 1200 : 780);
  }
  function drawFun(c, t) {
    var F = R.fun;
    if (!F) return;
    c.save();
    c.setTransform(DPR * TV.s, 0, 0, DPR * TV.s, DPR * TV.ox, DPR * TV.oy);
    var a = clamp(Math.min(F.t, F.dur - F.t) / 0.35, 0, 1), wd = WOODS[S.wood], i;
    c.globalAlpha = a; c.lineCap = "round"; c.lineJoin = "round";
    if (F.kind === "curl") {
      // from the bit, up over the fence top and down its back, coiling as it goes
      var grow = Math.min(1, F.t / 1.1), n = Math.round(90 * grow), pts = [];
      for (i = 0; i <= n; i++) {
        var u = i / 90, ang = u * Math.PI * 9;
        var bx = lerp(0, -260, u), by = -20 - Math.sin(Math.min(1, u * 1.6) * Math.PI * 0.5) * 70 + Math.max(0, u - 0.62) * 260;
        pts.push(q(bx + Math.cos(ang) * 10, by, BT + 30 + Math.sin(ang) * 12));
      }
      if (pts.length > 1) {
        c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
        for (i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
        c.strokeStyle = OUT; c.lineWidth = 13; c.stroke();
        c.strokeStyle = wd.chip; c.lineWidth = 8; c.stroke();
      }
    } else if (R.board) {
      var mid = q(R.bx + BL * 0.55, BW * 0.5, BT), wink = F.t > 1.4 && F.t < 1.8;
      var hop = Math.abs(Math.sin(F.t * 6)) * 6 * (F.t < 1.2 ? 1 : 0);
      c.translate(mid[0], mid[1] - hop);
      c.fillStyle = OUT; c.strokeStyle = OUT; c.lineWidth = 5;
      c.beginPath(); c.arc(-24, -6, 7, 0, Math.PI * 2); c.fill();
      if (wink) { c.beginPath(); c.moveTo(16, -6); c.lineTo(32, -6); c.stroke(); }
      else { c.beginPath(); c.arc(24, -6, 7, 0, Math.PI * 2); c.fill(); }
      c.beginPath(); c.arc(0, 4, 18, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
      c.fillStyle = "rgba(255,120,140,0.45)";
      c.beginPath(); c.arc(-40, 8, 9, 0, Math.PI * 2); c.arc(40, 8, 9, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }

  // ---------- Panel: the bits (tiles) and the bottom bar (Shelf, New, Surprise) ----------
  function n1(v) { return Math.round(v * 10) / 10; }
  function bitIconSVG(id) {
    var right = [], v, i, top = id === "straight" ? 46 : P0;
    for (i = 0; i <= 20; i++) {
      v = -12 + (top + 12) * i / 20;
      right.push([CB + (id === "straight" ? WS : rbit(id, v)), v]);
    }
    var d = "M" + -12 + " 52 L-12 12 ";
    d += "L" + n1(-right[0][0]) + " " + n1(-right[0][1]) + " ";
    for (i = 0; i < right.length; i++) d += "L" + n1(-right[i][0]) + " " + n1(-right[i][1]) + " ";
    for (i = right.length - 1; i >= 0; i--) d += "L" + n1(right[i][0]) + " " + n1(-right[i][1]) + " ";
    d += "L12 12 L12 52 Z";
    var s = '<svg viewBox="-64 -58 128 114" aria-hidden="true"><path d="' + d + '" fill="#C8CDD6" stroke="#1D2340" stroke-width="5" stroke-linejoin="round"/>';
    // a carbide cutting edge following the profile
    var cd = "";
    for (i = 0; i < right.length; i++) cd += (i ? "L" : "M") + n1(right[i][0] - 5) + " " + n1(-right[i][1]) + " ";
    s += '<path d="' + cd + '" fill="none" stroke="#3A3F4A" stroke-width="6" stroke-linecap="round"/>';
    s += '<rect x="-12" y="16" width="24" height="36" fill="#AEB5C0" stroke="#1D2340" stroke-width="5"/>';
    if (id !== "straight") s += '<rect x="-15" y="' + (-P0 - 10) + '" width="30" height="10" rx="3" fill="#4A505B" stroke="#1D2340" stroke-width="4"/>';
    else s += '<path d="M-30 -36 L22 -6 M-30 -6 L22 24" stroke="#5E6570" stroke-width="5" stroke-linecap="round" fill="none"/>';
    return s + "</svg>";
  }
  var SHORT_BIT = { roundover: "Round", chamfer: "Bevel", ogee: "Ogee", cove: "Cove", straight: "Groove" };
  var tiles = null, bbar = null;
  function buildToolbar() {
    tiles = Toybox.tiles($("tiles"), {
      kind: "pick", rows: 2, value: S.bit,
      items: BIT_ORDER.map(function (id) { return { id: id, name: SHORT_BIT[id], pic: bitIconSVG(id) }; }),
      onPick: function (id) { ensureAudio(); showShelf(false); requestChange(id, S.lvl); blip(560, 0.05, 0.04, "triangle"); }
    });
    BIT_ORDER.forEach(function (id) { var b = tiles.button(id); if (b) b.setAttribute("aria-label", BITS[id].name + " bit"); });
    bbar = Toybox.bar($("bottom"), {
      shelf: function () { showShelf(!R.shelfOpen); },
      onNew: function () { ensureAudio(); showShelf(false); newBoard(); },
      onSurprise: function () { ensureAudio(); surprise(); }
    });
  }
  function updateToolbar() {
    if (tiles) tiles.set(R.pending ? R.pending.bit : S.bit);
  }
  function showShelf(on) {
    on = !!on;
    if (on && busy()) return;
    if (R.shelfOpen === on) return;
    R.shelfOpen = on;
    if (on) { drags = {}; R.autoFeed = false; R.target = R.bx; }
    if (bbar) bbar.shelfOpen(on);
  }
  var shownCount = -1;
  function updateCounter() {
    if (shownCount === S.count) return;
    var el = $("boardsCount"), pop = shownCount >= 0;
    shownCount = S.count;
    el.textContent = "Boards: " + S.count;
    if (pop && !reduce) { el.classList.remove("tb-pop"); void el.offsetWidth; el.classList.add("tb-pop"); }
  }

  document.addEventListener("keydown", function (e) {
    if (busy() || Toybox.sheetOpen()) return;
    if ((e.key === " " || e.key === "Enter") && e.target === document.body) { e.preventDefault(); toggleSwitch(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      R.target = clamp(R.bx + (e.key === "ArrowLeft" ? -24 : 24), BXMIN, BXMAX);
    }
    else if (e.key === "Escape") showShelf(false);
  });

  // ---------- Play timer hooks ----------
  // Ending: the router switches off (by itself, or with the "Switch off" button), the bit spins down, then done().
  var endingDone = null;
  function goodbyeOn() {
    try { var t = JSON.parse(localStorage.getItem("toybox-timer-v1") || "null"); return !t || t.goodbye !== false; } catch (e) { return true; }
  }
  function onEnding(done) {
    endingDone = done;
    drags = {};
    R.target = R.bx;
    R.pending = null; R.autoFeed = false; R.fun = null; R.resumeOn = false;
    showShelf(false);
    if (!goodbyeOn()) R.on = false;
    else if (!R.on) {
      setTimeout(function () { var gb = $("tb-goodbye"); if (Toybox.timer.phase() === "ending" && gb && !gb.hidden) gb.click(); }, 0);
    }
  }
  function goodbye() {
    if (R.on) blip(260, 0.1, 0.07, "square", 160);
    R.on = false;
  }
  function endingFrame() {
    if (endingDone && !R.on && R.spin < 0.01) { endingDone(); endingDone = null; }
  }
  function onRest() { endingDone = null; R.on = false; R.spin = 0; }
  function onWake() { endingDone = null; }
  function restArt() {
    return '<svg class="rest-art" viewBox="0 0 240 200" aria-hidden="true">' +
      '<path d="M40 96 L208 96 L228 70 L60 70 Z" fill="#D9D4C7" stroke="#1D2340" stroke-width="4" stroke-linejoin="round"/>' +
      '<rect x="40" y="96" width="168" height="12" fill="#B9B2A3" stroke="#1D2340" stroke-width="4"/>' +
      '<rect x="52" y="108" width="144" height="76" fill="#525B6B" stroke="#1D2340" stroke-width="4"/>' +
      '<rect x="150" y="122" width="34" height="40" rx="6" fill="#FFC93C" stroke="#1D2340" stroke-width="3.5"/>' +
      '<rect x="156" y="132" width="22" height="24" rx="4" fill="#E63946" stroke="#1D2340" stroke-width="3"/>' +
      '<path d="M66 72 L196 72 L196 46 L66 46 Z" fill="#E6CD9C" stroke="#1D2340" stroke-width="4" stroke-linejoin="round"/>' +
      '<path d="M122 82 Q131 74 140 82 Z" fill="#C8CDD6" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/>' +
      '<rect x="76" y="74" width="40" height="14" rx="2" fill="#F3D69C" stroke="#1D2340" stroke-width="3"/>' +
      '<path d="M190 24 q8 -8 16 0 M196 12 q6 -6 12 0" fill="none" stroke="#2D5BD7" stroke-width="3" stroke-linecap="round"/>' +
      '<text x="200" y="40" font-family="Baloo 2, sans-serif" font-weight="800" font-size="18" fill="#2D5BD7">z</text>' +
      '<text x="214" y="26" font-family="Baloo 2, sans-serif" font-weight="800" font-size="14" fill="#2D5BD7">z</text></svg>';
  }

  // ---------- Start up ----------
  buildToolbar();
  updateToolbar();
  resize();
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 120); });
  if (window.ResizeObserver) { try { new ResizeObserver(function () { resize(); }).observe($("stage")); } catch (e) { /* ignore */ } }

  try { if (localStorage.getItem("workshop-sound-v1") === "on") localStorage.setItem("workshop-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "workshop-router",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the router switches off, the bit spins down and rests, and the controls lock. The timer carries on across Workshop pages.",
    goodbyeOption: "End with a “Switch off” button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Switch off",
    farewellDone: "Bye bye!",
    restLine: "The router is resting.",
    restLine2: "Your boards will be right here next time.",
    restArt: restArt,
    soundNote: "A soft router whine and a cutting sound. Hold for 2 seconds.",
    legacy: { timer: "workshop-timer-v1", sound: "workshop-sound-v1" },
    onEnding: onEnding,
    onGoodbye: goodbye,
    onRest: onRest,
    onWake: onWake,
    onBig: function () { resize(); },
    onSound: function (on) { if (on) { ensureAudio(); blip(660, 0.15, 0.08, "sine", 880); } }
  });
  Toybox.offFirst({
    running: function () { return R.on || R.spin > 0.05; },
    name: "router table",
    off: function (done) {
      if (R.on) blip(260, 0.08, 0.07, "square", 180);
      R.on = false; R.fastStop = true; R.pending = null; drags = {}; R.target = R.bx;
      updateAria();
      var t0 = performance.now();
      var iv = setInterval(function () {
        if ((!R.on && R.spin <= 0.05) || performance.now() - t0 >= 850) {
          clearInterval(iv);
          R.spin = 0; R.fastStop = false;
          done();
        }
      }, 30);
    },
    flash: function () { R.flashSwitch = now + 3.2; }
  });

  var lastLabel = "";
  function updateAria() {
    var t = "Router table, " + (R.on ? "running" : "switched off") + ", " + BITS[R.bitId].name + " bit, " + LV[R.lvl].name.toLowerCase() + " height. " +
      WOODS[S.wood].name + " board" + (anyCut() ? " with a " + BITS[R.bitId].name.toLowerCase() + " edge" : "") + ". Boards: " + S.count + ".";
    if (t !== lastLabel) { lastLabel = t; cv.setAttribute("aria-label", t); }
  }
  var lastT = performance.now(), ariaAt = 0;
  function frame(t) {
    var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
    lastT = t;
    now = t / 1000;
    if (Toybox.timer.phase() !== "resting") {
      update(dt);
      if (Toybox.timer.phase() === "ending") endingFrame();
      draw(now);
      if (now - ariaAt > 1) { ariaAt = now; updateAria(); }
    }
    updateSound();
    requestAnimationFrame(frame);
  }
  if (params.debug === "1" || navigator.webdriver) window.__rt = { S: function () { return S; }, R: R, toScreen: toScreen, TV: function () { return TV; }, E: function () { return E; }, H: function () { return H; }, sw: switchScreenRect, board: boardScreenRect, done: function () { return doneCount; },
    chips: function () { return chips.length + ichips.length; },
    ui: function () { return { on: R.on, bx: Math.round(R.bx), auto: !!R.autoFeed, done: doneCount, count: S.count, shelf: S.shelf.length, wood: S.wood, bit: R.bitId, chg: !!(R.chg || R.pending), fly: !!R.fly, coach: coach.text(), open: !!R.shelfOpen }; },
    ghost: function () { return ghost.show(); } };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
