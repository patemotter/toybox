<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Car Builder</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Car Builder">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --go: #E63946;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
/* ---------- Stage: the vehicle ---------- */
.stage { background: #8FD0F7; }
.stage-inner { height: 100%; display: flex; flex-direction: column; }
.scene {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
  background: #8FD0F7;
  touch-action: none;
  cursor: pointer;
}
#art { display: block; width: 100%; height: 100%; touch-action: none; }
/* Go row: the green Drive! button. */
.launchbar { flex: none; display: flex; justify-content: center; }
.launchbar .launch { width: 100%; }
.launch {
  width: min(100%, 560px);
  min-height: 60px;
  font-size: 1.9rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  line-height: 1;
  color: #FFFFFF;
  background: var(--go);
  border-color: #1D2340;
  box-shadow: 4px 4px 0 #1D2340;
  text-shadow: 2px 2px 0 #1D2340;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.launch:active { box-shadow: 0 0 0 #1D2340; }
.launch svg { width: 1.3em; height: 1.3em; flex: none; }
@media (prefers-reduced-motion: no-preference) {
  .launch { animation: throb 1.6s ease-in-out infinite; }
  .launch:active { animation: none; }
}
@keyframes throb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

/* Builder animations on the SVG rocket. */
.rocket, .spark, .puff { transform-box: fill-box; }
.rocket { transform-origin: 50% 100%; }
.rocket.pop { animation: pop 0.65s cubic-bezier(.3, 1.6, .5, 1); }
.rocket.hop { animation: hop 0.85s ease-out; }
@keyframes pop { 0% { transform: scale(0.9, 1.1); } 45% { transform: scale(1.07, 0.94); } 100% { transform: none; } }
@keyframes hop { 0% { transform: none; } 30% { transform: translateY(-46px) rotate(-3deg); } 62% { transform: translateY(0) scale(1.06, 0.93); } 82% { transform: translateY(-8px) rotate(1deg); } 100% { transform: none; } }
.spark { transform-origin: 50% 50%; animation: spark 0.9s ease-out forwards; }
@keyframes spark { 0% { transform: scale(0) rotate(0deg); opacity: 1; } 45% { transform: scale(1.25) rotate(60deg); opacity: 1; } 100% { transform: scale(0) rotate(120deg); opacity: 0; } }
.puff { transform-origin: 50% 50%; animation: puff 1.2s ease-out forwards; }
@keyframes puff { 0% { transform: scale(0.3); opacity: 0.95; } 100% { transform: scale(2.2); opacity: 0; } }
.night { opacity: 0; transition: opacity 4s ease; }
body.ending .night { opacity: 1; }

/* Play-timer gauge in the corner of the picture. */
.fuel {
  position: absolute;
  top: 8px;
  left: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  pointer-events: none;
}
.fuel[hidden] { display: none; }
.fuel-bar {
  width: clamp(70px, 22vw, 170px);
  height: 18px;
  background: rgba(255, 255, 255, 0.7);
  border: 3px solid #1D2340;
  border-radius: 999px;
  overflow: hidden;
}
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num {
  min-width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  background: #FFFFFF;
  color: #1D2340;
  border: 3px solid #1D2340;
  border-radius: 50%;
  font-size: 1.3rem;
  font-weight: 800;
  line-height: 1;
}
.fuel-num[hidden] { display: none; }

/* ---------- Big mode: the panel goes away, the header stays (Big turns into Back) ---------- */

/* ---------- Panel: build + colors ---------- */
.tb-panel .panel-body.tb-choices {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0;
  overflow: hidden;
}
.panel-body > [data-pane] { grid-area: 1 / 1; visibility: hidden; margin: 0; min-width: 0; }
.tb-panel[data-tab="build"] [data-pane="build"] { visibility: visible; }
.panel-body section + section { margin-top: 10px; }
.row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  padding-right: 3px;
}
.row .btn {
  flex: 0 0 calc((100% - 12px) / 3);
  min-width: 0;
  min-height: 40px;
  padding: 0.2rem 0.2rem;
  font-size: clamp(0.76rem, 3.5vw, 1rem);
  white-space: nowrap;
  overflow: hidden;
}
.row.four .btn { flex-basis: calc((100% - 18px) / 4); font-size: clamp(0.68rem, 3vw, 1rem); padding: 0.2rem 0.1rem; }
.row.four .dot { width: 11px; height: 11px; margin-right: 3px; border-width: 1.5px; }
.dot {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid #1D2340;
  vertical-align: -2px;
  margin-right: 4px;
}
#buildParts, #colorParts { min-height: 86px; align-content: flex-start; }
.options {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 6px;
  max-width: 520px;
  margin: 0 auto;
}
.opt {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 5px 2px 3px;
  min-height: 0;
  font-size: clamp(0.7rem, 3.2vw, 0.95rem);
  line-height: 1.15;
  white-space: nowrap;
}
.opt svg { width: 44px; height: 54px; display: block; }
.swatches {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
  margin-top: 8px;
}
.swatch {
  aspect-ratio: 1;
  width: 100%;
  border-radius: 50%;
  border: 3px solid var(--edge);
  cursor: pointer;
  padding: 0;
  font: inherit;
  font-size: 1.1rem;
  font-weight: 800;
  display: grid;
  place-items: center;
  box-shadow: 2px 2px 0 var(--edge);
}
.swatch[aria-pressed="true"] { outline: 5px solid var(--accent); outline-offset: 2px; }
.swatch:focus-visible { outline: 5px solid var(--focus); outline-offset: 2px; }
.tb-tabs .tab[aria-selected="true"] { background: var(--accent); color: #1D2340; }

/* ---------- Timer: the toast, banner, sheet and rest screen are in common/toybox.css ---------- */
/* While driving full screen, the ending banner stays out of the way (the drive parks by itself). */
.flight:not([hidden]) ~ #tb-farewell { display: none; }
body.ending .panel-body,
body.ending [data-action="surprise"] { pointer-events: none; opacity: 0.4; }
body.ending .launchbar { visibility: hidden; }

/* ---------- Rest picture (the rest screen itself is in common/toybox.css) ---------- */
.rest-art {
  display: block;
  width: min(62vw, 240px, 34vh);
  aspect-ratio: 520 / 660;
  height: auto;
  margin: 0 auto 6px;
  border: 3px solid #1D2340;
  border-radius: 18px;
}

/* ---------- Flight: full-screen launch ---------- */
.flight {
  position: fixed;
  inset: 0;
  z-index: 40;
  overflow: hidden;
  background: #5BB8F0;
  touch-action: none;
  color: #1D2340;
}
.flight[hidden] { display: none; }
#fcv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud {
  position: absolute;
  top: max(10px, env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
  background: rgba(255, 255, 255, 0.93);
  border: 3px solid #1D2340;
  border-radius: 20px;
  box-shadow: 4px 4px 0 #1D2340;
  padding: 2px 18px 4px;
  white-space: nowrap;
}
.hud .lbl { font-size: clamp(0.95rem, 2.6vw, 1.4rem); font-weight: 800; line-height: 1.1; margin-top: 2px; }
.hud .num {
  font-size: clamp(2rem, 7.5vw, 4.4rem);
  font-weight: 800;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
  min-width: 6.4ch;
}
.hud .best { font-size: clamp(0.95rem, 2.6vw, 1.3rem); font-weight: 700; line-height: 1.1; }
.hud .best[hidden] { display: none; }
.fback {
  position: absolute;
  top: max(10px, env(safe-area-inset-top, 0px));
  left: max(10px, env(safe-area-inset-left, 0px));
  min-height: 48px;
  font-size: 1.05rem;
  padding: 0.2rem 0.9rem;
  color: #1D2340;
  background: #FFFFFF;
  border-color: #1D2340;
  box-shadow: 3px 3px 0 #1D2340;
}
.count {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
}
.count span {
  display: block;
  font-size: min(58vh, 78vw);
  font-weight: 800;
  line-height: 1;
  color: #FFC93C;
  -webkit-text-stroke: 0.03em #1D2340;
  text-shadow: 0.05em 0.05em 0 #1D2340;
  opacity: 0;
}
.count span.lift { font-size: min(22vh, 17vw); color: #FFFFFF; }
.count span.go { animation: countPop 0.75s cubic-bezier(.2, .9, .3, 1) forwards; }
.count span.lift.go { animation: liftPop 1.2s ease-out forwards; }
@keyframes countPop {
  0% { transform: scale(2.4); opacity: 0; }
  22% { transform: scale(0.95); opacity: 1; }
  32% { transform: scale(1.04); opacity: 1; }
  78% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0.55); opacity: 0; }
}
@keyframes liftPop {
  0% { transform: scale(0.3) rotate(-6deg); opacity: 0; }
  20% { transform: scale(1.1) rotate(2deg); opacity: 1; }
  70% { transform: scale(1) rotate(0deg); opacity: 1; }
  100% { transform: scale(1.4) translateY(-30%); opacity: 0; }
}
.banner {
  position: absolute;
  left: 50%;
  top: max(15%, 104px);
  transform: translateX(-50%);
  pointer-events: none;
  background: #FFC93C;
  color: #1D2340;
  border: 4px solid #1D2340;
  border-radius: 22px;
  box-shadow: 5px 5px 0 #1D2340;
  padding: 0.1rem 1.1rem 0.25rem;
  font-size: clamp(1.6rem, 5.6vw, 3.2rem);
  font-weight: 800;
  line-height: 1.15;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.banner[hidden] { display: none; }
.banner.go { animation: bannerPop 0.6s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bannerPop { 0% { transform: translateX(-50%) scale(0.3); } 100% { transform: translateX(-50%) scale(1); } }
.fhint {
  position: absolute;
  left: 50%;
  bottom: max(16px, env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  pointer-events: none;
  background: rgba(255, 255, 255, 0.93);
  border: 3px solid #1D2340;
  border-radius: 999px;
  padding: 0.1rem 1rem 0.2rem;
  font-size: clamp(1.1rem, 3.6vw, 1.6rem);
  font-weight: 800;
  white-space: nowrap;
  transition: opacity 0.5s ease;
}
.fhint[hidden] { display: none; }
.fhint.fade { opacity: 0; }
.landbar {
  position: absolute;
  left: 50%;
  bottom: max(14px, env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  align-items: stretch;
  width: min(92vw, 560px);
}
.landbar[hidden] { display: none; }
.landbar .launch { flex: 1 1 auto; width: auto; }
.landbar .bbuild { flex: none; font-size: 1.2rem; color: #1D2340; background: #FFFFFF; border-color: #1D2340; box-shadow: 3px 3px 0 #1D2340; }

/* Landscape (phone on its side, tablet, desktop): picture on the left, controls on the right. */
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(56%, 460px); }
  .tb-body .tb-panel .panel-body.tb-choices { align-content: center; }
}

/* Larger screens (tablets, desktop): bigger touch targets, and controls kept to a comfortable width. */
@media (min-width: 744px) and (min-height: 640px) {
  .tb-panel { gap: 12px; }
  .launchbar .btn.tb-go.launch { min-height: 76px; font-size: 2.2rem; }
  .panel-body > [data-pane] { width: 100%; max-width: 560px; justify-self: center; }
  .panel-body section + section { margin-top: 16px; }
  .row { gap: 10px; }
  .row .btn { flex-basis: calc((100% - 20px) / 3); min-height: 56px; font-size: 1.1rem; }
  .row.four .btn { flex-basis: calc((100% - 30px) / 4); font-size: 1.05rem; }
  .row .dot { width: 18px; height: 18px; margin-right: 6px; }
  #buildParts, #colorParts { min-height: 122px; }
  .options { gap: 10px; }
  .opt { font-size: 1.05rem; padding: 7px 4px 5px; }
  .opt svg { width: 76px; height: 94px; }
  .swatches { gap: 10px; margin-top: 12px; }
  .swatch { font-size: 1.4rem; }
  .fuel { top: 12px; left: 12px; }
  .fuel-bar { height: 22px; }
  .fuel-num { min-width: 48px; height: 48px; font-size: 1.5rem; }
  .fback { min-height: 56px; font-size: 1.25rem; }
  .landbar .launch { min-height: 84px; font-size: 2.6rem; }
  .landbar .bbuild { font-size: 1.4rem; padding: 0.4rem 1.4rem; }
}
@media (min-width: 744px) and (min-height: 640px) and (orientation: landscape) {
  /* a slimmer column on tablets held sideways, so the stage (and the vehicle) is wider; wide enough for the
     full vehicle names at 14 px or more */
  .tb-body .tb-panel { width: min(42%, 500px); }
  .row .btn { min-height: 64px; }
  .opt svg { width: 88px; height: 110px; }
}

/* Short landscape phones: no title, tighter panel. */
@media (orientation: landscape) and (max-height: 520px) {
  .tb-panel { gap: 6px; }
  .launchbar .btn.tb-go.launch { min-height: 52px; font-size: 1.5rem; }
  .swatches { gap: 6px; }
  /* vw-based sizes are tuned for portrait; the landscape panel is narrower than the screen width suggests. */
  .row .btn, .row.four .btn { font-size: 0.82rem; }
  .opt { font-size: 0.72rem; }
  .opt svg { width: 40px; height: 48px; }
  .hud { padding: 0 14px 2px; }
  .hud .num { font-size: 2.1rem; }
  .hud .lbl, .hud .best { font-size: 0.9rem; }
  .landbar {
    left: auto;
    right: max(14px, env(safe-area-inset-right, 0px));
    transform: none;
    width: auto;
    flex-direction: column;
    align-items: stretch;
  }
  .landbar .launch { min-height: 56px; font-size: 1.4rem; padding: 0.3rem 1rem; }
  .banner { left: max(14px, env(safe-area-inset-left, 0px)); top: 42%; transform: none; font-size: 1.6rem; }
  .banner.go { animation: bannerPopL 0.45s cubic-bezier(.3, 1.6, .5, 1); }
}
@keyframes bannerPopL { 0% { transform: scale(0.3); } 100% { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  .rocket.pop, .rocket.hop { animation: none; }
}
/* ---------- Car Builder additions ---------- */
.tb-panel[data-tab="vehicle"] [data-pane="vehicle"] { visibility: visible; }
.picrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.picrow.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pic {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0;
  padding: 4px 2px 2px; min-height: 0; min-width: 0;
  font-size: clamp(0.72rem, 3.3vw, 1rem); line-height: 1.1; white-space: nowrap; overflow: hidden;
}
.pic svg { width: 100%; height: 50px; display: block; }
.fams .pic svg { height: 62px; }
.picrow + .picrow { margin-top: 10px; }
.options.many { grid-auto-flow: row; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-columns: auto; }
.opt svg { width: 100%; height: 56px; }
.opt .numpic { width: 44px; height: 44px; display: grid; place-items: center; font-size: 1.7rem; font-weight: 800; }
#art { display: block; width: 100%; height: 100%; touch-action: none; }

/* Drive screen */
.dhud {
  position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  pointer-events: none; background: rgba(255, 255, 255, 0.93); border: 3px solid #1D2340; border-radius: 20px;
  box-shadow: var(--tb-card); padding: 0 18px 2px; white-space: nowrap;
  font-size: clamp(1.2rem, 4vw, 2.2rem); font-weight: 800; color: #1D2340; font-variant-numeric: tabular-nums;
}
.dhud[hidden] { display: none; }
.dctl {
  position: absolute; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; pointer-events: none;
}
.dctl > * { pointer-events: auto; }
.dctl[hidden] { display: none; }
.acts { display: flex; gap: 10px; flex: 1 1 auto; justify-content: center; flex-wrap: wrap; }
.act, .horn, .pedal { color: #1D2340; border-color: #1D2340; --lipc: var(--tb-lip); box-shadow: 0 var(--tb-lip-h) 0 var(--lipc); }
.act { min-height: 64px; min-width: 104px; font-size: 1.5rem; font-weight: 800; background: #FFC93C; border-radius: 20px; --lipc: var(--tb-pick-lip); }
.act:active, .horn:active, .pedal:active { transform: translateY(var(--tb-lip-h)); box-shadow: 0 0 0 var(--lipc); }
.act.on { background: #FFFFFF; --lipc: var(--tb-lip); }
.horn { width: 84px; height: 84px; border-radius: 50%; background: #FFFFFF; font-size: 1.25rem; font-weight: 800; padding: 0; flex: none; }
.pedal {
  flex: none; width: 128px; height: 128px; border-radius: 28px; padding: 0;
  font-size: 2.2rem; font-weight: 800; color: #FFFFFF; text-shadow: 2px 2px 0 #1D2340; background: #2E9E5B; --lipc: var(--tb-go-lip);
}
.pedal.stop { background: #E63946; --lipc: #A8222D; }
.dback {
  position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px));
  min-height: 52px; font-size: 1.15rem; padding: 0.2rem 1rem; color: #1D2340; background: #FFFFFF; border-color: #1D2340;
}
.dback[hidden] { display: none; }
body.ending .dctl .act, body.ending .dctl .pedal, body.ending .dback { visibility: hidden; }
@media (min-width: 744px) and (min-height: 640px) {
  .pic svg { height: 74px; }
  .fams .pic svg { height: 96px; }
  .pic { font-size: 1.1rem; padding: 6px 4px 4px; }
  .picrow { gap: 10px; }
  .opt svg { width: 100%; height: 92px; }
  .opt .numpic { width: 76px; height: 76px; font-size: 2.8rem; }
  .act { min-height: 84px; min-width: 150px; font-size: 2rem; }
  .horn { width: 110px; height: 110px; font-size: 1.6rem; }
  .pedal { width: 170px; height: 170px; font-size: 3rem; }
  .dback { min-height: 60px; font-size: 1.35rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .pic svg { height: 34px; }
  .fams .pic svg { height: 40px; }
  .pic { font-size: 0.72rem; }
  .opt svg { width: 100%; height: 38px; }
  .opt .numpic { width: 30px; height: 30px; font-size: 1.2rem; }
  .act { min-height: 52px; min-width: 84px; font-size: 1.2rem; }
  .horn { width: 64px; height: 64px; font-size: 1rem; }
  .pedal { width: 96px; height: 96px; font-size: 1.7rem; }
  .dhud { font-size: 1.1rem; }
}
.lshort { display: none; }
/* Phones: short picture names at a readable size, bigger tabs, icon-only header buttons. */
@media (max-width: 600px) and (orientation: portrait), (orientation: landscape) and (max-height: 520px) {
  .lfull { display: none; }
  .lshort { display: block; }
  .pic { font-size: 0.95rem; }
  .k4 .pic { font-size: 0.9rem; }
  #prows .popt { font-size: 0.875rem; }
  #pager .btn { min-height: 44px; font-size: 1rem; }
}
/* Tablets: room for the full names ("Cement mixer") in the row of four. */
@media (min-width: 744px) and (min-height: 640px) {
  .panel-body > [data-pane="vehicle"] { max-width: 640px; }
  .k4 .pic { font-size: 0.95rem; padding-left: 2px; padding-right: 2px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .pic { font-size: 0.875rem; }
  #prows .popt { font-size: 0.8rem; }
  #pager .btn { min-height: 44px; font-size: 0.875rem; }
}

/* Build pane: several part rows at once, each option a zoomed picture of that part */
.pager { display: flex; gap: 6px; justify-content: center; margin: 0 0 6px; }
.pager[hidden] { display: none; }
/* six pages (the excavator and bulldozer): a little tighter so "Tracks" and "Engine" keep their full size */
.pager.p6 { gap: 4px; }
.pager.p6 .btn { padding-left: 0; padding-right: 0; }
.pager .btn { flex: 1 1 0; min-width: 0; min-height: 36px; padding: 0.1rem 0.3rem; font-size: clamp(0.8rem, 3.4vw, 1rem); }
.prows { display: flex; flex-direction: column; gap: 6px; }
.prow h4 { margin: 0 0 2px 4px; font-size: 0.85rem; line-height: 1.15; font-weight: 800; color: var(--muted); }
.prow .popts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.popt {
  display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; gap: 0;
  padding: 3px 2px 2px; min-height: 0; min-width: 0; overflow: hidden;
  font-size: clamp(0.64rem, 2.9vw, 0.9rem); line-height: 1.1; white-space: nowrap;
}
.popt svg { width: 100%; height: 44px; display: block; border-radius: 10px; background: #E4F3FF; }
.popt span { display: block; text-align: center; overflow: hidden; text-overflow: clip; }
.popt .numpic { height: 44px; display: grid; place-items: center; font-size: 1.6rem; font-weight: 800; }
.prows.many .popt .numpic { font-size: 1.3rem; }
@media (min-width: 744px) and (min-height: 640px) {
  .pager { gap: 10px; margin-bottom: 10px; }
  .pager .btn { min-height: 48px; font-size: 1.1rem; }
  .prows { gap: 10px; }
  .prow h4 { font-size: 1.05rem; margin-bottom: 4px; }
  .prow .popts { gap: 10px; }
  .popt { font-size: 1rem; padding: 5px 4px 4px; }
  .popt svg, .popt .numpic { height: 76px; }
  .popt .numpic { font-size: 2.4rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .pager .btn { min-height: 32px; font-size: 0.8rem; }
  .prow h4 { font-size: 0.75rem; }
  .popt { font-size: 0.66rem; }
  .popt svg, .popt .numpic { height: 36px; }
  .popt .numpic { font-size: 1.2rem; }
}
/* The panel is as tall as the Build tab; the Vehicle and Colors tabs use that room for bigger choices. */
.panel-body > [data-pane="vehicle"] { display: flex; flex-direction: column; justify-content: center; gap: 10px; container-type: size; }
[data-pane="vehicle"] .picrow + .picrow { margin-top: 0; }
[data-pane="vehicle"] .fams .pic svg { height: min(30cqh, 20cqw); }
[data-pane="vehicle"] #kinds .pic svg { height: min(24cqh, 15cqw); }
/* Tablet landscape: the panel column is narrower, so the full names get a little smaller (never under 14 px). */
@media (min-width: 744px) and (min-height: 640px) and (orientation: landscape) {
  .tb-panel .picrow .pic { font-size: 1rem; }
  .tb-panel .picrow.k4 .pic { font-size: 0.9rem; padding-left: 1px; padding-right: 1px; }
}
/* ---------- Coloring: tap a part on the picture; it glows and its colors show here ---------- */
.tb-panel.picking .panel-body > [data-pane]:not([data-pane="pick"]) { visibility: hidden; }
.tb-panel.picking .panel-body > [data-pane="pick"] { visibility: visible; }
.panel-body > [data-pane="pick"] { display: flex; align-items: center; justify-content: center; }
.pick { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; max-width: 520px; margin: 0 auto; }
.pickpic {
  display: flex; flex-direction: column; align-items: center; gap: 0; width: clamp(78px, 24vw, 128px);
  padding: 4px 4px 2px; border: 3px solid var(--edge); border-radius: 16px; background: #E4F3FF;
  box-shadow: 3px 3px 0 var(--edge); color: #1D2340; font-weight: 800; font-size: 1.05rem; line-height: 1.15;
}
.pickpic svg { display: block; width: 100%; height: clamp(52px, 9vh, 92px); }
.pickswatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; justify-items: center; padding: 7px; }
.pickswatches .swatch { width: 100%; max-width: 66px; min-width: 44px; }
@media (min-width: 744px) and (min-height: 640px) {
  .pick { gap: 16px; }
  .pickswatches { gap: 14px; }
  .pickswatches .swatch { max-width: 92px; }
  .pickpic { font-size: 1.2rem; width: 150px; }
}
.pickswatches .swatch.pop { animation: swpop 0.45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes swpop { 0% { transform: scale(0.8); } 60% { transform: scale(1.15); } 100% { transform: none; } }
/* The picked part glows: a soft yellow halo pulses behind it (a copy of the part, drawn fat). */
.halo, .halo * { fill: #FFE14D; stroke: #FFE14D; stroke-linejoin: round !important; stroke-dasharray: none !important; pointer-events: none; }
/* Its color runs yellow, pink, blue, so it shows on every paint color. */
.halo * { animation: halocol 1.8s linear infinite; }
@keyframes halocol {
  0%, 100% { fill: #FFE14D; stroke: #FFE14D; }
  33% { fill: #FF5FB0; stroke: #FF5FB0; }
  66% { fill: #3FC4FF; stroke: #3FC4FF; }
}
.pickpic .dim { opacity: 0.25; }
/* Sparkles and puffs never catch a tap meant for the picture. */
#fxG, #surpB, #surpF { pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .halo *, .pickswatches .swatch.pop { animation: none; } }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Car Builder</h1>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <div class="stage-inner">
        <div class="scene" id="scene">
          <svg id="art" viewBox="-300 -400 600 440" preserveAspectRatio="xMidYMax meet" role="img" aria-label="A vehicle"></svg>
          <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
        </div>
      </div>
      <div class="tb-coach" id="coach" role="status" aria-live="polite">Tap a part to color it!</div>
    </main>

    <section class="tb-panel" data-tab="vehicle">
      <div class="launchbar">
        <button class="btn tb-go launch" id="launch"><svg viewBox="-60 -50 120 100" aria-hidden="true"><path d="M -52 14 L -52 -10 Q -50 -18 -40 -18 L -22 -18 L -8 -38 L 26 -38 L 40 -18 Q 54 -16 54 -4 L 54 14 Z" fill="#FFC93C" stroke="#1D2340" stroke-width="7" stroke-linejoin="round"/><path d="M -2 -32 L 22 -32 L 30 -18 L -2 -18 Z" fill="#BFE6FF" stroke="#1D2340" stroke-width="5" stroke-linejoin="round"/><circle cx="-28" cy="16" r="14" fill="#2B2E38" stroke="#1D2340" stroke-width="6"/><circle cx="32" cy="16" r="14" fill="#2B2E38" stroke="#1D2340" stroke-width="6"/></svg><span>Drive!</span></button>
      </div>
      <div class="tb-choices panel-body">
        <div data-pane="vehicle" id="pane-vehicle" role="tabpanel" aria-labelledby="tab-vehicle">
          <div class="picrow fams" id="fams"></div>
          <div class="picrow" id="kinds"></div>
        </div>
        <div data-pane="build" id="pane-build" role="tabpanel" aria-labelledby="tab-build">
          <div class="pager" id="pager"></div>
          <div class="prows" id="prows"></div>
        </div>
        <div data-pane="pick" id="pane-pick" aria-live="polite">
          <div class="pick">
            <div class="pickpic" id="pickPic"><svg id="pickSvg" viewBox="0 0 10 10" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg><span id="pickName">Body</span></div>
            <div class="pickswatches" id="pickSw"></div>
          </div>
        </div>
      </div>
      <nav class="tb-tabs" role="tablist" aria-label="Controls">
        <button class="btn tab" role="tab" id="tab-vehicle" data-tab="vehicle" aria-controls="pane-vehicle">Vehicle</button>
        <button class="btn tab" role="tab" id="tab-build" data-tab="build" aria-controls="pane-build">Build</button>
        <button class="btn tb-surprise" data-action="surprise">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<!-- Full-screen drive -->
<div class="flight" id="flight" hidden>
  <canvas id="fcv" aria-label="Driving"></canvas>
  <div class="dhud" id="dhud" hidden></div>
  <div class="banner" id="banner" hidden></div>
  <button class="btn dback" id="fback">Back</button>
  <div class="dctl" id="dctl">
    <button class="btn horn" id="horn">Beep!</button>
    <div class="acts" id="acts"></div>
    <button class="btn pedal" id="pedal">Go</button>
  </div>
</div>


<script src="index.js"></script>
</body>
</html>
