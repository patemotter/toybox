<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fish Tank</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fish Tank">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --shopw: min(440px, 50vw);
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): the tank fills the stage ---------- */
.stage { background: #3BA6DC; }
#tank {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: pointer;
}
#tank:focus-visible { outline: 4px solid var(--focus); outline-offset: -6px; }
#count.pop { animation: pop 0.6s ease; }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.28); } 100% { transform: scale(1); } }
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; }

/* Tab bar: Add fish (opens the Add a fish sheet) and Night. */
.tb-tabs .bigbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; }
.tb-tabs .bigbtn svg { width: 34px; height: 34px; flex: none; display: block; }
#addOpen { background: var(--accent); color: #1D2340; }

/* Landscape: a slim column with the two buttons stacked at the bottom (the Add a fish sheet opens over it). */
@media (orientation: landscape) {
  .tb-body .tb-panel { width: auto; justify-content: flex-end; }
  .tb-panel .tb-tabs { flex-direction: column; }
  .tb-tabs .bigbtn { flex: none; flex-direction: column; gap: 2px; min-height: 0; padding: 0.4rem 0.9rem; }
  .addwrap { flex: none; }
  .firsthint { left: auto; right: 0; }
  .firsthint::after { left: auto; right: 34px; }
  .firsthint::before { left: auto; right: 38px; }
}
/* ---------- Big mode: the panel goes away, the header stays (Big turns into Back) ---------- */
body.big .tb-panel,
body.big .shop { display: none; }

/* ---------- Empty tank: point at Add fish ---------- */
.addwrap { position: relative; display: flex; flex: 1 1 0; min-width: 0; }
.addwrap > .btn { flex: 1 1 auto; }
.firsthint {
  display: none;
  position: absolute;
  left: 0;
  bottom: calc(100% + 18px);
  background: #FFFFFF;
  color: #1D2340;
  border: 3px solid #1D2340;
  border-radius: 20px;
  box-shadow: 3px 3px 0 #1D2340;
  padding: 0.25rem 0.9rem 0.3rem;
  font-size: 1.45rem;
  font-weight: 800;
  line-height: 1.15;
  white-space: nowrap;
  pointer-events: none;
}
.firsthint::after {
  content: "";
  position: absolute;
  left: 34px;
  top: 100%;
  border: 13px solid transparent;
  border-top-color: #1D2340;
}
.firsthint::before {
  content: "";
  position: absolute;
  left: 38px;
  top: calc(100% - 1px);
  border: 9px solid transparent;
  border-top-color: #FFFFFF;
  z-index: 1;
}
body.empty .firsthint { display: block; animation: hintbob 1.4s ease-in-out infinite; }
body.empty #addOpen { animation: addglow 1.4s ease-in-out infinite; }
body.ending .firsthint { display: none; }
@keyframes hintbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes addglow { 0%, 100% { box-shadow: 4px 4px 0 var(--edge); } 50% { box-shadow: 4px 4px 0 var(--edge), 0 0 0 8px rgba(255, 255, 255, 0.75); } }

/* ---------- Add fish panel ---------- */
.shop {
  position: fixed;
  z-index: 8;
  left: 0;
  right: 0;
  bottom: 0;
  margin: 0 auto;
  width: 100%;
  max-width: 760px;
  max-height: 62%;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  background: var(--panel);
  border: 4px solid var(--edge);
  border-bottom: 0;
  border-radius: 28px 28px 0 0;
  box-shadow: 0 -4px 0 rgba(29, 35, 64, 0.25);
  padding: 12px max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
}
.shop[hidden] { display: none; }
.shop-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.shop-head h2 { margin: 0; font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
.shop-head .btn { min-height: 48px; font-size: 1.1rem; }
.kinds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kind {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 6px 3px 3px;
  font-size: 1.02rem;
  line-height: 1.1;
  min-height: 0;
  min-width: 0;
}
.kind canvas { display: block; width: 100%; max-width: 128px; height: auto; aspect-ratio: 16 / 11; pointer-events: none; }
.kind span.lbl { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding-bottom: 2px; }
.kind .badge {
  position: absolute;
  top: -9px;
  right: -7px;
  min-width: 28px;
  height: 28px;
  padding: 0 5px;
  border-radius: 14px;
  background: #FFFFFF;
  color: #1D2340;
  border: 3px solid #1D2340;
  font-size: 0.95rem;
  font-weight: 800;
  line-height: 22px;
  text-align: center;
}
.kind .badge[hidden] { display: none; }
.swatches { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.swatch {
  aspect-ratio: 1;
  width: 100%;
  max-width: 64px;
  justify-self: center;
  border-radius: 50%;
  border: 3px solid var(--edge);
  cursor: pointer;
  padding: 0;
  font: inherit;
  font-size: 1.4rem;
  font-weight: 800;
  display: grid;
  place-items: center;
  box-shadow: 2px 2px 0 var(--edge);
}
.swatch[aria-pressed="true"] { outline: 5px solid var(--accent); outline-offset: 2px; }
.swatch:focus-visible { outline: 5px solid var(--focus); outline-offset: 2px; }
.shop-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.shop-actions .btn { flex: 1 1 100px; min-height: 56px; font-size: 1.15rem; white-space: nowrap; }
.shop-actions .addbtn { flex: 2 1 190px; min-height: 64px; font-size: 1.5rem; font-weight: 800; }

/* Landscape: the panel sits on the right, the tank stays visible on the left. */
@media (orientation: landscape) {
  .shop {
    top: max(10px, env(safe-area-inset-top, 0px));
    bottom: max(10px, env(safe-area-inset-bottom, 0px));
    right: max(10px, env(safe-area-inset-right, 0px));
    left: auto;
    width: var(--shopw);
    max-width: none;
    max-height: none;
    border-bottom: 4px solid var(--edge);
    border-radius: 28px;
    box-shadow: 5px 5px 0 var(--edge);
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .shop[hidden] { display: none; }
}
/* Short landscape phones: smaller pieces so the whole panel fits. */
@media (orientation: landscape) and (max-height: 520px) {
  :root { --shopw: min(460px, 56vw); }
  .shop { justify-content: flex-start; padding: 8px 10px 10px; }
  .shop-head { margin-bottom: 4px; }
  .shop-head h2 { font-size: 1.2rem; }
  .shop-head .btn { min-height: 40px; font-size: 1rem; padding: 0.2rem 0.7rem; }
  .kinds { gap: 6px; }
  .kind { font-size: 0.85rem; padding: 3px 2px 1px; }
  .kind canvas { max-width: 62px; }
  .kind .badge { min-width: 24px; height: 24px; line-height: 18px; font-size: 0.8rem; top: -7px; right: -5px; }
  .swatches { gap: 6px; margin-top: 8px; }
  .swatch { max-width: 34px; font-size: 1rem; border-width: 3px; }
  .shop-actions { gap: 6px; margin-top: 8px; flex-wrap: nowrap; }
  .shop-actions .btn { flex: 1 1 0; min-width: 0; min-height: 46px; font-size: 0.9rem; line-height: 1.05; padding: 0.15rem 0.3rem; white-space: normal; }
  .shop-actions .addbtn { flex: 1.5 1 0; min-height: 46px; font-size: 1.15rem; }
  .tb-tabs .bigbtn svg { width: 28px; height: 28px; }
  .firsthint { font-size: 1.2rem; bottom: calc(100% + 14px); }
}
/* Narrow phones in portrait. */
@media (max-width: 480px) {
  .shop-head h2 { font-size: 1.35rem; }
  .kinds { gap: 7px; }
  .kind { font-size: 0.88rem; }
  .swatches { gap: 7px; margin-top: 10px; }
  .swatch { font-size: 1.1rem; }
  .shop-actions .btn { font-size: 1.05rem; }
  .shop-actions .addbtn { font-size: 1.35rem; }
  .kind { padding: 5px 1px 2px; font-size: 0.82rem; }
  .firsthint { font-size: 1.3rem; }
}
/* Big screens: bigger chrome. */
@media (min-width: 744px) and (min-height: 640px) {
  .tb-tabs .bigbtn { min-height: 64px; font-size: 1.4rem; }
  .tb-tabs .bigbtn svg { width: 44px; height: 44px; }
  .firsthint { font-size: 1.8rem; bottom: calc(100% + 22px); }
  .shop { padding-top: 16px; }
  .shop-head h2 { font-size: 1.8rem; }
  .kind { font-size: 1.1rem; padding: 8px 4px 4px; }
  .swatch { font-size: 1.5rem; }
}

/* Phones in portrait: the four shop buttons share one row, so the Add fish panel is shorter. */
@media (max-width: 600px) and (orientation: portrait) {
  .shop-actions { gap: 6px; flex-wrap: nowrap; margin-top: 12px; }
  .shop-actions .btn { flex: 1 1 0; min-width: 0; min-height: 56px; font-size: 0.95rem; line-height: 1.05; padding: 0.15rem 0.3rem; white-space: normal; }
  .shop-actions .addbtn { flex: 1.25 1 0; min-height: 56px; font-size: 1.15rem; }
  .shop-actions .btn:not(.addbtn) { font-size: 0.9rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .shop .swatch { max-width: 40px; }
  .shop-head .btn { min-height: 44px; }
}

body.ending .tb-panel,
body.ending .shop { pointer-events: none; opacity: 0.4; }

@media (prefers-reduced-motion: reduce) {
  #count.pop { animation: none; }
  body.empty .firsthint, body.empty #addOpen { animation: none; }
}
/* Ghost hand: a see-through hand that shows the main move once (same look as Bulldozer and Measuring). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
body.empty .tb-coach, body.shopping .tb-coach { display: none; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Fish Tank</h1>
    <button class="btn tb-iconbtn" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="tank" tabindex="0" role="img" aria-label="A fish tank. Tap to feed the fish. Tap a fish to make it flip. Hold a finger and the fish swim to it."></canvas>
      <div class="tb-counter" id="count" aria-live="polite">Fish: 0</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
      <div class="tb-coach" id="coach" role="status" aria-live="polite">Tap to feed the fish!</div>
    </main>

    <section class="tb-panel">
      <nav class="tb-tabs">
  <div class="addwrap">
  <div class="firsthint" id="firstHint">Add your first fish!</div>
  <button class="btn bigbtn" id="addOpen">
    <svg viewBox="0 0 60 60" aria-hidden="true"><path d="M8 30 Q24 10 42 22 L54 14 Q51 30 54 46 L42 38 Q24 50 8 30 Z" fill="#F77F00" stroke="#1D2340" stroke-width="4" stroke-linejoin="round"/><circle cx="20" cy="27" r="4" fill="#1D2340"/><circle cx="19" cy="25.6" r="1.4" fill="#fff"/></svg>
    <span>Add fish</span>
  </button>
  </div>
  <button class="btn bigbtn" id="nightBtn" aria-pressed="false">
    <svg viewBox="0 0 60 60" aria-hidden="true" id="nightIcon"></svg>
    <span id="nightLabel">Night</span>
  </button>
      </nav>
    </section>
  </div>
</div>

<div class="shop" id="shop" hidden role="dialog" aria-labelledby="shopTitle">
  <div class="shop-head">
    <h2 id="shopTitle">Add a fish</h2>
    <button class="btn" id="shopDone">Done</button>
  </div>
  <div class="kinds" id="kinds"></div>
  <div class="swatches" id="swatches"></div>
  <div class="shop-actions">
    <button class="btn primary addbtn" id="addBtn">+ Add fish</button>
    <button class="btn" id="removeBtn">Remove</button>
    <button class="btn" id="emptyBtn">Empty tank</button>
    <button class="btn" id="starterBtn">Starter fish</button>
  </div>
</div>


<script>
(function () {
  "use strict";

  var OUT = "#1D2340";
  var KEY = "fishtank-v1";
  var PKEY = "fishtank-prefs-v1";
  var MAX_FISH = 25;
  var TAU = Math.PI * 2;

  var PALETTE = [
    ["Red", "#E63946"], ["Orange", "#F77F00"], ["Yellow", "#FFC93C"], ["Lime", "#A7D129"],
    ["Green", "#2E9E5B"], ["Teal", "#1FA6A0"], ["Sky", "#5BC0EB"], ["Blue", "#2D5BD7"],
    ["Purple", "#7B4FC9"], ["Pink", "#F26CA7"], ["Brown", "#8B5A3C"], ["Gray", "#9AA3AF"],
    ["White", "#FFFFFF"], ["Black", "#26282E"]
  ];
  var HEX = {};
  PALETTE.forEach(function (p) { HEX[p[0]] = p[1]; });
  function hex(name) { return HEX[name] || "#999999"; }
  function rgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function isDark(h) {
    var c = rgb(h);
    return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) < 120;
  }
  // Linear blend of hex color a toward hex color b by fraction t.
  function mix(a, b, t) {
    var x = rgb(a), y = rgb(b);
    return "#" + [0, 1, 2].map(function (k) {
      var v = Math.round(x[k] + (y[k] - x[k]) * t);
      return (v < 16 ? "0" : "") + v.toString(16);
    }).join("");
  }
  function rgba(h, a) { var c = rgb(h); return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  // Small seeded random so the scenery stays put between visits and resizes.
  function seeded(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Creature kinds ----------
  var SWIM_CALM = 0.68;
  // size: body length in px at U=1. cruise/max: speeds (px/s at U=1). hx/hy: tap area (fractions of size).
  // icon: [scale as a fraction of icon width, x offset, y offset] for the picker pictures.
  var KINDS = {
    round:    { label: "Round",    size: 125, cruise: 70, max: 270, agile: 2.6, layer: 1, hx: 0.5,  hy: 0.38, mouth: [0.44, 0.06],  pitch: 0.5,  beat: 1,   amp: 0.07, mass: 1,   icon: [0.62, 0.07, 0.07] },
    long:     { label: "Long",     size: 175, cruise: 95, max: 330, agile: 2.6, layer: 1, hx: 0.52, hy: 0.22, mouth: [0.5, 0.03],   pitch: 0.55, beat: 1.1, amp: 0.09, mass: 1,   icon: [0.68, 0.0, 0.0] },
    puffer:   { label: "Puffer",   size: 110, cruise: 45, max: 190, agile: 2.0, layer: 1, hx: 0.48, hy: 0.45, mouth: [0.36, 0.05],  pitch: 0.3,  beat: 1.6, amp: 0.0,  mass: 1,   icon: [0.6, 0.04, 0.0] },
    jelly:    { label: "Jelly",    size: 120, cruise: 28, max: 130, agile: 1.0, layer: 2, hx: 0.42, hy: 0.55, mouth: [0, 0],        pitch: 0,    beat: 1,   amp: 0,    mass: 1,   icon: [0.44, 0.0, -0.2] },
    seahorse: { label: "Seahorse", size: 150, cruise: 32, max: 150, agile: 1.6, layer: 1, hx: 0.3,  hy: 0.5,  mouth: [0.3, -0.33],  pitch: 0,    beat: 1,   amp: 0,    mass: 1,   icon: [0.5, -0.04, 0.0] },
    octopus:  { label: "Octopus",  size: 140, cruise: 40, max: 210, agile: 1.6, layer: 1, hx: 0.42, hy: 0.48, mouth: [0.12, 0.02],  pitch: 0,    beat: 1,   amp: 0,    mass: 1.3, icon: [0.56, 0.0, -0.06] },
    whale:    { label: "Whale",    size: 330, cruise: 45, max: 170, agile: 1.0, layer: 0, hx: 0.5,  hy: 0.22, mouth: [0.47, 0.05],  pitch: 0.16, beat: 0.5, amp: 0.05, mass: 3.5, icon: [0.86, 0.0, 0.0] },
    shark:    { label: "Shark",    size: 290, cruise: 70, max: 250, agile: 1.3, layer: 0, hx: 0.5,  hy: 0.2,  mouth: [0.46, 0.06],  pitch: 0.2, beat: 0.7, amp: 0.07, mass: 2.5, icon: [0.84, 0.03, 0.04] }
  };
  var KIND_ORDER = ["round", "long", "puffer", "jelly", "seahorse", "octopus", "whale", "shark"];
  // The tank a first visit starts with (and what "Starter fish" brings back): a varied, colorful mix.
  var STARTER = [
    { k: "round", c: "Orange" }, { k: "long", c: "Teal" }, { k: "puffer", c: "Yellow" },
    { k: "jelly", c: "Pink" }, { k: "seahorse", c: "Purple" }, { k: "octopus", c: "Red" },
    { k: "whale", c: "Blue" }, { k: "round", c: "Lime" }, { k: "long", c: "Sky" }
  ];

  // ---------- Saved state ----------
  function validFish(o) { return o && KINDS[o.k] && HEX[o.c]; }
  function starterList() { return STARTER.map(function (f) { return { k: f.k, c: f.c }; }); }
  function freshState() {
    // A first visit starts with a populated tank. "Empty tank" in the Add fish panel empties it,
    // and "Starter fish" brings the starter set back.
    return { fish: starterList(), night: false, pickKind: "round", pickColor: "Orange" };
  }
  // The fish are the child's collection and are always kept. Opening the tank from the Toybox home
  // screen (Toybox.fresh) resets the rest (day/night, the picked kind and color), and a tank left
  // empty is filled with the starter fish again. A reload keeps everything, an empty tank too.
  function loadState() {
    var s = freshState();
    var fresh = window.Toybox && Toybox.fresh();
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return s;
      var o = JSON.parse(raw);
      if (o && Array.isArray(o.fish)) s.fish = o.fish.filter(validFish).slice(0, MAX_FISH).map(function (f) { return { k: f.k, c: f.c }; });

  });
  function endPointer(e) {
    var q = pointers[e.pointerId];
    if (!q) return;
    delete pointers[e.pointerId];
    if (e.type === "pointerup" && !locked() && performance.now() - q.t0 < 380 && q.dist < 26) tapAt(q.sx, q.sy);
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (locked()) return;
      var f = pick(activeFish().length ? activeFish() : [null]);
      if (f) happyFish(f); else dropFood(W / 2, H / 3);
    }
  });
  // Block iOS pinch and double-tap zoom, and the long-press menu.
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); });
  });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { if (!e.target.closest(".sheet")) e.preventDefault(); });
  document.addEventListener("touchmove", function (e) {
    if (!e.target.closest(".sheet, .shop")) e.preventDefault();
  }, { passive: false });

  function updateLures() {
    var now = performance.now();
    lures = [];
    Object.keys(pointers).forEach(function (id) {
      var q = pointers[id];
      if (now - q.t0 > 160) lures.push(q);
    });
  }

  // ---------- Sound (soft synthesized bubble blips; off by default) ----------
  // The on/off setting and the AudioContext are shared Toybox-wide (common/toybox.js);
  // the module starts/resumes audio on every touch while sound is on.
  var master = null, masterCtx = null, budget = 6, lastBudget = 0;
  function blip(freq, delay, vol) {
    var actx = Toybox.sound.ready();
    if (!actx) return;
    if (masterCtx !== actx) {
      try {
        master = actx.createGain(); master.gain.value = 0.5;
        var lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2200;
        master.connect(lp); lp.connect(actx.destination);
        masterCtx = actx;
      } catch (e) { return; }
    }
    var now = performance.now();
    budget = Math.min(8, budget + (now - lastBudget) / 1000 * 10); lastBudget = now;
    if (budget < 1) return;
    budget -= 1;
    try {
      var t = actx.currentTime + (delay || 0) + 0.005;
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(freq * 2.3, t + 0.09);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.11 * (vol || 1), t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 0.2);
    } catch (e) { /* ignore */ }
  }

  // ---------- Tilt and shake (optional: the grown-up's Tilt and shake setting on the home screen) ----------
  var tiltOn = false, tiltX = 0, upSign = 1, upAvg = 0, lastShake = 0;
  function screenAngle() {
    var a = (screen.orientation && typeof screen.orientation.angle === "number") ? screen.orientation.angle : (window.orientation || 0);
    return a * Math.PI / 180;
  }
  function onMotion(e) {
    var g = e.accelerationIncludingGravity;
    if (!g || g.x === null) return;
    var th = screenAngle(), c = Math.cos(th), s = Math.sin(th);
    var sx = g.x * c - g.y * s, sy = g.x * s + g.y * c;
    // Platforms disagree on the sign; learn it from which way is usually "up" while held.
    upAvg = upAvg * 0.98 + sy * 0.02;
    if (Math.abs(upAvg) > 3) upSign = upAvg > 0 ? 1 : -1;
    tiltX = clamp(-upSign * sx / 9.8, -1, 1);
    var a = e.acceleration, mag = 0;
    if (a && a.x !== null) mag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
    var now = performance.now();
    if (mag > 15 && now - lastShake > 700 && !locked()) { lastShake = now; shakeBurst(); }
  }
  function shakeBurst() {
    for (var i = 0; i < 44; i++) addBubble(rand(0, W), sandY - rand(0, 40) * U, rand(4, 15) * U, rand(-40, 40) * U);
    activeFish().forEach(function (f) { f.vx += rand(-1, 1) * 300 * U / KINDS[f.kind].mass; f.vy += rand(-1, 1) * 200 * U / KINDS[f.kind].mass; });
    waveBoost = 3;
    for (i = 0; i < 4; i++) blip(rand(350, 800), i * 0.06, 0.8);
  }
  function startTilt() {
    if (tiltOn) return;
    tiltOn = true;
    window.addEventListener("devicemotion", onMotion);
  }
  function stopTilt() {
    if (!tiltOn) return;
    tiltOn = false; tiltX = 0;
    window.removeEventListener("devicemotion", onMotion);
  }

  // ---------- Tank controls: counter, add panel, night ----------
  function updateCount(bump) {
    var n = activeFish().length;
    var el = $("count");
    el.textContent = "Fish: " + n;
    if (bump && !reduce) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
    $("addBtn").disabled = n >= MAX_FISH;
    $("addBtn").textContent = n >= MAX_FISH ? "Tank is full!" : "+ Add fish";
    $("removeBtn").disabled = n === 0;
    $("emptyBtn").disabled = n === 0;
    // The "Add your first fish!" hint only shows when the tank is really empty (not while starter fish swim in).
    document.body.classList.toggle("empty", n === 0 && !arriving);
    // No per-kind count badges: "Fish: N" at the top is the one counter.
  }

  function drawIcon(cv, kind, color) {
    var g = cv.getContext("2d"), K = KINDS[kind];
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, cv.width, cv.height);
    var s = cv.width * K.icon[0];
    var f = { kind: kind, color: color, phase: 1.1, amp: K.amp * 0.8, pulse: 1.4, time: 0.6, seed: 0.2, vx: 0, vy: 0, fx: 1, fxs: 1, u: 1,
      flipT: 0, happyT: 0, puff: kind === "puffer" ? 0.25 : 0, chompT: 0, blink: 0, sleep: 0 };
    g.translate(cv.width / 2 + K.icon[1] * s, cv.height / 2 + K.icon[2] * s);
    g.scale(s, s);
    g.lineJoin = "round"; g.lineCap = "round"; g.strokeStyle = OUT;
    var lw = 5 / s;
    g.lineWidth = lw;
    DRAW[kind](g, f, lw);
  }

  function buildShop() {
    KIND_ORDER.forEach(function (k) {
      var b = document.createElement("button");
      b.className = "btn kind";
      b.dataset.kind = k;
      b.innerHTML = '<canvas width="192" height="132" aria-hidden="true"></canvas><span class="lbl">' + KINDS[k].label + '</span><span class="badge" hidden>0</span>';
      $("kinds").appendChild(b);
    });
    PALETTE.forEach(function (p) {
      var b = document.createElement("button");
      b.className = "swatch";
      b.dataset.color = p[0];
      b.style.background = p[1];
      b.style.color = isDark(p[1]) ? "#FFFFFF" : "#1D2340";
      b.setAttribute("aria-label", p[0]);
      b.title = p[0];
      $("swatches").appendChild(b);
    });
  }
  function renderShop() {
    Array.prototype.forEach.call(document.querySelectorAll(".kind"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.kind === state.pickKind));
      drawIcon(b.querySelector("canvas"), b.dataset.kind, state.pickColor);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".swatch"), function (b) {
      var on = b.dataset.color === state.pickColor;
      b.setAttribute("aria-pressed", String(on));
      b.textContent = on ? "✓" : "";
    });
  }
  function openShop() { $("shop").hidden = false; document.body.classList.add("shopping"); renderShop(); }
  function closeShop() { $("shop").hidden = true; document.body.classList.remove("shopping"); }

  function addFish() {
    if (activeFish().length >= MAX_FISH || locked()) return;
    var f = makeFish(state.pickKind, state.pickColor, true);
    fishes.push(f);
    resort();
    var ex = clamp(f.x, 30 * U, W - 30 * U);
    burst(ex, f.y, 10, 30 * U);
    popText("Hi!", ex + (f.x < 0 ? 40 : -40) * U, f.y - f.size * 0.4, true);
    updateCount(true);
    save();
    blip(520, 0, 0.9); blip(780, 0.09, 0.9);
  }
  function sendAway(f) {
    f.leaving = true;
    f.leaveX = f.x < W / 2 ? -f.size * 1.2 : W + f.size * 1.2;
    f.lure = null; f.food = null;
  }
  function removeFish() {
    var act = activeFish();
    if (!act.length || locked()) return;
    var f = act[act.length - 1];
    sendAway(f);
    burst(f.x, f.y, 8, f.size * 0.3);
    updateCount(true);
    save();
    blip(600, 0, 0.8); blip(420, 0.09, 0.8);
  }
  // Every fish does a happy flip and swims off the side of the tank.
  function emptyTank() {
    var act = activeFish();
    if (!act.length || locked()) return;
    act.forEach(function (f) {
      f.flipT = 0.001; f.happyT = 1.6;
      sendAway(f);
      burst(f.x, f.y, 6, f.size * 0.3);
      addSparkles(f.x, f.y - f.size * 0.2, 3);
    });
    popText("Bye bye!", W / 2, (surf0 + sandY) / 2, true);
    updateCount(true);
    save();
    for (var i = 0; i < 4; i++) blip(780 - i * 80, i * 0.1, 0.7);
  }
  var arriving = 0;   // starter fish still on their way in
  function starterFish() {
    if (locked()) return;
    activeFish().forEach(sendAway);
    STARTER.forEach(function (s, i) {
      arriving++;
      setTimeout(function () {
        arriving--;
        if (locked()) { updateCount(false); return; }
        fishes.push(makeFish(s.k, s.c, true));
        resort(); updateCount(true); save();
      }, 500 + i * 220);
    });
    burst(W / 2, sandY, 40, W * 0.4);
    updateCount(true);
    save();
  }

  function setNight(on) {
    state.night = on;
    document.documentElement.style.background = on ? "#0B2452" : "";
    document.body.style.background = on ? "#0B2452" : "";
    $("nightBtn").setAttribute("aria-pressed", String(on));
    $("nightLabel").textContent = on ? "Day" : "Night";
    $("nightIcon").innerHTML = on
      ? '<circle cx="30" cy="30" r="11" fill="#FFC93C" stroke="#1D2340" stroke-width="4"/>' +
        [0, 1, 2, 3, 4, 5, 6, 7].map(function (i) { var a = i * Math.PI / 4; return '<line x1="' + (30 + Math.cos(a) * 17).toFixed(1) + '" y1="' + (30 + Math.sin(a) * 17).toFixed(1) + '" x2="' + (30 + Math.cos(a) * 24).toFixed(1) + '" y2="' + (30 + Math.sin(a) * 24).toFixed(1) + '" stroke="#1D2340" stroke-width="4" stroke-linecap="round"/>'; }).join("")
      : '<path d="M38 8 A22 22 0 1 0 52 40 A17 17 0 1 1 38 8 Z" fill="#FFE07A" stroke="#1D2340" stroke-width="4" stroke-linejoin="round"/><circle cx="44" cy="16" r="2.5" fill="#1D2340"/>';
    renderBg();
    save();
  }

  // ---------- Main loop ----------
  var last = performance.now();
  function frame(t) {
    var raw = t - last;
    var dt = Math.min(0.05, raw / 1000);
    last = t;
    if (Toybox.timer.phase() === "resting") { requestAnimationFrame(frame); return; }
    if (raw > 0 && raw < 200 && !document.hidden) {
      slowFrames.push(raw);
      if (slowFrames.length >= 120) {
        var med = slowFrames.slice().sort(function (a, b) { return a - b; })[60];
        slowFrames = [];
        if (med > 21 && dprCap > 1.3 && (window.devicePixelRatio || 1) > 1.3) { dprCap = Math.max(1.3, dprCap - 0.35); layout(); }
      }
    }
    T += dt;
    // Water sloshes on a spring toward the tilt.
    var target = tiltOn ? tiltX : 0;
    sloshV += ((target - slosh) * 14 - sloshV * 3.2) * dt;
    slosh = clamp(slosh + sloshV * dt, -1.2, 1.2);
    var wantDim = Toybox.timer.phase() === "ending" ? 0.5 : 0;
    dim += (wantDim - dim) * Math.min(1, dt * (wantDim > dim ? 0.45 : 2));
    if (Math.abs(dim - wantDim) < 0.002) dim = wantDim;
    updateLures();
    assignLures();
    for (var i = fishes.length - 1; i >= 0; i--) {
      var f = fishes[i];
      updateFish(f, dt);
      if (f.leaving && (f.x < -f.size * 1.1 || f.x > W + f.size * 1.1)) { fishes.splice(i, 1); resort(); }
    }
    separate(dt);
    updateParticles(dt);
    if (state.night) plankton.forEach(function (p) {
      p.x += Math.sin(T * 0.3 + p.ph) * 6 * U * dt; p.y += Math.cos(T * 0.25 + p.ph) * 5 * U * dt;
    });
    render();
    // Ending: tell the shared timer once the lights are down (the fish settle meanwhile).
    if (endingDone && dim > 0.45) { endingDone(); endingDone = null; }
    requestAnimationFrame(frame);
  }

  // ---------- Play timer hooks (the timer, sheet and rest screen live in common/toybox.js) ----------
  // Ending: the lights dim and each fish swims to its own sleeping spot near the bottom.
  var endingDone = null;

  function wakeFish() {
    fishes.forEach(function (f) { f.sleep = 0; pickWander(f); });
  }

  function assignRestSpots() {
    var act = activeFish().slice().sort(function (a, b) { return a.x - b.x; });
    var n = act.length;
    act.forEach(function (f, i) {
      var b = yBounds(f);
      f.restX = clamp(W * (i + 0.5) / Math.max(1, n) + rand(-20, 20) * U, f.size * 0.4, W - f.size * 0.4);
      f.restY = b[1] - (f.kind === "jelly" ? 0 : rand(0, 30) * U) - (KINDS[f.kind].layer === 0 ? (sandY - surf0) * 0.18 : 0);
      f.lure = null; f.food = null;
    });
  }

  function onEnding(done) {
    pointers = {};
    pellets = [];
    closeShop();
    assignRestSpots();
    endingDone = done;
  }

  function goodbyeWave() {
    activeFish().forEach(function (f, i) {
      setTimeout(function () { f.flipT = 0.001; f.happyT = 1.4; burst(f.x, f.y, 6, f.size * 0.25); }, i * 90);
    });
    for (var i = 0; i < 5; i++) blip(800 - i * 90, i * 0.12, 0.7);
  }

  function onWake() {
    endingDone = null;
    wakeFish();
  }

  // ---------- Wiring ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.classList.contains("hold")) return;
    if (locked()) return;
    if (t.id === "addOpen") { openShop(); blip(600, 0, 0.6); return; }
    if (t.id === "shopDone") { closeShop(); return; }
    if (t.id === "nightBtn") { setNight(!state.night); blip(state.night ? 420 : 640, 0, 0.8); return; }
    if (t.id === "addBtn") { addFish(); return; }
    if (t.id === "removeBtn") { removeFish(); return; }
    if (t.id === "emptyBtn") { emptyTank(); return; }
    if (t.id === "starterBtn") { starterFish(); return; }
    if (t.dataset.kind) { state.pickKind = t.dataset.kind; renderShop(); save(); blip(560, 0, 0.6); return; }
    if (t.dataset.color) { state.pickColor = t.dataset.color; renderShop(); save(); blip(660, 0, 0.6); return; }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !e.defaultPrevented && !Toybox.sheetOpen() && !$("shop").hidden) closeShop();
  });

  // Rest picture: a sleeping fish in a little round tank.
  function restArt() {
    return '<svg class="rest-art" viewBox="0 0 240 200" aria-hidden="true">' +
    '<circle cx="120" cy="104" r="90" fill="#45AEE3" stroke="#1D2340" stroke-width="5"/>' +
    '<path d="M 36 140 Q 120 120 204 140 A 90 90 0 0 1 36 140 Z" fill="#F6D68E" stroke="#1D2340" stroke-width="4" stroke-linejoin="round"/>' +
    '<path d="M 70 52 Q 90 30 104 52 M 40 80 Q 120 70 200 80" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="6" stroke-linecap="round"/>' +
    '<path d="M 70 116 L 44 96 Q 50 116 44 136 Z" fill="#C55F00" stroke="#1D2340" stroke-width="4" stroke-linejoin="round"/>' +
    '<path d="M 96 92 Q 110 70 132 86" fill="#C55F00" stroke="#1D2340" stroke-width="4" stroke-linejoin="round"/>' +
    '<ellipse cx="110" cy="116" rx="44" ry="30" fill="#F77F00" stroke="#1D2340" stroke-width="5"/>' +
    '<path d="M 98 88 L 98 144 M 82 92 L 82 140" stroke="#FFFFFF" stroke-width="7"/>' +
    '<ellipse cx="110" cy="116" rx="44" ry="30" fill="none" stroke="#1D2340" stroke-width="5"/>' +
    '<path d="M 120 110 Q 128 118 136 110" fill="none" stroke="#1D2340" stroke-width="4" stroke-linecap="round"/>' +
    '<path d="M 140 126 Q 146 130 150 126" fill="none" stroke="#1D2340" stroke-width="3.5" stroke-linecap="round"/>' +
    '<circle cx="130" cy="124" r="5" fill="rgba(255,110,150,0.5)"/>' +
    '<circle cx="166" cy="84" r="9" fill="rgba(255,255,255,0.3)" stroke="#FFFFFF" stroke-width="3"/>' +
    '<circle cx="178" cy="58" r="13" fill="rgba(255,255,255,0.3)" stroke="#FFFFFF" stroke-width="3"/>' +
    '<text x="166" y="85" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="800" font-family="Baloo 2, sans-serif" fill="#FFFFFF">z</text>' +
    '<text x="178" y="59" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="800" font-family="Baloo 2, sans-serif" fill="#FFFFFF">Z</text></svg>';
  }

  // ---------- Start ----------
  buildShop();
  layout();
  fishes = state.fish.map(function (s) { return makeFish(s.k, s.c, false); });
  resort();
  save();
  setNight(state.night);
  updateCount(false);
  renderShop();
  // The shared grown-up layer: play timer, sound, Big. It may start the ending right away
  // (a timer that ran out while away), so the tank is set up first.
  Toybox.init({
    app: "fish-tank",
    badge: $("tbadge"),
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the lights dim, the fish settle down to sleep, and the tank locks.",
    goodbyeOption: "End with a Goodnight button to press",
    farewellText: "Time to say goodnight",
    goodbyeLabel: "Goodnight, fish",
    farewellDone: "Night night, fish!",
    restLine: "The fish are resting.",
    restLine2: "They will be right here next time.",
    restArt: restArt,
    soundNote: "Soft bubble sounds. Hold for 2 seconds.",
    legacy: { timer: "fishtank-timer-v1", sound: PKEY, big: "fishtank-big-v1" },
    onEnding: onEnding,
    onGoodbye: goodbyeWave,
    onWake: onWake,
    onBig: function (on) { if (on) closeShop(); },
    onSound: function (on) { if (on) { blip(520, 0.02, 1); blip(780, 0.12, 1); } }
  });
  // Tilt and shake is a grown-up setting on the home screen: the shared module calls back once
  // motion may be used (on iOS it asks on his first tap). Turning it off stops the sloshing.
  var tiltAllowed = false;
  Toybox.tiltReady(function () { tiltAllowed = true; startTilt(); });
  Toybox.settings.onChange(function (id, on) {
    if (id !== "tilt") return;
    if (!on) stopTilt();
    else if (tiltAllowed) startTilt();
  });
  var resizeT = null;
  window.addEventListener("resize", function () { clearTimeout(resizeT); resizeT = setTimeout(layout, 60); });
  // The stage changes size with Big mode and rotation: lay the tank out again.
  if ("ResizeObserver" in window) new ResizeObserver(function () { clearTimeout(resizeT); resizeT = setTimeout(layout, 60); }).observe($("stage"));
  window.addEventListener("orientationchange", function () { setTimeout(layout, 250); });
  requestAnimationFrame(frame);
})();
</script>
<script>
  // Offline support: register the service worker when served over http(s).
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline install unavailable */ });
    });
  }
</script>
</body>
