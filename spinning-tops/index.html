<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spinning Tops</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tops">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #C9F0D6;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
.stage { background: #C9F0D6; touch-action: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
.stage .tbadge { position: absolute; top: 8px; right: 8px; z-index: 3; width: 44px; height: 44px; pointer-events: none; }
body.big .tb-panel { display: none; }
.stage .toast { position: absolute; top: 12px; z-index: 4; font-size: 1.3rem; }
.stage .farewell { position: absolute; top: 12px; bottom: auto; z-index: 4; }
.stage .farewell p { font-size: 1.25rem; }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }

/* ---------- Panel: the five tops as picture tiles, then New and Surprise ---------- */
.tops.tb-choices { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.toptile { min-width: 0; padding: 3px 2px; white-space: nowrap; }
.toptile canvas { width: 46px; height: 46px; }
.toptile .nm { font-weight: 800; }
.toptile[aria-pressed="true"] { border-width: 4px; }
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(30%, 260px); justify-content: space-between; }
  .tops.tb-choices { grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; overflow: hidden; }
  .tops .toptile:last-child { grid-column: 1 / span 2; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: 184px; }
  .tops.tb-choices { gap: 5px; }
  .toptile { min-height: 62px; font-size: 0.88rem; gap: 0; }
  .toptile canvas { width: 34px; height: 34px; }
}
/* Upright phones: five tops in one row, pictures only (the names would have to be squeezed tiny). */
@media (max-width: 600px) and (orientation: portrait) {
  .toptile { min-height: 64px; }
  .toptile .nm { display: none; }
  .toptile canvas { width: 54px; height: 54px; }
}
@media (min-width: 700px) and (min-height: 700px) and (orientation: portrait) {
  .tops.tb-choices { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .toptile canvas { width: 66px; height: 66px; }
}
@media (min-width: 700px) and (min-height: 700px) and (orientation: landscape) {
  .tb-body .tb-panel { width: min(30%, 300px); }
  .tops.tb-choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toptile canvas { width: 62px; height: 62px; }
}

/* Ghost hand: a see-through hand that shows the main move once (same look in every app). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Spinning Tops</h1>
    <button class="btn tb-iconbtn" id="bigbtn" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="view" role="img" aria-label="A spinning top arena. Pull the cord on the launcher to spin a top into the bowl, then flick the tops with a finger."></canvas>
      <div class="tb-coach" id="coach" role="status" aria-live="polite">Pull the cord!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>

    <section class="tb-panel" id="panel">
      <div class="tb-choices tops" id="tiles" role="group" aria-label="Pick a top"></div>
      <nav class="tb-tabs" aria-label="More">
        <button class="btn tb-new" id="newBtn">New</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Constants ----------
  var KEY = "spinning-tops-v1";     // { design, surprise, tops: [...] }: the bowl is kept on reload
  var OUT = "#1D2340";
  var TAU = Math.PI * 2;
  var DEBUG = /[?&]debug\b/.test(location.search);
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DEPTH = 0.14;                 // how deep the bowl is (bowl radius = 1)
  var TOP_R = 0.165;                // a top's radius in bowl units
  var GIANT_R = 0.3;
  var MAXW = 5;                     // at most this many tops in the bowl (a giant counts as two)
  var VMAX = 1.7;                   // fastest a top slides (bowl radii per second)

  // The five tops. h: height of the top face above the tip; rim: thickness of the rim band; bandR: the
  // band's radius (the gear's teeth stick out past it); stem: the knob on top. All in units of the radius.
  var DES = [
    { id: "wood", label: "Wood", h: 1.3, rim: 0.16, bandR: 1, stemR: 0.15, stemH: 0.4, knob: true,
      body: "#D79A5A", bodyDark: "#9A6232", rimC: "#E8453C", stemC: "#E8453C", trail: "#E8453C", spark: ["#FFD27A", "#FFFFFF"] },
    { id: "metal", label: "Metal", h: 0.85, rim: 0.22, bandR: 1, stemR: 0.13, stemH: 0.16,
      body: "#9AA6BA", bodyDark: "#56627A", rimC: "#3D7BFF", stemC: "#FFC93C", trail: "#3D7BFF", spark: ["#FFB627", "#FFE14D", "#FFFFFF"], sparky: true },
    { id: "rainbow", label: "Rainbow", h: 1.1, rim: 0.13, bandR: 1, stemR: 0.1, stemH: 0.55, knob: true,
      body: "#8E6CFF", bodyDark: "#5B3FC9", rimC: "#FFFFFF", stemC: "#FF4D6D", trail: "rainbow", spark: ["#FF4D6D", "#FFB627", "#4CD964", "#3DB4FF", "#8E6CFF"] },
    { id: "glow", label: "Glow", h: 1.05, rim: 0.15, bandR: 1, stemR: 0.14, stemH: 0.2, dome: true,
      body: "#2A2F6B", bodyDark: "#161A44", rimC: "#3DF5FF", stemC: "#FF6FD8", trail: "#3DF5FF", spark: ["#B8FFF9", "#FF9FE8", "#D7FF6B"], glow: true },
    { id: "gear", label: "Gear", h: 1.0, rim: 0.2, bandR: 0.86, stemR: 0.14, stemH: 0.36,
      body: "#FF9A2E", bodyDark: "#C0620E", rimC: "#FFC93C", stemC: "#4A5578", trail: "#FF9A2E", spark: ["#FFC93C", "#FFFFFF"], gear: true }
  ];
  var DES_BY = {};
  DES.forEach(function (d, i) { DES_BY[d.id] = i; d.down = Math.max(0.95, Math.min(1.2, Math.atan2(d.h, 1) + 0.4)); });
  var RAINBOW = ["#FF4D6D", "#FF9A2E", "#FFE14D", "#4CD964", "#3DB4FF", "#8E6CFF", "#FF6FD8"];

  function $(id) { return document.getElementById(id); }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function mkCanvas(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h || w; return c; }
  function zB(x, y) { return DEPTH * (x * x + y * y - 1); }   // the bowl surface (rim at 0, middle lowest)

  // ---------- Saved state ----------
  // A fresh visit from the home screen empties the bowl and loads the first top; a reload keeps the bowl.
  if (window.Toybox && Toybox.fresh()) { try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } }
  var S = { design: 0, surprise: 0 };
  var tops = [];
  var nextId = 1;
  function loadState() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!o || typeof o !== "object") return;
      if (typeof o.design === "string" && DES_BY.hasOwnProperty(o.design)) S.design = DES_BY[o.design];
      if (o.surprise === 1) S.surprise = 1;
      if (Array.isArray(o.tops)) {
        o.tops.slice(0, MAXW).forEach(function (q) {
          if (!q || typeof q !== "object" || !DES_BY.hasOwnProperty(q.d)) return;
          var t = makeTop(DES_BY[q.d], !!q.g, num(q.p, 0.2, 1, 0.5));
          t.x = num(q.x, -1, 1, 0); t.y = num(q.y, -1, 1, 0);
          var lim = 1 - t.r; var m = Math.sqrt(t.x * t.x + t.y * t.y);
          if (m > lim) { t.x *= lim / m; t.y *= lim / m; }
          t.vx = num(q.vx, -2, 2, 0); t.vy = num(q.vy, -2, 2, 0);
          t.s = num(q.s, 0, 1, 0.5); t.psi = num(q.ps, -100, 100, 0);
          t.state = q.st === "down" || q.st === "fall" ? "down" : "spin";
          t.zr = 0;
          if (t.state === "down") { t.phi = DES[t.d].down; t.s = 0; t.omega = 0; t.vx = t.vy = 0; }
          tops.push(t);
        });
      }
    } catch (e) { /* bad data: start empty */ }
  }
  function num(v, lo, hi, def) { return typeof v === "number" && isFinite(v) ? clamp(v, lo, hi) : def; }
  var dirty = false, saveT = 0;
  function saveNow() {
    dirty = false;
    try {
      localStorage.setItem(KEY, JSON.stringify({
        design: DES[S.design].id, surprise: S.surprise,
        tops: tops.filter(function (t) { return t.state !== "leave" && t.state !== "home"; }).map(function (t) {
          return { d: DES[t.d].id, g: t.giant ? 1 : 0, p: +t.p.toFixed(3), x: +t.x.toFixed(3), y: +t.y.toFixed(3),
            vx: +t.vx.toFixed(3), vy: +t.vy.toFixed(3), s: +t.s.toFixed(3), ps: +(t.psi % 100).toFixed(2),
            st: t.state === "down" || t.state === "fall" ? "down" : "spin" };
        })
      }));
    } catch (e) { /* ignore */ }
  }

  // ---------- Tops ----------
  function makeTop(d, giant, p) {
    return { id: nextId++, d: d, giant: giant, r: giant ? GIANT_R : TOP_R, p: p,
      x: 0, y: 0, vx: 0, vy: 0, zr: 0, vz: 0, z: 0,
      s: 1, life: (giant ? 30 : 9) + 38 * p, omega0: 12 + 40 * p, omega: 0, theta: Math.random() * TAU,
      phi: 0.03, psi: Math.random() * TAU, bump: 0, state: "spin", ft: 0, psiRate: 0,
      trail: [], hum: null, sc: 1, alpha: 1, grab: null, pushT: 0, hop: 0, tick: 0, born: performance.now() };
  }
  function weight() {
    var w = 0;
    tops.forEach(function (t) { if (t.state !== "leave" && t.state !== "home") w += t.giant ? 2 : 1; });
    return w;
  }
  // Keep the bowl to MAXW: the oldest top that has fallen floats away first, else the oldest spinner.
  function makeRoom(need) {
    var guard = 10;
    while (weight() + need > MAXW && guard-- > 0) {
      var live = tops.filter(function (t) { return t.state !== "leave" && t.state !== "home"; });
      if (!live.length) break;
      var down = live.filter(function (t) { return t.state === "down" || t.state === "fall"; });
      var pick = (down.length ? down : live).sort(function (a, b) { return a.born - b.born; })[0];
      leave(pick);
    }
  }
  function leave(t) {
    if (t.grab !== null) releaseGrab(t);
    t.state = "leave"; t.ft = 0;
    sparkle(t, 8);
  }

  // ---------- Patterns: each top's face, drawn once (crisp) plus a "spinning fast" version (rings) ----------
  var PS = 256;
  function facePath(g, d, R) {
    g.beginPath();
    if (d.gear) {
      var n = 10;
      for (var i = 0; i < n * 4; i++) {
        var a = i / (n * 4) * TAU - TAU / (n * 8), rr = (i % 4 === 1 || i % 4 === 2) ? R : R * 0.86;
        if (i === 0) g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); else g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.closePath();
    } else g.arc(0, 0, R, 0, TAU);
  }
  function wedge(g, r0, r1, a0, a1) {
    g.beginPath(); g.arc(0, 0, r1, a0, a1); g.arc(0, 0, r0, a1, a0, true); g.closePath();
  }
  function star(g, R, n, inner) {
    g.beginPath();
    for (var i = 0; i < n * 2; i++) {
      var a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? R * inner : R;
      if (i === 0) g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); else g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath();
  }
  function drawFace(g, d) {
    var R = PS / 2 - 1, i, a;
    g.save(); g.translate(PS / 2, PS / 2);
    g.lineJoin = "round";
    if (d.id === "wood") {
      g.fillStyle = "#EDB679"; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
      g.strokeStyle = "rgba(160,100,50,0.35)"; g.lineWidth = 2;
      [0.38, 0.66, 0.7].forEach(function (f) { g.beginPath(); g.arc(R * 0.05, 0, R * f, 0, TAU); g.stroke(); });
      g.fillStyle = "#E8453C"; wedge(g, R * 0.76, R * 0.93, 0, TAU); g.fill();
      g.fillStyle = "#2F6BFF"; wedge(g, R * 0.46, R * 0.6, 0, TAU); g.fill();
      for (i = 0; i < 4; i++) { a = i * TAU / 4; g.fillStyle = i % 2 ? "#2F6BFF" : "#E8453C"; wedge(g, R * 0.6, R * 0.76, a, a + 0.42); g.fill(); }
      for (i = 0; i < 4; i++) { a = i * TAU / 4 + 0.8; g.fillStyle = "#FFC93C"; wedge(g, R * 0.24, R * 0.46, a, a + 0.5); g.fill(); }
      g.fillStyle = "#FFC93C"; g.beginPath(); g.arc(0, 0, R * 0.24, 0, TAU); g.fill();
      g.strokeStyle = OUT; g.lineWidth = 4;
      [0.24, 0.46, 0.6, 0.76, 0.93].forEach(function (f) { g.beginPath(); g.arc(0, 0, R * f, 0, TAU); g.stroke(); });
    } else if (d.id === "metal") {
      var gr = g.createRadialGradient(-R * 0.3, -R * 0.3, R * 0.1, 0, 0, R);
      gr.addColorStop(0, "#F2F5FA"); gr.addColorStop(0.6, "#B7C1D1"); gr.addColorStop(1, "#7D8AA0");
      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
      for (i = 0; i < 3; i++) {
        a = i * TAU / 3;
        g.beginPath();
        g.moveTo(Math.cos(a - 0.3) * R * 0.34, Math.sin(a - 0.3) * R * 0.34);
        g.quadraticCurveTo(Math.cos(a - 0.15) * R * 0.9, Math.sin(a - 0.15) * R * 0.9, Math.cos(a + 0.55) * R * 0.99, Math.sin(a + 0.55) * R * 0.99);
        g.lineTo(Math.cos(a + 0.75) * R * 0.8, Math.sin(a + 0.75) * R * 0.8);
        g.quadraticCurveTo(Math.cos(a + 0.5) * R * 0.5, Math.sin(a + 0.5) * R * 0.5, Math.cos(a + 0.45) * R * 0.34, Math.sin(a + 0.45) * R * 0.34);
        g.closePath();
        g.fillStyle = i === 0 ? "#3D7BFF" : (i === 1 ? "#FF4D6D" : "#3D7BFF");
        g.fill(); g.strokeStyle = OUT; g.lineWidth = 4; g.stroke();
        g.strokeStyle = "rgba(255,255,255,0.7)"; g.lineWidth = 5;
        g.beginPath(); g.arc(0, 0, R * 0.62, a + 0.05, a + 0.35); g.stroke();
      }
      g.fillStyle = "#4A5578"; g.beginPath(); g.arc(0, 0, R * 0.34, 0, TAU); g.fill();
      g.strokeStyle = OUT; g.lineWidth = 4; g.stroke();
      g.fillStyle = "#FFC93C"; star(g, R * 0.28, 5, 0.45); g.fill(); g.lineWidth = 3; g.stroke();
    } else if (d.id === "rainbow") {
      var arms = RAINBOW.length;
      for (i = 0; i < arms; i++) {
        g.beginPath();
        var a0 = i * TAU / arms, a1 = (i + 1) * TAU / arms, st, f;
        g.moveTo(0, 0);
        for (st = 0; st <= 16; st++) { f = st / 16; g.lineTo(Math.cos(a0 + f * 2.2) * R * f, Math.sin(a0 + f * 2.2) * R * f); }
        g.arc(0, 0, R, a0 + 2.2, a1 + 2.2);
        for (st = 16; st >= 0; st--) { f = st / 16; g.lineTo(Math.cos(a1 + f * 2.2) * R * f, Math.sin(a1 + f * 2.2) * R * f); }
        g.closePath();
        g.fillStyle = RAINBOW[i]; g.fill();
      }
      g.strokeStyle = "rgba(29,35,64,0.55)"; g.lineWidth = 3;
      for (i = 0; i < arms; i++) {
        g.beginPath(); g.moveTo(0, 0);
        for (var s2 = 1; s2 <= 16; s2++) { var f2 = s2 / 16, a2 = i * TAU / arms + f2 * 2.2; g.lineTo(Math.cos(a2) * R * f2, Math.sin(a2) * R * f2); }
        g.stroke();
      }
      g.fillStyle = "#FFFFFF"; g.beginPath(); g.arc(0, 0, R * 0.16, 0, TAU); g.fill();
      g.strokeStyle = OUT; g.lineWidth = 4; g.stroke();
    } else if (d.id === "glow") {
      g.fillStyle = "#20265A"; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
      g.strokeStyle = "rgba(61,245,255,0.5)"; g.lineWidth = 3;
      g.beginPath(); g.arc(0, 0, R * 0.62, 0, TAU); g.stroke();
      var neon = ["#3DF5FF", "#FF6FD8", "#D7FF6B", "#FFE14D"];
      g.shadowBlur = 14;
      for (i = 0; i < 10; i++) {
        a = i * TAU / 10; g.fillStyle = neon[i % 4]; g.shadowColor = neon[i % 4];
        g.beginPath(); g.arc(Math.cos(a) * R * 0.8, Math.sin(a) * R * 0.8, R * 0.09, 0, TAU); g.fill();
      }
      for (i = 0; i < 5; i++) {
        a = i * TAU / 5 + 0.3; g.fillStyle = neon[(i + 1) % 4]; g.shadowColor = g.fillStyle;
        g.beginPath(); g.arc(Math.cos(a) * R * 0.45, Math.sin(a) * R * 0.45, R * 0.07, 0, TAU); g.fill();
      }
      g.fillStyle = "#FFE14D"; g.shadowColor = "#FFE14D"; star(g, R * 0.3, 5, 0.45); g.fill();
      g.shadowBlur = 0;
    } else if (d.id === "gear") {
      facePath(g, d, R); g.fillStyle = "#FF9A2E"; g.fill();
      g.fillStyle = "#FFB55C"; g.beginPath(); g.arc(0, 0, R * 0.74, 0, TAU); g.fill();
      g.strokeStyle = OUT; g.lineWidth = 3; g.stroke();
      for (i = 0; i < 5; i++) {
        a = i * TAU / 5;
        g.fillStyle = "#7A3B05"; g.beginPath(); g.arc(Math.cos(a) * R * 0.48, Math.sin(a) * R * 0.48, R * 0.14, 0, TAU); g.fill();
        g.strokeStyle = OUT; g.lineWidth = 3; g.stroke();
      }
      g.fillStyle = "#FFE14D"; g.beginPath(); g.arc(0, 0, R * 0.22, 0, TAU); g.fill(); g.stroke();
      g.fillStyle = "#4A5578"; g.beginPath(); g.arc(0, 0, R * 0.08, 0, TAU); g.fill();
    }
    g.restore();
  }
  // The blurred version: every ring of the face gets the average color around it (the glow top keeps its
  // brightest color, so its lights turn into neon circles).

  // ---------- Tilt and shake (a grown-up setting on the home screen) ----------
  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === "number") return screen.orientation.angle;
    return typeof window.orientation === "number" ? window.orientation : 0;
  }
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    var be = e.beta * Math.PI / 180, ga = e.gamma * Math.PI / 180;
    var dx = Math.cos(be) * Math.sin(ga), dy = Math.sin(be);
    var th = screenAngle() * Math.PI / 180;
    var sx = dx * Math.cos(th) + dy * Math.sin(th), sy = -dx * Math.sin(th) + dy * Math.cos(th);
    // Held about flat is "level"; a device held upright in the hand leans the bowl only a little.
    sy -= 0.6;
    tiltX = clamp(sx, -0.7, 0.7); tiltY = clamp(sy, -0.7, 0.7);
    if (Math.abs(tiltX) < 0.08) tiltX = 0;
    if (Math.abs(tiltY) < 0.08) tiltY = 0;
  }
  var lastShake = 0;
  function onMotion(e) {
    var a = e.acceleration, m = 0;
    if (a && a.x != null) m = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
    var now = performance.now();
    if (m > 15 && now - lastShake > 800) { lastShake = now; shake(); }
  }
  function shake() {
    if (Toybox.timer.locked()) return;
    tops.forEach(function (t) {
      if (!solid(t)) return;
      t.vx += rnd(-0.6, 0.6); t.vy += rnd(-0.6, 0.6);
      if (t.state === "spin") t.bump = Math.min(0.35, t.bump + 0.15); else t.hop = 1;
    });
    sClack(0.6);
  }
  function setTilt(on) {
    if (on && !tiltOn) { window.addEventListener("deviceorientation", onOrient); window.addEventListener("devicemotion", onMotion); tiltOn = true; }
    if (!on && tiltOn) { window.removeEventListener("deviceorientation", onOrient); window.removeEventListener("devicemotion", onMotion); tiltOn = false; tiltX = tiltY = 0; }
  }

  // ---------- Timer ending, goodbye and rest ----------
  function onEnding(done) {
    ending = true; endingT = 0; endingDone = done;
    Object.keys(ptrs).forEach(function (id) { var P = ptrs[id]; if (P.top && P.top.grab) P.top.grab = null; delete ptrs[id]; });
    if (cord.ptr !== null || cord.auto) { cord.ptr = null; cord.auto = null; cord.back = { t: 0, fx: cord.hx, fy: cord.hy }; }
  }
  function onGoodbye() {
    // the fallen tops give a little hop goodbye
    tops.forEach(function (t, i) { setTimeout(function () { if (t.state === "down") t.hop = 1; sTick(0.6); }, i * 160); });
  }
  function settled() {
    return tops.every(function (t) { return t.state === "down" && t.vx * t.vx + t.vy * t.vy < 0.002; });
  }
  function restArt() {
    return '<svg class="rest-art" viewBox="0 0 240 200" aria-hidden="true">' +
      '<rect x="0" y="0" width="240" height="200" rx="20" fill="#2B3A6B"/>' +
      '<circle cx="204" cy="34" r="16" fill="#FFE8A3"/><circle cx="196" cy="29" r="15" fill="#2B3A6B"/>' +
      '<g stroke="#1D2340" stroke-width="4" stroke-linejoin="round">' +
      '<path d="M22 122 L32 150 A88 30 0 0 0 208 150 L218 122 Z" fill="#3D7BFF"/>' +
      '<ellipse cx="120" cy="122" rx="98" ry="40" fill="#FFC93C"/>' +
      '<ellipse cx="120" cy="122" rx="88" ry="33" fill="#D7ECFF"/>' +
      '<g transform="translate(96 126) rotate(-62)">' +
      '<path d="M0 0 L-20 -22 L-24 -30 L24 -30 L20 -22 Z" fill="#D79A5A"/>' +
      '<rect x="-24" y="-38" width="48" height="8" rx="2" fill="#E8453C"/>' +
      '<rect x="-5" y="-50" width="10" height="12" fill="#E8453C"/><circle cx="0" cy="-52" r="7" fill="#E8453C"/></g>' +
      '<g transform="translate(150 130) rotate(70)">' +
      '<path d="M0 0 L-16 -16 L-22 -22 L22 -22 L16 -16 Z" fill="#9AA6BA"/>' +
      '<rect x="-23" y="-30" width="46" height="8" rx="2" fill="#3D7BFF"/></g></g>' +
      '<text x="168" y="86" font-size="26" font-weight="800" fill="#FFFFFF" font-family="Baloo 2, sans-serif">z</text>' +
      '<text x="184" y="66" font-size="18" font-weight="800" fill="#FFFFFF" font-family="Baloo 2, sans-serif">z</text></svg>';
  }

  // ---------- Main loop ----------
  var lastT = performance.now(), perf = { n: 0, work: 0, workMax: 0, frames: [] };
  function frame(now) {
    var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
    if (perf.frames.length < 600) perf.frames.push(now - lastT);
    lastT = now;
    var w0 = performance.now();
    if (!resting) {
      cordStep(dt);
      update(dt);
    }
    if (ending && endingDone) {
      endingT += dt;
      if (settled() || endingT > 13) { var dn = endingDone; endingDone = null; dn(); }
    }
    var ac = resting ? null : audio();
    for (var i = 0; i < tops.length; i++) humUpdate(tops[i], ac);
    draw();
    var wk = performance.now() - w0;
    perf.n++; perf.work += wk; perf.workMax = Math.max(perf.workMax, wk);
    saveT += dt;
    if (saveT > 1.5) { saveT = 0; if (dirty || tops.some(function (t) { return t.state === "spin"; })) saveNow(); coachUpdate(); }
    requestAnimationFrame(frame);
  }
  document.addEventListener("visibilitychange", function () { if (document.hidden) { saveNow(); stopHums(); } });
  window.addEventListener("pagehide", saveNow);

  // ---------- Debug hooks (?debug only) ----------
  if (DEBUG) {
    window.__tops = {
      state: function () {
        return { design: DES[hang.design].id, tops: tops.map(function (t) { return { id: t.id, d: DES[t.d].id, st: t.state, s: +t.s.toFixed(3), x: +t.x.toFixed(3), y: +t.y.toFixed(3), giant: t.giant, p: +t.p.toFixed(2) }; }),
          learned: { pull: learned.pull, flick: learned.flick }, coach: coachText, W: W, H: H, k: Vw.k, S: Vw.S, ending: ending };
      },
      points: function () {
        var o = { handle: [rect.left + L.restX + 20 * L.s, rect.top + L.restY], launcher: [rect.left + L.x, rect.top + L.y], max: L.max, tops: [] };
        tops.forEach(function (t) { if (t.sx != null) o.tops.push({ id: t.id, st: t.state, x: rect.left + t.sx, y: rect.top + t.sy }); });
        return o;
      },
      perf: function () {
        var f = perf.frames.slice().sort(function (a, b) { return a - b; });
        var r = { avgWork: perf.n ? perf.work / perf.n : 0, maxWork: perf.workMax, frames: f.length, medFrame: f[Math.floor(f.length / 2)], p95Frame: f[Math.floor(f.length * 0.95)] };
        perf.n = 0; perf.work = 0; perf.workMax = 0; perf.frames = [];
        return r;
      },
      launch: function (p) { return !!launch(p == null ? 0.6 : p, 1); },
      fallAll: function () { tops.forEach(function (t) { if (t.state === "spin") t.s = 0.0001; }); },
      fast: function (k) { tops.forEach(function (t) { t.life = Math.min(t.life, k || 3); }); },
      ghost: function () { return ghost.show(); },
      surprise: surprise,
      newBowl: newBowl
    };
  }

  // ---------- Start ----------
  loadState();
  hang.design = S.design;
  if (tops.length) learned.pull = true;
  renderTiles();
  resize();
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(view);
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });
  coachUpdate();
  Toybox.init({
    app: "spinning-tops",
    big: { button: $("bigbtn") },
    badge: $("tbadge"),
    timerIntro: "When time is up, the launcher locks and the tops slow down, tip over and rest.",
    goodbyeOption: "End with a Goodbye button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Goodbye, tops",
    farewellDone: "Bye bye, tops!",
    restLine: "The tops are resting.",
    restLine2: "They will be right here next time.",
    restArt: restArt,
    soundNote: "A soft whir while the tops spin and a click when they bump. Hold for 2 seconds.",
    onEnding: onEnding,
    onGoodbye: onGoodbye,
    onRest: function () { resting = true; endingDone = null; stopHums(); saveNow(); },
    onWake: function () { ending = false; resting = false; endingDone = null; coachUpdate(); },
    onBig: function () { setTimeout(resize, 30); },
    onSound: function (on) { if (!on) stopHums(); }
  });
  stage.appendChild($("tb-toast"));
  stage.appendChild($("tb-farewell"));
  var tiltAllowed = false;
  Toybox.tiltReady(function () { tiltAllowed = true; setTilt(true); });
  Toybox.settings.onChange(function (id, on) {
    if (id !== "tilt") return;
    if (!on) setTilt(false);
    else if (tiltAllowed) setTilt(true);
  });
  requestAnimationFrame(function (t) { lastT = t; frame(t); });
})();
</script>
