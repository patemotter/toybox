<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Marble Run</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Marble Run">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
button { -webkit-touch-callout: none; }
/* Big mode: the panel goes away, the header stays (Big turns into Back). */
body.big .tb-panel { display: none; }
.stage { background: #D6ECFF; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
/* One counter pill holding both counts. */
.mr-counter { font-variant-numeric: tabular-nums; white-space: nowrap; }
.mins {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 3;
  pointer-events: none;
  background: #FFFFFF;
  color: #1D2340;
  border: 3px solid #1D2340;
  border-radius: 999px;
  padding: 0 12px;
  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1.55;
  box-shadow: 3px 3px 0 #1D2340;
}
.mins[hidden], .timebar[hidden] { display: none; }
.timebar { position: absolute; left: 0; right: 0; top: 0; height: 7px; z-index: 1; pointer-events: none; background: rgba(29, 35, 64, 0.12); }
.timebar i { display: block; height: 100%; width: 100%; background: #2E9E5B; }

/* ---------- Panel: Drop (the green Go button), the picked tab's choices, then the tab bar ---------- */
.btn.tb-go.dropbtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; touch-action: none; }
/* Drop (one marble, hold for more) and Lots! (a bucket that fills the hopper right up) share one row. */
.droprow { display: flex; gap: 10px; }
.droprow .dropbtn { flex: 1.7 1 0; min-width: 0; }
.btn.lotsbtn { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 2px 8px;
  background: #FFD23F; color: #1D2340; font-size: 1.45rem; font-weight: 800; white-space: nowrap; touch-action: none; }
.lotsbtn svg { width: 38px; height: 38px; flex: none; }
.lotsbtn.pour svg { animation: lotspour 0.9s ease; }
@keyframes lotspour { 0% { transform: rotate(0); } 35% { transform: rotate(-38deg); } 70% { transform: rotate(-38deg); } 100% { transform: rotate(0); } }
@media (prefers-reduced-motion: reduce) { .lotsbtn.pour svg { animation: none; } }
.dropbtn svg { width: 34px; height: 34px; flex: none; }
.mr-choices { display: flex; flex-direction: column; gap: 10px; }
/* The tab bar always holds Surprise; the section tabs (Runs / Lift / Colors) only show on phones. */
.tb-tabs.mr-tabs { display: flex; }
.mr-tabs .tab { display: none; }
.runs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.runbtn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 6px 2px 2px;
  font-size: 1rem;
  line-height: 1.1;
  min-width: 0;
  white-space: nowrap;
}
.runbtn svg { width: 52px; height: 52px; display: block; }
.runbtn .long { display: none; }
.lifts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.liftbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 2px 8px; font-size: 1.05rem; white-space: nowrap; min-width: 0; }
.liftbtn svg { width: 30px; height: 30px; flex: none; }
.swatches { min-width: 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; }
.swatch {
  aspect-ratio: 1;
  width: 100%;
  max-width: 54px;
  justify-self: center;
  border-radius: 50%;
  border: 3px solid #1D2340;
  cursor: pointer;
  padding: 0;
  font: inherit;
  font-size: 0.8rem;
  font-weight: 800;
  color: #1D2340;
  display: grid;
  place-items: center;
  box-shadow: 2px 2px 0 #1D2340;
}
.swatch[data-color="mix"] { background: conic-gradient(#FF4D6D 0 25%, #FFD23F 0 50%, #5BE36B 0 75%, #5B7CFF 0); }
.swatch[data-color="rainbow"] { background: conic-gradient(#FF4D6D, #FF9F1C, #FFD23F, #5BE36B, #3EC8FF, #5B7CFF, #B26BFF, #FF6FD8, #FF4D6D); }
.swatch[aria-pressed="true"] { outline: 5px solid var(--accent); outline-offset: 2px; }
.swatch:focus-visible { outline: 5px solid var(--focus); outline-offset: 2px; }
.swatch .tick { width: 58%; height: 58%; border-radius: 50%; background: #FFFFFF; border: 2px solid #1D2340; display: grid; place-items: center; font-size: 0.9rem; line-height: 1; }

/* ---------- Timer: the shared toast and ending banner (common/toybox.js) sit on the board here ---------- */
.stage .toast { position: absolute; top: 54px; z-index: 2; font-size: 1.3rem; }
.stage .farewell { position: absolute; top: 30%; bottom: auto; z-index: 2; }
.stage .farewell p { font-size: 1.25rem; }
/* While the timer winds down, the controls are closed. */
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }

/* ---------- Landscape: board on the left, controls on the right ---------- */
@media (orientation: landscape) {
  .tb-body .tb-panel { justify-content: space-between; }
  .mr-choices { gap: 14px; }
  .swatches { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}

/* ---------- Big screens (tablets): every group shows, no tabs needed ---------- */
@media (min-width: 744px) and (min-height: 640px) {
  .tb-panel { gap: 12px; }
  .mins { font-size: 1.35rem; top: 12px; right: 12px; }
  .runbtn { font-size: 1.1rem; }
  .runbtn svg { width: 60px; height: 60px; }
  .btn.tb-go.dropbtn { min-height: 76px; font-size: 1.9rem; }
  .dropbtn svg { width: 44px; height: 44px; }
  .btn.lotsbtn { font-size: 1.8rem; }
  .lotsbtn svg { width: 50px; height: 50px; }
  .liftbtn { min-height: 58px; font-size: 1.2rem; }
  .liftbtn svg { width: 38px; height: 38px; }
  .mr-tabs .btn.tb-surprise { min-height: 58px; font-size: 1.35rem; }
}
@media (min-width: 744px) and (min-height: 640px) and (orientation: portrait) {
  .runs { grid-template-columns: repeat(10, minmax(0, 1fr)); }
  .runbtn .long { display: inline; }
  .runbtn .short { display: none; }
  .runbtn { font-size: 0.95rem; white-space: normal; text-align: center; }
  .runbtn svg { width: 54px; height: 54px; }
}

/* ---------- Phones: tabs (Runs / Lift / Colors) show one group of controls at a time ---------- */
@media (max-width: 600px) and (orientation: portrait), (orientation: landscape) and (max-height: 520px) {
  .mr-tabs .tab { display: inline-flex; align-items: center; justify-content: center; }
  .tb-tabs.mr-tabs .btn.tb-surprise { flex: 1.25 1 0; font-size: 1rem; }
  .tb-panel[data-tab="runs"] [data-pane]:not([data-pane="runs"]),
  .tb-panel[data-tab="lift"] [data-pane]:not([data-pane="lift"]),
  .tb-panel[data-tab="marbles"] [data-pane]:not([data-pane="marbles"]) { display: none; }
  .mr-choices { gap: 8px; }
  .dropbtn svg { width: 28px; height: 28px; }
  .btn.lotsbtn { font-size: 1.25rem; padding: 2px 4px; gap: 4px; }
  .lotsbtn svg { width: 32px; height: 32px; }
  /* Every pane is the same height (two rows), so switching tabs never resizes the board. */
  [data-pane] { height: 106px; }
  .runs { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: 50px 50px; gap: 6px; }
  .runbtn { font-size: 0.9rem; line-height: 1.05; padding: 2px 1px 1px; border-radius: 12px; overflow: hidden; }
  .runbtn svg { width: 30px; height: 30px; }
  .runbtn { font-size: 0.82rem; }
  .lifts { grid-template-columns: 1fr 1fr; gap: 8px; }
  .liftbtn { flex-direction: column; gap: 2px; min-height: 0; font-size: 1.1rem; border-radius: 16px; }
  .liftbtn svg { width: 44px; height: 44px; }
  .swatches { grid-template-columns: repeat(5, 46px); grid-template-rows: 46px 46px; gap: 8px 10px; justify-content: center; align-content: center; }
  .swatch { width: 46px; max-width: none; border-width: 3px; }
  .mins { font-size: 0.95rem; top: 7px; right: 7px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: min(44%, 330px); gap: 6px; }
  .btn.tb-go.dropbtn { min-height: 48px; font-size: 1.25rem; }
  .dropbtn svg { width: 24px; height: 24px; }
  .droprow { gap: 6px; }
  .btn.lotsbtn { min-height: 48px; font-size: 1.1rem; }
  .lotsbtn svg { width: 28px; height: 28px; }
  /* The picked group fills the column (the board does not resize when switching tabs here). */
  .mr-choices > [data-pane] { height: auto; flex: 1 1 auto; min-height: 0; }
  .runs { grid-template-rows: 1fr 1fr; gap: 6px; }
  .runbtn { font-size: 0.8rem; }
  .runbtn svg { width: 30px; height: 30px; }
  /* A smaller counter stays clear of the DROP button drawn on the hopper. */
  .mr-counter { font-size: 0.85rem; padding: 0.1rem 0.5rem; border-radius: 16px; line-height: 1.2; }
  .swatches { grid-template-columns: repeat(5, 42px); grid-template-rows: 42px 42px; gap: 6px 8px; }
  .swatch { width: 42px; }
  .tb-tabs .btn { min-height: 44px; }
}

</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Marble Run</h1>
    <button class="btn tb-iconbtn" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="board" role="img" aria-label="A marble run. Press Drop to let a marble go. Tap marbles to make them hop."></canvas>
      <div class="timebar" id="timebar" hidden><i id="timefill"></i></div>
      <div class="mins" id="mins" hidden></div>
      <div class="tb-counter mr-counter" aria-live="polite">Marbles: <span id="mNum">0</span></div>
    </main>

    <section class="tb-panel" id="panel" data-tab="runs">
      <div class="droprow">
        <button class="btn tb-go dropbtn" id="dropBtn"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="16" r="11" fill="#FFD23F" stroke="#1D2340" stroke-width="3"/><circle cx="16" cy="12" r="3.5" fill="#FFFFFF"/><path d="M20 30v8m-5-5 5 5 5-5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Drop</span></button>
        <button class="btn lotsbtn" id="lotsBtn" aria-label="Lots of marbles"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="13" cy="9" r="5" fill="#FF4D6D" stroke="#1D2340" stroke-width="2.5"/><circle cx="22" cy="6" r="5" fill="#3EC8FF" stroke="#1D2340" stroke-width="2.5"/><circle cx="29" cy="11" r="5" fill="#5BE36B" stroke="#1D2340" stroke-width="2.5"/><circle cx="19" cy="14" r="5" fill="#B26BFF" stroke="#1D2340" stroke-width="2.5"/><path d="M6 15h28l-3.5 20a2.5 2.5 0 0 1-2.5 2H12a2.5 2.5 0 0 1-2.5-2z" fill="#FF9F1C" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><path d="M10 22h20" stroke="#1D2340" stroke-width="2.5" stroke-linecap="round"/></svg><span>Lots!</span></button>
      </div>
      <div class="tb-choices mr-choices">
        <div class="runs" id="runs" data-pane="runs"></div>
        <div class="lifts" role="group" aria-label="Lift" data-pane="lift">
          <button class="btn liftbtn" data-lift="conveyor" aria-pressed="true"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="3" width="14" height="26" rx="4" fill="#3B3F52" stroke="#1D2340" stroke-width="2.5"/><path d="M7 9h18M7 17h18M7 25h18" stroke="#FFD23F" stroke-width="3.5" stroke-linecap="round"/></svg><span>Conveyor</span></button>
          <button class="btn liftbtn" data-lift="spiral" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="14" y="2" width="4" height="28" fill="#5B7CFF" stroke="#1D2340" stroke-width="2"/><path d="M5 27 Q16 31 27 24 Q16 19 5 20 Q16 24 27 17 Q16 12 5 13 Q16 17 27 10 Q16 5 5 6" fill="none" stroke="#1D2340" stroke-width="5" stroke-linecap="round"/><path d="M5 27 Q16 31 27 24 Q16 19 5 20 Q16 24 27 17 Q16 12 5 13 Q16 17 27 10 Q16 5 5 6" fill="none" stroke="#FF9F1C" stroke-width="2.5" stroke-linecap="round"/></svg><span>Spiral</span></button>
        </div>
        <div class="swatches" id="swatches" data-pane="marbles"></div>
      </div>
      <nav class="tb-tabs mr-tabs" id="tabs">
        <button class="btn tab" data-tab="runs" aria-pressed="true">Runs</button>
        <button class="btn tab" data-tab="lift" aria-pressed="false">Lift</button>
        <button class="btn tab" data-tab="marbles" aria-pressed="false">Colors</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
