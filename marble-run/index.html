<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marble Run</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Marble Run">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
button { -webkit-touch-callout: none; }
/* Big mode: the panel goes away, the header stays (Big turns into Back). */
body.big .tb-panel { display: none; }
.stage { background: #D6ECFF; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
/* One counter pill holding both counts. */
.mr-counter { font-variant-numeric: tabular-nums; white-space: nowrap; }
.mins {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 3;
  pointer-events: none;
  background: #FFFFFF;
  color: #1D2340;
  border: 3px solid #1D2340;
  border-radius: 999px;
  padding: 0 12px;
  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1.55;
  box-shadow: 3px 3px 0 #1D2340;
}
.mins[hidden], .timebar[hidden] { display: none; }
.timebar { position: absolute; left: 0; right: 0; top: 0; height: 7px; z-index: 1; pointer-events: none; background: rgba(29, 35, 64, 0.12); }
.timebar i { display: block; height: 100%; width: 100%; background: #2E9E5B; }

/* ---------- Panel: Drop (the green Go button), the picked tab's choices, then the tab bar ---------- */
.btn.tb-go.dropbtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; touch-action: none; }
/* Drop (one marble, hold for more) and Lots! (a bucket that fills the hopper right up) share one row. */
.droprow { display: flex; gap: 10px; }
.droprow .dropbtn { flex: 1.7 1 0; min-width: 0; }
.btn.lotsbtn { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 2px 8px;
  background: #FFD23F; color: #1D2340; font-size: 1.45rem; font-weight: 800; white-space: nowrap; touch-action: none; }
.lotsbtn svg { width: 38px; height: 38px; flex: none; }
.lotsbtn.pour svg { animation: lotspour 0.9s ease; }
@keyframes lotspour { 0% { transform: rotate(0); } 35% { transform: rotate(-38deg); } 70% { transform: rotate(-38deg); } 100% { transform: rotate(0); } }
@media (prefers-reduced-motion: reduce) { .lotsbtn.pour svg { animation: none; } }
.dropbtn svg { width: 34px; height: 34px; flex: none; }
.mr-choices { display: flex; flex-direction: column; gap: 10px; }
.tb-tabs.mr-tabs { display: none; }
.runs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.runbtn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 6px 2px 2px;
  font-size: 1rem;
  line-height: 1.1;
  min-width: 0;
  white-space: nowrap;
}
.runbtn svg { width: 52px; height: 52px; display: block; }
.runbtn .long { display: none; }
.lifts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.liftbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 2px 8px; font-size: 1.05rem; white-space: nowrap; min-width: 0; }
.liftbtn svg { width: 30px; height: 30px; flex: none; }
.swatches { min-width: 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; }
.swatch {
  aspect-ratio: 1;
  width: 100%;
  max-width: 54px;
  justify-self: center;
  border-radius: 50%;
  border: 3px solid #1D2340;
  cursor: pointer;
  padding: 0;
  font: inherit;
  font-size: 0.8rem;
  font-weight: 800;
  color: #1D2340;
  display: grid;
  place-items: center;
  box-shadow: 2px 2px 0 #1D2340;
}
.swatch[data-color="mix"] { background: conic-gradient(#FF4D6D 0 25%, #FFD23F 0 50%, #5BE36B 0 75%, #5B7CFF 0); }
.swatch[data-color="rainbow"] { background: conic-gradient(#FF4D6D, #FF9F1C, #FFD23F, #5BE36B, #3EC8FF, #5B7CFF, #B26BFF, #FF6FD8, #FF4D6D); }
.swatch[aria-pressed="true"] { outline: 5px solid var(--accent); outline-offset: 2px; }
.swatch:focus-visible { outline: 5px solid var(--focus); outline-offset: 2px; }
.swatch .tick { width: 58%; height: 58%; border-radius: 50%; background: #FFFFFF; border: 2px solid #1D2340; display: grid; place-items: center; font-size: 0.9rem; line-height: 1; }

/* ---------- Timer: the shared toast and ending banner (common/toybox.js) sit on the board here ---------- */
.stage .toast { position: absolute; top: 54px; z-index: 2; font-size: 1.3rem; }
.stage .farewell { position: absolute; top: 30%; bottom: auto; z-index: 2; }
.stage .farewell p { font-size: 1.25rem; }
/* While the timer winds down, the controls are closed. */
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }

/* ---------- Landscape: board on the left, controls on the right ---------- */
@media (orientation: landscape) {
  .tb-body .tb-panel { justify-content: space-between; }
  .mr-choices { gap: 14px; }
  .swatches { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}

/* ---------- Big screens (tablets): every group shows, no tabs needed ---------- */
@media (min-width: 744px) and (min-height: 640px) {
  .tb-panel { gap: 12px; }
  .mins { font-size: 1.35rem; top: 12px; right: 12px; }
  .runbtn { font-size: 1.1rem; }
  .runbtn svg { width: 60px; height: 60px; }
  .btn.tb-go.dropbtn { min-height: 76px; font-size: 1.9rem; }
  .dropbtn svg { width: 44px; height: 44px; }
  .btn.lotsbtn { font-size: 1.8rem; }
  .lotsbtn svg { width: 50px; height: 50px; }
  .liftbtn { min-height: 58px; font-size: 1.2rem; }
  .liftbtn svg { width: 38px; height: 38px; }
}
@media (min-width: 744px) and (min-height: 640px) and (orientation: portrait) {
  .runs { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  .runbtn .long { display: inline; }
  .runbtn .short { display: none; }
  .runbtn { font-size: 0.95rem; white-space: normal; text-align: center; }
  .runbtn svg { width: 54px; height: 54px; }
}

/* ---------- Phones: tabs (Runs / Lift / Colors) show one group of controls at a time ---------- */
@media (max-width: 600px) and (orientation: portrait), (orientation: landscape) and (max-height: 520px) {
  .tb-tabs.mr-tabs { display: flex; }
  .tb-panel[data-tab="runs"] [data-pane]:not([data-pane="runs"]),
  .tb-panel[data-tab="lift"] [data-pane]:not([data-pane="lift"]),
  .tb-panel[data-tab="marbles"] [data-pane]:not([data-pane="marbles"]) { display: none; }
  .mr-choices { gap: 8px; }
  .dropbtn svg { width: 28px; height: 28px; }
  .btn.lotsbtn { font-size: 1.25rem; padding: 2px 4px; gap: 4px; }
  .lotsbtn svg { width: 32px; height: 32px; }
  /* Every pane is the same height (two rows), so switching tabs never resizes the board. */
  [data-pane] { height: 106px; }
  .runs { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 50px 50px; gap: 6px; }
  .runbtn { font-size: 0.9rem; line-height: 1.05; padding: 2px 1px 1px; border-radius: 12px; overflow: hidden; }
  .runbtn svg { width: 30px; height: 30px; }
  .lifts { grid-template-columns: 1fr 1fr; gap: 8px; }
  .liftbtn { flex-direction: column; gap: 2px; min-height: 0; font-size: 1.1rem; border-radius: 16px; }
  .liftbtn svg { width: 44px; height: 44px; }
  .swatches { grid-template-columns: repeat(5, 46px); grid-template-rows: 46px 46px; gap: 8px 10px; justify-content: center; align-content: center; }
  .swatch { width: 46px; max-width: none; border-width: 3px; }
  .mins { font-size: 0.95rem; top: 7px; right: 7px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .tb-body .tb-panel { width: min(44%, 330px); gap: 6px; }
  .btn.tb-go.dropbtn { min-height: 48px; font-size: 1.25rem; }
  .dropbtn svg { width: 24px; height: 24px; }
  .droprow { gap: 6px; }
  .btn.lotsbtn { min-height: 48px; font-size: 1.1rem; }
  .lotsbtn svg { width: 28px; height: 28px; }
  /* The picked group fills the column (the board does not resize when switching tabs here). */
  .mr-choices > [data-pane] { height: auto; flex: 1 1 auto; min-height: 0; }
  .runs { grid-template-rows: 1fr 1fr; gap: 6px; }
  .runbtn { font-size: 0.8rem; }
  .runbtn svg { width: 30px; height: 30px; }
  /* A smaller counter stays clear of the DROP button drawn on the hopper. */
  .mr-counter { font-size: 0.85rem; padding: 0.1rem 0.5rem; border-radius: 16px; line-height: 1.2; }
  .swatches { grid-template-columns: repeat(5, 42px); grid-template-rows: 42px 42px; gap: 6px 8px; }
  .swatch { width: 42px; }
  .tb-tabs .btn { min-height: 44px; }
}

/* Ghost hand: a see-through hand that shows the main move once (same look as Bulldozer and Measuring). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Marble Run</h1>
    <button class="btn tb-iconbtn" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="board" role="img" aria-label="A marble run. Press Drop to let a marble go. Tap marbles to make them hop."></canvas>
      <div class="timebar" id="timebar" hidden><i id="timefill"></i></div>
      <div class="mins" id="mins" hidden></div>
      <div class="tb-counter mr-counter" aria-live="polite">Marbles: <span id="mNum">0</span></div>
    </main>

    <section class="tb-panel" id="panel" data-tab="runs">
      <div class="droprow">
        <button class="btn tb-go dropbtn" id="dropBtn"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="16" r="11" fill="#FFD23F" stroke="#1D2340" stroke-width="3"/><circle cx="16" cy="12" r="3.5" fill="#FFFFFF"/><path d="M20 30v8m-5-5 5 5 5-5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Drop</span></button>
        <button class="btn lotsbtn" id="lotsBtn" aria-label="Lots of marbles"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="13" cy="9" r="5" fill="#FF4D6D" stroke="#1D2340" stroke-width="2.5"/><circle cx="22" cy="6" r="5" fill="#3EC8FF" stroke="#1D2340" stroke-width="2.5"/><circle cx="29" cy="11" r="5" fill="#5BE36B" stroke="#1D2340" stroke-width="2.5"/><circle cx="19" cy="14" r="5" fill="#B26BFF" stroke="#1D2340" stroke-width="2.5"/><path d="M6 15h28l-3.5 20a2.5 2.5 0 0 1-2.5 2H12a2.5 2.5 0 0 1-2.5-2z" fill="#FF9F1C" stroke="#1D2340" stroke-width="3" stroke-linejoin="round"/><path d="M10 22h20" stroke="#1D2340" stroke-width="2.5" stroke-linecap="round"/></svg><span>Lots!</span></button>
      </div>
      <div class="tb-choices mr-choices">
        <div class="runs" id="runs" data-pane="runs"></div>
        <div class="lifts" role="group" aria-label="Lift" data-pane="lift">
          <button class="btn liftbtn" data-lift="conveyor" aria-pressed="true"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="3" width="14" height="26" rx="4" fill="#3B3F52" stroke="#1D2340" stroke-width="2.5"/><path d="M7 9h18M7 17h18M7 25h18" stroke="#FFD23F" stroke-width="3.5" stroke-linecap="round"/></svg><span>Conveyor</span></button>
          <button class="btn liftbtn" data-lift="spiral" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="14" y="2" width="4" height="28" fill="#5B7CFF" stroke="#1D2340" stroke-width="2"/><path d="M5 27 Q16 31 27 24 Q16 19 5 20 Q16 24 27 17 Q16 12 5 13 Q16 17 27 10 Q16 5 5 6" fill="none" stroke="#1D2340" stroke-width="5" stroke-linecap="round"/><path d="M5 27 Q16 31 27 24 Q16 19 5 20 Q16 24 27 17 Q16 12 5 13 Q16 17 27 10 Q16 5 5 6" fill="none" stroke="#FF9F1C" stroke-width="2.5" stroke-linecap="round"/></svg><span>Spiral</span></button>
        </div>
        <div class="swatches" id="swatches" data-pane="marbles"></div>
      </div>
      <nav class="tb-tabs mr-tabs" id="tabs">
        <button class="btn tab" data-tab="runs" aria-pressed="true">Runs</button>
        <button class="btn tab" data-tab="lift" aria-pressed="false">Lift</button>
        <button class="btn tab" data-tab="marbles" aria-pressed="false">Colors</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var KEY = "marblerun-v1";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var COLORS = [
    ["Red", "#FF4D6D"], ["Orange", "#FF9F1C"], ["Yellow", "#FFD23F"], ["Green", "#5BE36B"],
    ["Sky", "#3EC8FF"], ["Blue", "#5B7CFF"], ["Purple", "#B26BFF"], ["Pink", "#FF6FD8"]
  ];
  var NC = COLORS.length, RAINBOW = NC;   // color index NC = a rainbow-swirl marble
  var RUNS = [["zigzag", "Zigzag", "Zigzag"], ["spiral", "Spiral", "Spiral tower"], ["loop", "Loop", "Loop-de-loop"],
    ["funnels", "Funnels", "Funnels"], ["machine", "Machine", "Machine"], ["mix1", "Mix 1", "Mix 1"], ["mix2", "Mix 2", "Mix 2"],
    ["kit", "Kit", "Kit"]];
  var RUN_IDS = RUNS.map(function (r) { return r[0]; });

  // The world is a fixed 1000 x 1160 board, scaled to fit the stage.
  var W = 1000, H = 1160;
  var RM = 23;                 // marble radius
  var TR = 8;                  // rail radius
  var G = 1150;                // gravity (world units / s^2)
  var STEP = 1 / 240;          // fixed physics timestep
  var SIM_SPEED = 0.62;        // a bit slower than real time: lively but calm (the physics step stays fixed)
  var CAP = 30;                // most marbles on the toy
  var TRAIL = 8;
  var OUT = "#1D2340";

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function mix(a, b, t) {
    var x = hexRgb(a), y = hexRgb(b);
    return "#" + [0, 1, 2].map(function (k) {
      var v = Math.round(x[k] + (y[k] - x[k]) * t);
      return (v < 16 ? "0" : "") + v.toString(16);
    }).join("");
  }
  function colHex(c) { return c >= NC ? "#FFFFFF" : COLORS[c][1]; }

  // ---------- Saved settings ----------
  // Opening Marble Run from the Toybox home screen (Toybox.fresh) starts the first-visit run, lift
  // and color; a reload keeps them.
  if (window.Toybox && Toybox.fresh()) {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
  }
  function freshState() { return { run: "zigzag", color: "mix", marbles: [], lift: "conveyor" }; }
  function loadState() {
    var s = freshState();
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (o && typeof o === "object") {
        if (RUN_IDS.indexOf(o.run) !== -1) s.run = o.run;
        if (o.color === "mix" || o.color === "rainbow" || (Number.isInteger(o.color) && o.color >= 0 && o.color < NC)) s.color = o.color;
        if (o.lift === "spiral") s.lift = "spiral";
        if (Array.isArray(o.marbles)) s.marbles = o.marbles.filter(function (c) { return Number.isInteger(c) && c >= 0 && c <= NC; }).slice(0, CAP);
      }
    } catch (e) { /* storage unavailable or bad data: use defaults */ }
    return s;
  }
  var state = loadState();
  var saveDirty = false, lastSave = 0;
  function save() {
    // A visit always starts with no marbles (the child adds them with Drop), so none are saved.
    state.marbles = [];
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    saveDirty = false;
    lastSave = performance.now();
  }

  // ---------- Sound (off by default; soft and synthesized) ----------
  // The on/off setting and the AudioContext are shared Toybox-wide (common/toybox.js); the module
  // starts/resumes audio on every touch while sound is on. Marble Run builds its own master chain
  // (soft low-pass, noise buffer, rolling rumble) once per context.
  var actx = null, master = null, noiseBuf = null, rollGain = null;
  function live() {
    var ac = Toybox.sound.ready();
    if (!ac) return false;
    if (ac !== actx) {
      try {
        var lp = ac.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 3600;
        master = ac.createGain();
        master.gain.value = 0.5;
        master.connect(lp);
        lp.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        // Soft rolling rumble: looped noise through a low filter; its volume follows the marbles.
        var src = ac.createBufferSource();
        src.buffer = noiseBuf;
        src.loop = true;
        var f = ac.createBiquadFilter();
        f.type = "lowpass";
        f.frequency.value = 260;
        rollGain = ac.createGain();
        rollGain.gain.value = 0;
        src.connect(f); f.connect(rollGain); rollGain.connect(master);
        src.start();
        actx = ac;
      } catch (e) { return false; }
    }
    return true;
  }

  var tokens = 5, tokenT = 0;
  function takeToken() {
    var now = performance.now();
    tokens = Math.min(5, tokens + (now - tokenT) * 0.014);
    tokenT = now;
    if (tokens < 1) return false;
    tokens -= 1;
    return true;
  }
  function tone(freq, dur, vol, type, slideTo, delay) {
    if (!live()) return;
    try {
      var t = actx.currentTime + (delay || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur * 0.7);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) { /* ignore */ }
  }
  function clack(k) {
    if (!live() || !takeToken()) return;
    try {
      var t = actx.currentTime;
      var s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
      s.buffer = noiseBuf;
      f.type = "bandpass"; f.frequency.value = rand(2300, 3400); f.Q.value = 6;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05 + 0.12 * k, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      s.connect(f); f.connect(g); g.connect(master);

  function allSettled() {

    for (var k = 0; k < LIFT_N; k++) if (lift.carry[k]) return false;
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (b.mode !== "free" || b.y < TRAY_Y) return false;
      if (b.vx * b.vx + b.vy * b.vy > 30 * 30) return false;
    }
    for (i = 0; i < bodies.length; i++) if (bodies[i].kind === "bucket" && bodies[i].phase !== "wait") return false;
    return true;
  }
  function onRest() { ending = false; endingDone = null; save(); }
  function onWake() { ending = false; endingDone = null; }
  function restArt() {
    return '<svg class="rest-art" viewBox="0 0 280 170" aria-hidden="true">' +
      '<path d="M20 60 Q140 92 260 60" fill="none" stroke="#1D2340" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.25"/>' +
      '<rect x="14" y="96" width="252" height="58" rx="14" fill="#E9B872" stroke="#1D2340" stroke-width="5"/>' +
      '<path d="M30 118h220M30 136h220" stroke="#C98F4A" stroke-width="3" stroke-linecap="round"/>' +
      '<g stroke="#1D2340" stroke-width="4"><circle cx="52" cy="78" r="22" fill="#FF4D6D"/><circle cx="98" cy="78" r="22" fill="#FFD23F"/><circle cx="144" cy="78" r="22" fill="#5BE36B"/><circle cx="190" cy="78" r="22" fill="#3EC8FF"/><circle cx="236" cy="78" r="22" fill="#B26BFF"/></g>' +
      '<g fill="#FFFFFF" opacity="0.85"><circle cx="45" cy="70" r="6"/><circle cx="91" cy="70" r="6"/><circle cx="137" cy="70" r="6"/><circle cx="183" cy="70" r="6"/><circle cx="229" cy="70" r="6"/></g>' +
      '<g fill="#1D2340" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800"><text x="196" y="36" font-size="22">z</text><text x="214" y="22" font-size="28">z</text><text x="236" y="10" font-size="34" dominant-baseline="hanging">z</text></g>' +
      "</svg>";
  }

  document.addEventListener("visibilitychange", function () { if (document.hidden) save(); });
  window.addEventListener("pagehide", save);

  // Every visit starts with no marbles: the child adds them with Drop.
  renderControls();
  build();
  // The old Marble Run sound key held "on"/"off"; the shared migration reads "1"/"true", so translate it once.
  try { if (localStorage.getItem("marblerun-sound-v1") === "on") localStorage.setItem("marblerun-sound-v1", "1"); } catch (e) { /* ignore */ }
  Toybox.init({
    app: "marble-run",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the lift stops, the marbles roll down to the tray and rest, and the controls lock.",
    goodbyeOption: "End with a Last marble button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Last marble",
    farewellDone: "Bye bye!",
    restLine: "The marbles are resting.",
    restLine2: "They will be right here next time.",
    restArt: restArt,
    soundNote: "Soft clicks, bells and rolling. Hold for 2 seconds.",
    legacy: { timer: "marblerun-timer-v1", sound: "marblerun-sound-v1", big: "marblerun-big-v1" },
    onEnding: onEnding,
    onGoodbye: lastMarble,
    onRest: onRest,
    onWake: onWake,
    onSound: function (on) {
      if (on) chime();
      else if (rollGain && actx) { try { rollGain.gain.setTargetAtTime(0, actx.currentTime, 0.05); } catch (e) { /* ignore */ } }
    },
    onTimer: drawTimer
  });
  requestAnimationFrame(frame);

  // Test hook for automated checks, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) {
    window.__mr = {
      speed: function (k) { dbgSpeed = k; },
      drop: dropPress,
      lots: lotsPress,
      total: total,
      run: function () { return state.run; },
      cost: function () { return frameCost; },
      recycles: function () { return recycles; },
      modes: function () {
        var m = {};
        balls.forEach(function (b) { m[b.mode] = (m[b.mode] || 0) + 1; });
        m.hopper = hopper.queue.length;
        return m;
      },
      info: function () { return balls.map(function (b) { return [b.mode, Math.round(b.x), Math.round(b.y), b.nudges]; }); },
      hopper: function () { return { queue: hopper.queue.length, pending: hopper.pending }; },
      wheels: function () { return bodies.filter(function (b) { return b.kind === "wheel"; }).map(function (b) { return { x: b.cx, y: b.cy, w: +b.w.toFixed(2) }; }); },
      spinners: function () { return spinners.map(function (s) { return { x: s.x, y: s.y, w: +s.w.toFixed(2) }; }); },
      funnels: function () { return funnels.map(function (f) { return { x: f.cx, y: f.cy, w: +f.w.toFixed(2) }; }); },
      balls: function () { return balls.map(function (b) { return { id: b.id, m: b.mode, x: Math.round(b.x), y: Math.round(b.y), vx: Math.round(b.vx), vy: Math.round(b.vy) }; }); },
      lift: function (id) { switchLift(id); renderControls(); },
      setRun: function (id) { switchRun(id); renderControls(); },
      toScreen: function (x, y) { var r = canvas.getBoundingClientRect(); return { x: r.left + OX + x * S, y: r.top + OY + y * S }; }
    };
  }
})();
</script>
</body>
</html>
