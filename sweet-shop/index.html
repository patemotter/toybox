<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sweet Shop</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sweet Shop">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF; --panel: #FFFFFF; --ink: #1D2340; --muted: #4A5578; --edge: #1D2340; --accent: #FFC93C; --plate: #F4FAFF; --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.tb-head a { text-decoration: none; }
.stage { background: #FFE3EC; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
/* In the side column the three mold tiles sit two to a row, so they keep their full size. */
@media (orientation: landscape) { .tb-v2 .tb-panel { justify-content: space-between; } #tiles { --tb-cols: 2 !important; } }
@media (orientation: landscape) and (max-height: 520px) { .tb-v2 .tb-body .tb-panel { width: 220px; } }
/* In the side column the three bottom buttons stand their picture over their word, so all three fit. */
@media (orientation: landscape) { .tb-v2 #bottom .btn { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 14px; min-height: 64px; } }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }
.rest-art { width: min(70vw, 300px, 46vh); aspect-ratio: 1; border: 3px solid #1D2340; border-radius: 18px; background: #FFE3EC; }
</style>
</head>
<body>
<div class="tb-app-shell tb-v2">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Sweet Shop</h1>
  </header>
  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A sweet shop counter for making gummies: flavor bottles and a candy jar on the shelves, a saucepan on a hot plate, a bowl of gelatin and sugar, a silicone mold and a fridge. Pour a flavor into the pot, tip in the gelatin, turn the knob and stir until the mix is clear, fill the mold with the candy dropper, chill it in the fridge, pop the gummies out, coat them sour, sugary or shiny, and put them in the candy jar."></canvas>
      <div id="coach"></div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
    <section class="tb-panel" id="panel">
      <div id="tiles"></div>
      <div id="bottom"></div>
    </section>
  </div>
</div>
<script src="index.js"></script>
</body>
</html>
