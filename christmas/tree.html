<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tree</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Christmas">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF; --panel: #FFFFFF; --ink: #1D2340; --muted: #4A5578; --edge: #1D2340; --accent: #FFC93C; --plate: #F4FAFF; --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.tb-head a { text-decoration: none; }
.stage { background: #20345E; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
body.ending .tb-panel, body.ending .tb-jobs { pointer-events: none; opacity: 0.4; }
/* Each folder tab shows one group of pick-one tiles. Every group keeps the same height, so a tab change never
   moves the stage. The Tree group is two rows (shapes, colors); Lights and Garland are eight tiles each. */
.grp { display: flex; flex-direction: column; gap: var(--tb-s2); }
.grp[hidden] { display: none; }
.grp > .tb-tilerow { flex: 1 1 0; min-height: 0; grid-auto-rows: 1fr; }
.grp .btn.tb-tile { min-height: 0; padding-left: 1px; padding-right: 1px; }
.grp .tb-tile-word { white-space: normal; text-align: center; line-height: 1.02; }
.grp .tb-tile .tb-pic { width: calc(var(--tb-tile) * 0.48); height: calc(var(--tb-tile) * 0.48); }
@media (max-width: 600px) { .grp .btn.tb-tile { font-size: 15px; } }
@media (orientation: portrait) {
  .grp { height: calc(var(--tb-tile) * 2 + var(--tb-s2)); }
}
@media (orientation: portrait) and (min-width: 700px) and (min-height: 700px) {
  .grp { gap: var(--tb-s3); height: calc(var(--tb-tile) * 2 + var(--tb-s3)); }
}
@media (orientation: landscape) {
  /* Side column: two tiles across, four rows. */
  .tb-v2 .tb-body .tb-panel { width: min(30%, 300px); justify-content: space-between; }
  .grp > .tb-tilerow { --tb-cols: 2 !important; }
  .grp { height: calc(var(--tb-tile) * 4 + var(--tb-s2) * 3); }
  .tb-v2 #bottom .btn { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 14px; min-height: 64px; }
}
@media (orientation: landscape) and (min-width: 700px) and (min-height: 700px) {
  .grp { gap: var(--tb-s3); height: calc(var(--tb-tile) * 4 + var(--tb-s3) * 3); }
}
@media (orientation: landscape) and (max-height: 520px) {
  /* Sideways phone: a wider column with the tiles four across in two rows. */
  .tb-v2 .tb-body .tb-panel { width: 344px; }
  .grp { gap: 6px; height: calc(78px * 2 + 6px); }
  .grp > .tb-tilerow { --tb-cols: 4 !important; gap: 6px; }
  .grp .btn.tb-tile { font-size: 14px; padding: 4px 1px 3px; }
  .grp .tb-tile .tb-pic { width: 32px; height: 32px; }
  .tb-job { min-height: 46px; }
  .tb-v2 #bottom .btn { flex-direction: row; gap: 6px; min-height: 56px; font-size: 16px; }
}
.rest-art { width: min(70vw, 300px, 46vh); aspect-ratio: 1; border: 3px solid #1D2340; border-radius: 18px; background: #20345E; }
</style>
</head>
<body>
<div class="tb-app-shell tb-v2">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back" id="backbtn" href="./" aria-label="Back to Christmas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Christmas</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title"><span class="tb-app">Christmas · </span><span class="tb-station">Tree</span></h1>
  </header>
  <div class="tb-body">
    <div class="tb-stagecol">
      <main class="tb-stage stage" id="stage">
        <canvas id="cv" role="img" aria-label="A cozy living room in the evening with a big bare tree in its stand, a window with snow falling outside, a box of ornaments and a box with a coil of lights and a coil of garland on the floor, and the lights' cord plugged into the wall socket. Drag the lights or the garland from the box onto the tree (or tap a coil for a whole wrap), press the switch on the cord to turn the lights on and change how they shine, hang ornaments from the box on the branches and put the star on top. Drag anything off the tree to put it back in its box. The tabs under the picture pick the tree's shape and color, the lights' color and the garland."></canvas>
        <div id="coach"></div>
        <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
      </main>
      <div id="jobs"></div>
    </div>
    <section class="tb-panel" id="panel">
      <div class="grp" id="grp-tree"><div id="shapes"></div><div id="tcols"></div></div>
      <div class="grp" id="grp-lights"><div id="lights"></div></div>
      <div class="grp" id="grp-garland"><div id="garlands"></div></div>
      <div id="bottom"></div>
    </section>
  </div>
</div>
<script src="tree.js"></script>
</body>
</html>
