<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Christmas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Christmas">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF; --panel: #FFFFFF; --ink: #1D2340; --muted: #4A5578; --edge: #1D2340; --accent: #FFC93C; --plate: #F4FAFF; --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.tb-head a { text-decoration: none; }

/* ---------- The snowy evening with the five stations ---------- */
.stage { background: #2B3A67; touch-action: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#map [data-go] { cursor: pointer; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
/* Station buttons: white pills with a picture and the station's name, standing in the snow under each station. */
.sbtn {
  position: absolute; left: 0; top: 0; z-index: 2; transform: translate(-50%, -50%);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none;
  font-size: clamp(1.05rem, 2.6vw, 1.5rem); font-weight: 800; line-height: 1; min-height: 56px;
  padding: 0.25rem 1rem 0.25rem 0.55rem;
}
.sbtn:active { transform: translate(-50%, -50%) translateY(2px); }
.sbtn svg { width: 1.6em; height: 1.6em; flex: none; display: block; overflow: visible; pointer-events: none; }
.sbtn span { pointer-events: none; padding-top: 0.12em; }
.sbtn.small { min-height: 46px; font-size: 1rem; padding: 0.15rem 0.7rem 0.15rem 0.4rem; }
/* Calm life in the scene: falling snow and slowly twinkling tree lights. */
.flake { animation: fall linear infinite; }
@keyframes fall { from { transform: translateY(-40px); } to { transform: translateY(var(--fall, 900px)); } }
.tw { animation: tw 3.2s ease-in-out infinite; }
@keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.glow { animation: glow 3.6s ease-in-out infinite; }
@keyframes glow { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.95; } }
.st { transform-box: fill-box; transform-origin: 50% 100%; }
.st.hop { animation: hop 0.6s ease-out; }
@keyframes hop { 40% { transform: translateY(-18px) scale(1.04); } 100% { transform: none; } }
.st.wig { animation: wig 0.7s ease-in-out; }
@keyframes wig { 20% { transform: rotate(-4deg); } 45% { transform: rotate(3deg); } 70% { transform: rotate(-2deg); } 100% { transform: none; } }
.spark { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; }
body.ending .homebtn, body.ending .sbtn, body.ending #map [data-go] { pointer-events: none; }
body.ending .homebtn, body.ending .sbtn { opacity: 0.4; }
.rest-art { width: min(76vw, 340px, 46vh); aspect-ratio: 4 / 3; border: 3px solid #1D2340; border-radius: 18px; background: #2B3A67; }
@media (min-width: 744px) and (min-height: 640px) {
  .sbtn.small { min-height: 56px; font-size: 1.15rem; }
}
@media (prefers-reduced-motion: reduce) {
  .flake, .tw, .glow { animation: none; }
}
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title"><span class="tb-station">Christmas</span></h1>
  </header>
  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <svg id="map" role="img" aria-label="A snowy Christmas evening with a Christmas tree, a snowman, a pile of presents, a paper snowflake in a window and a tray of Christmas cookies"></svg>
      <div id="sbtns"></div>
      <div class="tb-coach" id="coach">Tap the tree!</div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
  </div>
</div>
<script src="index.js"></script>
</body>
</html>
