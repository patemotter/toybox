<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snowflakes</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Christmas">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF; --panel: #FFFFFF; --ink: #1D2340; --muted: #4A5578; --edge: #1D2340; --accent: #FFC93C; --plate: #F4FAFF; --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.tb-head a { text-decoration: none; }
.stage { background: #DCEBFF; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tbadge { position: absolute; top: 10px; right: 10px; z-index: 3; }
/* The fold types (five tiles), then the paper colors (the Open tile takes the colors' place while he cuts).
   Wide enough (an upright iPad, a sideways phone), the five fold types share one row. */
#folds { --tb-cols: 5 !important; }
/* An upright phone: the fold types three over two (the second row centered), the tiles at their smallest size. */
@media (orientation: portrait) and (max-width: 600px) {
  #folds { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  #folds .tb-tile { grid-column: span 2; }
  #folds .tb-tile:nth-child(4) { grid-column: 2 / span 2; }
  .tb-v2 .tb-panel { gap: 8px; padding: 8px 10px; }
  .tb-v2 .tb-tilerow { gap: 6px; }
  .tb-v2 .tb-tilerow .btn.tb-tile { min-height: 76px; padding: 3px 2px; }
  .tb-v2 .tb-tilerow .tb-tile .tb-pic { width: 38px; height: 38px; }
}
@media (orientation: landscape) { .tb-v2 .tb-panel { justify-content: flex-start; } .tb-v2 .tb-panel > .tb-bottombar { margin-top: auto; } }
/* Sideways on an iPad the side column holds the fold types three to a row and the colors two to a row (the Open
   tile then fills both color rows). */
@media (orientation: landscape) and (min-height: 521px) {
  #folds { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  #folds .tb-tile { grid-column: span 2; }
  #folds .tb-tile:nth-child(4) { grid-column: 2 / span 2; }
  #tiles { --tb-cols: 2 !important; }
  #act .btn.tb-tile { min-height: calc(var(--tb-tile) * 2 + var(--tb-s2)); flex-direction: column; }
}
/* A sideways phone: a wide side column of small tiles (five fold types in a row), so both rows and the bar fit. */
@media (orientation: landscape) and (max-height: 520px) {
  .tb-v2 .tb-body .tb-panel { width: 428px; padding: 8px; gap: 8px; }
  .tb-v2 .tb-tilerow { gap: 6px; }
  .tb-v2 .tb-tilerow .btn.tb-tile { min-height: 78px; padding: 3px 2px; font-size: 14px; }
  .tb-v2 .tb-tilerow .tb-tile .tb-pic { width: 38px; height: 38px; }
  .tb-v2 #bottom .btn { min-height: 60px; font-size: 15px; }
}
#act { --tb-cols: 1; }
#act .btn.tb-tile { flex-direction: row; gap: 10px; background: #E9F9EE; }
#act .tb-tile-word { white-space: normal; text-align: center; }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }
.rest-art { width: min(70vw, 300px, 46vh); aspect-ratio: 1; border: 3px solid #1D2340; border-radius: 18px; background: #DCEBFF; }
</style>
</head>
<body>
<div class="tb-app-shell tb-v2">
  <header class="tb-head">
    <a class="btn tb-iconbtn tb-back" id="backbtn" href="./" aria-label="Back to Christmas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg><span>Christmas</span></a>
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title"><span class="tb-app">Christmas · </span><span class="tb-station">Snowflakes</span></h1>
  </header>
  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="cv" role="img" aria-label="A sheet of paper to fold, cut with scissors and open into a snowflake."></canvas>
      <div id="coach"></div>
      <svg class="tbadge" id="tbadge" viewBox="0 0 60 60" aria-hidden="true" hidden></svg>
    </main>
    <section class="tb-panel" id="panel">
      <div id="folds"></div>
      <div id="tiles"></div>
      <div id="act" class="tb-tilerow" hidden><button type="button" class="btn tb-tile" id="openbtn" aria-label="Open the paper"><span class="tb-pic" aria-hidden="true"><svg viewBox="0 0 50 50"><path d="M25 3L29 16L42 12L33 22L46 25L33 28L42 38L29 34L25 47L21 34L8 38L17 28L4 25L17 22L8 12L21 16Z" fill="#FFFFFF" stroke="#1D2340" stroke-width="2.2" stroke-linejoin="round"/><circle cx="25" cy="25" r="4" fill="#BFE3FF" stroke="#1D2340" stroke-width="2"/></svg></span><span class="tb-tile-word">Open the paper</span></button></div>
      <div id="bottom"></div>
    </section>
  </div>
</div>
<script src="snowflakes.js"></script>
</body>
</html>
