<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaleidoscope</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kaleidoscope">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css, tb-v2): header, stage, panel ----------
   The stage is the picture: draw with fingers and every line is copied round the middle (mirrored, with a soft
   glow); a tap paints a little starburst; a tap on the middle knob starts or stops the slow spin. The panel: How
   many (3, 4, 6, 8) and the colors (Rainbow + 3) as two rows of tiles, then the bottom bar (New, Surprise). */
.tb-head a { text-decoration: none; }
.stage {
  background: #FFFDF7;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#view {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}
.ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* How many: a tiny kaleidoscope with that many slices and the number in the middle. */
.tb-tilerow .tb-pic svg { width: 100%; height: 100%; display: block; overflow: visible; }
/* A color tile: the fill is the paint; its word sits on a small white label so it reads on every color. */
#paints .is-swatch .tb-tile-word { background: #FFFFFF; color: #1D2340; border-radius: 999px; padding: 0 5px; max-width: 100%; }
#paints .is-swatch .tb-pic[hidden] { display: none; }
/* Phone held sideways: a wider column, so four tiles fit a row at full size (the picture is limited by the height). */
@media (orientation: landscape) and (max-height: 520px) {
  .tb-v2 .tb-body .tb-panel { width: calc(4 * var(--tb-tile) + 3 * var(--tb-s2) + 24px); }
}
/* iPad held sideways: two tiles a row in the side column. */
@media (orientation: landscape) and (min-height: 521px) {
  #counts.tb-tilerow, #paints.tb-tilerow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------- Big mode: the header buttons and the panel go away; drawing goes on ---------- */
body.big .tb-head > :not(.bigtoggle), body.big .tb-panel { display: none; }

/* ---------- Timer bits on the picture (the shared toast and banner are moved into the stage) ---------- */
.stage .toast { position: absolute; top: 14px; z-index: 4; }
.stage .farewell { position: absolute; bottom: 16px; z-index: 4; }
body.ending .tb-panel, body.ending .homebtn { pointer-events: none; opacity: 0.4; }
body.ending #view { cursor: default; }
.rest-art { aspect-ratio: 1; }
</style>
</head>
<body>
<div class="tb-app-shell tb-v2">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Kaleidoscope</h1>
    <button class="btn tb-iconbtn bigtoggle" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="view" role="img" aria-label="Drawing space. Draw with your fingers and every line is copied around the middle. Tap the middle to spin it."></canvas>
      <svg class="ring" id="ring" aria-hidden="true"></svg>
      <div id="coach"></div>
    </main>

    <section class="tb-panel" id="panel">
      <div id="counts" role="group" aria-label="How many copies"></div>
      <div id="paints" role="group" aria-label="Colors"></div>
      <div id="bottom"></div>
    </section>
  </div>
</div>
<script>
(function () {
  "use strict";

  var KEY = "kaleido-v1";          // settings
  var AKEY = "kaleido-art-v1";     // saved drawing (downscaled PNG data URL)
  // Timer, sound and Big are shared Toybox-wide (common/toybox.js); these old keys carry over once.
  var OLD_TKEY = "kaleido-timer-v1", OLD_SKEY = "kaleido-sound-v1", OLD_BKEY = "kaleido-big-v1";
  var OUT = "#1D2340";
  var COUNTS = [2, 3, 4, 6, 8, 12];  // every count an old save may hold
  var TILE_COUNTS = [3, 4, 6, 8];      // the ones he picks from (an old 2 or 12 becomes the nearest)
  var PAINTS = ["Rainbow", "Red", "Blue", "Green"];
  var PALETTE = [
    ["Red", "#E63946"], ["Orange", "#F77F00"], ["Yellow", "#FFC93C"], ["Lime", "#A7D129"],
    ["Green", "#2E9E5B"], ["Sky", "#5BC0EB"], ["Blue", "#2D5BD7"], ["Purple", "#7B4FC9"],
    ["Pink", "#F26CA7"], ["White", "#FFFFFF"], ["Black", "#26282E"]
  ];
  var HEX = {};
  PALETTE.forEach(function (p) { HEX[p[0]] = p[1]; });
  var SIZES = { small: 6, medium: 14, big: 30 };   // CSS px on a mid-size tablet picture
  var BG = { light: "#FFFDF7", dark: "#0D1230" };
  var SPIN_SPEED = 0.24;           // radians per second (calm: about a turn every 26 s)
  var MAX_ART = 2400;              // max offscreen canvas side in device pixels
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function isDark(h) {
    var c = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) < 120;
  }

  // ---------- Settings ----------
  // Opening Kaleidoscope from the Toybox home screen (Toybox.fresh) starts a new picture with the
  // first-visit tools; a reload keeps both.
  if (window.Toybox && Toybox.fresh()) {
    try { localStorage.removeItem(KEY); localStorage.removeItem(AKEY); } catch (e) { /* ignore */ }
  }
  function freshState() {
    return { count: 6, mirror: true, paint: "Rainbow", glow: true, size: "medium", dark: false, spin: false, guides: false };
  }
  function loadState() {
    var s = freshState();
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (o && typeof o === "object") {
        if (COUNTS.indexOf(o.count) !== -1) s.count = o.count;
        if (o.paint === "Rainbow" || HEX[o.paint]) s.paint = o.paint;
        if (Object.prototype.hasOwnProperty.call(SIZES, o.size)) s.size = o.size;
        if (typeof o.spin === "boolean") s.spin = o.spin;
      }
    } catch (e) { /* storage unavailable or bad data: use defaults */ }
    // Only these choices are left (the saved format keeps every field): How many 3/4/6/8, Rainbow + 3 colors,
    // the medium brush, Mirror and Glow always on, the light paper, no guide lines.
    if (s.count === 2) s.count = 3;
    if (s.count === 12) s.count = 8;
    if (PAINTS.indexOf(s.paint) === -1) s.paint = "Rainbow";
    s.size = "medium"; s.mirror = true; s.glow = true; s.dark = false; s.guides = false;
    return s;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }
  var state = loadState();

  // ---------- Panel: How many and the colors (tiles), New and Surprise ----------
  // A tiny kaleidoscope with n slices and the number in the middle (the count he chooses stays a number).
  function countPic(n) {
    var sv = '<svg viewBox="-30 -30 60 60" aria-hidden="true">', i, a0, a1, cols = ["#FF6B8A", "#FFC93C", "#4CD964", "#3DB4FF", "#8E6CFF", "#FF9A4D"];
    for (i = 0; i < n; i++) {
      a0 = -Math.PI / 2 + i * 2 * Math.PI / n; a1 = a0 + 2 * Math.PI / n;
      sv += '<path d="M0 0L' + (27 * Math.cos(a0)).toFixed(2) + " " + (27 * Math.sin(a0)).toFixed(2) + "A27 27 0 0 1 " +
        (27 * Math.cos(a1)).toFixed(2) + " " + (27 * Math.sin(a1)).toFixed(2) + 'Z" fill="' + cols[i % cols.length] + '" stroke="#1D2340" stroke-width="2" stroke-linejoin="round"/>';
    }
    return sv + '<circle r="12" fill="#FFFFFF" stroke="#1D2340" stroke-width="2"/><text x="0" y="1" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="800" font-family="Baloo 2, Trebuchet MS, sans-serif" fill="#1D2340">' + n + "</text></svg>";
  }
  var RAINBOW_CSS = "conic-gradient(#E63946, #F77F00, #FFC93C, #A7D129, #2E9E5B, #5BC0EB, #2D5BD7, #7B4FC9, #F26CA7, #E63946)";
  var countTiles = null, paintTiles = null;

  function renderControls() {
    if (countTiles) countTiles.set(String(state.count));
    if (paintTiles) paintTiles.set(state.paint);
    $("stage").style.background = BG.light;
    dirty = true;
    save();
  }

  // ---------- Canvases ----------
  // The drawing lives on an offscreen square canvas in "world" units: the picture's middle is 0,0 and
  // 1 unit is half the shorter side of the picture. It covers -A..A so the corners are paintable and
  // the picture can spin without showing empty corners.
  var stage = $("stage"), view = $("view"), vctx = view.getContext("2d");
  var W = 0, H = 0, DPR = 1, R = 1, A = 0;
  var art = null, actx = null, artSide = 0;
  var viewRect = { left: 0, top: 0 };
  var angle = 0, spinVel = 0, pictureAlpha = 1;
  var dirty = true;
  var hasInk = false;

  function makeCanvas(s) {
    var c = document.createElement("canvas");
    c.width = s; c.height = s;
    return c;
  }

  function resize() {
    var w = view.clientWidth, h = view.clientHeight;
    if (w < 10 || h < 10) return;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = w; H = h;
    view.width = Math.round(w * DPR);
    view.height = Math.round(h * DPR);
    R = Math.min(w, h) / 2;
    var need = Math.sqrt(w * w + h * h) / (2 * R) + 0.03;
    var newA = Math.max(A, need);
    var side = Math.min(MAX_ART, Math.round(2 * newA * R * DPR));
    // Re-make the drawing canvas only when it grows in world size or changes resolution a lot.
    if (!art || newA > A || Math.abs(side - artSide) / artSide > 0.2) {
      var c = makeCanvas(side), cx = c.getContext("2d");
      if (art) {
        var d = side * A / newA;
        cx.drawImage(art, (side - d) / 2, (side - d) / 2, d, d);
        art.width = 0; art.height = 0;
      }
      art = c; actx = cx; artSide = side; A = newA;
    }
    var r = view.getBoundingClientRect();
    viewRect = { left: r.left, top: r.top };
    layoutRing();
    dirty = true;
  }

  // Screen point (CSS px inside the picture) to drawing-canvas pixels, undoing the spin.
  function toArt(sx, sy) {
    var x = (sx - W / 2) / R, y = (sy - H / 2) / R;
    var c = Math.cos(-angle), s = Math.sin(-angle);
    var k = artSide / (2 * A);
    return { x: (x * c - y * s + A) * k, y: (x * s + y * c + A) * k };
  }

  // ---------- Painting ----------
  var pointers = {};
  var nextHue = Math.random() * 360;

  function sizeScale() { return clamp(R / 330, 0.72, 1.4); }
  function baseWidth() { return SIZES[state.size] * sizeScale() * (artSide / (2 * A)) / R; }

  function colorFor(p, alpha, light) {
    if (state.paint === "Rainbow") {
      return "hsla(" + Math.round(p.hue) + ", 92%, " + (light || 55) + "%, " + alpha + ")";
    }
    var h = HEX[state.paint];
    if (alpha >= 1 && !light) return h;
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    if (light && light > 70) { r = Math.round(r + (255 - r) * 0.6); g = Math.round(g + (255 - g) * 0.6); b = Math.round(b + (255 - b) * 0.6); }
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }

  // Strokes the path once for every copy: n turns around the middle, and a flipped copy of each when Mirror is on.
  function strokeAll(path, width, p) {
    var n = state.count, c = artSide / 2, k, m, t, cs, sn, a, b, cc, d;
    var flips = state.mirror ? [1, -1] : [1];
    // Glow: soft additive halos (they brighten where they cross), then a bright solid core on top.
    var passes = state.glow
      ? [[3.4, colorFor(p, 0.07, 62), "source-over"], [2.0, colorFor(p, 0.12, 60), "source-over"], [1, colorFor(p, 1), "source-over"]]
      : [[1, colorFor(p, 1), "source-over"]];
    actx.lineCap = "round";
    actx.lineJoin = "round";
    passes.forEach(function (ps) {
      actx.globalCompositeOperation = ps[2];
      actx.lineWidth = width * ps[0];
      actx.strokeStyle = ps[1];
      for (k = 0; k < n; k++) {
        t = 2 * Math.PI * k / n;
        cs = Math.cos(t); sn = Math.sin(t);
        for (m = 0; m < flips.length; m++) {
          a = cs * flips[m]; b = sn * flips[m]; cc = -sn; d = cs;
          actx.setTransform(a, b, cc, d, c - (a * c + cc * c), c - (b * c + d * c));
          actx.stroke(path);
        }
      }
    });
    actx.setTransform(1, 0, 0, 1, 0, 0);
    actx.globalCompositeOperation = "source-over";
    hasInk = true;
  }

  function pressureOf(e) {
    var pr = e.pressure;
    if (e.pointerType === "pen" && pr > 0) return 0.45 + pr * 1.1;
    if (e.pointerType === "touch" && pr > 0 && pr !== 0.5 && pr !== 1) return 0.6 + pr * 0.8;
    return 1;
  }

  function localXY(e) { return { x: e.clientX - viewRect.left, y: e.clientY - viewRect.top }; }

  function playing() { return !Toybox.timer.locked(); }

  // ---------- Coach and ghost hand ----------
  var coach = Toybox.coach($("coach"));
  var spinHinted = false, spinHintT = 0;
  // Idle help: on an empty picture the hand taps it first (a tap paints a starburst), then draws a wavy line on
  // its next showing; once he has drawn, it taps the knob in the middle (a tap there starts the spin).
  var ghost = Toybox.ghost({
    max: 2,
    plan: function () {
      if (moment || wipe) return null;
      var r = view.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, RR = Math.min(r.width, r.height) * 0.32, pts = [];
      if (!hasInk) {
        if (ghost.shown("draw") < 1) return { pts: [[cx + RR * 0.5, cy - RR * 0.45]], tap: true, key: "draw" };
        for (var i = 0; i <= 16; i++) { var t = i / 16; pts.push([cx - RR + 2 * RR * t, cy - RR * 0.55 + Math.sin(t * Math.PI * 2) * RR * 0.25]); }
        return { pts: pts, key: "line" };
      }
      if (state.spin) return null;
      return { pts: [[cx, cy]], tap: true, key: "spin" };
    }
  });
  function drewSomething() {
    ghost.learned("draw"); ghost.learned("line");
    if (spinHinted || state.spin) return;
    spinHinted = true;
    coach.clear();
    // once, a little later: the knob in the middle spins the picture
    spinHintT = setTimeout(function () { if (!state.spin && playing()) coach.say("Tap the middle to spin it!", 6); }, 7000);
  }

  // ---------- The knob in the middle: a tap starts or stops the slow spin ----------
  function hubR() { return clamp(R * 0.1, 22, 38); }
  function onHub(q) { return Math.hypot(q.x - W / 2, q.y - H / 2) < Math.max(hubR() + 14, 46); }
  function toggleSpin() {
    state.spin = !state.spin;
    clearTimeout(spinHintT);
    ghost.learned("spin");
    coach.say(state.spin ? "Round and round!" : "It stopped.", 3);
    whooshSound();
    renderControls();
  }

  // ---------- A tap paints a starburst: short rays all round the dot, copied like every line ----------
  function starburst(p, x, y) {
    var k = artSide / (2 * A), r0 = 0.035 * k * sizeScale(), r1 = 0.085 * k * sizeScale(), path = new Path2D(), i, a;
    for (i = 0; i < 8; i++) {
      a = i * Math.PI / 4 + (p.hue % 45) * Math.PI / 180;
      path.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0);
      path.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
    }
    strokeAll(path, baseWidth() * 0.6, p);
  }
  function firstDot(p) {
    var path = new Path2D();
    path.moveTo(p.lx, p.ly);
    path.lineTo(p.lx + 0.01, p.ly);
    strokeAll(path, baseWidth() * p.pr, p);
  }

  view.addEventListener("pointerdown", function (e) {
    if (!playing()) return;
    if (Toybox.isPalm && Toybox.isPalm(e)) return;
    e.preventDefault();
    if (moment) finishMoment();
    try { view.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    var r = view.getBoundingClientRect();
    viewRect = { left: r.left, top: r.top };
    var q = localXY(e), pt = toArt(q.x, q.y);
    var p = {
      sx: q.x, sy: q.y, pr: pressureOf(e), q: [],
      lx: pt.x, ly: pt.y, mx: pt.x, my: pt.y,
      hue: nextHue, note: -1,
      x0: q.x, y0: q.y, t0: performance.now(), moved: 0,
      // On the knob: wait and see (a tap spins, a drag draws from here)
      pend: onHub(q)
    };
    nextHue = (nextHue + 47) % 360;
    pointers[e.pointerId] = p;
    if (p.pend) return;
    // A dot right away, so every touch paints.
    firstDot(p);
    addRipple(q.x, q.y, p);
    toneFor(p, q.x, q.y);
    dirty = true;
  });

  view.addEventListener("pointermove", function (e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    e.preventDefault();
    var last = localXY(e);
    p.moved = Math.max(p.moved, Math.hypot(last.x - p.x0, last.y - p.y0));
    if (p.pend) {
      if (p.moved < 12) return;
      // It is a drag after all: it draws from where it started.
      p.pend = false;
      firstDot(p);
      addRipple(p.x0, p.y0, p);
    }
    var list = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!list.length) list = [e];
    list.forEach(function (ce) {
      var q = localXY(ce);
      p.q.push(q.x, q.y, pressureOf(ce));
    });
    p.sx = last.x; p.sy = last.y;
    toneFor(p, last.x, last.y);
  });

  function endPointer(e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    delete pointers[e.pointerId];
    var tap = e.type === "pointerup" && p.moved < 12 && performance.now() - p.t0 < 600;
    if (p.pend) { if (tap && playing()) toggleSpin(); return; }
    flushPointer(p, true);
    if (tap && playing()) starburst(p, p.lx, p.ly);
    drewSomething();
    scheduleSave();
    dirty = true;
  }
  view.addEventListener("pointerup", endPointer);
  view.addEventListener("pointercancel", endPointer);
  view.addEventListener("lostpointercapture", endPointer);
  view.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });

  // Turns this pointer's new samples into one smooth curve (midpoint quadratic smoothing) and paints it.
  // While the picture spins, a finger held still keeps painting circles.
  function flushPointer(p, finish) {
    if (p.pend) return;
    var samples = p.q;
    p.q = [];
    if (!samples.length) {
      if (Math.abs(spinVel) > 0.02 && !finish) samples = [p.sx, p.sy, p.pr];
      else if (!finish) return;
    }
    var path = new Path2D(), any = false, len = 0, prSum = 0, prN = 0, i, pt, dx, dy, dist, mx, my;
    path.moveTo(p.mx, p.my);
    var minStep = 0.6 * DPR;
    for (i = 0; i < samples.length; i += 3) {
      pt = toArt(samples[i], samples[i + 1]);
      dx = pt.x - p.lx; dy = pt.y - p.ly;
      dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < minStep) continue;
      mx = (p.lx + pt.x) / 2; my = (p.ly + pt.y) / 2;
      path.quadraticCurveTo(p.lx, p.ly, mx, my);
      p.lx = pt.x; p.ly = pt.y; p.mx = mx; p.my = my;
      len += dist; any = true;
      prSum += samples[i + 2]; prN++;

        vctx.scale(sc, sc);
        vctx.rotate(reduce ? 0 : (k2 - tau) * 0.35);
        if (k2 > kmin && sc < 2.6 * A) {
          // Each copy sits in its own round window, framed by a thin rainbow ring.
          vctx.beginPath(); vctx.arc(0, 0, 1, 0, 2 * Math.PI);
          vctx.fillStyle = bg; vctx.globalAlpha = base; vctx.fill();
          vctx.save(); vctx.clip();
          vctx.globalAlpha = base * fadeEx;
          vctx.drawImage(src, -A, -A, 2 * A, 2 * A);
          vctx.restore();
          vctx.globalAlpha = base * 0.85;
          vctx.lineWidth = 5 / R / sc;
          for (var q = 0; q < 6; q++) {
            vctx.strokeStyle = "hsl(" + Math.round(q * 60 + now / 30) % 360 + ",90%,60%)";
            vctx.beginPath(); vctx.arc(0, 0, 1, q * Math.PI / 3, (q + 1) * Math.PI / 3); vctx.stroke();
          }
        } else {
          vctx.globalAlpha = base * fadeEx;
          vctx.drawImage(src, -A, -A, 2 * A, 2 * A);
        }
        vctx.restore();
      }
      vctx.globalAlpha = base;
      return;
    }
    // Bloom: every slice of the pattern moves out from the middle and tilts open like a petal, then folds back.
    var n = state.mirror ? state.count * 2 : state.count, open = Math.sin(Math.PI * Math.min(1, u)), i;
    open = open * open * (3 - 2 * open);
    var d = (reduce ? 0.08 : 0.22) * open, tilt = (reduce ? 0.05 : 0.22) * open, grow = 1 + 0.12 * open;
    if (n < 2) n = 2;
    // A glowing heart of the flower shows in the gap.
    if (d > 0.01) {
      var gl = vctx.createRadialGradient(0, 0, 0, 0, 0, d * 2.2 + 0.05);
      gl.addColorStop(0, "rgba(255,236,140," + (0.9 * open).toFixed(3) + ")"); gl.addColorStop(1, "rgba(255,236,140,0)");
      vctx.fillStyle = gl; vctx.beginPath(); vctx.arc(0, 0, d * 2.2 + 0.05, 0, 2 * Math.PI); vctx.fill();
    }
    vctx.globalAlpha = base * fadeEx;
    for (i = 0; i < n; i++) {
      var a0 = -Math.PI / 2 + i * 2 * Math.PI / n, a1 = a0 + 2 * Math.PI / n, mid = (a0 + a1) / 2;
      vctx.save();
      vctx.translate(Math.cos(mid) * d, Math.sin(mid) * d);
      vctx.rotate(tilt * (i % 2 ? -0.4 : 0.4));
      vctx.scale(grow, grow);
      vctx.beginPath(); vctx.moveTo(0, 0); vctx.arc(0, 0, A * 1.5, a0 - 0.002, a1 + 0.002); vctx.closePath();
      vctx.clip();
      vctx.drawImage(src, -A, -A, 2 * A, 2 * A);
      vctx.restore();
    }
    vctx.globalAlpha = base;
  }

  // ---------- Start ----------
  if (reduce && state.spin) state.spin = false;
  resize();
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(view);
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });
  loadArt();
  renderControls();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { dirty = true; });
  // The old sound key said "on"/"off"; the shared module reads "1" for on.
  try { if (localStorage.getItem(OLD_SKEY) === "on") localStorage.setItem(OLD_SKEY, "1"); } catch (e) { /* ignore */ }
  // The shared grown-up layer: play timer, sound, Big. It may start the ending right away
  // (a timer that ran out while away), so the picture is set up first.
  Toybox.init({
    app: "kaleidoscope",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the spinning slows, the picture fades, and the controls lock.",
    goodbyeOption: "End with a Goodbye spin button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Goodbye spin",
    farewellDone: "Bye bye!",
    restLine: "The kaleidoscope is resting.",
    restLine2: "It will be right here next time.",
    restArt: drawRestArt,
    soundNote: "Soft tones that go higher as a finger moves away from the middle. Hold for 2 seconds.",
    legacy: { timer: OLD_TKEY, sound: OLD_SKEY, big: OLD_BKEY },
    onEnding: onEnding,
    onGoodbye: goodbyeSpin,
    onRest: function () { endingDone = null; spinVel = 0; },
    onWake: function () { endingDone = null; dirty = true; },
    onBig: function () { if (W) resize(); },
    onSound: function (on) { if (on) whooshSound(); },
    onTimer: function (info) { timerInfo = info; drawTimer(); }
  });
  $("stage").appendChild($("tb-toast"));
  $("stage").appendChild($("tb-farewell"));
  if (!hasInk) coach.step("Draw with your fingers!");
  requestAnimationFrame(frame);
})();
</script>
</body>
