<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaleidoscope</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kaleidoscope">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --bh: 46px;
  --chip: 46px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13233F;
    --panel: #1C3157;
    --ink: #EEF3FF;
    --muted: #B4C1DE;
    --edge: #9FB8E8;
    --plate: #E6F2FF;
    --focus: #FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13233F;
  --panel: #1C3157;
  --ink: #EEF3FF;
  --muted: #B4C1DE;
  --edge: #9FB8E8;
  --plate: #E6F2FF;
  --focus: #FFC93C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
.stage {
  background: #FFFDF7;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#view {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}
.ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* ---------- Panel: the picked tab's choices (every group on tablets), then the tab bar with Clear ---------- */
.grp h2 {
  margin: 0 0 4px;
  font-size: 0.95rem;
  font-weight: 800;
  line-height: 1.2;
  text-align: center;
  color: var(--muted);
}
/* Phones: one group of controls at a time, picked with the tabs. */
.tb-tabs .tab[aria-selected="true"] { background: var(--accent); color: #1D2340; }
/* Five buttons share the phone tab bar: Surprise gets a little more room for its longer word. */
.tb-tabs .btn.tb-surprise { flex: 1.3 1 0; }
.panes.tb-choices { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; gap: 0; }
.pane { grid-area: 1 / 1; visibility: hidden; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
#panel[data-tab="draw"] [data-pane="draw"],
#panel[data-tab="colors"] [data-pane="colors"],
#panel[data-tab="effects"] [data-pane="effects"] { visibility: visible; }

/* How many: big numbers with that many dots around them. */
.counts { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.count {
  min-height: var(--bh);
  height: var(--bh);
  padding: 2px;
  border-radius: 14px;
  display: grid;
  place-items: center;
}
.count svg { height: calc(var(--bh) - 12px); width: auto; max-width: 100%; display: block; overflow: visible; }
.count .n { font-family: var(--font); font-weight: 800; fill: currentColor; }
.count .d { fill: currentColor; opacity: 0.55; }
.count[aria-pressed="true"] .d { fill: #E63946; opacity: 1; }

/* Color: rainbow plus color chips. */
.paints { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; justify-items: center; align-items: center; }
.swatch {
  width: var(--chip);
  max-width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 3px solid var(--edge);
  box-shadow: 2px 2px 0 var(--edge);
  cursor: pointer;
  padding: 0;
  font: inherit;
  font-size: 1.3rem;
  font-weight: 800;
  display: grid;
  place-items: center;
  transition: transform 0.08s ease;
}
.swatch:active { transform: scale(0.92); }
.swatch[aria-pressed="true"] { outline: 5px solid var(--accent); outline-offset: 2px; transform: scale(1.06); }
.swatch:focus-visible { outline: 5px solid var(--focus); outline-offset: 2px; }
.swatch.rainbow {
  background: conic-gradient(#E63946, #F77F00, #FFC93C, #A7D129, #2E9E5B, #5BC0EB, #2D5BD7, #7B4FC9, #F26CA7, #E63946);
  color: #1D2340;
}
.swatch .tick {
  width: 58%;
  height: 58%;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 1.1rem;
  line-height: 1;
}

/* Brush: three sizes, a dot of each size above its name. */
.sizes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.size {
  min-width: 0;
  min-height: var(--bh);
  height: var(--bh);
  padding: 0 2px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 1rem;
  line-height: 1;
  white-space: nowrap;
}
.size .szw { flex: none; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.size .sz { flex: none; border-radius: 50%; background: currentColor; display: block; }

/* Effects: on/off switches. ON is a green switch with the word "On" (not the yellow "picked" fill). */
.fxs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.fxs .fx { grid-column: span 2; }
.fxs .fx:nth-child(4) { grid-column: 2 / span 2; }
.btn.fx {
  min-width: 0;
  min-height: 56px;
  padding: 4px 2px;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 0.95rem;
  line-height: 1;
  white-space: nowrap;
}
.btn.fx[aria-pressed="true"] { background: #DDF5E5; color: #1D2340; }
.fx .top { display: flex; align-items: center; gap: 4px; min-width: 0; }
.fx svg { width: 20px; height: 20px; flex: none; display: block; }
.fx .state { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; font-weight: 800; }
.fx .sw {
  position: relative;
  width: 34px;
  height: 20px;
  flex: none;
  border-radius: 999px;
  background: #C3CBDD;
  border: 2.5px solid #1D2340;
}
.fx .sw::after {
  content: "";
  position: absolute;
  top: 1px;
  left: 1px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #FFFFFF;
  border: 2px solid #1D2340;
  box-sizing: border-box;
  transition: left 0.15s ease;
}
.fx[aria-pressed="true"] .sw { background: #2E9E5B; }
.fx[aria-pressed="true"] .sw::after { left: 15px; }

/* ---------- Big mode: the panel goes away, the header stays (Big turns into Back) ---------- */
body.big .tb-panel { display: none; }

/* ---------- Timer bits on the picture (the shared toast and banner are moved into the stage) ---------- */
.stage .toast { position: absolute; top: 14px; z-index: 2; font-size: 1.3rem; }
.stage .farewell { position: absolute; bottom: 16px; z-index: 2; }
.stage .farewell p { font-size: 1.25rem; }
body.ending .tb-panel { pointer-events: none; opacity: 0.4; }
body.ending #view { cursor: default; }
.rest-art { aspect-ratio: 1; }

/* Short landscape phones. */
@media (orientation: landscape) and (max-height: 520px) {
  :root { --bh: 46px; --chip: 40px; }
  .size { gap: 3px; font-size: 0.85rem; }
  .size .szw { width: 16px; }
}

/* Tablets and desktop: bigger everything, every group shown with its heading (no tabs). */
@media (min-width: 744px) and (min-height: 640px) {
  :root { --bh: 66px; --chip: 58px; }
  .tb-panel { gap: 12px; }
  .tb-tabs .tab { display: none; }
  .panes.tb-choices { display: flex; flex-direction: column; gap: 12px; }
  .pane { visibility: visible; gap: 12px; }
  .grp h2 { font-size: 1.1rem; margin-bottom: 6px; }
  .counts, .paints, .sizes { gap: 10px; }
  .count { border-radius: 16px; }
  .size { font-size: 1.1rem; border-radius: 16px; }
  .size .szw { width: 30px; height: 30px; }
  .fxs { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .fxs .fx, .fxs .fx:nth-child(4) { grid-column: auto; }
  .btn.fx { min-height: 72px; font-size: 1.1rem; gap: 6px; border-radius: 16px; }
  .fx svg { width: 26px; height: 26px; }
  .fx .state { font-size: 0.9rem; }
  .fx .sw { width: 42px; height: 24px; }
  .fx .sw::after { width: 16px; height: 16px; }
  .fx[aria-pressed="true"] .sw::after { left: 19px; }
  .swatch .tick { font-size: 1.4rem; }
}
/* Tablet portrait: How many and Brush share a row, then a row of colors, a row of effects, then Clear. */
@media (min-width: 744px) and (min-height: 640px) and (orientation: portrait) {
  .pane[data-pane="draw"] { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.25fr); gap: 14px; }
  .paints { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .size { flex-direction: column; gap: 4px; font-size: 1rem; }
  :root { --bh: 68px; }
}
/* Tablet landscape: the groups stacked in a tall side panel. */
@media (min-width: 744px) and (min-height: 640px) and (orientation: landscape) {
  .tb-body .tb-panel { width: min(40%, 470px); }
  :root { --bh: 70px; --chip: 56px; }
  /* Effects: three on top, two below, so each label has room. */
  .fxs { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .fxs .fx { grid-column: span 2; }
  .fxs .fx:nth-child(4) { grid-column: 2 / span 2; }
}
@media (min-width: 1300px) and (min-height: 900px) {
  :root { --bh: 80px; --chip: 66px; }
}

/* Phones: icon-only Home and Big; no headings that repeat the tab name. */
@media (max-width: 600px) and (orientation: portrait), (orientation: landscape) and (max-height: 520px) {
  .grp-brush h2, .grp-colors h2, .grp-fx h2 { display: none; }
  .size { gap: 4px; font-size: 0.9rem; }
}

@media (prefers-reduced-motion: reduce) {
  .swatch, .fx .sw::after { transition: none; }
}
/* Ghost hand: a see-through hand that shows the main move once (same look as Bulldozer and Measuring). */
.ghosthand { position: fixed; left: 0; top: 0; z-index: 45; display: none; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.ghosthand svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ghosthand > svg { position: relative; }
.ghosthand .gh-carry svg { width: 100%; height: 100%; transform: rotate(14deg); }
.ghosthand .gh-press { opacity: 0; transition: opacity 0.12s ease; }
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">Kaleidoscope</h1>
    <button class="btn tb-iconbtn" id="bigToggle" aria-pressed="false" aria-label="Full screen: hide the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Big</span></button>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <canvas id="view" role="img" aria-label="Drawing space. Draw with your fingers and every line is copied around the middle."></canvas>
      <svg class="ring" id="ring" aria-hidden="true"></svg>
    </main>

    <section class="tb-panel" id="panel" data-tab="draw">
      <div class="panes tb-choices">
        <div class="pane" data-pane="draw" id="pane-draw" role="tabpanel" aria-labelledby="tab-draw">
          <section class="grp">
            <h2>How many</h2>
            <div class="counts" id="counts"></div>
          </section>
          <section class="grp grp-brush">
            <h2>Brush</h2>
            <div class="sizes">
              <button class="btn size" data-size="small" aria-label="Small brush"><span class="szw"><span class="sz" style="width:8px;height:8px"></span></span><span class="lbl">Small</span></button>
              <button class="btn size" data-size="medium" aria-label="Medium brush"><span class="szw"><span class="sz" style="width:14px;height:14px"></span></span><span class="lbl">Medium</span></button>
              <button class="btn size" data-size="big" aria-label="Big brush"><span class="szw"><span class="sz" style="width:22px;height:22px"></span></span><span class="lbl">Big</span></button>
            </div>
          </section>
        </div>
        <div class="pane" data-pane="colors" id="pane-colors" role="tabpanel" aria-labelledby="tab-colors">
          <section class="grp grp-colors">
            <h2>Color</h2>
            <div class="paints" id="paints"></div>
          </section>
        </div>
        <div class="pane" data-pane="effects" id="pane-effects" role="tabpanel" aria-labelledby="tab-effects">
          <section class="grp grp-fx">
            <h2>Effects</h2>
            <div class="fxs">
            <button class="btn fx" data-toggle="mirror"><span class="top"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2v24" stroke="currentColor" stroke-width="2.4" stroke-dasharray="3 3"/><path d="M11 6 3 14l8 8z" fill="#5BC0EB" stroke="#1D2340" stroke-width="2" stroke-linejoin="round"/><path d="M17 6l8 8-8 8z" fill="#5BC0EB" stroke="#1D2340" stroke-width="2" stroke-linejoin="round"/></svg><span class="lbl">Mirror</span></span><span class="state"><span class="sw" aria-hidden="true"></span><span class="st">Off</span></span></button>
            <button class="btn fx" data-toggle="glow"><span class="top"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="#FFC93C" opacity="0.35"/><path d="M14 3l2.6 8.4L25 14l-8.4 2.6L14 25l-2.6-8.4L3 14l8.4-2.6z" fill="#FFF3B0" stroke="#1D2340" stroke-width="2" stroke-linejoin="round"/></svg><span class="lbl">Glow</span></span><span class="state"><span class="sw" aria-hidden="true"></span><span class="st">Off</span></span></button>
            <button class="btn fx" data-toggle="spin"><span class="top"><svg viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 14a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg><span class="lbl">Spin</span></span><span class="state"><span class="sw" aria-hidden="true"></span><span class="st">Off</span></span></button>
            <button class="btn fx" data-toggle="guides"><span class="top"><svg viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2.5 3"><path d="M14 2v24M3.6 8l20.8 12M3.6 20 24.4 8"/></svg><span class="lbl">Lines</span></span><span class="state"><span class="sw" aria-hidden="true"></span><span class="st">Off</span></span></button>
            <button class="btn fx" data-toggle="dark"><span class="top"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M19 4.5A10 10 0 1 0 23.5 19 8 8 0 0 1 19 4.5z" fill="#FFC93C" stroke="#1D2340" stroke-width="2" stroke-linejoin="round"/></svg><span class="lbl">Dark</span></span><span class="state"><span class="sw" aria-hidden="true"></span><span class="st">Off</span></span></button>
            </div>
          </section>
        </div>
      </div>
      <nav class="tb-tabs" role="tablist" aria-label="Controls">
        <button class="btn tab" role="tab" id="tab-draw" data-tab="draw" aria-controls="pane-draw">Draw</button>
        <button class="btn tab" role="tab" id="tab-colors" data-tab="colors" aria-controls="pane-colors">Colors</button>
        <button class="btn tab" role="tab" id="tab-effects" data-tab="effects" aria-controls="pane-effects">Effects</button>
        <button class="btn tb-new" id="clearBtn">Clear</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  var KEY = "kaleido-v1";          // settings
  var AKEY = "kaleido-art-v1";     // saved drawing (downscaled PNG data URL)
  // Timer, sound and Big are shared Toybox-wide (common/toybox.js); these old keys carry over once.
  var OLD_TKEY = "kaleido-timer-v1", OLD_SKEY = "kaleido-sound-v1", OLD_BKEY = "kaleido-big-v1";
  var OUT = "#1D2340";
  var COUNTS = [2, 3, 4, 6, 8, 12];
  var PALETTE = [
    ["Red", "#E63946"], ["Orange", "#F77F00"], ["Yellow", "#FFC93C"], ["Lime", "#A7D129"],
    ["Green", "#2E9E5B"], ["Sky", "#5BC0EB"], ["Blue", "#2D5BD7"], ["Purple", "#7B4FC9"],
    ["Pink", "#F26CA7"], ["White", "#FFFFFF"], ["Black", "#26282E"]
  ];
  var HEX = {};
  PALETTE.forEach(function (p) { HEX[p[0]] = p[1]; });
  var SIZES = { small: 6, medium: 14, big: 30 };   // CSS px on a mid-size tablet picture
  var BG = { light: "#FFFDF7", dark: "#0D1230" };
  var SPIN_SPEED = 0.24;           // radians per second (calm: about a turn every 26 s)
  var MAX_ART = 2400;              // max offscreen canvas side in device pixels
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var $ = function (id) { return document.getElementById(id); };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function isDark(h) {
    var c = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) < 120;
  }

  // ---------- Settings ----------
  // Opening Kaleidoscope from the Toybox home screen (Toybox.fresh) starts a new picture with the
  // first-visit tools; a reload keeps both.
  if (window.Toybox && Toybox.fresh()) {
    try { localStorage.removeItem(KEY); localStorage.removeItem(AKEY); } catch (e) { /* ignore */ }
  }
  function freshState() {
    return { count: 6, mirror: true, paint: "Rainbow", glow: false, size: "medium", dark: false, spin: false, guides: false };
  }
  function loadState() {
    var s = freshState();
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (o && typeof o === "object") {
        if (COUNTS.indexOf(o.count) !== -1) s.count = o.count;
        if (o.paint === "Rainbow" || HEX[o.paint]) s.paint = o.paint;
        if (Object.prototype.hasOwnProperty.call(SIZES, o.size)) s.size = o.size;
        ["mirror", "glow", "dark", "spin", "guides"].forEach(function (k) {
          if (typeof o[k] === "boolean") s[k] = o[k];
        });
      }
    } catch (e) { /* storage unavailable or bad data: use defaults */ }
    return s;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }
  var state = loadState();

  // ---------- Controls ----------
  COUNTS.forEach(function (n) {
    var b = document.createElement("button");
    b.className = "btn count";
    b.dataset.count = String(n);
    b.setAttribute("aria-label", n + " copies");
    var dots = "", i, a, rr = n > 8 ? 2.2 : 2.8;
    for (i = 0; i < n; i++) {
      a = -Math.PI / 2 + i * 2 * Math.PI / n;
      dots += '<circle class="d" cx="' + (25 * Math.cos(a)).toFixed(2) + '" cy="' + (25 * Math.sin(a)).toFixed(2) + '" r="' + rr + '"/>';
    }
    b.innerHTML = '<svg viewBox="-30 -30 60 60" aria-hidden="true">' + dots +
      '<text class="n" x="0" y="1" text-anchor="middle" dominant-baseline="central" font-size="' + (n > 9 ? 25 : 30) + '">' + n + "</text></svg>";
    $("counts").appendChild(b);
  });
  (function () {
    var b = document.createElement("button");
    b.className = "swatch rainbow";
    b.dataset.paint = "Rainbow";
    b.setAttribute("aria-label", "Rainbow");
    b.title = "Rainbow";
    $("paints").appendChild(b);
    PALETTE.forEach(function (p) {
      var c = document.createElement("button");
      c.className = "swatch";
      c.dataset.paint = p[0];
      c.style.background = p[1];
      c.style.color = isDark(p[1]) ? "#FFFFFF" : "#1D2340";
      c.setAttribute("aria-label", p[0]);
      c.title = p[0];
      $("paints").appendChild(c);
    });
  })();

  function renderControls() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-count]"), function (b) {
      b.setAttribute("aria-pressed", String(Number(b.dataset.count) === state.count));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-paint]"), function (b) {
      var on = b.dataset.paint === state.paint;
      b.setAttribute("aria-pressed", String(on));
      b.innerHTML = on ? '<span class="tick"' + (b.dataset.paint === "Rainbow" ? ' style="background:#FFFFFF"' : "") + ">✓</span>" : "";
    });

    }
  }
  function loadArt() {
    var o = null;
    try { o = JSON.parse(localStorage.getItem(AKEY) || "null"); } catch (e) { o = null; }
    if (!o || typeof o.img !== "string" || o.img.indexOf("data:image/png") !== 0 || !(o.a > 0)) return;
    var img = new Image();
    img.onload = function () {
      if (!art) return;
      if (o.a > A) {   // the saved picture covered more space: grow ours to match
        var side = Math.min(MAX_ART, Math.round(artSide * o.a / A));
        var c = makeCanvas(side), cx = c.getContext("2d"), d0 = side * A / o.a;
        cx.drawImage(art, (side - d0) / 2, (side - d0) / 2, d0, d0);
        art = c; actx = cx; artSide = side; A = o.a;
      }
      var d = artSide * o.a / A;
      actx.globalCompositeOperation = "destination-over";   // under anything already painted
      actx.drawImage(img, (artSide - d) / 2, (artSide - d) / 2, d, d);
      actx.globalCompositeOperation = "source-over";
      hasInk = true;
      dirty = true;
    };
    img.src = o.img;
  }
  document.addEventListener("visibilitychange", function () { if (document.hidden && saveId) saveArt(); });
  window.addEventListener("pagehide", function () { if (saveId) saveArt(); });

  // ---------- Sound (off by default; soft synthesized tones) ----------
  // The on/off setting and the AudioContext are shared Toybox-wide (common/toybox.js);
  // the module starts/resumes audio on every touch while sound is on.
  var ac = null, master = null, masterCtx = null, lastNoteAt = 0;
  var SCALE = [0, 2, 4, 7, 9];
  function canPlay() {
    ac = Toybox.sound.ready();
    if (!ac) return false;
    if (masterCtx !== ac) {
      try {
        var comp = ac.createDynamicsCompressor();
        master = ac.createGain();
        master.gain.value = 0.6;
        master.connect(comp);
        comp.connect(ac.destination);
        masterCtx = ac;
      } catch (e) { return false; }
    }
    return true;
  }

  function bell(freq, when, vol, len) {
    var t = ac.currentTime + (when || 0);
    var o1 = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain();
    o1.type = "sine"; o1.frequency.value = freq;
    o2.type = "sine"; o2.frequency.value = freq * 2.01;
    g2.gain.value = 0.18;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    o1.start(t); o2.start(t);
    o1.stop(t + len + 0.05); o2.stop(t + len + 0.05);
  }

  // Pitch follows the finger's distance from the middle: higher further out (pentatonic, so it always sounds nice).
  function toneFor(p, sx, sy) {
    if (!canPlay()) return;
    var r = Math.sqrt((sx - W / 2) * (sx - W / 2) + (sy - H / 2) * (sy - H / 2)) / R;
    var idx = clamp(Math.round(r * 9), 0, 11);
    if (idx === p.note) return;
    var now = performance.now();
    if (now - lastNoteAt < 70) return;
    lastNoteAt = now;
    p.note = idx;
    var st = SCALE[idx % 5] + 12 * Math.floor(idx / 5);
    bell(196 * Math.pow(2, st / 12), 0, 0.07, 0.9);
  }
  function whooshSound() {
    if (!canPlay()) return;
    [9, 7, 5, 3, 1].forEach(function (idx, i) {
      var st = SCALE[idx % 5] + 12 * Math.floor(idx / 5);
      bell(196 * Math.pow(2, st / 12), i * 0.07, 0.05, 0.6);
    });
  }

  // ---------- Buttons ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    // Big, the banner and the rest screen belong to the shared module (common/toybox.js).
    if (t.id === "bigToggle" || t.closest(".modal, .farewell, .rest")) return;
    if (!playing()) return;
    if (t.classList.contains("tab") && t.dataset.tab) { showTab(t.dataset.tab); return; }
    if (t.dataset.count) { state.count = Number(t.dataset.count); }
    else if (t.dataset.paint) { state.paint = t.dataset.paint; }
    else if (t.dataset.size) { state.size = t.dataset.size; }
    else if (t.dataset.toggle) {
      var k = t.dataset.toggle;
      state[k] = !state[k];
      if (k === "glow" && state.glow) state.dark = true;   // glow shines best in the dark
    }
    else if (t.id === "clearBtn") { clearPicture(); return; }
    else return;
    renderControls();
  });

  // ---------- Frame loop ----------
  var last = performance.now();
  function frame(t) {
    var dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
    last = t;
    var ending = Toybox.timer.phase() === "ending";
    var target = ending ? 0 : (state.spin ? SPIN_SPEED : 0);
    spinVel += (target - spinVel) * Math.min(1, dt * (ending ? 0.55 : 1.6));
    if (Math.abs(spinVel) < 0.0005 && target === 0) spinVel = 0;
    if (spinVel !== 0) { angle = (angle + spinVel * dt) % (2 * Math.PI); dirty = true; }
    if (ending) {
      var fade = clamp((performance.now() - endingStartedAt) / 7000, 0, 1);
      var a = 1 - 0.6 * fade;
      if (Math.abs(a - pictureAlpha) > 0.002) { pictureAlpha = a; dirty = true; }
    } else if (pictureAlpha !== 1) {
      pictureAlpha = 1; dirty = true;
    }
    Object.keys(pointers).forEach(function (id) { flushPointer(pointers[id], false); });
    if (dirty && art) {
      dirty = render(t);
    }
    // Ending: tell the shared timer once the spinning has stopped.
    if (ending && endingDone && Math.abs(spinVel) < 0.03 && performance.now() - endingStartedAt > 1500) { endingDone(); endingDone = null; }
    requestAnimationFrame(frame);
  }

  // ---------- Play timer (shared, common/toybox.js) ----------
  // Border around the picture: the colored part is the time left, shrinking back toward the top middle.
  var timerInfo = null, lastTimerKey = "";
  function layoutRing() { lastTimerKey = ""; drawTimer(); }
  function drawTimer() {
    var g = $("ring"), info = timerInfo;
    var active = info && (info.phase === "running" || info.phase === "ending");
    if (!active || !W) {
      if (lastTimerKey !== "off") { g.innerHTML = ""; lastTimerKey = "off"; }
      return;
    }
    var f = info.fraction, mins = info.minutes;
    var key = Math.round(f * 1000) + "|" + mins + "|" + info.showMinutes + "|" + info.phase + "|" + W + "x" + H + "|" + state.dark;
    if (key === lastTimerKey) return;
    lastTimerKey = key;
    var sw = W > 600 ? 12 : 9, inset = sw / 2 + 3, x = inset, y = inset, w = W - 2 * inset, h = H - 2 * inset;
    var r = Math.max(4, (W > 600 ? 26 : 21) - inset);
    var d = "M " + (x + w / 2) + " " + y + " L " + (x + w - r) + " " + y + " A " + r + " " + r + " 0 0 1 " + (x + w) + " " + (y + r) +
      " L " + (x + w) + " " + (y + h - r) + " A " + r + " " + r + " 0 0 1 " + (x + w - r) + " " + (y + h) +
      " L " + (x + r) + " " + (y + h) + " A " + r + " " + r + " 0 0 1 " + x + " " + (y + h - r) +
      " L " + x + " " + (y + r) + " A " + r + " " + r + " 0 0 1 " + (x + r) + " " + y + " Z";
    var col = f > 0.5 ? "#2E9E5B" : (f > 0.2 ? "#FFC93C" : "#F77F00");
    var track = state.dark ? "rgba(255,255,255,0.16)" : "rgba(29,35,64,0.14)";
    var sv = '<path d="' + d + '" fill="none" stroke="' + track + '" stroke-width="' + sw + '"/>';
    if (f > 0.002) {
      sv += '<path d="' + d + '" pathLength="1000" fill="none" stroke="' + col + '" stroke-width="' + sw +
        '" stroke-linecap="round" stroke-dasharray="' + (f * 1000).toFixed(1) + ' 1000"/>';
    }
    if (info.showMinutes && info.phase === "running") {
      var br = W > 600 ? 30 : 24, bx = W - br - sw - 10, by = br + sw + 10;
      sv += '<circle cx="' + bx + '" cy="' + by + '" r="' + br + '" fill="#FFFFFF" stroke="' + OUT + '" stroke-width="4"/>' +
        '<text x="' + bx + '" y="' + (by + 1) + '" text-anchor="middle" dominant-baseline="central" font-size="' + Math.round(br * (mins > 9 ? 0.95 : 1.15)) +
        '" font-weight="800" font-family="Baloo 2, Trebuchet MS, sans-serif" fill="' + OUT + '">' + mins + "</text>";
    }
    g.setAttribute("viewBox", "0 0 " + W + " " + H);
    g.innerHTML = sv;
  }

  // Ending: the spin winds down and the picture fades in frame(); endingDone is called once it has stopped.
  var endingDone = null, endingStartedAt = 0;
  function onEnding(done) {
    if (moment) finishMoment();
    // Fingers stop painting; whatever they drew is kept.
    Object.keys(pointers).forEach(function (id) { flushPointer(pointers[id], true); delete pointers[id]; });
    scheduleSave();
    endingStartedAt = performance.now();
    endingDone = done;
    dirty = true;
  }
  function goodbyeSpin() {
    spinVel += reduce ? 0.6 : 4.5;
    whooshSound();
  }

  // Small round picture for the rest screen: the child's own drawing, or a calm pattern if it is empty.
  function drawRestArt() {
    var c = document.createElement("canvas");
    c.width = c.height = 420;
    c.className = "rest-art";
    c.setAttribute("aria-hidden", "true");
    var x = c.getContext("2d"), S = c.width, h = S / 2, i, a, n = state.count;
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.clearRect(0, 0, S, S);
    x.save();
    x.beginPath();
    x.arc(h, h, h - 8, 0, 2 * Math.PI);
    x.fillStyle = state.dark ? BG.dark : BG.light;
    x.fill();
    x.clip();
    x.translate(h, h);
    if (hasInk && art) {
      var sc = (h - 8) * 1.05;
      x.globalAlpha = 0.95;
      x.drawImage(art, -A * sc, -A * sc, 2 * A * sc, 2 * A * sc);
      x.globalAlpha = 1;
    } else {
      for (i = 0; i < n * 2; i++) {
        a = i * Math.PI / n;
        x.save();
        x.rotate(a);
        x.beginPath();
        x.ellipse(0, -h * 0.45, h * Math.min(0.17, 1.2 / n), h * 0.36, 0, 0, 2 * Math.PI);
        x.fillStyle = "hsla(" + Math.round(i * 360 / (n * 2)) + ",85%,62%,0.85)";
        x.fill();
        x.lineWidth = 5;
        x.strokeStyle = OUT;
        x.stroke();
        x.restore();
      }
      x.beginPath();
      x.arc(0, 0, h * 0.14, 0, 2 * Math.PI);
      x.fillStyle = "#FFC93C";
      x.fill();
      x.lineWidth = 6;
      x.strokeStyle = OUT;
      x.stroke();
    }
    x.restore();
    x.beginPath();
    x.arc(h, h, h - 8, 0, 2 * Math.PI);
    x.lineWidth = 10;
    x.strokeStyle = OUT;
    x.stroke();
    return c;
  }

  // Phones: one group of controls at a time (on tablets every group shows and the tabs are hidden).
  // ---------- Surprise: a fun moment with his picture right now ----------
  // Takes turns: (1) fractal zoom: the picture zooms in forever, copies of it nested inside itself, then zooms
  // back out to just his picture; (2) bloom: the picture's slices open outward like the petals of a flower and
  // fold back. An empty picture borrows a gentle example pattern for the moment only (never kept or saved).
  // His drawing is never changed; touching the picture ends the moment at once and draws as usual.
  var moment = null, surpriseTurn = 0;
  function surprise() {
    if (!playing()) return;
    var kind = surpriseTurn % 2 === 0 ? "zoom" : "bloom";
    surpriseTurn++;
    moment = { kind: kind, t0: performance.now(), dur: kind === "zoom" ? (reduce ? 4200 : 9500) : (reduce ? 3600 : 6500), src: hasInk ? null : examplePic(), end: 0 };
    whooshSound();
    dirty = true;
  }
  // A touch (or the timer) ends the moment: it fades straight back to his picture.
  function finishMoment() { if (moment) { if (moment.src) { moment.src.width = 0; moment.src.height = 0; } moment = null; dirty = true; } }
  $("surpriseBtn").addEventListener("click", surprise);
  // A gentle rainbow flower in the picture's own symmetry, drawn on a canvas of its own.
  function examplePic() {
    var c = makeCanvas(artSide), g = c.getContext("2d"), n = state.count, k = artSide / (2 * A), cx = artSide / 2, i, j;
    g.lineCap = "round"; g.lineJoin = "round";
    for (i = 0; i < n; i++) {
      g.save(); g.translate(cx, cx); g.rotate(i * 2 * Math.PI / n);
      for (j = 0; j < 3; j++) {
        var rr = (0.25 + j * 0.24) * k, w = (0.1 + j * 0.05) * k;
        g.strokeStyle = "hsl(" + Math.round((j * 70 + i * 360 / n) % 360) + ",90%,58%)";
        g.lineWidth = (10 - j * 2) * sizeScale() * k / R * 1.0;
        g.beginPath(); g.moveTo(0, -0.06 * k); g.quadraticCurveTo(w, -rr * 0.6, 0, -rr); g.quadraticCurveTo(-w, -rr * 0.6, 0, -0.06 * k); g.stroke();
      }
      g.fillStyle = "hsl(" + Math.round(i * 360 / n) + ",90%,62%)";
      g.beginPath(); g.arc(0, -0.86 * k, 0.05 * k, 0, 2 * Math.PI); g.fill();
      g.restore();
    }
    return c;
  }
  function drawMoment(now) {
    var m = moment, src = m.src || art, u = (now - m.t0) / m.dur;
    if (u >= 1) { finishMoment(); vctx.drawImage(art, -A, -A, 2 * A, 2 * A); return; }
    var bg = state.dark ? BG.dark : BG.light;
    // An example pattern fades in and out (it is only borrowed for the moment).
    var fadeEx = m.src ? Math.min(1, u * 8, (1 - u) * 8) : 1, base = vctx.globalAlpha;
    if (m.kind === "zoom") {
      // tau: how many levels we have zoomed in. In for most of the time, then gently back out.
      var levels = reduce ? 1 : 3, ui = 0.62, tau;
      if (u < ui) { var a = u / ui; tau = levels * a * a * (3 - 2 * a); }
      else { var b = (u - ui) / (1 - ui); tau = levels * (1 - b * b * (3 - 2 * b)); }
      var f = 0.34, kmin = Math.floor(tau) - 2, kmax = Math.floor(tau) + 7, k2;
      for (k2 = kmin; k2 <= kmax; k2++) {
        var sc = Math.pow(f, k2 - tau);
        if (sc > 3.2 * A || sc < 0.004) continue;
        vctx.save();
        vctx.scale(sc, sc);
        vctx.rotate(reduce ? 0 : (k2 - tau) * 0.35);
        if (k2 > kmin && sc < 2.6 * A) {
          // Each copy sits in its own round window, framed by a thin rainbow ring.
          vctx.beginPath(); vctx.arc(0, 0, 1, 0, 2 * Math.PI);
          vctx.fillStyle = bg; vctx.globalAlpha = base; vctx.fill();
          vctx.save(); vctx.clip();
          vctx.globalAlpha = base * fadeEx;
          vctx.drawImage(src, -A, -A, 2 * A, 2 * A);
          vctx.restore();
          vctx.globalAlpha = base * 0.85;
          vctx.lineWidth = 5 / R / sc;
          for (var q = 0; q < 6; q++) {
            vctx.strokeStyle = "hsl(" + Math.round(q * 60 + now / 30) % 360 + ",90%,60%)";
            vctx.beginPath(); vctx.arc(0, 0, 1, q * Math.PI / 3, (q + 1) * Math.PI / 3); vctx.stroke();
          }
        } else {
          vctx.globalAlpha = base * fadeEx;
          vctx.drawImage(src, -A, -A, 2 * A, 2 * A);
        }
        vctx.restore();
      }
      vctx.globalAlpha = base;
      return;
    }
    // Bloom: every slice of the pattern moves out from the middle and tilts open like a petal, then folds back.
    var n = state.mirror ? state.count * 2 : state.count, open = Math.sin(Math.PI * Math.min(1, u)), i;
    open = open * open * (3 - 2 * open);
    var d = (reduce ? 0.08 : 0.22) * open, tilt = (reduce ? 0.05 : 0.22) * open, grow = 1 + 0.12 * open;
    if (n < 2) n = 2;
    // A glowing heart of the flower shows in the gap.
    if (d > 0.01) {
      var gl = vctx.createRadialGradient(0, 0, 0, 0, 0, d * 2.2 + 0.05);
      gl.addColorStop(0, "rgba(255,236,140," + (0.9 * open).toFixed(3) + ")"); gl.addColorStop(1, "rgba(255,236,140,0)");
      vctx.fillStyle = gl; vctx.beginPath(); vctx.arc(0, 0, d * 2.2 + 0.05, 0, 2 * Math.PI); vctx.fill();
    }
    vctx.globalAlpha = base * fadeEx;
    for (i = 0; i < n; i++) {
      var a0 = -Math.PI / 2 + i * 2 * Math.PI / n, a1 = a0 + 2 * Math.PI / n, mid = (a0 + a1) / 2;
      vctx.save();
      vctx.translate(Math.cos(mid) * d, Math.sin(mid) * d);
      vctx.rotate(tilt * (i % 2 ? -0.4 : 0.4));
      vctx.scale(grow, grow);
      vctx.beginPath(); vctx.moveTo(0, 0); vctx.arc(0, 0, A * 1.5, a0 - 0.002, a1 + 0.002); vctx.closePath();
      vctx.clip();
      vctx.drawImage(src, -A, -A, 2 * A, 2 * A);
      vctx.restore();
    }
    vctx.globalAlpha = base;
  }

  function showTab(name) {
    $("panel").setAttribute("data-tab", name);
    Array.prototype.forEach.call(document.querySelectorAll(".tab[data-tab]"), function (b) {
      b.setAttribute("aria-selected", String(b.dataset.tab === name));
    });
  }

  // ---------- Start ----------
  if (reduce && state.spin) state.spin = false;
  showTab("draw");
  resize();
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(view);
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });
  loadArt();
  renderControls();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { dirty = true; });
  // The old sound key said "on"/"off"; the shared module reads "1" for on.
  try { if (localStorage.getItem(OLD_SKEY) === "on") localStorage.setItem(OLD_SKEY, "1"); } catch (e) { /* ignore */ }
  // The shared grown-up layer: play timer, sound, Big. It may start the ending right away
  // (a timer that ran out while away), so the picture is set up first.
  Toybox.init({
    app: "kaleidoscope",
    big: { button: $("bigToggle") },
    timerIntro: "When time is up, the spinning slows, the picture fades, and the controls lock.",
    goodbyeOption: "End with a Goodbye spin button to press",
    farewellText: "Time to say goodbye",
    goodbyeLabel: "Goodbye spin",
    farewellDone: "Bye bye!",
    restLine: "The kaleidoscope is resting.",
    restLine2: "It will be right here next time.",
    restArt: drawRestArt,
    soundNote: "Soft tones that go higher as a finger moves away from the middle. Hold for 2 seconds.",
    legacy: { timer: OLD_TKEY, sound: OLD_SKEY, big: OLD_BKEY },
    onEnding: onEnding,
    onGoodbye: goodbyeSpin,
    onRest: function () { endingDone = null; spinVel = 0; },
    onWake: function () { endingDone = null; dirty = true; },
    onBig: function () { if (W) resize(); },
    onSound: function (on) { if (on) whooshSound(); },
    onTimer: function (info) { timerInfo = info; drawTimer(); }
  });
  $("stage").appendChild($("tb-toast"));
  $("stage").appendChild($("tb-farewell"));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
