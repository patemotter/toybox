<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D Printer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CDE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="3D Printer">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/toybox.css">
<script src="../common/toybox.js"></script>
<style>
:root {
  --bg: #CDE9FF;
  --panel: #FFFFFF;
  --ink: #1D2340;
  --muted: #4A5578;
  --edge: #1D2340;
  --accent: #FFC93C;
  --plate: #F4FAFF;
  --focus: #2D5BD7;
  --go: #2E9E5B;
  --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* ---------- Standard app shell (common/toybox.css): header, stage, panel ---------- */
/* ---------- Stage ---------- */
/* The printer picture, with what it is doing in a strip under it. */
.stage { background: var(--plate); padding: 6px; }
.stage-inner { height: 100%; display: flex; flex-direction: column; gap: 6px; }
.scene {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  border: 3px solid #1D2340;
  border-radius: 18px;
  overflow: hidden;
  background: #E3EEF9;
  touch-action: none;
  cursor: pointer;
}
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
/* What the printer is doing, in the row under the picture (not over the printer's own screen). */
.stat.phase { display: grid; place-items: center; padding: 2px 8px; font-size: clamp(1rem, 3.4vw, 1.45rem); font-weight: 800; line-height: 1.1; white-space: nowrap; text-overflow: ellipsis; }
.stat.phase.hot { background: var(--accent); color: #1D2340; }
.stats { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 6px; }
.stat.progress { display: grid; align-items: center; padding: 2px 12px; }
.pbar { display: block; height: 16px; border: 3px solid #1D2340; border-radius: 999px; background: #FFFFFF; overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--go); }
.stat { background: var(--panel); border: 3px solid var(--edge); border-radius: 14px; text-align: center; padding: 1px 2px 3px; line-height: 1.05; min-width: 0; overflow: hidden; }
.stat b { display: block; font-size: clamp(0.95rem, 3.6vw, 1.7rem); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat small { display: block; font-size: clamp(0.6rem, 2vw, 0.85rem); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
/* Go row: the green Print! button, with Faster next to it. */
.printbar { flex: none; display: flex; gap: 8px; justify-content: center; align-items: stretch; }
.printbar .btn.tb-go.print { font-size: clamp(1.35rem, 6vw, 1.9rem); }
.print {
  flex: 1 1 auto;
  max-width: 520px;
  min-height: 60px;
  font-size: clamp(1.35rem, 6vw, 1.9rem);
  font-weight: 800;
  line-height: 1;
  white-space: nowrap;
  color: #FFFFFF;
  background: var(--go);
  border-color: #1D2340;
  box-shadow: 4px 4px 0 #1D2340;
  text-shadow: 2px 2px 0 #1D2340;
}
.print:active { box-shadow: 0 0 0 #1D2340; }
.btn.tb-go.print.skip { background: var(--accent); color: #1D2340; text-shadow: none; }
.toggle { flex: 0 0 auto; min-width: 88px; font-size: 1.05rem; padding: 0.2rem 0.6rem; }
@media (prefers-reduced-motion: no-preference) {
  .print:not(.skip):not(:disabled) { animation: throb 1.6s ease-in-out infinite; }
  .print:active { animation: none; }
}
@keyframes throb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

.fuel { position: absolute; top: 8px; left: 8px; display: flex; align-items: center; gap: 6px; pointer-events: none; z-index: 2; }
.fuel[hidden] { display: none; }
.fuel-bar { width: clamp(70px, 22vw, 170px); height: 18px; background: rgba(255, 255, 255, 0.8); border: 3px solid #1D2340; border-radius: 999px; overflow: hidden; }
.fuel-bar span { display: block; height: 100%; width: 100%; background: #2E9E5B; transition: width 0.4s linear; }
.fuel-num { min-width: 40px; height: 40px; display: grid; place-items: center; background: #FFFFFF; color: #1D2340; border: 3px solid #1D2340; border-radius: 50%; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.fuel-num[hidden] { display: none; }

/* Big mode: the panel goes away, the header stays (Big turns into Back). */

/* Spool color picker that pops up over the printer. */
.pop {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 4;
  background: #FFFFFF;
  color: #1D2340;
  border: 4px solid #1D2340;
  border-radius: 22px;
  box-shadow: 5px 5px 0 #1D2340;
  padding: 8px 10px 10px;
  width: min(94%, 560px);
  max-height: 94%;
  overflow: hidden;
  cursor: default;
}
.pop[hidden] { display: none; }
.pop h3 { margin: 0 0 6px; padding: 0 92px; text-align: center; font-size: clamp(1.1rem, 3.6vw, 1.5rem); font-weight: 800; line-height: 1.1; }
.pop .close { position: absolute; right: 8px; top: 6px; min-height: 40px; padding: 0 0.7rem; font-size: 1rem; color: #1D2340; background: #FFFFFF; border-color: #1D2340; box-shadow: 2px 2px 0 #1D2340; }
.pgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.pswatch {
  font: inherit;
  background: #F4FAFF;
  border: 3px solid #1D2340;
  border-radius: 14px;
  padding: 4px 2px 2px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: #1D2340;
  font-size: clamp(0.6rem, 2.2vw, 0.85rem);
  font-weight: 700;
  line-height: 1.05;
  min-width: 0;
}
.pswatch i { display: block; width: clamp(24px, 6vw, 42px); aspect-ratio: 1; border-radius: 50%; border: 3px solid #1D2340; }
.pswatch[aria-pressed="true"] { background: var(--accent); }
.pswatch span { max-width: 100%; text-align: center; line-height: 1; min-height: 2em; display: flex; align-items: center; justify-content: center; font-size: clamp(0.56rem, 2.3vw, 0.85rem); }

/* ---------- Panel ---------- */
.tb-panel .panel-body.tb-choices { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; overflow: hidden; }
.panel-body > [data-pane] { grid-area: 1 / 1; visibility: hidden; margin: 0; min-width: 0; }
.tb-panel[data-tab="models"] [data-pane="models"],
.tb-panel[data-tab="colors"] [data-pane="colors"],
.tb-panel[data-tab="prints"] [data-pane="prints"] { visibility: visible; }
.models { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.model { display: flex; flex-direction: column; align-items: center; padding: 3px 2px 2px; min-height: 0; font-size: clamp(0.72rem, 3.2vw, 1rem); line-height: 1.1; white-space: nowrap; min-width: 0; }
.model canvas { width: 52px; height: 52px; display: block; }
.mode2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mode2 .btn { min-height: 40px; padding: 0.1rem 0.3rem; font-size: clamp(0.8rem, 3.4vw, 1.05rem); display: flex; align-items: center; justify-content: center; gap: 6px; }
/* Each mode button shows the chosen model in that mode's colors, so switching shows its effect at once. */
.mode2 .mpic { width: 2.6em; height: 2.6em; flex: none; }
/* Many colors: every spool the model uses gets a dashed ring. */
.slot.used { outline: 3px dashed #1D2340; outline-offset: -7px; }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.slot { display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 40px; padding: 2px 3px; font-size: clamp(0.66rem, 2.8vw, 0.95rem); white-space: nowrap; overflow: hidden; min-width: 0; }
.slot b { font-size: 1.35em; font-weight: 800; }
.dot { display: inline-block; flex: none; width: 28px; height: 28px; border-radius: 50%; border: 3px solid #1D2340; }
.swatches { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.swatch { aspect-ratio: 1; width: 100%; border-radius: 50%; border: 3px solid var(--edge); cursor: pointer; padding: 0; box-shadow: 2px 2px 0 var(--edge); color: #1D2340; font: inherit; font-weight: 800; font-size: 1rem; }
.swatch[aria-pressed="true"] { outline: 5px solid var(--accent); outline-offset: 2px; }
.model .short { display: none; }
.prints { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
/* An empty shelf spot is a soft, solid, faintly tinted square (no dashed outline); a print fills it. */
.pslot { aspect-ratio: 1; border: 3px solid transparent; border-radius: 12px; display: grid; place-items: center; font: inherit; font-weight: 800; color: var(--muted); background: rgba(74, 85, 120, 0.08); padding: 0; min-width: 0; overflow: hidden; }
.pslot.full { border-style: solid; border-color: var(--edge); background: #F4FAFF; box-shadow: 2px 2px 0 var(--edge); cursor: pointer; }
.pslot canvas { width: 100%; height: 100%; display: block; }
.tb-tabs .tab[aria-selected="true"] { background: var(--accent); color: #1D2340; }

/* ---------- Timer (the sheet, toast, banner and rest screen come from common/toybox.css) ---------- */
body.ending .panel-body { pointer-events: none; opacity: 0.4; }
body.ending .printbar { visibility: hidden; }
.rest-art { width: min(62vw, 240px, 34vh); aspect-ratio: 4 / 5; border: 3px solid #1D2340; border-radius: 18px; }

/* ---------- Print viewer ---------- */
.viewer { position: fixed; inset: 0; z-index: 55; display: flex; align-items: center; justify-content: center; padding: max(12px, env(safe-area-inset-top, 0px)) 12px max(12px, env(safe-area-inset-bottom, 0px)); background: rgba(13, 20, 38, 0.6); }
.viewer[hidden] { display: none; }
.vcard { width: min(94vw, 760px); height: min(90vh, 820px); background: #F4FAFF; color: #1D2340; border: 4px solid var(--edge); border-radius: 28px; box-shadow: 6px 6px 0 var(--edge); display: flex; flex-direction: column; overflow: hidden; }
.vcard canvas { flex: 1 1 0; min-height: 0; width: 100%; touch-action: none; display: block; cursor: grab; }
.vbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 12px 12px; }
.vtitle { font-size: clamp(1.3rem, 4.4vw, 2.2rem); font-weight: 800; line-height: 1.1; }
.vsub { font-size: clamp(0.85rem, 2.6vw, 1.1rem); font-weight: 700; color: #4A5578; }
.vbar .btn { color: #1D2340; background: #FFFFFF; border-color: #1D2340; box-shadow: 3px 3px 0 #1D2340; }

/* Landscape: picture on the left, controls on the right. */
@media (orientation: landscape) {
  .tb-body .tb-panel { width: min(42%, 420px); }
  .tb-body .tb-panel .panel-body.tb-choices { align-content: center; }
}
/* Larger screens (tablets, desktop): bigger touch targets. */
@media (min-width: 744px) and (min-height: 640px) {
  .stage { padding: 10px; }
  .stage-inner { gap: 10px; }
  .tb-panel { gap: 12px; }
  .printbar .btn.tb-go.print { min-height: 76px; font-size: 2.2rem; }
  .toggle { min-width: 120px; font-size: 1.2rem; }
  .panel-body > [data-pane] { width: 100%; max-width: 560px; justify-self: center; }
  .models { gap: 10px; }
  .model { font-size: 1.05rem; padding: 6px 4px 4px; }
  .model canvas { width: 80px; height: 80px; }
  .mode2 .btn, .slot { min-height: 56px; font-size: 1.05rem; }
  .slots, .swatches { gap: 10px; margin-top: 12px; }
  .prints { gap: 10px; }
  .fuel { top: 12px; left: 12px; }
  .fuel-bar { height: 22px; }
  .fuel-num { min-width: 48px; height: 48px; font-size: 1.5rem; }
  .stat { border-radius: 16px; }
}
@media (min-width: 744px) and (min-height: 640px) and (orientation: landscape) {
  .tb-body .tb-panel { width: min(36%, 420px); }
  .models { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .model { font-size: 1.1rem; }
  .model canvas { width: 84px; height: 84px; }
  .swatches { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .prints { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .stat b { font-size: 1.45rem; }
}
/* Short landscape phones: no title, tighter panel. */
@media (orientation: landscape) and (max-height: 520px) {
  .tb-panel { gap: 6px; }
  .tb-body .tb-panel .panel-body.tb-choices { align-content: start; }
  .printbar .btn.tb-go.print { min-height: 46px; font-size: 1.5rem; }
  .toggle { min-height: 46px; min-width: 70px; font-size: 0.9rem; }
  .stat b { font-size: 1rem; }
  .stat small { font-size: 0.6rem; }
  .model canvas { width: 40px; height: 40px; }
  .model { font-size: 0.75rem; }
  .slot, .mode2 .btn { font-size: 0.75rem; }
  .prints { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
/* ---------- Phones: short labels ---------- */
@media (max-width: 600px) and (orientation: portrait), (orientation: landscape) and (max-height: 520px) {
  .model { font-size: 0.9rem; }
  .model .long { display: none; }
  .model .short { display: inline; }
  .mode2 .btn { min-height: 44px; font-size: 1rem; }
  .slot { min-height: 44px; }
  /* Colors: one row of big swatches that slides sideways. */
  .swatches { display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; padding: 9px 9px 10px; margin-top: 0; touch-action: pan-x; }
  .swatches::-webkit-scrollbar { display: none; }
  .swatch { flex: 0 0 44px; width: 44px; height: 44px; }
  .pswatch span { display: none; }
  .pop h3 { padding: 6px 100px 4px 6px; text-align: left; white-space: nowrap; }
  .pswatch { padding: 6px 2px; }
  .pswatch i { width: 40px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .model canvas { width: 40px; height: 40px; }
  .model { font-size: 0.9rem; }
  .slot, .mode2 .btn { font-size: 0.95rem; }
}

/* Ghost hand: a see-through hand that shows the main move once (same look as Bulldozer and Measuring). */
</style>
</head>
<body>
<div class="tb-app-shell">
  <header class="tb-head">
    <a class="btn tb-iconbtn homebtn" href="../" aria-label="Back to Toybox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg></a>
    <h1 class="tb-title">3D Printer</h1>
  </header>

  <div class="tb-body">
    <main class="tb-stage stage" id="stage">
      <div class="stage-inner">
        <div class="scene" id="scene">
          <canvas id="cv" role="img" aria-label="A 3D printer with a filament box on top"></canvas>
          <div class="fuel" id="fuel" hidden><div class="fuel-bar"><span id="fuelFill"></span></div><span class="fuel-num" id="fuelNum" hidden></span></div>
          <div class="pop" id="pop" hidden>
            <h3 id="popTitle">Pick a color</h3>
            <button class="btn close" id="popClose">Close</button>
            <div class="pgrid" id="pgrid"></div>
          </div>
        </div>
        <div class="stats" id="stats">
          <div class="stat phase" id="phase">Ready</div>
          <div class="stat progress"><span class="pbar"><i id="sBar"></i></span></div>
        </div>
      </div>
    </main>

    <section class="tb-panel" data-tab="models">
      <div class="printbar">
        <button class="btn tb-go print" id="printBtn">Print!</button>
        <button class="btn toggle" id="fastBtn" aria-pressed="false">Faster</button>
      </div>
      <div class="tb-choices panel-body">
        <div data-pane="models" id="pane-models" role="tabpanel" aria-labelledby="tab-models">
          <div class="models" id="models"></div>
        </div>
        <div data-pane="colors" id="pane-colors" role="tabpanel" aria-labelledby="tab-colors">
          <div class="mode2">
            <button class="btn" id="oneBtn"><canvas class="mpic" aria-hidden="true"></canvas><span>One color</span></button>
            <button class="btn" id="manyBtn"><canvas class="mpic" aria-hidden="true"></canvas><span>Many colors</span></button>
          </div>
          <div class="slots" id="slots"></div>
          <div class="swatches" id="swatches"></div>
        </div>
        <div data-pane="prints" id="pane-prints" role="tabpanel" aria-labelledby="tab-prints">
          <div class="prints" id="prints"></div>
        </div>
      </div>
      <nav class="tb-tabs" role="tablist" aria-label="Controls">
        <button class="btn tab" role="tab" id="tab-models" data-tab="models" aria-controls="pane-models">Models</button>
        <button class="btn tab" role="tab" id="tab-colors" data-tab="colors" aria-controls="pane-colors">Colors</button>
        <button class="btn tab" role="tab" id="tab-prints" data-tab="prints" aria-controls="pane-prints">My prints</button>
        <button class="btn tb-surprise" id="surpriseBtn">Surprise</button>
      </nav>
    </section>
  </div>
</div>

<!-- Look at one print big, drag to turn it -->
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="vcard">
    <canvas id="vcv" aria-label="Your print. Drag to turn it."></canvas>
    <div class="vbar">
      <div><div class="vtitle" id="vTitle">Benchy</div><div class="vsub" id="vSub"></div></div>
      <button class="btn" id="vClose">Close</button>
    </div>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
